<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>푸른노무법인 정부사업신청</title>
<!-- ══════════════════════════════════════════════════════════════
     푸른노무법인 정부사업신청 (gov.html)
     대표 지시 2026-09-05 「공모신청으로 하지말고 별도 프로그램 … 정부사업신청 으로」

     ⚠★ 경력관리(kcareer.html)와 «다른 집»이다.
        여기 담기는 것은 «아직 안 한 일»(공고·기회)이고,
        경력관리에 담기는 것은 «이미 한 일»(실적)이다.
        섞으면 지원서에 안 한 일이 실적으로 들어간다 — 그래서 앱을 갈랐다.

     ⚠ 로그인은 포털·경력관리와 «같은 계정»이다(LOCAL 지속 → 한 번 로그인하면 공유).
     ⚠ 대표 전용이다. 경력관리와 같은 잣대(uid_roles 의 isAdmin, 또는 P-001·권형하).
     ══════════════════════════════════════════════════════════════ -->
<style>
:root{
  --navy:#1e293b; --teal:#166534; --red:#dc2626;
  --border:#e2e8f0; --text:#1e293b; --text-mute:#64748b;
  --bg:#f8fafc; --amber:#d97706; --blue:#2563eb; --card:#FFFFFF;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--text);font-size:14px}
#top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);
  border-bottom:1px solid var(--border);flex-wrap:wrap;position:sticky;top:0;z-index:20}
#top .ttl{font-size:16px;font-weight:700;color:var(--navy)}
#top .sub{font-size:11px;color:var(--text-mute)}
.sp{flex:1}
.btn{padding:6px 11px;border:1px solid var(--border);border-radius:7px;background:var(--card);
  color:var(--text);font-size:12.5px;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--navy);color:#FFFFFF;border-color:var(--navy)}
.btn.sm{padding:3px 8px;font-size:11.5px}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;white-space:nowrap}
.tag.navy{background:var(--bg);color:var(--navy);border:1px solid var(--border)}
.tag.teal{background:var(--bg);color:var(--teal);border:1px solid var(--teal)}
.tag.red{background:var(--bg);color:var(--red);border:1px solid var(--red)}
.tag.amber{background:var(--bg);color:var(--amber);border:1px solid var(--amber)}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
input,select{padding:6px 9px;border:1px solid var(--border);border-radius:7px;
  font-family:inherit;font-size:12.5px;background:var(--card);color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:8px 9px;font-weight:600;font-size:11.5px;color:var(--text-mute);
  border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--border);vertical-align:top}
.scroll{overflow-x:auto}
.kw{padding:3px 9px;border-radius:12px;border:1px solid var(--border);background:var(--card);
  color:var(--text-mute);font-size:11.5px;cursor:pointer;font-family:inherit}
.kw.on{background:var(--navy);color:#FFFFFF;border-color:var(--navy)}
.note{font-size:12.5px;line-height:1.8;color:var(--text-mute)}
.empty{padding:34px 12px;text-align:center;color:var(--text-mute);font-size:13px}
#lock{position:fixed;inset:0;z-index:9999;background:var(--bg);display:none;
  align-items:center;justify-content:center;padding:20px}
#lock .box{max-width:420px;text-align:center}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(18px);
  background:var(--navy);color:#FFFFFF;padding:9px 16px;border-radius:8px;font-size:13px;
  opacity:0;pointer-events:none;transition:.2s;z-index:9998}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="top">
  <div>
    <div class="ttl">정부사업신청</div>
    <div class="sub">푸른노무법인 · 공고 모아보기</div>
  </div>
  <div class="sp"></div>
  <span id="who" class="sub"></span>
  <button class="btn" onclick="openKeys()">🔑 인증키</button>
  <button class="btn" id="outBtn" onclick="doLogout()" style="display:none">로그아웃</button>
</div>

<div class="wrap">
  <div class="card">
    <div class="bar">
      <input id="q" placeholder="공고명·기관 검색" style="min-width:190px" oninput="draw()">
      <select id="fSrc" onchange="draw()"><option value="">전체 출처</option>
        <option>나라장터</option><option>알리오</option><option>기업마당</option></select>
      <select id="fSt" onchange="draw()"><option value="">전체 상태</option>
        <option>새 공고</option><option>관심</option><option>지원함</option><option>지나감</option></select>
      <div class="sp"></div>
      <span id="cnt" class="sub"></span>
      <button class="btn" onclick="fetchAll()">🔄 새로 받기</button>
      <button class="btn" onclick="expCsv()">📤 CSV</button>
    </div>
    <div class="bar" id="kwBox"></div>
    <div id="note" style="font-size:12.5px;margin-bottom:9px"></div>
    <div class="scroll"><table>
      <thead><tr><th>출처</th><th>상태</th><th>공고명</th><th>기관</th><th>마감</th>
        <th style="text-align:right">남음</th><th style="text-align:right">추정가격</th><th>관리</th></tr></thead>
      <tbody id="tb"></tbody>
    </table></div>
  </div>
</div>

<div id="lock"><div class="box">
  <div style="font-size:17px;font-weight:700;margin-bottom:10px">대표 전용 화면입니다</div>
  <div class="note" id="lockWho"></div>
</div></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<!-- 포털에 타일을 걸면 갖춰야 하는 것들 — 어느 앱도 «섬»이 되면 안 된다.
     ⚠ pu-appbar 를 빼면 오른쪽 「즐겨찾기」 손잡이가 아예 안 뜬다.
     ⚠ pu-back 은 «싣기만» 하면 없는 것과 같다 — 아래에서 guard 로 «등록»해야 한다. -->
<script src="js/pu-appbar.js?v=10"></script>
<script src="js/pu-back.js?v=2"></script>
<script>try{ PuBack.guard(function(){ return PuBack.closeTopVisible(); }); }catch(e){}</script>
<script src="js/gov-g2b.js?v=3"></script>
<script src="js/gov-alio.js?v=1"></script>
<script src="js/gov-bizinfo.js?v=1"></script>
<script>
/* ⚠ 경력관리와 «같은 파이어베이스 집»이다. 설정값은 공개용 웹 키다(규칙이 지킨다). */
var FB_CONFIG={apiKey:'AIzaSyDkZz5QlKSoqMOYByp5YGeMNLNDrIghliA',authDomain:'pureun-erp.firebaseapp.com',databaseURL:'https://pureun-erp-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'pureun-erp',appId:'1:936817166182:web:9bd31f70d0afdf5fca2aa7',messagingSenderId:'936817166182'};
var NS='gov3_', fbDb=null, fbUid=null;
var OWNER_SID='P-001', OWNER_NAME='권형하';

function $(id){ return document.getElementById(id); }
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('on'); },2600); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function get(k){ try{ return JSON.parse(localStorage.getItem(NS+k)||'[]'); }catch(e){ return []; } }
function set(k,v){ try{ localStorage.setItem(NS+k, JSON.stringify(v)); }catch(e){} cloudPush(); }
function lsGet(k){ try{ return localStorage.getItem(NS+k)||''; }catch(e){ return ''; } }
function lsSet(k,v){ try{ localStorage.setItem(NS+k,v); }catch(e){} }

/* ═══ 인증키 ═══
   ⚠ 열쇠가 둘이다 — 공공데이터포털(나라장터+알리오 겸용)과 기업마당(따로, crtfcKey).
   ⚠ 이 기기와 «대표 개인» 클라우드 자리에만 둔다. 포털 공용 설정은 직원이 모두 읽는다. */
function keyData(){ return lsGet('key_data'); }
function keyBiz(){ return lsGet('key_biz'); }
function openKeys(){
  var a=prompt('공공데이터포털 인증키 (나라장터·알리오 겸용)\n\n⚠ 「일반 인증키(Decoding)」를 넣으세요.\n\n발급: data.go.kr → 로그인 → 활용신청', keyData());
  if(a!==null) lsSet('key_data', a.trim());
  var b=prompt('기업마당 인증키 (crtfcKey — 따로 발급)\n\n발급: bizinfo.go.kr → 정책정보 개방', keyBiz());
  if(b!==null) lsSet('key_biz', b.trim());
  if(a!==null||b!==null){ lsSet('last',''); cloudPush(); readyNote(); toast('인증키를 저장했습니다 — 🔄 새로 받기를 눌러 보세요'); }
}

/* ═══ 찾는 말 ═══
   ⚠ 「교육」은 뺐다(대표 지시 2026-09-06). 되살리지 말 것 —
     클린아이 410건 실측에서 걸린 9건이 전부 「평생교육진흥원 직원 채용」 오탐이었다. */
function kws(){
  try{ var a=JSON.parse(lsGet('kw')||'null'); if(Array.isArray(a)&&a.length) return a; }catch(e){}
  return GovG2b.KEYWORDS_DEFAULT;
}
function drawKw(){
  var cur=kws(), all=GovG2b.KEYWORDS_DEFAULT.slice();
  cur.forEach(function(k){ if(all.indexOf(k)<0) all.push(k); });
  $('kwBox').innerHTML='<span class="sub" style="margin-right:2px">찾는 말</span>'
    + all.map(function(k){ return '<button class="kw'+(cur.indexOf(k)>=0?' on':'')+
        '" onclick="kwTog(\''+esc(k)+'\')">'+(cur.indexOf(k)>=0?'':'+ ')+esc(k)+'</button>'; }).join('')
    + '<button class="kw" onclick="kwAdd()">＋ 낱말</button>';
}
function kwTog(k){ var r=GovG2b.toggleKw(kws(),k);
  if(!r.ok){ toast(r.err); return; }
  lsSet('kw',JSON.stringify(r.list)); drawKw();
  toast('찾는 말이 바뀌었습니다 — 🔄 새로 받기를 누르면 새 기준으로 걸립니다'); }
function kwAdd(){ var k=prompt('더할 낱말 (예: 조직진단)'); if(!k) return;
  var r=GovG2b.toggleKw(kws(),k.trim()); if(!r.ok){ toast(r.err); return; }
  lsSet('kw',JSON.stringify(r.list)); drawKw(); }

/* ═══ 받아오기 ═══
   ⚠ 하루 1,000회 제한이 있다(공공데이터포털). 화면 열 때마다 부르지 않는다 —
     하루 한 번 저절로, 나머지는 손으로 「새로 받기」. */
function note(h,c){ $('note').innerHTML='<span style="color:'+(c||'var(--text-mute)')+'">'+h+'</span>'; }
function readyNote(){
  var a=keyData(), b=keyBiz();
  if(a||b){ if(!get('feed').length) note('아직 받은 공고가 없습니다 — <b>🔄 새로 받기</b>를 눌러 주세요'); else note(''); return; }
  note('🔑 <b>인증키가 아직 없습니다.</b> 준비는 다 돼 있고 열쇠만 꽂으면 됩니다.<br>'
    +'① <a href="https://www.data.go.kr/data/15129394/openapi.do" target="_blank" rel="noopener">공공데이터포털</a> 로그인 → <b>활용신청</b> (나라장터·알리오 겸용)<br>'
    +'&nbsp;&nbsp;&nbsp;⚠ 열쇠를 두 벌 줍니다 — <b>일반 인증키(Decoding)</b> 쪽을 넣으세요<br>'
    +'② <a href="https://www.bizinfo.go.kr/apiDetail.do?id=bizinfoApi" target="_blank" rel="noopener">기업마당</a> 에서 따로 하나 더<br>'
    +'③ 위 <b>🔑 인증키</b>를 눌러 넣고 → <b>🔄 새로 받기</b>');
}
function nextId(buf){ var n=1, mk=function(){ return 'G'+String(n).padStart(4,'0'); };
  while(buf.some(function(x){ return x.id===mk(); })) n++; return mk(); }

async function pull(url){
  var c=new AbortController(), t=setTimeout(function(){ c.abort(); },20000);
  try{ var r=await fetch(url,{signal:c.signal}); return await r.json(); }
  finally{ clearTimeout(t); }
}
async function fetchAll(){
  var kd=keyData(), kb=keyBiz();
  if(!kd && !kb){ readyNote(); toast('인증키를 먼저 넣어 주세요'); return; }
  note('⏳ 받는 중…');
  var today=new Date().toISOString().slice(0,10);
  var buf=get('feed'), got=[], errs=[];
  var to=new Date(), from=new Date(Date.now()-7*86400000);
  if(kd){
    try{ var o=GovG2b.parse(await pull(GovG2b.buildUrl({key:kd,from:from,to:to,page:1,rows:999})));
      if(o.ok) got=got.concat(o.rows); else errs.push('나라장터: '+o.err); }
    catch(e){ errs.push('나라장터: 받지 못했습니다'); }
    try{ var a=GovAlio.parse(await pull(GovAlio.buildUrl({key:kd,page:1,rows:100,ongoingOnly:true})));
      if(a.ok) got=got.concat(a.rows); else errs.push('알리오: '+a.err); }
    catch(e){ errs.push('알리오: 받지 못했습니다'); }
  }
  if(kb){
    for(var i=0;i<GovBizinfo.FIELDS_DEFAULT.length;i++){
      try{ var b=GovBizinfo.parse(await pull(GovBizinfo.buildUrl({key:kb,
             field:GovBizinfo.FIELDS_DEFAULT[i], regions:GovBizinfo.REGIONS_DEFAULT, count:200})));
        if(b.ok) got=got.concat(b.rows); else { errs.push('기업마당: '+b.err); break; } }
      catch(e){ errs.push('기업마당: 받지 못했습니다'); break; }
    }
  }
  var m=GovG2b.merge(buf, got, kws(), today);
  m.adds.forEach(function(r){ r.id=nextId(buf); r.savedAt=new Date().toISOString(); buf.unshift(r); });
  if(m.adds.length) set('feed',buf);
  ageOut(); lsSet('last',today); draw();
  note('받은 공고 '+got.length+'건 중 <b>'+m.adds.length+'건</b>이 새로 걸렸습니다 '
    +'<span class="sub">(이미 있어 건너뜀 '+m.skipped+' · 낱말에 안 걸림 '+m.unmatched+')</span>'
    +(errs.length?'<br><span style="color:var(--red)">'+esc(errs.join(' · '))+'</span>':''),
    errs.length?'var(--text-mute)':'');
}
/* 마감이 지난 것은 「지나감」으로 — ⚠ 손으로 관심을 켠 것은 건드리지 않는다 */
function ageOut(){
  var a=get('feed'), n=0, today=new Date().toISOString().slice(0,10);
  a.forEach(function(r){ if(!r||r.type==='관심'||r.type==='지원함'||r.type==='지나감') return;
    var d=GovG2b.dday(r.closeDt,today); if(d!=null&&d<0){ r.type='지나감'; n++; } });
  if(n) set('feed',a); return n;
}
function auto(){ if(!keyData()&&!keyBiz()) return;
  if(lsGet('last')===new Date().toISOString().slice(0,10)){ ageOut(); return; }
  fetchAll(); }

/* ═══ 목록 ═══ */
function dchip(r){ var d=(typeof r.dday==='number')?r.dday:GovG2b.dday(r.closeDt);
  if(d==null) return '<span class="sub">-</span>';
  if(d<0) return '<span class="tag">지남</span>';
  return '<span class="tag '+(d<=7?'red':'teal')+'">D-'+Math.round(d)+'</span>'; }
function draw(){
  var q=($('q').value||'').toLowerCase(), fs=$('fSrc').value, ft=$('fSt').value;
  var all=get('feed').filter(function(r){ return r && !r.hidden; });
  var rows=all.filter(function(r){
    if(fs && r.src!==fs) return false;
    if(ft && r.type!==ft) return false;
    if(q && [r.nm,r.org,r.ntce,r.kw].join(' ').toLowerCase().indexOf(q)<0) return false;
    return true; });
  $('cnt').textContent='전체 '+all.length+'건'+(rows.length!==all.length?' · 지금 '+rows.length+'건':'');
  $('tb').innerHTML = rows.length ? rows.map(function(r){
    return '<tr><td><span class="tag navy">'+esc(r.src||'-')+'</span></td>'
      +'<td><span class="tag '+(r.type==='관심'?'teal':(r.type==='지나감'?'':'navy'))+'">'+esc(r.type||'-')+'</span></td>'
      +'<td><b>'+esc(r.nm||'-')+'</b><div class="sub">'+esc(r.no||'')+(r.kw?' · '+esc(r.kw):'')+'</div></td>'
      +'<td>'+esc(r.org||'-')+'</td>'
      +'<td style="white-space:nowrap">'+esc((r.closeDt||'-').slice(0,16))+'</td>'
      +'<td style="text-align:right">'+dchip(r)+'</td>'
      +'<td style="text-align:right;white-space:nowrap">'+(r.prc?Math.round(r.prc/10000).toLocaleString()+'만원':'-')+'</td>'
      +'<td style="white-space:nowrap">'
        +'<button class="btn sm" onclick="star(\''+esc(r.id)+'\')">'+(r.type==='관심'?'★':'☆')+'</button> '
        +(r.url?'<button class="btn sm" onclick="open2(\''+esc(r.id)+'\')">🔗</button> ':'')
        +'<button class="btn sm" onclick="hide(\''+esc(r.id)+'\')">🚫</button></td></tr>';
  }).join('') : '<tr><td colspan="8" class="empty">'+(all.length?'걸리는 공고가 없습니다 — 조건을 넓혀 보세요':'아직 받은 공고가 없습니다')+'</td></tr>';
}
function find(id){ var a=get('feed'); for(var i=0;i<a.length;i++) if(a[i].id===id) return {a:a,i:i}; return null; }
function star(id){ var h=find(id); if(!h) return;
  h.a[h.i].type=(h.a[h.i].type==='관심')?'새 공고':'관심'; set('feed',h.a); draw(); }
function hide(id){ var h=find(id); if(!h) return;
  h.a[h.i].hidden=true; set('feed',h.a); draw(); toast('숨겼습니다 — CSV 에도 안 나갑니다'); }
function open2(id){ var h=find(id); if(h&&h.a[h.i].url) window.open(h.a[h.i].url,'_blank','noopener'); }
function expCsv(){
  var rows=get('feed').filter(function(r){ return r&&!r.hidden; });
  if(!rows.length){ toast('내보낼 것이 없습니다'); return; }
  var keys=['src','type','no','nm','org','openDt','closeDt','prc','mthd','kw','url'];
  var csv=[keys.join(',')].concat(rows.map(function(r){
    return keys.map(function(k){ return '"'+String(r[k]==null?'':r[k]).replace(/"/g,'""')+'"'; }).join(','); })).join('\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));
  a.download='정부사업신청_공고.csv'; a.click();
}

/* ═══ 로그인·잠금 ═══
   ⚠ 「모르면 잠근다」(fail-closed). 경력관리와 같은 잣대다.
   ⚠ 확인 중에는 잠그지 않는다 — 깜빡임을 만든다. */
async function whoAmI(u){
  if(!u) return {ok:false, why:'로그인이 필요합니다'};
  try{
    var s=await fbDb.ref('uid_roles/'+u.uid).once('value'); var v=s.val()||{};
    if(v.isAdmin===true) return {ok:true};
  }catch(e){}
  try{
    var d=await fbDb.ref('data/user_dir').once('value'); var raw=d.val();
    var arr=(raw&&Object.prototype.hasOwnProperty.call(raw,'v'))?raw.v:raw;  /* ⚠ pu-erp 봉투 */
    var list=Array.isArray(arr)?arr:(arr?Object.keys(arr).map(function(k){return arr[k];}):[]);
    var me=list.find(function(x){ return x && (x.sid===OWNER_SID || x.name===OWNER_NAME); });
    if(me && (u.email||'').indexOf(String(me.sid).toLowerCase())>=0) return {ok:true};
  }catch(e){}
  return {ok:false, why:'접속: '+(u.email||'-')+' · uid '+u.uid};
}
function applyLock(state, why){
  var el=$('lock');
  if(state==='checking'){ el.style.display='none'; return; }
  if(state==='ok'){ el.style.display='none'; return; }
  $('lockWho').innerHTML=esc(why||'')+'<div style="margin-top:12px">'
    +'<button class="btn primary" onclick="doLogin()">로그인</button></div>';
  el.style.display='flex';
}
function doLogin(){
  var em=prompt('이메일'); if(!em) return;
  var pw=prompt('비밀번호'); if(!pw) return;
  firebase.auth().signInWithEmailAndPassword(em.trim(),pw)
    .catch(function(e){ toast('로그인 실패 — '+(e&&e.message||'')); });
}
function doLogout(){ try{ firebase.auth().signOut(); }catch(e){} }

/* ═══ 개인 클라우드 보관 ═══
   ⚠ kcareer 자리를 건드리지 않는다. gov/{uid} 는 이 앱 것이다. */
var _pushT=null;
function cloudPush(){
  if(!fbDb||!fbUid) return;
  clearTimeout(_pushT);
  _pushT=setTimeout(function(){
    try{ fbDb.ref('gov/'+fbUid).set({ feed:get('feed'), kw:lsGet('kw'),
      key_data:keyData(), key_biz:keyBiz(), last:lsGet('last'), at:Date.now() }).catch(function(){}); }catch(e){}
  },1200);
}
async function cloudPull(){
  if(!fbDb||!fbUid) return;
  try{
    var s=await fbDb.ref('gov/'+fbUid).once('value'); var v=s.val(); if(!v) return;
    if(Array.isArray(v.feed) && !get('feed').length) set('feed', v.feed);
    if(v.kw && !lsGet('kw')) lsSet('kw', v.kw);
    if(v.key_data && !keyData()) lsSet('key_data', v.key_data);
    if(v.key_biz && !keyBiz()) lsSet('key_biz', v.key_biz);
    if(v.last && !lsGet('last')) lsSet('last', v.last);
  }catch(e){}
}

function boot(){
  drawKw(); draw(); readyNote(); applyLock('checking');
  if(location.protocol==='file:'){ applyLock('lock','file:// 로 열면 로그인할 수 없습니다 — 주소로 여세요'); return; }
  if(typeof firebase==='undefined'){ applyLock('lock','인터넷이 필요합니다'); return; }
  if(!firebase.apps||!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
  fbDb=firebase.database();
  try{ firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
  firebase.auth().onAuthStateChanged(async function(u){
    fbUid=u?u.uid:null;
    $('who').textContent=u?(u.email||''):'';
    $('outBtn').style.display=u?'':'none';
    var r=await whoAmI(u);
    if(!r.ok){ applyLock('lock', r.why); return; }
    applyLock('ok');
    await cloudPull(); drawKw(); draw(); readyNote(); auto();
  });
}
boot();
</script>
