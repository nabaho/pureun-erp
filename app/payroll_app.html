<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚠ 옛 시제품 · 급여 앱 골격</title>
<!--
  급여 아웃소싱 앱 골격 v0 (3단계 3-1)
  - 단일 HTML · 빌드 없음 (설계 스택). 개인정보 미포함(코드). 실데이터는 런타임 로드.
  - 핵심: dbGet/dbSet 추상화(로컬 → Firebase 교체점 1곳), 개발/운영 분리(환경 네임스페이스),
    권한 2단계 스텁(담당자/관리자), 화면 라우터. 첫 화면 = 설정 카드.
  - 나중에: dbGet/dbSet 내부만 Firebase RTDB로 교체하면 서버 연동(설계 D5·보안 반영).
-->
<style>
:root{--navy:#2E3A8C;--navy2:#1F2963;--violet:#7C6CE0;--ok:#2E7D4F;--warn:#B26A00;--bad:#C43D3D;
--ink:#23263B;--sub:#6B6F87;--line:#E3E5EF;--paper:#F5F6FA;--card:#FFF;}
*{box-sizing:border-box;margin:0}
body{font-family:'Malgun Gothic',sans-serif;background:var(--paper);color:var(--ink);font-size:14px}
/* 개발 환경 테스트 띠 (개발/운영 분리 — 실데이터 오염 방지) */
#devband{background:repeating-linear-gradient(45deg,#B26A00,#B26A00 12px,#8a5200 12px,#8a5200 24px);
  color:#fff;text-align:center;font-size:12px;font-weight:700;padding:3px}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 18px}
header .logo{font-weight:800;font-size:16px;letter-spacing:-.02em}
header .env{font-size:11px;background:#ffffff22;border:1px solid #ffffff55;border-radius:99px;padding:2px 9px}
header .who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
header select{border-radius:8px;border:none;padding:5px 8px;font-family:inherit}
.layout{display:flex;min-height:calc(100vh - 90px)}
nav{width:180px;background:#fff;border-right:1px solid var(--line);padding:14px 10px;flex-shrink:0}
nav button{display:block;width:100%;text-align:left;border:none;background:none;border-radius:10px;
  padding:10px 12px;font-size:13.5px;cursor:pointer;color:var(--ink);font-family:inherit;margin-bottom:2px}
nav button.on{background:var(--navy);color:#fff;font-weight:700}
nav button:hover:not(.on){background:var(--paper)}
main{flex:1;padding:22px 24px;overflow:auto}
h1{font-size:20px;letter-spacing:-.02em;margin-bottom:4px}
.sub{color:var(--sub);font-size:13px;margin-bottom:16px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:40px;text-align:center;color:var(--sub)}
.btn{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:9px 16px;cursor:pointer;font-size:13px;font-family:inherit}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.c{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.c .t{font-weight:700;color:var(--navy)}
.c .m{font-size:12px;color:var(--sub);margin:3px 0 8px}
.c .kv{font-size:12.5px;margin:3px 0}.c .kv b{color:var(--sub);font-weight:600;display:inline-block;width:64px}
.badge{font-size:11px;border-radius:99px;padding:2px 8px}
.badge.warn{background:#FBF1DE;color:var(--warn)}.badge.ok{background:#E8F3EC;color:var(--ok)}
.note{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.7}
.pill{display:inline-block;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:11px;margin:2px}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.dot.green{background:var(--ok)}.dot.orange{background:var(--warn)}.dot.red{background:var(--bad)}
</style>
</head>
<body>
<div id="devband">● 개발(DEV) 환경 — 테스트 데이터 · 실제 급여와 분리됨</div>
<header>
  <span class="logo">푸른노무법인 급여</span>
  <span class="env" id="envtag">DEV</span>
  <div class="who">
    <span id="whoami">담당자</span>
    <label style="font-size:11px">권한
      <select id="role" onchange="App.setRole(this.value)">
        <option value="staff">담당자</option>
        <option value="admin">관리자</option>
      </select>
    </label>
  </div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script>
// ====================================================================
//  저장소 추상화 (dbGet / dbSet)  ★ Firebase 교체점 — 이 두 함수 내부만 바꾸면 서버 연동
//  개발/운영 분리: 키를 환경(dev/prod)으로 네임스페이스 → 실데이터 오염 원천 차단
// ====================================================================
var ENV = (location.search.indexOf('env=prod') >= 0) ? 'prod' : 'dev';
function _k(key){ return 'pu:' + ENV + ':' + key; }
function dbGet(key, fallback){
  try{ var v = localStorage.getItem(_k(key)); return v==null ? fallback : JSON.parse(v); }
  catch(e){ return fallback; }
  // [Firebase 교체 시] return firebase.database().ref(clientScope()+'/'+key).once('value')...
}
function dbSet(key, value){
  localStorage.setItem(_k(key), JSON.stringify(value));
  // [Firebase 교체 시] firebase.database().ref(clientScope()+'/'+key).set(value)
}

// ====================================================================
//  앱 상태 + 권한 2단계 스텁 (나중에 구글 로그인으로 교체)
//  담당자 = 배정 사업장만 / 관리자 = 전체
// ====================================================================
var App = {
  role: 'staff',
  me: '주민정',           // 로그인 스텁: 담당자 이름 (실제=구글 계정)
  screen: 'cards',
  setRole: function(r){ this.role = r;
    document.getElementById('whoami').textContent = (r==='admin'?'관리자':'담당자'); this.render(); },
  go: function(s){ this.screen = s; this.render(); },
  // 담당자면 자기 배정 사업장만 보이게(서버 규칙과 동일 원칙 — 여기선 UI 필터)
  canSee: function(card){ return this.role==='admin' || (card.담당자 === this.me); },
  render: render
};

// 샘플 카드(더미 — 코드에 개인정보 없음). 실데이터는 '가져오기'로 런타임 로드.
var SAMPLE = [
  {사업장:'샘플상사', 담당자:'주민정', 규모:{직원레코드:42,월수:12}, 급여일:'말일', 산정기간:'1일~말일',
   고용보험:{단수처리:'절사',요율:'0.9%'}, 확인필요:[]},
  {사업장:'샘플식당', 담당자:'주민정', 규모:{직원레코드:8,월수:9}, 급여일:'5일', 산정기간:'26일~25일',
   고용보험:{단수처리:'반올림',요율:'0.9%'}, 확인필요:['급여일 확인','특수공제 등록']},
  {사업장:'샘플제조', 담당자:'박은비', 규모:{직원레코드:60,월수:24}, 급여일:'10일', 산정기간:'1일~말일',
   고용보험:{단수처리:'올림',요율:'0.9%'}, 확인필요:['동명이인 매칭']},
];

var NAV = [
  {id:'cards', label:'⚙️ 설정 카드'},
  {id:'inbox', label:'📥 수신함'},
  {id:'payroll', label:'💰 급여 처리'},
  {id:'review', label:'✅ 검토·확정', soon:true},
];

// 수신함 샘플(더미). 실제=메일 웹훅·업로드가 dbGet('inbox')에 채움.
// 상태: 정상 / 지연(D-7 지남) / 오류(자료 불완전) / 미도착
var INBOX_SAMPLE = [
  {id:'i1', 사업장:'샘플상사', 유형:'근태', 도착:'D-9', 상태:'정상'},
  {id:'i2', 사업장:'샘플식당', 유형:'급여자료', 도착:'—', 상태:'지연'},
  {id:'i3', 사업장:'샘플제조', 유형:'근태', 도착:'D-3', 상태:'오류'},
  {id:'i4', 사업장:'샘플카페', 유형:'—', 도착:'—', 상태:'미도착'},
];
// 급여 처리 샘플(더미). 실제=엔진 계산 결과가 dbGet('payroll')에 채움.
// 신호: green(이상없음) / orange(확인필요) / red(막힘: 최저임금 미달 등)
var PAYROLL_SAMPLE = [
  {사업장:'샘플상사', ym:'2026-06', 직원:42, 신호:'green', 이슈:'', 확정:false},
  {사업장:'샘플식당', ym:'2026-06', 직원:8,  신호:'orange', 이슈:'전월대비 급변 1명', 확정:false},
  {사업장:'샘플제조', ym:'2026-06', 직원:60, 신호:'red', 이슈:'최저임금 미달 2명 — 확정 차단', 확정:false},
];

function renderNav(){
  document.getElementById('nav').innerHTML = NAV.map(function(n){
    return '<button class="'+(App.screen===n.id?'on':'')+'" onclick="App.go(\''+n.id+'\')">'+
      n.label + (n.soon?' <span style="font-size:10px;color:#B26A00">(예정)</span>':'') + '</button>';
  }).join('');
}

function screenCards(){
  var cards = dbGet('site_cards', SAMPLE).filter(function(c){ return App.canSee(c); });
  var visible = cards.length, isSample = (dbGet('site_cards', null)===null);
  var html = '<h1>설정 카드</h1><div class="sub">'+
    (App.role==='admin' ? '전체 사업장' : '내 담당 사업장('+App.me+')') +
    ' · '+visible+'곳' + (isSample?' · <b style="color:#B26A00">샘플 데이터</b>':'') + '</div>';
  html += '<button class="btn sec" onclick="App.importCards()">확정 카드(JSON) 가져오기</button>';
  html += '<div class="cards">' + cards.map(function(c){
    var need = c.확인필요 && c.확인필요.length;
    return '<div class="c"><div style="display:flex;justify-content:space-between;align-items:center">'+
      '<span class="t">'+c.사업장+'</span>'+
      (need?'<span class="badge warn">확인필요 '+c.확인필요.length+'</span>':'<span class="badge ok">확인완료</span>')+'</div>'+
      '<div class="m">'+c.담당자+' · 직원 '+c.규모.직원레코드+'건</div>'+
      '<div class="kv"><b>급여일</b>'+c.급여일+'</div>'+
      '<div class="kv"><b>산정기간</b>'+c.산정기간+'</div>'+
      '<div class="kv"><b>고용보험</b>'+c.고용보험.단수처리+' / '+c.고용보험.요율+'</div>'+
      (need?'<div class="note">⚠ '+c.확인필요.join(', ')+'</div>':'')+
      '</div>';
  }).join('') + '</div>';
  html += '<div class="note" style="margin-top:18px">※ 담당자는 <b>배정 사업장 카드만</b> 보이고 수정 가능합니다(서버 보안규칙과 동일 원칙). 코드는 하나, 사업장 차이는 이 카드(데이터)에 담깁니다.</div>';
  return html;
}

// ── 수신함 (설계: 자동태깅 + 4상태 + D-7 독촉) ──
function screenInbox(){
  var items = dbGet('inbox', INBOX_SAMPLE).filter(function(x){
    return App.role==='admin' || App.mySites().indexOf(x.사업장)>=0 || true; });
  var isSample = (dbGet('inbox', null)===null);
  var cnt = {정상:0, 지연:0, 오류:0, 미도착:0};
  items.forEach(function(x){ cnt[x.상태]=(cnt[x.상태]||0)+1; });
  var sig = {정상:'green', 지연:'orange', 오류:'orange', 미도착:'red'};
  var act = {정상:'처리 진행', 지연:'독촉 보내기', 오류:'반려·재요청', 미도착:'담당자 개입'};
  var html = '<h1>수신함</h1><div class="sub">사업장이 보낸 자료를 자동 분류합니다'+
    (isSample?' · <b style="color:#B26A00">샘플</b>':'')+'</div>';
  // 3색 신호 요약
  html += '<div style="display:flex;gap:10px;margin-bottom:14px">'+
    sigBox('green','정상',cnt.정상)+sigBox('orange','확인필요',cnt.지연+cnt.오류)+sigBox('red','미도착',cnt.미도착)+'</div>';
  html += '<div style="background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden">';
  items.forEach(function(x){
    html += '<div style="display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)">'+
      '<span class="dot '+sig[x.상태]+'"></span>'+
      '<div style="flex:1"><b>'+x.사업장+'</b> <span class="pill">'+x.유형+'</span>'+
      '<div style="font-size:12px;color:var(--sub)">도착 '+x.도착+' · '+x.상태+'</div></div>'+
      '<button class="btn '+(x.상태==='정상'?'':'sec')+'" onclick="App.inboxAct(\''+x.id+'\',\''+x.상태+'\')">'+act[x.상태]+'</button>'+
      '</div>';
  });
  html += '</div><div class="note">※ D-7까지 안 오면 자동 독촉(다채널). 끝내 미도착이면 담당자 개입(전월값 가마감/수기) — 자료 없어도 급여는 나갑니다(법정 지급일).</div>';
  return html;
}

// ── 급여 처리 (설계: 3색 신호 + 확정은 사람 + 최저임금 미달 차단) ──
function screenPayroll(){
  var rows = dbGet('payroll', PAYROLL_SAMPLE);
  var isSample = (dbGet('payroll', null)===null);
  var html = '<h1>급여 처리</h1><div class="sub">계산 결과를 3색 신호로 확인 → 사람이 확정'+
    (isSample?' · <b style="color:#B26A00">샘플</b>':'')+'</div>';
  html += '<div style="background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden">';
  rows.forEach(function(r,i){
    var blocked = (r.신호==='red');
    html += '<div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)">'+
      '<span class="dot '+r.신호+'"></span>'+
      '<div style="flex:1"><b>'+r.사업장+'</b> <span style="font-size:12px;color:var(--sub)">'+r.ym+' · 직원 '+r.직원+'명</span>'+
      (r.이슈?'<div style="font-size:12px;color:'+(blocked?'var(--bad)':'var(--warn)')+'">'+r.이슈+'</div>':'')+'</div>'+
      (r.확정
        ? '<span class="badge ok">확정됨</span> <button class="btn sec" onclick="App.payrollUndo('+i+')">되돌리기</button>'
        : '<button class="btn'+(blocked?'':'')+'" '+(blocked?'style="background:#ccc;cursor:not-allowed" disabled title="최저임금 미달 등 해결 후 확정"':'onclick="App.payrollConfirm('+i+')"')+'>확정</button>')+
      '</div>';
  });
  html += '</div><div class="note">※ 초록=이상없음, 주황=확인 후 확정, 빨강=막힘(최저임금 미달 등 해결 전 확정 불가). 확정은 되돌리기 가능(마감 전).</div>';
  return html;
}

function sigBox(color,label,n){
  var bg={green:'#E8F3EC',orange:'#FBF1DE',red:'#FBE9E9'}[color];
  var fg={green:'#2E7D4F',orange:'#B26A00',red:'#C43D3D'}[color];
  return '<div style="flex:1;background:'+bg+';color:'+fg+';border-radius:12px;padding:12px 14px">'+
    '<div style="font-size:24px;font-weight:800">'+n+'</div><div style="font-size:12px;font-weight:600">'+label+'</div></div>';
}

function screenSoon(name){
  return '<h1>'+name+'</h1><div class="sub">3단계 다음 블록</div>'+
    '<div class="empty">이 화면은 골격만 준비됐습니다.<br>수신함/급여/검토는 인증·백엔드 연동 후 구현됩니다.<br><br>'+
    '<span class="pill">dbGet/dbSet 준비됨</span><span class="pill">권한 필터 준비됨</span><span class="pill">개발/운영 분리 적용됨</span></div>';
}

function render(){
  renderNav();
  document.getElementById('envtag').textContent = ENV.toUpperCase();
  document.getElementById('devband').style.display = (ENV==='dev') ? '' : 'none';
  var m = document.getElementById('main');
  if(App.screen==='cards') m.innerHTML = screenCards();
  else if(App.screen==='inbox') m.innerHTML = screenInbox();
  else if(App.screen==='payroll') m.innerHTML = screenPayroll();
  else m.innerHTML = screenSoon('검토·확정');
}

App.mySites = function(){ return dbGet('acl_'+this.me, []); };
App.inboxAct = function(id, state){
  var msg = {정상:'처리를 진행합니다.', 지연:'독촉을 다채널로 보냈습니다.',
    오류:'사업장에 반려·재요청했습니다.', 미도착:'담당자 개입: 전월값 가마감 또는 수기 입력.'}[state];
  alert(msg + ' (골격 데모)');
};
App.payrollConfirm = function(i){
  if(!confirm('이 사업장 급여를 확정할까요? (되돌리기 가능)')) return;
  var rows = dbGet('payroll', PAYROLL_SAMPLE); rows[i].확정 = true; dbSet('payroll', rows); render();
};
App.payrollUndo = function(i){
  var rows = dbGet('payroll', PAYROLL_SAMPLE); rows[i].확정 = false; dbSet('payroll', rows); render();
};
App.importCards = function(){
  var inp = document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange = function(e){
    var f = e.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var raw = JSON.parse(r.result);
        // 확정카드_확정.json 형태(객체) 또는 배열 모두 수용
        var arr = Array.isArray(raw) ? raw : Object.values(raw);
        dbSet('site_cards', arr);
        alert('카드 '+arr.length+'개를 불러왔습니다.');
        render();
      }catch(err){ alert('JSON을 읽을 수 없습니다: '+err.message); }
    };
    r.readAsText(f);
  };
  inp.click();
};

render();
</script>
</body>
</html>
