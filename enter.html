<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#1e3a8a">
<title>푸른노무법인 · 통합 포털</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#e2e8f0; --ink:#202124; --sub:#475569; --mute:#94a3b8;
  --card-bg:rgba(248,251,255,0.65); --card-border:rgba(255,255,255,0.75);
  --accent:#1e40af; --accent-end:#1e3a8a; --status:#16a34a;
  --wordmark-grad:linear-gradient(110deg,#1e40af 0%,#2563eb 60%,#7c6ce0 100%);
  --mesh:radial-gradient(ellipse 900px 700px at 14% 18%,rgba(140,180,255,0.55),transparent 55%),
         radial-gradient(ellipse 800px 700px at 88% 88%,rgba(150,220,200,0.42),transparent 55%),
         radial-gradient(ellipse 700px 600px at 86% 20%,rgba(180,160,255,0.42),transparent 55%),
         radial-gradient(ellipse 600px 500px at 16% 88%,rgba(255,180,200,0.30),transparent 55%);
}
*{box-sizing:border-box;margin:0;padding:0;}
/* 스크롤바 자리 항상 확보 — 포털(타일 많음)↔로그인 전환 시 뷰포트 폭 변화로 카드가 좌우로 튀고
   스크롤바가 깜빡이며 backdrop-filter가 반복 재합성돼 마우스가 멈추던 문제를 근본 차단 */
html{overflow-y:scroll;}
body{min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"Inter","Noto Sans KR",system-ui,-apple-system,sans-serif;
  letter-spacing:-0.005em;position:relative;overflow-x:hidden;}
.mesh{position:fixed;inset:0;pointer-events:none;background-image:var(--mesh);}
.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:32px 16px;}
/* 포털(앱 타일) 화면일 때만 상단 정렬 — 로그인 화면은 중앙 유지 */
body.portal-mode .wrap{justify-content:flex-start;padding-top:12vh;}
@media (max-width:520px){ body.portal-mode .wrap{padding-top:24px;} }

/* ---------- 로그인 화면 ---------- */
#loginView{display:flex;flex-direction:column;align-items:center;width:100%;max-width:520px;margin:0 auto;}
.eyebrow{width:100%;letter-spacing:.2em;font-size:1.15rem;color:var(--accent);font-weight:800;text-align:center;}
.hello{width:100%;font-family:"Noto Serif KR",serif;text-align:center;font-size:21px;line-height:1.2;
  margin:8px 0 6px;font-weight:500;letter-spacing:-0.02em;color:#1a2233;}
.hello .brand{background:var(--wordmark-grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;}
.hello-sub{text-align:center;font-size:.86rem;color:var(--sub);margin-bottom:28px;}
.card{width:420px;max-width:calc(100% - 48px);background:rgba(248,251,255,0.55);border:1px solid rgba(255,255,255,0.7);
  border-radius:26px;padding:30px 30px 28px;backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%);
  box-shadow:0 1px 0 rgba(255,255,255,0.95) inset,0 0 0 1px rgba(20,28,48,0.04),0 36px 80px -32px rgba(10,20,60,0.35),0 12px 36px -16px rgba(10,20,60,0.20);}
label{display:block;font-size:11.5px;color:var(--sub);font-weight:500;margin:12px 0 8px 4px;}
.inputwrap{position:relative;display:flex;align-items:center;}
.inputwrap .ico{position:absolute;left:16px;font-size:1rem;opacity:.55;pointer-events:none;}
input[type=text],input[type=password]{width:100%;border:1px solid rgba(20,28,48,0.08);
  background:rgba(255,255,255,0.80);border-radius:14px;padding:0 16px 0 46px;height:52px;
  font-size:15px;font-weight:500;color:var(--ink);font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s;
  box-shadow:0 1px 0 rgba(255,255,255,0.9) inset;}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,64,175,.12);background:#fff;}
.eye{position:absolute;right:12px;background:none;border:none;cursor:pointer;font-size:.95rem;opacity:.5;}
.row{display:flex;align-items:center;justify-content:space-between;margin:14px 4px 18px;font-size:13px;color:var(--sub);}
.ck{display:flex;gap:14px;align-items:center;}
.ck label{margin:0;display:flex;align-items:center;gap:5px;cursor:pointer;font-weight:500;}
.ck input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}
.btn{width:100%;border:none;cursor:pointer;background:linear-gradient(180deg,var(--accent),var(--accent-end));
  color:#fff;border-radius:15px;height:54px;font-size:15px;font-weight:600;font-family:inherit;letter-spacing:-0.005em;
  display:flex;align-items:center;justify-content:center;gap:12px;
  box-shadow:0 1px 0 rgba(255,255,255,0.18) inset,0 14px 28px -8px rgba(29,62,182,0.40),0 4px 10px -4px rgba(10,18,48,0.25);transition:transform .12s,box-shadow .12s,filter .12s;}
.btn:hover{filter:brightness(1.06);}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.err{color:#c0392b;font-size:.8rem;margin-top:12px;text-align:center;min-height:1em;font-weight:600;}
.branch{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:22px;font-size:12px;color:var(--mute);}
.pill{border:1px solid rgba(10,20,60,.14);background:rgba(255,255,255,.6);border-radius:99px;
  padding:4px 14px;cursor:pointer;transition:.15s;}
.pill.on{border-color:var(--accent);color:var(--accent);font-weight:700;background:#fff;}
.foot{margin-top:26px;font-size:.68rem;color:var(--mute);text-align:center;}

/* ---------- 포털 홈 ---------- */
.portal{display:none;width:100%;max-width:780px;}
.pbar{display:flex;align-items:center;gap:13px;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:18px;padding:14px 20px;backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(20,30,80,.08);}
/* 한 줄 고정 — 어떤 항목도 두 줄로 꺾이지 않게 */
.pbar .nm b,.pbar .nm small,.pbar .pmeta,.pbar .pmeta span,.pbar .logout{white-space:nowrap;}
.pbar #sgFab{order:4;}   /* 로그아웃(order:3)보다 오른쪽 끝 */
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#7c6ce0);
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;}
.pbar .nm b{font-size:.92rem;}
.pbar .nm small{display:block;font-size:.64rem;color:var(--mute);letter-spacing:.14em;margin-top:-1px;}
.pbar .pmeta{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:.8rem;color:var(--sub);}
.pbar .logout{order:3;}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7c6ce0);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;}
.logout{color:var(--accent);font-weight:700;cursor:pointer;background:none;border:none;font-size:.8rem;font-family:inherit;}
.sec{font-size:.82rem;font-weight:700;color:var(--sub);margin:24px 4px 12px;display:flex;align-items:center;gap:10px;}
/* 타일 순서 고정 토글 */
#tileLockBtn{display:inline-flex;align-items:center;gap:4px;border:1px solid rgba(10,20,60,.14);background:rgba(255,255,255,.6);
  color:var(--sub);border-radius:99px;padding:4px 12px;font-size:.68rem;font-weight:700;font-family:inherit;cursor:pointer;transition:.12s;}
#tileLockBtn:hover{border-color:var(--accent);color:var(--accent);}
#tileLockBtn.locked{background:#1e40af;border-color:#1e40af;color:#fff;}
#tileHint{font-size:.66rem;color:var(--mute);font-weight:500;}
.tile.dragging{opacity:.35;}
.tile:not(.lock)[draggable="true"]{cursor:grab;}
.tile:not(.lock)[draggable="true"]:active{cursor:grabbing;}
.tiles{display:flex;flex-wrap:wrap;gap:8px 4px;justify-content:flex-start;}
.tile{background:none;border:none;border-radius:14px;padding:14px 8px;width:96px;
  cursor:pointer;transition:.15s;text-decoration:none;color:inherit;
  display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;box-shadow:none;}
.tile:hover{background:rgba(30,64,175,.05);}
.tile:hover .ic{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,30,80,.16);border-color:var(--accent);}
.tile .ic{width:54px;height:54px;border-radius:50%;background:var(--card-bg);border:1px solid var(--card-border);
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin-bottom:9px;transition:.15s;backdrop-filter:blur(14px);}
.tile b{display:block;font-size:.8rem;font-weight:600;margin-bottom:1px;line-height:1.2;}
.tile span{font-size:.64rem;color:var(--mute);line-height:1.15;}
.tile .newtab{display:none;}
.tile.lock{opacity:.5;cursor:default;}
.tile.lock:hover{background:none;}
.tile.lock:hover .ic{transform:none;box-shadow:none;border-color:var(--card-border);}
/* ── 로그인 후 바로가기(홈 앱) — '업무 시스템' 줄 오른쪽 끝에 한 줄로 배치 ── */
.homebar{display:inline-flex;align-items:center;gap:7px;margin-left:auto;font-size:.76rem;font-weight:600;color:var(--sub);white-space:nowrap;}
.homebar select{font-family:inherit;font-size:.76rem;font-weight:700;color:var(--accent);background:rgba(255,255,255,.72);
  border:1px solid var(--card-border);border-radius:10px;padding:4px 10px;cursor:pointer;outline:none;}
.homebar .hb-hint{display:none;font-size:.68rem;font-weight:500;color:var(--mute);}
@media (max-width:640px){ .sec{flex-wrap:wrap;} .homebar{margin-left:0;} }
/* 이동 안내 배너 */
#homeBanner{position:fixed;left:0;right:0;top:0;z-index:60;display:flex;align-items:center;justify-content:center;gap:16px;
  background:linear-gradient(135deg,var(--accent),#2563eb);color:#fff;padding:13px 16px;font-size:.88rem;font-weight:600;
  box-shadow:0 6px 22px rgba(20,30,80,.28);}
#homeBanner b{font-weight:800;}
#homeBanner button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:99px;
  padding:6px 16px;font-size:.82rem;font-weight:700;font-family:inherit;cursor:pointer;transition:.12s;white-space:nowrap;}
#homeBanner button:hover{background:rgba(255,255,255,.32);}
@media(max-width:520px){
  #homeBanner{font-size:.82rem;padding:11px 12px;gap:10px;flex-wrap:wrap;text-align:center;}
  .homebar{font-size:.76rem;}
  .homebar .hb-hint{flex-basis:100%;}
}
@media(max-width:520px){
  .hello{font-size:16px;}
  /* 로그인 옵션 줄: 폭이 좁아 글자가 세로로 쪼개지던 문제 해소
     → 체크박스는 한 줄 유지(줄바꿈 금지), '비밀번호 변경' 링크는 아래 줄로 내림 */
  .row{flex-wrap:wrap;row-gap:10px;margin:12px 4px 16px;}
  .ck{gap:16px;}
  .ck label{white-space:nowrap;}
  #pwChangeLink{flex-basis:100%;text-align:right;}
  /* 헤더 2줄: 위=로고·이름·로그아웃 / 아래=상태·사용자 */
  .pbar{flex-wrap:wrap;gap:0 10px;padding:11px 13px;border-radius:14px;}
  .pbar .logo{width:30px;height:30px;border-radius:9px;font-size:.85rem;}
  .pbar .nm b{font-size:.84rem;}
  .pbar .nm small{font-size:.58rem;}
  .pbar .logout{order:0;margin-left:auto;font-size:.72rem;background:rgba(46,58,140,.08);padding:6px 13px;border-radius:8px;}
  .pbar .pmeta{order:1;flex-basis:100%;margin-left:0;margin-top:9px;padding-top:9px;border-top:1px solid rgba(10,20,60,.08);font-size:.72rem;}
  .pbar .pmeta .avatar{display:none;}          /* 폰에선 아바타 생략(공간 절약) */
  .pbar .pmeta #userName{margin-left:auto;font-weight:600;}
  .sec{margin:16px 4px 10px;font-size:.74rem;}
  /* 폰: 동그라미 4열 (앱 서랍 느낌) */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 2px;}
  .tile{width:auto;padding:10px 4px;}
  .tile .ic{width:46px;height:46px;font-size:1.2rem;margin-bottom:6px;}
  .tile b{font-size:.7rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .tile span{font-size:.56rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:100%;}
}

/* ---------- 상단 고정 바 (로고 배지 · 시계) ---------- */
.topfix{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:flex-start;
  justify-content:space-between;padding:18px 22px;pointer-events:none;}
.brandbadge{display:flex;align-items:center;gap:11px;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:16px;padding:10px 16px 10px 12px;backdrop-filter:blur(14px);box-shadow:0 8px 22px rgba(20,30,80,.08);}
.brandbadge .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#7c6ce0);
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;}
.brandbadge .bname{font-size:.85rem;font-weight:600;line-height:1.1;}
.brandbadge .bsub{font-size:.62rem;color:var(--mute);letter-spacing:.14em;margin-top:2px;display:block;line-height:1;}
.statusbadge{display:flex;align-items:center;gap:9px;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:99px;padding:8px 16px;backdrop-filter:blur(14px);box-shadow:0 8px 22px rgba(20,30,80,.08);
  font-size:.76rem;color:var(--sub);}
.statusbadge .dot{width:8px;height:8px;border-radius:50%;background:var(--status);box-shadow:0 0 0 3px rgba(22,163,74,.18);}
.statusbadge .clock{color:var(--mute);border-left:1px solid rgba(10,20,60,.14);padding-left:9px;}
@media(max-width:520px){ .topfix{display:none;} }
/* ── 프로그램 건의함 — 헤더 바(캡쳐2) 안 왼쪽, 브랜드 옆 동그란 눈에 띄는 버튼 ── */
#sgFab{position:relative;display:none;align-items:center;gap:6px;white-space:nowrap;background:linear-gradient(135deg,#f97316,#ef4444);color:#fff;border:none;padding:8px 16px;border-radius:999px;font-size:.8rem;font-weight:800;letter-spacing:-0.01em;cursor:pointer;box-shadow:0 5px 14px -3px rgba(239,68,68,.5),0 1px 3px rgba(0,0,0,.12);transition:transform .12s,filter .12s,box-shadow .12s;}
#sgFab:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 8px 18px -3px rgba(239,68,68,.55);}
#sgFab:active{transform:translateY(0) scale(.97);}
@media(max-width:520px){ #sgFab{padding:6px 12px;font-size:.72rem;} .pbar #sgFab{order:0;} }
/* 안내 말풍선: 포털 진입 시 5초간 표시 후 사라짐 */
.sg-tip{position:absolute;top:calc(100% + 10px);right:0;width:232px;background:#1e293b;color:#fff;
  font-size:.72rem;font-weight:600;line-height:1.55;text-align:left;letter-spacing:0;white-space:normal;
  padding:10px 13px;border-radius:10px;box-shadow:0 8px 22px rgba(15,23,42,.28);z-index:20;
  opacity:0;transform:translateY(-4px);transition:opacity .35s,transform .35s;pointer-events:none;}
.sg-tip::before{content:'';position:absolute;top:-5px;right:24px;width:10px;height:10px;background:#1e293b;transform:rotate(45deg);}
.sg-tip.on{opacity:1;transform:translateY(0);}
/* 버튼 숫자 배지: admin=미처리 건수 / 일반=내 미확인 해결 건수 */
.sg-fabbadge{position:absolute;top:-7px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#fff;color:#dc2626;border:1.5px solid #fca5a5;font-size:.62rem;font-weight:800;display:none;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.15);}
/* 관리자용 요약 줄 (총·미처리·사람별 건수) */
.sg-sum{background:#eff6ff;border:1px solid #dbeafe;border-radius:9px;padding:9px 12px;font-size:.74rem;color:#1e40af;font-weight:600;margin-bottom:10px;line-height:1.6;}
/* 해결 알림 팝업 (로그인 직후 자동) */
#sgDoneModal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:80;align-items:center;justify-content:center;padding:16px;}
#sgDoneModal .box{background:#fff;border-radius:16px;width:480px;max-width:100%;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(15,23,42,.35);}
#sgDoneModal .hd{padding:16px 18px 12px;font-size:1rem;font-weight:800;border-bottom:1px solid #eef2f7;}
#sgDoneModal .bd{padding:14px 18px;overflow-y:auto;}
#sgDoneModal .ft{padding:0 18px 16px;}
.sgd-item{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px 14px;margin-bottom:8px;}
.sgd-t{font-size:.86rem;font-weight:700;color:#14532d;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.sgd-r{font-size:.8rem;color:#334155;line-height:1.6;margin-top:7px;padding-top:7px;border-top:1px dashed #bbf7d0;white-space:pre-wrap;}
#sgModal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:70;align-items:center;justify-content:center;padding:16px;}
#sgModal .box{background:#fff;border-radius:16px;width:520px;max-width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(15,23,42,.3);}
#sgModal .hd{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #eef2f7;flex-shrink:0;}
#sgModal .hd b{font-size:1rem;font-weight:800;}
#sgModal .hd .x{cursor:pointer;color:#94a3b8;font-size:1.2rem;background:none;border:none;}
#sgModal .bd{padding:16px 18px;overflow-y:auto;}
#sgModal label{font-size:.76rem;font-weight:700;color:#475569;display:block;margin:12px 0 5px;}
#sgModal label:first-child{margin-top:0;}
#sgModal input[type=text],#sgModal textarea{width:100%;border:1.5px solid #dfe4ef;border-radius:9px;padding:9px 11px;font-size:.88rem;box-sizing:border-box;font-family:inherit;}
#sgModal textarea{min-height:86px;resize:vertical;}
.sg-cats{display:flex;gap:6px;flex-wrap:wrap;}
.sg-cat{padding:6px 13px;border-radius:16px;font-size:.78rem;font-weight:700;border:1.5px solid #dfe4ef;background:#fff;color:#64748b;cursor:pointer;}
.sg-cat.on{background:#1e40af;color:#fff;border-color:#1e40af;}
.sg-drop{border:2px dashed #cbd5e1;border-radius:10px;padding:16px;text-align:center;font-size:.78rem;color:#94a3b8;background:#fafcff;cursor:pointer;}
.sg-drop.hi{border-color:#1e40af;background:#eff6ff;color:#1e40af;}
.sg-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.sg-th{position:relative;width:72px;height:54px;border-radius:6px;overflow:hidden;border:1px solid #e2e8f0;}
.sg-th img{width:100%;height:100%;object-fit:cover;}
.sg-th .del{position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:18px;text-align:center;cursor:pointer;border:2px solid #fff;}
.sg-btn{width:100%;padding:12px;border:none;background:#1e40af;color:#fff;border-radius:11px;font-size:.92rem;font-weight:700;cursor:pointer;margin-top:16px;}
.sg-btn:disabled{opacity:.5;cursor:default;}
.sg-btn.ghost{background:#fff;border:1.5px solid #dfe4ef;color:#475569;}
.sg-item{border:1px solid #eef2f7;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;}
.sg-item:hover{background:#f8fafc;}

<script>
/* 앱에서 포털로 돌아올 때: 로그인돼 있을 것으로 기대되면(힌트) 로그인 화면 대신 스플래시 표시
   → Firebase 인증 확인 후 포털 타일이 뜨면 제거 (로그인 화면 번쩍임 방지) */
(function(){
  var hint=false;
  try {
    // 같은 탭(세션) 힌트 + 기기 힌트(localStorage: 자동로그인 설정·직전 로그인 성공)
    // → 새 탭/브라우저 재시작으로 sessionStorage가 비어도 로그인 화면 번쩍임 방지
    hint = sessionStorage.getItem('pu_auth_hint')==='1'
        || !!sessionStorage.getItem('pureun_v6_session_sid')
        || localStorage.getItem('pu_auth_hint')==='1'
        || localStorage.getItem('pu_portal_auto')==='1';
  } catch(e){}
  if(hint){
    var s=document.getElementById('pu-boot-splash'); if(s) s.style.display='flex';
    setTimeout(function(){ var s2=document.getElementById('pu-boot-splash'); if(s2) s2.remove(); }, 8000); // 안전망
  }
})();
</script>

(function(){
  "use strict";

  // ── Firebase 설정 (ERP와 동일 프로젝트) ──
  var FB_CONFIG = {
    apiKey: 'AIzaSyDkZz5QlKSoqMOYByp5YGeMNLNDrIghliA',

    projectId: 'pureun-erp',
    appId: '1:936817166182:web:9bd31f70d0afdf5fca2aa7',
    messagingSenderId: '936817166182'
  };
  firebase.initializeApp(FB_CONFIG);
  var auth = firebase.auth();
  var db = firebase.database();

  // ── 앱 레지스트리 (역할별 노출) ──
  // roles: 이 앱을 볼 수 있는 역할. null = 전원.
  var APPS = [
    { key:'erp',     name:'푸른이알피',   desc:'인사·급여·재무',   icon:'🏢', url:'pu-erp.html',         roles:null },
    { key:'payroll', name:'급여관리',     desc:'급여 아웃소싱',    icon:'💰', url:'payroll-os.html',     roles:null },
    { key:'fund',    name:'기금관리',     desc:'근로복지기금 운영', icon:'🏦', url:'fund.html', roles:null },
    { key:'consult', name:'컨설팅 일정',  desc:'정부지원 관리',    icon:'📅', url:'gov-consulting.html', roles:null },
    { key:'cards',   name:'명함첩',       desc:'거래처 연락처',    icon:'📇', url:'pu-cards.html',       roles:null },
    { key:'career',  name:'이력관리',     desc:'개인 이력서',      icon:'🗂', url:'kcareer.html',        roles:null },
    { key:'rules',   name:'규정관리',     desc:'취업규칙 검토',    icon:'📋', url:'rules.html',          roles:null },
    { key:'docs',    name:'문서관리',     desc:'계약서 전자송부',  icon:'📄', url:'docs-esign.html',     roles:null }
  ];

  // ── 유틸 ──
  var $ = function(id){ return document.getElementById(id); };
  function sidToEmail(sid){ return String(sid||'').toLowerCase().replace(/-/g,'') + '@pureun.kr'; }
  function isMobile(){ return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent); }
  // 앱 탭(pureun-erp 등)이 로그아웃으로 포털이 된 경우 탭 이름표 초기화 — 안 하면 타일이 '자기 탭'을 겨냥해 현재 화면에서 열림
  try { if(/^pureun-/.test(window.name)) window.name = 'pureun-portal'; } catch(e){}
  // 이전 페이지의 전체화면 덮개(z=2147483647) 잔재가 있으면 제거 (레이아웃 밀림 방지)
  try { document.querySelectorAll('div').forEach(function(d){ if(d.style && d.style.zIndex==='2147483647' && d.style.position==='fixed'){ d.remove(); } }); } catch(e){}

  // ── 실시간 시계 (KST 표시) ──
  function tickClock(){
    var el = $('topClock'); if(!el) return;
    var d = new Date();
    el.textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+' KST';
  }
  tickClock(); setInterval(tickClock, 15000);

  // ── 저장된 아이디 복원 (포털 전용 키 — 다른 앱이 지워도 영향 없음) ──
  try {
    // 기존 공유 키에서 1회 이관 (예전에 저장해둔 값 살리기)
    if(!localStorage.getItem('pu_portal_save_id') && localStorage.getItem('pureun_v6_save_id_flag') === '1'){
      localStorage.setItem('pu_portal_save_id','1');
      localStorage.setItem('pu_portal_last_id', localStorage.getItem('pureun_v6_last_login_id') || '');
    }
    if(!localStorage.getItem('pu_portal_auto') && localStorage.getItem('pureun_v6_auto_flag') === '1'){
      localStorage.setItem('pu_portal_auto','1');
    }
    if(localStorage.getItem('pu_portal_save_id') === '1'){
      var lastId = localStorage.getItem('pu_portal_last_id') || '';
      if(lastId){ $('loginId').value = lastId; $('saveId').checked = true; }
    }
    // 자동 로그인 체크 상태 복원
    if(localStorage.getItem('pu_portal_auto') === '1'){ $('autoLogin').checked = true; }
  } catch(e){}

  // ── 비번 표시 토글 ──
  $('eyeBtn').addEventListener('click', function(){
    var pw = $('loginPw');
    pw.type = (pw.type === 'password') ? 'text' : 'password';
  });

  // ── Caps Lock 경고 ──
  (function(){
    var pw = $('loginPw'), warn = $('capsWarn');
    function chk(e){ if(e.getModifierState){ warn.style.display = e.getModifierState('CapsLock') ? 'block' : 'none'; } }
    pw.addEventListener('keydown', chk);
    pw.addEventListener('keyup', chk);
    pw.addEventListener('blur', function(){ warn.style.display = 'none'; });
  })();

  // ── 에러 표시 ──
  function showErr(msg){ $('errMsg').textContent = msg || ''; }

  // ── 세션 자동 감지: 이메일 계정으로 로그인돼 있으면 포털 표시, 로그아웃되면(다른 탭 포함) 로그인 화면으로 복귀 ──
  var _handled = false;
  function _rmBootSplash(){ try { var s=document.getElementById('pu-boot-splash'); if(s) s.remove(); } catch(_e){} }
  auth.onAuthStateChanged(function(user){
    if(user && user.email){
      try { sessionStorage.setItem('pu_auth_hint','1'); localStorage.setItem('pu_auth_hint','1'); } catch(_e){}   // 다음 포털 복귀 때 로그인화면 번쩍임 방지
      if(!_handled){ _handled = true; enterPortal(user); }
    } else if(_handled){
      // 로그아웃됨(유휴 60분·다른 탭 로그아웃 포함) → 화면 바꿔치기 대신 '완전 새로고침'.
      // 오래 방치된 탭은 브라우저 절전으로 얼어 있어, 그 안에서 화면만 바꿔치기하면
      // 입력이 안 먹는 반깨움 상태가 됨. ERP·컨설팅·명함첩과 동일하게 fresh load로 통일.
      _handled = false;
      try { sessionStorage.removeItem('pu_skip_home'); sessionStorage.removeItem('pu_auth_hint'); localStorage.removeItem('pu_auth_hint'); } catch(_e){}
      try { location.replace(location.pathname + '?v=' + Date.now()); }
      catch(_) { location.reload(); }
    } else {
      // 미로그인 확정 → 스플래시 내리고 로그인 화면 표시
      try { sessionStorage.removeItem('pu_auth_hint'); localStorage.removeItem('pu_auth_hint'); } catch(_e){}
      _rmBootSplash();
    }
  });

  // ── 로그인 실행 ──
  function doLogin(){
    var id = ($('loginId').value || '').trim();
    var pw = $('loginPw').value || '';
    if(!id){ showErr('아이디를 입력하세요.'); return; }
    if(!pw){ showErr('비밀번호를 입력하세요.'); return; }

    // 아이디 → 이메일 (이미 이메일 형태면 그대로, 사번이면 변환)
    var email = (id.indexOf('@') >= 0) ? id.toLowerCase()
              : (/^[A-Za-z]+-?\d+$/.test(id) ? sidToEmail(id) : '');
    if(!email){ showErr('이메일 형식으로 입력하세요. (예: p001@pureun.kr)'); return; }

    $('loginBtn').disabled = true;
    showErr('');

    // 자동 로그인 지속성 설정
    var persistence = $('autoLogin').checked
      ? firebase.auth.Auth.Persistence.LOCAL
      : firebase.auth.Auth.Persistence.SESSION;

    // 응답 감시: 얼어있던 탭에서 인증 모듈이 응답을 못 하면 버튼이 비활성으로
    // 영원히 멈춤 — 12초 내 결과가 없으면 새로고침으로 깨운다.
    var _settled = false;
    var _watchdog = setTimeout(function(){
      if(_settled) return;
      showErr('응답이 없어 화면을 새로 고칩니다. 잠시 후 다시 로그인해 주세요.');
      setTimeout(function(){ location.replace(location.pathname + '?v=' + Date.now()); }, 900);
    }, 12000);

    auth.setPersistence(persistence).catch(function(){ /* 지속성 설정 실패해도 로그인은 진행 */ }).then(function(){
      return auth.signInWithEmailAndPassword(email, pw);
    }).then(function(cred){
      _settled = true; clearTimeout(_watchdog);
      // 아이디 저장 (포털 전용 키 + ERP 화면 채움용 공유 키 병행)
      try {
        if($('saveId').checked){
          localStorage.setItem('pu_portal_save_id','1');
          localStorage.setItem('pu_portal_last_id', id);
          localStorage.setItem('pureun_v6_save_id_flag','1');
          localStorage.setItem('pureun_v6_last_login_id', id);
        } else {
          localStorage.removeItem('pu_portal_save_id');
          localStorage.removeItem('pu_portal_last_id');
        }
        // 자동 로그인 체크 상태 저장 (포털 전용)
        localStorage.setItem('pu_portal_auto', $('autoLogin').checked ? '1' : '0');
      } catch(e){}
      // 브라우저·삼성패스 비번 저장 보강(지원 브라우저 한정) → 다음부터 지문 자동입력
      try {
        if(window.PasswordCredential && navigator.credentials && navigator.credentials.store){
          navigator.credentials.store(new window.PasswordCredential({ id: id, password: pw, name: id })).catch(function(){});
        }
      } catch(_c){}
      _handled = true;
      enterPortal(cred.user);
    }).catch(function(err){
      _settled = true; clearTimeout(_watchdog);
      $('loginBtn').disabled = false;
      var code = (err && err.code) || '';
      if(code === 'auth/wrong-password' || code === 'auth/invalid-credential'){
        showErr('비밀번호가 틀렸습니다.');
      } else if(code === 'auth/user-not-found'){
        showErr('계정을 찾을 수 없습니다. 관리자에게 문의하세요.');
      } else if(code === 'auth/too-many-requests'){
        showErr('로그인 시도가 많습니다. 잠시 후 다시 시도하세요.');
      } else if(code === 'auth/invalid-email'){
        showErr('아이디 형식이 올바르지 않습니다.');
      } else {
        showErr('로그인 실패: ' + (err && err.message ? err.message : code));
      }
    });
  }

  // 표준 form 제출 → 브라우저·삼성패스가 비번 저장/지문 자동입력을 인식 (버튼 클릭·Enter 모두 여기로)
  $('loginForm').addEventListener('submit', function(e){ e.preventDefault(); doLogin(); });
  $('loginId').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); $('loginPw').focus(); } });

  // ── 로그인 화면 신선도 가드: 오래 방치된 탭은 크롬 절전으로 얼어 로그인이 안 먹으므로,
  //    탭에 돌아왔을 때 30분 이상 묵은 미로그인 화면이면 자동 새로고침 (비번 입력 중이면 방해 안 함) ──
  (function(){
    var loadedAt = Date.now();
    var STALE = 30*60*1000;
    function freshen(){
      if(document.visibilityState !== 'visible') return;
      if(auth.currentUser) return;                        // 로그인 상태면 포털 로직이 담당
      if(Date.now() - loadedAt < STALE) return;
      var pw = $('loginPw'); if(pw && pw.value) return;   // 입력하던 값이 있으면 유지
      location.replace(location.pathname + '?v=' + Date.now());
    }
    document.addEventListener('visibilitychange', freshen);
    window.addEventListener('pageshow', function(e){ if(e.persisted) freshen(); });
  })();

  // ── 비밀번호 변경: 현재 비번으로 로그인(재인증) → 새 비번으로 교체 ──
  $('pwChangeLink').addEventListener('click', function(e){
    e.preventDefault();
    $('pwcId').value = $('loginId').value || '';
    $('pwcCur').value = ''; $('pwcNew').value = ''; $('pwcNew2').value = '';
    $('pwcErr').style.display = 'none';
    $('pwModal').style.display = 'flex';
    setTimeout(function(){ ($('pwcId').value ? $('pwcCur') : $('pwcId')).focus(); }, 60);
  });
  $('pwcCancel').addEventListener('click', function(){ $('pwModal').style.display = 'none'; });
  $('pwcSave').addEventListener('click', function(){
    var id = $('pwcId').value.trim(), cur = $('pwcCur').value, n1 = $('pwcNew').value, n2 = $('pwcNew2').value;
    var err = $('pwcErr');
    function show(m){ err.textContent = m; err.style.display = 'block'; }
    if(!id){ show('아이디를 입력하세요.'); return; }
    if(id.indexOf('@') < 0) id = id.toLowerCase().replace(/-/g,'') + '@pureun.kr';
    if(!cur){ show('현재 비밀번호를 입력하세요.'); return; }
    if(n1.length < 6){ show('새 비밀번호는 6자 이상이어야 합니다.'); return; }
    if(n1 !== n2){ show('새 비밀번호가 서로 다릅니다.'); return; }
    if(n1 === cur){ show('현재 비밀번호와 다른 비밀번호를 입력하세요.'); return; }
    $('pwcSave').disabled = true; $('pwcSave').textContent = '변경 중…';
    auth.signInWithEmailAndPassword(id, cur).then(function(cred){
      return cred.user.updatePassword(n1);
    }).then(function(){
      $('pwModal').style.display = 'none';
      alert('비밀번호가 변경되었습니다.');
      // 재인증으로 이미 로그인된 상태 → onAuthStateChanged가 포털로 진입시킴
    }).catch(function(e2){
      var c = e2 && e2.code || '';
      if(c === 'auth/wrong-password' || c === 'auth/invalid-credential' || c === 'auth/invalid-login-credentials') show('현재 비밀번호가 올바르지 않습니다.');
      else if(c === 'auth/user-not-found') show('등록되지 않은 아이디입니다.');
      else if(c === 'auth/weak-password') show('새 비밀번호가 너무 단순합니다.');
      else if(c === 'auth/too-many-requests') show('시도가 많습니다. 잠시 후 다시 하세요.');
      else show('변경 실패: ' + (e2 && e2.message || c));
    }).finally(function(){
      $('pwcSave').disabled = false; $('pwcSave').textContent = '변경하기';
    });
  });

  // ── 포털 진입: 로그인된 사용자의 계정 정보 조회 후 타일 렌더 ──
  function enterPortal(user){
    // 데이터가 준비될 때까지 화면은 민무늬 배경만 (빈 껍데기 헤더 번쩍임 방지)
    $('loginView').style.display = 'none';
    document.body.classList.add('portal-mode');   // 포털 화면 상단 정렬
    var tf = $('topfix'); if(tf) tf.style.display = 'none';

    // 직원명부에서 이 사용자(이메일 매칭) 찾아 이름·역할 확정 → 그 후에 한 번에 표시
    function _show(acct){
      renderPortal(acct);
      $('portalView').style.display = 'block';
      _rmBootSplash();   // 타일까지 그린 뒤 스플래시 제거 (번쩍임 없음)
    }
    // 명부 읽기 공통: {v:...} 래핑·객체 형태 모두 배열로 정규화
    function _readRoster(path){
      return db.ref(path).once('value').then(function(snap){
        var raw = snap.val();
        var list = (raw && raw.v !== undefined) ? raw.v : raw;
        if(list && !Array.isArray(list) && typeof list === 'object'){
          list = Object.keys(list).map(function(k){ return list[k]; });
        }
        return Array.isArray(list) ? list : null;
      });
    }
    function _match(list){
      if(!list) return null;
      var em = (user.email || '').toLowerCase();
      return list.find(function(x){ return x && sidToEmail(x.sid) === em; }) || null;
    }
    // 이 기기의 ERP 로컬 캐시 최종 폴백 (서버 읽기가 모두 막혀도 이름 표시)
    function _matchLocal(){
      try {
        var arr = JSON.parse(localStorage.getItem('pureun_v6_user_accounts') || 'null');
        return _match(arr);
      } catch(e){ return null; }
    }
    // [보안규칙 대비] user_accounts는 관리자 전용 → 일반 직원은 읽기 거부.
    // ERP 로그인 경로와 동일하게 공개 명부 user_dir 우선, 실패 시 user_accounts → 로컬 캐시 순.
    _readRoster('data/user_dir')
      .then(function(dir){
        var acct = _match(dir);
        if(acct) return acct;
        return _readRoster('data/user_accounts').then(_match).catch(function(){ return null; });
      })
      .catch(function(){
        return _readRoster('data/user_accounts').then(_match).catch(function(){ return null; });
      })
      .then(function(acct){ _show(acct || _matchLocal()); });
  }

  function renderPortal(acct){
    var name = acct ? acct.name : (auth.currentUser && auth.currentUser.email) || '사용자';
    var role = acct ? acct.role : 'member';
    _curRole = role;   // 바로가기(홈 앱) 권한 판정용
    var title = acct ? (acct.title || '') : '';
    $('userName').textContent = name + (title ? ' · ' + title : '') + ' (' + role + ')';
    $('userAvatar').textContent = name ? name.charAt(0) : '·';

    var tiles = $('appTiles');
    tiles.innerHTML = '';
    APPS.forEach(function(app){
      // 역할 제한이 있으면 확인
      if(app.roles && app.roles.indexOf(role) < 0) return;
      // 기금관리(로컬 앱)에는 로그인 사용자·역할을 넘겨 상단바에 표시
      var extra = app.key === 'fund'
        ? '&user=' + encodeURIComponent(name) + '&role=' + encodeURIComponent(title || role) : '';
      var a = document.createElement('a');
      a.className = 'tile';
      a.dataset.key = app.key;
      a.href = app.url + (app.url.indexOf('?') >= 0 ? '&' : '?') + 'sso=1' + extra;
      // 로컬 앱(기금관리 등, localhost 실행)은 폰에서 열 수 없음 → 이동 대신 안내
      var mobileLocal = isMobile() && app.local;
      a.innerHTML =
        '<div class="ic"' + (mobileLocal ? ' style="opacity:.45"' : '') + '>' + app.icon + '</div>' +
        '<div class="tx"><b>' + app.name + '</b>' +
        '<span>' + (mobileLocal ? 'PC 전용' : app.desc) + '</span></div>' +
        (isMobile() ? '' : '<div class="newtab">탭 이동 ↗</div>');
      if(mobileLocal){
        a.href = '#';
        a.addEventListener('click', function(ev){
          ev.preventDefault();
          alert('🏦 ' + app.name + '은(는) 사무실 PC에서 실행되는 전용 프로그램이라\n폰에서는 열 수 없습니다.\n\n사무실 PC에서 이용해 주세요.');
        });
      }
      if(!isMobile()){
        a.addEventListener('click', function(ev){
          ev.preventDefault();
          var _v = Math.floor(Date.now() / 600000);  // 10분 버킷 캐시 우회
          var url = app.url + (app.url.indexOf('?') >= 0 ? '&' : '?') + 'sso=1&v=' + _v + extra;
          var winName = 'pureun-' + app.key;
          // 이미 열어둔 창이 살아있으면 그 창으로 이동+포커스(새 탭 안 만듦), 없으면 새로 연다
          var ref = window._puWins && window._puWins[app.key];
          try {
            if(ref && !ref.closed){ ref.location.href = url; ref.focus(); }
            else {
              var w = window.open(url, winName);
              window._puWins = window._puWins || {};
              window._puWins[app.key] = w;
              if(w) w.focus();
            }
          } catch(_){ window.open(url, winName); }
        });
      }
      tiles.appendChild(a);
    });

    // (직원 관리 잠금 타일은 제거 — 기금관리 타일이 그 자리를 대신. 직원 관리 기능은 ERP 내부에 있음)

    // 로그인 후 바로가기(홈 앱) 선택 바
    buildHomeBar();

    // 타일 드래그 재배치 + 순서 고정 (사용자별 저장)
    initTileOrder();

    // 건의함: 현재 사용자 정보 전달 + 플로팅 버튼 표시
    if(window.sgSetUser) window.sgSetUser(acct);
  }

  // ══════════ 타일 순서: 드래그 이동 + 고정 (사용자별, 기기 간 동기화) ══════════
  var tilePrefs = { order: null, locked: false, homeApp: null };
  var _curRole = 'member';   // 현재 로그인 사용자 역할 (바로가기 권한 판정용)
  function tilePrefLocalKey(){ return 'pu_portal_tiles_' + sgEmailKey((auth.currentUser && auth.currentUser.email) || ''); }
  function tilePrefPath(){ return 'data/portal_prefs/' + sgEmailKey((auth.currentUser && auth.currentUser.email) || '_'); }

  function saveTilePrefs(){
    try { localStorage.setItem(tilePrefLocalKey(), JSON.stringify(tilePrefs)); } catch(e){}
    if(auth.currentUser) db.ref(tilePrefPath()).set(tilePrefs).catch(function(){});
  }
  // 저장된 순서(키 배열)대로 DOM 재정렬 — 저장에 없는 새 타일은 맨 뒤에 기본 순서로
  function applyTileOrder(){
    if(!tilePrefs.order || !tilePrefs.order.length) return;
    var cont = $('appTiles');
    var all = Array.prototype.slice.call(cont.children);
    var byKey = {};
    all.forEach(function(t){ byKey[t.dataset.key] = t; });
    var seq = [];
    tilePrefs.order.forEach(function(k){ if(byKey[k]){ seq.push(byKey[k]); delete byKey[k]; } });
    all.forEach(function(t){ if(byKey[t.dataset.key] === t) seq.push(t); });  // 저장에 없던 새 타일
    seq.forEach(function(t){ cont.appendChild(t); });
  }
  function persistOrderFromDom(){
    tilePrefs.order = Array.prototype.map.call($('appTiles').children, function(t){ return t.dataset.key || ''; }).filter(Boolean);
    saveTilePrefs();
  }
  function updateLockUi(){
    var b = $('tileLockBtn');
    b.textContent = tilePrefs.locked ? '🔒 고정됨' : '🔓 이동 가능';
    b.classList.toggle('locked', tilePrefs.locked);
    $('tileHint').style.display = tilePrefs.locked ? 'none' : 'inline';
    Array.prototype.forEach.call($('appTiles').children, function(t){ t.draggable = !tilePrefs.locked; });
  }

  var _dragEl = null, _tileDragWired = false;
  function onTileDragStart(e){
    if(tilePrefs.locked){ e.preventDefault(); return; }
    _dragEl = this;
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', this.dataset.key || ''); } catch(_){}
  }
  function onTileDragEnd(){
    if(_dragEl) _dragEl.classList.remove('dragging');
    if(_dragEl){ _dragEl = null; persistOrderFromDom(); }
  }
  function onTileDragOver(e){
    if(!_dragEl) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    // 커서에서 가장 가까운 타일을 찾아 그 앞/뒤로 삽입 (그리드 대응)
    var cont = $('appTiles'), target = null, before = true, dist = Infinity;
    Array.prototype.forEach.call(cont.children, function(c){
      if(c === _dragEl) return;
      var r = c.getBoundingClientRect();
      var dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
      var d = dx*dx + dy*dy;
      if(d < dist){ dist = d; target = c; before = (Math.abs(dy) > r.height/2) ? (dy < 0) : (dx < 0); }
    });
    if(target && target !== _dragEl){
      cont.insertBefore(_dragEl, before ? target : target.nextSibling);
    }
  }

  function initTileOrder(){
    var btn = $('tileLockBtn');
    // 모바일: HTML5 드래그 미지원 → 버튼·힌트 숨김, 저장된 순서만 적용
    if(isMobile()){ btn.style.display = 'none'; $('tileHint').style.display = 'none'; }
    // 1) 로컬 캐시로 즉시 적용 (깜빡임 없이) — 캐시 없으면 기본값으로 리셋(이전 사용자 설정 잔존 방지)
    try {
      var p = JSON.parse(localStorage.getItem(tilePrefLocalKey()) || 'null');
      tilePrefs = p ? { order: p.order || null, locked: !!p.locked, homeApp: p.homeApp || null }
                    : { order: null, locked: false, homeApp: null };
    } catch(e){}
    applyTileOrder();
    syncHomeBarValue();   // 캐시된 바로가기 값 반영
    maybeGoHome();        // 설정된 바로가기 앱이 있으면 자동 이동 (캐시 기준 즉시)
    if(!isMobile()){
      updateLockUi();
      // 2) 드래그 배선 (컨테이너 이벤트는 1회만)
      Array.prototype.forEach.call($('appTiles').children, function(t){
        t.addEventListener('dragstart', onTileDragStart);
        t.addEventListener('dragend', onTileDragEnd);
      });
      if(!_tileDragWired){
        _tileDragWired = true;
        $('appTiles').addEventListener('dragover', onTileDragOver);
        $('appTiles').addEventListener('drop', function(e){ e.preventDefault(); });
        btn.addEventListener('click', function(){
          tilePrefs.locked = !tilePrefs.locked;
          saveTilePrefs();
          updateLockUi();
        });
      }
    }
    // 3) 서버 저장분과 동기화 (다른 기기에서 바꾼 순서 반영)
    if(auth.currentUser){
      db.ref(tilePrefPath()).once('value').then(function(s){
        var p = s.val();
        var norm = function(o){ return JSON.stringify({order:o.order||null,locked:!!o.locked,homeApp:o.homeApp||null}); };
        if(p && norm(p) !== norm(tilePrefs)){
          tilePrefs = { order: p.order || null, locked: !!p.locked, homeApp: p.homeApp || null };
          try { localStorage.setItem(tilePrefLocalKey(), JSON.stringify(tilePrefs)); } catch(e){}
          applyTileOrder();
          syncHomeBarValue();
          if(!isMobile()) updateLockUi();
        }
      }).catch(function(){});
    }
  }

  // ══════════ 로그인 후 바로가기(홈 앱) ══════════
  // 현재 역할로 접근 가능한 앱만 반환
  function accessibleApps(){
    return APPS.filter(function(a){ return !(a.roles && a.roles.indexOf(_curRole) < 0); });
  }
  // 포털 상단 '로그인 후 바로가기' 드롭다운 구성
  function buildHomeBar(){
    var bar = $('homeBar'); if(!bar) return;
    var opts = '<option value="">사용 안 함</option>';
    accessibleApps().forEach(function(a){
      opts += '<option value="' + a.key + '"' + (tilePrefs.homeApp === a.key ? ' selected' : '') + '>' + a.name + '</option>';
    });
    bar.innerHTML = '<span>⚡ 로그인 후 바로가기</span>'
      + '<select id="homeAppSel" aria-label="로그인 후 바로 이동할 앱" title="선택하면 로그인 후 그 앱으로 바로 이동합니다">' + opts + '</select>'
      + '<span class="hb-hint"></span>';
    $('homeAppSel').addEventListener('change', function(){
      tilePrefs.homeApp = this.value || null;
      saveTilePrefs();
      // 상태 안내는 변경 직후 4초만 표시 (한 줄 유지 — 평소엔 숨김, 설명은 셀렉트 툴팁)
      var hint = bar.querySelector('.hb-hint');
      if(hint){
        hint.textContent = this.value ? '다음 로그인부터 이 앱으로 바로 이동합니다' : '자동 이동을 사용하지 않습니다';
        hint.style.display = 'inline';
        clearTimeout(hint._t);
        hint._t = setTimeout(function(){ hint.style.display = 'none'; }, 4000);
      }
    });
  }
  // 드롭다운 표시값을 현재 tilePrefs.homeApp과 동기화
  function syncHomeBarValue(){
    var sel = $('homeAppSel');
    if(sel) sel.value = tilePrefs.homeApp || '';
  }
  // 설정된 바로가기 앱이 있으면 안내 배너 후 자동 이동 ('포털 머무르기'로 취소 가능)
  function maybeGoHome(){
    try { if(sessionStorage.getItem('pu_skip_home')) return; } catch(e){}
    var key = tilePrefs.homeApp; if(!key) return;
    var app = null;
    accessibleApps().forEach(function(a){ if(a.key === key) app = a; });
    if(!app) return;   // 권한 없거나 사라진 앱이면 무시
    showHomeBanner(app);
  }
  function showHomeBanner(app){
    if($('homeBanner')) return;   // 중복 방지
    var v = Math.floor(Date.now() / 600000);   // 10분 버킷 캐시 우회
    var url = app.url + (app.url.indexOf('?') >= 0 ? '&' : '?') + 'sso=1&v=' + v;
    var bn = document.createElement('div');
    bn.id = 'homeBanner';
    bn.innerHTML = '<span>⚡ 잠시 후 <b>' + app.name + '</b>(으)로 이동합니다…</span>'
      + '<button type="button" id="homeStay">포털 머무르기</button>';
    document.body.appendChild(bn);
    var t = setTimeout(function(){ location.href = url; }, 1500);
    $('homeStay').addEventListener('click', function(){
      clearTimeout(t);
      try { sessionStorage.setItem('pu_skip_home', '1'); } catch(e){}   // 이번 세션은 포털 유지
      bn.remove();
    });
  }

  // ── 로그아웃 ──
  $('logoutBtn').addEventListener('click', function(){
    try { sessionStorage.removeItem('pu_skip_home'); sessionStorage.removeItem('pu_auth_hint'); localStorage.removeItem('pu_auth_hint'); } catch(e){}   // 재로그인 시 바로가기·스플래시 초기화
    auth.signOut().then(function(){ location.reload(); });
  });

  // ── 유휴 자동 로그아웃 (ERP와 동일한 공유 타이머 'pu_last_active', 60분) ──
  (function(){
    var LIMIT = 60*60*1000, AKEY = 'pu_last_active';
    // 활동 기록: mousemove는 초당 수백 번 발생 → 매번 동기 localStorage.setItem 하면
    // (ERP와 공유하는 대용량 localStorage에서) 메인스레드가 멈춘다. 10초에 한 번만 기록(유휴 판정은 60분 단위라 충분).
    var _lastMark = 0;
    function mark(){ var now = Date.now(); if(now - _lastMark < 10000) return; _lastMark = now; try{ localStorage.setItem(AKEY, String(now)); }catch(e){} }
    ['mousemove','mousedown','keydown','touchstart','scroll','click'].forEach(function(ev){
      window.addEventListener(ev, mark, { passive:true, capture:true });
    });
    setInterval(function(){
      if(!auth.currentUser) return;
      var last = 0;
      try{ last = parseInt(localStorage.getItem(AKEY)||'0', 10); }catch(e){}

    }, 30000);
  })();

  // ══════════ 프로그램 건의함 ══════════

  // ── 버튼 숫자 배지: admin=미처리(접수+검토중) 건수 / 일반=내 미확인 해결 건수 ──
  // sg_meta·sg_resolved는 이미지 없는 경량 노드라 로그인마다 읽어도 가볍다.
  function sgSetBadge(n){

  function sgUpdateBadge(){

  // ── 해결 알림: 내 건의가 완료 처리되면 로그인 직후 팝업 (확인하면 다시 안 뜸) ──
  function sgCheckResolved(){
    if(!SG.email) return;

    db.ref('data/sg_resolved/'+key).once('value').then(function(snap){
      var items = [];

      if(!items.length) return;
      items.sort(function(a,b){ return (a.at||0) - (b.at||0); });
      $('sgDoneBody').innerHTML = items.map(function(it){
        return '<div class="sgd-item">'
          + '<div class="sgd-t"><span class="sg-badge sg-b-'+(it.cat||'etc')+'">'+sgEsc(sgCatName(it.cat))+'</span>'+sgEsc(it.title||'')+'</div>'
          + '<div class="sgd-r">'+(it.reply ? sgEsc(it.reply) : '처리가 완료되었습니다.')
          + ((it.replyImages&&it.replyImages.length)? '<div style="margin-top:8px">'+it.replyImages.map(function(u){return '<img src="'+u+'" style="max-width:100%;border-radius:8px;margin-top:6px;display:block">';}).join('')+'</div>':'')

  function sgCatName(k){ var c = SG_CATS.find(function(x){return x.key===k;}); return c ? c.name : '기타'; }
  function sgEsc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); }
  function sgFmt(ts){ if(!ts) return ''; var d=new Date(ts); var p=function(n){return String(n).padStart(2,'0');}; return (d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }

  function sgCompress(file, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxW = 1400, w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(cv.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = function(){ cb(null); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }
  function sgAddImgs(files){
    var arr = Array.prototype.slice.call(files).filter(function(f){ return f.type && f.type.indexOf('image/')===0; });
    arr.slice(0, 3 - SG.draftImgs.length).forEach(function(f){
      sgCompress(f, function(dataUrl){ if(dataUrl){ SG.draftImgs.push(dataUrl); sgRenderThumbs(); } });
    });
  }
  function sgRenderThumbs(){

    }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('.del'), function(el){
      el.addEventListener('click', function(){ SG.draftImgs.splice(+el.dataset.i, 1); sgRenderThumbs(); });
    });
  }

      sgCompress(f, function(dataUrl){ if(dataUrl){ SG.replyDraftImgs.push(dataUrl); sgRenderReplyThumbs(); } });
    });

  function sgOpen(){ $('sgModal').style.display = 'flex'; try{ if(typeof _sgDrag!=='undefined'){ _sgDrag.x=0; _sgDrag.y=0; var _b=$('sgModal').querySelector('.box'); if(_b) _b.style.transform=''; } }catch(_){} sgViewList(); }

  function sgViewList(){

  // 목록 렌더 (상태 필터 + 검색) — SG._all 기준, 재조회 없음
  function sgRenderList(){
    var wrap = $('sgListWrap'); if(!wrap) return;
    var arr = SG._all || [];
    // 작성자별 총건수 (필터 무관)
    var byAuthor = {};
    arr.forEach(function(s){ var k = s.author || '?'; byAuthor[k] = (byAuthor[k]||0) + 1; });
    var totalOpen = arr.filter(function(s){ return s.status !== 'done'; }).length;
    var totalDone = arr.length - totalOpen;
    // 상태 필터 칩
    var FILTERS = [['open','미처리 '+totalOpen],['done','완료 '+totalDone],['all','전체 '+arr.length]];
    var chips = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">' + FILTERS.map(function(f){
      var on = SG.listStatus === f[0];
      return '<button data-f="'+f[0]+'" class="sg-flt" style="border:1.5px solid '+(on?'#1e40af':'#dfe4ef')+';background:'+(on?'#1e40af':'#fff')+';color:'+(on?'#fff':'#475569')+';border-radius:16px;padding:5px 13px;font-size:12.5px;font-weight:700;cursor:pointer">'+f[1]+'</button>';
    }).join('') + '</div>';
    // 검색
    var searchBox = '<input id="sgListSearch" type="text" placeholder="🔍 제목·내용·작성자 검색" value="'+sgEsc(SG.listQ||'')+'" style="width:100%;box-sizing:border-box;border:1.5px solid #dfe4ef;border-radius:9px;padding:8px 11px;font-size:.86rem;margin-bottom:10px">';
    // 관리자 요약
    var sumHtml = '';
    if(sgIsAdmin()){
      var per = Object.keys(byAuthor).map(function(k){ return sgEsc(k)+' '+byAuthor[k]+'건'; }).join(' · ');
      sumHtml = '<div class="sg-sum">👑 총 '+arr.length+'건 · 미처리 <b>'+totalOpen+'건</b><br>'+per+'</div>';
    }
    // 필터·검색 적용
    var q = (SG.listQ||'').trim().toLowerCase();
    var list = arr.filter(function(s){
      if(SG.listStatus==='open' && s.status==='done') return false;
      if(SG.listStatus==='done' && s.status!=='done') return false;
      if(q){ var hay = ((s.title||'')+' '+(s.content||'')+' '+(s.author||'')).toLowerCase(); if(hay.indexOf(q)<0) return false; }
      return true;
    });
    // 완료 탭은 완료(답변)일 최신순, 그 외는 등록일 최신순(arr 기본 순서 유지)
    if(SG.listStatus==='done'){ list.sort(function(a,b){ return (b.repliedAt||b.createdAt||0)-(a.repliedAt||a.createdAt||0); }); }
    // 더 보기(30개씩) — 완료가 아무리 많아도 가볍게
    var PAGE = 30;
    var shown = SG.listShown || PAGE;
    var visible = list.slice(0, shown);
    var listHtml = list.length ? visible.map(function(s){
      var st = SG_STATUS[s.status] || SG_STATUS.new;
      var shots = (s.images && s.images.length) ? ' · 📎 '+s.images.length : '';
      var rep = s.reply ? ' · 답변 ✔' : '';
      var cnt = byAuthor[s.author || '?'];
      var when = (SG.listStatus==='done' && s.repliedAt) ? ('완료 '+sgFmt(s.repliedAt)) : sgFmt(s.createdAt);
      return '<div class="sg-item" data-id="'+s._id+'">'
        + '<div class="r1"><span class="sg-badge sg-b-'+(s.cat||'etc')+'">'+sgEsc(sgCatName(s.cat))+'</span>'
        + '<span class="sg-st '+st.c+'">'+st.t+'</span></div>'
        + '<div class="sg-itl">'+sgEsc(s.title)+'</div>'
        + '<div class="sg-meta">'+sgEsc(s.author||'')+' ('+cnt+'건) · '+when+shots+rep+'</div></div>';
    }).join('') : '<div class="sg-empty">'+(arr.length? '조건에 맞는 건의가 없습니다.' : '아직 등록된 건의가 없습니다.<br>불편한 점을 자유롭게 남겨주세요.')+'</div>';
    var moreBtn = (list.length > shown)
      ? '<button id="sgMore" class="sg-btn ghost" style="margin-top:8px">더 보기 ('+(list.length-shown)+'건 남음)</button>' : '';
    wrap.innerHTML = sumHtml + chips + searchBox + listHtml + moreBtn;
    Array.prototype.forEach.call(wrap.querySelectorAll('.sg-flt'), function(el){
      el.addEventListener('click', function(){ SG.listStatus = el.dataset.f; SG.listShown = PAGE; sgRenderList(); });
    });
    var si = $('sgListSearch');
    if(si) si.addEventListener('input', function(){ SG.listQ = si.value; SG.listShown = PAGE; var pos=si.selectionStart; sgRenderList(); var s2=$('sgListSearch'); if(s2){ s2.focus(); try{ s2.setSelectionRange(pos,pos); }catch(_){} } });
    var mb = $('sgMore');
    if(mb) mb.addEventListener('click', function(){ SG.listShown = shown + PAGE; sgRenderList(); });
    Array.prototype.forEach.call(wrap.querySelectorAll('.sg-item'), function(el){
      el.addEventListener('click', function(){ sgViewDetail(el.dataset.id); });
    });
  }

  function sgViewCreate(){

    bd.innerHTML =

      + '<label>스크린샷 (선택, 최대 3장) — 캡처 후 Ctrl+V 또는 클릭해서 선택</label>'

    var drop = $('sgDrop'), fileInp = $('sgFile');

    drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.classList.add('hi'); });
    drop.addEventListener('dragleave', function(){ drop.classList.remove('hi'); });
    drop.addEventListener('drop', function(e){ e.preventDefault(); drop.classList.remove('hi'); if(e.dataTransfer.files) sgAddImgs(e.dataTransfer.files); });
    $('sgInBody').addEventListener('paste', function(e){
      var items = (e.clipboardData||{}).items || [];
      var imgs = [];
      for(var i=0;i<items.length;i++){ if(items[i].type && items[i].type.indexOf('image/')===0){ var f=items[i].getAsFile(); if(f) imgs.push(f); } }
      if(imgs.length){ e.preventDefault(); sgAddImgs(imgs); }
    });
    $('sgSubmit').addEventListener('click', sgSubmit);
    $('sgBackList').addEventListener('click', sgViewList);
    // 유사(중복) 건의 표시 — 제목·내용 입력 시
    $('sgInTitle').addEventListener('input', sgRenderSimilar);
    $('sgInBody').addEventListener('input', sgRenderSimilar);
    if(!(SG._all && SG._all.length)){
      db.ref('data/suggestions').orderByChild('createdAt').once('value').then(function(snap){
        var arr=[]; snap.forEach(function(ch){ var v=ch.val(); v._id=ch.key; arr.push(v); }); arr.reverse();
        SG._all=arr; sgRenderSimilar();
      }).catch(function(){});
    }
  }
  function sgTokens(s){
    var toks = String(s||'').toLowerCase().split(/[^0-9a-z가-힣]+/).filter(function(w){ return w.length>=2; });
    return toks.filter(function(w,i){ return toks.indexOf(w)===i; });
  }
  function sgRenderSimilar(){
    var box = $('sgSimilar'); if(!box) return;
    var toks = sgTokens(($('sgInTitle')?$('sgInTitle').value:'')+' '+($('sgInBody')?$('sgInBody').value:''));
    if(toks.length<1){ box.innerHTML=''; return; }
    var scored = (SG._all||[]).map(function(s){
      var st = sgTokens((s.title||'')+' '+(s.content||''));
      var sh = 0; toks.forEach(function(w){ if(st.indexOf(w)>=0) sh++; });
      return { s:s, sh:sh };
    }).filter(function(x){ return x.sh>=1; }).sort(function(a,b){ return b.sh-a.sh; }).slice(0,3);
    if(!scored.length){ box.innerHTML=''; return; }
    box.innerHTML = '<div style="border:1px solid #fde68a;background:#fffbeb;border-radius:9px;padding:8px 10px;margin:8px 0">'
      + '<div style="font-size:.76rem;font-weight:800;color:#92400e;margin-bottom:5px">💡 비슷한 지난 건의 '+scored.length+'건 — 이미 접수·처리된 내용인지 확인해보세요</div>'
      + scored.map(function(x){ var st=SG_STATUS[x.s.status]||SG_STATUS.new;
          return '<div class="sgSimIt" data-id="'+x.s._id+'" style="cursor:pointer;font-size:.8rem;padding:3px 0;color:#334155"><span class="sg-st '+st.c+'" style="font-size:.68rem">'+st.t+'</span> '+sgEsc(x.s.title||'')+'</div>';
        }).join('')
      + '</div>';
    Array.prototype.forEach.call(box.querySelectorAll('.sgSimIt'), function(el){
      el.addEventListener('click', function(){ sgViewDetail(el.dataset.id); });
    });
  }

  function sgSubmit(){
    var title = ($('sgInTitle').value || '').trim();
    var content = ($('sgInBody').value || '').trim();
    if(!title){ alert('제목을 입력하세요.'); return; }
    if(!content){ alert('내용을 입력하세요.'); return; }
    var btn = $('sgSubmit'); btn.disabled = true; btn.textContent = '등록 중…';
    var rec = {
      cat: SG.draftCat, title: title, content: content,
      images: SG.draftImgs.slice(),
      author: SG.name, authorEmail: SG.email,
      status: 'new', reply: '', createdAt: Date.now()
    };
    var ref = db.ref('data/suggestions').push();
    ref.set(rec).then(function(){
      // 경량 메타 병행 기록 — 배지·관리자 요약이 이미지 포함 원본을 안 읽게
      db.ref('data/sg_meta/'+ref.key).set({
        author: rec.author, authorEmail: rec.authorEmail,
        status: 'new', cat: rec.cat, title: rec.title, createdAt: rec.createdAt
      }).catch(function(){});
      SG.draftImgs = []; sgViewList();
      if(sgIsAdmin()) sgUpdateBadge();
    }).catch(function(err){
      btn.disabled = false; btn.textContent = '건의 등록';
      alert('등록 실패: ' + (err && err.message ? err.message : '알 수 없는 오류') + '\n사진 용량이 크면 줄여서 다시 시도해주세요.');
    });
  }

  function sgViewDetail(id){
    var bd = $('sgBody');
    bd.innerHTML = '<div class="sg-empty">불러오는 중…</div>';
    db.ref('data/suggestions/'+id).once('value').then(function(snap){
      var s = snap.val(); if(!s){ sgViewList(); return; }
      var st = SG_STATUS[s.status] || SG_STATUS.new;
      $('sgTitle').textContent = '💬 건의 상세';
      var html = '<div class="r1" style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'
        + '<span class="sg-badge sg-b-'+(s.cat||'etc')+'">'+sgEsc(sgCatName(s.cat))+'</span>'
        + '<span class="sg-st '+st.c+'">'+st.t+'</span>'
        + '<span style="font-size:.72rem;color:#94a3b8;margin-left:auto">'+sgEsc(s.author||'')+' · '+sgFmt(s.createdAt)+'</span></div>'
        + '<div style="font-size:1rem;font-weight:800;margin-bottom:8px">'+sgEsc(s.title)+'</div>'
        + '<div style="font-size:.86rem;color:#334155;line-height:1.7;white-space:pre-wrap">'+sgEsc(s.content)+'</div>';
      if(s.images && s.images.length){
        html += s.images.map(function(u){ return '<img class="sg-shot" src="'+u+'" data-full="'+u+'">'; }).join('');
      }
      if(s.reply || (s.replyImages && s.replyImages.length)){
        html += '<div class="sg-reply"><b>👑 대표 답변</b>'+(s.repliedAt?' · '+sgFmt(s.repliedAt):'')+'<br>'+sgEsc(s.reply||'')
          + ((s.replyImages&&s.replyImages.length)? '<div style="margin-top:8px">'+s.replyImages.map(function(u){return '<img class="sg-shot" src="'+u+'" data-full="'+u+'">';}).join('')+'</div>':'')
          + '</div>';
      }
      if(sgIsAdmin()){
        SG.replyDraftImgs = (s.replyImages||[]).slice();   // 기존 답변 캡처 로드
        html += '<div style="border-top:1px solid #eef2f7;margin-top:16px;padding-top:14px">'
          + '<label style="color:#1e40af;font-size:.76rem;font-weight:700;display:block;margin-bottom:5px">👑 대표 전용 · 상태 변경</label>'
          + '<div class="sg-cats" id="sgStSel">'
          + Object.keys(SG_STATUS).map(function(k){ return '<span class="sg-cat'+(s.status===k?' on':'')+'" data-k="'+k+'">'+SG_STATUS[k].t+'</span>'; }).join('')
          + '</div>'
          + '<label style="color:#1e40af;font-size:.76rem;font-weight:700;display:block;margin:12px 0 5px">답변 / 메모</label>'
          + '<textarea id="sgReplyIn" placeholder="확인 결과나 처리 상황을 적어주세요">'+sgEsc(s.reply||'')+'</textarea>'
          + '<label style="color:#1e40af;font-size:.72rem;font-weight:700;display:block;margin:10px 0 5px">해결 캡처 (선택, 최대 3장) — 클릭 선택 또는 Ctrl+V</label>'
          + '<div class="sg-drop" id="sgReplyDrop">📎 여기를 클릭해 캡처 선택 · 또는 Ctrl+V로 붙여넣기</div>'
          + '<div class="sg-thumbs" id="sgReplyThumbs"></div>'
          + '<input type="file" id="sgReplyFile" accept="image/*" multiple style="display:none">'
          + '<button class="sg-btn" id="sgSaveAdmin" style="margin-top:10px">저장</button></div>';
      }
      html += '<button class="sg-btn ghost" id="sgBackList2" style="margin-top:10px">← 목록으로</button>';
      bd.innerHTML = html;
      Array.prototype.forEach.call(bd.querySelectorAll('.sg-shot'), function(im){
        im.addEventListener('click', function(){ var w=window.open(''); if(w) w.document.write('<img src="'+im.dataset.full+'" style="max-width:100%">'); });
      });
      $('sgBackList2').addEventListener('click', sgViewList);
      if(sgIsAdmin()){
        sgRenderReplyThumbs();
        (function(){
          var rdrop=$('sgReplyDrop'), rfile=$('sgReplyFile');
          if(rdrop && rfile){
            rdrop.addEventListener('click', function(){ rfile.click(); });
            rfile.addEventListener('change', function(e){ sgAddReplyImgs(e.target.files); rfile.value=''; });
            rdrop.addEventListener('dragover', function(e){ e.preventDefault(); rdrop.classList.add('hi'); });
            rdrop.addEventListener('dragleave', function(){ rdrop.classList.remove('hi'); });
            rdrop.addEventListener('drop', function(e){ e.preventDefault(); rdrop.classList.remove('hi'); if(e.dataTransfer.files) sgAddReplyImgs(e.dataTransfer.files); });
          }
          var rin=$('sgReplyIn');
          if(rin) rin.addEventListener('paste', function(e){
            var items=(e.clipboardData||{}).items||[]; var imgs=[];
            for(var i=0;i<items.length;i++){ if(items[i].type&&items[i].type.indexOf('image/')===0){ var f=items[i].getAsFile(); if(f) imgs.push(f); } }
            if(imgs.length){ e.preventDefault(); sgAddReplyImgs(imgs); }
          });
        })();
        var newStatus = s.status || 'new';
        Array.prototype.forEach.call($('sgStSel').children, function(el){
          el.addEventListener('click', function(){ newStatus = el.dataset.k; Array.prototype.forEach.call($('sgStSel').children, function(x){ x.classList.toggle('on', x===el); }); });
        });
        $('sgSaveAdmin').addEventListener('click', function(){
          var btn = $('sgSaveAdmin'); btn.disabled = true; btn.textContent = '저장 중…';
          var reply = ($('sgReplyIn').value||'').trim();
          var replyImages = SG.replyDraftImgs.slice();
          db.ref('data/suggestions/'+id).update({ status:newStatus, reply:reply, replyImages:replyImages, repliedAt:Date.now() })
            .then(function(){
              db.ref('data/sg_meta/'+id).update({ status:newStatus }).catch(function(){});
              // 완료 처리 → 건의자에게 해결 알림 기록 (다음 로그인 때 팝업, 캡처 포함)
              if(s.authorEmail){
                var rref = db.ref('data/sg_resolved/'+sgEmailKey(s.authorEmail)+'/'+id);
                if(newStatus === 'done'){
                  rref.set({ title:s.title||'', reply:reply, replyImages:replyImages, cat:s.cat||'etc', at:Date.now(), seen:false }).catch(function(){});
                } else {
                  rref.remove().catch(function(){});   // 완료 취소 시 알림 회수
                }
              }
              sgUpdateBadge();
              sgViewList();
            })
            .catch(function(err){ btn.disabled=false; btn.textContent='저장'; alert('저장 실패: '+(err&&err.message||'')); });
        });
      }
    }).catch(function(){ sgViewList(); });
  }

  $('sgClose').addEventListener('click', sgCloseModal);
  $('sgModal').addEventListener('click', function(e){ if(e.target === $('sgModal')) sgCloseModal(); });
  $('sgFab').addEventListener('click', sgOpen);

  // 건의 모달 헤더 드래그 이동 (마우스)
  var _sgDrag = { x:0, y:0, dragging:false, sx:0, sy:0 };
  (function(){
    var modal = $('sgModal'); if(!modal) return;
    var hd = modal.querySelector('.hd'), box = modal.querySelector('.box');
    if(!hd || !box) return;
    hd.style.cursor = 'move'; hd.style.userSelect = 'none';
    hd.addEventListener('mousedown', function(e){
      if(e.target.closest('.x')) return;              // 닫기 버튼은 제외
      _sgDrag.dragging = true;
      _sgDrag.sx = e.clientX - _sgDrag.x;
      _sgDrag.sy = e.clientY - _sgDrag.y;
      e.preventDefault();
    });
    window.addEventListener('mousemove', function(e){
      if(!_sgDrag.dragging) return;
      _sgDrag.x = e.clientX - _sgDrag.sx;
      _sgDrag.y = e.clientY - _sgDrag.sy;
      box.style.transform = 'translate(' + _sgDrag.x + 'px,' + _sgDrag.y + 'px)';
    });
    window.addEventListener('mouseup', function(){ _sgDrag.dragging = false; });
  })();

})();
</script>
</body>
</html>
