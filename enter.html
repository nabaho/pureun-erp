<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e3a8a">
<title>푸른노무법인 · 통합 포털</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#e2e8f0; --ink:#202124; --sub:#475569; --mute:#94a3b8;
  --card-bg:rgba(248,251,255,0.65); --card-border:rgba(255,255,255,0.75);
  --accent:#1e40af; --accent-end:#1e3a8a; --status:#16a34a;
  --wordmark-grad:linear-gradient(110deg,#1e40af 0%,#2563eb 60%,#7c6ce0 100%);
  --mesh:radial-gradient(ellipse 900px 700px at 14% 18%,rgba(140,180,255,0.55),transparent 55%),
         radial-gradient(ellipse 800px 700px at 88% 88%,rgba(150,220,200,0.42),transparent 55%),
         radial-gradient(ellipse 700px 600px at 86% 20%,rgba(180,160,255,0.42),transparent 55%),
         radial-gradient(ellipse 600px 500px at 16% 88%,rgba(255,180,200,0.30),transparent 55%);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"Inter","Noto Sans KR",system-ui,-apple-system,sans-serif;
  letter-spacing:-0.005em;position:relative;overflow-x:hidden;}
.mesh{position:fixed;inset:0;pointer-events:none;background-image:var(--mesh);}
.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:32px 16px;}

/* ---------- 로그인 화면 ---------- */
.eyebrow{letter-spacing:.3em;font-size:.68rem;color:var(--mute);font-weight:700;text-align:center;}
.hello{font-family:"Noto Serif KR",serif;text-align:center;font-size:2.1rem;line-height:1.35;
  margin:10px 0 6px;font-weight:600;color:#1a2233;}
.hello .brand{background:var(--wordmark-grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;}
.hello-sub{text-align:center;font-size:.86rem;color:var(--sub);margin-bottom:28px;}
.card{width:100%;max-width:400px;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:22px;box-shadow:0 20px 50px rgba(20,30,80,.12);backdrop-filter:blur(14px);
  padding:28px 26px 22px;}
label{display:block;font-size:.76rem;color:var(--sub);font-weight:600;margin:12px 0 6px;}
.inputwrap{position:relative;display:flex;align-items:center;}
.inputwrap .ico{position:absolute;left:13px;font-size:.95rem;opacity:.55;pointer-events:none;}
input[type=text],input[type=password]{width:100%;border:1px solid rgba(10,20,60,.14);
  background:rgba(255,255,255,.7);border-radius:12px;padding:12px 14px 12px 38px;
  font-size:.92rem;color:var(--ink);font-family:inherit;outline:none;transition:.15s;}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,64,175,.12);background:#fff;}
.eye{position:absolute;right:12px;background:none;border:none;cursor:pointer;font-size:.95rem;opacity:.5;}
.row{display:flex;align-items:center;justify-content:space-between;margin:14px 0 16px;font-size:.78rem;color:var(--sub);}
.ck{display:flex;gap:14px;align-items:center;}
.ck label{margin:0;display:flex;align-items:center;gap:5px;cursor:pointer;font-weight:500;}
.ck input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;}
.btn{width:100%;border:none;cursor:pointer;background:linear-gradient(120deg,var(--accent),var(--accent-end));
  color:#fff;border-radius:13px;padding:14px;font-size:.95rem;font-weight:700;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;}
.btn:hover{filter:brightness(1.06);}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.err{color:#c0392b;font-size:.8rem;margin-top:12px;text-align:center;min-height:1em;font-weight:600;}
.branch{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:22px;font-size:.78rem;color:var(--mute);}
.pill{border:1px solid rgba(10,20,60,.14);background:rgba(255,255,255,.6);border-radius:99px;
  padding:4px 14px;cursor:pointer;transition:.15s;}
.pill.on{border-color:var(--accent);color:var(--accent);font-weight:700;background:#fff;}
.foot{margin-top:26px;font-size:.68rem;color:var(--mute);text-align:center;}

/* ---------- 포털 홈 ---------- */
.portal{display:none;width:100%;max-width:960px;}
.pbar{display:flex;align-items:center;gap:13px;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:18px;padding:14px 20px;backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(20,30,80,.08);}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#7c6ce0);
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;}
.pbar .nm b{font-size:.92rem;}
.pbar .nm small{display:block;font-size:.64rem;color:var(--mute);letter-spacing:.14em;margin-top:-1px;}
.pbar .right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:.8rem;color:var(--sub);}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7c6ce0);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;}
.logout{color:var(--accent);font-weight:700;cursor:pointer;background:none;border:none;font-size:.8rem;font-family:inherit;}
.sec{font-size:.82rem;font-weight:700;color:var(--sub);margin:24px 4px 12px;}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}
.tile{background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:18px 16px;
  cursor:pointer;transition:.15s;text-decoration:none;color:inherit;display:block;position:relative;
  backdrop-filter:blur(14px);box-shadow:0 6px 20px rgba(20,30,80,.06);}
.tile:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(20,30,80,.13);border-color:var(--accent);}
.tile .ic{width:40px;height:40px;border-radius:11px;background:rgba(30,64,175,.09);
  display:flex;align-items:center;justify-content:center;font-size:1.25rem;margin-bottom:11px;}
.tile b{display:block;font-size:.92rem;margin-bottom:2px;}
.tile span{font-size:.72rem;color:var(--mute);}
.tile .newtab{position:absolute;top:14px;right:14px;font-size:.62rem;color:var(--mute);}
.tile.lock{opacity:.5;cursor:default;}
.tile.lock:hover{transform:none;box-shadow:0 6px 20px rgba(20,30,80,.06);border-color:var(--card-border);}
@media(max-width:520px){ .hello{font-size:1.7rem;} }
</style>
</head>
<body>
<div class="mesh"></div>
<div class="wrap">

  <!-- 로그인 화면 -->
  <div id="loginView">
    <div class="eyebrow">BUSINESS MANAGEMENT SYSTEM</div>
    <div class="hello">안녕하세요,<br><span class="brand">푸른노무법인</span>입니다.</div>
    <div class="hello-sub">계정 정보를 입력해 업무 시스템에 진입하세요.</div>

    <div class="card">
      <label for="loginId">아이디</label>
      <div class="inputwrap">
        <span class="ico">👤</span>
        <input type="text" id="loginId" placeholder="아이디 (예: p001@pureun.kr)" autocomplete="username">
      </div>

      <label for="loginPw">비밀번호</label>
      <div class="inputwrap">
        <span class="ico">🔒</span>
        <input type="password" id="loginPw" placeholder="비밀번호" autocomplete="current-password">
        <button class="eye" id="eyeBtn" type="button" title="비밀번호 표시">👁</button>
      </div>

      <div class="row">
        <div class="ck">
          <label><input type="checkbox" id="saveId"> 아이디 저장</label>
          <label><input type="checkbox" id="autoLogin"> 자동 로그인</label>
        </div>
      </div>

      <button class="btn" id="loginBtn">로그인 <span>→</span></button>
      <div class="err" id="errMsg"></div>

      <div class="branch">
        접속 지점
        <span class="pill on" data-branch="천안본사">● 천안 본사</span>
        <span class="pill" data-branch="서산지사">서산</span>
      </div>
    </div>
    <div class="foot">© 2026 푸른노무법인 · 통합 포털 · TLS 1.3 · 256-bit encrypted</div>
  </div>

  <!-- 포털 홈 -->
  <div class="portal" id="portalView">
    <div class="pbar">
      <div class="logo">푸</div>
      <div class="nm"><b>푸른노무법인</b><small>PUREUN · LLF</small></div>
      <div class="right">
        <span id="statusDot">● 모든 시스템 정상</span>
        <div class="avatar" id="userAvatar">·</div>
        <span id="userName">—</span>
        <button class="logout" id="logoutBtn">로그아웃</button>
      </div>
    </div>

    <div class="sec">업무 시스템</div>
    <div class="tiles" id="appTiles"></div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ── Firebase 설정 (ERP와 동일 프로젝트) ──
  var FB_CONFIG = {
    apiKey: 'AIzaSyDkZz5QlKSoqMOYByp5YGeMNLNDrIghliA',
    databaseURL: 'https://pureun-erp-default-rtdb.asia-southeast1.firebasedatabase.app',
    projectId: 'pureun-erp',
    appId: '1:936817166182:web:9bd31f70d0afdf5fca2aa7',
    messagingSenderId: '936817166182'
  };
  firebase.initializeApp(FB_CONFIG);
  var auth = firebase.auth();
  var db = firebase.database();

  // ── 앱 레지스트리 (역할별 노출) ──
  // roles: 이 앱을 볼 수 있는 역할. null = 전원.
  var APPS = [
    { key:'erp',     name:'푸른이알피',   desc:'인사·급여·재무',   icon:'🏢', url:'pu-erp.html',         roles:null },
    { key:'consult', name:'컨설팅 일정',  desc:'정부지원 관리',    icon:'📅', url:'gov-consulting.html', roles:null },
    { key:'cards',   name:'명함첩',       desc:'거래처 연락처',    icon:'📇', url:'pu-cards.html',       roles:null },
    { key:'career',  name:'이력관리',     desc:'개인 이력서',      icon:'🗂', url:'kcareer.html',        roles:null }
  ];

  // ── 유틸 ──
  var $ = function(id){ return document.getElementById(id); };
  function sidToEmail(sid){ return String(sid||'').toLowerCase().replace(/-/g,'') + '@pureun.kr'; }
  function isMobile(){ return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent); }

  // ── 저장된 아이디 복원 ──
  try {
    if(localStorage.getItem('pureun_v6_save_id_flag') === '1'){
      var lastId = localStorage.getItem('pureun_v6_last_login_id') || '';
      if(lastId){ $('loginId').value = lastId; $('saveId').checked = true; }
    }
  } catch(e){}

  // ── 접속 지점 선택 ──
  Array.prototype.forEach.call(document.querySelectorAll('.pill'), function(p){
    p.addEventListener('click', function(){
      document.querySelectorAll('.pill').forEach(function(x){ x.classList.remove('on'); });
      p.classList.add('on');
    });
  });

  // ── 비번 표시 토글 ──
  $('eyeBtn').addEventListener('click', function(){
    var pw = $('loginPw');
    pw.type = (pw.type === 'password') ? 'text' : 'password';
  });

  // ── 에러 표시 ──
  function showErr(msg){ $('errMsg').textContent = msg || ''; }

  // ── 세션 자동 감지: 이미 로그인돼 있으면 포털 바로 표시 ──
  var _handled = false;
  auth.onAuthStateChanged(function(user){
    if(_handled) return;
    if(user){ _handled = true; enterPortal(user); }
  });

  // ── 로그인 실행 ──
  function doLogin(){
    var id = ($('loginId').value || '').trim();
    var pw = $('loginPw').value || '';
    if(!id){ showErr('아이디를 입력하세요.'); return; }
    if(!pw){ showErr('비밀번호를 입력하세요.'); return; }

    // 아이디 → 이메일 (이미 이메일 형태면 그대로, 사번이면 변환)
    var email = (id.indexOf('@') >= 0) ? id.toLowerCase()
              : (/^[A-Za-z]+-?\d+$/.test(id) ? sidToEmail(id) : '');
    if(!email){ showErr('이메일 형식으로 입력하세요. (예: p001@pureun.kr)'); return; }

    $('loginBtn').disabled = true;
    showErr('');

    // 자동 로그인 지속성 설정
    var persistence = $('autoLogin').checked
      ? firebase.auth.Auth.Persistence.LOCAL
      : firebase.auth.Auth.Persistence.SESSION;

    auth.setPersistence(persistence).then(function(){
      return auth.signInWithEmailAndPassword(email, pw);
    }).then(function(cred){
      // 아이디 저장 플래그
      try {
        if($('saveId').checked){
          localStorage.setItem('pureun_v6_save_id_flag','1');
          localStorage.setItem('pureun_v6_last_login_id', id);
        } else {
          localStorage.removeItem('pureun_v6_save_id_flag');
          localStorage.removeItem('pureun_v6_last_login_id');
        }
      } catch(e){}
      _handled = true;
      enterPortal(cred.user);
    }).catch(function(err){
      $('loginBtn').disabled = false;
      var code = (err && err.code) || '';
      if(code === 'auth/wrong-password' || code === 'auth/invalid-credential'){
        showErr('비밀번호가 틀렸습니다.');
      } else if(code === 'auth/user-not-found'){
        showErr('계정을 찾을 수 없습니다. 관리자에게 문의하세요.');
      } else if(code === 'auth/too-many-requests'){
        showErr('로그인 시도가 많습니다. 잠시 후 다시 시도하세요.');
      } else if(code === 'auth/invalid-email'){
        showErr('아이디 형식이 올바르지 않습니다.');
      } else {
        showErr('로그인 실패: ' + (err && err.message ? err.message : code));
      }
    });
  }

  $('loginBtn').addEventListener('click', doLogin);
  $('loginPw').addEventListener('keydown', function(e){ if(e.key === 'Enter') doLogin(); });
  $('loginId').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('loginPw').focus(); });

  // ── 포털 진입: 로그인된 사용자의 계정 정보 조회 후 타일 렌더 ──
  function enterPortal(user){
    $('loginView').style.display = 'none';
    $('portalView').style.display = 'block';

    // user_accounts에서 이 사용자(이메일 매칭) 찾아 이름·역할 표시
    db.ref('data/user_accounts').once('value').then(function(snap){
      var raw = snap.val();
      var list = (raw && raw.v !== undefined) ? raw.v : raw;
      if(list && !Array.isArray(list) && typeof list === 'object'){
        // 객체 형태면 값 배열로
        list = Object.keys(list).map(function(k){ return list[k]; });
      }
      var acct = null;
      if(Array.isArray(list)){
        acct = list.find(function(x){ return x && sidToEmail(x.sid) === (user.email||'').toLowerCase(); });
      }
      renderPortal(acct);
    }).catch(function(){
      renderPortal(null);
    });
  }

  function renderPortal(acct){
    var name = acct ? acct.name : (auth.currentUser && auth.currentUser.email) || '사용자';
    var role = acct ? acct.role : 'member';
    var title = acct ? (acct.title || '') : '';
    $('userName').textContent = name + (title ? ' · ' + title : '') + ' (' + role + ')';
    $('userAvatar').textContent = name ? name.charAt(0) : '·';

    var tiles = $('appTiles');
    tiles.innerHTML = '';
    APPS.forEach(function(app){
      // 역할 제한이 있으면 확인
      if(app.roles && app.roles.indexOf(role) < 0) return;
      var a = document.createElement('a');
      a.className = 'tile';
      a.href = app.url;
      if(!isMobile()){ a.target = '_blank'; a.rel = 'noopener'; }
      a.innerHTML =
        '<div class="ic">' + app.icon + '</div>' +
        '<b>' + app.name + '</b>' +
        '<span>' + app.desc + '</span>' +
        (isMobile() ? '' : '<div class="newtab">새 탭 ↗</div>');
      tiles.appendChild(a);
    });

    // admin 전용: 직원 관리 (ERP 내부 기능 안내용 잠금 타일)
    if(role === 'admin'){
      var lock = document.createElement('div');
      lock.className = 'tile lock';
      lock.innerHTML = '<div class="ic">🔒</div><b>직원 관리</b><span>ERP 내 관리자 메뉴</span>';
      tiles.appendChild(lock);
    }
  }

  // ── 로그아웃 ──
  $('logoutBtn').addEventListener('click', function(){
    auth.signOut().then(function(){ location.reload(); });
  });

})();
</script>
</body>
</html>
