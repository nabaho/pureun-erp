<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홈페이지 관리 v7 — 정리안</title>
<!--
  목업 v7 「정리안」 — 승인용. 구현 아님.
  5차 지시 셋:
   ① 대시보드가 혼란스럽다 — 정보가 너무 섞여 판단이 어렵다
   ② 메인화면(편집칸)의 불필요한 설명을 정리
   ③ 홈페이지에 어떻게 보이는지 알아야 작성할 수 있다 — 줄 변화 없이 일률적이다

  아래 「지금 / 정리 후」 단추로 견주실 수 있습니다.
  자료는 실제 화면(2026-08-23 18:50 확인)에서 가져왔습니다.
-->
<style>
:root{
  --navy:#2E3A8C; --navy-soft:#EEF1FB;
  --ink:#1F2233; --sub:#6E7288; --faint:#9AA0B4;
  --line:#E6E8F0; --line-soft:#F1F3F8;
  --paper:#F7F8FB; --card:#FFF;
  --ok:#2E7D4F; --ok-bg:#EFF9F3;
  --warn:#B26A00; --warn-bg:#FFF8EC;
  --bad:#C43D3D; --bad-bg:#FDF2F2;
  --info:#1D4ED8; --info-bg:#EFF4FF;
}
*{box-sizing:border-box;margin:0}
html{height:100%}
body{height:100%;overflow:hidden;display:flex;flex-direction:column;
  font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--paper);
  color:var(--ink);font-size:14px;line-height:1.7}
header{flex:none;background:var(--navy);color:#fff;display:flex;align-items:center;gap:11px;padding:8px 16px}
header .brand{font-weight:800;font-size:15px}
header .when{font-size:12px;color:#C9D0F0}
header .sp{flex:1}
header select{border:1px solid #ffffff55;background:#ffffff1a;color:#fff;border-radius:7px;
  padding:3px 7px;font-size:12px;font-family:inherit}
header select option{color:#1F2233}
header .hbtn{background:#ffffff22;border:1px solid #ffffff66;color:#fff;border-radius:8px;
  padding:3px 10px;cursor:pointer;font-size:12px;font-family:inherit;font-weight:700;white-space:nowrap}
header .hbtn.pri{background:#fff;color:var(--navy);border-color:#fff}
main{flex:1;min-height:0;width:100%;padding:10px 12px;display:flex;flex-direction:column}
.app{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(31,34,51,.04)}
.btn{border:1px solid #D3D8E4;background:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;
  font-weight:700;cursor:pointer;font-family:inherit;color:#3A3F55;white-space:nowrap}
.btn:hover{background:#FAFBFD}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{padding:3px 9px;font-size:11.5px;border-radius:7px}
.sub{color:var(--sub);font-size:12px}
.body{flex:1;min-height:0;display:flex}

/* ── 왼쪽 기둥 ── */
.rail{width:262px;flex:none;min-height:0;border-right:1px solid var(--line);background:#FCFCFE;
  display:flex;flex-direction:column}
.rail .rh{flex:none;padding:6px 12px;background:#fff;border-bottom:1px solid var(--line);
  font-size:11.5px;font-weight:800;color:var(--faint)}
.dash{flex:none;display:flex;flex-direction:column;gap:4px;padding:6px 8px;
  border-bottom:1px solid var(--line)}

/* ★ 정리 후 — 카드에 «숫자 하나, 상태 한 마디»만. 세부(퇴사·명부없음·남김)는
   목록의 걸러 보기 딱지에 이미 있다. 같은 것을 두 곳에 두면 눈이 어디를 봐야 할지 모른다. */
.dcard{text-align:left;border:1px solid var(--line);border-radius:9px;background:#fff;
  padding:6px 10px;cursor:pointer;font-family:inherit;color:inherit;
  display:flex;align-items:center;gap:8px}
.dcard:hover{border-color:#C6CCE0}
.dcard.on{border-color:var(--navy);background:var(--navy-soft);box-shadow:inset 0 0 0 1px var(--navy)}
.dcard .t{font-size:13px;font-weight:700;color:#3A3F55;white-space:nowrap}
.dcard.on .t{color:var(--navy);font-weight:800}
.dcard .n{margin-left:auto;font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap}
.dcard .n em{font-size:11px;font-weight:700;color:var(--faint);font-style:normal;margin-left:1px}
.dcard .st{flex:none;width:78px;text-align:right}
.mini{font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;white-space:nowrap;
  border:1px solid transparent;display:inline-block}
.mini.hot{background:var(--bad-bg);color:#B42318;border-color:#F3C8C8}
.mini.ok{background:var(--ok-bg);color:#166534;border-color:#BCE5CD}
.mini.none{background:#fff;color:var(--faint);border-color:var(--line)}
.mini.dash{background:#fff;color:var(--faint);border:1px dashed var(--line)}
.mini.flat{background:var(--line-soft);color:var(--sub)}
.mini.rm{background:var(--warn-bg);color:#9A3412;border-color:#F3DCA9}
.mini.ask{background:var(--info-bg);color:var(--info);border-color:#C8D8FB}

/* 지금 화면(견주기용) — 카드가 두 줄 + 딱지 넷 */
.dcard.old{display:block}
.dcard.old .row1{display:flex;align-items:baseline;gap:6px}
.dcard.old .n{margin-left:auto}
.dcard.old .ln{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.dcard.old .chk{border-left:1px dashed #D3D8E4;padding-left:6px;margin-left:2px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--bad);flex:none}

/* 할 일 */
.todo{flex:1;min-height:0;display:flex;flex-direction:column}
.todo .th{flex:none;display:flex;align-items:center;gap:7px;padding:7px 12px;background:#fff;
  border-bottom:1px solid var(--line);font-size:12.5px;font-weight:800}
.todo .th .c{background:var(--bad);color:#fff;border-radius:20px;padding:0 7px;font-size:11px}
.todo .th .c.zero{background:var(--line-soft);color:var(--sub)}
.todo .sc{flex:1;min-height:0;overflow-y:auto;padding:7px 8px 12px}
/* ★ 정리 후 — 할 일 하나가 «한 줄»이다. 이유는 접어 둔다(늘 펼쳐 두면 칸이 글로 찬다). */
.job{border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:8px;background:#fff;
  padding:6px 9px;margin-bottom:5px}
.job.warn{border-left-color:var(--warn)}
.job.info{border-left-color:var(--info)}
.job .h{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800}
.job .h .cnt{margin-left:auto;color:var(--bad);font-weight:800}
.job .who{font-size:12px;color:var(--sub);margin-top:1px}
.job .go{margin-top:5px}
.job details{margin-top:4px}
.job summary{cursor:pointer;font-size:11.5px;color:var(--sub);font-weight:700}
.job details p{font-size:12px;color:#475467;margin-top:4px;line-height:1.7}
/* 지금 화면(견주기용) — 띠가 통째로 글 */
.bar{border-radius:10px;padding:8px 11px;font-size:12.5px;margin-bottom:8px;line-height:1.65}
.bar.bad{background:var(--bad-bg);border:1px solid #F3C8C8;color:#8C2B2B}
.bar.warn{background:var(--warn-bg);border:1px solid #F3DCA9;color:#7C4A03}
.bar.ok{background:var(--ok-bg);border:1px solid #BCE5CD;color:#1E5631}
.bar b{font-weight:800}

/* 목록 */
.list{width:392px;flex:none;min-height:0;border-right:1px solid var(--line);background:#FCFCFE;
  display:flex;flex-direction:column}
.list .lh{flex:none;display:flex;align-items:center;gap:8px;padding:7px 12px;
  border-bottom:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--sub)}
.list .lh b{color:var(--ink)}
.chips{flex:none;display:flex;gap:5px;flex-wrap:wrap;padding:6px 12px 7px;
  border-bottom:1px solid var(--line);background:#fff}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:2px 9px;font-size:11px;
  font-weight:800;color:var(--sub);cursor:pointer;font-family:inherit}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .c{opacity:.65;margin-left:3px}
.list .sc{flex:1;min-height:0;overflow-y:auto}
.list .r{display:flex;align-items:center;gap:9px;padding:9px 12px;
  border-bottom:1px solid var(--line-soft);min-height:58px;cursor:pointer}
.list .r.on{background:#fff;box-shadow:inset 3px 0 0 var(--navy)}
.list .nm{font-weight:700;font-size:14px}
.list .po{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .who{min-width:0;flex:1}
.tags{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;margin-left:auto}
.num{width:19px;flex:none;text-align:right;color:var(--faint);font-size:12px;font-weight:800}
.pill{font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px;white-space:nowrap}
.pill.same{background:var(--line-soft);color:var(--sub)}
.pill.rm{background:var(--warn-bg);color:#9A3412;border:1px solid #F3DCA9}
.pill.ask{background:var(--info-bg);color:var(--info);border:1px solid #C8D8FB}
.pill.keep{background:var(--ok-bg);color:#166534;border:1px solid #BCE5CD}
.pill.toRemove{background:var(--warn-bg);color:#9A3412;border:1px solid #F3DCA9}

/* 편집칸 */
.edit{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff}
.ehd{flex:none;padding:10px 16px 0}
.esc{flex:1;min-height:0;overflow-y:auto;padding:10px 16px 14px}
.eft{flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 16px;
  border-top:1px solid var(--line);background:#FCFCFE}
/* ★ 정리 후 — 늘 뜨는 설명은 «한 줄 + 접기»다. 네 줄짜리 파란 띠를 매번 읽지 않는다. */
.note1{display:flex;align-items:center;gap:8px;border:1px solid #C8D8FB;background:var(--info-bg);
  color:#1E3A8A;border-radius:8px;padding:6px 11px;font-size:12.5px;margin-bottom:9px}
.note1 b{font-weight:800}
.note1 details{margin-left:auto}
.note1 summary{cursor:pointer;font-size:11.5px;font-weight:800;color:#1E40AF;white-space:nowrap}
.why{border:1px solid var(--line);background:#FAFBFD;border-radius:8px;padding:9px 11px;
  font-size:12.5px;line-height:1.75;margin-bottom:9px}
.fld{margin-bottom:12px}
.fld > label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;
  color:var(--sub);margin-bottom:5px;flex-wrap:wrap}
.fld > label .tip{font-weight:700;color:var(--faint)}
.fld textarea{width:100%;border:1px solid #D3D8E4;border-radius:8px;padding:8px 11px;
  font-size:13.5px;font-family:inherit;color:var(--ink);line-height:1.75;resize:vertical}

/* ★ 홈페이지 화면 그대로 보기 — 줄마다 «생김새»를 달리한다(5차 지시 ③).
   소제목·구획번호·연락처가 본문과 같은 모양이면 어디가 어디인지 알 수 없다. */
.rows{border:1px solid #D3D8E4;border-radius:9px;background:#fff;overflow:hidden;font-size:13.5px}
.rows .l{display:flex;gap:9px;padding:5px 11px;border-bottom:1px solid var(--line-soft)}
.rows .l:last-child{border-bottom:0}
.rows .n{width:20px;flex:none;text-align:right;color:#C3C8D6;font-size:11px;font-weight:800;
  font-variant-numeric:tabular-nums;padding-top:2px}
.rows .t{flex:1;min-width:0;word-break:break-word}
.rows .l.head{background:#FBFCFE}
.rows .l.head .t{font-weight:800;color:var(--navy);font-size:14px}
.rows .l.sec .t{font-weight:800;color:var(--warn);font-size:12px;letter-spacing:.4px}
.rows .l.tel .t{color:var(--sub);font-size:12.5px}
.rows .l.long .t{color:var(--ink)}
.legend2{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px;font-size:11.5px;color:var(--faint)}
.legend2 b{font-weight:800}

.foot{flex:none;display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:6px 14px;
  border-top:1px solid var(--line);background:#fff;font-size:11.5px;color:#475467}
.foot .sp{flex:1}
.mk{border:1px dashed #C6CCE0;border-radius:7px;padding:2px 9px;font-size:11.5px;color:var(--sub);
  background:#FAFBFD;cursor:pointer;font-family:inherit;font-weight:800}
.mk.on{border-style:solid;border-color:var(--navy);color:var(--navy);background:var(--navy-soft)}
</style>
</head>
<body>
<header>
  <div class="brand">푸 홈페이지 관리</div>
  <span class="when">홈페이지 확인: 2026-08-23 18:50</span>
  <div class="sp"></div>
  <label class="when">줄 모양 <select><option>줄바꿈만 (기본)</option><option>줄마다 감싸기</option></select></label>
  <button class="hbtn pri">홈페이지 다시 확인</button>
  <button class="hbtn">홈페이지 열기</button>
  <span class="when">권형하</span><button class="hbtn">로그아웃</button>
</header>
<main>
<div class="app">
  <div class="body">
    <div class="rail">
      <div class="rh" id="railHead">무엇을 볼까</div>
      <div class="dash" id="dash"></div>
      <div class="todo">
        <div class="th">지금 할 일 <span class="c" id="todoN">3</span>
          <span class="sp" style="flex:1"></span>
          <span class="sub">18:50 확인</span></div>
        <div class="sc" id="todoBody"></div>
      </div>
    </div>
    <div class="list">
      <div class="lh" id="lh"></div>
      <div class="chips" id="chips"></div>
      <div class="sc" id="rows"></div>
    </div>
    <div class="edit" id="edit"></div>
  </div>
  <div class="foot">
    <span class="sub" id="footNote"></span>
    <span class="sp"></span>
    <button class="mk" id="mkBtn">보기: 정리 후</button>
  </div>
</div>
</main>

<script>
/* ══ 목업 자료 — 실제 화면(2026-08-23 18:50)에서 가져왔다 ══ */
var CLEAN = true;      // 정리 후 / 지금
var G = 'work';        // 고른 갈래 (실제 화면처럼 주요업무를 열어 둔다)

var GROUPS = [
  { k:'members',  l:'구성원 소개', u:'명', n:9,  hot:2,
    own:[['rm','퇴사 2'],['ask','명부에 없음 1'],['ok','남김 1']], chk:'손댈 것 2' },
  { k:'work',     l:'주요업무',    u:'쪽', n:6,  hot:0, own:[], chk:'홈페이지와 같음' },
  { k:'inquiry',  l:'오시는길',    u:'쪽', n:1,  hot:0, own:[], chk:'홈페이지와 같음' },
  { k:'greeting', l:'인사말',      u:'쪽', n:1,  hot:0, own:[], chk:'홈페이지와 같음' },
  { k:'partner',  l:'자문사현황',  u:'개사', n:0, hot:1, own:[['flat','업체관리 371']],
    chk:'대조 못 함 (그림)', notext:1 }
];

/* 정리 후 — 카드에 상태 «한 마디»만 */
function statusChip(g) {
  if (g.hot) return '<span class="mini hot">할 일 ' + g.hot + '</span>';
  if (g.notext) return '<span class="mini dash">대조 못 함</span>';
  return '<span class="mini ok">이상 없음</span>';
}
function dashHtml() {
  return GROUPS.map(function (g) {
    if (CLEAN) {
      return '<button class="dcard' + (G === g.k ? ' on' : '') + '" onclick="go(\'' + g.k + '\')">'
        + '<span class="t">' + g.l + '</span>'
        + '<span class="n">' + g.n + '<em>' + g.u + '</em></span>'
        + '<span class="st">' + statusChip(g) + '</span></button>';
    }
    /* 지금 화면 — 딱지가 넷까지 붙는다(「none」은 실제로 찍히던 버그다) */
    var own = g.own.map(function (o) {
      var label = o[1].replace('명부에 없음', 'none');
      return '<span class="mini ' + o[0] + '">' + label + '</span>';
    }).join('') || '<span class="mini flat">이상 없음</span>';
    return '<button class="dcard old' + (G === g.k ? ' on' : '') + '" onclick="go(\'' + g.k + '\')">'
      + '<div class="row1">' + (g.hot ? '<span class="dot"></span>' : '')
      + '<span class="t">' + g.l + '</span>'
      + '<span class="n">' + g.n + '<em>' + g.u + '</em></span></div>'
      + '<div class="ln"><span>' + own + '</span>'
      + '<span class="chk"><span class="mini ' + (g.hot ? 'hot' : 'ok') + '">' + g.chk
      + '</span></span></div></button>';
  }).join('');
}

/* ── 할 일 ── */
var JOBS = [
  { cls:'', t:'퇴사한 노무사가 홈페이지에 남아 있습니다', n:1, who:'박성수 (명부 퇴사 2026-06-30)',
    go:'박성수 열기',
    why:'홈페이지 관리자 화면 → 구성원 갤러리에서 그 글을 찾아 <b>삭제하지 말고 「비공개」</b>로 '
       + '바꾸십시오. 잘못 내렸어도 되살릴 수 있습니다. 그 뒤 「홈페이지 다시 확인」을 누르면 '
       + '딱지가 「내려감」으로 바뀝니다.' },
  { cls:'info', t:'명부에 없는 사람', n:1, who:'조현범 (대전지사장)', go:'조현범 열기',
    why:'푸른ERP 직원 명부에서 이름을 찾지 못했습니다. 지사장처럼 고용관계가 아닌 분이면 '
       + '「홈페이지에 남기기」로 사유를 남겨 두십시오 — 그러면 다음부터 조용해집니다.' },
  { cls:'warn', t:'자문이 끝났는데 홈페이지에 남은 곳', n:1, who:'삼정테크 (2026-03-31)',
    go:'이 회사 열기',
    why:'업체관리에서 거래가 끝났는데 「올림」으로 표시돼 있습니다. 끝난 뒤에도 실적으로 '
       + '남겨 두는 곳이 있어 알리기만 합니다.' }
];
function todoHtml() {
  if (CLEAN) {
    return JOBS.map(function (j) {
      return '<div class="job ' + j.cls + '">'
        + '<div class="h">' + j.t + '<span class="cnt">' + j.n + '</span></div>'
        + '<div class="who">' + j.who + '</div>'
        + '<div class="go"><button class="btn sm">' + j.go + '</button></div>'
        + '<details><summary>어떻게 하면 되나</summary><p>' + j.why + '</p></details>'
        + '</div>';
    }).join('');
  }
  /* 지금 화면 — 띠가 통째로 글이고, 할 일이 아닌 것(남김)도 자리를 차지한다 */
  return '<div class="bar warn"><b>푸른ERP 명부와 다른 사람 — 퇴사 2명</b><br>'
    + '홈페이지에 아직 올라가 있는 사람은 아래에 따로 적습니다.'
    + '<div style="margin-top:6px"><button class="btn sm">퇴사한 사람만 보기</button></div></div>'
    + '<div class="bar ok"><b>홈페이지에 남기기로 한 사람 1명</b><br>'
