<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홈페이지 관리 v5 — 화면 전체 · 대시보드 · 한 화면</title>
<!--
  목업 v5 — 승인용. 구현 아님.
  v4(승인·현재 배포판) 에서 바뀌는 것 넷:
   ① 폭 붙박이(1320px) 해제 → 화면 전체를 쓴다. 남은 폭으로 오른쪽 「할 일」 칸을 세운다.
   ② 갈래 탭 → 대시보드 카드. 카드가 «곧 갈래 고르기»다 (따로 대시보드 화면을 만들지 않는다).
   ③ 안내 띠(최대 34% 높이) → 오른쪽 「할 일」 칸으로 옮긴다. 몸통이 눌리지 않는다.
   ④ 맨 아래 딱지 안내 → «누르면 걸러지는» 딱지로. 설명만 하던 줄이 일을 한다.
  색·글꼴·딱지 모양은 v4 그대로 쓴다 — 새로 만들지 않았다.
-->
<style>
:root{
  --navy:#2E3A8C; --navy-soft:#EEF1FB;
  --ink:#1F2233; --sub:#6E7288; --faint:#9AA0B4;
  --line:#E6E8F0; --line-soft:#F1F3F8;
  --paper:#F7F8FB; --card:#FFF;
  --ok:#2E7D4F; --ok-bg:#EFF9F3;
  --warn:#B26A00; --warn-bg:#FFF8EC;
  --bad:#C43D3D; --bad-bg:#FDF2F2;
  --info:#1D4ED8; --info-bg:#EFF4FF;
}
*{box-sizing:border-box;margin:0}
html{height:100%}
body{height:100%;overflow:hidden;display:flex;flex-direction:column;
  font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--paper);
  color:var(--ink);font-size:14px;line-height:1.7}
header{flex:none;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px}
header .brand{font-weight:800;font-size:15px}
header .when{font-size:12px;color:#C9D0F0}
header .sp{flex:1}
header .who{font-size:12px;display:flex;align-items:center;gap:9px}
header select{border:1px solid #ffffff55;background:#ffffff1a;color:#fff;border-radius:7px;
  padding:3px 7px;font-size:12px;font-family:inherit}
header select option{color:#1F2233}
header .out,header .hbtn{background:#ffffff22;border:1px solid #ffffff66;color:#fff;border-radius:8px;
  padding:3px 10px;cursor:pointer;font-size:12px;font-family:inherit;font-weight:700;white-space:nowrap}
header .hbtn.pri{background:#fff;color:var(--navy);border-color:#fff}

/* ★ 폭 붙박이를 풀었다 — 화면 전체를 쓴다 */
main{flex:1;min-height:0;width:100%;padding:10px 12px;display:flex;flex-direction:column}
.app{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(31,34,51,.04)}

.btn{border:1px solid #D3D8E4;background:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;
  font-weight:700;cursor:pointer;font-family:inherit;color:#3A3F55;white-space:nowrap}
.btn:hover{background:#FAFBFD}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{padding:3px 9px;font-size:11.5px;border-radius:7px}
.btn.keep{border-color:#BCE5CD;background:var(--ok-bg);color:#166534}
.sub{color:var(--sub);font-size:12px}

/* ── ② 대시보드 = 갈래 고르기 ──
   숫자 둘을 «갈라» 적는다: 명부 기준(화면 열면 바로) / 대조 기준(확인을 눌러야).
   섞어 한 숫자로 뭉치면 「확인 안 눌렀는데 0건」이 「깨끗하다」로 읽힌다. */
.dash{flex:none;display:flex;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line);
  background:#FCFCFE;overflow-x:auto}
.dcard{flex:1 1 0;min-width:186px;max-width:320px;text-align:left;border:1px solid var(--line);
  border-radius:12px;background:#fff;padding:8px 11px 9px;cursor:pointer;font-family:inherit;
  color:inherit;display:flex;flex-direction:column;gap:3px;position:relative}
.dcard:hover{border-color:#C6CCE0}
.dcard.on{border-color:var(--navy);background:var(--navy-soft);box-shadow:inset 0 0 0 1px var(--navy)}
.dcard.off{opacity:.55;cursor:default;background:#FAFBFD}
.dcard .t{font-size:12.5px;font-weight:800;color:var(--sub);display:flex;align-items:center;gap:6px}
.dcard.on .t{color:var(--navy)}
.dcard .dot{width:6px;height:6px;border-radius:50%;background:var(--bad);flex:none}
.dcard .n{font-size:21px;font-weight:800;letter-spacing:-.5px;line-height:1.25}
.dcard .n em{font-size:12.5px;font-weight:700;color:var(--sub);font-style:normal;margin-left:2px}
.dcard .st{display:flex;gap:5px;flex-wrap:wrap;min-height:19px}
.mini{font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;white-space:nowrap;
  border:1px solid transparent}
.mini.rm{background:var(--warn-bg);color:#9A3412;border-color:#F3DCA9}
.mini.ask{background:var(--info-bg);color:var(--info);border-color:#C8D8FB}
.mini.bad{background:var(--bad-bg);color:#B42318;border-color:#F3C8C8}
.mini.ok{background:var(--ok-bg);color:#166534;border-color:#BCE5CD}
.mini.flat{background:var(--line-soft);color:var(--sub)}
.mini.none{background:#fff;color:var(--faint);border-color:var(--line)}

/* ── 몸통: 3칸, 높이 붙박이 ── */
.body{flex:1;min-height:0;display:flex}

/* 목록 */
.list{width:330px;flex:none;min-height:0;border-right:1px solid var(--line);background:#FCFCFE;
  display:flex;flex-direction:column}
.list .lh{flex:none;display:flex;align-items:center;gap:8px;padding:7px 12px;
  border-bottom:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--sub)}
.list .lh b{color:var(--ink)}
.list .lh .hot{color:var(--bad)}
/* ④ 누르면 걸러지는 딱지 */
.chips{flex:none;display:flex;gap:5px;flex-wrap:wrap;padding:6px 12px 7px;
  border-bottom:1px solid var(--line);background:#fff}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:2px 9px;font-size:11px;
  font-weight:800;color:var(--sub);cursor:pointer;font-family:inherit}
.chip:hover{border-color:#C6CCE0}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .c{opacity:.65;margin-left:3px}
.list .sc{flex:1;min-height:0;overflow-y:auto}
.list .r{display:flex;align-items:center;gap:9px;padding:9px 12px;
  border-bottom:1px solid var(--line-soft);min-height:60px;cursor:pointer}
.list .r:hover{background:#fff}
.list .r.on{background:#fff;box-shadow:inset 3px 0 0 var(--navy)}
.list .who{min-width:0;flex:1}
.list .nm{font-weight:700;font-size:14px}
.list .po{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;margin-left:auto}
.num{width:19px;flex:none;text-align:right;color:var(--faint);font-size:12px;font-weight:800;
  font-variant-numeric:tabular-nums;user-select:none}

/* 편집칸 — 머리·발 고정, 가운데만 구른다 (v4 그대로) */
.edit{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff}
.ehd{flex:none;padding:11px 16px 0}
.esc{flex:1;min-height:0;overflow-y:auto;padding:11px 16px 14px}
.eft{flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 16px;
  border-top:1px solid var(--line);background:#FCFCFE}

/* ── ③ 오른쪽 「할 일」 칸 — 안내 띠가 몸통 높이를 먹지 않게 ── */
.todo{width:330px;flex:none;min-height:0;border-left:1px solid var(--line);background:#FCFCFE;
  display:flex;flex-direction:column}
.todo .th{flex:none;display:flex;align-items:center;gap:7px;padding:7px 12px;background:#fff;
  border-bottom:1px solid var(--line);font-size:12.5px;font-weight:800}
.todo .th .c{background:var(--bad);color:#fff;border-radius:20px;padding:0 7px;font-size:11px}
.todo .th .c.zero{background:var(--line-soft);color:var(--sub)}
.todo .sc{flex:1;min-height:0;overflow-y:auto;padding:9px 10px 12px}
.bar{border-radius:10px;padding:8px 11px;font-size:12.5px;margin-bottom:8px;line-height:1.65}
.bar.bad{background:var(--bad-bg);border:1px solid #F3C8C8;color:#8C2B2B}
.bar.warn{background:var(--warn-bg);border:1px solid #F3DCA9;color:#7C4A03}
.bar.ok{background:var(--ok-bg);border:1px solid #BCE5CD;color:#1E5631}
.bar.info{background:var(--info-bg);border:1px solid #C8D8FB;color:#1E3A8A}
.bar b{font-weight:800}
.bar .go{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.bar details{margin-top:5px}
.bar summary{cursor:pointer;font-weight:800;font-size:12px}
.bar ol{margin:5px 0 0;padding-left:18px}
.band{border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:8px;line-height:1.65}
.band.rm{background:var(--warn-bg);border:1px solid #F3DCA9;color:#7C2D12}
.band.keep{background:var(--ok-bg);border:1px solid #BCE5CD;color:#14532D}
.band.ask{background:var(--info-bg);border:1px solid #C8D8FB;color:#1E3A8A}
.band b{font-weight:800}
.band .sm{color:var(--sub);font-size:11.5px}

/* 딱지 (v4 그대로) */
.pill{font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px;white-space:nowrap}
.pill.same{background:var(--line-soft);color:var(--sub)}
.pill.pending{background:var(--bad-bg);color:#B42318;border:1px solid #F3C8C8}
.pill.toAdd{background:var(--info-bg);color:var(--info);border:1px solid #C8D8FB}
.pill.toRemove{background:var(--warn-bg);color:#9A3412;border:1px solid #F3DCA9}
.pill.liveOnly{background:var(--warn-bg);color:#9A3412;border:1px solid #F3DCA9}
.pill.done{background:var(--ok-bg);color:#166534;border:1px solid #BCE5CD}
.pill.noBase{background:var(--info-bg);color:var(--info);border:1px solid #C8D8FB}
.pill.none{background:#fff;color:var(--faint);border:1px solid var(--line)}
.pill.keep{background:var(--ok-bg);color:#166534;border:1px solid #BCE5CD}
.pill.rm{background:var(--warn-bg);color:#9A3412;border:1px solid #F3DCA9}
.pill.ask{background:var(--info-bg);color:var(--info);border:1px solid #C8D8FB}

.fld{margin-bottom:12px}
.fld > label{display:block;font-size:12px;font-weight:800;color:var(--sub);margin-bottom:4px}
.fld input,.fld textarea{width:100%;border:1px solid #D3D8E4;border-radius:8px;padding:7px 11px;
  font-size:14px;font-family:inherit;color:var(--ink);background:#fff}
.fld textarea{resize:vertical;line-height:1.7;font-size:13.5px}
.two{display:flex;gap:11px}
.two>div{flex:1;min-width:0}
.car{border:1px solid #D3D8E4;border-radius:9px;background:#fff;padding:4px}
.car .l{display:flex;align-items:center;gap:5px;padding:3px 4px;border-bottom:1px solid var(--line-soft)}
.car .l:last-child{border-bottom:0}
.car .l input{flex:1;min-width:0;border:1px solid transparent;border-radius:6px;padding:5px 7px;
  font-size:13.5px;font-family:inherit;color:var(--ink)}
.car .l input:focus{border-color:var(--navy);outline:none}
.car .l .no{width:20px;flex:none;text-align:right;color:var(--faint);font-size:11.5px;font-weight:800}
.car .l .x{border:none;background:none;color:var(--sub);cursor:pointer;font-size:13px;padding:2px 5px}
.car .add{color:var(--navy);font-weight:700;font-size:12.5px;padding:6px 8px;cursor:pointer}
.rows{border:1px solid #D3D8E4;border-radius:9px;background:#fff;overflow:hidden;font-size:13.5px}
.rows .l{display:flex;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line-soft)}
.rows .l:last-child{border-bottom:0}
.rows .n{width:20px;flex:none;text-align:right;color:var(--faint);font-size:11.5px;font-weight:800}
.rows .t{flex:1;min-width:0;word-break:break-word}
.rows .l.head .t{font-weight:800;color:var(--navy)}
.guide{background:#FAFBFD;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  margin-top:11px;font-size:12.5px;line-height:1.85}
.guide ol{margin:5px 0 0;padding-left:18px}
.kbd{background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11.5px;font-weight:700}
.empty{padding:36px 18px;text-align:center;color:var(--sub)}

/* 맨 아래 한 줄 — 늘 하는 말은 여기 한 번만 적는다 */
.foot{flex:none;display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:6px 14px;
  border-top:1px solid var(--line);background:#fff;font-size:11.5px;color:#475467}
.foot .sp{flex:1}
.mk{border:1px dashed #C6CCE0;border-radius:7px;padding:1px 8px;font-size:11px;color:var(--sub);
  background:#FAFBFD;cursor:pointer;font-family:inherit;font-weight:700}
.mk.on{border-style:solid;border-color:var(--navy);color:var(--navy);background:var(--navy-soft)}

/* 좁은 화면 — 오른쪽 「할 일」 칸을 접고, 더 좁으면 위아래로 세운다 */
@media(max-width:1500px){ .todo{width:296px} .list{width:306px} }
@media(max-width:1240px){ .todo{display:none} .todo.show{display:flex;position:absolute;right:12px;
  top:120px;bottom:24px;width:330px;z-index:9;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 8px 30px rgba(31,34,51,.18)} }
@media(max-width:900px){
  html,body{height:auto} body{overflow:auto;display:block}
  main{display:block;padding:8px 8px 40px} .app{display:block}
  .dash{flex-wrap:wrap} .dcard{min-width:44%}
  .body{display:block} .list{width:auto;border-right:0;border-bottom:1px solid var(--line);display:block}
  .list .sc{max-height:46vh} .edit{display:block} .esc{overflow:visible}
  .todo{display:block;width:auto;border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<header>
  <div class="brand">푸 홈페이지 관리</div>
  <span class="when" id="hWhen">홈페이지 확인: 아직 안 함</span>
  <div class="sp"></div>
  <label class="when">줄 모양
    <select><option>줄바꿈만 (기본)</option><option>줄마다 감싸기</option></select></label>
  <button class="hbtn pri">홈페이지 다시 확인</button>
  <button class="hbtn">홈페이지 열기</button>
  <div class="who">권형하 <button class="out">로그아웃</button></div>
</header>

<main>
<div class="app">
  <div class="dash" id="dash"></div>
  <div class="body">
    <div class="list">
      <div class="lh" id="lh"></div>
      <div class="chips" id="chips"></div>
      <div class="sc" id="rows"></div>
    </div>
    <div class="edit" id="edit"></div>
    <div class="todo" id="todo">
      <div class="th">지금 할 일 <span class="c" id="todoN">0</span>
        <span class="sp" style="flex:1"></span>
        <span class="sub" id="todoWhen"></span></div>
      <div class="sc" id="todoBody"></div>
    </div>
  </div>
  <div class="foot">
    <span class="pill rm">퇴사 (명부)</span><span class="pill ask">명부에 없음</span><span class="pill keep">남김</span>
    <span class="sub">← 명부만 보고 바로 붙음</span>
    <span class="pill same">같음</span><span class="pill pending">안 올라감</span>
    <span class="pill toAdd">새로 올릴 것</span><span class="pill toRemove">내릴 것</span>
    <span class="pill liveOnly">홈페이지에만</span><span class="pill done">내려감</span>
    <span class="sub">← 「홈페이지 다시 확인」을 누를 때만</span>
    <span class="sp"></span>
    <span class="sub">홈페이지는 자동으로 바뀌지 않습니다 — 붙여넣기 한 번은 사람이 합니다.</span>
    <button class="mk" id="mkBtn">목업 보기: 대조 전</button>
  </div>
</div>
</main>

<script>
/* ══ 목업 자료 (실제 화면과 같은 이름·직책. 판단 로직은 없다) ══ */
var CHECKED = false;               // 「홈페이지 다시 확인」을 눌렀는지 — 두 상태를 보여준다
var GROUP = 'members', PICK = 1, FILTER = '';

var MEMBERS = [
  { no:1, name:'권형하', desc:'대표 · 공인노무사', srl:'190', roster:'', after:'same' },
  { no:2, name:'박성수', desc:'공인노무사', srl:'181', roster:'left:퇴사 2026-06-30', after:'toRemove' },
  { no:3, name:'박한별', desc:'공인노무사', srl:'176', roster:'', after:'same' },
  { no:4, name:'김혜민', desc:'공인노무사', srl:'170', roster:'', after:'pending' },
  { no:5, name:'박재원', desc:'공인노무사', srl:'', roster:'', after:'toAdd' },
  { no:6, name:'임혜미', desc:'공인노무사', srl:'158', roster:'left:퇴사 2026-05-22', after:'done' },
  { no:7, name:'김동현', desc:'공인노무사', srl:'151', roster:'', after:'same' },
  { no:8, name:'장한돌', desc:'세종지사장 · 공인노무사', srl:'140', roster:'left:퇴사 2023-12-31',
    kept:'지사장 — 고용관계가 아니라 홈페이지에 남김', after:'same' },
  { no:9, name:'조현범', desc:'대전지사장 · 공인노무사', srl:'133', roster:'ask:명부에 없음', after:'same' },
  { no:10, name:'(홈페이지에만)', desc:'홈페이지 글 번호 205', srl:'205', roster:'', after:'liveOnly', ghost:true }
];
var PAGES = {
  work: [ ['자문서비스','/work1','same'], ['인사노무컨설팅','/work2','pending'],
          ['노동사건대리','/work3','same'], ['산재보상','/work4','noBase'],
          ['사내근로복지기금','/work5a','same'], ['공동근로복지기금','/work5b','same'] ],
  inquiry: [ ['오시는길','/inquiry','same'] ],
  greeting: [ ['인사말','/greeting','pending'] ]
};
var CAREERS = ['現 푸른노무법인대표','現 충남 공무직인사위원회 위원','現 충남 노동정책 추진단위원',
  '現 충남 노사민정협의회 분과의원','現 한국토지주택공사 안전보건 긴급상담위원','現 충남북부 상공회의소 자문위원'];
var TXT = { same:'같음', pending:'안 올라감', toAdd:'새로 올릴 것', toRemove:'내릴 것 (퇴사)',
  liveOnly:'홈페이지에만', done:'내려감 (퇴사 완료)', noBase:'기준 없음' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,
  function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function st(m){ return CHECKED ? m.after : ''; }

function rowsOf(g){
  if (g === 'members') return MEMBERS.filter(function(m){ return CHECKED || !m.ghost; })
    .map(function(m){ return { key:m.no, name:m.name, desc:m.desc, status:st(m),
      roster:m.roster, kept:m.kept, ghost:m.ghost }; });
  return (PAGES[g]||[]).map(function(p,i){ return { key:100+i, name:p[0], desc:p[1],
    status: CHECKED ? p[2] : '', roster:'', kept:'' }; });
}
function filtered(g){
  var rows = rowsOf(g);
  if (!FILTER) return rows;
  if (FILTER === 'rm') return rows.filter(function(r){ return /^left:/.test(r.roster||''); });
  if (FILTER === 'todo') return rows.filter(function(r){
    return r.status && r.status!=='same' && r.status!=='done'; });
  return rows.filter(function(r){ return r.status === FILTER; });
}

/* ── ② 대시보드 카드 = 갈래 고르기 ── */
function dashHtml(){
  var cards = [
    { key:'members', label:'구성원 소개', unit:'명' },
    { key:'work',    label:'주요업무',    unit:'쪽' },
    { key:'inquiry', label:'오시는길',    unit:'쪽' },
    { key:'greeting',label:'인사말',      unit:'쪽' }
  ].map(function(c){
    var rows = rowsOf(c.key), mini = [];
    if (c.key === 'members') {
      var left = rows.filter(function(r){ return /^left:/.test(r.roster||''); }).length;
      var ask  = rows.filter(function(r){ return /^ask:/.test(r.roster||''); }).length;
      var kept = rows.filter(function(r){ return r.kept; }).length;
      if (left) mini.push('<span class="mini rm">퇴사 '+left+'</span>');
      if (ask)  mini.push('<span class="mini ask">명부에 없음 '+ask+'</span>');
      if (kept) mini.push('<span class="mini ok">남김 '+kept+'</span>');
    }
    if (!CHECKED) {
      mini.push('<span class="mini none">대조 안 함</span>');
    } else {
      var hot = rows.filter(function(r){ return r.status && r.status!=='same' && r.status!=='done'; }).length;
      mini.push(hot ? '<span class="mini bad">손댈 것 '+hot+'</span>'
                    : '<span class="mini ok">홈페이지와 같음</span>');
    }
    var hotAny = CHECKED && rows.some(function(r){
      return r.status && r.status!=='same' && r.status!=='done'; });
    return '<button class="dcard'+(GROUP===c.key?' on':'')+'" onclick="go(\''+c.key+'\')">'
      + '<div class="t">'+(hotAny?'<span class="dot"></span>':'')+esc(c.label)+'</div>'
      + '<div class="n">'+rows.length+'<em>'+c.unit+'</em></div>'
      + '<div class="st">'+mini.join('')+'</div></button>';
  }).join('');
  return cards
    + '<div class="dcard off"><div class="t">자문사현황</div>'
    + '<div class="n">—</div><div class="st"><span class="mini flat">다음 판</span></div></div>';
}

/* ── ④ 누르면 걸러지는 딱지 ── */
function chipsHtml(){
  var rows = rowsOf(GROUP);
  var defs = [{ k:'', label:'전체' }];
  if (GROUP === 'members') {
    var left = rows.filter(function(r){ return /^left:/.test(r.roster||''); }).length;
    if (left) defs.push({ k:'rm', label:'퇴사 (명부)', n:left });
  }
  if (CHECKED) {
    var hot = rows.filter(function(r){ return r.status && r.status!=='same' && r.status!=='done'; }).length;
    defs.push({ k:'todo', label:'손댈 것', n:hot });
    ['pending','toAdd','toRemove','liveOnly','noBase','same','done'].forEach(function(s){
      var n = rows.filter(function(r){ return r.status===s; }).length;
      if (n) defs.push({ k:s, label:TXT[s], n:n });
    });
  }
  return defs.map(function(d){
    return '<button class="chip'+(FILTER===d.k?' on':'')+'" onclick="filt(\''+d.k+'\')">'
      + esc(d.label) + (d.n!=null?'<span class="c">'+d.n+'</span>':'') + '</button>';
  }).join('') + (CHECKED ? '' :
    '<span class="sub" style="margin-left:2px">확인을 누르면 딱지별로 걸러 볼 수 있습니다</span>');
}

function lhHtml(){
  var rows = rowsOf(GROUP), show = filtered(GROUP);
  var head, add = '';
  if (GROUP === 'members') {
    var left = rows.filter(function(r){ return /^left:/.test(r.roster||''); }).length;
    head = '구성원 <b>'+rows.length+'명</b>'+(left?' · <b class="hot">퇴사 '+left+'</b>':'');
    add = '<button class="btn sm">＋ 새 구성원</button>';
  } else if (GROUP === 'work') {
    head = '관리 중인 쪽 <b>'+rows.length+'개</b>';
    add = '<button class="btn sm">＋ 쪽 추가</button>';
  } else { head = '쪽 <b>'+rows.length+'개</b>'; }
  if (FILTER) head += ' <span class="sub">· 걸러서 '+show.length+'건</span>';
  return '<span>'+head+'</span><span style="flex:1"></span>'+add;
}

function rosterPill(r){
  if (r.kept) return '<span class="pill keep">남김</span>';
  if (!r.roster) return '';
  var p = r.roster.split(':');
  return '<span class="pill '+(p[0]==='left'?'rm':'ask')+'">'+esc(p[1])+'</span>';
}
function rowsHtml(){
  var rows = filtered(GROUP);
  if (!rows.length) return '<div class="empty">이 딱지에 해당하는 줄이 없습니다.</div>';
  return rows.map(function(r,i){
    var line = [r.desc, r.kept||''].filter(Boolean).join(' · ');
    return '<div class="r'+(r.key===PICK?' on':'')+'" onclick="pick('+r.key+')">'
      + '<span class="num">'+(i+1)+'</span>'
      + '<div class="who"><div class="nm">'+esc(r.name)+'</div>'
      + '<div class="po" title="'+esc(line)+'">'+esc(line)+'</div></div>'
      + '<span class="tags">'+rosterPill(r)
      + '<span class="pill '+(r.status||'none')+'">'
      + esc(r.status?TXT[r.status]:'확인 전')+'</span></span></div>';
  }).join('');
}

/* ── 편집칸 ── */
function editHtml(){
  if (GROUP !== 'members') return pageEditHtml();
  var m = MEMBERS.filter(function(x){ return x.no===PICK; })[0] || MEMBERS[0];
  if (m.ghost) {
    return '<div class="ehd"><div class="band rm"><b>홈페이지에만 있는 글입니다</b> — 글 번호 '
      + esc(m.srl) + '<br><span class="sm">통합시스템에는 이 사람 자료가 없습니다. 홈페이지에서 '
      + '내리거나(비공개), <b>＋ 새 구성원</b>으로 넣고 글 번호를 적어 주십시오.</span></div></div>'
      + '<div class="esc"><div class="empty">고칠 우리 자료가 없습니다.</div></div>';
  }
  var band = '';
  if (m.kept) {
    band += '<div class="band keep"><b>홈페이지에 남기기로 함</b> — '+esc(m.kept)
      + '<br><span class="sm">권형하 · 2026-08-18 · 명부에 퇴사로 찍혀 있어도 '
      + '「내릴 것(퇴사)」 딱지를 달지 않고 내용 대조만 합니다.</span></div>';
  } else if (/^left:/.test(m.roster||'')) {
    var done = st(m) === 'done';
    band += '<div class="band '+(done?'keep':'rm')+'"><b>푸른ERP 명부: '
      + esc(m.roster.split(':')[1])+'</b> · '
      + (done ? '홈페이지에서도 <b>내려간 것으로 확인</b>됐습니다.'
              : (CHECKED ? '홈페이지에는 <b>아직 올라가 있습니다</b>.'
                         : '홈페이지에 올라가 있는지는 <b>「홈페이지 다시 확인」</b>을 눌러야 압니다.'))
      + '<br><span class="sm">'
      + (done ? '더 하실 일은 없습니다.'
              : '내리실 때는 <b>삭제가 아니라 「비공개」</b>로 바꾸십시오 — 잘못 내렸어도 되살릴 수 있습니다.')
      + '</span></div>';
  } else if (/^ask:/.test(m.roster||'')) {
    band += '<div class="band ask"><b>명부에 없음</b> — 푸른ERP 직원 명부에서 이름을 찾지 못했습니다'
      + '<br><span class="sm">지사장처럼 고용관계가 아닌 분은 <b>「홈페이지에 남기기」</b>로 '
      + '사유를 남겨 두십시오.</span></div>';
  }
  var h = '<div class="ehd">'+band+'</div><div class="esc">';
  h += '<div class="fld"><label>이름</label><input value="'+esc(m.name)+'"></div>';
  h += '<div class="two"><div class="fld"><label>직책1</label><input value="'
    + esc(m.desc.split(' · ')[0])+'"></div>'
    + '<div class="fld"><label>직책2</label><input value="공인노무사"></div>'
    + '<div class="fld" style="flex:0 0 150px"><label>홈페이지 글 번호</label><input value="'
    + esc(m.srl)+'"></div></div>';
  h += '<div class="fld"><label>메인 설명 (홈페이지 공개 화면에 안 나와 읽어올 수 없습니다 — 편집 화면을 보고 채우십시오)</label>'
    + '<textarea rows="2"></textarea></div>';
  h += '<div class="fld"><label>경력사항 — '+CAREERS.length+'줄</label><div class="car">'
    + CAREERS.map(function(l,i){
        return '<div class="l"><span class="no">'+(i+1)+'</span><input value="'+esc(l)+'">'
          + '<button class="x">▲</button><button class="x">▼</button><button class="x">✕</button></div>';
      }).join('')
    + '<div class="add">＋ 줄 추가</div></div></div>';
  h += '</div>';
  h += '<div class="eft"><button class="btn pri">붙여넣을 내용 복사</button>'
    + '<button class="btn">저장</button><button class="btn">경력관리에서 당겨오기</button>'
    + '<button class="btn">되돌리기</button>'
    + (m.kept ? '<button class="btn keep">남기기 예외 풀기</button>'
              : '<button class="btn keep">홈페이지에 남기기</button>')
    + '<span style="flex:1"></span><button class="btn">홈페이지에서 이 사람 글 열기</button>'
    + '<span class="sub">수정 기록 없음</span></div>';
  return h;
}
function pageEditHtml(){
  var list = PAGES[GROUP] || [], i = Math.max(0, PICK-100);
  var p = list[i] || list[0];
  var lines = ['자문서비스','01','노무관리 전반의 상시 자문','02','취업규칙·근로계약 검토',
    '천안본사','충남 천안시 서북구 …'];
  var h = '<div class="ehd"><div class="band ask"><b>이 쪽의 글은 «대조용»으로만 씁니다.</b> '
    + '붙여넣으면 지도·표·구획·지사 탭이 통째로 사라져 <b>붙여넣기를 드리지 않습니다</b>. '
    + '쪽 내용은 홈페이지 관리자 화면에서 직접 고치십시오.</div></div>';
  h += '<div class="esc">';
  h += '<div class="fld"><label>홈페이지 화면 그대로 보기 — '+lines.length+'줄 '
    + '· 번호는 화면에서 세는 용도입니다</label><div class="rows">'
    + lines.map(function(l,n){
        var k = /^\d{1,2}$/.test(l) ? '' : (l.length<=16 && l.indexOf(' ')<0 ? ' head' : '');
        return '<div class="l'+k+'"><span class="n">'+(n+1)+'</span><span class="t">'+esc(l)+'</span></div>';
      }).join('') + '</div></div>';
  h += '<div class="fld"><label>'+esc(p[0])+' — 대조 기준 글자 ('+esc(p[1])+') '
    + '· 이 글자는 홈페이지로 «가지 않습니다»</label><textarea rows="7">'
    + esc(lines.join(' '))+'</textarea></div>';
  h += '<div class="guide"><b>이 쪽을 고치는 순서</b><ol>'
    + '<li><b>홈페이지에서 이 쪽 열기</b> → 관리자 화면에서 고치고 저장</li>'
    + '<li>돌아와 <b>홈페이지 다시 확인</b> → 딱지가 「안 올라감」으로 바뀝니다</li>'
    + '<li>바꾼 내용을 그대로 두려면 <b>대조 기준 글자</b>를 맞춘 뒤 저장하고 한 번 더 확인</li>'
    + '</ol></div></div>';
  h += '<div class="eft"><button class="btn">대조 기준 저장</button>'
    + '<button class="btn">되돌리기</button><button class="btn">목록에서 분리</button>'
    + '<span style="flex:1"></span><button class="btn pri">홈페이지에서 이 쪽 열기</button>'
    + '<span class="sub">수정 기록 없음</span></div>';
  return h;
}

/* ── ③ 할 일 칸 ── */
function todoHtml(){
  var items = [];
  if (!CHECKED) {
    items.push({ cls:'info', h:'<b>홈페이지와 아직 대조하지 않았습니다</b><br>'
      + '딱지는 <b>「홈페이지 다시 확인」</b>을 누를 때만 붙습니다. 저절로 돌지 않습니다.'
      + '<div class="go"><button class="btn pri sm">홈페이지 다시 확인</button></div>' });
    items.push({ cls:'warn', h:'<b>명부만 보고 아는 것 — 퇴사 3명 · 명부에 없음 1명</b><br>'
      + '박성수(2026-06-30) · 임혜미(2026-05-22) · 장한돌(2023-12-31, 남김) · 조현범(명부에 없음)<br>'
      + '<span class="sub" style="color:inherit">홈페이지에 아직 올라가 있는지는 확인을 눌러야 압니다.</span>' });
  } else {
    items.push({ n:1, cls:'bad', h:'<b>퇴사한 노무사가 홈페이지에 남아 있습니다 — 1명</b><br>'
      + '박성수 (명부 퇴사 2026-06-30)'
      + '<details><summary>홈페이지에서 내리는 법</summary><ol>'
      + '<li>홈페이지 관리자 로그인 <span class="kbd">푸른노무법인.kr/admin</span></li>'
      + '<li><b>구성원 갤러리</b>에서 그 글을 찾습니다</li>'
      + '<li><b>삭제하지 말고 「비공개」</b>로 바꾸십시오</li>'
      + '<li>돌아와 <b>홈페이지 다시 확인</b></li></ol></details>'
      + '<div class="go"><button class="btn sm" onclick="pick(2)">이 사람 열기</button></div>' });
    items.push({ n:1, cls:'warn', h:'<b>홈페이지에만 있는 글 — 1건</b><br>글 번호 205'
      + '<div class="go"><button class="btn sm" onclick="pick(10)">이 줄 열기</button></div>' });
    items.push({ n:1, cls:'warn', h:'<b>퇴사자 이름이 다른 쪽에도 남아 있습니다</b><br>'
      + '임혜미 — 인사말 1회<br><span class="sub" style="color:inherit">'
      + '동명이인일 수 있어 알려만 드립니다. 자동으로 고치지 않습니다.</span>'
      + '<div class="go"><button class="btn sm" onclick="go(\'greeting\')">인사말 열기</button></div>' });
    items.push({ n:1, cls:'info', h:'<b>대조 기준이 없는 쪽 — 1개</b><br>산재보상 (/work4)'
      + '<div class="go"><button class="btn sm" onclick="go(\'work\')">주요업무 열기</button></div>' });
    items.push({ n:3, cls:'bad', h:'<b>안 올라간 것 — 3건</b><br>'
      + '김혜민 · 인사노무컨설팅 · 인사말'
      + '<div class="go"><button class="btn sm" onclick="filt(\'pending\')">「안 올라감」만 보기</button></div>' });
  }
  var n = items.reduce(function(s,i){ return s + (i.n||0); }, 0);
  document.getElementById('todoN').textContent = n;
  document.getElementById('todoN').className = 'c' + (n?'':' zero');
  document.getElementById('todoWhen').textContent = CHECKED ? '확인: 2026-08-23 14:31' : '';
  return items.map(function(i){ return '<div class="bar '+i.cls+'">'+i.h+'</div>'; }).join('');
}

/* ── 그리기 ── */
function draw(){
  document.getElementById('dash').innerHTML = dashHtml();
  document.getElementById('chips').innerHTML = chipsHtml();
  document.getElementById('lh').innerHTML = lhHtml();
  document.getElementById('rows').innerHTML = rowsHtml();
  document.getElementById('edit').innerHTML = editHtml();
  document.getElementById('todoBody').innerHTML = todoHtml();
  document.getElementById('hWhen').textContent = CHECKED
    ? '홈페이지 확인: 2026-08-23 14:31' : '홈페이지 확인: 아직 안 함';
  document.getElementById('mkBtn').textContent = '목업 보기: ' + (CHECKED ? '대조 후' : '대조 전');
  document.getElementById('mkBtn').className = 'mk' + (CHECKED ? ' on' : '');
}
function go(g){ GROUP = g; FILTER = ''; PICK = (g==='members') ? 1 : 100; draw(); }
function pick(k){
  if (k >= 100) { GROUP = 'work'; }
  else if (GROUP !== 'members') { GROUP = 'members'; }
  PICK = k; draw();
}
function filt(k){ FILTER = (FILTER===k) ? '' : k; draw(); }
document.getElementById('mkBtn').onclick = function(){
  CHECKED = !CHECKED; FILTER = ''; draw();
};
draw();
</script>
