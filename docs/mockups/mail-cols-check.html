<!doctype html>
<meta charset="utf-8">
<title>목록 오른쪽 열 정리 — 전후</title>
<style>
  body{margin:0;padding:18px;font:14px/1.55 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;background:#fff}
  h3{font-size:13px;color:#6b7280;margin:18px 0 6px}
  .wrap{border:1px solid #e3e6eb;border-radius:8px;overflow:hidden;max-width:980px}
  .dm-row{display:flex;align-items:center;height:40px;border-bottom:1px solid #f1f2f4;padding:0 6px}
  .dm-row:last-child{border-bottom:none}
  .dm-row .who{flex:none;width:160px;padding-right:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dm-row .sub{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:16px}
  .dm-who{flex:none;font-size:10.5px;color:#1a4fa0;background:#eef3fb;border:1px solid #d3e0f5;
    border-radius:3px;padding:1px 6px;margin-right:8px;white-space:nowrap}
  .dm-row .at{flex:none;width:112px;text-align:right;color:#8c8c8c;font-size:13.5px;padding-right:4px;white-space:nowrap}

  /* 예전 — 폭이 글자만큼 */
  .old .box{flex:none;font-size:12px;color:#a8abb2;padding-right:12px;max-width:120px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 고친 뒤 — 폭을 못 박는다 */
  .new .box{flex:none;width:124px;font-size:12px;color:#a8abb2;padding-right:12px;
    text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
<h3>① 예전 — 칸 이름 폭이 글자 길이만큼 (열이 지그재그)</h3>
<div class="wrap old" id="OLD"></div>
<h3>② 고친 뒤 — 칸 이름 폭 124px, 이름표도 사람이 보는 이름으로</h3>
<div class="wrap new" id="NEW"></div>
<script>
  const ROWS = [
    ['이재헌', '등기임원 퇴직금 지급관련 문의의 건', '',       'Sent Messages', '보낸메일함'],
    ['국민연금', '가입자 자격 취득 신고 안내',        '',       'Sent Messages', '보낸메일함'],
    ['이미경', '8월 급여자료 송부드립니다',           '박한별', 'INBOX',         '받은메일함'],
    ['김정훈', '4대보험 취득신고 요청',               '주민정', '2.급여+사무대행','2.급여+사무대행'],
    ['총무팀', '취업규칙 개정 검토 요청',             '',       'INBOX',         '받은메일함'],
    ['박선영', '임금대장 확인 부탁드립니다',          '박재원', '1.자문사답변',   '1.자문사답변'],
    ['노무법인', '자문 계약 갱신 안내',                '김보람', '2.급여+사무대행','2.급여+사무대행'],
  ];
  const draw = (el, k) => { el.innerHTML = ROWS.map(r =>
    '<div class="dm-row"><span class="who">' + r[0] + '</span>'
    + '<span class="sub">' + r[1] + '</span>'
    + (r[2] ? '<span class="dm-who">👤 ' + r[2] + '</span>' : '')
    + '<span class="box">' + r[k] + '</span>'
    + '<span class="at">08.30 14:31</span></div>').join(''); };
  draw(document.getElementById('OLD'), 3);
  draw(document.getElementById('NEW'), 4);
</script>
