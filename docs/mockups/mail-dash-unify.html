<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>푸른 메일 — 두 대시보드 «위치·분위기·색» 맞음 실측</title>
<style>
  body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;margin:0;padding:22px;background:#f6f7f9;color:#222}
  h1{font-size:18px;margin:0 0 6px}
  .sub{font-size:12.5px;color:#6b6f76;line-height:1.8;max-width:900px;margin-bottom:16px}
  .wrap{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
  .pane{background:#fff;border:1px solid #e6e8ec;border-radius:9px;padding:8px 6px;width:290px}
  .pane h3{font-size:12px;margin:2px 0 8px 10px;color:#6b6f76;font-weight:700}
  table{border-collapse:collapse;font-size:12.5px;background:#fff;border:1px solid #e6e8ec;
    border-radius:9px;overflow:hidden}
  th,td{border-bottom:1px solid #eef0f3;padding:7px 11px;text-align:left}
  th{background:#f2f4f7;font-size:11.5px}
  td.v{font-family:Consolas,monospace;font-size:11.5px}
  .sw{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid #d7dade;
    vertical-align:-1px;margin-right:5px}
  .ok{color:#166534;font-weight:700} .no{color:#991b1b;font-weight:700}
  #sum{margin:16px 0;padding:11px 14px;border-radius:8px;font-size:14px;font-weight:700}
  #sum.ok{background:#e9f7ee;color:#166534;border:1px solid #a7e0bd}
  #sum.no{background:#fdeaea;color:#991b1b;border:1px solid #f3b6b6}
</style></head><body>
<h1>두 대시보드 — 위치·분위기·색이 «같은가»</h1>
<div class="sub">
  앱의 <b>진짜 CSS 와 진짜 그리는 함수</b>로 두 대시보드를 각각 그린 뒤,
  같은 자리끼리의 <b>색과 x 좌표를 기계로 견준다</b>. 눈으로 「비슷하다」가 아니라 값으로 본다.
</div>
<div id="sum">재는 중…</div>
<div class="wrap">
  <div class="pane"><h3>👤 담당자</h3><div id="paneW"></div></div>
  <div class="pane"><h3>📁 업무별</h3><div id="paneT"></div></div>
  <table id="tb"><thead><tr><th>무엇을</th><th>담당자</th><th>업무별</th><th>판정</th></tr></thead>
    <tbody></tbody></table>
</div>
<script>
fetch('../../pu-cards.html').then(r=>r.text()).then(src=>{
  const css=(src.match(/<style[^>]*>[\s\S]*?<\/style>/g)||[]).join('\n').replace(/<\/?style[^>]*>/g,'');
  const st=document.createElement('style'); st.textContent=css; document.head.appendChild(st);

  const i=src.indexOf('function pcItem(attrs'), j=src.indexOf('\nfunction switchTab(');
  const slice=src.slice(i,j);

  const NAMES=['박한별','김혜민','박재원'];
  const FOLDERS={}, MSGS={}, ITEMS={}, BYNAME={};
  for(let b=0;b<3;b++){
    const slug='B'+b;
    FOLDERS[slug]={path:'F'+b,name:(b+1)+'.업무 칸 이름',kind:'custom',order:7,total:400,unseen:17-b*6};
    const box={};
    for(let m=0;m<9;m++){
      const co='회사'+(b*9+m);
      box[String(b*100+m)]={u:b*100+m,f:'보낸이',e:'p'+m+'@co'+(b*9+m)+'.kr',t:'x@daum.net',
        s:'제목',d:1756000000000+m,r:m%3?1:0,g:0,a:0,z:1};
      ITEMS['i'+b+m]={id:'i'+b+m,email:'p'+m+'@co'+(b*9+m)+'.kr',company:co};
      BYNAME[co]={company:co,main:NAMES[(b+m)%NAMES.length],subs:[],left:false};
    }
    MSGS[slug]=box;
  }
  const DIR=NAMES.map((n,k)=>({sid:'P-00'+k,name:n,sortOrder:(k+1)*10,role:'member',title:'노무사',status:'active'}));

  const stub={ esc:s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
    Store:{mode:'firebase'}, DB_ROOT:'pucards', matMailCfg:()=>({from:'x@daum.net'}),
    matList:()=>[], matCat:()=>'', MAT_CATS_NOW:()=>[], _matMeta:{}, _matLoaded:true,
    loadMaterials(){}, schedList:()=>[], staffName:b=>String(b||''), fmtDate:()=>'2026.08.29',
    fmtMB:n=>n+'B', allItems:()=>ITEMS, allGroups:()=>({}), isPrivGroup:()=>false,
    canSeeGroup:()=>true, coList:()=>[], coTagList:()=>[], coFTabList:()=>[],
    coFTabCounts:()=>({all:0,byTab:{}}), _coFolders:{}, _coTagHidden:{}, toast(){},
    confirm:()=>true, closeFolderMenu(){}, toggleSidebar(){}, openSettingsPage(){},
    openMatPage(){}, openMailPage(){}, openSentBox(){}, openSchedBox(){}, openInbox(){},
    closeMailPage(){}, openPrivateVault(){}, migrateLockedFolders(){}, inboxBoxHtml:()=>'',
    schedBoxHtml:()=>'', sentBoxHtml:()=>'', mailWriteHtml:()=>'', wireMailWrite(){},
    pickOf:()=>({}), pickOn:()=>false, pickList:()=>[], pickAllOn:()=>false, pickClear(){},
    pickHit(){}, pickToggleAll(){}, pickRedraw(){}, renderPCSide(){}, renderMailPage(){},
    render(){}, $:()=>null,
    firebase:{auth:()=>({currentUser:{uid:'U1'}}),database:()=>({ref:()=>({once:()=>Promise.resolve({val:()=>null}),set:()=>Promise.resolve(),update:()=>Promise.resolve()})})},
    fetch:()=>Promise.resolve({json:()=>Promise.resolve({ok:true})}) };
  const state={view:'mail',mailSent:'box',mbBox:'',tab:'card',group:'all',owner:'all',
    isAdmin:true,groups:{},pick:{},matPick:'',sentBox:{},schedBox:{},mbQ:'',mbFilter:'',
    mbTab:'',mbCursor:-1,mbOpen:null,mbDash:'topic',items:ITEMS,mbMineOpen:true};

  const args=Object.keys(stub).concat(['state','__fold','__msgs']);
  const vals=args.map(k=> k==='state'?state : k==='__fold'?FOLDERS : k==='__msgs'?MSGS : stub[k]);
  const body='const ErpMatch={ready:true,byName:{},byBiz:{},staff:{},companies:[],'
    + '_norm(s){return String(s||"").toLowerCase().replace(/[\\s\\-_.,·()\\[\\]{}\'"]/g,"");},'
    + 'match(it){const n=this._norm(it&&it.company);return n&&this.byName[n]||null;}};\n'
    + slice + '\n'
    + '_mbFolders=__fold;_mbMsgs=__msgs;_mbBins={};_mbPut={};_mbHide={};_mbOwner={};'
    + '_mbSucc={};_mbOrder={};_mbMeta={at:1,ok:true};\n'
    + 'return { mailSideHtml, ErpMatch, mbMemoClear, mbBins, mbWhoList };';
  const M=new Function(...args, body)(...vals);
  const byName={}, staff={};
  Object.keys(BYNAME).forEach(n=>{ byName[M.ErpMatch._norm(n)]=BYNAME[n]; });
  DIR.forEach(u=>{ staff[M.ErpMatch._norm(u.name)]={sid:u.sid,name:u.name,ord:u.sortOrder,
    role:u.role,title:u.title,status:u.status}; });
  M.ErpMatch.byName=byName; M.ErpMatch.staff=staff;

  /* 각 대시보드를 «고른 줄이 있는 채로» 그린다 */
  state.mbDash='topic'; state.mbBox='~'+M.mbBins()[0].id; M.mbMemoClear();
  document.getElementById('paneT').innerHTML=M.mailSideHtml();
  state.mbDash='who';   state.mbBox='@'+M.mbWhoList()[0].name; M.mbMemoClear();
  document.getElementById('paneW').innerHTML=M.mailSideHtml();

  const g=(el,p)=>el?getComputedStyle(el)[p]:'(없음)';
  const q=(pane,sel)=>document.querySelector('#'+pane+' '+sel);
  const rows=[];
  const add=(what,a,b,how)=>{
    const same=(how==='x')? (Math.abs(a-b)<0.6) : (a===b);
    rows.push({what,a,b,same,how});
  };
  const sw=v=>/^rgb/.test(String(v))?'<span class="sw" style="background:'+v+'"></span>':'';

  const wRow=q('paneW','.whobin:not(.meRow)'), tRow=q('paneT','.topicbin');
  const wOn =q('paneW','.whobin.on') || q('paneW','.dm-f.on'), tOn=q('paneT','.topicbin.on');
  add('줄 바탕(평소)', g(wRow,'backgroundColor'), g(tRow,'backgroundColor'));
  add('줄 글자(평소)', g(wRow,'color'), g(tRow,'color'));
  add('고른 줄 바탕', g(wOn,'backgroundColor'), g(tOn,'backgroundColor'));
  add('고른 줄 글자', g(wOn,'color'), g(tOn,'color'));
  add('고른 줄 굵기', g(wOn,'fontWeight'), g(tOn,'fontWeight'));
  add('아이콘 색(평소)', g(q('paneW','.whobin:not(.meRow) .ic'),'color'),
                        g(q('paneT','.topicbin .dot'),'color'));
  add('아이콘 색(고른 줄)', g(wOn&&wOn.querySelector('.ic,.dot'),'color'),
                            g(tOn&&tOn.querySelector('.ic,.dot'),'color'));
  add('아이콘 상자 폭', g(q('paneW','.whobin .ic'),'width'), g(q('paneT','.topicbin .dot'),'width'));
  add('안읽음 숫자 색', g(q('paneW','.whobin .nu'),'color'), g(q('paneT','.topicbin .nu'),'color'));
  add('줄 높이', g(wRow,'height'), g(tRow,'height'));
  add('글자 크기', g(wRow,'fontSize'), g(tRow,'fontSize'));
  const wn=q('paneW','.whobin:not(.meRow) .nm'), tn=q('paneT','.topicbin .nm');
  add('이름 시작 x', Math.round(wn.getBoundingClientRect().left - document.getElementById('paneW').getBoundingClientRect().left),
                     Math.round(tn.getBoundingClientRect().left - document.getElementById('paneT').getBoundingClientRect().left), 'x');
  const wu=q('paneW','.whobin:not(.meRow) .nu'), tu=q('paneT','.topicbin .nu');
  if(wu&&tu) add('숫자 끝 x',
    Math.round(document.getElementById('paneW').getBoundingClientRect().right - wu.getBoundingClientRect().right),
    Math.round(document.getElementById('paneT').getBoundingClientRect().right - tu.getBoundingClientRect().right), 'x');

  const tb=document.querySelector('#tb tbody');
  tb.innerHTML=rows.map(r=>'<tr><td>'+r.what+'</td><td class="v">'+sw(r.a)+r.a
    +'</td><td class="v">'+sw(r.b)+r.b+'</td><td class="'+(r.same?'ok':'no')+'">'
    +(r.same?'같음 ✔':'다름 ✘')+'</td></tr>').join('');
  const bad=rows.filter(r=>!r.same).length;
  const s2=document.getElementById('sum');
  s2.className=bad?'no':'ok';
  s2.textContent=bad? (bad+' 군데가 아직 다릅니다') : ('모두 같습니다 — '+rows.length+' / '+rows.length);
  window.__unify={ total:rows.length, bad:bad, diff:rows.filter(r=>!r.same).map(r=>r.what+': '+r.a+' vs '+r.b) };
}).catch(e=>{ document.getElementById('sum').textContent='실패 — '+e.message;
  window.__unify={bad:-1,err:e.message}; });
</script>
</body></html>
