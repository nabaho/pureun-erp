<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>목업 — 메일 문구 골라 쓰기 (문구 서랍)</title>
<!--
  ═══════════════════════════════════════════════════════════════════════
  대표 지시 2026-08-26(다섯째): "메일에 문구도 선택할 수 있게 해야한다."
  ═══════════════════════════════════════════════════════════════════════

  ★ 지금은 이렇다 (읽어 본 결과)
    · 문구가 «두 층»뿐이다 — 기본 하나 + 자료 갈래마다 하나(config/matMail.byCat)
    · 쓸 때 «고를 수 없다». 붙인 자료의 갈래가 자동으로 정한다(pickMailTpl)
    · 갈래가 섞이면 기본 문구로 돌아간다
    · 자료를 안 붙여도 「아래 자료를 첨부합니다」가 그대로 나간다  ← 대표 캡처의 그 글
    · 맺음이 「푸른노무법인」 한 줄 — 담당자 이름이 없다

  ★ 문답으로 정한 것 셋 (2026-08-26)
    ① 고르면 제목·본문을 «통째로» 바꾼다 (이미 쓴 글이 있으면 한 번 물어본다)
    ② 문구는 «전 직원 공용» — 누구나 만들고 고친다
    ③ 채우는 칸을 넷 더한다 — {담당자} {보낸이} {이번달} {지난달}

  ⚠ 지금 있는 기본·갈래별 문구는 «그대로 첫 항목들로» 옮긴다. 잃는 것이 없어야 한다.
  ⚠ 클래스 이름은 pu-cards.html 의 쓰기 화면 결(cp-·ed-)을 따른다.
-->
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'맑은 고딕','Malgun Gothic',AppleSDGothicNeo-Regular,'돋움',dotum,sans-serif;
  background:#f2f4f7;color:#1b2536;-webkit-font-smoothing:antialiased}
:root{--blue:#2563d1;--line:#dde3ee;--sub:#8b98b3;--ink:#1b2536;
  --pu:#0f8a5f;--who:#7b4bd1;--who-bg:#f2ecfd}

.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px 14px}
.top h1{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.4px}
.top p{margin:0;font-size:13px;color:#5a6885;line-height:1.75}

.page{display:flex;gap:16px;align-items:flex-start;padding:16px 24px 30px}
.compose{flex:1;min-width:0;max-width:760px;background:#fff;border:1px solid var(--line);
  border-radius:12px;overflow:hidden;position:relative}
.mgr{width:320px;flex:0 0 320px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}

/* ── 쓰기 화면 ── */
.cptop{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);
  background:#fafbfd}
.cptop .t{font-weight:700;font-size:14px;flex:1}
.cpsend{background:var(--blue);color:#fff;border:none;border-radius:7px;padding:8px 16px;
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.cprow{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid #eef1f6}
.cpk{width:56px;flex:none;font-size:12.5px;color:var(--sub)}
.cprow input{flex:1;min-width:0;border:none;outline:none;font-family:inherit;font-size:13.5px;color:var(--ink)}
.edbar{display:flex;align-items:center;gap:3px;padding:7px 12px;border-bottom:1px solid #eef1f6;
  background:#fafbfd;flex-wrap:wrap}
.edbtn{font-family:inherit;font-size:12px;color:#3c4a63;background:#fff;border:1px solid #e2e7f0;
  border-radius:6px;padding:5px 9px;cursor:pointer}
.edbtn:hover{background:#f0f3f9}
.edbtn.hot{background:var(--who);color:#fff;border-color:var(--who);font-weight:700}
.edsep{width:1px;height:16px;background:#e2e7f0;margin:0 4px}
.cpbody{min-height:270px;padding:14px;font-size:13.5px;line-height:1.85;white-space:pre-wrap;
  color:var(--ink);outline:none}
.cphint{padding:8px 14px 12px;font-size:11.5px;color:var(--sub);line-height:1.65;border-top:1px solid #eef1f6}

/* ── 문구 고르는 창 ── */
.pop{position:absolute;z-index:40;width:330px;background:#fff;border:1px solid #cfd7e6;border-radius:10px;
  box-shadow:0 12px 34px rgba(20,30,60,.18);padding:6px;display:none;left:12px;top:150px}
.pop .h{font-size:12px;color:#6b7890;padding:7px 9px 8px;border-bottom:1px solid #eef1f6;margin-bottom:4px}
.pop .lst{max-height:320px;overflow:auto}
.pop .i{padding:8px 9px;border-radius:6px;cursor:pointer}
.pop .i:hover{background:var(--who-bg)}
.pop .i b{display:block;font-size:13px;color:var(--ink)}
.pop .i span{display:block;font-size:11.5px;color:var(--sub);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop .foot{border-top:1px solid #eef1f6;margin-top:4px;padding-top:5px;display:flex;gap:5px}
.pop .foot button{flex:1;font-family:inherit;font-size:12px;border:1px solid #e2e7f0;background:#fff;
  color:#3c4a63;border-radius:6px;padding:6px;cursor:pointer}
.pop .foot button:hover{background:#f0f3f9}

/* ── 문구 관리 ── */
.mgr h3{margin:0 0 4px;font-size:14px}
.mgr .note{font-size:11.5px;color:var(--sub);line-height:1.7;margin:0 0 10px}
.tp{border:1px solid #eef1f6;border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.tp:hover{border-color:#cfd7e6}
.tp.on{border-color:var(--who);background:var(--who-bg)}
.tp b{display:block;font-size:12.5px}
.tp span{display:block;font-size:11px;color:var(--sub);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgr label{display:block;font-size:11.5px;color:#5a6885;margin:8px 0 4px;font-weight:700}
.mgr input,.mgr textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px;
  font-family:inherit;font-size:12.5px;color:var(--ink);outline:none}
.mgr textarea{min-height:150px;line-height:1.75;resize:vertical}
.keys{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 0}
.keys button{font-family:inherit;font-size:11px;border:1px solid #e0d4fa;background:var(--who-bg);
  color:#5b3a9c;border-radius:99px;padding:3px 8px;cursor:pointer}
.keys button:hover{background:#e9dffb}
.mgr .row{display:flex;gap:6px;margin-top:9px}
.mgr .row button{flex:1;font-family:inherit;font-size:12.5px;border-radius:7px;padding:8px;cursor:pointer;
  border:1px solid #e2e7f0;background:#fff;color:#3c4a63}
.mgr .row button.p{background:var(--pu);color:#fff;border-color:var(--pu);font-weight:700}

.note2{margin:0 24px 24px;border:1px solid var(--line);border-radius:10px;padding:16px 18px;
  background:#fff;font-size:13.5px;line-height:1.85;color:#33383f}
.note2 h3{margin:0 0 8px;font-size:14.5px;color:#111}
.note2 table{border-collapse:collapse;margin:8px 0 4px;font-size:12.5px;width:100%}
.note2 td,.note2 th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.note2 th{background:#f4f6f8;font-weight:700}
.note2 code{background:#eef1f4;border-radius:3px;padding:1px 5px;font-size:12px}
.note2 .bad{color:#c0392b;font-weight:700}
.note2 .ok{color:var(--pu);font-weight:700}
.tagline{position:fixed;right:14px;bottom:12px;background:#111;color:#fff;font-size:11.5px;
  border-radius:99px;padding:6px 13px;opacity:.82;z-index:50}
.toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:#1c2128;color:#fff;
  font-size:13px;padding:11px 18px;border-radius:8px;z-index:60;display:none}
</style>
</head>
<body>

<div class="top">
  <h1>메일 문구를 골라 쓴다 — 「문구 서랍」</h1>
  <p>지금은 문구가 <b>기본 하나 + 자료 갈래마다 하나</b>뿐이고, <b>쓸 때 고를 수 없습니다</b>
     (붙인 자료의 갈래가 자동으로 정합니다).<br>
     왼쪽 도구줄의 <b>📝 문구</b> 를 눌러 보세요. 오른쪽에서 문구를 만들고 고칠 수 있습니다.</p>
</div>

<div class="page">
  <!-- ══════════ 쓰기 화면 ══════════ -->
  <section class="compose">
    <div class="cptop">
      <span class="t">메일 쓰기</span>
      <button class="cpsend">보내기</button>
    </div>
    <div class="cprow"><span class="cpk">받는사람</span>
      <input value="김민근 (한빛물산) &lt;mgkim@hanbit.co.kr&gt;" readonly></div>
    <div class="cprow"><span class="cpk">제목</span>
      <input id="subj" readonly></div>

    <div class="edbar">
      <button class="edbtn"><b>B</b></button>
      <button class="edbtn"><i>I</i></button>
      <button class="edbtn">U</button>
      <span class="edsep"></span>
      <button class="edbtn hot" onclick="openPop(event)" title="미리 만들어 둔 문구를 골라 넣습니다">📝 문구</button>
      <span class="edsep"></span>
      <button class="edbtn" onclick="toast('목업입니다 — 지금도 있는 단추입니다')">✍ 서명</button>
      <button class="edbtn" onclick="toast('목업입니다 — 지금도 있는 단추입니다')">📇 내 명함</button>
      <button class="edbtn" onclick="toast('목업입니다 — 지금도 있는 단추입니다')">🔒 보안문구</button>
    </div>

    <div class="cpbody" id="body" contenteditable="true"></div>

    <div class="cphint" id="hint"></div>

    <!-- 문구 고르는 창 -->
    <div class="pop" id="pop"></div>
  </section>

  <!-- ══════════ 문구 관리 ══════════ -->
  <aside class="mgr">
    <h3>문구 관리</h3>
    <p class="note">전 직원 공용입니다 — 누구나 만들고 고칩니다.<br>
      아래에서 골라 고치거나, <b>＋ 새 문구</b> 로 만듭니다.</p>
    <div id="tplList"></div>
    <button class="edbtn" style="width:100%;margin-top:4px" onclick="newTpl()">＋ 새 문구</button>

    <div id="editor"></div>
  </aside>
</div>

<div class="note2" id="note2"></div>
<div class="toast" id="toast"></div>
<div class="tagline">목업 — 문구 서랍 · 2026-08-26</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   처음에 들어 있을 문구들.
   ★ ①②는 «지금 있는 것»을 그대로 옮긴 것이다 — 잃는 것이 없어야 한다.
     ①은 config/matMail 의 기본 문구, ②는 byCat['급여'] 자리에 해당한다.
   ★ ③~⑤는 지금 «없어서 아쉬운» 것들이다.
     ③ 자료를 안 붙이는 편지 — 지금은 늘 「아래 자료를 첨부합니다」가 나간다
     ④ 회신 독촉 · ⑤ 첫 인사
   ══════════════════════════════════════════════════════════════════════ */
let TPLS = [
  { id:'t1', n:'자료 송부 (지금 기본)', s:'[푸른노무법인] 요청하신 자료를 보내드립니다',
    b:'{받는분} 님, 안녕하세요.\n푸른노무법인입니다.\n\n아래 자료를 첨부합니다.\n\n{자료목록}\n\n'
     + '문의사항 있으시면 언제든 연락 주십시오.\n감사합니다.\n\n푸른노무법인\n' },
  { id:'t2', n:'급여 자료 송부', s:'[푸른노무법인] {이번달} 급여 자료를 보내드립니다',
    b:'{받는분} 님, 안녕하세요.\n{회사명} 담당 {담당자} 노무사입니다.\n\n'
     + '{이번달} 급여 자료를 첨부합니다.\n\n{자료목록}\n\n'
     + '확인하시고 수정할 부분이 있으면 알려 주십시오.\n감사합니다.\n\n푸른노무법인 {보낸이}\n' },
  { id:'t3', n:'자료 없이 안내만', s:'[푸른노무법인] 안내드립니다',
    b:'{받는분} 님, 안녕하세요.\n{회사명} 담당 {담당자} 노무사입니다.\n\n'
     + '아래와 같이 안내드립니다.\n\n· \n\n'
     + '문의사항 있으시면 언제든 연락 주십시오.\n감사합니다.\n\n푸른노무법인 {보낸이}\n' },
  { id:'t4', n:'회신 요청 (독촉)', s:'[푸른노무법인] {지난달} 자료 회신 부탁드립니다',
    b:'{받는분} 님, 안녕하세요.\n{회사명} 담당 {담당자} 노무사입니다.\n\n'
     + '{지난달}에 요청드린 자료가 아직 도착하지 않았습니다.\n'
     + '업무 진행을 위해 {오늘} 까지 회신 부탁드립니다.\n\n'
     + '이미 보내주셨다면 알려 주십시오 — 저희 쪽에서 다시 확인하겠습니다.\n감사합니다.\n\n'
     + '푸른노무법인 {보낸이}\n' },
  { id:'t5', n:'첫 인사 · 자문 시작', s:'[푸른노무법인] 자문 담당자 인사드립니다',
    b:'{받는분} 님, 안녕하세요.\n{회사명} 자문을 맡게 된 푸른노무법인 {담당자} 노무사입니다.\n\n'
     + '앞으로 인사·노무 전반을 함께 살펴 드리겠습니다.\n'
     + '급한 일은 아래 연락처로 바로 주십시오.\n\n'
     + '잘 부탁드립니다.\n\n푸른노무법인 {보낸이}\n' }
];

/* 채우는 칸 — 지금 넷 + 새로 넷(대표 문답 2026-08-26) */
const VALS = {
  '받는분':'김민근', '회사명':'한빛물산', '오늘':'2026.08.26',
  '자료목록':'· 2026년 8월 급여대장.xlsx\n· 4대보험 정산내역.pdf',
  /* ↓ 새로 더하는 칸 */
  '담당자':'박한별', '보낸이':'김혜민', '이번달':'8월', '지난달':'7월'
};
const NEW_KEYS = ['담당자','보낸이','이번달','지난달'];

let curId = 't1';      /* 쓰기 화면에 넣어 둔 문구 */
let editId = 't1';     /* 오른쪽에서 고치고 있는 문구 */
let dirty = false;     /* 본문을 손으로 고쳤나 */

function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
/* 앱의 mailFill 과 같은 규칙 — 모르는 칸은 «빈 값으로 지운다».
   ⚠ 이것이 중요하다. 안 지우면 「{담당자}」 라는 글자가 그대로 고객 메일에 나간다. */
function fill(t){
  return String(t==null?'':t).replace(/\{([^{}]{1,20})\}/g, (_, k) => {
    const v = VALS[String(k).trim()];
    return (v == null) ? '' : String(v);
  });
}
function byId(id){ return TPLS.find(t=>t.id===id) || TPLS[0]; }

/* ── 쓰기 화면에 문구를 넣는다 ── */
function useTpl(id, forced){
  const t = byId(id);
  /* ⚠ 이미 쓴 글이 있으면 한 번 물어본다 — 통째로 바꾸기로 정했으므로(문답 ①)
       묻지 않으면 쓰던 글이 말없이 사라진다. */
  if(dirty && !forced){
    if(!confirm('쓰고 있던 글이 있습니다.\n\n「' + t.n + '」 문구로 «통째로» 바꿉니다.\n'
      + '지금 쓴 글은 사라집니다. 진행할까요?')) return;
  }
  curId = id; dirty = false;
  closePop();
  draw();
  toast('📝 「' + t.n + '」 문구를 넣었습니다');
}

function openPop(ev){
  ev.stopPropagation();
  const p = document.getElementById('pop');
  p.innerHTML = '<div class="h">쓸 문구를 고르세요 — 제목과 본문이 «통째로» 바뀝니다</div>'
    + '<div class="lst">' + TPLS.map(t=>`
      <div class="i" onclick="useTpl('${t.id}')">
        <b>${curId===t.id?'✔ ':''}${esc(t.n)}</b>
        <span>${esc(fill(t.b).split('\n').filter(Boolean)[2] || fill(t.b).split('\n')[0])}</span>
      </div>`).join('') + '</div>'
    + '<div class="foot"><button onclick="newTpl();closePop()">＋ 새 문구</button>'
    + '<button onclick="closePop();document.querySelector(\'.mgr\').scrollIntoView({behavior:\'smooth\'})">'
    + '오른쪽에서 고치기</button></div>';
  p.style.display = 'block';
  setTimeout(()=>document.addEventListener('click', outside), 0);
}
function outside(e){ const p=document.getElementById('pop'); if(p.contains(e.target)) return; closePop(); }
function closePop(){ const p=document.getElementById('pop'); p.style.display='none';
  document.removeEventListener('click', outside); }

/* ── 오른쪽: 문구 목록·고치기 ── */
function drawMgr(){
  document.getElementById('tplList').innerHTML = TPLS.map(t=>`
    <div class="tp ${editId===t.id?'on':''}" onclick="pickEdit('${t.id}')">
      <b>${esc(t.n)}</b><span>${esc(t.s)}</span></div>`).join('');

  const t = byId(editId);
  document.getElementById('editor').innerHTML = `
    <label>문구 이름 <span style="font-weight:400;color:#8b98b3">— 고를 때 보이는 이름</span></label>
    <input id="eName" value="${esc(t.n)}" oninput="saveEdit()">
    <label>제목</label>
    <input id="eSubj" value="${esc(t.s)}" oninput="saveEdit()">
    <label>본문</label>
    <textarea id="eBody" oninput="saveEdit()">${esc(t.b)}</textarea>
    <div class="keys">
      ${Object.keys(VALS).map(k=>`<button onclick="ins('{${k}}')"
        title="${NEW_KEYS.indexOf(k)>=0?'새로 더하는 칸':'지금도 있는 칸'}">{${k}}${NEW_KEYS.indexOf(k)>=0?' ✨':''}</button>`).join('')}
    </div>
    <div class="row">
      <button class="p" onclick="useTpl('${t.id}')">이 문구로 쓰기</button>
      <button onclick="delTpl('${t.id}')" style="color:#c0392b;border-color:#f0c9c4">지우기</button>
    </div>`;
}
function pickEdit(id){ editId = id; drawMgr(); }
function saveEdit(){
  const t = byId(editId);
  t.n = document.getElementById('eName').value;
  t.s = document.getElementById('eSubj').value;
  t.b = document.getElementById('eBody').value;
  document.getElementById('tplList').innerHTML = TPLS.map(x=>`
    <div class="tp ${editId===x.id?'on':''}" onclick="pickEdit('${x.id}')">
      <b>${esc(x.n)}</b><span>${esc(x.s)}</span></div>`).join('');
  if(curId === t.id) drawBody();     /* 쓰고 있는 문구를 고치면 바로 보인다 */
}
function ins(k){
  const ta = document.getElementById('eBody'); if(!ta) return;
  const a = ta.selectionStart||0, b = ta.selectionEnd||0;
  ta.value = ta.value.slice(0,a) + k + ta.value.slice(b);
  ta.focus(); ta.selectionStart = ta.selectionEnd = a + k.length;
  saveEdit();
}
function newTpl(){
  const nm = prompt('새 문구의 이름을 적어 주세요.\n(고를 때 보이는 이름입니다)', '');
  if(!nm || !nm.trim()) return;
  const id = 'n' + (TPLS.length+1);
  TPLS.push({ id:id, n:nm.trim(), s:'[푸른노무법인] ',
    b:'{받는분} 님, 안녕하세요.\n{회사명} 담당 {담당자} 노무사입니다.\n\n\n\n'
     + '감사합니다.\n\n푸른노무법인 {보낸이}\n' });
  editId = id; drawMgr();
  toast('📝 「' + nm.trim() + '」 문구를 만들었습니다 — 전 직원이 함께 씁니다');
}
function delTpl(id){
  if(TPLS.length <= 1) return toast('마지막 문구는 지울 수 없습니다');
  const t = byId(id);
  if(!confirm('「' + t.n + '」 문구를 지웁니다.\n\n이미 보낸 메일은 그대로입니다.\n진행할까요?')) return;
  TPLS = TPLS.filter(x=>x.id!==id);
  if(editId===id) editId = TPLS[0].id;
  if(curId===id){ curId = TPLS[0].id; dirty = false; }
  draw();
  toast('🗑 「' + t.n + '」 문구를 지웠습니다');
}

/* ── 쓰기 화면 그리기 ── */
function drawBody(){
  const t = byId(curId);
  document.getElementById('subj').value = fill(t.s);
  if(!dirty) document.getElementById('body').textContent = fill(t.b);
  const missing = (t.b.match(/\{([^{}]{1,20})\}/g)||[])
    .map(x=>x.slice(1,-1)).filter(k=>VALS[k]==null);
  document.getElementById('hint').innerHTML =
    `지금 문구: <b style="color:#7b4bd1">${esc(t.n)}</b> · 여기서 고쳐 보내도 <b>문구는 안 바뀝니다.</b>`
    + (missing.length
        ? `<br><b style="color:#c0392b">⚠ 채울 수 없는 칸 ${esc(missing.map(k=>'{'+k+'}').join(' '))}
           — 그 자리는 «빈 값»으로 지워져 나갑니다</b>`
        : `<br>채우는 칸: ${Object.keys(VALS).map(k=>'{'+k+'}').join(' ')}`);
}
function draw(){ drawBody(); drawMgr(); drawNote(); }

document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('body').addEventListener('input', ()=>{ dirty = true; drawBody(); });
});

function drawNote(){
  document.getElementById('note2').innerHTML = `
  <h3>무엇이 바뀌나</h3>
  <table>
    <tr><th style="width:180px"></th><th>지금</th><th>바뀐 뒤</th></tr>
    <tr><td>문구 개수</td>
        <td class="bad">기본 1개 + 자료 갈래마다 1개</td>
        <td class="ok">필요한 만큼 (지금 것은 그대로 옮겨 옵니다)</td></tr>
    <tr><td>쓸 때 고르기</td>
        <td class="bad">못 한다 — 붙인 자료의 갈래가 정한다</td>
        <td class="ok">도구줄 <b>📝 문구</b> 에서 고른다</td></tr>
    <tr><td>자료 없는 편지</td>
        <td class="bad">「아래 자료를 첨부합니다」가 그대로 나간다</td>
        <td class="ok">③ 자료 없이 안내만 문구를 쓴다</td></tr>
    <tr><td>담당자 이름</td>
        <td class="bad">없다 — 맺음이 「푸른노무법인」 한 줄</td>
        <td class="ok"><code>{담당자}</code> <code>{보낸이}</code> 로 들어간다</td></tr>
    <tr><td>주인</td><td colspan="2" style="text-align:center">전 직원 공용 — 누구나 만들고 고친다</td></tr>
  </table>

  <h3 style="margin-top:16px">채우는 칸</h3>
  <div style="font-size:12.5px;line-height:1.9">
    지금 있는 것 — <code>{받는분}</code> <code>{회사명}</code> <code>{자료목록}</code> <code>{오늘}</code><br>
    새로 더할 것 — <code>{담당자}</code> ✨ <code>{보낸이}</code> ✨ <code>{이번달}</code> ✨ <code>{지난달}</code> ✨
  </div>
  <div style="margin-top:8px;font-size:12.5px;color:#5a6885;line-height:1.8">
    ⚠ <b><code>{담당자}</code> 는 방금 만든 담당자 표에서 옵니다</b> — 그 자문사를 맡은 노무사입니다.
    담당자를 아직 모르는 회사에 보내면 그 자리가 «빈 값»으로 지워져 나갑니다.
    (「{담당자}」라는 글자가 고객 메일에 나가는 일은 없습니다 — 지금 mailFill 이 이미 그렇게 합니다.)<br>
    ⚠ <b><code>{보낸이}</code> 는 지금 로그인한 직원</b>입니다. <code>{담당자}</code> 와 다를 수 있습니다 —
    담당은 박한별인데 김혜민이 대신 보낼 때가 그렇습니다.
  </div>

  <h3 style="margin-top:16px">해 보실 것</h3>
  <div style="font-size:13px;line-height:1.9">
    ① 도구줄 <b>📝 문구</b> → <b>「자료 없이 안내만」</b> 을 골라 보세요 — 자료 문구가 사라집니다.<br>
    ② 본문을 아무 데나 고친 뒤 다시 <b>📝 문구</b> 로 다른 것을 고르면 <b>「덮어쓸까요」</b> 를 묻습니다.<br>
    ③ 오른쪽에서 문구를 고치면 왼쪽에 <b>바로</b> 비칩니다. <b>{담당자}</b> 딱지를 눌러 넣어 보세요.
  </div>`;
}

let _t;
function toast(s){
  const el=document.getElementById('toast'); el.textContent=s; el.style.display='block';
  clearTimeout(_t); _t=setTimeout(()=>el.style.display='none', 3400);
}
draw();
</script>
</body>
</html>
