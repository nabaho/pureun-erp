<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>2중 대시보드 — 담당자 칸 + 사업장 칸 (목업 4안)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--navy:#2E3A8C;--violet:#7C6CE0;--ok:#2E7D4F;--warn:#B26A00;--bad:#C43D3D;
--ink:#23263B;--sub:#6B6F87;--line:#E3E5EF;--paper:#F5F6FA;--card:#FFF;}
*{box-sizing:border-box;margin:0}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--paper);color:var(--ink);font-size:14px}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 18px}
header .brand{font-weight:800;font-size:16px}
.wrap{max-width:1240px;margin:0 auto;padding:18px}
h1.mk{font-size:18px;margin-bottom:10px}
.intro{background:#FFF8E6;border:1px solid #F0D9A0;border-radius:12px;padding:13px 16px;margin-bottom:16px;font-size:13px;line-height:1.85}
.intro b{color:var(--warn)}
.opt{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:22px}
.opt > h2{font-size:15px;padding:13px 16px 3px;color:var(--navy)}
.opt > .bench{padding:0 16px 10px;font-size:11.5px;color:var(--sub)}
.rolebar{display:flex;gap:6px;align-items:center;padding:0 16px 11px;font-size:12px;color:var(--sub)}
.rolebar button{font-family:inherit;font-size:11.5px;border:1px solid var(--line);background:#fff;color:var(--sub);
  border-radius:99px;padding:4px 11px;cursor:pointer}
.rolebar button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.verdict{padding:12px 16px;font-size:12.5px;line-height:1.8;border-top:1px solid var(--line)}
.verdict .good::before{content:'○ ';color:var(--ok);font-weight:700}
.verdict .bad::before{content:'× ';color:var(--bad);font-weight:700}

/* ── 화면 틀 ── */
.screen{height:470px;display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper);overflow:hidden}

/* ① 담당자 칸 */
.colp{width:132px;flex:0 0 132px;background:var(--card);border-right:1px solid var(--line);overflow-y:auto}
.colp .ctitle{padding:10px 10px 5px;font-size:10.5px;color:var(--sub);font-weight:700}
.prow{display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:12.5px;cursor:pointer}
.prow:hover{background:#F5F7FF}
.prow.sel{background:#E7EBFB}
.prow.sel b{color:var(--navy)}
.prow b{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .n{font-size:10.5px;color:var(--sub);background:var(--paper);border-radius:99px;padding:1px 6px}
.prow.all{border-bottom:1px solid var(--line)}
.prow.all b{color:var(--violet)}
.prow.noman b{color:var(--bad)}
.prow .away{font-size:9.5px;color:var(--warn)}
.bar{height:4px;background:var(--line);border-radius:99px;margin:3px 10px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.pmeta{padding:0 10px 7px;font-size:10px;color:var(--sub)}

/* ② 사업장 칸 */
.colc{width:214px;flex:0 0 214px;background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
.colc .chead{padding:9px 10px 6px;border-bottom:1px solid var(--line)}
.colc .chead .ct{font-size:12px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.colc .chead .ct .n{font-size:10.5px;font-weight:700;color:var(--sub);background:var(--paper);border-radius:99px;padding:1px 6px}
.colc input{width:100%;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:11.5px;font-family:inherit}
.chips{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.chip{font-size:10.5px;border:1px solid var(--line);border-radius:99px;padding:2px 8px;cursor:pointer;background:#fff;font-family:inherit;color:var(--sub)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.clist{flex:1;overflow-y:auto}
.crow{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:12.5px;cursor:pointer;border-bottom:1px solid #F2F3F8}
.crow:hover{background:#F5F7FF}
.crow.sel{background:#E7EBFB}
.crow .handle{color:var(--sub);font-size:11px;cursor:grab}
.crow .dot{width:6px;height:6px;border-radius:99px;background:var(--line);flex:0 0 6px}
.crow .dot.arr{background:var(--ok)}
.crow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .cnt{font-size:10.5px;color:var(--sub)}
.crow .own{font-size:9.5px;color:var(--sub);background:var(--paper);border-radius:99px;padding:1px 5px}
.cempty{padding:14px 10px;font-size:11.5px;color:var(--sub);line-height:1.6}

/* ③ 본문 */
.pane{flex:1;min-width:0;padding:12px 14px;overflow-y:auto}
.pane h3{font-size:14px;margin-bottom:2px}
.pane .sub{font-size:11.5px;color:var(--sub);margin-bottom:10px;line-height:1.6}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tbl th{background:#F7F8FC;text-align:left;padding:6px 8px;color:var(--sub);font-weight:700;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl .g{color:var(--ok);font-weight:700}
.tbl .r{color:var(--bad);font-weight:700}
.kpi{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:11px;color:var(--sub)}
.kpi div b{display:block;font-size:16px;color:var(--ink);margin-top:1px}
.kpi div.warn b{color:var(--warn)}
.fold{width:15px;flex:0 0 15px;background:var(--card);border-right:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub);font-size:11px}
.fold:hover{background:#F5F7FF}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#23263B;color:#fff;
  padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);display:none;z-index:9}
.toast.on{display:block}
.w{color:var(--bad);font-weight:700}
</style></head><body>

<header><span class="brand">📥 급여데이터함 — 2중 대시보드</span></header>
<div class="wrap">

<h1 class="mk">담당자 칸 + 사업장 칸, 그리고 본문 — 4가지 안</h1>

<div class="intro">
말씀하신 2중 구조는 <b>아웃룩·맥 파인더가 쓰는 3단</b>입니다.
앞선 안 C의 약점("좁은 칸에서 30곳 굴리기")이 여기서는 사라집니다 —
사업장이 <b>전용 칸</b>을 가지면 화면 높이를 통째로 써서 메일함처럼 굴러갑니다. 31곳이든 112곳이든 같습니다.<br>
각 안에서 <b>관리자 / 담당자</b> 단추를 눌러 두 사람 화면을 견주어 보세요 —
담당자에게는 첫 칸이 자기 이름 하나뿐이라 <b>없는 편이 낫습니다.</b>
</div>

<div id="opts"></div>
</div>
<div class="toast" id="t"></div>

<script>
/* ══════ 목업용 가짜 자료 — 급여 112곳 ══════ */
var STEM = ['화담','이비','대한','서일','남광','태평','우리','성진','한빛','경동','삼우','동방','신흥','유성',
'한마음','제일','금성','대원','청우','미래','한솔','동양','서광','태성','광명','신라','대성','우진','한독','명진','세종'];
var SUF = ['산업','기공','테크','물산','건설','식품','물류','전자','정밀','화학'];

var PEOPLE = [
  { name:'김대표', me:true, n:4 },
  { name:'박노무', n:33 },
  { name:'이사무', n:28 },
  { name:'최주임', n:20, away:true },
  { name:'정대리', n:24 },
  { name:'담당 없음', noman:true, n:3 }
];

var ALL = [], seq = 0;
PEOPLE.forEach(function(p, pi){
  p.cos = [];
  for (var i = 0; i < p.n; i++){
    var nm = STEM[(seq * 3 + pi) % STEM.length] + SUF[(seq * 7 + i) % SUF.length];
    var arrived = ((seq * 5 + pi) % 3) === 0;
    var c = { name: nm, arrived: arrived, count: arrived ? ((seq % 6) + 1) : 0, owner: p.name, away: !!p.away };
    p.cos.push(c); ALL.push(c); seq++;
  }
  // 대표 결정: 자료 온 곳 먼저
  p.cos.sort(function(a,b){ return (b.arrived?1:0) - (a.arrived?1:0); });
  p.done = p.cos.filter(function(c){ return c.arrived; }).length;
});
ALL.sort(function(a,b){ return (b.arrived?1:0) - (a.arrived?1:0); });
var TOTAL = ALL.length, DONE = ALL.filter(function(c){ return c.arrived; }).length;

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function toast(m){
  var t = document.getElementById('t'); t.textContent = m; t.classList.add('on');
  clearTimeout(window._h); window._h = setTimeout(function(){ t.classList.remove('on'); }, 2500);
}
var ME = PEOPLE[1];   // 담당자로 볼 때는 박노무(33곳)로 본다

/* ── 조각들 ── */
function crow(c, sel, showOwner, drag){
  return '<div class="crow' + (sel ? ' sel' : '') + '">'
    + (drag ? '<span class="handle">⠿</span>' : '')
    + '<span class="dot' + (c.arrived ? ' arr' : '') + '"></span>'
    + '<span class="nm">' + esc(c.name) + '</span>'
    + (showOwner ? '<span class="own">' + esc(c.owner) + '</span>' : '')
    + '<span class="cnt">' + c.count + '</span></div>';
}
function colCompanies(title, list, opt){
  opt = opt || {};
  var rows = list.slice(0, 60).map(function(c, i){ return crow(c, i === 0, !!opt.owner, !!opt.drag); }).join('');
  return '<div class="colc">'
    + '<div class="chead"><div class="ct">' + esc(title) + '<span class="n">' + list.length + '곳</span></div>'
    + '<input placeholder="사업장 이름으로 찾기">'
    + (opt.chips === false ? '' : '<div class="chips"><button class="chip on">전체</button>'
      + '<button class="chip">안 온 곳</button><button class="chip">온 곳</button></div>')
    + '</div>'
    + '<div class="clist">' + (list.length ? rows : '<div class="cempty">해당 없음</div>') + '</div></div>';
}
function paneCo(c, extra){
  if (!c) return '<div class="pane"><div class="sub">가운데 칸에서 사업장을 고르면 여기에 서랍이 열립니다.</div></div>';
  return '<div class="pane"><h3>' + esc(c.name) + '</h3>'
    + '<div class="sub">담당 ' + esc(c.owner) + ' · 2026년 8월</div>'
    + (extra || '')
    + '<table class="tbl"><tr><th>서류</th><th>들어옴</th><th>판독</th></tr>'
    + '<tr><td>근태자료</td><td class="g">2장</td><td>끝</td></tr>'
    + '<tr><td>임금대장</td><td class="g">1장</td><td>끝</td></tr>'
    + '<tr><td>변동 알림</td><td class="r">없음</td><td>-</td></tr>'
    + '<tr><td>근로계약서</td><td class="g">3장</td><td>보관</td></tr></table></div>';
}
function paneAll(){
  var rows = ALL.slice(0, 14).map(function(c){
    return '<tr><td>' + esc(c.name) + '</td><td>' + esc(c.owner) + '</td><td class="'
      + (c.arrived ? 'g' : 'r') + '">' + (c.arrived ? '도착' : '미도착') + '</td><td>' + c.count + '장</td></tr>';
  }).join('');
  return '<div class="pane"><h3>급여 사업장 전체</h3>'
    + '<div class="sub">2026년 8월 기준 · 유형 「급여」 ' + TOTAL + '곳</div>'
    + '<div class="kpi"><div>전체<b>' + TOTAL + '</b></div>'
    + '<div>자료 옴<b>' + DONE + '</b></div>'
    + '<div class="warn">아직<b>' + (TOTAL - DONE) + '</b></div>'
    + '<div>담당 없음<b>3</b></div></div>'
    + '<table class="tbl"><tr><th>사업장</th><th>담당</th><th>이 달</th><th>장수</th></tr>' + rows + '</table>'
    + '<div class="sub" style="margin-top:8px">…아래로 ' + (TOTAL - 14) + '곳 더</div></div>';
}

/* ══════ 안 1 · 2중 기본 — 첫 칸 맨 위에 「전체」 ══════ */
function opt1(box, role){
  if (role === 'staff'){
    box.innerHTML = '<div class="screen">'
      + colCompanies('내 담당 사업장', ME.cos, { drag: true })
      + paneCo(ME.cos[0], '<div class="sub" style="color:var(--ok)">담당자에게는 <b>첫 칸이 아예 안 뜹니다</b> — 자기 이름 하나뿐이라 자리만 먹습니다. 화면이 그만큼 넓어집니다.</div>')
      + '</div>';
    return;
  }
  var p = '<div class="colp"><div class="ctitle">담당자</div>'
    + '<div class="prow all sel"><b>전체</b><span class="n">' + TOTAL + '</span></div>';
  PEOPLE.forEach(function(x){
    p += '<div class="prow' + (x.noman ? ' noman' : '') + '"><b>' + esc(x.name) + '</b>'
      + '<span class="n">' + x.cos.length + '</span></div>';
  });
  p += '</div>';
  box.innerHTML = '<div class="screen">' + p
    + colCompanies('급여 사업장 전체', ALL, { owner: true })
    + paneAll() + '</div>';
}

/* ══════ 안 2 · 첫 칸에 진행률 막대 ══════ */
function opt2(box, role){
  if (role === 'staff'){
    box.innerHTML = '<div class="screen">'
      + colCompanies('내 담당 사업장', ME.cos, { drag: true })
      + paneCo(ME.cos[0], '<div class="sub">담당자 화면은 안 1과 같습니다 — 첫 칸 없이 두 칸.</div>')
      + '</div>';
    return;
  }
  var p = '<div class="colp"><div class="ctitle">담당자 · 이 달 진행</div>';
  p += '<div class="prow all sel"><b>전체</b><span class="n">' + DONE + '/' + TOTAL + '</span></div>'
    + '<div class="bar"><i style="width:' + Math.round(DONE / TOTAL * 100) + '%"></i></div>'
    + '<div class="pmeta">아직 ' + (TOTAL - DONE) + '곳</div>';
  PEOPLE.forEach(function(x){
    var pct = x.cos.length ? Math.round(x.done / x.cos.length * 100) : 0;
    p += '<div class="prow' + (x.noman ? ' noman' : '') + '"><b>' + esc(x.name) + '</b>'
      + (x.away ? '<span class="away">·</span>' : '')
      + '<span class="n">' + x.done + '/' + x.cos.length + '</span></div>'
      + '<div class="bar"><i style="width:' + pct + '%"></i></div>'
      + '<div class="pmeta">아직 ' + (x.cos.length - x.done) + '곳</div>';
  });
  p += '</div>';
  box.innerHTML = '<div class="screen">' + p
    + colCompanies('급여 사업장 전체', ALL, { owner: true })
    + paneAll() + '</div>';
}

/* ══════ 안 3 · 첫 칸 접기 (‹ 단추) ══════ */
function opt3(box, role){
  var st = { fold: role === 'staff' };
  function draw(){
    var h = '<div class="screen">';
    if (st.fold){
      h += '<div class="fold" data-f="1" title="담당자 칸 펼치기">›</div>';
    } else {
      var p = '<div class="colp"><div class="ctitle">담당자</div>'
        + '<div class="prow all"><b>전체</b><span class="n">' + TOTAL + '</span></div>';
      PEOPLE.forEach(function(x, i){
        p += '<div class="prow' + (i === 1 ? ' sel' : '') + (x.noman ? ' noman' : '') + '">'
          + '<b>' + esc(x.name) + '</b><span class="n">' + x.cos.length + '</span></div>';
      });
      p += '</div><div class="fold" data-f="0" title="담당자 칸 접기">‹</div>';
      h += p;
    }
    h += colCompanies(role === 'staff' ? '내 담당 사업장' : '박노무 담당', ME.cos, { drag: role === 'staff' });
    h += paneCo(ME.cos[0], role === 'staff'
      ? '<div class="sub" style="color:var(--ok)">담당자는 기본이 <b>접힌 상태</b>입니다. 열어도 자기 이름 한 줄뿐입니다.</div>'
      : '<div class="sub">가운데 「‹」를 눌러 담당자 칸을 접었다 폈다 할 수 있습니다.</div>');
    h += '</div>';
    box.innerHTML = h;
    box.querySelectorAll('[data-f]').forEach(function(el){
      el.onclick = function(){ st.fold = el.dataset.f === '0'; draw(); };
    });
  }
  draw();
}

/* ══════ 안 4 · 첫 칸에 「보기」를 담는다 (담당자 말고 관점) ══════ */
function opt4(box, role){
  var VIEWS = [
    { k:'mine', t:'내 담당', n: ME.cos.length },
    { k:'late', t:'아직 안 온 곳', n: TOTAL - DONE, warn: true },
    { k:'today', t:'오늘 들어온 것', n: 7 },
    { k:'noman', t:'담당 없음', n: 3, bad: true },
    { k:'all', t:'전체 사업장', n: TOTAL }
  ];
  var st = { v: role === 'staff' ? 'mine' : 'late' };
  function listFor(k){
    if (k === 'mine') return ME.cos;
    if (k === 'late') return ALL.filter(function(c){ return !c.arrived; });
    if (k === 'today') return ALL.filter(function(c){ return c.arrived; }).slice(0, 7);
    if (k === 'noman') return PEOPLE[5].cos;
    return ALL;
  }
  function draw(){
    var vs = role === 'staff' ? VIEWS.filter(function(v){ return v.k === 'mine' || v.k === 'late'; }) : VIEWS;
    var p = '<div class="colp"><div class="ctitle">보기</div>';
    vs.forEach(function(v){
      p += '<div class="prow' + (st.v === v.k ? ' sel' : '') + (v.bad ? ' noman' : '') + '" data-v="' + v.k + '">'
        + '<b>' + esc(v.t) + '</b><span class="n">' + (v.k === 'late' && role === 'staff'
          ? (ME.cos.length - ME.done) : v.n) + '</span></div>';
    });
    if (role !== 'staff'){
      p += '<div class="ctitle" style="padding-top:12px">담당자</div>';
      PEOPLE.forEach(function(x){
        p += '<div class="prow" data-v="p:' + esc(x.name) + '"><b>' + esc(x.name) + '</b>'
          + '<span class="n">' + x.cos.length + '</span></div>';
      });
    }
    p += '</div>';
    var cur = st.v.indexOf('p:') === 0
      ? (PEOPLE.filter(function(x){ return x.name === st.v.slice(2); })[0] || ME).cos
      : listFor(st.v);
    var title = st.v.indexOf('p:') === 0 ? st.v.slice(2) + ' 담당'
      : (vs.filter(function(v){ return v.k === st.v; })[0] || VIEWS[0]).t;
    box.innerHTML = '<div class="screen">' + p
      + colCompanies(title, cur, { owner: role !== 'staff', drag: st.v === 'mine' })
      + (st.v === 'all' ? paneAll() : paneCo(cur[0],
          '<div class="sub">왼쪽 첫 칸이 <b>사람</b>이 아니라 <b>보기</b>입니다 — 담당자도 쓸 것이 있습니다.</div>'))
      + '</div>';
    box.querySelectorAll('[data-v]').forEach(function(el){
      el.onclick = function(){ st.v = el.dataset.v; draw(); };
    });
  }
  draw();
}

/* ══════ 그리기 ══════ */
var OPTS = [
  { t:'안 1 · 2중 기본 — 첫 칸 맨 위에 「전체」', fn: opt1,
    b:'맥 파인더 컬럼 보기 · 아웃룩 폴더+메일 목록. 첫 칸에서 사람을 고르면 가운데 칸이 그 사람 사업장으로 바뀝니다.',

var box = document.getElementById('opts');
OPTS.forEach(function(o, i){
  var d = document.createElement('div');
  d.className = 'opt';
  d.innerHTML = '<h2>' + o.t + '</h2><div class="bench">벤치마킹 — ' + o.b + '</div>'
    + '<div class="rolebar"><span>누구로 볼까:</span>'
    + '<button class="on" data-r="admin">관리자(대표)</button>'
    + '<button data-r="staff">담당자(박노무)</button></div>'
    + '<div class="body"></div><div class="verdict">' + o.v + '</div>';
  box.appendChild(d);
  var body = d.querySelector('.body');
  o.fn(body, 'admin');
  d.querySelectorAll('[data-r]').forEach(function(btn){
    btn.onclick = function(){
      d.querySelectorAll('[data-r]').forEach(function(b){ b.classList.remove('on'); });
      btn.classList.add('on');
      o.fn(body, btn.dataset.r);
