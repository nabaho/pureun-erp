<!doctype html>
<meta charset="utf-8">
<title>쓰기 화면 틀고정 — 고친 뒤</title>
<style>
  /* 앱과 «같은 뼈대»만 옮겨 온다 */
  html,body{margin:0;height:100%;font:14px/1.55 -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
  #pcRoot{display:flex;height:100vh;overflow:hidden}
  #pcMain{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
  #pcTop{padding:8px 24px;border-bottom:1px solid #f0f0f0;background:#fff}
  #pcMail{flex:1 1 auto;min-height:0;overflow:auto;padding:0 24px 40px 16px}

  /* ── 이번에 넣은 규칙 ── */
  #pcMail .cphead{position:sticky;top:0;z-index:6;background:#fff;
    border-bottom:1px solid #e8ecf3}
  #pcMail .cphead .mtop{padding:10px 0 12px;margin:0}
  #pcMail .cphead .cprow:last-child{border-bottom:none}

  .mtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 0 14px;margin-bottom:0}
  .mwrap{display:flex}
  .mwrap .mmain{flex:1;min-width:0;padding-right:14px}
  .cprow{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid #eef1f6}
  .cpk{flex:0 0 74px;font-size:13.5px;color:#33415e;font-weight:500}
  .cpsendbtn{background:#fff;color:#1e2a47;border:1px solid #1e2a47;border-radius:6px;
    padding:8px 22px;font-size:14px;font-weight:700}
  .cpghost{border:none;background:none;color:#33415e;font-size:14px;padding:8px 6px}
  .mauto{margin-left:auto;color:#98a3b8;font-size:12px}
  .setback{border:1px solid #dde3ee;background:#fff;border-radius:8px;padding:8px 12px}
  .edbar{display:flex;gap:6px;padding:8px 0;border-bottom:1px solid #eef1f6;color:#7b869c;font-size:13px}
  .cpbody{min-height:1400px;padding:12px 0;color:#8a93a5}
</style>
<div id="pcRoot"><main id="pcMain">
  <div id="pcTop">권형하 대표노무사 · P-001</div>
  <div id="pcMail">
    <div class="mwrap"><div class="mmain">
      <div class="cphead">
        <div class="mtop">
          <button class="cpsendbtn">보내기</button>
          <button class="cpghost">임시저장</button>
          <button class="cpghost">미리보기</button>
          <label><input type="checkbox"> 내게쓰기</label>
          <label><input type="checkbox" disabled> 한명씩 발송</label>
          <span class="mauto"></span>
          <button class="setback">← 목록으로</button>
        </div>
        <div class="cprow"><span class="cpk">보내는사람</span><b>푸른노무법인 &lt;370-6@daum.net&gt;</b></div>
        <div class="cprow"><span class="cpk">받는사람</span><span>이름·회사·이메일로 찾기</span></div>
        <div class="cprow"><span class="cpk">참조 ˅</span><span>필요할 때만 (쉼표로 여러 명)</span></div>
        <div class="cprow"><span class="cpk">제목</span><span>제목을 적으세요</span></div>
        <div class="cprow"><span class="cpk">첨부 ^</span><span>파일 첨부하기</span></div>
      </div>
      <div class="edbar">가 가 가 · 왼 중 우 · 📝 문구 · ✍ 서명</div>
      <div class="cpbody" id="B">본문</div>
    </div></div>
  </div>
</main></div>
<script>
  let h = '';
  for (let i = 1; i <= 60; i++) h += '<div>' + i + '번째 줄 — 내려도 위 머리칸이 붙어 있어야 합니다.</div>';
  document.getElementById('B').innerHTML = h;
</script>
