<!doctype html><meta charset="utf-8">
<!-- 푸른 포털 아이콘 후보 — 색과 결 12 (대표 지시 2026-08-27 「추가 더」)
     ★ 앞 네 장(42개)은 «전부 파랑» 이었다. 이름이 「푸른」이라 파랑에 스스로
       갇혀 있었던 것이다. 여기서는 색을 먼저 갈랐다 —
       먹빛 · 인주 붉은색 · 금색 · 청록 · 흰 바탕.
     ⚠ 색을 바꾸면 「푸른」이라는 이름과의 연결이 약해진다. 그 값을 치르고
       얻는 것이 있는지는 대표가 정한다 — 우리가 대신 정할 일이 아니다.
     ⚠ 「매듭」은 잘못 그리면 그냥 «#» 으로 읽힌다. 엮인 자리(가로가 세로 위로
       지나는 곳)를 또렷이 그려야 매듭이 된다.
     ⚠ 홈 화면 아이콘은 작을 때 읽히는지가 전부라 44px 미리보기를 나란히 둔다. -->
<style>
 body{margin:0;background:#141821;color:#e7ecf5;font-family:system-ui,sans-serif;-webkit-font-smoothing:antialiased}
 .wrap{padding:26px 22px 30px}
 h1{font-size:21px;margin:0 0 4px;letter-spacing:-.4px}
 .sub{font-size:12.5px;color:#93a1bb;margin:0 0 22px;line-height:1.6}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
 .cell{background:#1b2130;border:1px solid #29324a;border-radius:16px;padding:16px 14px 13px;
   display:flex;flex-direction:column;align-items:center}
 .head{width:100%;display:flex;align-items:center;gap:7px;margin-bottom:11px}
 .num{width:21px;height:21px;border-radius:7px;background:#2f3a54;color:#c8d5ee;
   font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
 .nm{font-size:13px;font-weight:800;letter-spacing:-.3px}
 .big{width:132px;height:132px;display:block}
 .cap{font-size:11px;color:#8fa0bd;line-height:1.55;margin-top:10px;text-align:center;min-height:34px}
 .mini{margin-top:9px;display:flex;align-items:center;gap:9px;background:#11151d;border-radius:9px;padding:6px 10px}
 .mini svg{width:44px;height:44px;display:block}
 .mini span{font-size:10px;color:#6d7c96}
</style>
<div class="wrap">
<h1>푸른 포털 아이콘 — 색과 결 12</h1>
<p class="sub">이번에는 <b>색</b>과 <b>결</b>을 갈랐습니다 — 먹빛 · 인주 붉은색 · 금색 · 청록 · 흰 바탕.
파랑만 고집하지 않았습니다. 아래 작은 것이 실제 홈 화면 크기(44px)예요.</p>
<div class="grid" id="g"></div>
</div>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#F0D999"/><stop offset=".5" stop-color="#D4AF37"/>
  <stop offset="1" stop-color="#A9782A"/></linearGradient>
<linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#065F46"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#9EC5F5"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient>
<linearGradient id="bl" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient>
<linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#2A2F38"/><stop offset="1" stop-color="#0E1116"/></linearGradient>
</defs></svg>
<div id="defs2"></div>
<script>
function G(d,x,y,size,color,w,round){
  return '<g transform="translate('+x+','+y+') scale('+(size/100)+')" fill="none" stroke="'+color+
    '" stroke-width="'+w+'" stroke-linecap="'+(round?'round':'butt')+
    '" stroke-linejoin="'+(round?'round':'miter')+'"><path d="'+d+'"/></g>';
}
function 푸(w){var a=w/2,b=44-a;return 'M0 '+a+'H100 M24 '+a+'V'+b+' M76 '+a+'V'+b+' M0 '+b+'H100 M0 66 H100 M50 66 V'+(100-a);}
function 른(w){var a=w/2;return 'M0 '+a+'H100 V21 H0 V'+(42-a)+' H100 M0 55 H100 M'+a+' 68 V'+(100-a)+' H100';}
function ㅍ(w){var a=w/2+16,b=84-w/2;return 'M0 '+a+'H100 M24 '+a+'V'+b+' M76 '+a+'V'+b+' M0 '+b+'H100';}
var SQ='<rect width="512" height="512" rx="118" ';

var D=[
['먹 푸','흰 한지에 먹빛. 서류·서예의 격 — 파랑을 아예 버린 안',
 SQ+'fill="#F6F3EC"/>'+G(푸(17),116,110,280,'url(#ink)',17,false)
 +'<rect x="368" y="368" width="56" height="56" rx="8" fill="#B4322C"/>'],

['인장 푸','인주 붉은색 도장. 「법인」의 힘이 가장 세다',
 SQ+'fill="#B4322C"/>'
 +'<rect x="34" y="34" width="444" height="444" rx="92" fill="none" stroke="#F7E9DC" stroke-opacity=".5" stroke-width="9"/>'
 +G(푸(19),126,120,260,'#FDF3E7',19,false)],

['금박 푸른','짙은 남색에 금색. 격식 차린 자리에 어울린다',
 SQ+'fill="#0A1740"/>'+G(푸(11),46,166,180,'url(#gold)',11,false)
 +G(른(10),286,166,180,'url(#gold)',10,false)],

['창살 ㅍ','한국 전통 창살 위에 자음 하나 — 우리 결',
 SQ+'fill="#12305F"/>'
 +'<g stroke="#3F73C4" stroke-width="9" opacity=".75">'
 +'<path d="M128 40V472 M256 40V472 M384 40V472 M40 128H472 M40 256H472 M40 384H472"/></g>'
 +'<rect x="96" y="150" width="320" height="212" rx="26" fill="#12305F" opacity=".9"/>'
 +G(ㅍ(19),126,146,260,'#EAF1FF',19,false)],

['청록 푸','파랑이 아닌 푸름. 맑고 조용하다',
 SQ+'fill="url(#teal)"/>'+G(푸(17),116,116,280,'#fff',17,true)],

['선만 그린 푸','채우지 않고 긋기만. 가장 가볍다',
 SQ+'fill="#fff"/>'
 +'<circle cx="256" cy="256" r="174" fill="none" stroke="#1D4ED8" stroke-width="8"/>'
 +G(푸(8),156,156,200,'#1D4ED8',8,true)],

['산과 푸','푸른 산 — 이름의 「푸른」을 색이 아니라 풍경으로',
 SQ+'fill="url(#sky)"/>'
 +'<path d="M0 512l150-190 96 118 76-96 190 168z" fill="#0C1E4E" opacity=".92"/>'
 +'<path d="M0 512l150-190 96 118 76-96 190 168z" fill="none" stroke="#BFD5FF" stroke-opacity=".35" stroke-width="6"/>'
 +G(푸(14),146,96,220,'#fff',14,true)],

['서류 ㅍ','종이 한 장. 우리가 다루는 것은 결국 서류다',
 SQ+'fill="url(#bl)"/>'
 +'<path d="M118 92h206l70 70v258c0 18-14 32-32 32H118c-18 0-32-14-32-32V124c0-18 14-32 32-32z" fill="#fff"/>'
 +'<path d="M324 92l70 70h-70z" fill="#BFD5FF"/>'
 +G(ㅍ(20),146,180,180,'#1D4ED8',20,false)],

['사람과 저울','사람이 저울을 받쳐 든다 — 노무의 자리',
 SQ+'fill="#0E2A6B"/>'
 +'<g fill="#EAF1FF"><circle cx="256" cy="126" r="42"/>'
 +'<rect x="238" y="180" width="36" height="180" rx="14"/>'
 +'<rect x="86" y="196" width="340" height="22" rx="11"/>'
 +'<path d="M96 236h116c0 34-20 54-58 54s-58-20-58-54z"/>'
 +'<path d="M300 236h116c0 34-20 54-58 54s-58-20-58-54z"/>'
 +'<rect x="160" y="362" width="192" height="26" rx="13"/></g>'],

['매듭','가로세로가 서로 엮인다 — 짜임·매듭의 무늬',
 SQ+'fill="#EAF1FF"/>'
 +'<g stroke="#1D4ED8" stroke-width="40" stroke-linecap="round" fill="none">'
 +'<path d="M176 110V402 M336 110V402"/></g>'
 +'<g stroke="#60A5FA" stroke-width="40" stroke-linecap="round" fill="none">'
 +'<path d="M110 176H402 M110 336H402"/></g>'
 +'<g stroke="#1D4ED8" stroke-width="40" stroke-linecap="round" fill="none">'
 +'<path d="M176 150V202 M336 310V362"/></g>'],

['확인 푸','오른쪽 아래 체크 하나 — 「검토 끝」의 뜻',
 SQ+'fill="url(#bl)"/>'+G(푸(15),100,100,250,'#fff',15,true)
 +'<circle cx="378" cy="378" r="80" fill="#16A34A"/>'
 +'<path d="M340 380l28 30 52-62" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>'],

['한쪽으로 푸','가운데를 비운다 — 요즘 브랜드의 짜임',
 SQ+'fill="#2563EB"/>'+G(푸(16),40,216,256,'#fff',16,false)]
];
var d='<svg width="0" height="0" style="position:absolute"><defs>';
for(var i=0;i<D.length;i++) d+='<symbol id="w'+(i+1)+'" viewBox="0 0 512 512">'+D[i][2]+'</symbol>';
document.getElementById('defs2').innerHTML=d+'</defs></svg>';
var h='';
for(var i=0;i<D.length;i++){var n=i+1;
 h+='<div class="cell"><div class="head"><div class="num">'+n+'</div><div class="nm">'+D[i][0]+'</div></div>'+
    '<svg class="big"><use href="#w'+n+'"/></svg><div class="cap">'+D[i][1]+'</div>'+
    '<div class="mini"><svg><use href="#w'+n+'"/></svg><span>실제 크기</span></div></div>';}
document.getElementById('g').innerHTML=h;
</script>
