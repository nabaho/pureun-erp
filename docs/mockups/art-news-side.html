<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:380px;height:500px;overflow:hidden}
svg{display:block}
</style></head><body>
<!-- 주간노동뉴스 «옆» 사진 자리 — 190×250 을 2배(380×500)로 찍는다.
     ⚠ 이 자리는 기사 줄 왼쪽에 선다. 글이 주인이라 그림은 «조용해야» 한다.
     ⚠ 글자를 넣지 않는다 — 꼭지 제목이 이미 「주간노동뉴스」다. -->
<svg width="380" height="500" viewBox="0 0 380 500" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="paper" x1="0" y1="0" x2="0.4" y2="1">
   <stop offset="0" stop-color="#faf7f3"/>
   <stop offset="1" stop-color="#efe9e1"/>
  </linearGradient>
 </defs>

 <rect width="380" height="500" fill="url(#paper)"/>
 <rect x="0.75" y="0.75" width="378.5" height="498.5" fill="none" stroke="#d9d2c8" stroke-width="1.5"/>

 <!-- 쌓인 서류 석 장 — 뒤에서 앞으로. 노무는 «서류로 남는 일»이다 -->
 <g stroke="#6f5a48" fill="#ffffff" stroke-width="3">
  <rect x="86" y="96"  width="196" height="256" rx="4" opacity="0.35"/>
  <rect x="72" y="112" width="196" height="256" rx="4" opacity="0.60"/>
  <rect x="58" y="128" width="196" height="256" rx="4"/>
 </g>

 <!-- 맨 앞 장의 «글줄» — 제목 한 줄과 본문 줄들 -->
 <g fill="#6f5a48">
  <rect x="80" y="156" width="104" height="9" rx="2"/>
  <rect x="80" y="176" width="152" height="9" rx="2" opacity="0.30"/>
 </g>
 <g fill="#a89684">
  <rect x="80" y="204" width="152" height="5" rx="2.5"/>
  <rect x="80" y="220" width="152" height="5" rx="2.5"/>
  <rect x="80" y="236" width="124" height="5" rx="2.5"/>
  <rect x="80" y="262" width="152" height="5" rx="2.5"/>
  <rect x="80" y="278" width="152" height="5" rx="2.5"/>
  <rect x="80" y="294" width="96"  height="5" rx="2.5"/>
  <rect x="80" y="320" width="140" height="5" rx="2.5"/>
  <rect x="80" y="336" width="112" height="5" rx="2.5"/>
 </g>

 <!-- 도장 — 법인 이름으로 나가는 글이라는 표 -->
 <g>
  <circle cx="236" cy="330" r="31" fill="none" stroke="#8a3b32" stroke-width="4" opacity="0.75"/>
  <circle cx="236" cy="330" r="24" fill="none" stroke="#8a3b32" stroke-width="1.5" opacity="0.45"/>
  <text x="236" y="341" text-anchor="middle" font-family="'Malgun Gothic',sans-serif"
    font-size="27" font-weight="bold" fill="#8a3b32" opacity="0.8">푸</text>
 </g>

 <!-- 아래 갈색 띠 — 편지의 갈색 결과 이어 준다 -->
 <rect x="0" y="428" width="380" height="72" fill="#6f5a48"/>
 <rect x="0" y="428" width="380" height="3" fill="#c9a97e" opacity="0.55"/>
 <g fill="#f5f1ec" opacity="0.92">
  <rect x="30" y="452" width="72" height="5" rx="2.5"/>
  <rect x="30" y="468" width="104" height="5" rx="2.5" opacity="0.6"/>
 </g>
 <g fill="#c9a97e" opacity="0.85">
  <circle cx="332" cy="464" r="5"/>
  <circle cx="313" cy="464" r="5" opacity="0.55"/>
  <circle cx="294" cy="464" r="5" opacity="0.3"/>
 </g>
</svg>
</body></html>
