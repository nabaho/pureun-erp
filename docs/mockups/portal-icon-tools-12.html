     ★ 앞 여섯 장(66개)은 «이름» 과 «업의 상징» 에서 골랐다. 이번에는 노무가 실제로
       다루는 것에서 골랐다 — 시간(모래시계·달력·출퇴근카드) · 임금(₩) ·
       기준(자) · 지지(받치는 손·우산) · 사무의 물건(클립·인장·깃발).

     ⚠ 그리며 버린 것 둘 — 뜻이 좋아도 «안 읽히면» 아이콘이 아니다.
       · 악수 : 두 번 그렸는데 44px 에서 «아령» 으로 읽혔다. 손가락이 뭉개진다.
                노사 합의는 우리 일의 핵심인데도 버렸다.
       · 톱니 : 톱니와 원이 겹쳐 덩어리가 됐고, 무엇보다 «설정 앱» 으로 읽힌다.
     ⚠ 그리고 «일장기 함정» — 크림 바탕에 붉은 동그라미는 도장이 아니라 일장기로
       읽힌다. 한국 도장은 대개 네모다. 그래서 인장은 둥근 판이 아니라 네모로 그린다.
       이런 것은 검사로 못 잡는다. 그려 놓고 «눈으로» 봐야 안다. -->
