<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>목업 — 푸른 분류를 «담당자 / 업무별» 두 대시보드로</title>
<!--
  ═══════════════════════════════════════════════════════════════════════
  대표 지시 2026-08-26(넷째):
    "1로하되 푸른분류는 대시보드 두개로 나누어서 담당자, 업무별 로 나눠서 볼 수 있을까?"
  ═══════════════════════════════════════════════════════════════════════
  · 「1」 = 앞 목업의 «안 1 걸러 보기» — 메일은 업무 칸에 그대로 있고, 담당자 칸은
    그중에서 «그 사람 것만» 골라 보여 준다. 한 통을 두 눈으로 본다.
  · 여기서 새로 정할 것은 «두 대시보드를 어떻게 놓느냐»뿐이다. 세 가지를 나란히 둔다.

  ★ 숫자는 지어낸 것이 아니다 — 2026-08-26 실시간DB 를 그대로 세었다.
    업무 칸 통수(400·400·387…)도, 담당자별 통수(박한별124 …)도 실측이다.

  ⚠ 클래스 이름은 pu-cards.html 과 같은 dm- 결을 쓴다. 승인되면 그대로 옮긴다.
-->
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'맑은 고딕','Malgun Gothic',AppleSDGothicNeo-Regular,'돋움',dotum,sans-serif;
  background:#f6f7f9;color:#1a1a1a;-webkit-font-smoothing:antialiased}
:root{--blue:#2563d1;--sub:#8c8c8c;--line:#e4e5e9;--hover:#f7f8fa;--sel:#eef3fb;
  --pu:#0f8a5f;--pu-bg:#eaf6f1;--who:#7b4bd1;--who-bg:#f2ecfd}

.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px 0}
.top h1{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.4px}
.top p{margin:0 0 14px;font-size:13px;color:#5b6068;line-height:1.75}
.tabs{display:flex;gap:6px}
.tabs button{font-family:inherit;font-size:13.5px;font-weight:700;border:1px solid var(--line);
  border-bottom:none;background:#f1f3f5;color:#6b7078;border-radius:8px 8px 0 0;padding:10px 16px;cursor:pointer}
.tabs button.on{background:#fff;color:#111;box-shadow:0 -2px 0 var(--blue) inset}

.wrap{display:flex;align-items:flex-start;background:#fff;min-height:560px}
.side{width:252px;flex:0 0 252px;padding:14px 10px 30px 18px;border-right:1px solid #f0f1f3}
.main{flex:1;min-width:0;padding:14px 22px 30px 16px}

/* ══════ 바꿔 끼우는 칩 — 대표께서 보내 주신 그 모양 ══════ */
.seg{display:flex;gap:6px;align-items:center;padding:2px 4px 10px}
.seg button{font-family:inherit;font-size:12.5px;border:1px solid transparent;background:none;
  color:#6b7078;border-radius:99px;padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:5px}
.seg button:hover{background:#f1f3f5}
.seg button.on{background:var(--who);color:#fff;font-weight:700}
.seg button.on.g{background:var(--pu)}
.seg button b{font-weight:700;opacity:.85}

.sec{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;margin-top:8px;
  font-size:12.5px;color:#6e6e6e}
.sec .nm{flex:1}
.sec .tool{font-size:13px;color:#a8abb2;padding:2px 5px;border-radius:4px;cursor:pointer}
.sec.pu{color:var(--pu);font-weight:700}
.sec.pu .nm::before{content:'●';font-size:8px;vertical-align:2px;margin-right:5px}
.sec.who{color:var(--who);font-weight:700}
.sec.who .nm::before{content:'●';font-size:8px;vertical-align:2px;margin-right:5px}
.sec.daum{border-top:1px solid #f0f0f0;margin-top:12px;padding-top:4px;color:#8c8c8c}

.f{display:flex;align-items:center;gap:8px;height:33px;padding:0 8px;border-radius:5px;
  font-size:13.5px;color:#2b2b2b;cursor:pointer}
.f:hover{background:var(--hover)}
.f.on{background:var(--sel);color:#123a86;font-weight:700}
.f.sub{padding-left:15px;font-size:13px}
.f .ic{width:17px;flex:none;text-align:center;font-size:13px;opacity:.85}
.f .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f .n{flex:none;font-size:12px;color:#8c8c8c}
.f .nu{flex:none;font-size:11.5px;color:#fff;background:#e0483c;border-radius:99px;
  min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 5px;font-weight:700}
.f.whobin.on{background:var(--who-bg);color:#4c2a8f}
.hint{font-size:11.5px;color:#a8abb2;line-height:1.65;padding:6px 9px 2px}
.scroll{max-height:360px;overflow-y:auto;overflow-x:hidden;padding-right:3px}
.scroll::-webkit-scrollbar{width:6px}
.scroll::-webkit-scrollbar-thumb{background:#d5d7dc;border-radius:99px}

.head{display:flex;align-items:baseline;gap:10px;padding:2px 2px 6px}
.head h2{margin:0;font-size:17px;font-weight:700}
.head .s{font-size:12px}
.tools{display:flex;align-items:center;gap:2px;height:38px;border-bottom:1px solid #d5d7dc}
.tools button{font-family:inherit;font-size:13px;color:#333;background:none;border:none;
  padding:7px 10px;border-radius:4px;cursor:pointer}
.tools button:hover{background:var(--hover)}
.tools .sp{flex:1}
.row{display:flex;align-items:center;height:40px;border-bottom:1px solid #f1f2f4;font-size:13px;cursor:pointer}
.row:hover{background:var(--hover)}
.row .st{flex:none;width:26px;text-align:center;color:#c9ccd2}
.row .who{flex:none;width:150px;padding-right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
.row .at{flex:none;width:52px;text-align:right;color:#8c8c8c;font-size:12.5px}
.row.unread .who,.row.unread .sub{font-weight:700}
.tag{flex:none;font-size:10.5px;border-radius:3px;padding:1px 6px;margin-right:8px;white-space:nowrap}
.tag.w{color:#5b3a9c;background:var(--who-bg);border:1px solid #e0d4fa}
.tag.g{color:#5d7a6d;background:var(--pu-bg);border:1px solid #cfe6dc}
.tag.q{color:#8a6d1f;background:#fdf6e3;border:1px solid #f0e2b8;cursor:pointer}
.tag.q:hover{background:#f9edcb}
.empty{padding:36px 8px;text-align:center;color:#a8abb2;font-size:13px;line-height:1.9}

.note{margin:16px 24px 24px;border:1px solid var(--line);border-radius:10px;padding:16px 18px;
  background:#fff;font-size:13.5px;line-height:1.85;color:#33383f}
.note h3{margin:0 0 8px;font-size:14.5px;color:#111}
.note table{border-collapse:collapse;margin:8px 0 4px;font-size:12.5px;width:100%}
.note td,.note th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.note th{background:#f4f6f8;font-weight:700}
.note .ok{color:var(--pu);font-weight:700}
.tagline{position:fixed;right:14px;bottom:12px;background:#111;color:#fff;font-size:11.5px;
  border-radius:99px;padding:6px 13px;opacity:.82;z-index:50}
.toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:#1c2128;color:#fff;
  font-size:13px;padding:11px 18px;border-radius:8px;z-index:60;display:none}
</style>
</head>
<body>

<div class="top">
  <h1>푸른 분류를 «담당자 / 업무별» 두 대시보드로</h1>
  <p><b>안 1(걸러 보기)로 갑니다</b> — 메일은 업무 칸에 그대로 있고, 담당자 칸은 그중에서
     그 사람 것만 골라 보여 줍니다. 한 통을 <b>주제로도 사람으로도</b> 봅니다.<br>
     아래 세 가지는 <b>두 대시보드를 «어떻게 놓느냐»</b>만 다릅니다. 담기는 내용은 같습니다.</p>
  <div class="tabs">
    <button id="v1" class="on" onclick="setView(1)">가 · 칩으로 바꿔 끼우기</button>
    <button id="v2" onclick="setView(2)">나 · 둘 다 펼쳐 두기</button>
    <button id="v3" onclick="setView(3)">다 · 담당자만 위로, 업무는 접기</button>
  </div>
</div>

<div class="wrap">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>

<div class="note" id="note"></div>
<div class="toast" id="toast"></div>
<div class="tagline">목업 — 두 대시보드 · 2026-08-26</div>

<script>
/* ══════ 실측값 (2026-08-26 실시간DB) ══════ */
const WHO = [                       /* 1.자문사답변 404통을 담당자로 가른 결과 */
  {n:'박한별', c:124, un:3}, {n:'김혜민', c:46, un:1}, {n:'박재원', c:32, un:0},
  {n:'임혜미', c:13, un:0},  {n:'최기운', c:1, un:0}
];
const UNKNOWN = 188;
const TOPIC = [                     /* 실제 폴더 통수 */
  {n:'1.자문사답변', c:400, un:2}, {n:'2.급여+사무대행', c:400, un:1},
  {n:'3.컨설팅(정부사업)', c:400, un:0}, {n:'4.체불 및 체당금메일', c:400, un:0},
  {n:'5.산재 및 산안 등', c:302, un:0}, {n:'6.공공기관', c:400, un:2},
  {n:'7.노무사회 사업, 노동부', c:400, un:0}, {n:'8.사내(공동)근로복지기금', c:400, un:0},
  {n:'9. 자율점검,기업점검등', c:343, un:0}, {n:'10. 이음센터(노발관련)', c:66, un:0},
  {n:'11. 계약서류및종료', c:21, un:0}, {n:'12. 세금계산서', c:400, un:0},
  {n:'13. 경조사. 뉴스레터 명', c:400, un:0}
];

const MAIL = [
  {who:'유종욱 · (주)아이티나노텍', sub:'8월 급여 관련 문의드립니다',      at:'08.25', r:0, mgr:'박한별', box:'1.자문사답변'},
  {who:'y.kim@m3.co.kr',            sub:'취업규칙 검토 요청 건',           at:'08.25', r:0, mgr:'',       box:'1.자문사답변'},
  {who:'김경리 · 대한산업',         sub:'RE: 4대보험 취득 신고 완료',      at:'08.24', r:1, mgr:'김혜민', box:'1.자문사답변'},
  {who:'coeleng@hanmail.net',       sub:'연차수당 계산 확인 부탁드립니다', at:'08.24', r:1, mgr:'',       box:'1.자문사답변'},
  {who:'박총무 · 한빛물산',         sub:'퇴직금 중간정산 문의',            at:'08.23', r:1, mgr:'박한별', box:'2.급여+사무대행'},
  {who:'이대표 · 세화테크',         sub:'근로계약서 서식 요청',            at:'08.23', r:1, mgr:'박재원', box:'1.자문사답변'},
  {who:'firstin-@naver.com',        sub:'상시근로자수 산정 관련',          at:'08.22', r:1, mgr:'',       box:'1.자문사답변'},
  {who:'정경리 · 우진기업',         sub:'육아휴직 급여 신청 서류',         at:'08.22', r:1, mgr:'임혜미', box:'2.급여+사무대행'},
  {who:'최과장 · 대한산업',         sub:'산재 요양신청 진행 상황',         at:'08.21', r:1, mgr:'김혜민', box:'5.산재 및 산안 등'}
];

let view = 1;                 /* 1 칩 · 2 둘 다 · 3 담당자 위 */
let dash = 'who';             /* 칩 모드에서 어느 대시보드를 보나 */
let now  = 'who:박한별';
const learned = {};

function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function mgrOf(m){ return m.mgr || learned[m.who] || ''; }
function whoCount(n){ return ((WHO.find(x=>x.n===n)||{}).c||0)
  + Object.keys(learned).filter(k=>learned[k]===n).length; }
const unkCount = () => UNKNOWN - Object.keys(learned).length;

/* ── 담당자 대시보드 줄들 ── */
function whoRows(){
  let h = '';
  WHO.forEach(m=>{
    const on = (now === 'who:'+m.n);
    h += `<div class="f sub whobin ${on?'on':''}" onclick="go('who:${m.n}')">
      <span class="ic">👤</span><span class="nm">${esc(m.n)}</span>
      <span class="n">${whoCount(m.n)}</span>
      ${m.un?`<span class="nu">${m.un}</span>`:''}</div>`;
  });
  h += `<div class="f sub ${now==='unknown'?'on':''}" onclick="go('unknown')"
      title="보낸이 주소로 담당자를 찾지 못한 메일 — 한 번 정해 주면 다음부터 저절로 갑니다">
      <span class="ic">❓</span><span class="nm">담당 모름</span>
      <span class="n">${unkCount()}</span></div>`;
  return h;
}
/* ── 업무별 대시보드 줄들 ── */
function topicRows(){
  return TOPIC.map(t=>`<div class="f sub ${now==='topic:'+t.n?'on':''}" onclick="go('topic:${t.n}')">
      <span class="ic">📂</span><span class="nm">${esc(t.n)}</span>
      <span class="n">${t.c}</span>
      ${t.un?`<span class="nu">${t.un}</span>`:''}</div>`).join('');
}

function drawSide(){
  let h = `<div class="f"><span class="ic">✉</span><span class="nm">전체메일</span></div>
    <div class="f"><span class="ic">📥</span><span class="nm">받은메일함</span><span class="nu">5</span></div>
    <div class="f"><span class="ic">✈</span><span class="nm">보낸메일함</span></div>`;

  if(view === 1){
    /* 가 — 칩 하나로 바꿔 끼운다. 왼쪽이 늘 짧다. */
    h += `<div class="sec ${dash==='who'?'who':'pu'}" style="margin-top:12px">
        <span class="nm">푸른 분류</span>
        <span class="tool" title="숨긴 칸">👁</span>
        <span class="tool" title="새 칸">＋</span></div>
      <div class="seg">
        <button class="${dash==='who'?'on':''}" onclick="setDash('who')">👤 담당자 <b>${WHO.length}</b></button>
        <button class="g ${dash==='topic'?'on':''}" onclick="setDash('topic')">📂 업무별 <b>${TOPIC.length}</b></button>
      </div>
      <div class="scroll">${dash==='who' ? whoRows() : topicRows()}</div>`;
  }
  else if(view === 2){
    /* 나 — 둘 다 펼쳐 둔다. 한눈에 보이지만 옆줄이 길다. */
    h += `<div class="sec who"><span class="nm">담당자</span>
        <span class="tool" title="직원 명부에서 저절로">자동</span></div>
      ${whoRows()}
      <div class="sec pu"><span class="nm">업무별</span>
        <span class="tool">👁</span><span class="tool">＋</span></div>
      <div class="scroll">${topicRows()}</div>`;
  }
  else {
    /* 다 — 담당자만 늘 보이고 업무는 접어 둔다 */
    h += `<div class="sec who"><span class="nm">담당자</span>
        <span class="tool" title="직원 명부에서 저절로">자동</span></div>
      ${whoRows()}
      <div class="sec pu" onclick="toggleTopic()" style="cursor:pointer">
        <span class="nm">업무별 <span style="color:#b6b9c0">${window._topicOpen?'⌃':'⌄'}</span></span>
        <span class="tool">＋</span></div>
      ${window._topicOpen ? `<div class="scroll">${topicRows()}</div>`
        : `<div class="hint">${TOPIC.length}개 칸이 접혀 있습니다</div>`}`;
  }

  h += `<div class="sec daum"><span class="nm">다음메일 원본 ⌄</span><span class="tool">＋</span></div>
    <div class="f"><span class="ic">🗑</span><span class="nm">휴지통</span></div>`;
  document.getElementById('side').innerHTML = h;
}

function rowsNow(){
  if(now === 'unknown') return MAIL.filter(m=>!mgrOf(m));
  if(now.indexOf('who:') === 0) return MAIL.filter(m=>mgrOf(m) === now.slice(4));
  return MAIL.filter(m=>m.box === now.slice(6));
}

function drawMain(){
  const rows = rowsNow();
  let title, sub, color;
  if(now === 'unknown'){
    title = '담당 모름'; color = '#8a6d1f';
    sub = '❓ 보낸이 주소가 어느 자문사인지 아직 모릅니다 — 한 번 정하면 다음부터 저절로';
  } else if(now.indexOf('who:') === 0){
    title = '👤 ' + now.slice(4); color = 'var(--who)';
    sub = '● 담당자 — 메일은 업무 칸에 그대로 있습니다. 여기는 «골라 보여 주는» 자리입니다';
  } else {
    title = now.slice(6); color = 'var(--pu)';
    sub = '● 업무별 — 담당자를 나눠도 여기 통수는 줄지 않습니다';
  }

  let h = `<div class="head"><h2>${esc(title)}</h2>
      <span class="s" style="color:${color}">${sub}</span></div>
    <div class="tools">
      <button>삭제</button><button>답장</button><button>전달</button><button>분류 ˅</button>
      <span class="sp"></span>
      <span style="font-size:11.5px;color:#a8abb2">${rows.length}통 보는 중</span>
    </div>`;

  if(!rows.length) h += `<div class="empty">이 칸에는 보여 드릴 메일이 없습니다.<br>
    (목업이라 몇 줄만 넣어 두었습니다)</div>`;
  else rows.forEach(m=>{
    const g = mgrOf(m);
    let tag = '';
    if(now.indexOf('topic:') === 0)
      tag = g ? `<span class="tag w">👤 ${esc(g)}</span>`
              : `<span class="tag q" onclick="event.stopPropagation();ask('${esc(m.who)}')">＋ 담당자 정하기</span>`;
    else if(now.indexOf('who:') === 0)
      tag = `<span class="tag g">📂 ${esc(m.box)}</span>`;
    else
      tag = `<span class="tag q" onclick="event.stopPropagation();ask('${esc(m.who)}')">＋ 담당자 정하기</span>`;
    h += `<div class="row ${m.r?'':'unread'}">
      <span class="st">☆</span>
      <span class="who">${esc(m.who)}</span>
      <span class="sub">${esc(m.sub)}</span>
      ${tag}
      <span class="at">${m.at}</span></div>`;
  });
  document.getElementById('main').innerHTML = h;
}

function ask(who){
  const names = WHO.map(m=>m.n);
  const pick = prompt('「' + who + '」 는 누구의 자문사입니까?\n\n' + names.join(' / ')
    + '\n\n(한 번 정하면 이 주소에서 오는 메일은 다음부터 저절로 그 담당자로 갑니다)', names[0]);
  if(!pick || names.indexOf(pick) < 0) return;
  learned[who] = pick;
  draw();
  toast('👤 「' + who + '」 → ' + pick + ' 로 이었습니다 — 업무 칸 통수는 그대로입니다');
}

function drawNote(){
  const t = {
    1:['가 · 칩으로 바꿔 끼우기',
       '「푸른 분류」 밑에 칩 두 개(👤 담당자 · 📂 업무별)를 두고 한 번에 하나만 보여 준다.',
       ['왼쪽이 늘 짧다 — 담당자 6줄이거나 업무 13줄이거나, 둘이 겹쳐 늘어서지 않는다',
        '지금 무엇으로 보고 있는지가 칩 색으로 분명하다',
        '다른 쪽을 보려면 칩을 한 번 눌러야 한다']],
    2:['나 · 둘 다 펼쳐 두기',
       '담당자 덩어리와 업무별 덩어리를 위아래로 함께 둔다.',
       ['누르지 않아도 둘 다 보인다',
        '옆줄이 길어진다 — 담당자 6 + 업무 13 = 19줄이라 아래쪽은 굴려야 나온다',
        '어느 쪽이 «지금 보는 것»인지 한눈에 덜 분명하다']],
    3:['다 · 담당자만 위로, 업무는 접기',
       '담당자는 늘 펴 두고, 업무별은 접어 둔다(필요할 때만 편다).',
       ['날마다 보는 것이 담당자라면 가장 짧다',
        '업무별로 찾을 일이 잦으면 매번 펴야 해서 번거롭다',
        '접힌 것을 잊어버리면 «업무 칸이 없어졌다»고 느낄 수 있다']]
  }[view];

  document.getElementById('note').innerHTML = `
    <h3>${t[0]}</h3>
    <div style="color:#5b6068;margin-bottom:8px">${t[1]}</div>
    <ul style="margin:0;padding-left:20px">${t[2].map(x=>'<li>'+x+'</li>').join('')}</ul>

    <h3 style="margin-top:18px">세 가지 모두 «담기는 것»은 같습니다</h3>
    <table>
      <tr><th style="width:170px">무엇이</th><th>어떻게</th></tr>
      <tr><td>담당자 칸</td>
          <td>직원 명부와 기업정보의 담당자에서 <b>저절로</b> 만들어진다. 담당 자문사가 없는 직원은 만들지 않는다</td></tr>
      <tr><td>업무 칸 통수</td>
          <td class="ok">담당자를 나눠도 <b>줄지 않는다</b> — 1.자문사답변은 그대로 400통</td></tr>
      <tr><td>담당자 칸을 열면</td>
          <td>그 사람 메일마다 <b>「📂 어느 업무 칸」</b>이 붙어 나온다</td></tr>
      <tr><td>업무 칸을 열면</td>
          <td>메일마다 <b>「👤 담당자」</b>가 붙어 나온다. 모르는 건 노란 <b>[＋ 담당자 정하기]</b></td></tr>
      <tr><td>담당 모름</td>
          <td>188통 — 여기서 한 번 정하면 그 주소가 표에 쌓여 <b>쓸수록 는다</b></td></tr>
      <tr><td>다음메일</td>
          <td class="ok">아무것도 안 바뀐다 — 우리 쪽 «보기»일 뿐이다</td></tr>
    </table>
    <div style="margin-top:10px;font-size:12.5px;color:#5b6068">
      ⚠ 지금 자동으로 잡히는 것은 <b>1.자문사답변 404통 중 216통(53%)</b>입니다
      (박한별124·김혜민46·박재원32·임혜미13·최기운1).
      <b>기업정보함 363곳에 이메일이 한 건도 없어서</b> 회사 이름으로 명함첩과 이어 얻은 값입니다 —
      거기에 이메일을 채우면 곧바로 올라갑니다.
    </div>`;
}

function setView(v){
  view = v;
  [1,2,3].forEach(i=>{ document.getElementById('v'+i).className = (i===v?'on':''); });
  draw();
}
function setDash(d){ dash = d; now = (d==='who' ? 'who:박한별' : 'topic:1.자문사답변'); draw(); }
function toggleTopic(){ window._topicOpen = !window._topicOpen; draw(); }
function go(k){ now = k; draw(); }
function draw(){ drawSide(); drawMain(); drawNote(); }

let _t;
function toast(s){
  const el=document.getElementById('toast'); el.textContent=s; el.style.display='block';
  clearTimeout(_t); _t=setTimeout(()=>el.style.display='none', 3600);
}
window._topicOpen = false;
draw();
</script>
