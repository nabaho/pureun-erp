<!doctype html>
<meta charset="utf-8">
<title>틀고정 확인 — 단추줄이 정말 붙나</title>
<style>
  /* 앱과 «같은 뼈대»만 옮겨 온다 — #pcMain(overflow:hidden) 안에서 #pcMail 이 스크롤 칸 */
  html,body{margin:0;height:100%;font:14px/1.55 -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
  #pcRoot{display:flex;height:100vh;overflow:hidden}
  #pcMain{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
  #pcTop{padding:8px 24px;border-bottom:1px solid #f0f0f0;background:#fff}
  #pcMail{flex:1 1 auto;min-height:0;overflow:auto;padding:0 24px 40px 16px}

  /* ── 여기가 이번에 넣은 규칙 ── */
  #pcMail .dm-froze{position:sticky;top:0;z-index:7;background:#fff}

  .dm-tools{display:flex;align-items:center;gap:2px;min-height:38px;flex-wrap:wrap}
  .dm-tools button{font-size:13px;color:#333;background:none;border:none;padding:6px 10px;
    border-radius:4px;cursor:pointer;white-space:nowrap}
  .dm-tools .sp{flex:1;min-width:10px}
  .dm-search{display:flex;align-items:center;gap:6px;height:32px;width:260px;
    border:1px solid #d8d8d8;border-radius:4px;padding:0 10px}
  .dm-hint{text-align:right;font-size:11.5px;color:#a8abb2;padding:3px 2px 6px;
    display:flex;gap:12px}
  .dm-list{border-top:1px solid #d5d7dc}
  .dm-row{display:flex;align-items:center;gap:10px;height:38px;padding:0 6px;
    border-bottom:1px solid #f0f2f5;font-size:13.5px}
  .dm-row .who{width:120px;color:#333}
  .dm-row .sub{flex:1;color:#1a1a1a}
  .dm-row .at{color:#a8abb2;font-size:12.5px}
</style>
<div id="pcRoot"><main id="pcMain">
  <div id="pcTop">권형하 대표노무사 · P-001</div>
  <div id="pcMail">
    <div class="dm-froze">
      <div class="dm-tools">
        <input type="checkbox">
        <button>삭제</button><button>답장</button><button>전체답장</button>
        <button>전달</button><button>다시보내기</button><button>분류 ˅</button>
        <button>담당자 ˅</button><button>원래대로 ↩</button><button>안읽음</button>
        <button>새로고침 ↻</button>
        <span class="sp"></span>
        <span class="dm-search"><i>🔍</i> 메일 검색</span>
        <button>상세</button>
      </div>
      <div class="dm-hint">
        <span style="flex:1">100통 보는 중 · 이 칸에 모두 7,337통 · 마지막 동기화 2026.08.30 13:46</span>
        <span>＊ 메일 목록, 방향키로 이동, 스페이스로 선택</span></div>
    </div>
    <div class="dm-list" id="L"></div>
  </div>
</main></div>
<script>
  let h = '';
  for (let i = 1; i <= 120; i++)
    h += '<div class="dm-row"><span class="who">보낸이 ' + i + '</span>'
       + '<span class="sub">' + i + '번째 메일입니다 — 내려도 단추줄이 붙어 있어야 합니다</span>'
       + '<span class="at">08.30</span></div>';
  document.getElementById('L').innerHTML = h;
</script>
