<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홈페이지 관리 v6b — 기둥형 대시보드</title>
<!--
  목업 v6b 「기둥형」 — 승인용. 구현 아님.
  대시보드 카드 5장을 «왼쪽 기둥»에 세로로 세우고, 그 아래 「할 일」을 붙였다.
  왼쪽 기둥 = «무엇을 볼까», 가운데 = 목록, 오른쪽 = 편집칸.
  → 편집칸이 셋 중 가장 넓다(경력 18줄이 안 잘린다).
  ★ 카드 내용·규격은 v6a·v6c 와 «똑같다» (homepage-v6-shared.js 하나를 같이 쓴다).
-->
<style>
:root{
  --navy:#2E3A8C; --navy-soft:#EEF1FB;
  --ink:#1F2233; --sub:#6E7288; --faint:#9AA0B4;
  --line:#E6E8F0; --line-soft:#F1F3F8;
  --paper:#F7F8FB; --card:#FFF;
  --ok:#2E7D4F; --ok-bg:#EFF9F3;
  --warn:#B26A00; --warn-bg:#FFF8EC;
  --bad:#C43D3D; --bad-bg:#FDF2F2;
  --info:#1D4ED8; --info-bg:#EFF4FF;
}
*{box-sizing:border-box;margin:0}
html{height:100%}
body{height:100%;overflow:hidden;display:flex;flex-direction:column;
  font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--paper);
  color:var(--ink);font-size:14px;line-height:1.7}
header{flex:none;background:var(--navy);color:#fff;display:flex;align-items:center;gap:11px;padding:8px 16px}
header .brand{font-weight:800;font-size:15px}
header .when{font-size:12px;color:#C9D0F0}
header .sp{flex:1}
header select{border:1px solid #ffffff55;background:#ffffff1a;color:#fff;border-radius:7px;
  padding:3px 7px;font-size:12px;font-family:inherit}
header select option{color:#1F2233}
header .hbtn{background:#ffffff22;border:1px solid #ffffff66;color:#fff;border-radius:8px;
  padding:3px 10px;cursor:pointer;font-size:12px;font-family:inherit;font-weight:700;white-space:nowrap}
header .hbtn.pri{background:#fff;color:var(--navy);border-color:#fff}
main{flex:1;min-height:0;width:100%;padding:10px 12px;display:flex;flex-direction:column}
.app{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(31,34,51,.04)}
.btn{border:1px solid #D3D8E4;background:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;
  font-weight:700;cursor:pointer;font-family:inherit;color:#3A3F55;white-space:nowrap}
.btn:hover{background:#FAFBFD}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{padding:3px 9px;font-size:11.5px;border-radius:7px}
.btn.keep{border-color:#BCE5CD;background:var(--ok-bg);color:#166534}
.sub{color:var(--sub);font-size:12px}

.body{flex:1;min-height:0;display:flex}

/* ── 왼쪽 기둥: 대시보드(위) + 할 일(아래) ── */
.rail{width:264px;flex:none;min-height:0;border-right:1px solid var(--line);background:#FCFCFE;
  display:flex;flex-direction:column}
.rail .rh{flex:none;padding:7px 12px;background:#fff;border-bottom:1px solid var(--line);
  font-size:12px;font-weight:800;color:var(--sub)}
.dash{flex:none;display:flex;flex-direction:column;gap:7px;padding:8px 9px;
  border-bottom:1px solid var(--line);overflow-y:auto;max-height:56%}
.dcard{text-align:left;border:1px solid var(--line);border-radius:11px;background:#fff;
  padding:7px 10px 8px;cursor:pointer;font-family:inherit;color:inherit;
  display:flex;flex-direction:column;gap:2px}
.dcard:hover{border-color:#C6CCE0}
.dcard.on{border-color:var(--navy);background:var(--navy-soft);box-shadow:inset 0 0 0 1px var(--navy)}
.dcard .t{font-size:12.5px;font-weight:800;color:var(--sub);display:flex;align-items:center;gap:6px}
.dcard.on .t{color:var(--navy)}
.dcard .dot{width:6px;height:6px;border-radius:50%;background:var(--bad);flex:none}
.dcard .n{font-size:19px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
.dcard .n em{font-size:12px;font-weight:700;color:var(--sub);font-style:normal;margin-left:2px}
.dcard .own{display:flex;gap:4px;flex-wrap:wrap;min-height:18px}
.dcard .chk{display:flex;gap:4px;flex-wrap:wrap;border-top:1px dashed var(--line);
  margin-top:3px;padding-top:4px}
.mini{font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;white-space:nowrap;
  border:1px solid transparent}
.mini.rm{background:var(--warn-bg);color:#9A3412;border-color:#F3DCA9}
.mini.ask{background:var(--info-bg);color:var(--info);border-color:#C8D8FB}
.mini.bad{background:var(--bad-bg);color:#B42318;border-color:#F3C8C8}
.mini.ok{background:var(--ok-bg);color:#166534;border-color:#BCE5CD}
.mini.flat{background:var(--line-soft);color:var(--sub)}
.mini.none{background:#fff;color:var(--faint);border-color:var(--line)}
.mini.dash{background:#fff;color:var(--faint);border:1px dashed var(--line)}
.mini.noBase{background:var(--info-bg);color:var(--info);border-color:#C8D8FB}

/* 기둥 아래쪽 할 일 */
.todo{flex:1;min-height:0;display:flex;flex-direction:column}
.todo .th{flex:none;display:flex;align-items:center;gap:7px;padding:7px 12px;background:#fff;
  border-bottom:1px solid var(--line);font-size:12.5px;font-weight:800}
.todo .th .c{background:var(--bad);color:#fff;border-radius:20px;padding:0 7px;font-size:11px}
.todo .th .c.zero{background:var(--line-soft);color:var(--sub)}
.todo .sc{flex:1;min-height:0;overflow-y:auto;padding:8px 9px 12px}

.list{width:390px;flex:none;min-height:0;border-right:1px solid var(--line);background:#FCFCFE;
  display:flex;flex-direction:column}
.list .lh{flex:none;display:flex;align-items:center;gap:8px;padding:7px 12px;
  border-bottom:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--sub)}
.list .lh b{color:var(--ink)} .list .lh .hot{color:var(--bad)}
.chips{flex:none;display:flex;gap:5px;flex-wrap:wrap;padding:6px 12px 7px;
  border-bottom:1px solid var(--line);background:#fff}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:2px 9px;font-size:11px;
  font-weight:800;color:var(--sub);cursor:pointer;font-family:inherit}
.chip:hover{border-color:#C6CCE0}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .c{opacity:.65;margin-left:3px}
.list .sc{flex:1;min-height:0;overflow-y:auto}
.list .r{display:flex;align-items:center;gap:9px;padding:9px 12px;
  border-bottom:1px solid var(--line-soft);min-height:60px;cursor:pointer}
.list .r:hover{background:#fff}
.list .r.on{background:#fff;box-shadow:inset 3px 0 0 var(--navy)}
.list .who{min-width:0;flex:1}
.list .nm{font-weight:700;font-size:14px}
.list .po{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;margin-left:auto}
.num{width:19px;flex:none;text-align:right;color:var(--faint);font-size:12px;font-weight:800;
  font-variant-numeric:tabular-nums;user-select:none}

.edit{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff}
.ehd{flex:none;padding:11px 18px 0}
.esc{flex:1;min-height:0;overflow-y:auto;padding:11px 18px 14px}
.eft{flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 18px;
  border-top:1px solid var(--line);background:#FCFCFE}

.bar{border-radius:10px;padding:8px 11px;font-size:12.5px;margin-bottom:8px;line-height:1.65}
.bar.bad{background:var(--bad-bg);border:1px solid #F3C8C8;color:#8C2B2B}
.bar.warn{background:var(--warn-bg);border:1px solid #F3DCA9;color:#7C4A03}
.bar.ok{background:var(--ok-bg);border:1px solid #BCE5CD;color:#1E5631}
.bar.info{background:var(--info-bg);border:1px solid #C8D8FB;color:#1E3A8A}
.bar b{font-weight:800}
.bar .go{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.bar details{margin-top:5px} .bar summary{cursor:pointer;font-weight:800;font-size:12px}
.bar ol{margin:5px 0 0;padding-left:18px}
.band{border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:8px;line-height:1.65}
.band.rm{background:var(--warn-bg);border:1px solid #F3DCA9;color:#7C2D12}
.band.keep{background:var(--ok-bg);border:1px solid #BCE5CD;color:#14532D}
.band.ask{background:var(--info-bg);border:1px solid #C8D8FB;color:#1E3A8A}
.band b{font-weight:800} .band .sm{color:var(--sub);font-size:11.5px}

.pill{font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px;white-space:nowrap}
.pill.same{background:var(--line-soft);color:var(--sub)}
.pill.pending{background:var(--bad-bg);color:#B42318;border:1px solid #F3C8C8}
.pill.toAdd{background:var(--info-bg);color:var(--info);border:1px solid #C8D8FB}
.pill.toRemove,.pill.liveOnly{background:var(--warn-bg);color:#9A3412;border:1px solid #F3DCA9}
.pill.done{background:var(--ok-bg);color:#166534;border:1px solid #BCE5CD}
.pill.noBase{background:var(--info-bg);color:var(--info);border:1px solid #C8D8FB}
.pill.none{background:#fff;color:var(--faint);border:1px solid var(--line)}
.pill.keep,.pill.posted{background:var(--ok-bg);color:#166534;border:1px solid #BCE5CD}
.pill.rm,.pill.ended{background:var(--warn-bg);color:#9A3412;border:1px solid #F3DCA9}
.pill.ask,.pill.noroster{background:var(--info-bg);color:var(--info);border:1px solid #C8D8FB}
.pill.notext{background:#fff;color:var(--faint);border:1px dashed var(--line)}
.pill.notPosted{background:var(--bad-bg);color:#B42318;border:1px solid #F3C8C8}

.fld{margin-bottom:12px}
.fld > label{display:block;font-size:12px;font-weight:800;color:var(--sub);margin-bottom:4px}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid #D3D8E4;border-radius:8px;
  padding:7px 11px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff}
.fld textarea{resize:vertical;line-height:1.7;font-size:13.5px}
.two{display:flex;gap:11px} .two>div{flex:1;min-width:0}
.car{border:1px solid #D3D8E4;border-radius:9px;background:#fff;padding:4px}
.car .l{display:flex;align-items:center;gap:5px;padding:3px 4px;border-bottom:1px solid var(--line-soft)}
.car .l:last-child{border-bottom:0}
.car .l input{flex:1;min-width:0;border:1px solid transparent;border-radius:6px;padding:5px 7px;
  font-size:13.5px;font-family:inherit;color:var(--ink)}
.car .l input:focus{border-color:var(--navy);outline:none}
.car .l .no{width:20px;flex:none;text-align:right;color:var(--faint);font-size:11.5px;font-weight:800}
.car .l .x{border:none;background:none;color:var(--sub);cursor:pointer;font-size:13px;padding:2px 5px}
.car .add{color:var(--navy);font-weight:700;font-size:12.5px;padding:6px 8px;cursor:pointer}
.rows{border:1px solid #D3D8E4;border-radius:9px;background:#fff;overflow:hidden;font-size:13.5px}
.rows .l{display:flex;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line-soft)}
.rows .l:last-child{border-bottom:0}
.rows .n{width:20px;flex:none;text-align:right;color:var(--faint);font-size:11.5px;font-weight:800}
.rows .t{flex:1;min-width:0;word-break:break-word}
.rows .l.head .t{font-weight:800;color:var(--navy)}
.guide{background:#FAFBFD;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  margin-top:11px;font-size:12.5px;line-height:1.85}
.guide ol{margin:5px 0 0;padding-left:18px}
.kbd{background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11.5px;font-weight:700}
.empty{padding:36px 18px;text-align:center;color:var(--sub)}
.seg{display:flex;border:1px solid #D3D8E4;border-radius:8px;overflow:hidden;width:max-content}
.seg button{border:none;background:#fff;padding:6px 13px;font-size:12.5px;font-weight:700;
  font-family:inherit;color:var(--sub);cursor:pointer;border-right:1px solid #D3D8E4}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}

.foot{flex:none;display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:6px 14px;
  border-top:1px solid var(--line);background:#fff;font-size:11.5px;color:#475467}
.foot .sp{flex:1}
.mk{border:1px dashed #C6CCE0;border-radius:7px;padding:1px 8px;font-size:11px;color:var(--sub);
  background:#FAFBFD;cursor:pointer;font-family:inherit;font-weight:700}
.mk.on{border-style:solid;border-color:var(--navy);color:var(--navy);background:var(--navy-soft)}
@media(max-width:1400px){ .list{width:340px} .rail{width:246px} }
@media(max-width:900px){
  html,body{height:auto} body{overflow:auto;display:block}
  main{display:block;padding:8px 8px 40px} .app{display:block} .body{display:block}
  .rail{width:auto;border-right:0;border-bottom:1px solid var(--line);display:block}
  .dash{flex-direction:row;flex-wrap:wrap;max-height:none} .dcard{flex:1 1 45%}
  .todo{display:block} .list{width:auto;border-right:0;border-bottom:1px solid var(--line);display:block}
  .list .sc{max-height:46vh} .edit{display:block} .esc{overflow:visible}
}
</style>
</head>
<body>
<header>
  <div class="brand">푸 홈페이지 관리</div>
  <span class="when" id="hWhen"></span>
  <div class="sp"></div>
  <label class="when">줄 모양
    <select><option>줄바꿈만 (기본)</option><option>줄마다 감싸기</option></select></label>
  <button class="hbtn pri" onclick="toggleCheck()">홈페이지 다시 확인</button>
  <button class="hbtn">홈페이지 열기</button>
  <span class="when">권형하</span><button class="hbtn">로그아웃</button>
</header>
<main>
<div class="app">
  <div class="body">
    <div class="rail">
      <div class="rh">무엇을 볼까</div>
      <div class="dash" id="dash"></div>
      <div class="todo">
        <div class="th">지금 할 일 <span class="c" id="todoN">0</span>
          <span style="flex:1"></span><span class="sub" id="todoWhen"></span></div>
        <div class="sc" id="todoBody"></div>
      </div>
    </div>
    <div class="list">
      <div class="lh" id="lh"></div>
      <div class="chips" id="chips"></div>
      <div class="sc" id="rows"></div>
    </div>
    <div class="edit" id="edit"></div>
  </div>
  <div class="foot">
    <span class="sub"><b>카드 읽는 법</b> — 윗줄은 우리 자료만 보고 압니다(바로) · 아랫줄은 홈페이지와 대조해야 압니다(확인 누를 때)</span>
    <span class="sp"></span>
    <span class="sub">홈페이지는 자동으로 바뀌지 않습니다 — 붙여넣기 한 번은 사람이 합니다.</span>
    <button class="mk" id="mkBtn" onclick="toggleCheck()">목업 보기: 대조 전</button>
  </div>
</div>
</main>
<script id="v6shared">
/* ↓ homepage-v6-shared.js 를 끼워 넣은 것 — 고칠 때는 그 파일을 고치고 다시 끼운다 */
/* ══════════════════════════════════════════════════════════════
   목업 v6 공통 부품 — 세 배치(띠형·기둥형·할일먼저)가 «같은 자료·같은 규격»을 쓴다.
   배치마다 자료를 따로 두면 목업끼리 숫자가 달라져 무엇을 견주는지 알 수 없다.

   ★ 대시보드 공통 규격 — 다섯 갈래가 모두 같은 다섯 칸을 채운다.
     ① 이름  ② 총수(단위)  ③ 우리 자료 경고(바로 안다)
     ④ 대조 결과(「홈페이지 다시 확인」을 눌러야 안다)  ⑤ 손댈 것 = ③+④
     ③과 ④를 한 숫자로 뭉치지 않는다 — 뭉치면 「확인을 안 눌러 0건」이
     「깨끗하다」로 읽힌다.

   ★ 자문사현황은 홈페이지가 «로고 그림»이라 글자 대조를 못 한다.
     ④ 칸에 「대조 못 함 (그림)」을 그대로 적고, 올렸는지는 사람이 표시한다.
     못 하는 것을 「같음」으로 뭉개지 않는다.

   회사명·업종은 목업용 «가상» 이름이다. 실제 자문사 자료가 아니다.
   ══════════════════════════════════════════════════════════════ */

var CHECKED = false;     // 「홈페이지 다시 확인」을 눌렀는지
var G = 'members';       // 고른 갈래
var PICK = 'm1';         // 고른 항목
var FILTER = '';         // 누른 딱지(걸러 보기)

var GROUPS = [
  { k:'members',  l:'구성원 소개', u:'명',   kind:'member'  },
  { k:'work',     l:'주요업무',    u:'쪽',   kind:'page'    },
  { k:'inquiry',  l:'오시는길',    u:'쪽',   kind:'page'    },
  { k:'greeting', l:'인사말',      u:'쪽',   kind:'page'    },
  { k:'partner',  l:'자문사현황',  u:'개사', kind:'partner' }
];

/* own — 우리 자료만 보고 아는 딱지 (화면을 열면 바로 붙는다)
   c   — 홈페이지와 대조해서 아는 딱지 (확인을 눌러야 붙는다) */
var ITEMS = {
  members: [
    { id:'m1', n:'권형하', d:'대표 · 공인노무사',        srl:'190', own:'',                    c:'same' },
    { id:'m2', n:'박성수', d:'공인노무사',              srl:'181', own:'left:퇴사 2026-06-30', c:'toRemove' },
    { id:'m3', n:'박한별', d:'공인노무사',              srl:'176', own:'',                    c:'same' },
    { id:'m4', n:'김혜민', d:'공인노무사',              srl:'170', own:'',                    c:'pending' },
    { id:'m5', n:'박재원', d:'공인노무사',              srl:'',    own:'',                    c:'toAdd' },
    { id:'m6', n:'임혜미', d:'공인노무사',              srl:'158', own:'left:퇴사 2026-05-22', c:'done' },
    { id:'m7', n:'김동현', d:'공인노무사',              srl:'151', own:'',                    c:'same' },
    { id:'m8', n:'장한돌', d:'세종지사장 · 공인노무사',  srl:'140', own:'left:퇴사 2023-12-31',
      keep:'지사장 — 고용관계가 아니라 홈페이지에 남김', c:'same' },
    { id:'m9', n:'조현범', d:'대전지사장 · 공인노무사',  srl:'133', own:'ask:명부에 없음',      c:'same' },
    { id:'m10', n:'(홈페이지에만)', d:'홈페이지 글 번호 205', srl:'205', own:'', c:'liveOnly', ghost:1 }
  ],
  work: [

var TXT = { same:'같음', pending:'안 올라감', toAdd:'새로 올릴 것', toRemove:'내릴 것 (퇴사)',
  liveOnly:'홈페이지에만', done:'내려감 (퇴사 완료)', noBase:'기준 없음', notext:'대조 못 함 (그림)' };
var OWN = { left:'퇴사 (명부)', ask:'명부에 없음', nobase:'기준 없음',
  ended:'자문 종료', noroster:'업체관리에 없음' };
var OWNCLS = { left:'rm', ask:'ask', nobase:'noBase', ended:'ended', noroster:'noroster' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,
  function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function groupOf(k){ return GROUPS.filter(function(g){ return g.k===k; })[0]; }
function rowsOf(k){ return (ITEMS[k]||[]).filter(function(r){ return CHECKED || !r.ghost; }); }
function itemOf(k, id){ return rowsOf(k).filter(function(r){ return r.id===id; })[0] || rowsOf(k)[0]; }
function stOf(r){ return CHECKED ? (r.c||'') : ''; }
function ownKind(r){ return r.own ? r.own.split(':')[0] : ''; }
function ownLabel(r){ return r.own ? r.own.split(':')[1] : ''; }

/* ── 공통 규격을 채운다. 갈래가 달라도 이 함수 하나가 다섯 칸을 만든다 ── */
function statOf(k) {
  var rows = rowsOf(k), own = {}, kept = 0;
  rows.forEach(function(r){
    if (r.keep) { kept++; return; }             // 「남김」은 경고가 아니다 — 따로 센다
    var t = ownKind(r);
    if (t) own[t] = (own[t]||0) + 1;
  });
  var hotOwn = Object.keys(own).reduce(function(s,t){ return s + own[t]; }, 0);
  var hotChk = CHECKED ? rows.filter(function(r){
    var s = r.c;
    return s && s!=='same' && s!=='done' && s!=='notext';
  }).length : 0;
  var notPosted = (k==='partner') ? rows.filter(function(r){ return !r.posted; }).length : 0;
  return { rows:rows, own:own, kept:kept, hotOwn:hotOwn, hotChk:hotChk,
           notPosted:notPosted, hot:hotOwn + hotChk + notPosted };
}

/* ③ 우리 자료 경고 — 갈래마다 «이름»만 다르고 자리 다툼은 없다 */
function ownMinis(k) {
  var s = statOf(k), out = [];
  Object.keys(s.own).forEach(function(t){
    var cls = (t==='left'||t==='ended') ? 'rm' : (t==='nobase'||t==='ask'||t==='noroster' ? 'ask' : 'flat');
    out.push('<span class="mini '+cls+'">'+esc(OWN[t]||t)+' '+s.own[t]+'</span>');
  });
  if (s.kept) out.push('<span class="mini ok">남김 '+s.kept+'</span>');
  if (k==='partner' && s.notPosted) out.push('<span class="mini bad">안 올림 '+s.notPosted+'</span>');
  if (!out.length) out.push('<span class="mini ok">이상 없음</span>');
  return out.join('');
}
/* ④ 대조 결과 — 확인 전이면 «안 함», 자문사현황은 «못 함»이라고 적는다 */
function chkMinis(k) {
  if (!CHECKED) return '<span class="mini none">대조 안 함</span>';
  if (k === 'partner') return '<span class="mini dash">대조 못 함 (그림)</span>';
  var s = statOf(k);
  return s.hotChk ? '<span class="mini bad">손댈 것 '+s.hotChk+'</span>'
                  : '<span class="mini ok">홈페이지와 같음</span>';
}

/* ── 대시보드 카드 (배치마다 겉모양만 다르고 «내용은 하나») ── */
function cardHtml(g, cls) {
  var s = statOf(g.k);
  return '<button class="dcard'+(G===g.k?' on':'')+(cls?' '+cls:'')+'" onclick="go(\''+g.k+'\')">'
    + '<div class="t">'+(s.hot?'<span class="dot"></span>':'')+esc(g.l)+'</div>'
    + '<div class="n">'+s.rows.length+'<em>'+g.u+'</em></div>'
    + '<div class="own">'+ownMinis(g.k)+'</div>'
    + '<div class="chk">'+chkMinis(g.k)+'</div>'
    + '</button>';
}
function dashHtml(cls){ return GROUPS.map(function(g){ return cardHtml(g, cls); }).join(''); }

/* ── 걸러 보기 딱지 ── */
function filtered(k) {
  var rows = rowsOf(k);
  if (!FILTER) return rows;
  if (FILTER === 'todo') return rows.filter(function(r){
    var s = stOf(r);
    return (r.own && !r.keep) || (k==='partner' && !r.posted)
        || (s && s!=='same' && s!=='done' && s!=='notext'); });
  if (FILTER.indexOf('own:') === 0) {
    var t = FILTER.slice(4);
    return rows.filter(function(r){ return !r.keep && ownKind(r)===t; });
  }
  if (FILTER === 'notPosted') return rows.filter(function(r){ return !r.posted; });
  return rows.filter(function(r){ return stOf(r)===FILTER; });
}
function chipsHtml() {
  var s = statOf(G), rows = s.rows, defs = [{ k:'', label:'전체' }];
  if (s.hot) defs.push({ k:'todo', label:'손댈 것', n:s.hot });
  Object.keys(s.own).forEach(function(t){
    defs.push({ k:'own:'+t, label:OWN[t]||t, n:s.own[t] });
  });
  if (G==='partner' && s.notPosted) defs.push({ k:'notPosted', label:'안 올림', n:s.notPosted });
  if (CHECKED) {
    ['pending','toAdd','toRemove','liveOnly','done','same','notext'].forEach(function(st){
      var n = rows.filter(function(r){ return r.c===st; }).length;
      if (n) defs.push({ k:st, label:TXT[st], n:n });
    });
  }
  return defs.map(function(d){
    return '<button class="chip'+(FILTER===d.k?' on':'')+'" onclick="filt(\''+d.k+'\')">'
      + esc(d.label) + (d.n!=null?'<span class="c">'+d.n+'</span>':'') + '</button>';
  }).join('') + (CHECKED ? '' :
    '<span class="sub" style="margin-left:2px">확인을 누르면 대조 딱지로도 걸러집니다</span>');
}

/* ── 목록 ── */

function ownPill(r) {
  if (r.keep) return '<span class="pill keep">남김</span>';
  if (!r.own) return (G==='partner' && !r.posted) ? '<span class="pill notPosted">안 올림</span>' : '';

  return '<span class="pill '+(OWNCLS[t]||'ask')+'">'+esc(ownLabel(r))+'</span>';

function rowsHtml() {
  var rows = filtered(G);
  if (!rows.length) return '<div class="empty">이 딱지에 해당하는 줄이 없습니다.</div>';
  return rows.map(function(r,i){
    var line = [r.d, r.keep||'', r.note||''].filter(Boolean).join(' · ');
    var s = stOf(r);
    return '<div class="r'+(r.id===PICK?' on':'')+'" onclick="pick(\''+r.id+'\')">'
      + '<span class="num">'+(i+1)+'</span>'

      + '<div class="po" title="'+esc(line)+'">'+esc(line)+'</div></div>'

  }).join('');

/* ── 편집칸 — 갈래 셋(구성원·쪽·자문사)이 «같은 틀»을 쓴다:
   머리(band) 고정 → 가운데(.esc) 구름 → 발(.eft) 고정 ── */

    + '· 이 글자는 홈페이지로 «가지 않습니다». 대조 결과를 맞출 때만 고치십시오</label>'
    + '<textarea rows="6">'+esc(noBase?'':lines.join(' '))+'</textarea></div>';
  h += '<div class="guide"><b>이 쪽을 고치는 순서</b><ol>'
    + '<li><b>홈페이지에서 이 쪽 열기</b> → 관리자 화면에서 고치고 저장</li>'
    + '<li>돌아와 <b>홈페이지 다시 확인</b> → 딱지가 「안 올라감」으로 바뀝니다</li>'
    + '<li>바꾼 내용을 그대로 두려면 <b>대조 기준 글자</b>를 맞춘 뒤 저장하고 한 번 더 확인</li>'
    + '</ol></div></div>';
  h += '<div class="eft"><button class="btn">대조 기준 저장</button>'
    + '<button class="btn">되돌리기</button>'
    + (p.id!=='inquiry' && p.id!=='greeting' ? '<button class="btn">목록에서 분리</button>' : '')
    + '<span style="flex:1"></span><button class="btn pri">홈페이지에서 이 쪽 열기</button>'
    + '<span class="sub">수정 기록 없음</span></div>';
  return h;
}

/* 자문사현황 — 갈래는 셋과 같은 틀을 쓰되, «대조를 못 한다»는 것만 다르다 */
function partnerEdit(c) {
  var h = '<div class="ehd">';
  h += '<div class="band ask"><b>홈페이지 자문사현황은 «로고 그림»입니다</b> — 회사명이 글자로 없어 '
    + '통합시스템이 <b>대조를 못 합니다</b>.<br><span class="sm">그래서 올렸는지는 «사람이» 표시합니다. '
    + '못 하는 것을 「같음」으로 뭉개지 않습니다 — 목록에는 늘 «대조 못 함 (그림)»으로 적힙니다.</span></div>';
  if (ownKind(c) === 'ended') {
    h += '<div class="band rm"><b>푸른ERP 업체관리: '+esc(ownLabel(c))+'</b> · 홈페이지에는 아직 올라가 있습니다.'
      + '<br><span class="sm">내리실지는 사람이 판단합니다 — 자문이 끝나도 실적으로 남겨 두는 곳이 있습니다.</span></div>';
  }
  if (ownKind(c) === 'noroster') {
    h += '<div class="band ask"><b>업체관리에 없음</b> — 푸른ERP 업체관리에서 이 회사를 찾지 못했습니다'
      + '<br><span class="sm">이름 철자가 다르거나, 업체 종류가 「자문」이 아닐 수 있습니다. '
      + '업체관리를 고치는 일은 푸른ERP에서 합니다 — 여기서는 읽기만 합니다.</span></div>';
  }
  h += '</div><div class="esc">';
  h += '<div class="two"><div class="fld"><label>회사명</label><input value="'+esc(c.n)+'"></div>'
    + '<div class="fld" style="flex:0 0 180px"><label>업종</label><input value="'
    + esc(c.d.split(' · ')[0])+'"></div></div>';
  h += '<div class="fld"><label>홈페이지에 올렸습니까? — 사람이 표시합니다 (그림이라 기계가 못 봅니다)</label>'
    + '<div class="seg"><button class="'+(c.posted?'on':'')+'">올림</button>'
    + '<button class="'+(c.posted?'':'on')+'">안 올림</button>'
    + '<button>모름</button></div></div>';
  h += '<div class="fld"><label>메모 (왜 올렸는지·왜 안 올렸는지)</label><textarea rows="2">'
    + (c.posted?'':'로고 파일을 아직 못 받았습니다.')+'</textarea></div>';
  h += '<div class="guide"><b>자문사현황을 다루는 방식</b><ol>'
    + '<li>목록은 <b>푸른ERP 업체관리</b>에서 가져옵니다(업체 종류 「자문」·거래중) — '
    + '여기서 회사를 새로 만들지 않습니다</li>'
    + '<li>홈페이지는 로고 <b>그림</b>이라 대조를 못 합니다. <b>올림/안 올림</b>만 사람이 표시합니다</li>'
    + '<li>붙여넣을 내용은 <b>회사명 목록</b>까지만 만들어 드립니다 — 로고 그림은 사람이 올립니다</li>'
    + '</ol></div></div>';
  h += '<div class="eft"><button class="btn pri">회사명 목록 복사</button>'
    + '<button class="btn">저장</button><button class="btn">되돌리기</button>'
    + '<span style="flex:1"></span><button class="btn">홈페이지에서 자문사현황 열기</button>'
    + '<span class="sub">수정 기록 없음</span></div>';
  return h;
}

/* ── 할 일 — 안내 띠를 모아 둔 칸. 띠마다 «가는 단추»가 달려 있다 ── */
function todoItems() {
  var out = [];
  if (!CHECKED) {
    out.push({ n:0, cls:'info', h:'<b>홈페이지와 아직 대조하지 않았습니다</b><br>'
      + '딱지는 <b>「홈페이지 다시 확인」</b>을 누를 때만 붙습니다. 저절로 돌지 않습니다.'
      + '<div class="go"><button class="btn pri sm" onclick="toggleCheck()">홈페이지 다시 확인</button></div>' });
  }
  var ms = statOf('members');
  /* ★ 「남김」으로 둔 사람은 이 수에서 «뺀다» — 대시보드도 남김을 따로 센다.
     여기서만 함께 세면 카드에는 2명, 할 일에는 3명이 되어 숫자가 어긋난다. */
  if (ms.own.left) {
    out.push({ n:ms.own.left, cls:'warn', h:'<b>명부상 퇴사 '+ms.own.left+'명</b><br>'
      + '박성수(2026-06-30) · 임혜미(2026-05-22)<br>'
      + '<span class="sub" style="color:inherit">'
      + (CHECKED ? '홈페이지에 남아 있는 사람은 아래에 따로 적습니다.'
                 : '홈페이지에 올라가 있는지는 확인을 눌러야 압니다.')+'</span>'
      + '<div class="go"><button class="btn sm" onclick="go(\'members\');filt(\'own:left\')">'
      + '이 '+ms.own.left+'명 보기</button></div>' });
  }
  if (ms.kept) {
    /* 할 일이 아니다(n:0) — «왜 퇴사 경고가 없는지»를 알려 주는 줄이다 */
    out.push({ n:0, cls:'ok', h:'<b>남기기 예외 '+ms.kept+'명</b> — 장한돌 (지사장, 고용관계 아님)<br>'
      + '<span class="sub" style="color:inherit">명부에 퇴사로 찍혀 있어도 「내릴 것(퇴사)」 딱지를 '
      + '달지 않고 내용 대조만 합니다. 예외를 풀면 다음 확인에서 퇴사 판정을 다시 받습니다.</span>'
      + '<div class="go"><button class="btn sm" onclick="pickIn(\'members\',\'m8\')">장한돌 열기</button></div>' });
  }
  if (CHECKED) {
    out.push({ n:1, cls:'bad', h:'<b>퇴사한 노무사가 홈페이지에 남아 있습니다 — 1명</b><br>박성수'
      + '<details><summary>홈페이지에서 내리는 법</summary><ol>'
      + '<li>홈페이지 관리자 로그인 <span class="kbd">푸른노무법인.kr/admin</span></li>'
      + '<li><b>구성원 갤러리</b>에서 그 글을 찾습니다</li>'
      + '<li><b>삭제하지 말고 「비공개」</b>로 바꾸십시오</li>'
      + '<li>돌아와 <b>홈페이지 다시 확인</b></li></ol></details>'
      + '<div class="go"><button class="btn sm" onclick="pickIn(\'members\',\'m2\')">박성수 열기</button></div>' });
    out.push({ n:1, cls:'warn', h:'<b>홈페이지에만 있는 글 — 1건</b><br>글 번호 205'
      + '<div class="go"><button class="btn sm" onclick="pickIn(\'members\',\'m10\')">이 줄 열기</button></div>' });
    out.push({ n:1, cls:'warn', h:'<b>퇴사자 이름이 다른 쪽에도 남아 있습니다</b><br>임혜미 — 인사말 1회'
      + '<div class="go"><button class="btn sm" onclick="pickIn(\'greeting\',\'greeting\')">인사말 열기</button></div>' });
    out.push({ n:3, cls:'bad', h:'<b>안 올라간 것 — 3건</b><br>김혜민 · 인사노무컨설팅 · 인사말'
      + '<div class="go"><button class="btn sm" onclick="go(\'members\');filt(\'pending\')">구성원에서 보기</button>'
      + '<button class="btn sm" onclick="go(\'work\');filt(\'pending\')">주요업무에서 보기</button></div>' });
    out.push({ n:1, cls:'info', h:'<b>새로 올릴 사람 — 1명</b><br>박재원 (홈페이지 글 번호 없음)'
      + '<div class="go"><button class="btn sm" onclick="pickIn(\'members\',\'m5\')">박재원 열기</button></div>' });
  }
  var ws = statOf('work');
  if (ws.own.nobase) {
    out.push({ n:ws.own.nobase, cls:'info', h:'<b>대조 기준이 없는 쪽 — '+ws.own.nobase+'개</b><br>산재보상 (/work4)'
      + '<div class="go"><button class="btn sm" onclick="pickIn(\'work\',\'work4\')">산재보상 열기</button></div>' });
  }
  var ps = statOf('partner');
  if (ps.notPosted) {
    out.push({ n:ps.notPosted, cls:'bad', h:'<b>자문사 — 홈페이지에 안 올린 곳 '+ps.notPosted+'개사</b><br>'
      + '세종정밀 · 온누리병원<br><span class="sub" style="color:inherit">'
      + '로고 그림이라 기계가 못 봅니다 — 사람이 표시한 값입니다.</span>'
      + '<div class="go"><button class="btn sm" onclick="go(\'partner\');filt(\'notPosted\')">이 2개사 보기</button></div>' });
  }
  if (ps.own.ended) {
    out.push({ n:ps.own.ended, cls:'warn', h:'<b>자문이 끝났는데 홈페이지에 남은 곳 — '+ps.own.ended+'개사</b><br>'
      + '삼정테크(2026-03-31) · 아산화학(2025-12-31)<br>'
      + '<span class="sub" style="color:inherit">실적으로 남겨 둘 수도 있어 «알리기만» 합니다.</span>'
      + '<div class="go"><button class="btn sm" onclick="go(\'partner\');filt(\'own:ended\')">이 2개사 보기</button></div>' });
  }
  if (ps.own.noroster) {
    out.push({ n:ps.own.noroster, cls:'info', h:'<b>업체관리에 없는 자문사 — '+ps.own.noroster+'개사</b><br>미래교육원'
      + '<div class="go"><button class="btn sm" onclick="pickIn(\'partner\',\'p12\')">이 회사 열기</button></div>' });
  }
  return out;
}
function todoHtml() {
  var items = todoItems();
  var n = items.reduce(function(s,i){ return s + (i.n||0); }, 0);
  var el = document.getElementById('todoN');
  if (el) { el.textContent = n; el.className = 'c' + (n?'':' zero'); }
  var w = document.getElementById('todoWhen');
  if (w) w.textContent = CHECKED ? '확인: 2026-08-23 14:31' : '아직 대조 안 함';
  return items.map(function(i){ return '<div class="bar '+i.cls+'">'+i.h+'</div>'; }).join('');
}

/* ── 그리기 ── */
function put(id, html){ var el = document.getElementById(id); if (el) el.innerHTML = html; }
function drawAll() {
  put('dash', dashHtml());
  put('chips', chipsHtml());
  put('lh', lhHtml());
  put('rows', rowsHtml());
  put('edit', editHtml());
  put('todoBody', todoHtml());
  var w = document.getElementById('hWhen');
  if (w) w.textContent = CHECKED ? '홈페이지 확인: 2026-08-23 14:31' : '홈페이지 확인: 아직 안 함';
  var b = document.getElementById('mkBtn');
  if (b) { b.textContent = '목업 보기: ' + (CHECKED ? '대조 후' : '대조 전');
           b.className = 'mk' + (CHECKED ? ' on' : ''); }
}
function go(k){ G = k; FILTER = ''; PICK = (rowsOf(k)[0]||{}).id || ''; drawAll(); }
function pick(id){ PICK = id; drawAll(); }
function pickIn(k, id){ G = k; FILTER = ''; PICK = id; drawAll(); }
function filt(k){ FILTER = (FILTER===k) ? '' : k; drawAll(); }
function toggleCheck(){ CHECKED = !CHECKED; FILTER = ''; drawAll(); }

</script>
<script>drawAll();</script>
</body>
</html>
