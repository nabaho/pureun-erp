<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기업정보함 정리안 — 도구줄·옆줄</title>
<!--
  목업 — 승인용. 구현 아님. (pu-cards.html 기업 상세 화면)
  대표 지시 셋:
   ① 아래 선택 도구줄이 너무 이상하다 — 불편하고 정리가 안 됐다
   ② 「할 일」을 다르게(폴더로) 분류하려는데 계약해지가 «중복»되어 이상하다
   ③ 할 일 칸(종료·번호 없음·정보부족)은 사실상 불필요하다
  아래 「지금 / 정리 후」로 견주실 수 있습니다.
-->
<style>
:root{
  --ink:#1e293b; --sub:#64748b; --faint:#94a3b8; --line:#e2e8f0; --paper:#f8fafc;
  --navy:#1e3a8a; --blue:#2563eb; --red:#dc2626; --amber:#d97706; --green:#16a34a;
}
*{box-sizing:border-box;margin:0}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--paper);color:var(--ink);
  font-size:14px;line-height:1.7;padding:0 0 40px}
header{background:#0f172a;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px}
header b{font-size:15px}
header .sp{flex:1}
.mk{border:1px dashed #64748b;border-radius:8px;padding:3px 11px;font-size:12px;color:#cbd5e1;
  background:#1e293b;cursor:pointer;font-family:inherit;font-weight:700}
.mk.on{border-style:solid;border-color:#60a5fa;color:#fff;background:#1d4ed8}
.wrap{max-width:1480px;margin:0 auto;padding:14px 16px}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 3px;color:var(--navy)}
.lead{color:var(--sub);font-size:12.5px;margin-bottom:11px}
.note{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  font-size:12.5px;line-height:1.8;margin-top:11px}
.note b{font-weight:800}

/* ── 화면 흉내 ── */
.screen{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:#fff;min-height:340px}
.side{width:236px;flex:none;background:#0f172a;color:#cbd5e1;padding:10px 0;font-size:13px}
.side .sec2{padding:8px 14px 4px;font-size:11.5px;color:#64748b;font-weight:800;letter-spacing:.3px}
.side .it{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer}
.side .it:hover{background:#1e293b}
.side .it.on{background:#1d4ed8;color:#fff;font-weight:700}
.side .it .n{margin-left:auto;font-size:11.5px;color:#94a3b8}
.side .it.on .n{color:#dbeafe}
.side .it.sub2{padding-left:26px;font-size:12.5px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.tools{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);
  flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;
  font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit}
.chip.on{background:#0f172a;color:#fff;border-color:#0f172a}
.chip.amber{border-color:#fcd34d;background:#fffbeb;color:#92400e}
.rows{flex:1;padding:6px 0}
.row{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid #f1f5f9;font-size:13px}
.row .no{width:16px;color:var(--faint);font-size:12px;text-align:right}
.row .nm{width:210px;font-weight:600}
.row .fd{width:150px}
.tag{display:inline-block;border-radius:7px;padding:1px 8px;font-size:11.5px;font-weight:700;
  border:1px solid transparent}
.tag.fd{background:#fef9c3;border-color:#fde68a;color:#854d0e}
.tag.ty{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
.row .biz{width:120px;color:var(--sub);font-size:12.5px}
.row .mg{color:var(--sub);font-size:12.5px}

/* 선택 도구줄 */
.selwrap{padding:10px 12px;background:#f8fafc;border-top:1px solid var(--line)}
.selbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:7px 12px;box-shadow:0 6px 24px rgba(20,30,60,.10)}
.selbar b{white-space:nowrap;font-size:13px}
.selbar .sep{width:1px;height:18px;background:var(--line);flex:none;margin:0 3px}
.selbar button{flex:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;
  font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;cursor:pointer;font-family:inherit}
.selbar button:hover{background:#f8fafc;border-color:#bfdbfe}
.selbar button.red{color:var(--red);border-color:#fecaca}
.selbar button.icon{padding:6px 9px}
.selbar .hint{font-size:12px;color:var(--faint);margin-left:4px}
.cnt{display:inline-block;background:#fee2e2;color:#b91c1c;border-radius:8px;padding:0 7px;
  font-size:11.5px;font-weight:800;margin-left:6px}
/* ⋯ 안에 든 것 미리보기 */
.menu{margin-top:8px;border:1px solid var(--line);border-radius:11px;background:#fff;
  box-shadow:0 8px 26px rgba(20,30,60,.14);width:270px;overflow:hidden}
.menu .mi{padding:8px 13px;font-size:13px;border-bottom:1px solid #f1f5f9}
.menu .mi:last-child{border-bottom:0}
.menu .mi.danger{color:var(--red)}
.menu .hd{padding:6px 13px;font-size:11.5px;color:var(--faint);font-weight:800;background:#f8fafc}
.two{display:flex;gap:14px;flex-wrap:wrap}
.two > div{flex:1 1 320px}
.cap{font-size:12px;color:var(--sub);margin:6px 0 4px;font-weight:700}
</style>
</head>
<body>
<header>
  <b>기업정보함 정리안</b>
  <span style="font-size:12px;color:#94a3b8">아래 도구줄 · 옆줄 「할 일」 · 계약해지 중복</span>
  <span class="sp"></span>
  <button class="mk on" id="mkBtn">보기: 정리 후</button>
</header>
<div class="wrap">

<div class="sec">
  <h2>화면</h2>
  <div class="lead" id="lead"></div>
  <div class="screen">
    <div class="side" id="side"></div>
    <div class="main">
      <div class="tools" id="tools"></div>
      <div class="rows" id="rows"></div>
      <div class="selwrap"><div class="selbar" id="selbar"></div>
        <div id="menuBox"></div></div>
    </div>
  </div>
</div>

<div class="sec" id="why"></div>

</div>
<script>
var CLEAN = true;

var ROWS = [
  ['(주) 성도이엔지','2. 계약해지사업장','급여','505-81-44894','김보람'],
  ['올드밀','2. 계약해지사업장','급여','없음','김보람'],
  ['위라이브병원','2. 계약해지사업장','자문','612-98-74689','박성수'],
  ['위첸만코리아유한회사','2. 계약해지사업장','자문','211-86-75823','박성수'],
  ['주식회사 행복한단홍갈비','2. 계약해지사업장','급여','213-87-03415','신욱임'],
  ['충주시설관리공단노동조합','2. 계약해지사업장','자문','없음','박성수'],
  ['한마음정형외과의원','2. 계약해지사업장','급여','312-90-73542','주민정'],
  ['행복한 단홍갈비','2. 계약해지사업장','급여','726-33-00338','신욱임']
];

function sideHtml(){
  var h = '<div class="sec2">폴더</div>'
    + it('전체', '4154', false)
    + it('1. 업체관리', '167', false, true)
    + it('2. 계약해지사업장', '17', true, true)
    + it('3.기존거래사업장', '1', false, true)
    + it('통합기술보호지원단', '2', false, true)
    + it('일터생생혁신컨설팅', '1', false, true);
  if (!CLEAN) {
    /* 지금 — 폴더로 분류한 17곳이 「할 일 · 종료 17」로 한 번 더 나온다 */
    h += '<div class="sec2">할 일</div>'
      + it('🚪 종료', '17', false)
      + it('🔢 번호 없음', '4', false)
      + it('📋 정보부족', '8', false);
  }
  return h;
}
function it(name, n, on, sub){
  return '<div class="it' + (on ? ' on' : '') + (sub ? ' sub2' : '') + '">'
    + '<span>' + name + '</span><span class="n">' + n + '</span></div>';
}

function toolsHtml(){
  var h = '<button class="chip on"># 전체 17</button>'
    + '<button class="chip">＋ 탭 만들기</button>'
    + '<button class="chip">🏢 거래처 8</button>'
    + '<button class="chip">🏢 전체 8</button>'
    + '<button class="chip">100개</button>';
  if (CLEAN) {
    /* 정리 후 — 거르개는 «한 단추»로 접는다. 옆줄에서 통째로 내려왔다. */
    h += '<span style="flex:1"></span>'
      + '<button class="chip">🔎 거르개 ▾ <span class="cnt">2</span></button>';
  } else {
    h += '<button class="chip amber">🚪 종료만 보는 중 ✕</button>'
      + '<button class="chip amber">📋 정보부족만 보는 중 ✕</button>';
  }
  return h;
}

function rowsHtml(){
  return ROWS.map(function(r, i){
    return '<div class="row"><span class="no">' + (i + 1) + '</span>'
      + '<span class="nm">' + r[0] + '</span>'
      + '<span class="fd"><span class="tag fd">📁 ' + r[1] + '</span></span>'
      + '<span><span class="tag ty">' + r[2] + '</span></span>'
      + '<span class="biz">' + r[3] + '</span>'
      + '<span class="mg">' + r[4] + '</span></div>';
  }).join('');
}

function selbarHtml(){
  if (CLEAN) {
    /* 명함 쪽과 «같은 규칙» — 자주 쓰는 넷만 겉에, 나머지는 ⋯ 안, 삭제도 ⋯ 안 */
    return '<b>17곳 선택</b><span class="sep"></span>'
      + '<button>📁 폴더 ▾</button>'
      + '<button>🏷 서류 탭</button>'
      + '<button>🚪 계약해지</button>'
      + '<button id="moreBtn">⋯</button>'
      + '<span class="sep"></span>'
      + '<button class="icon" title="선택 해제">✕</button>'
      + '<span class="hint">끌어서 왼쪽 폴더에 놓아도 옮겨집니다</span>';
  }
  return '<b>17곳 선택</b>'
    + '<button>📁 폴더로 옮기기</button>'
    + '<button>📁 1. 업체관리</button>'
    + '<button>📁 3.기존거래사업장</button>'
    + '<button>📁 통합기술보호지원단</button>'
    + '<button>🏷 서류 탭에 담기</button>'
    + '<button>🧾 계산서 발급처 채우기</button>'
    + '<button>＃ 탭에 담기</button>'
    + '<button>📇 주소록 내보내기</button>'
    + '<button>🚪 계약해지</button>'
    + '<button>선택 해제</button>'
    + '<button>🧹 폴더·탭 비우기</button>'
    + '<button class="red">🗑 삭제 (휴지통)</button>'
    + '<span class="hint">끌어서 왼쪽 폴더에 놓아도 옮겨집니다</span>';
}

function menuHtml(){
  if (!CLEAN) return '';
  return '<div class="two">'
    + '<div><div class="cap">📁 폴더 ▾ 를 누르면</div>'
    + '<div class="menu"><div class="hd">자주 쓰는 폴더</div>'
    + '<div class="mi">📁 1. 업체관리</div>'
    + '<div class="mi">📁 3.기존거래사업장</div>'
    + '<div class="mi">📁 통합기술보호지원단</div>'
    + '<div class="hd">그 밖에</div>'
    + '<div class="mi">📂 다른 폴더 고르기…</div></div></div>'
    + '<div><div class="cap">⋯ 를 누르면</div>'
    + '<div class="menu">'
    + '<div class="mi">＃ 탭에 담기</div>'
    + '<div class="mi">🧾 계산서 발급처 채우기</div>'
    + '<div class="mi">📇 주소록 내보내기</div>'
    + '<div class="mi">🧹 폴더·탭 비우기</div>'
    + '<div class="mi danger">🗑 삭제 (휴지통)</div></div></div>'
    + '<div><div class="cap">🔎 거르개 ▾ 를 누르면 (옆줄에서 내려온 것)</div>'
    + '<div class="menu">'
    + '<div class="mi">🚪 종료 <span style="color:#94a3b8">17</span></div>'
    + '<div class="mi">🔢 번호 없음 <span style="color:#94a3b8">4</span></div>'
    + '<div class="mi">📋 정보부족 <span style="color:#94a3b8">8</span></div>'
    + '<div class="mi">🏛 고유번호증 <span style="color:#cbd5e1">0</span></div></div></div>'
    + '</div>';
}

function whyHtml(){
  if (CLEAN) {
    return '<h2>무엇이 달라지나</h2>'
      + '<div class="lead">셋 다 «없애는» 것이 아니라 «한 겹 안으로» 넣는 것입니다 — 하던 일은 그대로 됩니다.</div>'
      + '<div class="note"><b>① 도구줄 13개 → 5개.</b> 명함 쪽은 이미 이 규칙입니다'
      + '(<b>N개 선택 · 📁 폴더 · 🏷 탭 · 📧 주소 복사 · 🚪 퇴사 · ⋯ · ✕</b>). 회사 쪽만 안 맞춰져 있었습니다.<br>'
      + '자주 쓰는 폴더 셋은 <b>📁 폴더 ▾</b> 안 맨 위에 그대로 있습니다 — 두 번 누르는 대신 한 번 더 누르는 것뿐입니다.<br>'
      + '<b>삭제</b>는 ⋯ 안으로 들어갑니다. 지금은 「선택 해제」 옆이라 잘못 누르기 쉽습니다.</div>'
      + '<div class="note"><b>② 계약해지 중복이 사라집니다.</b> 「할 일 · 종료 17」은 푸른ERP 상태로 «자동 판정»한 것이고, '
      + '「2. 계약해지사업장 17」은 대표님이 «폴더로 분류»하신 것입니다. 같은 17곳이 두 군데 있어 어느 쪽이 진짜인지 헷갈렸습니다.<br>'
      + '옆줄은 <b>폴더만</b> 남습니다 — 분류는 폴더로 한다는 뜻이 화면에도 그대로 보입니다.</div>'
      + '<div class="note"><b>③ 할 일 칸은 내려갑니다.</b> 다만 «거르는 길»까지 없애지는 않았습니다 — '
      + '위 <b>🔎 거르개 ▾</b> 한 단추로 옮겼습니다(종료·번호 없음·정보부족·고유번호증). '
      + '지금 걸린 거르개 수는 단추에 빨간 숫자로 붙습니다.</div>';
  }
  return '<h2>지금 무엇이 문제인가</h2>'
    + '<div class="note"><b>도구줄에 단추가 13개</b>입니다. 지시가 올 때마다 옆에 하나씩 붙어 늘어났습니다. '
    + '삭제가 「선택 해제」 바로 옆이라 잘못 누르기도 쉽습니다.</div>'
    + '<div class="note"><b>같은 17곳이 두 군데</b> 있습니다 — 옆줄 「2. 계약해지사업장 17」(폴더로 분류)과 '
    + '「할 일 · 종료 17」(푸른ERP 상태로 자동 판정). 폴더로 분류하기 시작하시면서 겹쳤습니다.</div>';
}

function draw(){
  document.getElementById('side').innerHTML = sideHtml();
  document.getElementById('tools').innerHTML = toolsHtml();
  document.getElementById('rows').innerHTML = rowsHtml();
  document.getElementById('selbar').innerHTML = selbarHtml();
  document.getElementById('menuBox').innerHTML = menuHtml();
  document.getElementById('why').innerHTML = whyHtml();
  document.getElementById('lead').textContent = CLEAN
    ? '정리 후 — 옆줄은 폴더만, 도구줄은 다섯, 거르개는 위 한 단추로.'
    : '지금 — 옆줄에 「할 일」이 겹쳐 있고, 아래 도구줄에 단추가 13개입니다.';
  var b = document.getElementById('mkBtn');
  b.textContent = '보기: ' + (CLEAN ? '정리 후' : '지금');
  b.className = 'mk' + (CLEAN ? ' on' : '');
}
document.getElementById('mkBtn').onclick = function(){ CLEAN = !CLEAN; draw(); };
draw();
</script>
</body>
</html>
