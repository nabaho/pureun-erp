<!doctype html><meta charset="utf-8">
<!-- 푸른 포털 아이콘 후보 — 한글 10 (대표 지시 2026-08-27 「추가로 한글 디자인」)
     ★ 글자를 폰트로 «찍지» 않고 획의 가운뎃줄로 «그린다». 폰트를 그대로 쓰면
       아이콘이 아니라 「글자 사진」이 된다 — 획 굵기와 속공간을 우리가 정해야
       작을 때 읽힌다.
     ⚠ 처음엔 네모를 쌓아 그렸더니 ㄹ·ㄴ 이 통째로 검은 덩어리가 됐다.
       획을 «선» 으로 그으면 꺾이는 자리는 브라우저가 맞춰 준다(stroke-linejoin).
     ⚠ 속공간은 획 굵기의 «절반» 은 돼야 글자로 읽힌다 — 른(ㄹ+ㅡ+ㄴ)에서 배운 것.
     ⚠ 두 글자(푸른·노무)는 큰 화면에서만 예쁘다. 44px 미리보기가 그 사실을 말해 준다. -->
<style>
 body{margin:0;background:#141821;color:#e7ecf5;
   font-family:system-ui,sans-serif;-webkit-font-smoothing:antialiased}
 .wrap{padding:26px 22px 30px}
 h1{font-size:21px;margin:0 0 4px;letter-spacing:-.4px}
 .sub{font-size:12.5px;color:#93a1bb;margin:0 0 22px;line-height:1.6}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
 .cell{background:#1b2130;border:1px solid #29324a;border-radius:16px;padding:16px 14px 13px;
   display:flex;flex-direction:column;align-items:center}
 .head{width:100%;display:flex;align-items:center;gap:7px;margin-bottom:11px}
 .num{width:21px;height:21px;border-radius:7px;background:#2f3a54;color:#c8d5ee;
   font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
 .nm{font-size:13px;font-weight:800;letter-spacing:-.3px}
 .big{width:132px;height:132px;display:block}
 .cap{font-size:11px;color:#8fa0bd;line-height:1.55;margin-top:10px;text-align:center;min-height:34px}
 .mini{margin-top:9px;display:flex;align-items:center;gap:9px;
   background:#11151d;border-radius:9px;padding:6px 10px}
 .mini svg{width:44px;height:44px;display:block}
 .mini span{font-size:10px;color:#6d7c96}
</style>
<div class="wrap">
<h1>푸른 포털 아이콘 — 한글 디자인 10</h1>
<p class="sub">글자를 <b>손으로 그려</b> 만든 것들입니다(폰트를 그대로 쓰지 않았습니다).
아래 작은 것이 실제 홈 화면 크기(44px)예요.</p>
<div class="grid" id="g"></div>
</div>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#1E40AF"/><stop offset="1" stop-color="#0A1740"/></linearGradient>
<linearGradient id="bg3" x1=".1" y1="0" x2=".9" y2="1">
  <stop offset="0" stop-color="#60A5FA"/><stop offset=".55" stop-color="#2563EB"/>
  <stop offset="1" stop-color="#132A6B"/></linearGradient>
<linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#D7E5FF"/></linearGradient>
</defs></svg>
<div id="defs2"></div>
<script>
/* ── 한글을 «획의 가운뎃줄» 로 그린다 (100×100 칸) ────────────────────────
   앞서 네모를 쌓아 그렸더니 ㄹ·ㄴ 이 뭉개졌다 — 획이 겹치는 자리를 사람이
   일일이 맞춰야 했기 때문이다. 획을 «선» 으로 그으면 꺾이는 자리는 브라우저가
   맞춰 준다(stroke-linejoin). 굵기·둥글기는 우리가 정한다 — 그것이 곧 디자인이다. */
function G(d,x,y,size,color,w,round){
  return '<g transform="translate('+x+','+y+') scale('+(size/100)+')" fill="none" stroke="'+color+
    '" stroke-width="'+w+'" stroke-linecap="'+(round?'round':'butt')+
    '" stroke-linejoin="'+(round?'round':'miter')+'"><path d="'+d+'"/></g>';
}
function 푸(w){ var a=w/2, b=46-w/2, c=68, e=100-w/2;
  return 'M0 '+a+'H100 M24 '+a+'V'+b+' M76 '+a+'V'+b+' M0 '+b+'H100'
       + ' M0 '+c+'H100 M50 '+c+'V'+e; }
function ㅍ(w){ var a=w/2+16, b=84-w/2;
  return 'M0 '+a+'H100 M24 '+a+'V'+b+' M76 '+a+'V'+b+' M0 '+b+'H100'; }
function ㄹ(w){ var a=w/2+14, b=86-w/2;
  return 'M0 '+a+'H100 V50 H0 V'+b+' H100'; }
/* ⚠ 른 은 ㄹ+ㅡ+ㄴ 셋이 한 칸에 쌓인다 — 처음엔 획 사이(속공간)를 2.5 밖에
   안 줘서 통째로 검은 덩어리가 됐다. 속공간이 획 굵기의 절반은 돼야 글자로 읽힌다. */
function 른(w){ var a=w/2;
  return 'M0 6 H100 V22 H0 V38 H100'                 /* ㄹ — 속공간을 넉넉히 */
       + ' M0 56 H100'                                /* ㅡ */
       + ' M'+a+' 70 V'+(100-a)+' H100'; }            /* ㄴ (받침이라 납작하게) */
function 노(w){ var a=w/2;
  return 'M'+a+' '+a+' V40 H100'                      /* ㄴ */
       + ' M50 58 V86 M0 86 H100'; }                   /* ㅗ */
function 무(w){ var a=w/2;
  return 'M20 '+a+' H80 V'+(46-a)+' H20 Z'            /* ㅁ */
       + ' M0 68 H100 M50 68 V'+(100-a); }            /* ㅜ */
function ㅜ(w){ var a=w/2; return 'M0 '+a+'H100 M50 '+a+'V'+(100-a); }

var SQ='<rect width="512" height="512" rx="118" ';
var D=[
 ['ㅍ 하나','자음 하나. 가장 단순하고 가장 크게 보인다',
  SQ+'fill="url(#bg1)"/>'+G(ㅍ(22),106,106,300,'#fff',22,true)],

 ['원 안의 ㅍ','둥근 판이 글자를 붙든다 — 단정하다',
  SQ+'fill="#EAF1FF"/><circle cx="256" cy="256" r="174" fill="#1D4ED8"/>'
  +G(ㅍ(21),136,136,240,'#EAF1FF',21,false)],

 ['각진 푸','획 끝을 직각으로. 도장·표지 같은 단단함',
  SQ+'fill="url(#bg2)"/>'+G(푸(15),116,116,280,'#EAF1FF',15,false)],

 ['둥근 푸','획 끝을 완전히 둥글게. 부드럽고 요즘 결',
  SQ+'fill="url(#bg3)"/>'+G(푸(17),116,116,280,'#fff',17,true)],

 ['가는 푸','획을 가늘게, 사이를 넓게 — 값비싼 느낌',
  SQ+'fill="#0A1740"/>'+G(푸(10),126,126,260,'#E8F0FF',10,true)],

 ['푸른 세로','두 글자를 위아래로. 세로쓰기의 품격',
  SQ+'fill="url(#bg2)"/>'+G(푸(15),156,86,200,'#fff',15,false)
  +G(른(12),156,296,200,'#8FB4FA',12,false)],

 ['푸른 가로','두 글자를 나란히. 이름이 그대로 보인다',
  SQ+'fill="url(#bg1)"/>'+G(푸(16),74,166,180,'#fff',16,false)
  +G(른(13),282,166,180,'#BFD5FF',13,false)],

 ['ㅍㄹ 초성','「푸른」의 첫소리 둘. 글자인 듯 무늬인 듯',
  SQ+'fill="#EAF1FF"/>'+G(ㅍ(15),70,150,180,'#1D4ED8',15,false)
  +G(ㄹ(15),268,150,180,'#60A5FA',15,false)],

 ['노무','하는 일을 그대로 — 노무(勞務)',
  SQ+'fill="url(#bg3)"/>'+G(노(17),74,166,180,'#fff',17,true)
  +G(무(17),282,166,180,'#DCE9FF',17,true)],

 ['두 색 푸','ㅍ 과 ㅜ 를 색으로 가른다 — 하나인데 둘',
  SQ+'fill="#0E2A6B"/>'
  +G('M0 9 H100 M24 9 V37 M76 9 V37 M0 37 H100',116,116,280,'#fff',18,true)
  +G('M0 68 H100 M50 68 V91',116,116,280,'#5B9DF9',18,true)]
];

var d='<svg width="0" height="0" style="position:absolute"><defs>';
for(var i=0;i<D.length;i++)
  d+='<symbol id="k'+(i+1)+'" viewBox="0 0 512 512">'+D[i][2]+'</symbol>';
d+='</defs></svg>';
document.getElementById('defs2').innerHTML=d;

var h='';
for(var i=0;i<D.length;i++){var n=i+1;
  h+='<div class="cell"><div class="head"><div class="num">'+n+'</div><div class="nm">'+D[i][0]+'</div></div>'+
     '<svg class="big"><use href="#k'+n+'"/></svg>'+
     '<div class="cap">'+D[i][1]+'</div>'+
     '<div class="mini"><svg><use href="#k'+n+'"/></svg><span>실제 크기</span></div></div>';
}
document.getElementById('g').innerHTML=h;
</script>
