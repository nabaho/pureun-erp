<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>목업 — 담당자별 자동 분류 (안 1 걸러 보기 / 안 2 옮기기)</title>
<!--
  ═══════════════════════════════════════════════════════════════════════
  대표 물음 2026-08-26(셋째):
    "대시보드를 푸른이알피 근무자를 연결해서 담당자별로 자동으로 만들고
     담당자의 거래자 이메일을 연결해서 자동으로 받을 수 있게 할 수 있을까?"
  ═══════════════════════════════════════════════════════════════════════

  ★ 이 목업의 숫자는 «지어낸 것이 아니다». 2026-08-26 실시간DB 를 그대로 세었다.
     · 직원 13명(재직) · 기업 363곳 중 담당자 적힌 곳 248곳
     · 기업정보함 이메일 0건  ← 여기가 비어 있다
     · 명함첩 이메일 4,265건 (명함첩엔 담당자 0건)
     · 두 곳을 «회사 이름»으로 이어 → 주소 199개 + 회사 도메인 37개
     · 1.자문사답변 404통 가운데 216통(53%)이 자동으로 담당자가 잡힌다
       박한별124 · 김혜민46 · 박재원32 · 임혜미13 · 최기운1 · 담당 모름 188

  ⚠ 정할 것은 «메일이 지금 칸에서 빠지느냐»뿐이다. 두 안을 나란히 둔다.
-->
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'맑은 고딕','Malgun Gothic',AppleSDGothicNeo-Regular,'돋움',dotum,sans-serif;
  background:#f6f7f9;color:#1a1a1a;-webkit-font-smoothing:antialiased}
:root{--blue:#2563d1;--sub:#8c8c8c;--line:#e4e5e9;--hover:#f7f8fa;--sel:#eef3fb;
  --pu:#0f8a5f;--pu-bg:#eaf6f1;--who:#7b4bd1;--who-bg:#f2ecfd}

.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px 0}
.top h1{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.4px}
.top p{margin:0 0 14px;font-size:13px;color:#5b6068;line-height:1.75}
.tabs{display:flex;gap:6px}
.tabs button{font-family:inherit;font-size:13.5px;font-weight:700;border:1px solid var(--line);
  border-bottom:none;background:#f1f3f5;color:#6b7078;border-radius:8px 8px 0 0;padding:10px 18px;cursor:pointer}
.tabs button.on{background:#fff;color:#111;box-shadow:0 -2px 0 var(--blue) inset}

.wrap{display:flex;align-items:flex-start;background:#fff;min-height:520px}
.side{width:250px;flex:0 0 250px;padding:14px 10px 30px 18px;border-right:1px solid #f0f1f3}
.main{flex:1;min-width:0;padding:14px 22px 30px 16px}

.sec{display:flex;align-items:center;gap:6px;height:34px;padding:0 8px;margin-top:10px;
  font-size:12.5px;color:#6e6e6e;cursor:default}
.sec .nm{flex:1}
.sec .tool{font-size:13px;color:#a8abb2;padding:2px 5px;border-radius:4px}
.sec.pu{color:var(--pu);font-weight:700}
.sec.pu .nm::before{content:'●';font-size:8px;vertical-align:2px;margin-right:5px}
.sec.who{color:var(--who);font-weight:700}
.sec.who .nm::before{content:'●';font-size:8px;vertical-align:2px;margin-right:5px}
.sec.daum{border-top:1px solid #f0f0f0;margin-top:12px;padding-top:4px;color:#8c8c8c}

.f{display:flex;align-items:center;gap:8px;height:33px;padding:0 8px;border-radius:5px;
  font-size:13.5px;color:#2b2b2b;cursor:pointer}
.f:hover{background:var(--hover)}
.f.on{background:var(--sel);color:#123a86;font-weight:700}
.f.sub{padding-left:15px;font-size:13px}
.f .ic{width:17px;flex:none;text-align:center;font-size:13px;opacity:.85}
.f .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f .n{flex:none;font-size:12px;color:#8c8c8c}
.f.whobin.on{background:var(--who-bg);color:#4c2a8f}
.f .auto{flex:none;font-size:10px;color:var(--who);background:var(--who-bg);
  border:1px solid #e0d4fa;border-radius:3px;padding:0 5px}
.hint{font-size:11.5px;color:#a8abb2;line-height:1.65;padding:6px 9px 2px}

.head{display:flex;align-items:baseline;gap:10px;padding:2px 2px 6px}
.head h2{margin:0;font-size:17px;font-weight:700}
.head .s{font-size:12px}
.tools{display:flex;align-items:center;gap:2px;height:38px;border-bottom:1px solid #d5d7dc}
.tools button{font-family:inherit;font-size:13px;color:#333;background:none;border:none;
  padding:7px 10px;border-radius:4px;cursor:pointer}
.tools button:hover{background:var(--hover)}
.tools .sp{flex:1}
.row{display:flex;align-items:center;height:40px;border-bottom:1px solid #f1f2f4;font-size:13px;cursor:pointer}
.row:hover{background:var(--hover)}
.row .st{flex:none;width:26px;text-align:center;color:#c9ccd2}
.row .who{flex:none;width:132px;padding-right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
.row .at{flex:none;width:52px;text-align:right;color:#8c8c8c;font-size:12.5px}
.row.unread .who,.row.unread .sub{font-weight:700}
.tag{flex:none;font-size:10.5px;border-radius:3px;padding:1px 6px;margin-right:8px;white-space:nowrap}
.tag.w{color:#5b3a9c;background:var(--who-bg);border:1px solid #e0d4fa}
.tag.g{color:#5d7a6d;background:var(--pu-bg);border:1px solid #cfe6dc}
.tag.q{color:#8a6d1f;background:#fdf6e3;border:1px solid #f0e2b8;cursor:pointer}
.tag.q:hover{background:#f9edcb}
.empty{padding:36px 8px;text-align:center;color:#a8abb2;font-size:13px;line-height:1.9}

.note{margin:16px 24px 24px;border:1px solid var(--line);border-radius:10px;padding:16px 18px;
  background:#fff;font-size:13.5px;line-height:1.85;color:#33383f}
.note h3{margin:0 0 8px;font-size:14.5px;color:#111}
.note table{border-collapse:collapse;margin:8px 0 4px;font-size:12.5px;width:100%}
.note td,.note th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.note th{background:#f4f6f8;font-weight:700}
.note .ok{color:var(--pu);font-weight:700}
.note .no{color:#c0392b;font-weight:700}
.bar{height:9px;border-radius:99px;background:#eef0f3;overflow:hidden;margin:6px 0 2px;max-width:420px}
.bar i{display:block;height:100%;background:var(--who)}
.tagline{position:fixed;right:14px;bottom:12px;background:#111;color:#fff;font-size:11.5px;
  border-radius:99px;padding:6px 13px;opacity:.82;z-index:50}
.toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:#1c2128;color:#fff;
  font-size:13px;padding:11px 18px;border-radius:8px;z-index:60;display:none}
</style>
</head>
<body>

<div class="top">
  <h1>담당자별 자동 분류 — 두 가지 안</h1>
  <p>아래 숫자는 <b>2026-08-26 실제 자료를 그대로 센 것</b>입니다.
     1.자문사답변 404통 가운데 <b>216통(53%)</b>이 보낸이 주소만으로 담당자가 잡힙니다.<br>
     정할 것은 하나입니다 — <b>메일이 「1.자문사답변」에서 빠지느냐, 그대로 있느냐.</b></p>
  <div class="tabs">
    <button id="t1" class="on" onclick="go(1)">안 1 · 걸러 보기 (안 빠짐)</button>
    <button id="t2" onclick="go(2)">안 2 · 옮기기 (빠짐)</button>
  </div>
</div>

<div class="wrap">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>

<div class="note" id="note"></div>
<div class="toast" id="toast"></div>
<div class="tagline">목업 — 담당자별 분류 · 2026-08-26</div>

<script>
/* ══════ 실제로 센 값 (2026-08-26) ══════ */
const MGR = [
  {n:'박한별', c:124}, {n:'김혜민', c:46}, {n:'박재원', c:32},
  {n:'임혜미', c:13},  {n:'최기운', c:1}
];
const UNKNOWN = 188;                 /* 담당 모름 */
const TOTAL   = 404;                 /* 1.자문사답변 전체 */

/* 목록에 보일 메일 몇 줄 — 보낸이·담당자는 실제 자료에서 뽑은 모양 */
const MAIL = [
  {who:'유종욱 · (주)아이티나노텍', sub:'8월 급여 관련 문의드립니다',      at:'08.25', r:0, mgr:'박한별'},
  {who:'y.kim@m3.co.kr',            sub:'취업규칙 검토 요청 건',           at:'08.25', r:0, mgr:''},
  {who:'김경리 · 대한산업',         sub:'RE: 4대보험 취득 신고 완료',      at:'08.24', r:1, mgr:'김혜민'},
  {who:'coeleng@hanmail.net',       sub:'연차수당 계산 확인 부탁드립니다', at:'08.24', r:1, mgr:''},
  {who:'박총무 · 한빛물산',         sub:'퇴직금 중간정산 문의',            at:'08.23', r:1, mgr:'박한별'},
  {who:'이대표 · 세화테크',         sub:'근로계약서 서식 요청',            at:'08.23', r:1, mgr:'박재원'},
  {who:'firstin-@naver.com',        sub:'상시근로자수 산정 관련',          at:'08.22', r:1, mgr:''},
  {who:'정경리 · 우진기업',         sub:'육아휴직 급여 신청 서류',         at:'08.22', r:1, mgr:'임혜미'}
];

let plan = 1;                /* 1 = 걸러 보기 · 2 = 옮기기 */
let now  = 'topic';          /* topic | who:이름 | unknown */
const learned = {};          /* 목업에서 손으로 정해 준 것 */

function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function mgrOf(m){ return m.mgr || learned[m.who] || ''; }

/* 1.자문사답변 칸에 몇 통 남나 — 안 2 는 담당자가 잡힌 것이 빠져나간다 */
function topicCount(){
  if(plan === 1) return TOTAL;
  return UNKNOWN - Object.keys(learned).length;
}
function whoCount(name){
  const base = (MGR.find(x=>x.n===name)||{}).c || 0;
  return base + Object.keys(learned).filter(k=>learned[k]===name).length;
}

function drawSide(){
  let h = '';
  h += `<div class="f"><span class="ic">✉</span><span class="nm">전체메일</span></div>
        <div class="f"><span class="ic">📥</span><span class="nm">받은메일함</span></div>`;

  /* ── 담당자 칸 — 직원 명부에서 저절로 만들어진다 ── */
  h += `<div class="sec who"><span class="nm">담당자</span>
        <span class="tool" title="직원 명부에서 저절로 만들어집니다">자동</span></div>`;
  MGR.forEach(m=>{
    const on = (now === 'who:'+m.n);
    h += `<div class="f sub whobin ${on?'on':''}" onclick="go2('who:${m.n}')">
      <span class="ic">👤</span><span class="nm">${esc(m.n)}</span>
      <span class="n">${whoCount(m.n)}</span></div>`;
  });
  const unk = UNKNOWN - Object.keys(learned).length;
  h += `<div class="f sub ${now==='unknown'?'on':''}" onclick="go2('unknown')"
      title="보낸이 주소로 담당자를 찾지 못한 메일 — 한 번 정해 주면 다음부터 저절로 갑니다">
      <span class="ic">❓</span><span class="nm">담당 모름</span>
      <span class="n">${unk}</span></div>`;

  /* ── 주제 칸(푸른 분류) — 지금 있는 그것 ── */
  h += `<div class="sec pu"><span class="nm">푸른 분류</span>
        <span class="tool">👁</span><span class="tool">＋</span></div>`;
  h += `<div class="f sub ${now==='topic'?'on':''}" onclick="go2('topic')">
      <span class="ic">📂</span><span class="nm">1.자문사답변</span>
      <span class="n">${topicCount()}</span></div>`;
  ['2.급여+사무대행','3.컨설팅(정부사업)','6.공공기관'].forEach(n=>{
    h += `<div class="f sub"><span class="ic">📂</span><span class="nm">${n}</span></div>`;
  });

  h += `<div class="sec daum"><span class="nm">다음메일 원본 ⌄</span>
        <span class="tool">＋</span></div>`;
  document.getElementById('side').innerHTML = h;
}

function rowsNow(){
  if(now === 'topic'){
    /* 안 1 은 다 남고, 안 2 는 담당자가 잡힌 것이 빠진다 */
    return plan === 1 ? MAIL : MAIL.filter(m=>!mgrOf(m));
  }
  if(now === 'unknown') return MAIL.filter(m=>!mgrOf(m));
  const name = now.slice(4);
  return MAIL.filter(m=>mgrOf(m) === name);
}

function drawMain(){
  const rows = rowsNow();
  let title, sub, subColor;
  if(now === 'topic'){
    title = '1.자문사답변'; sub = '● 푸른 분류'; subColor = 'var(--pu)';
  } else if(now === 'unknown'){
    title = '담당 모름'; sub = '❓ 보낸이 주소가 어느 자문사인지 아직 모릅니다'; subColor = '#8a6d1f';
  } else {
    title = '👤 ' + now.slice(4);
    sub = plan === 1
      ? '● 담당자 — 메일은 제자리에 있고, 이 칸은 «골라 보여 주는» 자리입니다'
      : '● 담당자 — 메일이 이 칸으로 옮겨졌습니다';
    subColor = 'var(--who)';
  }

  let h = `<div class="head"><h2>${esc(title)}</h2>
      <span class="s" style="color:${subColor}">${sub}</span></div>
    <div class="tools">
      <button>삭제</button><button>답장</button><button>전달</button>
      <button>분류 ˅</button>
      <span class="sp"></span>
      <span style="font-size:11.5px;color:#a8abb2">${rows.length}통 보는 중</span>
    </div>`;

  if(!rows.length){
    h += `<div class="empty">이 칸에는 메일이 없습니다.</div>`;
  } else rows.forEach(m=>{
    const g = mgrOf(m);
    let tag = '';
    if(now === 'topic' && g)              tag = `<span class="tag w">👤 ${esc(g)}</span>`;
    else if(now.indexOf('who:')===0 && plan===2) tag = `<span class="tag g">다음: 1.자문사답변</span>`;
    else if(now.indexOf('who:')===0 && plan===1) tag = `<span class="tag g">📂 1.자문사답변</span>`;
    else if(!g)                            tag = `<span class="tag q" onclick="event.stopPropagation();ask('${esc(m.who)}')">＋ 담당자 정하기</span>`;
    h += `<div class="row ${m.r?'':'unread'}">
      <span class="st">☆</span>
      <span class="who">${esc(m.who)}</span>
      <span class="sub">${esc(m.sub)}</span>
      ${tag}
      <span class="at">${m.at}</span></div>`;
  });
  document.getElementById('main').innerHTML = h;
}

function ask(who){
  const names = MGR.map(m=>m.n);
  const pick = prompt('「' + who + '」 는 누구의 자문사입니까?\n\n' + names.join(' / ')
    + '\n\n(한 번 정하면 이 주소에서 오는 메일은 다음부터 저절로 그 칸으로 갑니다)', names[0]);
  if(!pick || names.indexOf(pick) < 0) return;
  learned[who] = pick;
  draw();
  toast('👤 「' + who + '」 → ' + pick + ' 로 이었습니다 — 다음부터 저절로 갑니다');
}

function drawNote(){
  const kept = plan===1 ? TOTAL : UNKNOWN;
  const h = `
  <h3>안 ${plan} — ${plan===1 ? '걸러 보기 (메일은 안 빠진다)' : '옮기기 (메일이 빠진다)'}</h3>
  <table>
    <tr><th style="width:150px">무엇이</th><th>안 1 · 걸러 보기</th><th>안 2 · 옮기기</th></tr>
    <tr><td>1.자문사답변 칸</td>
        <td class="ok">404통 그대로</td>
        <td class="no">188통만 남음 (담당자 잡힌 216통이 빠져나감)</td></tr>
    <tr><td>담당자 칸</td>
        <td>그 주제 칸 안에서 «그 사람 것만» 골라 보여 준다</td>
        <td>메일이 실제로 이 칸에 있다</td></tr>
    <tr><td>한 통을 두 곳에서</td>
        <td class="ok">본다 — 주제로도, 사람으로도</td>
        <td class="no">못 본다 — 사람 칸에만 있다</td></tr>
    <tr><td>잘못 잡혔을 때</td>
        <td class="ok">주제 칸은 멀쩡하다 (걸러 보기만 틀림)</td>
        <td class="no">엉뚱한 사람 칸으로 가서 주제 칸에서 사라진다</td></tr>
    <tr><td>왼쪽이 단순한가</td>
        <td>칸이 두 줄기(사람·주제)</td>
        <td class="ok">사람 칸에 다 모인다</td></tr>
    <tr><td>대표님이 하실 일</td>
        <td colspan="2" style="text-align:center">둘 다 같다 — 「담당 모름」에서 한 번씩 정해 주면 쓸수록 는다</td></tr>
  </table>

  <h3 style="margin-top:16px">지금 자료로 얼마나 잡히나 (실측)</h3>
  <div class="bar"><i style="width:53%"></i></div>
  <div style="font-size:12.5px;color:#5b6068">
    1.자문사답변 <b>404통 중 216통(53%)</b> — 박한별124 · 김혜민46 · 박재원32 · 임혜미13 · 최기운1<br>
    나머지 188통은 보낸이가 <b>개인 주소(naver·hanmail 등)</b>라 어느 자문사인지 적힌 곳이 없습니다.
  </div>
  <div style="margin-top:10px;font-size:12.5px;color:#5b6068">
    ⚠ <b>기업정보함 363곳에 이메일이 한 건도 없습니다.</b> 지금은 «회사 이름»으로 명함첩과 이어
    199개 주소를 얻은 것입니다. 기업정보함에 이메일을 채우면 이 53%가 곧바로 올라갑니다.<br>
    ⚠ <b>담당자 칸은 직원 명부에서 저절로 만들어집니다</b> — 사람이 바뀌면 칸도 따라갑니다.
    담당 자문사가 하나도 없는 직원은 칸을 만들지 않습니다(빈 칸이 늘어서면 왼쪽만 길어집니다).
  </div>`;
  document.getElementById('note').innerHTML = h;
}

function go(p){
  plan = p;
  document.getElementById('t1').className = p===1 ? 'on' : '';
  document.getElementById('t2').className = p===2 ? 'on' : '';
  draw();
}
function go2(k){ now = k; draw(); }
function draw(){ drawSide(); drawMain(); drawNote(); }

let _t;
function toast(s){
