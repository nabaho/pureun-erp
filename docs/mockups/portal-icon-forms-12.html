<!doctype html><meta charset="utf-8">
<!-- 푸른 포털 아이콘 후보 — 여러 형태 12 (대표 지시 2026-08-27
     「푸 하나만 하지 말고 좀 다양한 형태, 푸른도 되고 여러 가지로」)
     ★ 앞 세 장은 «한 글자» 에 매여 있었다. 여기서는 담는 글자(푸른·푸른노무·ㅍ)와
       짜임(가로·세로·락업·배지·글자+심볼·말풍선)을 함께 갈랐다.
     ⚠ 두 글자를 넣으려면 속공간(획 사이)이 획 굵기의 0.6배는 돼야 한다 —
       앞 장에서 0.33 으로 그렸다가 「른」이 통째로 검은 덩어리가 됐다.
     ⚠ 그래도 두 글자는 44px 에서 흐려진다. 미리보기가 그 사실을 숨기지 않는다. -->
<style>
 body{margin:0;background:#141821;color:#e7ecf5;font-family:system-ui,sans-serif;-webkit-font-smoothing:antialiased}
 .wrap{padding:26px 22px 30px}
 h1{font-size:21px;margin:0 0 4px;letter-spacing:-.4px}
 .sub{font-size:12.5px;color:#93a1bb;margin:0 0 22px;line-height:1.6}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
 .cell{background:#1b2130;border:1px solid #29324a;border-radius:16px;padding:16px 14px 13px;
   display:flex;flex-direction:column;align-items:center}
 .head{width:100%;display:flex;align-items:center;gap:7px;margin-bottom:11px}
 .num{width:21px;height:21px;border-radius:7px;background:#2f3a54;color:#c8d5ee;
   font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
 .nm{font-size:13px;font-weight:800;letter-spacing:-.3px}
 .big{width:132px;height:132px;display:block}
 .cap{font-size:11px;color:#8fa0bd;line-height:1.55;margin-top:10px;text-align:center;min-height:34px}
 .mini{margin-top:9px;display:flex;align-items:center;gap:9px;background:#11151d;border-radius:9px;padding:6px 10px}
 .mini svg{width:44px;height:44px;display:block}
 .mini span{font-size:10px;color:#6d7c96}
</style>
<div class="wrap">
<h1>푸른 포털 아이콘 — 여러 형태 12</h1>
<p class="sub">「푸」 한 글자만이 아니라 <b>푸른 · 푸른노무 · ㅍ · 글자+심볼</b>까지 형태를 갈라 봤습니다.
아래 작은 것이 실제 홈 화면 크기(44px)예요.</p>
<div class="grid" id="g"></div>
</div>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="b1" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient>
<linearGradient id="b2" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#1E40AF"/><stop offset="1" stop-color="#0A1740"/></linearGradient>
<linearGradient id="b3" x1=".1" y1="0" x2=".9" y2="1">
  <stop offset="0" stop-color="#60A5FA"/><stop offset=".55" stop-color="#2563EB"/>
  <stop offset="1" stop-color="#132A6B"/></linearGradient>
<linearGradient id="lf" x1="0" y1="1" x2="1" y2="0">
  <stop offset="0" stop-color="#16A34A"/><stop offset="1" stop-color="#6EE7A8"/></linearGradient>
</defs></svg>
<div id="defs2"></div>
<script>
/* 획의 «가운뎃줄» 로 글자를 그린다. 속공간(획 사이)은 획 굵기의 0.6배 이상 —
   그 아래로 내려가면 한글은 덩어리로 뭉개진다(2026-08-27 른 에서 배운 것). */
function G(d,x,y,size,color,w,round,extra){
  return '<g transform="translate('+x+','+y+') scale('+(size/100)+')" fill="none" stroke="'+color+
    '" stroke-width="'+w+'" stroke-linecap="'+(round?'round':'butt')+
    '" stroke-linejoin="'+(round?'round':'miter')+'"'+(extra||'')+'><path d="'+d+'"/></g>';
}
function 푸(w){var a=w/2,b=44-a;return 'M0 '+a+'H100 M24 '+a+'V'+b+' M76 '+a+'V'+b+' M0 '+b+'H100 M0 66 H100 M50 66 V'+(100-a);}
function 른(w){var a=w/2;return 'M0 '+a+'H100 V21 H0 V'+(42-a)+' H100 M0 55 H100 M'+a+' 68 V'+(100-a)+' H100';}
function ㅍ(w){var a=w/2+16,b=84-w/2;return 'M0 '+a+'H100 M24 '+a+'V'+b+' M76 '+a+'V'+b+' M0 '+b+'H100';}
function ㄹ(w){var a=w/2+14,b=86-w/2;return 'M0 '+a+'H100 V50 H0 V'+b+' H100';}
function ㄴ(w){var a=w/2+14,b=86-w/2;return 'M'+a+' '+a+'V'+b+' H100';}
function ㅁ(w){var a=w/2+16,b=84-w/2;return 'M'+a+' '+a+'H'+(100-a)+'V'+b+'H'+a+'Z';}
function 노(w){var a=w/2;return 'M'+a+' '+a+'V40 H100 M50 58 V86 M0 86 H100';}
function 무(w){var a=w/2;return 'M20 '+a+'H80 V'+(44-a)+'H20 Z M0 66 H100 M50 66 V'+(100-a);}

var SQ='<rect width="512" height="512" rx="118" ';
var D=[
['푸른 — 가로','두 글자를 크게. 속공간을 넓혀 44px 에서도 버티게 했다',
 SQ+'fill="url(#b1)"/>'+G(푸(11),46,166,180,'#fff',11,false)+G(른(10),286,166,180,'#fff',10,false)],

['푸른 — 세로','위아래 2단. 세로쓰기라 글자가 더 커진다',
 SQ+'fill="url(#b2)"/>'+G(푸(11),161,66,190,'#fff',11,false)+G(른(10),161,282,190,'#9DC0FF',10,false)],

['ㅍ + 푸른','큰 자음이 얼굴, 이름은 아래 작게 — 회사 로고의 짜임',
 SQ+'fill="#0A1740"/>'+G(ㅍ(18),126,86,260,'#fff',18,true)
 +G(푸(13),150,330,96,'#8FB4FA',13,false)+G(른(12),266,330,96,'#8FB4FA',12,false)],

['원 배지 푸른','원 안에 이름. 도장·배지의 격식',
 SQ+'fill="#EAF1FF"/><circle cx="256" cy="256" r="176" fill="#16307A"/>'
 +G(푸(12),108,186,140,'#EAF1FF',12,false)+G(른(11),268,186,140,'#EAF1FF',11,false)],

['푸 + 저울','글자와 심볼을 함께 — 이름과 하는 일을 한 번에',
 SQ+'fill="url(#b2)"/>'
 +G(푸(15),136,96,240,'#fff',15,true)
 +'<g fill="#8FB4FA"><rect x="140" y="368" width="232" height="14" rx="7"/>'
 +'<rect x="249" y="352" width="14" height="34" rx="7"/>'
 +'<path d="M146 392h72c0 26-16 42-36 42s-36-16-36-42z"/>'
 +'<path d="M294 392h72c0 26-16 42-36 42s-36-16-36-42z"/></g>'],

['음각 원 푸','원을 파내고 그 안에 글자 — 조용하고 깊다',
 SQ+'fill="url(#b1)"/><circle cx="256" cy="256" r="168" fill="#0B1B45" opacity=".55"/>'
 +'<circle cx="256" cy="256" r="168" fill="none" stroke="#BFD5FF" stroke-opacity=".5" stroke-width="6"/>'
 +G(푸(14),146,146,220,'#fff',14,true)],

['문이 된 ㅍ','ㅍ 의 두 기둥이 문이 된다 — 「들어가는 곳」',
 SQ+'fill="url(#b3)"/>'
 +'<g fill="#fff"><rect x="72" y="118" width="368" height="34" rx="17"/>'
 +'<rect x="150" y="168" width="34" height="230" rx="14"/>'
 +'<rect x="328" y="168" width="34" height="230" rx="14"/>'
 +'<rect x="96" y="386" width="320" height="30" rx="15"/></g>'],

['초성 넷','푸른노무 = ㅍ ㄹ ㄴ ㅁ. 무늬처럼 남는다',
 SQ+'fill="#16307A"/>'
 +'<rect x="60" y="60" width="188" height="188" rx="44" fill="#2563EB"/>'
 +'<rect x="264" y="60" width="188" height="188" rx="44" fill="#EAF1FF"/>'
 +'<rect x="60" y="264" width="188" height="188" rx="44" fill="#EAF1FF"/>'
 +'<rect x="264" y="264" width="188" height="188" rx="44" fill="#2563EB"/>'
 +G(ㅍ(16),94,94,120,'#fff',16,false)+G(ㄹ(16),298,94,120,'#1D4ED8',16,false)
 +G(ㄴ(16),94,298,120,'#1D4ED8',16,false)+G(ㅁ(16),298,298,120,'#fff',16,false)],

['푸 + 잎','이름 옆에 새싹 하나 — 유일하게 초록이 든다',
 SQ+'fill="#08214A"/>'+G(푸(15),116,126,240,'#fff',15,true)
 +'<path d="M330 372c68 6 108-30 116-92-66-8-116 28-116 92z" fill="url(#lf)"/>'],

['기울인 푸른','오른쪽으로 기운다 — 나아가는 느낌',
 SQ+'fill="url(#b1)"/><g transform="rotate(-9 256 256)">'
 +G(푸(11),52,176,180,'#fff',11,false)+G(른(10),280,176,180,'#DCE9FF',10,false)+'</g>'],

['붓 푸','획을 곧게 긋지 않는다 — 손으로 쓴 결',
 SQ+'fill="#0F2A63"/>'
 +G('M2 6 Q50 1 98 5 M26 9 Q24 26 25 41 M75 8 Q77 26 76 41 M2 45 Q50 40 98 44'
   +' M2 68 Q50 62 98 66 M50 69 Q53 84 49 97',96,76,320,'#fff',13,true)],

['말풍선 푸','상담하는 곳. 사람이 말을 거는 자리',
 SQ+'fill="url(#b3)"/>'
 +'<path d="M96 108h320c22 0 40 18 40 40v168c0 22-18 40-40 40H268l-72 62v-62h-100c-22 0-40-18-40-40V148c0-22 18-40 40-40z" fill="#fff"/>'
 +G(푸(15),176,150,160,'#1D4ED8',15,true)]
];
var d='<svg width="0" height="0" style="position:absolute"><defs>';
for(var i=0;i<D.length;i++) d+='<symbol id="v'+(i+1)+'" viewBox="0 0 512 512">'+D[i][2]+'</symbol>';
document.getElementById('defs2').innerHTML=d+'</defs></svg>';
var h='';
for(var i=0;i<D.length;i++){var n=i+1;
 h+='<div class="cell"><div class="head"><div class="num">'+n+'</div><div class="nm">'+D[i][0]+'</div></div>'+
    '<svg class="big"><use href="#v'+n+'"/></svg><div class="cap">'+D[i][1]+'</div>'+
    '<div class="mini"><svg><use href="#v'+n+'"/></svg><span>실제 크기</span></div></div>';}
document.getElementById('g').innerHTML=h;
</script>
