<!doctype html><meta charset="utf-8">
<!-- 푸른 포털 아이콘 후보 — 글자(푸) 없는 10 (대표 지시 2026-08-26 「다른 디자인, 푸 안 해도 된다」)
     ★ 글자를 빼면 «뜻» 이 곧 그림이 된다 — 저울·기둥·두 사람·방패처럼 무슨 일을
       하는 곳인지 아이콘만으로 읽히는 쪽이 이 묶음의 값어치다.
     ⚠ 글자를 빼는 대신 잃는 것도 있다: 「푸른」이라는 이름과의 연결이 끊긴다.
       그래서 색(파랑)만은 지켰다 — 이름을 붙드는 마지막 끈이다.
     ⚠ 홈 화면 아이콘은 «작을 때 읽히는지» 가 전부라 실제 크기(44px)를 나란히 둔다.
     ⚠ 안드로이드가 제 나름의 탈(mask)을 씌우므로 그림은 가운데 원(지름 80%) 안에 둔다. -->
<style>
 body{margin:0;background:#141821;color:#e7ecf5;
   font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
 .wrap{padding:26px 22px 30px}
 h1{font-size:21px;margin:0 0 4px;letter-spacing:-.4px}
 .sub{font-size:12.5px;color:#93a1bb;margin:0 0 22px;line-height:1.6}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
 .cell{background:#1b2130;border:1px solid #29324a;border-radius:16px;padding:16px 14px 13px;
   display:flex;flex-direction:column;align-items:center}
 .head{width:100%;display:flex;align-items:center;gap:7px;margin-bottom:11px}
 .num{width:21px;height:21px;border-radius:7px;background:#2f3a54;color:#c8d5ee;
   font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
 .nm{font-size:13px;font-weight:800;letter-spacing:-.3px}
 .big{width:132px;height:132px;display:block}
 .cap{font-size:11px;color:#8fa0bd;line-height:1.55;margin-top:10px;text-align:center;min-height:34px}
 .mini{margin-top:9px;display:flex;align-items:center;gap:9px;
   background:#11151d;border-radius:9px;padding:6px 10px}
 .mini svg{width:44px;height:44px;display:block}
 .mini span{font-size:10px;color:#6d7c96}
</style>
<div class="wrap">
<h1>푸른 포털 아이콘 — 글자 없는 디자인 10</h1>
<p class="sub">「푸」를 쓰지 않고 <b>뜻으로</b> 만든 것들입니다. 아래 작은 것이 실제 홈 화면 크기(44px)예요.</p>
<div class="grid" id="g"></div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">

<linearGradient id="bg3" x1="0.1" y1="0" x2="0.9" y2="1">

<linearGradient id="wv" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#93C5FD"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>

</defs></svg>

<script>
var L=[
 ['저울','노무의 저울 하나. 무슨 일을 하는 곳인지 그림만으로 압니다'],
 ['기둥','법의 무게 — 신전의 기둥. 가장 묵직한 후보'],
 ['두 사람','노(勞)와 사(使)가 마주 본다. 우리 일의 본질'],
 ['방패','근로자를 지킨다. 뜻이 곧게 읽힙니다'],
 ['문','포털 = 열린 문. 글자 없이 「들어가는 곳」'],
 ['P','Pureun 의 P. 흰 바탕에 파랑 하나'],
 ['잎','푸른 = 자라는 것. 가장 부드러운 후보'],
 ['북극성','길잡이 — 자문·컨설팅의 얼굴'],
 ['물결','푸른 결 셋. 뜻보다 «색»으로 기억되는 쪽'],
 ['맞물림','두 고리가 맞물린다 — 계약과 관계']
];
var g=document.getElementById('g'),h='';
for(var i=0;i<L.length;i++){
  var n=i+1;
  h+='<div class="cell"><div class="head"><div class="num">'+n+'</div>'+
     '<div class="nm">'+L[i][0]+'</div></div>'+
     '<svg class="big"><use href="#t'+n+'"/></svg>'+
     '<div class="cap">'+L[i][1]+'</div>'+
     '<div class="mini"><svg><use href="#t'+n+'"/></svg><span>실제 크기</span></div></div>';
}
g.innerHTML=h;
</script>
