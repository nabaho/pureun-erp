<!-- 배너 위 띠 — 644×200 을 2배(1288×400)로 찍는다.
     ⚠ 글자를 넣지 않는다. 바로 아래 띠가 이미 「WEEKLY NEWS LETTER」와 회차를 말한다.
       같은 말을 두 번 하면 지저분해지고, 그림이 막힌 사람에게는 아래 띠만 남는다.
     ⚠ 딱 끊기는 가로선을 만들지 않는다 — 첫 판에서 위쪽 밝은 층이 갑자기 끝나
       「무언가 잘못 얹혔다」로 보였다. 밝음도 결도 모두 «서서히» 사라지게 둔다. -->
<svg width="1288" height="400" viewBox="0 0 1288 400" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
   <stop offset="0"    stop-color="#8a7360"/>
   <stop offset="0.45" stop-color="#6f5a48"/>
   <stop offset="1"    stop-color="#40332a"/>
  </linearGradient>
  <!-- 획은 «아래에서 올라와» 위로 사라진다 -->
  <linearGradient id="rise" x1="0" y1="1" x2="0" y2="0">
   <stop offset="0"    stop-color="#f5f1ec" stop-opacity="0.20"/>
   <stop offset="0.55" stop-color="#f5f1ec" stop-opacity="0.09"/>
   <stop offset="1"    stop-color="#f5f1ec" stop-opacity="0"/>
  </linearGradient>
  <!-- 오른쪽으로 갈수록 옅어진다 — 왼쪽에 무게를 둔다 -->
  <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
   <stop offset="0"    stop-color="#ffffff" stop-opacity="1"/>
   <stop offset="0.62" stop-color="#ffffff" stop-opacity="0.55"/>
   <stop offset="1"    stop-color="#ffffff" stop-opacity="0.12"/>
  </linearGradient>
  <mask id="softside"><rect width="1288" height="400" fill="url(#side)"/></mask>
 </defs>

 <rect width="1288" height="400" fill="url(#bg)"/>
