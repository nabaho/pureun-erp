<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>목업 — 푸른 메일을 다음메일함과 같은 모양으로</title>
<!--
  ═══════════════════════════════════════════════════════════════════════
  대표 지시 2026-08-24: "다음메일함과 완벽하게 똑같이 만들어달라"
  ═══════════════════════════════════════════════════════════════════════
  캡처2(mail.daum.net 보낸메일함)를 자리·글자크기·색까지 그대로 옮긴 것이다.
  여기서 승인된 모양을 pu-cards.html 의 메일 화면(#pcMail·#pcSide)으로 옮긴다.

  ⚠ 클래스 이름은 모두 dm- 으로 시작한다 — 명함첩의 기존 이름(.pcitem 등)과
    절대 섞이지 않게. 섞이면 메일을 고칠 때 명함 목록이 함께 무너진다.
-->
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'맑은 고딕','Malgun Gothic',AppleSDGothicNeo-Regular,'돋움',dotum,sans-serif;
  background:#fff;color:#1a1a1a;-webkit-font-smoothing:antialiased}

/* ══════ 색·크기 한자리 ══════
   다음메일의 값을 눈으로 재어 옮긴 것이다. 한 곳에서만 고칠 수 있게 변수로 둔다. */
:root{
  --dm-blue:#2563d1;        /* 메일쓰기 단추 */
  --dm-blue-dk:#1d51ae;
  --dm-ink:#1a1a1a;         /* 본문 글자 */
  --dm-sub:#8c8c8c;         /* 흐린 글자(주소·시각) */
  --dm-line:#e8e8e8;        /* 줄 */
  --dm-line-dk:#d8d8d8;     /* 테두리 */
  --dm-hover:#f7f8fa;
  --dm-sel:#eef3fb;         /* 고른 폴더 */
  --dm-side:250px;
}

/* ══════ 맨 위 로고줄 ══════ */
.dm-top{display:flex;align-items:center;gap:9px;padding:14px 0 12px 22px}
.dm-logo{width:34px;height:34px;border-radius:9px;background:var(--dm-blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;
  font-family:Arial,sans-serif;letter-spacing:-1px}
.dm-logo-t{font-size:23px;font-weight:700;color:#111;letter-spacing:-1px}

/* ══════ 판 나누기 ══════ */
.dm-wrap{display:flex;align-items:flex-start}
.dm-side{width:var(--dm-side);flex:0 0 var(--dm-side);padding:0 12px 0 22px}
.dm-main{flex:1;min-width:0;padding:0 24px 40px 18px}

/* ── 내 정보 ── */
.dm-me{display:flex;align-items:center;gap:11px;padding:8px 4px 14px}
.dm-face{position:relative;width:48px;height:48px;flex:none}
.dm-face i{display:block;width:48px;height:48px;border-radius:50%;background:#c9ccd2;
  background-image:radial-gradient(circle at 50% 34%,#eceef1 0 34%,transparent 35%),
                  radial-gradient(ellipse at 50% 108%,#eceef1 0 46%,transparent 47%)}
.dm-face b{position:absolute;right:-1px;bottom:-1px;width:17px;height:17px;border-radius:50%;
  background:var(--dm-blue);color:#fff;font-size:10.5px;font-weight:800;font-family:Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.dm-me-n{min-width:0}
.dm-me-n strong{display:block;font-size:14.5px;font-weight:700;color:#111;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-me-n span{display:block;font-size:12px;color:var(--dm-sub);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── 안읽음 · 중요 · 첨부 ── */
.dm-cnt{display:flex;text-align:center;padding:2px 0 14px}
.dm-cnt a{flex:1;text-decoration:none;color:var(--dm-ink);cursor:pointer;padding:4px 0;border-radius:6px}
.dm-cnt a:hover{background:var(--dm-hover)}
.dm-cnt em{display:block;font-style:normal;font-size:19px;font-weight:700;line-height:1.15;color:#111}
.dm-cnt i{display:block;font-style:normal;font-size:17px;line-height:1.15;color:#b6b9c0}
.dm-cnt span{display:block;font-size:11.5px;color:#6e6e6e;margin-top:3px}

/* ── 메일쓰기 · 내게쓰기 ── */
.dm-write{display:flex;gap:6px;padding:0 0 16px}
.dm-write button{font-family:inherit;font-size:13.5px;font-weight:700;height:38px;border-radius:4px;
  cursor:pointer;border:1px solid transparent}
.dm-write .a{flex:1.35;background:var(--dm-blue);color:#fff;border-color:var(--dm-blue)}
.dm-write .a:hover{background:var(--dm-blue-dk)}
.dm-write .b{flex:1;background:#f2f3f5;color:#333;border-color:#e4e5e9;font-weight:400}
.dm-write .b:hover{background:#e9eaee}

/* ── 폴더 목록 ── */
.dm-folders{max-height:calc(100vh - 300px);overflow-y:auto;overflow-x:hidden;padding-right:4px}
.dm-folders::-webkit-scrollbar{width:6px}
.dm-folders::-webkit-scrollbar-thumb{background:#d5d7dc;border-radius:99px}
.dm-f{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px;border-radius:5px;
  font-size:13.5px;color:#2b2b2b;cursor:pointer;text-decoration:none}
.dm-f:hover{background:var(--dm-hover)}
.dm-f.on{background:var(--dm-sel);color:#123a86;font-weight:700}
.dm-f .ic{width:17px;flex:none;text-align:center;font-size:14px;opacity:.85}
.dm-f .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-f .n{flex:none;font-size:12px;color:#8c8c8c;font-weight:400}
.dm-f.on .n{color:#4b6ea8}
.dm-f .pill{flex:none;font-size:10.5px;color:#7a7a7a;background:#f0f1f4;border:1px solid #e4e5e9;
  border-radius:3px;padding:1px 5px;font-weight:400}
/* 내 메일함 머리줄 */
.dm-fsec{display:flex;align-items:center;gap:6px;height:36px;padding:0 8px;margin-top:8px;
  font-size:12.5px;color:#6e6e6e;cursor:pointer}
.dm-fsec .nm{flex:1}
.dm-fsec .tool{font-size:13px;color:#a8abb2;padding:2px 3px;border-radius:4px}
.dm-fsec .tool:hover{background:#eee;color:#555}
.dm-f.sub{padding-left:16px;font-size:13px}

/* ══════ 오른쪽 — 갈래 단추줄 ══════ */
.dm-tabs{display:flex;align-items:center;gap:6px;padding:6px 0 14px}
.dm-tabs button{font-family:inherit;font-size:13px;color:#333;background:#fff;
  border:1px solid var(--dm-line-dk);border-radius:4px;height:32px;padding:0 14px;cursor:pointer}
.dm-tabs button:hover{background:var(--dm-hover)}
.dm-tabs button.on{border-color:#9db6e3;background:#f2f6fd;color:#1a4fa0;font-weight:700}
.dm-gear{margin-left:auto;width:32px;height:32px;border-radius:50%;border:none;background:#f4f5f7;
  color:#6e6e6e;font-size:15px;cursor:pointer}
.dm-gear:hover{background:#e9eaee}

/* ══════ 도구줄 ══════ */
.dm-tools{display:flex;align-items:center;gap:2px;height:38px}
.dm-tools .chk{margin:0 10px 0 4px}
.dm-tools button{font-family:inherit;font-size:13px;color:#333;background:none;border:none;
  padding:6px 10px;border-radius:4px;cursor:pointer;white-space:nowrap}
.dm-tools button:hover{background:var(--dm-hover)}
.dm-tools .sp{flex:1}
.dm-search{display:flex;align-items:center;gap:6px;height:32px;width:270px;
  border:1px solid var(--dm-line-dk);border-radius:4px;padding:0 10px;background:#fff}
.dm-search i{font-style:normal;color:#a8abb2;font-size:13px}
.dm-search input{flex:1;min-width:0;border:none;outline:none;font-family:inherit;font-size:13px;
  color:#1a1a1a;background:none}
.dm-search input::placeholder{color:#a8abb2}
.dm-bar{width:1px;height:14px;background:#dcdde1;margin:0 10px}
.dm-detail{font-size:13px;color:#333;background:none;border:none;cursor:pointer;font-family:inherit;
  padding:6px 2px}
/* 안내 한 줄 — 목록 오른쪽 위 */
.dm-hint{text-align:right;font-size:11.5px;color:#a8abb2;padding:2px 2px 6px}

/* ══════ 목록 ══════ */
.dm-list{border-top:1px solid #d5d7dc}
.dm-row{display:flex;align-items:center;height:41px;border-bottom:1px solid #f1f2f4;
  font-size:13px;color:#1a1a1a;cursor:pointer}
.dm-row:hover{background:var(--dm-hover)}
.dm-row .chk{flex:none;width:30px;margin:0 0 0 4px}
.dm-row .st{flex:none;width:28px;text-align:center;color:#c9ccd2;font-size:14px}
.dm-row .st:hover{color:#f5a623}
.dm-row .st.on{color:#f5a623}
.dm-row .who{flex:none;width:150px;padding-right:12px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;color:#1a1a1a}
.dm-row .clip{flex:none;width:20px;text-align:center;color:#9a9da4;font-size:12px}
.dm-row .sub{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding-right:16px}
.dm-row .at{flex:none;width:56px;text-align:right;color:#8c8c8c;font-size:12.5px;padding-right:4px}
.dm-row.unread .who,.dm-row.unread .sub{font-weight:700}

/* 목업 표시 — 실제 화면에는 없다 */
.dm-tag{position:fixed;right:14px;bottom:12px;background:#111;color:#fff;font-size:11.5px;
  border-radius:99px;padding:6px 13px;opacity:.82}
</style>
</head>
<body>

<div class="dm-top">
  <span class="dm-logo">D</span><span class="dm-logo-t">메일</span>
</div>

<div class="dm-wrap">
  <!-- ══════════ 왼쪽 ══════════ -->
  <aside class="dm-side">
    <div class="dm-me">
      <span class="dm-face"><i></i><b>D</b></span>
      <span class="dm-me-n">
        <strong>푸른노무법인</strong>
        <span>370-6@daum.net</span>
      </span>
    </div>

    <div class="dm-cnt">
      <a><em>4</em><span>안읽음</span></a>
      <a><i>☆</i><span>중요</span></a>
      <a><i>📎</i><span>첨부</span></a>
    </div>

    <div class="dm-write">
      <button class="a">메일쓰기</button>
      <button class="b">내게쓰기</button>
    </div>

    <div class="dm-folders">
      <a class="dm-f"><span class="ic">✉</span><span class="nm">전체메일</span></a>
      <a class="dm-f"><span class="ic">📥</span><span class="nm">받은메일함</span></a>
      <a class="dm-f"><span class="ic">↗</span><span class="nm">내게쓴메일함</span></a>
      <a class="dm-f on"><span class="ic">✈</span><span class="nm">보낸메일함</span><span class="pill">수신확인</span></a>
      <a class="dm-f"><span class="ic">🗂</span><span class="nm">임시보관함</span></a>
      <a class="dm-f"><span class="ic">🕐</span><span class="nm">예약메일함</span></a>
      <a class="dm-f"><span class="ic">📦</span><span class="nm">보관메일함</span></a>

      <div class="dm-fsec">
        <span class="nm">내 메일함 <span style="color:#b6b9c0">⌃</span></span>
        <span class="tool">⚙</span><span class="tool">＋</span>
      </div>
      <a class="dm-f sub"><span class="nm">1.자문사답변</span><span class="n">2</span></a>
      <a class="dm-f sub"><span class="nm">2.급여+사무실</span><span class="n">1</span></a>
      <a class="dm-f sub"><span class="nm">3.컨설팅(정부지원)</span></a>
      <a class="dm-f sub"><span class="nm">4.체불 및 체당금</span></a>
      <a class="dm-f sub"><span class="nm">5.산재 및 산업안전</span></a>
      <a class="dm-f sub"><span class="nm">6.공공기관</span><span class="n">1</span></a>
      <a class="dm-f sub"><span class="nm">7.노무사회 사업</span></a>
      <a class="dm-f sub"><span class="nm">8.사내(공동)자료</span></a>
      <a class="dm-f sub"><span class="nm">9. 자율점검, 진단</span></a>
    </div>
  </aside>

  <!-- ══════════ 오른쪽 ══════════ -->
  <section class="dm-main">
    <div class="dm-tabs">
      <button class="on">받은메일함</button>
      <button>청구서</button>
      <button>쇼핑</button>
      <button>소셜</button>
      <button>프로모션</button>
      <button class="dm-gear">⚙</button>
    </div>

    <div class="dm-tools">
      <input type="checkbox" class="chk">
      <button>삭제</button>
      <button>전달</button>
      <button>다시보내기</button>
      <button>이동 ˅</button>
      <button>새로고침 ↻</button>
      <span class="sp"></span>
      <span class="dm-search"><i>🔍</i><input placeholder="메일 검색"></span>
      <span class="dm-bar"></span>
      <button class="dm-detail">상세</button>
    </div>

    <div class="dm-hint">＊ 메일 목록, 방향키로 이동, 스페이스로 선택</div>

    <div class="dm-list" id="dmList"></div>
  </section>
</div>

<div class="dm-tag">목업 · 다음메일함과 견주기용</div>

<script>
/* 캡처2에 있던 그 줄들을 그대로 넣는다 — 나란히 놓고 견주려면 같은 내용이어야 한다 */
const ROWS = [
  ['babylawyer@...',      0, '[푸른노무법인] 요청하신 자료를 보내드립니다', '15:15'],
  ['세무법인 한세',        1, '[푸른노무법인] (주)오에프에스 원하용 중도퇴사로 인하여 소득세 확인을 부탁 드립니다.', '14:49'],
  ['세화회계법인',        1, '[푸른노무법인] 대구제이케이병원 2026년 7월 급여대장 송부의 건', '14:03'],
  ['김현아',              0, 'RE: [한국고용노동교육원] ★QR코드 재송부_2026년 공무원노동교육 강사지원과정 출강의뢰(충북소방본부)', '13:58'],
  ['신화제지_세무사...',  1, '[푸른노무법인] 신화제지_퇴사자 우샨 퇴직금 산정 내역서 송부의 건 (퇴직소득세 정산)', '13:18'],
  ['윤병수회계사무소',    1, '[푸른노무법인] 정일제지_퇴사자 마헤시 퇴직금 산정 내역서 송부의 건 (퇴직소득세 정산)', '13:12'],
  ['윤병수회계사무소',    1, '[푸른노무법인] 정일제지_퇴사자 마헤시 퇴직금 산정 내역서 송부의 건 (퇴직소득세 정산)', '13:00'],
  ['유문경',              1, '[푸른노무법인] 서독 옵티크 근로계약서 양식 송부드립니다.', '11:43'],
  ['support@luna...',     0, '[푸른노무법인] 루나랩 모션 데스크 상품 견적 요청드립니다. (주문)', '10:47'],
  ['정곤영',              1, '[푸른노무법인] 씨지아이_공유찬님 자료 요청의 건', '10:33'],
  ['심아람',              0, '[푸른노무법인] 근로시간 단축 관련 자문에 대한 답변 송부의 건', '10:27'],
  ['열린노무법인장...',   1, 'RE: [열린노무법인] 비교견적서 작성 요청의 건', '10:06'],
  ['epia-5210@h...',      0, 'RE(7): [푸른노무법인] 인사노무 컨설팅 기초자료 요청의 건 (재송부)', '09:36'],
  ['푸른노무법인',        0, 'RE(7): [푸른노무법인] 인사노무 컨설팅 기초자료 요청의 건 (재송부)', '09:31'],
  ['푸른노무법인',        0, 'RE(7): [푸른노무법인] 인사노무 컨설팅 기초자료 요청의 건 (재송부)', '09:31'],
  ['sj.geum@nori...',     1, 'RE: [노리시스템] 퇴직위로금 지급 규정 및 합의서 샘플 문의드립니다.', '09:29'],
  ['세무법인 한세',       1, '[푸른노무법인] (주)오에프에스 원하용 중도퇴사로 인하여 소득세 확인을 부탁 드립니다.', '09:28'],
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('dmList').innerHTML = ROWS.map(r => `
  <div class="dm-row">
    <input type="checkbox" class="chk">
    <span class="st">☆</span>
    <span class="who">${esc(r[0])}</span>
    <span class="clip">${r[1] ? '📎' : ''}</span>
    <span class="sub">${esc(r[2])}</span>
    <span class="at">${esc(r[3])}</span>
  </div>`).join('');
</script>
</body>
</html>
