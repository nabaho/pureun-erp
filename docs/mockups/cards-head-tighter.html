<!doctype html>
<meta charset="utf-8">
<title>사업자등록증 머리줄 — 데이터 줄과 «같은 높이»로</title>
<!--
  대표 지시 2026-08-29
    ① 「사업분류 박스 행 위아래 넓다 줄여달라」
    ② 「데이터 넣은 크기하고 같게 해라」  ← 이 목업이 맞추는 것
  pu-cards.html 의 진짜 CSS·마크업을 그대로 옮겨 왔다. 바뀌는 값은 딱 둘이다:
    · #pcHead 위아래 여백  16px/6px → 6px/6px
    · 보기도구 단추·고르개 위아래 살  8px → 6px  (그래야 단추가 칩보다 안 커진다)
  ⚠ 글자 크기·색·좌우 여백(22px)·표 칸은 하나도 안 건드린다.
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  background:#eef1f7;color:#1b2536;padding:24px 20px 60px}
h1{font-size:17px;margin-bottom:5px}
.lead{font-size:13.5px;color:#5a6885;margin-bottom:20px;line-height:1.7}
.case{background:#fff;border:1px solid #dde3ee;border-radius:14px;overflow:hidden;margin-bottom:18px}
.cap{display:flex;align-items:baseline;gap:10px;padding:11px 16px;background:#f7f9fc;
  border-bottom:1px solid #e6ebf4;font-size:13.5px;font-weight:700}
.cap .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.now .tag{background:#f1f4f9;color:#7c89a6}
.fix .tag{background:#eaf4ec;color:#1b7a4b}
.cap .why{font-weight:400;color:#7c89a6;font-size:12.5px}
.cap .px{margin-left:auto;font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}
.ok{color:#1b7a4b}.no{color:#c0392b}

/* ══ 여기서부터 pu-cards.html 그대로 ══ */
.pane{--headPad:16px 22px 6px;--toolPad:8px 14px;--selPad:8px 10px;--toolH:auto}
/* ⚠ 살(padding)로 맞추면 단추와 고르개(select)의 글자 속 사정이 달라 1px 이 어긋난다
   — 실제로 어긋났다. 도구 키를 «한 값»으로 못 박아야 줄 높이가 딱 떨어진다. */
#pcTools .pctool,#pcTools select{height:var(--toolH)}
#pcHead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:var(--headPad)}
#pcHead h2{font-size:19px;color:#1b2536;white-space:nowrap;flex:none}
#pcHead em{font-style:normal;font-size:13px;color:#8b98b3;font-weight:400}
#pcErpTabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
#pcTools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pctool{background:#fff;border:1px solid #e8ecf3;border-radius:11px;font-size:13px;cursor:pointer;
  color:#33415e;display:inline-flex;align-items:center;gap:5px;padding:var(--toolPad)}
select{border:1px solid #e8ecf3;border-radius:11px;font-size:13px;color:#33415e;background:#fff;
  cursor:pointer;font-family:inherit;padding:var(--selPad)}
#pcTableWrap{padding:0 22px 26px}
#pcTable{width:100%;border-collapse:collapse;background:#fff;border:1px solid #eef2f7;
  border-radius:12px;table-layout:fixed}
#pcTable thead th{background:#f8fafc;font-size:12px;color:#7c89a6;text-align:left;
  border-bottom:1px solid #eef2f7;font-weight:600;padding:12px 14px}
#pcTable td{padding:12px 14px;border-bottom:1px solid #f1f4f9;font-size:13.5px;color:#33415e;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ══ 여기까지 ══ */

/* 높이를 «눈으로» 견주는 자 — 목업에만 있는 것이다 */
.rule{position:relative}
.rule::before{content:attr(data-h);position:absolute;left:-2px;top:0;bottom:0;width:3px;
  background:#c0392b;color:#c0392b;font-size:10.5px;font-weight:800;
  text-indent:8px;line-height:1.1;white-space:nowrap}
.hl-head{outline:2px dashed #c0392b;outline-offset:-2px}
.hl-row >td{background:#fffaf7}
</style>

<h1>사업자등록증 머리줄 — 데이터 줄과 «같은 높이»로</h1>
<p class="lead">
  빨간 자로 표시한 두 곳이 <b>머리줄</b>과 <b>데이터 한 줄</b>입니다.
  지시하신 대로 <b>둘의 높이를 같게</b> 맞췄습니다 —
  글자 크기·색·좌우 줄맞춤은 하나도 안 건드렸습니다.
</p>
<p id="warn" style="display:none;font-size:13px;color:#c0392b;background:#fff0ee;border:1px solid #f3c8c2;
   border-radius:10px;padding:9px 13px;margin-bottom:18px;line-height:1.6">
  ⚠ 창이 좁아 오른쪽 보기도구(정보부족·퇴사자…)가 <b>다음 줄로 내려갔습니다.</b>
  실제 화면처럼 한 줄에 들어가야 잰 값이 맞습니다 — 창을 넓혀 주세요.
</p>

<div class="case">
  <div class="cap now"><span class="tag">지금</span> 손대기 전
    <span class="why">머리줄 여백 위 16 · 아래 6 · 단추 살 8</span>
    <span class="px" id="px-now">—</span></div>
  <div class="pane" id="p-now"></div>
</div>

<div class="case">
  <div class="cap fix"><span class="tag">고친 뒤</span> 데이터 줄과 같은 높이
    <span class="why">머리줄 여백 위아래 6 · 보기도구 키 32 — 이 둘만 바뀝니다</span>
    <span class="px" id="px-fix">—</span></div>
  <div class="pane" id="p-fix"
       style="--headPad:6px 22px;--toolPad:0 14px;--selPad:0 10px;--toolH:32px"></div>
</div>

<script>
/* 실제 화면의 탭 칩은 인라인 스타일로 그려진다(renderMyTabsHtml) — 그대로 옮긴다 */
function chip(name, n){
  return `<span style="display:inline-flex;align-items:center;border:1.5px solid #cfe0fb;
    background:#f4f9ff;color:#1d4fc4;border-radius:18px;font-weight:700;font-size:12.5px;overflow:hidden">
    <span style="padding:6px 4px 6px 13px">🔍 ${name}
      <b style="margin-left:5px;font-weight:800;color:#5a6885">${n}</b></span>
    <span style="padding:6px 9px 6px 4px;opacity:.75;font-size:13px">⋮</span></span>`;
}
const PANE = `
  <div id="pcHead" class="hl-head rule" data-h="머리줄">
    <h2>사업자등록증 <em>351개</em></h2>
    <div id="pcErpTabs">
      <span style="display:inline-flex;align-items:center;border:1.5px solid #1e2a47;background:#1e2a47;
        color:#fff;border-radius:18px;font-weight:700;font-size:12.5px;padding:6px 13px;margin-right:2px">
        📋 전체 <b style="margin-left:5px;font-weight:800">351</b></span>
      ${chip('자문',60)}${chip('급여',54)}${chip('노조',2)}${chip('기금',1)}${chip('사무대행',0)}
      <button style="border:1.5px dashed #c3d0e6;background:#fff;color:#5a6885;border-radius:18px;
        padding:6px 13px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit">＋ 탭 추가</button>
    </div>
    <div id="pcTools">
      <button class="pctool">정보부족</button>
      <button class="pctool">🚪 퇴사자</button>
      <button class="pctool">🏚 계약종료</button>
      <button class="pctool">개인</button>
      <button class="pctool">열 ▾</button>
      <select><option>100개</option></select>
      <select><option>등록일</option></select>
    </div>
  </div>
  <div id="pcTableWrap">
    <table id="pcTable">
      <colgroup><col style="width:34px"><col style="width:44px"><col><col style="width:110px">
        <col style="width:140px"><col style="width:150px"><col style="width:120px">
        <col style="width:120px"><col style="width:110px"><col style="width:84px"><col style="width:64px"></colgroup>
      <thead><tr><th></th><th>#</th><th>상호</th><th>대표자</th><th>사업자번호</th><th>서류이름</th>
        <th>업태</th><th>종목</th><th>등록일</th><th>담당</th><th>관리</th></tr></thead>
      <tbody>
        <tr class="hl-row rule" data-h="데이터 줄"><td></td><td>1</td><td>(주)우리와</td><td>김○○</td>
            <td>783-85-02416</td><td>사업자등록증</td><td>제조업</td><td>기계</td>
            <td>2026-08-01</td><td>박은비</td><td>⋯</td></tr>
        <tr><td></td><td>2</td><td>(주)이한산업</td><td>이○○</td><td>312-81-41316</td><td>사업자등록증</td>
            <td>건설업</td><td>토목</td><td>2026-07-28</td><td>김혜민</td><td>⋯</td></tr>
      </tbody>
    </table>
  </div>`;

['now','fix'].forEach(k => { document.getElementById('p-' + k).innerHTML = PANE; });

function measureAll(){
  ['now','fix'].forEach(k=>{
    const p = document.getElementById('p-' + k);
    const head = Math.round(p.querySelector('#pcHead').getBoundingClientRect().height);
    const row  = Math.round(p.querySelector('#pcTable tbody tr').getBoundingClientRect().height);
    const el = document.getElementById('px-' + k);
    el.className = 'px ' + (head === row ? 'ok' : 'no');
    el.textContent = '머리줄 ' + head + 'px · 데이터 줄 ' + row + 'px'
      + (head === row ? '  ✔ 같다' : '  ✕ ' + (head - row) + 'px 더 높다');
  });
  document.getElementById('warn').style.display =
    document.querySelector('#p-now #pcHead').getBoundingClientRect().height > 70 ? 'block' : 'none';
}
measureAll();
addEventListener('resize', measureAll);
</script>
