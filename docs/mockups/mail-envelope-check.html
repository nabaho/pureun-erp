<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>푸른 메일 — 봉투 표시 확인</title>
<style>
 body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;margin:0;padding:24px;background:#f6f7f9}
 h1{font-size:18px;margin:0 0 14px}
 .box{background:#fff;border:1px solid #e6e8ec;border-radius:8px;overflow:hidden;max-width:860px}
 .hd{font-size:12px;color:#6b6f76;padding:8px 12px;background:#f2f4f7;border-bottom:1px solid #e6e8ec}
 .note{font-size:12.5px;color:#6b6f76;margin:14px 0 6px;line-height:1.8;max-width:860px}
 #out{font-family:Consolas,monospace;font-size:12px;color:#333}
</style></head><body>
<h1>푸른 메일 — 목록 줄의 봉투 (다음메일과 같은 자리)</h1>
<div class="note">
  앱의 <b>진짜 CSS·SVG</b>를 그대로 떠 온다 — 여기 베껴 두면 앱을 고쳤을 때 이 화면이
  옛 모양을 지키게 된다.<br>
  위 두 줄은 <b>안 읽음</b>(닫힌 봉투·진하게), 아래 두 줄은 <b>읽음</b>(열린 봉투).
  <b>봉투를 눌러</b> 뒤집히는지도 여기서 본다.
</div>
<div class="box"><div class="hd">받은메일함</div><div id="rows"></div></div>
<div class="note" id="out">읽는 중…</div>
<script>
fetch('../../pu-cards.html').then(function(r){ return r.text(); }).then(function(src){
  var css = (src.match(/<style[^>]*>[\s\S]*?<\/style>/g) || []).join('\n')
    .replace(/<\/?style[^>]*>/g, '');
  var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

  var i = src.indexOf('function mbEnvSvg'), j = src.indexOf('function mbToggleRead');
  if (i < 0 || j < 0) { document.getElementById('out').textContent = '봉투 코드를 못 찾음'; return; }
  var M = new Function(src.slice(i, j) + '\nreturn { mbEnvSvg: mbEnvSvg };')();

  var rows = [
    { r:0, who:'Shin, Sunmi',  s:'RE: 디와이엠솔루션 취업규칙 개정 검토 건' },
    { r:0, who:'한청협',        s:'자문 요청합니다.' },
    { r:1, who:'이진주 (목동)', s:'RE: [푸른노무법인] 일터혁신 상생 컨설팅 설문지 송부의 건' },
    { r:1, who:'윤재웅',        s:'통상임금 관련 자문 의뢰' }
  ];
  document.getElementById('rows').innerHTML = rows.map(function(v){
    return '<div class="dm-row ' + (v.r ? '' : 'unread') + '">'
      + '<input type="checkbox" class="chk">'
      + '<span class="st">☆</span>'
      + '<span class="env ' + (v.r ? '' : 'on') + '">' + M.mbEnvSvg(v.r) + '</span>'
      + '<span class="who">' + v.who + '</span>'
      + '<span class="clip"></span>'
      + '<span class="sub">' + v.s + '</span>'
      + '<span class="at">08.29</span></div>';
  }).join('');

  /* 눌러서 뒤집히는 것만 흉내 낸다(서버는 안 부른다) */
  Array.prototype.forEach.call(document.querySelectorAll('.env'), function(el){
    el.onclick = function(){
      var on = el.classList.toggle('on');
      el.innerHTML = M.mbEnvSvg(on ? 0 : 1);
      el.parentNode.classList.toggle('unread', on);
    };
  });

  var shut = document.querySelector('.env.on svg').outerHTML;
  var open = document.querySelectorAll('.env:not(.on) svg')[0].outerHTML;
  window.__envResult = {
    두봉투가_다른가: shut !== open,
    안읽음_색: getComputedStyle(document.querySelector('.env.on')).color,
    읽음_색: getComputedStyle(document.querySelector('.env:not(.on)')).color,
    봉투_너비: getComputedStyle(document.querySelector('.env')).width,
    안읽음_줄_굵기: getComputedStyle(document.querySelector('.dm-row.unread .who')).fontWeight
  };
  document.getElementById('out').textContent = JSON.stringify(window.__envResult);
}).catch(function(e){
  document.getElementById('out').textContent = '읽지 못했습니다 — ' + e.message;
});
</script>
</body></html>
