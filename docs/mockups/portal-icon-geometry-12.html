<!-- 푸른 포털 아이콘 후보 — 도형으로 쓴 「푸른」 12 (대표 지시 2026-08-29 「푸른을 도형으로 다시」)
     ★ 규칙 하나: **글자를 그리지 않는다.** 동그라미·네모·세모·막대만 쓴다.
       그런데 「푸」의 뼈대(가로 넷 · 세로 셋)를 그대로 옮기면, 글자가 아닌데도
       보는 사람 눈에 남는다.

     ⚠ 도형은 «다른 것으로 읽히기» 쉽다. 이번에 그려 보고서야 안 것들 —
       · 원 위에 네모, 그 아래 세모 → 「사람 아이콘(계정)」 으로 읽힌다
       · 원 안에 세로 막대 둘      → 「일시정지 단추」 로 읽힌다
       · 높이 다른 네모 셋         → 「막대그래프(통계 앱)」 로 읽힌다
       · 삼각 셋                   → 「산」 (앞 장에 이미 있다)
       다섯을 그 자리에서 바꿨다. 도형은 뜻이 없어서 자유롭지만, 뜻이 없어서
       **아무 뜻이나 붙는다.** 그려 놓고 눈으로 봐야 안다.
     ⚠ 「빠진 칸」은 5×4 로 짜야 «푸» 가 남는다. 4열이면 가운데가 없어 ㅜ 의 기둥을
       세울 자리가 없다. -->
<style>
