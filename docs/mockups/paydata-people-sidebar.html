<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>목업 — 급여데이터함 좌측 사람별 대시보드 v2 (순서변경·공유, 가짜 자료)</title>
<style>
:root{--navy:#2E3A8C;--violet:#7C6CE0;--ok:#2E7D4F;--warn:#B26A00;--bad:#C43D3D;
--ink:#23263B;--sub:#6B6F87;--line:#E3E5EF;--paper:#F5F6FA;--card:#FFF;}
*{box-sizing:border-box;margin:0}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--paper);color:var(--ink);font-size:14px}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 18px;position:sticky;top:0;z-index:20}
header .brand{font-weight:800;font-size:16px}
header .who{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:10px}
header .out{background:#ffffff22;border:1px solid #ffffff66;color:#fff;border-radius:8px;padding:3px 10px;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
h1{font-size:18px;margin-bottom:4px}
.sub{font-size:12px;color:var(--sub);margin-bottom:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{padding:3px 8px;font-size:11.5px;border-radius:7px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}

/* ── 좌측 사람별 대시보드 ── */
.shell{display:flex;align-items:flex-start}
.peoplebar{width:250px;flex:0 0 250px;background:var(--card);border-right:1px solid var(--line);
  height:calc(100vh - 49px);position:sticky;top:49px;overflow-y:auto}
.pbsearch{padding:10px 10px 6px}
.pbsearch input{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12.5px;font-family:inherit}
.pbdivider{padding:12px 12px 4px;font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.02em;
  display:flex;align-items:center;gap:6px}
.pbdivider .n{background:var(--paper);border-radius:99px;padding:1px 7px;font-weight:700}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:13px}
.phead:hover{background:#F5F7FF}
.phead .car{width:14px;color:var(--sub);font-size:10px;transition:transform .12s}
.phead.open .car{transform:rotate(90deg)}
.phead b{flex:1;font-weight:700}
.phead .n{font-size:11px;color:var(--sub);background:var(--paper);border-radius:99px;padding:1px 7px}
.pnode.me .phead b{color:var(--navy)}
.pkids{display:none;padding-bottom:4px}
.pkids.open{display:block}
.pco{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 26px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.pco:hover{background:#F5F7FF}
.pco.drag{opacity:.35}
.pco.over{box-shadow:inset 0 2px 0 var(--navy)}
.pco .handle{cursor:grab;color:var(--sub);font-size:12px;flex:0 0 12px;user-select:none}
.pco .dot{width:6px;height:6px;border-radius:99px;background:var(--line);flex:0 0 6px}
.pco .dot.arr{background:var(--ok)}
.pco span.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pco .cnt{font-size:11px;color:var(--sub)}
.pco .share{opacity:0;font-size:12px;color:var(--navy);padding:2px 4px;border-radius:6px}
.pco:hover .share{opacity:1}
.pco .share:hover{background:#E7EBFB}
.pempty{padding:6px 12px 10px 30px;font-size:12px;color:var(--sub)}
main.content{flex:1;min-width:0;padding:16px;max-width:900px;margin:0 auto}

.shared-item{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12.5px;cursor:pointer}
.shared-item:hover{background:#F5F7FF}
.shared-item .badge{background:#EAF6EE;color:var(--ok);border-radius:99px;padding:1px 7px;font-size:10.5px;font-weight:700}
.shared-item .meta{flex:1;min-width:0}
.shared-item .meta b{display:block;font-size:12.5px}
.shared-item .meta span{display:block;font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.seatbar{border-radius:12px;padding:9px 14px;font-size:13px;display:flex;align-items:center;
  gap:10px;margin-bottom:14px}
.seatbar.view{background:#FBF1DE;border:1px solid #F0D9A8;color:#7C4A03}
.seatbar.deputy{background:#EEF2FF;border:1px solid #C7D2FE;color:#3730A3}
.seatbar.shared{background:#EAF6EE;border:1px solid #B7E4C7;color:#1E5631}
.seatbar button{margin-left:auto}
.modalWrap{display:none;position:fixed;inset:0;background:rgba(15,20,30,.45);z-index:40;
  align-items:center;justify-content:center;padding:16px}
.modalWrap.on{display:flex}
.modalCard{background:#fff;border-radius:14px;max-width:400px;width:100%;max-height:82vh;overflow-y:auto;padding:16px}
.modalCard h2{font-size:15px;margin:0 0 8px}
.modalCard input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;
  font-size:13px;font-family:inherit;margin-bottom:10px}
.note{background:#EEF2FF;border:1px solid #C7D2FE;color:#3730A3;border-radius:10px;
  padding:10px 14px;font-size:12.5px;margin-bottom:14px}
.picklist{max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.pickrow{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line)}
.pickrow:last-child{border-bottom:none}
.pickrow:hover{background:#F5F7FF}
.pickrow.on{background:#E7EBFB;font-weight:700;color:var(--navy)}
.taglist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.tagopt{display:flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;cursor:pointer}
.tagopt input{margin:0}
.tagopt.on{border-color:var(--navy);background:#F5F7FF}
.sharedTo{font-size:12px;color:var(--sub);margin-bottom:10px}
</style>
</head>
<body>
<header>
  <div class="brand">푸 급여데이터함</div>
  <div class="who"><span>fairrun01@fairrunlabor.com</span><button class="out">로그아웃</button></div>
</header>

<div class="note" style="margin:12px 16px 0">
  ★ 승인용 목업 v2 — 실제로 저장하거나 실시간DB에 붙지 않습니다. ①업체 순번을 마우스로
  끌어서 바꿔 보세요(⠿ 손잡이) ②내 업체의 "↗ 공유"를 눌러 공유 흐름을 확인해 보세요.
</div>

<div class="shell">
  <aside class="peoplebar" id="peoplebar"></aside>
  <main class="content" id="mainArea"></main>
</div>

<!-- 열람 사유 모달 (다른 담당자 서랍을 직접 열 때) -->
<div class="modalWrap" id="modalWrap">
  <div class="modalCard">
    <h2 id="modalTitle">열람 사유</h2>
    <div class="sub" id="modalSub"></div>
    <input id="reasonInput" placeholder="예: 급여 문의 확인">
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn pri" onclick="confirmReason()">확인</button>
    </div>
  </div>
</div>

<!-- 공유하기 모달 (사람 고르기 → 공유사항 체크) -->
<div class="modalWrap" id="shareWrap">
  <div class="modalCard">
    <h2 id="shareTitle">공유하기</h2>
    <div id="sharePickStep">
      <div class="sub">누구와 공유할까요?</div>
      <input id="shareQ" placeholder="이름으로 찾기" oninput="renderSharePick()">
      <div class="picklist" id="sharePickList"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn" onclick="closeShare()">취소</button>
        <button class="btn pri" onclick="goShareTags()">다음</button>
      </div>
    </div>
    <div id="shareTagStep" style="display:none">
      <div class="sharedTo" id="shareToLine"></div>
      <div class="sub">무엇을 공유하는 건가요? (여러 개 고를 수 있습니다)</div>
      <div class="taglist" id="tagList"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn" onclick="backShareTags()">뒤로</button>
        <button class="btn pri" onclick="confirmShare()">공유하기</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ══ 가짜 자료 ══ */
var COMPANIES = [
  { id:'co_1', name:'화담원', managerMain:'p-me' },
  { id:'co_2', name:'안전공사', managerMain:'p-me' },
  { id:'co_7', name:'천안연클란트치과의원', managerMain:'p-me' },
  { id:'co_3', name:'(주)이비', managerMain:'p-002' },
  { id:'co_4', name:'디와이산업', managerMain:'p-002' },
  { id:'co_5', name:'참살이', managerMain:'p-002' },
  { id:'co_6', name:'플러스동반성장', managerMain:'p-003' }
];
var ARRIVED = { co_1:true, co_2:false, co_7:true, co_3:true, co_4:false, co_5:true, co_6:false };
var COUNTS  = { co_1:2, co_2:0, co_7:1, co_3:1, co_4:0, co_5:3, co_6:0 };
var OWNERS = [
  { uid:'p-me',  name:'권형하(나)', mine:true },
  { uid:'p-002', name:'민미애' },
  { uid:'p-003', name:'김보람' },
  { uid:'p-004', name:'신욱임' }
];
var TAG_OPTIONS = [
  '확인 부탁드립니다', '서명·날인 필요', '급여 반영 요청', '참고만 하세요', '문제 있어 보입니다'
];
var SHARED_TO_ME = [
  { companyId:'co_5', companyName:'참살이', byName:'민미애', tags:['확인 부탁드립니다','서명·날인 필요'], at:'08-14 09:20' }
];

var myOrder = ['co_1','co_2','co_7'];     // 내 담당 업체 순서 — 끌어서 바꾼다
var openIds = { 'p-me': true };
var viewing = null;
var pendingClick = null;
var dragId = null;
var shareCtx = null;   // { companyId, companyName }
var sharePickedUid = null;

function companiesOf(sid){
  var list = COMPANIES.filter(function(c){ return c.managerMain === sid; });
  if (sid === 'p-me') {
    list.sort(function(a,b){ return myOrder.indexOf(a.id) - myOrder.indexOf(b.id); });
  }
  return list;
}

function renderSidebar(){
  var qEl = document.getElementById('pbq');
  var q = (qEl ? qEl.value : '').trim().toLowerCase();
  var me = OWNERS[0];
  var others = OWNERS.slice(1).filter(function(o){ return !q || o.name.toLowerCase().indexOf(q) >= 0; });

  function coRow(c, isMe){
    var arrived = !!ARRIVED[c.id];
    var dragAttrs = isMe
      ? ' draggable="true" ondragstart="dragStart(event,\'' + c.id + '\')" ondragover="dragOver(event,\'' + c.id + '\')" ondrop="dragDrop(event,\'' + c.id + '\')" ondragend="dragEnd()"'
      : '';
    return '<div class="pco" id="pco-' + c.id + '"' + dragAttrs + '>'
      + (isMe ? '<span class="handle">⠿</span>' : '')
      + '<span class="dot' + (arrived?' arr':'') + '"></span>'
      + '<span class="nm" onclick="openCompany(\'' + (isMe?'p-me':'') + '\',\'\',\'' + c.id + '\',\'' + c.name + '\',' + isMe + ')">' + c.name + '</span>'
      + '<span class="cnt">' + (COUNTS[c.id]||0) + '건</span>'
      + (isMe ? '<span class="share" onclick="event.stopPropagation();openShare(\'' + c.id + '\',\'' + c.name + '\')" title="다른 담당자와 공유">↗ 공유</span>' : '')
      + '</div>';
  }

  function personBlock(o, isMe){
    var open = !!openIds[o.uid];
    var cos = companiesOf(o.uid);
    var h = '<div class="pnode' + (isMe?' me':'') + '">'
      + '<div class="phead' + (open?' open':'') + '" onclick="togglePerson(\'' + o.uid + '\')">'
      + '<span class="car">▶</span><b>' + o.name + '</b><span class="n">' + cos.length + '</span></div>';
    h += '<div class="pkids' + (open?' open':'') + '">';
    if (!cos.length) h += '<div class="pempty">담당 업체가 없습니다.</div>';
    cos.forEach(function(c){ h += coRow(c, isMe); });
    h += '</div></div>';
    return h;
  }

  var html = '<div class="pbsearch"><input id="pbq" placeholder="이름으로 찾기" oninput="renderSidebar()" value="' + (q||'') + '"></div>';
  html += personBlock(me, true);

  html += '<div class="pbdivider">공유받음<span class="n">' + SHARED_TO_ME.length + '</span></div>';
  if (!SHARED_TO_ME.length) {
    html += '<div class="pempty" style="padding-left:12px">아직 받은 공유가 없습니다.</div>';
  } else {
    SHARED_TO_ME.forEach(function(s, i){
      html += '<div class="shared-item" onclick="openShared(' + i + ')">'
        + '<span class="badge">공유</span>'
        + '<div class="meta"><b>' + s.companyName + '</b><span>' + s.byName + ' · ' + s.tags.join(', ') + '</span></div>'
        + '</div>';
    });
  }

  html += '<div class="pbdivider">다른 담당자</div>';
  others.forEach(function(o){ html += personBlock(o, false); });
  document.getElementById('peoplebar').innerHTML = html;
}

function togglePerson(uid){ openIds[uid] = !openIds[uid]; renderSidebar(); }

/* ── 마우스로 순서 바꾸기(내 업체만) ── */
function dragStart(ev, id){ dragId = id; ev.target.classList.add('drag'); }
function dragOver(ev, overId){ ev.preventDefault(); var el = document.getElementById('pco-' + overId); if (el) el.classList.add('over'); }
function dragEnd(){ document.querySelectorAll('.pco').forEach(function(el){ el.classList.remove('drag','over'); }); }
function dragDrop(ev, overId){
  ev.preventDefault();
  if (!dragId || dragId === overId) { dragEnd(); return; }
  var from = myOrder.indexOf(dragId), to = myOrder.indexOf(overId);
  if (from < 0 || to < 0) { dragEnd(); return; }
  myOrder.splice(from, 1);
  myOrder.splice(to, 0, dragId);
  dragId = null;
  dragEnd();
  renderSidebar();
  /* 실제 구현에서는 여기서 S.saveMyCompanyOrder(myOrder) 를 호출해 서버에 저장한다. */
}

/* ── 남의 서랍 직접 열기(사유 필요) ── */
function openCompany(uid, name, coId, coName, isMe){
  if (isMe === 'true' || isMe === true){ viewing = null; renderMain(coName, false, false, null); return; }
  var ownerName = document.querySelector('[onclick*="togglePerson(\'' + uid + '\')"] b');
  pendingClick = { uid: uid, name: ownerName ? ownerName.textContent : uid, coId: coId, coName: coName };
  document.getElementById('modalTitle').textContent = pendingClick.name + ' 자리 — ' + coName;
  document.getElementById('modalSub').textContent = '이 업체의 서랍을 왜 보시나요? (업체 목록을 보는 것 자체는 사유가 필요 없습니다)';
  document.getElementById('reasonInput').value = '';
  document.getElementById('modalWrap').classList.add('on');
  setTimeout(function(){ document.getElementById('reasonInput').focus(); }, 0);
}
function closeModal(){ document.getElementById('modalWrap').classList.remove('on'); pendingClick = null; }
function confirmReason(){
  var v = document.getElementById('reasonInput').value.trim();
  if (!v) { alert('사유를 적어 주세요.'); return; }
  var p = pendingClick; closeModal();
  viewing = { uid: p.uid, name: p.name };
  renderMain(p.coName, true, false, null);
}

/* ── 공유받은 것 열기(사유 없이, 공유 사유가 이미 있다) ── */
function openShared(i){
  var s = SHARED_TO_ME[i];
  viewing = { uid: 'x', name: s.byName };
  renderMain(s.companyName, true, false, s);
}

/* ── 공유하기 ── */
function openShare(coId, coName){
  shareCtx = { companyId: coId, companyName: coName };
  sharePickedUid = null;
  document.getElementById('shareTitle').textContent = coName + ' 공유하기';
  document.getElementById('sharePickStep').style.display = '';
  document.getElementById('shareTagStep').style.display = 'none';
  document.getElementById('shareQ').value = '';
  renderSharePick();
  document.getElementById('shareWrap').classList.add('on');
}
function closeShare(){ document.getElementById('shareWrap').classList.remove('on'); shareCtx = null; }
function renderSharePick(){
  var q = document.getElementById('shareQ').value.trim().toLowerCase();
  var list = OWNERS.filter(function(o){ return !o.mine && (!q || o.name.toLowerCase().indexOf(q) >= 0); });
  document.getElementById('sharePickList').innerHTML = list.length
    ? list.map(function(o){
        return '<div class="pickrow' + (sharePickedUid===o.uid?' on':'') + '" onclick="pickShareTarget(\'' + o.uid + '\',\'' + o.name + '\')">' + o.name + '</div>';
      }).join('')
    : '<div class="pempty">찾는 사람이 없습니다.</div>';
}
function pickShareTarget(uid, name){ sharePickedUid = { uid: uid, name: name }; renderSharePick(); }
var pickedTags = {};
function goShareTags(){
  if (!sharePickedUid) { alert('공유할 사람을 먼저 골라 주세요.'); return; }
  pickedTags = {};
  document.getElementById('shareToLine').textContent = shareCtx.companyName + ' 를(을) ' + sharePickedUid.name + '님에게';
  document.getElementById('tagList').innerHTML = TAG_OPTIONS.map(function(t, i){
    return '<label class="tagopt" id="tagopt-' + i + '"><input type="checkbox" onchange="toggleTag(' + i + ',\'' + t + '\')">' + t + '</label>';
  }).join('');
  document.getElementById('sharePickStep').style.display = 'none';
  document.getElementById('shareTagStep').style.display = '';
}
function toggleTag(i, t){
  if (pickedTags[t]) delete pickedTags[t]; else pickedTags[t] = true;
  document.getElementById('tagopt-' + i).classList.toggle('on', !!pickedTags[t]);
}
function backShareTags(){
  document.getElementById('sharePickStep').style.display = '';
  document.getElementById('shareTagStep').style.display = 'none';
}
function confirmShare(){
  var tags = Object.keys(pickedTags);
  if (!tags.length) { alert('공유사항을 하나 이상 체크해 주세요.'); return; }
  alert('(목업) ' + sharePickedUid.name + '님에게 「' + shareCtx.companyName + '」 공유 — ' + tags.join(', '));
  closeShare();
}

/* ── 화면 그리기 ── */
function renderMain(coName, isOther, isDeputy, sharedInfo){
  var banner = '';
  if (sharedInfo) {
    banner = '<div class="seatbar shared">🤝 <b>' + sharedInfo.byName + '</b>님이 공유함 — ' + sharedInfo.tags.join(', ')
      + '<button class="btn" onclick="leaveMock()">내 자리로</button></div>';
  } else if (isOther) {
    banner = '<div class="seatbar' + (isDeputy?' deputy':' view') + '">'
      + (isDeputy ? '✏ <b>' + (viewing?viewing.name:'') + ' 자리</b> — 맡은 자리입니다'
                  : '👁 <b>' + (viewing?viewing.name:'') + ' 자리</b> — 보기만 가능합니다')
      + '<button class="btn" onclick="leaveMock()">내 자리로</button></div>';
  }
  document.getElementById('mainArea').innerHTML = banner
    + '<div style="margin-bottom:10px"><button class="btn">← 사업장</button></div>'
    + '<h1>' + coName + '</h1>'
    + '<div class="sub">서랍 화면(지금 있는 화면 그대로) — 근태 2 · 급여대장 1 · 우리 산출물 0</div>'
    + '<div class="card"><div class="row"><b style="flex:1">근태표_8월.jpg</b></div>'
    + '<div class="row"><b style="flex:1">급여대장_8월.xlsx</b></div></div>';
}
function leaveMock(){ viewing = null; renderMain(COMPANIES[0].name, false, false, null); }

renderSidebar();
document.getElementById('mainArea').innerHTML =
  '<div class="sub" style="margin-top:30px;text-align:center">왼쪽에서 사람을 펼치고 업체를 눌러 보세요.</div>';
</script>
</body>
</html>
