<!doctype html><meta charset="utf-8">
<!-- 푸른 포털 아이콘 후보 10 (대표 지시 2026-08-26 「로고 새롭게 아주 세련된 디자인 10개」)
     ★ 고른 번호가 정해지면 scripts/make-portal-icon.js 를 그 도안으로 바꿔
       icons/*.png 를 다시 굽고 manifest.json 이 그대로 그것을 가리키게 한다.
     ⚠ 홈 화면 아이콘은 «작을 때 읽히는지» 가 전부다 — 그래서 이 장에는
       실제 크기(44px) 미리보기를 나란히 둔다. 큰 그림만 보고 고르면 후회한다.
     ⚠ 안드로이드는 제 나름의 탈(mask)을 씌운다. 어떤 탈이 씌워져도 잘리지
       않도록 그림은 가운데 원(지름 80%) 안에 둔다 — maskable 규칙. -->
<style>
 body{margin:0;background:#141821;color:#e7ecf5;
   font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

 .sub{font-size:12.5px;color:#93a1bb;margin:0 0 22px;line-height:1.6}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
 .cell{background:#1b2130;border:1px solid #29324a;border-radius:16px;padding:16px 14px 13px;
   display:flex;flex-direction:column;align-items:center}
 .no{position:absolute}

 .num{width:20px;height:20px;border-radius:6px;background:#2b3category;}

   font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
 .nm{font-size:13px;font-weight:800;letter-spacing:-.3px}
 .big{width:132px;height:132px;display:block}
 .cap{font-size:11px;color:#8fa0bd;line-height:1.55;margin-top:10px;text-align:center;min-height:34px}
 .mini{margin-top:9px;display:flex;align-items:center;gap:9px;
   background:#11151d;border-radius:9px;padding:6px 10px}
 .mini svg{width:44px;height:44px;display:block}

</style>

<script>
var L=[
 ['정자 푸','획을 얇게, 사이를 넓게 — 지금 것의 «제대로 된» 판'],
 ['음각 푸','글자를 파냈다. 색을 얹지 않아 오래 안 질린다'],
 ['새싹 푸','푸른 = 자라는 것. ㅜ 기둥에서 잎이 난다'],
 ['저울 푸','노무법인의 저울이 곧 ㅍ 의 윗줄이 된다'],
 ['문 푸','포털 = 문. 열린 문 안으로 들어간다'],
 ['한 획 푸','흰 바탕 · 파란 획. 서류 같은 단정함'],
 ['겹 푸','세 겹의 판이 곧 글자 — 자료가 쌓인 모습'],
 ['인장 푸','도장처럼. 「법인」의 무게가 있다'],
 ['그리드 푸','그림자도 곡선도 없다. 가장 오래 간다'],
 ['유리 푸','깊은 남색에 빛이 스친다 — 요즘 앱의 결']
];

for(var i=0;i<L.length;i++){
  var n=i+1;
  h+='<div class="cell"><div class="head"><div class="num">'+n+'</div>'+
     '<div class="nm">'+L[i][0]+'</div></div>'+
     '<svg class="big"><use href="#s'+n+'"/></svg>'+
     '<div class="cap">'+L[i][1]+'</div>'+
     '<div class="mini"><svg><use href="#s'+n+'"/></svg><span>실제 크기</span></div></div>';
}
g.innerHTML=h;
</script>
