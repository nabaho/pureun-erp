  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, isCard?'명함':'사업자등록증');
  XLSX.writeFile(wb, `푸른기업정보함_${isCard?'명함':'사업자등록증'}_${scopeLabel}_${fmtDate(Date.now())}.xlsx`);
  toast(`엑셀 파일을 내려받았습니다 (${scopeLabel} ${rows.length}건)`);
}
</script>

<script>
/* ════════════ PC 화면 렌더링 (밝은 관리자 UI) ════════════ */
const IS_PC = matchMedia('(min-width:761px)').matches;

function pcItem(attrs, label, n, on){
  return `<div class="pcitem ${on?'on':''}" ${attrs}>${label}${n!==undefined?`<span>${n}</span>`:''}</div>`;
}
/* ══════ 옆줄 맨 아래 붙박이 — 환경설정·개인 폴더 ══════
   ⚠ 이 덩어리는 **어느 화면에서든** 그려져야 한다.
     예전에는 renderPCSide 의 맨 끝에서 한 번만 붙였는데, 기업 상세와 메일은 그보다
     먼저 `return` 해서 이 자리에 닿지 못했다 — 그 두 화면에서는 「⚙️ 환경설정」과
     「🔒 개인 폴더 열기」가 통째로 사라져, 명함 목록으로 되돌아가야만 설정에 갈 수
     있었다(대표 보고 2026-08-17: "기업상세 클릭하니 환경설정 사라졌다").
   그래서 글자를 **여기 한 곳**에만 두고, 갈림길마다 이 함수를 부른다. 베끼면 다음에
   단추가 하나 늘 때 한쪽만 고쳐진다.
   ★ 새 갈림길을 만들 때도 `$('pcSide').innerHTML` 앞에 반드시 이것을 붙여야 한다 —
     tests/cards-side-bottom.test.js 가 갈림길을 하나하나 실제로 돌려 확인한다. */
function pcSideBottomHtml(){
  /* 옛 방식으로 잠긴 폴더가 남아 있으면 그것부터 알린다.
     그냥 두면 「🔒 개인폴더」(옛 방식, 비밀번호가 DB에 그대로)와
     「🔒 개인 폴더 열기」(새 방식)가 나란히 보여 같은 것이 둘로 보인다. */
  const oldLocked = Object.values(state.groups||{}).filter(g=>g && g.locked).length;
  /* 로그아웃은 오른쪽 위(#pcTopRight)로 옮겼다 — 여기 없는 것이 맞다. */
  /* ── 두 창을 오가는 한 줄 (대표 지시 2026-08-24) ──
     갈래 줄에서 메일을 뺐으니(renderPCSide) 들어가는 길이 여기 있어야 한다.
     ⚠ 이 줄을 지우면 대표가 그 창에 갇힌다 — 메일 창에서는 명함으로 못 나가고,
       기업정보함에서는 메일로 못 들어간다. 지우려면 다른 길을 먼저 만들어야 한다. */
  const onMailNow = (state.view==='mail' || state.view==='mat');
  const cross = onMailNow
    ? `<button class="pcside-settings" onclick="closeMailPage()"
        title="명함·사업자·기업 상세로 — 같은 자료를 다른 창에서 봅니다">‹ 기업정보함으로</button>`
    : `<button class="pcside-settings" onclick="openMailBox('')"
        title="받은메일함 · 보낸메일함 · 쓰기 · 자료함 — 별도 창으로 열립니다">✉️ 메일 열기</button>`;
  return `<div class="pcside-bottom">
    ${cross}
    ${state.isAdmin && oldLocked ? `<button class="pcside-settings" onclick="migrateLockedFolders()"
      style="background:#7a4a12;border-color:#a4671c"
      title="옛 방식으로 잠긴 폴더는 비밀번호가 그대로 저장돼 있어 직원이 들여다볼 수 있습니다. 대표님 전용 창고로 옮기면 서버가 막아 줍니다.">⚠ 옛 잠금 폴더 ${oldLocked}개 옮기기</button>` : ''}
    ${state.isAdmin ? `<button class="pcside-settings" onclick="openPrivateVault()"
      title="대표만 보는 개인 폴더 — 비밀번호를 맞혀야 자료를 가져옵니다">${state.privOpen?'🔓 개인 폴더 닫기':'🔒 개인 폴더 열기'}</button>` : ''}
    <button class="pcside-settings" onclick="openSettingsPage()" title="정리·데이터·연동·탭·계정 설정 (별도 화면으로 열림)">⚙️ 환경설정</button>
  </div>`;
}
function renderPCSide(){
  /* 개인 폴더가 열려 있으면 그 명함도 함께 센다 — 대표 눈에는 한 목록이어야 한다 */
  const all = Object.values(allItems());
  const kindArr = all.filter(it=>it.kind===state.tab);
  const isAllView = g => state.group===g && state.owner==='all';
  /* ⚠ 이 덩어리(.pcside-top)는 옆줄 맨 위에 **붙박이로** 남는다. 폴더를 아무리 내려도
     갈래 단추는 늘 같은 자리에 보인다 — 돌아갈 자리를 잃지 않는다(대표 지시 2026-08-12).
     닫는 </div> 는 갈래 단추 줄 끝에 있다. */
  /* ── 두 창으로 나눈다 (대표 지시 2026-08-24) ──
     「메일과 자료함관리는 여기서 보일 필요도 없지 않나?」 → 「해라 포털도」
     옛 방식은 갈래 단추 넷(메일·명함·사업자·기업 상세)을 «어느 화면에서든» 그렸다.
     그래서 메일 화면에 들어가도 옆줄에 명함 6,282 · 사업자 346 이 같이 떠, 대표께
     「이중으로 관리하는 것 아닌가」로 보였다. 자료는 처음부터 한 벌인데 화면만 섞였다.
     ⚠ 나눈 것은 «화면»뿐이다. 파일도 자료도 한 벌 그대로다 — 쪼개면 명함을 두 번
       받아 비용이 늘고, 두 벌이 되면 언젠가 한쪽만 고친다(이 저장소에서 여러 번 겪었다).
     ⚠ 길을 끊지 않는다. 오가는 단추는 각 창 맨 아래(pcSideBottomHtml)에 한 줄씩 둔다. */
  const onMail = (state.view==='mail' || state.view==='mat');
  const onCo = (state.view==='co');
  /* ── 메일 창은 여기서 갈라진다 (대표 지시 2026-08-24) ──
     "메일함을 완벽하게 똑같이 만들어달라" → 옆줄이 다음메일함 차림(흰 바탕·내 정보·
     안읽음 셈·메일쓰기·폴더)이 된다. 명함 창의 남색 옆줄과는 아예 다른 틀이라
     한 덩어리 안에서 섞지 않는다 — 섞으면 머리가 두 벌 그려진다(그렇게 겪었다).
     ⚠ 붙박이(기업정보함으로·개인 폴더·환경설정)는 여기서도 반드시 붙인다. */
  if(onMail){
    /* 여백은 안쪽 덩어리(.dm-side)가 갖는다 — 위 CSS 주석에 까닭을 적어 두었다 */
    const mh = '<div class="dm-side">' + mailSideHtml() + pcSideBottomHtml() + '</div>';
    $('pcSide').innerHTML = mh;
    return;
  }
  let h = `<div class="pcside-top">
    <div class="pclogo" style="display:flex;align-items:flex-start;justify-content:space-between">
    <span>📇 푸른 기업정보함<span>푸른노무법인 · 사업자·명함·계약서</span></span>
    <button onclick="toggleSidebar()" title="메뉴 접기" style="background:none;border:none;color:#8fa0c4;cursor:pointer;font-size:15px;padding:2px 4px">◀</button></div>`;
  /* 명함 / 사업자 / 기업 상세 — **한 줄씩 세로로**. 옆으로 셋을 붙이니 칸이 좁아 이름이
     접혔고, 갈래를 더 늘릴 자리도 없었다(대표 지시 2026-08-12).
     ⚠ 메일은 2026-08-24 로 이 줄에서 «빠졌다» — 메일은 딴 창이다. 대신 맨 아래에
       「✉️ 메일 열기」 한 줄을 둔다. 여기 되살리면 두 창으로 나눈 뜻이 없어진다.
     ⚠ 메일 창에서는 이 줄을 «아예 안 그린다». 그리면 「메일」과 「메일 쓰기」가 둘 다
       켜진 채로 보여 지금 어디인지 알 수 없다. */
  /* ⚠ 기업 상세는 «갈래(state.tab)»가 아니라 «화면(state.view)»이다 — 그 화면에 있어도
     state.tab 은 'card' 로 남아 있다. 그래서 이 조건에서 화면을 안 빼면 「명함」과
     「기업 상세」가 «둘 다 켜진 채»로 보인다(대표 화면 2026-08-16). 켜진 것이 둘이면
     지금 어디에 있는지 알 수 없다 — 켜지는 것은 언제나 하나여야 한다. */
  h += `<div class="sidetab sidetabv">
    <button class="${!onCo&&state.tab==='card'?'on':''}" onclick="switchTab('card')" title="명함">📇<em>명함</em><span>${all.filter(i=>i.kind==='card').length.toLocaleString()}</span></button>
    <button class="${!onCo&&state.tab==='biz'?'on':''}" onclick="switchTab('biz')" title="사업자등록증">📄<em>사업자</em><span>${all.filter(i=>i.kind==='biz').length.toLocaleString()}</span></button>
    ${/* 개수는 coList() 에서 가져온다 — 옆줄 「폴더 › 전체」와 «같은 셈»이어야 한다(대표 지시
         2026-08-17). 따로 세면 두 숫자가 어긋나는데, 어느 쪽이 맞는지 아무도 모르게 된다.
         ⚠ 값: 이제 명함 화면에서도 회사 목록을 만든다. 재 보니 자료가 바뀐 직후 한 번
           29ms, 그 뒤 다시 그릴 때는 2.2ms(coList 가 기억해 둔다). 저장할 때마다 29ms 를
           더 쓰는 셈인데, 숫자가 늘 맞는 값으로 그만하면 싸다. */''}
    <button class="${onCo?'on':''}" onclick="openCoPage()" title="회사 하나에 얽힌 것을 한자리에 — 사업자등록증·명함·푸른이알피">🏢<em>기업 상세</em><span>${coList().length.toLocaleString()}</span></button>
  </div></div>`;
  /* ⚠ 갈래 줄의 끝(`</div></div>`)이 .pcside-top 까지 «같이» 닫는다. 메일 창은 위에서
     이미 갈라져 나갔으므로 여기서는 갈래 줄이 늘 그려진다 — 따로 닫을 일이 없다. */
  /* 기업정보의 폴더 — 명함이 폴더를 갖듯 회사도 갖는다.
     ⚠ 예전에 여기 「🏢 거래처만」 줄이 붙박이로 있었다. 대표 지시 2026-08-17 로 **없앴다**
       ("거래처만 삭제해라. 내가 새로 폴더 만들어서 관리하겠다"). 이제 이 옆줄은
       사업자 갈래 옆줄과 똑같이 「전체 → 폴더 ＋ → 대표가 만든 폴더」로만 읽힌다.
       ⚠ 없앤 것은 «ERP 거래처만 보는 거르개» 하나뿐이다 — o.erp 로 붙는 유형(자문·급여…)
         딱지는 그대로 산다. */
  if(state.view==='co'){
    const cos = coList();
    /* ⚠ 차례는 사업자·명함 옆줄과 «똑같이» 둔다 — 「폴더 ＋」 머리 다음에 「전체」,
       그 아래 폴더들(대표 지시 2026-08-18 "같은 폴더 위치와 하위 폴더 위치").
       예전에는 「전체」가 폴더 머리 «위»에 있어, 같은 앱인데 두 화면의 차례가 달랐다. */
    h += `<div class="pcsec" style="display:flex;align-items:center">폴더
        <span style="margin-left:auto;cursor:pointer;font-weight:700" onclick="openCoFolderDialog()" title="새 폴더">＋</span></div>`;
    h += pcItem(`onclick="pickCoFolder('')"`, '📋 전체', cos.length, !state.coTag && !state.coFolder);
    /* 손으로 만든 폴더 — 명함 폴더와 같은 결(gname·gcount·gmenu)로 그린다.
       ⚠ 고른 폴더의 ＃탭은 **여기 옆줄에 안 그린다**. 예전에는 폴더 바로 아래에
         탭 줄과 탭 만드는 줄이 들여쓴 채 파고들어, 같은 앱에서 탭이
         명함(윗줄 칩)과 기업 상세(옆줄 들여쓴 줄) 두 모양으로 갈라져 있었다.
         대표 지시 2026-08-17 로 윗줄(#pcErpTabs·renderCoFTabsHtml)로 옮겼다 —
         옆줄은 다시 «폴더만» 있는 곳이다. */
    const folders = Object.values(_coFolders).sort((a,b)=>(a.order||0)-(b.order||0));
    /* ⚠ 폴더가 늘어나도 아래 「서류 탭」이 화면 밖으로 밀리지 않게 이 칸만 따로 구른다
       — 사업자·명함 옆줄이 쓰는 #pcFolderList 와 «같은 칸»이다(대표 지시 2026-08-18). */
    h += `<div id="pcFolderList">`;
    if(!folders.length){
      h += `<div class="pchintside">＋ 를 눌러 폴더를 만들면<br>회사를 갈래로 정리할 수 있습니다</div>`;
    }
    folders.forEach(f=>{
      const on = state.coFolder===f.id;
      const cnt = coFTabCounts(cos, f.id);
      /* 대표만 끌어서 순서를 «바꾼다» — 명함 폴더와 같은 손놀림.
         ⚠ 고른 회사를 이 줄에 «놓는» 것은 누구나 한다(직원도 「📁 폴더로 옮기기」를 쓴다).
           그래서 받는 쪽(ondragover/ondragleave/ondrop)은 늘 붙어 있고, 순서 갈래는
           _dragOrd 가 있을 때만·회사 갈래는 _dragCo 가 있을 때만 탄다 — 명함 폴더 줄이
           순서와 명함 놓기를 가르는 방식 그대로다. */
      h += `<div class="pcitem folderrow ${on?'on':''}" style="padding-left:11px"
          draggable="${state.isAdmin ? 'true' : 'false'}"
          ondragstart="onOrdDragStart(event,'cofolder','${f.id}','')"
          ondragend="onOrdDragEnd(event)"
          ondragover="onOrdDragOver(event);onCoFolderDragOver(event)"
          ondragleave="onOrdDragLeave(event);onCoFolderDragLeave(event)"
          ondrop="onOrdDrop(event,'cofolder','${f.id}','');onCoFolderDrop(event,'${f.id}')"
          title="고른 회사를 여기에 끌어다 놓으면 이 폴더로 옮겨집니다">
          <span style="width:13px;display:inline-block"></span>
          <span class="gname" onclick="pickCoFolder('f:${f.id}')">📁 ${esc(f.name)}</span>
          <span class="gcount">${cnt.all}</span>
          <span class="gmenu" onclick="event.stopPropagation();openCoFolderMenu(event,'${f.id}')" title="관리">⋮</span>
        </div>`;
    });
    h += `</div>`;
    const tags = coTagList(cos);
    const shown = tags.filter(x=>state.coShowHidden || !_coTagHidden[x.t]);
    const hiddenN = tags.filter(x=>_coTagHidden[x.t]).length;
    if(tags.length){
      h += `<div class="pcsec">서류 탭</div>`;
      shown.forEach(x=>{ h += `<div class="pcitem folderrow ${state.coTag===x.t?'on':''}" style="padding-left:11px">
          <span class="gname" onclick="pickCoFolder('t:${esc(x.t.replace(/'/g,"\\'"))}')">📁 ${esc(x.t)}</span>
          <span class="gcount">${x.n}</span>
          ${_coTagHidden[x.t]
            ? `<span class="gmenu" onclick="event.stopPropagation();unhideCoTag('${esc(x.t.replace(/'/g,"\\'"))}')" title="다시 보이기">🙈</span>`
            : `<span class="gmenu" onclick="event.stopPropagation();hideCoTag('${esc(x.t.replace(/'/g,"\\'"))}')" title="목록에서 숨기기(지우지 않음)">👁</span>`}
        </div>`; });
      if(hiddenN && !state.coShowHidden){
        h += `<div class="pchintside" style="cursor:pointer;text-decoration:underline" onclick="toggleCoShowHidden()">숨긴 사업 ${hiddenN}개 보기</div>`;
      }else if(state.coShowHidden && hiddenN){
        h += `<div class="pchintside" style="cursor:pointer;text-decoration:underline" onclick="toggleCoShowHidden()">숨긴 사업 접기</div>`;
      }
    }else{
      h += `<div class="pchintside">사진첩에서 서식·신청서를<br>기업 상세로 보내면<br>여기에 서류 탭이 생깁니다</div>`;
    }
    h += pcSideBottomHtml();
    $('pcSide').innerHTML = h; return;
  }
  /* 메일 갈래에서는 메일 전용 폴더를 그린다 — 명함 폴더는 여기서 쓸 일이 없다 */
  if(onMail){ h += mailSideHtml(); h += pcSideBottomHtml(); $('pcSide').innerHTML = h; return; }
  /* 현재 탭에 속한 폴더만 — 계층 없이 1단계로 평평하게.
     개인 창고를 열어 두었으면 그 폴더도 함께 보인다(allGroups).
     안 보이면 명함만 전체 목록에 섞여 나오고 어느 것이 개인 건지 알 수 없다.
     개인 창고 폴더는 canSeeGroup 을 묻지 않는다 — 비밀번호로 이미 지나온 자리다
     (옛 폴더의 lockOwner 가 남 이름이면 대표 자기 창고인데도 안 보이게 된다). */
  const groups = Object.values(allGroups())
                   .filter(g=>(g.kind||'card')===state.tab && (isPrivGroup(g) || canSeeGroup(g)))
                   .sort((a,b)=>(a.order||0)-(b.order||0));
  const cntSelf = g => kindArr.filter(it=>(it.group||'')===g).length;

  h += `<div class="pcsec" style="display:flex;align-items:center">폴더
        <span style="margin-left:auto;display:flex;gap:8px">
          <span onclick="openFolderDialog('')" title="새 폴더" style="cursor:pointer;font-weight:700">＋</span>
        </span></div>`;
  /* 「전체」는 폴더 목록의 첫 줄이다.
     예전엔 갈래 단추 바로 밑에 「📇 전체 명함 274」로 있었는데, 바로 위 단추가
     「📇 명함 274」라 아이콘도 숫자도 똑같아 한 줄이 두 번 그려진 것처럼 보였다.
     여기로 내리면 「전체 / 업체관리 / 노무사 …」로 읽혀 무엇을 고르는 자리인지 분명해진다
     (대표 지시 2026-08-12). 하는 일은 그대로 — 폴더·담당자 거르개를 모두 푼다. */
  h += pcItem(`onclick="switchTab('${state.tab}')"`, '📋 전체',
              all.filter(i=>i.kind===state.tab).length, isAllView('all'));

  const folderRow = (g) => {
    const on = state.group===g.id && state.owner==='all';
    const n = cntSelf(g.id);
    /* 개인 창고 폴더는 이미 비밀번호를 지나왔다 — 자물쇠가 아니라 열린 자물쇠로 보인다.
       개수도 숨기지 않는다(대표 자신만 보는 화면이다). */
    const isPriv = isPrivGroup(g);
    const isLocked = !isPriv && !!g.locked;
    const unlocked = isLocked && state.unlocked && state.unlocked[g.id];
    const icon = isPriv ? '🔓' : (isLocked ? (unlocked ? '🔓' : '🔒') : '📁');
    /* 폴더를 옮기면 앞 폴더의 탭 조건(ERP유형·칸검색)은 해제 — 탭은 폴더마다 따로이므로 */
    const reset = `state.view='list';state.owner='all';state.region='';state.erpFilter='';state.erpMgr='';state.colFilter={};state.page=0;`;
    const openClick = isLocked
      ? `if(tryUnlockFolder('${g.id}')){state.group='${g.id}';${reset}}render()`
      : `state.group='${g.id}';${reset}render()`;
    /* 개인 창고 폴더는 끌어 옮기지 않는다 — 공용 자리로 떨어지면 그 자리에서 드러난다 */
    if(isPriv) return `<div class="pcitem folderrow ${on?'on':''}" style="padding-left:11px">
        <span style="width:13px;display:inline-block"></span>
        <span class="gname" onclick="${openClick}" title="개인 폴더 — 대표님만 보입니다">${icon} ${esc(g.name)}</span>
        <span class="gcount">${n}</span>
        <span class="gmenu" onclick="event.stopPropagation();openFolderMenu(event,'${g.id}')" title="관리">⋮</span>
      </div>`;
    /* 대표만 끌어서 순서를 바꿀 수 있다. 명함을 이 줄에 끌어다 놓는 기존 기능은
       누구나 그대로 쓴다 — 그래서 ondragover/ondrop 은 늘 붙어 있고, 순서 갈래는
       _dragOrd 가 있을 때만 탄다. */
    return `<div class="pcitem folderrow ${on?'on':''}" style="padding-left:11px"
        draggable="${state.isAdmin ? 'true' : 'false'}"
        ondragstart="onFolderDrag(event,'${g.id}');onOrdDragStart(event,'group','${g.id}','')"
        ondragend="this.classList.remove('dragging');onOrdDragEnd(event)"
        ondragover="event.preventDefault();this.classList.add('dropover');onOrdDragOver(event)"
        ondragleave="this.classList.remove('dropover');onOrdDragLeave(event)"
        ondrop="onOrdDrop(event,'group','${g.id}','');onFolderOrCardDrop(event,'${g.id}')">
        <span style="width:13px;display:inline-block"></span>
        <span class="gname" onclick="${openClick}">${icon} ${esc(g.name)}</span>
        <span class="gcount">${isLocked&&!unlocked?'🔒':n}</span>
        <span class="gmenu" onclick="event.stopPropagation();openFolderMenu(event,'${g.id}')" title="관리">⋮</span>
      </div>`;
  };
  h += `<div id="pcFolderList">`;
  groups.forEach(g=> h += folderRow(g));
  h += `</div>`;

  h += `<div class="pcsec">담당자별 (직원)</div>`;
  const owners=[...new Set(kindArr.map(it=>String(it.owner||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
  if (!owners.length)
    h += `<div class="pchintside">명함에 담당자를 입력하면<br>여기에 자동으로 분류됩니다</div>`;
  owners.forEach(o=>{
    h += pcItem(`onclick="state.view='list';state.owner='${esc(o)}';state.group='all';state.region='';state.page=0;render()"`,
      '👤 '+esc(o), kindArr.filter(it=>String(it.owner||'').trim()===o).length, state.owner===o);
  });

  /* 맨 아래 고정 환경설정 — 갈림길마다 같은 것을 붙인다(pcSideBottomHtml) */
  h += pcSideBottomHtml();
  $('pcSide').innerHTML = h;
}
/* ══════════════ 다음메일함 (대표 지시 2026-08-24) ══════════════
   "다음 370-6@daum.net 에 있는 메일을 모두 동기화 시켜달라.
    메일함을 완벽하게 똑같이 만들어달라."

   ★ 무엇이 진짜인가
   메일함은 **다음메일이 진짜**다. 여기는 그것을 비추는 거울이다. 서버(functions
   mail-sync.js)가 10분마다 IMAP 으로 붙어 «목록만» 실시간DB(mailbox/)에 옮겨 적고,
   본문은 열어 볼 때 그 자리에서 가져온다. 본문을 쌓아 두면 요금이 뛰고 백업 한도를
   그 자리에서 넘긴다(2026-08-16 사고).

   ★ 왜 앱에서 보나 — 다음메일 창을 따로 열면 명함·자료·업체와 이어지지 않는다.
     여기서는 보낸이를 명함첩에서 찾고, 첨부를 자료함으로 보내는 길이 이어진다.

   ⚠ 손대는 것은 셋뿐이다: ① 열어 본 메일에 읽음 표시(다음메일과 같게), ② 휴지통으로
     옮기기, ③ 폴더 옮기기 — 셋 다 사람이 눌렀을 때만, 물어본 뒤에 한다.
     그 밖에는 아무것도 바꾸지 않는다.
   ⚠ 총괄관리자만 본다. 회사 메일함에는 고객사 임직원의 신상이 제목에까지 들어 있다.
     규칙(콘솔)과 서버 함수 두 곳에서 막는다 — 한 곳만 막으면 언젠가 뚫린다. */
const MB_ROOT = 'mailbox';
const MB_FN   = 'https://asia-northeast3-pureun-erp.cloudfunctions.net/';
const MB_PAGE = 100;      /* 한 쪽에 보일 통수 — 고르지 않았을 때의 기본값 */
/* 「몇 통씩 보기」 — 다음메일도 이 값을 고르게 해 둔다(대표 지시 2026-08-25).
   ⚠ 이 값은 «화면에 보일 수»이자 «서버에서 받아 올 수»다. 둘을 따로 두면 화면에는
     50통인데 받아 오기는 500통이라, 눈에 안 보이는 곳에서 요금이 나간다. */
const MB_SIZES = [50, 100, 200, 500];
const MB_SIZE_LS = 'pucards_mb_size';
function mbPageSize(){
  let n = Number(state.mbSize||0);
  if(!n){ try{ n = Number(localStorage.getItem(MB_SIZE_LS)||0); }catch(_){ } }
  return MB_SIZES.indexOf(n) >= 0 ? n : MB_PAGE;
}
/* 고른 수를 바꾸면 그 자리에서 다시 받는다 — 「더 보기」로 늘려 둔 것도 함께 되돌린다.
   안 되돌리면 50통으로 줄였는데 화면에는 500통이 그대로 남는다. */
function mbSetPageSize(v){
  const n = Number(v);
  if(MB_SIZES.indexOf(n) < 0) return;
  state.mbSize = n;
  try{ localStorage.setItem(MB_SIZE_LS, String(n)); }catch(_){ }
  state.mbLimit = 0;
  const id = mbNow();
  const slugs = mbNeedSlugs(id);
  let left = slugs.length;
  if(!left){ renderMailPage(); return; }
  slugs.forEach(s=>loadMailBox(s, n, ()=>{ if(!--left){ renderPCSide(); renderMailPage(); } }));
}

let _mbFolders = null;    /* {slug:{path,name,kind,order,total,unseen}} — null 이면 아직 안 읽음 */
let _mbMsgs    = {};      /* {slug:{uid:줄}} */
let _mbErr     = '';      /* 규칙이 없으면 여기로 온다 */
let _mbMeta    = {};      /* 서버가 마지막으로 언제 돌았나 */
let _mbBusy    = false;
let _mbBusyFolders = false;  /* 폴더 목록을 지금 가져오는 중인가 — 두 번 붙지 않게 */

/* 회사 주소 — 「내게쓴메일함」을 가릴 때와 「내게쓰기」에 쓴다 */
function mbMyAddr(){ return String((matMailCfg().from||'')).trim(); }

/* ── 폴더 목록 읽기 ──
   ⚠ once() 만 쓴다. 같은 자리에 on() 을 걸면 첫 값을 두 번 받는다(2026-08-16 요금 사고). */
function loadMailFolders(cb){
  if(Store.mode!=='firebase'){ _mbFolders = _mbFolders||{}; if(cb) cb(); return; }
  Promise.all([
    firebase.database().ref(MB_ROOT+'/folders').once('value'),
    firebase.database().ref(MB_ROOT+'/meta').once('value')
  ]).then(([f,m])=>{
    _mbFolders = f.val()||{}; _mbMeta = m.val()||{}; _mbErr=''; if(cb) cb();
  }).catch(e=>{
    _mbFolders = {}; _mbErr = (e&&e.code)||(e&&e.message)||'읽지 못했습니다';
    console.warn('[메일함]', _mbErr); if(cb) cb();
  });
}

/* 폴더 목록을 «한 번만» 가져온다. 들어오는 문에서 부른다(renderPC) — 그리는 함수에서
   부르면 다시 그릴 때마다 붙는다. 이미 있으면 아무 일도 하지 않는다. */
function mbEnsureFolders(){
  if(_mbFolders!==null || _mbBusyFolders) return;
  if(typeof Store==='undefined' || Store.mode!=='firebase'){ _mbFolders = {}; return; }
  _mbBusyFolders = true;
  loadMailFolders(()=>{
    _mbBusyFolders = false;
    if(state.view==='mail' || state.view==='mat'){ renderPCSide(); renderMailPage(); }
  });
}

/* ── 폴더 하나의 목록 읽기 ──
   번호(uid)가 열쇠라 실시간DB가 숫자로 차례를 매긴다 — limitToLast 면 «최신 것»이 온다.
   전부 받지 않는 까닭: 몇 년치가 만 통이면 한 번에 2MB 가 오간다. 「더 보기」로 늘린다. */
function loadMailBox(slug, n, cb){
  if(Store.mode!=='firebase'){ if(cb) cb(); return; }
  firebase.database().ref(MB_ROOT+'/msgs/'+slug).orderByKey().limitToLast(n||mbPageSize()).once('value')
    .then(s=>{ _mbMsgs[slug] = s.val()||{}; _mbErr=''; if(cb) cb(); })
    .catch(e=>{
      _mbErr = (e&&e.code)||(e&&e.message)||'읽지 못했습니다';
      console.warn('[메일함]', slug, _mbErr); if(cb) cb();
    });
}

/* ── 화면에 보일 폴더 차례 ──
   서버가 적어 준 order 를 따른다(받은 → 보낸 → 임시 → 보관 → 손폴더 → 스팸 → 휴지통).
   ⚠ 이름을 여기서 못 박지 않는다 — 다음메일이 폴더 이름을 바꾸면 그 이름이 그대로 온다. */
function mbFolders(){
  return Object.entries(_mbFolders||{})
    .map(([slug,v])=>Object.assign({slug}, v||{}))
    .filter(v=>v.path)
    .sort((a,b)=>(a.order||5)-(b.order||5) || String(a.name||'').localeCompare(String(b.name||''),'ko'));
}
function mbFolderOf(kind){ return mbFolders().filter(v=>v.kind===kind); }
function mbFolderBy(slug){ return (_mbFolders||{})[slug] || null; }

/* ══════════════════════════════════════════════════════════════════════════
   푸른 분류 — 우리 앱에서만 메일을 갈라 두는 층 (대표 지시 2026-08-26)
   ══════════════════════════════════════════════════════════════════════════
   "다음메일의 폴더는 그대로 유지한다. 오로지 푸른메일함에 있는 메일을
    구분해서 정리하려는 것이다."

   ★ 요점 하나 — «옮긴 것만 쪽지로 적는다.»
     메일을 옮겨도 다음메일에는 아무것도 쓰지 않는다. 우리 DB 에 「이 메일은 ○○ 칸에
     있다」는 쪽지 한 줄을 남길 뿐이다. 쪽지가 «없는» 메일은 다음이 넣은 자리를 그대로
     비춘다. 그래서
       · 처음 화면이 지금과 똑같다 — 베껴 넣을 목록이 없다
       · 새 메일도 저절로 제자리로 들어온다
       · 되돌리기가 쪽지 한 줄을 지우는 일이다
     통째로 베끼는 길은 버렸다. 같은 목록을 두 벌 들면 어긋났을 때 어느 쪽이 맞는지
     알 수 없고, 요금과 백업 한도(16MB)에 그 자리에서 걸린다.

   ★ 두는 자리 — pucards/config 밑이다. mailbox 는 규칙이 «서버만» 쓰게 막아 두었다.
     (mailOrder 를 여기 둔 것과 같은 까닭)

   ★ 열쇠 이름표 셋 — 왼쪽에서 무엇을 골랐는지 이 한 글자로 가른다.
       ~xxx  푸른 분류 칸    (우리 것)
       #xxx  다음메일 원본   (쪽지를 무시하고 다음에 있는 그대로)
       그 밖  다음메일 기본 칸(받은·보낸·휴지통…) — 우리 눈으로 본다(쪽지를 따른다)
     ⚠ 「받은메일함」과 「다음메일 원본 › 받은메일함」의 통수가 다를 수 있다. 그것이
       맞다 — 앞은 «우리가 정리한 뒤», 뒤는 «다음에 있는 그대로»다. */
const MB_BIN_P = '~';    /* 푸른 분류 칸 */
const MB_RAW_P = '#';    /* 다음메일 원본 */

let _mbBins = null;      /* {binId:{n:이름, l:이어진폴더slug, o:차례}} — null 이면 아직 안 읽음 */
let _mbPut  = null;      /* {'slug:uid': binId} — «옮긴 것만» 든다 */
let _mbHide = null;      /* {binId:true} — 안 쓰는 칸(소셜·프로모션…). 우리 화면에서만 치운다 */
let _mbBinsBusy = false;

/* 두 벌을 한 번에 읽는다 — 왼쪽 한 줄을 그리는 데 둘 다 필요하다.
   ⚠ once() 만 쓴다(2026-08-16 「once 뒤 on」 요금 사고와 같은 결). */
function mbEnsureBins(cb){
  if(_mbBins!==null && _mbPut!==null && _mbHide!==null){ if(cb) cb(); return; }
  if(typeof Store==='undefined' || Store.mode!=='firebase'){
    _mbBins = _mbBins||{}; _mbPut = _mbPut||{}; _mbHide = _mbHide||{}; if(cb) cb(); return;
  }
  if(_mbBinsBusy){ if(cb) setTimeout(()=>mbEnsureBins(cb), 200); return; }
  _mbBinsBusy = true;
  Promise.all([
    firebase.database().ref(DB_ROOT+'/config/mailBins').once('value'),
    firebase.database().ref(DB_ROOT+'/config/mailPut').once('value'),
    firebase.database().ref(DB_ROOT+'/config/mailHide').once('value')
  ]).then(([b,p,h])=>{
    _mbBins = b.val()||{}; _mbPut = p.val()||{}; _mbHide = h.val()||{};
  }).catch(e=>{
    _mbBins = _mbBins||{}; _mbPut = _mbPut||{}; _mbHide = _mbHide||{};
    console.warn('[푸른분류]', (e&&e.message)||e);
  }).then(()=>{
    _mbBinsBusy = false;
    if(cb) cb();
    if(state.view==='mail'){ renderPCSide(); renderMailPage(); }
  });
}

/* ── 우리 칸 목록 ──
   적어 둔 칸 + 아직 손대지 않은 다음 폴더(그대로 한 칸이 된다).
   ⚠ 다음에 새 폴더가 생기면 여기 저절로 나타난다 — 적어 두는 일 없이. 그래야 대표가
     다음메일에서 폴더를 하나 만들었을 때 우리 화면에서 조용히 빠지지 않는다. */
function mbBins(){
  const st = _mbBins || {};
  const out = [];
  const linked = {};
  Object.keys(st).forEach(id=>{
    const v = st[id]||{};
    if(v.l) linked[v.l] = 1;
    out.push({ id:id, name:String(v.n||''), link:String(v.l||''),
               depth:0, stored:true });
  });
  mbFolderOf('custom').forEach(f=>{
    if(st[f.slug] || linked[f.slug]) return;      /* 이미 어떤 칸이 맡고 있다 */
    out.push({ id:f.slug, name:String(f.name||f.path||''), link:f.slug,
               depth:Number(f.depth||0), stored:false });
  });
  /* 차례는 예전 그대로 config/mailOrder 에 둔다 — 열쇠가 폴더 slug 이던 것이 그대로
     칸 id 가 되므로, 어제까지 손으로 옮겨 둔 차례가 그대로 살아 있다. */
  return out.sort((a,b)=> mbOrderOf(a.id) - mbOrderOf(b.id)
    || String(a.name).localeCompare(String(b.name),'ko'));
}
function mbBinBy(id){
  const key = String(id||'');
  const bare = key.charAt(0)===MB_BIN_P ? key.slice(1) : key;
  return mbBins().find(b=>b.id===bare) || null;
}
/* 이 메일이 «옮겨진» 칸. 안 옮겼으면 빈 값 — 그러면 다음 자리를 그대로 따른다. */
function mbPutOf(key){ return String((_mbPut||{})[key] || ''); }

/* ── 안 쓰는 칸 치우기 (대표 지시 2026-08-26) ──
   "소셜 프로모션 등 없애고 싶은데 삭제가 없다."
   ⚠ 예전 「칸 지우기」는 다음메일에서 온 칸에는 «아무 일도 하지 않았다» — 적어 둔 칸이
     아니라 다음 폴더에서 저절로 만들어지는 칸이라, 지워도 곧바로 되살아났다.
     그런 칸은 «숨긴다». 다음메일은 그대로 두고 우리 목록에서만 치우는 것이다.
   ⚠ 숨긴 칸의 메일은 「전체메일」과 안읽음 셈에서도 뺀다 — 광고 500통이 섞이면 정작
     봐야 할 「새 것 몇 통」이 그 사이에 묻힌다(스팸함을 빼는 것과 같은 까닭).
   ⚠ 되돌릴 자리를 함께 만든다(「푸른 분류」 머리줄의 👁). 되돌릴 길이 없으면 아무도
     안 누른다. */
function mbHidden(id){ return !!(_mbHide||{})[String(id||'').replace(/^~/,'')]; }
/* 이 폴더를 맡고 있는 칸 — 「전체메일」에서 무엇을 뺄지 정할 때 쓴다 */
function mbBinOfFolder(slug){
  if(!slug) return null;
  return mbBins().find(b=>b.link===slug) || null;
}
/* 이 메일이 «지금 어느 칸에 있나» — 옮긴 칸이 있으면 그것, 없으면 제 폴더를 맡은 칸 */
function mbBinOfRow(v){
  const put = mbPutOf(v._key);
  return put ? mbBinBy(put) : mbBinOfFolder(v._slug);
}

/* ── 이 줄이 지금 보는 자리에 보이나 ──
   한 자리에서만 판단하게 모아 둔다. 그리는 곳과 「모두 고르기」가 서로 다른 셈을 하면
   개수가 어긋난다. */
function mbRowFits(v, id){
  if(String(id).charAt(0)===MB_RAW_P) return true;         /* 원본 — 쪽지를 안 본다 */
  const put = mbPutOf(v._key);
  if(String(id).charAt(0)===MB_BIN_P){
    const bin = mbBinBy(id); if(!bin) return false;
    return put ? (put === bin.id) : (!!bin.link && v._slug === bin.link);
  }
  if(id==='*all' || id==='*tome'){
    /* 숨긴 칸의 메일은 전체에서도 뺀다 — 광고가 섞이면 「전체메일」이 광고함이 된다 */
    const b0 = mbBinOfRow(v);
    return !(b0 && mbHidden(b0.id));
  }
  if(!put) return true;                                    /* 안 옮긴 것은 제자리 */
  const bin = mbBinBy(put);                                /* 옮겼으면 그 칸에서만 */
  return !!(bin && bin.link === v._slug);
}

/* ── 이 칸을 열려면 어느 폴더를 읽어 와야 하나 ──
   우리 칸에는 여러 다음 폴더에서 옮겨 온 메일이 섞일 수 있다. 그 폴더들을 안 읽으면
   옮긴 메일이 «사라진 것처럼» 보인다. */
function mbNeedSlugs(id){
  const s = String(id||'');
  if(s.charAt(0)===MB_RAW_P) return [s.slice(1)];
  if(s.charAt(0)===MB_BIN_P){
    const bin = mbBinBy(s); if(!bin) return [];
    const need = {};
    if(bin.link) need[bin.link] = 1;
    const put = _mbPut||{};
    Object.keys(put).forEach(k=>{
      if(put[k] !== bin.id) return;
      const at = k.lastIndexOf(':'); if(at>0) need[k.slice(0,at)] = 1;
    });
    return Object.keys(need);
  }
  if(s==='*all' || s==='*tome') return mbFolders().map(f=>f.slug);
  return [s];
}

/* ── 이 칸에 몇 통 들어 있나 ── (왼쪽 줄 끝의 숫자·안 읽은 수) */
function mbBinCount(bin){
  let n = 0, un = 0;
  Object.keys(_mbMsgs||{}).forEach(slug=>{
    const box = _mbMsgs[slug]||{};
    Object.keys(box).forEach(uid=>{
      const v = box[uid]; if(!v) return;
      const key = slug+':'+uid;
      const put = mbPutOf(key);
      const mine = put ? (put===bin.id) : (!!bin.link && slug===bin.link);
      if(!mine) return;
      n++; if(!Number(v.r||0)) un++;
    });
  });
  /* ⚠ 아직 그 폴더를 읽어 오지 않았으면 우리가 센 수는 0 이다 — 그 자리에 0 을 적으면
     「빈 칸」으로 보인다. 그럴 때는 서버가 폴더마다 적어 둔 셈을 그대로 쓴다
     (아직 아무것도 안 옮겼으므로 그 값이 맞다). */
  const f = bin.link ? mbFolderBy(bin.link) : null;
  if(f && !_mbMsgs[bin.link]) return { n:Number(f.total||0), un:Number(f.unseen||0) };
  return { n:n, un:un };
}

/* 지금 고른 칸. 없으면 받은메일함. */
function mbNow(){
  const id = state.mbBox||'';
  if(id) return id;
  const inbox = mbFolderOf('inbox')[0];
  return inbox ? inbox.slug : '*all';
}

/* 그 칸의 이름 — 갈래 단추줄 첫 칸과 「‹ 돌아가기」에 그대로 나온다.
   ⚠ IMAP 이 주는 이름(INBOX 등)을 그대로 쓰지 않는다. 사람이 다음메일에서 보는 이름은
     「받은메일함」이다 — 화면에 INBOX 라고 적으면 같은 칸인지 알 수 없다.
     손으로 만든 폴더만 제 이름을 쓴다(그건 대표가 붙인 이름이라 그게 맞다). */
const MB_KIND_LABEL = { inbox:'받은메일함', tome:'내게쓴메일함', sent:'보낸메일함',
  drafts:'임시보관함', sched:'예약메일함', archive:'보관메일함', spam:'스팸함', trash:'휴지통' };
function mbBoxName(id){
  if(id==='*all')  return '전체메일';
  if(id==='*tome') return '내게쓴메일함';
  if(id==='*sched')return '예약메일함';
  /* 푸른 분류 칸 — 대표가 붙인 이름을 그대로 */
  if(String(id).charAt(0)===MB_BIN_P){
    const b = mbBinBy(id);
    return b ? String(b.name) : '푸른 분류';
  }
  /* 다음메일 원본 — 같은 이름이 둘이 되므로 어느 쪽인지 적어 준다 */
  if(String(id).charAt(0)===MB_RAW_P){
    const f0 = mbFolderBy(String(id).slice(1));
    const nm = f0 ? (MB_KIND_LABEL[f0.kind] || String(f0.name||f0.path)) : '메일함';
    return nm + ' (다음메일 원본)';
  }
  const f = mbFolderBy(id);
  if(!f) return '메일함';
  return MB_KIND_LABEL[f.kind] || String(f.name||f.path);
}

/* ── 이 칸에 들어오는 줄들 ──
   *all 은 읽어 둔 폴더를 다 합친다. *tome 는 내가 나에게 보낸 것만.
   ⚠ 그리는 곳과 「모두 고르기」가 **같은 함수**를 봐야 개수가 어긋나지 않는다. */
function mbAllRows(){
  const id = mbNow();
  const out = [];
  const push = (slug)=>{
    const box = _mbMsgs[slug]||{};
    const f = mbFolderBy(slug)||{};
    Object.keys(box).forEach(uid=>{
      const v = box[uid]; if(!v) return;
      out.push(Object.assign({}, v, { _slug:slug, _box:String(f.name||''), _key:slug+':'+uid }));
    });
  };
  /* ⚠ 우리 칸은 «여러 폴더»에서 옮겨 온 것이 섞인다 — 읽어 둔 폴더를 다 훑은 뒤
     mbRowFits 로 고른다. 이어진 폴더 하나만 보면 옮겨 온 메일이 안 보인다. */
  const one = (id.charAt(0)===MB_RAW_P) ? id.slice(1)
            : (id.charAt(0)===MB_BIN_P || id==='*all' || id==='*tome') ? '' : id;
  if(one) push(one);
  else Object.keys(_mbMsgs).forEach(push);

  let rows = out.filter(v=>mbRowFits(v, id));
  if(id==='*tome'){
    const me = mbMyAddr().toLowerCase();
    rows = rows.filter(v=>me && String(v.e||'').toLowerCase()===me
                         && String(v.t||'').toLowerCase().indexOf(me)>=0);
  }
  return rows.sort((a,b)=>Number(b.d||0)-Number(a.d||0) || Number(b.u||0)-Number(a.u||0));
}

/* ⚠ 여기 「갈래 나누기」(청구서·쇼핑·소셜·프로모션)가 있었다 — 제목의 낱말로 짚어
   위 단추줄에서 걸러 보던 것이다. 대표 화면 2026-08-24 로 단추줄을 통째로 없애면서
   **함께 지웠다**. 부르는 곳이 없는 함수를 남기면 다음 사람이 「쓰는 줄」 알고 고친다.
   되살릴 일이 생기면 git 에서 되돌린다: 이 자리에 MB_KIND_WORDS · mbClassify 가 있었다. */

/* 지금 화면에 보일 줄 — 거르개(안읽음·중요·첨부)·찾기를 거친 것 */
function mbVisibleRows(){
  let rows = mbAllRows();
  const f = state.mbFilter||'';
  if(f==='unread') rows = rows.filter(v=>!Number(v.r||0));
  else if(f==='flag') rows = rows.filter(v=>Number(v.g||0));
  else if(f==='att')  rows = rows.filter(v=>Number(v.a||0));
  const q = String(state.mbQ||'').trim().toLowerCase().replace(/\s/g,'');
  if(q) rows = rows.filter(v=>{
    const hay = (String(v.f||'')+String(v.e||'')+String(v.t||'')+String(v.tn||'')+String(v.s||''))
      .toLowerCase().replace(/\s/g,'');
    return hay.indexOf(q)>=0;
  });
  return rows;
}
function mbVisibleKeys(){ return mbVisibleRows().map(v=>v._key); }

/* ── 주소만으로는 누구인지 모른다 (대표 지시 2026-08-25) ──
   「huamstoneceo@gmail.com」만 보고 어느 회사 누구인지 아는 사람은 없다.
   우리에게는 명함첩이 있다 — 그 주소가 명함에 있으면 «이름·회사»를 가져와 붙인다.
   ⚠ 명함이 6천 장이라 줄마다 훑으면 목록이 버벅인다. 한 번 만들어 두고, 명함 수가
     바뀔 때만 다시 만든다(중복 판정에서 쓰는 것과 같은 결). */
let _mbWho = { n:-1, map:null };
function mbWhoMap(){
  let all = {};
  try{ all = allItems()||{}; }catch(_){ all = {}; }
  const keys = Object.keys(all);
  if(_mbWho.n === keys.length && _mbWho.map) return _mbWho.map;
  const m = {};
  keys.forEach(k=>{
    const it = all[k]; if(!it) return;
    const e = String(it.email||'').trim().toLowerCase();
    if(!e || m[e]) return;
    m[e] = { name: String(it.name||'').trim(), company: String(it.company||'').trim() };
  });
  _mbWho = { n: keys.length, map: m };
  return m;
}
/* 주소 하나를 사람이 읽을 이름으로. 명함에 없으면 메일이 알려 준 이름, 그것도 없으면 주소. */
function mbNameOf(addr, fallback){
  const e = String(addr||'').trim().toLowerCase();
  const c = e ? mbWhoMap()[e] : null;
  const nm = (c && c.name) || String(fallback||'').trim();
  const co = (c && c.company) || '';
  if(nm && co) return nm + ' (' + co + ')';
  return nm || String(addr||'');
}
/* 여러 주소를 한 줄로 — 「홍길동 (가나상사), 김철수 (다라산업)」 */
function mbNamesOf(list, fallback){
  const arr = String(list||'').split(',').map(s=>s.trim()).filter(Boolean);
  if(!arr.length) return '';
  return arr.map((a,i)=>mbNameOf(a, i===0?fallback:'')).join(', ');
}

/* 보낸 것이 든 칸에서는 «받는 곳»을 보여 준다 — 다음메일 보낸메일함과 같다.
   보낸 사람 이름이 자기 이름으로 줄줄이 있으면 아무것도 알 수 없다. */
function mbWho(v){
  const f = mbFolderBy(v._slug)||{};
  if(f.kind==='sent' || f.kind==='drafts' || f.kind==='tome')
    return mbNamesOf(v.t, v.tn) || '(받는 곳 없음)';
  return mbNameOf(v.e, v.f) || '(보낸이 모름)';
}

/* 시각 — 오늘이면 시:분, 올해면 월.일, 지난해면 연.월.일. 다음메일과 같은 결이다. */
/* ⚠ 날짜와 시각을 «함께» 적는다 (대표 지시 2026-08-25).
   예전에는 오늘 온 것은 시각만(17:20), 지난 것은 날짜만(08.23) 적었다. 그래서
   보낸메일함에서 「그날 몇 시에 보냈나」를 이 화면에서는 알 수 없었다 — 하루에
   스무 통을 보내는 자리라 시각이 곧 순서다.
   올해 것은 「08.25 17:20」, 지난해 것은 「25.08.25 17:20」. */
function mbTime(ms){
  const n = Number(ms||0);
  if(!n) return '';
  const d = new Date(n), now = new Date();
  const p2 = x=>('0'+x).slice(-2);
  const hm = p2(d.getHours())+':'+p2(d.getMinutes());
  const md = p2(d.getMonth()+1)+'.'+p2(d.getDate());
  if(d.getFullYear()===now.getFullYear()) return md+' '+hm;
  return String(d.getFullYear()).slice(2)+'.'+md+' '+hm;
}

/* ══════ 왼쪽 옆줄 ══════ */
/* 캡처2의 그 차림 — 내 정보 → 안읽음·중요·첨부 → 메일쓰기·내게쓰기 → 폴더.
   ⚠ 붙박이(환경설정·기업정보함으로)는 여기서 붙이지 않는다. 부르는 쪽(renderPCSide)이
     pcSideBottomHtml() 로 붙인다 — 두 곳에서 붙이면 두 벌이 그려진다. */
function mailSideHtml(){
  /* ⚠ 여기서 자료를 «가져오지» 않는다. 그리는 함수가 가져오기까지 하면, 다시 그릴 때마다
     한 번씩 더 붙어 요금이 된다(2026-08-16 「once 뒤 on」과 같은 결). 가져오는 것은
     들어오는 문(openMailBox·openMailPage…)이 mbEnsureFolders() 로 한 번만 한다. */
  const now = mbNow();
  const me  = mbMyAddr() || '(보내는 주소 없음)';
  const all = mbAllRows();
  /* 안 읽은 통수 — 스팸함·휴지통은 뺀다. 다음메일함도 그렇게 센다(캡처의 「4」가
     그 값이었다). 광고 스팸 200통이 섞이면 그 숫자가 아무 뜻이 없어진다. */
  /* ⚠ 숨긴 칸(소셜·프로모션…)도 뺀다 — 스팸을 빼는 것과 같은 까닭이다(2026-08-26). */
  const cntUnread = mbFolders()
    .filter(f=>f.kind!=='spam' && f.kind!=='trash')
    .filter(f=>{ const b0 = mbBinOfFolder(f.slug); return !(b0 && mbHidden(b0.id)); })
    .reduce((s,f)=>s+Number(f.unseen||0),0);
  const cntFlag = all.filter(v=>Number(v.g||0)).length;
  const cntAtt  = all.filter(v=>Number(v.a||0)).length;
  const fl = state.mbFilter||'';

  /* ── 머리 ──
     자리·크기는 다음메일함과 같게 두었다. 다만 로고 글자는 「푸」다 — 우리 앱이
     다음 상표를 내걸 이유가 없고, 여기 목록은 우리 앱이 비추는 것이다.
     (「D」로 바꾸고 싶으시면 이 한 글자만 고치면 된다.) */
  /* ⚠ 위 덩어리(로고·내 정보·안읽음 셈·메일쓰기)는 «틀고정»이다 — 폴더를 아무리
     내려도 늘 같은 자리에 남는다(대표 지시 2026-08-25). 폴더가 스물여덟이라 아래로
     내리면 [메일쓰기]가 화면 밖으로 사라졌다. */
  let h = `<div class="dm-fix">
    <div class="dm-top" title="푸른 메일 — 370-6@daum.net 을 그대로 비춥니다">
      <span class="dm-logo">푸</span><span class="dm-logo-t">메일</span>
      <button class="fold" onclick="toggleSidebar()" title="메뉴 접기">◀</button>
    </div>
    <div class="dm-me">
      <span class="dm-face"><i></i><b>D</b></span>
      <span class="dm-me-n"><strong>푸른노무법인</strong><span>${esc(me)}</span></span>
    </div>
    <div class="dm-cnt">
      <a class="${fl==='unread'?'on':''}" onclick="mbFilter('unread')" title="안 읽은 메일만">
        <em>${cntUnread}</em><span>안읽음</span></a>
      <a class="${fl==='flag'?'on':''}" onclick="mbFilter('flag')" title="중요 표시한 메일만">
        <i>☆</i><span>중요</span></a>
      <a class="${fl==='att'?'on':''}" onclick="mbFilter('att')" title="첨부가 있는 메일만">
        <i>📎</i><span>첨부</span></a>
    </div>
    <div class="dm-write">
      <button class="a" onclick="openMailPage()">메일쓰기</button>
      <button class="b" onclick="mailToMe()" title="내 회사 주소로 보내기">내게쓰기</button>
    </div>
    </div>`;

  /* ── 다음메일과 같은 칸 차례 ──
     전체메일 · 받은메일함 · 내게쓴메일함 · 보낸메일함 · 임시보관함 · 예약메일함 · 보관메일함 */
  /* ⚠ 숫자는 «안 읽은 통수»만 보여 준다. 다음메일함이 그렇게 한다 — 캡처에서도 숫자가
     붙은 칸은 안 읽은 것이 있는 칸뿐이었다. 전체 통수를 옆에 적으면 폴더마다 네 자리
     숫자가 붙어, 정작 봐야 할 「새 것 4통」이 그 사이에 묻힌다.
     전체 통수는 그 칸에 들어가면 목록 위 안내줄에 나온다. */
  const row = (id, ic, nm, extra)=>{
    const f = (id.charAt(0)==='*') ? null : mbFolderBy(id);
    const un = f ? Number(f.unseen||0) : 0;
    const tt = f ? Number(f.total||0) : 0;
    return `<div class="dm-f ${now===id?'on':''}" onclick="openMailBox('${id}')"
      title="${esc(nm)}${tt?' · 모두 '+tt.toLocaleString()+'통':''}">
      <span class="ic">${ic}</span><span class="nm">${esc(nm)}</span>
      ${extra||''}
      ${un ? `<span class="nu">${un}</span>` : ''}
    </div>`;
  };
  h += row('*all','✉','전체메일');
  mbFolderOf('inbox').forEach(f=>{ h += row(f.slug,'📥','받은메일함'); });
  /* ⚠ 내게쓴메일함·예약메일함은 다음메일에 «진짜 폴더»로 있다(실측 2026-08-25:
     내게쓴편지함 400통 · 예약편지함 142통). 예전에는 가짜 거르개(*tome)와 앱의 예약칸을
     그 자리에 두어, 400통이 든 칸이 「내 메일함」 밑 잡폴더로 밀려나 있었다.
     진짜 폴더가 없는 계정을 위해 옛 자리를 뒤에 남겨 둔다. */
  const tome = mbFolderOf('tome');
  if(tome.length) tome.forEach(f=>{ h += row(f.slug,'↗','내게쓴메일함'); });
  else h += row('*tome','↗','내게쓴메일함');
  mbFolderOf('sent').forEach(f=>{ h += row(f.slug,'✈','보낸메일함','<span class="pill">수신확인</span>'); });
  mbFolderOf('drafts').forEach(f=>{ h += row(f.slug,'🗂','임시보관함'); });
  const sch = mbFolderOf('sched');
  if(sch.length) sch.forEach(f=>{ h += row(f.slug,'🕐','예약메일함'); });
  else h += `<div class="dm-f ${state.mailSent==='sched'?'on':''}" onclick="openSchedBox()">
      <span class="ic">🕐</span><span class="nm">예약메일함</span>
      ${schedList().length?`<span class="n">${schedList().length}</span>`:''}</div>`;
  mbFolderOf('archive').forEach(f=>{ h += row(f.slug,'📦','보관메일함'); });

  /* ── 푸른 분류 — 우리 앱에서만 나눈 칸 (대표 지시 2026-08-26) ──
     ⚠ 예전 「내 메일함」 자리다. 이름을 바꾼 까닭은 «다른 것이 되었기» 때문이다.
       예전: 다음메일 폴더를 그대로 비추고, 여기서 고치면 다음메일도 바뀌었다.
       지금: 우리 앱에서만 나눈다 — 다음메일에는 아무것도 쓰지 않는다.
       이름을 그대로 두면 다음메일에서도 바뀌는 줄 알고 누른다. */
  const allBins = mbBins();
  const bins = allBins.filter(b=>!mbHidden(b.id));
  const hid  = allBins.filter(b=>mbHidden(b.id));
  const openMine = state.mbMineOpen !== false;
  h += `<div class="dm-fsec pu" onclick="mbToggleMine()"
      title="우리 앱에서만 나눈 칸입니다 — 다음메일은 그대로 있습니다">
      <span class="nm">푸른 분류 <span style="color:#b6b9c0">${openMine?'⌃':'⌄'}</span></span>
      <span class="tool" onclick="event.stopPropagation();mbToggleHidden()"
        title="숨긴 칸 보기 · 되돌리기">👁${hid.length?` <b style="color:#0f8a5f">${hid.length}</b>`:''}</span>
      <span class="tool" onclick="event.stopPropagation();mbBinNew(event)" title="새 칸 만들기">＋</span>
    </div>`;
  if(openMine){
    /* ── 숨겨 둔 칸 — 되돌릴 자리 ──
       ⚠ 되돌릴 길이 없으면 아무도 숨기기를 못 누른다. 숨기기와 «같은 화면»에 둔다. */
    if(state.mbHideOpen){
      h += `<div class="dm-hid"><div class="h">숨긴 칸 ${hid.length}개 — 다음메일에는 그대로 있습니다</div>`;
      if(hid.length) hid.forEach(b=>{
        h += `<div class="r"><span class="nm" title="${esc(b.name)}">👁‍🗨 ${esc(b.name)}</span>
          <button onclick="mbBinShow('${b.id}')">되돌리기</button></div>`;
      });
      else h += `<div class="r"><span class="nm" style="color:#b6b9c0">숨긴 칸이 없습니다</span></div>`;
      h += `</div>`;
    }
    if(bins.length) bins.forEach(b=>{
      const c = mbBinCount(b);
      const id = MB_BIN_P + b.id;
      /* 층만큼 들여쓴다 — 다음에서 하위 폴더였던 것이 어버이 밑에 있다는 것이 보이게 */
      const pad = 15 + Number(b.depth||0) * 14;
      /* ⚠ 끌어서 차례를 옮길 수 있다. 차례도 옮기기도 모두 우리 쪽에만 남는다. */
      h += `<div class="dm-f sub ${now===id?'on':''}" style="padding-left:${pad}px"
        draggable="true" ondragstart="mbDragStart(event,'${b.id}')"
        ondragend="this.classList.remove('dropover')"
        ondragover="mbDragOver(event,this)" ondragleave="mbDragLeave(this)"
        ondrop="mbDrop(event,'${b.id}',this)"
        title="${esc(b.name)}${c.n?' · '+c.n.toLocaleString()+'통':''} — 메일을 끌어다 놓으면 이 칸으로 옮겨집니다">
        <span class="grip" title="끌어서 차례 옮기기">⋮⋮</span>
        <span class="nm" onclick="openMailBox('${id}')">${esc(b.name)}</span>
        ${c.un?`<span class="nu">${c.un}</span>`:''}
        <span class="fmenu" onclick="event.stopPropagation();mbBinMenu('${b.id}',event)"
          title="이름 바꾸기 · 숨기기 · 지우기">⋮</span></div>`;
    });
    else h += `<div class="dm-side-hint">${_mbFolders===null ? '칸을 읽고 있습니다…'
      : _mbErr ? '아직 볼 수 없습니다 — 콘솔 규칙이 필요합니다'
      : '아직 동기화되지 않았습니다.<br>목록에서 <b>새로고침</b>을 눌러 주세요'}</div>`;
  }

  /* ── 다음메일 원본 — 접어 둔다. 여기는 «다음에 있는 그대로»다 ──
     ⚠ 우리가 옮긴 것과 상관없이 다음에 있는 자리를 그대로 보여 준다. 그래서 「푸른 분류」의
       통수와 여기 통수가 다를 수 있다 — 그것이 이 칸이 있는 까닭이다.
     ⚠ 여기서는 옮기지 않는다(목록 도구줄의 옮기기가 꺼진다). 옮기고 싶으면 왼쪽 위
       우리 칸에서 하면 된다. */
  const openRaw = !!state.mbRawOpen;
  h += `<div class="dm-fsec daum" onclick="mbToggleRaw()"
      title="다음메일에 있는 그대로 — 우리가 나눈 것과 상관없이 보여 줍니다">
      <span class="nm">다음메일 원본 <span style="color:#b6b9c0">${openRaw?'⌃':'⌄'}</span></span>
      <span class="tool" onclick="event.stopPropagation();mbNewFolder('',event)"
        title="다음메일에 새 폴더 만들기 — 다음메일에서도 생깁니다">＋</span></div>`;
  if(openRaw){
    h += `<div class="dm-side-hint">다음메일에 있는 그대로입니다.<br>
      여기서 메일을 옮기지는 않습니다 — 나누는 일은 위 <b>푸른 분류</b>에서 합니다.</div>`;
    /* 손으로 만든 폴더는 층·마지막 마디를 살려 적는다(다음메일에서 보는 그 모습) */
    const leafOf = {};
    mbMineTree().forEach(f=>{ leafOf[f.slug] = f; });
    mbFolders().forEach(f=>{
      const id = MB_RAW_P + f.slug;
      const t  = leafOf[f.slug];
      const nm = t ? String(t._leaf) : (MB_KIND_LABEL[f.kind] || String(f.name||f.path));
      const tt = Number(f.total||0);
      const pad = 15 + (t ? Number(t._depth||0) * 14 : 0);
      /* ⚠ 다음메일 폴더 자체를 손보는 자리는 «여기 하나»다(2026-08-25 에 만든 길).
           우리 칸을 손보는 ⋮ 와 부르는 함수가 다르다 — 섞으면 다음메일이 바뀐다. */
      h += `<div class="dm-f sub ro ${now===id?'on':''}" style="padding-left:${pad}px"
        onclick="openMailBox('${id}')"
        title="${esc(nm)}${tt?' · 모두 '+tt.toLocaleString()+'통':''} — 다음메일에 있는 그대로">
        <span class="lock">🔒</span><span class="nm">${esc(nm)}</span>
        ${tt?`<span class="n">${tt.toLocaleString()}</span>`:''}
        ${f.kind==='custom' ? `<span class="fmenu" onclick="event.stopPropagation();mbFolderMenu('${f.slug}',event)"
          title="다음메일 폴더 손보기 — 다음메일에서도 바뀝니다">⋮</span>` : ''}</div>`;
    });
  }

  /* 스팸·휴지통은 맨 아래 — 다음메일과 같은 자리 */
  mbFolderOf('spam').forEach(f=>{ h += row(f.slug,'🚫','스팸함'); });
  mbFolderOf('trash').forEach(f=>{ h += row(f.slug,'🗑','휴지통'); });

  /* ══════ 푸른 도구 ══════
     다음메일에는 없고 우리 앱에만 있는 것들 — 자료함, 앱이 남긴 보낸 기록, 서버 수신기록.
     접어 둔다. 펼치지 않으면 옆줄이 다음메일과 같은 모양으로 남는다(대표 지시 2026-08-24). */
  const openTool = !!state.mbToolOpen;
  h += `<div class="dm-fsec" onclick="mbToggleTool()" style="border-top:1px solid #f0f0f0;margin-top:10px">
      <span class="nm">푸른 도구 <span style="color:#b6b9c0">${openTool?'⌃':'⌄'}</span></span></div>`;
  if(openTool){
    const sent = Object.values(state.sentBox||{}).filter(v=>v&&v.at);
    h += `<div class="dm-f sub ${state.mailSent===true&&!state.sentCat&&!state.sentBy?'on':''}" onclick="openSentBox()"
        title="앱이 보낸 편지의 기록 — 누가·무엇을 붙여 보냈는지">
        <span class="nm">📤 앱이 보낸 기록</span>${sent.length?`<span class="n">${sent.length}</span>`:''}</div>`;
    /* ⚠ 앱이 «잡아 둔» 예약은 다음메일의 예약편지함과 다른 것이다 — 아직 우리 DB 에만
       있고 때가 되면 서버가 보낸다. 위 「예약메일함」(다음메일 폴더)과 헷갈리지 않게
       이름을 「앱이 예약한 것」으로 두고 여기에 둔다. */
    h += `<div class="dm-f sub ${state.mailSent==='sched'?'on':''}" onclick="openSchedBox()"
        title="앱이 잡아 둔 예약 — 아직 나가지 않았습니다. 다음메일의 예약편지함과 다른 것입니다">
        <span class="nm">⏰ 앱이 예약한 것</span>${schedList().length?`<span class="n">${schedList().length}</span>`:''}</div>`;
    /* 서버가 「급여자료」 폴더에서 무엇을 보고 무엇을 담았나 — 받은 메일 처리 기록이다.
       메일함 목록과는 다른 것이다(이쪽은 담긴 결과가 요점). */
    h += `<div class="dm-f sub ${state.mailSent==='inbox'?'on':''}" onclick="openInbox()"
        title="서버가 급여자료를 담은 기록 — 받은 메일 가운데 무엇이 급여데이터함으로 갔나">
        <span class="nm">📥 서버 수신기록</span></div>`;

    /* ── 보낸 메일 나눠 보기 ──
       갈래(무엇을 붙여 보냈나)와 사람(누가 보냈나)을 한 칸에 넣고 사람은 접어 둔다
       (대표 지시 2026-08-10 — 사람마다 한 줄씩 늘어서 왼쪽이 이름으로 가득 찼었다). */
    if(sent.length){
      const catOf = v => {
        const ids = (v.ids||[]).filter(id=>_matMeta[id]);
        return ids.length ? matCat(_matMeta[ids[0]]) : '';
      };
      h += `<div class="dm-side-hint" style="padding-bottom:0">보낸 메일 나눠 보기</div>`;
      MAT_CATS_NOW().forEach(c=>{
        const n = sent.filter(v=>catOf(v)===c).length; if(!n) return;
        h += `<div class="dm-f sub ${state.sentCat===c?'on':''}" onclick="sentFilterCat('${esc(c)}')">
          <span class="nm">📁 ${esc(c)}</span><span class="n">${n}</span></div>`;
      });
      const nNone = sent.filter(v=>!catOf(v)).length;
      if(nNone) h += `<div class="dm-f sub ${state.sentCat==='__none'?'on':''}" onclick="sentFilterCat('__none')">
        <span class="nm">✉️ 자료 없이 보낸 것</span><span class="n">${nNone}</span></div>`;
      const bys = [...new Set(sent.map(v=>String(v.by||'').trim()).filter(Boolean))]
        .sort((a,b)=>staffName(a).localeCompare(staffName(b),'ko'));
      if(bys.length){
        const open = !!state.sentByOpen || !!state.sentBy;
        const who = bys.map(staffName).slice(0,2).join(' · ') + (bys.length>2?` 외 ${bys.length-2}`:'');
        h += `<div class="dm-f sub pcfold ${open?'open':''}" onclick="toggleSentBy()">
          <span class="nm">${open?'▾':'▸'} 👥 보낸 사람</span>
          <span class="n">${esc(who)}</span></div>`;
        if(open) bys.forEach(b=>{
          h += `<div class="dm-f sub ${state.sentBy===b?'on':''}" style="padding-left:26px"
            onclick="sentFilterBy('${esc(b)}')">
            <span class="nm">👤 ${esc(staffName(b))}</span>
            <span class="n">${sent.filter(v=>String(v.by||'')===b).length}</span></div>`;
        });
      }
    }

    /* ── 자료함 ──
       ⚠ 2026-08-24 대표 화면으로 「푸른 도구」 «안»으로 들어왔다 — "불필요한 것 같은데".
         다음메일함에는 없는 칸이라, 펼치지 않으면 옆줄이 다음메일함과 같은 모양으로
         끝난다. 편지에 붙일 자료는 쓰기 화면의 [＋ 자료 담기] 서랍에서 그 자리에서
         고를 수 있으므로, 여기까지 오지 않아도 일이 된다.
       ⚠ 자료함으로 가는 단추는 이 ＋ «하나»뿐이다. 예전에 「🗂 자료함 관리」와 겹쳐 있어
         같은 함수를 부르는 단추가 둘이었다. */
    const mats = matList();
    h += `<div class="dm-fsec" style="margin-top:2px">
        <span class="nm">📎 자료함</span>
        <span class="tool" onclick="event.stopPropagation();openMatPage()" title="자료 올리기·이름·순서 관리">＋</span></div>`;
    h += `<div class="dm-f sub ${!state.matPick?'on':''}" onclick="pickMatCat('')">
        <span class="nm">📋 전체 자료</span><span class="n">${mats.length}</span></div>`;
    MAT_CATS_NOW().forEach(c=>{
      const n = mats.filter(m=>matCat(m)===c).length; if(!n) return;
      h += `<div class="dm-f sub ${state.matPick===c?'on':''}" onclick="pickMatCat('${esc(c)}')">
        <span class="nm">📁 ${esc(c)}</span><span class="n">${n}</span></div>`;
    });
    if(!mats.length) h += `<div class="dm-side-hint">자료가 없습니다. 위 <b>＋</b> 로 올려주세요</div>`;
  }
  return h;
}
function mbToggleMine(){ state.mbMineOpen = (state.mbMineOpen===false); renderPCSide(); }
function mbToggleTool(){ state.mbToolOpen = !state.mbToolOpen; renderPCSide(); }
/* ══════ 내 메일함 — 만들기·이름 바꾸기·지우기 (대표 지시 2026-08-25) ══════
   ⚠ 여기는 다음메일의 «폴더 자체»를 고치는 자리다. 거울이 원본을 고치는 몇 안 되는
     자리이므로, 셋 다 «사람이 물음에 답한 뒤에만» 움직인다.
   ⚠ 손으로 만든 폴더만 건드린다 — 받은메일함처럼 다음메일이 만들어 둔 칸은 서버가 막는다.
   ⚠ 지우기는 «비우고 지운다» — 안의 메일을 휴지통으로 옮긴 뒤 빈 폴더를 지운다.
     그래야 잘못 눌러도 다음메일 휴지통에서 되찾는다. */

/* 층을 알아볼 수 있게 늘어놓는다 — 어버이 바로 밑에 그 자식이 오도록.
   ⚠ 지금 계정은 폴더가 다 맨 위에 있다(실측 2026-08-25). 그래도 층을 만들 수 있게
     해 두었으므로, 만들자마자 제자리에 보여야 한다. */
function mbMineTree(){
  const list = mbFolderOf('custom').map(f=>Object.assign({}, f));
  const delim = mbDelim();
  list.forEach(f=>{
    const p = String(f.path||'');
    const at = delim ? p.lastIndexOf(delim) : -1;
    f._depth = (delim && at > 0) ? p.split(delim).length - 1 : 0;
    f._leaf = at > 0 ? p.slice(at + delim.length) : (f.name || p);
    f._sort = p;
  });
  /* 손으로 옮겨 둔 차례가 먼저다. 안 옮긴 것은 뒤로 가서 경로 차례로 늘어선다 —
     경로 차례면 어버이가 자식보다 먼저 온다(같은 글자로 시작하므로). */
  return list.sort((a,b)=> mbOrderOf(a.slug) - mbOrderOf(b.slug)
    || String(a._sort).localeCompare(String(b._sort),'ko'));
}
/* 이 메일함이 폴더를 가르는 글자 — 서버가 알려 준 것을 쓴다(/ 인 곳도, . 인 곳도 있다) */
function mbDelim(){
  const fs = mbFolders();
  for(let i=0;i<fs.length;i++) if(fs[i].delim) return fs[i].delim;
  return '';
}

/* ══════ 폴더 손보기 — «그 폴더 옆에» 뜨는 작은 창 (대표 지시 2026-08-25) ══════
   예전에는 브라우저 prompt 로 「1. 이름 바꾸기 2. … 번호를 적어 주세요」가 화면 «맨 위»에
   떴다. 누른 자리에서 멀고, 글을 읽고 번호를 적어야 했다.
   ⚠ 이제 누른 폴더 바로 옆에 뜨고, 눌러서 고른다. 이름 바꾸기·새 폴더는 그 창 안에서
     칸에 적어 바로 끝낸다 — 창을 두 번 여닫지 않는다.
   ⚠ 명함첩 폴더 메뉴(#folderMenu)와 «같은 자리»를 쓴다. 창을 두 벌 만들면 한쪽만 고쳐진다. */
function mbFolderMenu(slug, ev){
  const f = mbFolderBy(slug); if(!f) return;
  const m = $('folderMenu'); if(!m) return;
  const tt = Number(f.total||0);
  m.innerHTML = `
    <div class="fmhead">${esc(f.name)}${tt?` <span>${tt.toLocaleString()}통</span>`:''}</div>
    <div class="fmi" onclick="mbMenuRename('${slug}')">✏️ 이름 바꾸기</div>
    <div class="fmi" onclick="mbMenuChild('${slug}')">📁 이 폴더 아래에 새 폴더</div>
    <div class="fmi danger" onclick="closeFolderMenu();mbAskDelete('${slug}')">🗑 폴더 지우기</div>`;
  mbPlaceMenu(m, ev);
}
/* 새 폴더(맨 위) — ＋ 를 누른 자리 옆에 뜬다 */
function mbNewFolder(parentSlug, ev){
  const m = $('folderMenu'); if(!m) return;
  const p = parentSlug ? mbFolderBy(parentSlug) : null;
  if(parentSlug && !mbDelim())
    return toast('이 메일함은 하위 폴더를 만들 수 없습니다 — 서버가 층을 알려 주지 않습니다', 8000);
  m.innerHTML = `
    <div class="fmhead">${p ? esc(p.name)+' 아래에 새 폴더' : '새 폴더'}</div>
    <div class="fmform">
      <input id="mbFName" placeholder="폴더 이름" maxlength="60"
        onkeydown="if(event.key==='Enter')mbDoCreate('${parentSlug||''}');if(event.key==='Escape')closeFolderMenu()">
      <button onclick="mbDoCreate('${parentSlug||''}')">만들기</button>
    </div>`;
  mbPlaceMenu(m, ev);
  setTimeout(()=>{ const e=$('mbFName'); if(e) e.focus(); }, 30);
}
function mbMenuRename(slug){

    </div>`;

function mbMenuChild(slug){ mbNewFolder(slug, null); }

/* 누른 자리 옆에 둔다 — 화면 밖으로 나가지 않게 안쪽으로 당긴다 */
function mbPlaceMenu(m, ev){
  m.style.display = 'block';
  const w = 250, h = m.offsetHeight || 160;
  let x = 260, y = 120;
  try{
    if(ev){ x = ev.clientX + 8; y = ev.clientY - 8; }
    else { const r = m.getBoundingClientRect(); x = r.left; y = r.top; }
  }catch(_){ }
  m.style.left = Math.max(8, Math.min(x, window.innerWidth - w - 8)) + 'px';
  m.style.top  = Math.max(8, Math.min(y, window.innerHeight - h - 8)) + 'px';
  /* 창 밖을 누르면 닫힌다. 칸에 글을 치는 동안은 닫히면 안 되므로 창 «안»은 뺀다. */
  setTimeout(()=>document.addEventListener('click', mbMenuOutside), 0);
}
function mbMenuOutside(e){
  const m = $('folderMenu');
  if(m && m.contains(e.target)) return;      /* 창 안이면 그대로 둔다 */
  document.removeEventListener('click', mbMenuOutside);
  closeFolderMenu();
}
function mbDoCreate(parentSlug){
  const e = $('mbFName'); const name = e ? String(e.value||'').trim() : '';
  if(!name) return toast('폴더 이름을 적어 주세요');
  closeFolderMenu();
  mbFolderDo({ act:'create', parent:parentSlug||'', name:name }, `📁 「${name}」 폴더를 만들었습니다`);
}
function mbDoRename(slug){
  const f = mbFolderBy(slug); if(!f) return;
  const e = $('mbFName'); const name = e ? String(e.value||'').trim() : '';
  if(!name) return toast('폴더 이름을 적어 주세요');
  closeFolderMenu();
  if(name === f.name) return;
  mbFolderDo({ act:'rename', slug:slug, name:name }, `✏️ 이름을 「${name}」 로 바꿨습니다`);
}
/* 지우기만은 «크게» 묻는다 — 되돌리기 어려운 유일한 자리다(휴지통으로 가긴 하지만) */
function mbAskDelete(slug){
  const f = mbFolderBy(slug); if(!f) return;
  const tt = Number(f.total||0);
  if(!confirm(`「${f.name}」 폴더를 지웁니다.\n\n`
    + (tt ? `안에 있는 ${tt.toLocaleString()}통은 «휴지통으로 옮긴 뒤» 폴더만 지웁니다.\n`
            + `다음메일 휴지통에서 되찾을 수 있습니다.\n\n`
          : `이 폴더는 비어 있습니다.\n\n`)
    + `⚠ 다음메일에서도 폴더가 사라집니다. 진행할까요?`)) return;
  mbFolderDo({ act:'delete', slug:slug }, `🗑 「${f.name}」 폴더를 지웠습니다`);
}

/* ══════ 폴더 차례를 마우스로 옮긴다 (대표 지시 2026-08-25) ══════
   ⚠ 다음메일(IMAP)에는 «폴더 차례»라는 것이 없다 — 서버는 늘 이름순으로 준다.
     그래서 차례는 «우리 쪽에만» 둔다. 다음메일은 건드리지 않는다.
   ⚠ 두는 자리는 pucards/config/mailOrder 다. mailbox 는 규칙이 «아무도 못 쓰게»
     막아 두었기 때문이다(적는 것은 서버뿐). 차례는 화면 취향이라 여기가 맞다.
   ⚠ 열쇠는 폴더 slug 다. 이름을 바꾸면 slug 가 바뀌어 그 폴더만 이름순 자리로
     돌아간다 — 잃는 것은 그 한 줄의 차례뿐이라 그대로 둔다. */
let _mbOrder = null;
function mbOrderMap(){
  if(_mbOrder) return _mbOrder;
  _mbOrder = {};
  if(typeof Store!=='undefined' && Store.mode==='firebase'){
    firebase.database().ref(DB_ROOT+'/config/mailOrder').once('value')
      .then(s=>{ _mbOrder = s.val()||{}; if(state.view==='mail') renderPCSide(); })
      .catch(()=>{});
  }
  return _mbOrder;
}
function mbOrderOf(slug){
  const n = Number(mbOrderMap()[slug]);
  return Number.isFinite(n) ? n : 9999;      /* 차례를 안 정한 것은 뒤로, 그다음 이름순 */
}
/* ── 왼쪽 칸을 끌어 차례 옮기기 ── */
function mbDragStart(ev, binId){
  state.mbDrag = { kind:'bin', id:binId };
  try{ ev.dataTransfer.effectAllowed='move'; ev.dataTransfer.setData('text/plain', binId); }catch(_){}
}
/* ── 목록의 메일을 끌어 칸에 넣기 (대표 지시 2026-08-26) ──
   ⚠ 고르지 않은 줄을 끌면 «그 줄 하나만» 끌린다. 골라 둔 것을 통째로 끌고 가면
     엉뚱한 메일이 함께 옮겨진 줄 모른다. */
function mbRowDragStart(ev, key){
  const sel = pickOf('mbox');
  if(!pickOn(sel, key)){ pickClear('mbox'); pickHit('mbox', key); pickRedraw(); }
  state.mbDrag = { kind:'mail' };
  try{ ev.dataTransfer.effectAllowed='move'; ev.dataTransfer.setData('text/plain', key); }catch(_){}
}
function mbDragOver(ev, el){
  ev.preventDefault();
  if(!el) return;
  const d = state.mbDrag||{};
  el.classList.add(d.kind==='mail' ? 'dropmail' : 'dropover');
}
function mbDragLeave(el){ if(el) el.classList.remove('dropover'), el.classList.remove('dropmail'); }
/* 끌어다 놓은 자리 «앞»에 넣는다 — 아래로 끌면 그 줄 다음에 온다 */
function mbDrop(ev, toBin, el){
  ev.preventDefault();
  if(el){ el.classList.remove('dropover'); el.classList.remove('dropmail'); }
  const d = state.mbDrag || {}; state.mbDrag = null;
  /* 메일을 끌어다 놓았다 — 그 칸으로 옮긴다(다음메일은 그대로) */
  if(d.kind==='mail') return mbBinPut(toBin);
  const from = d.id;
  if(!from || from===toBin) return;
  const list = mbBins().map(b=>b.id);
  const a = list.indexOf(from), b = list.indexOf(toBin);
  if(a<0 || b<0) return;
  list.splice(a, 1);
  list.splice(list.indexOf(toBin) + (a < b ? 1 : 0), 0, from);
  const map = {};
  list.forEach((s,i)=>{ map[s] = i; });
  _mbOrder = map;
  renderPCSide();
  if(typeof Store!=='undefined' && Store.mode==='firebase'){
    firebase.database().ref(DB_ROOT+'/config/mailOrder').set(map)
      .catch(e=>toast('차례를 저장하지 못했습니다 — '+((e&&e.message)||e), 8000));
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   푸른 분류 — 옮기기·되돌리기·칸 손보기 (대표 지시 2026-08-26)
   ══════════════════════════════════════════════════════════════════════════
   ⚠ 여기서는 다음메일에 «아무것도 쓰지 않는다». 서버를 부르지도 않는다.
     쪽지(config/mailPut) 한 줄을 적고 지울 뿐이다. */

/* 고른 메일을 이 칸으로 — 쪽지를 적는다 */
function mbBinPut(binId){
  const picked = mbPicked();
  if(!picked.length){ closeFolderMenu(); return toast('고른 것이 없습니다'); }
  const bin = mbBinBy(binId);
  if(!bin){ closeFolderMenu(); return toast('그 칸을 찾지 못했습니다'); }
  const up = {};
  picked.forEach(v=>{
    /* 이어진 다음 폴더 그대로면 쪽지가 필요 없다 — 지운다(쪽지는 적을수록 좋다) */
    const same = (bin.link && v._slug === bin.link);
    up[v._key] = same ? null : bin.id;
  });
  mbPutWrite(up, `📂 ${picked.length}통을 「${bin.name}」 으로 옮겼습니다 — 다음메일은 그대로입니다`);
}
/* 되돌리기 — 쪽지를 지우면 다음이 넣은 자리로 돌아간다 */
function mbBinUndo(){
  const picked = mbPicked().filter(v=>mbPutOf(v._key));
  if(!picked.length) return toast('되돌릴 것이 없습니다 — 옮긴 메일을 골라 주세요');
  const up = {};
  picked.forEach(v=>{ up[v._key] = null; });
  mbPutWrite(up, `↩ ${picked.length}통을 다음메일 자리로 되돌렸습니다`);
}
/* 쪽지를 적는다 — 화면을 먼저 고치고, 저장이 실패하면 되돌린다 */
function mbPutWrite(up, okMsg){
  const before = {};
  Object.keys(up).forEach(k=>{ before[k] = (_mbPut||{})[k] || null; });
  _mbPut = _mbPut || {};
  Object.keys(up).forEach(k=>{ if(up[k]==null) delete _mbPut[k]; else _mbPut[k] = up[k]; });
  pickClear('mbox'); closeFolderMenu();
  renderPCSide(); renderMailPage();
  if(typeof Store==='undefined' || Store.mode!=='firebase') return toast(okMsg, 6000);
  firebase.database().ref(DB_ROOT+'/config/mailPut').update(up)
    .then(()=>toast(okMsg, 6000))
    .catch(e=>{
      Object.keys(before).forEach(k=>{ if(before[k]==null) delete _mbPut[k]; else _mbPut[k] = before[k]; });
      renderPCSide(); renderMailPage();
      toast('옮기지 못했습니다 — '+((e&&e.message)||e), 9000);
    });
}

/* ── 칸 만들기·이름 바꾸기·지우기 ──
   ⚠ 폴더 손보는 창(#folderMenu)과 «같은 자리»를 쓴다. 창을 두 벌 만들면 한쪽만 고쳐진다. */
function mbBinNew(ev){
  if(ev) ev.stopPropagation();
  const m = $('folderMenu'); if(!m) return;
  m.innerHTML = `<div class="fmhead">새 칸 <span>우리 앱에만 생깁니다</span></div>
    <div class="fmform">
      <input id="mbBinName" placeholder="칸 이름" maxlength="40"
        onkeydown="if(event.key==='Enter')mbBinCreate();if(event.key==='Escape')closeFolderMenu()">
      <button onclick="mbBinCreate()">만들기</button>
    </div>`;
  mbPlaceMenu(m, ev);
  setTimeout(()=>{ const e=$('mbBinName'); if(e) e.focus(); }, 30);
}
/* ⚠ 갈래가 «셋»이다(대표 지시 2026-08-26). 셋이 서로 다른 곳을 건드리므로 무엇이
     어디까지 가는지 줄마다 적어 둔다 — 안 적으면 「지우기」를 눌러 다음메일 폴더가
     사라진다.
   ⚠ 마지막 줄은 칸이 «다음 폴더와 이어져 있을 때»만 나온다. 우리가 만든 칸에는
     지울 다음 폴더가 없다 — 그때는 「칸 지우기」다. */
function mbBinMenu(binId, ev){
  const b = mbBinBy(binId); if(!b) return;
  const m = $('folderMenu'); if(!m) return;
  const c = mbBinCount(b);
  m.innerHTML = `<div class="fmhead">${esc(b.name)}${c.n?` <span>${c.n.toLocaleString()}통</span>`:''}</div>
    <div class="fmi" onclick="mbBinRename('${b.id}')">✏️ 이름 바꾸기</div>
    <div class="fmi" onclick="mbBinHide('${b.id}')">👁 이 칸 숨기기
      <small>목록에서만 치웁니다 · 다음메일은 그대로</small></div>
    ${b.link
      ? `<div class="fmi danger" onclick="closeFolderMenu();mbAskDelete('${b.link}')">🗑 다음메일에서도 지우기
          <small>다음메일 폴더가 사라집니다 · 메일은 휴지통으로</small></div>`
      : `<div class="fmi danger" onclick="closeFolderMenu();mbBinDelete('${b.id}')">🗑 칸 지우기
          <small>메일은 다음메일의 제자리로 돌아갑니다</small></div>`}`;
  mbPlaceMenu(m, ev);
}
/* ── 칸 숨기기·되돌리기 ──
   ⚠ 저장은 낱칸으로 한다(set/remove). 통째로 덮어쓰면 다른 PC 에서 방금 숨긴 칸이
     되살아난다. */
function mbBinHide(binId){
  const b = mbBinBy(binId); if(!b) return;
  closeFolderMenu();
  _mbHide = _mbHide || {}; _mbHide[b.id] = true;
  if(state.mbBox === MB_BIN_P + b.id) state.mbBox = '';   /* 보고 있던 칸이면 나온다 */
  renderPCSide(); renderMailPage();
  const done = ()=>toast(`👁 「${b.name}」 을 숨겼습니다 — 다음메일에는 그대로 있습니다`
    + ' · 되돌리려면 「푸른 분류」 옆 👁', 8000);
  if(typeof Store==='undefined' || Store.mode!=='firebase') return done();
  firebase.database().ref(DB_ROOT+'/config/mailHide/'+b.id).set(true)
    .then(done)
    .catch(e=>toast('숨기지 못했습니다 — '+((e&&e.message)||e), 9000));
}
function mbBinShow(binId){
  const b = mbBinBy(binId); if(!b) return;
  _mbHide = _mbHide || {}; delete _mbHide[b.id];
  renderPCSide(); renderMailPage();
  const done = ()=>toast(`「${b.name}」 을 되돌렸습니다`, 5000);
  if(typeof Store==='undefined' || Store.mode!=='firebase') return done();
  firebase.database().ref(DB_ROOT+'/config/mailHide/'+b.id).remove()
    .then(done)
    .catch(e=>toast('되돌리지 못했습니다 — '+((e&&e.message)||e), 9000));
}
function mbToggleHidden(){ state.mbHideOpen = !state.mbHideOpen; renderPCSide(); }
function mbBinRename(binId){
  const b = mbBinBy(binId); if(!b) return;
  const m = $('folderMenu');
  m.innerHTML = `<div class="fmhead">이름 바꾸기 <span>우리 앱에서만 바뀝니다</span></div>
    <div class="fmform">
      <input id="mbBinName" value="${esc(b.name)}" maxlength="40"
        onkeydown="if(event.key==='Enter')mbBinDoRename('${b.id}');if(event.key==='Escape')closeFolderMenu()">
      <button onclick="mbBinDoRename('${b.id}')">바꾸기</button>
    </div>`;
  setTimeout(()=>{ const e=$('mbBinName'); if(e){ e.focus(); e.select(); } }, 30);
}
function mbBinCreate(){
  const e = $('mbBinName'); const name = e ? String(e.value||'').trim() : '';
  if(!name) return toast('칸 이름을 적어 주세요');
  /* ⚠ 새 칸은 다음 폴더와 «이어지지 않는다»(link 없음) — 오로지 옮겨 넣은 것만 담긴다 */
  const id = 'b' + Date.now().toString(36);
  mbBinSave(id, { n:name, l:'' }, `📂 「${name}」 칸을 만들었습니다`, ()=>{
    /* 고른 것이 있으면 만들자마자 넣어 준다 — 창을 두 번 여닫지 않는다 */
    if(mbPicked().length) mbBinPut(id);
  });
}
function mbBinDoRename(binId){
  const b = mbBinBy(binId); if(!b) return;
  const e = $('mbBinName'); const name = e ? String(e.value||'').trim() : '';
  if(!name) return toast('칸 이름을 적어 주세요');
  if(name === b.name) return closeFolderMenu();
  mbBinSave(b.id, { n:name, l:b.link||'' }, `✏️ 이름을 「${name}」 로 바꿨습니다`);
}
/* 칸을 지운다 — 메일은 사라지지 않는다. 쪽지를 떼어 다음 자리로 돌려보낼 뿐이다. */
function mbBinDelete(binId){
  const b = mbBinBy(binId); if(!b) return;
  const c = mbBinCount(b);
  if(!confirm(`「${b.name}」 칸을 지웁니다.\n\n`
    + (c.n ? `안에 있는 ${c.n.toLocaleString()}통은 «다음메일에 있는 제자리»로 돌아갑니다.\n`
           : `이 칸은 비어 있습니다.\n`)
    + `메일은 하나도 사라지지 않습니다 — 다음메일은 처음부터 그대로였습니다.\n\n진행할까요?`)) return;
  const up = {};
  Object.keys(_mbPut||{}).forEach(k=>{ if(_mbPut[k]===b.id) up[k] = null; });
  _mbBins = _mbBins || {};
  delete _mbBins[b.id];
  if(state.mbBox === MB_BIN_P + b.id) state.mbBox = '';
  const done = ()=>{ if(Object.keys(up).length) mbPutWrite(up, `🗑 「${b.name}」 칸을 지웠습니다`);
                     else { renderPCSide(); renderMailPage(); toast(`🗑 「${b.name}」 칸을 지웠습니다`, 6000); } };
  if(typeof Store==='undefined' || Store.mode!=='firebase') return done();
  firebase.database().ref(DB_ROOT+'/config/mailBins/'+b.id).remove()
    .then(done)
    .catch(e=>toast('지우지 못했습니다 — '+((e&&e.message)||e), 9000));
}
/* 칸 하나를 적어 둔다 — 아직 적어 두지 않았던 칸(다음 폴더에서 저절로 온 칸)이면
   이때 처음 우리 것이 된다. */
function mbBinSave(id, rec, okMsg, after){
  _mbBins = _mbBins || {};
  _mbBins[id] = { n:String(rec.n||''), l:String(rec.l||'') };
  closeFolderMenu();
  renderPCSide(); renderMailPage();
  const fin = ()=>{ toast(okMsg, 6000); if(after) after(); };
  if(typeof Store==='undefined' || Store.mode!=='firebase') return fin();
  firebase.database().ref(DB_ROOT+'/config/mailBins/'+id).set(_mbBins[id])
    .then(fin)
    .catch(e=>toast('저장하지 못했습니다 — '+((e&&e.message)||e), 9000));
}
function mbToggleRaw(){ state.mbRawOpen = !state.mbRawOpen; renderPCSide(); }

/* 서버에 시키고, 끝나면 폴더 목록을 다시 읽는다.
   ⚠ 다시 읽지 않으면 옆줄이 옛 이름·없는 폴더를 그대로 들고 있다. */
function mbFolderDo(body, okMsg){
  const u = firebase.auth().currentUser;
  if(!u) return toast('로그인이 필요합니다');
  toast('다음메일에 맡기는 중…', 3000);
  u.getIdToken()
    .then(tok=>fetch(MB_FN+'manageMailFolder', { method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+tok },
      body: JSON.stringify(body) }))
    .then(r=>r.json().catch(()=>({})))
    .then(j=>{
      if(!j.ok) throw new Error(j.error||'하지 못했습니다');
      const extra = Number(j.moved||0) ? ` — 메일 ${Number(j.moved).toLocaleString()}통은 휴지통에 있습니다` : '';
      /* 새 폴더는 다음 동기화 회차가 적는다. 기다리지 않게 지금 한 번 시킨다. */
      _mbFolders = null;
      loadMailFolders(()=>{
        renderPCSide(); renderMailPage();
        toast(okMsg + extra + (body.act==='create' ? ' (곧 목록에 나타납니다)' : ''), 8000);
        if(body.act==='create') mbPull();
      });
    })
    .catch(e=>toast('하지 못했습니다 — '+((e&&e.message)||e), 9000));
}
/* 내게쓰기 — 다음메일의 그 단추. 받는 곳을 회사 주소로 채운 쓰기 화면을 연다. */
function mailToMe(){
  const me = mbMyAddr();
  if(!me) return toast('자료함 → ✉️ 메일 본문에서 보내는 주소를 먼저 넣어 주세요', 8000);
  openMailPage({ to: me });
}

/* ══════ 칸 고르기 ══════ */
function openMailBox(id){
  state.view='mail'; state.mailSent='box'; state.mbBox=id; state.mbOpen=null;
  pickClear('mbox');
  render();
  try{ $('pcMain').scrollTop=0; }catch(_){}
  /* 자료함 갈래 셈이 옆줄에 나온다 — 안 읽어 두면 「전체 자료 0」으로 보인다.
     한 번만 읽는다(_matLoaded). */
  if(!_matLoaded && Store.mode==='firebase')
    loadMaterials(()=>{ if(state.view==='mail') renderPCSide(); });
  if(_mbFolders===null){ loadMailFolders(()=>openMailBox(id)); return; }
  /* 푸른 분류 칸을 그리려면 쪽지(_mbPut)가 있어야 한다 — 없으면 옮긴 메일이 안 보인다 */
  if(_mbBins===null || _mbPut===null){ mbEnsureBins(()=>openMailBox(id)); return; }
  /* 전체메일·우리 칸은 여러 폴더를 합친다 — 아직 안 읽은 폴더를 채워 넣는다 */
  const need = mbNeedSlugs(id).filter(s=>s && !_mbMsgs[s]);
  if(!need.length){ renderPCSide(); renderMailPage(); return; }
  let left = need.length;
  need.forEach(s=>loadMailBox(s, mbPageSize(), ()=>{
    if(--left) return;
    if(state.view==='mail' && state.mailSent==='box'){ renderPCSide(); renderMailPage(); }
  }));
}
/* 지금 보는 칸에 «모두» 몇 통 있나 — 서버가 폴더마다 적어 둔 값이다.
   화면에 보이는 수(가져온 것)와 다르다. 둘을 같이 보여 줘야 「더 있나」를 안다. */
function mbBoxTotal(){
  const id = mbNow();
  if(id==='*all' || id==='*tome')
    return mbFolders().reduce((s,f)=>s+Number(f.total||0), 0);
  /* 우리 칸은 서버가 세어 주지 않는다(다음메일에 없는 칸이다) — 우리가 센다 */
  if(String(id).charAt(0)===MB_BIN_P){
    const b = mbBinBy(id);
    return b ? mbBinCount(b).n : 0;
  }
  const f = mbFolderBy(String(id).charAt(0)===MB_RAW_P ? String(id).slice(1) : id);
  return f ? Number(f.total||0) : 0;
}
function mbFilter(k){
  state.mbFilter = (state.mbFilter===k ? '' : k);
  if(state.mailSent!=='box') return openMailBox(mbNow());
  renderPCSide(); renderMailPage();
}
function mbMore(){
  const id = mbNow();
  const slugs = mbNeedSlugs(id);
  const n = (state.mbLimit||mbPageSize()) + mbPageSize();
  state.mbLimit = n;
  let left = slugs.length; if(!left) return;
  toast('더 가져오고 있습니다…', 2000);
  slugs.forEach(s=>loadMailBox(s, n, ()=>{ if(!--left) renderMailPage(); }));
}

/* ══════ 새로고침 — 서버에 지금 보라고 시킨다 ══════
   10분을 기다리지 않는다. 서버가 IMAP 으로 붙어 목록을 새로 적고, 그것을 다시 읽는다. */
function mbPull(){
  if(_mbBusy) return;
  _mbBusy = true; renderMailPage();
  const done = (msg, ms)=>{
    _mbBusy=false;
    loadMailFolders(()=>{
      const id = mbNow();
      const slugs = mbNeedSlugs(id);
      let left = slugs.length || 1;
      const fin = ()=>{ if(!--left){ renderPCSide(); renderMailPage(); if(msg) toast(msg, ms||6000); } };
      if(!slugs.length) fin(); else slugs.forEach(s=>loadMailBox(s, state.mbLimit||mbPageSize(), fin));
    });
  };
  const u = firebase.auth().currentUser;
  if(!u){ _mbBusy=false; renderMailPage(); return toast('로그인이 필요합니다'); }
  u.getIdToken()
    .then(tok=>fetch(MB_FN+'pullMailbox', { method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+tok }, body:'{}' }))
    .then(r=>r.json().catch(()=>({})))
    .then(j=>{
      if(!j.ok) throw new Error(j.error||'가져오지 못했습니다');
      const bits = [`폴더 ${Number(j.folders||0)}개`, `새 목록 ${Number(j.rows||0)}줄`];
      if(Number(j.removed||0)) bits.push(`지워진 것 ${Number(j.removed)}건 정리`);
      done('📥 '+bits.join(' · ')+(Number(j.waiting||0)?` — 옛 메일 ${Number(j.waiting)}개 폴더는 다음 회차에 이어집니다`:''), 8000);
    })
    .catch(e=>{ _mbBusy=false; renderMailPage(); toast('가져오지 못했습니다 — '+((e&&e.message)||e), 8000); });
}

/* ══════════════ 폰 메일함 — 다음메일 «앱»과 같은 차림 ══════════════
   대표 화면 2026-08-24: "폰에서 화면은 캡쳐2,3 과 똑같이 만들어달라."

   ⚠ 여기만 PC 것을 그대로 쓰지 않는다. 다음메일은 PC(웹)와 폰(앱)의 차림이 아예
     다르다 — 폰은 어두운 바탕, 동그란 얼굴딱지 + 세 줄(보낸이·제목·미리보기),
     폴더는 왼쪽에서 밀려 나오는 서랍이다. 한 벌로 만들면 어느 쪽도 닮지 않는다.
   ⚠ 대신 «자료»는 한 벌 그대로 쓴다(mbVisibleRows·mbFolders·mbWho…). 다른 것은
     markup 뿐이라, 목록 규칙을 고치면 두 화면이 함께 따라온다.
   ⚠ 쓰기·보낸·예약·수신기록 화면은 예전 그대로 PC 것을 쓴다(renderMailMobile). */

/* 얼굴딱지 색 — 사람마다 늘 같은 색이어야 한다. 다시 그릴 때마다 색이 바뀌면
   목록을 훑을 때 눈이 붙잡을 것이 없다. 이름을 숫자로 바꿔 고른다. */
const DMM_FACE = ['#e57373','#f06292','#ba68c8','#7986cb','#4fa3e3','#4db6ac',
                  '#66a06b','#c0a44a','#e08e50','#8d6e63','#5c8a9e','#a1887f'];
function dmmFaceColor(s){
  const t = String(s||'?');
  let h = 0;
  for(let i=0;i<t.length;i++) h = (h*31 + t.charCodeAt(i)) >>> 0;
  return DMM_FACE[h % DMM_FACE.length];
}
/* 얼굴에 넣을 한 글자. 한글은 첫 글자, 영문 주소는 첫 글자를 크게. */
function dmmInitial(s){
  const t = String(s||'').trim().replace(/^["'\s]+/,'');
  if(!t) return '?';
  const c = t.charAt(0);
  return /[a-z]/.test(c) ? c.toUpperCase() : c;
}
/* 시각 — 앱처럼 오늘은 「오후 6:32」, 올해는 「8월 23일」, 지난해는 「2025.08.23」 */
function dmmTime(ms){
  const n = Number(ms||0); if(!n) return '';
  const d = new Date(n), now = new Date();
  const p2 = x=>('0'+x).slice(-2);
  if(d.toDateString()===now.toDateString()){
    const h = d.getHours();
    return (h<12?'오전 ':'오후 ') + (h%12===0?12:h%12) + ':' + p2(d.getMinutes());
  }
  if(d.getFullYear()===now.getFullYear()) return (d.getMonth()+1)+'월 '+d.getDate()+'일';
  return d.getFullYear()+'.'+p2(d.getMonth()+1)+'.'+p2(d.getDate());
}

/* ── 서랍 여닫기 ── */
function mbDrawer(on){ state.mbDrawerOpen = !!on; renderMailPage(); }
/* 🔍 — 찾기 한 줄을 연다. 닫을 때 찾던 말도 함께 지운다(안 지우면 목록이 걸러진 채 남는다) */

             onclick="event.stopPropagation();pickHit('mbox','${v._key}')">`
        : `<span class="dmm-st ${Number(v.g||0)?'on':''}"
             title="중요 표시는 다음메일에서 합니다">${Number(v.g||0)?'★':'☆'}</span>`}
    </div>`;
  }).join('')
  : `<div class="dmm-none">${

      : _mbFolders===null ? '읽고 있습니다…'
      : (state.mbQ||state.mbFilter) ? '찾은 메일이 없습니다.'
      : '아직 동기화된 메일이 없습니다.<br>위 <b>↻</b> 를 눌러 가져오세요.'}</div>`;

  return `<div class="dmm ${state.mbDrawerOpen?'open':''}">
    <div class="dmm-top">
      <button class="dmm-ic" onclick="mbDrawer(true)" title="메일함 고르기">☰</button>
      <b>${esc(mbBoxName(mbNow()))}${nPick?` (${nPick})`:''}</b>
      <span class="sp"></span>
      ${state.mbPickMode ? `
        <button class="dmm-ic" onclick="mbTrash()" title="휴지통으로">🗑</button>
        <button class="dmm-ic" onclick="mbMove(event)" title="폴더 옮기기">📁</button>
        <button class="dmm-ic on" onclick="mbPickMode()" title="고르기 끝">✕</button>`
      : `
        <button class="dmm-ic" ${_mbBusy?'disabled':''} onclick="mbPull()" title="새로 가져오기">${_mbBusy?'⏳':'↻'}</button>

      <input id="dmmQ" placeholder="메일 검색" value="${esc(state.mbQ||'')}"

        oncompositionend="state.mbQ=this.value;renderMailPage()"></div>` : ''}
    <div class="dmm-list">${body}
      ${rows.length && mbBoxTotal() > rows.length
        ? `<button class="dmm-more" onclick="mbMore()">이전 메일 더 보기</button>` : ''}</div>

/* ── 왼쪽 서랍 (캡처2) ── */
function mbDrawerHtml(){
  const me = mbMyAddr() || '(보내는 주소 없음)';
  const at = me.indexOf('@');
  const idPart = at>0 ? me.slice(0,at) : me;
  const domPart = at>0 ? me.slice(at) : '';
  const now = mbNow();
  const all = mbAllRows();
  const cntUnread = mbFolders()
    .filter(f=>f.kind!=='spam' && f.kind!=='trash')
    .reduce((s,f)=>s+Number(f.unseen||0),0);
  const fl = state.mbFilter||'';

  const row = (id, ic, nm, pill)=>{
    const f = (id.charAt(0)==='*') ? null : mbFolderBy(id);
    const un = f ? Number(f.unseen||0) : 0;
    return `<div class="dmm-f ${now===id?'on':''}" onclick="mbGo('${id}')">
      <span class="ic">${ic}</span><span class="nm">${esc(nm)}</span>
      ${pill||''}${un?`<span class="n">${un}</span>`:''}</div>`;
  };

  let h = `<div class="dmm-me">
      <span class="face">${esc(dmmInitial(idPart))}</span>
      <span class="nm">${esc(idPart)}<i>${esc(domPart)}</i></span>
      <span class="chev">˅</span>
    </div>
    <div class="dmm-cnt">
      <a class="${fl==='unread'?'on':''}" onclick="mbFilter('unread');mbDrawer(false)">✉ 안읽음 ${cntUnread?`<b>${cntUnread}</b>`:''}</a>
      <a class="${fl==='flag'?'on':''}" onclick="mbFilter('flag');mbDrawer(false)">☆ 중요</a>
      <a class="${fl==='att'?'on':''}" onclick="mbFilter('att');mbDrawer(false)">📎 첨부</a>
    </div>`;

  h += row('*all','✉','전체메일');
  mbFolderOf('inbox').forEach(f=>{ h += row(f.slug,'📥','받은메일함'); });
  /* PC 옆줄과 «같은 규칙» — 진짜 폴더가 있으면 그것을 쓴다(까닭은 mailSideHtml 주석) */
  const tome = mbFolderOf('tome');
  if(tome.length) tome.forEach(f=>{ h += row(f.slug,'📝','내게쓴메일함','<span class="pill">내게쓰기</span>'); });
  else h += row('*tome','📝','내게쓴메일함','<span class="pill">내게쓰기</span>');
  mbFolderOf('sent').forEach(f=>{ h += row(f.slug,'➤','보낸메일함','<span class="pill">수신확인</span>'); });
  mbFolderOf('drafts').forEach(f=>{ h += row(f.slug,'📁','임시보관함'); });
  const sch = mbFolderOf('sched');
  if(sch.length) sch.forEach(f=>{ h += row(f.slug,'🕐','예약메일함'); });
  else h += `<div class="dmm-f" onclick="openSchedBox()"><span class="ic">🕐</span>
      <span class="nm">예약메일함</span>
      ${schedList().length?`<span class="n">${schedList().length}</span>`:''}</div>`;
  mbFolderOf('archive').forEach(f=>{ h += row(f.slug,'📥','보관메일함'); });

  /* ── 푸른 분류 — PC 옆줄과 «같은 규칙»(까닭은 mailSideHtml 주석) ── */
  const allBins = mbBins();
  const bins = allBins.filter(b=>!mbHidden(b.id));
  const hidBins = allBins.filter(b=>mbHidden(b.id));
  const openMine = state.mbMineOpen !== false;
  h += `<div class="dmm-sec" onclick="mbToggleMine()">
      <span class="nm">● 푸른 분류</span>
      <span class="tool" onclick="event.stopPropagation();mbToggleHidden()"
        title="숨긴 칸 되돌리기">👁${hidBins.length?` ${hidBins.length}`:''}</span>
      <span class="tool" onclick="event.stopPropagation();mbBinNew(event)" title="새 칸">＋</span>
      <span>${openMine?'⌃':'⌄'}</span></div>`;
  if(openMine){
    /* 숨겨 둔 칸 — 폰에서도 되돌릴 수 있어야 한다(PC 에서만 되면 폰에서 갇힌다) */
    if(state.mbHideOpen){
      h += `<div class="dm-hid"><div class="h">숨긴 칸 ${hidBins.length}개 — 다음메일에는 그대로</div>`;
      if(hidBins.length) hidBins.forEach(b=>{
        h += `<div class="r"><span class="nm">👁‍🗨 ${esc(b.name)}</span>
          <button onclick="mbBinShow('${b.id}')">되돌리기</button></div>`;
      });
      else h += `<div class="r"><span class="nm" style="color:#b6b9c0">숨긴 칸이 없습니다</span></div>`;
      h += `</div>`;
    }
    /* 층만큼 들여쓰고, 줄 끝에 ⋮ 를 둔다 — 폰에서도 이름 바꾸기·숨기기가 된다 */
    if(bins.length) bins.forEach(b=>{
      const c = mbBinCount(b);
      h += `<div class="dmm-f" style="padding-left:${18 + Number(b.depth||0)*14}px">
        <span class="ic">📂</span>
        <span class="nm" onclick="mbGo('${MB_BIN_P + b.id}')">${esc(b.name)}</span>
        ${c.un?`<span class="n">${c.un}</span>`:''}
        <span class="fmenu" onclick="event.stopPropagation();mbBinMenu('${b.id}',event)">⋮</span></div>`;
    });
    else h += `<div class="dmm-hint">${_mbErr
      ? '아직 볼 수 없습니다 — 콘솔 규칙이 필요합니다'
      : '아직 동기화되지 않았습니다'}</div>`;
  }
  /* ── 다음메일 원본 — 접어 둔다. 다음에 있는 그대로 ── */
  const openRaw = !!state.mbRawOpen;
  h += `<div class="dmm-sec" onclick="mbToggleRaw()">
      <span class="nm">🔒 다음메일 원본</span><span>${openRaw?'⌃':'⌄'}</span></div>`;
  if(openRaw) mbFolders().forEach(f=>{
    const nm = MB_KIND_LABEL[f.kind] || String(f.name||f.path);
    h += `<div class="dmm-f" onclick="mbGo('${MB_RAW_P + f.slug}')">
      <span class="ic">🔒</span><span class="nm">${esc(nm)}</span>
      ${Number(f.total||0)?`<span class="n">${Number(f.total).toLocaleString()}</span>`:''}</div>`;
  });
  mbFolderOf('spam').forEach(f=>{ h += row(f.slug,'🚫','스팸함'); });
  mbFolderOf('trash').forEach(f=>{ h += row(f.slug,'🗑','휴지통'); });

  /* 앱에는 없는 우리 것 — 맨 아래에 조용히. 지우면 폰에서 그 화면들에 갈 길이 없어진다. */
  h += `<div class="dmm-sec"><span class="nm">푸른 도구</span></div>
    <button class="dmm-out" onclick="openSentBox()">📤 앱이 보낸 기록</button>
    <button class="dmm-out" onclick="openSchedBox()">⏰ 앱이 예약한 것</button>
    <button class="dmm-out" onclick="openInbox()">🧾 서버 수신기록</button>
    <button class="dmm-out" onclick="openMatPage()">📎 자료함</button>
    <button class="dmm-out" onclick="closeMailPage()">‹ 기업정보함으로</button>
    <button class="dmm-out" onclick="openSettingsPage()">⚙️ 환경설정</button>`;
  return h;
}
/* 서랍에서 칸을 고르면 서랍은 닫힌다 — 고르고 나서 또 닫아야 하면 두 번 손이 간다 */
function mbGo(id){ state.mbDrawerOpen = false; openMailBox(id); }

/* 옮긴 메일 옆의 「다음: ○○」 꼬리표 — 다음메일에서는 그대로 그 자리에 있다는 표시.
   ⚠ 원본 자리와 전체메일에서는 붙이지 않는다. 거기서는 그 폴더에 있는 것이 당연하다. */
function mbFromTag(v){
  const id = mbNow();
  if(id.charAt(0)===MB_RAW_P || id==='*all' || id==='*tome') return '';
  if(!mbPutOf(v._key)) return '';
  const f = mbFolderBy(v._slug);
  const nm = f ? (MB_KIND_LABEL[f.kind] || String(f.name||f.path)) : '';
  if(!nm) return '';
  return `<span class="dm-from" title="다음메일에서는 「${esc(nm)}」 에 그대로 있습니다">다음: ${esc(nm)}</span>`;
}

/* ══════ 오른쪽 본문 — 목록 ══════ */
function mbBoxHtml(){
  if(state.mbOpen) return mbReadHtml();
  const rows = mbVisibleRows();

  const cur = Number(state.mbCursor);
  const body = rows.length ? rows.map((v,i)=>`

            그 자리는 다음에 있는 그대로를 보여 주는 곳이라 우리가 손댈 자리가 아니다. */''}

      <span class="who" onclick="mbOpenMsg('${v._slug}','${v.u}')">${esc(mbWho(v))}</span>
      <span class="clip">${Number(v.a||0)?'📎':''}</span>
      <span class="sub" onclick="mbOpenMsg('${v._slug}','${v.u}')">${esc(v.s||'(제목 없음)')}</span>
      ${/* 옮긴 메일에는 «다음메일에서는 어디 있나»를 적어 준다. 이것이 없으면 다음메일을
            열었을 때 그 메일이 사라진 줄 안다. */''}
      ${mbFromTag(v)}
      ${(mbNow()==='*all'||mbNow()==='*tome')?`<span class="box">${esc(v._box||'')}</span>`:''}
