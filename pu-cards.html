.sidetab3 button i{font-style:normal;font-size:15px;font-weight:800;line-height:1.1;visibility:hidden}
/* ── 갈래를 한 줄씩 세로로 (대표 지시 2026-08-12) ──
   옆으로 셋을 붙이니 칸이 좁아 이름이 접혔고, 갈래를 더 늘릴 자리도 없었다.
   한 줄씩 두면 이름·숫자가 넉넉하고 갈래를 더해도 모양이 안 무너진다. */
.sidetabv{flex-direction:column;gap:4px;margin:8px 0 4px}
.sidetabv button{flex:none;justify-content:flex-start;gap:9px;padding:10px 11px;font-size:13.5px}
.sidetabv button em{font-style:normal;flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidetabv button span{font-size:12px}
/* ── 위쪽 갈래는 붙박이 ──
   폴더가 많아 아래로 내려가면 갈래 단추가 화면 밖으로 사라졌다. 돌아갈 자리는
   늘 같은 곳에 보여야 한다. 옆줄 안쪽 여백만큼 좌우로 물려 배경이 끝까지 닿게 한다. */
/* ⚠ 위쪽 여백을 **음수로 주면 안 된다.** 음수 위 여백은 자기만 올라가는 게 아니라
   뒤따르는 줄까지 그만큼 끌어올려, 붙박이가 바로 아래 줄(「메일 쓰기」)을 정확히
   그 크기만큼 덮는다 — 실제로 18px 겹쳤다(대표 보고 2026-08-12).
   대신 옆줄의 위 여백을 0 으로 두고 그 여백을 이 덩어리가 직접 갖는다.
   좌우만 음수로 물려 배경이 옆줄 끝까지 닿게 한다(이건 흐름을 안 건드린다). */
.pcside-top{position:sticky;top:0;z-index:6;background:#1e2a47;
  margin:0 -14px 0;padding:16px 14px 4px;box-shadow:0 6px 10px -8px rgba(0,0,0,.55)}
/* 붙박이가 옆줄의 4분의 1을 먹고 있었다. 늘 같은 자리를 차지하는 것일수록 얇아야
   아래 폴더가 많이 보인다 — 로고 아래 여백과 갈래 줄 간격을 죈다. */
.pcside-top .pclogo{margin-bottom:0;font-size:16.5px}
.pcside-top .pclogo span{margin-top:2px;font-size:11px}
.pcside-top .sidetab{margin:7px 0 0}
/* ── 기업정보 화면 ── */
/* 사업 탭 — 서식을 보낼수록 저절로 늘어난다. 이름이 길어 줄바꿈을 허용한다. */
.cotabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.cotabs button{border:1px solid #cbd5e6;background:#fff;border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:#28324a;max-width:100%}
.cotabs button:hover{background:#eef3fc}
.cotabs button.on{background:#1d4fc4;border-color:#1d4fc4;color:#fff}
.cotabs button i{font-style:normal;margin-left:5px;font-size:11px;opacity:.7}
.cohint{font-size:12px;color:#7c89a6;align-self:center;line-height:1.5}
/* 「거래처만」 거르개와 그 짝인 가르는 줄(.cosep·.coviewsep)은 대표 지시 2026-08-17 로
   지웠다 — 대표가 손수 만든 폴더로 관리한다. 그와 함께 .cotabs button.erponly 모양도
   쓰는 곳이 없어져 함께 지운다. */
/* 목록에서 회사를 고르면 뜨는 도구줄 — 명함첩 선택 도구줄과 같은 결 */
.coselbar{display:flex;align-items:center;gap:8px;background:#eef3fc;border:1px solid #b5d4f4;border-radius:10px;padding:9px 13px;margin:0 0 10px;font-size:13px}
.coselbar b{color:#185fa5;margin-right:4px}
.coselbar button{border:1px solid #b5d4f4;background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:700;cursor:pointer;color:#185fa5;font-family:inherit}
.coselbar button:hover{background:#dbe9fb}
.coselbar .comore{border-color:#d9a441;color:#92400e;background:#fff8ec}
.coselbar .comore:hover{background:#fdf0d8}
.coselbar /* 삭제 — 옆 단추들과 «다르게» 보여야 한다. 같은 회색이면 손이 미끄러진다 */
.codel{border-color:#e8b4b0 !important;color:#a50e0e !important;background:#fff !important}
.codel:hover{background:#fdf1f0 !important}
.coclear{border-color:#f0c9c4;color:#c0392b;background:#fff;margin-left:auto}
.coselbar .coclear:hover{background:#fdeced}
/* 「끌어서 폴더에 놓아도 됩니다」 — 도구줄 안의 작은 안내(대표 지시 2026-08-17) */
.coselbar .codraghint{font-size:11.5px;color:#5a7ba8;white-space:nowrap}
/* ── 고른 회사 도구줄을 «아래에 붙여» 따라오게 하는 감싸개 (대표 지시 2026-08-17) ──
   ⚠ 예전에는 표 «맨 위»에 있었다. 4,138곳 가운데 171번째 줄까지 내려가 14곳을 골랐을 때
     도구줄은 화면 밖 저 위에 있었다 — 고르고 나서 «무엇을 할 수 있는지»가 어디에도
     안 보였다(대표 화면 2026-08-17). 기능은 있는데 보이지 않으면 없는 것과 같다.
   ⚠ .coselbar 자체에 붙이면 «폰까지 샌다» — 폰 목록(renderCoMobileList)이 같은 반을
     쓰고, 폰에는 제 도구줄이 따로 있다. 그래서 PC 표에서만 이 감싸개를 씌운다.
   ⚠ 위(top:0)가 아니라 «아래(bottom:0)»에 붙인다 — 표 머리(.cotbl thead th)가 이미
     top:0 로 붙어 있어, 위에 붙이면 「전체 고르기」 네모와 칸 이름이 가려진다.
   ⚠ position:sticky 는 흐름 «안»에 제 자리를 그대로 차지한다. 맨 아래까지 내려가면
     쪽넘김(coPagerHtml) «아래»에 내려앉으므로, 마지막 줄도 쪽넘김도 덮지 않는다.
     떠 있는 막대(position:fixed)로 만들면 그 둘을 가려 따로 여백을 대야 한다. */
.cosellift{position:sticky;bottom:0;z-index:30;padding:10px 0 8px;
  background:linear-gradient(to top,#f3f5f9 66%,rgba(243,245,249,0))}
.cosellift .coselbar{margin:0;box-shadow:0 2px 12px rgba(24,95,165,.18)}
/* 고른 회사 줄은 끌 수 있다 — 손 모양으로 알린다(안 고른 줄은 draggable 이 안 붙는다) */
.corow[draggable="true"]{cursor:grab}
.corow.codragging{opacity:.45}
/* 회사를 떨어뜨릴 폴더 줄 — 순서선(.ord-dragover)·명함 놓기(.dropover)와 «다른 표시»다.
   셋이 같은 줄에 걸리므로 눈으로도 갈라져 보여야 무엇이 일어날지 알 수 있다.
   ⚠ #pcSide 를 앞에 둔다 — 그냥 .folderrow.codrop 이면 뒤에 오는 .pcitem:hover 의
     바탕색에 눌린다(끌어다 놓는 순간은 늘 hover 상태다). */
#pcSide .folderrow.codrop{outline:2px solid #60a5fa;background:#33457a}
/* ⚠ 폴더 안의 ＃탭 모양(#pcSide .coftab/.coftabadd)은 없앴다 — 탭은 이제 옆줄이 아니라
     윗줄(#pcErpTabs)에 명함·사업자의 탭 칩과 «같은 모양»으로 나온다(대표 지시 2026-08-17). */
/* 기업 상세 나눠 보기 — 「몇 개씩」 칸과 쪽 옮기기 (명함 표의 #pcPageSize·#pcPager 와 같은 결) */
.copgbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 8px;font-size:12.5px;color:#5a6885}
.copgbar .cnt b{color:#1d4fc4}
.copgbar .sp{flex:1}
.copgsize{border:1px solid #dde3ee;background:#fff;border-radius:8px;padding:5px 9px;
  font-family:inherit;font-size:12.5px;color:#33415e;cursor:pointer}
.copager{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px;
  font-size:13.5px;color:#5a6885}
.copager button{border:1px solid #dde3ee;background:#fff;border-radius:8px;padding:7px 13px;
  font-family:inherit;font-weight:700;color:#33415e;cursor:pointer}
.copager button[disabled]{background:#f1f4fa;color:#b6bfd2;cursor:default}
.cofdtab{font-size:12.5px;color:#8b98b3;padding:6px 12px;border-radius:8px;cursor:pointer}
.cofdtab.on{font-weight:700;color:#1d4fc4;background:#eef3fc}
/* ★ I5 — 밝은 바탕(#f7f9fc)에 사업 이름 <b> 가 색 없이 얹혀, 폰에서는 --ink(흰색)를
   물려받아 회색 설명줄과 파란 「가져오기」 사이에서 **이름만 안 보였다.** PC 는
   #folderDlg 가 .modal 이라 body.pc .modal{color:#1b2536} 이 덮어 주고 있었으므로,
   같은 #1b2536 을 쓴다 — PC 모양은 그대로다. */
.erpimport-row{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;background:#f7f9fc;border-radius:9px;cursor:pointer;color:#1b2536}
.erpimport-row:hover{background:#eef3fc}
.corow .tg{font-size:11px;background:#f3e8ff;color:#6b21a8;border:1px solid #d8b4fe;border-radius:9px;padding:1px 8px;font-weight:700}
.coq{width:100%;box-sizing:border-box;border:1px solid #dbe3f0;border-radius:10px;padding:10px 12px;font-size:13.5px;font-family:inherit;margin:0 0 12px}
.coq:focus{outline:0;border-color:#1d4fc4}
.colist{border:1px solid #e6ebf4;border-radius:11px;background:#fff;overflow:hidden}
/* 명함첩 목록과 같은 결 — 한 줄에 한 회사, 왼쪽에 네모와 번호 */
.cotbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e6ebf4;border-radius:11px;table-layout:fixed}
.cotbl thead th.cosort{cursor:pointer;user-select:none}
.cotbl thead th.cosort:hover{background:#eef3fc;color:#1d4fc4}
.cotbl thead th{position:sticky;top:0;background:#f8fafc;font-size:12px;color:#7c89a6;text-align:left;
  padding:9px 12px;border-bottom:1px solid #e6ebf4;font-weight:700;z-index:1}
.cotbl td{padding:10px 12px;border-bottom:1px solid #f1f4f9;font-size:13.5px;color:#33415e;vertical-align:middle}
.cotbl tbody tr:last-child td{border-bottom:0}
.cotbl .num{color:#9aa6bf;font-size:12px;text-align:right}
.cotbl .bz{color:#5b6784;font-size:12.5px;white-space:nowrap}
.cotbl .mgr{color:#5b6784;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 상호가 길어도 칸을 밀지 않는다 — 밀리면 뒤 칸들이 화면 끝으로 달아난다 */
.cotbl .conm{overflow:hidden}
.cotbl .conm .nm{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.corow{cursor:pointer}
.corow:hover{background:#f6f9ff}
.corow .nm{font-weight:800;color:#1a2540}
.corow .ty{font-size:11px;background:#e6f1fb;color:#185fa5;border:1px solid #b5d4f4;border-radius:9px;padding:1px 8px;font-weight:700}
.corow .bits{display:flex;gap:6px;flex-wrap:wrap}
.corow .bits i{font-style:normal;font-size:11.5px;background:#f2f5fa;color:#5b6784;border-radius:7px;padding:2px 8px}
/* 빠진 것은 눈에 띄어야 한다 — 288곳 중 어디에 서류가 비었는지 지금은 알 길이 없다 */
.corow .bits i.miss{background:#fee2e2;color:#991b1b}
.corow .mgr{margin-left:auto;font-size:11.5px;color:#5b6784;white-space:nowrap}
.codet{border:1px solid #e6ebf4;border-radius:11px;background:#fff;padding:6px 13px 13px}
.codet .h{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #eef2f7;margin-bottom:6px}
.codet .h b{font-size:16px;color:#1a2540}
.codet .h .ty{font-size:11px;background:#e6f1fb;color:#185fa5;border:1px solid #b5d4f4;border-radius:9px;padding:1px 8px}
.cof{display:flex;gap:12px;padding:7px 2px;border-bottom:1px solid #f5f7fb;font-size:13.5px;align-items:flex-start}
.cof:last-child{border-bottom:0}
.cof span{flex:0 0 116px;color:#7c89a6;font-size:12.5px;padding-top:1px}
.cof b{flex:1;min-width:0;color:#1a2540;font-weight:600;word-break:break-all}
.cof.codoc{cursor:pointer;border-radius:7px;margin:0 -6px;padding-left:8px;padding-right:8px}
.cof.codoc:hover{background:#f2f6ff}
#pcRoot.sidehidden #pcSide{width:0;padding:0;overflow:hidden}
#sideToggle{position:fixed;top:14px;left:0;z-index:50;background:#1e2a47;color:#fff;border:none;border-radius:0 8px 8px 0;
  width:22px;height:42px;cursor:pointer;font-size:13px;display:none;align-items:center;justify-content:center;opacity:.85}
#pcRoot.sidehidden #sideToggle{display:flex}
.pclogo{font-size:18px;font-weight:800;color:#fff;margin-bottom:4px}
.pclogo span{display:block;font-size:11.5px;font-weight:400;color:#8fa0c4;margin-top:4px}
.pcsec{font-size:11.5px;color:#8fa0c4;letter-spacing:1px;margin:20px 4px 8px;display:flex;align-items:center;justify-content:space-between}
.pcsec button{color:#aebcdc;font-size:11.5px;border:1px dashed #3a4a73;border-radius:7px;padding:3px 8px}
.pcsec button:hover{color:#fff;border-color:#6d80ad}
.pcitem{display:flex;align-items:center;gap:6px;padding:9px 11px;border-radius:9px;font-size:13.5px;cursor:pointer;min-height:38px;line-height:1.2}
.pcitem>span{flex-shrink:0}
.pcitem .gname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 폴더가 많아도 한 화면에 — 행을 촘촘히, 목록만 따로 스크롤 */
.folderrow{padding:5px 9px!important;min-height:28px;font-size:13px}
#pcFolderList{max-height:44vh;overflow-y:auto;margin-bottom:2px}
#pcFolderList::-webkit-scrollbar{width:6px}
#pcFolderList::-webkit-scrollbar-thumb{background:#33457a;border-radius:3px}
/* 폴더 행 — 평소엔 건수, hover시 ⋮ 메뉴 (메일함 스타일) */
.folderrow .gcount{font-size:11.5px;color:#8fa0c4}
.folderrow .gmenu{display:none;cursor:pointer;padding:0 6px;font-size:16px;color:#aebcdc;font-weight:700}
.folderrow .gmenu:hover{color:#fff}
.folderrow:hover .gcount{display:none}
.folderrow:hover .gmenu{display:inline-block}
#folderMenu .fmi{padding:10px 14px;font-size:13.5px;color:#33415e;cursor:pointer;border-radius:7px;white-space:nowrap}
#folderMenu .fmi:hover{background:#f1f4fa}
#folderMenu .fmi.danger{color:#c0392b}
/* 메일 폴더 창 — 머리줄과 「적어서 바로 끝내는」 칸 */
#folderMenu .fmhead{padding:9px 14px 7px;font-size:12.5px;color:#8b98b3;font-weight:700;
  border-bottom:1px solid #eef2f7;margin-bottom:5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:230px}
#folderMenu .fmhead span{font-weight:400;color:#a8abb2}
#folderMenu .fmform{display:flex;gap:6px;padding:4px 8px 8px}
/* 옮길 폴더가 스물여덟이라 창을 넘긴다 — 창 안에서 굴러가게 둔다 */
#folderMenu .fmlist{max-height:min(58vh,420px);overflow-y:auto}
#folderMenu .fmform input{flex:1;min-width:0;border:1px solid #dde3ee;border-radius:7px;
  padding:7px 9px;font-size:13px;font-family:inherit}
#folderMenu .fmform button{flex:none;border:none;background:#2563d1;color:#fff;
  border-radius:7px;padding:0 12px;font-size:13px;font-family:inherit;cursor:pointer}
/* 열 깔때기 팝업에서 지금 고른 값을 짚어 준다 — 어느 값으로 걸러 놨는지 모르고
   또 눌러 헷갈리면 안 된다 */
#folderMenu .fmi.on{background:#eef3fc;color:#1d4fc4;font-weight:700}
#folderMenu .fmn{float:right;margin-left:16px;color:#9aa6bf;font-size:12px;font-weight:400}
#folderMenu .fmi.on .fmn{color:#1d4fc4}
/* 표 머리의 열 깔때기 — 정렬 화살표(▾▴)와 헷갈리지 않게 다른 모양(▽)을 쓴다 */
.cofunnel{margin-left:5px;font-size:10px;color:#c3cddf;cursor:pointer;padding:2px 3px;border-radius:4px}
.cofunnel:hover{background:#e6ecf7;color:#5b6784}
.cofunnel.on{color:#1d4fc4;font-weight:700}
.movefolder{display:flex;align-items:center;gap:10px;padding:13px 16px;font-size:14.5px;color:#1e2a47;
  border:1px solid #e4e8f0;border-radius:10px;cursor:pointer;background:#fff;transition:all .12s}
.movefolder:hover{background:#eef3fb;border-color:#3a4a73}
.movefolder .mfic{font-size:17px}
.pcitem:hover{background:#27365c}
/* 「보낸 사람」 접는 줄 — 사람이 늘어도 왼쪽이 이름으로 가득 차지 않게 접어 둔다 */
/* 이름표는 한 줄로 — 「보낸 사 람」처럼 접히면 무슨 말인지 알아보기 어렵다 */
.pcfold{color:#c8d3ea;white-space:nowrap}
.pcfold .ic{width:11px;flex:none;color:#8fa0c4;font-size:10px}
.pcfold .who{margin-left:auto;font-size:10.5px;color:#8fa0c4;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcfold.open .who{display:none}
.pcitem.on{background:#33457a;color:#fff;font-weight:700}
.pcitem span{margin-left:auto;font-size:11.5px;background:#33457a;border-radius:99px;padding:2px 8px}
.pcitem.on span{background:#4a5e9c}
.pcitem.dropover{outline:2px dashed #7e95d0}
.pchintside{font-size:11.5px;color:#7e8db3;line-height:1.7;padding:4px 8px}
#pcMain{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
/* 오른쪽 분류 패널 — 왼쪽과 같은 240px, 더 연한 색 */
#pcRight{width:240px;flex-shrink:0;background:#eef2fb;color:#33415e;border-left:1px solid #dde3ee;overflow-y:auto;padding:18px 14px}
#pcRight .rsec{font-size:11.5px;color:#7c89a6;letter-spacing:1px;margin:4px 4px 10px;font-weight:700}
#pcRight .radd{display:flex;gap:6px;margin-bottom:12px}
#pcRight .radd input{flex:1;min-width:0;padding:8px 10px;border:1px solid #cfd8e8;border-radius:8px;background:#fff;font-size:13px}
#pcRight .radd button{flex-shrink:0;background:#3a4a73;color:#fff;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700}
#pcRight .ritem{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:9px;font-size:13.5px;cursor:pointer;background:#fff;border:1px solid #e1e8f4;margin-bottom:6px}
#pcRight .ritem:hover{border-color:#9db0d8;background:#f7faff}
#pcRight .ritem.on{background:#dde7fb;border-color:#9db0d8;font-weight:700;color:#1e2a47}
#pcRight .ritem .cnt{margin-left:auto;font-size:11.5px;color:#8b98b3}
#pcRight .ritem .edit{margin-left:6px;font-size:12px;color:#9db0d8;padding:2px 5px;border-radius:6px}
#pcRight .ritem .edit:hover{background:#e1e8f4;color:#3a4a73}
#pcRight .ritem.dropover{outline:2px dashed #5a76c0;background:#dde7fb}
#pcRight .rhint{font-size:11.5px;color:#90a0c0;line-height:1.7;padding:6px 4px}
#pcTop{display:flex;gap:12px;padding:16px 24px;background:#fff;border-bottom:1px solid #eef2f7;align-items:center}
/* 오른쪽 끝 묶음 — margin-left:auto 로 밀어 붙인다. 검색칸이 8cm 로 고정이라
   가운데 남는 자리를 이 묶음이 먹지 않게 flex 로 늘리지 않는다. */
#pcTopRight{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
#pcTopRight .logoutTimer{font-size:11.5px;font-weight:700;color:#7a4a00;background:#fdf1dc;
  border:1px solid #f0d4a0;border-radius:6px;padding:4px 8px;white-space:nowrap}
#pcLogout{background:#fff;color:#33415e;border:1px solid #dde3ee;border-radius:10px;
  padding:9px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
#pcLogout:hover{background:#fdeced;border-color:#f0b8bc;color:#a3262c}
/* 검색칸은 화면 끝까지 늘리지 않는다 — 대표 요청(2026-08-08).
   회사명처럼 긴 말도 치므로 8cm. 남는 자리는 목록이 쓴다.
   좁은 화면에서는 화면을 넘지 않게 줄어든다. */
#pcSearchWrap{position:relative;flex:0 0 auto;width:8cm;max-width:calc(100% - 140px)}
/* ✕ — 글자가 있을 때만 보인다. 없을 때도 보이면 누를 게 없어 헷갈린다. */
#pcSearchX{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:none;
  border:none;background:none;color:#8b98b3;font-size:15px;line-height:1;cursor:pointer;
  padding:6px 8px;border-radius:8px}
#pcSearchX:hover{background:#eef2f7;color:#1b2536}
#pcSearchWrap.has #pcSearchX{display:block}
#pcSearch{width:100%;padding:11px 34px 11px 38px;border:1px solid #e8ecf3;border-radius:12px;font-size:14px;
  background:#f7f9fc url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="%238b98b3" viewBox="0 0 16 16"><path d="M11.7 10.3a6 6 0 1 0-1.4 1.4l3 3 1.4-1.4-3-3zM6 10a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg>') 12px center no-repeat}
#pcSearch:focus{outline:none;border-color:#1e2a47;background-color:#fff}
.pcbtn-primary{background:#1e2a47;color:#fff;border-radius:12px;padding:11px 18px;font-size:13.5px;font-weight:600}
.pcbtn-primary:hover{background:#2c3c66}
.pcbtn-ghost{background:#fff;border:1px solid #dde3ee;border-radius:10px;padding:10px 14px;font-size:15px;color:#5a6885}
/* 상단 한 줄: 제목 · 탭 · 도구 (좁으면 뒤쪽 도구부터 다음 줄로 내려감) */
#pcHead{display:flex;align-items:center;gap:10px;padding:16px 22px 6px;flex-wrap:wrap}
#pcHead h2{font-size:19px;color:#1b2536;white-space:nowrap;flex:none}
#pcHead em{font-style:normal;font-size:13px;color:#8b98b3;font-weight:400}
#pcErpTabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
/* 기업 상세도 «윗줄에 탭» — 명함·사업자와 같은 자리다(대표 지시 2026-08-17:
   "탭생성은 명함이나 사업자와 같이 나와야 되는데").
   ⚠ #pcErpTabs 는 #pcHead «안»에 있다. 기업 상세에서 머리줄을 통째로 숨기면 탭 줄도
     같이 사라지므로, 머리줄은 남기고 명함 목록 전용인 제목·보기도구만 여기서 접는다. */
#pcHead.cohead>h2,#pcHead.cohead>#pcTools{display:none}
#pcTools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#pcSort{margin-left:auto;padding:8px 12px;border:1px solid #e8ecf3;border-radius:11px;background:#fff;color:#1b2536}
/* 걸어 둔 「담당 노무사」 띠 — 안 보이면 왜 몇 건만 나오는지 모른다 */
.mgrchip{display:inline-flex;align-items:center;gap:5px;background:#eaf4ec;border:1px solid #bfdcc6;
  color:#1c5f36;border-radius:11px;padding:7px 8px 7px 12px;font-size:12.5px;font-weight:600}
.mgrchip b{font-weight:800}
.mgrchip .x{cursor:pointer;color:#4a7a58;padding:0 5px;border-radius:7px;font-weight:700}
.mgrchip .x:hover{background:#d6ebdb;color:#0f3f21}
.pctool{background:#fff;border:1px solid #e8ecf3;border-radius:11px;padding:8px 14px;font-size:13px;cursor:pointer;color:#33415e;transition:.15s;display:inline-flex;align-items:center;gap:5px}
.pctool:hover{background:#f6f8fc;border-color:#d9e0ee}
.pctool.on{background:#eef4ff;border-color:#bcd0f2;color:#1e2a47;font-weight:600}
#pcPageSize,#pcSort{border:1px solid #e8ecf3;border-radius:11px;padding:8px 10px;font-size:13px;color:#33415e;background:#fff;cursor:pointer}
#pcMgrFilter{border:1px solid #e8ecf3;border-radius:11px;padding:8px 10px;font-size:13px;color:#33415e;background:#fff;cursor:pointer;max-width:145px}
.pchint{font-size:12.5px;color:#8b98b3;padding:6px 22px 10px}
/* 선택 도구 — 목록을 밀지 않게 화면 아래에 띄운다 (대표 승인 2026-08-08).
   예전에는 표 위에 한 줄이 끼어들어, 방금 고른 줄이 아래로 밀려 눈에서 사라졌다.
   자주 쓰는 넷만 겉에 두고 나머지는 ⋯ 안에 넣는다 — 특히 삭제를 「선택 해제」
   옆에 두면 잘못 누르기 쉬워 한 겹 안으로 넣었다. */
#pcSel{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
  display:flex;justify-content:center;pointer-events:none}
#pcSel .bar{pointer-events:auto;display:flex;align-items:center;gap:6px;background:#fff;
  border:1px solid #d7dfec;border-radius:999px;padding:7px 9px 7px 15px;font-size:13px;color:#1b2536;
  box-shadow:0 6px 24px rgba(20,30,60,.18);max-width:94vw;overflow-x:auto}
#pcSel .bar b{white-space:nowrap;font-size:13px}
#pcSel .bar .sep{width:1px;height:18px;background:#e4e8f0;flex:none;margin:0 2px}
#pcSel .bar button{flex:none;border:1px solid #e4e8f0;background:#fff;border-radius:9px;
  padding:6px 11px;font-size:12.5px;font-weight:600;color:#1b2536;white-space:nowrap}
#pcSel .bar button:hover{background:#f2f6fc;border-color:#c3d0e6}
#pcSel .bar button.red{color:#c0392b;border-color:#f0c9c4}
#pcSel .bar button.icon{border:none;padding:6px 9px;font-size:15px;color:#8b98b3}
#pcSel .bar button.icon:hover{background:#eef2f7;color:#1b2536}
#pcTableWrap{flex:1;overflow:auto;padding:0 22px 26px}
/* ── 본문 전체를 차지하는 화면들도 «스스로» 내려갈 수 있어야 한다 ──
   #pcMain 은 세로 flex 이고 overflow:hidden 이다. 명함 표는 #pcTableWrap 에 flex:1 +
   overflow:auto 가 있어 그 안에서 내려갔는데, 나중에 붙은 네 화면(환경설정·자료함·
   기업 상세·메일)에는 그것이 «없었다». 그래서 창보다 길면 아래가 그냥 잘렸다 —
   기업 상세는 창 900px 에 내용 2,188px 이라 3분의 2가 안 보였다(대표 2026-08-16).
   ⚠ min-height:0 이 꼭 있어야 한다. flex 자식은 기본이 min-height:auto 라 «내용만큼»
     최소 높이를 가져, overflow:auto 를 줘도 줄어들지 않아 스크롤이 안 생긴다. */
#pcSettings,#pcMat,#pcCo,#pcMail{flex:1 1 auto;min-height:0;overflow:auto}
/* 끌어서 여러 개 고르기 (2026-08-17) — 끄는 동안 글자가 잡히면 파랗게 번져 무엇을 고르는지 안 보인다 */
body.dragselling{user-select:none;-webkit-user-select:none;cursor:cell}
td.selcell{cursor:cell}
#pcTable tr.pkon>td{background:#eef3fc}
#pcTable{width:100%;border-collapse:collapse;background:#fff;border:1px solid #eef2f7;border-radius:12px;table-layout:fixed}
#pcTable thead th{position:relative}
.colresize{position:absolute;right:-6px;top:0;bottom:0;width:12px;cursor:col-resize;z-index:5;display:flex;align-items:center;justify-content:center}
.colresize::after{content:'';width:2px;height:55%;background:#cfd6e6;border-radius:2px;transition:background .12s,height .12s}
.colresize:hover::after{background:#3a4a73;height:80%}
#pcTable thead th:hover .colresize::after{background:#aab6cf}
#pcTable thead th.col-dragging{opacity:.4}
#pcTable thead th.col-dragover{box-shadow:inset 3px 0 0 #3a4a73}
/* 끌어서 순서 바꾸기 — 표의 열 드래그(.col-dragging/.col-dragover)와 같은 결로 맞춘다.
   가로 목록(메인 탭)은 세로줄, 세로 목록(폴더)은 가로줄로 「여기에 놓입니다」를 보인다.
   ⚠ 선은 «앞에 꽂힘(.ord-dragover)»과 «뒤에 꽂힘(.ord-dragover-after)» 두 가지다 —
     뒤쪽이 없으면 맨 끝자리에 놓을 길이 아예 없다(끝에 놓는 것을 눈으로 못 보여 준다).
     둘은 절대 같이 붙지 않는다(onOrdDragOver 가 하나만 남긴다). */
.ord-dragging{opacity:.45}
.ord-dragover{box-shadow:inset 0 3px 0 -1px #1d4ed8}
.ord-dragover-after{box-shadow:inset 0 -3px 0 -1px #1d4ed8}
#pcErpTabs .ord-dragover{box-shadow:inset 3px 0 0 -1px #1d4ed8}
#pcErpTabs .ord-dragover-after{box-shadow:inset -3px 0 0 -1px #1d4ed8}
[draggable="true"].pcitem,[draggable="true"].folderrow{cursor:grab}
#pcTable thead th{position:sticky;top:0;background:#f8fafc;font-size:12px;color:#7c89a6;text-align:left;
  padding:12px 14px;border-bottom:1px solid #eef2f7;font-weight:600;z-index:1}
#pcTable td{padding:12px 14px;border-bottom:1px solid #f1f4f9;font-size:13.5px;color:#33415e;vertical-align:middle;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* 한 줄 고정 + 말줄임 */
#pcTable tbody tr{cursor:pointer}
#pcTable tbody tr:hover{background:#f6f9ff}
/* 이메일 칸 — 눌러서 메일 쓰기로 간다는 것이 보여야 누른다 */
#pcTable a.mailto{color:#1d4fc4;text-decoration:none}
#pcTable a.mailto:hover{text-decoration:underline;color:#123d92}
#pcTable .nm{font-weight:800;color:#16223c;white-space:nowrap}
#pcTable .co{color:#0c7a64;font-weight:600}
/* 번호 칸: 좌우 여백(14px×2)이 칸 너비보다 커서 '9..'처럼 잘리던 문제 — 여백을 줄이고 오른쪽 정렬 */
#pcTable .num{color:#9aa6c0;font-size:12px;padding-left:4px;padding-right:8px;text-align:right;overflow:visible}
#pcTable .dt{color:#8b98b3;font-size:12.5px;white-space:nowrap;text-align:right}
/* 눌러서 겹친 명함을 볼 수 있다 — 눌릴 것처럼 보여야 누른다(밑줄+손가락) */
/* ── 담당 칸 (컴팩트) ──
   대표 지시 2026-08-11: "이상하게 정리되었다. 간단하게 보일 수 있도록, 컴팩트하게".
   배지가 넷까지 쌓여 158px 칸에서 두세 줄로 접혔다. **한 줄 고정**으로 두고
   이름 배지만 글자로 남기고 나머지는 한 글자로 줄인다(원래 말은 마우스로).
   ⚠ nowrap 이 이 칸의 핵심이다 — 풀면 다시 줄이 늘어난다. */
#pcTable td.mgcell{white-space:nowrap;text-align:right;line-height:1.5}
/* 유형+담당 노무사 — 유일하게 글자로 남는 배지 */
#pcTable .mgb{display:inline-block;border-radius:7px;padding:1px 6px;font-size:11px;font-weight:700;
  white-space:nowrap;border:1px solid transparent}
#pcTable .mgb.hit{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
#pcTable .mgb.t-adv  {background:#eaf0fd;color:#1e40af;border-color:#c3d3f7}
#pcTable .mgb.t-pay  {background:#e9f6ec;color:#166534;border-color:#bfe0c8}
#pcTable .mgb.t-union{background:#f1ecfd;color:#6d28d9;border-color:#d6c8f8}
#pcTable .mgb.t-fund {background:#fdf3e3;color:#92400e;border-color:#f0d5a8}
#pcTable .mgb.t-agent{background:#e7f5f3;color:#0f766e;border-color:#bde0dc}
#pcTable .mgb.t-etc  {background:#eef1f6;color:#475569;border-color:#dde3ee}
/* 부담당 수 — 「+1」. 이름을 다 적으면 칸이 다시 넘친다 */
#pcTable .mgx{font-size:10px;color:#8b98b3;margin-left:2px;cursor:help}
/* 역할 한 글자 — 대(대표자) 담(담당자) 실(실무담당) */
#pcTable .mgr{display:inline-block;border-radius:5px;padding:0 4px;font-size:10px;font-weight:700;
  margin-left:3px;cursor:help;border:1px solid transparent}
#pcTable .mgr.r-ceo {background:#e0e7ff;color:#3730a3;border-color:#c3cbfb}
#pcTable .mgr.r-con {background:#dcfce7;color:#166534;border-color:#a9ebc0}
#pcTable .mgr.r-work{background:#fef3c7;color:#92400e;border-color:#f7dd93}
/* 계약해지 — 문패 하나. 무슨 뜻인지는 마우스를 올리면 나온다.
   ⚠ 색을 안 주면 칸의 회색을 물려받아 눈에 안 걸린다 — 계약이 끝난 업체는 보여야 한다. */
#pcTable .mgq{font-size:11px;margin-left:3px;cursor:help;color:#c0392b}
/* 값이 어긋난 칸 알림 (대표 지시 2026-08-24) — 종료 배지와 나란히 선다 */
.mgw{font-size:11px;margin-left:3px;cursor:help;color:#b8860b}
.coclash{border:1px solid #f0dfae;background:#fffdf5;border-radius:9px;padding:9px 11px;margin:0 4px 7px}
.coclash .ck{font-size:12px;font-weight:700;color:#8a6d1f;margin-bottom:4px}
.coclash .cv{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.coclash .cnow{color:#5a6885}
.coclash .cnew{color:#1b2536;font-weight:700}
.coclash .cm{font-size:11.5px;color:#9aa6bf;margin-top:5px}
/* 어느 회사에도 안 붙은 기업정보 알림 (대표 지시 2026-08-24, 2순위) */
.coorphbar{margin:0 0 10px;padding:10px 13px;border:1px solid #f0dfae;background:#fffdf5;
  border-radius:9px;font-size:12.5px;color:#8a6d1f;cursor:pointer}
.coorphbar:hover{background:#fff9e8}
.coorphbar em{font-style:normal;color:#1d4fc4;margin-left:4px}
.coorph{padding:10px 11px;border-bottom:1px solid #f2f5fa}
.coorph:last-child{border-bottom:none}
.coorph .ok{font-size:13px;font-weight:700;color:#1b2536}
.coorph .obz{font-weight:400;color:#8b98b3;font-size:11.5px;margin-left:6px}
.coorph .ov{font-size:12px;color:#5a6885;margin-top:3px}
.coorph .osame{font-size:12px;color:#1a55b0;margin-top:4px}
.coorph .om{margin-top:4px}
.coorph .om em{font-style:normal;color:#1d4fc4;font-size:11.5px;cursor:pointer}
/* 기업 상세(데스크톱 표·폰 목록·상세 패널)에서도 같은 배지를 쓴다(대표 지시 2026-08-24) —
   자리마다 감싸는 칸 이름이 달라(.cotbl·상세 패널·느슨한 .row) 범위를 안 좁힌다.
   ⚠ 위의 #pcTable 것을 지우지 않는다 — 「계약해지 문패는 색을 갖는다」 검사가 그
     자리를 짚어 본다. */
.mgq{font-size:11px;margin-left:3px;cursor:help;color:#c0392b}
#pcTable .dup{color:#d8432e;font-size:12px;font-weight:700;margin-left:3px;cursor:pointer}
#pcTable .dup:hover{background:#fdecea;border-radius:5px}

/* ── 겹친 명함 정리 팝업 ── */
.dupok{background:#eaf6ee;border:1px solid #bfe0cb;color:#1c5f36;border-radius:9px;
  padding:9px 12px;font-size:12.5px;line-height:1.7}
.dupwarn{background:#fdf3e3;border:1px solid #f0d5a8;color:#8a5a10;border-radius:9px;
  padding:9px 12px;font-size:12.5px;line-height:1.75}
.dupok b,.dupwarn b{font-weight:800}
.dupwrap{margin:11px 0 0;overflow-x:auto;border:1px solid #dde3ee;border-radius:9px}
/* ⚠ 팝업 바탕은 어둡다. 표는 밝은 종이라 **글자색을 반드시 밝은 쪽에 맞춰 적어야** 한다.
   안 적으면 팝업의 흰 글자를 물려받아 흰 종이에 흰 글자가 된다(실제로 그랬다). */
.duptbl{border-collapse:collapse;width:100%;font-size:12.5px;background:#fff;color:#1b2536}
.duptbl th,.duptbl td{padding:7px 10px;border-bottom:1px solid #eef1f6;text-align:left;
  vertical-align:top;word-break:break-all;color:#1b2536}
.duptbl thead th{background:#f7f9fc;border-bottom:1px solid var(--line);white-space:nowrap}
.duptbl thead th label{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#33415e;cursor:pointer}
.duptbl thead th span{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-top:2px}
.duptbl th.k,.duptbl td.k{width:92px;min-width:92px;color:var(--sub);font-weight:600;
  background:#fbfcfe;border-right:1px solid #eef1f6}
.duptbl td i{color:#b9c1d1;font-style:normal}
/* 남길 것으로 고른 열은 세로로 표시가 이어져야 눈이 따라간다 */
.duptbl .keep{background:#f3f7ff}
.duptbl thead th.keep{background:#e8f0ff}
/* 값 상태 — 색이 판단을 대신한다 */
.duptbl tr.s-same td{color:#7b8798}
.duptbl tr.s-same td.k{color:#a8b2c6}

#pcTable .pcempty{text-align:center;color:#8b98b3;padding:60px;font-size:14px;white-space:normal}
/* PC에서 모달·시트는 밝은 테마로
   ★ 색상 변수까지 밝은 테마로 덮어써야 한다 — 기본 팔레트는 어두운 화면용(--ink=흰색)이라
     흰 배경 팝업에서 var(--ink) 글자가 '흰 글자 + 흰 배경'이 되어 안 보였음
   ★ 환경설정 화면(#pcSettings)도 같은 이유로 새어 들어온다 — 정리·탭 목록이 팝업이 아니라
     설정 화면 안에(#setInline) 그대로 펼쳐질 때는 .modal 밖이라 이 변수를 못 받아
     제목 옆 이름·설명 글자가 흰 배경에 흰 글자로 안 보이고 있었다. */
body.pc .modal,body.pc #pcSettings{
  --ink:#1b2536; --sub:#5a6885; --green:#0f7a44; --red:#c0392b;
  --line:#e4e8f0; --bg2:#f7f9fc; --row:#fff;}
body.pc .modal{background:#fff;border-color:#e4e8f0;color:#1b2536}
body.pc .field label{color:#7c89a6}

body.pc .btn.ghost{background:#eef1f6;color:#1b2536}
body.pc .sheetbtn{color:#1b2536}
body.pc .sheetbtn:active,body.pc .sheetbtn:hover{background:#f1f4fa}
body.pc .photo-pane{background:#f7f9fc;border-color:#e4e8f0}
body.pc .ditem{border-color:#eef1f6}
body.pc .ditem .v a{color:#0c7a64}
body.pc .dname,body.pc .mhead b{color:#16223c}

/* PC 오른쪽 상세 패널 (리멤버식) */
#pcDetail{position:fixed;top:0;right:0;width:420px;max-width:90vw;height:100vh;background:#fff;

body.pc #pcDetail{display:flex}
#pcDetail.open{transform:translateX(0)}
/* 폰 너비 — 옆에 붙는 패널이 아니라 전체화면 시트로 (대표 승인 A안, 2026-08-15).
   body.pc 가 아니어도 .open 이 붙으면 보이게 display:none 을 직접 뒤집는다.
   ★ 최종 전체 리뷰(2026-08-16) M2 — body.pc 를 가르지 않아, PC 창을 760px 아래로
     좁히기만 해도 오른쪽 패널이 전체화면으로 바뀌었다. 폰(body 에 pc 가 없을 때)에만
     적용한다 — 화면 너비가 아니라 「어느 UI 인가」가 기준이다. */
@media(max-width:760px){

<script>

const FB_APPCHECK_KEY = '6Ldu1hEtAAAAABB9lH9EMEyd7uBLEy9H5HxJoua_'; // ERP와 동일 reCAPTCHA v3 키
/* ⚠ App Check 를 끈 채로 둔다 (2026-08-14).
   자동화 브라우저로 이 화면을 열 때마다 reCAPTCHA 검증이 실패했고, 반복되자 구글이
   사이트키 자체를 잠시 막아 사무실에서도 로그인이 안 되는 사고로 이어졌다.
   대표가 Firebase 콘솔에서 직접 확인한 결과 Realtime Database·Storage·Authentication

   ★ 콘솔에서 App Check 강제를 켤 때는 아래를 true 로 되돌려야 한다.

var FB_APPCHECK_ON = false;
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyDkZz5QlKSoqMOYByp5YGeMNLNDrIghliA',

  /* ⚠ 서울(asia-northeast3) 창고다 — 기본 창고(pureun-erp.firebasestorage.app)는

const DB_ROOT = 'pucards';
/* 개인 창고 — 규칙이 auth.uid === $uid 로 막는다. 잠근 본인만 읽고 쓸 수 있다.

const PRIV_ROOT = 'pucards_private';
let myUid = '';
function privRoot(){ return myUid ? (PRIV_ROOT + '/' + myUid) : ''; }

/* ── 개인 폴더를 열었을 때 함께 보이는 목록 ──

   자체가 이미 개인이라는 뜻이라 기록에 남길 이유가 없다. */
function isPrivGroup(g){ return !!(g && state.priv.groups[g.id]); }
function isPrivItem(it){ return !!(it && state.priv.items[it.id]); }
function allItems(){
  return state.privOpen ? Object.assign({}, state.items, state.priv.items) : state.items;
}
function allGroups(){
  return state.privOpen ? Object.assign({}, state.groups, state.priv.groups) : state.groups;
}
/* ⚠ 2026-08-17 — AI 열쇠를 브라우저에 두지 않는다(서버가 든다).

   꺼내 갈 수 있고, 옛 코드가 되살아나면 그것부터 쓴다. */
try { localStorage.removeItem('pucards_gemini_key'); } catch (_) { }

/* ══════ 🔒 잠금 폴더(개인 전용) ══════

   푸른이알피 계약창·업체관리 등 다른 프로그램에서 당겨올 수 없다. */
let myEmail = '';
const lockOwnerOf = g => String((g&&g.lockOwner)||'').toLowerCase();
/* 내가 볼 수 있는 폴더인가 (잠긴 폴더는 잠근 본인만) */
function canSeeGroup(g){
  if(!g || !g.locked) return true;
  const own = lockOwnerOf(g);
  if(!own) return true;                 /* 예전에 주인 없이 잠근 폴더는 기존대로 */
  return !!myEmail && own === myEmail;
}
/* 이 명함이 '남의 잠긴 폴더'에 있는가 → 목록·공유목록에서 제외 */
function inHiddenLocked(it){
  const g = state.groups[(it&&it.group)||''];
  return !!g && !!g.locked && !canSeeGroup(g);
}
/* 잠긴 폴더의 명함인가 (주인 여부와 무관) → 공유 검색목록에서 항상 제외 */
function inLockedGroup(it){
  const g = state.groups[(it&&it.group)||''];
  return !!g && !!g.locked;
}
/* ⚠ 2026-08-17 — 열쇠를 실시간DB 에서 가져오던 두 칸(_sharedGKey·_portalGKey)을 없앴다.
   그 자리(pucards/config/geminiKey · data/app_config/geminiKey)는 규칙상
   **로그인한 모든 직원이 읽는다.** 이제 열쇠는 서버만 안다. */
/* 바깥 부름에 시간 제한 — 답이 안 오면 fetch 는 영영 기다린다.
   여기서 막히면: 창고에서 사진 받기가 안 끝나고, 명함 판독이 굳고,
   「AI 연결 확인 중…」 은 알림만 사라진 채 아무 말도 안 해 준다.
   ⚠ 끊긴 것과 그냥 실패한 것을 갈라 준다 — 다음에 할 일이 다르다.
   ⚠ 넘겨받은 옵션은 고치지 않고 복사해서 signal 만 더한다.
   ※ 이 함수는 앞쪽 script 에 있지만 전역이라 뒤 script 에서도 쓸 수 있다. */
var PC_WAIT_MS = 60000;
function pcFetch(url, opts, ms){
  opts = opts || {};
  var wait = ms || PC_WAIT_MS;
  if(typeof AbortController === "undefined") return fetch(url, opts);
  var ac = new AbortController();
  var timer = setTimeout(function(){ ac.abort(); }, wait);
  var o = {};
  for(var k in opts){ if(Object.prototype.hasOwnProperty.call(opts, k)) o[k] = opts[k]; }
  o.signal = ac.signal;
  return fetch(url, o).then(function(r){ clearTimeout(timer); return r; }, function(e){
    clearTimeout(timer);
    if(e && e.name === "AbortError"){
      var t = new Error(Math.round(wait/1000) + "초 안에 답이 오지 않았습니다 — 잠시 뒤 다시 해 주세요");
      t.timeout = true; throw t;
    }
    throw e;
  });
}
/* ⚠ 2026-08-17 — **열쇠를 브라우저로 안 가져온다.** 서버가 들고 있다.
   예전에는 여기서 실시간DB 의 열쇠를 읽어 왔는데, 그 자리는 규칙상
   **로그인한 모든 직원이 읽는다** — 꺼내 개인 용도로 써도 요금은 회사에 붙었다.
   ⚠ 그래서 `geminiKey()` 도 없앴다. 남겨 두면 「열쇠가 있나」로 AI 켜짐을
     판정하는 코드가 되살아나고, 그러면 다시 열쇠를 읽게 된다.
   이제 판정 기준은 **로그인했는가** 다 — 로그인하면 서버가 대신 불러 준다. */
function aiReady(){
  try { return !!(firebase.auth() && firebase.auth().currentUser); }
  catch(_){ return false; }
}

/* ══════ 경량 검색 인덱스(pucards/idx) — 푸른이알피 계약창에서 회사·담당자 검색용 ══════
   사진 없이 이름·회사·전화만 담아 가볍게 유지(전체 1MB 이하). 저장/삭제 시 함께 갱신. */
function idxRecord(it){
  if(!it) return null;
  const r={}; const put=(k,v)=>{ v=(v==null?'':String(v)).trim(); if(v) r[k]=v; };
  put('n', it.name); put('c', it.company); put('m', it.mobile); put('t', it.tel);
  put('e', it.email); put('ti', it.title); put('d', it.dept); put('ct', it.companyTel);
  put('ad', it.kind==='biz' ? it.address : it.companyAddr);
  /* 팩스·홈페이지 — 명함에 적혀 있는데 색인에 없어서 푸른이알피가 못 가져왔다.
     개인팩스(fax)와 회사팩스(companyFax)를 따로 담는다 (다른 번호다). */
  put('fx', it.fax); put('cfx', it.companyFax); put('w', it.website);
  if(it.kind==='biz'){
    put('bz', it.bizno); put('ceo', it.ceo);
    /* 업태·종목·법인번호 — 계약관리·업체관리에 그대로 들어가는 칸이라 함께 담는다 */
    put('bt', it.bizType); put('bi', it.bizItem); put('cno', it.corpno);
  }
  r.k = (it.kind==='biz') ? 'biz' : 'card';
  if(!r.n && !r.c && !r.bz) return null;   /* 검색에 쓸 정보가 없으면 기록 안 함 */
  return r;
}
/* ══════ 번호로 한 칸에 찾아가는 자리 (pucards/bykey) ══════
   사진첩은 명함을 찍을 때마다 "이미 있는 사람인가"를 묻는다. 예전에는 그때마다
   검색목록(idx) **전부**를 내려받아 6천 줄을 훑었다 — 한 장에 1MB 가까이,
   여러 장 찍으면 그만큼 되풀이. 폰에서 느리고 데이터도 그만큼 쓴다.

   그래서 번호를 열쇠로 삼아 한 칸만 읽으면 되게 한다.
     pucards/bykey/c01028024601 = 명함번호   (명함 → 휴대폰)
     pucards/bykey/b1234567890  = 명함번호   (사업자등록증 → 사업자번호)
   앞의 c/b 는 종류다. 안 붙이면 열 자리 사업자번호와 지역번호 전화가 한 칸을
   두고 다툰다.

   ⚠ 이 자리는 **틀려도 되는 자리다.** 읽는 쪽(사진첩)이 찾아간 명함의 번호를
     다시 맞춰 보고, 다르면 못 찾은 것으로 친다. 그래서 옛 열쇠가 남아 있어도
     엉뚱한 사람에게 명함이 붙지 않는다. 이 규칙 덕분에 '번호를 고칠 때 옛 열쇠를
     지우는' 까다로운 처리를 하지 않아도 된다. */
const BYKEY = 'bykey';
const BYKEY_FLAG = 'config/bykeyAt';   /* 이 자리가 채워졌다는 표시 — 없으면 사진첩은 옛 방식으로 찾는다 */
function byKeyOf(it){
  if(!it) return '';
  const d = v => String(v==null?'':v).replace(/\D/g,'');
  if(it.kind==='biz'){ const b=d(it.bizno); return b ? 'b'+b : ''; }
  const m = d(it.mobile); return m ? 'c'+m : '';
}
function writeIdx(it){
  try{ if(Store.mode!=='firebase' || !it || !it.id) return;
    /* 🔒 잠긴 폴더의 명함은 공유 검색목록에 넣지 않는다 (다른 프로그램에서 당겨오기 차단) */
    const r = inLockedGroup(it) ? null : idxRecord(it);
    if(r) Store.db.ref(DB_ROOT+'/idx/'+it.id).set(r);
    else Store.db.ref(DB_ROOT+'/idx/'+it.id).remove();
    const k = byKeyOf(it);
    if(k){
      const ref = Store.db.ref(`${DB_ROOT}/${BYKEY}/${k}`);
      if(r) ref.set(it.id); else ref.remove();
    }
  }catch(_){}
}
/* 지울 때는 명함 내용을 함께 받는다 — 번호를 알아야 그 열쇠를 치울 수 있다.
   못 받아도 괜찮다(읽는 쪽이 번호를 다시 맞춰 보므로 남은 열쇠는 헛것이 된다). */
function removeIdx(id, it){
  try{ if(Store.mode!=='firebase') return;
    Store.db.ref(DB_ROOT+'/idx/'+id).remove();
    const k = byKeyOf(it);
    if(k) Store.db.ref(`${DB_ROOT}/${BYKEY}/${k}`).remove();
  }catch(_){}
}

/* ══════ 검색목록 다시 만들기 ══════
   색인은 명함을 '저장할 때만' 갱신된다. 그래서 색인에 담는 항목을 늘려도
   이미 있던 명함들은 옛 색인을 그대로 갖고 있어, 푸른이알피에서 새 항목(팩스 등)이
   안 딸려온다. 이 기능이 전체를 한 번 다시 써 준다.
   한 장씩 쓰면 6천 번 통신하므로 한 번의 update 로 몰아 보낸다. */
async function rebuildIdxAll(){
  if(Store.mode!=='firebase'){ toast('클라우드에 연결된 상태에서만 됩니다'); return; }
  const items = Object.values(state.items||{}).filter(x=>x && x.id);
  if(!items.length){ toast('명함이 없습니다'); return; }
  if(!confirm(`검색목록을 다시 만듭니다 — 명함 ${items.length.toLocaleString()}장.\n\n`
    + `푸른이알피(계약·업체·사건·컨설팅)에서 명함을 당겨올 때\n`
    + `팩스·홈페이지·업태·종목처럼 새로 담게 된 항목이 채워집니다.\n\n`
    + `명함 자체는 하나도 바뀌지 않습니다. 진행할까요?`)) return;
  const upd = {}; let put=0, skip=0;
  items.forEach(it=>{
    const r = inLockedGroup(it) ? null : idxRecord(it);
    upd[it.id] = r;                      /* null 이면 그 줄이 지워진다 (잠긴 폴더·정보 없음) */
    if(r) put++; else skip++;
  });
  try{
    await Store.db.ref(DB_ROOT+'/idx').update(upd);
    await writeByKeyMap(items);          /* 번호 열쇠도 같이 — 둘이 어긋나면 사진첩이 헛것을 본다 */
    toast(`✅ 검색목록 다시 만들었습니다 — ${put.toLocaleString()}장`
      + (skip ? ` (잠긴 폴더·정보 없음 ${skip.toLocaleString()}장 제외)` : ''));
  }catch(e){
    toast('❌ 실패: ' + ((e&&e.message)||'알 수 없음'));
  }
}

/* 번호 열쇠 자리를 통째로 쓴다. 한 장씩 쓰면 6천 번 통신하므로 한 번의 update 로.
   잠긴 폴더 명함은 넣지 않는다 — 검색목록에서 빼 놓고 여기에 두면 그 자리로
   되짚어 갈 수 있다(같은 규칙: writeIdx·rebuildIdxAll).
   맨 끝에 '채워졌다' 표시를 남긴다. 이 표시가 있어야 사진첩이 새 방식으로 찾는다 —
   표시가 없는데 새 방식으로 찾으면 못 찾은 줄 알고 있는 사람을 또 만든다. */
async function writeByKeyMap(items){
  const map = {};
  (items||[]).forEach(it=>{
    if(!it || !it.id || inLockedGroup(it)) return;
    const k = byKeyOf(it); if(k) map[k] = it.id;
  });
  await Store.db.ref(`${DB_ROOT}/${BYKEY}`).set(map);
  await Store.db.ref(`${DB_ROOT}/${BYKEY_FLAG}`).set(Date.now());
  return Object.keys(map).length;
}
/* 아직 한 번도 안 채워졌으면 조용히 한 번 채운다.
   명함첩은 이미 명함 전부를 들고 있으므로 새로 읽을 것이 없다 — 쓰기 한 번이면 끝이다.
   여럿이 동시에 해도 같은 값을 쓰므로 다투지 않는다. */
async function ensureByKeyMap(){
  try{
    if(Store.mode!=='firebase') return;
    const items = Object.values(state.items||{}).filter(x=>x && x.id);
    if(items.length < 1) return;
    const s = await Store.db.ref(`${DB_ROOT}/${BYKEY_FLAG}`).once('value');
    if(s.val()) return;
    await writeByKeyMap(items);
  }catch(_){}
}

/* 자문·급여·노조·기금·사무대행 탭을 '전체 명함/전체 사업자등록증'에 1회 생성.

function seedErpTabs(){
  try{
    if(Store.mode!=='firebase') return;
    if(localStorage.getItem('pucards_erptabs_v1')) return;
    ['card','biz'].forEach(kind=>{
      ERP_TYPES.forEach((t,i)=>{
        const dup=Object.values(state.views||{}).find(v=>v&&(v.kind||'card')===kind
          &&(v.scope||'all')==='all'&&((v.f||{}).erpFilter)===t);
        if(dup) return;
        const f={ q:'', group:'all', owner:'all', region:'', erpFilter:t, colFilter:{},
          onlyPhone:false, onlyEmail:false, onlyIncomplete:false, onlyPrivate:false, onlyDup:false,
          sort:'date', sortKey:null, sortDir:'desc' };
        const v={ id:uid(), name:t, kind, scope:'all', order:1000+i, f };
        Store.putView(v); state.views[v.id]=v;
      });
    });
    localStorage.setItem('pucards_erptabs_v1','1');
    try{ render(); }catch(_){}
  }catch(e){ console.warn('[seedErpTabs]', e&&e.message); }
}

    if(localStorage.getItem('pucards_bizfolders_v1')) return;

    const hasBiz = nm => Object.values(state.groups).some(g=>g && ((g.kind||'card')==='biz') && _canon(g.name)===nm);

function backfillIdx(){
  try{
    if(Store.mode!=='firebase' || Store._idxDone) return;
    Store._idxDone=true;
    const items=Object.values(state.items||{}); if(!items.length){ Store._idxDone=false; return; }
    Store.db.ref(DB_ROOT+'/idx').once('value').then(s=>{
      const existCount=Object.keys(s.val()||{}).length;
      if(existCount >= items.length*0.9) return;   /* 이미 대부분 있으면 스킵 */
      const all={};
      items.forEach(it=>{ if(it&&it.id&&!inLockedGroup(it)){ const r=idxRecord(it); if(r) all[it.id]=r; } });
      Store.db.ref(DB_ROOT+'/idx').set(all)
        .then(()=>console.log('[idx] 백필 완료', Object.keys(all).length))
        .catch(e=>console.warn('[idx] 백필 실패', e&&e.message));
    }).catch(()=>{});
  }catch(_){}
}

       restoreLastScreen() → openMailPage() 가 한다 — 여기서 읽으면 두 벌이 된다. */
  view: (function(){ try{
    return /(^|[?&])view=mail(&|$)/.test(location.search) ? 'mail' : 'list';

/* ── 데이터 계층 ── */
/* 명함 한 장을 고칠 때 수천 장 전체를 다시 받지 않도록 항목 단위로 동기화한다.
   최초 자료량은 같지만 이후 전송량은 실제로 바뀐 한 건에 가깝게 줄어든다. */
function watchCardMap(ref, assign, settled, denied){
  const map={}; let timer=null;
  const publish=()=>{
    assign(map);
    clearTimeout(timer);
    timer=setTimeout(()=>{ if(settled) settled(); },140);
  };
  const put=s=>{ map[s.key]=s.val(); publish(); };
  const drop=s=>{ delete map[s.key]; publish(); };
  ref.on('child_added',put,denied);
  ref.on('child_changed',put,denied);
  ref.on('child_removed',drop,denied);
  ref.limitToFirst(1).once('value').then(s=>{ if(!s.exists()) publish(); }).catch(e=>{ if(denied) denied(e); });
  return ()=>{
    clearTimeout(timer);
    try{ ref.off('child_added',put); ref.off('child_changed',put); ref.off('child_removed',drop); }catch(_){ }
  };
}

  _rootOf(id){ return (state.priv && state.priv.items && state.priv.items[id]) ? privRoot() : DB_ROOT; },
  put(it){ it.updatedAt = Date.now();

    else { state.items[it.id]=it; coListBust(); this._ls(); render(); } },
  /* ── 삭제 = 휴지통으로 이동 (30일 보관) ──
     ⚠ **원본 사진을 휴지통 기록에 복사하지 않는다**(2026-08-13 비용 조사).
        예전에는 `_photo`/`_photo2` 에 원본을 base64 로 통째 넣었다. 그런데 휴지통은
        `.on('value')` 로 통째 구독하는 자리라, **명함첩을 열 때마다 30일치 원본을
        전부 내려받았다.** 8/1~8/11 청구서에서 실시간DB 내려받기가 ₩28,833(전체의 93%)
        이었고 이것이 큰 몫이다.
     그래서 사진은 **있던 자리에 그대로 둔다**(창고 pucards/photos, 썸네일 thumbs).
     지우는 것은 30일 뒤 영구삭제(hardDel) 가 맡는다 — 휴지통의 뜻과도 맞는다.
     ⚠ 옛 기록(_photo 가 든 것)도 그대로 복원된다 — 아래 restore 가 둘 다 받는다. */
  async del(id){
    const priv = !!(state.priv && state.priv.items && state.priv.items[id]);
    const it = priv ? state.priv.items[id] : state.items[id]; if(!it) return;
    /* 썸네일은 items 밖에 있다 — 휴지통 목록에 그림이 보여야 하므로 이것만 챙긴다
       (장당 약 20KB. 원본은 장당 수 MB 라 성격이 다르다) */
    const th1 = it.thumb || await this.getThumb(id).catch(()=>'');
    const th2 = it.thumb2 || await this.getThumb(id+'_b').catch(()=>'');
    const rec = { ...it, thumb: th1||'', thumb2: th2||'', _deletedAt: Date.now() };
    if (this.mode==='firebase'){
      /* ★ 개인 명함은 개인 휴지통으로. 공용 휴지통은 직원 누구나 읽으므로,
         그리로 보내면 숨겨 둔 것이 지우는 순간 드러난다. */
      const R = priv ? privRoot() : DB_ROOT;
      await this.db.ref(`${R}/trash/${id}`).set(rec);
      /* ⚠ 사진·썸네일은 **안 지운다**. 지우면 휴지통에서 복원해도 빈 사진이 온다. */
      this.db.ref(`${R}/items/${id}`).remove();
      if (!priv) removeIdx(id, it);  /* 개인 명함은 애초에 검색목록에 없다 */
    } else {
      const t=JSON.parse(localStorage.getItem('pucards_local_trash')||'{}'); t[id]=rec;
      try{ localStorage.setItem('pucards_local_trash', JSON.stringify(t)); }catch(e){}
      state.trash[id]=rec;
      delete state.items[id]; coListBust(); this._ls(); render();
    }
  },
  /* 영구 삭제 (휴지통에서 완전 제거).
     ⚠ **여기서 사진·썸네일까지 지운다**(2026-08-13). 삭제 때 안 지우기로 했으므로
       여기서 안 지우면 창고에 영영 남아 용량만 먹는다. */
  hardDel(id){
    if (this.mode==='firebase'){
      this.delPhoto(id); this.delPhoto(id+'_b');
      this.delThumb(id); this.delThumb(id+'_b');
      this.db.ref(`${DB_ROOT}/trash/${id}`).remove();
    }
    else { const t=JSON.parse(localStorage.getItem('pucards_local_trash')||'{}'); delete t[id];
      localStorage.setItem('pucards_local_trash', JSON.stringify(t));
      this.delPhoto(id); this.delPhoto(id+'_b');
      delete state.trash[id]; render(); }
  },
  /* 휴지통에서 복원.
     ⚠ 새 기록은 사진이 **있던 자리에 그대로** 있으므로 되돌릴 것이 없다.
       옛 기록(_photo 가 든 것)만 창고로 되돌려 준다 — 그것까지 안 챙기면
       예전에 지운 명함을 복원했을 때 사진이 빈 채로 돌아온다. */
  async restore(id){
    let rec=null;
    if (this.mode==='firebase'){ const s=await this.db.ref(`${DB_ROOT}/trash/${id}`).once('value'); rec=s.val(); }
    else rec=(JSON.parse(localStorage.getItem('pucards_local_trash')||'{}'))[id];
    if(!rec) return;
    const photo=rec._photo, photo2=rec._photo2;
    const it={...rec}; delete it._deletedAt; delete it._photo; delete it._photo2;
    if(photo) this.putPhoto(id, photo);
    if(photo2) this.putPhoto(id+'_b', photo2);
    this.put(it);
    /* ⚠ hardDel 은 이제 사진까지 지운다 — 복원한 뒤에 부르면 방금 살린 사진을
       도로 지운다. 그래서 여기서는 **휴지통 기록만** 없앤다. */
    if (this.mode==='firebase') this.db.ref(`${DB_ROOT}/trash/${id}`).remove();
    else { const t=JSON.parse(localStorage.getItem('pucards_local_trash')||'{}'); delete t[id];
      localStorage.setItem('pucards_local_trash', JSON.stringify(t)); delete state.trash[id]; render(); }
  },
  /* ══════ 원본 사진 — 파일 창고(Storage)에 둔다 (대표 결정 2026-08-09) ══════
     예전에는 실시간DB(`pucards/photos/{id}`)에 base64 로 넣었다. 명함 4,400장이
     약 1.7GB 가 되어 **무료 한도 1GB 를 이것 하나로 넘겼고**, 2026-08-09 에 실제로
     한도 초과로 데이터베이스가 멈출 뻔했다. 창고로 옮기면 실시간DB 는 0.1GB 로 떨어진다.

     ⚠ 개인 폴더(pucards_private) 명함은 **실시간DB에 그대로 둔다.**
        창고 규칙에 그 자리를 안 열어 뒀다 — 열려면 규칙을 또 고쳐야 하고,
        개인 폴더는 몇 장뿐이라 용량에 영향이 없다. 규칙과 코드가 어긋나면
        조용히 저장에 실패하므로 **여기서 확실히 갈라 둔다.**

     ⚠ 읽기는 **창고 먼저, 없으면 실시간DB** 순이다. 옮기는 중에는 두 곳에 나뉘어
        있으므로 한쪽만 보면 사진이 사라진 것처럼 보인다. 다 옮긴 뒤에도 이 순서를
        그대로 둔다 — 옮기다 만 것이 남아 있어도 화면은 멀쩡하다. */
  photoCache:{},
  /* 이 사진을 창고에 두는가 — 개인 폴더가 아니고, 실시간 공유 모드일 때만 */
  _inBucket(id){
    return this.mode==='firebase' && this._rootOf(String(id).replace(/_b$/,'')) === DB_ROOT;
  },
  _photoRef(id){ return firebase.storage().ref(`${DB_ROOT}/photos/${id}`); },
  async getPhoto(id){
    if (this.photoCache[id]!==undefined) return this.photoCache[id];
    let p='';
    if (this.mode==='firebase'){
      /* ① 창고 — 옮긴 것은 여기 있다. 없으면(404) 조용히 ②로 넘어간다. */
      if (this._inBucket(id)) {
        try { p = await this._fetchFromBucket(id); } catch(e){ p=''; }
      }
      /* ② 실시간DB — 아직 안 옮긴 것과 개인 폴더 명함 */
      if (!p) { const s=await this.db.ref(`${this._rootOf(id.replace(/_b$/,''))}/photos/${id}`).once('value'); p=s.val()||''; }
    }
    else p=(JSON.parse(localStorage.getItem('pucards_local_photos')||'{}'))[id]||'';
    this.photoCache[id]=p; return p;
  },
  /* 창고에서 한 장을 data:URL 로 받아 온다. 화면·판독·내려받기가 모두 data:URL 을
     기대하고 있어(예전 저장 방식) 그 모양을 그대로 맞춰 준다 — 부르는 쪽을 안 고친다. */
  async _fetchFromBucket(id){
    const url = await this._photoRef(id).getDownloadURL();
    const res = await pcFetch(url);
    if (!res.ok) throw new Error('창고 응답 ' + res.status);
    const blob = await res.blob();
    return await new Promise((ok,no)=>{ const r=new FileReader();
      r.onload=()=>ok(String(r.result||'')); r.onerror=()=>no(r.error); r.readAsDataURL(blob); });
  },
  /* 창고에 올린다. 실패하면 **예외를 그대로 올린다** — 부르는 쪽이 실시간DB로
     물러설지 정한다. 조용히 삼키면 사진이 어디에도 없는 채로 끝난다. */
  async _putToBucket(id, dataUrl){
    await this._photoRef(id).putString(String(dataUrl), 'data_url');
  },
  putPhoto(id,dataUrl){ this.photoCache[id]=dataUrl;
    if (this.mode==='firebase'){
      if (this._inBucket(id)) {
        /* 창고에 올리고, 실패하면 실시간DB로 물러선다 — 사진을 잃는 것보다 낫다.
           (물러선 것은 나중에 옮기기 도구가 다시 창고로 보낸다) */
        return this._putToBucket(id, dataUrl).catch(e=>{
          console.warn('[명함첩] 창고 저장 실패 — 실시간DB로 보관합니다', e && e.message);
          return this.db.ref(`${DB_ROOT}/photos/${id}`).set(dataUrl);
        });
      }
      return this.db.ref(`${this._rootOf(id.replace(/_b$/,''))}/photos/${id}`).set(dataUrl);
    }
    const m=JSON.parse(localStorage.getItem('pucards_local_photos')||'{}'); m[id]=dataUrl;
    try{ localStorage.setItem('pucards_local_photos', JSON.stringify(m)); }
    catch(e){ toast('데모 모드 용량 초과 — 원본 사진을 모두 보관하지 못합니다'); } },
  delPhoto(id){ delete this.photoCache[id];
    if (this.mode==='firebase'){
      /* 두 곳 다 지운다 — 옮기다 만 것이 한쪽에 남아 되살아나면 안 된다.
         없는 것을 지우는 것은 오류가 아니므로 실패는 흘려보낸다. */
      if (this._inBucket(id)) this._photoRef(id).delete().catch(()=>{});
      this.db.ref(`${this._rootOf(id.replace(/_b$/,''))}/photos/${id}`).remove();
      return;
    }
    const m=JSON.parse(localStorage.getItem('pucards_local_photos')||'{}'); delete m[id];
    localStorage.setItem('pucards_local_photos', JSON.stringify(m)); },
  /* ── 목록용 썸네일도 본문과 분리 저장 (thumbs/) ──
     items 는 `.on('value')` 로 통째 구독한다. 썸네일(장당 약 20KB)이 그 안에 있으면
     명함첩을 열 때마다 4,400장 전부를 받는다(약 90MB). 밖으로 빼서 **화면에 보이는 것만**
     받는다. 읽은 것은 items 에 되꽂아 두어(thumbCache→it.thumb) 나머지 화면들은 그대로 쓴다. */
  thumbCache:{},
  async getThumb(id){
    if (this.thumbCache[id]!==undefined) return this.thumbCache[id];
    let t='';
    if (this.mode==='firebase'){ const s=await this.db.ref(`${this._rootOf(id.replace(/_b$/,''))}/thumbs/${id}`).once('value'); t=s.val()||''; }
    else t=(JSON.parse(localStorage.getItem('pucards_local_thumbs')||'{}'))[id]||'';
    this.thumbCache[id]=t; return t;
  },
  putThumb(id,dataUrl){ this.thumbCache[id]=dataUrl;
    if (this.mode==='firebase') this.db.ref(`${this._rootOf(id.replace(/_b$/,''))}/thumbs/${id}`).set(dataUrl);
    else { const m=JSON.parse(localStorage.getItem('pucards_local_thumbs')||'{}'); m[id]=dataUrl;
      try{ localStorage.setItem('pucards_local_thumbs', JSON.stringify(m)); }catch(e){} } },
  delThumb(id){ delete this.thumbCache[id];
    if (this.mode==='firebase') this.db.ref(`${this._rootOf(id.replace(/_b$/,''))}/thumbs/${id}`).remove();
    else { const m=JSON.parse(localStorage.getItem('pucards_local_thumbs')||'{}'); delete m[id];
      try{ localStorage.setItem('pucards_local_thumbs', JSON.stringify(m)); }catch(e){} } },
  /* 내 탭(저장된 조건) — 전 직원 공유. 명함을 건드리지 않고 보기 조건만 저장 */
  putView(v){ if (this.mode==='firebase') this.db.ref(`${DB_ROOT}/views/${v.id}`).set(v);
    else { state.views[v.id]=v; this._lsViews(); render(); } },
  delView(id){ if (this.mode==='firebase') this.db.ref(`${DB_ROOT}/views/${id}`).remove();
    else { delete state.views[id]; this._lsViews(); render(); } },
  _lsViews(){ try{ localStorage.setItem('pucards_local_views', JSON.stringify(state.views||{})); }catch(e){} },
  /* 분류 규칙 — 전 직원 공유. 명함을 건드리지 않고 '어떤 단어면 어느 폴더로' 만 담는다 */
  putRule(r){ if (this.mode==='firebase') this.db.ref(`${DB_ROOT}/classifyRules/${r.key}`).set(r);
    else { state.rules[r.key]=r; this._lsRules(); render(); } },
  delRule(key){ if (this.mode==='firebase') this.db.ref(`${DB_ROOT}/classifyRules/${key}`).remove();
    else { delete state.rules[key]; this._lsRules(); render(); } },
  _lsRules(){ try{ localStorage.setItem('pucards_local_rules', JSON.stringify(state.rules||{})); }catch(e){} },
  putGroup(g){ if (this.mode==='firebase') this.db.ref(`${DB_ROOT}/groups/${g.id}`).set(g);
    else { state.groups[g.id]=g; this._ls(); render(); } },
  delGroup(id){ Object.values(state.items).forEach(it=>{ if(it.group===id){ it.group=''; this.put(it);} });
    if (this.mode==='firebase') this.db.ref(`${DB_ROOT}/groups/${id}`).remove();
    else { delete state.groups[id]; this._ls(); render(); } }
};

/* 푸른이알피 업체관리의 업체 유형 (COMPANY_TYPE_SEED와 동일하게 유지) */
const ERP_TYPES = ['자문','급여','노조','기금','사무대행'];

/* ══════ 🏢 ERP 거래처 담당자 매칭 ══════
   푸른 ERP(업체관리)의 회사·담당자를 읽어와, 명함의 회사명/사업자번호가 맞으면
   "푸른담당: OOO" 배지를 보여준다. 거래처에서 전화가 오면 ERP를 따로 검색하지 않고
   담당 노무사를 바로 확인할 수 있다. (포털·ERP와 같은 Firebase 세션 공유) */
const ErpMatch = {
  ready:false, byBiz:{}, byName:{}, nameByEmail:{},
  _norm(s){ return String(s||'').toLowerCase()
      .replace(/㈜|\(주\)|주식회사|유한회사|유한책임회사|합자회사|합명회사|재단법인|사단법인|의료법인|\(재\)|\(사\)/g,'')
      .replace(/[\s\-_.,·・()[\]{}'"]/g,''); },
  _digits(s){ return String(s||'').replace(/[^0-9]/g,''); },
  _arr(snapVal){
    const v = snapVal && snapVal.v !== undefined ? snapVal.v : snapVal;
    if (Array.isArray(v)) return v;
    if (v && typeof v==='object') return Object.keys(v).map(k=>v[k]).filter(Boolean);
    return [];
  },
  load(){
    if (Store.mode!=='firebase' || typeof firebase==='undefined' || !firebase.database) return;
    Promise.all([
      firebase.database().ref('data/user_dir').once('value'),
      firebase.database().ref('data/companies').once('value'),
    ]).then(([du,dc])=>{
      const dir = ErpMatch._arr(du.val()), cos = ErpMatch._arr(dc.val());
      const nameBySid = {};
      dir.forEach(u=>{ if(u&&u.sid) nameBySid[u.sid]=u.name||u.sid; });
      /* 로그인 계정 → 직원 이름. 보낸 메일에 「p001」 대신 「권형하」가 나오게 한다
         (대표 지시 2026-08-10). 사번의 붙임표를 떼면 로그인 계정이 된다 —
         포털(enter.html sidToEmail)과 같은 규칙이어야 사람이 안 어긋난다. */
      const nameByEmail = {};
      dir.forEach(u=>{
        if(!u || !u.sid || !u.name) return;
        nameByEmail[String(u.sid).toLowerCase().replace(/-/g,'')+'@pureun.kr'] = u.name;
      });
      ErpMatch.nameByEmail = nameByEmail;
      const byBiz={}, byName={};
      cos.forEach(co=>{
        if(!co) return;
        const main = co.managerMain ? (nameBySid[co.managerMain]||co.managerMain) : '';
        const subs = (co.managerSubs||[]).map(s=>nameBySid[s]||s).filter(Boolean);
        /* 유형(자문/급여/노조/기금)·실무담당자명 — 담당 노무사가 없어도 유형 배지는 의미 있음 */
        /* 업체 퇴사(종료·이탈) 여부 — 업체관리 status가 종료/해지/비활성이면 left */
        const _st = String(co.status||'');
        /* 대표자·담당자 이름 수집 (연결·배지·불일치 점검용) */
        const _contactsRaw = [ ...((co.contacts||[]).map(c=>c&&c.name)), co.primaryContactName, co.contactName ].filter(Boolean);
        const rec = { company:co.name||'', main, subs,
          type: co.typeCode||'',
          status: _st,
          left: (_st==='inactive'||_st==='terminated'||_st==='closed'),
          contact: ErpMatch._norm(co.primaryContactName||co.contactName||''),
          ceoRaw: co.ceo||'', ceo2Raw: co.ceo2||'', contactsRaw: _contactsRaw,
          ceo: ErpMatch._norm(co.ceo||''), ceo2: ErpMatch._norm(co.ceo2||''),
          contacts: _contactsRaw.map(x=>ErpMatch._norm(x)).filter(Boolean),
          bizNo: co.bizNo||'' };
        if(!main && !subs.length && !rec.type && !rec.ceo && !rec.contacts.length) return;
        const b = ErpMatch._digits(co.bizNo); if(b.length>=10 && !byBiz[b]) byBiz[b]=rec;
        const n = ErpMatch._norm(co.name);    if(n && !byName[n]) byName[n]=rec;
      });
      ErpMatch.byBiz=byBiz; ErpMatch.byName=byName; ErpMatch.companies=cos; ErpMatch.ready=true;
      coListBust();
      try{ render(); }catch(_){}
      /* 자문사 폴더 자동 분류 — 명함 데이터가 늦게 로드될 수 있어 4초 뒤 한 번 더(멱등) */
      ErpMatch.autoFolder();
      setTimeout(()=>ErpMatch.autoFolder(), 4000);
    }).catch(e=>{ console.warn('[ErpMatch]', e&&e.message); });
  },
  /* 명함/사업자 항목 → 담당자 레코드 (없으면 null) */
  match(it){
    if (!ErpMatch.ready || !it) return null;
    const b = ErpMatch._digits(it.bizno);
    if (b.length>=10 && ErpMatch.byBiz[b]) return ErpMatch.byBiz[b];
    const n = ErpMatch._norm(it.company);
    if (n && ErpMatch.byName[n]) return ErpMatch.byName[n];
    return null;
  },
  /* 배지 짧은 텍스트: "김보람" 또는 "김보람 +2" */
  label(it){
    const m = ErpMatch.match(it); if(!m) return '';
    const primary = m.main || m.subs[0] || '';
    const extra = (m.main ? m.subs.length : m.subs.length-1);
    return extra>0 ? primary+' +'+extra : primary;
  },
  /* 담당자 전체 문자열: "주담당 김보람 · 부담당 홍길동" */
  full(it){
    const m = ErpMatch.match(it); if(!m) return '';
    const parts = [];
    if(m.main) parts.push('주담당 '+m.main);
    if(m.subs.length) parts.push('부담당 '+m.subs.join(', '));
    return parts.join(' · ');
  },
  /* ERP 업체 유형: '자문'|'급여'|'노조'|'기금'|'' */
  type(it){ const m = ErpMatch.match(it); return (m && m.type) || ''; },
  /* 이 명함을 맡은 노무사 **전부** — 주담당과 부담당을 한 줄에.
     ⚠ 걸러낼 때는 label() 을 쓰면 안 된다. 그것은 배지에 적을 짧은 글자라
       「김보람 +2」처럼 이름이 아닌 것이 섞이고, 부담당은 이름이 아예 빠진다 →
       부담당으로 맡은 업체가 걸러내기에서 통째로 사라진다. */
  mgrs(it){
    const m = ErpMatch.match(it); if(!m) return [];
    return [m.main].concat(m.subs||[])
      .map(v=>String(v==null?'':v).trim()).filter(Boolean);
  },
  /* 이 명함 주인이 그 업체의 실무 담당자로 등록돼 있는가 */
  isContact(it){
    const m = ErpMatch.match(it); if(!m || !m.contact) return false;
    const n = ErpMatch._norm(it.name); if(!n) return false;
    return m.contact === n || m.contact.indexOf(n) === 0;   /* '유석주이사' 같은 직책 붙은 표기 허용 */
  },
  /* 이 명함 주인이 그 업체의 ERP '대표자'인지 '담당자'인지 — 'ceo' | 'contact' | '' */
  _nameHit(a,b){ if(!a||!b) return false; return a===b || a.indexOf(b)===0 || b.indexOf(a)===0; },
  role(it){
    const m = ErpMatch.match(it); if(!m) return '';
    const n = ErpMatch._norm(it.name); if(!n) return '';
    if(ErpMatch._nameHit(m.ceo,n) || ErpMatch._nameHit(m.ceo2,n)) return 'ceo';
    if((m.contacts||[]).some(c=>ErpMatch._nameHit(c,n))) return 'contact';
    return '';
  },
  /* ERP 매칭 명함(자문·급여·노조·기금) → '업체관리' 폴더 자동 분류.
     유형별 구분은 메인화면 ERP 탭에서 관리. (구 자문사 폴더는 업체관리로 이름 변경,
     이전에 급여/기금/노조 폴더로 자동 배정된 명함은 업체관리로 1회 이동)
     - 폴더 미지정 명함만 (기존 수동 폴더 배정은 절대 안 건드림)
     - 한 번 자동 배정한 명함은 erpAutoFoldered 표시 → 사용자가 빼면 다시 안 넣음 */
  autoFolder(){
    try{
      if(!ErpMatch.ready) return;
      const items = Object.values(state.items||{});
      if(!items.length) return;
      /* 폴더는 명함용(card)·사업자용(biz)이 따로 — 이름이 같아도 서로 섞이지 않게 종류까지 맞춰 찾는다 */
      const kindOf = it => (it && it.kind==='biz') ? 'biz' : 'card';
      const gKind  = g  => (g && g.kind) || 'card';
      const byNmK = (nm,k) => Object.values(state.groups||{}).find(x=>x && _canon(x.name)===nm && gKind(x)===k);
      /* 구 '자문사' 폴더는 '업체관리'로 이름 변경 (1회, 명함용) */
      const oldA = byNmK('자문사','card'); if(oldA && !byNmK('업체관리','card')){ oldA.name='업체관리'; Store.putGroup(oldA); }
      /* 대상 폴더 지연 생성 (종류별) */
      const cache={};
      function ensure(nm,k){
        const ck=k+'|'+nm;
        if(cache[ck]) return cache[ck];
        let g = byNmK(nm,k);
        if(!g){ g={id:uid(), name:nm, kind:k, order:Date.now()}; Store.putGroup(g); state.groups[g.id]=g; }
        cache[ck]=g; return g;
      }
      /* 자동 관리 대상 폴더(여기 있으면 상태 변화에 따라 재배치 허용) */
      const AUTO_NAMES=['업체관리','업체퇴사','자문사','급여','기금','노조','사무대행'];
      const autoIds = new Set(Object.values(state.groups||{}).filter(g=>g&&AUTO_NAMES.indexOf(_canon(g.name))>=0).map(g=>g.id));
      /* ⚠ 예전에는 여기서 명함 한 장마다 Store.put(it) 을 불렀다. 그 한 번이 서버로 가는
         메시지 «세 개»다(items 한 번 + 공유 색인 idx·bykey 두 번). 명함 6,616장이면
         2만 개가 한꺼번에 나간다 — 그것도 화면을 열 때마다, 4초 뒤 한 번 더.
         2026-08-16 대표 콘솔에 1ms 간격으로 오류가 5,000건 넘게 쌓인 것이 이 규모다.
         한 건씩 보내지 않고 «모아서 한 번에» 보낸다.
         ⚠ 공유 색인(idx·bykey)은 손대지 않는다 — 색인에 담는 칸(idxRecord)에 폴더가
           없고, 자동 폴더는 잠긴 폴더가 아니라서 색인에 들어가고 빠지는 것이 바뀌지
           않는다. 바꾸지 않아도 되는 것을 쓰면 그만큼 메시지가 늘 뿐이다. */
      const pend = [];
      let n=0;
      items.forEach(it=>{
        if(!it) return;
        const m = ErpMatch.match(it);
        const matched = !!m && ERP_TYPES.indexOf(m.type)>=0;   /* 자문·급여·노조·기금·사무대행 */
        const targetNm = matched ? (m.left ? '업체퇴사' : '업체관리') : null;
        const k = kindOf(it);
        if(it.erpAutoFoldered){
          /* 자동 배정분: 현재 자동 폴더 안에 있을 때만 상태 따라 재배치 (사용자가 딴 폴더로 옮겼으면 존중) */
          if(targetNm && autoIds.has(it.group)){
            const tg = ensure(targetNm,k);
            if(it.group !== tg.id){ it.group=tg.id; it.updatedAt=Date.now(); pend.push(it); n++; }
          }
          return;
        }
        /* 미지정 + 매칭 → 대상 폴더로 자동 배정 */
        if((it.group||'')==='' && targetNm){
          const tg = ensure(targetNm,k);
          it.group=tg.id; it.erpAutoFoldered=1; it.updatedAt=Date.now(); pend.push(it); n++;
        }
      });
      if(pend.length) autoFolderFlush(pend);
      /* 비게 된 구 자동 폴더 정리 (명함용·사업자용 각각) */
      ['급여','기금','노조','자문사'].forEach(nm=>{
        ['card','biz'].forEach(k=>{
          const og = byNmK(nm,k); if(!og) return;
          if(!items.some(it=>it && it.group===og.id)){ try{ Store.delGroup(og.id); delete state.groups[og.id]; }catch(_){} }
        });
      });
      if(n>0){ toast('🗂 업체 폴더 자동 분류/이동 '+n+'건'); try{ render(); }catch(_){}}
    }catch(e){ console.warn('[autoFolder]', e&&e.message); }
  },
  /* 바뀐 폴더만 모아서 한 번에 저장한다.
     ⚠ 개인 폴더 명함은 창고가 다르다(Store._rootOf) — 창고별로 갈라 보낸다.
       한 통에 섞어 보내면 규칙이 다른 자리가 함께 걸려 통째로 거부된다.
     ⚠ 한 통을 무한정 키우지 않는다. 너무 크면 서버가 통째로 되돌려 보내고,
       그러면 어느 한 장 때문인지도 알 수 없게 된다. */
  _flushChunk: 400,
  flushPlan(list, rootOf, chunk){
    const byRoot = {};
    (list||[]).forEach(it=>{
      if(!it || !it.id) return;
      const R = rootOf(it.id);
      (byRoot[R] = byRoot[R] || []).push(it);
    });
    const out = [];
    Object.keys(byRoot).forEach(R=>{
      const arr = byRoot[R];
      for(let i=0;i<arr.length;i+=chunk){
        const upd = {};
        arr.slice(i, i+chunk).forEach(it=>{
          upd[`${R}/items/${it.id}/group`] = it.group;
          upd[`${R}/items/${it.id}/updatedAt`] = it.updatedAt;
          if(it.erpAutoFoldered) upd[`${R}/items/${it.id}/erpAutoFoldered`] = 1;
        });
        out.push(upd);
      }
    });
    return out;
  }
};
ErpMatch.autoFolderFlushImpl = function(list){
  if(Store.mode!=='firebase') return;
  const plan = ErpMatch.flushPlan(list, id=>Store._rootOf(id), ErpMatch._flushChunk);
  plan.forEach(upd=>{
    firebase.database().ref().update(upd)
      .catch(e=>console.warn('[autoFolder] 저장 실패', (e&&e.message)||e));
  });
  return plan.length;
};
function autoFolderFlush(list){ return ErpMatch.autoFolderFlushImpl(list); }

/* ══════ 옛 명함에 박힌 썸네일을 밖으로 빼내기 (대표 지시 2026-08-16) ══════
   items 는 `.on('value')` 로 통째 구독한다. 대표 기기에서 재 보니 items 4.92MB 중
   **2.48MB 가 썸네일**이었다 — 나머지 아홉 칸을 다 합쳐도 0.7MB 가 안 된다.
   `Store.put` 은 이미 저장할 때마다 썸네일을 `{root}/thumbs/{id}` 로 뺀다.
   **그 변경 뒤로 한 번도 저장된 적 없는 옛 명함만** 아직 안에 품고 있다.
   그러니 새 구조를 만드는 일이 아니라 **남은 것을 정해진 자리로 옮기는** 일이다.
   설계: docs/superpowers/specs/2026-08-16-썸네일-빼내기-design.md */

/* 옮길 값인가 — 문자열이면서 비어 있지 않을 때만.
   ⚠ 빈 문자열('')은 「사진 없는 명함」을 뜻하는 상태다(renderList 주석 ②).
     그것까지 지우면 화면이 없는 그림을 매번 받으러 간다. 세지도, 옮기지도 않는다. */
const _inlineThumbVal = v => (typeof v === 'string' && v) ? v : '';

/* ── ★ 이미 밖으로 나간 그림은 세지도, 옮기지도 않는다 ──
   ⚠ 목록(renderList)은 밖에 있는 그림을 받아 오면 **items 에 되꽂는다**
     (thumbFill: `if(it) it.thumb = t;` — 상세·확대·끌기 등 나머지 화면이 그대로 쓰게 하려는 것).
     그래서 몇 쪽만 내려도 «이미 옮긴 명함»이 «아직 안 옮긴 명함»과 똑같이 thumb 를 갖는다.
     그것까지 세면 대표가 보는 숫자가 부풀고, 할 일이 없는데도 단추가 뭔가 남은 것처럼
     보인다(대표 보고 2026-08-17: "캡쳐4 눌렀다. 뭐해야되는지 모르겠더라").
   가르는 표는 **Store.thumbCache** 다:
     · 되꽂기는 반드시 Store.getThumb() 를 지나고, getThumb 는 값을 thumbCache 에 남긴다.
     · 아직 안에 박혀 있는 그림은 renderList 가 it.thumb 를 그대로 쓰므로(상태 ①)
       getThumb 를 부를 일이 없다 → thumbCache 에 없다.
     · getThumb 를 부르는 나머지 자리(Store.del·개인폴더 옮기기)는 모두
       `it.thumb || await getThumb(...)` 라, 안에 박힌 그림이 있으면 아예 안 부른다.
     · Store.put 은 저장할 때 putThumb 로 캐시에 넣는다 — 그 명함의 그림도 이미 밖에 있다.
   앞면은 <id>, 뒷면은 <id>_b 로 따로 본다(캐시 열쇠가 그렇게 나뉘어 있다). */
function _thumbCacheNow(){
  return (typeof Store !== 'undefined' && Store && Store.thumbCache) ? Store.thumbCache : {};
}
/* 한 장에서 «정말 아직 안에 박혀 있는» 앞·뒷면만 골라낸다.
   ★ 세기(countInlineThumbs)와 계획(thumbMigrationPlan)이 **같은 이 함수**를 본다 —
     대표가 보는 숫자와 실제로 하는 일이 어긋나지 않게 하는 것이 핵심이다. */
function _inlineThumbsOf(it, cache){
  const c = (cache && typeof cache === 'object') ? cache : _thumbCacheNow();
  const t1 = _inlineThumbVal(it.thumb), t2 = _inlineThumbVal(it.thumb2);
  return {
    t1: (t1 && c[it.id]        === undefined) ? t1 : '',
    t2: (t2 && c[it.id + '_b'] === undefined) ? t2 : ''
  };
}

/* ── 1. 대상 세기 — 아무 것도 저장하지 않는다 ── */
function countInlineThumbs(items, cache){
  let n = 0, bytes = 0;
  Object.values(items||{}).forEach(it=>{
    if(!it || !it.id) return;
    const got = _inlineThumbsOf(it, cache);
    const t1 = got.t1, t2 = got.t2;
    if(!t1 && !t2) return;
    n++; bytes += t1.length + t2.length;
  });
  return { n:n, bytes:bytes };
}

/* ── 2. 무엇을 어느 경로에 쓸지 (순수 함수 — 여기서는 아무 것도 안 보낸다) ──
   ★ 한 장을 옮기는 것은 **한 번의 원자적 쓰기**다. 새 자리에 넣는 것과 옛 자리를
     비우는 것을 **같은 묶음**에 담는다 — 둘 다 되거나 둘 다 안 된다. 그래서
     그림이 어디에도 없는 중간 상태가 생기지 않는다. 「먼저 쓰고 나중에 지운다」는
     사이에서 끊기면 어느 쪽인지 알 수 없다.
   ⚠ `items/<id>` 를 **통째로 다시 쓰지 않는다.** `thumb` 칸만 null 로 지운다 —
     통째 쓰기는 그 사이 남이 고친 이름·전화를 되돌린다(2026-08-11 실제 사고).
   ⚠ 창고(root)별로 가른다. 공용(pucards)과 대표 개인 창고는 한 update() 에 못 섞는다.
   ⚠ 창고를 모르면(빈 문자열) 그 명함은 계획에서 뺀다 — 뿌리 없는 경로로 쓰면
     엉뚱한 자리에 그림이 떨어진다.
   ⚠ 이미 밖으로 나간 그림(thumbCache 에 있는 것)은 **세기와 똑같이** 뺀다 —
     세는 것과 하는 일이 다르면 "3,000장" 이라 해놓고 한 장도 안 옮기게 된다. */
function thumbMigrationPlan(items, rootOf, chunk, cache){
  const size = Math.max(1, Number(chunk) || 1);
  const rf = (typeof rootOf === 'function') ? rootOf : (()=>String(rootOf||''));
  const byRoot = {};
  Object.values(items||{}).forEach(it=>{
    if(!it || !it.id) return;
    const got = _inlineThumbsOf(it, cache);
    const t1 = got.t1, t2 = got.t2;
    if(!t1 && !t2) return;
    const R = String(rf(it.id) || '');
    if(!R) return;
    (byRoot[R] = byRoot[R] || []).push({ id:it.id, t1:t1, t2:t2 });
  });
  const out = [];
  Object.keys(byRoot).forEach(R=>{
    const arr = byRoot[R];
    for(let i=0;i<arr.length;i+=size){
      const upd = {};
      arr.slice(i, i+size).forEach(c=>{
        if(c.t1){ upd[`${R}/thumbs/${c.id}`]    = c.t1; upd[`${R}/items/${c.id}/thumb`]  = null; }
        if(c.t2){ upd[`${R}/thumbs/${c.id}_b`]  = c.t2; upd[`${R}/items/${c.id}/thumb2`] = null; }
      });
      out.push(upd);
    }
  });
  return out;
}

/* 방금 옮긴 묶음을 화면 쪽에도 반영한다 — 옮긴 그림을 thumbCache 에 넣어 두면
   지금 보고 있는 화면이 같은 그림을 다시 받으러 가지 않는다(①→③ 이 되어도 그대로 보인다).
   ★ 넣는 것을 **먼저** 다 하고 그 다음에 it.thumb 를 뗀다 — 순서가 바뀌면 그 사이에
     화면을 다시 그릴 때 빈 자리가 보인다. 돌려주는 값은 이 묶음이 옮긴 명함 장수. */
function applyThumbMigration(upd){
  const keys = Object.keys(upd||{});
  keys.forEach(k=>{
    const m = /\/thumbs\/([^/]+)$/.exec(k);
    if(m && upd[k]) Store.thumbCache[m[1]] = upd[k];
  });
  const done = {};
  keys.forEach(k=>{
    const m = /\/items\/([^/]+)\/(thumb2?)$/.exec(k);
    if(!m || upd[k] !== null) return;
    done[m[1]] = 1;
    const it = state.items[m[1]] || ((state.priv && state.priv.items) || {})[m[1]];
    if(it) delete it[m[2]];
  });
  return Object.keys(done).length;
}

/* 한 번에 50장씩. 한 장씩 보내면 수백 번의 쓰기가 몰려 서버가 막힌다
   (2026-08-16 자동 폴더 배정이 한 장씩 저장해 폭주한 전례). 묶음 사이에 숨을 돌린다. */
const THUMB_MIG_CHUNK = 50;
const THUMB_MIG_BREATH = 300;

/* ── 3. 옮기기 — 저절로 돌지 않는다. 대표가 누를 때만. ── */
async function migrateInlineThumbs(){
  if(!state.isAdmin){ toast('대표만 할 수 있습니다'); return null; }
  if(Store.mode!=='firebase'){ toast('클라우드에 연결된 상태에서만 됩니다'); return null; }
  const items = allItems();
  const c = countInlineThumbs(items);
  /* 아무 일도 안 일어난 것처럼 보이면 안 된다 — 왜 할 일이 없는지까지 말한다
     (대표 보고 2026-08-17: "눌렀다. 뭐해야되는지 모르겠더라"). */
  if(!c.n){ toast('밖으로 뺄 그림이 없습니다 — 옛 명함의 그림은 이미 다 옮겨져 있습니다 👍 (더 하실 일 없습니다)', 7000); return null; }
  const mb = (c.bytes/1024/1024).toFixed(1);
  if(!confirm(`옛 명함 ${c.n.toLocaleString()}장에 그림이 박혀 있습니다 (약 ${mb}MB).\n\n`
    + `밖으로 옮기면 명함첩을 열 때 그만큼 덜 받습니다.\n`
    + `그림은 그대로 보입니다 — 자리만 옮깁니다.\n\n진행할까요?`)) return null;
  const plan = thumbMigrationPlan(items, id=>Store._rootOf(id), THUMB_MIG_CHUNK);
  let done = 0;
  for(let i=0;i<plan.length;i++){
    try{
      await Store.db.ref().update(plan[i]);
    }catch(e){
      /* 묶음 하나가 실패하면 거기서 멈춘다. 이미 옮긴 것은 원자적으로 끝났으므로
         안전하고, 다시 누르면 남은 것만 다시 세어 이어서 한다. */
      try{ render(); }catch(_){}
      toast(`❌ ${done.toLocaleString()}장까지 옮기고 멈췄습니다 — 다시 누르면 남은 것부터 이어서 합니다`
        + ` (${(e&&e.message)||'알 수 없음'})`, 9000);
      return { done:done, total:c.n, stopped:true };
    }
    done += applyThumbMigration(plan[i]);
    if(i < plan.length-1){
      toast(`옮기는 중… ${done.toLocaleString()} / ${c.n.toLocaleString()}장`);
      await new Promise(r=>setTimeout(r, THUMB_MIG_BREATH));
    }
  }
  try{ render(); }catch(_){}
  toast(`✅ 다 끝났습니다 — 옛 명함 ${done.toLocaleString()}장의 그림(약 ${mb}MB)을 밖으로 옮겼습니다.`
    + ` 그림은 그대로 보이고, 이제 명함첩을 열 때 그만큼 덜 받습니다`, 9000);
  return { done:done, total:c.n, stopped:false };
}

/* ── 유틸 ── */

/* 폴더 이름 표준화 — 앞 번호("1." "01)" 등)와 공백을 무시해 자동폴더 이름을 인식 (예: "1. 업체관리" → "업체관리") */
const _canon = s => String(s||'').replace(/^\s*\d+\s*[.)\-]?\s*/,'').replace(/\s/g,'');

/* ══════ 자료 보내기 (제안서·계약서 서랍) ══════ */
let _sendMatId = null;

/* 자료·갈래·묶음·메일틀을 **한 번에** 읽는다. 따로 읽으면 갈래가 늦게 와서
   자료가 잠깐 '기타'로 보였다가 제자리로 튀는 것이 눈에 띈다. */
function loadMaterials(cb){
  const db = firebase.database();
  Promise.all([
    db.ref(DB_ROOT+'/materials').once('value'),
    db.ref(DB_ROOT+'/config/matCats').once('value'),
    db.ref(DB_ROOT+'/matSets').once('value'),
    db.ref(DB_ROOT+'/config/matMail').once('value')
  ]).then(([a,b,c,d])=>{
    _matMeta = a.val() || {};
    _matCats = b.val();                       /* null 이면 처음 세 갈래 */
    _matSets = c.val() || {};
    _matMail = d.val() || null;
    _matLoaded = true;
    if(cb) cb();
  }).catch(e=>{ console.warn('[materials]', e&&e.message);
    /* 못 읽었어도 '읽어 봤다'로 친다 — 안 그러면 아래 재진입 보호가 같은 실패를 무한히 되풀이한다 */
    _matLoaded = true;
    if(cb) cb(); });
}
/* ⚠ mode 를 반드시 함께 담는다. 저장할 때 이 값으로 config/matMail 을 통째로
   덮어쓰므로, 여기서 빠지면 제목을 한 번 고칠 때마다 「보내는 방법」이 초기화된다. */
function matMailCfg(){

}
function matList(){ return matSortList(Object.values(_matMeta).filter(m=>m&&m.id)); }
/* ══════ 제안서 틀 — 순수 로직 (테스트 대상) ══════
   기존 한글·PDF 문서를 고쳐 저장하는 것은 서식이 무너져 할 수 없다.
   대신 「틀 + 채울 값」으로 문서를 새로 만든다. 매번 회사명만 고쳐 보내던 일이 없어진다. */
const TPL_DEFAULT =
`{회사명} 귀중

인사노무 자문 제안서

1. 제안 개요
{회사명}의 인사노무 업무를 푸른노무법인이 맡아 수행하고자 합니다.
상시 근로자 {인원}명 기준으로 아래와 같이 제안드립니다.

2. 자문 범위
- 근로계약서·취업규칙 작성 및 검토
- 임금체계 설계 및 4대보험 신고 지원
- 노동관계 법령 상담 및 노무 리스크 점검
- 노동청 진정·조사 대응

3. 자문료
월 {금액}원 (부가세 별도)

4. 계약 기간
{기간}

제안 일자 : {날짜}
담당 노무사 : {담당자}

푸른노무법인
충남 천안시 서북구 원두정8길 6, 두정빌딩 3층
전화 041-556-0035`;

/* 틀에서 {…} 를 찾아 채울 칸 목록을 만든다. 같은 이름이 여러 번 나와도 한 번만 묻는다. */
function tplFields(body){
  const out=[], seen={};
  const hit = String(body||'').match(/\{[^{}\n]{1,20}\}/g) || [];
  hit.forEach(h=>{ const k=h.slice(1,-1).trim();
    if(k && !seen[k]){ seen[k]=1; out.push(k); } });
  return out;
}
/* 값을 채워 넣는다. 안 채운 칸은 표시를 그대로 두지 않고 비운다 —
   «{금액}» 이 찍힌 채로 고객에게 나가는 것이 가장 나쁘다. */
function tplFill(body, vals){
  return String(body||'').replace(/\{([^{}\n]{1,20})\}/g, (m,k)=>{
    const v = (vals||{})[String(k).trim()];
    return (v==null || v==='') ? '' : String(v);
  });
}
/* ══════ 자료함 — 순수 로직 (테스트 대상) ══════
   자료 갈래 · 검색 · 순서 · 묶음 · 메일 틀 · 보낸 기록.
   화면과 저장은 아래 「자료함 — 화면」부터다. 여기는 값만 다룬다.

   ⚠ 지켜야 할 것
   1. **「기타」는 늘 있고 지울 수 없다.** 갈래를 지웠을 때 그 안의 자료가 갈 곳이다.
      갈 곳이 없으면 자료가 어느 탭에도 안 보이고, 사람은 지워진 줄 안다.
   2. 갈래를 지우거나 이름을 바꿀 때 **자료의 cat 도 함께** 고친다.
      한쪽만 고치면 자료가 없는 갈래를 가리켜 목록에서 사라진다.
   3. 메일 틀의 채울 칸은 **없으면 빈 값**으로 둔다. 못 채운 칸 이름이
      그대로 고객에게 나가면 안 된다. */
const MAT_CAT_ETC = '기타';
const MAT_CATS_DEFAULT = ['제안서','계약서','법인홍보물'];

/* 저장된 갈래 목록을 화면에 쓸 모양으로 다듬는다 — 빈 값·중복·'기타'를 정리하고
   '기타'는 언제나 맨 끝에 하나 둔다. 저장값이 없으면 처음 세 갈래. */
function matCatsOf(saved){
  const src = Array.isArray(saved) ? saved
            : (saved && typeof saved==='object') ? Object.keys(saved).sort((a,b)=>(saved[a]||0)-(saved[b]||0))
            : null;
  const base = (src && src.length) ? src : MAT_CATS_DEFAULT;
  const out = [];
  base.forEach(c=>{
    const v = String(c==null?'':c).trim();
    if(!v || v===MAT_CAT_ETC || out.indexOf(v)>=0) return;
    out.push(v);
  });
  out.push(MAT_CAT_ETC);
  return out;
}
/* 이 자료의 갈래. 없는 갈래를 가리키면 '기타'로 본다 (갈래를 지운 뒤에도 안 사라지게) */
function matCatOf(m, cats){
  const c = String((m&&m.cat)||'').trim();
  return (c && (cats||[]).indexOf(c)>=0) ? c : MAT_CAT_ETC;
}
/* 순서 — 손으로 매긴 order 가 먼저, 없으면 올린 때. order 가 같으면 올린 때로 가른다. */
function matSortList(list){
  return (list||[]).slice().sort((a,b)=>{
    const ao = (a&&typeof a.order==='number') ? a.order : Number.MAX_SAFE_INTEGER;
    const bo = (b&&typeof b.order==='number') ? b.order : Number.MAX_SAFE_INTEGER;
    if(ao!==bo) return ao-bo;
    return ((a&&a.uploadedAt)||0) - ((b&&b.uploadedAt)||0);
  });
}
/* 이름·설명·파일이름에서 찾는다. 띄어쓰기는 무시한다 — '자문 제안서'로도 '자문제안서'가 잡히게. */
function matSearchList(list, q){
  const s = String(q||'').trim().toLowerCase().replace(/\s/g,'');
  if(!s) return (list||[]).slice();
  return (list||[]).filter(m=>[m&&m.name, m&&m.desc, m&&m.fileName]
    .some(v=>String(v||'').toLowerCase().replace(/\s/g,'').includes(s)));
}
/* ▲▼ 로 자리를 바꿀 **상대**를 고른다 — 보이는 차례에서 바로 위/아래 줄.
   갈래 탭이나 찾기로 걸러 놓았으면 화면에서 이웃한 줄이 전체에서는 멀리 있을 수 있다.
   그 '보이는 이웃'과 바꾸는 것이 사람이 기대하는 움직임이다. */
function matNeighborId(shown, id, dir){
  const arr = shown||[];
  const i = arr.findIndex(m=>m&&m.id===id);
  const j = i + dir;
  if(i<0 || j<0 || j>=arr.length) return null;
  return (arr[j]&&arr[j].id) || null;
}
/* 둘의 자리를 바꾼 뒤 **전체 줄의 order 를 다시 매긴다.**
   ⚠ 바꾼 둘만 고치면 안 된다. order 가 아직 없는 옛 자료가 섞여 순서가 튄다.
   ⚠ 걸러진 목록 기준으로 매겨도 안 된다. 다른 갈래와 번호가 겹쳐 전체 탭이 뒤죽박죽이 된다.
      그래서 받는 것은 늘 **전체 목록**이다. */
function matSwapOrder(full, aId, bId){
  const arr = (full||[]).slice();
  const i = arr.findIndex(m=>m&&m.id===aId);
  const j = arr.findIndex(m=>m&&m.id===bId);
  if(i<0 || j<0 || i===j) return null;
  const t = arr[i]; arr[i]=arr[j]; arr[j]=t;
  const out = {};
  arr.forEach((m,k)=>{ if(m&&m.id) out[m.id]=(k+1)*10; });
  return out;
}
/* 갈래 이름 바꾸기 — 그 갈래를 쓰던 자료의 cat 도 같이 바꾼다 */
function matCatRenamePatch(materials, from, to){
  const out = {};
  Object.values(materials||{}).forEach(m=>{
    if(m && m.id && String(m.cat||'')===from) out[m.id] = to;
  });
  return out;
}
/* 갈래 지우기 — 그 갈래의 자료는 '기타'로 옮긴다. 자료는 하나도 지우지 않는다. */
function matCatDeletePatch(materials, name){
  return matCatRenamePatch(materials, name, MAT_CAT_ETC);
}

/* ── 메일 틀 ──
   {받는분} {회사명} {자료목록} {오늘} 을 채운다. 모르는 칸은 빈 값으로 지운다 —
   '{담당자}' 같은 글자가 그대로 고객 메일에 나가면 안 된다. */
function mailFill(tpl, vals){
  return String(tpl==null?'':tpl).replace(/\{([^{}]{1,20})\}/g, (_, k)=>{
    const v = (vals||{})[String(k).trim()];
    return (v==null) ? '' : String(v);
  });
}
/* 고른 자료의 갈래가 **하나뿐일 때만** 그 갈래 틀을 쓴다.
   여러 갈래를 섞어 보내면서 한쪽 인사말을 쓰면 말이 어긋난다 — 그때는 기본 틀. */
function pickMailTpl(cfg, cats){
  const c = cfg || {};
  const base = { subject: c.subject||'', body: c.body||'' };
  const uniq = [...new Set((cats||[]).filter(Boolean))];
  if(uniq.length!==1) return base;
  const own = (c.byCat||{})[uniq[0]];
  if(!own) return base;
  return { subject: own.subject||base.subject, body: own.body||base.body };
}
/* ── 보내는 방법 ──
   'mailto' : 메일창만 열어 준다. 첨부는 손으로 끌어다 붙인다 (지금까지의 방법)
   'auto'   : 서버가 회사 다음메일로 대신 보낸다. 첨부가 저절로 붙는다
   ⚠ 'auto' 는 서버가 준비돼 있을 때만 쓴다. 준비가 안 됐는데 켜 두면 보내기가
     통째로 막힌다 — 그래서 실패하면 늘 'mailto' 로 되돌아간다. */
function mailModeOf(cfg){ return ((cfg||{}).mode === 'auto') ? 'auto' : 'mailto'; }
/* 급여명세서 발송 함수(sendPayslip)와 같은 자리에 둔다 — 주소 규칙이 갈라지면

   다음메일이 해외 로그인을 막는 일이 있어 이것만 국내로 옮겼다(functions/index.js 머리말). */

/* ── 편지 쓰기 ──
   보내기 전에 받는사람·제목·본문·첨부를 눈으로 보고 고칠 수 있어야 한다.
   예전에는 자료만 고르면 **바로 나가서** 손볼 데가 없었다.

   ⚠ 첨부 크기는 **보내기 전에** 센다. 서버가 18MB 에서 자르는데, 보내고 나서
     알면 이미 기다린 뒤다. 여기서 미리 막고 무엇을 빼야 하는지 보여 준다. */
const MAIL_MAX_BYTES = 18 * 1024 * 1024;
function attachTotal(ids, meta, files){
  const a = (ids||[]).reduce((s,id)=> s + (((meta||{})[id]||{}).size || 0), 0);
  const b = (files||[]).reduce((s,f)=> s + ((f&&f.size)||0), 0);
  return a + b;
}
function fmtMB(n){ return (Number(n||0)/1024/1024).toFixed(1) + 'MB'; }
/* 보낼 수 있는 편지인가. 되면 {ok:true}, 아니면 {ok:false, error}.
   서버도 같은 것을 다시 보지만, 여기서 걸러야 사람이 기다리지 않는다. */
function composeCheck(o){
  const p = o || {};
  const to = String(p.to||'').trim();
  if(!to) return { ok:false, error:'받는 사람을 넣어 주세요.' };
  if(!/^[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]{2,}$/.test(to.split(/[,;]/)[0].trim()))
    return { ok:false, error:'받는 사람 주소 형식이 맞지 않습니다.' };
  if(!String(p.subject||'').trim()) return { ok:false, error:'제목이 비어 있습니다.' };
  if(!String(p.body||'').trim())    return { ok:false, error:'본문이 비어 있습니다.' };
  if((p.bytes||0) > MAIL_MAX_BYTES)
    return { ok:false, error:`첨부가 너무 큽니다 (${fmtMB(p.bytes)}). ${fmtMB(MAIL_MAX_BYTES)} 아래로 줄여 주세요.` };
  return { ok:true };
}

/* ── 받는사람 자동 찾기 ──
   이름·회사·이메일 어느 것으로 쳐도 명함에서 찾는다. 명함첩을 뒤져 주소를
   옮겨 적을 필요가 없다.
   ⚠ 이메일이 없는 명함도 **보여 준다.** 안 보이면 「그 사람이 명함첩에 없나」
     싶어 다시 찾게 된다 — 있는데 이메일만 없는 것이라고 알려 주는 편이 낫다. */
function findPeople(items, q, limit){
  const s = String(q||'').trim().toLowerCase().replace(/\s/g,'');
  if(s.length < 1) return [];
  const hit = [];
  for(const it of Object.values(items||{})){
    if(!it || !it.id) continue;
    const hay = [it.name, it.company, it.email, it.dept, it.title]
      .map(v=>String(v||'').toLowerCase().replace(/\s/g,'')).join('|');
    if(hay.indexOf(s) < 0) continue;
    hit.push(it);
    if(limit>0 && hit.length >= limit*3) break;      /* 넉넉히 모은 뒤 아래에서 줄인다 */
  }
  /* 이메일 있는 사람이 먼저. 없는 사람은 골라도 못 보내므로 뒤로. */
  hit.sort((a,b)=> (a.email?0:1) - (b.email?0:1));
  return limit>0 ? hit.slice(0, limit) : hit;
}
/* 받는사람 칸의 글을 주소로 바꾼다. '홍길동 <a@b.com>' 처럼 적어도 알아본다. */
function pickEmail(v){
  const s = String(v||'').trim();
  const m = s.match(/<([^>]+)>/);
  return normEmail(m ? m[1] : s);
}

/* ── 보낸 기록 ──
   '이 업체에 제안서 보냈던가'에 답하는 것이 전부다. 그래서 **자료 이름을 그대로 적어 둔다** —
   자료 번호만 적으면 나중에 그 자료를 지웠을 때 무엇을 보냈는지 알 수 없다. */
function sendLogRec(o){
  const p = o || {};
  return {
    at: p.at || 0,
    by: String(p.by||''),
    to: String(p.to||''),
    names: (p.names||[]).map(v=>String(v||'')).filter(Boolean),
    set: String(p.set||'')
  };
}
/* 최근 것이 위로. 화면에 몇 줄만 보이므로 자르는 것까지 여기서 한다. */
function sendLogList(logs, limit){
  const arr = Object.entries(logs||{})
    .map(([id,v])=>Object.assign({id}, v||{}))
    .filter(v=>v.at)
    .sort((a,b)=>(b.at||0)-(a.at||0));
  return (limit>0) ? arr.slice(0, limit) : arr;
}

/* ── 묶음 ──
   묶음 안의 자료가 지워졌을 수 있다. 지금 자료함에 **있는 것만** 돌려준다 —
   없는 번호를 그대로 넘기면 보낼 때 조용히 빠지고, 사람은 다 보낸 줄 안다. */
function setLiveIds(set, materials){
  const have = materials || {};
  return ((set&&set.ids)||[]).filter(id=>have[id]);
}
function setList(sets){
  return Object.values(sets||{}).filter(s=>s&&s.id)
    .sort((a,b)=>(a.order||0)-(b.order||0));
}

/* 자료함에서 받는 파일 형식 — 확장자별 MIME·아이콘·브라우저 표시 가능 여부 */
const MAT_TYPES = {
  pdf :{mime:'application/pdf', ic:'📄', view:true},
  doc :{mime:'application/msword', ic:'📝'},
  docx:{mime:'application/vnd.openxmlformats-officedocument.wordprocessingml.document', ic:'📝'},

};
const MAT_ACCEPT = Object.keys(MAT_TYPES).map(e=>'.'+e).join(',');
const matExt  = n => ((String(n||'').match(/\.([a-z0-9]+)$/i)||[])[1]||'').toLowerCase();

/* 자료함에 올린 파일을 바이트로 읽는다.
   같은 코드가 세 군데(내려받기·미리보기·보기) 있어 한 곳으로 모았다 —
   여러 벌이면 한 곳만 고쳐져 어긋난다. */
async function matBytes(id){
  const s = await firebase.database().ref(DB_ROOT+'/materialFiles/'+id).once('value');
  const dataUrl = s.val();
  if(!dataUrl) throw new Error('파일 데이터가 없습니다 — 자료함에서 파일을 다시 올려주세요');
  const b64 = String(dataUrl).split(',')[1];
  /* 콤마 없는 값을 그냥 두면 atob('')이 조용히 0바이트 파일을 만든다 —
     내려받기는 빈 파일을 저장하고 미리보기는 빈 화면을 연다, 둘 다 "성공"처럼 보인다.
     근로계약서 같은 문서에서는 빈 파일이 오류보다 훨씬 나쁘다. */
  if(!b64) throw new Error('파일 데이터가 깨졌습니다 — 자료함에서 파일을 다시 올려주세요');
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return arr;
}

/* ── 내 PC 파일 붙이기 ──
   한글에서 조항을 고친 계약서처럼 **이번 편지에만** 쓰는 파일.
   ⚠ 자료함에 저장하지 않는다 — 저장하면 고친 사본이 매번 자료함에 쌓인다.
     계속 쓸 것이면 자료함 [교체]로 올린다(안내 문구로 알린다). */
async function addLocalFiles(input){
  const files=[...((input&&input.files)||[])]; if(input) input.value='';
  grabCompose(); if(!_compose || !files.length) return;
  _compose.files = _compose.files || [];
  let added=0;
  for(const f of files){
    if(f.size > 8*1024*1024){ toast(`${f.name} — 파일이 너무 큽니다 (${fmtMB(f.size)}). 8MB 이하만 붙일 수 있습니다`, 8000); continue; }
    try{
      const dataUrl = await new Promise((res,rej)=>{
        const r=new FileReader();
        r.onload=()=>res(r.result);
        r.onerror=()=>rej(new Error('파일을 읽을 수 없습니다'));
        r.readAsDataURL(f);
      });
      _compose.files.push({ name:f.name, size:f.size, dataUrl });
      added++;
    }catch(e){ toast(`${f.name} — ${(e&&e.message)||'읽지 못했습니다'}`, 7000); }
  }
  if(added) toast(`💻 내 PC 파일 ${added}개를 붙였습니다 — 이번 편지에만 붙습니다`, 6000);
  redrawCompose();
}
