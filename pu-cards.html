<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>푸른명함첩</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>📇</text></svg>">
<link rel="manifest" href="pu-cards-manifest.json">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="js/pu-resilience.js"></script>
<script src="js/pu-health.js"></script>
<script src="js/pu-version.js"></script>
<script src="js/pu-backup.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<style>
:root{
  --bg:#101010; --bg2:#1a1a1a; --row:#151515; --line:#2b2b2b;
  --ink:#f3f3f3; --sub:#9aa0a6; --orange:#ff6f0f; --orange-soft:#3a2410;
  --green:#3ddc84; --red:#ff5d6c;
  --sidebar-w:230px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}

/* ── 상단 바 ── */
#appbar{display:flex;align-items:center;gap:4px;padding:14px 16px 8px;flex-shrink:0}
#appbar .logo{font-size:23px;font-weight:800;letter-spacing:-.5px}
#modeBadge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;
  background:var(--orange-soft);color:var(--orange);margin-left:8px}
#modeBadge.live{background:#10301f;color:var(--green)}
#appbar .spacer{flex:1}
.iconbtn{font-size:19px;padding:7px 9px;border-radius:10px}
.iconbtn:active{background:var(--bg2)}

/* ── 탭 ── */
#tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0;padding:0 8px}
#tabs button{padding:11px 14px;font-size:16px;font-weight:700;color:var(--sub);
  border-bottom:3px solid transparent}
#tabs button.on{color:#fff;border-bottom-color:#fff}

/* ── 부제 줄: 전체(N)∨ · 정렬 ── */
#subbar{display:flex;align-items:center;gap:14px;padding:11px 16px;flex-shrink:0;
  background:var(--bg2);border-bottom:1px solid var(--line)}
#groupBtn{font-size:16px;font-weight:800;display:flex;align-items:center;gap:6px}
#groupBtn .v{font-size:12px;color:var(--sub)}
#subbar .spacer{flex:1}
.subact{font-size:13.5px;color:var(--ink);display:flex;align-items:center;gap:4px}

/* ── 검색 줄(토글) ── */
#searchbar{display:none;padding:8px 16px;background:var(--bg2);flex-shrink:0;border-bottom:1px solid var(--line)}
#searchbar.open{display:block}
#search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--ink);font-size:15px}
#search:focus{outline:none;border-color:var(--orange)}

/* ── 본문 ── */
#main{flex:1;display:flex;min-height:0}
#sidebar{width:var(--sidebar-w);min-width:150px;max-width:420px;background:var(--bg2);
  border-right:1px solid var(--line);overflow-y:auto;padding:10px;flex-shrink:0;display:none}
#resizer{width:5px;cursor:col-resize;flex-shrink:0;display:none}
#resizer:hover{background:var(--orange-soft)}
@media(min-width:761px){ #sidebar,#resizer{display:block} }
.grouphead{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 8px}
.grouphead b{font-size:12px;color:var(--sub);letter-spacing:1px}
.gitem{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;font-size:14px;cursor:pointer;user-select:none}
.gitem:hover{background:#222}
.gitem.on{background:var(--orange-soft);color:var(--orange);font-weight:700}
.gitem .cnt{margin-left:auto;font-size:12px;color:var(--sub)}
.gitem.dropover{outline:2px dashed var(--orange)}

#listwrap{flex:1;overflow-y:auto;padding-bottom:110px;min-width:0}
.datehead{font-size:15px;font-weight:700;color:var(--ink);padding:18px 18px 6px;opacity:.92}
.row{display:flex;align-items:center;gap:14px;padding:15px 16px;cursor:pointer;
  border-bottom:1px solid #1d1d1d}
.row:active{background:#191919}
.row.dragging{opacity:.4}
.rowmain{flex:1;min-width:0}
.rowmain .nm{font-size:21px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowmain .nm .pv{display:inline-block;font-size:11px;font-weight:700;color:#6fdcc0;background:rgba(29,158,117,.18);border:1px solid rgba(29,158,117,.55);border-radius:10px;padding:0 7px;margin-left:8px;vertical-align:middle}
.rowmain .l1,.rowmain .l2{font-size:14.5px;color:#cfcfcf;margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowmain .l2{color:#bdbdbd}
/* 🏢 ERP 거래처 담당자 배지 (푸른 거래처만 표시) */
.rowmain .erpmgr{display:inline-block;margin-top:5px;font-size:12.5px;font-weight:800;
  color:#ffd8a8;background:rgba(230,126,34,.16);border:1px solid rgba(230,126,34,.55);
  border-radius:8px;padding:1px 8px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erpmgr-box{margin:2px 0 12px;font-size:14px;font-weight:800;color:#ffd8a8;
  background:rgba(230,126,34,.16);border:1px solid rgba(230,126,34,.55);
  border-radius:9px;padding:8px 12px;line-height:1.4}
.thumb{width:148px;height:88px;flex-shrink:0;border-radius:5px;background:#e9e9e9;
  display:flex;align-items:center;justify-content:center;color:#666;font-weight:800;font-size:22px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.empty{text-align:center;color:var(--sub);padding:70px 24px;font-size:14px;line-height:1.9}
/* ── 폰 컴팩트: 헤더·행 여백/썸네일/글자 축소 → 화면당 명함 6~7장 → 9~10장 ── */
@media(max-width:760px){
  #appbar{padding:9px 12px 5px}
  #appbar .logo, #appbar h1{font-size:22px}
  #tabs .tab{padding:9px 12px;font-size:14.5px}
  #subbar{padding:7px 12px;gap:10px}
  #groupBtn{font-size:14.5px}
  .subact{font-size:12px}
  .row{padding:8px 12px;gap:10px}
  .thumb{width:106px;height:63px;font-size:16px}
  .rowmain .nm{font-size:16.5px}
  .rowmain .l1,.rowmain .l2{font-size:12.5px;margin-top:3px}
  .rowmain .erpmgr{font-size:11.5px;margin-top:3px;padding:1px 6px}
  #fab{width:52px;height:52px;font-size:28px;right:14px;bottom:18px}
}

/* ── 주황 FAB ── */
#fab{position:fixed;right:20px;bottom:26px;width:62px;height:62px;border-radius:50%;
  background:var(--orange);color:#fff;font-size:34px;font-weight:300;line-height:1;
  box-shadow:0 6px 20px rgba(255,111,15,.45);display:flex;align-items:center;justify-content:center;z-index:50}
#fab:active{transform:scale(.94)}

/* ── 모달/시트 공통 ── */
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
  align-items:flex-end;justify-content:center;z-index:100}
.modalbg.open{display:flex}
.modal{background:#1c1c1c;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:18px 18px 30px;border:1px solid #2c2c2c}
@media(min-width:761px){.modalbg{align-items:center}.modal{border-radius:20px}}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mhead b{font-size:17px}
.sheetbtn{display:flex;align-items:center;gap:12px;width:100%;padding:15px 12px;
  font-size:16px;font-weight:600;border-radius:12px;text-align:left}
.sheetbtn:active{background:#262626}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--bg);color:var(--ink)}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--orange)}
.field textarea{resize:vertical;min-height:56px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.photo-pane{border:1.5px dashed var(--line);border-radius:12px;padding:10px;text-align:center;
  margin-bottom:12px;background:var(--bg)}
.photo-pane img{max-width:100%;max-height:230px;border-radius:8px;cursor:zoom-in;background:#fff}
.mfoot{display:flex;gap:8px;margin-top:14px}
.btn{padding:13px;border-radius:12px;font-size:14.5px;font-weight:700;flex:1}
.btn.primary{background:var(--orange);color:#fff}
.btn.ghost{background:#262626;color:var(--ink)}
.btn.danger{background:#3a1a1f;color:var(--red)}

/* ── 상세 ── */
.dphoto{width:100%;border-radius:10px;cursor:zoom-in;margin-bottom:14px;background:#fff}
.dname{font-size:23px;font-weight:800}
.dsub{color:var(--sub);font-size:14px;margin:4px 0 16px}
.actrow{display:flex;gap:8px;margin-bottom:16px}
.actrow a{flex:1;text-align:center;text-decoration:none;background:var(--orange-soft);color:var(--orange);
  font-weight:700;font-size:13px;padding:12px 4px;border-radius:12px}
.actrow a.off{opacity:.3;pointer-events:none}
.dlist{border-top:1px solid var(--line)}
.ditem{display:flex;padding:11px 2px;border-bottom:1px solid #262626;font-size:14.5px;gap:10px}
.ditem .k{width:88px;flex-shrink:0;color:var(--sub);font-size:12.5px;padding-top:2px}
.ditem .v{flex:1;word-break:break-all}
.ditem .v a{color:var(--orange);text-decoration:none}

#zoombg{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;z-index:200;
  align-items:center;justify-content:center;cursor:zoom-out}
#zoombg.open{display:flex}
#zoombg img{max-width:98vw;max-height:96vh;object-fit:contain;background:#fff}

#dropov{position:fixed;inset:0;background:rgba(255,111,15,.12);border:4px dashed var(--orange);
  display:none;z-index:300;align-items:center;justify-content:center;pointer-events:none}
#dropov.open{display:flex}
#dropov .box{background:#1c1c1c;border-radius:16px;padding:26px 34px;font-size:17px;font-weight:800;color:var(--orange)}

#dupbox .btn{width:100%;margin-top:8px}
.selmark{font-size:20px;flex-shrink:0;width:26px;text-align:center}
#selbar{position:fixed;left:0;right:0;bottom:0;display:none;align-items:center;gap:8px;
  background:#1c1c1c;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:60}
#selbar .btn{flex:none;padding:10px 16px}
.row .fav{color:var(--orange);font-size:14px;margin-right:4px}
/* ── 인앱 카메라 (리멤버식) ── */
#cambg{position:fixed;inset:0;background:#000;display:none;z-index:500;flex-direction:column}
#cambg.open{display:flex}
#camvid{flex:1;width:100%;object-fit:cover;min-height:0}
#camframe{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);
  width:86vw;max-width:540px;aspect-ratio:1.65;border:2.5px solid rgba(255,255,255,.95);
  border-radius:12px;box-shadow:0 0 0 200vmax rgba(0,0,0,.38);pointer-events:none}
#camlabel{position:absolute;left:0;right:0;bottom:152px;text-align:center;color:#fff;font-weight:800;font-size:16px;text-shadow:0 1px 4px #000}
#camclose{position:absolute;top:14px;left:10px;color:#fff;font-size:24px;padding:10px;z-index:3}
#cambar{flex-shrink:0;display:flex;align-items:center;justify-content:space-around;
  padding:16px 22px calc(20px + env(safe-area-inset-bottom));background:#000}
#cambar .side{color:#fff;font-size:13px;display:flex;flex-direction:column;gap:6px;align-items:center;background:none}
#camshutter{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:var(--orange)}
#camshutter:active{transform:scale(.93)}
#camask{position:absolute;left:0;right:0;bottom:150px;display:none;justify-content:center;gap:10px;z-index:4}
#camask .btn{flex:none;padding:12px 20px}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:#2c2c2c;color:#fff;
  font-size:13.5px;padding:12px 19px;border-radius:99px;display:none;z-index:400;max-width:90vw;text-align:center;
  border:1px solid #3a3a3a}
/* ════════════ PC 화면 (밝은 관리자 UI) ════════════ */
body.pc{background:#f3f5f9}
body.pc #appbar,body.pc #tabs,body.pc #subbar,body.pc #searchbar,
body.pc #main,body.pc #fab,body.pc #selbar{display:none!important}
#pcRoot{display:flex;height:100vh;overflow:hidden}
#pcRoot[hidden]{display:none!important}  /* hidden 속성이 display:flex에 눌려 폰에서 PC 레이아웃이 새어 나오던 버그 수정 */
#pcSide{width:240px;flex-shrink:0;background:#1e2a47;color:#dfe6f3;overflow-y:auto;padding:18px 14px;transition:width .2s,padding .2s;display:flex;flex-direction:column}
.pcside-bottom{margin-top:auto;padding-top:14px;border-top:1px solid #33457a}
/* 자료함·환경설정이 틈 없이 붙어 있어 오작동으로 이어지기 쉬웠다 — 줄 사이 간격을 둔다 */
.pcside-settings{width:100%;background:#2a3a5e;color:#dfe6f3;border:1px solid #3a4a73;border-radius:9px;
  padding:11px;font-size:14px;font-weight:700;cursor:pointer;text-align:left;margin-bottom:8px}
.pcside-settings:last-child{margin-bottom:0}
.pcside-settings:hover{background:#33457a}
/* ── 환경설정 전용 화면 (팝업 대신 본문) ── */
#pcSettings{padding:2px 2px 40px}
.setback{display:inline-flex;align-items:center;gap:6px;background:#eef1f6;border:1px solid #dde3ee;color:#33415e;
  border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:10px}
.setback:hover{background:#e3e9f5}
/* 현황: 큰 상자 대신 한 줄 알약 */
.setstat{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.setstat>div{background:#fff;border:1px solid #e4e8f0;border-radius:20px;padding:5px 13px;display:flex;align-items:baseline;gap:6px}
.setstat b{font-size:14px;color:#16223c;font-weight:800}
.setstat span{font-size:11.5px;color:#8b98b3}
/* 가로 탭 (푸른이알피 환경설정과 같은 방식) */
.settabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:2px solid #e4e8f0;margin-bottom:14px}
.settab{padding:9px 16px;font-size:13px;font-weight:700;color:#7c89a6;background:none;border:none;
  border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;font-family:inherit;white-space:nowrap;border-radius:8px 8px 0 0}
.settab:hover{background:#f4f7fc;color:#33415e}
.settab.on{color:#1e40af;border-bottom-color:#1e40af;background:#f4f9ff}
.settab.dg{color:#c0392b}
.settab.dg.on{color:#c0392b;border-bottom-color:#c0392b;background:#fff6f6}
/* 선택한 탭 내용 — 버튼을 2열로 */
.setpanel{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px;align-items:start}
.setnote{grid-column:1/-1;font-size:12px;color:#8b98b3;line-height:1.6;margin:0 2px 4px}
.setcard{break-inside:avoid;-webkit-column-break-inside:avoid;display:inline-block;width:100%;
  background:#fff;border:1px solid #e4e8f0;border-radius:12px;padding:11px 12px 5px;margin:0 0 12px;
  box-shadow:0 1px 6px rgba(20,30,60,.04)}
.setcard h3{margin:0 0 8px;font-size:13px;color:#16223c;display:flex;align-items:center;gap:6px;font-weight:800}
.setbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#f7f9fc;border:1px solid #e8edf5;
  border-radius:8px;padding:7px 10px;margin-bottom:6px;font-size:13px;font-weight:600;color:#1b2536;cursor:pointer;font-family:inherit}
.setbtn:hover{background:#eef4ff;border-color:#cfe0fb}
.setbtn .sdesc{margin-left:auto;font-size:11px;color:#8b98b3;font-weight:500;white-space:nowrap}
.setcard.danger{border-color:#f3c9c9;background:#fff6f6}
.setcard.danger h3{color:#c0392b}
.setbtn.danger{background:#fff;border-color:#f3c9c9;color:#c0392b}
.setbtn.danger:hover{background:#ffecec;border-color:#e8a9a9}
.sidetab{display:flex;gap:5px;margin:8px 0 12px}
.sidetab button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:#1a243c;color:#8fa0c4;
  border:1px solid #33457a;border-radius:8px;padding:9px 4px;font-size:13px;font-weight:700;cursor:pointer}
.sidetab button.on{background:#2a3a5e;color:#fff;border-color:#4a5a83}
.sidetab button span{font-size:11px;background:#33457a;color:#cfdaf0;border-radius:99px;padding:1px 7px;font-weight:700}
.sidetab button.on span{background:#4a5a83;color:#fff}
#pcRoot.sidehidden #pcSide{width:0;padding:0;overflow:hidden}
#sideToggle{position:fixed;top:14px;left:0;z-index:50;background:#1e2a47;color:#fff;border:none;border-radius:0 8px 8px 0;
  width:22px;height:42px;cursor:pointer;font-size:13px;display:none;align-items:center;justify-content:center;opacity:.85}
#pcRoot.sidehidden #sideToggle{display:flex}
.pclogo{font-size:18px;font-weight:800;color:#fff;margin-bottom:4px}
.pclogo span{display:block;font-size:11.5px;font-weight:400;color:#8fa0c4;margin-top:4px}
.pcsec{font-size:11.5px;color:#8fa0c4;letter-spacing:1px;margin:20px 4px 8px;display:flex;align-items:center;justify-content:space-between}
.pcsec button{color:#aebcdc;font-size:11.5px;border:1px dashed #3a4a73;border-radius:7px;padding:3px 8px}
.pcsec button:hover{color:#fff;border-color:#6d80ad}
.pcitem{display:flex;align-items:center;gap:6px;padding:9px 11px;border-radius:9px;font-size:13.5px;cursor:pointer;min-height:38px;line-height:1.2}
.pcitem>span{flex-shrink:0}
.pcitem .gname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 폴더가 많아도 한 화면에 — 행을 촘촘히, 목록만 따로 스크롤 */
.folderrow{padding:5px 9px!important;min-height:28px;font-size:13px}
#pcFolderList{max-height:44vh;overflow-y:auto;margin-bottom:2px}
#pcFolderList::-webkit-scrollbar{width:6px}
#pcFolderList::-webkit-scrollbar-thumb{background:#33457a;border-radius:3px}
/* 폴더 행 — 평소엔 건수, hover시 ⋮ 메뉴 (메일함 스타일) */
.folderrow .gcount{font-size:11.5px;color:#8fa0c4}
.folderrow .gmenu{display:none;cursor:pointer;padding:0 6px;font-size:16px;color:#aebcdc;font-weight:700}
.folderrow .gmenu:hover{color:#fff}
.folderrow:hover .gcount{display:none}
.folderrow:hover .gmenu{display:inline-block}
#folderMenu .fmi{padding:10px 14px;font-size:13.5px;color:#33415e;cursor:pointer;border-radius:7px;white-space:nowrap}
#folderMenu .fmi:hover{background:#f1f4fa}
#folderMenu .fmi.danger{color:#c0392b}
.movefolder{display:flex;align-items:center;gap:10px;padding:13px 16px;font-size:14.5px;color:#1e2a47;
  border:1px solid #e4e8f0;border-radius:10px;cursor:pointer;background:#fff;transition:all .12s}
.movefolder:hover{background:#eef3fb;border-color:#3a4a73}
.movefolder .mfic{font-size:17px}
.pcitem:hover{background:#27365c}
.pcitem.on{background:#33457a;color:#fff;font-weight:700}
.pcitem span{margin-left:auto;font-size:11.5px;background:#33457a;border-radius:99px;padding:2px 8px}
.pcitem.on span{background:#4a5e9c}
.pcitem.dropover{outline:2px dashed #7e95d0}

     흰 배경 팝업에서 var(--ink) 글자가 '흰 글자 + 흰 배경'이 되어 안 보였음
   ★ 환경설정 화면(#pcSettings)도 같은 이유로 새어 들어온다 — 정리·탭 목록이 팝업이 아니라

<script>
/* ════════════════════════════════════════════════════════════
   ★★★ 설정: 여기에 pu-erp.html의 firebaseConfig를 붙여넣으세요 ★★★
   null이면 "데모 모드"(이 기기에만 저장)로 동작합니다.
   ════════════════════════════════════════════════════════════ */
const FB_APPCHECK_KEY = '6Ldu1hEtAAAAABB9lH9EMEyd7uBLEy9H5HxJoua_'; // ERP와 동일 reCAPTCHA v3 키
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyDkZz5QlKSoqMOYByp5YGeMNLNDrIghliA',
  databaseURL: 'https://pureun-erp-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'pureun-erp',
  storageBucket: 'pureun-erp.firebasestorage.app',
  appId: '1:936817166182:web:9bd31f70d0afdf5fca2aa7',
  messagingSenderId: '936817166182'
};

const DB_ROOT = 'pucards';
const GEMINI_KEY_LS = 'pucards_gemini_key';

/* ══════ 🔒 잠금 폴더(개인 전용) ══════
   잠근 사람만 폴더가 보이고, 다른 직원에게는 폴더도 명함도 보이지 않는다.
   또한 잠긴 폴더의 명함은 공유 검색목록(pucards/idx)에서 빠져
   푸른이알피 계약창·업체관리 등 다른 프로그램에서 당겨올 수 없다. */
let myEmail = '';
const lockOwnerOf = g => String((g&&g.lockOwner)||'').toLowerCase();
/* 내가 볼 수 있는 폴더인가 (잠긴 폴더는 잠근 본인만) */
function canSeeGroup(g){
  if(!g || !g.locked) return true;
  const own = lockOwnerOf(g);
  if(!own) return true;                 /* 예전에 주인 없이 잠근 폴더는 기존대로 */
  return !!myEmail && own === myEmail;
}
/* 이 명함이 '남의 잠긴 폴더'에 있는가 → 목록·공유목록에서 제외 */
function inHiddenLocked(it){
  const g = state.groups[(it&&it.group)||''];
  return !!g && !!g.locked && !canSeeGroup(g);
}
/* 잠긴 폴더의 명함인가 (주인 여부와 무관) → 공유 검색목록에서 항상 제외 */
function inLockedGroup(it){
  const g = state.groups[(it&&it.group)||''];
  return !!g && !!g.locked;
}
/* AI 키 우선순위: ①이 기기 로컬 키 ②명함첩 공유 키 ③포털 공용 설정(data/app_config)
   포털 ⚙설정에 넣어두면 앱마다 따로 넣을 필요가 없다. */
let _sharedGKey='', _portalGKey='';
function geminiKey(){ return (localStorage.getItem(GEMINI_KEY_LS)||'') || _sharedGKey || _portalGKey || ''; }
function loadSharedGKey(){
  try{ Store.db && Store.db.ref(DB_ROOT+'/config/geminiKey').once('value')
    .then(s=>{ _sharedGKey = s.val()||''; }).catch(()=>{}); }catch(_){}
  try{ Store.db && Store.db.ref('data/app_config/geminiKey').once('value')
    .then(s=>{ _portalGKey = s.val()||''; }).catch(()=>{}); }catch(_){}
}

/* ══════ 경량 검색 인덱스(pucards/idx) — 푸른이알피 계약창에서 회사·담당자 검색용 ══════
   사진 없이 이름·회사·전화만 담아 가볍게 유지(전체 1MB 이하). 저장/삭제 시 함께 갱신. */
function idxRecord(it){
  if(!it) return null;
  const r={}; const put=(k,v)=>{ v=(v==null?'':String(v)).trim(); if(v) r[k]=v; };
  put('n', it.name); put('c', it.company); put('m', it.mobile); put('t', it.tel);
  put('e', it.email); put('ti', it.title); put('d', it.dept); put('ct', it.companyTel);
  put('ad', it.kind==='biz' ? it.address : it.companyAddr);
  /* 팩스·홈페이지 — 명함에 적혀 있는데 색인에 없어서 푸른이알피가 못 가져왔다.
     개인팩스(fax)와 회사팩스(companyFax)를 따로 담는다 (다른 번호다). */
  put('fx', it.fax); put('cfx', it.companyFax); put('w', it.website);
  if(it.kind==='biz'){
    put('bz', it.bizno); put('ceo', it.ceo);
    /* 업태·종목·법인번호 — 계약관리·업체관리에 그대로 들어가는 칸이라 함께 담는다 */
    put('bt', it.bizType); put('bi', it.bizItem); put('cno', it.corpno);
  }
  r.k = (it.kind==='biz') ? 'biz' : 'card';
  if(!r.n && !r.c && !r.bz) return null;   /* 검색에 쓸 정보가 없으면 기록 안 함 */
  return r;
}
function writeIdx(it){
  try{ if(Store.mode!=='firebase' || !it || !it.id) return;
    /* 🔒 잠긴 폴더의 명함은 공유 검색목록에 넣지 않는다 (다른 프로그램에서 당겨오기 차단) */
    const r = inLockedGroup(it) ? null : idxRecord(it);
    if(r) Store.db.ref(DB_ROOT+'/idx/'+it.id).set(r);
    else Store.db.ref(DB_ROOT+'/idx/'+it.id).remove();
  }catch(_){}
}
function removeIdx(id){ try{ if(Store.mode==='firebase') Store.db.ref(DB_ROOT+'/idx/'+id).remove(); }catch(_){} }

/* ══════ 검색목록 다시 만들기 ══════
   색인은 명함을 '저장할 때만' 갱신된다. 그래서 색인에 담는 항목을 늘려도
   이미 있던 명함들은 옛 색인을 그대로 갖고 있어, 푸른이알피에서 새 항목(팩스 등)이
   안 딸려온다. 이 기능이 전체를 한 번 다시 써 준다.
   한 장씩 쓰면 6천 번 통신하므로 한 번의 update 로 몰아 보낸다. */
async function rebuildIdxAll(){
  if(Store.mode!=='firebase'){ toast('클라우드에 연결된 상태에서만 됩니다'); return; }
  const items = Object.values(state.items||{}).filter(x=>x && x.id);
  if(!items.length){ toast('명함이 없습니다'); return; }
  if(!confirm(`검색목록을 다시 만듭니다 — 명함 ${items.length.toLocaleString()}장.\n\n`
    + `푸른이알피(계약·업체·사건·컨설팅)에서 명함을 당겨올 때\n`
    + `팩스·홈페이지·업태·종목처럼 새로 담게 된 항목이 채워집니다.\n\n`
    + `명함 자체는 하나도 바뀌지 않습니다. 진행할까요?`)) return;
  const upd = {}; let put=0, skip=0;
  items.forEach(it=>{
    const r = inLockedGroup(it) ? null : idxRecord(it);
    upd[it.id] = r;                      /* null 이면 그 줄이 지워진다 (잠긴 폴더·정보 없음) */
    if(r) put++; else skip++;
  });
  try{
    await Store.db.ref(DB_ROOT+'/idx').update(upd);
    toast(`✅ 검색목록 다시 만들었습니다 — ${put.toLocaleString()}장`
      + (skip ? ` (잠긴 폴더·정보 없음 ${skip.toLocaleString()}장 제외)` : ''));
  }catch(e){
    toast('❌ 실패: ' + ((e&&e.message)||'알 수 없음'));
  }
}

/* 자문·급여·노조·기금·사무대행 탭을 '전체 명함/전체 사업자등록증'에 1회 생성.
   (예전 자동 표시되던 줄을 대신 — 이제는 일반 탭이라 삭제·이름변경이 자유롭다) */
function seedErpTabs(){
  try{
    if(Store.mode!=='firebase') return;
    if(localStorage.getItem('pucards_erptabs_v1')) return;
    ['card','biz'].forEach(kind=>{
      ERP_TYPES.forEach((t,i)=>{
        const dup=Object.values(state.views||{}).find(v=>v&&(v.kind||'card')===kind
          &&(v.scope||'all')==='all'&&((v.f||{}).erpFilter)===t);
        if(dup) return;
        const f={ q:'', group:'all', owner:'all', region:'', erpFilter:t, colFilter:{},
          onlyPhone:false, onlyEmail:false, onlyIncomplete:false, onlyPrivate:false, onlyDup:false,
          sort:'date', sortKey:null, sortDir:'desc' };
        const v={ id:uid(), name:t, kind, scope:'all', order:1000+i, f };
        Store.putView(v); state.views[v.id]=v;
      });
    });
    localStorage.setItem('pucards_erptabs_v1','1');
    try{ render(); }catch(_){}
  }catch(e){ console.warn('[seedErpTabs]', e&&e.message); }
}

/* 사업자등록증 탭 기본 폴더 1회 생성 — ERP와 무관한 서류 정리용.
   (ERP 거래처는 업체관리/업체퇴사로 자동 분류되고, 나머지는 여기에 손으로 넣는다)
   지운 뒤 다시 살아나지 않도록 이 기기에 1회만 표시 */
function seedBizFolders(){
  try{
    if(Store.mode!=='firebase') return;
    if(localStorage.getItem('pucards_bizfolders_v1')) return;
    if(!state.groups) return;
    const hasBiz = nm => Object.values(state.groups).some(g=>g && ((g.kind||'card')==='biz') && _canon(g.name)===nm);
    [['거래처·기관',9001],['우리법인',9002]].forEach(([nm,ord])=>{
      if(hasBiz(_canon(nm))) return;
      const g={id:uid(), name:nm, kind:'biz', order:ord};
      Store.putGroup(g); state.groups[g.id]=g;
    });
    localStorage.setItem('pucards_bizfolders_v1','1');
    try{ render(); }catch(_){}
  }catch(e){ console.warn('[seedBizFolders]', e&&e.message); }
}
function backfillIdx(){
  try{
    if(Store.mode!=='firebase' || Store._idxDone) return;
    Store._idxDone=true;
    const items=Object.values(state.items||{}); if(!items.length){ Store._idxDone=false; return; }
    Store.db.ref(DB_ROOT+'/idx').once('value').then(s=>{
      const existCount=Object.keys(s.val()||{}).length;
      if(existCount >= items.length*0.9) return;   /* 이미 대부분 있으면 스킵 */
      const all={};
      items.forEach(it=>{ if(it&&it.id&&!inLockedGroup(it)){ const r=idxRecord(it); if(r) all[it.id]=r; } });
      Store.db.ref(DB_ROOT+'/idx').set(all)
        .then(()=>console.log('[idx] 백필 완료', Object.keys(all).length))
        .catch(e=>console.warn('[idx] 백필 실패', e&&e.message));
    }).catch(()=>{});
  }catch(_){}
}

const state = { tab:'card', group:'all', owner:'all', region:'', erpFilter:'', sort:'date', sortKey:null, sortDir:'desc', page:0, pageSize:100, selMode:false, sel:{}, collapsed:{}, colFilter:{}, hiddenCols:{}, colW:{}, colOrder:{}, onlyPhone:false, onlyEmail:false, onlyDup:false, onlyIncomplete:false, onlyPrivate:false, unlocked:{}, items:{}, groups:{}, trash:{}, views:{}, rules:{}, view:'list', vtab:'' };

/* ── 데이터 계층 ── */
const Store = {
  mode:'local', db:null,
  init(){
    if (FIREBASE_CONFIG && typeof firebase !== 'undefined' && firebase.initializeApp) {
      firebase.initializeApp(FIREBASE_CONFIG);
      if (FB_APPCHECK_KEY && firebase.appCheck){
        try{ firebase.appCheck().activate(new firebase.appCheck.ReCaptchaV3Provider(FB_APPCHECK_KEY), true); }
        catch(e){ console.warn('[AppCheck]', e&&e.message); }
      }
      this.db = firebase.database();
  /* 포털 공용 설정(data/app_config) — 대표가 포털 설정에서 넣은 값을 각 앱이 함께 쓴다 */
  try{ this.db.ref("data/app_config").once("value").then(function(s){
    window.PU_CFG = s.val() || {};
    try{ window.dispatchEvent(new CustomEvent("pu-cfg",{detail:window.PU_CFG})); }catch(_){}
  }).catch(function(){}); }catch(e){}
      this.mode = 'firebase';
      modeBadge.textContent='실시간 공유'; modeBadge.classList.add('live');
      const subscribe = () => {
        this.db.ref(DB_ROOT+'/items').on('value', s => { state.items = s.val()||{}; render();
          if(!Store._idxDone){ setTimeout(backfillIdx, 3000); } });
        this.db.ref(DB_ROOT+'/groups').on('value', s => { state.groups = s.val()||{}; render();
          if(!Store._bizSeedDone){ Store._bizSeedDone=true; setTimeout(seedBizFolders, 3000); } });
        /* 내 탭(저장된 검색·필터 조건) — 전 직원 공유 */
        this.db.ref(DB_ROOT+'/views').on('value', s => { state.views = s.val()||{}; render();
          if(!Store._erpTabSeedDone){ Store._erpTabSeedDone=true; setTimeout(seedErpTabs, 3500); } });
        this.db.ref(DB_ROOT+'/trash').on('value', s => { state.trash = s.val()||{};
          if(!Store._trashPurgeDone){ Store._trashPurgeDone=true; setTimeout(purgeTrash, 2000); } });
        this.db.ref(DB_ROOT+'/classifyRules').on('value', s => { state.rules = s.val()||{};
          if(!Store._ruleSeedDone){ Store._ruleSeedDone=true; setTimeout(seedClassifyRules, 3000); } });
        watchClassifyLog();
      };
      /* 통합 이메일 로그인 (포털·ERP·컨설팅과 같은 Firebase 세션 공유) */
      if (firebase.auth){
        firebase.auth().onAuthStateChanged(u=>{
          if (u && u.email){ myEmail=(u.email||'').toLowerCase(); hideCardsLogin(); subscribe(); ErpMatch.load(); loadSharedGKey(); }
          /* 익명 세션은 건드리지 않음 — 컨설팅 등 다른 앱이 읽기용으로 쓰는 세션을
             여기서 signOut하면 그 앱이 다시 익명 로그인 → 무한 핑퐁으로 전체가 튕김 */
          else { showCardsLogin(); }
        });
      } else subscribe();
    } else {
      state.items  = JSON.parse(localStorage.getItem('pucards_local_items')||'{}');
      state.groups = JSON.parse(localStorage.getItem('pucards_local_groups')||'{}');
      state.trash  = JSON.parse(localStorage.getItem('pucards_local_trash')||'{}');
      state.views  = JSON.parse(localStorage.getItem('pucards_local_views')||'{}');
      state.rules  = JSON.parse(localStorage.getItem('pucards_local_rules')||'{}');
      /* 구버전 구조(item.photo 내장) → 사진 분리 저장으로 1회 이전 */
      Object.values(state.items).forEach(it=>{
        if (it.photo){ const p=it.photo; delete it.photo; this.putPhoto(it.id,p);
          makeThumb(p).then(t=>{ it.thumb=t; this._ls(); render(); }); } });
      this._ls();
      render();
    }
  },
  _ls(){ localStorage.setItem('pucards_local_items', JSON.stringify(state.items));
         localStorage.setItem('pucards_local_groups', JSON.stringify(state.groups)); },
  put(it){ it.updatedAt = Date.now();
    if (this.mode==='firebase'){ this.db.ref(`${DB_ROOT}/items/${it.id}`).set(it); writeIdx(it); }
    else { state.items[it.id]=it; this._ls(); render(); } },
  /* 삭제 = 휴지통으로 이동 (30일 보관). 사진도 함께 보관 */
  async del(id){
    const it = state.items[id]; if(!it) return;
    const photo = await this.getPhoto(id).catch(()=>'');
    const photo2 = await this.getPhoto(id+'_b').catch(()=>'');
    const rec = { ...it, _deletedAt: Date.now(), _photo: photo||'', _photo2: photo2||'' };
    if (this.mode==='firebase'){
      await this.db.ref(`${DB_ROOT}/trash/${id}`).set(rec);
      this.delPhoto(id); this.delPhoto(id+'_b');
      this.db.ref(`${DB_ROOT}/items/${id}`).remove();
      removeIdx(id);
    } else {
      const t=JSON.parse(localStorage.getItem('pucards_local_trash')||'{}'); t[id]=rec;
      try{ localStorage.setItem('pucards_local_trash', JSON.stringify(t)); }catch(e){}
      state.trash[id]=rec;
      this.delPhoto(id); this.delPhoto(id+'_b');
      delete state.items[id]; this._ls(); render();
    }
  },
  /* 영구 삭제 (휴지통에서 완전 제거) */
  hardDel(id){
    if (this.mode==='firebase'){ this.db.ref(`${DB_ROOT}/trash/${id}`).remove(); }
    else { const t=JSON.parse(localStorage.getItem('pucards_local_trash')||'{}'); delete t[id];
      localStorage.setItem('pucards_local_trash', JSON.stringify(t)); delete state.trash[id]; render(); }
  },
  /* 휴지통에서 복원 (사진까지) */
  async restore(id){
    let rec=null;
    if (this.mode==='firebase'){ const s=await this.db.ref(`${DB_ROOT}/trash/${id}`).once('value'); rec=s.val(); }
    else rec=(JSON.parse(localStorage.getItem('pucards_local_trash')||'{}'))[id];
    if(!rec) return;
    const photo=rec._photo, photo2=rec._photo2;
    const it={...rec}; delete it._deletedAt; delete it._photo; delete it._photo2;
    if(photo) this.putPhoto(id, photo);
    if(photo2) this.putPhoto(id+'_b', photo2);
    this.put(it);
    this.hardDel(id);
  },
  /* 원본 사진은 목록 데이터와 분리 저장 — 필요할 때만 내려받음 */
  photoCache:{},
  async getPhoto(id){
    if (this.photoCache[id]!==undefined) return this.photoCache[id];
    let p='';
    if (this.mode==='firebase'){ const s=await this.db.ref(`${DB_ROOT}/photos/${id}`).once('value'); p=s.val()||''; }
    else p=(JSON.parse(localStorage.getItem('pucards_local_photos')||'{}'))[id]||'';
    this.photoCache[id]=p; return p;
  },
  putPhoto(id,dataUrl){ this.photoCache[id]=dataUrl;
    if (this.mode==='firebase') this.db.ref(`${DB_ROOT}/photos/${id}`).set(dataUrl);
    else { const m=JSON.parse(localStorage.getItem('pucards_local_photos')||'{}'); m[id]=dataUrl;
      try{ localStorage.setItem('pucards_local_photos', JSON.stringify(m)); }
      catch(e){ toast('데모 모드 용량 초과 — 원본 사진을 모두 보관하지 못합니다'); } } },
  delPhoto(id){ delete this.photoCache[id];
    if (this.mode==='firebase') this.db.ref(`${DB_ROOT}/photos/${id}`).remove();
    else { const m=JSON.parse(localStorage.getItem('pucards_local_photos')||'{}'); delete m[id];
      localStorage.setItem('pucards_local_photos', JSON.stringify(m)); } },
  /* 내 탭(저장된 조건) — 전 직원 공유. 명함을 건드리지 않고 보기 조건만 저장 */
  putView(v){ if (this.mode==='firebase') this.db.ref(`${DB_ROOT}/views/${v.id}`).set(v);
    else { state.views[v.id]=v; this._lsViews(); render(); } },
  delView(id){ if (this.mode==='firebase') this.db.ref(`${DB_ROOT}/views/${id}`).remove();
    else { delete state.views[id]; this._lsViews(); render(); } },
  _lsViews(){ try{ localStorage.setItem('pucards_local_views', JSON.stringify(state.views||{})); }catch(e){} },
  /* 분류 규칙 — 전 직원 공유. 명함을 건드리지 않고 '어떤 단어면 어느 폴더로' 만 담는다 */
  putRule(r){ if (this.mode==='firebase') this.db.ref(`${DB_ROOT}/classifyRules/${r.key}`).set(r);
    else { state.rules[r.key]=r; this._lsRules(); render(); } },
  delRule(key){ if (this.mode==='firebase') this.db.ref(`${DB_ROOT}/classifyRules/${key}`).remove();
    else { delete state.rules[key]; this._lsRules(); render(); } },
  _lsRules(){ try{ localStorage.setItem('pucards_local_rules', JSON.stringify(state.rules||{})); }catch(e){} },
  putGroup(g){ if (this.mode==='firebase') this.db.ref(`${DB_ROOT}/groups/${g.id}`).set(g);
    else { state.groups[g.id]=g; this._ls(); render(); } },
  delGroup(id){ Object.values(state.items).forEach(it=>{ if(it.group===id){ it.group=''; this.put(it);} });
    if (this.mode==='firebase') this.db.ref(`${DB_ROOT}/groups/${id}`).remove();
    else { delete state.groups[id]; this._ls(); render(); } }
};

/* 푸른이알피 업체관리의 업체 유형 (COMPANY_TYPE_SEED와 동일하게 유지) */
const ERP_TYPES = ['자문','급여','노조','기금','사무대행'];

/* ══════ 🏢 ERP 거래처 담당자 매칭 ══════
   푸른 ERP(업체관리)의 회사·담당자를 읽어와, 명함의 회사명/사업자번호가 맞으면
   "푸른담당: OOO" 배지를 보여준다. 거래처에서 전화가 오면 ERP를 따로 검색하지 않고
   담당 노무사를 바로 확인할 수 있다. (포털·ERP와 같은 Firebase 세션 공유) */
const ErpMatch = {
  ready:false, byBiz:{}, byName:{},
  _norm(s){ return String(s||'').toLowerCase()
      .replace(/㈜|\(주\)|주식회사|유한회사|유한책임회사|합자회사|합명회사|재단법인|사단법인|의료법인|\(재\)|\(사\)/g,'')
      .replace(/[\s\-_.,·・()[\]{}'"]/g,''); },
  _digits(s){ return String(s||'').replace(/[^0-9]/g,''); },
  _arr(snapVal){
    const v = snapVal && snapVal.v !== undefined ? snapVal.v : snapVal;
    if (Array.isArray(v)) return v;
    if (v && typeof v==='object') return Object.keys(v).map(k=>v[k]).filter(Boolean);
    return [];
  },
  load(){
    if (Store.mode!=='firebase' || typeof firebase==='undefined' || !firebase.database) return;
    Promise.all([
      firebase.database().ref('data/user_dir').once('value'),
      firebase.database().ref('data/companies').once('value'),
    ]).then(([du,dc])=>{
      const dir = ErpMatch._arr(du.val()), cos = ErpMatch._arr(dc.val());
      const nameBySid = {};
      dir.forEach(u=>{ if(u&&u.sid) nameBySid[u.sid]=u.name||u.sid; });
      const byBiz={}, byName={};
      cos.forEach(co=>{
        if(!co) return;
        const main = co.managerMain ? (nameBySid[co.managerMain]||co.managerMain) : '';
        const subs = (co.managerSubs||[]).map(s=>nameBySid[s]||s).filter(Boolean);
        /* 유형(자문/급여/노조/기금)·실무담당자명 — 담당 노무사가 없어도 유형 배지는 의미 있음 */
        /* 업체 퇴사(종료·이탈) 여부 — 업체관리 status가 종료/해지/비활성이면 left */
        const _st = String(co.status||'');
        /* 대표자·담당자 이름 수집 (연결·배지·불일치 점검용) */
        const _contactsRaw = [ ...((co.contacts||[]).map(c=>c&&c.name)), co.primaryContactName, co.contactName ].filter(Boolean);
        const rec = { company:co.name||'', main, subs,
          type: co.typeCode||'',
          status: _st,
          left: (_st==='inactive'||_st==='terminated'||_st==='closed'),
          contact: ErpMatch._norm(co.primaryContactName||co.contactName||''),
          ceoRaw: co.ceo||'', ceo2Raw: co.ceo2||'', contactsRaw: _contactsRaw,
          ceo: ErpMatch._norm(co.ceo||''), ceo2: ErpMatch._norm(co.ceo2||''),
          contacts: _contactsRaw.map(x=>ErpMatch._norm(x)).filter(Boolean),
          bizNo: co.bizNo||'' };
        if(!main && !subs.length && !rec.type && !rec.ceo && !rec.contacts.length) return;
        const b = ErpMatch._digits(co.bizNo); if(b.length>=10 && !byBiz[b]) byBiz[b]=rec;
        const n = ErpMatch._norm(co.name);    if(n && !byName[n]) byName[n]=rec;
      });
      ErpMatch.byBiz=byBiz; ErpMatch.byName=byName; ErpMatch.companies=cos; ErpMatch.ready=true;
      try{ render(); }catch(_){}
      /* 자문사 폴더 자동 분류 — 명함 데이터가 늦게 로드될 수 있어 4초 뒤 한 번 더(멱등) */
      ErpMatch.autoFolder();
      setTimeout(()=>ErpMatch.autoFolder(), 4000);
    }).catch(e=>{ console.warn('[ErpMatch]', e&&e.message); });
  },
  /* 명함/사업자 항목 → 담당자 레코드 (없으면 null) */
  match(it){
    if (!ErpMatch.ready || !it) return null;
    const b = ErpMatch._digits(it.bizno);
    if (b.length>=10 && ErpMatch.byBiz[b]) return ErpMatch.byBiz[b];
    const n = ErpMatch._norm(it.company);
    if (n && ErpMatch.byName[n]) return ErpMatch.byName[n];
    return null;
  },
  /* 배지 짧은 텍스트: "김보람" 또는 "김보람 +2" */
  label(it){
    const m = ErpMatch.match(it); if(!m) return '';
    const primary = m.main || m.subs[0] || '';
    const extra = (m.main ? m.subs.length : m.subs.length-1);
    return extra>0 ? primary+' +'+extra : primary;
  },
  /* 담당자 전체 문자열: "주담당 김보람 · 부담당 홍길동" */
  full(it){
    const m = ErpMatch.match(it); if(!m) return '';
    const parts = [];
    if(m.main) parts.push('주담당 '+m.main);
    if(m.subs.length) parts.push('부담당 '+m.subs.join(', '));
    return parts.join(' · ');
  },
  /* ERP 업체 유형: '자문'|'급여'|'노조'|'기금'|'' */
  type(it){ const m = ErpMatch.match(it); return (m && m.type) || ''; },
  /* 이 명함 주인이 그 업체의 실무 담당자로 등록돼 있는가 */
  isContact(it){
    const m = ErpMatch.match(it); if(!m || !m.contact) return false;
    const n = ErpMatch._norm(it.name); if(!n) return false;
    return m.contact === n || m.contact.indexOf(n) === 0;   /* '유석주이사' 같은 직책 붙은 표기 허용 */
  },
  /* 이 명함 주인이 그 업체의 ERP '대표자'인지 '담당자'인지 — 'ceo' | 'contact' | '' */
  _nameHit(a,b){ if(!a||!b) return false; return a===b || a.indexOf(b)===0 || b.indexOf(a)===0; },
  role(it){
    const m = ErpMatch.match(it); if(!m) return '';
    const n = ErpMatch._norm(it.name); if(!n) return '';
    if(ErpMatch._nameHit(m.ceo,n) || ErpMatch._nameHit(m.ceo2,n)) return 'ceo';
    if((m.contacts||[]).some(c=>ErpMatch._nameHit(c,n))) return 'contact';
    return '';
  },
  /* ERP 매칭 명함(자문·급여·노조·기금) → '업체관리' 폴더 자동 분류.
     유형별 구분은 메인화면 ERP 탭에서 관리. (구 자문사 폴더는 업체관리로 이름 변경,
     이전에 급여/기금/노조 폴더로 자동 배정된 명함은 업체관리로 1회 이동)
     - 폴더 미지정 명함만 (기존 수동 폴더 배정은 절대 안 건드림)
     - 한 번 자동 배정한 명함은 erpAutoFoldered 표시 → 사용자가 빼면 다시 안 넣음 */
  autoFolder(){
    try{
      if(!ErpMatch.ready) return;
      const items = Object.values(state.items||{});
      if(!items.length) return;
      /* 폴더는 명함용(card)·사업자용(biz)이 따로 — 이름이 같아도 서로 섞이지 않게 종류까지 맞춰 찾는다 */
      const kindOf = it => (it && it.kind==='biz') ? 'biz' : 'card';
      const gKind  = g  => (g && g.kind) || 'card';
      const byNmK = (nm,k) => Object.values(state.groups||{}).find(x=>x && _canon(x.name)===nm && gKind(x)===k);
      /* 구 '자문사' 폴더는 '업체관리'로 이름 변경 (1회, 명함용) */
      const oldA = byNmK('자문사','card'); if(oldA && !byNmK('업체관리','card')){ oldA.name='업체관리'; Store.putGroup(oldA); }
      /* 대상 폴더 지연 생성 (종류별) */
      const cache={};
      function ensure(nm,k){
        const ck=k+'|'+nm;
        if(cache[ck]) return cache[ck];
        let g = byNmK(nm,k);
        if(!g){ g={id:uid(), name:nm, kind:k, order:Date.now()}; Store.putGroup(g); state.groups[g.id]=g; }
        cache[ck]=g; return g;
      }
      /* 자동 관리 대상 폴더(여기 있으면 상태 변화에 따라 재배치 허용) */
      const AUTO_NAMES=['업체관리','업체퇴사','자문사','급여','기금','노조','사무대행'];
      const autoIds = new Set(Object.values(state.groups||{}).filter(g=>g&&AUTO_NAMES.indexOf(_canon(g.name))>=0).map(g=>g.id));
      let n=0;
      items.forEach(it=>{
        if(!it) return;
        const m = ErpMatch.match(it);
        const matched = !!m && ERP_TYPES.indexOf(m.type)>=0;   /* 자문·급여·노조·기금·사무대행 */
        const targetNm = matched ? (m.left ? '업체퇴사' : '업체관리') : null;
        const k = kindOf(it);
        if(it.erpAutoFoldered){
          /* 자동 배정분: 현재 자동 폴더 안에 있을 때만 상태 따라 재배치 (사용자가 딴 폴더로 옮겼으면 존중) */
          if(targetNm && autoIds.has(it.group)){
            const tg = ensure(targetNm,k);
            if(it.group !== tg.id){ it.group=tg.id; it.updatedAt=Date.now(); Store.put(it); n++; }
          }
          return;
        }
        /* 미지정 + 매칭 → 대상 폴더로 자동 배정 */
        if((it.group||'')==='' && targetNm){
          const tg = ensure(targetNm,k);
          it.group=tg.id; it.erpAutoFoldered=1; it.updatedAt=Date.now(); Store.put(it); n++;
        }
      });
      /* 비게 된 구 자동 폴더 정리 (명함용·사업자용 각각) */
      ['급여','기금','노조','자문사'].forEach(nm=>{
        ['card','biz'].forEach(k=>{
          const og = byNmK(nm,k); if(!og) return;
          if(!items.some(it=>it && it.group===og.id)){ try{ Store.delGroup(og.id); delete state.groups[og.id]; }catch(_){} }
        });
      });
      if(n>0){ toast('🗂 업체 폴더 자동 분류/이동 '+n+'건'); try{ render(); }catch(_){}}
    }catch(e){ console.warn('[autoFolder]', e&&e.message); }
  }
};

/* ── 유틸 ── */
const $ = id => document.getElementById(id);
/* 폴더 이름 표준화 — 앞 번호("1." "01)" 등)와 공백을 무시해 자동폴더 이름을 인식 (예: "1. 업체관리" → "업체관리") */
const _canon = s => String(s||'').replace(/^\s*\d+\s*[.)\-]?\s*/,'').replace(/\s/g,'');

/* ══════ 통합 이메일 로그인 ══════ */
function showCardsLogin(){ const el=$('cardsLogin'); if(el) el.style.display='flex'; }

function doLogoutCards(){

}

/* ══════ 자료 보내기 (제안서·계약서 서랍) ══════ */
let _sendMatId = null;
let _matMeta = {};   /* {id:{id,name,fileName,url,path,uploadedAt}} */

function loadMaterials(cb){
  firebase.database().ref(DB_ROOT+'/materials').once('value').then(s=>{
    _matMeta = s.val() || {};
    if(cb) cb();
  }).catch(e=>console.warn('[materials]', e&&e.message));
}
function matList(){ return Object.values(_matMeta).filter(m=>m&&m.id).sort((a,b)=>(a.uploadedAt||0)-(b.uploadedAt||0)); }

/* 자료함에서 받는 파일 형식 — 확장자별 MIME·아이콘·브라우저 표시 가능 여부 */
const MAT_TYPES = {
  pdf :{mime:'application/pdf', ic:'📄', view:true},
  doc :{mime:'application/msword', ic:'📝'},
  docx:{mime:'application/vnd.openxmlformats-officedocument.wordprocessingml.document', ic:'📝'},
  hwp :{mime:'application/x-hwp', ic:'📝'},
  hwpx:{mime:'application/hwp+zip', ic:'📝'},
  ppt :{mime:'application/vnd.ms-powerpoint', ic:'📊'},
  pptx:{mime:'application/vnd.openxmlformats-officedocument.presentationml.presentation', ic:'📊'},
  xls :{mime:'application/vnd.ms-excel', ic:'📈'},
  xlsx:{mime:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', ic:'📈'},
  txt :{mime:'text/plain', ic:'📃', view:true},
  jpg :{mime:'image/jpeg', ic:'🖼️', view:true},
  jpeg:{mime:'image/jpeg', ic:'🖼️', view:true},
  png :{mime:'image/png', ic:'🖼️', view:true},
  gif :{mime:'image/gif', ic:'🖼️', view:true},
  zip :{mime:'application/zip', ic:'🗜️'}
};
const MAT_ACCEPT = Object.keys(MAT_TYPES).map(e=>'.'+e).join(',');
const matExt  = n => ((String(n||'').match(/\.([a-z0-9]+)$/i)||[])[1]||'').toLowerCase();
const matType = n => MAT_TYPES[matExt(n)];
const matIcon = n => (matType(n)||{}).ic || '📄';

/* ── 자료 보내기 (고객 명함에서: 고르기만) ── */
function openSendMaterials(id){
  const it=state.items[id]; if(!it) return;
  _sendMatId=id;
  renderSendMat();
  $('sendMatBg').classList.add('open');
  loadMaterials(()=>{ if(_sendMatId===id) renderSendMat(); });
}
function closeSendMat(){ $('sendMatBg').classList.remove('open'); _sendMatId=null; }
function renderSendMat(){
  const it = state.items[_sendMatId]; if(!it) return;
  const nm = it.name || it.company || '(이름 없음)';
  const comp = it.company ? ' ('+esc(it.company)+')' : '';
  const email = it.email || '';
  const list = matList();
  const rows = list.length ? list.map(m=>`
      <div class="sm-slot">
        <input type="checkbox" class="sm-chk" data-id="${m.id}" checked>
        <span class="sm-ic">${matIcon(m.fileName)}</span>
        <div class="sm-sinfo"><div class="n">${esc(m.name||'자료')}</div><div class="f">${esc(m.fileName||'')}</div></div>
      </div>`).join('')
    : `<div class="sm-empty">아직 자료함에 등록된 자료가 없습니다.<br>왼쪽 <b>📎 자료함</b>에서 먼저 올려주세요.</div>`;
  $('sendMatSheet').innerHTML = `
    <div class="sm-head">
      <div class="sm-ava">${esc(nm.slice(0,2))}</div>
      <div class="sm-htxt"><div class="t">자료 보내기</div><div class="s">받는 사람 · ${esc(nm)}${comp}</div></div>
      <button class="sm-x" onclick="closeSendMat()">✕</button>
    </div>
    <div class="sm-label">보낼 자료</div>
    ${rows}
    <div class="sm-to">📧 <span>보낼 곳 · ${email?esc(email):'이메일 없음 (명함에 이메일을 추가하세요)'}</span></div>
    <button class="sm-send" onclick="doSendMaterials()" ${(email&&list.length)?'':'disabled'}>자료 보내기</button>
    <div class="sm-note">메일 본문엔 자료를 여는 링크가 담깁니다 (무거운 파일 첨부 없음). 메일 발송 연결은 다음 단계입니다.</div>`;
}
function doSendMaterials(){
  const ids = [...document.querySelectorAll('#sendMatSheet .sm-chk:checked')].map(c=>c.dataset.id);
  if(!ids.length){ toast('보낼 자료를 하나 이상 선택하세요'); return; }

}

/* ── 자료함 (대시보드에서: 관리 — 올리기·교체·미리보기·삭제) ── */

/* PDF를 자료함 시트 위로 끌어다 놓으면 업로드 */
function initShelfDnd(){
  const sh=$('matShelfSheet'); if(sh._dnd) return; sh._dnd=true;
  ['dragenter','dragover'].forEach(ev=>sh.addEventListener(ev, e=>{ e.preventDefault(); sh.classList.add('dragging'); }));
  sh.addEventListener('dragleave', e=>{ if(!sh.contains(e.relatedTarget)) sh.classList.remove('dragging'); });
  sh.addEventListener('drop', async e=>{
    e.preventDefault(); sh.classList.remove('dragging');
    const files=[...((e.dataTransfer&&e.dataTransfer.files)||[])];
    const ok=files.filter(f=>matType(f.name));
    if(!ok.length){ toast('지원하지 않는 파일 형식입니다 (PDF·워드·한글·PPT·엑셀·이미지 등)'); return; }
    if(ok.length<files.length) toast(`지원하지 않는 형식 ${files.length-ok.length}개는 건너뜁니다`);
    for(const f of ok){
      const defName=f.name.replace(/\.[a-z0-9]+$/i,'');
      const name=(prompt('자료 이름을 입력하세요 (예: 회사소개서)', defName)||'').trim();
      if(!name) continue;
      await putMaterial('m'+Date.now()+Math.random().toString(36).slice(2,6), name, f);
    }
  });
}
function closeMatShelf(){ $('matShelfBg').classList.remove('open'); }
function renderMaterialShelf(){
  const list = matList();

        <div class="shelf-acts">
          <button title="미리보기" onclick="previewMaterial('${m.id}')">👁</button>
          <label title="파일 교체" class="shelf-rep">🔄<input type="file" accept="${MAT_ACCEPT}" style="display:none" onchange="replaceMaterialFile('${m.id}',this)"></label>
          <button title="삭제" onclick="deleteMaterial('${m.id}')">🗑</button>

      <button class="sm-x" onclick="closeMatShelf()">✕</button>

    ${rows}
    <div class="sm-note">여기 올린 자료가 고객 명함의 "자료 보내기"에 자동으로 나타납니다. PDF·워드·한글(hwp/hwpx)·PPT·엑셀·이미지 파일을 이 창에 끌어다 놓아도 올라갑니다 (8MB 이하).</div>`;

async function addMaterial(input){
  const file = input.files && input.files[0]; input.value='';
  if(!file) return;
  if(!matType(file.name)){ toast('지원하지 않는 파일 형식입니다 (PDF·워드·한글·PPT·엑셀·이미지 등)'); return; }
  const defName = file.name.replace(/\.[a-z0-9]+$/i,'');
  const name = (prompt('자료 이름을 입력하세요 (예: 회사소개서)', defName)||'').trim();
  if(!name) return;
  const id = 'm'+Date.now()+Math.random().toString(36).slice(2,6);
  await putMaterial(id, name, file);
}
async function replaceMaterialFile(id, input){
  const file = input.files && input.files[0]; input.value='';
  if(!file) return;
  if(!matType(file.name)){ toast('지원하지 않는 파일 형식입니다 (PDF·워드·한글·PPT·엑셀·이미지 등)'); return; }
  const cur = _matMeta[id]; if(!cur) return;
  await putMaterial(id, cur.name, file);
}
/* 파일 본문은 명함 사진과 같은 방식으로 DB에 저장 (Storage 미사용 — 권한설정 불필요) */
async function putMaterial(id, name, file){
  if (file.size > 8*1024*1024){ toast(`파일이 너무 큽니다 (${(file.size/1024/1024).toFixed(1)}MB) — 8MB 이하만 올릴 수 있습니다`); return; }
  toast('업로드 중…');
  try{
    const dataUrl = await new Promise((res,rej)=>{
      const r=new FileReader();
      r.onload=()=>res(r.result);
      r.onerror=()=>rej(new Error('파일을 읽을 수 없습니다'));
      r.readAsDataURL(file);
    });
    const meta = { id, name, fileName:file.name, size:file.size, uploadedAt: Date.now() };
    await firebase.database().ref(DB_ROOT+'/materialFiles/'+id).set(dataUrl);
    await firebase.database().ref(DB_ROOT+'/materials/'+id).set(meta);
    _matMeta[id]=meta;
    renderMaterialShelf();
    toast('✅ 올렸습니다');
  }catch(e){
    console.warn('[upload]', e&&e.message);
    toast('업로드 실패: '+((e&&e.message)||'알 수 없는 오류'));
  }
}
async function previewMaterial(id){
  const m=_matMeta[id]; if(!m) return;
  if (m.url){ window.open(m.url,'_blank'); return; }  /* 예전 Storage 방식으로 올린 자료 호환 */
  toast('여는 중…');
  try{
    const s = await firebase.database().ref(DB_ROOT+'/materialFiles/'+id).once('value');
    const dataUrl = s.val();
    if(!dataUrl){ toast('파일 데이터가 없습니다 — 자료를 다시 올려주세요'); return; }
    const bin = atob(dataUrl.split(',')[1]);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    const t = matType(m.fileName) || {mime:'application/octet-stream'};
    const url = URL.createObjectURL(new Blob([arr], {type:t.mime}));
    if (t.view){ window.open(url,'_blank'); }
    else { /* 한글·워드·PPT 등 브라우저가 못 여는 형식은 원본 파일명으로 내려받기 */
      const a=document.createElement('a'); a.href=url; a.download=m.fileName||'자료';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      toast('브라우저에서 바로 볼 수 없는 형식이라 내려받았습니다');
    }
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){ toast('미리보기 실패: '+((e&&e.message)||'')); }
}
async function deleteMaterial(id){
  const m=_matMeta[id]; if(!m) return;
  if(!confirm(`'${m.name}' 자료를 삭제할까요?`)) return;
  try{
    await firebase.database().ref(DB_ROOT+'/materials/'+id).remove();
    await firebase.database().ref(DB_ROOT+'/materialFiles/'+id).remove();
    delete _matMeta[id];
    renderMaterialShelf();
    toast('삭제했습니다');
  }catch(e){ toast('삭제 실패: '+((e&&e.message)||'')); }
}
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const digits = s => String(s||'').replace(/\D/g,'');
const fmtDate = ts => { const d=new Date(ts||0);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; };
const fmtBizno = v => { const d=digits(v); return d.length===10 ? `${d.slice(0,3)}-${d.slice(3,5)}-${d.slice(5)}` : (v||''); };
function toast(msg, ms=2600){ const t=$('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.style.display='none', ms); }

/* ── 목록 데이터 ── */
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function chosung(s){ let r='';
  for (const ch of String(s||'')){ const c=ch.charCodeAt(0);
    r += (c>=0xAC00 && c<=0xD7A3) ? CHO[Math.floor((c-0xAC00)/588)] : ch; }
  return r; }
/* 빈 명함(이름·회사·전화·이메일 모두 없음) 목록 — 정리 센터 건수 표시에도 사용 */

/* 회사주소 앞 시·도 추출 (지역 필터용) */
function regionOf(it){
  const a=String(it.companyAddr||it.address||'').trim(); if(!a) return '';
  const m=a.match(/^(서울특별시|부산광역시|대구광역시|인천광역시|광주광역시|대전광역시|울산광역시|세종특별자치시|제주특별자치도|강원특별자치도|충청북도|충청남도|전라북도|전라남도|경상북도|경상남도|경기도|서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)/);
  if(!m) return '';
  const map={'서울특별시':'서울','부산광역시':'부산','대구광역시':'대구','인천광역시':'인천','광주광역시':'광주','대전광역시':'대전','울산광역시':'울산','세종특별자치시':'세종','경기도':'경기','강원특별자치도':'강원','충청북도':'충북','충청남도':'충남','전라북도':'전북','전라남도':'전남','경상북도':'경북','경상남도':'경남','제주특별자치도':'제주'};
  return map[m[1]]||m[1];
}
function listItems(){
  const q = $('search').value.trim().toLowerCase();
  const qc = q.replace(/\s/g,'');
  const isCho = qc && /^[ㄱ-ㅎ]+$/.test(qc);   /* 초성 검색: ㅎㄱㄷ → 홍길동 */
  const arr = Object.values(state.items)
    .filter(it => it.kind===state.tab)
    .filter(it => {
      if (state.group==='all') return true;
      return (it.group||'')===state.group;
    })
    .filter(it => state.owner==='all' || (it.owner||'')===state.owner)
    /* 담는 탭(직접 골라 담은 탭)이 켜져 있으면 그 탭에 담긴 명함만 */
    .filter(it => !state.vtab || (it.vtabs||[]).indexOf(state.vtab)>=0)
    .filter(it => {
      /* 잠긴 폴더(세션에서 해제 안 된)의 명함은 숨김. 단 그 폴더를 직접 열고 있으면 보임 */
      const gid = it.group||'';
      if (!gid) return true;
      const g = state.groups[gid];
      if (!g || !g.locked) return true;
      if (!canSeeGroup(g)) return false;                        /* 남의 잠긴 폴더 → 아예 안 보임 */
      if (state.unlocked && state.unlocked[gid]) return true;   /* 세션에서 풀림 */
      if (state.group===gid) return true;                       /* 그 폴더를 직접 보는 중 */
      return false;
    })
    .filter(it => !state.region || regionOf(it)===state.region)
    .filter(it => !q || [it.name,it.company,it.title,it.dept,it.mobile,it.tel,it.email,
                         it.ceo,it.bizno,it.address].some(v => String(v||'').toLowerCase().includes(q)
                         || (digits(q).length>=3 && digits(v).includes(digits(q))))
                || (isCho && [it.name,it.company,it.ceo].some(v=>chosung(v).replace(/\s/g,'').includes(qc))))
    /* 칸별 검색 필터 */
    .filter(it => {
      const f = state.colFilter || {};
      const has = (key, val) => !val || String(it[key]||'').toLowerCase().includes(String(val).toLowerCase());
      if (f.name && !(String(it.name||'').toLowerCase().includes(f.name.toLowerCase()))) return false;
      if (f.company && !(String(it.company||'').toLowerCase().includes(f.company.toLowerCase()))) return false;
      if (f.phone){ const d=digits(f.phone); if(!(digits(it.mobile).includes(d)||digits(it.tel).includes(d)||digits(it.companyTel).includes(d))) return false; }
      if (f.email && !has('email', f.email)) return false;
      return true;
    })
    /* 조건 필터: 전화있음 / 이메일있음 / 중복만 */
    .filter(it => {
      if (state.onlyPhone && !(it.mobile||it.tel||it.companyTel)) return false;
      if (state.onlyEmail && !it.email) return false;
      if (state.onlyIncomplete && (it.mobile||it.tel||it.companyTel) && it.email) return false;
      if (state.onlyPrivate && it.scope!=='private') return false;
      /* ERP 연결 필터: 자문/급여/노조/기금(유형) · linked(연결만) · none(미연결) */
      if (state.erpFilter){
        const m = ErpMatch.match(it);
        if (state.erpFilter==='none'){ if(m) return false; }
        else if (state.erpFilter==='linked'){ if(!m) return false; }
        else { if(!m || (m.type||'')!==state.erpFilter) return false; }
      }
      return true;
    });
  /* 중복만 보기 */
  let result = arr;
  if (state.onlyDup){
    const kc={}; Object.values(state.items).filter(x=>x.kind===state.tab)
      .forEach(x=>itemKeys(x).forEach(k=>kc[k]=(kc[k]||0)+1));
    result = arr.filter(it=>itemKeys(it).some(k=>kc[k]>1));
  }
  /* 헤더 클릭 정렬(PC) 우선, 없으면 기존 등록일/이름순 */
  if (state.sortKey){
    const dir = state.sortDir==='asc' ? 1 : -1;
    const val = (it)=>{
      switch(state.sortKey){
        case 'name': return it.name||it.company||'';
        case 'company': return it.company||'';
        case 'phone': return digits(it.mobile||it.tel||'');
        case 'date': return it.createdAt||0;
        default: return '';
      }
    };
    result.sort((a,b)=>{ const x=val(a),y=val(b);
      if (typeof x==='number') return (x-y)*dir;
      return String(x).localeCompare(String(y),'ko')*dir; });
  }
  else if (state.sort==='name')
    result.sort((a,b)=>String(a.name||a.company||'').localeCompare(String(b.name||b.company||''),'ko'));
  else result.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return result;
}

/* ── ＋ FAB: 한 번 누르면 바로 촬영 화면 (사진첩·직접 입력은 길게 누르기) ──
   촬영 화면 안에도 '🖼️ 사진첩'·'⋯ 다른 수단'이 있어 대부분은 바로 촬영이면 충분하다. */
(function(){
  const fab = $('fab'); if(!fab) return;
  let timer = null, longFired = false;
  const clear = () => { if(timer){ clearTimeout(timer); timer = null; } };
  fab.addEventListener('pointerdown', () => {
    longFired = false;
    clear();
    timer = setTimeout(() => { longFired = true; openAddSheet(); }, 550);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => fab.addEventListener(ev, clear));
  fab.addEventListener('contextmenu', e => e.preventDefault());   /* 길게 누를 때 뜨는 브라우저 메뉴 차단 */
  fab.addEventListener('click', e => {
    if(longFired){ longFired = false; e.preventDefault(); return; }   /* 길게 눌러 시트를 연 경우 */
    openCamera();
  });
})();

<script>
/* ════════════ 파일 입력 루프: 촬영·파일·드래그·Ctrl+V → AI → 저장 ════════════ */
const fileQueue=[]; let processing=false;
function onFiles(files){ [...files].forEach(f=>fileQueue.push(f)); pumpQueue(); }
async function pumpQueue(){
  if (processing || !fileQueue.length) return;
  processing=true;
  const f=fileQueue.shift();
  try{
    toast('이미지 처리·선명 보정 중…',9000);
    let photo = await fileToImage(f);
    try{ photo = await enhance(photo); }catch(_){}
    const thumb = await makeThumb(photo);
    let pre={};
    if (geminiKey()){
      toast('🤖 AI가 정보를 읽고 있습니다…',15000);
      try{ pre = await aiExtract(photo, state.tab); }
      catch(e){ console.error(e); toast('AI 추출 실패 — 직접 입력해주세요'); }
    } else toast('AI 키가 없어 직접 입력 모드입니다 (☰ 설정에서 등록)');
    openEditor(null, {photo, thumb}, pre);
  }catch(e){ console.error(e); toast('파일을 읽을 수 없습니다'); processing=false; pumpQueue(); }
}
function queueNext(){ processing=false; pumpQueue(); }

async function fileToImage(f){
  if (f.type==='application/pdf' || /\.pdf$/i.test(f.name||'')) return pdfToImage(f);
  const url=URL.createObjectURL(f);
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  URL.revokeObjectURL(url);
  return shrink(img);
}
function shrink(img){
  /* OCR 정확도·선명도를 위해 넉넉한 해상도·화질 유지 (최대 1600px, 품질 .85) */
  const M=1600, r=Math.min(1, M/Math.max(img.width,img.height));
  const c=document.createElement('canvas');
  c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.85);
}
/* 자동 선명도·명암 보정 — 흐릿하거나 어두운 명함 글자를 또렷하게 (자동) */
function enhance(dataUrl){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const w=img.width, h=img.height;
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        const ctx=c.getContext('2d'); ctx.drawImage(img,0,0);
        const im=ctx.getImageData(0,0,w,h), d=im.data, total=w*h;
        /* 1) 자동 명암: 밝기 2~98% 구간을 0~255로 늘려 대비를 살림 */
        const hist=new Uint32Array(256);
        for(let i=0;i<d.length;i+=4){ hist[(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)|0]++; }
        const cut=total*0.02; let acc=0, lo=0, hi=255;
        for(let i=0;i<256;i++){ acc+=hist[i]; if(acc>=cut){ lo=i; break; } }
        acc=0; for(let i=255;i>=0;i--){ acc+=hist[i]; if(acc>=cut){ hi=i; break; } }
        if(hi-lo<32){ lo=0; hi=255; }
        const lut=new Uint8Array(256);
        for(let i=0;i<256;i++){ const v=(i-lo)*255/(hi-lo); lut[i]=v<0?0:v>255?255:v; }
        for(let i=0;i<d.length;i+=4){ d[i]=lut[d[i]]; d[i+1]=lut[d[i+1]]; d[i+2]=lut[d[i+2]]; }
        /* 2) 언샤프(선명): 라플라시안 가중으로 윤곽 강화 */
        const out=new Uint8ClampedArray(d), amt=0.7, W4=w*4;
        for(let y=1;y<h-1;y++){
          for(let x=1;x<w-1;x++){
            const o=(y*w+x)*4;
            for(let ch=0;ch<3;ch++){
              const p=o+ch;
              const lap=4*d[p]-d[p-4]-d[p+4]-d[p-W4]-d[p+W4];
              const v=d[p]+amt*lap;
              out[p]=v<0?0:v>255?255:v;
            }
          }
        }
        im.data.set(out); ctx.putImageData(im,0,0);
        res(c.toDataURL('image/jpeg',.9));
      }catch(e){ res(dataUrl); }   /* 실패 시 원본 그대로 */
    };
    img.onerror=()=>res(dataUrl);
    img.src=dataUrl;
  });
}
/* 목록용 썸네일(약 5~10KB) — 목록 로딩을 가볍게 유지 */
function makeThumb(dataUrl){
  return new Promise(res=>{ const i=new Image();
    i.onload=()=>{ const M=320, r=Math.min(1, M/Math.max(i.width,i.height));
      const c=document.createElement('canvas');
      c.width=Math.round(i.width*r); c.height=Math.round(i.height*r);
      c.getContext('2d').drawImage(i,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',.65)); };
    i.onerror=()=>res(''); i.src=dataUrl; });
}
async function pdfToImage(f){
  if (!window.pdfjsLib){
    await new Promise((res,rej)=>{ const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const buf=await f.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const page=await pdf.getPage(1);
  const vp=page.getViewport({scale:2});
  const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
  await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  const img=new Image(); img.src=c.toDataURL('image/jpeg',.85);
  await new Promise(r=>img.onload=r);
  return shrink(img);
}

let dragDepth=0;
window.addEventListener('dragenter',e=>{ if([...e.dataTransfer.types].includes('Files')){ dragDepth++; $('dropov').classList.add('open'); }});

/* ════════════ AI 자동 추출 (Gemini) ════════════ */
async function aiExtract(dataUrl, kind){
  const key=geminiKey();
  const prompt = kind==='card'
    ? `이 명함 이미지에서 정보를 추출해 JSON으로만 답하세요. 키: name(이름), company(회사명), dept(부서), title(직책), mobile(휴대폰), tel(직통전화), fax(개인팩스), email(이메일), companyTel(회사 대표번호), companyFax(회사 팩스), companyAddr(회사 주소), website(홈페이지), address(개인 주소), memo(기타 정보). 없는 값은 빈 문자열. 전화번호는 010-1234-5678 형식. JSON 외 텍스트 금지.`
    : `이 사업자등록증 이미지에서 정보를 추출해 JSON으로만 답하세요. 키: company(상호/법인명), ceo(대표자), bizno(사업자등록번호), corpno(법인등록번호), openDate(개업연월일), bizType(업태), bizItem(종목), companyTel(대표번호), companyFax(팩스), address(사업장 소재지), memo(기타). 없는 값은 빈 문자열. JSON 외 텍스트 금지.`;
  const body={contents:[{parts:[
    {inline_data:{mime_type:'image/jpeg',data:dataUrl.split(',')[1]}},
    {text:prompt}]}]};
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`,
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('Gemini API 오류 '+r.status);
  const j=await r.json();
  const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
  return JSON.parse(t.replace(/```json|```/g,'').trim());
}

const CARD_FIELDS=[['name','이름'],['company','회사'],['dept','부서'],['title','직책'],
  ['mobile','휴대폰'],['tel','직통전화'],['email','이메일'],['fax','개인팩스'],

  ['owner','담당자'],['address','개인 주소'],['memo','메모']];
const BIZ_FIELDS=[['company','상호(법인명)'],['ceo','대표자'],['bizno','사업자등록번호'],['corpno','법인등록번호'],
  ['openDate','개업연월일'],['bizType','업태'],['bizItem','종목'],['companyTel','대표번호'],['companyFax','팩스'],
  ['owner','담당자'],['address','사업장 소재지'],['memo','메모']];

let editing=null;
function openEditor(item, photoObj, pre){
  const kind = item ? item.kind : state.tab;
  editing = { id:item?.id, kind,
    photo: photoObj?.photo || '', thumb: photoObj?.thumb || item?.thumb || '',
    photoDirty: !!photoObj,
    photo2:'', thumb2: item?.thumb2 || '', photoDirty2:false };

  const fields = kind==='card' ? CARD_FIELDS : BIZ_FIELDS;
  const wide=['address','memo','email'];
  let fh='';
  fields.forEach(([k,label])=>{
    const tag = k==='memo'
      ? `<textarea id="f_${k}">${esc(src[k])}</textarea>`
      : `<input id="f_${k}" value="${esc(src[k])}">`;
    fh += `<div class="field" style="${wide.includes(k)?'grid-column:1/3':''}"><label>${label}</label>${tag}</div>`;
  });
  const groups=Object.values(state.groups).filter(canSeeGroup).sort((a,b)=>(a.order||0)-(b.order||0));
  /* 새 명함이고 현재 폴더 보는 중이면 그 폴더를 기본 선택 */
  const curGroupValid = state.group && state.group!=='all' && state.groups[state.group] && (state.groups[state.group].kind||'card')===kind;
  const defGroup = (src.group!==undefined && src.group!=='') ? src.group : (!item && curGroupValid ? state.group : (src.group||''));
  const gOpts=`<option value="">미분류</option>`+groups.map(g=>
    `<option value="${g.id}" ${defGroup===g.id?'selected':''}>${esc(g.name)}</option>`).join('');

    <div class="mhead"><b>${item?'수정':(kind==='card'?'명함 등록':'사업자등록증 등록')}</b>

      ? `<img src="${editing.photo||editing.thumb}" onclick="zoom('__EDIT__')">`

          <button class="btn ghost" style="flex:none;padding:8px 12px" onclick="fileInput.click()">📁 사진 첨부</button></div>` }
      <div id="backPane" style="margin-top:8px">${ editing.thumb2
        ? `<img src="${editing.thumb2}" style="max-height:120px" onclick="zoom('__EDIT_B__')">`
        : `<button class="btn ghost" style="flex:none;padding:7px 12px;font-size:12.5px" onclick="backInput.click()">＋ 뒷면 사진 추가</button>` }</div></div>
    <div class="fgrid">${fh}</div>
    <div class="field"><label>그룹</label><select id="f_group">${gOpts}</select></div>
    <div class="mfoot">
      <button class="btn ghost" onclick="closeEditor()">취소</button>
      <button class="btn primary" onclick="saveEditor()">💾 저장</button></div>`;
  $('editorBg').classList.add('open');
  if (item && !editing.photo && item.thumb){
    Store.getPhoto(item.id).then(p=>{ if(!p || !editing || editing.id!==item.id) return;
      editing.photo=p;
      const im=document.querySelector('#editorM .photo-pane img'); if(im) im.src=p; });
  }
}
function closeEditor(){ $('editorBg').classList.remove('open'); editing=null; queueNext(); }
async function onBackFile(files){
  const f=files[0]; if(!f || !editing) return;
  try{
    editing.photo2 = await fileToImage(f);
    editing.thumb2 = await makeThumb(editing.photo2);
    editing.photoDirty2 = true;
    $('backPane').innerHTML = `<img src="${editing.thumb2}" style="max-height:120px" onclick="zoom('__EDIT_B__')">`;
  }catch(e){ toast('뒷면 사진을 읽지 못했습니다'); }
}

async function saveEditor(){
  const kind=editing.kind;
  const fields = kind==='card' ? CARD_FIELDS : BIZ_FIELDS;
  const it={ id: editing.id||uid(), kind, group:$('f_group').value,
    thumb: editing.thumb || (editing.id ? (state.items[editing.id]?.thumb||'') : ''),
    thumb2: editing.thumb2 || (editing.id ? (state.items[editing.id]?.thumb2||'') : ''),
    fav: editing.id ? !!state.items[editing.id]?.fav : false,
    createdAt: editing.id ? (state.items[editing.id]?.createdAt||Date.now()) : Date.now() };
  fields.forEach(([k])=> it[k]=$('f_'+k).value.trim());
  if (kind==='card' && !it.name && !it.company) return toast('이름 또는 회사를 입력해주세요');
  if (kind==='biz' && !it.company && !it.bizno) return toast('상호 또는 사업자번호를 입력해주세요');

  if (!editing.id){
    const keyVal = kind==='card' ? digits(it.mobile) : digits(it.bizno);
    if (keyVal){
      const dup = Object.values(state.items).find(x=> x.kind===kind && x.id!==it.id &&
        (kind==='card' ? digits(x.mobile)===keyVal : digits(x.bizno)===keyVal));
      if (dup){
        const act = await dupDialog(dup, kind);
        if (act==='cancel') return;
        if (act==='merge'){ mergeInto(dup,it);
          if (editing.photoDirty && editing.photo) Store.putPhoto(dup.id, editing.photo);
          if (editing.photoDirty2 && editing.photo2) Store.putPhoto(dup.id+'_b', editing.photo2);
          $('editorBg').classList.remove('open'); editing=null;
          toast('기존 항목을 업데이트했습니다'); queueNext(); return; }
      }
    }
  }
  Store.put(it);
  if (editing.photoDirty && editing.photo) Store.putPhoto(it.id, editing.photo);
  if (editing.photoDirty2 && editing.photo2) Store.putPhoto(it.id+'_b', editing.photo2);
  $('editorBg').classList.remove('open'); editing=null;
  toast('저장되었습니다'+(Store.mode==='firebase'?' — 전 직원 공유 완료':''));
  queueNext();
}
function mergeInto(oldIt,newIt){
  Object.keys(newIt).forEach(k=>{ if(['id','createdAt'].includes(k)) return; if(newIt[k]) oldIt[k]=newIt[k]; });
  Store.put(oldIt);
}
function dupDialog(dup,kind){
  return new Promise(res=>{
    const who = kind==='card' ? `${esc(dup.name||'')} / ${esc(dup.company||'')}` : esc(dup.company||'');
    $('dupbox').innerHTML=`
      <div class="mhead"><b>⚠️ 이미 등록되어 있습니다</b></div>
      <p style="font-size:14px;color:var(--sub);line-height:1.6">
        같은 ${kind==='card'?'전화번호':'사업자번호'}의 항목이 있습니다:<br><b style="color:var(--ink)">${who}</b></p>
      <button class="btn primary" onclick="dupPick('merge')">기존 항목을 새 정보로 업데이트</button>
      <button class="btn ghost" onclick="dupPick('new')">그래도 새로 저장</button>
      <button class="btn danger" onclick="dupPick('cancel')">취소</button>`;
    $('dupBg').classList.add('open');
    window.dupPick=a=>{ $('dupBg').classList.remove('open'); res(a); };
  });
}

<script>

async function shareItem(id){
  const it=state.items[id]; if(!it) return;
  const isCard = it.kind==='card';
  const text = (isCard
    ? [it.name, [it.company,it.dept,it.title].filter(Boolean).join(' '),
       it.mobile&&'휴대폰 '+it.mobile, it.tel&&'전화 '+it.tel,
       it.email&&'이메일 '+it.email, it.address]
    : [it.company, it.ceo&&'대표자 '+it.ceo, it.bizno&&'사업자번호 '+fmtBizno(it.bizno), it.address])
    .filter(Boolean).join('\n');
  const data = { title: isCard ? (it.name||'명함') : (it.company||'사업자등록증'), text };
  try{
    const p = await Store.getPhoto(id);
    if (p && navigator.canShare){
      const blob = await (await fetch(p)).blob();
      const file = new File([blob], fileNameFor(it), {type:'image/jpeg'});
      if (navigator.canShare({files:[file]})) data.files=[file];
    }
  }catch(e){}
  if (navigator.share){ try{ await navigator.share(data); }catch(e){} }
  else { try{ await navigator.clipboard.writeText(text); toast('이 브라우저는 공유창이 없어 내용을 복사했습니다'); }catch(e){ toast('공유를 지원하지 않는 브라우저입니다'); } }
}

/* ════════════ 내 폰 연락처 저장 (vCard) ════════════ */
function copyCardInfo(id){
  const it=state.items[id]; if(!it) return;
  const parts=[];
  if(it.name) parts.push(it.name);
  if(it.title||it.dept) parts.push([it.title,it.dept].filter(Boolean).join(' '));
  if(it.company) parts.push(it.company);
  if(it.mobile) parts.push('휴대폰 '+it.mobile);
  if(it.companyTel||it.tel) parts.push('전화 '+(it.companyTel||it.tel));
  if(it.email) parts.push(it.email);
  if(it.companyAddr||it.address) parts.push(it.companyAddr||it.address);
  const text=parts.join(' / ');
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>toast('명함 정보를 복사했습니다')).catch(()=>fallbackCopy(text));
  else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); toast('명함 정보를 복사했습니다'); }catch(e){ toast('복사 실패'); }
  document.body.removeChild(ta);
}
function downloadVcf(id){
  const it=state.items[id]; if(!it) return;
  const lines=['BEGIN:VCARD','VERSION:3.0',
    `N:${it.name||''};;;;`,`FN:${it.name||''}`,
    it.company && `ORG:${it.company}${it.dept?';'+it.dept:''}`,
    it.title && `TITLE:${it.title}`,
    it.mobile && `TEL;TYPE=CELL:${it.mobile}`,
    it.tel && `TEL;TYPE=WORK:${it.tel}`,
    it.fax && `TEL;TYPE=FAX:${it.fax}`,
    it.email && `EMAIL:${it.email}`,
    it.address && `ADR;TYPE=WORK:;;${it.address};;;;`,
    it.memo && `NOTE:${it.memo.replace(/\n/g,'\\n')}`,
    'END:VCARD'].filter(Boolean);
  const blob=new Blob([lines.join('\r\n')],{type:'text/vcard;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=(it.name||'contact')+'.vcf';
  a.click(); URL.revokeObjectURL(a.href);
  toast('내려받은 파일을 열면 연락처에 저장됩니다');
}

/* ════════════ ERP 거래처(companies) 연동 — 명함 → ERP ════════════ */
/* ERP의 CompanyRef와 동일한 정규화로 중복 거래처 생성 방지 */
function erpNormName(s){ return String(s||'')
  .replace(/㈜|\(주\)|주식회사|주\)|\(유\)|유한회사|농업회사법인/g,'')
  .replace(/\s+/g,'').replace(/[·.,'"`()]/g,'').toLowerCase(); }
function erpNormBiz(s){ const d=String(s||'').replace(/\D/g,''); return d.length>=10?d.slice(0,10):''; }

async function sendToErp(id){
  const it=state.items[id]; if(!it || it.kind!=='card') return;
  if (Store.mode!=='firebase') return toast('ERP 연동은 Firebase 연결 후 가능합니다');
  if (!it.company) return toast('회사명이 없어 거래처로 등록할 수 없습니다');
  try{
    /* 푸른이알피 업체는 data/companies/{v:목록, u:갱신시각} 에 있다.
       예전에는 루트 companies 에 썼는데 그 노드는 아무도 읽지 않아 등록해도 나타나지 않았다. */
    const db = firebase.database();
    const snap = await db.ref('data/companies').once('value');
    const wrap = snap.val();
    const raw  = (wrap && wrap.v !== undefined) ? wrap.v : wrap;   // 배열형·객체형 둘 다 쓰인다
    const list = Array.isArray(raw) ? raw.filter(Boolean)
               : (raw && typeof raw === 'object' ? Object.keys(raw).map(k=>raw[k]).filter(Boolean) : []);
    const nBiz=erpNormBiz(it.bizno), nName=erpNormName(it.company);
    const exist = list.find(c=> (nBiz && erpNormBiz(c.bizNo)===nBiz) || (nName && erpNormName(c.name)===nName));
    if (exist) return toast(`이미 ERP 거래처에 있습니다: ${exist.name}`);
    /* 사업자번호 없이 등록하면 이름으로만 이어져 나중에 같은 회사가 두 번 생긴다 — 미리 알린다 */
    const warn = nBiz ? '' : '\n\n⚠ 이 명함에는 사업자번호가 없습니다.\n사업자번호 없이 등록하면 나중에 같은 회사가 두 번 생길 수 있습니다.\n업체관리에서 사업자번호를 채워 주세요.';
    if (!confirm(`'${it.company}'를 ERP 거래처로 등록할까요?${warn}`)) return;
    /* ERP companies 레코드 형태(필드명 일치): name·bizNo·ceo·phone·email·address·manager */
    const now = Date.now();
    const rec = { id:'co-'+now.toString(36)+Math.random().toString(36).slice(2,6),
      name: it.company, bizNo: it.bizno||'', ceo: '',
      phone: it.tel || it.mobile || '', email: it.email||'',
      address: it.address||'', manager: it.owner||'',
      _fromCard: it.id, createdAt: now, updatedAt: now };
    const up = {};
    if (raw && !Array.isArray(raw) && typeof raw === 'object'){
      up['data/companies/v/'+rec.id] = rec;              // 객체형 — 건별 쓰기(푸른이알피 dbUpsert와 동일)
    } else {
      up['data/companies/v'] = list.concat([rec]);       // 배열형 — 통째 쓰기(푸른이알피 dbSet과 동일)
    }
    up['data/companies/u'] = now;                        // 갱신시각 — 푸른이알피가 이걸 보고 다시 읽는다
    await db.ref().update(up);
    toast(`✅ ERP 거래처로 등록했습니다: ${it.company}`);
  }catch(e){ console.error(e); toast('ERP 등록 실패 — 권한 또는 연결을 확인하세요'); }
}

/* ════════════ 📷 인앱 카메라: 가이드 틀 + 앞/뒷면 연속 촬영 ════════════ */
let camStream=null, camStage='front', camFront=null, camTrack=null, imageCapture=null;
async function openCamera(){
  try{
    camStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:3840}, height:{ideal:2160} }, audio:false });
  }catch(e){
    try{ camStream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:'environment'}, audio:false }); }
    catch(e2){ cameraInput.click(); return; }   /* 권한 거부·미지원 → 폰 기본 카메라로 폴백 */
  }
  camTrack = camStream.getVideoTracks()[0];
  try{ await camTrack.applyConstraints({ advanced:[{focusMode:'continuous'}] }); }catch(_){}
  try{ imageCapture = ('ImageCapture' in window) ? new ImageCapture(camTrack) : null; }catch(_){ imageCapture=null; }
  camStage='front'; camFront=null;
  $('camlabel').textContent='앞면';
  $('camask').style.display='none';
  $('camvid').srcObject=camStream;
  $('cambg').classList.add('open');
}
function closeCamera(){
  if (camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  camTrack=null; imageCapture=null;
  $('cambg').classList.remove('open');
}
function camPickGallery(){ closeCamera(); fileInput.click(); }
function camOther(){ closeCamera(); cameraInput.click(); }   /* 폰 기본 카메라 */
/* 화면 탭 → 그 지점으로 초점 (지원 기기) */
$('camvid') && $('camvid').addEventListener('click', async e=>{
  if(!camTrack) return;
  const r=e.target.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
  try{ await camTrack.applyConstraints({ advanced:[{focusMode:'single-shot', pointsOfInterest:[{x,y}]}] });
       toast('초점 맞추는 중…',800); }catch(_){}
});
async function camShot(){
  const v=$('camvid');
  if (!v.videoWidth) return;
  toast('촬영 중…',1200);
  /* 가능하면 고해상도 스틸 촬영(선명), 아니면 미리보기 프레임 캡처 */
  let srcImg=v, sw=v.videoWidth, sh=v.videoHeight;
  if(imageCapture){
    try{
      const blob=await imageCapture.takePhoto();
      const url=URL.createObjectURL(blob);
      srcImg=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
      URL.revokeObjectURL(url);
      sw=srcImg.naturalWidth||srcImg.width; sh=srcImg.naturalHeight||srcImg.height;
    }catch(_){ srcImg=v; sw=v.videoWidth; sh=v.videoHeight; }
  }
  /* 가이드 틀 영역만 잘라내기 (object-fit:cover 좌표 보정) */
  const e=v.getBoundingClientRect(), f=$('camframe').getBoundingClientRect();
  const scale=Math.max(e.width/v.videoWidth, e.height/v.videoHeight);
  const visW=e.width/scale, visH=e.height/scale;
  const offX=(v.videoWidth-visW)/2, offY=(v.videoHeight-visH)/2;
  let fx=offX+(f.left-e.left)/scale, fy=offY+(f.top-e.top)/scale;
  let fw=f.width/scale, fh=f.height/scale;
  /* 스틸 해상도가 미리보기와 다르면 비례 보정 */
  const rx=sw/v.videoWidth, ry=sh/v.videoHeight;
  fx*=rx; fy*=ry; fw*=rx; fh*=ry;
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(fw)); c.height=Math.max(1,Math.round(fh));
  c.getContext('2d').drawImage(srcImg, fx,fy,fw,fh, 0,0,c.width,c.height);
  const img=new Image();
  img.onload=async()=>{ let dd=shrink(img); toast('선명하게 다듬는 중…',4000);
    try{ dd=await enhance(dd); }catch(_){} afterShot(dd); };
  img.src=c.toDataURL('image/jpeg',.95);
}
function afterShot(dataUrl){
  if (camStage==='front'){ camFront=dataUrl; $('camask').style.display='flex'; }
  else { const back=dataUrl; closeCamera(); startEditorFromCamera(camFront, back); }
}
function camAskBack(yes){
  $('camask').style.display='none';
  if (yes){ camStage='back'; $('camlabel').textContent='뒷면'; }
  else { closeCamera(); startEditorFromCamera(camFront, null); }
}
async function startEditorFromCamera(front, back){
  toast('이미지 처리 중…',9000);
  const thumb=await makeThumb(front);
  let pre={};
  if (geminiKey()){

    catch(e){ console.error(e); toast('AI 추출 실패 — 직접 입력해주세요'); }
  } else toast('AI 키가 없어 직접 입력 모드입니다 (☰ 설정에서 등록)');
  openEditor(null, {photo:front, thumb}, pre);
  if (back && editing){
    editing.photo2=back; editing.thumb2=await makeThumb(back); editing.photoDirty2=true;
    const bp=$('backPane');
    if (bp) bp.innerHTML=`<img src="${editing.thumb2}" style="max-height:120px" onclick="zoom('__EDIT_B__')">`;
  }
}

/* ════════════ PWA: 홈 화면 설치 + 카톡 공유 수신 ════════════ */
if ('serviceWorker' in navigator && location.protocol==='https:')
  navigator.serviceWorker.register('pu-cards-sw.js').catch(()=>{});
if (location.search.includes('shared=1')){
  (async()=>{
    try{
      const cache = await caches.open('pucards-share');
      const meta = await cache.match('shared-files');
      if (meta){
        const n = (await meta.json()).n;
        const fs=[];
        for (let i=0;i<n;i++){ const r=await cache.match('shared-'+i);
          if (r) fs.push(new File([await r.blob()], 'shared'+i+'.jpg', {type: r.headers.get('Content-Type')||'image/jpeg'})); }
        await caches.delete('pucards-share');
        if (fs.length){ toast('공유받은 이미지 '+fs.length+'장을 등록합니다'); onFiles(fs); }
      }
    }catch(e){ console.error(e); }
    history.replaceState(null,'',location.pathname);
  })();
}
