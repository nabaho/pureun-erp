let editing=null;
function openEditor(item, photoObj, pre){
  /* 옛 명함을 수정하려고 열었는데 썸네일을 아직 안 받았으면, 받아 놓고 다시 연다 */
  /* ⚠ 사진을 기다리지 않는다(대표 보고 2026-08-15). 예전에는 여기서 돌아가
     썸네일을 받은 뒤에야 창을 다시 열어, 폰에서 수정창이 뜨기까지 몇 초가 걸렸다.
     고칠 글자는 이미 손안에 있다 — 먼저 열고 사진은 오면 채운다(아래 editorFillPhoto). */
  const kind = item ? item.kind : state.tab;
  editing = { id:item?.id, kind,
    photo: photoObj?.photo || '', thumb: photoObj?.thumb || item?.thumb || '',
    photoDirty: !!photoObj,
    photo2:'', thumb2: item?.thumb2 || '', photoDirty2:false };
  const src = item || pre || {};
  const fields = kind==='card' ? CARD_FIELDS : BIZ_FIELDS;
  const wide=['address','memo','email'];
  let fh='';
  fields.forEach(([k,label])=>{
    const tag = k==='memo'
      ? `<textarea id="f_${k}">${esc(src[k])}</textarea>`
      : `<input id="f_${k}" value="${esc(src[k])}">`;
    fh += `<div class="field" style="${wide.includes(k)?'grid-column:1/3':''}"><label>${label}</label>${tag}</div>`;
  });
  const groups=Object.values(allGroups()).filter(canSeeGroup).sort((a,b)=>(a.order||0)-(b.order||0));
  /* 새 명함이고 현재 폴더 보는 중이면 그 폴더를 기본 선택 */
  const curGroupValid = state.group && state.group!=='all' && state.groups[state.group] && (state.groups[state.group].kind||'card')===kind;
  const defGroup = (src.group!==undefined && src.group!=='') ? src.group : (!item && curGroupValid ? state.group : (src.group||''));
  const gOpts=`<option value="">미분류</option>`+groups.map(g=>
    `<option value="${g.id}" ${defGroup===g.id?'selected':''}>${esc(g.name)}</option>`).join('');
  $('editorM').innerHTML=`
    <div class="mhead"><b>${item?'수정':(kind==='card'?'명함 등록':'사업자등록증 등록')}</b>
      <button class="iconbtn" onclick="tryCloseEditor()">✕</button></div>
    <div class="edit-split">
      <div class="photo-pane">${ (editing.photo||editing.thumb)
        ? `<img src="${editing.photo||editing.thumb}" onclick="zoom('__EDIT__')">`
        : `<div style="padding:12px;color:var(--sub);font-size:13px">원본 사진 없음 —
            <button class="btn ghost" style="flex:none;padding:8px 12px" onclick="frontInput.click()">📁 사진 첨부</button></div>` }
        <div id="backPane" style="margin-top:8px">${ editing.thumb2
          ? `<img src="${editing.thumb2}" style="max-height:120px" onclick="zoom('__EDIT_B__')">`
          : `<button class="btn ghost" style="flex:none;padding:7px 12px;font-size:12.5px" onclick="backInput.click()">＋ 뒷면 사진 추가</button>` }</div></div>
      <div class="edit-fields">
        <div class="fgrid">${fh}</div>
        <div class="field"><label>그룹</label><select id="f_group">${gOpts}</select></div>
      </div>
    </div>
    <div class="mfoot">
      <button class="btn ghost" onclick="tryCloseEditor()">취소</button>
      <button class="btn primary" onclick="saveEditor()">💾 저장</button></div>`;
  $('editorBg').classList.add('open');
  /* 연 직후 값을 적어 둔다 — 바깥을 눌러 닫을 때 "고친 게 있나"를 이것과 견준다.
     고친 게 없으면 묻지 않고 바로 닫는 것이 편하고, 고쳤으면 반드시 물어야 한다. */
  editing.orig = editorSnapshot();
  if (item && item.id && !photoObj) editorFillPhoto(item.id);
}

/* 수정창의 사진을 뒤늦게 채운다 — 창은 이미 떠 있다.
   ⚠ 사람이 그 사이 다른 명함을 열었거나(editing.id) 사진을 새로 붙였으면(photoDirty)
     손대지 않는다 — 방금 붙인 사진을 옛 사진으로 덮으면 안 된다.
   ⚠ 썸네일이 없던 명함이면 사진 자리 자체가 안 그려져 있다 — 창을 다시 그려 자리를 만든다.
     이때도 사람이 이미 글자를 고쳤으면 그대로 둔다(고친 것을 날리지 않는다). */
function editorFillPhoto(itemId){
  ensureThumbs(itemId).then(()=>{
    const it = state.items[itemId];
    if (!it || !editing || editing.id !== itemId || editing.photoDirty) return;
    if (!editing.thumb && it.thumb && editorSnapshot() === editing.orig){
      openEditor(it);                       /* 사진 자리를 만들며 다시 그린다 */
      return;
    }
    if (!editing.photo && it.thumb){
      Store.getPhoto(itemId).then(p=>{
        if (!p || !editing || editing.id !== itemId || editing.photoDirty) return;
        editing.photo = p;
        const im = document.querySelector('#editorM .photo-pane img'); if (im) im.src = p;
      });
    }
  });
}
function closeEditor(){ $('editorBg').classList.remove('open'); editing=null; queueNext(); }

/* ── 수정창 닫기 — 바깥을 누르거나 Esc 를 눌러도 닫힌다 ──
   대표 요청: 저장이나 ✕ 를 누르지 않고도 창을 없앨 수 있어야 한다.
   다만 고쳐 놓은 것을 말없이 버리면 안 된다 — 고친 게 있을 때만 한 번 묻는다. */
function editorSnapshot(){
  if(!editing) return '';
  const fields = editing.kind==='card' ? CARD_FIELDS : BIZ_FIELDS;
  const vals = fields.map(([k])=> ($('f_'+k) ? $('f_'+k).value : ''));
  vals.push($('f_group') ? $('f_group').value : '');
  return JSON.stringify(vals);
}
function editorDirty(){
  if(!editing) return false;
  if(editing.photoDirty || editing.photoDirty2) return true;   /* 사진을 새로 붙였다 */
  if(editing.orig === undefined) return false;
  return editorSnapshot() !== editing.orig;
}
function tryCloseEditor(){
  if(editorDirty() && !confirm('고친 내용이 저장되지 않았습니다.\n\n그냥 닫을까요?')) return;
  closeEditor();
}
/* Esc 로도 닫는다. 크게 보기(zoom)가 열려 있으면 그쪽이 먼저 닫혀야 하므로 건드리지 않는다. */
document.addEventListener('keydown', function(e){
  /* 메일함 목록의 방향키·스페이스 — 여기서 부른다. 저 함수가 있는 덩어리에서 바로
     document 에 걸면 그 덩어리를 값으로만 돌려 보는 검사가 통째로 깨진다. */
  try{ mbKeyNav(e); }catch(_){ /* 메일 화면이 아니면 할 일이 없다 */ }
  if(e.key!=='Escape') return;
  const zb=$('zoombg');
  if(zb && zb.classList.contains('open')) return;
  if($('editorBg') && $('editorBg').classList.contains('open')) tryCloseEditor();
});
async function onBackFile(files){
  const f=files[0]; if(!f || !editing) return;
  try{
    editing.photo2 = await fileToImage(f);
    editing.thumb2 = await makeThumb(editing.photo2);
    editing.photoDirty2 = true;
    $('backPane').innerHTML = `<img src="${editing.thumb2}" style="max-height:120px" onclick="zoom('__EDIT_B__')">`;
  }catch(e){ toast('뒷면 사진을 읽지 못했습니다'); }
}

/* 사진 없는 기존 항목에 앞면 사진을 붙인다(대표 지시 2026-08-15).
   ⚠ fileInput(새 항목 올리기 대기열)을 타지 않는다 — onBackFile 과 똑같이
     **지금 열려 있는 editing 을 직접 고친다.** fileInput 을 타면 openEditor(null,…)
     로 새 항목 창이 열려, 지금 입력해 둔 이름·회사가 다른(새) 항목에 남고
     원래 항목은 그대로 사진 없는 채로 남는다(2026-08-15 발견 — 사진첩의
     "원본이 없습니다" 복구 기능을 만들다가 명함첩에서도 같은 문제를 찾았다). */
async function onFrontFile(files){
  const f=files[0]; if(!f || !editing) return;
  try{
    editing.photo = await fileToImage(f);
    editing.thumb = await makeThumb(editing.photo);
    editing.photoDirty = true;
    const pane = document.querySelector('#editorM .photo-pane');
    if (pane) pane.innerHTML = `<img src="${editing.photo}" onclick="zoom('__EDIT__')">`;
  }catch(e){ toast('사진을 읽지 못했습니다'); }
}

async function saveEditor(){
  const kind=editing.kind;
  const fields = kind==='card' ? CARD_FIELDS : BIZ_FIELDS;
  const it={ id: editing.id||uid(), kind, group:$('f_group').value,
    thumb: editing.thumb || (editing.id ? (state.items[editing.id]?.thumb||'') : ''),
    thumb2: editing.thumb2 || (editing.id ? (state.items[editing.id]?.thumb2||'') : ''),
    fav: editing.id ? !!state.items[editing.id]?.fav : false,
    createdAt: editing.id ? (state.items[editing.id]?.createdAt||Date.now()) : Date.now() };
  fields.forEach(([k])=> it[k]=$('f_'+k).value.trim());
  if (kind==='card' && !it.name && !it.company) return toast('이름 또는 회사를 입력해주세요');
  if (kind==='biz' && !it.company && !it.bizno) return toast('상호 또는 사업자번호를 입력해주세요');

  if (!editing.id){
    const keyVal = kind==='card' ? digits(it.mobile) : digits(it.bizno);
    if (keyVal){
      const dup = Object.values(state.items).find(x=> x.kind===kind && x.id!==it.id &&
        (kind==='card' ? digits(x.mobile)===keyVal : digits(x.bizno)===keyVal));
      if (dup){
        const act = await dupDialog(dup, kind);
        if (act==='cancel') return;
        if (act==='merge'){ mergeInto(dup,it);
          var kmM = kind==='biz' ? PHOTO_KEEP_MAX_DOC : PHOTO_KEEP_MAX;
          if (editing.photoDirty && editing.photo) Store.putPhoto(dup.id, await shrinkForStore(editing.photo, kmM));
          if (editing.photoDirty2 && editing.photo2) Store.putPhoto(dup.id+'_b', await shrinkForStore(editing.photo2, kmM));
          $('editorBg').classList.remove('open'); editing=null;
          toast('기존 항목을 업데이트했습니다'); queueNext(); return; }
      }
    }
  }
  Store.put(it);
  var km = kind==='biz' ? PHOTO_KEEP_MAX_DOC : PHOTO_KEEP_MAX;   /* 사업자등록증은 증빙이라 덜 줄인다 */
  if (editing.photoDirty && editing.photo) Store.putPhoto(it.id, await shrinkForStore(editing.photo, km));
  if (editing.photoDirty2 && editing.photo2) Store.putPhoto(it.id+'_b', await shrinkForStore(editing.photo2, km));
  $('editorBg').classList.remove('open'); editing=null;
  toast('저장되었습니다'+(Store.mode==='firebase'?' — 전 직원 공유 완료':''));
  queueNext();
}
function mergeInto(oldIt,newIt){
  Object.keys(newIt).forEach(k=>{ if(['id','createdAt'].includes(k)) return; if(newIt[k]) oldIt[k]=newIt[k]; });
  Store.put(oldIt);
}
function dupDialog(dup,kind){
  return new Promise(res=>{
    const who = kind==='card' ? `${esc(dup.name||'')} / ${esc(dup.company||'')}` : esc(dup.company||'');
    $('dupbox').innerHTML=`
      <div class="mhead"><b>⚠️ 이미 등록되어 있습니다</b></div>
      <p style="font-size:14px;color:var(--sub);line-height:1.6">
        같은 ${kind==='card'?'전화번호':'사업자번호'}의 항목이 있습니다:<br><b style="color:var(--ink)">${who}</b></p>
      <button class="btn primary" onclick="dupPick('merge')">기존 항목을 새 정보로 업데이트</button>
      <button class="btn ghost" onclick="dupPick('new')">그래도 새로 저장</button>
      <button class="btn danger" onclick="dupPick('cancel')">취소</button>`;
    $('dupBg').classList.add('open');
    window.dupPick=a=>{ $('dupBg').classList.remove('open'); res(a); };
  });
}
</script>
<script>
/* ════════════ 상세 보기 ════════════ */
/* ══════ 취업규칙 이력 — 규정관리(rules.html)가 쌓은 회차를 «읽기만» 한다 ══════
   여기서 고치지 않는다. 고치는 곳은 규정관리 한 곳뿐이라 두 화면이 어긋날 수 없다.
   목록을 만드는 규칙(회사 맞추기·한 줄 요약)은 공용 읽개 js/pu-rules-history.js
   한 벌에 있다 — 취업규칙 이력 화면도 같은 것을 본다. */
function rulesBoxHtml(it){
  if(!window.PuRulesHistory) return '';
  const list = PuRulesHistory.forCompany({ bizno: it.bizno, company: it.company });
  const id = 'rh_'+it.id;
  if(!list.length){
    /* 색인을 아직 못 받았으면 자리만 잡아 둔다 — 오면 refreshRulesBoxes() 가 채운다 */
    if(!PuRulesHistory._cache()) return `<div class="rulehist" id="${id}" data-rh="${esc(it.id)}"></div>`;
    return '';
  }
  const rows = list.slice(0,5).map((r,i)=>{
    const arts = PuRulesHistory.artsOf(r);
    return `<div class="rh-row">
      <span class="rh-k">${esc(r.kind)}</span>
      <span class="rh-x"><span class="rh-line" title="${esc(PuRulesHistory.lineOf(r))}">${esc(PuRulesHistory.lineOf(r))}</span>${
        arts?`<span class="rh-arts">${esc(arts)}</span>`:''}</span>
      <button class="rh-go" onclick="openRuleRev('${esc(r.id)}')" title="규정관리에서 이 회차의 신구대조표를 엽니다">열기 ↗</button>
    </div>`;
  }).join('');
  const more = list.length>5 ? `<div class="rh-foot">외 ${list.length-5}회차 — 규정관리 📁 보관함 › 📜 이력에서 모두 봅니다</div>` : '';
  return `<div class="rulehist" id="${id}" data-rh="${esc(it.id)}">
    <div class="rh-t">📕 취업규칙 <span style="font-weight:600;color:var(--sub)">${list.length}회차</span></div>
    ${rows}${more}
    <div class="rh-foot">보기만 합니다 · 고치는 곳은 규정관리입니다</div></div>`;
}
/* 색인이 늦게 와도 이미 열려 있는 창을 채운다 (사진을 늦게 끼워 넣는 것과 같은 방식) */
function refreshRulesBoxes(){
  document.querySelectorAll('[data-rh]').forEach(el=>{
    const it = state.items[el.dataset.rh];
    if(!it) return;
    const html = rulesBoxHtml(it);
    if(html) el.outerHTML = html;
  });
}
function openRuleRev(id){
  window.open(PuRulesHistory.openUrl({ id }), '_blank');
}
function openDetail(id){
  /* 표에서 셀 인라인 편집 중이면 행 클릭 무시 */
  if (document.querySelector('#pcTable input.cellEdit')) return;
  const it=state.items[id]; if(!it) return;
  if (document.body.classList.contains('pc')) return openPcDetail(id);
  /* 아직 썸네일을 안 받은 명함이면 받아 놓고 다시 연다 (사진 자리가 안 생기는 것 방지) */
  /* ⚠ 사진을 기다리지 않는다(대표 보고 2026-08-15: "폰에서 창 열 때 2초").
     예전에는 여기서 **아무것도 안 그리고 돌아가** 썸네일 두 개를 서버에서 받은 뒤에야
     팝업을 만들었다. 재 보니 팝업 만드는 데 드는 시간은 4ms 인데 서버 응답을 그대로
     기다려(350ms 면 361ms) 폰에서는 2초가 됐다.
     이름·회사·전화·이메일은 **이미 손안에 있다.** 먼저 띄우고 사진은 오면 끼워 넣는다. */
  if (it.thumb === undefined) ensureThumbs(id).then(()=>fillDetailPhotos(id));
  const isCard = it.kind==='card';
  const fields = isCard ? CARD_FIELDS : BIZ_FIELDS;
  const rows = fields.filter(([k])=>it[k]).map(([k,label])=>{
    let v=esc(it[k]);
    if (k==='bizno') v=esc(fmtBizno(it[k]));
    if (['mobile','tel','fax'].includes(k)) v=`<a href="tel:${esc(digits(it[k]))}">${v}</a>`;
      if (k==='email') v=`<a href="#" onclick="openSendMaterials('${it.id}');return false" title="보낼 자료를 고르고 메일을 씁니다">${v}</a>`;
    return `<div class="ditem"><div class="k">${label}</div><div class="v">${v}</div></div>`;
  }).join('');
  const gname = it.group && state.groups[it.group] ? state.groups[it.group].name : '미분류';
  const acts = isCard ? `
    <div class="actrow">
      <a href="tel:${digits(it.mobile||it.tel)}" class="${digits(it.mobile||it.tel)?'':'off'}">📞 전화</a>
      <a href="sms:${digits(it.mobile)}" class="${digits(it.mobile)?'':'off'}">💬 문자</a>
      <a href="#" onclick="openSendMaterials('${id}');return false" class="${it.email?'':'off'}">📧 메일</a>
      <a href="#" onclick="downloadVcf('${id}');return false">📇 연락처</a>
    </div>
    <button class="btn ghost" style="width:100%;margin-bottom:12px" onclick="sendToErp('${id}')">🏢 ERP 거래처로 등록</button>` : '';
    /* ⚠ 「📎 자료 보내기」를 지웠다(2026-08-10). 바로 위 「📧 메일」과 같은 함수를
       불러서, 두 개를 두면 서로 다른 일을 하는 줄 알고 헤맨다(대표 지시). */
  $('detailM').innerHTML=`
    <div class="mhead"><b>${isCard?'명함':'사업자등록증'} <span style="font-size:12px;color:var(--sub);font-weight:400">· ${esc(gname)} · ${fmtDate(it.createdAt)} 등록</span></b>
      <div><button class="iconbtn" onclick="toggleFav('${id}')" title="즐겨찾기">${it.fav?'⭐':'☆'}</button>
      <button class="iconbtn" onclick="closeDetail()">✕</button></div></div>
    ${ photoSlot('dphoto', it.thumb, id, 'dphoto') }
    ${ photoSlot('dphoto2', it.thumb2, id+'_b', 'dphoto', 'margin-top:-6px') }
    <div class="dname">${esc(isCard?(it.name||it.company||'(이름 없음)'):(it.company||'(상호 없음)'))}</div>
    <div class="dsub">${esc(isCard ? [it.company,it.dept,it.title].filter(Boolean).join(' · ')
                                   : [it.ceo&&('대표자 '+it.ceo), fmtBizno(it.bizno)].filter(Boolean).join(' · '))}</div>
    ${(function(){var f=ErpMatch.full(it);return f?`<div class="erpmgr-box">🏢 푸른 거래처 · ${esc(f)}</div>`:'';})()}
    ${rulesBoxHtml(it)}
    ${acts}
    <div id="dSendLog">${sendLogHtml(id)}</div>
    <div class="dlist">${rows||'<div class="empty" style="padding:20px">저장된 정보가 없습니다</div>'}</div>
    <div class="mfoot">
      <button class="btn ghost" onclick="toggleScope('${id}')">${it.scope==='private'?'공용으로':'🔒 개인으로'}</button>
      <button class="btn danger" onclick="delItem('${id}')">삭제</button>
      <button class="btn ghost" onclick="downloadPhoto('${id}')">📥 원본</button>
      <button class="btn ghost" onclick="shareItem('${id}')">📤 공유</button>
      <button class="btn ghost" onclick="closeDetail();openEditor(state.items['${id}'])">수정</button></div>`;
  $('detailM').dataset.cardId = id;   /* 늦게 온 사진을 «이 명함» 창에만 넣으려고 */
  $('detailBg').classList.add('open');
  /* 보낸 기록은 명함을 열 때 그 명함 것만 읽는다 — 온 뒤에 그 자리만 갈아 끼운다 */
  if(!(state.priv.items||{})[id])
    loadSendLog(id, ()=>{ const box=$('dSendLog'); if(box) box.innerHTML = sendLogHtml(id); });
  if (it.thumb) Store.getPhoto(id).then(p=>{ const im=$('dphoto'); if(p&&im) im.src=p; });
  if (it.thumb2) Store.getPhoto(id+'_b').then(p=>{ const im=$('dphoto2'); if(p&&im) im.src=p; });
}
function toggleFav(id){ const it=state.items[id]; if(!it) return;
  it.fav=!it.fav; Store.put(it); openDetail(id);
  toast(it.fav?'⭐ 즐겨찾기에 고정했습니다':'즐겨찾기를 해제했습니다'); }
function toggleScope(id){ const it=state.items[id]; if(!it) return;
  it.scope = it.scope==='private'?'shared':'private'; Store.put(it); openDetail(id);
  toast(it.scope==='private'?'🔒 개인 명함으로 지정했습니다':'공용 명함으로 되돌렸습니다'); }
function closeDetail(){ $('detailBg').classList.remove('open');
  const pd=$('pcDetail'); if(pd) pd.classList.remove('open');
  const ov=$('pcDetailOverlay'); if(ov) ov.style.display='none'; }
function closePcDetail(){ state.coPick=''; closeDetail(); }

/* ── PC 오른쪽 상세 패널 (리멤버식) ── */
function openPcDetail(id){
  const it=state.items[id]; if(!it) return;
  /* 폰과 같다 — 사진을 기다리지 않고 먼저 띄운다(대표 보고 2026-08-15) */
  if (it.thumb === undefined) ensureThumbs(id).then(()=>fillDetailPhotos(id));
  const isCard = it.kind==='card';
  const fields = isCard ? CARD_FIELDS : BIZ_FIELDS;
  /* 주소만 두 칸을 다 쓴다 — 좁은 칸에 넣으면 네 줄로 접혀 오히려 길어진다.
     ⚠ 여기에 많이 넣으면 두 칸 배치에 빈틈이 생겨 오히려 길어진다(이메일·홈페이지를
       넣어 봤더니 한 칸씩 비면서 줄이 늘었다). */
  const WIDE_ROW = { companyAddr:1, address:1, bizType:1, bizItem:1 };
  const rows = fields.filter(([k])=>it[k] && k!=='memo').map(([k,label])=>{
    let v=esc(it[k]);
    if (k==='bizno') v=esc(fmtBizno(it[k]));
    if (['mobile','tel','fax'].includes(k)) v=`<a href="tel:${esc(digits(it[k]))}">${v}</a>`;
      if (k==='email') v=`<a href="#" onclick="openSendMaterials('${it.id}');return false" title="보낼 자료를 고르고 메일을 씁니다">${v}</a>`;
    return `<div class="pdrow ${WIDE_ROW[k]?'wide':''}"><div class="k">${label}</div><div class="v">${v}</div></div>`;
  }).join('');
  const gname = it.group && state.groups[it.group] ? state.groups[it.group].name : '미분류';
  /* ⚠ 「📎 자료 보내기」를 지웠다(2026-08-10). 「📧 메일」과 **같은 함수**를 부르는
     완전한 중복이라, 두 개를 두면 서로 다른 일을 하는 줄 알고 헤맨다(대표 지시).
     단추는 세 개씩 놓는다 — 두 개씩이면 줄이 늘어 한 화면에 안 들어간다. */
  const acts = isCard ? `
    <div class="pdacts three">
      <button onclick="openSendMaterials('${id}')" ${it.email?'':'disabled'} title="보낼 자료를 고르고 메일을 씁니다">📧 메일</button>
      <button onclick="copyCardInfo('${id}')" title="이름·회사·번호·메일·주소를 한 줄로 복사">📋 정보 복사</button>
      <button onclick="downloadVcf('${id}')" title="휴대폰 연락처로 저장 (vCard 파일)">📇 연락처 저장</button>
      <button onclick="downloadPhoto('${id}')" title="명함 원본 사진 내려받기">📥 원본 사진</button>
      <button onclick="sendToErp('${id}')" title="이 명함을 ERP 거래처로 등록">🏢 ERP 거래처</button>
      <button onclick="closeDetail();openEditor(state.items['${id}'])" title="이 명함 고치기">✏️ 수정</button>
      <button onclick="toggleNoMail('${id}')" class="${it.noMail?'nomail-on':''}"
        title="${it.noMail?'수신거부를 풉니다':'단체 발송에서 뺍니다 — 「보내지 마세요」 회신이 왔을 때'}"
        >${it.noMail?'🚫 수신거부 중':'🚫 수신거부'}</button>
    </div>` : `
    <div class="pdacts three"><button onclick="copyCardInfo('${id}')" title="정보를 한 줄로 복사">📋 정보 복사</button><button onclick="downloadPhoto('${id}')" title="원본 사진 내려받기">📥 원본 사진</button><button onclick="closeDetail();openEditor(state.items['${id}'])">✏️ 수정</button></div>`;
  /* ── 한 화면에 담기(대표 지시 2026-08-10) ──
     사진을 위에 통째로 깔면 그것만으로 화면 반이 갔다. 이름 옆에 작게 두고,
     정보는 두 칸씩 놓고, 그룹·담당자·등록일은 이름 밑 한 줄로 올린다. */
  const meta = [gname, it.owner||'', fmtDate(it.createdAt)].filter(Boolean).join(' · ');
  $('pcDetail').innerHTML = `
    <div class="pdhead"><span class="ttl">${isCard?'명함':'사업자등록증'}</span>
      <button class="x" onclick="closeDetail()">✕</button></div>
    <div class="pdbody">
      <div class="pdtop">
        <div class="pdshots">
          ${ photoSlot('pcdphoto', it.thumb, id, 'pdphoto') }
          ${ photoSlot('pcdphoto2', it.thumb2, id+'_b', 'pdphoto') }
        </div>
        <div class="pdwho">
          <div class="pdname">${esc(isCard?(it.name||it.company||'(이름 없음)'):(it.company||'(상호 없음)'))}
            <span class="star" onclick="toggleFav('${id}')">${it.fav?'⭐':'☆'}</span></div>
          <div class="pdsub">${esc(isCard ? [it.title,it.dept,it.company].filter(Boolean).join(' / ')
                                           : [it.ceo&&('대표자 '+it.ceo), fmtBizno(it.bizno)].filter(Boolean).join(' · '))}</div>
          <div class="pdmeta">${esc(meta)}</div>
        </div>
      </div>
      ${(function(){var f=ErpMatch.full(it);return f?`<div class="erpmgr-box">🏢 푸른 거래처 · ${esc(f)}</div>`:'';})()}
    ${rulesBoxHtml(it)}
      ${acts}
      <div class="pdgrid">
        ${rows || '<div class="pdrow"><div class="v" style="color:#8b98b3">저장된 정보가 없습니다</div></div>'}
      </div>
      ${ it.memo ? `<div class="pdsec">메모</div><div class="pdmemo">${esc(it.memo)}</div>` : '' }
      <div class="pddel"><button class="danger" onclick="delItem('${id}')">🗑 이 명함 삭제</button></div>
    </div>`;
  $('pcDetail').dataset.cardId = id;   /* 늦게 온 사진을 «이 명함» 창에만 넣으려고 */
  $('pcDetail').classList.add('open');
  const ov=$('pcDetailOverlay'); if(ov) ov.style.display='block';
  if (it.thumb) Store.getPhoto(id).then(p=>{ const im=$('pcdphoto'); if(p&&im) im.src=p; });
  if (it.thumb2) Store.getPhoto(id+'_b').then(p=>{ const im=$('pcdphoto2'); if(p&&im) im.src=p; });
}
function delItem(id){
  if(!confirm('정말 삭제할까요? (전 직원 명함첩에서 삭제됩니다)')) return;
  Store.del(id); closeDetail(); toast('삭제되었습니다');
}
async function zoom(id){
  let src;
  if (id==='__EDIT__') src = editing && (editing.photo||editing.thumb);
  else if (id==='__EDIT_B__') src = editing && (editing.photo2||editing.thumb2);
  else if (id.endsWith('_b')) src = (await Store.getPhoto(id)) || state.items[id.slice(0,-2)]?.thumb2;
  else src = (await Store.getPhoto(id)) || state.items[id]?.thumb;
  if(!src) return;
  $('zoomimg').src=src; $('zoombg').classList.add('open');
}
/* 명함을 카톡·문자로 공유 (텍스트 + 사진) */
async function shareItem(id){
  const it=state.items[id]; if(!it) return;
  const isCard = it.kind==='card';
  const text = (isCard
    ? [it.name, [it.company,it.dept,it.title].filter(Boolean).join(' '),
       it.mobile&&'휴대폰 '+it.mobile, it.tel&&'전화 '+it.tel,
       it.email&&'이메일 '+it.email, it.address]
    : [it.company, it.ceo&&'대표자 '+it.ceo, it.bizno&&'사업자번호 '+fmtBizno(it.bizno), it.address])
    .filter(Boolean).join('\n');
  const data = { title: isCard ? (it.name||'명함') : (it.company||'사업자등록증'), text };
  try{
    const p = await Store.getPhoto(id);
    if (p && navigator.canShare){
      const blob = await (await fetch(p)).blob();
      const file = new File([blob], fileNameFor(it), {type:'image/jpeg'});
      if (navigator.canShare({files:[file]})) data.files=[file];
    }
  }catch(e){}
  if (navigator.share){ try{ await navigator.share(data); }catch(e){} }

/* ════════════ 내 폰 연락처 저장 (vCard) ════════════ */
function copyCardInfo(id){
  const it=state.items[id]; if(!it) return;
  const parts=[];
  if(it.name) parts.push(it.name);
  if(it.title||it.dept) parts.push([it.title,it.dept].filter(Boolean).join(' '));
  if(it.company) parts.push(it.company);
  if(it.mobile) parts.push('휴대폰 '+it.mobile);
  if(it.companyTel||it.tel) parts.push('전화 '+(it.companyTel||it.tel));
  if(it.email) parts.push(it.email);
  if(it.companyAddr||it.address) parts.push(it.companyAddr||it.address);
  const text=parts.join(' / ');
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>toast('명함 정보를 복사했습니다')).catch(()=>fallbackCopy(text));
  else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); toast('명함 정보를 복사했습니다'); }catch(e){ toast('복사 실패'); }
  document.body.removeChild(ta);
}
function downloadVcf(id){
  const it=state.items[id]; if(!it) return;
  const lines=['BEGIN:VCARD','VERSION:3.0',
    `N:${it.name||''};;;;`,`FN:${it.name||''}`,
    it.company && `ORG:${it.company}${it.dept?';'+it.dept:''}`,
    it.title && `TITLE:${it.title}`,
    it.mobile && `TEL;TYPE=CELL:${it.mobile}`,
    it.tel && `TEL;TYPE=WORK:${it.tel}`,
    it.fax && `TEL;TYPE=FAX:${it.fax}`,
    it.email && `EMAIL:${it.email}`,
    it.address && `ADR;TYPE=WORK:;;${it.address};;;;`,
    it.memo && `NOTE:${it.memo.replace(/\n/g,'\\n')}`,
    'END:VCARD'].filter(Boolean);
  const blob=new Blob([lines.join('\r\n')],{type:'text/vcard;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=(it.name||'contact')+'.vcf';
  a.click(); URL.revokeObjectURL(a.href);
  toast('내려받은 파일을 열면 연락처에 저장됩니다');
}

/* ════════════ ERP 거래처(companies) 연동 — 명함 → ERP ════════════ */
/* ERP의 CompanyRef와 동일한 정규화로 중복 거래처 생성 방지 */
function erpNormName(s){ return String(s||'')
  .replace(/㈜|\(주\)|주식회사|주\)|\(유\)|유한회사|농업회사법인/g,'')
  .replace(/\s+/g,'').replace(/[·.,'"`()]/g,'').toLowerCase(); }
function erpNormBiz(s){ const d=String(s||'').replace(/\D/g,''); return d.length>=10?d.slice(0,10):''; }

async function sendToErp(id){
  const it=state.items[id]; if(!it || it.kind!=='card') return;
  if (Store.mode!=='firebase') return toast('ERP 연동은 Firebase 연결 후 가능합니다');
  if (!it.company) return toast('회사명이 없어 거래처로 등록할 수 없습니다');
  try{
    /* 푸른이알피 업체는 data/companies/{v:목록, u:갱신시각} 에 있다.
       예전에는 루트 companies 에 썼는데 그 노드는 아무도 읽지 않아 등록해도 나타나지 않았다. */
    const db = firebase.database();
    const snap = await db.ref('data/companies').once('value');
    const wrap = snap.val();
    const raw  = (wrap && wrap.v !== undefined) ? wrap.v : wrap;   // 배열형·객체형 둘 다 쓰인다
    const list = Array.isArray(raw) ? raw.filter(Boolean)
               : (raw && typeof raw === 'object' ? Object.keys(raw).map(k=>raw[k]).filter(Boolean) : []);
    const nBiz=erpNormBiz(it.bizno), nName=erpNormName(it.company);
    const exist = list.find(c=> (nBiz && erpNormBiz(c.bizNo)===nBiz) || (nName && erpNormName(c.name)===nName));
    if (exist) return toast(`이미 ERP 거래처에 있습니다: ${exist.name}`);
    /* 사업자번호 없이 등록하면 이름으로만 이어져 나중에 같은 회사가 두 번 생긴다 — 미리 알린다 */
    const warn = nBiz ? '' : '\n\n⚠ 이 명함에는 사업자번호가 없습니다.\n사업자번호 없이 등록하면 나중에 같은 회사가 두 번 생길 수 있습니다.\n업체관리에서 사업자번호를 채워 주세요.';
    if (!confirm(`'${it.company}'를 ERP 거래처로 등록할까요?${warn}`)) return;
    /* ERP companies 레코드 형태(필드명 일치): name·bizNo·ceo·phone·email·address·manager */
    const now = Date.now();
    const rec = { id:'co-'+now.toString(36)+Math.random().toString(36).slice(2,6),
      name: it.company, bizNo: it.bizno||'', ceo: '',
      phone: it.tel || it.mobile || '', email: it.email||'',
      address: it.address||'', manager: it.owner||'',
      _fromCard: it.id, createdAt: now, updatedAt: now };
    const up = {};
    if (raw && !Array.isArray(raw) && typeof raw === 'object'){
      up['data/companies/v/'+rec.id] = rec;              // 객체형 — 건별 쓰기(푸른이알피 dbUpsert와 동일)
    } else {
      up['data/companies/v'] = list.concat([rec]);       // 배열형 — 통째 쓰기(푸른이알피 dbSet과 동일)
    }
    up['data/companies/u'] = now;                        // 갱신시각 — 푸른이알피가 이걸 보고 다시 읽는다
    await db.ref().update(up);
    toast(`✅ ERP 거래처로 등록했습니다: ${it.company}`);
  }catch(e){ console.error(e); toast('ERP 등록 실패 — 권한 또는 연결을 확인하세요'); }
}

/* AI 키가 실제로 되는지 확인 — 입력칸의 키(없으면 저장된 키)로 시험 호출 */
async function testGemini(){
  /* ⚠ 이제 **열쇠가 아니라 서버**를 시험한다(2026-08-17). 열쇠는 서버가 든다.
     ⚠ 사진 없이 글자만 보내면 서버가 400(사진이 없습니다)으로 돌려보낸다 —
       그건 **서버까지 잘 닿았다는 뜻**이므로 정상으로 친다.
       401(로그인 안 됨)·503(열쇠 없음)과 갈라 알려 준다. */
  if(!aiReady()){ alert('❌ 로그인이 필요합니다.\n\n로그아웃 상태에서는 AI가 돌지 않습니다.'); return; }
  toast('AI 연결 확인 중…',8000);
  try{
    await PuAiCall.ask([{text:'OK'}], { auth: firebase.auth(), fetch: pcFetch });
    toast(''); alert('✅ AI 연결 정상입니다!\n\n명함을 찍으면 이름·회사·전화가 자동으로 채워집니다.');
  }catch(e){
    toast('');
    const s = e && e.status;
    if(s===400){ alert('✅ AI 연결 정상입니다!\n\n명함을 찍으면 이름·회사·전화가 자동으로 채워집니다.'); return; }
    if(s===401||s===403) alert('❌ 로그인이 만료되었습니다.\n\n새로고침한 뒤 다시 로그인해 주세요.');
    else if(s===503) alert('❌ 서버에 AI 열쇠가 설정되지 않았습니다.\n\n관리자에게 알려 주세요.');
    else alert('❌ 연결 실패'+(s?' ('+s+')':'')+'\n'+((e&&e.message)||'')+'\n\n인터넷 연결을 확인해 주세요.');
  }
}

if ('serviceWorker' in navigator && location.protocol==='https:')
  /* 통합 워커 하나만 등록 — 앱마다 따로 등록하면 서로 밀어내 공유 받기가 죽는다(pu-sw.js 머리말) */
  navigator.serviceWorker.register('pu-sw.js').catch(()=>{});
if (location.search.includes('shared=1')){
  (async()=>{
    try{
      const cache = await caches.open('pucards-share');
      const meta = await cache.match('shared-files');
      if (meta){
        const n = (await meta.json()).n;
        const fs=[];
        for (let i=0;i<n;i++){ const r=await cache.match('shared-'+i);
          if (r) fs.push(new File([await r.blob()], 'shared'+i+'.jpg', {type: r.headers.get('Content-Type')||'image/jpeg'})); }

        if (fs.length){ toast('공유받은 이미지 '+fs.length+'장을 등록합니다'); onFiles(fs); }
      }

    history.replaceState(null,'',location.pathname);
  })();
}

        <span style="font-size:11.5px;color:${left<=3?'#c0392b':'#8b98b3'};white-space:nowrap">${left}일 남음</span>
        <button onclick="restoreFromTrash('${it.id}')" style="border:1px solid #cfe0ff;background:#eef4ff;color:#2452b5;border-radius:7px;padding:6px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap">♻️ 복원</button>
        <button onclick="hardDelFromTrash('${it.id}')" style="border:1px solid #f3c2c2;background:#fff;color:#c0392b;border-radius:7px;padding:6px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap">영구삭제</button>
      </div>`;
    }).join('');
  }
  const h = `
    <div class="mhead"><b>🗑 휴지통 (${all.length})</b>
      ${_panelTarget==='inline' ? '' : `<button class="iconbtn" onclick="folderDlgBg.classList.remove('open')">✕</button>`}</div>
    <div style="font-size:12.5px;color:#8b98b3;padding:0 4px 10px">삭제한 명함은 ${TRASH_DAYS}일간 보관되며, 그 후 자동으로 완전히 삭제됩니다.</div>
    <div style="max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:7px;padding:2px">${rows}</div>
    ${all.length?`<div class="mfoot"><button class="btn ghost" onclick="emptyTrash()" style="color:#c0392b">휴지통 비우기 (전체 영구삭제)</button></div>`:''}`;
  if(_panelTarget==='inline'){ showPanel(h); return; }
  $('folderDlg').innerHTML = h;
  $('folderDlgBg').classList.add('open');
}
function restoreFromTrash(id){
  Store.restore(id);
  toast('명함을 복원했습니다');
  setTimeout(function(){_refresh(openTrash)}, 300);
}
function hardDelFromTrash(id){
  if(!confirm('이 명함을 완전히 삭제할까요? 복구할 수 없습니다.')) return;
  Store.hardDel(id);
  toast('영구 삭제했습니다');
  setTimeout(function(){_refresh(openTrash)}, 300);
}
function emptyTrash(){
  const n=Object.keys(state.trash||{}).length; if(!n) return;
  if(!confirm(`휴지통의 ${n}건을 모두 완전히 삭제할까요? 복구할 수 없습니다.`)) return;
  Object.keys(state.trash).forEach(id=>Store.hardDel(id));
  toast('휴지통을 비웠습니다');
  $('folderDlgBg').classList.remove('open');
}
/* 30일 지난 항목 자동 영구삭제 (앱 시작 시 1회) */
function purgeTrash(){
  try{
    const now=Date.now(); let n=0;
    Object.values(state.trash||{}).forEach(it=>{
      if (it._deletedAt && (now-it._deletedAt) > TRASH_DAYS*86400000){ Store.hardDel(it.id); n++; }
    });
    if(n) console.log(`휴지통 자동 정리: ${n}건`);
  }catch(e){ console.error('휴지통 정리 실패', e); }
  slimTrashPhotos();
}

/* ── 옛 휴지통 기록에서 원본 사진을 빼낸다 (2026-08-13 비용 조사) ──
   8/13 이전에 지운 명함은 원본이 `_photo` 안에 base64 로 들어 있다. 휴지통은
   통째로 구독하는 자리라 **명함첩을 열 때마다 그 전부를 내려받는다.**
   ⚠ 그냥 지우면 안 된다 — 그때는 창고 사진을 함께 지웠으므로, `_photo` 가 그
     명함의 **유일한 사진**이다. 그래서 **창고로 되돌려 놓고 나서** 뺀다.
   ⚠ 되돌리기가 실패하면 안 뺀다. 못 옮겼는데 빼면 사진을 잃는다.
   한 번 지나가면 다시 할 일이 없다(뺀 기록에는 _photo 가 없다). */
async function slimTrashPhotos(){
  if (Store.mode!=='firebase') return;
  const fat = Object.values(state.trash||{})
    .filter(it => it && it.id && (it._photo || it._photo2));
  if (!fat.length) return;
  let moved=0, failed=0;
  for (const it of fat){
    try{
      if (it._photo)  await Store.putPhoto(it.id, it._photo);
      if (it._photo2) await Store.putPhoto(it.id+'_b', it._photo2);
      await Store.db.ref(`${DB_ROOT}/trash/${it.id}`).update({ _photo:null, _photo2:null });
      moved++;
    }catch(e){ failed++; console.warn('[휴지통 사진 옮기기]', it.id, e && e.message); }
  }
  console.log(`휴지통 원본 사진 창고로 이동: ${moved}건${failed?` (실패 ${failed}건 — 다음에 다시 시도합니다)`:''}`);
}

/* 백업 파일(JSON) 복원 */
function onRestoreFile(files){
  const f=files&&files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{
    let data;
    try{ data=JSON.parse(reader.result); }
    catch(e){ return toast('백업 파일을 읽을 수 없습니다 (JSON 형식 아님)'); }
    const items=data.items||{}, groups=data.groups||{};
    const ic=Object.keys(items).length, gc=Object.keys(groups).length;
    if(!ic && !gc) return toast('백업 파일에 데이터가 없습니다');
    const cur=Object.keys(state.items).length;
    if(!confirm(`백업 복원: 명함 ${ic}건, 폴더 ${gc}개를 불러옵니다.\n\n현재 ${cur}건과 합쳐집니다 (같은 명함은 덮어씀).\n진행할까요?`)) return;
    let done=0;
    Object.values(groups).forEach(g=>{ if(g&&g.id) Store.putGroup(g); });
    Object.values(items).forEach(it=>{ if(it&&it.id){ Store.put(it); done++; } });
    toast(`백업 복원 완료 — 명함 ${done}건, 폴더 ${gc}개`);
  };
  reader.readAsText(f);
}

/* 전체 백업 — items + groups를 JSON 파일로 (환경설정의 수동 버튼 전용) */
function backupNow(silent){
  const cnt = Object.keys(state.items||{}).length;
  if (!cnt){ if(!silent) toast('백업할 명함이 없습니다'); return; }
  try{
    if(!silent) toast(`백업 파일 만드는 중… (${cnt.toLocaleString()}건, 잠시만요)`,8000);
    const data = { backupAt: new Date().toISOString(), items: state.items, groups: state.groups };
    const json = JSON.stringify(data);
    const blob = new Blob([json], {type:'application/json'});
    const mb = (blob.size/1048576).toFixed(1);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `푸른기업정보함_백업_${fmtDate(Date.now())}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    if(!silent) toast(`✅ 백업 완료 — ${cnt.toLocaleString()}건 (${mb}MB). 다운로드 폴더를 확인하세요`,6000);
  }catch(e){
    console.error('[backup]', e);
    if(!silent) toast('백업 실패: '+((e&&e.message)||'파일이 너무 크거나 브라우저 제한') + ' — 다운로드 차단 여부를 확인하세요',7000);
  }
}

/* ════════════ 가져오기: 리멤버 엑셀 · 구글 CSV · vCard ════════════ */
async function needXLSX(){
  if (window.XLSX) return;
  await new Promise((res,rej)=>{ const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=res; s.onerror=rej; document.head.appendChild(s); });
}
async function onImportFile(files){
  const f=files[0]; if(!f) return;
  try{
    toast('파일 분석 중…',9000);
    let rows;
    if (/\.vcf$/i.test(f.name)) rows = parseVcf(await f.text());
    else if (/\.csv$/i.test(f.name) || /csv/i.test(f.type||'')){
      /* CSV는 UTF-8 텍스트로 직접 읽어야 한글이 안 깨진다 (구글·리멤버 CSV = UTF-8).
         예전엔 arrayBuffer→XLSX로 읽어 라틴으로 해석되며 'ì¶œ' 처럼 깨졌음 */
      await needXLSX();
      let text = await f.text();
      if (text.charCodeAt(0)===0xFEFF) text = text.slice(1);   /* BOM 제거 */
      const wb=XLSX.read(text,{type:'string'});
      rows = mapRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})); }
    else { await needXLSX();
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      rows = mapRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})); }
    rows = rows.filter(r=>r.name||r.company||r.mobile||r.tel);
    if (!rows.length) return toast('가져올 연락처를 찾지 못했습니다');
    previewImport(rows, f.name);
  }catch(e){ console.error(e); toast('파일을 읽지 못했습니다'); }
}

/* 열 이름 자동 인식(리멤버·구글·일반 엑셀 공통) */
function classify(h){
  h=String(h).toLowerCase().replace(/[\s\-_]/g,'');
  if(/label$/.test(h)) return null;                 // 구글 CSV의 'Label' 칸(값 아님)은 무시
  if(/^(이름|성명|name|fn)$/.test(h)) return 'name';
  if(/(familyname|lastname|성$)/.test(h)) return 'family';
  if(/(givenname|firstname)/.test(h)) return 'given';
  if(/(회사|company|organizationname|소속|조직)/.test(h)) return 'company';
  if(/(부서|department)/.test(h)) return 'dept';
  if(/(직책|직급|직함|jobtitle|organizationtitle|^title$)/.test(h)) return 'title';
  /* 리멤버 한글 헤더: 근무처/회사 전화·팩스는 회사용으로 분류 */
  if(/(근무처팩스|회사팩스|대표팩스)/.test(h)) return 'companyFax';
  if(/(근무처전화|회사전화|대표번호|대표전화)/.test(h)) return 'companyTel';
  if(/(휴대|핸드폰|mobile|cell)/.test(h)) return 'mobile';
  if(/(팩스|fax)/.test(h)) return 'fax';
  if(/(전화|phone|tel)/.test(h)) return 'tel';       // 직통전화
  if(/(메일|email)/.test(h)) return 'email';
  /* 명함 등록일 */
  if(/(등록일|등록날짜|createdate|regdate)/.test(h)) return 'createdAt';
  if(/(홈페이지|website|homepage|url)/.test(h)) return 'website';
  if(/address.*formatted|주소.*formatted/.test(h)) return 'address';   // 구글 CSV: Formatted만
  if(/(근무지주소|회사주소|근무처주소)/.test(h)) return 'companyAddr';
  if(/(주소|번지|소재지|address)/.test(h)) return 'address';
  if(/(담당자|담당|owner)/.test(h)) return 'owner';
  if(/(메모|노트|note|비고)/.test(h)) return 'memo';
  return null;
}
/* 리멤버→구글 CSV 이름 엉킴 복원
   First="수민\u00a0총무(천일통신)", Last="김"  →  "김수민"
   (성은 Last칸, 이름은 First의 특수공백 앞, 회사·직책은 별도 칸) */
function rememberGiven(first){
  if(!first) return '';
  let s=String(first).replace(/\u00a0/g,'\x01').trim().replace(/^#/,'').trim();
  s=s.replace(/\([^)]*\)/g,'').replace(/[()]/g,'').trim();   // 괄호 안 회사 제거
  s = s.replace(/\x01/g,' ').trim();        // 특수공백 → 일반공백으로 통일
  // 한글이 있으면: 직책/소속 키워드 이전까지의 첫 한글 토큰을 이름으로
  if (/[가-힣]/.test(s)){
    let head = s.split(/\s+/)[0];           // 공백 기준 첫 토큰(보통 "이름" 또는 "이름직책")
    const km = head.match(/[가-힣]+/);
    let nm = km ? km[0] : head;
    nm = nm.replace(/(노무사|노무법인|변호사|대표이사|대표|부장|차장|과장|이사|팀장|원장|센터장|부사장|총무|공인노무사|교수|전무이사|사무국장|전문위원|프로|소장|실장|본부장|상무|전무|사장|회장|주임|대리|사원|법인|사무소).*$/,'').trim();
    if (nm) return nm;
    const any = s.match(/[가-힣]{2,4}/); if(any) return any[0];
  }
  const han=s.match(/[\u4e00-\u9fff]+/); if(han) return han[0];
  s=s.replace(/\b(CEO|President|Vice|Director|Manager|Management|General|Senior|Chief|Head|Officer|대표|부장|차장|과장|이사|팀장|원장|센터장|부사장|총무|대표이사|공인노무사|노무사|변호사|교수|전무이사|사무국장|전문위원|프로)\b.*$/i,'').trim();
  return s.trim();
}
function rememberFixName(first, last){
  const f=String(first||''), l=String(last||'');
  // 케이스1: Last가 한 글자 한글 성 + First에 이름  →  성+이름
  if (/^[가-힣]\s*$/.test(l.replace(/\u00a0/g,' '))){
    const g=rememberGiven(f); if(g) return (l.trim()+g).trim();
  }
  // 케이스2: 한쪽 칸에 "이름\u00a0직책(회사" 형태가 들어있음 → 특수공백 앞에서 이름 추출
  for (const part of [l, f]){              // Last 먼저(보통 여기 이름 있음)
    const p=part.replace(/\u00a0/g,'\x01');
    if (p.includes('\x01')){
      const cand=rememberGiven(p.split('\x01')[0]+'\x01');
      if (cand) return cand;
    }
  }
  // 케이스3: 합쳐서 한글 이름 추출
  const g2=rememberGiven(f) || rememberGiven(l);
  return g2 || (l+f).replace(/\u00a0/g,' ').replace(/[()#]/g,'').trim();
}
/* 날짜 파싱: "2026년 06월 19일", "2026.06.19", "2026-06-19" 등 */
function parseKoreanDate(s){
  s=String(s||'').trim();
  const m=s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]).getTime();
  return Date.parse(s);
}
function mapRows(json){
  return json.map(r=>{
    const o={phones:[]};
    for (const [h,v0] of Object.entries(r)){
      const v=String(v0).trim(); if(!v) continue;
      const k=classify(h); if(!k) continue;
      const clean = s => String(s).split(':::')[0].trim()
        .replace(/^\*\s*(work|home|mobile|other|cell)?\s*/i,'').trim();   // 라벨 잔재 제거
      if (k==='phone'||k==='mobile')
        v.split(':::').forEach(p=>{ p=p.trim(); if(p)
          o.phones.push({v:p, m: k==='mobile' || /^01[016789]/.test(digits(p))}); });
      else if (k==='createdAt'){
        let t = parseKoreanDate(v);
        if (!isNaN(t)) o.createdAt = t;
      }
      else if (k==='email'||k==='address'||k==='companyAddr'){ const cv=clean(v); if(cv && !o[k]) o[k]=cv; }
      else if (k==='given') o.given=v;
      else if (k==='family') o.family=v;
      else if (o[k]) o[k] += (k==='memo' ? '\n' : ' ') + v;
      else o[k]=v;
    }
    /* 이름 조립: First/Last 칸을 보고 리멤버 엉킴이면 복원 */
    const rawFirst = o.given || '';
    const rawLast  = o.family || '';
    if (/[()\u00a0]|^#/.test(rawFirst+rawLast)) o.name = rememberFixName(rawFirst, rawLast);
    else if(!o.name) o.name = (rawLast+rawFirst).trim();
    else if(/[()\u00a0]|^#/.test(o.name)) o.name = rememberFixName(o.name, '');
    const mob=o.phones.find(p=>p.m), tel=o.phones.find(p=>!p.m);

      mobile:o.mobile||(mob?mob.v:''), tel:o.tel||(tel?tel.v:''), fax:o.fax||'', email:o.email||'',
      companyTel:o.companyTel||'', companyFax:o.companyFax||'', companyAddr:o.companyAddr||'', website:o.website||'',

/* vCard 파서 (갤럭시·구글 내보내기, QP 인코딩 지원) */
function qpDecode(s){
  const bytes=[];
  for(let i=0;i<s.length;i++){
    if (s[i]==='=' && /^[0-9A-Fa-f]{2}$/.test(s.slice(i+1,i+3))){ bytes.push(parseInt(s.slice(i+1,i+3),16)); i+=2; }
    else for(const b of new TextEncoder().encode(s[i])) bytes.push(b);
  }
  try{ return new TextDecoder('utf-8').decode(new Uint8Array(bytes)); }catch(e){ return s; }
}
function parseVcf(text){
  text=text.replace(/\r/g,'').replace(/=\n/g,'').replace(/\n[ \t]/g,'');
  const out=[];
  text.split(/END:VCARD/i).forEach(block=>{
    if(!/BEGIN:VCARD/i.test(block)) return;
    const o={phones:[]};
    block.split('\n').forEach(line=>{
      const i=line.indexOf(':'); if(i<0) return;
      const prop=line.slice(0,i), P=prop.toUpperCase();
      let val=line.slice(i+1);
      if(/ENCODING=QUOTED-PRINTABLE/.test(P)) val=qpDecode(val);
      val=val.replace(/\\n/gi,'\n').replace(/\\,/g,',').trim();
      if(!val) return;
      if(P==='FN'||P.startsWith('FN;')) o.name=val;
      else if(P==='N'||P.startsWith('N;')){ if(!o.name){ const p=val.split(';'); o.name=((p[0]||'')+(p[1]||'')).trim(); } }
      else if(P.startsWith('ORG')){ const p=val.split(';'); o.company=p[0]||''; o.dept=p[1]||''; }
      else if(P.startsWith('TITLE')) o.title=o.title||val;
      else if(P.startsWith('TEL')) o.phones.push({v:val, m:/CELL|MOBILE/.test(P)||/^01[016789]/.test(digits(val))});
      else if(P.startsWith('EMAIL')) o.email=o.email||val;
      else if(P.startsWith('ADR')) o.address=o.address||val.split(';').filter(Boolean).join(' ');
      else if(P.startsWith('NOTE')) o.memo=val;
    });
    const mob=o.phones.find(p=>p.m), tel=o.phones.find(p=>!p.m);
    out.push({ name:o.name||'', company:o.company||'', dept:o.dept||'', title:o.title||'',
      mobile:mob?mob.v:'', tel:tel?tel.v:'', fax:'', email:o.email||'', address:o.address||'', memo:o.memo||'' });
  });
  return out;
}

/* 중복 매칭 키: 휴대폰 → 이메일 → 이름+회사 */
function rowKeys(r){
  const ks=[]; const d=digits(r.mobile);

  if(r.name && r.company) ks.push('n'+(r.name+'|'+r.company).toLowerCase().replace(/\s/g,''));
  return ks;
}

async function runImport(){

  const map=buildKeyMap();

      const ex = updates[exId] || {...state.items[exId]};

        if (impMode==='overwrite') ex[k]=r[k];      /* 최신값으로 덮어쓰기 */

      updates[it.id]=it; add++;

      try {

      toast(`저장 중… ${Math.min(s+100,ids.length).toLocaleString()}/${ids.length.toLocaleString()}`,4000);

    return;

  toast(`✅ 가져오기 완료 — 신규 ${add.toLocaleString()}건${skip?`, 중복 ${skip.toLocaleString()}건 건너뜀`:''}${merge?`, ${impMode==='overwrite'?'덮어씀':'합침'} ${merge.toLocaleString()}건`:''}`,6000);

const FIELD_LABEL=Object.fromEntries([...CARD_FIELDS,...BIZ_FIELDS].map(([k,l])=>[k,l]));
function itemKeys(it){
  if (it.kind==='biz'){ const d=digits(it.bizno); return d.length>=10 ? ['b'+d] : []; }
  return rowKeys(it);
}
function findDupGroups(){
  const arr=Object.values(state.items).filter(it=>it.kind===state.tab);
  const parent={}; arr.forEach(it=>parent[it.id]=it.id);
  const find=x=>parent[x]===x?x:(parent[x]=find(parent[x]));
  const uni=(a,b)=>{ parent[find(a)]=find(b); };
  const map={};
  arr.forEach(it=>itemKeys(it).forEach(k=>{ if(map[k]) uni(it.id,map[k]); else map[k]=it.id; }));
  const groups={};
  arr.forEach(it=>{ const r=find(it.id); (groups[r]=groups[r]||[]).push(it); });
  /* ★ 이름이 서로 다르면 '확실한 중복'이 아니다.
     한 회사가 대표 이메일(info@…) 하나를 여럿이 함께 쓰거나, 회사 대표번호를
     휴대폰 칸에 적어 둔 명함이 흔하다. 그것만 보고 합치면 김철수와 박영희가
     한 장으로 합쳐지고 한 사람이 휴지통으로 사라진다 — 합친 뒤에는 어느 값이
     누구 것이었는지 알 수 없어 되돌려도 원래대로 돌아오지 않는다.
     이름이 엇갈리면 애초에 같은 사람이 아니므로 중복으로 세지 않는다. */
  return Object.values(groups).filter(g=>g.length>1).filter(g=>{
    const names=new Set(g.map(x=>String(x.name||'').toLowerCase().replace(/\s/g,'')).filter(Boolean));
    return names.size<=1;
  });
}
/* keepId — 사람이 「남길 것」으로 고른 명함을 바탕으로 삼는다.
   안 넘기면 예전처럼 가장 최근에 고친 것이 바탕이다. */
async function mergeGroup(ids, keepId){
  const items=ids.map(id=>state.items[id]).filter(Boolean);
  if (items.length<2) return;
  items.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if (keepId){
    const at = items.findIndex(x=>x.id===keepId);
    if (at>0) items.unshift(items.splice(at,1)[0]);      /* 고른 것을 맨 앞으로 */
  }
  const base={...items[0]};
  const fields=(base.kind==='card'?CARD_FIELDS:BIZ_FIELDS).map(f=>f[0]);
  const norm=v=>String(v).toLowerCase().replace(/[\s\-]/g,'');
  const conflicts=[];
  items.slice(1).forEach(o=>{
    fields.forEach(k=>{
      if(!o[k]) return;
      if(!base[k]) base[k]=o[k];
      else if(k!=='memo' && norm(base[k])!==norm(o[k])) conflicts.push(`[병합] 다른 ${FIELD_LABEL[k]}: ${o[k]}`);
    });
    if(!base.thumb && o.thumb) base.thumb=o.thumb;
    if(o.memo && o.memo!==base.memo) base.memo=((base.memo||'')+'\n'+o.memo).trim();
    base.createdAt=Math.min(base.createdAt||Date.now(), o.createdAt||Date.now());
  });
  if (conflicts.length) base.memo=((base.memo||'')+'\n'+[...new Set(conflicts)].join('\n')).trim();
  if (!(await Store.getPhoto(base.id)))
    for (const o of items.slice(1)){ const p=await Store.getPhoto(o.id); if(p){ Store.putPhoto(base.id,p); break; } }
  Store.put(base);
  items.slice(1).forEach(o=>Store.del(o.id));
}

  const left = dupGroupsOf(dupPool(), dupIgnoreSet()).length;
  toast(`✅ 확실한 중복 ${i}묶음을 합쳤습니다.`+
    (left?` 사람이 봐야 할 ${left}묶음이 남았습니다 — 표의 담당 칸 ⚠ 를 눌러 보세요.`:''), 8000);
}

/* ══════ 중복 판단 — 순수 로직 (테스트 대상) ══════
   대표 지시 2026-08-10: "중복 단어 클릭하면 중복 삭제 또는 합치기 등 판단할 수 있는
   부분을 팝업시켜주고 한번에 정리 할 수 있게도."

   ⚠ 여기가 왜 따로 필요한가 — 배지(`isDup`)와 「🧹 중복 정리」(`findDupGroups`)의
     기준이 달랐다. 배지는 열쇠 하나만 겹치면 붙는데, 정리는 **이름이 엇갈리는 묶음을
     버린다**(회사 대표이메일을 여럿이 함께 쓰는 명함을 합치면 사람이 사라지므로 옳다).
     그래서 배지를 영원히 달고 있으면서 정리 목록에는 없는 명함이 생겼다 —
     사람이 「이건 다른 사람이다」라고 말할 자리가 없었다.
     이 층은 **이름으로 걸러내지 않고 묶고**, 대신 이름이 모이는지를 따로 알려 준다.
     걸러내는 것은 자동 합치기만 하고, 사람은 다 본다. */
const DUP_IGNORE_LS = 'pucards_dup_ignore';

/* 짝 서명 — 어느 쪽을 먼저 넣어도 한 가지 모양이어야 한다.
   안 그러면 「중복 아님」을 눌러도 반대 방향에서 다시 겹친 것으로 읽힌다. */
function dupIgnoreKey(a, b){ return [String(a), String(b)].sort().join('~'); }

/* 두 명함이 이어지나 — 열쇠가 겹치고, 「중복 아님」으로 적어 둔 짝이 아닐 때.
   keysOf 는 열쇠를 이미 뽑아 둔 것이 있을 때만 넘긴다(아래 묶기에서 쓴다).
   규칙은 **여기 한 곳에만** 있어야 한다 — 묶기와 배지가 서로 다른 답을 하면
   「배지는 있는데 정리 목록엔 없다」가 다시 생긴다. */
function dupLinked(a, b, ignore, keysOf){
  if (!a || !b || a.id === b.id) return false;
  if (ignore && ignore.has && ignore.has(dupIgnoreKey(a.id, b.id))) return false;
  const K = keysOf || itemKeys;
  const ka = new Set(K(a));
  return K(b).some(k => ka.has(k));
}

/* 겹친 묶음 전부. **이름으로 걸러내지 않는다** — 사람이 보고 판단할 것이다.
   짝마다 봐야 하므로(「중복 아님」이 짝 단위) 열쇠 맵 대신 이어붙이기로 묶는다. */
function dupGroupsOf(items, ignore){
  const arr = (items||[]).slice();
  const parent = {}; arr.forEach(it => { parent[it.id] = it.id; });
  const find = x => parent[x] === x ? x : (parent[x] = find(parent[x]));
  /* 열쇠를 한 번만 뽑아 둔다 — 6천 장을 짝마다 다시 뽑으면 표를 그릴 때마다 버벅인다 */
  const memo = {};
  const keysOf = it => (memo[it.id] || (memo[it.id] = itemKeys(it)));
  /* 열쇠가 같은 것끼리만 견준다 — 6천 장을 서로 다 견주면(1800만 번) 화면이 멈춘다 */
  const byKey = {};
  arr.forEach(it => keysOf(it).forEach(k => { (byKey[k] = byKey[k] || []).push(it); }));
  const hasIgn = !!(ignore && ignore.size);
  Object.keys(byKey).forEach(k => {
    const list = byKey[k];
    /* 「중복 아님」이 없으면 — 거의 언제나 그렇다 — 이 열쇠를 나눠 가진 것들은
       **전부** 이어진다. 짝마다 견줄 필요 없이 줄줄이 잇는다.
       ⚠ 이 빠른 길이 없으면 한 회사 대표이메일을 1,200장이 함께 쓸 때 짝을 72만 번
         견주게 되어(74ms) 찾기칸에 글자를 칠 때마다 화면이 걸린다. */
    if (!hasIgn){
      for (let i = 1; i < list.length; i++) parent[find(list[0].id)] = find(list[i].id);
      return;
    }
    for (let i = 0; i < list.length; i++)
      for (let j = i + 1; j < list.length; j++)
        if (find(list[i].id) !== find(list[j].id) && dupLinked(list[i], list[j], ignore, keysOf))
          parent[find(list[i].id)] = find(list[j].id);
  });
  const groups = {};
  arr.forEach(it => { const r = find(it.id); (groups[r] = groups[r] || []).push(it); });
  return Object.values(groups).filter(g => g.length > 1);
}

/* 배지를 붙일 명함 번호들 — 표가 이것으로 ⚠중복 을 그린다.
   ⚠ 묶기와 **같은 함수**를 쓴다. 예전에는 배지가 열쇠 개수만 세어, 「중복 아님」을
     눌러도 배지가 그대로 남았다. */
function dupIdSet(items, ignore){
  const s = new Set();
  dupGroupsOf(items, ignore).forEach(g => g.forEach(it => s.add(it.id)));
  return s;
}

/* ══════ 중복 판정 다시 하기 — 순수 로직 (테스트 대상) ══════
   표를 그릴 때마다 6,270장 전체를 다시 판정했다 — 한 번에 64ms. 줄 수와 상관없이
   늘 드는 값이라 「100개씩 보기」로도 안 줄었고, 네모 하나 누를 때마다 그만큼 멈췄다
   (대표 확인 2026-08-16 — 1줄만 그려도 86ms, 100줄 그려도 63ms 였다).

   ⚠ 「언제 다시 세야 하는가」를 손으로 정하지 않는다. 저장·삭제·합치기·남의 PC에서
     들어온 수정까지 빠짐없이 짚어야 하는데, 한 곳만 놓치면 ⚠중복 딱지가 **조용히
     틀린 채** 남는다. 틀린 딱지는 없느니만 못하다 — 멀쩡한 명함을 합치기 화면으로 부른다.
     대신 판정에 쓰이는 값만 그대로 이어붙여 견준다. 값이 그대로면 답도 그대로다.
     이어붙이기 5ms, 판정 64ms — 열세 배 싸다.
   ⚠ 여기 담는 칸은 itemKeys/rowKeys 가 보는 것과 **똑같아야** 한다
     (명함: 휴대폰·이메일·이름·상호 / 사업자: 사업자번호). 그 함수에 칸을 더하면
     여기에도 더해야 한다 — 안 그러면 그 칸만 고쳤을 때 딱지가 안 따라온다. */
function dupCacheKey(items, ignore){
  const arr = items || [];
  const P = '', R = '';         /* 칸·줄 사이를 가르는 글자 — 값에 안 나온다 */
  let s = arr.length + R;
  for(let i=0;i<arr.length;i++){
    const it = arr[i];
    s += it.id + P + (it.kind||'') + P + (it.name||'') + P + (it.company||'') + P
       + (it.mobile||'') + P + (it.email||'') + P + (it.bizno||'') + R;
  }
  /* 「중복 아님」으로 적어 둔 짝도 답을 바꾼다 — 차례가 뒤바뀌어도 같은 글자가 되게 정렬 */
  s += '' + (ignore ? [...ignore].sort().join(P) : '');
  return s;
}
let _dupMemo = { key:null, set:null };
function dupIdSetCached(items, ignore){
  const key = dupCacheKey(items, ignore);
  if(_dupMemo.key === key) return _dupMemo.set;
  _dupMemo = { key: key, set: dupIdSet(items, ignore) };
  return _dupMemo.set;
}

/* 이 명함이 든 묶음 하나만 */
function dupGroupFor(items, id, ignore){
  const g = dupGroupsOf(items, ignore).find(x => x.some(it => it.id === id));
  return g || [];
}

/* 이름이 하나로 모이나 → 확실한 중복인가.
   빈 이름은 셈에서 뺀다(사업자등록증은 이름 칸이 없다). */
function dupSameName(group){
  const names = new Set((group||[])
    .map(x => String(x.name||'').toLowerCase().replace(/\s/g,''))
    .filter(Boolean));
  return names.size <= 1;
}

/* 기본으로 남길 것 — 가장 최근에 고친 것. 사람이 라디오로 바꿀 수 있다. */
function dupPickKeeper(group){
  const g = (group||[]).slice().sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));
  return g.length ? g[0].id : '';
}

/* 칸별 비교표 — 무엇이 다른지 **눈으로 보여야** 판단이지 도박이 아니다.
   state 는 네 가지.
     same     다 같음 (표에서 흐리게)
     fill     한쪽이 비어 있음 → 합치면 채워진다
     diff     값이 다름 → 합치면 메모에 [병합] 으로 남는다
     namediff 이름이 다름 → **다른 사람일 수 있다.** 가장 세게 알린다
   값이 다 비어 있는 칸은 아예 넣지 않는다 — 빈 줄만 스무 개면 다른 것이 안 보인다. */
function dupFieldRows(group, fields){
  const norm = v => String(v==null?'':v).toLowerCase().replace(/[\s\-]/g,'');
  const out = [];
  (fields||[]).forEach(f => {
    const key = f[0], label = f[1];
    const vals = group.map(it => String(it[key]==null?'':it[key]).trim());
    if (!vals.some(Boolean)) return;                       /* 아무도 안 적은 칸 */
    const filled = vals.filter(Boolean);
    const uniq = new Set(filled.map(norm));
    let state = 'same';
    if (uniq.size > 1) state = (key === 'name') ? 'namediff' : 'diff';
    else if (filled.length < vals.length) state = 'fill';
    out.push({ key: key, label: label, vals: vals, state: state });
  });
  return out;
}

/* ══════ 중복 판단 — 화면 ══════ */

/* 「중복 아님」으로 적어 둔 짝 — **이 PC에만** 남긴다(대표 결정 2026-08-10).
   유사 항목 검사의 무시 목록과 같은 방식이다. 서버 규칙을 손대지 않아 가볍다. */
function dupIgnoreSet(){
  try{ return new Set(JSON.parse(localStorage.getItem(DUP_IGNORE_LS)||'[]')); }catch(_){ return new Set(); }
}
function dupIgnoreSave(set){
  try{ localStorage.setItem(DUP_IGNORE_LS, JSON.stringify([...set].slice(-5000))); }catch(_){}
}
/* 묶음 안의 **모든 짝**을 적어 둔다 — 하나만 적으면 셋 이상 겹친 묶음이 안 풀린다 */
function dupIgnoreAdd(ids){
  const s = dupIgnoreSet();
  for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++) s.add(dupIgnoreKey(ids[i],ids[j]));
  dupIgnoreSave(s); return s;
}

/* 지금 종류의 명함 전부 — 개인 폴더(잠금) 명함은 넣지 않는다.
   ⚠ 공용 목록에 개인 명함이 옆에 나오면 숨긴 사실 자체가 드러난다. */
function dupPool(){ return Object.values(state.items).filter(it=>it.kind===state.tab); }

let _dupFixIds = [];      /* 지금 팝업이 다루는 명함들 */
let _dupFixKeep = '';     /* 남길 것 */

/* ⚠중복 을 눌렀을 때 */
function openDupFix(id){
  const group = dupGroupFor(dupPool(), id, dupIgnoreSet());
  if (group.length < 2){
    /* 방금 다른 화면에서 정리된 뒤일 수 있다 — 표를 다시 그려 배지를 없앤다 */
    toast('겹친 명함이 없습니다 — 이미 정리된 것 같습니다');
    render(); return;
  }
  /* 최근에 고친 것을 왼쪽에 — 남길 것이 맨 앞이면 눈이 편하다 */
  _dupFixIds = group.slice().sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0)).map(x=>x.id);
  _dupFixKeep = dupPickKeeper(group);
  drawDupFix();
}

function drawDupFix(){
  const group = _dupFixIds.map(i=>state.items[i]).filter(Boolean);
  if (group.length < 2){ dedupBg.classList.remove('open'); render(); return; }
  const fields = (state.tab==='card' ? CARD_FIELDS : BIZ_FIELDS);
  const rows = dupFieldRows(group, fields);
  const okName = dupSameName(group);
  const title = state.tab==='card'
    ? (group[0].name||group[0].company||'(이름 없음)')
    : (group[0].company||'(상호 없음)');
  const ignN = dupIgnoreSet().size;
  const others = dupGroupsOf(dupPool(), dupIgnoreSet()).length - 1;

  /* 무엇 때문에 겹쳤는지 한 줄로 — 「왜 이게 중복인가」에 먼저 답한다 */
  const why = (function(){
    const shared = rows.filter(r=>r.state==='same' && ['mobile','email','bizno'].indexOf(r.key)>=0)
      .map(r=>r.label);
    if (rows.some(r=>r.state==='same' && r.key==='name')) shared.unshift('이름');
    return shared.length ? shared.join('·')+'이(가) 같습니다' : '열쇠가 겹칩니다';
  })();

  let h = `<div class="mhead"><b>⚠ 겹친 ${state.tab==='card'?'명함':'사업자등록증'} ${group.length}장</b>
      <span style="font-size:12.5px;color:var(--sub);font-weight:400;margin-left:6px">${esc(title)}</span>
      ${_closeBtn()}</div>`;

  h += okName
    ? `<div class="dupok">✓ ${esc(why)}. 이름도 같아 <b>같은 사람</b>으로 보입니다 — 합쳐도 됩니다.</div>`
    : `<div class="dupwarn"><b>이름이 서로 다릅니다.</b> ${esc(why)} — 회사 대표번호·대표이메일을
         여럿이 함께 쓰는 경우일 수 있습니다. <b>합치면 한 사람이 사라지고 되돌려도 원래대로
         돌아오지 않습니다.</b> 다른 사람이면 아래 「중복 아님」을 눌러 주세요.</div>`;

  h += `<div class="dupwrap"><table class="duptbl"><thead><tr><th class="k"></th>`;
  group.forEach(it=>{
    const on = _dupFixKeep===it.id;
    h += `<th class="${on?'keep':''}">
      <label><input type="radio" name="dupkeep" ${on?'checked':''}
        onchange="dupFixPick('${it.id}')"> 남길 것</label>
      <span>${fmtDate(it.updatedAt||it.createdAt)}</span>
      ${it.owner?`<span>담당 ${esc(it.owner)}</span>`:''}</th>`;
  });
  h += `</tr></thead><tbody>`;
  rows.forEach(r=>{
    h += `<tr class="s-${r.state}"><td class="k">${esc(r.label)}</td>`;
    r.vals.forEach((v,i)=>{
      const on = _dupFixKeep===group[i].id;
      h += `<td class="${on?'keep':''}">${v ? esc(v) : '<i>비어 있음</i>'}</td>`;
    });
    h += `</tr>`;
  });
  h += `</tbody></table></div>
    <div class="dupleg">
      <span class="s-namediff">다른 사람일 수 있음</span>
      <span class="s-diff">값이 다름 — 메모에 남습니다</span>
      <span class="s-fill">빈 칸을 채웁니다</span>
    </div>
    <div class="dupacts">
      <button class="btn primary" onclick="dupFixMerge()">한 장으로 합치기</button>
      <button class="btn ghost danger" onclick="dupFixTrash()">고른 것만 남기고 휴지통</button>
      <button class="btn ghost" onclick="dupFixNotDup()">중복 아님</button>
    </div>
    <p class="dupnote">합치기 — 고른 것을 바탕으로 빈 칸을 채우고, 값이 다르면 메모에 <b>[병합]</b>으로 남깁니다. 사진도 지킵니다.<br>
      휴지통 — 30일 안에 되살릴 수 있습니다 (환경설정 → 정리 → 휴지통).</p>
    <div class="dupfoot">
      ${others>0
        ? `<span>이 종류에 겹친 묶음이 <b>${others}개</b> 더 있습니다</span>
           <button class="btn ghost" style="margin-left:auto" onclick="openDedup()">한 번에 정리 →</button>`
        : `<span>겹친 묶음은 이것뿐입니다</span>`}
    </div>
    ${ignN ? `<div class="dupfoot"><span>「중복 아님」으로 적어 둔 짝 <b>${ignN}</b>건 (이 PC)</span>
        <button class="btn ghost" style="margin-left:auto" onclick="openDupIgnored()">보기·되돌리기</button></div>` : ''}`;
  showPanel(h);
}
function dupFixPick(id){ _dupFixKeep=id; drawDupFix(); }

async function dupFixMerge(){
  const group = _dupFixIds.map(i=>state.items[i]).filter(Boolean);
  if (group.length<2) return;
  /* 이름이 엇갈리면 한 번 더 묻는다 — 이 한 번이 사람 한 명을 지킨다 */
  if (!dupSameName(group) &&
      !confirm(`이름이 서로 다릅니다 (${group.map(x=>x.name||'(없음)').join(' / ')}).\n`+
               `다른 사람이면 합치면 안 됩니다.\n\n정말 한 장으로 합칠까요?`)) return;
  await mergeGroup(_dupFixIds, _dupFixKeep);
  dedupBg.classList.remove('open');
  render();
  toast('✅ 한 장으로 합쳤습니다 — 값이 다른 것은 메모에 남았습니다',6000);
}

async function dupFixTrash(){
  const drop = _dupFixIds.filter(i=>i!==_dupFixKeep);
  if (!drop.length) return toast('지울 것이 없습니다');
  const keep = state.items[_dupFixKeep]||{};
  if (!confirm(`「${keep.name||keep.company||'고른 명함'}」 하나만 남기고 ${drop.length}장을 휴지통으로 옮깁니다.\n`+
               `30일 안에 되살릴 수 있습니다. 진행할까요?`)) return;
  for (const id of drop) await Store.del(id);
  dedupBg.classList.remove('open');
  render();
  toast(`🗑 ${drop.length}장을 휴지통으로 옮겼습니다 — 되살리려면 환경설정 → 정리 → 휴지통`,7000);
}

function dupFixNotDup(){
  dupIgnoreAdd(_dupFixIds.slice());
  dedupBg.classList.remove('open');
  render();
  toast('겹친 것 아님으로 적었습니다 — 이 PC에서 ⚠ 표시가 사라집니다',6000);
}

/* 「중복 아님」 목록 — 되돌릴 길이 없는 지우기는 만들지 않는다 */
function openDupIgnored(){
  const s = dupIgnoreSet();
  if (!s.size) return toast('적어 둔 것이 없습니다');
  const nameOf = id => { const it=state.items[id]; return it ? (it.name||it.company||id) : '(지워진 명함)'; };
  let h = `<div class="mhead"><b>중복 아님으로 적어 둔 짝 — ${s.size}건</b>${_closeBtn()}</div>
    <p style="font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:10px">

/* ════════════ 🔍 유사 항목 검사 (완전중복은 아니지만 같은 사람일 수 있는 명함) ════════════ */
const _simNorm  = s => String(s||'').toLowerCase().replace(/\s/g,'');
const _tail8    = s => { const d=digits(s); return d.length>=8 ? d.slice(-8) : ''; };
const _emailDom = s => { const m=String(s||'').toLowerCase().match(/@([^@\s]+)$/); return m?m[1]:''; };
function _simIgnoreSet(){ try{ return new Set(JSON.parse(localStorage.getItem('pucards_sim_ignore')||'[]')); }catch(_){ return new Set(); } }
function _simIgnoreSave(set){ try{ localStorage.setItem('pucards_sim_ignore', JSON.stringify([...set].slice(-5000))); }catch(_){} }
const _pairSig = (a,b) => [a,b].sort().join('~');
function _isExactDup(a,b){ const ka=new Set(rowKeys(a)); return rowKeys(b).some(k=>ka.has(k)); }
/* 같은 사람일 가능성이 있으나 완전중복은 아닌지 판단 */
function _isSimilar(a,b){
  if(_isExactDup(a,b)) return false;   /* 완전중복은 '중복 정리'가 담당 */
  const nEq=_simNorm(a.name)    && _simNorm(a.name)===_simNorm(b.name);
  const cEq=_simNorm(a.company) && _simNorm(a.company)===_simNorm(b.company);
  const tEq=_tail8(a.mobile)    && _tail8(a.mobile)===_tail8(b.mobile);
  const dEq=_emailDom(a.email)  && _emailDom(a.email)===_emailDom(b.email);
  const cEmpty=!_simNorm(a.company) || !_simNorm(b.company);
  /* 같은 이름 + (같은 회사/전화뒤8/이메일도메인/한쪽 회사없음)  또는  전화뒤8 같고 이름·회사 중 하나 일치 */
  return !!((nEq && (cEq||tEq||dEq||cEmpty)) || (tEq && (nEq||cEq)));
}
function findSimilarGroups(){
  const arr=Object.values(state.items).filter(it=>it && it.kind==='card');
  const ignore=_simIgnoreSet();
  /* 후보 축소: 이름·전화뒤8 버킷 안에서만 비교(전수비교 회피) */
  const buckets={};
  const addB=(k,it)=>{ if(!k) return; (buckets[k]=buckets[k]||[]).push(it); };
  arr.forEach(it=>{ addB('n'+_simNorm(it.name), it); addB('t'+_tail8(it.mobile), it); });
  const parent={}; arr.forEach(it=>parent[it.id]=it.id);
  const find=x=>parent[x]===x?x:(parent[x]=find(parent[x]));
  const uni=(a,b)=>{ parent[find(a)]=find(b); };
  const pairSeen=new Set(); let unioned=0;
  Object.values(buckets).forEach(items=>{
    if(items.length<2 || items.length>40) return;   /* 흔한 이름 등 너무 큰 묶음은 스킵(노이즈·성능) */
    for(let i=0;i<items.length;i++) for(let j=i+1;j<items.length;j++){
      const a=items[i], b=items[j]; const sig=_pairSig(a.id,b.id);
      if(pairSeen.has(sig)) continue; pairSeen.add(sig);
      if(ignore.has(sig)) continue;
      if(_isSimilar(a,b)){ if(find(a.id)!==find(b.id)){ uni(a.id,b.id); unioned++; } }
    }
  });
  if(!unioned) return [];
  const g={};
  arr.forEach(it=>{ const r=find(it.id); (g[r]=g[r]||[]).push(it); });
  return Object.values(g).filter(x=>x.length>1);
}
function openSimilar(){
  const groups=findSimilarGroups();
  if(!groups.length){
    const msg='유사한 명함이 없습니다 👍';
    if(_panelTarget==='inline') return showPanel(`<div style="padding:22px;text-align:center;color:var(--sub);font-size:13px;line-height:1.8">${msg}</div>`);

  }

    <p style="font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:10px">
    완전 중복은 아니지만 <b>같은 사람일 수 있는</b> 명함이에요 (이름 같고 회사·전화가 조금 다르거나, 번호 형식만 다른 경우 등).<br>
    같은 사람이면 <b>병합</b>, 다른 사람이면 <b>무시</b>하세요. (무시하면 이 기기에서 다시 안 뜹니다)</p>`;
  groups.slice(0,100).forEach(gr=>{
    const rows=gr.map(x=>`${esc(x.name||'(이름없음)')} · ${esc(x.company||'회사없음')} · ${esc(x.mobile||x.email||'')}`).join('<br>');
    const ids=gr.map(x=>x.id).join(',');
    h+=`<div class="ditem" style="align-items:center"><div class="v">

  });

  showPanel(h);
}

/* ════════════ 🧹 깨진 글자(인코딩 오류) 명함 정리 → 휴지통 ════════════
   UTF-8 한글을 라틴으로 잘못 읽으면 'ì¶œ ë°œ'처럼 깨진다. 정상 한글(U+AC00~) 없이
   연속바이트(U+0080~U+00BF)가 2개 이상이면 깨진 것으로 판정. */
function _hasMojibake(s){ s=String(s||'');
  if(/[가-힣]/.test(s)) return false;               /* 정상 한글이 있으면 안 깨진 것 */
  return (s.match(/[\u0080-\u02FF\u2010-\u2122\u20AC]/g)||[]).length >= 2;   /* 라틴 깨짐 문자 2개+ */
}
function itemMojibake(it){
  return _hasMojibake(it.name)||_hasMojibake(it.company)||_hasMojibake(it.title)
       ||_hasMojibake(it.dept)||_hasMojibake(it.companyAddr)||_hasMojibake(it.address);
}

}
/* ════════════ 🏢 이름 칸에 회사·기관명이 들어간 명함 정리 ════════════
   예) 이름='청풍중학교' → 회사로 이동 / 이름='가성훈사장-창성산업' → 이름·직책·회사로 분리 */
const _SURNAME = new Set('김이박최정강조윤장임한오서신권황안송류전홍고문양손배백허유남심노하곽성차주우구나민진지엄채원천방공현함변염여추도소석선설마길연위표명기반왕금옥육인맹제모탁국어은편용봉'
  + '가간갈감견경계동두라목미범복부빈사상승시종좌창태평피해형호화후흥');   /* 드문 성씨도 포함 (가성훈·계미정 등) */
const _MULTI_SN = ['남궁','황보','제갈','사공','선우','서문','독고','동방'];
const _ORG_KW = ['공사','공단','위원회','노동청','지청','센터','협회','조합','학교','대학','병원','의원','약국','은행','산업',
 '엔지니어링','테크','전자','식품','건설','물산','상사','기업','법인','사무소','세무','회계','법률','관광','마트','식당',
 '카페','호텔','모텔','농장','축산','정밀','기계','화학','제약','물류','운수','택배','공업','설비','시스템','솔루션',
 '컨설팅','노무','인력','건축','설계','자동차','부품','금속','철강','섬유','유통','무역','통신','정보','미디어','교육',
 '학원','어린이집','유치원','복지관','재단','지사','지점','공장','연구소','진흥원','보험','증권','농협','수협','시청',
 '군청','구청','주민센터','경찰서','소방서','세무서','치과','한의','요양','그룹','코리아','서비스','고속','개발'];
const _TITLE_SFX = ['대표이사','부사장','전무이사','상무이사','사무국장','본부장','센터장','조합장','위원장','사장','회장',
 '원장','대표','전무','상무','이사','부장','차장','과장','대리','주임','팀장','실장','소장','국장','반장','기사','교수',
 '선생','노무사','변호사','세무사','회계사','법무사','조정관','조사관','감독관','주무관','사무관','담당자','총무','님'];
/* 엄격 판정 — 고칠 필요가 있는지(성씨로 시작하는 2~3자 한글) */
function _isPersonName(s){
  s=String(s||'').trim();
  if(!/^[가-힣]{2,4}$/.test(s)) return false;
  if(_ORG_KW.some(k=>s.includes(k))) return false;
  if(_MULTI_SN.some(m=>s.startsWith(m))) return true;
  if(s.length>3) return false;
  return _SURNAME.has(s[0]);
}
/* 느슨한 판정 — 이미 '이름-회사'나 '이름+호칭' 형태로 쪼갠 조각이 사람 이름인지
   (드문 성씨 '가·간·견' 등도 살리되, 4자 이상 상호는 배제) */
function _looksPerson(s){
  s=String(s||'').trim();
  if(_ORG_KW.some(k=>s.includes(k))) return false;
  if(_MULTI_SN.some(m=>s.startsWith(m)) && /^[가-힣]{3,4}$/.test(s)) return true;
  return /^[가-힣]{2,3}$/.test(s);
}
/* 이름 뒤 호칭·직책 떼기 — '님' 먼저 떼고 긴 것부터 맞춰본다 */
function _stripTitle(s){
  s=String(s||'').trim();
  if(s.endsWith('님') && s.length>1) s=s.slice(0,-1).trim();
  const sorted=_TITLE_SFX.filter(t=>t!=='님').sort((a,b)=>b.length-a.length);
  for(const t of sorted){ if(s.endsWith(t) && s.length>t.length) return [s.slice(0,-t.length).trim(), t]; }
  return [s,''];
}
/* 한 건을 어떻게 고칠지 계산 — 고칠 필요 없으면 null */
function nameFixPlan(it){
  const nm=String(it.name||'').trim(); if(!nm) return null;
  if(_isPersonName(nm)) return null;                       /* 정상 */
  const co=String(it.company||'').trim();
  /* 1) '가성훈사장-창성산업' 처럼 구분자로 사람·회사가 붙은 경우 */
  const m=nm.split(/\s*[-–—_·]\s*/).filter(Boolean);
  if(m.length===2){
    const r=_stripTitle(m[0]);
    if(_looksPerson(r[0])){
      return { type:'분리', sure:true, name:r[0], company:(co||m[1]), title:(it.title||r[1]||''), dept:it.dept||'',
               memo:(co&&co!==m[1]) ? [it.memo,m[1]].filter(Boolean).join(' / ') : (it.memo||'') };
    }
  }
  /* 2) '홍영숙선생님' 처럼 사람+호칭 */
  const b=_stripTitle(nm);
  if(b[0]!==nm && _looksPerson(b[0])){
    return { type:'호칭분리', sure:true, name:b[0], company:co, title:(it.title||b[1]||''), dept:it.dept||'', memo:it.memo||'' };
  }
  /* 3) 기관·상호 → 회사 칸으로 (기존 회사값은 부서·메모로 보존) */
  const plan={ type:'회사로', sure:_ORG_KW.some(k=>nm.includes(k)), name:'', company:nm,
               title:it.title||'', dept:it.dept||'', memo:it.memo||'' };
  if(co && co!==nm){ if(!plan.dept) plan.dept=co; else plan.memo=[plan.memo,co].filter(Boolean).join(' / '); }
  return plan;
}
function nameFixList(){
  return Object.values(state.items)
    /* 한 번 고친 명함은 다시 잡지 않는다 (또 고치면 이름이 회사로 밀려남) */
    .filter(it=>it && it.kind===state.tab && !it.nameFixed && !inHiddenLocked(it))
    .map(it=>({it:it, plan:nameFixPlan(it)}))
    .filter(x=>x.plan);
}
function applyNameFix(id){
  const it=state.items[id]; if(!it) return;
  const p=nameFixPlan(it); if(!p) return;
  it.name=p.name; it.company=p.company; it.title=p.title; it.dept=p.dept; it.memo=p.memo;
  it.nameFixed=1; it.updatedAt=Date.now(); Store.put(it);
}
function autoNameFixSure(){
  const list=nameFixList().filter(x=>x.plan.sure);

  let n=0; list.forEach(x=>{ applyNameFix(x.it.id); n++; });

/* ════════════ 📞 이름·회사 칸에 전화번호·주소가 통째로 들어간 명함 정리 ════════════
   예) '아름다운정원화수목 041-415-0815 산33 천안시 동남구' → 회사·전화·주소로 분리 */
const _PHONE_RE = /(0\d{1,2}[-.\s]?\d{3,4}[-.\s]?\d{4}|1[5-8]\d{2}[-.\s]?\d{4})/g;
const _PROV_RE = /^(서울특별시|부산광역시|대구광역시|인천광역시|광주광역시|대전광역시|울산광역시|세종특별자치시|경기도|강원도|강원특별자치도|충청북도|충청남도|전라북도|전라남도|전북특별자치도|경상북도|경상남도|제주특별자치도|제주도|서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)$/;
const _isAddrTok = t => /^(산)?\d+[-\d]*$/.test(t)
  || _PROV_RE.test(t)
  || /(특별시|광역시|자치시|자치도)$/.test(t)
  || /^[가-힣]{2,8}(시|군|구|읍|면|동|리|로|길|가)$/.test(t);
/* 뒤섞인 문자열을 회사명 · 전화들 · 주소로 나눈다 */
function splitMixed(s){
  s=String(s||'').trim();
  const phones=[];
  s=s.replace(_PHONE_RE,(m)=>{ phones.push(m.trim().replace(/[.\s]/g,'-')); return ' '; });
  const toks=s.split(/\s+/).filter(Boolean);
  let cut=-1;
  for(let i=0;i<toks.length;i++){ if(_isAddrTok(toks[i])){ cut=i; break; } }
  let addr='';
  if(cut>0){                       /* 앞에 회사명이 남아 있을 때만 주소로 인정 */
    const tail=toks.slice(cut);
    if(tail.length>=2 || /(시|군|구|도)$/.test(tail[0])){ addr=tail.join(' '); toks.length=cut; }
  }
  return { text:toks.join(' ').trim(), phones, addr };
}
function mixedFixPlan(it){
  const src=String(it.name||'').trim() || String(it.company||'').trim();
  if(!src) return null;
  if(!_PHONE_RE.test(src)){ _PHONE_RE.lastIndex=0; return null; }
  _PHONE_RE.lastIndex=0;
  const r=splitMixed(src);
  if(!r.text) return null;                      /* 회사명이 안 남으면 손대지 않음 */
  const p={ company:r.text, name:'', mobile:it.mobile||'', companyTel:it.companyTel||'',
            companyFax:it.companyFax||'', companyAddr:it.companyAddr||'' };
  r.phones.forEach(ph=>{
    const d=digits(ph);
    if(d.startsWith('010')){ if(!p.mobile) p.mobile=ph; }
    else if(!p.companyTel) p.companyTel=ph;
    else if(!p.companyFax) p.companyFax=ph;
  });
  if(r.addr && !p.companyAddr) p.companyAddr=r.addr;
  return p;
}
function mixedFixList(){
  return Object.values(state.items)
    .filter(it=>it && it.kind===state.tab && !it.mixedFixed && !inHiddenLocked(it))
    .map(it=>({it:it, plan:mixedFixPlan(it)}))
    .filter(x=>x.plan);
}
function applyMixedFix(id){
  const it=state.items[id]; if(!it) return;
  const p=mixedFixPlan(it); if(!p) return;
  it.name=p.name; it.company=p.company; it.mobile=p.mobile; it.companyTel=p.companyTel;
  it.companyFax=p.companyFax; it.companyAddr=p.companyAddr;
  it.mixedFixed=1; it.updatedAt=Date.now(); Store.put(it);
}
function autoMixedFixAll(){
  const list=mixedFixList();
  if(!list.length) return toast('정리할 항목이 없습니다');

    <b>명함은 지워지지 않습니다.</b></p>
    <button class="btn primary" style="width:100%;margin-bottom:12px" onclick="autoMixedFixAll()">⚡ ${list.length.toLocaleString()}건 모두 자동으로 나누기</button>`;

      <button class="btn ghost" style="flex:none;padding:8px 14px" onclick="applyMixedFix('${it.id}');render();setTimeout(function(){_refresh(openMixedFix)},80)">나누기</button></div>`;
  });
  if(list.length>200) h+=`<p style="color:var(--sub);font-size:12px;padding:8px 2px">…외 ${(list.length-200).toLocaleString()}건 (자동 나누기를 쓰면 한 번에 처리됩니다)</p>`;

/* ════════════ 🔗 ERP 대표자·담당자 대조 (업체관리에 있는데 명함첩에 없는 이름 찾기) ════════════ */
function findErpNameMismatch(){
  if(!ErpMatch.ready || !ErpMatch.companies) return null;
  const cards=Object.values(state.items).filter(it=>it&&it.kind==='card'&&it.name);
  const cardsByCo={};
  cards.forEach(it=>{ const k=ErpMatch._norm(it.company); if(k) (cardsByCo[k]=cardsByCo[k]||[]).push(it); });
  const rows=[];
  ErpMatch.companies.forEach(co=>{
    if(!co) return;
    const erpNames=[];
    if(co.ceo)  erpNames.push({role:'대표자', name:co.ceo});
    if(co.ceo2) erpNames.push({role:'대표자2', name:co.ceo2});
    [ ...((co.contacts||[]).map(c=>c&&c.name)), co.primaryContactName, co.contactName ]
      .filter(Boolean).forEach(nm=>erpNames.push({role:'담당자', name:nm}));
    if(!erpNames.length) return;
    let coCards=(cardsByCo[ErpMatch._norm(co.name)]||[]).slice();
    const bd=ErpMatch._digits(co.bizNo);
    if(bd.length>=10) cards.forEach(it=>{ if(ErpMatch._digits(it.bizno)===bd && coCards.indexOf(it)<0) coCards.push(it); });
    const cardNames=coCards.map(it=>ErpMatch._norm(it.name)).filter(Boolean);
    const missing=erpNames.filter(en=>{ const nn=ErpMatch._norm(en.name); if(!nn) return false;
      return !cardNames.some(cn=>ErpMatch._nameHit(cn,nn)); });
    if(missing.length) rows.push({ company:co.name||'(회사명없음)', bizNo:co.bizNo||'',
      missing:missing.map(m=>m.role+': '+m.name), haveCards:coCards.length });
  });
  return rows;
}
function openErpNameCheck(){
  const msg=(t)=>{ if(_panelTarget==='inline') return showPanel(

  const rows=findErpNameMismatch();
  if(!rows) return msg('ERP 데이터를 아직 못 읽었습니다. 잠시 후 다시 시도하세요.');
  if(!rows.length) return msg('✅ 불일치 없음 — ERP 대표자·담당자가 모두 명함첩에 있습니다');
  rows.sort((a,b)=>b.missing.length-a.missing.length);
  let h=`<div class="mhead"><b>🔗 ERP 대표자·담당자 대조 — ${rows.length}개 회사</b>
    ${_closeBtn()}</div>
    <p style="font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:10px">
    푸른이알피 업체관리엔 <b>등록돼 있는데 명함첩엔 없는</b> 대표자·담당자예요. 명함을 추가하거나 이름 철자를 맞추면 연결됩니다.</p>`;

    h+=`<div class="ditem"><div class="v"><b>${esc(r.company)}</b>${r.bizNo?` <span style="color:var(--sub);font-size:11px">${esc(fmtBizno(r.bizNo))}</span>`:''}<br>

  });
  if(rows.length>200) h+=`<p style="color:var(--sub);font-size:12px;padding:8px 2px">…외 ${rows.length-200}개 회사</p>`;
  showPanel(h);

async function exportXlsx(){
