<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>기업정보함</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>📇</text></svg>">
<!-- 아이폰 홈화면 아이콘 — 탭 아이콘과 다른 것이다. 여기는 PNG 여야 한다(SVG 를 안 읽는다) -->
<link rel="apple-touch-icon" href="icon-cards-192.png">
<link rel="manifest" href="pu-cards-manifest.json">
<script>
/* ── 「푸른 메일」로 들어온 창 (대표 지시 2026-08-21 「메일함만 별도로 …바탕화면에」) ──
   나눈 것은 «코드»가 아니라 «들어가는 문»이다. 메일은 받는사람 자동완성(명함 전체를
   뒤진다) · 묶음 발송(고른 명함이 곧 받는 곳) · 보낸 기록(그 명함에 붙는다) 셋이 모두
   명함 자료에 매여 있어, 앱을 쪼개면 그 셋을 잃거나 두 벌로 만들어야 한다.
   두 벌이 되면 언젠가 한쪽만 고친다 — 이 저장소에서 여러 번 겪은 일이다.
   그래서 파일은 하나 그대로 두고, 주소(?view=mail)에만 제 이름·아이콘을 달아
   홈 화면에 «따로» 앉는다.

   ⚠ 이 판단은 반드시 <head> 에서 한다. 「홈 화면에 추가」를 누르는 순간 브라우저는
     «그때 걸려 있는» manifest 를 읽는다 — 나중에 바꾸면 이미 기업정보함으로 담긴 뒤다. */
(function(){ try{
  if(!/(^|[?&])view=mail(&|$)/.test(location.search)) return;
  document.title = '푸른 메일';
  var m = document.querySelector('link[rel=manifest]'); if(m) m.href = 'pu-mail-manifest.json';
  var t = document.querySelector('meta[name=theme-color]'); if(t) t.content = '#1e40af';
  var i = document.querySelector('link[rel=icon]');
  if(i) i.href = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>\uD83D\uDCE7</text></svg>";
}catch(e){} })();
</script>

<style>
:root{
  --bg:#101010; --bg2:#1a1a1a; --row:#151515; --line:#2b2b2b;
  --ink:#f3f3f3; --sub:#9aa0a6; --orange:#ff6f0f; --orange-soft:#3a2410;
  --green:#3ddc84; --red:#ff5d6c;
  --sidebar-w:230px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}

/* ── 상단 바 ── */
/* ⚠ 머리줄은 한 줄이다 — 줄지 않게 못 박아 둔다. 이름을 넣었더니 「명함/첩」이
   낱말 가운데서 갈라졌다(2026-08-20). 줄어도 되는 것은 이름 하나뿐이고,
   그것은 …으로 줄어든다(.pcwho). */
#appbar{display:flex;align-items:center;gap:4px;padding:14px 16px 8px;flex-shrink:0;flex-wrap:nowrap}
#appbar .logo{font-size:23px;font-weight:800;letter-spacing:-.5px;white-space:nowrap;flex:0 0 auto}
#appbar #modeBadge,#appbar .logoutTimer,#appbar .iconbtn{flex:0 0 auto;white-space:nowrap}
#modeBadge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;
  background:var(--orange-soft);color:var(--orange);margin-left:8px}
#modeBadge.live{background:#10301f;color:var(--green)}
#appbar .spacer{flex:1}
/* ── 로그인한 사람 이름 ──
   ⚠ 폰에서는 «이름만» 쓴다. 「권형하 대표노무사 · P-001」은 140px 이라
     🔍·🚪·☰ 를 밀어내고 머리줄이 두 줄이 된다. 직책·사번은 눌러 보는 말풍선에 남긴다. */
.pcwho{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0;flex:0 1 auto}
#pcWhoM{color:#cfd8ea;max-width:22vw;margin-right:2px}
#pcWho{color:#33415e;max-width:220px}
/* pu-whoami 는 자리에 <b style="color:#1e293b"> 로 그린다 — 어두운 폰 머리줄에서는
   글자가 바탕에 묻힌다. 여기서만 되돌린다. */
#pcWhoM b{color:#cfd8ea}
/* ── 폰 머리줄은 칸이 여덟이다 — 이름을 넣은 만큼 어딘가 줄여야 한다 ──
   「실시간 공유」 딱지는 **빛깔이 곧 뜻**이다(초록=공유 중, 주황=데모). 폰에서는
   글씨를 접고 빛깔 알만 남긴다 — 온전한 말은 말풍선과 ☰ 설정 화면에 남아 있다.
   이렇게 비운 자리를 이름이 쓴다. */
@media(max-width:760px){
  #modeBadge{font-size:0;padding:5px;margin-left:6px;flex:0 0 auto}
}
@media(max-width:400px){
  #appbar{gap:2px;padding-left:10px;padding-right:10px}
  #appbar .iconbtn{padding:7px 6px}
  #pcWhoM{max-width:26vw}
}
.iconbtn{font-size:19px;padding:7px 9px;border-radius:10px}
.iconbtn:active{background:var(--bg2)}

/* ── 탭 ── */
#tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0;padding:0 8px}
#tabs button{padding:11px 14px;font-size:16px;font-weight:700;color:var(--sub);
  border-bottom:3px solid transparent}
#tabs button.on{color:#fff;border-bottom-color:#fff}

/* ── 부제 줄: 전체(N)∨ · 정렬 ── */
/* ── 폰 메일 화면 (대표 지시 2026-08-20 "폰에서도 쓰게") ──
   PC 것을 그대로 그리고, 위에 「‹ 목록 · 쓰기 · 보낸 · 예약 · 자료함」 한 줄만 얹는다.
   ⚠ 메일 화면에서는 갈래 줄(#tabs)과 거르개 줄(#subbar)을 접는다 — 명함 목록 것이라
     여기서는 누를 것이 없고, 누르면 엉뚱한 데로 간다. */
body.mailview #tabs,body.mailview #subbar{display:none}
.mmbar{display:flex;align-items:center;gap:6px;padding:9px 12px;flex-wrap:nowrap;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6;background:var(--bg)}
.mmbar::-webkit-scrollbar{display:none}
.mmbar > *{flex:0 0 auto}
.mmback{background:none;border:none;color:var(--sub);font-size:14px;font-weight:700;
  padding:6px 8px;font-family:inherit;cursor:pointer}
.mmtab{background:var(--bg2);border:1px solid var(--line);color:var(--sub);border-radius:99px;
  padding:6px 12px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
.mmtab.on{background:#2f6fed;border-color:#2f6fed;color:#fff}
/* 메일 알맹이 — PC 폭에 맞춰 만든 것이라 폰에서는 좌우로 넘치지 않게 눌러 둔다 */
#mmBody{padding:10px 12px 90px}
#mmBody *{max-width:100%}
#mmBody table{width:100%;display:block;overflow-x:auto}
#mmBody input,#mmBody textarea,#mmBody select{width:100%;min-width:0;box-sizing:border-box}
#subbar{display:flex;align-items:center;gap:14px;padding:11px 16px;flex-shrink:0;
  background:var(--bg2);border-bottom:1px solid var(--line)}
#groupBtn{font-size:16px;font-weight:800;display:flex;align-items:center;gap:6px}
#groupBtn .v{font-size:12px;color:var(--sub)}
#subbar .spacer{flex:1}
.subact{font-size:13.5px;color:var(--ink);display:flex;align-items:center;gap:4px}

/* ── 검색 줄(토글) ── */
#searchbar{display:none;padding:8px 16px;background:var(--bg2);flex-shrink:0;border-bottom:1px solid var(--line)}
#searchbar.open{display:block}
#search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--ink);font-size:15px}
#search:focus{outline:none;border-color:var(--orange)}

/* ── 본문 ── */
#main{flex:1;display:flex;min-height:0}
#sidebar{width:var(--sidebar-w);min-width:150px;max-width:420px;background:var(--bg2);
  border-right:1px solid var(--line);overflow-y:auto;padding:10px;flex-shrink:0;display:none}
#resizer{width:5px;cursor:col-resize;flex-shrink:0;display:none}
#resizer:hover{background:var(--orange-soft)}
@media(min-width:761px){ #sidebar,#resizer{display:block} }
.grouphead{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 8px}
.grouphead b{font-size:12px;color:var(--sub);letter-spacing:1px}
.gitem{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;font-size:14px;cursor:pointer;user-select:none}
.gitem:hover{background:#222}
.gitem.on{background:var(--orange-soft);color:var(--orange);font-weight:700}
.gitem .cnt{margin-left:auto;font-size:12px;color:var(--sub)}
.gitem.dropover{outline:2px dashed var(--orange)}

#listwrap{flex:1;overflow-y:auto;padding-bottom:110px;min-width:0}
.datehead{font-size:15px;font-weight:700;color:var(--ink);padding:18px 18px 6px;opacity:.92}
.row{display:flex;align-items:center;gap:14px;padding:15px 16px;cursor:pointer;
  border-bottom:1px solid #1d1d1d}
.row:active{background:#191919}
.row.dragging{opacity:.4}
.rowmain{flex:1;min-width:0}
.rowmain .nm{font-size:21px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowmain .nm .pv{display:inline-block;font-size:11px;font-weight:700;color:#6fdcc0;background:rgba(29,158,117,.18);border:1px solid rgba(29,158,117,.55);border-radius:10px;padding:0 7px;margin-left:8px;vertical-align:middle}
.rowmain .l1,.rowmain .l2{font-size:14.5px;color:#cfcfcf;margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowmain .l2{color:#bdbdbd}
.rowmain .l2 .tg{display:inline-block;font-size:11px;font-weight:700;color:#c9d2e3;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:6px;padding:1px 7px;margin-right:5px}
/* 🏢 ERP 거래처 담당자 배지 (푸른 거래처만 표시) */
.rowmain .erpmgr{display:inline-block;margin-top:5px;font-size:12.5px;font-weight:800;
  color:#ffd8a8;background:rgba(230,126,34,.16);border:1px solid rgba(230,126,34,.55);
  border-radius:8px;padding:1px 8px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erpmgr-box{margin:2px 0 12px;font-size:14px;font-weight:800;color:#ffd8a8;
  background:rgba(230,126,34,.16);border:1px solid rgba(230,126,34,.55);
  border-radius:9px;padding:8px 12px;line-height:1.4}
/* ── 취업규칙 이력 (규정관리가 쌓은 것을 읽기만 한다) ── */
.rulehist{margin:2px 0 12px}
.rulehist .rh-t{font-size:12px;font-weight:800;color:var(--orange);margin-bottom:6px;
  padding-bottom:5px;border-bottom:1px solid var(--line)}
.rulehist .rh-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;
  background:var(--row);border-radius:6px;padding:6px 9px;margin-bottom:3px}
.rulehist .rh-k{font-size:10px;font-weight:800;padding:2px 8px;border-radius:8px;white-space:nowrap;
  background:var(--orange-soft);color:#ffb27a;margin-top:1px}
/* ⚠ min-width:0 이 없으면 격자 1fr 칸이 «글자 길이만큼» 벌어져 창 밖으로 밀린다
   (요약이 안 접히는 한 줄이라 더 그렇다 — 폰에서 가로로 넘쳤다) */
.rulehist .rh-x{font-size:11.5px;color:#e7e7e7;min-width:0}
.rulehist .rh-line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 바뀐 조는 아랫줄로 접어 «다 보이게» 한다 — 한 줄에 밀어 넣으면 늘 잘린다 */
.rulehist .rh-arts{display:block;color:var(--sub);font-size:10.5px;line-height:1.45;margin-top:2px;
  white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.rulehist .rh-go{background:none;border:none;color:var(--orange);font-size:10.5px;font-weight:800;
  cursor:pointer;white-space:nowrap;padding:2px 4px}
.rulehist .rh-foot{font-size:10px;color:#4b4b4b;margin-top:5px}
.thumb{width:148px;height:88px;flex-shrink:0;border-radius:5px;background:#e9e9e9;
  display:flex;align-items:center;justify-content:center;color:#666;font-weight:800;font-size:22px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.empty{text-align:center;color:var(--sub);padding:70px 24px;font-size:14px;line-height:1.9}
/* ── 폰 컴팩트: 헤더·행 여백/썸네일/글자 축소 → 화면당 명함 6~7장 → 9~10장 ── */
@media(max-width:760px){
  #appbar{padding:9px 12px 5px}
  /* 「명함첩」(세 글자)에서 「기업정보함」(다섯 글자)으로 바뀌며 43px 이 늘었다 —
     그만큼 이름 자리가 줄어 「권…」이 됐다. 제목을 한 치수 낮춰 되돌려 준다. */
  #appbar .logo, #appbar h1{font-size:19px}
  #tabs .tab{padding:9px 12px;font-size:14.5px}
  #subbar{padding:7px 12px;gap:10px}
  #groupBtn{font-size:14.5px}
  .subact{font-size:12px}
  .row{padding:8px 12px;gap:10px}
  .thumb{width:106px;height:63px;font-size:16px}
  .rowmain .nm{font-size:16.5px}
  .rowmain .l1,.rowmain .l2{font-size:12.5px;margin-top:3px}
  .rowmain .erpmgr{font-size:11.5px;margin-top:3px;padding:1px 6px}
  #fab{width:52px;height:52px;font-size:28px;right:14px;bottom:18px}
}

/* ── 주황 FAB ── */
#fab{position:fixed;right:20px;bottom:26px;width:62px;height:62px;border-radius:50%;
  background:var(--orange);color:#fff;font-size:34px;font-weight:300;line-height:1;
  box-shadow:0 6px 20px rgba(255,111,15,.45);display:flex;align-items:center;justify-content:center;z-index:50}
#fab:active{transform:scale(.94)}

/* ── 모달/시트 공통 ── */
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
  align-items:flex-end;justify-content:center;z-index:100}
.modalbg.open{display:flex}
.modal{background:#1c1c1c;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:18px 18px 30px;border:1px solid #2c2c2c}
@media(min-width:761px){.modalbg{align-items:center}.modal{border-radius:20px}}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mhead b{font-size:17px}
.sheetbtn{display:flex;align-items:center;gap:12px;width:100%;padding:15px 12px;
  font-size:16px;font-weight:600;border-radius:12px;text-align:left}
.sheetbtn:active{background:#262626}
/* ── ☰ 메뉴 — 열여섯 칸이 두 화면 반을 먹고 있었다 ──
   (대표 지시 2026-08-21 「메뉴함 정리가 필요하다 너무 정신없다」)

   ⚠ 접지 «않는다». 바로 어제 「환경설정」 안에 메일을 넣어 두었다가
     「메일 송부함은 없다」는 말씀을 들었다(2026-08-20) — 안 보이면 없는 것이다.
     그래서 칸을 «없애지» 않고 «낮춘다». 열여섯 칸이 그대로 다 있다.
   ⚠ 이 규칙은 #menuM 안에서만 듣는다 — 다른 시트(폴더·가져오기 …)는 칸이
     몇 개뿐이라 낮출 까닭이 없고, 손가락 자리만 좁아진다. */
#menuM .sheetbtn{padding:9px 10px;font-size:14.5px;gap:9px;min-width:0}
#menuM .sheetbtn .msub{margin-left:auto;color:var(--sub);font-size:11.5px;font-weight:600;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:8px}
/* 묶음 이름표 — 여백으로 가르던 것을 가는 줄로 가른다(여백보다 덜 먹고 더 또렷하다) */
#menuM .mgrp{font-size:11px;font-weight:800;color:#9aa6bd;letter-spacing:.02em;
  padding:9px 6px 3px;margin-top:5px;border-top:1px solid #2c2c2c}
/* ⚠ :first-of-type 은 «같은 태그» 중 첫째다 — .mhead 도 div 라 영영 안 맞는다.
     머리 바로 다음 묶음을 집는다(붙은 형제). 안 그러면 머리 밑줄과 겹줄이 진다. */
#menuM>.mhead+.mgrp{border-top:none;margin-top:0;padding-top:2px}
body.pc #menuM .mgrp{border-top-color:#eef1f6}
/* 머리(☰ 메뉴 · ✕)를 붙여 둔다 — 열여섯 칸을 내려가면 닫을 ✕ 가 화면 밖이었다 */
#menuM{padding-top:0}
#menuM>.mhead{position:sticky;top:0;z-index:2;background:#1c1c1c;
  margin:0 -18px 6px;padding:15px 18px 9px;border-bottom:1px solid #2c2c2c}
body.pc #menuM>.mhead{background:#fff;border-bottom-color:#eef1f6}
/* 위험 구역 — 여백만 조인다. 빛깔과 「복구 불가」는 그대로 둔다(겁내야 하는 자리다) */
#menuM .mdanger{border:1px solid #f3c9c9;background:#fff6f6;border-radius:10px;
  padding:7px 9px;margin-top:12px}
#menuM .mdanger .mdtitle{font-size:10.5px;font-weight:800;color:#c0392b;margin-bottom:3px}
#menuM .mdanger .sheetbtn{color:#c0392b;background:#fff}
#menuM .mdanger .msub{color:#c0392b}
/* ── 시트가 떠 있는 동안에는 떠다니는 것들을 치운다 ──
   즐겨찾기 손잡이·백업·복구 알약·「● 최신」이 시트 «위» 에 떠 있어 칸을 덮고 있었다
   (대표 화면 2026-08-21: 「전체 비우기」가 백업·복구 알약에 가려 「…체 비우기」로 보였다).
   덮는 것은 곧 못 누르는 것이다 — 손가락이 알약을 먼저 만난다.
   ⚠ 시트를 닫으면 그대로 돌아온다. 없애는 것이 아니라 비켜 두는 것이다. */
body:has(.modalbg.open) [data-pu-appbar-btn],
body:has(.modalbg.open) #pu-backup-admin-button,
body:has(.modalbg.open) #pu-version-fab{display:none!important}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--bg);color:var(--ink)}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--orange)}
.field textarea{resize:vertical;min-height:56px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.photo-pane{border:1.5px dashed var(--line);border-radius:12px;padding:10px;text-align:center;
  margin-bottom:12px;background:var(--bg)}
.photo-pane img{max-width:100%;max-height:230px;border-radius:8px;cursor:zoom-in;background:#fff}
/* ── 수정창: 사진과 읽어낸 값을 좌우로 놓는다 ──
   위아래로 쌓으면 사진을 보려고 올리고 값을 고치려고 내려야 해서 한 글자씩 대조할 수가 없다.
   넓은 화면에서만 나눈다 — 폰은 가로가 좁아 쌓는 편이 낫다.
   사진 칸은 sticky 로 붙여 둔다. 아래쪽 칸(메모·소재지)을 고칠 때도 사진이 계속 보여야 한다. */
/* ── 수정창을 한 화면에 (대표 지시 2026-08-10: "아래에 안 짤리게") ──
   전에는 창 전체가 함께 스크롤돼서 **저장 단추가 화면 밖으로 밀려 반만 보였다.**
   머리·본문·발은 각각 제 자리를 갖고 **본문만** 스크롤한다. */
#editorM{max-width:1040px;display:flex;flex-direction:column;max-height:94vh;
  padding-bottom:14px;overflow:hidden}
#editorM>.mhead{flex:none}
#editorM>.edit-split{flex:1;min-height:0;overflow-y:auto;padding-right:2px}
#editorM>.mfoot{flex:none;border-top:1px solid #2c2c2c;padding-top:12px;margin-top:12px}
/* 칸을 조금씩 낮춰 열다섯 칸이 한 화면에 들어가게 한다 */
#editorM .field label{font-size:11.5px;margin-bottom:3px}
#editorM .field input,#editorM .field select{padding:7px 10px;font-size:13.5px}
#editorM .field textarea{min-height:44px;padding:7px 10px;font-size:13.5px}
#editorM .fgrid{gap:0 10px}
#editorM .field{margin-bottom:7px}
@media(min-width:900px){
  .edit-split{display:flex;gap:18px;align-items:flex-start}
  .edit-split>.photo-pane{flex:0 0 38%;margin:0;position:sticky;top:0;max-height:100%;overflow-y:auto}
  .edit-split>.edit-fields{flex:1;min-width:0}
  .edit-split .photo-pane img{max-height:none;width:100%}
}
.mfoot{display:flex;gap:8px;margin-top:14px}
.btn{padding:13px;border-radius:12px;font-size:14.5px;font-weight:700;flex:1}
.btn.primary{background:var(--orange);color:#fff}
.btn.ghost{background:#262626;color:var(--ink)}
.btn.danger{background:#3a1a1f;color:var(--red)}

/* ── 상세 ── */
.dphoto{width:100%;border-radius:10px;cursor:zoom-in;margin-bottom:14px;background:#fff}
.dname{font-size:23px;font-weight:800}
.dsub{color:var(--sub);font-size:14px;margin:4px 0 16px}
.actrow{display:flex;gap:8px;margin-bottom:16px}
.actrow a{flex:1;text-align:center;text-decoration:none;background:var(--orange-soft);color:var(--orange);
  font-weight:700;font-size:13px;padding:12px 4px;border-radius:12px}
.actrow a.off{opacity:.3;pointer-events:none}
.dlist{border-top:1px solid var(--line)}
.ditem{display:flex;padding:11px 2px;border-bottom:1px solid #262626;font-size:14.5px;gap:10px}
.ditem .k{width:88px;flex-shrink:0;color:var(--sub);font-size:12.5px;padding-top:2px}
.ditem .v{flex:1;word-break:break-all}
.ditem .v a{color:var(--orange);text-decoration:none}

#zoombg{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;z-index:200;
  align-items:center;justify-content:center;cursor:zoom-out}
#zoombg.open{display:flex}
#zoombg img{max-width:98vw;max-height:96vh;object-fit:contain;background:#fff}

#dropov{position:fixed;inset:0;background:rgba(255,111,15,.12);border:4px dashed var(--orange);
  display:none;z-index:300;align-items:center;justify-content:center;pointer-events:none}
#dropov.open{display:flex}
#dropov .box{background:#1c1c1c;border-radius:16px;padding:26px 34px;font-size:17px;font-weight:800;color:var(--orange)}

#dupbox .btn{width:100%;margin-top:8px}
.selmark{font-size:20px;flex-shrink:0;width:26px;text-align:center}
#selbar{position:fixed;left:0;right:0;bottom:0;display:none;align-items:center;gap:8px;
  background:#1c1c1c;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:60}
#selbar .btn{flex:none;padding:10px 16px}
.row .fav{color:var(--orange);font-size:14px;margin-right:4px}
/* ── 인앱 카메라는 여기 없다 (대표 지시 2026-08-09: "카메라 하나로 통일") ──
   촬영 화면·초점·명함틀 코드가 사진첩(pu-photos.html)과 두 벌이었다. 한쪽만
   고치는 사고가 나고, 여기서 찍은 것은 사진첩을 안 거쳐 자동 분류·업체관리
   보내기를 못 탔다. 이제 ＋ 는 사진첩 카메라를 명함 모드로 부른다. */
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:#2c2c2c;color:#fff;
  font-size:13.5px;padding:12px 19px;border-radius:99px;display:none;z-index:400;max-width:90vw;text-align:center;
  border:1px solid #3a3a3a}
/* ════════════ PC 화면 (밝은 관리자 UI) ════════════ */
body.pc{background:#f3f5f9}
body.pc #appbar,body.pc #tabs,body.pc #subbar,body.pc #searchbar,
body.pc #main,body.pc #fab,body.pc #selbar{display:none!important}
#pcRoot{display:flex;height:100vh;overflow:hidden}
#pcRoot[hidden]{display:none!important}  /* hidden 속성이 display:flex에 눌려 폰에서 PC 레이아웃이 새어 나오던 버그 수정 */
/* 위 여백은 0 이다 — 그 자리는 붙박이 덩어리(.pcside-top)가 제 padding 으로 채운다.
   여기에 위 여백을 두면 붙박이가 그 위를 덮으려고 음수 여백을 써야 하고, 음수 위 여백은
   뒤따르는 줄까지 끌어올려 겹침을 만든다. */
#pcSide{width:240px;flex-shrink:0;background:#1e2a47;color:#dfe6f3;overflow-y:auto;padding:0 14px 18px;transition:width .2s,padding .2s;display:flex;flex-direction:column}
.pcside-bottom{margin-top:auto;padding-top:14px;border-top:1px solid #33457a}
/* 자료함·환경설정이 틈 없이 붙어 있어 오작동으로 이어지기 쉬웠다 — 줄 사이 간격을 둔다 */
.pcside-settings{width:100%;background:#2a3a5e;color:#dfe6f3;border:1px solid #3a4a73;border-radius:9px;
  padding:11px;font-size:14px;font-weight:700;cursor:pointer;text-align:left;margin-bottom:8px}
.pcside-settings:last-child{margin-bottom:0}
.pcside-settings:hover{background:#33457a}
/* ── 환경설정 전용 화면 (팝업 대신 본문) ── */
#pcSettings{padding:2px 2px 40px}
/* ── 메일 화면 (본문 전체) ── */
#pcMail{padding:16px 22px 40px}
/* ── 다음메일 쓰기창과 같은 차림새 ──
   테두리 상자 대신 **밑줄 한 줄**로 칸을 나눈다. 다음메일이 그렇게 생겼고,
   매일 그 화면을 쓰시므로 눈이 이미 익어 있다(대표 지시 2026-08-10). */
.mtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 0 14px;margin-bottom:0}
/* ── 머리줄 붙박이 (대표 지시 2026-08-24 「캡쳐2 상단 고정할 수 있나?」) ──
   본문이 길어지면 [보내기]가 화면 밖 저 위로 사라져, 다 쓰고 나서 맨 위까지
   올라가야 했다. 위에 붙여 둔다.
   ⚠ 배경을 반드시 준다 — 없으면 아래 글자가 비쳐 겹쳐 읽힌다.
   ⚠ z-index 를 준다 — 없으면 본문·자료 서랍이 위로 올라와 단추를 덮는다.
   ⚠ #pcMail 안에서만. 폰(#mmBody)은 화면이 좁아 붙이면 본문이 반으로 줄어든다. */
#pcMail .mtop{position:sticky;top:0;z-index:6;background:#fff;padding:10px 0 12px;
  border-bottom:1px solid #e8ecf3;margin:0 0 2px}
.mtop .cpsendbtn{background:#fff;color:#1e2a47;border:1px solid #1e2a47;border-radius:6px;
  padding:8px 22px;font-size:14px;font-weight:700}
.mtop .cpsendbtn:hover:not(:disabled){background:#eef2f9}
.mtop .cpghost{border:none;background:none;color:#33415e;font-size:14px;padding:8px 6px}
.mtop .cpghost:hover{color:#1d4fc4;background:none;text-decoration:underline}
.mchk{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:#33415e;cursor:pointer}
.mchk.off{opacity:.45;cursor:default}
.mchk input{margin:0}
.mauto{margin-left:auto;font-size:12px;color:#8b98b3}
/* 칸 — 이름표는 왼쪽에 고정폭, 입력은 밑줄만 */
/* 줄간격을 줄여 본문 자리를 넓힌다 (대표 지시 2026-08-10) */
#pcMail .cprow{display:flex;align-items:center;gap:12px;padding:6px 0;
  border-bottom:1px solid #e8ecf3;border-top:none}
#pcMail .cprow:first-child{border-top:1px solid #cfd8e6}
#pcMail .cpk{flex:0 0 74px;font-size:13.5px;color:#33415e;font-weight:500}
#pcMail .cpfold{cursor:pointer}
#pcMail .cpfold i{font-style:normal;color:#8b98b3;margin-left:2px}
#pcMail .cprow input{flex:1;min-width:0;border:none;border-radius:0;padding:5px 2px;
  font-size:13.5px;color:#1b2536;background:none}
#pcMail .cprow input:focus{outline:none;box-shadow:none;border:none}
#pcMail .cpfrom{flex:1;font-size:13.5px;font-weight:700;color:#1b2536}
/* 첨부 — [파일 첨부하기] 단추 + 끌어놓는 넓은 자리 */
.cpattwrap{flex:1;min-width:0}
.cpattbar{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.cpfilebtn{display:inline-block;border:1px solid #b9c4d6;background:#fff;color:#1b2536;
  border-radius:5px;padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
.cpfilebtn:hover{background:#f2f6fc}
.cpattbar .cpsize{margin:0 0 0 auto;text-align:right}
#pcMail .cpattbox{border:1px solid #e8ecf3;border-radius:3px;background:#fff;padding:9px;
  min-height:64px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
#pcMail .cpattbox.over{border-color:#1d4fc4;background:#f4f8ff}
.cpdrophint{width:100%;text-align:center;align-self:center;color:#b0bacb;font-size:13px}
.cpattbar{margin-bottom:5px}
/* 본문 위 편집 도구줄 — 다음메일 에디터 줄과 같은 자리 */
.edbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 2px;
  border-bottom:1px solid #e8ecf3}
.edsel{border:1px solid #dde3ee;border-radius:5px;padding:4px 6px;font-size:12px;
  color:#1b2536;background:#fff;font-family:inherit}
.edsel:focus{outline:none;border-color:#1e2a47}
.edbtn{border:1px solid transparent;background:none;border-radius:5px;padding:4px 9px;
  font-size:12.5px;color:#33415e;cursor:pointer}
.edbtn:hover{background:#eef2f7}
.edbtn.on{background:#e3ebfa;border-color:#b9cdf5;color:#123d92}
.edsep{width:1px;height:16px;background:#e4e8f0;margin:0 3px}
.edsched{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 11px;
  background:#fdf6e8;border:1px solid #eeddb5;border-radius:8px;font-size:12.5px;color:#7a4a12}
.edsched input{border:1px solid #e0d0a8;border-radius:6px;padding:4px 7px;font-size:12px;
  font-family:inherit;background:#fff}
.edsched span{margin-left:auto;cursor:pointer;color:#8b98b3}
.edsched span:hover{color:#c0392b}
/* 본문 — 테두리 없이 넓게, 다음메일 에디터처럼 */
#pcMail .cpbody{border:none;border-bottom:1px solid #e8ecf3;border-radius:0;min-height:340px;
  /* 좌우 14px — 2px 였을 때 한글이 칸 왼쪽 끝에 붙어 읽기 어려웠다(대표 2026-08-24) */
  padding:14px 14px;line-height:1.7}
#pcMail .cpbody:focus{outline:none;border-color:#cfd8e6}
.mwrap{display:flex;gap:0;align-items:stretch}
.mwrap .mmain{flex:1;min-width:0;padding-right:14px}
.mwrap .mdrawer{flex:0 0 var(--drawer,300px);position:sticky;top:10px;align-self:flex-start;
  border:1px solid #dde3ee;border-radius:12px;background:#fbfcfe;padding:11px 12px;margin-left:14px}
.mwrap.nodrawer .mdrawer,.mwrap.nodrawer .mgrip{display:none}
/* 가운데 손잡이 — 끌어서 좌우 넓이를 바꾼다 (대표 지시 2026-08-10) */
.mgrip{flex:0 0 8px;align-self:stretch;cursor:col-resize;position:relative;
  display:flex;align-items:center;justify-content:center}
.mgrip i{display:block;width:2px;height:46px;border-radius:2px;background:#dde3ee}
.mgrip:hover i,.mgrip.on i{background:#1d4fc4;height:70px}
/* 끄는 동안 글자가 잡히면 화면이 파랗게 물든다 */
body.mresizing{user-select:none;cursor:col-resize}
.mdh{font-size:13px;font-weight:700;color:#1b2536;margin-bottom:8px}
.mdlink{font-size:11.5px;color:#1d4fc4;cursor:pointer;margin-top:9px;text-align:right}
.mdlink:hover{text-decoration:underline}
/* 서랍 — 갈래 표시·찾기·자료 줄·미리보기 */
.mdh{display:flex;align-items:center;gap:7px}
.mdcat{font-size:11.5px;font-weight:400;background:#eaf1ff;color:#123d92;border-radius:11px;padding:2px 9px}
.mdcat b{cursor:pointer;color:#8b98b3;margin-left:3px}
.mdcat b:hover{color:#c0392b}
.mdsearch{margin:8px 0}
.mdsearch input{width:100%;border:1px solid #dde3ee;border-radius:8px;padding:6px 9px;font-size:12.5px;
  color:#1b2536;background:#fff;font-family:inherit}
.mdsearch input:focus{outline:none;border-color:#1e2a47}
.mdlist{max-height:300px;overflow:auto;border:1px solid #e4e8f0;border-radius:9px;background:#fff}
/* 갈래 머리 — 접었다 폈다 한다. 자료가 늘어도 필요한 갈래만 펴서 고른다. */
.mdcatg+.mdcatg{border-top:1px solid #e9edf5}
.mdcath{display:flex;align-items:center;gap:6px;padding:7px 9px;cursor:pointer;background:#f7f9fd;font-size:12px;font-weight:800;color:#42506e;user-select:none}
.mdcath:hover{background:#eef3fc}
.mdcath.open{background:#eef3fc}
.mdcath .ar{flex:0 0 auto;color:#8a97b4;font-size:10px}
.mdcath .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mdcath .c{flex:0 0 auto;background:#dde5f3;color:#3b4a6b;border-radius:9px;padding:1px 7px;font-size:11px}
.mdcath .p{flex:0 0 auto;background:#dcfce7;color:#166534;border-radius:9px;padding:1px 7px;font-size:11px}
.mdrow{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid #f1f4f9;font-size:12.5px}
.mdrow:last-child{border-bottom:none}
.mdrow.on{background:#eef4ff}
.mdrow.seen{box-shadow:inset 3px 0 0 #1d4fc4}
.mdrow .ck{flex:none;cursor:pointer;color:#1d4fc4;font-size:14px;line-height:1;padding:2px}
.mdrow .ck:hover{color:#123d92}
.mdrow .n{flex:1;min-width:0;cursor:pointer;color:#1b2536;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mdrow .n:hover{color:#1d4fc4}
.mdrow .n i{font-style:normal;font-size:11px;color:#8b98b3;margin-left:4px}
.mdrow .v{flex:none;cursor:pointer;color:#8b98b3;padding:2px 5px;border-radius:6px}
.mdrow .v:hover,.mdrow .v.on{background:#dde7fb;color:#1b2536}
.mdprev{margin-top:9px;border:1px solid #dde3ee;border-radius:9px;overflow:hidden;background:#fff}
.mdprev .h{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid #eef2f7;
  font-size:12px;font-weight:700;color:#1b2536}
.mdprev .h b{margin-left:auto;cursor:pointer;color:#8b98b3}
.mdprev .h b:hover{color:#c0392b}
.mdprev .b{height:300px;overflow:auto;background:#f7f9fc;display:flex;align-items:center;justify-content:center}
.mdprev iframe{width:100%;height:300px;border:none;background:#fff}
.mdprev img{max-width:100%;max-height:300px;object-fit:contain}
.mdprev .mpmsg{text-align:center;font-size:12px;color:#8b98b3;line-height:1.9;padding:20px 12px}
.mdprev .mptxt{width:100%;height:100%;margin:0;padding:11px;font-size:12px;line-height:1.7;
  color:#1b2536;background:#fff;white-space:pre-wrap;word-break:break-all}
/* 미리보기 아래 — 보고 나서 그 자리에서 담는다 */
.mdprev .f{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid #eef2f7}
.mdprev .f .d{flex:1;min-width:0;font-size:11.5px;color:#8b98b3;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.mdprev .f button{flex:none;border:1px solid #1e2a47;background:#1e2a47;color:#fff;border-radius:7px;
  padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
.mdprev .f button:hover{background:#2a3a5e}
.mdprev .f button.off{background:#fff;color:#c0392b;border-color:#f0c9c4}
.mdprev .f button.off:hover{background:#fdeced}
/* 예약함 — 못 보낸 줄은 눈에 띄게 */
table.sbox tr.bad td{background:#fdf4f4}

/* ── 받은 메일 (2026-08-24) ── */
.ibtools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.ibtools input{border:1px solid var(--line,#E3E5EF);border-radius:8px;padding:6px 9px;font-size:12.5px;font-family:inherit;min-width:170px}

/* ══════════ 다음메일함과 같은 차림 (대표 지시 2026-08-24) ══════════
   "캡쳐2는 다음메일함이다. 메일함을 완벽하게 똑같이 만들어달라."

   목업: docs/mockups/mail-daum-clone.html — 자리·글자크기·색을 거기서 재어 옮겼다.

   ⚠ 클래스 이름은 모두 dm- 으로 시작한다. 명함첩의 이름(.pcitem·.matwrap 등)과 절대
     섞지 않는다 — 섞으면 메일을 고칠 때 명함 목록이 함께 무너진다.
   ⚠ 메일 창일 때만 옆줄이 흰 바탕이 된다(#pcRoot.mailmode). 명함 창의 남색 옆줄은
     그대로 둔다 — 두 창이 서로 다른 것을 다루므로 겉모습도 달라야 어디인지 안다. */
/* ⚠ display:block 으로 되돌리는 것이 요점이다. 명함 옆줄은 flex 세로줄이라(맨 아래
   붙박이를 바닥에 붙이려고) 폴더 줄이 «눌려서» 34px 이 20px 이 되었다 — 칸이 넘치면
   flex 아이템이 줄어들기 때문이다. 다음메일함 옆줄은 그냥 위에서 아래로 흐르고
   넘치면 스크롤되는 것이 맞다. 붙박이도 목록 끝에 이어 붙으면 된다. */
/* ⚠ 여백은 «안쪽 덩어리»(.dm-side)가 갖는다. #pcSide 자체의 여백에 기대면 안 된다 —
   명함 옆줄 쪽 규칙(#pcSide · #pcRoot.sidehidden #pcSide)이 같은 칸을 두고 다투는
   자리라, 어느 날 한쪽이 이겨 여백이 0 이 되면 옆줄 글자가 창 끝에 붙는다.
   실제로 재어 보니 여기 padding 이 먹지 않았다(2026-08-24) — 그래서 안쪽으로 옮겼다. */
#pcRoot.mailmode #pcSide{display:block;background:#fff;color:#1a1a1a;
  padding:0;border-right:1px solid #ececec}
.dm-side{padding:0 8px 14px 16px}
/* 옆줄 맨 위 붙박이 — 폴더를 내려도 로고·내 정보·메일쓰기는 그 자리에 남는다.
   ⚠ 바탕을 반드시 칠한다. 안 칠하면 밑으로 지나가는 폴더 글자가 비쳐 겹쳐 보인다. */
.dm-fix{position:sticky;top:0;z-index:6;background:#fff;padding-bottom:4px}
@media(prefers-color-scheme:dark){ .dm-fix{background:#fff} }
#pcRoot.mailmode #pcSide::-webkit-scrollbar{width:7px}
#pcRoot.mailmode #pcSide::-webkit-scrollbar-thumb{background:#d5d7dc;border-radius:99px}
/* 명함 찾기 칸·「＋ 명함 등록」은 메일 창에서 할 일이 없다 — 캡처1에서 이것들이
   다음메일함에는 없는 줄로 남아 있었다. 로그아웃(#pcTopRight)은 남긴다. */
#pcRoot.mailmode #pcSearchWrap,#pcRoot.mailmode #pcTop>.pcbtn-primary{display:none}
#pcRoot.mailmode #pcTop{padding:8px 24px;border-bottom:1px solid #f0f0f0}
#pcRoot.mailmode #pcMail{padding:0 24px 40px 16px}
/* 맨 아래 붙박이(기업정보함으로·개인 폴더·환경설정) — 메일 창에서는 «작은 글자 줄»로 둔다.
   ⚠ 2026-08-24 대표 화면 "불필요한 것 같은데". 다음메일함에는 없는 줄이라 눈에 걸린다.
     그렇다고 지우면 대표가 메일 창에 «갇힌다» — 기업정보함으로 나갈 길이 여기뿐이고,
     환경설정도 여기뿐이다(검사가 그것을 못 박고 있다). 그래서 없애지 않고 단추 모양만
     벗겨 조용한 글자 줄로 만든다.
   ⚠ 그리는 곳은 pcSideBottomHtml 한 곳뿐이다 — 여기서 모양만 바꾼다. */
#pcRoot.mailmode .pcside-bottom{border-top:1px solid #f0f0f0;margin-top:14px;padding-top:9px;
  display:flex;flex-wrap:wrap;gap:2px 12px}
#pcRoot.mailmode .pcside-settings{width:auto;background:none;border:none;color:#a8abb2;
  font-size:11.5px;padding:2px 0;margin:0;text-align:left;font-weight:400}
#pcRoot.mailmode .pcside-settings:hover{background:none;color:#2563d1;text-decoration:underline}

/* ── 맨 위 로고 ── */
.dm-top{display:flex;align-items:center;gap:8px;padding:14px 2px 10px}
.dm-logo{width:32px;height:32px;border-radius:9px;background:#2563d1;color:#fff;
  display:flex;align-items:center;justify-content:center;font:800 21px/1 Arial,sans-serif;
  letter-spacing:-1px}
.dm-logo-t{font-size:22px;font-weight:700;color:#111;letter-spacing:-1px}
.dm-top .fold{margin-left:auto;background:none;border:none;color:#b6b9c0;cursor:pointer;
  font-size:15px;padding:2px 4px}

/* ── 내 정보 ── */
.dm-me{display:flex;align-items:center;gap:11px;padding:6px 2px 12px}
.dm-face{position:relative;width:46px;height:46px;flex:none}
.dm-face i{display:block;width:46px;height:46px;border-radius:50%;background:#c9ccd2;
  background-image:radial-gradient(circle at 50% 34%,#eceef1 0 34%,transparent 35%),
                  radial-gradient(ellipse at 50% 108%,#eceef1 0 46%,transparent 47%)}
.dm-face b{position:absolute;right:-1px;bottom:-1px;width:17px;height:17px;border-radius:50%;
  background:#2563d1;color:#fff;font:800 10.5px/1 Arial,sans-serif;display:flex;
  align-items:center;justify-content:center;border:2px solid #fff}
.dm-me-n{min-width:0}
.dm-me-n strong{display:block;font-size:14.5px;font-weight:700;color:#111;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-me-n span{display:block;font-size:12px;color:#8c8c8c;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── 안읽음 · 중요 · 첨부 ── */
.dm-cnt{display:flex;text-align:center;padding:0 0 12px}
.dm-cnt a{flex:1;color:#1a1a1a;cursor:pointer;padding:4px 0;border-radius:6px}
.dm-cnt a:hover{background:#f7f8fa}
.dm-cnt a.on{background:#eef3fb}
.dm-cnt em{display:block;font-style:normal;font-size:19px;font-weight:700;line-height:1.15;color:#111}
.dm-cnt i{display:block;font-style:normal;font-size:17px;line-height:1.15;color:#b6b9c0}
.dm-cnt a.on i{color:#2563d1}
.dm-cnt span{display:block;font-size:11.5px;color:#6e6e6e;margin-top:3px}

/* ── 메일쓰기 · 내게쓰기 ── */
.dm-write{display:flex;gap:6px;padding:0 0 14px}
.dm-write button{font-family:inherit;font-size:13.5px;font-weight:700;height:38px;
  border-radius:4px;cursor:pointer;border:1px solid transparent}
.dm-write .a{flex:1.35;background:#2563d1;color:#fff;border-color:#2563d1}
.dm-write .a:hover{background:#1d51ae}
.dm-write .b{flex:1;background:#f2f3f5;color:#333;border-color:#e4e5e9;font-weight:400}
.dm-write .b:hover{background:#e9eaee}

/* ── 폴더 목록 ── */
.dm-f{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px;border-radius:5px;
  font-size:13.5px;color:#2b2b2b;cursor:pointer}
.dm-f:hover{background:#f7f8fa}
.dm-f.on{background:#eef3fb;color:#123a86;font-weight:700}
.dm-f .ic{width:17px;flex:none;text-align:center;font-size:14px;opacity:.85}
.dm-f .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-f .n{flex:none;font-size:12px;color:#8c8c8c;font-weight:400}
.dm-f.on .n{color:#4b6ea8}
/* 안 읽은 통수는 파란 글씨 — 다음메일과 같다. 0 이면 아예 안 그린다. */
.dm-f .nu{flex:none;font-size:12px;color:#2563d1;font-weight:700}
/* 폴더 옆 ⋮ — 이름 바꾸기·하위 폴더·지우기. 평소엔 흐리게, 줄에 손이 가면 진하게 */
/* 끌기 손잡이 — 평소엔 안 보이다 줄에 손이 가면 나온다. 여기를 잡고 위아래로 옮긴다 */
.dm-f .grip{flex:none;color:#c8cbd0;font-size:11px;letter-spacing:-2px;cursor:grab;
  width:10px;visibility:hidden}
.dm-f:hover .grip{visibility:visible}
.dm-f.dropover{outline:2px dashed #7e95d0;outline-offset:-2px}
.dm-f .fmenu{flex:none;color:#c8cbd0;font-size:14px;padding:2px 4px;border-radius:4px;visibility:hidden}
.dm-f:hover .fmenu{visibility:visible}
.dm-f .fmenu:hover{background:#e4e7ec;color:#333}
.dm-f.on .fmenu{visibility:visible;color:#7b9ad4}
.dm-f .pill{flex:none;font-size:10.5px;color:#7a7a7a;background:#f0f1f4;border:1px solid #e4e5e9;
  border-radius:3px;padding:1px 5px;font-weight:400}
.dm-fsec{display:flex;align-items:center;gap:6px;height:36px;padding:0 8px;margin-top:6px;
  font-size:12.5px;color:#6e6e6e;cursor:pointer}
.dm-fsec .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-fsec .tool{font-size:13px;color:#a8abb2;padding:2px 3px;border-radius:4px}
.dm-fsec .tool:hover{background:#eee;color:#555}
.dm-f.sub{padding-left:15px;font-size:13px}
.dm-side-hint{font-size:11.5px;color:#a8abb2;line-height:1.65;padding:6px 9px 2px}

/* ── 푸른 분류 / 다음메일 원본 (대표 지시 2026-08-26) ──
   ⚠ 두 덩어리가 «다른 것»임이 한눈에 보여야 한다. 위는 우리가 나눈 칸(초록),
     아래는 다음에 있는 그대로(회색·자물쇠). 같은 이름의 칸이 두 곳에 나오므로
     색으로 갈라 두지 않으면 어느 쪽을 보고 있는지 모른다. */
.dm-fsec.pu{color:#0f8a5f;font-weight:700}
.dm-fsec.pu .nm::before{content:'●';font-size:8px;vertical-align:2px;margin-right:5px}
.dm-fsec.daum{border-top:1px solid #f0f0f0;margin-top:12px;padding-top:4px;color:#8c8c8c}
.dm-f.ro{color:#7c7f86}
.dm-f.ro .lock{flex:none;font-size:10px;color:#c2c5cb;width:14px;text-align:center}
/* 메일을 끌어다 칸 위에 올렸을 때 */
.dm-f.dropmail{background:#eaf6f1;box-shadow:inset 0 0 0 1px #0f8a5f}
/* 옮긴 메일 옆의 「다음: ○○」 꼬리표 — 다음메일에서는 어디 있나 */
.dm-from{flex:none;font-size:10.5px;color:#5d7a6d;background:#eaf6f1;border:1px solid #cfe6dc;
  border-radius:3px;padding:1px 6px;margin-right:8px;white-space:nowrap}

/* ── 숨겨 둔 칸 되돌리는 자리 (대표 지시 2026-08-26) ──
   ⚠ 되돌릴 길이 없으면 아무도 숨기기를 못 누른다. 숨기기와 «같은 화면»에 둔다. */
.dm-hid{margin:2px 4px 6px;background:#fafbfc;border:1px solid #edeff2;border-radius:8px;padding:5px}
.dm-hid .h{font-size:11px;color:#8c8c8c;padding:4px 6px 6px;line-height:1.5}
.dm-hid .r{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#7c7f86;
  padding:4px 6px;border-radius:5px}
.dm-hid .r:hover{background:#fff}
.dm-hid .r .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-hid .r button{flex:none;font-family:inherit;font-size:11.5px;border:1px solid #d8dbe0;
  background:#fff;color:#444;border-radius:4px;padding:3px 8px;cursor:pointer}
.dm-hid .r button:hover{border-color:#0f8a5f;color:#0f8a5f}
/* ⋮ 창의 갈래마다 «어디까지 가는지» 한 줄 — 안 적으면 다음메일 폴더가 사라진다 */
#folderMenu .fmi small{display:block;color:#a8abb2;font-size:11px;margin-top:2px;line-height:1.4}

/* ⚠ 여기 갈래 단추줄(.dm-tabs)과 톱니바퀴(.dm-gear) 모양이 있었다.
   대표 화면 2026-08-24 로 그 줄을 통째로 없애면서 모양도 함께 지웠다 —
   쓰지 않는 모양을 남기면 다음 사람이 「어디에 쓰이나」를 찾느라 시간을 버린다. */

/* ══════ 도구줄 ══════ */
.dm-tools{display:flex;align-items:center;gap:2px;min-height:38px;flex-wrap:wrap}
.dm-tools .chk{margin:0 10px 0 4px}
.dm-tools button{font-family:inherit;font-size:13px;color:#333;background:none;border:none;
  padding:6px 10px;border-radius:4px;cursor:pointer;white-space:nowrap}
.dm-tools button:hover{background:#f7f8fa}
.dm-tools button[disabled]{color:#c2c4ca;cursor:default}
.dm-tools button[disabled]:hover{background:none}
.dm-tools .sp{flex:1;min-width:10px}
.dm-search{display:flex;align-items:center;gap:6px;height:32px;width:260px;
  border:1px solid #d8d8d8;border-radius:4px;padding:0 10px;background:#fff}
.dm-search i{color:#a8abb2;font-size:13px;font-style:normal}
.dm-search input{flex:1;min-width:0;border:none;outline:none;font-family:inherit;font-size:13px;
  color:#1a1a1a;background:none;padding:0}
.dm-search input:focus{outline:none;box-shadow:none;border:none}
.dm-bar{width:1px;height:14px;background:#dcdde1;margin:0 10px}
/* 몇 통씩 볼까 — 도구줄 오른쪽 끝. 찾기 칸과 같은 높이·테두리로 둔다 */
.dm-size{height:32px;margin-left:8px;border:1px solid #d8d8d8;border-radius:4px;background:#fff;
  font-family:inherit;font-size:13px;color:#333;padding:0 6px;cursor:pointer}
.dm-size:hover{background:#f7f8fa}
.dm-hint{text-align:right;font-size:11.5px;color:#a8abb2;padding:3px 2px 6px}

/* ══════ 목록 ══════ */
.dm-list{border-top:1px solid #d5d7dc}
.dm-row{display:flex;align-items:center;height:41px;border-bottom:1px solid #f1f2f4;
  font-size:13px;color:#1a1a1a;cursor:pointer}
.dm-row:hover{background:#f7f8fa}
.dm-row.pick{background:#f2f6fd}
/* 방향키로 짚어 둔 줄 — 왼쪽에 파란 선 한 줄. 고른 것(pick)과 헷갈리지 않게 다르게 둔다 */
.dm-row.cur{background:#f2f6fd;box-shadow:inset 3px 0 0 #2563d1}
.dm-row .chk{flex:none;width:30px;margin:0 0 0 4px}
.dm-row .st{flex:none;width:26px;text-align:center;color:#c9ccd2;font-size:14px}
.dm-row .st.on{color:#f5a623}
.dm-row .who{flex:none;width:150px;padding-right:12px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.dm-row .clip{flex:none;width:20px;text-align:center;color:#9a9da4;font-size:12px}
.dm-row .sub{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding-right:16px}
.dm-row .box{flex:none;font-size:11px;color:#a8abb2;padding-right:12px;max-width:120px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-row .at{flex:none;width:112px;text-align:right;color:#8c8c8c;font-size:12.5px;
  padding-right:4px;white-space:nowrap}
/* 안 읽은 것은 굵게 — 다음메일과 같다 */
.dm-row.unread .who,.dm-row.unread .sub{font-weight:700}
.dm-none{text-align:center;color:#a8abb2;font-size:13px;padding:52px 10px;line-height:1.8}
.dm-more{display:block;width:100%;margin:12px 0 0;height:36px;background:#fff;border:1px solid #d8d8d8;
  border-radius:4px;font-family:inherit;font-size:13px;color:#333;cursor:pointer}
.dm-more:hover{background:#f7f8fa}
.dm-more[disabled]{color:#c2c4ca;cursor:default}

/* ══════ 메일 한 통 보기 ══════ */
.dm-read{padding-top:4px}
.dm-read .back{background:none;border:none;font-family:inherit;font-size:13px;color:#2563d1;
  cursor:pointer;padding:6px 2px}
/* 읽는 자리 위쪽 단추들 — 답장·전체답장·전달·중요·삭제 */
.dm-read .rbtn{font-family:inherit;font-size:12.5px;color:#333;background:#fff;
  border:1px solid #d8d8d8;border-radius:4px;height:30px;padding:0 11px;cursor:pointer}
.dm-read .rbtn:hover{background:#f2f6fd;border-color:#9db6e3;color:#1a4fa0}
.dm-read h3{margin:6px 0 12px;font-size:18px;font-weight:700;color:#111;line-height:1.45}
.dm-read .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:#6e6e6e;
  border-top:1px solid #ececec;border-bottom:1px solid #ececec;padding:10px 2px}
.dm-read .meta b{color:#333;font-weight:700}
.dm-read .meta .addr{font-style:normal;color:#a8abb2;font-size:11.5px;margin-left:4px}
.dm-read .atts{display:flex;flex-wrap:wrap;gap:7px;padding:11px 2px 0}
.dm-read .atts button{font-family:inherit;font-size:12px;color:#333;background:#f7f8fa;
  border:1px solid #e4e5e9;border-radius:4px;padding:5px 10px;cursor:pointer}
.dm-read .atts button:hover{background:#eef0f4}
.dm-read .body{padding:16px 2px;font-size:13.5px;line-height:1.75;color:#1a1a1a;

.dm-read .body img{max-width:100%;height:auto}
.dm-read .body table{max-width:100%}
.dm-read .wait{color:#8c8c8c;font-size:13px;padding:34px 2px}

/* 좁은 화면(폰) — 보낸이 칸을 줄이고 폴더 이름은 감춘다 */
@media(max-width:760px){
  .dm-row .who{width:96px}
  .dm-row .box{display:none}
  .dm-search{width:100%}
}

/* ══════════ 폰 메일함 — 다음메일 «앱»과 같은 차림 (대표 화면 2026-08-24) ══════════
   "폰에서 화면은 캡쳐2,3 과 똑같이 만들어달라."

   ⚠ 여기만은 PC 것을 그대로 쓰지 않는다. 다음메일은 PC(웹)와 폰(앱)의 차림이 «아예
     다르다» — 폰은 어두운 바탕에 동그란 얼굴딱지 + 세 줄(보낸이·제목·미리보기), 폴더는
     왼쪽에서 밀려 나오는 서랍이다. 한 벌로 만들면 어느 쪽도 닮지 않는다.
   ⚠ 대신 «자료»는 한 벌 그대로 쓴다(mbVisibleRows·mbFolders…). 다른 것은 markup 뿐이라,
     목록 규칙을 고치면 두 화면이 함께 따라온다.
   ⚠ 어두운 바탕이 기본이다(대표 폰이 어두운 차림). 폰이 밝은 차림이면 아래 media 로
     밝게 바뀐다 — 앱도 그렇게 한다. */
.dmm{--bg:#121212;--panel:#1e1e1e;--line:#2b2b2b;--ink:#e8e8e8;--sub:#c2c2c2;
  --dim:#8d8d8d;--blue:#3a7bfd;
  position:fixed;inset:0;z-index:40;background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif}
@media(prefers-color-scheme:light){
  .dmm{--bg:#fff;--panel:#fff;--line:#ececec;--ink:#1a1a1a;--sub:#333;--dim:#8c8c8c}
}
/* ── 맨 위 줄 ── */
.dmm-top{display:flex;align-items:center;gap:4px;height:52px;flex:none;
  padding:0 6px;background:var(--panel);border-bottom:1px solid var(--line)}
.dmm-top b{font-size:17px;font-weight:700;color:var(--ink);padding:0 4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmm-top .sp{flex:1}
.dmm-ic{background:none;border:none;color:var(--ink);font-size:19px;line-height:1;
  width:42px;height:42px;border-radius:50%;cursor:pointer;font-family:inherit}
.dmm-ic:active{background:rgba(255,255,255,.09)}
.dmm-ic.on{color:var(--blue)}
/* 찾기 칸 — 🔍 를 누르면 한 줄이 열린다 */
.dmm-find{display:flex;align-items:center;gap:8px;flex:none;padding:8px 12px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.dmm-find input{flex:1;min-width:0;background:rgba(255,255,255,.07);border:none;
  border-radius:8px;padding:9px 12px;font-size:14.5px;color:var(--ink);font-family:inherit}
@media(prefers-color-scheme:light){ .dmm-find input{background:#f2f3f5} }
.dmm-find input:focus{outline:none}
/* ── 목록 ── */
.dmm-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.dmm-row{display:flex;gap:12px;padding:13px 14px 13px 12px;position:relative;
  border-bottom:1px solid var(--line);cursor:pointer}
.dmm-row:active{background:rgba(255,255,255,.05)}
.dmm-row.pick{background:rgba(58,123,253,.14)}
/* 얼굴딱지 — 보낸이 이름의 첫 글자. 앱은 사진을 쓰지만 우리에게는 사진이 없다. */
.dmm-av{flex:none;width:40px;height:40px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff}
.dmm-tx{flex:1;min-width:0;padding-right:22px}
.dmm-l1{display:flex;align-items:baseline;gap:6px}
.dmm-l1 .who{flex:1;min-width:0;font-size:14.5px;font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmm-l1 .clip{flex:none;color:var(--dim);font-size:12px}
.dmm-l1 .at{flex:none;font-size:12.5px;color:var(--dim)}
.dmm-l2{margin-top:3px;font-size:14px;color:var(--sub);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmm-l3{margin-top:3px;font-size:13px;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 안 읽은 줄은 굵게 — 앱과 같다 */
.dmm-row.unread .dmm-l1 .who,.dmm-row.unread .dmm-l2{font-weight:700;color:var(--ink)}
.dmm-st{position:absolute;right:8px;bottom:12px;color:#5a5a5a;font-size:17px;
  padding:2px 4px}
.dmm-st.on{color:#f5a623}
.dmm-chk{position:absolute;right:10px;top:14px;width:19px;height:19px}
.dmm-none{text-align:center;color:var(--dim);font-size:14px;padding:60px 20px;line-height:1.9}
.dmm-more{display:block;width:calc(100% - 24px);margin:12px;height:40px;background:none;
  border:1px solid var(--line);border-radius:8px;color:var(--sub);font-size:14px;
  font-family:inherit;cursor:pointer}
/* ── 쓰기 단추(동그라미) ── */
.dmm-fab{position:absolute;right:16px;bottom:18px;width:56px;height:56px;border-radius:50%;
  background:var(--blue);color:#fff;border:none;font-size:23px;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:3}
/* ── 왼쪽 서랍 ── */
.dmm-dim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:4;
  opacity:0;pointer-events:none;transition:opacity .18s}
.dmm.open .dmm-dim{opacity:1;pointer-events:auto}
.dmm-drawer{position:absolute;left:0;top:0;bottom:0;width:78%;max-width:330px;z-index:5;
  background:var(--panel);overflow-y:auto;transform:translateX(-101%);
  transition:transform .2s ease;padding-bottom:18px}
.dmm.open .dmm-drawer{transform:none}
.dmm-me{display:flex;align-items:center;gap:12px;padding:18px 16px 14px}
.dmm-me .face{flex:none;width:44px;height:44px;border-radius:50%;background:#f28b82;
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.dmm-me .nm{flex:1;min-width:0;font-size:16px;color:var(--ink);line-height:1.35}
.dmm-me .nm i{display:block;font-style:normal;color:var(--sub);font-size:15px}
.dmm-me .chev{flex:none;color:var(--dim);font-size:15px;padding:6px}
/* 안읽음 · 중요 · 첨부 — 앱은 가로 한 줄이다(PC 는 세로로 쌓는다) */
.dmm-cnt{display:flex;align-items:center;gap:18px;padding:6px 18px 14px;flex-wrap:wrap}
.dmm-cnt a{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub);cursor:pointer}
.dmm-cnt a.on{color:var(--blue)}
.dmm-cnt a b{font-weight:700;color:var(--ink)}
.dmm-f{display:flex;align-items:center;gap:14px;height:48px;padding:0 18px;
  font-size:15px;color:var(--sub);cursor:pointer}
.dmm-f:active{background:rgba(255,255,255,.06)}
.dmm-f.on{color:var(--blue);font-weight:700}
.dmm-f .ic{flex:none;width:20px;text-align:center;font-size:16px;opacity:.9}
.dmm-f .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmm-f .pill{flex:none;font-size:11.5px;color:var(--dim);border:1px solid var(--line);
  border-radius:99px;padding:3px 9px}
.dmm-f .n{flex:none;font-size:13px;color:var(--blue);font-weight:700}
.dmm-f .fmenu{flex:none;color:var(--dim);font-size:16px;padding:4px 6px}
.dmm-sec .tool{font-size:16px;color:var(--dim);padding:2px 8px}
.dmm-sec{display:flex;align-items:center;height:44px;padding:0 18px;margin-top:6px;
  font-size:14px;color:var(--dim);border-top:1px solid var(--line);cursor:pointer}
.dmm-sec .nm{flex:1}
.dmm-hint{font-size:12.5px;color:var(--dim);line-height:1.7;padding:8px 18px}
.dmm-out{display:block;width:100%;text-align:left;background:none;border:none;
  color:var(--dim);font-size:13px;font-family:inherit;padding:9px 18px;cursor:pointer}

/* 보낸 메일함 표 */
table.sbox{width:100%;border-collapse:collapse;font-size:12.5px}
table.sbox th{text-align:left;font-weight:400;color:#5a6885;padding:7px 10px;background:#f7f9fc;
  border-bottom:1px solid #e4e8f0;white-space:nowrap}
table.sbox td{padding:9px 10px;border-bottom:1px solid #eef2f7;vertical-align:top;color:#1b2536}
table.sbox td span.e{display:block;color:#8b98b3;font-size:11.5px;margin-top:2px}
table.sbox td.w{white-space:nowrap;color:#5a6885}
table.sbox td.w span{display:block;color:#8b98b3;font-size:11px}
table.sbox td.b{white-space:nowrap;color:#5a6885}
table.sbox td.a{white-space:nowrap;text-align:right}
table.sbox td.a button{border:1px solid #dde3ee;background:#fff;color:#33415e;border-radius:7px;
  padding:5px 9px;font-size:11.5px;cursor:pointer;margin-left:4px}
table.sbox td.a button:hover{background:#eef2f7}
table.sbox td.none{text-align:center;color:#8b98b3;padding:34px 10px}
/* 줄 사이를 좁힌 표 — 보낸/예약 메일은 한눈에 많이 보여야 한다 (대표 지시 2026-08-15) */
table.sbox.tight th{padding:5px 8px}
table.sbox.tight td{padding:4px 8px;line-height:1.35}
table.sbox.tight td span.e{margin-top:0;font-size:11px;line-height:1.3}
table.sbox.tight td.w span{font-size:10.5px;line-height:1.3}
table.sbox.tight td.a button{padding:3px 8px;font-size:11px}
table.sbox.tight td.none{padding:26px 8px}
/* 메일함 머리줄 — 제목·개수·찾기·단추를 한 줄에 (대표 지시 2026-08-15) */
.mboxbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.mboxbar b{font-size:15px;color:#16223c;white-space:nowrap}
.mboxbar .n{font-size:12px;color:#8b98b3;white-space:nowrap}
.mboxbar .matsearch{flex:1;min-width:170px;margin:0}
.mboxbar .matsearch input{padding:6px 12px;font-size:12.5px}
.mboxbar .mattab{white-space:nowrap}
/* 좁은 화면에서는 위아래로 쌓는다 — 손잡이는 쓸 자리가 없으니 감춘다 */
@media(max-width:1000px){
  .mwrap{flex-direction:column}
  .mwrap .mmain{padding-right:0}
  .mwrap .mdrawer{position:static;width:100%;flex:none;margin-left:0;margin-top:14px}
  .mwrap .mgrip{display:none}
}
/* ── 자료함 화면 ── */
#pcMat{padding:16px 22px 40px;--ink:#1b2536;--sub:#5a6885;--line:#e4e8f0}
.matadd{display:inline-block;background:#1e2a47;color:#fff;border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer}
/* 올리기 자리 — 제목줄 오른쪽 끝에 작게. 예전에는 목록 위 큰 상자였는데
   자료가 몇 개 없어도 화면을 상자가 다 먹었다(대표 지시 2026-08-09). */
.matadd-sm{margin-left:auto;margin-bottom:10px;display:inline-flex;align-items:center;gap:6px;
  border:1.5px dashed #b9cdf5;background:#f4f8ff;color:#1d4fc4;border-radius:10px;
  padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.matadd-sm:hover{background:#eaf1ff;border-color:#8fb0ea}
.matadd-sm.on{background:#dbe8ff;border-style:solid;border-color:#1d4fc4}
/* 순번 — 몇 번째 자료인지. ▲▼ 로 바뀐다. */
.matno{flex:none;min-width:22px;text-align:right;font-size:12.5px;font-weight:700;color:#8b98b3}
/* 목록(왼쪽) + 미리보기(오른쪽). 좁은 화면에서는 위아래로 쌓인다. */
.matwrap{display:flex;gap:14px;align-items:flex-start}
.matwrap .matlist{flex:1;min-width:0}
#matPrev{flex:0 0 42%;max-width:600px;position:sticky;top:10px;border:1px solid #dde3ee;
  border-radius:12px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
#matPrev .mph{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid #edf1f7;
  font-size:13px;font-weight:700;color:#1b2536}
#matPrev .mpx{margin-left:auto;border:none;background:none;color:#8b98b3;font-size:14px;cursor:pointer;
  padding:4px 8px;border-radius:7px}
#matPrev .mpx:hover{background:#eef2f7;color:#1b2536}
#matPrev .mpb{min-height:340px;max-height:74vh;overflow:auto;background:#f7f9fc;
  display:flex;align-items:center;justify-content:center}
#matPrev iframe{width:100%;height:72vh;border:none;background:#fff}
#matPrev img{max-width:100%;max-height:72vh;object-fit:contain}
#matPrev .mpmsg{text-align:center;font-size:12.5px;color:#8b98b3;line-height:1.9;padding:30px 14px}
#matPrev .mptxt{width:100%;height:100%;margin:0;padding:14px;font-size:12.5px;line-height:1.7;
  color:#1b2536;background:#fff;white-space:pre-wrap;word-break:break-all}
/* ── 한글 자료 줄 고치기 ──
   오른쪽 칸에 줄마다 번호를 붙여 늘어놓고 그 자리에서 고친다(대표 지시 2026-08-10).
   번호는 왼쪽 자료함 순번과 다른 것이다 — 저건 몇 번째 자료, 이건 문서 안 몇 번째 줄. */
/* 단추는 늘 보여야 한다 — 서랍(300px)에서는 줄을 조금만 내려도 위로 밀려 사라진다 */
.hebar{display:flex;align-items:center;gap:6px;padding:8px 11px;border-bottom:1px solid #edf1f7;
  background:#fbfcfe;flex-wrap:wrap;flex:none;position:sticky;top:0;z-index:2}
.hebar button{border:1px solid #dde3ee;background:#fff;border-radius:8px;padding:6px 10px;

.hebar button:hover{background:#f2f6fc}
.hebar button.go{background:#1e2a47;border-color:#1e2a47;color:#fff}
.hebar button.go:hover{background:#2a3a5e}

.hebar .sp{flex:1}
.hebar .cnt{font-size:11.5px;color:#8b98b3;font-weight:600}

.helist{width:100%;background:#fff;padding:4px 0 12px}

.herow .no{flex:none;min-width:30px;text-align:right;font-size:11.5px;font-weight:700;color:#8b98b3;
  padding-top:9px;font-variant-numeric:tabular-nums}

.herow textarea{flex:1;min-width:0;border:1px solid transparent;border-radius:7px;padding:7px 9px;

.herow textarea:focus{outline:none;border-color:#1e2a47;background:#fff}
.herow.on textarea{border-color:#e8a33d;background:#fffdf6}
.herow .tag{flex:none;font-size:10.5px;color:#2a7ab0;background:#eaf4fb;border-radius:5px;
  padding:2px 5px;margin-top:9px;white-space:nowrap}
.henote{font-size:11.5px;color:#8b98b3;line-height:1.8;padding:10px 13px;background:#fbfcfe;
  border-top:1px solid #edf1f7;flex:none}
.henote b{color:#c0392b}
.mat-hwp-back{position:fixed;inset:0;z-index:130;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:14px}
.mat-hwp-modal{width:min(1100px,96vw);height:min(860px,92vh);background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;color:#1b2536}
.mat-hwp-head,.mat-hwp-foot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #e4e8f0;flex:none}
.mat-hwp-head b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat-hwp-head button,.mat-hwp-foot button{border:1px solid #dde3ee;background:#fff;color:#1b2536;border-radius:8px;padding:7px 11px;font-weight:700}
.mat-hwp-foot{justify-content:flex-end;border-bottom:0;border-top:1px solid #e4e8f0}
#matHwpBody{flex:1;min-height:0;overflow:auto;background:#e4e8f0;padding:10px}
@media(max-width:760px){.mat-hwp-back{padding:0}.mat-hwp-modal{width:100%;height:94vh;border-radius:12px 12px 0 0;align-self:flex-end}.mat-hwp-head,.mat-hwp-foot{padding:9px 10px}#matHwpBody{padding:6px}}
/* 격자 편집기 — 서식을 원래 표 모양으로 펼쳐 한 화면에서 고친다.
   작은 서랍 칸에서는 표가 접혀 보이지 않아 큰 팝업으로 뺐다(대표 지시 2026-08-10). */
.mged{position:fixed;inset:0;z-index:140;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:18px}
.mged-box{width:min(1240px,97vw);height:min(900px,94vh);background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.mged-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #e5e9f2;font-size:14.5px;font-weight:800;color:#1a2540}
.mged-head .x{margin-left:auto;border:0;background:transparent;font-size:20px;cursor:pointer;color:#64748b;line-height:1}
.mged-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:9px 16px;border-bottom:1px solid #eef1f7;background:#fafbfe}
.mged-bar button{border:1px solid #cbd5e6;background:#fff;border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:#28324a}
.mged-bar button:hover{background:#eef3fc}
.mged-bar button.go{background:#1d4fc4;border-color:#1d4fc4;color:#fff}
.mged-bar button:disabled{opacity:.45;cursor:default}
.mged-bar .cnt{margin-left:auto;font-size:12px;color:#5b6784}

/* 셋으로 늘어나 한 줄이 좁아졌다. 이름과 숫자를 **위아래로 쌓는다** —
   옆으로 붙이면 「사 / 업자」처럼 이름이 두 줄로 접혀 지저분했다(대표 지시 2026-08-10). */
.sidetab3 button{flex-direction:column;gap:3px;padding:9px 2px 8px;font-size:12.5px;line-height:1.2}
.sidetab3 button span{background:none;color:#8fa0c4;padding:0;font-size:15px;font-weight:800;line-height:1.1}
.sidetab3 button.on span{background:none;color:#fff}
