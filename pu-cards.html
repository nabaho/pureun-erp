let _sending = false;
/* ══════ 여러 곳에 한 통씩 — 순수 로직 (테스트 대상) ══════
   대표 지시 2026-08-15(300곳 미만). 서버(functions/mail-bulk.js)가 받는 곳마다
   예약 한 건씩을 담고, 이미 돌고 있는 예약 발송기가 5분마다 20통씩 빼 간다.
   여기서는 **보내기 전에 사람이 알아야 할 숫자**를 만든다. */

/* 보내기 확인창에 적을 것들 — 되돌릴 수 없는 일이라 숫자를 다 보여주고 누르게 한다 */
function bulkSummary(stat, gapSec, matNames){
  const n = (stat && stat.ready) || 0;
  const out = [];
  out.push({ k:'보낼 곳', v: n.toLocaleString()+'곳' });
  const skip = [];
  if(stat && stat.noEmail) skip.push(`이메일 없음 ${stat.noEmail}`);
  if(stat && stat.blocked) skip.push(`수신거부 ${stat.blocked}`);
  if(stat && stat.dup)     skip.push(`중복 ${stat.dup}`);
  if(skip.length) out.push({ k:'빠지는 곳', v: skip.reduce((a,b)=>a+b.replace(/\D+/g,'')*1,0)+`곳 (${skip.join(' · ')})` });
  out.push({ k:'걸리는 시간', v: bulkEta(n, gapSec)+` (${gapSec}초에 한 통씩)` });
  if(matNames && matNames.length) out.push({ k:'첨부', v: matNames.join(' · ') });
  return out;
}
/* 서버(mail-bulk.js etaText)와 **같은 셈**이어야 한다 — 화면과 실제가 다르면 못 믿는다 */
function bulkEta(n, gapSec){
  const min = Math.max(1, Math.round((n * gapSec) / 60));
  if(min < 60) return '약 '+min+'분';
  const h = Math.floor(min/60), m = min%60;
  return '약 '+h+'시간'+(m?' '+m+'분':'');
}
/* 시험 발송에 쓸 한 곳 — 첫 번째 곳으로 «실제로 나갈 모습»을 만든다.
   ⚠ 받는 주소만 나로 바꾸고 글자는 그대로 둔다. 글자까지 바꾸면 시험한 뜻이 없다. */
function bulkTestOne(targets, myAddr){
  const t = (targets||[])[0];
  if(!t || !myAddr) return null;
  return { to: myAddr, name: t.name||'', company: t.company||'', title: t.title||'' };
}
/* ══════ 여러 곳에 한 통씩 — 화면 ══════ */

const BULK_FN_URL = 'https://asia-northeast3-pureun-erp.cloudfunctions.net/sendBulkMail';
const BULK_GAP_SEC = 15;   /* 통 사이 간격 — 서버 기본값과 같게 둔다 */

async function postBulkMail(payload){
  const u = firebase.auth().currentUser;
  if(!u) throw new Error('로그인이 풀렸습니다');
  const token = await u.getIdToken();
  const res = await fetch(BULK_FN_URL, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
    body: JSON.stringify(payload)
  });
  let j=null; try{ j = await res.json(); }catch(_){}
  if(!res.ok || !j || !j.ok) throw new Error((j&&j.error) || ('서버 응답 '+res.status));
  return j;
}

           : '수신거부를 풀었습니다', 6000);
  if(document.body.classList.contains('pc')) openPcDetail(id); else openDetail(id);
}
/* 고른 명함을 한꺼번에 — 회신이 여러 곳에서 오면 하나씩 열기 번거롭다 */
function selNoMail(){
  const ids = Object.keys(state.sel); if(!ids.length) return toast('명함을 먼저 선택하세요');
  if(!confirm(`고른 ${ids.length}개를 수신거부로 표시합니다.\n앞으로 단체 발송에서 빠집니다.`)) return;

  ids.forEach(id=>{ const it=state.items[id]; if(!it||it.noMail) return; it.noMail=true; Store.put(it); n++; });

}

/* ① 시험 발송 — 첫 곳 기준으로 «실제로 나갈 모습»을 나에게 한 통 */

/* 진짜 보내기 */
async function bulkSendAll(){
  if(_sending) return toast('보내는 중입니다 — 잠시만 기다려 주세요', 5000);
  grabCompose();
  const c=_compose; if(!c || !c.bulk) return;
  if(!String(c.subject||'').trim()) return toast('제목을 적어 주세요');
  if(!String(c.body||'').trim()) return toast('본문을 적어 주세요');
  const names = (c.ids||[]).map(id=>(_matMeta[id]||{}).name||'자료');
  const lines = bulkSummary(c.bulkStat, BULK_GAP_SEC, names).map(x=>`· ${x.k} — ${x.v}`).join('\n');
  if(!confirm(`${c.bulk.length.toLocaleString()}곳에 한 통씩 보냅니다.\n\n${lines}\n\n`+
    `천천히 나가는 이유 — 한꺼번에 보내면 다음메일이 막습니다.\n`+
    `창을 닫아도 서버가 계속 보냅니다. 진행은 「⏰ 예약한 메일」에서 보입니다.\n\n진행할까요?`)) return;
  _sending = true; lockSendButtons(true);
  try{
    const r = await postBulkMail({ to:c.bulk, subject:c.subject, body:c.body,
                                   html: c.html || '',   /* 묶음도 서식을 그대로 (대표 지시 2026-08-24) */
                                   matIds:c.ids, spacingSec: BULK_GAP_SEC });
    _compose = null; clearDraft();
    state.mailSent='sched'; render();
    toast(`📨 ${r.n.toLocaleString()}곳에 걸었습니다 (${r.eta}) — 여기서 진행을 볼 수 있습니다`, 12000);
  }catch(e){
    toast('걸지 못했습니다: '+((e&&e.message)||''), 12000);
  }finally{ _sending=false; lockSendButtons(false); }
}

async function sendCompose(){
  if(_sending) return toast('보내는 중입니다 — 잠시만 기다려 주세요', 5000);
  grabCompose();
  const c = _compose; if(!c) return;
  if(c.bulk) return bulkSendAll();      /* 여러 곳에 한 통씩 — 다른 길로 간다 */
  const chk = composeCheck({ to:c.to, subject:c.subject, body:c.body,
                             bytes:attachTotal(c.ids,_matMeta,c.files) });
  if(!chk.ok) return toast(chk.error, 7000);
  /* ── 잘린 것으로 보이는 주소 (대표 화면 2026-08-24) ──
     「babylawyer@hanmail.ne」처럼 끝 글자가 빠진 주소는 형식 검사를 통과하고 나가서
     조용히 되돌아온다. 여기서 한 번 묻는다.
     ⚠ 막지 않는다 — .ne(니제르)·.co(콜롬비아)로 진짜 보낼 일이 있을 수 있다.
     ⚠ 「고치기」를 고르면 받는사람 칸만 바꾸고 «보내지 않는다» — 눈으로 보고 다시 누른다. */
  const sus = suspectList(c.to);
  if(sus.length){
    const lines = sus.map(o=>`  ${o.bad}  →  ${o.want}`).join('\n');
    const fix = confirm(`받는 주소가 «잘린 것»처럼 보입니다.\n\n${lines}\n\n`
      + `[확인] 오른쪽 주소로 고칩니다 (보내지는 않습니다)\n`
      + `[취소] 적힌 그대로 보냅니다`);
    if(fix){
      let to = String(c.to||'');
      sus.forEach(o=>{ to = to.split(o.bad).join(o.want); });
      c.to = to;
      renderMailPage();
      return toast('주소를 고쳤습니다 — 확인하고 다시 [보내기]를 눌러 주세요', 7000);
    }
  }
  _sending = true;
  lockSendButtons(true);
  /* 첨부가 크면 오래 걸린다 — 몇 초째인지 보여 준다. 숫자가 움직이면 멈춘 게 아니라는 걸 안다. */
  const t0 = Date.now();
  const tick = setInterval(()=>{
    const s = Math.round((Date.now()-t0)/1000);
    document.querySelectorAll('.cpsendbtn, .sm-send').forEach(b=>{
      if(b.dataset.send!=='1') return;
      b.textContent = `보내는 중… ${s}초`;
    });
  }, 1000);
  try{
    const r = await postAutoMail({
      cardId: c.cardId, to: c.to, cc: c.cc, bcc: c.bcc || '',
      toMe: !!c.toMe, oneByOne: !!c.oneByOne,
      scheduleAt: c.sendAt || 0,        /* 0 이면 지금 보낸다 */
      subject: c.subject, body: c.body, html: c.html || '',   /* 서식 몫 (대표 지시 2026-08-24) */
      matIds: c.ids, set: _sendMatSetName || '',
      /* 보낸 메일함에 '누구에게'를 사람 이름으로 보이게 — 주소만 남으면 알아보기 어렵다 */
      toName: (state.items[c.cardId]||{}).name || (state.items[c.cardId]||{}).company || '',
      files: (c.files||[]).map(f=>({ name:f.name, dataUrl:f.dataUrl }))
    });
    const cardId = c.cardId, wasMail = (state.view==='mail');
    const lost = (c.files||[]).length;
    _compose = null;
    clearDraft();          /* 나갔으니 쓰다 만 글은 지운다 — 안 지우면 다음에 또 뜬다 */
    if(r.scheduled){
      toast(`⏰ ${esc(fmtWhen(r.at))} 에 보내도록 맡겼습니다 — 창을 닫아도 나갑니다`
        + (lost?`\n⚠ 💻 내 PC 파일 ${lost}개는 예약에 담기지 않습니다 — 그때 직접 붙여 보내세요`:''),
        lost?12000:8000);
      if(wasMail) openSchedBox(); else closeSendMat();
      return;
    }
    toast(`✉️ 보냈습니다 — ${esc(r.from||'회사 메일')} 에서 ${esc(c.to)} 로`
      + (r.files?` (첨부 ${r.files}개)`:'')
      + (r.missing?`\n⚠ 파일을 못 찾은 자료 ${r.missing}개는 빠졌습니다`:''), r.missing?12000:8000);
    /* 보낸 뒤에는 보낸 메일함을 보여 준다 — 방금 것이 실제로 남았는지 그 자리에서 확인된다 */
    if(wasMail) openSentBox(); else closeSendMat();
    /* 명함 없이 쓴 메일(cardId 없음)은 명함 기록이 없다 — 기록은 명함에 붙는다 */
    if(cardId) loadSendLog(cardId, ()=>{ const box=$('dSendLog'); if(box) box.innerHTML = sendLogHtml(cardId); });
  }catch(e){
    /* ⚠ 화면을 닫지 않는다. 쓴 글이 그대로 남아 있어야 고쳐서 다시 보낼 수 있다. */
    alert('보내지 못했습니다.\n\n' + ((e&&e.message)||'알 수 없는 오류'));
  }finally{
    clearInterval(tick);
    _sending = false;
    lockSendButtons(false);
  }
}
/* 보내는 동안 [보내기] 단추를 잠근다. 두 곳(위·아래)에 있으므로 둘 다. */
function lockSendButtons(on){
  document.querySelectorAll('.cpsendbtn, .sm-send').forEach(b=>{
    if(!/보내기|보내는 중/.test(b.textContent||'')) return;
    if(on){ b.dataset.send='1'; b.dataset.label=b.textContent; b.disabled=true; b.textContent='보내는 중… 0초'; }
    else if(b.dataset.send==='1'){ b.disabled=false; b.textContent=b.dataset.label||'보내기'; delete b.dataset.send; }
  });
}
/* 고른 자료를 내려받고, 받는사람·제목·본문이 채워진 메일창을 연다.
   자료 파일은 데이터베이스 안에 통째로 들어 있어 인터넷 주소가 없다 —
   그래서 링크를 걸 수 없고, 파일을 내려받아 손으로 붙이는 것이 지금 할 수 있는 최선이다.
   (발송 서버를 켜면 이 함수만 바꾸면 되고, 고르는 화면은 그대로 쓴다.) */
async function doSendMaterials(){
  const ids = [...document.querySelectorAll('#sendMatSheet .sm-chk:checked')].map(c=>c.dataset.id);
  if(!ids.length){ toast('보낼 자료를 하나 이상 선택하세요'); return; }
  const it = state.items[_sendMatId]; if(!it) return;
  const email = normEmail(it.email);
  if(!email){ toast('이 명함에 이메일이 없습니다'); return; }

  const nm = it.name || it.company || '';
  const lines = ids.map(id=>{ const m=_matMeta[id]||{};
    return '· ' + (m.name||'자료') + (m.desc ? ' — ' + m.desc : ''); }).join('\n');
  /* 제목·본문은 자료함 → ✉️ 메일 본문에서 고친 글을 쓴다.
     고른 자료가 한 갈래뿐이면 그 갈래 전용 글이 있으면 그것을 쓴다. */
  const tpl = pickMailTpl(matMailCfg(), ids.map(id=>matCat(_matMeta[id])));
  const vals = { 받는분: nm, 회사명: it.company||'', 자료목록: lines, 오늘: fmtDate(Date.now()) };
  const subject = mailFill(tpl.subject || MAIL_TPL_DEFAULT.subject, vals);
  const body    = mailFill(tpl.body    || MAIL_TPL_DEFAULT.body,    vals);
  /* ① 자동 발송이 켜져 있으면 서버가 회사 다음메일로 대신 보낸다 (첨부까지) */
  if(mailModeOf(matMailCfg()) === 'auto'){
    const cardId = _sendMatId, setName = _sendMatSetName;
    toast('회사 메일로 보내는 중…', 30000);
    try{
      const r = await postAutoMail({ cardId, to: email, subject, body, matIds: ids, set: setName });
      closeSendMat();
      toast(`✉️ 보냈습니다 — ${esc(r.from||'회사 메일')}에서 ${email} 로`
        + (r.files?` (첨부 ${r.files}개)`:'')
        + (r.missing?`\n⚠ 파일을 못 찾은 자료 ${r.missing}개는 빠졌습니다`:''), r.missing?12000:8000);
      /* 기록은 서버가 남겼다 — 화면은 다시 읽기만 한다 */
      loadSendLog(cardId, ()=>{ const box=$('dSendLog'); if(box) box.innerHTML = sendLogHtml(cardId); });
      return;
    }catch(e){
      /* ⚠ 여기서 멈추지 않는다. 자동 발송이 막혔다고 보내기 자체가 막히면
         일이 멈춘다 — 예전 방법(메일창 + 손으로 첨부)으로 이어서 간다. */
      toast('자동 발송이 안 돼 메일창으로 엽니다 — ' + ((e&&e.message)||'알 수 없음'), 10000);
    }
  }

  /* ② 예전 방법 — 자료를 내려받고 메일창을 연다. 첨부는 손으로 붙인다. */
  toast(`자료 ${ids.length}개를 내려받는 중…`, 20000);
  let got = 0;
  for(const id of ids){
    const m=_matMeta[id]; if(!m) continue;
    try{ await downloadMaterial(id); got++; }
    catch(e){ console.warn('[자료 내려받기]', id, e&&e.message); }
  }
  if(!got){ toast('자료를 내려받지 못했습니다 — 자료함에서 파일을 다시 올려주세요', 7000); return; }
  /* 보낸 기록을 **메일창을 열기 전에** 남긴다 — location.href 로 넘어간 뒤에는
     이 화면이 멈출 수 있어 기록이 빠진다. (대표 결정: 내려받기 누를 때 바로 남긴다) */
  logSentMaterials(_sendMatId, ids, email);
  /* 파일은 자동으로 붙지 않는다 — 메일창이 열리면 내려받은 파일을 끌어다 놓아야 한다 */
  location.href = `mailto:${encodeURIComponent(email)}`
    + `?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  closeSendMat();
  toast(`📥 자료 ${got}개를 내려받았습니다.\n메일창에 그 파일들을 끌어다 붙이고 보내세요`, 12000);
}
/* 서버에 보내 달라고 부른다.
   ⚠ 첨부 파일을 실어 보내지 않는다 — 자료 번호만 준다. 파일은 이미 실시간DB 에
     있으므로 서버가 직접 읽는 것이 빠르고, 도중에 끊겨 절반만 가는 일이 없다. */
async function postAutoMail(payload){
  const u = firebase.auth().currentUser;
  if(!u) throw new Error('로그인이 풀렸습니다');
  const token = await u.getIdToken();
  const res = await fetch(MAIL_FN_URL, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
    body: JSON.stringify(payload)
  });
  let j = null;
  try{ j = await res.json(); }catch(_){}
  if(!res.ok || !j || !j.ok) throw new Error((j&&j.error) || ('서버 응답 '+res.status));
  return j;
}
/* ── 보낸 기록 ──
   '이 업체에 제안서 보냈던가'에 답하려고 남긴다. 전 직원이 본다 (대표 결정) —
   담당자가 바뀌거나 자리를 비워도 이어받을 수 있어야 한다.

   ⚠ 개인 폴더 명함은 남기지 않는다. 기록 자리(pucards/sendLog)는 직원 누구나
     읽으므로, 남기는 순간 그 명함 번호가 드러난다. */
function logSentMaterials(cardId, ids, to){
  try{
    if(Store.mode!=='firebase' || !cardId) return;
    if((state.priv.items||{})[cardId]) return;
    const rec = sendLogRec({
      at: Date.now(),
      by: myEmail || '',
      to: to || '',
      names: ids.map(id=>(_matMeta[id]||{}).name || '자료'),
      set: _sendMatSetName || ''
    });
    firebase.database().ref(`${DB_ROOT}/sendLog/${cardId}`).push(rec)
      .then(()=>{ (state.sendLog[cardId] = state.sendLog[cardId] || {})['t'+rec.at] = rec; })
      .catch(e=>console.warn('[보낸 기록]', e&&e.message));
  }catch(_){}
}
/* 한 명함의 보낸 기록을 읽어 상세 화면에 채운다 — 명함을 열 때만 읽는다
   (6천 장 기록을 늘 들고 있을 이유가 없다) */
function loadSendLog(cardId, cb){
  if(Store.mode!=='firebase') { if(cb) cb(); return; }
  firebase.database().ref(`${DB_ROOT}/sendLog/${cardId}`).once('value')
    .then(s=>{ state.sendLog[cardId] = s.val() || {}; if(cb) cb(); })
    .catch(()=>{ if(cb) cb(); });
}
function sendLogHtml(cardId){
  const rows = sendLogList(state.sendLog[cardId], 5);
  if(!rows.length) return '';
  return `<div class="sendlog">
    <div class="slh">📤 보낸 자료 <span>${sendLogList(state.sendLog[cardId]).length}회</span></div>
    ${rows.map((r,i)=>`<div class="slrow ${i?'':'on'}">
      <div class="sld">${fmtDate(r.at)}${r.by?' · '+esc(String(r.by).split('@')[0]):''}</div>
      <div class="sln">${r.set?`<b>📦 ${esc(r.set)}</b> — `:''}${esc((r.names||[]).join(' · ')||'자료')}</div>
    </div>`).join('')}</div>`;
}
/* 자료 한 개를 파일로 내려받는다 (미리보기와 같은 방식으로 데이터를 되살린다) */
async function downloadMaterial(id){
  const m=_matMeta[id]; if(!m) throw new Error('자료 정보 없음');
  if(m.url){ window.open(m.url,'_blank'); return; }   /* 예전 Storage 방식 호환 */
  const arr = await matBytes(id);
  const t = matType(m.fileName) || {mime:'application/octet-stream'};
  const blob = new Blob([arr], {type:t.mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = m.fileName || ((m.name||'자료')+'.dat');
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* ══════ 자료함 — 본문 전용 화면 ══════
   팝업이 좁아 이름을 prompt 로만 받을 수 있었고 설명은 아예 넣을 곳이 없었다.
   환경설정과 같은 방식으로 본문 전체를 쓴다. */
function setMatCat(c){ state.matCat = c || 'all'; renderMatPage(); }

/* ── 제안서 틀 ── */
let _tplBody = null;                     /* 아직 안 읽었으면 null */
function loadTpl(cb){
  if(Store.mode!=='firebase'){ if(_tplBody===null) _tplBody=TPL_DEFAULT; if(cb) cb(); return; }
  firebase.database().ref(DB_ROOT+'/config/proposalTpl').once('value')
    .then(s=>{ _tplBody = (s.val()==null ? TPL_DEFAULT : String(s.val())); if(cb) cb(); })
    .catch(()=>{ _tplBody = TPL_DEFAULT; if(cb) cb(); });
}
function saveTpl(v){
  _tplBody = String(v==null?'':v);
  if(Store.mode!=='firebase') return toast('클라우드에 연결된 상태에서만 저장됩니다');
  firebase.database().ref(DB_ROOT+'/config/proposalTpl').set(_tplBody)
    .then(()=>{ toast('제안서 틀을 저장했습니다'); renderMatPage(); })
    .catch(e=>toast('저장 실패: '+((e&&e.message)||'')));
}
function resetTpl(){
  if(!confirm('제안서 틀을 처음 모습으로 되돌립니다.\n지금 적어 두신 내용은 사라집니다.\n\n진행할까요?')) return;
  saveTpl(TPL_DEFAULT);
}
function tplEditorHtml(){

      만들어지는 문서는 글·표 중심의 한글 파일입니다 — 로고·색상은 들어가지 않습니다.</p>
    <div style="font-size:12px;color:#5a6885;margin-bottom:8px">

/* 명함 하나를 골라 제안서를 만든다 — 칸을 채우고 한글 파일로 내려받는다 */
function openProposal(cardId){
  const it = state.items[cardId] || (state.priv.items||{})[cardId]; if(!it) return;
  loadTpl(()=>{
    const body = (_tplBody===null ? TPL_DEFAULT : _tplBody);
    const fs = tplFields(body);
    if(!fs.length) return toast('틀에 채울 칸이 없습니다 — 자료함 → 제안서 틀에서 {회사명} 처럼 적어 주세요', 8000);
    const d=new Date();
    const today = `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`;
    const auto = { '회사명': it.company||'', '받는분': it.name||'', '날짜': today, '담당자': '' };
    const rows = fs.map(f=>`<div class="field"><label>${esc(f)}</label>
        <input id="tpf_${esc(f)}" value="${esc(auto[f]||'')}" placeholder="${esc(f)}"></div>`).join('');
    _propCardId = cardId;
    showPanel(`<div class="mhead"><b>📝 제안서 만들기</b>${_closeBtn()}</div>
      <p style="font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:10px">
        받는 곳 · <b>${esc(it.company||it.name||'')}</b><br>
        빈 칸으로 두면 그 자리는 <b>비워진 채로</b> 만들어집니다.</p>
      ${rows}
      <button class="btn primary" style="width:100%;margin-top:8px" onclick="makeProposal()">📄 한글문서 만들기</button>
      <p style="font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:8px">
        글·표 중심의 한글(hwpx) 파일이 내려받아집니다. 한글에서 열어 다듬은 뒤 보내세요.</p>`);
  });
}
let _propCardId = null;
function makeProposal(){
  const it = state.items[_propCardId] || (state.priv.items||{})[_propCardId]; if(!it) return;
  if(typeof HWPX==='undefined'||typeof HWPXDOC==='undefined') return toast('한글 문서 도구를 불러오지 못했습니다 — 새로고침 후 다시 시도하세요', 7000);
  const body = (_tplBody===null ? TPL_DEFAULT : _tplBody);
  const vals = {};
  tplFields(body).forEach(f=>{ const el=$('tpf_'+f); vals[f] = el ? el.value.trim() : ''; });
  const text = tplFill(body, vals);
  try{
    /* 줄의 성격을 가려 앉힌다 — 제목은 가운데, 제N조·①·1.·가. 는 단계별 들여쓰기,
       날짜는 가운데, 「(인)」 줄은 오른쪽. 앞의 세 줄만 굵게 하던 방식은
       본문이 길어지면 조·항 구분이 사라져 한글에서 다시 손봐야 했다. */
    const doc = HWPXDOC.begin('plain');
    const xml = HWPXDOC.fromText(text, doc);
    const who = (vals['회사명'] || it.company || it.name || '고객').replace(/[\\/:*?"<>|]/g,'');
    const d=new Date();
    const ymd = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    HWPX.download([{body:xml, landscape:false, margin:doc.margin}], `제안서_${who}_${ymd}.hwpx`);
    toast('📄 한글문서를 내려받았습니다 — 한글에서 열어 확인하세요', 8000);
    try{ dedupBg.classList.remove('open'); }catch(_){}
  }catch(e){
    toast('문서를 만들지 못했습니다: '+((e&&e.message)||'알 수 없음'), 8000);
  }
}
/* 자료함에 들어오기 전 어디에 있었는지. 「← 목록으로」가 왔던 곳으로 돌려보내야 한다 —

        <div class="matf">

    : (state.matQ

  const prevMeta = state.matPrevId ? _matMeta[state.matPrevId] : null;
  /* 제목줄에 **몇 번째 자료**인지 붙인다 — 왼쪽 목록의 순번과 눈으로 맞춘다 */
  const prevNo = prevMeta ? (list.findIndex(m=>m.id===state.matPrevId)+1) : 0;
  const panel = `<div id="matPrev">
      <div class="mph">${prevMeta
        ? `${prevNo?`<span class="matno">${prevNo}</span>`:''}${matIcon(prevMeta.fileName)} ${esc(prevMeta.name||'자료')}`
        : '👁 미리보기'}
        ${prevMeta?`<button class="mpx" onclick="closeMatPreview()" title="닫기">✕</button>`:''}</div>
      <div class="mpb" id="mpBody">${prevMeta ? '' : '<div class="mpmsg">왼쪽 목록에서 <b>👁 보기</b>를 누르면<br>여기에 내용이 나옵니다</div>'}</div>
    </div>`;
  el.innerHTML = matPageShell(tabs, `

  initMatDrop();

  /* 글자를 치면 화면을 다시 그리므로 커서가 끝으로 간다 — 끝에 두는 것이 맞다(계속 이어 친다) */

/* [보기] — 오른쪽 칸에 내용을 채운다.
   한글 자료를 고치던 중이면 먼저 물어본다(heLeaveOk). */
function previewMat(id){
  if(_he && _he.id!==id && !heLeaveOk()) return;
  state.matPrevId=id; renderMatPage();
}
/* 미리보기 닫기 — 들고 있던 한글 문서도 함께 놓는다 */
function closeMatPreview(){

  state.matPrevId=''; renderMatPage();
}
/* 내용 채우기 — 한 번 읽은 자료는 다시 읽지 않는다.
   ⚠ 찾기칸에 글자를 칠 때마다 화면을 다시 그리는데, 그때마다 2MB 씩 다시
     내려받으면 타자마다 통신이 나간다. 마지막 자료의 결과를 들고 있다가 재사용. */
let _mpFor=null, _mpHtml='', _mpUrl=null;
let _matHwpCurrent=null;
function closeMaterialHwp(){ const el=$('matHwpBack'); if(el) el.remove(); _matHwpCurrent=null; }
function downloadMaterialOriginal(){
  if(!_matHwpCurrent) return;
  PureunHwp.download(_matHwpCurrent.bytes,_matHwpCurrent.name);
}
async function openMaterialHwp(bytes,name){
  try{ PureunHwp.validate(bytes,name); }
  catch(e){ toast('한글 파일 확인 실패: '+((e&&e.message)||''),7000); return; }
  closeMaterialHwp();
  _matHwpCurrent={bytes:bytes,name:name};
  const back=document.createElement('div'); back.id='matHwpBack'; back.className='mat-hwp-back';
  back.innerHTML='<div class="mat-hwp-modal" role="dialog" aria-modal="true"><div class="mat-hwp-head"><b></b><button type="button" onclick="closeMaterialHwp()">✕</button></div><div id="matHwpBody">미리보기를 준비하는 중…</div><div class="mat-hwp-foot"><button type="button" onclick="downloadMaterialOriginal()">📥 원본 저장</button><button type="button" onclick="closeMaterialHwp()">닫기</button></div></div>';
  back.querySelector('b').textContent='📕 '+name;
  back.onclick=function(e){if(e.target===back) closeMaterialHwp();};
  document.body.appendChild(back);
  try{ await PureunHwp.renderPreview($('matHwpBody'),bytes,name); }
  catch(e){ $('matHwpBody').innerHTML='<div class="mpmsg">미리보기를 만들지 못했습니다.<br>원본은 그대로 보관되어 있습니다.<br>아래 원본 저장을 이용해 주세요.</div>'; }
}
async function fillMatPreview(id){
  const box=$('mpBody'); if(!box) return;
  /* 한글 자료를 열어 두었으면 다시 받지 않는다 — 고치던 글이 날아가면 안 된다.
     찾기칸에 글자를 칠 때마다 화면을 다시 그리므로 이 갈래가 꼭 있어야 한다. */
  if(_he && _he.id===id){ heRender(); return; }
  /* 한글 화면이 켜 두었던 위→아래 채우기를 되돌린다 — 그림·PDF 는 가운데 맞춤이다 */
  box.style.display=''; box.style.alignItems='';
  if(_mpFor===id && _mpHtml){ box.innerHTML=_mpHtml; return; }
  const m=_matMeta[id];
  if(!m){ box.innerHTML='<div class="mpmsg">자료가 없습니다 (지워졌을 수 있습니다)</div>'; return; }
  const t=matType(m.fileName)||{};
  const dl=`<button class="mattab" style="margin-top:10px" onclick="downloadMaterial('${id}')">📥 내려받아 확인</button>`;
  if(m.url){ _mpFor=id; _mpHtml=`<iframe src="${esc(m.url)}"></iframe>`; box.innerHTML=_mpHtml; return; }
  if(!t.view && !/^(hwp|hwpx)$/.test(matExt(m.fileName))){
    _mpFor=id;
    _mpHtml=`<div class="mpmsg">📎 ${esc(m.fileName||'')}<br>이 형식은 브라우저로 미리 볼 수 없습니다.<br>${dl}</div>`;
    box.innerHTML=_mpHtml; return;
  }
  box.innerHTML='<div class="mpmsg">불러오는 중…</div>';
  try{
    const arr = await matBytes(id);
    if(state.matPrevId!==id) return;              /* 기다리는 사이 다른 것을 눌렀다 */
    if(_mpUrl){ try{URL.revokeObjectURL(_mpUrl)}catch(_){} _mpUrl=null; }
    if(/^(hwp|hwpx)$/.test(matExt(m.fileName))){
      /* 한글 자료는 오른쪽 칸에서 바로 보고 고친다 — 팝업으로 띄우지 않는다.
         담아 두기(_mpHtml)를 쓰지 않는다: 문서를 들고 있어야 고친 것이 살아 있다. */
      _mpFor=null; _mpHtml='';
      await heOpen(id, arr, m.fileName||m.name||'한글자료.hwp');
      return;
    }
    if((t.mime||'')==='text/plain'){
      _mpHtml=`<pre class="mptxt">${esc(new TextDecoder('utf-8').decode(arr).slice(0,20000))}</pre>`;
    }else{
      _mpUrl=URL.createObjectURL(new Blob([arr],{type:t.mime||'application/octet-stream'}));
      _mpHtml=(t.mime||'').startsWith('image/') ? `<img src="${_mpUrl}">` : `<iframe src="${_mpUrl}"></iframe>`;
    }
    _mpFor=id; box.innerHTML=_mpHtml;
  }catch(e){
    if(state.matPrevId!==id) return;   /* 기다리는 사이 다른 것을 눌렀다 — 남의 화면을 덮지 않는다 */
    box.innerHTML='<div class="mpmsg">읽지 못했습니다 — '+esc((e&&e.message)||'')+'</div>';
  }
}

/* ══════ 한글 자료(hwp·hwpx) — 오른쪽 칸에서 보고 고치기 ══════
   제안서·계약서를 내려받아 한글로 열고 다시 올리는 세 걸음이 번거로웠다.
   오른쪽 칸에서 줄마다 번호를 붙여 보여주고 그 자리에서 고친다(대표 지시 2026-08-10).

   ⚠ 글자만 바꾼다. 있는 문서 위에 글자를 갈아 넣고 다시 저장하므로 글꼴·표·도장
     자리는 그대로다. 줄을 새로 만들거나 표 칸을 늘리는 일은 한글에서 해야 한다.
   ⚠ 문서(_he.doc)는 WASM 쪽 기억을 쓴다. 다른 자료로 옮길 때 반드시 free() 한다.
     안 비우면 여러 개 열어 볼수록 브라우저가 무거워진다. */
let _he = null;   /* {id,name,bytes,doc,rows,edited,mode:'view'|'edit',busy} */

function heDirty(){
  return !!(_he && _he.mode==='edit' && PuHwpEdit.changedRows(_he.rows, _he.edited).length);
}
function heClose(){
  if(!_he) return;
  try{ if(_he.doc && _he.doc.free) _he.doc.free(); }catch(_){}
  _he=null;
}
/* 다른 자료로 옮기기 전에 물어본다 — 고친 것을 말없이 버리면 안 된다 */
function heLeaveOk(){
  if(!heDirty()) { heClose(); return true; }
  if(!confirm('고친 내용을 아직 저장하지 않았습니다.\n버리고 다른 자료를 볼까요?')) return false;
  heClose(); return true;
}

async function heOpen(id, bytes, name){
  const box=$('mpBody'); if(!box) return;
  heClose();
  box.innerHTML='<div class="mpmsg">📕 한글 문서를 여는 중…<br><span style="font-size:11.5px">처음 한 번은 조금 걸립니다</span></div>';
  try{
    const doc = await PureunHwp.openDoc(bytes, name);
    if(state.matPrevId!==id){ try{doc.free()}catch(_){} return; }   /* 기다리는 사이 다른 것을 눌렀다 */
    _he={id:id, name:name, bytes:bytes, doc:doc, rows:[], edited:{}, mode:'view', busy:false};
    /* 열면 곧바로 **번호 붙은 줄**을 보여준다 — 보고 고치는 것이 이 화면의 목적이다.
       글을 못 뽑는 문서(그림만 있는 것)면 원래 모습으로 물러난다. */
    try{ _he.rows = PuHwpEdit.readRows(doc); }catch(_){ _he.rows=[]; }
    if(_he.rows.length) _he.mode='edit';
    heRender();
  }catch(e){
    box.innerHTML='<div class="mpmsg">📕 '+esc(name)+'<br>한글 문서를 열지 못했습니다 — '+esc((e&&e.message)||'')+
      '<br><button class="mattab" style="margin-top:10px" onclick="downloadMaterial(\''+id+'\')">📥 내려받아 확인</button></div>';
  }
}

function heRender(){
  const box=$('mpBody'); if(!box || !_he) return;
  /* 미리보기 칸은 가운데 맞춤이다 — 여기서는 위에서 아래로 채워야 한다 */
  box.style.display='block'; box.style.alignItems='stretch';
  const edit = _he.mode==='edit';
  const chn = edit ? PuHwpEdit.changedRows(_he.rows,_he.edited).length : 0;
  box.innerHTML =
    `<div class="hebar">
      ${edit
        ? `<button onclick="heToView()">👁 원래 모습</button>
           <button onclick="heBig()">⤢ 크게</button>
           <button class="go" id="heSaveB" onclick="heSave()" ${chn?'':'disabled'}>💾 자료함에 저장</button>
           <button id="heDownB" onclick="heDownload()" ${chn?'':'disabled'}>📥 내려받기</button>
           <span class="sp"></span>
           <span class="cnt" id="heCnt">${chn?`고친 줄 <b>${chn}</b>개`:'고친 줄 없음'}</span>`
        : `<button class="go" onclick="heToEdit()">✏ 글 고치기</button>
           <button onclick="heBig()">⤢ 크게 보기</button>
           <button onclick="downloadMaterial('${_he.id}')">📥 원본 저장</button>`}
    </div>
    <div id="heBody"></div>
    ${edit ? `<div class="henote">번호는 <b>문서 안 줄 번호</b>입니다. 고칠 줄만 눌러 고치세요 —
       손대지 않은 줄은 건드리지 않습니다.<br>
       글꼴·표 모양은 그대로 남습니다. <b>줄을 새로 만들거나 표 칸을 늘리는 것은 한글에서</b> 해야 합니다.</div>` : ''}`;
  if(edit) heRenderRows(); else heRenderPages();
}

/* 원래 모습 — 문서를 그림으로 그린다. 고친 뒤에도 바뀐 모습이 보인다(바이트를 갈아 두었다). */
function heRenderPages(){
  const b=$('heBody'); if(!b) return;
  b.innerHTML='<div class="mpmsg">모습을 그리는 중…</div>';
  PureunHwp.renderPreview(b, _he.bytes, _he.name).catch(e=>{
    b.innerHTML='<div class="mpmsg">모습을 그리지 못했습니다 — '+esc((e&&e.message)||'')+
      '<br>글 고치기는 그대로 쓸 수 있습니다.</div>';
  });
}

/* 번호 붙은 줄 — 이것이 대표가 요청한 화면이다 */
function heRenderRows(){
  const b=$('heBody'); if(!b) return;
  const rows=_he.rows;
  if(!rows.length){
    b.innerHTML='<div class="mpmsg">고칠 글을 찾지 못했습니다.<br>글이 그림·글상자 안에 있는 문서일 수 있습니다.</div>';
    return;
  }
  b.innerHTML=`<div class="helist">${rows.map((r,i)=>{
    const v = _he.edited[i]==null ? r.text : _he.edited[i];
    const on = PuHwpEdit.clean(v)!==r.text;
    return `<div class="herow ${r.kind==='cell'?'cell':''} ${on?'on':''}" id="heR${i}">
      <span class="no" title="${r.kind==='cell'?'표 안':'본문'} ${r.no}번째 줄">${r.no}</span>
      <textarea rows="1" oninput="heInput(${i},this)"
        title="${r.kind==='cell'?`표 ${r.rc.row}행 ${r.rc.col}열`:'본문'}">${esc(v)}</textarea>
      ${r.kind==='cell'?`<span class="tag">표 ${r.rc.row}·${r.rc.col}</span>`:''}
    </div>`;
  }).join('')}</div>`;
  b.querySelectorAll('textarea').forEach(heFit);
}
function heFit(el){ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }
function heInput(i, el){
  if(!_he) return;
  _he.edited[i]=el.value;
  heFit(el);
  /* 고친 줄만 표시를 바꾸고 개수를 고친다 — 화면을 다시 그리면 글 쓰던 자리를 잃는다 */
  const row=$('heR'+i);
  if(row) row.classList.toggle('on', PuHwpEdit.clean(el.value)!==_he.rows[i].text);
  const n=PuHwpEdit.changedRows(_he.rows,_he.edited).length;
  if($('heCnt')) $('heCnt').innerHTML = n?`고친 줄 <b>${n}</b>개`:'고친 줄 없음';
  if($('heSaveB')) $('heSaveB').disabled = !n;
  if($('heDownB')) $('heDownB').disabled = !n;
}
function heToEdit(){
  if(!_he) return;
  try{ _he.rows = PuHwpEdit.readRows(_he.doc); }
  catch(e){ toast('글을 읽지 못했습니다 — '+((e&&e.message)||''), 6000); return; }
  _he.edited={}; _he.mode='edit'; heRender();
}
function heToView(){
  if(!_he) return;
  if(heDirty() && !confirm('고친 내용을 아직 저장하지 않았습니다.\n버리고 원래 모습을 볼까요?')) return;
  _he.edited={}; _he.mode='view'; heRender();
}
function heBig(){ if(_he) openMaterialHwp(_he.bytes, _he.name); }

/* ══════════════ 격자 편집기 — 서식을 표 모양 그대로 ══════════════
   서랍의 세로 목록으로는 서식을 못 고친다. 서식은 거의 전부 표라서
   칸을 한 줄씩 늘어놓으면 원래 모양이 사라진다(20행×3열 급여표 → 60줄).
   여기서는 표를 표로 그려 한 화면에서 훑고 고친다.

   ⚠ 문서(_mg.doc)는 WASM 쪽 기억을 쓴다. 닫을 때 반드시 free() 한다.
   ⚠ 원본 모습은 renderPreview(el, _mg.bytes, …) 로 그린다. bytes 다.
     doc 을 넘기면 그 문서가 죽어 편집이 통째로 멈춘다. */
let _mg = null;   /* {id,name,bytes,doc,grid,edited,busy} */
let _mgGen = 0;   /* 겹쳐 열 때 차례표 — 기다리는 사이 새로 열렸으면 나는 옛 호출이다 */

function mgChanged(){
  return _mg ? PuHwpEdit.changedRows(_mg.grid.units, _mg.edited).length : 0;
}
/* 확인 없이 곧장 놓는다 — 자료가 이미 지워졌거나 다른 파일로 바뀐 강제 정리에 쓴다.
   그때는 저장할 곳 자체가 없어졌으니 "버릴까요" 를 물을 이유가 없다. */
function mgClose(){
  if(_mg){ try{ if(_mg.doc && _mg.doc.free) _mg.doc.free(); }catch(_){} }
  _mg=null;
  const el=$('mgedBack'); if(el) el.remove();
}
function closeMatEditor(){
  if(_mg && mgChanged() && !confirm('고친 내용을 아직 저장하지 않았습니다.\n버리고 닫을까요?')) return;
  mgClose();
}

async function openMatEditor(id){
  const m = _matMeta[id]; if(!m) return toast('자료를 찾지 못했습니다');
  const name = m.fileName || m.name || '한글자료.hwp';
  if(!/^(hwp|hwpx)$/.test(matExt(name)))
    return toast('한글 문서(.hwp·.hwpx)만 고칠 수 있습니다 — PDF 는 글자를 바꿀 수 없습니다', 7000);
  /* ⚠ _mg 는 두 await 를 지나야 채워진다. 그 사이 겹쳐 누르면 _mg 는 아직 null 이라
     _mg 가 있을 때만 닫는 식으로는 못 막는다 — matHwp 남매(openMaterialHwp)처럼
     조건 없이 먼저 닫는다. closeMatEditor 는 _mg 가 없어도 남은 #mgedBack 을 지운다. */
  closeMatEditor();
  if(_mg) return;                                  /* 닫기를 취소했다 */
  const gen = ++_mgGen;                             /* 이 호출의 차례표를 찍어 둔다 */

  const back=document.createElement('div');
  back.className='mged'; back.id='mgedBack';
  back.innerHTML='<div class="mged-box" role="dialog" aria-modal="true">'
    +'<div class="mged-head">📄 '+esc(m.name||name)+'<button class="x" onclick="closeMatEditor()">✕</button></div>'
    +'<div class="mged-body" id="mgedBody"><div class="mpmsg">📕 한글 문서를 여는 중…<br>'
    +'<span style="font-size:11.5px">처음 한 번은 조금 걸립니다</span></div></div></div>';
  back.addEventListener('click', e=>{ if(e.target===back) closeMatEditor(); });
  document.body.appendChild(back);

  try{
    const arr = await matBytes(id);
    const doc = await PureunHwp.openDoc(arr, name);
    /* 기다리는 사이 닫혔거나(#mgedBack 없음) 새로 열렸다(내 차례표가 낡았다).
       둘 다 화면은 이미 다른 것을 그리고 있으니 문서만 놓고 물러난다 —
       화면을 만지면 최신 호출이 그려 둔 것을 밀어낸다. */
    if(!$('mgedBack') || gen!==_mgGen){ try{doc.free()}catch(_){} return; }
    _mg={id:id, name:name, bytes:arr, doc:doc, grid:{units:[],blocks:[],warn:{badCellInfo:0,textBoxes:0}},
         edited:{}, busy:false};
    try{ _mg.grid = PuHwpEdit.readGrid(doc); }catch(e){
      return mgFail('글을 읽지 못했습니다 — '+((e&&e.message)||''));
    }
    mgRender();
  }catch(e){
    /* 여기도 두 await 뒤다 — 실패가 도착했을 때 이미 새 편집기가 떠 있을 수 있다.
       옛 호출의 실패는 사용자에게 알릴 소식이 아니다. 알리면 화면에 떠 있는
       최신 편집기의 #mgedBody 를 지워, 거기 있던 고치던 내용까지 함께 날린다. */
    if(gen!==_mgGen) return;
    mgFail('한글 문서를 열지 못했습니다 — '+((e&&e.message)||''));
  }
}
function mgFail(msg){
  const b=$('mgedBody'); if(b) b.innerHTML='<div class="mpmsg">'+esc(msg)+'</div>';
}

function mgRender(){
  const box=$('mgedBack'); if(!box || !_mg) return;
  const n=mgChanged(), w=_mg.grid.warn;
  const miss=[];
  if(w.textBoxes) miss.push('글상자 '+w.textBoxes+'개');
  if(w.badCellInfo) miss.push('자리를 모르는 칸 '+w.badCellInfo+'개');
  box.querySelector('.mged-box').innerHTML =
    '<div class="mged-head">📄 '+esc((_matMeta[_mg.id]||{}).name||_mg.name)
      +'<button class="x" onclick="closeMatEditor()">✕</button></div>'
    +'<div class="mged-bar">'
      +'<button onclick="mgPreview()">👁 원본 모습</button>'
      +'<button class="go" id="mgSaveB" onclick="mgSave()"'+((n && !_mg.broken)?'':' disabled')+'>💾 자료함에 저장</button>'
      /* 저장이 실패했으면 고친 것이 화면에만 남는다. 그걸 못 꺼내면 갇힌다 —
         rescue 일 때는 고친 곳이 0 이어도 내려받기를 열어 둔다. */
      +'<button id="mgDownB" onclick="mgDownload()"'+((n || _mg.rescue)?'':' disabled')+'>📥 내려받기</button>'
      +'<span class="cnt" id="mgCnt">'+(n?'고친 곳 <b>'+n+'</b>개':'고친 곳 없음')+'</span>'
    +'</div>'
    +'<div class="mged-body" id="mgedBody">'+mgGridHtml()+'</div>'
    + mgNoteHtml(miss);
  mgFitAll();
}

/* 팝업 아래 알림줄 — 알림창(toast)과 달리 **덮이지 않고 남는다.**
   여기에 들어가는 셋은 모두 「모르고 지나가면 손해 보는」 것들이다.
   ① 저장 결과 ② 넣지 못한 곳(어디인지 번호까지) ③ 아직 못 읽는 부분. */
function mgNoteHtml(miss){
  const out=[];
  if(_mg.saveMsg) out.push(esc(_mg.saveMsg));
  if(_mg.failed && _mg.failed.length)
    out.push('넣지 못한 곳 — '+esc(_mg.failed.map(f=>f.no+'번('+(f.why||'까닭 모름')+')').join(', '))
      +'<br>이 줄들은 문서에 안 들어갔습니다. 한글에서 직접 고쳐 주십시오.');
  if(miss.length)
    out.push('⚠ 아직 못 읽는 것이 있습니다 — '+esc(miss.join(', '))+'. 이 부분은 한글에서 고쳐 주십시오.');
  return out.length ? '<div class="mged-note">'+out.join('<hr style="border:0;border-top:1px solid #f0d9a8;margin:7px 0">')+'</div>' : '';
}

function mgGridHtml(){
  const g=_mg.grid;
  if(!g.blocks.length) return '<div class="mpmsg">고칠 글을 찾지 못했습니다.<br>글이 그림 안에 있는 문서일 수 있습니다.</div>';
  return g.blocks.map(b=> b.kind==='body'
    ? '<div class="mgbody">'+mgLineHtml(b.unit)+'</div>'
    : mgTableHtml(b)).join('');
}

/* 한 줄 — 번호와 고칠 칸. 번호는 문서 안 차례이고 저장할 때 쓰는 열쇠이기도 하다. */
function mgLineHtml(i){
  const u=_mg.grid.units[i];
  const v=_mg.edited[i]==null ? u.text : _mg.edited[i];
  const on=PuHwpEdit.clean(v)!==u.text;
  return '<div class="mgline'+(on?' on':'')+'" id="mgL'+i+'">'
    +'<span class="no">'+u.no+'</span>'
    +'<textarea rows="1" oninput="mgInput('+i+',this)">'+esc(v)+'</textarea></div>';
}

/* 표를 표로 그린다.
   ⚠ 자리는 getCellInfo 가 준 row·col 만 쓴다. 칸 번호를 열 수로 나눠 짐작하면
     합친 칸이 하나만 있어도 그 뒤가 전부 어긋난다(실제 공문에 55개 있었다).
   ⚠ 합친 칸이 덮는 자리는 미리 막아 둔다. 안 막으면 칸이 오른쪽으로 밀린다. */
function mgTableHtml(b){
  const rows=Math.max(1,b.rows), cols=Math.max(1,b.cols);
  const taken={};                                  /* 'r-c' → 이미 다른 칸이 덮었다 */
  const at={};                                     /* 'r-c' → 거기서 시작하는 칸 */
  const orphan=[];                                 /* 자리를 모르는 칸 */
  b.cells.forEach(c=>{
    if(c.row==null || c.col==null){ orphan.push(c); return; }
    at[c.row+'-'+c.col]=c;
  });
  const emitted=new Set();                         /* 실제로 <td> 로 나간 칸 — 칸 객체 자체로 가린다.
                                                       cell 번호가 표 안에서 유일하다는 보장은 다른 파일
                                                       (pu-hwp-edit.js)의 몫이라 여기서 기대면, 그 파일이
                                                       바뀌어 번호가 겹치는 날 칸이 표에도 orphan 에도 없이
                                                       조용히 사라진다. */
  let h='<table class="mgtbl">';
  for(let r=0;r<rows;r++){
    h+='<tr>';
    for(let c=0;c<cols;c++){
      if(taken[r+'-'+c]) continue;
      const cell=at[r+'-'+c];
      if(!cell){ h+='<td></td>'; continue; }
      const rs=Math.max(1,cell.rowSpan), cs=Math.max(1,cell.colSpan);
      for(let dr=0;dr<rs;dr++) for(let dc=0;dc<cs;dc++)
        if(dr||dc) taken[(r+dr)+'-'+(c+dc)]=1;
      h+=`<td rowspan="${rs}" colspan="${cs}">`+cell.units.map(mgLineHtml).join('')+'</td>';
      emitted.add(cell);
    }
    h+='</tr>';
  }
  h+='</table>';
  /* ⚠ 화면에 안 나온 칸은 사용자가 영영 못 고친다 — 조용히 사라지는 것이 진짜 위험이다.
     rows·cols 가 실제 칸 수보다 작아 표 밖으로 밀렸든(0×0 표에 칸만 60개인 경우 등),
     row·col 이 겹쳐 last-writer-wins 로 밀려났든, 합친 칸이 덮은 자리라 continue 로
     건너뛰었든 — 위 두 for 문을 실제로 지나간 칸(emitted)에 못 든 칸은 전부 여기서
     건져 자리 모르는 칸 상자로 보낸다. 자리는 몰라도 고칠 수는 있어야 한다. */
  b.cells.forEach(c=>{
    if(c.row==null || c.col==null) return;         /* 이미 위에서 orphan 에 들어갔다 */
    if(!emitted.has(c)) orphan.push(c);
  });
  /* 자리를 못 읽은 칸도 고칠 수 있어야 한다. 조용히 빼면 영영 못 고친다. */
  if(orphan.length){
    h+='<div class="mgorph">⚠ 자리를 모르는 칸 '+orphan.length+'개 — 표 어디인지 알 수 없지만 고칠 수는 있습니다.'
      +orphan.map(c=>c.units.map(mgLineHtml).join('')).join('')+'</div>';
  }
  return h;
}

function mgFit(el){ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }
function mgFitAll(){ const b=$('mgedBody'); if(b) b.querySelectorAll('textarea').forEach(mgFit); }

/* 화면을 다시 그리지 않는다 — 그리면 글 쓰던 자리를 잃는다 */
function mgInput(i, el){

/* 고친 것을 문서에 넣고 새 바이트를 만든다.
   ⚠ 넣은 뒤에는 줄 길이가 달라졌다 — 반드시 다시 읽어야 다음 저장이 어긋나지 않는다. */
/* 고친 것을 문서에 넣고 새 바이트를 만든다.

   ⚠ 차례가 중요하다. 예전엔 exportBytes → readGrid → edited={} 였는데,
     exportBytes(WASM)나 readGrid 가 도중에 터지면 **문서는 이미 바뀌었는데**
     edited 와 grid 는 옛것 그대로 남았다. 그 상태로 다시 저장을 누르면 옛 길이로
     같은 자리를 또 지우고 또 넣어 「가나다」→「가나다라마」가 「라마가나다라마」가 된다.
     실제로 재현했다. 그래서 넣자마자 **먼저 edited 를 비운다** — 두 번 넣히지 않는다.

   ⚠ 그래도 문서와 바이트가 어긋난 채 남을 수 있다. 그때는 broken 을 세워
     이 세션으로는 더 저장하지 못하게 막는다. 어긋난 바이트를 올리면 대표가 고친 것이
     조용히 사라진다. 다시 열라고 말하는 편이 낫다. */
function mgApply(){
  const ch = PuHwpEdit.changedRows(_mg.grid.units, _mg.edited);
  if(!ch.length) return {ok:0, failed:[]};
  const res = PuHwpEdit.applyRows(_mg.doc, ch);
  _mg.edited = {};                       /* 넣은 것을 또 넣지 않도록 제일 먼저 */
  try{
    _mg.grid  = PuHwpEdit.readGrid(_mg.doc);
    _mg.bytes = PuHwpEdit.exportBytes(_mg.doc, _mg.name);
  }catch(e){
    _mg.broken = true;
    throw e;
  }
  return res;
}
/* 넣지 못한 곳은 **팝업 안에 남긴다.**
   예전엔 알림창(toast)으로 띄웠는데, 그 알림창은 한 칸짜리라 바로 뒤따라오는
   「업로드 중…」과 「✅ 저장했습니다」가 덮어 버렸다. 대표는 ✅ 만 보게 되고,
   반만 저장된 계약서를 다 저장된 줄 안다. 화면에 남아 있어야 읽을 수 있다. */
function mgTellFailed(res){
  if(!_mg) return;
  _mg.failed = (res.failed||[]).slice();
}

async function mgSave(){
  if(!_mg || _mg.busy) return;
  const n = mgChanged();
  if(!n) return toast('고친 곳이 없습니다');
  if(!confirm('고친 '+n+'곳을 자료함의 「'+_mg.name+'」에 저장합니다.\n예전 내용은 남지 않습니다. 진행할까요?')) return;
  /* ⚠ 이 저장이 다루는 자료를 여기서 미리 쥔다(m). await putMaterial 이 도는 사이
     자료가 지워지거나(mgClose) 팝업이 다른 자료로 새로 열리면 전역 _mg 는 바뀌거나
     null 이 된다 — 그때 마지막에 "_mg.busy=false" 를 그대로 쓰면 null 을 건드려 죽거나,
     엉뚱하게도 방금 새로 열린 남의 세션의 busy 를 꺼 버린다. m 은 이 호출이 시작할 때의
     그 자료 그대로를 계속 가리키므로 이 저장은 언제나 자신이 쥔 것만 건드린다. */
  const m = _mg;
  if(m.broken) return toast('문서가 어긋나 더 저장할 수 없습니다 — 팝업을 닫고 다시 열어 주십시오', 9000);
  m.busy=true;
  try{
    const res = mgApply();
    mgTellFailed(res);
    const t = matType(m.name) || {mime:'application/octet-stream'};
    const file = new File([m.bytes], m.name, {type:t.mime});
    const cur = _matMeta[m.id] || {};
    /* putMaterial 은 안에서 실패를 삼키고 false 를 돌려준다. 돌려준 값을 봐야
       「올라갔다」고 말할 자격이 생긴다 — 안 보고 ✅ 를 띄우면 거짓말이 된다. */
    const ok = await putMaterial(m.id, cur.name || m.name, file);
    m.saveMsg = ok
      ? (res.failed.length
          ? '⚠ 일부만 저장했습니다 — 넣지 못한 곳 '+res.failed.length+'군데는 아래에 있습니다'
          : '✅ 자료함에 저장했습니다')
      : '❌ 저장하지 못했습니다 — 고친 내용은 아직 화면에 있습니다. 📥 내려받기로 받아 두십시오';
    /* 못 올렸으면 고친 것이 갇히면 안 된다. 내려받기는 반드시 열어 둔다. */
    m.rescue = !ok;
    toast(m.saveMsg, ok ? 4000 : 12000);
    mgRender();
  }catch(e){
    m.saveMsg = '❌ 저장하지 못했습니다 — '+((e&&e.message)||'')
      + (m.broken ? ' (문서가 어긋났습니다. 팝업을 닫고 다시 열어 주십시오)' : '');
    m.rescue = !m.broken;
    toast(m.saveMsg, 12000);
    try{ mgRender(); }catch(_){}
  }finally{ m.busy=false; }
}

function mgDownload(){
  if(!_mg || _mg.busy) return;
  if(_mg.broken) return toast('문서가 어긋나 만들 수 없습니다 — 팝업을 닫고 다시 열어 주십시오', 9000);
  try{
    const res = mgApply();
    mgTellFailed(res);
    PureunHwp.download(_mg.bytes, PuHwpEdit.editedName(_mg.name), PuHwpEdit.extOf(_mg.name));
    _mg.saveMsg = res.failed.length
      ? '⚠ 일부만 들어간 문서를 내려받았습니다 — 넣지 못한 곳은 아래에 있습니다. 자료함의 원본은 그대로입니다'
      : '📥 고친 문서를 내려받았습니다 — 자료함의 원본은 그대로입니다';
    _mg.rescue = false;                 /* 꺼냈으니 갇힌 상태가 아니다 */
    toast(_mg.saveMsg, res.failed.length ? 9000 : 4000);
    mgRender();
  }catch(e){
    _mg.saveMsg = '❌ 만들지 못했습니다 — '+((e&&e.message)||'');
    toast(_mg.saveMsg, 9000);
    /* mgApply 가 도중에 터졌으면 화면의 단추 상태가 실제와 어긋난다 — 반드시 다시 그린다 */
    try{ mgRender(); }catch(_){}
  }
}

/* 원본 모습 — 한글로 인쇄한 그대로 그린다.
   ⚠ 반드시 _mg.bytes 를 넘긴다. renderPreview 는 받은 바이트로 제 문서를 열고
     끝나면 닫는다(pu-hwp-engine.js). _mg.doc 를 넘기면 그 문서가 죽어
     편집이 통째로 멈춘다. */
function mgPreview(){
  if(!_mg) return;
  /* 저장이 도는 중에 화면을 갈아엎으면, 저장이 끝나며 부르는 mgRender 와 서로 덮는다 */
  if(_mg.busy) return toast('저장하는 중입니다 — 끝나고 눌러 주십시오');
  const b=$('mgedBody'); if(!b) return;
  if(mgChanged() && !confirm('고친 내용을 아직 저장하지 않았습니다.\n버리고 원본 모습을 볼까요?')) return;
  /* 고친 것을 버렸으니 도구줄의 「고친 곳 N개」와 단추도 같이 꺼져야 한다.
     본문만 갈아 끼우면 도구줄이 옛 숫자를 그대로 들고 있어, 눌러도 「고친 곳이 없습니다」만 뜬다. */
  _mg.edited={};
  const bar=$('mgCnt'); if(bar) bar.innerHTML='고친 곳 없음';
  const sb=$('mgSaveB'); if(sb) sb.disabled=true;
  const db=$('mgDownB'); if(db) db.disabled=!_mg.rescue;
  b.innerHTML='<div class="mpmsg">모습을 그리는 중…</div>';
  PureunHwp.renderPreview(b, _mg.bytes, _mg.name).then(()=>{
    const back=document.createElement('div');
    back.style.cssText='text-align:center;padding:10px 0 18px';
    back.innerHTML='<button onclick="mgRender()" style="border:1px solid #cbd5e6;background:#fff;border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit">← 고치기로 돌아가기</button>';
    b.appendChild(back);
  }).catch(e=>{
    b.innerHTML='<div class="mpmsg">모습을 그리지 못했습니다 — '+esc((e&&e.message)||'')
      +'<br><button onclick="mgRender()" style="margin-top:10px;border:1px solid #cbd5e6;background:#fff;border-radius:8px;padding:7px 14px;font-size:12.5px;cursor:pointer;font-family:inherit">← 고치기로 돌아가기</button></div>';
  });
}

/* 고친 줄을 문서에 넣고 새 바이트를 만든다.
   ⚠ 넣은 뒤에는 줄 길이가 달라졌다 — 반드시 다시 읽어야 다음 저장이 어긋나지 않는다. */
function heApply(){
  const ch = PuHwpEdit.changedRows(_he.rows, _he.edited);
  if(!ch.length) return {ok:0, failed:[]};
  const res = PuHwpEdit.applyRows(_he.doc, ch);
  _he.bytes = PuHwpEdit.exportBytes(_he.doc, _he.name);
  _he.rows = PuHwpEdit.readRows(_he.doc);
  _he.edited = {};
  return res;
}
function heTellFailed(res){
  if(!res.failed.length) return;
  toast('넣지 못한 줄: '+res.failed.map(f=>f.no+'번('+f.why+')').join(', '), 9000);
}
async function heSave(){
  if(!_he || _he.busy) return;
  const n = PuHwpEdit.changedRows(_he.rows,_he.edited).length;
  if(!n) return toast('고친 줄이 없습니다');
  if(!confirm(`고친 ${n}개 줄을 자료함의 「${_he.name}」에 저장합니다.\n예전 내용은 남지 않습니다. 진행할까요?`)) return;
  _he.busy=true;
  try{
    const res = heApply();
    heTellFailed(res);
    const t = matType(_he.name) || {mime:'application/octet-stream'};
    const file = new File([_he.bytes], _he.name, {type:t.mime});
    const cur = _matMeta[_he.id] || {};
    /* ⚠ 모습 보기로 먼저 돌려 둔다. putMaterial 이 화면을 다시 그리는데(matRefresh),
       그때 아직 '고치기'면 방금 저장한 목록이 한 번 더 그려져 눈이 깜빡인다. */
    _he.mode='view';
    await putMaterial(_he.id, cur.name || _he.name, file);   /* 갈래·설명·순서는 그대로 얹힌다 */
    toast('✅ 자료함에 저장했습니다');
  }catch(e){
    toast('저장하지 못했습니다 — '+((e&&e.message)||''), 8000);
  }finally{ _he.busy=false; }
}
function heDownload(){
  if(!_he || _he.busy) return;
  try{
    const res = heApply();
    heTellFailed(res);
    PureunHwp.download(_he.bytes, PuHwpEdit.editedName(_he.name), PuHwpEdit.extOf(_he.name));
    toast('📥 고친 문서를 내려받았습니다 — 자료함의 원본은 그대로입니다');
    heRender();
  }catch(e){ toast('만들지 못했습니다 — '+((e&&e.message)||''), 8000); }
}

/* ══════ 메일 화면 (본문 전체) ══════
   팝업으로는 본문·첨부를 손보기가 갑갑했다. 자료함·환경설정과 같은 방식으로 본문을 쓴다.
   state.mailSent 가 true 면 보낸 메일함, 아니면 쓰기. */
function openMailPage(pre){
  /* 설정을 읽은 뒤 판정한다 (openSendMaterials 와 같은 이유) */
  if(!_matLoaded && Store.mode==='firebase'){ loadMaterials(()=>openMailPage(pre)); return; }
  /* 「메일창만 열기」로 두었으면 여기서 보낼 수 없다 — 켜는 곳을 알려 준다.
     안 막으면 다 쓰고 [보내기]를 눌렀을 때 비로소 안 된다는 것을 알게 된다. */
  if(mailModeOf(matMailCfg())!=='auto')
    return toast('자료함 → ✉️ 메일 본문에서 「회사 메일로 바로 보내기」를 켜면 여기서 바로 쓸 수 있습니다', 8000);
  state.view='mail'; state.mailSent=false;
  /* 쓰다 만 글이 있으면 이어서 쓴다 — 명함에서 새로 들어온 경우(pre)는 그것이 먼저다 */
  if(!_compose && !pre){
    const d = loadDraft();
    if(d && composeTouched(d)){
      const when = new Date(d.at).toTimeString().slice(0,5);
      if(confirm(`${when} 에 쓰다 만 메일이 있습니다.\n\n받는 곳 · ${d.to||'(비어 있음)'}\n제목 · ${d.subject||'(없음)'}\n\n이어서 쓸까요?\n\n[취소]를 누르면 쓰다 만 글을 **버리고** 새 메일로 시작합니다.`)){
        _compose = Object.assign({ picking:true }, d);
        state.draftAt = when;
        if(d.lostFiles && d.lostFiles.length)
          setTimeout(()=>toast(`💻 내 PC 파일(${d.lostFiles.join(' · ')})은 다시 붙여 주세요 — 임시저장에는 담기지 않습니다`, 9000), 400);
      } else {
        /* 취소 = 버리고 새로. 지우기만 하면 자동저장이 되살릴 수 있으므로
           쓰던 편지도 함께 비운다 (대표 지시 2026-08-10). */
        clearDraft();
        _compose = null;
        toast('쓰다 만 메일을 버리고 새로 시작합니다', 5000);
      }
    }
  }
  if(!_compose || pre){
    const tpl = matMailCfg();
    const p = pre || {};
    const vals = { 받는분: p.name||'', 회사명: p.company||'', 자료목록:'', 오늘: fmtDate(Date.now()) };
    const subject0 = mailFill(tpl.subject || MAIL_TPL_DEFAULT.subject, vals);
    const body0 = mailFill(tpl.body || MAIL_TPL_DEFAULT.body, vals)
                    .replace(/^\s*님,?\s*/,'').replace(/\n{3,}/g,'\n\n');
    /* ★ 서명은 «새 메일을 열 때 이미 들어가 있다» (대표 지시 2026-08-24
         「한번 저장하면 계속 보낼수 있게」). 누르는 것을 잊어도 따라가고, 화면에서
         눈으로 보고 지울 수도 있다 — 서버가 몰래 붙이면 보낸 뒤에야 알게 된다.
       ⚠ 잣대(base)에는 서명을 «넣지 않는다». 넣으면 서명만 있는 빈 편지도
         「손댔다」로 보여 임시저장이 쌓인다. */
    const html0 = textToHtml(body0) + '<br><br>' + signBlockHtml();
    _compose = {
      cardId: p.cardId||'', to: p.to||'', cc: p.cc||'',
      subject: subject0, body: htmlToTextC(html0), html: html0,
      /* 처음 채워진 글을 기억해 둔다 — 손댔는지 견주는 잣대다(composeTouched) */
      base: { subject: subject0, body: htmlToTextC(html0) },
      ids: p.ids||[], files: [], picking: true
    };
    /* 전달·다시보내기로 들어오면 제목·본문을 그것으로 갈아 준다 (2026-08-24 메일함) —
       틀에서 채운 글은 «새 편지»용이라, 갈지 않으면 전달할 글을 덮어써 버린다. */
    if(p.subject){ _compose.subject = p.subject; _compose.base.subject = p.subject; }
    if(p.body){
      const h2 = textToHtml(p.body) + '<br><br>' + signBlockHtml();
      _compose.html = h2; _compose.body = htmlToTextC(h2); _compose.base.body = _compose.body;
    }
  }
  /* 고른 명함의 사진을 받아 둔다 — 없으면 본문에 빈 자리가 보인다 */
  if(mySign() && !_signThumb) loadSignThumb(()=>{ if(state.view==='mail') renderMailPage(); });
  render();
  try{ $('pcMain').scrollTop=0; }catch(_){}
  if(!_matLoaded && Store.mode==='firebase') loadMaterials(()=>{ if(state.view==='mail') renderMailPage(); });
}
/* ── 예약한 메일 ──
   서버 자리(pucards/scheduled)에 담겨 때를 기다리는 것들. 취소·되돌리기가 여기서 된다. */
function openSchedBox(){ state.view='mail'; state.mailSent='sched'; render();
  try{ $('pcMain').scrollTop=0; }catch(_){}
  loadSchedBox(()=>{ if(state.view==='mail' && state.mailSent==='sched'){ renderPCSide(); renderMailPage(); } }); }
function loadSchedBox(cb){
  if(Store.mode!=='firebase'){ if(cb) cb(); return; }
  firebase.database().ref(DB_ROOT+'/scheduled').limitToLast(200).once('value')
    .then(s=>{ state.schedBox = s.val()||{}; if(cb) cb(); })
    .catch(e=>{ console.warn('[예약메일]', e&&e.message); if(cb) cb(); });
}
function schedList(){
  return Object.entries(state.schedBox||{})
    .map(([id,v])=>Object.assign({id}, v||{}))
    .filter(v=>v.at)
    .sort((a,b)=>(a.at||0)-(b.at||0));
}
function schedBoxHtml(){
  const rows = schedList();
  const ids = rows.map(v=>v.id);
  const sel = pickPrune(pickOf('sched'), ids); pickPut('sched', sel);
  const body = rows.length ? rows.map((v,i)=>{
    const p = v.payload||{};
    const bad = v.state==='failed';
    return `<tr class="${bad?'bad':''} ${pickOn(sel,v.id)?'pkon':''}">
      <td class="pk"><label><input type="checkbox" ${pickOn(sel,v.id)?'checked':''}
        onchange="pickHit('sched','${v.id}')"><span class="no">${i+1}</span></label></td>
      <td class="w">${esc(fmtWhen(v.at))}<span>${bad?'보내지 못함':(v.state==='sending'?'보내는 중':'기다리는 중')}</span></td>
      <td class="b">${esc(staffName(v.by))}</td>
      <td><b>${esc(p.toName||'')}</b><span class="e">${esc(p.to||'')}</span></td>

function cancelScheduled(id){
  const v=(state.schedBox||{})[id]; if(!v) return;
  const p=v.payload||{};
  if(!confirm(`예약을 취소합니다.\n\n받는 곳 · ${p.to||''}\n보낼 때 · ${fmtWhen(v.at)}\n\n진행할까요?`)) return;
  firebase.database().ref(`${DB_ROOT}/scheduled/${id}`).remove()
    .then(()=>{ delete state.schedBox[id]; toast('예약을 취소했습니다'); renderPCSide(); renderMailPage(); })
    .catch(e=>toast('취소하지 못했습니다: '+((e&&e.message)||'')));
}
/* 예약을 걷어 쓰기 화면으로 — 고쳐서 다시 걸 수 있게 */
function editScheduled(id){
  const v=(state.schedBox||{})[id]; if(!v) return;
  const p=v.payload||{};
  if(!confirm(`이 예약을 걷어 고쳐 씁니다.\n\n예약은 지워지고 쓰기 화면으로 갑니다.\n진행할까요?`)) return;
  firebase.database().ref(`${DB_ROOT}/scheduled/${id}`).remove()
    .then(()=>{
      delete state.schedBox[id];
      _compose = { cardId:p.cardId||'', to:p.to||'', cc:p.cc||'', bcc:p.bcc||'',
        subject:p.subject||'', body:p.body||'',
        ids:(p.matIds||[]).filter(x=>_matMeta[x]), files:[],
        toMe:!!p.toMe, oneByOne:!!p.oneByOne, sendAt:v.at, picking:true, base:{} };
      state.mailSent=false; render();
      if(p.droppedFiles && p.droppedFiles.length)
        toast(`💻 내 PC 파일(${p.droppedFiles.join(' · ')})은 다시 붙여 주세요`, 9000);
    })
    .catch(e=>toast('걷어 오지 못했습니다: '+((e&&e.message)||'')));
}

function openSentBox(){ state.view='mail'; state.mailSent=true; render();
  try{ $('pcMain').scrollTop=0; }catch(_){}
  /* 목록이 오면 왼쪽 폴더(갈래별·사람별 개수)도 함께 다시 그린다 — 한쪽만 그리면
     본문에는 20통인데 왼쪽은 0으로 남는다 */
  loadSentBox(()=>{ if(state.view==='mail' && state.mailSent){ renderPCSide(); renderMailPage(); } }); }
function closeMailPage(){ state.view='list'; render(); }
function renderMailPage(){
  /* ⚠ 메일 칸(#pcMail)은 PC 전용 틀(#pcRoot) 안에 있어 폰에서는 아예 안 그려졌다 —
     그래서 폰에는 메일 화면 자체가 없었다(대표 지시 2026-08-20 "폰에서도 쓰게").
     폰은 목록 자리(#list)에 그린다 — 「기업 상세」가 이미 쓰는 방식이라 새 틀이 필요 없다. */
  if(!document.body.classList.contains('pc')) return renderMailMobile();
  const el=$('pcMail'); if(!el) return;
  /* ⚠ 받은 메일을 폰 쪽에만 넣어 두어 PC 에서는 눌러도 쓰기 화면이 떴다.
     갈래가 늘 때 **두 곳을 함께** 고쳐야 한다(폰은 renderMailMobile). */
  /* ⚠ 갈래가 늘 때 «두 곳을 함께» 고쳐야 한다(폰은 renderMailMobile).
     'box' 는 다음메일함을 비추는 목록이다 — 2026-08-24 에 더했다. */
  el.innerHTML = state.mailSent==='box' ? mbBoxHtml()
                : state.mailSent==='inbox' ? inboxBoxHtml()
                : state.mailSent==='sched' ? schedBoxHtml()
                : state.mailSent ? sentBoxHtml() : mailWriteHtml();
  if(!state.mailSent) wireMailWrite();
}

/* ── 폰 메일 화면 ──
   PC 것을 그대로 쓴다(mailWriteHtml·sentBoxHtml·schedBoxHtml) — 폰용을 따로 만들면
   메일에 손댈 때마다 두 곳을 고쳐야 하고, 언젠가 한쪽만 고친다.
   위에 「‹ 목록 · 쓰기 · 보낸 · 예약」 한 줄만 얹는다. PC 는 옆줄이 그 일을 한다. */
function renderMailMobile(){
  const el=$('list'); if(!el) return;
  const tab=(fn,lb,on)=>`<button class="mmtab${on?' on':''}" onclick="${fn}">${lb}</button>`;
  /* ★ 메일함은 폰에서 «앱과 같은 차림»으로 화면을 통째로 쓴다(대표 화면 2026-08-24).
     그래서 갈래줄을 안 그린다 — 그리면 앱에 없는 줄이 화면 뒤에 남는다.
     그 화면에서 다른 곳으로 가는 길은 왼쪽 서랍 맨 아래에 있다(mbDrawerHtml).
     ⚠ 나머지 화면(쓰기·보낸·예약·수신기록)은 예전 그대로 PC 것을 쓴다 — 두 벌로
       만들지 않는다는 약속은 그 화면들에 그대로 살아 있다. */
  if(state.mailSent==='box'){
    el.innerHTML = `<div id="mmBody">${mbMobileHtml()}</div>`;
    return;
  }
  el.innerHTML = `<div class="mmbar">
      <button class="mmback" onclick="closeMailPage()" title="명함 목록으로">‹ 목록</button>
      ${tab("openMailBox(mbNow())",'📥 메일함', state.mailSent==='box')}
      ${tab('openInbox()','🧾 수신기록', state.mailSent==='inbox')}
      ${tab('openMailPage()','✏️ 쓰기', !state.mailSent)}
      ${tab('openSentBox()','📤 보낸', state.mailSent===true)}
      ${tab('openSchedBox()','⏰ 예약', state.mailSent==='sched')}
      <button class="mmtab" onclick="openMatPage()" title="메일에 붙일 자료">📎 자료함</button>
    </div><div id="mmBody"></div>`;
  const body=$('mmBody'); if(!body) return;
  body.innerHTML = state.mailSent==='box' ? mbMobileHtml()
                 : state.mailSent==='inbox' ? inboxBoxHtml()
                 : state.mailSent==='sched' ? schedBoxHtml()
                 : state.mailSent ? sentBoxHtml() : mailWriteHtml();
  if(!state.mailSent) wireMailWrite();
}

             예전에는 줄을 누르면 바로 담겨, 무엇인지 모른 채 붙는 일이 있었다. */
          const row = m => {

                title="${on?'첨부에서 빼기':'첨부에 담기'}">${on?'☑':'☐'}</span>

             (대표 지시 2026-08-12). 담긴 것이 있는 갈래는 접혀 있어도 숫자로 알려준다. */
          return '<div class="mdlist">' + drawerGroups(list).map(g=>{

/* ── 자료 서랍을 갈래로 묶기 ──
   자료함의 갈래 차례를 그대로 따른다. 서랍만 다른 순서로 보이면 같은 자료를 두 곳에서
   다르게 찾게 된다. 갈래에 없는 값이 붙은 자료도 버리지 않고 뒤에 붙인다 —
   목록에서 사라지면 영영 못 고른다. */
function drawerGroups(list){
  const order = MAT_CATS_NOW();
  const by = {};
  list.forEach(m=>{ const k = matCat(m) || '기타'; (by[k] = by[k] || []).push(m); });
  const out = [];
  order.forEach(c=>{ if(by[c] && by[c].length){ out.push({cat:c, items:by[c]}); delete by[c]; } });
  Object.keys(by).forEach(c=> out.push({cat:c, items:by[c]}));
  return out;
}
/* 어느 갈래를 펴 둘지.
   ① 찾는 말을 치는 중이면 전부 편다 — 접힌 곳에 답이 숨으면 「없다」고 오해한다
   ② 자료가 적으면(6개 이하) 굳이 접을 이유가 없다
   ③ 그 밖에는 대표가 눌러서 편 것만 편다 */
function drawerCatOpen(cat, total){
  if(String(state.drawerQ||'').trim()) return true;
  if(total <= 6) return true;
  return !!(state.drawerOpen||{})[cat];
}
function toggleDrawerCat(cat){
  state.drawerOpen = state.drawerOpen || {};
  state.drawerOpen[cat] = !state.drawerOpen[cat];
  grabCompose(); renderMailPage();
}
function focusDrawerQ(){ const q=$('mdQ'); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }

/* ── 가운데 손잡이로 좌우 넓이 조절 ──
   자료 서랍이 좁아 서류 이름과 미리보기가 답답했다. 끌어서 넓힌다 (대표 지시 2026-08-10).
   ⚠ 넓이는 **화면 너비의 절반까지**. 더 늘리면 편지 쓰는 자리가 서랍보다 좁아진다.
   ⚠ 끄는 동안 다시 그리지 않는다. 다시 그리면 잡고 있던 손잡이가 사라져 끌기가 끊긴다 —
     끝난 뒤에 한 번만 담아 둔다. */
const DRAWERW_LS = 'pucards_mail_drawerw';
const DRAWERW_MIN = 220, DRAWERW_DEFAULT = 300;
function drawerMax(){
  const w = $('pcMail') ? $('pcMail').clientWidth : 900;
  return Math.max(DRAWERW_MIN, Math.round(w * 0.5));   /* 화면의 절반까지 */
}
function setDrawerW(px, save){
  const w = Math.min(drawerMax(), Math.max(DRAWERW_MIN, Math.round(px)));
  state.drawerW = w;
  const wrap = document.querySelector('#pcMail .mwrap');
  if(wrap) wrap.style.setProperty('--drawer', w+'px');
  if(save) try{ localStorage.setItem(DRAWERW_LS, String(w)); }catch(_){}
  return w;
}
function loadDrawerW(){
  try{ const v=parseInt(localStorage.getItem(DRAWERW_LS)||'',10);
    if(v>0) state.drawerW=v; }catch(_){}
}
function initMailGrip(){
  const g=$('mGrip'); if(!g || g._grip) return; g._grip=true;
  const wrap = g.parentElement;
  g.addEventListener('pointerdown', e=>{
    e.preventDefault();
    const startX = e.clientX, startW = state.drawerW || DRAWERW_DEFAULT;
    g.setPointerCapture(e.pointerId);
    g.classList.add('on');
    document.body.classList.add('mresizing');
    const move = ev => setDrawerW(startW + (startX - ev.clientX), false);   /* 왼쪽으로 끌면 넓어진다 */
    const up = ev => {
      g.removeEventListener('pointermove', move);
      g.removeEventListener('pointerup', up);
      g.removeEventListener('pointercancel', up);
      g.classList.remove('on');
      document.body.classList.remove('mresizing');
      setDrawerW(state.drawerW, true);        /* 끝난 뒤 한 번만 담는다 */
    };
    g.addEventListener('pointermove', move);
    g.addEventListener('pointerup', up);
    g.addEventListener('pointercancel', up);
  });
  /* 두 번 누르면 원래대로 — 잘못 끌어 놓고 되돌릴 길이 있어야 한다 */
  g.addEventListener('dblclick', ()=>{ setDrawerW(DRAWERW_DEFAULT, true); toast('자료 서랍 넓이를 원래대로'); });
  if(wrap) wrap.style.setProperty('--drawer', (state.drawerW||DRAWERW_DEFAULT)+'px');
}
/* 서랍에서 내용 보기 — 자료함 미리보기와 같은 부품을 쓴다.

/* ══════ 서식 있는 본문 — 다음메일과 같은 도구줄 (대표 지시 2026-08-24) ══════

/* 다음메일 도구줄에 있는 것들. cmd 는 브라우저에 그대로 넘기는 이름이다.

/* 도구 한 번 누르기. ⚠ 여기서 renderMailPage 를 부르면 안 된다 — 화면을 다시 그리면
   글자를 쓰던 자리(캐럿)가 맨 앞으로 튀어 한 글자마다 앞으로 돌아간다. */
function edCmd(cmd, val){
  const el = $('cpBody'); if(!el) return;
  try{ el.focus(); }catch(_){}
  try{
    if(cmd==='createLink'){
      const u = prompt('누를 수 있는 주소를 넣으세요', 'https://');
      if(!u) return;
      if(!/^(https?:\/\/|mailto:)/i.test(u))
        return toast('http:// 또는 https:// 로 시작해야 합니다 — 다른 주소는 서버가 지웁니다', 7000);
      document.execCommand('createLink', false, u);
    } else {
      document.execCommand(cmd, false, (val===undefined ? null : val));
    }
  }catch(e){ toast('이 서식은 이 브라우저에서 안 됩니다', 5000); }
  /* 누른 결과를 «곧바로» 담는다 — 안 담으면 다음에 화면을 그릴 때 사라진다 */
  grabCompose();
  edSyncBar();
}

/* 글자 크기 — 브라우저 명령은 1~7 만 받는다. 화면에는 pt 로 보여 주고 여기서 바꾼다. */
const ED_PT2SIZE = { '9':1, '10':2, '11':3, '12':3, '14':4, '16':5, '18':6, '24':7 };
function edFontSize(pt){
  edCmd('fontSize', String(ED_PT2SIZE[String(pt)] || 3));
}

/* 켜짐 표시는 «브라우저에 물어서» 칠한다. 우리가 따로 세면, 마우스로 딴 줄을 눌렀을 때
   실제 서식과 표시가 어긋난다(굵은 줄에 커서를 뒀는데 「굵게」가 꺼져 보인다). */
function edSyncBar(){
  try{
    document.querySelectorAll('.edbtn[data-cmd]').forEach(function(b){
      let on = false;
      try{ on = document.queryCommandState(b.getAttribute('data-cmd')); }catch(_){}
      b.classList.toggle('on', !!on);
    });
  }catch(_){}
}

/* 평문 → 서식. 옛 임시저장·자료함의 메일 틀은 평문이라 그대로 넣으면 줄바꿈이
   다 사라져 한 줄이 된다. ⚠ & 를 «가장 먼저» 바꾼다 — 나중에 하면 &lt; 가 다시 망가진다. */
function textToHtml(t){
  return String(t==null?'':t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\r\n|\r|\n/g,'<br>');
}

/* 서식 → 평문 (화면 쪽). 빈 본문인지 보고, 미리보기·목록에 쓴다.
   ⚠ functions/mail-send.js 의 htmlToText 와 «같은 답»을 내야 한다 —
     서버는 화면이 준 평문을 그대로 쓰므로, 어긋나면 받는 편지의 두 몫이 다른 말을 한다.
     tests/cards-mail-editor.test.js 가 두 쪽이 같은 답을 내는지 확인한다. */
function htmlToTextC(h){
  /* ⚠ functions/mail-send.js 의 htmlToText 와 «한 글자도 다르지 않게» 유지한다 */
  let s = String(h==null?'':h);
  if(!s) return '';
  s = s.replace(/<\s*(script|style)\b[\s\S]*?<\s*\/\s*\1\s*>/gi,'');
  s = s.replace(/<\s*br\s*\/?\s*>/gi,'\n');
  s = s.replace(/<\s*\/\s*(p|div|li|blockquote|tr|h[1-6])\s*>/gi,'\n');
  s = s.replace(/<\s*hr\s*\/?\s*>/gi,'\n');
  s = s.replace(/<[^>]*>/g,'');
  s = s.replace(/&nbsp;/gi,' ').replace(/&lt;/gi,'<').replace(/&gt;/gi,'>')
       .replace(/&quot;/gi,'"').replace(/&#0*39;|&apos;/gi,"'").replace(/&amp;/gi,'&');
  return s.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}

/* 본문 칸에 넣을 서식. html 이 있으면 그것을, 없으면(옛 평문) 바꿔서 넣는다. */
function composeHtml(c){
  const o = c || {};
  if(typeof o.html === 'string' && o.html.trim()) return o.html;
  return textToHtml(o.body || '');
}

/* ══════ 주소록 (다음메일 받는사람 오른쪽의 그 단추) ══════

   ⚠ 새 명단을 만들지 않는다 — 명함 그대로를 본다. 두 벌이 되면 한쪽만 낡는다. */

    <div class="mdsearch" style="margin-bottom:8px"><input id="abQ" value="${esc(state.abQ||'')}"

/* 고르기 — 목록의 ☑ 와 아래 단추의 숫자가 «둘 다» 바뀐다. 한쪽만 바꾸면 어긋난다.
   ⚠ 팝업을 통째로 다시 그리지 않는다 — 찾기 칸에 치던 한글이 끊긴다. */
function abToggle(id){
  if(_abPick[id]) delete _abPick[id]; else _abPick[id]=1;
  const l = $('abList'); if(l) l.innerHTML = addrBookListHtml();
  const b = $('abAdd');  if(b) b.innerHTML = addrBookBtnHtml();

/* 고른 사람을 받는사람 칸에 넣는다. ⚠ 이미 적힌 주소와 합쳐 세어야 한다 —
   빈 칸 기준으로만 세면 3명이 적힌 칸에 5명을 더 넣어 보낼 때 거절당한다. */
function addrBookAdd(){
  if(!_compose) return;
  const have = String(_compose.to||'').split(/[,;]/).map(s=>s.trim()).filter(Boolean);
  const add = [];
  Object.keys(_abPick).forEach(id=>{
    const em = normEmail((state.items[id]||{}).email);
    if(em && have.indexOf(em) < 0 && add.indexOf(em) < 0) add.push(em);
  });
  if(!add.length){ dedupBg.classList.remove('open'); return toast('새로 넣을 주소가 없습니다'); }
  const room = MAIL_MAX_TO - have.length;
  if(room <= 0) return toast(`받는 사람은 한 번에 ${MAIL_MAX_TO}명까지입니다 — 이미 ${have.length}명이 있습니다`, 7000);
  const take = add.slice(0, room);
  _compose.to = have.concat(take).join(', ');
  dedupBg.classList.remove('open');
  renderMailPage();
  if(add.length > take.length)
    toast(`${MAIL_MAX_TO}명까지만 넣었습니다 — ${add.length-take.length}명은 빠졌습니다. 여러 곳에 보내려면 명함에서 골라 「묶음 발송」을 쓰세요`, 9000);
  else toast(`${take.length}명을 넣었습니다`);
}

/* ══════ 내 서명 명함 사진 (대표 지시 2026-08-24) ══════
   「명함사진은 본인것 찾아서 선택하고 한번 저장하면 계속 보낼수 있게」

   ■ 어떻게 도나
     · 명함첩에서 «내 명함»을 한 번 고르면 사람마다 따로 저장된다
       (pucards/config/matMail/perUser/<열쇠>). 위의 글자 서명은 전 직원 공용이고,
       이것은 사람마다 다르다 — 명함은 각자 것이기 때문이다.
     · 본문에는 «표시»(cid:pusign)만 들어간다. 그림은 보낼 때 서버가 붙인다.
       본문에 그림을 통째로 담으면 예약 메일이 실시간DB 에 100KB 를 며칠씩 물고 있는다.
     · 그래서 서명을 바꾸면 «걸어 둔 예약 메일도» 새 명함으로 나간다.
   ■ 새로 담는 자리가 없다 — 명함의 «썸네일»을 그대로 쓴다. */
const SIGN_CID = 'pusign';                 /* functions/mail-sign.js 와 같아야 한다 */
const SIGN_IMG = `<img src="cid:${SIGN_CID}">`;

/* 실시간DB 열쇠에 못 쓰는 글자(. # $ / [ ])를 바꾼다.
   ⚠ functions/mail-sign.js 의 signKey 와 «같은 답»을 내야 한다 — 다르면 저장한 자리와
     서버가 읽는 자리가 어긋나 서명이 조용히 안 붙는다. */
function signKeyC(email){
  /* ⚠ functions/mail-sign.js 의 signKey 와 «한 글자도 다르지 않게» 유지한다 */
  const s = String(email==null?'':email).trim().toLowerCase();
  if(!s) return '';
  return s.replace(/[.#$/[\]]/g, '_');
}
function mySignKey(){ return signKeyC(myEmail); }

/* 내가 고른 명함 기록 — { cardId, at } */
function mySign(){
  const k = mySignKey(); if(!k) return null;
  const all = ((_matMail||{}).perUser) || {};
  return all[k] || null;
}

/* ══════ 글자로 짠 디지털 명함 (대표 지시 2026-08-24) ══════
   「명함이 깔끔하게 정리되어 디지털 형태로 갔으면 좋겠다」

   왜 사진보다 나은가
     · 받는 쪽 메일 프로그램이 바깥 그림을 기본으로 막는 일이 잦다 — 글자는 무조건 보인다
     · 주소·전화를 «긁어 붙일 수» 있다. 사진은 손으로 옮겨 적어야 한다
     · 폰에서 사진은 작아 안 읽히고, 글자는 화면 폭에 맞춰 접힌다
     · 편지마다 따라가는데 사진은 50~150KB, 글자는 1KB 안쪽이다
     · 첨부 파일 목록에 명함 사진이 끼는 일이 없다
   ⚠ 꾸밈은 functions/mail-send.js 의 STYLE_OK 에 있는 것만 쓴다 —
     border·padding·display 는 목록에 없어 서버가 조용히 지운다.
   ⚠ 빈 값은 «자리를 안 만든다». 「T : 」만 남으면 안 채운 칸이 드러난다. */
function signCardHtml(it){
  const o = it || {};
  const g = k => String(o[k]==null?'':o[k]).trim();
  const nm = g('name');
  if(!nm) return '';                       /* 이름조차 없으면 명함이라 할 수 없다 */
  const L = [];
  /* 전화·팩스·휴대폰은 «있는 것만» 한 줄에 모은다 */
  const tel = [];
  if(g('companyTel')) tel.push('T ' + esc(g('companyTel')));
  if(g('companyFax')) tel.push('F ' + esc(g('companyFax')));
  if(g('mobile'))     tel.push('M ' + esc(g('mobile')));
  if(tel.length) L.push(tel.join(' &nbsp;·&nbsp; '));
  if(g('email')){
    /* 주소에 따옴표가 있으면 속성이 깨져 뒤가 다 망가진다 — 그때는 글자로만 둔다 */
    const em = g('email');
    L.push(/["'<>\s]/.test(em) ? esc(em)
      : `<a href="mailto:${esc(em)}" style="color:#1d4fc4">${esc(em)}</a>`);
  }
  if(g('companyAddr')) L.push(esc(g('companyAddr')));
  const role = [g('dept'), g('title')].filter(Boolean).join(' · ');
  return `<div style="font-size:15px;font-weight:700;color:#1b2536;margin:0">${esc(nm)}${
      role ? ` <span style="font-size:12px;font-weight:400;color:#5a6885">${esc(role)}</span>` : ''}</div>`
    + (g('company') ? `<div style="font-size:13px;font-weight:700;color:#1d4fc4">${esc(g('company'))}</div>` : '')
    + (L.length ? `<div style="font-size:12px;color:#5a6885;line-height:1.75">${L.join('<br>')}</div>` : '');
}

/* 서명을 «글자»로 보낼까 «사진»으로 보낼까 — 사람마다 따로. 기본은 글자다. */
function signMode(){
  const rec = mySign() || {};
  return rec.mode === 'photo' ? 'photo' : 'card';
}
function setSignMode(m){
  const k = mySignKey(); if(!k) return;

      _matMail.perUser[k] = Object.assign({}, rec, { mode: mode });
      showPanel(mySignHtml()); renderMailPage();
      toast(mode==='card' ? '글자로 짠 명함으로 나갑니다' : '명함 사진으로 나갑니다', 5000);

}

/* 서명 덩어리 — 고른 갈래에 따라 «글자 명함» 또는 «사진 표시» + 공용 글자 서명. */
function signBlockHtml(){
  const rec = mySign();
  const mode = signMode();
  const txt = textToHtml(signText());
  /* 보안문구는 «맨 끝». 작고 흐린 글씨로 본문과 구별한다.
     ⚠ 꾸밈은 functions/mail-send.js 의 STYLE_OK 에 있는 것만 쓴다 —
       border 는 목록에 없어 서버가 지운다. 줄은 <hr> 로 긋는다. */
  const sec = String(secText()||'').trim();
  const secHtml = sec
    ? '<hr><span style="font-size:12px;color:#8b98b3;line-height:1.6">'
      + textToHtml(sec) + '</span>'
    : '';
  /* 고른 명함이 있으면 그것을 «글자»로 짜거나 «사진 표시»로 넣는다.
     ⚠ 글자 갈래에 사진 표시를 함께 넣으면 안 된다 — 서버가 그림을 붙여 빈 자리가 뜬다. */
  let head = '';
  if(rec && rec.cardId){
    if(mode === 'photo') head = SIGN_IMG + '<br>';
    else {
      const card = signCardHtml(state.items[rec.cardId]);
      head = card ? card + '<br>' : '';
    }
  }
  return head + txt + secHtml;
}

/* 화면에 보일 때는 표시를 «실제 그림»으로 바꿔 준다 — 서버가 붙이기 전이라
   그냥 두면 깨진 그림 자리가 보인다.
   ⚠ 바꿔 넣은 것에는 반드시 data-pusign 을 붙인다. 담을 때(grabCompose) 이것을 보고
     «표시로 되돌린다» — 안 되돌리면 100KB 짜리 data: 주소가 본문에 실려 나가고,
     서버는 그런 그림을 버리므로 서명이 «조용히 사라진다». */
/* ⚠ span 은 «안의 글자까지» 먹어야 한다. 여는 태그만 지우면 안내 글자
   (「📇 내 명함 사진 (보낼 때 붙습니다)」)가 편지에 그대로 실려 나간다. */
const SIGN_BACK_RE = /<img\b[^>]*\bdata-pusign\b[^>]*>|<span\b[^>]*\bdata-pusign\b[^>]*>[\s\S]*?<\/span>/gi;
let _signThumb = '';
function signPreviewHtml(html){
  const s = String(html==null?'':html);
  if(s.indexOf('cid:'+SIGN_CID) < 0) return s;
  const re = new RegExp('<\\s*img\\b[^>]*src\\s*=\\s*["\']?cid:'+SIGN_CID+'["\'\\s>][^>]*>', 'gi');
  return s.replace(re, _signThumb
    ? `<img data-pusign="1" src="${_signThumb}" style="max-width:280px;border:1px solid #e4e8f0;border-radius:6px">`
    : '<span data-pusign="1" style="display:inline-block;padding:6px 10px;border:1px dashed #cfd8e6;'
      + 'border-radius:6px;color:#8b98b3;font-size:12px">📇 내 명함 사진 (보낼 때 붙습니다)</span>');
}
/* 담을 때 되돌린다 — 화면에 보이던 그림을 다시 «표시»로. */
function signRestoreHtml(html){
  const s = String(html==null?'':html);
  if(s.indexOf('data-pusign') < 0) return s;
  return s.replace(SIGN_BACK_RE, SIGN_IMG);
}
/* 고른 명함의 썸네일을 미리 받아 둔다 — 그려야 할 때 없으면 빈 자리가 된다 */
function loadSignThumb(then){
  const rec = mySign();
  if(!rec || !rec.cardId){ _signThumb=''; if(then) then(); return; }
  Store.getThumb(rec.cardId).then(t=>{ _signThumb = t||''; if(then) then(); })
    .catch(()=>{ _signThumb=''; if(then) then(); });
}

  /* 사진(썸네일)이 있는 명함만 보여 준다 — 없는 것을 고르면 그림이 안 붙는다.
     ⚠ 개인 폴더 명함은 안 보여 준다. 서버는 공용 자리(pucards/thumbs)만 읽는다. */
  const pool = Object.values(state.items||{}).filter(it=>it && it.kind==='card' && it.id);
  const cur = rec.cardId ? (state.items[rec.cardId]||{}) : null;
  /* ⚠ 찾기 칸은 «다시 그리지 않는다». 한글은 자모 여러 번이 모여 한 글자가 되는데
     (조합), 글자마다 팝업을 다시 그리면 입력 칸이 새 것으로 바뀌어 조합이 끊긴다 —
     대표 화면 2026-08-24 에 「권」을 치니 «ㄱㅜㅓㄴ» 이 남았다.
     그래서 결과 목록(#msList)만 바꾼다(msType). */
  return `<div class="mhead"><b>✍ 내 서명 명함</b>${_closeBtn()}</div>
    <p class="setnote" style="margin:0 0 8px">한 번 고르면 <b>내가 보내는 모든 메일</b> 끝에 따라붙습니다 ·
      사람마다 따로 저장됩니다</p>
    ${cur ? `<div class="msnow">
      ${_signThumb?`<img src="${_signThumb}" alt="">`:'<span class="none">사진을 읽는 중…</span>'}
      <div class="t"><b>${esc(cur.name||'(이름 없음)')}</b>
        <span>${esc(cur.company||'')}</span></div>
      <button class="msoff" onclick="clearMySign()" title="서명에서 명함 사진을 뺍니다">✕ 빼기</button>
    </div>
    ${/* 글자냐 사진이냐 (대표 지시 2026-08-24 「깔끔하게 정리되어 디지털 형태로」).
         글자를 기본으로 둔다 — 받는 쪽이 그림을 막아도 보이고, 긁어 붙일 수 있다. */''}
    <div class="msmode">
      <button class="${signMode()==='card'?'on':''}" onclick="setSignMode('card')"
        title="이름·회사·전화·주소를 글자로 짜서 보냅니다 — 무조건 보이고, 긁어 붙일 수 있습니다">
        📝 글자로 <i>권장</i></button>
      <button class="${signMode()==='photo'?'on':''}" onclick="setSignMode('photo')"
        title="명함 사진을 그림으로 보냅니다 — 받는 쪽이 그림을 막으면 안 보일 수 있습니다">
        🖼 사진으로</button>
    </div>
    ${signMode()==='card' ? `<div class="mspreview">${signCardHtml(cur) || '<span class="none">이 명함에 적힌 값이 없습니다 — 명함을 열어 채워 주세요</span>'}</div>` : ''}`
    : `<p class="cpnone" style="padding:10px 2px">아직 고른 명함이 없습니다</p>`}
    <div class="mdsearch" style="margin:10px 0 8px"><input id="msQ" value="${esc(_msQ||'')}"
      placeholder="🔍 내 이름·회사로 찾기" oninput="msType(this.value)"></div>
    <div class="ablist" id="msList">${mySignListHtml()}</div>
    <p class="setnote" style="margin:8px 0 0">사진이 없는 명함을 고르면 글자 서명만 나갑니다.
      개인 폴더 명함은 쓸 수 없습니다.</p>`;
}
/* 결과 목록만. 찾기 칸을 안 건드리므로 한글 조합이 끊기지 않는다. */
function mySignListHtml(){
  const rec = mySign() || {};
  const q = String(_msQ||'').trim();
  const pool = Object.values(state.items||{}).filter(it=>it && it.kind==='card' && it.id);
  const hits = (q ? findPeople(state.items, q, 40) : pool.slice(0, 40)).filter(it=>it && it.kind==='card');
  if(!hits.length) return `<div class="cpnone" style="padding:16px 2px">${
    q?'찾은 명함이 없습니다':'명함이 없습니다'}</div>`;
  return hits.map(it=>`
    <div class="abrow ${rec.cardId===it.id?'on':''}" onclick="pickMySign('${it.id}')">
      <span class="ck">${rec.cardId===it.id?'☑':'☐'}</span>
      <span class="n"><b>${esc(it.name||'(이름 없음)')}</b>
        <span class="c">${esc(it.company||'')}</span></span>
      <span class="e">${esc(it.title||'')}</span></div>`).join('');
}
/* 글자를 칠 때 — 목록만 바꾼다. 초점도 손대지 않는다(안 건드렸으니 그럴 일이 없다). */
function msType(v){
  _msQ = String(v==null?'':v);

}

function pickMySign(cardId){
  const k = mySignKey(); if(!k) return;
  const it = state.items[cardId]; if(!it) return;
  firebase.database().ref(`${DB_ROOT}/config/matMail/perUser/${k}`)
    .set({ cardId: String(cardId), at: Date.now() })
    .then(()=>{
      _matMail = _matMail || {}; _matMail.perUser = _matMail.perUser || {};
      _matMail.perUser[k] = { cardId:String(cardId), at:Date.now() };

    })

function clearMySign(){
  const k = mySignKey(); if(!k) return;

    .then(()=>{

      showPanel(mySignHtml()); renderMailPage();
      toast('서명에서 명함 사진을 뺐습니다');
    })
    .catch(e=>toast('지우지 못했습니다: '+((e&&e.message)||'')));
}

/* ── 예약 발송 ──
   ⚠ 정해진 때에 깨어나는 서버가 따로 없다. 그래서 **이 브라우저가 켜져 있어야**
     나간다 — 창을 닫으면 안 나간다. 그 사실을 감추지 않고 그대로 알린다.
     감추면 「보냈는데 안 갔다」가 되고, 그것이 제일 나쁘다. */
function fmtWhen(ts){
  const d=new Date(ts||0); const p=n=>(n<10?'0':'')+n;
  return `${d.getMonth()+1}월 ${d.getDate()}일 ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function toLocalInput(ts){
  const d=new Date(ts||0); const p=n=>(n<10?'0':'')+n;
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
/* ⚠ 때를 재는 것은 **서버**다. 예전에는 이 화면이 재고 있어서 창을 닫으면
   안 나갔다 — 「예약했는데 안 갔다」가 되는 자리라 서버로 옮겼다(2026-08-10).
   여기서는 언제 보낼지만 정하고, [예약하기]를 누르면 서버 자리에 담긴다. */
function toggleSchedule(on){
  grabCompose(); if(!_compose) return;
  if(!on){ _compose.sendAt=0; renderMailPage(); return; }
  const d=new Date(Date.now()+3600000); d.setSeconds(0,0);
  _compose.sendAt = d.getTime();
  renderMailPage();
  toast('때를 정한 뒤 [예약하기]를 누르면 서버에 맡겨집니다 — 창을 닫아도 나갑니다', 8000);
}
function setSchedule(v){
  grabCompose(); if(!_compose) return;
  const t = new Date(v).getTime();
  if(!t || t < Date.now() + 30000) return toast('지금부터 30초 뒤 이후로 골라 주세요');
  _compose.sendAt = t;
  renderMailPage();
  toast(`${fmtWhen(t)} 에 보냅니다`);
}
function setComposeFlag(k, v){ grabCompose(); if(!_compose) return; _compose[k]=!!v; renderMailPage(); }

/* ── 임시저장 ──
   쓰다가 다른 화면으로 갔다 와도 이어 쓸 수 있어야 한다.
   ⚠ 이 브라우저에만 둔다. 서버에 두면 직원끼리 쓰다 만 편지가 섞인다.
   ⚠ 💻 내 PC 파일은 담지 않는다 — 8MB 짜리가 브라우저 저장칸을 금세 채운다.
     대신 이름만 남겨 무엇을 다시 붙여야 하는지 알린다. */
const DRAFT_LS = 'pucards_mail_draft';
function draftOf(c){
  if(!c) return null;
  return { cardId:c.cardId||'', to:c.to||'', cc:c.cc||'', bcc:c.bcc||'',
           subject:c.subject||'', body:c.body||'',
           html:c.html||'',          /* 서식 몫 — 안 담으면 이어 쓸 때 꾸민 것이 사라진다 */
           ids:c.ids||[],
           base:c.base||{},          /* 잣대도 함께 — 이어 쓴 뒤에도 손댔는지 알 수 있게 */
           toMe:!!c.toMe, oneByOne:!!c.oneByOne,
           lostFiles:(c.files||[]).map(f=>f.name), at:Date.now() };
}
/* 손댄 편지인가 — 받는사람이 있거나, 첨부가 있거나, 제목·본문을 기본 글에서 바꿨나.
   ⚠ 이 판단이 없으면 **열어만 두어도** 기본 글이 임시저장되고, 다음에 들어올 때마다
     「이어서 쓸까요?」가 뜬다. 취소해도 30초 뒤 자동저장이 다시 만들어 되풀이됐다
     (2026-08-10 실제 증상). */
function composeTouched(c){
  if(!c) return false;
  if(String(c.to||'').trim()) return true;
  if(String(c.cc||'').trim() || String(c.bcc||'').trim()) return true;
  if((c.ids||[]).length || (c.files||[]).length) return true;
  const base = c.base || {};
  if(String(c.subject||'') !== String(base.subject||'')) return true;
  if(String(c.body||'')    !== String(base.body||''))    return true;
  return false;
}
function saveDraft(quiet){
  grabCompose();
  if(!_compose) return;
  if(!composeTouched(_compose)){
    /* 손대지 않았다 — 담아 둘 것이 없다. 남아 있던 것도 치운다. */
    clearDraft();
    if(!quiet) toast('아직 쓴 내용이 없습니다');
    return;
  }
  try{
    localStorage.setItem(DRAFT_LS, JSON.stringify(draftOf(_compose)));
    state.draftAt = new Date().toTimeString().slice(0,5);
    if(!quiet) toast('임시저장했습니다 — 다음에 「메일 쓰기」로 오면 이어서 씁니다', 6000);
    else { const el=document.querySelector('.mauto'); if(el) el.textContent='자동저장 '+state.draftAt; }
  }catch(e){ if(!quiet) toast('임시저장하지 못했습니다: '+((e&&e.message)||'')); }
}
function loadDraft(){
  try{ const v=JSON.parse(localStorage.getItem(DRAFT_LS)||'null');
    if(!v || !v.at) return null;
    v.ids = (v.ids||[]).filter(id=>_matMeta[id]);   /* 그 사이 지워진 자료는 뺀다 */
    v.files = [];
    return v;
  }catch(_){ return null; }
}
function clearDraft(){ try{ localStorage.removeItem(DRAFT_LS); }catch(_){} state.draftAt=''; }
/* 30초마다 조용히 담아 둔다 — 자리를 비운 사이 창이 닫혀도 글이 남는다 */
setInterval(()=>{ if(state.view==='mail' && !state.mailSent && _compose && composeTouched(_compose)) saveDraft(true); }, 30000);

/* ── 미리보기 ── 받는 쪽에 어떻게 보이는지 그대로 */
function previewMail(){
  grabCompose();
  const c=_compose; if(!c) return;
  const from = matMailCfg().from || '';
  const names = (c.ids||[]).map(id=>(_matMeta[id]||{}).name||'자료')
    .concat((c.files||[]).map(f=>f.name));
  showPanel(`<div class="mhead"><b>👁 미리보기</b>${_closeBtn()}</div>
    <div style="font-size:12.5px;line-height:1.9;color:#33415e;border-bottom:1px solid #eef2f7;padding-bottom:9px;margin-bottom:9px">
      <b>보내는사람</b> 푸른노무법인 &lt;${esc(from)}&gt;<br>
      <b>받는사람</b> ${esc(c.to||'(비어 있음)')}<br>
      ${c.cc?`<b>참조</b> ${esc(c.cc)}<br>`:''}
      ${c.bcc||c.toMe?`<b>숨은참조</b> ${esc([c.bcc, c.toMe?from:''].filter(Boolean).join(', '))}<br>`:''}
      <b>제목</b> ${esc(c.subject||'(비어 있음)')}<br>
      <b>첨부</b> ${names.length?esc(names.join(' · ')):'없음'}
    </div>
    ${/* 2026-08-24: 서식 그대로 보여 준다 — 받는 사람이 보는 모양이어야 미리보기다.
          esc(평문) 을 쓰면 꾸민 것이 안 보여 「미리보기와 실제가 다르다」가 된다.
          ⚠ 여기 넣는 서식은 우리 화면에서 만든 것이고, 보낼 때 서버가 다시 씻는다. */''}
    <div style="white-space:normal;word-break:break-word;font-family:inherit;font-size:13px;
      line-height:1.8;color:#1b2536;margin:0">${signPreviewHtml(composeHtml(c))}</div>
    ${c.oneByOne?'<p class="setnote" style="margin-top:10px">※ 한명씩 발송 — 받는 사람마다 따로 나갑니다(서로의 주소가 안 보입니다).</p>':''}`);
}
/* 첨부칸에 파일을 끌어다 놓기 */
function initMailDrop(){
  const z=$('cpDrop'); if(!z || z._dnd) return; z._dnd=true;
  ['dragenter','dragover'].forEach(ev=>z.addEventListener(ev, e=>{ e.preventDefault(); e.stopPropagation(); z.classList.add('over'); }));
  z.addEventListener('dragleave', e=>{ if(!z.contains(e.relatedTarget)) z.classList.remove('over'); });
  z.addEventListener('drop', async e=>{
    /* ⚠ window 에도 파일 드롭 처리기가 있다 — 여기서 끊지 않으면 명함 등록으로도 흘러간다 */
    e.preventDefault(); e.stopPropagation(); z.classList.remove('over');
    await addLocalFiles({ files: (e.dataTransfer&&e.dataTransfer.files)||[] });
  });
}
/* 받는사람 칸에 자동 찾기를 붙인다 — 화면을 새로 그릴 때마다 다시 매단다 */
function wireMailWrite(){
  initMailDrop();
  initMailGrip();
  const to=$('cpTo'), sug=$('cpSug'); if(!to||!sug) return;
  const close=()=>{ sug.innerHTML=''; sug.classList.remove('on'); };
  to.addEventListener('input', ()=>{
    if(_compose) _compose.to = to.value;
    /* 마지막 쉼표 뒤의 말로만 찾는다 — 여러 명을 적는 중일 수 있다 */
    const tail = to.value.split(/[,;]/).pop().trim();
    const hits = findPeople(state.items, tail, 8);
    if(!hits.length) return close();
    sug.innerHTML = hits.map(it=>{
      const em = normEmail(it.email);
      return `<div class="cpsi ${em?'':'off'}" ${em?`onclick="pickPerson('${it.id}')"`:''}>
        👤 <b>${esc(it.name||'(이름 없음)')}</b>
        <span class="c">${esc(it.company||'')}</span>
        <span class="e">${em?esc(em):'이메일 없음'}</span></div>`;
    }).join('');
    sug.classList.add('on');
  });
  to.addEventListener('blur', ()=>{ setTimeout(close, 180); });   /* 누르는 것을 먼저 받게 조금 늦춘다 */
}
function pickPerson(id){
  const it = state.items[id]; if(!it) return;
  const em = normEmail(it.email); if(!em) return;
  grabCompose();
  if(!_compose) return;
  /* 적던 마지막 토막을 고른 주소로 바꾼다 */
  const parts = String(_compose.to||'').split(/[,;]/);
  parts[parts.length-1] = em;
  _compose.to = parts.map(s=>s.trim()).filter(Boolean).join(', ');
  if(!_compose.cardId) _compose.cardId = id;      /* 기록이 이 명함에 붙게 */
  renderMailPage();
  toast(`받는사람에 ${it.name||em} 님을 담았습니다`);
}

/* ── 보낸 메일함 ── */
/* ══════ 받은 메일 (대표 결정 2026-08-24) ══════
   푸른 메일에는 **보내는 쪽만** 있었다(쓰기·보낸·예약·자료함). 받은 메일은
   급여데이터함 안에서만, 그것도 **자료로 담긴 것만** 보였다 — 문의 메일처럼
   자료가 안 되는 것은 앱에서 통째로 안 보였다.

   ⚠ **사본이 아니다.** 답장·삭제·읽음은 여전히 다음메일이 진짜다. 여기 목록은
   「서버가 무엇을 보고 무엇을 담았나」는 기록이라, 본문 전문이 아니라 미리보기
   몇 줄만 있다. 그래서 줄을 눌러도 답장 화면이 아니라 **급여데이터함**으로 간다.
   ⚠ 서버(functions receivePaydataMail)가 paydata/maillog 에 적는다. 콘솔 규칙이
   없으면 못 읽어 빈 목록으로 뜬다 — 그때는 고장이 아니라고 화면에 적는다. */
var MAILLOG_PATH = 'paydata/maillog';

function loadInbox(cb){
  if(Store.mode!=='firebase'){ if(cb) cb(); return; }
  firebase.database().ref(MAILLOG_PATH).limitToLast(300).once('value')
    .then(s=>{ state.inbox = s.val()||{}; state.inboxErr=''; if(cb) cb(); })
    .catch(e=>{
      /* 규칙이 없으면 여기로 온다 — 「고장」이 아니라고 말해 줘야 한다 */
      state.inbox = {}; state.inboxErr = (e&&e.code)||(e&&e.message)||'읽지 못했습니다';
      console.warn('[받은메일]', state.inboxErr); if(cb) cb();
    });
}

/* 지금 화면에 보일 줄 — 그리는 곳과 셈이 **같은 목록**을 봐야 개수가 안 어긋난다. */
function inboxVisibleRows(){
  const q = String(state.inboxQ||'').trim().toLowerCase().replace(/\s/g,'');
  const f = state.inboxFilter||'all';
  let rows = Object.entries(state.inbox||{})
    .map(([id,v])=>Object.assign({id}, v||{}))
    .filter(v=>v.at);
  /* ⚠ 「안 담김」에 지난 회차 것(old)을 넣으면 안 된다 — 담겼는지 알 수 없는
     것을 안 담긴 것으로 세면 대표가 없는 문제를 쫓게 된다. */
  if(f==='took') rows = rows.filter(v=>Number(v.took||0)>0);
  else if(f==='none') rows = rows.filter(v=>!Number(v.took||0) && v.old!==true);
  else if(f==='lost') rows = rows.filter(v=>v.shared===true);
  if(q){
    rows = rows.filter(v=>{
      const hay = ((v.from||'')+(v.subject||'')+(v.preview||'')).toLowerCase().replace(/\s/g,'');
      return hay.indexOf(q)>=0;
    });
  }
  return rows.sort((a,b)=>Number(b.at||0)-Number(a.at||0));
}

function inboxCounts(){
  const all = Object.values(state.inbox||{}).filter(v=>v&&v.at);
  return {
    all: all.length,
    took: all.filter(v=>Number(v.took||0)>0).length,
    none: all.filter(v=>!Number(v.took||0) && v.old!==true).length,
    lost: all.filter(v=>v.shared===true).length
  };
}

function inboxBoxHtml(){
  const rows = inboxVisibleRows();
  const c = inboxCounts();
  const chip=(k,lb,n)=>`<button class="ibchip${(state.inboxFilter||'all')===k?' on':''}"`
    + ` onclick="setInboxFilter('${k}')">${lb} ${n}</button>`;

  const body = rows.length ? rows.map((v,i)=>`

      ${chip('all','전체',c.all)}${chip('took','자료 담김',c.took)}

      <span style="flex:1"></span>
      <button class="ibpull" ${state.inboxPulling?'disabled':''} onclick="inboxPull()">
        ${state.inboxPulling?'가져오는 중…':'📥 지금 가져오기'}</button>
      <button class="ibpull sec" onclick="openInbox()">↻ 다시 읽기</button>
    </div>
    <table class="dt sentt"><thead><tr>
      <th class="numonly">#</th><th class="w">받은 때</th><th>보낸이</th><th>제목</th>
      <th>담김</th><th>폴더</th><th class="a"></th>
    </tr></thead><tbody>${body}</tbody></table>
    <div class="ibnote">답장·삭제는 <b>다음메일에서</b> 하십니다 — 여기 목록은 서버가 본 기록입니다.
      두 곳에서 지우면 어느 쪽이 맞는지 알 수 없습니다.</div>`;
}

/* 30분을 기다리지 않고 서버에 지금 보라고 시킨다 — 급여데이터함의 그 단추와 같은 함수다. */
function inboxPull(){
  if(state.inboxPulling) return;
  state.inboxPulling = true; renderMailPage();
  const done = (msg)=>{ state.inboxPulling=false; loadInbox(()=>{ renderPCSide(); renderMailPage(); if(msg) toast(msg); }); };
  const u = firebase.auth().currentUser;
  if(!u){ state.inboxPulling=false; renderMailPage(); toast('로그인이 필요합니다'); return; }
  u.getIdToken().then(tok=>fetch(
    'https://asia-northeast3-pureun-erp.cloudfunctions.net/pullPaydataMail',
    { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+tok }, body:'{}' }
  )).then(r=>r.json().catch(()=>({})).then(j=>{
    if(!j.ok) throw new Error(j.error||'가져오지 못했습니다');
    done('새 메일 '+Number(j.looked||0)+'통을 보고 '+Number(j.took||0)+'건을 담았습니다.');
  })).catch(e=>{
    state.inboxPulling=false; renderMailPage();
    toast('가져오지 못했습니다 — '+((e&&e.message)||e));
  });
}

function loadSentBox(cb){

    .then(s=>{ state.sentBox = s.val()||{}; if(cb) cb(); })

/* 지금 화면에 보일 보낸 메일 — 걸러보기·찾기를 다 거친 결과.
   그리는 곳과 「골라서 한 번에」가 **같은 목록**을 봐야 한다. 따로 세면 개수가 어긋난다. */
function sentVisibleRows(){

    .map(([id,v])=>Object.assign({id}, v||{}))
    .filter(v=>v.at)
    .sort((a,b)=>(b.at||0)-(a.at||0));
  if(state.sentMine) rows = rows.filter(v=>String(v.by||'').toLowerCase()===String(myEmail||'').toLowerCase());
  /* 왼쪽 메뉴에서 고른 갈래·보낸 사람 */
  if(state.sentBy) rows = rows.filter(v=>String(v.by||'')===state.sentBy);
  if(state.sentCat){
    const catOf = v => { const ids=(v.ids||[]).filter(id=>_matMeta[id]);
      return ids.length ? matCat(_matMeta[ids[0]]) : ''; };
    rows = rows.filter(v=> state.sentCat==='__none' ? !catOf(v) : catOf(v)===state.sentCat);

  if(q) rows = rows.filter(v=>[v.to,v.subject,(v.names||[]).join(' '),v.by,v.toName]
    .some(x=>String(x||'').toLowerCase().replace(/\s/g,'').includes(q)));
  return rows;
}

      <div class="matsearch"><input value="${esc(state.sentQ||'')}"

/* 같은 내용으로 다시 쓰기 — 받는사람·제목·본문·자료를 그대로 옮겨 쓰기 화면을 연다.
   ⚠ 💻 내 PC 파일은 옮기지 못한다. 그 파일은 서버에 두지 않았다(이번 편지에만 붙는 파일). */
