    .filter(it=> !String(it.name||'').trim() && !String(it.company||'').trim()
              && !String(it.mobile||'').trim() && !String(it.tel||'').trim()
              && !String(it.companyTel||'').trim() && !String(it.email||'').trim());
  if (!targets.length) return toast('빈 명함이 없습니다');
  if (!confirm(`이름·회사·전화·이메일이 모두 없는 빈 명함 ${targets.length}건을 삭제할까요?`)) return;
  targets.forEach(it=>Store.del(it.id));
  toast(`빈 명함 ${targets.length}건을 삭제했습니다`);
}

/* 회사주소 앞 시·도 추출 (지역 필터용) */
function regionOf(it){
  const a=String(it.companyAddr||it.address||'').trim(); if(!a) return '';
  const m=a.match(/^(서울특별시|부산광역시|대구광역시|인천광역시|광주광역시|대전광역시|울산광역시|세종특별자치시|제주특별자치도|강원특별자치도|충청북도|충청남도|전라북도|전라남도|경상북도|경상남도|경기도|서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)/);
  if(!m) return '';
  const map={'서울특별시':'서울','부산광역시':'부산','대구광역시':'대구','인천광역시':'인천','광주광역시':'광주','대전광역시':'대전','울산광역시':'울산','세종특별자치시':'세종','경기도':'경기','강원특별자치도':'강원','충청북도':'충북','충청남도':'충남','전라북도':'전북','전라남도':'전남','경상북도':'경북','경상남도':'경남','제주특별자치도':'제주'};
  return map[m[1]]||m[1];
}
function listItems(){
  const q = $('search').value.trim().toLowerCase();
  const qc = q.replace(/\s/g,'');
  const isCho = qc && /^[ㄱ-ㅎ]+$/.test(qc);   /* 초성 검색: ㅎㄱㄷ → 홍길동 */
  const arr = Object.values(allItems())
    .filter(it => it.kind===state.tab)
    .filter(it => {
      if (state.group==='all') return true;
      return (it.group||'')===state.group;
    })
    .filter(it => state.owner==='all' || (it.owner||'')===state.owner)
    /* 담는 탭(직접 골라 담은 탭)이 켜져 있으면 그 탭에 담긴 명함만 */
    .filter(it => !state.vtab || (it.vtabs||[]).indexOf(state.vtab)>=0)
    .filter(it => {
      /* 잠긴 폴더(세션에서 해제 안 된)의 명함은 숨김. 단 그 폴더를 직접 열고 있으면 보임 */
      const gid = it.group||'';
      if (!gid) return true;
      const g = state.groups[gid];
      if (!g || !g.locked) return true;
      if (!canSeeGroup(g)) return false;                        /* 남의 잠긴 폴더 → 아예 안 보임 */
      if (state.unlocked && state.unlocked[gid]) return true;   /* 세션에서 풀림 */
      if (state.group===gid) return true;                       /* 그 폴더를 직접 보는 중 */
      return false;
    })
    .filter(it => !state.region || regionOf(it)===state.region)
    .filter(it => !q || [it.name,it.company,it.title,it.dept,it.mobile,it.tel,it.email,
                         it.ceo,it.bizno,it.address].some(v => String(v||'').toLowerCase().includes(q)
                         || (digits(q).length>=3 && digits(v).includes(digits(q))))
                || (isCho && [it.name,it.company,it.ceo].some(v=>chosung(v).replace(/\s/g,'').includes(qc))))
    /* 칸별 검색 필터 */
    .filter(it => {
      const f = state.colFilter || {};
      const has = (key, val) => !val || String(it[key]||'').toLowerCase().includes(String(val).toLowerCase());
      if (f.name && !(String(it.name||'').toLowerCase().includes(f.name.toLowerCase()))) return false;
      if (f.company && !(String(it.company||'').toLowerCase().includes(f.company.toLowerCase()))) return false;
      if (f.phone){ const d=digits(f.phone); if(!(digits(it.mobile).includes(d)||digits(it.tel).includes(d)||digits(it.companyTel).includes(d))) return false; }
      if (f.email && !has('email', f.email)) return false;
      return true;
    })
    /* 조건 필터: 전화있음 / 이메일있음 / 중복만 */
    .filter(it => {
      if (state.onlyPhone && !(it.mobile||it.tel||it.companyTel)) return false;
      if (state.onlyEmail && !it.email) return false;
      if (state.onlyIncomplete && (it.mobile||it.tel||it.companyTel) && it.email) return false;
      if (state.onlyPrivate && it.scope!=='private') return false;
      /* ERP 연결 필터: 자문/급여/노조/기금(유형) · linked(연결만) · none(미연결) */
      if (state.erpFilter){
        const m = ErpMatch.match(it);
        if (state.erpFilter==='none'){ if(m) return false; }
        else if (state.erpFilter==='linked'){ if(!m) return false; }
        else { if(!m || (m.type||'')!==state.erpFilter) return false; }
      }
      return true;
    });
  /* 중복만 보기 */
  let result = arr;
  if (state.onlyDup){
    const kc={}; Object.values(state.items).filter(x=>x.kind===state.tab)
      .forEach(x=>itemKeys(x).forEach(k=>kc[k]=(kc[k]||0)+1));
    result = arr.filter(it=>itemKeys(it).some(k=>kc[k]>1));
  }
  /* 헤더 클릭 정렬(PC) 우선, 없으면 기존 등록일/이름순 */
  if (state.sortKey){
    const dir = state.sortDir==='asc' ? 1 : -1;
    const val = (it)=>{
      switch(state.sortKey){
        case 'name': return it.name||it.company||'';
        case 'company': return it.company||'';
        case 'phone': return digits(it.mobile||it.tel||'');
        case 'date': return it.createdAt||0;
        default: return '';
      }
    };
    result.sort((a,b)=>{ const x=val(a),y=val(b);
      if (typeof x==='number') return (x-y)*dir;
      return String(x).localeCompare(String(y),'ko')*dir; });
  }
  else if (state.sort==='name')
    result.sort((a,b)=>String(a.name||a.company||'').localeCompare(String(b.name||b.company||''),'ko'));
  else result.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return result;
}

/* ── 렌더링 ── */
/* _quiet: 썸네일 옮기기처럼 items 를 수십 번 고치는 작업 중에는 다시 그리지 않는다
   (4,400줄을 배치마다 새로 그리면 몇 초씩 멈춘다) */
let _quiet = false;
function render(){ if(_quiet) return; saveLastScreen(); renderSubbar(); renderSidebar(); renderList(); }

/* ══════ 마지막 본 화면 (대표 지시 2026-08-10) ══════
   "로그아웃 또는 다른 화면을 보다가 다시 명함·메일로 들어오면 마지막 들어왔던
    화면으로 기록해서 들어오게 해달라. 그리고 로그인 하는 사람마다 다를 텐데
    그 사람마다 각자 마지막 본 화면으로 보게 해라."

   ⚠ **사람마다 따로** 적는다. 한 PC를 여러 사람이 쓰므로 열쇠에 계정을 넣지
     않으면 앞사람이 보던 화면이 뒷사람에게 열린다.
   ⚠ 이 기기에만 적는다(localStorage). 화면 취향은 자리마다 다르고, 서버에 두면
     사무실 PC에서 보던 것이 폰에서 열린다.
   ⚠ 누구인지 모르는 동안에는 **적지도 읽지도 않는다.** 로그인 전 render 가
     먼저 도는데, 거기서 적으면 'anon' 자리에 남아 다음 사람에게 샌다. */
const LASTV_PREFIX = 'pucards_lastscreen_';
function lastScreenKey(){ return LASTV_PREFIX + (myUid || myEmail || ''); }
let _lastScreenSig = '';
function saveLastScreen(){
  if(!myUid && !myEmail) return;
  const s = { view: state.view || 'list', tab: state.tab || 'card', mail: state.mailSent || false };
  const sig = JSON.stringify(s);
  if(sig === _lastScreenSig) return;   // 바뀔 때만 적는다 — render 는 수시로 돈다
  _lastScreenSig = sig;
  try{ localStorage.setItem(lastScreenKey(), sig); }catch(_){}
}

/* 들어올 때 한 번만. 화면을 직접 그리지 않고 **사람이 누르는 것과 같은 함수**를
   부른다 — 그래야 그 화면에 필요한 자료(자료함·보낸 메일 등)도 함께 딸려 온다. */
let _lastScreenDone = false;
function restoreLastScreen(){
  if(_lastScreenDone) return;
  if(!myUid && !myEmail) return;       // 아직 누구인지 모른다 — 다음 기회에
  _lastScreenDone = true;
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(lastScreenKey()) || 'null'); }catch(_){}
  if(!s || !s.view) return;            // 처음 오신 분 — 기본 화면 그대로
  if(s.view === 'mat'){ openMatPage(); return; }
  if(s.view === 'mail'){
    if(s.mail === 'sched') openSchedBox();
    else if(s.mail) openSentBox();
    else openMailPage();
    return;
  }
  /* 목록 — 명함/사업자 중 마지막에 보던 쪽 */
  if(s.tab && s.tab !== state.tab) switchTab(s.tab);
}

/* 개인 창고 폴더도 이름이 나와야 한다 — allGroups 로 봐야 제목이 '전체'로 뭉개지지 않는다 */
function groupName(id){ return id==='all' ? '전체' : (id==='' ? '미분류' : (allGroups()[id]?.name || '전체')); }

function renderSubbar(){
  const n = listItems().length;
  $('groupBtn').innerHTML = `${esc(groupName(state.group))} (${n.toLocaleString()}) <span class="v">▼</span>`;
}

function renderSidebar(){
  const all = Object.values(state.items).filter(it=>it.kind===state.tab);
  const cnt = g => all.filter(it=>(it.group||'')===g).length;
  const groups = Object.values(state.groups).filter(canSeeGroup).sort((a,b)=>(a.order||0)-(b.order||0));
  let h = `<div class="grouphead"><b>그룹</b><button class="iconbtn" onclick="addGroup()">＋</button></div>`;
  h += gItem('all','📂 전체', all.length);
  h += gItem('','📁 미분류', cnt(''));
  groups.forEach(g => h += gItem(g.id,'📁 '+esc(g.name), cnt(g.id), true));
  $('sidebar').innerHTML = h;
}
function gItem(id,label,n,custom){
  const on = state.group===id ? 'on':'';
  return `<div class="gitem ${on}" onclick="state.group='${id}';render()"
    ondragover="event.preventDefault();this.classList.add('dropover')"
    ondragleave="this.classList.remove('dropover')"
    ondrop="onGroupDrop(event,'${id}')"
    ${custom?`oncontextmenu="event.preventDefault();groupMenu('${id}')"`:''}>
    ${label}<span class="cnt">${n}</span></div>`;
}
function addGroup(){ const name=prompt('새 그룹 이름'); if(!name||!name.trim()) return;
  Store.putGroup({id:uid(), name:name.trim(), order:Date.now()}); }
function groupMenu(id){ const g=state.groups[id]; if(!g) return;
  const name=prompt('그룹 이름 수정 (비우고 확인하면 삭제)', g.name);
  if(name===null) return;
  if(!name.trim()){ if(confirm(`'${g.name}' 그룹을 삭제할까요? (항목은 미분류로 이동)`)) Store.delGroup(id); }
  else { g.name=name.trim(); Store.putGroup(g); } }

/* 모바일: 그룹 선택 시트 (리멤버의 '전체 ∨' 역할) */
function openGroupSheet(){
  const all = Object.values(state.items).filter(it=>it.kind===state.tab);
  const cnt = g => all.filter(it=>(it.group||'')===g).length;
  const groups = Object.values(state.groups).filter(canSeeGroup).sort((a,b)=>(a.order||0)-(b.order||0));
  let h = `<div class="mhead"><b>그룹 선택</b><button class="iconbtn" onclick="groupSheetBg.classList.remove('open')">✕</button></div>`;
  const mk=(id,label,n)=>`<button class="sheetbtn" onclick="onGroupChoice('${id}')">
     ${state.group===id?'✅':'📁'} ${label}<span style="margin-left:auto;color:var(--sub);font-size:13px">${n}</span></button>`;
  h += mk('all','전체',all.length) + mk('','미분류',cnt(''));
  groups.forEach(g=> h += mk(g.id, esc(g.name), cnt(g.id)));
  h += `<button class="sheetbtn" style="color:var(--orange)" onclick="groupSheetBg.classList.remove('open');addGroup()">＋ 새 그룹 만들기</button>`;
  if (selPick) h = h.replace('그룹 선택', '이동할 그룹 선택');
  $('groupSheetM').innerHTML = h; $('groupSheetBg').classList.add('open');
}
function onGroupChoice(id){
  $('groupSheetBg').classList.remove('open');
  if (selPick){
    selPick=false;
    const gid = id==='all' ? '' : id;
    Object.keys(state.sel).forEach(sid=>{ const it=state.items[sid]; if(it){ it.group=gid; Store.put(it); } });
    toast(Object.keys(state.sel).length+'개 항목을 이동했습니다');
    state.sel={}; renderSelbar(); renderList();
  } else { state.group=id; render(); }
}

function renderList(){
  const items = listItems();
  if (!items.length){
    $('list').innerHTML = `<div class="empty">등록된 항목이 없습니다.<br><br>
      주황 <b style="color:var(--orange)">＋</b> 버튼으로 촬영하거나,<br>
      PC에서는 이미지·PDF를 화면에 끌어다 놓거나<br>카톡 이미지 복사 후 <b>Ctrl+V</b> 하면 자동 등록됩니다.</div>`;
    return;
  }
  function rowHtml(it){
    const isCard = state.tab==='card';
    const name = isCard ? (it.name || it.company || '(이름 없음)') : (it.company||'(상호 없음)');
    const l1 = isCard ? [it.title,it.dept].filter(Boolean).join(' / ') : (it.ceo ? '대표자 '+it.ceo : '');
    const l2 = isCard ? (it.company||'') : fmtBizno(it.bizno);
    /* 썸네일 상태 세 가지를 가른다 —
       ① it.thumb 에 값이 있다 = 옛 자료(아직 안 옮김) 또는 이미 받아 둔 것 → 바로 그린다
       ② it.thumb 이 빈 문자열 = 사진 없는 명함 → 첫 글자만, 받으러 가지 않는다
       ③ it.thumb 이 아예 없다 = 옮겨진 자료 → 화면에 들어올 때 받는다 */
    let thumbSrc = '', needFetch = false;
    if (it.thumb) thumbSrc = it.thumb;
    else if (it.thumb === '') thumbSrc = '';
    else if (Store.thumbCache[it.id] !== undefined) thumbSrc = Store.thumbCache[it.id];
    else needFetch = true;
    const th = thumbSrc ? `<img src="${thumbSrc}" loading="lazy">` : esc(name.charAt(0));
    const click = state.selMode ? `toggleSel('${it.id}')` : `openDetail('${it.id}')`;
    return `<div class="row" draggable="${!state.selMode}"
      ondragstart="onRowDrag(event,'${it.id}')" ondragend="this.classList.remove('dragging')"
      onclick="${click}">
      ${state.selMode?`<div class="selmark">${state.sel[it.id]?'✅':'⚪'}</div>`:''}
      <div class="rowmain"><div class="nm">${it.fav?'<span class="fav">⭐</span>':''}${esc(name)}${it.scope==='private'?'<span class="pv">개인</span>':''}</div>
        ${(function(){var e=ErpMatch.label(it);return e?`<div class="erpmgr">🏢 푸른담당 ${esc(e)}</div>`:'';})()}
        ${l1?`<div class="l1">${esc(l1)}</div>`:''}
        ${l2?`<div class="l2">${esc(l2)}</div>`:''}</div>
      <div class="thumb"${needFetch?` data-th="${it.id}"`:''}>${th}</div></div>`;
  }
  let h='', lastDate='';
  const favs=items.filter(i=>i.fav), rest=items.filter(i=>!i.fav);
  if (favs.length){ h+=`<div class="datehead">⭐ 즐겨찾기</div>`; favs.forEach(it=>h+=rowHtml(it)); }
  rest.forEach(it=>{
    if (state.sort==='date'){
      const d = fmtDate(it.createdAt||it.updatedAt);
      if (d!==lastDate){ h += `<div class="datehead">${d}</div>`; lastDate=d; }
    }
    h += rowHtml(it);
  });
  $('list').innerHTML = h;
  thumbWatch();
}

/* ── 화면에 들어온 명함만 썸네일을 받는다 ──
   4,400장을 한꺼번에 받으면 열 때마다 약 90MB. 보이는 것만 받으면 한 화면당 1MB 남짓이다.
   미리 300px 앞에서 받아 두어 내리는 도중에 빈 칸이 보이지 않게 한다. */
let _thObs = null;
function thumbFill(el){
  const id = el.getAttribute('data-th'); if(!id) return;
  el.removeAttribute('data-th');            /* 두 번 받지 않게 먼저 뗀다 */
  Store.getThumb(id).then(t=>{
    if(!t) return;                          /* 사진 없는 명함 — 첫 글자 그대로 둔다 */
    const it = state.items[id];
    if(it) it.thumb = t;                    /* 상세·확대·끌기 등 나머지 화면이 그대로 쓰게 되꽂는다 */
    if(el.isConnected) el.innerHTML = `<img src="${t}" loading="lazy">`;
  }).catch(()=>{});
}
let _thSeen = false, _thFallback = null;
function thumbWatch(){
  const els = document.querySelectorAll('#list .thumb[data-th]');
  if(!els.length) return;
  if(!('IntersectionObserver' in window)){ els.forEach(thumbFill); return; }
  if(!_thObs) _thObs = new IntersectionObserver(entries=>{
    _thSeen = true;                         /* 관찰기가 살아 있다는 증거 */
    entries.forEach(e=>{ if(e.isIntersecting){ _thObs.unobserve(e.target); thumbFill(e.target); } });
  }, { rootMargin:'300px 0px' });
  els.forEach(el=>_thObs.observe(el));
  /* 안전망 — 관찰기가 한 번도 안 알려 주면(창이 숨겨져 있거나 배치가 특이하면)
     앞쪽 30장만이라도 채운다. 빈 칸만 보이는 화면이 되는 것보다 낫다. */
  clearTimeout(_thFallback);
  _thFallback = setTimeout(function(){
    if(_thSeen) return;
    Array.prototype.slice.call(document.querySelectorAll('#list .thumb[data-th]'), 0, 30).forEach(thumbFill);
  }, 1500);
}
/* 상세·수정 화면은 썸네일이 있어야 사진 자리가 만들어진다(`it.thumb ? <img> : ''`).
   목록에서 아직 안 받은 명함도 검색·바로가기로 열 수 있으므로 여기서 한 번 챙긴다.
   앞·뒷면 두 장을 한 번에 받아 두면 그 뒤 화면들은 손댈 것이 없다. */
function ensureThumbs(id){
  const it = state.items[id];
  if(!it || it.thumb !== undefined) return Promise.resolve(it);
  return Promise.all([Store.getThumb(id), Store.getThumb(id+'_b')])
    .then(([a,b])=>{ it.thumb=a||''; it.thumb2=b||''; return it; })
    .catch(()=>{ it.thumb=it.thumb||''; return it; });
}

/* ══════ 한 번만 실행: 실시간DB 에 있는 원본 사진을 창고로 옮긴다 ══════
   대표 결정 2026-08-09 — 명함 4,400장 약 1.7GB 가 무료 한도(1GB)를 이것 하나로
   넘겨 데이터베이스가 멈출 뻔했다. 창고로 옮기면 0.1GB 로 떨어진다.

   ⚠ 순서를 지킨다: **올리고 → 되읽어 확인하고 → 그제야 지운다.**
      확인을 건너뛰고 지우면 창고에 안 올라간 사진이 영영 사라진다. 명함 사진은
      다시 찍을 수 없는 것이 많다(그 사람을 또 만나야 한다).
   ⚠ 개인 폴더 명함은 건드리지 않는다 — 창고 규칙에 그 자리가 없다(Store._inBucket).
   ⚠ 한 장씩 천천히 한다. 몰아서 던지면 창고가 막고, 실패한 것이 어느 장인지 모른다.
      중간에 끊겨도 다시 실행하면 **남은 것만** 이어서 한다(이미 옮긴 것은 건너뛴다). */
window.pucardsMovePhotosToStorage = async function(){
  if(Store.mode!=='firebase'){ console.log('실시간 공유 모드에서만 됩니다'); return; }
  if(typeof firebase==='undefined' || !firebase.storage){ console.log('창고를 쓸 수 없습니다 — 새로고침 후 다시'); return; }

  console.log('[명함첩] 실시간DB 에서 사진 목록을 읽는 중… (잠시 걸립니다)');
  let snap;
  try { snap = await Store.db.ref(`${DB_ROOT}/photos`).once('value'); }
  catch(e){ console.log('목록을 읽지 못했습니다: ' + (e && e.message)); return; }
  const all = snap.val() || {};
  const ids = Object.keys(all);
  if(!ids.length){ console.log('옮길 사진이 없습니다 — 이미 끝났습니다.'); toast('사진 옮기기 — 할 것 없음'); return; }

  const totalMB = (ids.reduce((s,k)=>s+String(all[k]||'').length,0)/1048576).toFixed(1);
  if(!confirm(`명함 사진 ${ids.length}장(약 ${totalMB}MB)을 파일 창고로 옮깁니다.\n\n` +
              `· 한 장씩 올리고 확인한 뒤에 실시간DB 에서 지웁니다\n` +
              `· 창을 닫지 마세요. 끊겨도 다시 실행하면 이어서 합니다\n\n계속할까요?`)) return;

  console.log(`[명함첩] ${ids.length}장(약 ${totalMB}MB) 옮기기 시작 — 창을 닫지 마세요`);
  _quiet = true;
  let done=0, skipped=0, failed=0;
  const bad = [];
  try {
    for(const id of ids){
      const dataUrl = all[id];
      if(!dataUrl || String(dataUrl).indexOf('data:')!==0){ skipped++; continue; }  // 빈 값·깨진 값은 두고 본다
      try {
        await Store._putToBucket(id, dataUrl);
        /* 되읽어 **실제로 들어갔는지** 본다. 여기서 걸리면 지우지 않는다. */
        const back = await Store._fetchFromBucket(id);
        if(!back || back.indexOf('data:')!==0) throw new Error('되읽기 실패');
        await Store.db.ref(`${DB_ROOT}/photos/${id}`).remove();
        delete Store.photoCache[id];
        done++;
      } catch(e){
        failed++; bad.push(id);
        console.warn(`  ✗ ${id} — ${e && e.message} (실시간DB 에 그대로 둡니다)`);
      }
      if((done+failed+skipped) % 100 === 0) console.log(`  ${done+failed+skipped} / ${ids.length} (옮김 ${done} · 실패 ${failed})`);
    }
  } finally { _quiet = false; }

  console.log(`[명함첩] 끝 — 옮김 ${done}장 · 건너뜀 ${skipped}장 · 실패 ${failed}장`);
  if(failed) console.log('  실패한 것은 실시간DB 에 그대로 있습니다. 다시 실행하면 재시도합니다:', bad.slice(0,20));
  toast(`사진 ${done}장을 창고로 옮겼습니다${failed?` (실패 ${failed}장)`:''} — 새로고침해 주세요`);
};

/* ── 한 번만 실행: 옛 명함의 썸네일을 items 밖(thumbs/)으로 옮긴다 ──
   옮기기 전에는 items 안에 썸네일이 그대로 있어 여전히 다 내려받는다.
   50장씩 원자적으로(다중경로 update) 옮기므로 도중에 끊겨도 다시 실행하면 이어서 한다.
   값은 시작할 때 한 번 떠 두고 쓴다 — 도중에 실시간 구독이 state.items 를 갈아끼우기 때문. */
window.pucardsMoveThumbs = async function(){
  if(Store.mode!=='firebase'){ console.log('실시간 공유 모드에서만 됩니다'); return; }
  const src = state.items;
  const jobs = [];
  Object.keys(src).forEach(id=>{
    const it = src[id]; if(!it) return;
    if(it.thumb)  jobs.push({ id, tid:id,        field:'thumb',  v:it.thumb  });
    if(it.thumb2) jobs.push({ id, tid:id+'_b',   field:'thumb2', v:it.thumb2 });
  });
  if(!jobs.length){ console.log('옮길 썸네일이 없습니다 — 이미 끝났습니다.'); toast('썸네일 옮기기 — 할 것 없음'); return; }
  const totalMB = (jobs.reduce((s,j)=>s+j.v.length,0)/1048576).toFixed(1);
  console.log(`[명함첩] 썸네일 ${jobs.length}장(약 ${totalMB}MB) 옮기기 시작 — 창을 닫지 마세요`);
  _quiet = true;
  let done = 0;
  try {
    for(let i=0;i<jobs.length;i+=50){
      const u = {};
      jobs.slice(i,i+50).forEach(j=>{
        u[`${DB_ROOT}/thumbs/${j.tid}`] = j.v;
        u[`${DB_ROOT}/items/${j.id}/${j.field}`] = null;
      });
      await Store.db.ref().update(u);
      done += Object.keys(u).length/2;
      if(done % 500 < 50) console.log(`  ${done} / ${jobs.length}`);
    }
    console.log(`[명함첩] 끝 — ${done}장, 약 ${totalMB}MB 를 items 밖으로 옮겼습니다. 새로고침하세요.`);
    toast(`썸네일 ${done}장 옮김 — 새로고침해 주세요`);
  } catch(e){
    console.log(`[명함첩] ${done}장까지 옮기고 멈췄습니다: ${e && e.message} — 다시 실행하면 이어서 합니다`);
    toast('썸네일 옮기기 중단 — 다시 실행해 주세요');
  } finally { _quiet = false; render(); }
};

/* ── 한 번만 실행: 이미 쌓인 원본 사진을 800px 로 줄인다 ──
   원본은 1600px 로 담겨 있어 장당 약 0.4MB × 4,400장 ≈ 1.7GB — 무료 저장 한도(1GB)를 이것 하나로 넘긴다.
   파일 창고를 못 쓰는 계정이라(신규 버킷은 유료 전용) 줄이는 것 말고는 길이 없다.
   ⚠ 화질은 되돌릴 수 없다. 한 장씩 받아 다시 만들어 덮어쓴다.
   이미 800px 이하면 건드리지 않으므로 중간에 끊겨도 다시 실행하면 이어서 한다. */
window.pucardsShrinkPhotos = async function(){
  if(Store.mode!=='firebase'){ console.log('실시간 공유 모드에서만 됩니다'); return; }
  /* 되돌릴 수 없는 작업이라 한 번 묻는다.
     유료(Blaze)로 올려 사진을 파일 창고로 옮길 생각이면 **깎을 이유가 없다** —
     창고로 가면 원본 화질 그대로 옮길 수 있다. 그 전에 깎으면 원본이 영영 사라진다. */
  const yes = confirm(
    '명함 사진을 800px(사업자등록증은 1400px)로 줄입니다.\n\n' +
    '⚠ 화질은 되돌릴 수 없습니다. 원본 1600px 이 사라집니다.\n\n' +
    '유료 요금제로 올려 파일 창고를 쓸 계획이라면 지금 줄이지 마세요 —\n' +
    '창고로 옮기면 원본 화질 그대로 용량 문제가 해결됩니다.\n\n' +
    '그래도 지금 줄이시겠습니까?');
  if(!yes){ console.log('취소했습니다 — 사진은 그대로입니다.'); return; }
  const ids = [];
  Object.keys(state.items).forEach(id=>{ ids.push(id); ids.push(id+'_b'); });
  console.log(`[명함첩] 사진 줄이기 시작 — 확인할 자리 ${ids.length}곳. 오래 걸립니다(수 분). 창을 닫지 마세요.`);
  let looked=0, shrunk=0, before=0, after=0, err=0;
  for(const pid of ids){
    looked++;
    try{
      const snap = await Store.db.ref(`${DB_ROOT}/photos/${pid}`).once('value');
      const cur = snap.val();
      if(!cur) continue;
      const small = await shrinkForStore(cur, photoKeepMax(pid));   /* 사업자등록증은 덜 줄인다 */
      if(small.length >= cur.length) continue;          /* 이미 작다 — 쓰지 않는다 */
      await Store.db.ref(`${DB_ROOT}/photos/${pid}`).set(small);
      Store.photoCache[pid] = small;
      shrunk++; before += cur.length; after += small.length;
    }catch(e){ err++; }
    if(looked % 200 === 0){
      console.log(`  ${looked} / ${ids.length} 확인 · ${shrunk}장 줄임 · ` +
        `${(before/1048576).toFixed(0)}MB → ${(after/1048576).toFixed(0)}MB`);
      toast(`사진 줄이는 중… ${looked}/${ids.length}`, 4000);
    }
  }
  const saved = ((before-after)/1048576).toFixed(0);
  console.log(`[명함첩] 끝 — ${shrunk}장을 줄여 약 ${saved}MB 를 비웠습니다.` + (err?` (실패 ${err}건)`:''));
  toast(`사진 ${shrunk}장 줄임 — 약 ${saved}MB 비움`);
};

/* ── ✎ 일괄 선택 모드 ── */
function toggleSelMode(){
  state.selMode=!state.selMode; state.sel={};
  $('selLabel').textContent = state.selMode ? '완료' : '편집';
  $('fab').style.display = state.selMode ? 'none' : '';
  renderSelbar(); renderList();
}
function toggleSel(id){ if(state.sel[id]) delete state.sel[id]; else state.sel[id]=1;
  renderSelbar(); render(); }
/* 현재 페이지의 항목을 한 번에 선택/해제 */
function toggleSelectAll(checked){
  const size = state.pageSize || 100;
  const items = listItems();
  const start = state.page*size;
  const pageItems = items.slice(start, start+size);
  pageItems.forEach(it=>{ if(checked) state.sel[it.id]=1; else delete state.sel[it.id]; });
  renderSelbar(); render();
}
/* ── 찾은 결과 전체를 한 번에 다루기 ──
   맨 위 체크는 '이 페이지'만 고른다. 312건을 찾아 놓고도 100건씩 네 번 지워야 했다.
   그렇다고 아무 조건 없이 6,275건을 한 번에 고르게 하면 사고가 난다 —
   검색·폴더·탭·칸별 필터 가운데 하나라도 걸려 '좁혀진 상태'에서만 열어 준다. */
function listNarrowed(){
  const q = ($('search') && $('search').value.trim()) || ($('pcSearch') && $('pcSearch').value.trim()) || '';
  if(q) return true;
  if(state.group && state.group!=='all') return true;
  if(state.vtab) return true;
  if(state.erpFilter) return true;
  if(state.owner && state.owner!=='all') return true;
  if(state.onlyPhone||state.onlyEmail||state.onlyDup||state.onlyIncomplete||state.onlyPrivate) return true;
  if(Object.values(state.colFilter||{}).some(v=>String(v||'').trim())) return true;
  return false;
}
/* 지금 화면에 걸린 조건을 사람 말로 — 무엇을 지우는지 알고 눌러야 한다 */
function narrowLabel(){
  const q = ($('search') && $('search').value.trim()) || ($('pcSearch') && $('pcSearch').value.trim()) || '';
  const bits = [];
  if(q) bits.push(`"${q}" 검색`);
  if(state.group && state.group!=='all'){ const g=state.groups[state.group]; if(g) bits.push(`📁 ${g.name}`); }
  if(state.vtab){ const v=(state.views||{})[state.vtab]; if(v) bits.push(`🏷 ${v.name}`); }
  if(state.erpFilter) bits.push(state.erpFilter);
  if(state.onlyIncomplete) bits.push('정보부족');
  if(state.onlyPrivate) bits.push('개인');
  return bits.join(' · ') || '현재 조건';
}
function selectAllMatching(){
  if(!listNarrowed()) return toast('먼저 검색하거나 폴더를 골라 범위를 좁혀 주세요',5000);
  const items = listItems();
  items.forEach(it=>{ state.sel[it.id]=1; });
  toast(`${items.length.toLocaleString()}건을 모두 선택했습니다 — ${narrowLabel()}`,5000);
  renderSelbar(); render();
}
function renderSelbar(){
  const bar=$('selbar');
  if (!state.selMode){ bar.style.display='none'; return; }
  const n=Object.keys(state.sel).length;
  bar.style.display='flex';
  bar.innerHTML=`<span style="font-weight:700">${n}개 선택</span><div style="flex:1"></div>
    <button class="btn ghost" onclick="setSelScope('private')">🔒 개인</button>
    <button class="btn ghost" onclick="setSelScope('shared')">공용</button>
    <button class="btn ghost" onclick="selPickGroup()">📁 그룹 이동</button>
    <button class="btn danger" onclick="delSel()">삭제</button>`;
}
function setSelScope(scope){
  const ids=Object.keys(state.sel);
  if(!ids.length) return toast('명함을 먼저 선택하세요');
  ids.forEach(id=>{ const it=state.items[id]; if(it){ it.scope=scope; Store.put(it); } });
  toast(ids.length+'개 명함을 '+(scope==='private'?'개인':'공용')+'으로 지정했습니다');
  state.sel={}; renderSelbar(); renderList();
}
let selPick=false;
function selPickGroup(){
  if(!Object.keys(state.sel).length) return toast('항목을 먼저 선택하세요');
  /* 현재 탭의 폴더만 골라 이동 (계층 들여쓰기 표시) */
  const groups = Object.values(state.groups).filter(g=>(g.kind||'card')===state.tab && canSeeGroup(g));
  const children = pid => groups.filter(g=>(g.parent||'')===pid).sort((a,b)=>(a.order||0)-(b.order||0));
  let opts = `<div class="movefolder" onclick="moveSelTo('')"><span class="mfic">📭</span> 미분류</div>`;
  const walk=(pid,depth)=>{ children(pid).forEach(g=>{
    opts += `<div class="movefolder" style="padding-left:${16+depth*18}px" onclick="moveSelTo('${g.id}')"><span class="mfic">📁</span> ${esc(g.name)}</div>`;
    walk(g.id, depth+1);
  }); };
  walk('',0);
  $('folderDlg').innerHTML = `
    <div class="mhead"><b>${Object.keys(state.sel).length}개 명함을 옮길 폴더</b>
      <button class="iconbtn" onclick="folderDlgBg.classList.remove('open')">✕</button></div>
    <div style="font-size:12.5px;color:#8b98b3;padding:0 6px 10px">아래 폴더를 누르면 선택한 명함이 옮겨집니다</div>
    <div style="max-height:46vh;overflow:auto;padding:2px;display:flex;flex-direction:column;gap:6px">${opts}</div>
    <div class="mfoot"><button class="btn ghost" onclick="folderDlgBg.classList.remove('open')">취소</button></div>`;
  $('folderDlgBg').classList.add('open');
}
function moveSelTo(gid){
  Object.keys(state.sel).forEach(sid=>{ const it=state.items[sid]; if(it){ it.group=gid; Store.put(it); } });
  const n=Object.keys(state.sel).length;
  $('folderDlgBg').classList.remove('open');
  state.sel={}; renderSelbar(); render();
  toast(n+'개 명함을 폴더로 옮겼습니다');
}
/* 선택 명함 일괄 담당자 지정 */
function selPickOwner(){
  if(!Object.keys(state.sel).length) return toast('명함을 먼저 선택하세요');
  const name=prompt('선택한 명함의 담당자(직원) 이름을 입력하세요\n(비우면 담당자 해제)');
  if(name===null) return;
  const owner=name.trim();
  Object.keys(state.sel).forEach(sid=>{ const it=state.items[sid]; if(it){ it.owner=owner; Store.put(it); } });
  const n=Object.keys(state.sel).length;
  state.sel={}; renderSelbar(); render();
  toast(owner ? `${n}개 명함의 담당자를 '${owner}'로 지정했습니다` : `${n}개 명함의 담당자를 해제했습니다`);
}
/* 선택 명함 단체 복사 */
function copySelInfo(){
  const ids=Object.keys(state.sel); if(!ids.length) return toast('명함을 먼저 선택하세요');
  const lines=ids.map(id=>{ const it=state.items[id]; if(!it) return '';
    const p=[it.name, it.company, it.mobile||it.companyTel||it.tel, it.email].filter(Boolean);
    return p.join(' / ');
  }).filter(Boolean);
  const text=lines.join('\n');
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>toast(`${lines.length}건을 복사했습니다`)).catch(()=>fallbackCopy(text));
  else fallbackCopy(text);
}
/* 선택 명함 단체 메일 (이메일 있는 것만, 숨은참조).
   mailto: 주소는 약 2,000자를 넘으면 동작하지 않는다. 이메일 하나가 평균 25자쯤이라
   80명 언저리가 한계인데, 부서명이 든 긴 주소가 섞이면 더 일찍 넘친다.
   그래서 50명에서 끊고 복사로 넘긴다 — 예전에는 아무 반응 없이 실패했다. */
const MAILTO_MAX = 50;
function mailSel(){
  const ids=Object.keys(state.sel); if(!ids.length) return toast('명함을 먼저 선택하세요');
  const r = mailTargets(ids.map(id=>state.items[id]).filter(Boolean), state.mailBlock);
  if(!r.ok.length) return toast(`보낼 수 있는 주소가 없습니다 — 이메일 없음 ${r.stat.noEmail} · 수신거부 ${r.stat.blocked}`,6000);
  if(r.ok.length > MAILTO_MAX){
    toast(`주소가 많아 메일앱이 열리지 않습니다 (${r.ok.length.toLocaleString()}명).\n주소를 복사했으니 메일 쓰기창 숨은참조 칸에 붙여넣으세요`, 10000);
    return selMailCopy();
  }
  location.href = `mailto:?bcc=${encodeURIComponent(r.ok.map(x=>x.email).join(','))}`;
  toast(`📧 ${_mailStatText(r.stat)} (숨은참조)`, 6000);
}
/* 많이 지울수록 한 번 더 붙잡는다.
   찾은 결과를 통째로 고를 수 있게 된 뒤로는 엔터 한 번에 수백 건이 사라질 수 있다.
   100건이 넘으면 확인 창을 넘기지 못하게 '삭제'를 손으로 치게 한다. */
const DEL_TYPE_MIN = 100;
function delSel(){
  const ids=Object.keys(state.sel); if(!ids.length) return toast('항목을 먼저 선택하세요');
  const n = ids.length;
  if(n > DEL_TYPE_MIN){
    const ans = prompt(`${narrowLabel()} 으로 찾은 ${n.toLocaleString()}건을 삭제합니다.\n\n`

(function(){

  ['pointerup','pointerleave','pointercancel'].forEach(ev => fab.addEventListener(ev, clear));
  fab.addEventListener('contextmenu', e => e.preventDefault());   /* 길게 누를 때 뜨는 브라우저 메뉴 차단 */
  fab.addEventListener('click', e => {
    if(longFired){ longFired = false; e.preventDefault(); return; }   /* 길게 눌러 시트를 연 경우 */

<script>
/* ════════════ 파일 입력 루프: 촬영·파일·드래그·Ctrl+V → AI → 저장 ════════════ */
const fileQueue=[]; let processing=false;
function onFiles(files){ [...files].forEach(f=>fileQueue.push(f)); pumpQueue(); }
async function pumpQueue(){
  if (processing || !fileQueue.length) return;
  processing=true;
  const f=fileQueue.shift();
  try{
    toast('이미지 처리·선명 보정 중…',9000);
    let photo = await fileToImage(f);
    try{ photo = await enhance(photo); }catch(_){}
    const thumb = await makeThumb(photo);
    let pre={};
    if (geminiKey()){
      toast('🤖 AI가 정보를 읽고 있습니다…',15000);
      try{ pre = await aiExtract(photo, state.tab); }
      catch(e){ console.error(e); toast('AI 추출 실패 — 직접 입력해주세요'); }
    } else toast('AI 키가 없어 직접 입력 모드입니다 (☰ 설정에서 등록)');
    openEditor(null, {photo, thumb}, pre);
  }catch(e){ console.error(e); toast('파일을 읽을 수 없습니다'); processing=false; pumpQueue(); }
}
function queueNext(){ processing=false; pumpQueue(); }

async function fileToImage(f){
  if (f.type==='application/pdf' || /\.pdf$/i.test(f.name||'')) return pdfToImage(f);
  const url=URL.createObjectURL(f);
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  URL.revokeObjectURL(url);
  return shrink(img);
}
function shrink(img){
  /* OCR 정확도·선명도를 위해 넉넉한 해상도·화질 유지 (최대 1600px, 품질 .85) */
  const M=1600, r=Math.min(1, M/Math.max(img.width,img.height));
  const c=document.createElement('canvas');
  c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.85);
}
/* 자동 선명도·명암 보정 — 흐릿하거나 어두운 명함 글자를 또렷하게 (자동) */
function enhance(dataUrl){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const w=img.width, h=img.height;
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        const ctx=c.getContext('2d'); ctx.drawImage(img,0,0);
        const im=ctx.getImageData(0,0,w,h), d=im.data, total=w*h;
        /* 1) 자동 명암: 밝기 2~98% 구간을 0~255로 늘려 대비를 살림 */
        const hist=new Uint32Array(256);
        for(let i=0;i<d.length;i+=4){ hist[(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)|0]++; }
        const cut=total*0.02; let acc=0, lo=0, hi=255;
        for(let i=0;i<256;i++){ acc+=hist[i]; if(acc>=cut){ lo=i; break; } }
        acc=0; for(let i=255;i>=0;i--){ acc+=hist[i]; if(acc>=cut){ hi=i; break; } }
        if(hi-lo<32){ lo=0; hi=255; }
        const lut=new Uint8Array(256);
        for(let i=0;i<256;i++){ const v=(i-lo)*255/(hi-lo); lut[i]=v<0?0:v>255?255:v; }
        for(let i=0;i<d.length;i+=4){ d[i]=lut[d[i]]; d[i+1]=lut[d[i+1]]; d[i+2]=lut[d[i+2]]; }
        /* 2) 언샤프(선명): 라플라시안 가중으로 윤곽 강화 */
        const out=new Uint8ClampedArray(d), amt=0.7, W4=w*4;
        for(let y=1;y<h-1;y++){
          for(let x=1;x<w-1;x++){
            const o=(y*w+x)*4;
            for(let ch=0;ch<3;ch++){
              const p=o+ch;
              const lap=4*d[p]-d[p-4]-d[p+4]-d[p-W4]-d[p+W4];
              const v=d[p]+amt*lap;
              out[p]=v<0?0:v>255?255:v;
            }
          }
        }
        im.data.set(out); ctx.putImageData(im,0,0);
        res(c.toDataURL('image/jpeg',.9));
      }catch(e){ res(dataUrl); }   /* 실패 시 원본 그대로 */
    };
    img.onerror=()=>res(dataUrl);
    img.src=dataUrl;
  });
}
/* ── 보관용 사진 크기 ──
   실시간DB에는 사진이 '글자'로 담기므로 원본 크기가 곧바로 저장용량이 된다.
   파일 창고(Storage)는 이 계정(체험판)에서 못 쓴다 — 신규 버킷은 유료에서만 열린다.
   그래서 **읽기(OCR)에는 1600px 원본을 그대로 쓰고, 보관만 줄여서 넣는다.**

   ★ 종류마다 크기가 다르다 —
     명함은 90×50mm 라 800px 이면 약 226dpi 로 잔글씨도 읽힌다.
     사업자등록증은 A4(210×297mm)라 800px 이면 약 68dpi — 글씨를 못 읽는다.
     증빙으로 쓰는 서류라 1400px(약 120dpi)로 남긴다. 같은 값으로 줄이면 서류를 버리는 셈이다. */
const PHOTO_KEEP_MAX = 800;         // 명함
const PHOTO_KEEP_MAX_DOC = 1400;    // 사업자등록증 등 A4 서류
const PHOTO_KEEP_Q = 0.8;
/* 그 사진이 붙은 항목이 사업자등록증이면 큰 쪽을 쓴다. id 뒤의 '_b'(뒷면)는 떼고 본다. */
function photoKeepMax(photoId){
  const base = String(photoId||'').replace(/_b$/, '');
  const it = (typeof state !== 'undefined' && state.items) ? state.items[base] : null;
  return (it && it.kind === 'biz') ? PHOTO_KEEP_MAX_DOC : PHOTO_KEEP_MAX;
}
function shrinkForStore(dataUrl, max){
  const MAX = max || PHOTO_KEEP_MAX;
  return new Promise(res=>{
    if(!dataUrl || dataUrl.length < 60000) return res(dataUrl);   /* 이미 작으면 손대지 않는다 */
    const i=new Image();
    i.onload=()=>{
      const m=Math.max(i.width,i.height);
      if(m<=MAX) return res(dataUrl);
      const r=MAX/m, c=document.createElement('canvas');
      c.width=Math.round(i.width*r); c.height=Math.round(i.height*r);
      c.getContext('2d').drawImage(i,0,0,c.width,c.height);
      const out=c.toDataURL('image/jpeg',PHOTO_KEEP_Q);
      res(out.length < dataUrl.length ? out : dataUrl);           /* 되레 커지면 원본 유지 */
    };
    i.onerror=()=>res(dataUrl);
    i.src=dataUrl;
  });
}

/* 목록용 썸네일(약 5~10KB) — 목록 로딩을 가볍게 유지 */
function makeThumb(dataUrl){
  return new Promise(res=>{ const i=new Image();
    i.onload=()=>{ const M=320, r=Math.min(1, M/Math.max(i.width,i.height));
      const c=document.createElement('canvas');
      c.width=Math.round(i.width*r); c.height=Math.round(i.height*r);
      c.getContext('2d').drawImage(i,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',.65)); };
    i.onerror=()=>res(''); i.src=dataUrl; });
}
async function pdfToImage(f){
  if (!window.pdfjsLib){
    await new Promise((res,rej)=>{ const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const buf=await f.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const page=await pdf.getPage(1);
  const vp=page.getViewport({scale:2});
  const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
  await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  const img=new Image(); img.src=c.toDataURL('image/jpeg',.85);
  await new Promise(r=>img.onload=r);
  return shrink(img);
}

let dragDepth=0;
/* 창 아무 데나 파일을 떨어뜨리면 **명함 등록**으로 간다. 그런데 자료함·환경설정
   화면에서는 그 자리에 떨어뜨릴 일이 없다 — 자료를 올리려던 것이다.
   그리로 흘러가면 한글·PDF 를 명함 사진으로 읽으려다 "파일을 읽을 수 없습니다"
   가 뜬다. 목록 화면일 때만 받는다. */

window.addEventListener('dragenter',e=>{ if(cardDropOk() && [...e.dataTransfer.types].includes('Files')){ dragDepth++; $('dropov').classList.add('open'); }});
window.addEventListener('dragleave',()=>{ if(--dragDepth<=0){ dragDepth=0; $('dropov').classList.remove('open'); }});

  if(!cardDropOk()){ toast('자료함에서는 오른쪽 위 「＋ 새 자료 올리기」 자리에 놓아 주세요',6000); return; }
  if(e.dataTransfer.files.length) onFiles(e.dataTransfer.files); });
window.addEventListener('paste',e=>{

  if(imgs.length){ e.preventDefault(); onFiles(imgs.map(i=>i.getAsFile())); }
});

/* ════════════ AI 자동 추출 (Gemini) ════════════ */
async function aiExtract(dataUrl, kind){
  const key=geminiKey();
  const prompt = kind==='card'
    ? `이 명함 이미지에서 정보를 추출해 JSON으로만 답하세요. 키: name(이름), company(회사명), dept(부서), title(직책), mobile(휴대폰), tel(직통전화), fax(개인팩스), email(이메일), companyTel(회사 대표번호), companyFax(회사 팩스), companyAddr(회사 주소), website(홈페이지), address(개인 주소), memo(기타 정보). 없는 값은 빈 문자열. 전화번호는 010-1234-5678 형식. JSON 외 텍스트 금지.`
    : `이 사업자등록증 이미지에서 정보를 추출해 JSON으로만 답하세요. 키: company(상호/법인명), ceo(대표자), bizno(사업자등록번호), corpno(법인등록번호), openDate(개업연월일), bizType(업태), bizItem(종목), companyTel(대표번호), companyFax(팩스), address(사업장 소재지), memo(기타). 없는 값은 빈 문자열. JSON 외 텍스트 금지.`;
  const body={contents:[{parts:[
    {inline_data:{mime_type:'image/jpeg',data:dataUrl.split(',')[1]}},
    {text:prompt}]}]};
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`,
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('Gemini API 오류 '+r.status);
  const j=await r.json();
  const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
  return JSON.parse(t.replace(/```json|```/g,'').trim());
}

/* ════════════ 등록/수정 ════════════ */
const CARD_FIELDS=[['name','이름'],['company','회사'],['dept','부서'],['title','직책'],

  ['openDate','개업연월일'],['bizType','업태'],['bizItem','종목'],['companyTel','대표번호'],['companyFax','팩스'],

let editing=null;
function openEditor(item, photoObj, pre){

  if (item && item.id && item.thumb === undefined && !photoObj){

  }

  editing = { id:item?.id, kind,
    photo: photoObj?.photo || '', thumb: photoObj?.thumb || item?.thumb || '',
    photoDirty: !!photoObj,
    photo2:'', thumb2: item?.thumb2 || '', photoDirty2:false };
  const src = item || pre || {};
  const fields = kind==='card' ? CARD_FIELDS : BIZ_FIELDS;

  const curGroupValid = state.group && state.group!=='all' && state.groups[state.group] && (state.groups[state.group].kind||'card')===kind;
  const defGroup = (src.group!==undefined && src.group!=='') ? src.group : (!item && curGroupValid ? state.group : (src.group||''));
  const gOpts=`<option value="">미분류</option>`+groups.map(g=>
    `<option value="${g.id}" ${defGroup===g.id?'selected':''}>${esc(g.name)}</option>`).join('');
  $('editorM').innerHTML=`
    <div class="mhead"><b>${item?'수정':(kind==='card'?'명함 등록':'사업자등록증 등록')}</b>
      <button class="iconbtn" onclick="tryCloseEditor()">✕</button></div>
    <div class="edit-split">
      <div class="photo-pane">${ (editing.photo||editing.thumb)
        ? `<img src="${editing.photo||editing.thumb}" onclick="zoom('__EDIT__')">`
        : `<div style="padding:12px;color:var(--sub);font-size:13px">원본 사진 없음 —
            <button class="btn ghost" style="flex:none;padding:8px 12px" onclick="fileInput.click()">📁 사진 첨부</button></div>` }
        <div id="backPane" style="margin-top:8px">${ editing.thumb2
          ? `<img src="${editing.thumb2}" style="max-height:120px" onclick="zoom('__EDIT_B__')">`
          : `<button class="btn ghost" style="flex:none;padding:7px 12px;font-size:12.5px" onclick="backInput.click()">＋ 뒷면 사진 추가</button>` }</div></div>
      <div class="edit-fields">
        <div class="fgrid">${fh}</div>
        <div class="field"><label>그룹</label><select id="f_group">${gOpts}</select></div>
      </div>
    </div>
    <div class="mfoot">
      <button class="btn ghost" onclick="tryCloseEditor()">취소</button>
      <button class="btn primary" onclick="saveEditor()">💾 저장</button></div>`;
  $('editorBg').classList.add('open');
  /* 연 직후 값을 적어 둔다 — 바깥을 눌러 닫을 때 "고친 게 있나"를 이것과 견준다.
     고친 게 없으면 묻지 않고 바로 닫는 것이 편하고, 고쳤으면 반드시 물어야 한다. */
  editing.orig = editorSnapshot();
  if (item && !editing.photo && item.thumb){
    Store.getPhoto(item.id).then(p=>{ if(!p || !editing || editing.id!==item.id) return;
      editing.photo=p;
      const im=document.querySelector('#editorM .photo-pane img'); if(im) im.src=p; });
  }
}
function closeEditor(){ $('editorBg').classList.remove('open'); editing=null; queueNext(); }

/* ── 수정창 닫기 — 바깥을 누르거나 Esc 를 눌러도 닫힌다 ──
   대표 요청: 저장이나 ✕ 를 누르지 않고도 창을 없앨 수 있어야 한다.
   다만 고쳐 놓은 것을 말없이 버리면 안 된다 — 고친 게 있을 때만 한 번 묻는다. */
function editorSnapshot(){
  if(!editing) return '';
  const fields = editing.kind==='card' ? CARD_FIELDS : BIZ_FIELDS;
  const vals = fields.map(([k])=> ($('f_'+k) ? $('f_'+k).value : ''));
  vals.push($('f_group') ? $('f_group').value : '');
  return JSON.stringify(vals);
}
function editorDirty(){
  if(!editing) return false;
  if(editing.photoDirty || editing.photoDirty2) return true;   /* 사진을 새로 붙였다 */
  if(editing.orig === undefined) return false;
  return editorSnapshot() !== editing.orig;
}
function tryCloseEditor(){
  if(editorDirty() && !confirm('고친 내용이 저장되지 않았습니다.\n\n그냥 닫을까요?')) return;
  closeEditor();
}
/* Esc 로도 닫는다. 크게 보기(zoom)가 열려 있으면 그쪽이 먼저 닫혀야 하므로 건드리지 않는다. */
document.addEventListener('keydown', function(e){
  if(e.key!=='Escape') return;
  const zb=$('zoombg');
  if(zb && zb.classList.contains('open')) return;
  if($('editorBg') && $('editorBg').classList.contains('open')) tryCloseEditor();
});
async function onBackFile(files){
  const f=files[0]; if(!f || !editing) return;
  try{
    editing.photo2 = await fileToImage(f);
    editing.thumb2 = await makeThumb(editing.photo2);
    editing.photoDirty2 = true;
    $('backPane').innerHTML = `<img src="${editing.thumb2}" style="max-height:120px" onclick="zoom('__EDIT_B__')">`;
  }catch(e){ toast('뒷면 사진을 읽지 못했습니다'); }
}

async function saveEditor(){
  const kind=editing.kind;
  const fields = kind==='card' ? CARD_FIELDS : BIZ_FIELDS;
  const it={ id: editing.id||uid(), kind, group:$('f_group').value,
    thumb: editing.thumb || (editing.id ? (state.items[editing.id]?.thumb||'') : ''),
    thumb2: editing.thumb2 || (editing.id ? (state.items[editing.id]?.thumb2||'') : ''),
    fav: editing.id ? !!state.items[editing.id]?.fav : false,
    createdAt: editing.id ? (state.items[editing.id]?.createdAt||Date.now()) : Date.now() };
  fields.forEach(([k])=> it[k]=$('f_'+k).value.trim());
  if (kind==='card' && !it.name && !it.company) return toast('이름 또는 회사를 입력해주세요');
  if (kind==='biz' && !it.company && !it.bizno) return toast('상호 또는 사업자번호를 입력해주세요');

  if (!editing.id){
    const keyVal = kind==='card' ? digits(it.mobile) : digits(it.bizno);
    if (keyVal){
      const dup = Object.values(state.items).find(x=> x.kind===kind && x.id!==it.id &&
        (kind==='card' ? digits(x.mobile)===keyVal : digits(x.bizno)===keyVal));
      if (dup){
        const act = await dupDialog(dup, kind);
        if (act==='cancel') return;
        if (act==='merge'){ mergeInto(dup,it);
          var kmM = kind==='biz' ? PHOTO_KEEP_MAX_DOC : PHOTO_KEEP_MAX;
          if (editing.photoDirty && editing.photo) Store.putPhoto(dup.id, await shrinkForStore(editing.photo, kmM));
          if (editing.photoDirty2 && editing.photo2) Store.putPhoto(dup.id+'_b', await shrinkForStore(editing.photo2, kmM));
          $('editorBg').classList.remove('open'); editing=null;
          toast('기존 항목을 업데이트했습니다'); queueNext(); return; }
      }
    }
  }
  Store.put(it);
  var km = kind==='biz' ? PHOTO_KEEP_MAX_DOC : PHOTO_KEEP_MAX;   /* 사업자등록증은 증빙이라 덜 줄인다 */
  if (editing.photoDirty && editing.photo) Store.putPhoto(it.id, await shrinkForStore(editing.photo, km));
  if (editing.photoDirty2 && editing.photo2) Store.putPhoto(it.id+'_b', await shrinkForStore(editing.photo2, km));
  $('editorBg').classList.remove('open'); editing=null;
  toast('저장되었습니다'+(Store.mode==='firebase'?' — 전 직원 공유 완료':''));
  queueNext();
}
function mergeInto(oldIt,newIt){
  Object.keys(newIt).forEach(k=>{ if(['id','createdAt'].includes(k)) return; if(newIt[k]) oldIt[k]=newIt[k]; });
  Store.put(oldIt);
}
function dupDialog(dup,kind){
  return new Promise(res=>{
    const who = kind==='card' ? `${esc(dup.name||'')} / ${esc(dup.company||'')}` : esc(dup.company||'');
    $('dupbox').innerHTML=`
      <div class="mhead"><b>⚠️ 이미 등록되어 있습니다</b></div>
      <p style="font-size:14px;color:var(--sub);line-height:1.6">
        같은 ${kind==='card'?'전화번호':'사업자번호'}의 항목이 있습니다:<br><b style="color:var(--ink)">${who}</b></p>
      <button class="btn primary" onclick="dupPick('merge')">기존 항목을 새 정보로 업데이트</button>
      <button class="btn ghost" onclick="dupPick('new')">그래도 새로 저장</button>
      <button class="btn danger" onclick="dupPick('cancel')">취소</button>`;
    $('dupBg').classList.add('open');
    window.dupPick=a=>{ $('dupBg').classList.remove('open'); res(a); };
  });
}
</script>
<script>
/* ════════════ 상세 보기 ════════════ */

  const gname = it.group && state.groups[it.group] ? state.groups[it.group].name : '미분류';
  const acts = isCard ? `
    <div class="actrow">

      <a href="sms:${digits(it.mobile)}" class="${digits(it.mobile)?'':'off'}">💬 문자</a>
      <a href="#" onclick="openSendMaterials('${id}');return false" class="${it.email?'':'off'}">📧 메일</a>
      <a href="#" onclick="downloadVcf('${id}');return false">📇 연락처</a>
    </div>
    <button class="btn ghost" style="width:100%;margin-bottom:12px" onclick="sendToErp('${id}')">🏢 ERP 거래처로 등록</button>` : '';
    /* ⚠ 「📎 자료 보내기」를 지웠다(2026-08-10). 바로 위 「📧 메일」과 같은 함수를
       불러서, 두 개를 두면 서로 다른 일을 하는 줄 알고 헤맨다(대표 지시). */
  $('detailM').innerHTML=`
    <div class="mhead"><b>${isCard?'명함':'사업자등록증'} <span style="font-size:12px;color:var(--sub);font-weight:400">· ${esc(gname)} · ${fmtDate(it.createdAt)} 등록</span></b>
      <div><button class="iconbtn" onclick="toggleFav('${id}')" title="즐겨찾기">${it.fav?'⭐':'☆'}</button>
      <button class="iconbtn" onclick="closeDetail()">✕</button></div></div>
    ${ it.thumb ? `<img class="dphoto" id="dphoto" src="${it.thumb}" onclick="zoom('${id}')">` : '' }
    ${ it.thumb2 ? `<img class="dphoto" id="dphoto2" src="${it.thumb2}" style="margin-top:-6px" onclick="zoom('${id}_b')">` : '' }
    <div class="dname">${esc(isCard?(it.name||it.company||'(이름 없음)'):(it.company||'(상호 없음)'))}</div>
    <div class="dsub">${esc(isCard ? [it.company,it.dept,it.title].filter(Boolean).join(' · ')
                                   : [it.ceo&&('대표자 '+it.ceo), fmtBizno(it.bizno)].filter(Boolean).join(' · '))}</div>
    ${(function(){var f=ErpMatch.full(it);return f?`<div class="erpmgr-box">🏢 푸른 거래처 · ${esc(f)}</div>`:'';})()}
    ${acts}
    <div id="dSendLog">${sendLogHtml(id)}</div>
    <div class="dlist">${rows||'<div class="empty" style="padding:20px">저장된 정보가 없습니다</div>'}</div>
    <div class="mfoot">
      <button class="btn ghost" onclick="toggleScope('${id}')">${it.scope==='private'?'공용으로':'🔒 개인으로'}</button>
      <button class="btn danger" onclick="delItem('${id}')">삭제</button>
      <button class="btn ghost" onclick="downloadPhoto('${id}')">📥 원본</button>
      <button class="btn ghost" onclick="shareItem('${id}')">📤 공유</button>
      <button class="btn ghost" onclick="closeDetail();openEditor(state.items['${id}'])">수정</button></div>`;
  $('detailBg').classList.add('open');
  /* 보낸 기록은 명함을 열 때 그 명함 것만 읽는다 — 온 뒤에 그 자리만 갈아 끼운다 */
  if(!(state.priv.items||{})[id])
    loadSendLog(id, ()=>{ const box=$('dSendLog'); if(box) box.innerHTML = sendLogHtml(id); });
  if (it.thumb) Store.getPhoto(id).then(p=>{ const im=$('dphoto'); if(p&&im) im.src=p; });
  if (it.thumb2) Store.getPhoto(id+'_b').then(p=>{ const im=$('dphoto2'); if(p&&im) im.src=p; });
}
function toggleFav(id){ const it=state.items[id]; if(!it) return;
  it.fav=!it.fav; Store.put(it); openDetail(id);
  toast(it.fav?'⭐ 즐겨찾기에 고정했습니다':'즐겨찾기를 해제했습니다'); }
function toggleScope(id){ const it=state.items[id]; if(!it) return;
  it.scope = it.scope==='private'?'shared':'private'; Store.put(it); openDetail(id);
  toast(it.scope==='private'?'🔒 개인 명함으로 지정했습니다':'공용 명함으로 되돌렸습니다'); }
function closeDetail(){ $('detailBg').classList.remove('open');
  const pd=$('pcDetail'); if(pd) pd.classList.remove('open');
  const ov=$('pcDetailOverlay'); if(ov) ov.style.display='none'; }
function closePcDetail(){ closeDetail(); }

/* ── PC 오른쪽 상세 패널 (리멤버식) ── */
function openPcDetail(id){
  const it=state.items[id]; if(!it) return;
  if (it.thumb === undefined){ ensureThumbs(id).then(()=>openPcDetail(id)); return; }
  const isCard = it.kind==='card';
  const fields = isCard ? CARD_FIELDS : BIZ_FIELDS;
  /* 주소만 두 칸을 다 쓴다 — 좁은 칸에 넣으면 네 줄로 접혀 오히려 길어진다.
     ⚠ 여기에 많이 넣으면 두 칸 배치에 빈틈이 생겨 오히려 길어진다(이메일·홈페이지를
       넣어 봤더니 한 칸씩 비면서 줄이 늘었다). */
  const WIDE_ROW = { companyAddr:1, address:1, bizType:1, bizItem:1 };
  const rows = fields.filter(([k])=>it[k] && k!=='memo').map(([k,label])=>{
    let v=esc(it[k]);
    if (k==='bizno') v=esc(fmtBizno(it[k]));
    if (['mobile','tel','fax'].includes(k)) v=`<a href="tel:${esc(digits(it[k]))}">${v}</a>`;
      if (k==='email') v=`<a href="#" onclick="openSendMaterials('${it.id}');return false" title="보낼 자료를 고르고 메일을 씁니다">${v}</a>`;
    return `<div class="pdrow ${WIDE_ROW[k]?'wide':''}"><div class="k">${label}</div><div class="v">${v}</div></div>`;
  }).join('');
  const gname = it.group && state.groups[it.group] ? state.groups[it.group].name : '미분류';
  /* ⚠ 「📎 자료 보내기」를 지웠다(2026-08-10). 「📧 메일」과 **같은 함수**를 부르는
     완전한 중복이라, 두 개를 두면 서로 다른 일을 하는 줄 알고 헤맨다(대표 지시).
     단추는 세 개씩 놓는다 — 두 개씩이면 줄이 늘어 한 화면에 안 들어간다. */
  const acts = isCard ? `
    <div class="pdacts three">
      <button onclick="openSendMaterials('${id}')" ${it.email?'':'disabled'} title="보낼 자료를 고르고 메일을 씁니다">📧 메일</button>
      <button onclick="copyCardInfo('${id}')" title="이름·회사·번호·메일·주소를 한 줄로 복사">📋 정보 복사</button>
      <button onclick="downloadVcf('${id}')" title="휴대폰 연락처로 저장 (vCard 파일)">📇 연락처 저장</button>
      <button onclick="downloadPhoto('${id}')" title="명함 원본 사진 내려받기">📥 원본 사진</button>
      <button onclick="sendToErp('${id}')" title="이 명함을 ERP 거래처로 등록">🏢 ERP 거래처</button>
      <button onclick="closeDetail();openEditor(state.items['${id}'])" title="이 명함 고치기">✏️ 수정</button>
    </div>` : `
    <div class="pdacts three"><button onclick="copyCardInfo('${id}')" title="정보를 한 줄로 복사">📋 정보 복사</button><button onclick="downloadPhoto('${id}')" title="원본 사진 내려받기">📥 원본 사진</button><button onclick="closeDetail();openEditor(state.items['${id}'])">✏️ 수정</button></div>`;
  /* ── 한 화면에 담기(대표 지시 2026-08-10) ──
     사진을 위에 통째로 깔면 그것만으로 화면 반이 갔다. 이름 옆에 작게 두고,
     정보는 두 칸씩 놓고, 그룹·담당자·등록일은 이름 밑 한 줄로 올린다. */
  const meta = [gname, it.owner||'', fmtDate(it.createdAt)].filter(Boolean).join(' · ');
  $('pcDetail').innerHTML = `
    <div class="pdhead"><span class="ttl">${isCard?'명함':'사업자등록증'}</span>
      <button class="x" onclick="closeDetail()">✕</button></div>
    <div class="pdbody">
      <div class="pdtop">
        <div class="pdshots">
          ${ it.thumb ? `<img class="pdphoto" id="pcdphoto" src="${it.thumb}" onclick="zoom('${id}')">` : '' }
          ${ it.thumb2 ? `<img class="pdphoto" id="pcdphoto2" src="${it.thumb2}" onclick="zoom('${id}_b')">` : '' }
        </div>
        <div class="pdwho">
          <div class="pdname">${esc(isCard?(it.name||it.company||'(이름 없음)'):(it.company||'(상호 없음)'))}
            <span class="star" onclick="toggleFav('${id}')">${it.fav?'⭐':'☆'}</span></div>
          <div class="pdsub">${esc(isCard ? [it.title,it.dept,it.company].filter(Boolean).join(' / ')
                                           : [it.ceo&&('대표자 '+it.ceo), fmtBizno(it.bizno)].filter(Boolean).join(' · '))}</div>
          <div class="pdmeta">${esc(meta)}</div>
        </div>
      </div>
      ${(function(){var f=ErpMatch.full(it);return f?`<div class="erpmgr-box">🏢 푸른 거래처 · ${esc(f)}</div>`:'';})()}
      ${acts}
      <div class="pdgrid">
        ${rows || '<div class="pdrow"><div class="v" style="color:#8b98b3">저장된 정보가 없습니다</div></div>'}
      </div>
      ${ it.memo ? `<div class="pdsec">메모</div><div class="pdmemo">${esc(it.memo)}</div>` : '' }
      <div class="pddel"><button class="danger" onclick="delItem('${id}')">🗑 이 명함 삭제</button></div>
    </div>`;
  $('pcDetail').classList.add('open');
  const ov=$('pcDetailOverlay'); if(ov) ov.style.display='block';
  if (it.thumb) Store.getPhoto(id).then(p=>{ const im=$('pcdphoto'); if(p&&im) im.src=p; });
  if (it.thumb2) Store.getPhoto(id+'_b').then(p=>{ const im=$('pcdphoto2'); if(p&&im) im.src=p; });
}
function delItem(id){
  if(!confirm('정말 삭제할까요? (전 직원 명함첩에서 삭제됩니다)')) return;
  Store.del(id); closeDetail(); toast('삭제되었습니다');
}
async function zoom(id){
  let src;
  if (id==='__EDIT__') src = editing && (editing.photo||editing.thumb);
  else if (id==='__EDIT_B__') src = editing && (editing.photo2||editing.thumb2);
  else if (id.endsWith('_b')) src = (await Store.getPhoto(id)) || state.items[id.slice(0,-2)]?.thumb2;
  else src = (await Store.getPhoto(id)) || state.items[id]?.thumb;
  if(!src) return;
  $('zoomimg').src=src; $('zoombg').classList.add('open');
}
/* 명함을 카톡·문자로 공유 (텍스트 + 사진) */
async function shareItem(id){
  const it=state.items[id]; if(!it) return;
  const isCard = it.kind==='card';
  const text = (isCard
    ? [it.name, [it.company,it.dept,it.title].filter(Boolean).join(' '),
       it.mobile&&'휴대폰 '+it.mobile, it.tel&&'전화 '+it.tel,
       it.email&&'이메일 '+it.email, it.address]
    : [it.company, it.ceo&&'대표자 '+it.ceo, it.bizno&&'사업자번호 '+fmtBizno(it.bizno), it.address])
    .filter(Boolean).join('\n');
  const data = { title: isCard ? (it.name||'명함') : (it.company||'사업자등록증'), text };
  try{
    const p = await Store.getPhoto(id);
    if (p && navigator.canShare){
      const blob = await (await fetch(p)).blob();
      const file = new File([blob], fileNameFor(it), {type:'image/jpeg'});
      if (navigator.canShare({files:[file]})) data.files=[file];
    }
  }catch(e){}
  if (navigator.share){ try{ await navigator.share(data); }catch(e){} }
  else { try{ await navigator.clipboard.writeText(text); toast('이 브라우저는 공유창이 없어 내용을 복사했습니다'); }catch(e){ toast('공유를 지원하지 않는 브라우저입니다'); } }
}
/* 원본 사진을 파일로 저장(이메일·카톡 첨부용) */
async function downloadPhoto(id){
  const it=state.items[id]; if(!it) return;
  const p=(await Store.getPhoto(id)) || it.thumb;
  if(!p) return toast('저장된 사진이 없습니다');
  const a=document.createElement('a');
  a.href=p; a.download=fileNameFor(it); a.click();
  toast('원본 사진을 내려받았습니다 — 이메일·카톡에 바로 첨부하세요');

/* ════════════ 내 폰 연락처 저장 (vCard) ════════════ */
function copyCardInfo(id){
  const it=state.items[id]; if(!it) return;
  const parts=[];
  if(it.name) parts.push(it.name);
  if(it.title||it.dept) parts.push([it.title,it.dept].filter(Boolean).join(' '));
  if(it.company) parts.push(it.company);
  if(it.mobile) parts.push('휴대폰 '+it.mobile);
  if(it.companyTel||it.tel) parts.push('전화 '+(it.companyTel||it.tel));
  if(it.email) parts.push(it.email);
  if(it.companyAddr||it.address) parts.push(it.companyAddr||it.address);
  const text=parts.join(' / ');
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>toast('명함 정보를 복사했습니다')).catch(()=>fallbackCopy(text));
  else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); toast('명함 정보를 복사했습니다'); }catch(e){ toast('복사 실패'); }
  document.body.removeChild(ta);
}
function downloadVcf(id){
  const it=state.items[id]; if(!it) return;
  const lines=['BEGIN:VCARD','VERSION:3.0',
    `N:${it.name||''};;;;`,`FN:${it.name||''}`,
    it.company && `ORG:${it.company}${it.dept?';'+it.dept:''}`,
    it.title && `TITLE:${it.title}`,
    it.mobile && `TEL;TYPE=CELL:${it.mobile}`,
    it.tel && `TEL;TYPE=WORK:${it.tel}`,
    it.fax && `TEL;TYPE=FAX:${it.fax}`,
    it.email && `EMAIL:${it.email}`,
    it.address && `ADR;TYPE=WORK:;;${it.address};;;;`,
    it.memo && `NOTE:${it.memo.replace(/\n/g,'\\n')}`,
    'END:VCARD'].filter(Boolean);
  const blob=new Blob([lines.join('\r\n')],{type:'text/vcard;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=(it.name||'contact')+'.vcf';
  a.click(); URL.revokeObjectURL(a.href);
  toast('내려받은 파일을 열면 연락처에 저장됩니다');
}

/* ════════════ ERP 거래처(companies) 연동 — 명함 → ERP ════════════ */
/* ERP의 CompanyRef와 동일한 정규화로 중복 거래처 생성 방지 */
function erpNormName(s){ return String(s||'')
  .replace(/㈜|\(주\)|주식회사|주\)|\(유\)|유한회사|농업회사법인/g,'')
  .replace(/\s+/g,'').replace(/[·.,'"`()]/g,'').toLowerCase(); }
function erpNormBiz(s){ const d=String(s||'').replace(/\D/g,''); return d.length>=10?d.slice(0,10):''; }

async function sendToErp(id){
  const it=state.items[id]; if(!it || it.kind!=='card') return;
  if (Store.mode!=='firebase') return toast('ERP 연동은 Firebase 연결 후 가능합니다');
  if (!it.company) return toast('회사명이 없어 거래처로 등록할 수 없습니다');
  try{
    /* 푸른이알피 업체는 data/companies/{v:목록, u:갱신시각} 에 있다.
       예전에는 루트 companies 에 썼는데 그 노드는 아무도 읽지 않아 등록해도 나타나지 않았다. */
    const db = firebase.database();
    const snap = await db.ref('data/companies').once('value');
    const wrap = snap.val();
    const raw  = (wrap && wrap.v !== undefined) ? wrap.v : wrap;   // 배열형·객체형 둘 다 쓰인다
    const list = Array.isArray(raw) ? raw.filter(Boolean)
               : (raw && typeof raw === 'object' ? Object.keys(raw).map(k=>raw[k]).filter(Boolean) : []);
    const nBiz=erpNormBiz(it.bizno), nName=erpNormName(it.company);
    const exist = list.find(c=> (nBiz && erpNormBiz(c.bizNo)===nBiz) || (nName && erpNormName(c.name)===nName));
    if (exist) return toast(`이미 ERP 거래처에 있습니다: ${exist.name}`);
    /* 사업자번호 없이 등록하면 이름으로만 이어져 나중에 같은 회사가 두 번 생긴다 — 미리 알린다 */
    const warn = nBiz ? '' : '\n\n⚠ 이 명함에는 사업자번호가 없습니다.\n사업자번호 없이 등록하면 나중에 같은 회사가 두 번 생길 수 있습니다.\n업체관리에서 사업자번호를 채워 주세요.';
    if (!confirm(`'${it.company}'를 ERP 거래처로 등록할까요?${warn}`)) return;
    /* ERP companies 레코드 형태(필드명 일치): name·bizNo·ceo·phone·email·address·manager */
    const now = Date.now();
    const rec = { id:'co-'+now.toString(36)+Math.random().toString(36).slice(2,6),
      name: it.company, bizNo: it.bizno||'', ceo: '',
      phone: it.tel || it.mobile || '', email: it.email||'',
      address: it.address||'', manager: it.owner||'',
      _fromCard: it.id, createdAt: now, updatedAt: now };
    const up = {};
    if (raw && !Array.isArray(raw) && typeof raw === 'object'){
      up['data/companies/v/'+rec.id] = rec;              // 객체형 — 건별 쓰기(푸른이알피 dbUpsert와 동일)
    } else {
      up['data/companies/v'] = list.concat([rec]);       // 배열형 — 통째 쓰기(푸른이알피 dbSet과 동일)
    }
    up['data/companies/u'] = now;                        // 갱신시각 — 푸른이알피가 이걸 보고 다시 읽는다
    await db.ref().update(up);
    toast(`✅ ERP 거래처로 등록했습니다: ${it.company}`);
  }catch(e){ console.error(e); toast('ERP 등록 실패 — 권한 또는 연결을 확인하세요'); }
}

async function saveSettings(){
  const v=$('set_gkey').value.trim();
  const share=$('set_gshare') && $('set_gshare').checked;
  if(v) localStorage.setItem(GEMINI_KEY_LS,v); else localStorage.removeItem(GEMINI_KEY_LS);
  if(v && share && Store.mode==='firebase'){
    try{ await Store.db.ref(DB_ROOT+'/config/geminiKey').set(v); _sharedGKey=v;
      toast('AI 키를 모든 기기에 공유했습니다 — 이제 어느 기기서든 자동 추출됩니다'); }
    catch(e){ toast('공유 저장 실패: '+((e&&e.message)||'')); }
  } else {
    toast(v?'AI 키가 저장되었습니다 — 이제 촬영하면 자동 추출됩니다':'AI 키를 지웠습니다');
  }
  $('setBg').classList.remove('open');
}
/* AI 키가 실제로 되는지 확인 — 입력칸의 키(없으면 저장된 키)로 시험 호출 */
async function testGemini(){
  const key = (($('set_gkey')&&$('set_gkey').value.trim()) || geminiKey() || '');
  if(!key){ alert('❌ AI 키가 없습니다.\n\n위 칸에 키(AIza...)를 붙여넣고 다시 눌러 보세요.'); return; }
  toast('AI 연결 확인 중…',8000);
  try{
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`,
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'OK'}]}]})});
    if(r.ok){ toast(''); alert('✅ AI 연결 정상입니다!\n\n[저장]을 누른 뒤 명함을 찍으면 이름·회사·전화가 자동으로 채워집니다.'); return; }
    let msg=''; try{ const j=await r.json(); msg=(j.error&&j.error.message)||''; }catch(_){}
    toast('');
    if(r.status===400 && /API key not valid/i.test(msg))
      alert('❌ 키가 올바르지 않습니다.\n\n구글에서 키를 다시 복사해 넣어 주세요. (오타·일부만 복사된 경우가 많습니다)');
    else if(r.status===403)
      alert('❌ 이 키는 Gemini(자동인식)를 쓸 수 없게 막혀 있습니다.\n\n원인은 둘 중 하나예요:\n1) 키에 제한이 걸림(예: Vision/Calendar 전용)\n2) 그 프로젝트에 Gemini API가 안 켜짐\n\n가장 쉬운 해결: aistudio.google.com/apikey 에서 제한 없는 새 키를 만들어 넣으세요.\n\n('+r.status+') '+msg);
    else
      alert('❌ 연결 실패 ('+r.status+')\n'+msg+'\n\n인터넷 연결을 확인하거나 새 키로 다시 시도해 주세요.');
  }catch(e){ toast(''); alert('❌ 네트워크 오류: '+((e&&e.message)||'')+'\n\n인터넷 연결을 확인해 주세요.'); }
}

/* ════════════ 📷 카메라 — 사진첩 것 하나만 쓴다 (대표 지시 2026-08-09) ════════════
   여기 있던 촬영 화면(getUserMedia·초점·명함틀·앞뒷면, 약 90줄)을 지웠다.
   사진첩(pu-photos.html) 안에 똑같은 코드가 한 벌 더 있었고 — 한쪽만 고치는
   사고가 났다 — 무엇보다 **여기서 찍은 것은 사진첩을 안 거쳤다.** 그래서
   자동 분류(명함→명함첩 / 사업자등록증→명함첩+업체관리)를 못 타고, 사진첩에
   증빙 사본도 안 남았다. 2026-08-08 에 옛 푸른카메라에서 없앤 문제가 이름만
   바꿔 여기 남아 있던 셈이다.

   이제 ＋ 는 사진첩 카메라를 **명함 모드**로 부른다:
     · 명함틀이 켜진 채로 열리고, 앞면을 찍으면 「뒷면도?」를 묻는다(예전 그대로)
     · 찍은 것은 사진첩에 담겨 자동 배송을 타고, 다 올리면 명함첩으로 돌아온다
   ⚠ 파일 고르기(📁)·끌어다 놓기·Ctrl+V 는 그대로다 — 그 길은 여기서 편집기를
     바로 여는 것이 맞다(이미 찍혀 있는 파일이라 촬영 화면이 필요 없다). */
function openCamera(){
  location.href = 'pu-photos.html?cam=1&mode=card&from=cards&sso=1';
}

/* ════════════ PWA: 홈 화면 설치 + 카톡 공유 수신 ════════════ */
if ('serviceWorker' in navigator && location.protocol==='https:')
  /* 통합 워커 하나만 등록 — 앱마다 따로 등록하면 서로 밀어내 공유 받기가 죽는다(pu-sw.js 머리말) */
  navigator.serviceWorker.register('pu-sw.js').catch(()=>{});
if (location.search.includes('shared=1')){
  (async()=>{
    try{
      const cache = await caches.open('pucards-share');
      const meta = await cache.match('shared-files');
      if (meta){
        const n = (await meta.json()).n;
        const fs=[];
        for (let i=0;i<n;i++){ const r=await cache.match('shared-'+i);
          if (r) fs.push(new File([await r.blob()], 'shared'+i+'.jpg', {type: r.headers.get('Content-Type')||'image/jpeg'})); }
        await caches.delete('pucards-share');
        if (fs.length){ toast('공유받은 이미지 '+fs.length+'장을 등록합니다'); onFiles(fs); }
      }
    }catch(e){ console.error(e); }
    history.replaceState(null,'',location.pathname);
  })();
}

/* ════════════ 🗑 휴지통 (30일 보관) ════════════ */
const TRASH_DAYS = 30;
function openTrash(){
  const all = Object.values(state.trash||{}).sort((a,b)=>(b._deletedAt||0)-(a._deletedAt||0));
  const dleft = ts => Math.max(0, TRASH_DAYS - Math.floor((Date.now()-(ts||0))/86400000));
  let rows;
  if (!all.length){
    rows = `<div style="padding:30px;text-align:center;color:var(--sub)">휴지통이 비어 있습니다</div>`;
  } else {
    rows = all.map(it=>{
      const name = it.kind==='biz' ? (it.company||'(상호 없음)') : (it.name||it.company||'(이름 없음)');
      const sub = [it.company, it.mobile||it.companyTel].filter(Boolean).join(' · ');
      const left = dleft(it._deletedAt);
      return `<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #e4e8f0;border-radius:9px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px;color:#1e2a47;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(name)}</div>
          <div style="font-size:12px;color:#8b98b3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(sub)}</div>
        </div>
        <span style="font-size:11.5px;color:${left<=3?'#c0392b':'#8b98b3'};white-space:nowrap">${left}일 남음</span>
        <button onclick="restoreFromTrash('${it.id}')" style="border:1px solid #cfe0ff;background:#eef4ff;color:#2452b5;border-radius:7px;padding:6px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap">♻️ 복원</button>
        <button onclick="hardDelFromTrash('${it.id}')" style="border:1px solid #f3c2c2;background:#fff;color:#c0392b;border-radius:7px;padding:6px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap">영구삭제</button>
      </div>`;
    }).join('');
  }
  const h = `
    <div class="mhead"><b>🗑 휴지통 (${all.length})</b>
      ${_panelTarget==='inline' ? '' : `<button class="iconbtn" onclick="folderDlgBg.classList.remove('open')">✕</button>`}</div>
    <div style="font-size:12.5px;color:#8b98b3;padding:0 4px 10px">삭제한 명함은 ${TRASH_DAYS}일간 보관되며, 그 후 자동으로 완전히 삭제됩니다.</div>
    <div style="max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:7px;padding:2px">${rows}</div>
    ${all.length?`<div class="mfoot"><button class="btn ghost" onclick="emptyTrash()" style="color:#c0392b">휴지통 비우기 (전체 영구삭제)</button></div>`:''}`;
  if(_panelTarget==='inline'){ showPanel(h); return; }
  $('folderDlg').innerHTML = h;
  $('folderDlgBg').classList.add('open');
}
function restoreFromTrash(id){

  setTimeout(function(){_refresh(openTrash)}, 300);
}
function hardDelFromTrash(id){

  Store.hardDel(id);
  toast('영구 삭제했습니다');

}
function emptyTrash(){
  const n=Object.keys(state.trash||{}).length; if(!n) return;
  if(!confirm(`휴지통의 ${n}건을 모두 완전히 삭제할까요? 복구할 수 없습니다.`)) return;

  toast('휴지통을 비웠습니다');

}
/* 30일 지난 항목 자동 영구삭제 (앱 시작 시 1회) */
function purgeTrash(){
  try{
    const now=Date.now(); let n=0;
    Object.values(state.trash||{}).forEach(it=>{
      if (it._deletedAt && (now-it._deletedAt) > TRASH_DAYS*86400000){ Store.hardDel(it.id); n++; }
    });
    if(n) console.log(`휴지통 자동 정리: ${n}건`);
  }catch(e){ console.error('휴지통 정리 실패', e); }
}

/* 백업 파일(JSON) 복원 */
function onRestoreFile(files){
  const f=files&&files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{
    let data;
    try{ data=JSON.parse(reader.result); }
    catch(e){ return toast('백업 파일을 읽을 수 없습니다 (JSON 형식 아님)'); }
    const items=data.items||{}, groups=data.groups||{};
    const ic=Object.keys(items).length, gc=Object.keys(groups).length;
    if(!ic && !gc) return toast('백업 파일에 데이터가 없습니다');
    const cur=Object.keys(state.items).length;
    if(!confirm(`백업 복원: 명함 ${ic}건, 폴더 ${gc}개를 불러옵니다.\n\n현재 ${cur}건과 합쳐집니다 (같은 명함은 덮어씀).\n진행할까요?`)) return;
    let done=0;
    Object.values(groups).forEach(g=>{ if(g&&g.id) Store.putGroup(g); });
    Object.values(items).forEach(it=>{ if(it&&it.id){ Store.put(it); done++; } });
    toast(`백업 복원 완료 — 명함 ${done}건, 폴더 ${gc}개`);
  };
  reader.readAsText(f);
}

/* 전체 백업 — items + groups를 JSON 파일로 (환경설정의 수동 버튼 전용) */
function backupNow(silent){
  const cnt = Object.keys(state.items||{}).length;
  if (!cnt){ if(!silent) toast('백업할 명함이 없습니다'); return; }
  try{
    if(!silent) toast(`백업 파일 만드는 중… (${cnt.toLocaleString()}건, 잠시만요)`,8000);
    const data = { backupAt: new Date().toISOString(), items: state.items, groups: state.groups };
    const json = JSON.stringify(data);
    const blob = new Blob([json], {type:'application/json'});
    const mb = (blob.size/1048576).toFixed(1);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `푸른명함첩_백업_${fmtDate(Date.now())}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    if(!silent) toast(`✅ 백업 완료 — ${cnt.toLocaleString()}건 (${mb}MB). 다운로드 폴더를 확인하세요`,6000);
  }catch(e){
    console.error('[backup]', e);
    if(!silent) toast('백업 실패: '+((e&&e.message)||'파일이 너무 크거나 브라우저 제한') + ' — 다운로드 차단 여부를 확인하세요',7000);
  }
}

/* 전체 비우기 — 현재 탭(명함 또는 사업자등록증) 전부 삭제. "삭제" 입력 안전장치 */
async function wipeAll(){

  const targets = Object.values(state.items).filter(it=>it.kind===state.tab);
  if (!targets.length) return toast('비울 항목이 없습니다');
  const ans = prompt(`⚠️ ${kindLabel} ${targets.length.toLocaleString()}건을 모두 삭제합니다.\n되돌릴 수 없습니다. 진행하려면 "삭제"라고 입력하세요.`);
  if (ans !== '삭제') return toast('취소되었습니다');
  toast('삭제 중…', 9000);
  if (Store.mode==='firebase'){
    const ids = targets.map(it=>it.id);
    for (let s=0; s<ids.length; s+=200){
      /* 썸네일은 이제 items 밖에 있다 — 같이 지우지 않으면 주인 없는 사진이 용량만 먹는다 */
      const chunk={}, thChunk={};
      ids.slice(s,s+200).forEach(id=>{ chunk[id]=null; thChunk[id]=null; thChunk[id+'_b']=null; });
      try { await Store.db.ref(DB_ROOT+'/items').update(chunk);
            await Store.db.ref(DB_ROOT+'/thumbs').update(thChunk); }

}

/* ════════════ 가져오기: 리멤버 엑셀 · 구글 CSV · vCard ════════════ */
async function needXLSX(){
  if (window.XLSX) return;
  await new Promise((res,rej)=>{ const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=res; s.onerror=rej; document.head.appendChild(s); });
}
async function onImportFile(files){
  const f=files[0]; if(!f) return;
  try{
    toast('파일 분석 중…',9000);
    let rows;
    if (/\.vcf$/i.test(f.name)) rows = parseVcf(await f.text());
    else if (/\.csv$/i.test(f.name) || /csv/i.test(f.type||'')){
      /* CSV는 UTF-8 텍스트로 직접 읽어야 한글이 안 깨진다 (구글·리멤버 CSV = UTF-8).
         예전엔 arrayBuffer→XLSX로 읽어 라틴으로 해석되며 'ì¶œ' 처럼 깨졌음 */
      await needXLSX();
      let text = await f.text();
      if (text.charCodeAt(0)===0xFEFF) text = text.slice(1);   /* BOM 제거 */
      const wb=XLSX.read(text,{type:'string'});
      rows = mapRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})); }
    else { await needXLSX();
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      rows = mapRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})); }
    rows = rows.filter(r=>r.name||r.company||r.mobile||r.tel);
    if (!rows.length) return toast('가져올 연락처를 찾지 못했습니다');
    previewImport(rows, f.name);
  }catch(e){ console.error(e); toast('파일을 읽지 못했습니다'); }
}

/* 열 이름 자동 인식(리멤버·구글·일반 엑셀 공통) */
function classify(h){
  h=String(h).toLowerCase().replace(/[\s\-_]/g,'');
  if(/label$/.test(h)) return null;                 // 구글 CSV의 'Label' 칸(값 아님)은 무시
  if(/^(이름|성명|name|fn)$/.test(h)) return 'name';
  if(/(familyname|lastname|성$)/.test(h)) return 'family';
  if(/(givenname|firstname)/.test(h)) return 'given';
  if(/(회사|company|organizationname|소속|조직)/.test(h)) return 'company';
  if(/(부서|department)/.test(h)) return 'dept';
  if(/(직책|직급|직함|jobtitle|organizationtitle|^title$)/.test(h)) return 'title';
  /* 리멤버 한글 헤더: 근무처/회사 전화·팩스는 회사용으로 분류 */
  if(/(근무처팩스|회사팩스|대표팩스)/.test(h)) return 'companyFax';
  if(/(근무처전화|회사전화|대표번호|대표전화)/.test(h)) return 'companyTel';
  if(/(휴대|핸드폰|mobile|cell)/.test(h)) return 'mobile';
  if(/(팩스|fax)/.test(h)) return 'fax';
  if(/(전화|phone|tel)/.test(h)) return 'tel';       // 직통전화
  if(/(메일|email)/.test(h)) return 'email';
  /* 명함 등록일 */
  if(/(등록일|등록날짜|createdate|regdate)/.test(h)) return 'createdAt';
  if(/(홈페이지|website|homepage|url)/.test(h)) return 'website';
  if(/address.*formatted|주소.*formatted/.test(h)) return 'address';   // 구글 CSV: Formatted만
  if(/(근무지주소|회사주소|근무처주소)/.test(h)) return 'companyAddr';
  if(/(주소|번지|소재지|address)/.test(h)) return 'address';
  if(/(담당자|담당|owner)/.test(h)) return 'owner';
  if(/(메모|노트|note|비고)/.test(h)) return 'memo';
  return null;
}
/* 리멤버→구글 CSV 이름 엉킴 복원
   First="수민\u00a0총무(천일통신)", Last="김"  →  "김수민"
   (성은 Last칸, 이름은 First의 특수공백 앞, 회사·직책은 별도 칸) */
function rememberGiven(first){
  if(!first) return '';
  let s=String(first).replace(/\u00a0/g,'\x01').trim().replace(/^#/,'').trim();
  s=s.replace(/\([^)]*\)/g,'').replace(/[()]/g,'').trim();   // 괄호 안 회사 제거
  s = s.replace(/\x01/g,' ').trim();        // 특수공백 → 일반공백으로 통일
  // 한글이 있으면: 직책/소속 키워드 이전까지의 첫 한글 토큰을 이름으로
  if (/[가-힣]/.test(s)){
    let head = s.split(/\s+/)[0];           // 공백 기준 첫 토큰(보통 "이름" 또는 "이름직책")
    const km = head.match(/[가-힣]+/);
    let nm = km ? km[0] : head;
    nm = nm.replace(/(노무사|노무법인|변호사|대표이사|대표|부장|차장|과장|이사|팀장|원장|센터장|부사장|총무|공인노무사|교수|전무이사|사무국장|전문위원|프로|소장|실장|본부장|상무|전무|사장|회장|주임|대리|사원|법인|사무소).*$/,'').trim();
    if (nm) return nm;
    const any = s.match(/[가-힣]{2,4}/); if(any) return any[0];
  }
  const han=s.match(/[\u4e00-\u9fff]+/); if(han) return han[0];
  s=s.replace(/\b(CEO|President|Vice|Director|Manager|Management|General|Senior|Chief|Head|Officer|대표|부장|차장|과장|이사|팀장|원장|센터장|부사장|총무|대표이사|공인노무사|노무사|변호사|교수|전무이사|사무국장|전문위원|프로)\b.*$/i,'').trim();
  return s.trim();
}
function rememberFixName(first, last){
  const f=String(first||''), l=String(last||'');
  // 케이스1: Last가 한 글자 한글 성 + First에 이름  →  성+이름
  if (/^[가-힣]\s*$/.test(l.replace(/\u00a0/g,' '))){
    const g=rememberGiven(f); if(g) return (l.trim()+g).trim();
  }
  // 케이스2: 한쪽 칸에 "이름\u00a0직책(회사" 형태가 들어있음 → 특수공백 앞에서 이름 추출
  for (const part of [l, f]){              // Last 먼저(보통 여기 이름 있음)
    const p=part.replace(/\u00a0/g,'\x01');
    if (p.includes('\x01')){
      const cand=rememberGiven(p.split('\x01')[0]+'\x01');
      if (cand) return cand;
    }
  }
  // 케이스3: 합쳐서 한글 이름 추출
  const g2=rememberGiven(f) || rememberGiven(l);
  return g2 || (l+f).replace(/\u00a0/g,' ').replace(/[()#]/g,'').trim();
}
/* 날짜 파싱: "2026년 06월 19일", "2026.06.19", "2026-06-19" 등 */
function parseKoreanDate(s){
  s=String(s||'').trim();
  const m=s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]).getTime();
  return Date.parse(s);
}
function mapRows(json){
  return json.map(r=>{
    const o={phones:[]};
    for (const [h,v0] of Object.entries(r)){
      const v=String(v0).trim(); if(!v) continue;
      const k=classify(h); if(!k) continue;
      const clean = s => String(s).split(':::')[0].trim()
        .replace(/^\*\s*(work|home|mobile|other|cell)?\s*/i,'').trim();   // 라벨 잔재 제거
      if (k==='phone'||k==='mobile')
        v.split(':::').forEach(p=>{ p=p.trim(); if(p)
          o.phones.push({v:p, m: k==='mobile' || /^01[016789]/.test(digits(p))}); });
      else if (k==='createdAt'){
        let t = parseKoreanDate(v);
        if (!isNaN(t)) o.createdAt = t;
      }
      else if (k==='email'||k==='address'||k==='companyAddr'){ const cv=clean(v); if(cv && !o[k]) o[k]=cv; }
      else if (k==='given') o.given=v;
      else if (k==='family') o.family=v;
      else if (o[k]) o[k] += (k==='memo' ? '\n' : ' ') + v;
      else o[k]=v;
    }
    /* 이름 조립: First/Last 칸을 보고 리멤버 엉킴이면 복원 */
    const rawFirst = o.given || '';
    const rawLast  = o.family || '';
    if (/[()\u00a0]|^#/.test(rawFirst+rawLast)) o.name = rememberFixName(rawFirst, rawLast);
    else if(!o.name) o.name = (rawLast+rawFirst).trim();
    else if(/[()\u00a0]|^#/.test(o.name)) o.name = rememberFixName(o.name, '');
    const mob=o.phones.find(p=>p.m), tel=o.phones.find(p=>!p.m);
    return { name:o.name||'', company:o.company||'', dept:o.dept||'', title:o.title||'',
      mobile:o.mobile||(mob?mob.v:''), tel:o.tel||(tel?tel.v:''), fax:o.fax||'', email:o.email||'',
      companyTel:o.companyTel||'', companyFax:o.companyFax||'', companyAddr:o.companyAddr||'', website:o.website||'',
      address:o.address||'', memo:o.memo||'', ...(o.createdAt?{createdAt:o.createdAt}:{}) };
  });
}
/* vCard 파서 (갤럭시·구글 내보내기, QP 인코딩 지원) */
function qpDecode(s){
  const bytes=[];
  for(let i=0;i<s.length;i++){
    if (s[i]==='=' && /^[0-9A-Fa-f]{2}$/.test(s.slice(i+1,i+3))){ bytes.push(parseInt(s.slice(i+1,i+3),16)); i+=2; }
    else for(const b of new TextEncoder().encode(s[i])) bytes.push(b);
  }
  try{ return new TextDecoder('utf-8').decode(new Uint8Array(bytes)); }catch(e){ return s; }
}
function parseVcf(text){
  text=text.replace(/\r/g,'').replace(/=\n/g,'').replace(/\n[ \t]/g,'');
  const out=[];
  text.split(/END:VCARD/i).forEach(block=>{
    if(!/BEGIN:VCARD/i.test(block)) return;
    const o={phones:[]};
    block.split('\n').forEach(line=>{
      const i=line.indexOf(':'); if(i<0) return;
      const prop=line.slice(0,i), P=prop.toUpperCase();
      let val=line.slice(i+1);
      if(/ENCODING=QUOTED-PRINTABLE/.test(P)) val=qpDecode(val);
      val=val.replace(/\\n/gi,'\n').replace(/\\,/g,',').trim();
      if(!val) return;
      if(P==='FN'||P.startsWith('FN;')) o.name=val;
      else if(P==='N'||P.startsWith('N;')){ if(!o.name){ const p=val.split(';'); o.name=((p[0]||'')+(p[1]||'')).trim(); } }
      else if(P.startsWith('ORG')){ const p=val.split(';'); o.company=p[0]||''; o.dept=p[1]||''; }
      else if(P.startsWith('TITLE')) o.title=o.title||val;
      else if(P.startsWith('TEL')) o.phones.push({v:val, m:/CELL|MOBILE/.test(P)||/^01[016789]/.test(digits(val))});
      else if(P.startsWith('EMAIL')) o.email=o.email||val;
      else if(P.startsWith('ADR')) o.address=o.address||val.split(';').filter(Boolean).join(' ');
      else if(P.startsWith('NOTE')) o.memo=val;
    });
    const mob=o.phones.find(p=>p.m), tel=o.phones.find(p=>!p.m);
    out.push({ name:o.name||'', company:o.company||'', dept:o.dept||'', title:o.title||'',
      mobile:mob?mob.v:'', tel:tel?tel.v:'', fax:'', email:o.email||'', address:o.address||'', memo:o.memo||'' });
  });
  return out;
}

/* 중복 매칭 키: 휴대폰 → 이메일 → 이름+회사 */
function rowKeys(r){
  const ks=[]; const d=digits(r.mobile);
  if(d.length>=9) ks.push('p'+d);
  if(r.email) ks.push('e'+String(r.email).toLowerCase().trim());
  if(r.name && r.company) ks.push('n'+(r.name+'|'+r.company).toLowerCase().replace(/\s/g,''));
  return ks;
}
function buildKeyMap(){
  const map={};
  Object.values(state.items).filter(it=>it.kind==='card')
    .forEach(it=>rowKeys(it).forEach(k=>{ if(!map[k]) map[k]=it.id; }));
  return map;
}
const matchExisting=(r,map)=>{ for(const k of rowKeys(r)) if(map[k]) return map[k]; return null; };
