/* ⚠ 보내는 동안 다시 못 누르게 잠근다.
   첨부가 붙으면 1분 넘게 걸리는 일이 있다(2026-08-10 64초). 그동안 화면이
   멈춘 것처럼 보여 다시 누르면 **같은 메일이 두 통** 나간다 — 실제로 그랬다. */
let _sending = false;
async function sendCompose(){
  if(_sending) return toast('보내는 중입니다 — 잠시만 기다려 주세요', 5000);
  grabCompose();
  const c = _compose; if(!c) return;
  const chk = composeCheck({ to:c.to, subject:c.subject, body:c.body,
                             bytes:attachTotal(c.ids,_matMeta,c.files) });
  if(!chk.ok) return toast(chk.error, 7000);
  _sending = true;
  lockSendButtons(true);
  /* 첨부가 크면 오래 걸린다 — 몇 초째인지 보여 준다. 숫자가 움직이면 멈춘 게 아니라는 걸 안다. */
  const t0 = Date.now();
  const tick = setInterval(()=>{
    const s = Math.round((Date.now()-t0)/1000);
    document.querySelectorAll('.cpsendbtn, .sm-send').forEach(b=>{
      if(b.dataset.send!=='1') return;
      b.textContent = `보내는 중… ${s}초`;
    });
  }, 1000);
  try{
    const r = await postAutoMail({
      cardId: c.cardId, to: c.to, cc: c.cc, bcc: c.bcc || '',
      toMe: !!c.toMe, oneByOne: !!c.oneByOne,
      scheduleAt: c.sendAt || 0,        /* 0 이면 지금 보낸다 */
      subject: c.subject, body: c.body, matIds: c.ids, set: _sendMatSetName || '',
      /* 보낸 메일함에 '누구에게'를 사람 이름으로 보이게 — 주소만 남으면 알아보기 어렵다 */
      toName: (state.items[c.cardId]||{}).name || (state.items[c.cardId]||{}).company || '',
      files: (c.files||[]).map(f=>({ name:f.name, dataUrl:f.dataUrl }))
    });
    const cardId = c.cardId, wasMail = (state.view==='mail');
    const lost = (c.files||[]).length;
    _compose = null;
    clearDraft();          /* 나갔으니 쓰다 만 글은 지운다 — 안 지우면 다음에 또 뜬다 */
    if(r.scheduled){
      toast(`⏰ ${esc(fmtWhen(r.at))} 에 보내도록 맡겼습니다 — 창을 닫아도 나갑니다`
        + (lost?`\n⚠ 💻 내 PC 파일 ${lost}개는 예약에 담기지 않습니다 — 그때 직접 붙여 보내세요`:''),
        lost?12000:8000);
      if(wasMail) openSchedBox(); else closeSendMat();
      return;
    }
    toast(`✉️ 보냈습니다 — ${esc(r.from||'회사 메일')} 에서 ${esc(c.to)} 로`
      + (r.files?` (첨부 ${r.files}개)`:'')
      + (r.missing?`\n⚠ 파일을 못 찾은 자료 ${r.missing}개는 빠졌습니다`:''), r.missing?12000:8000);
    /* 보낸 뒤에는 보낸 메일함을 보여 준다 — 방금 것이 실제로 남았는지 그 자리에서 확인된다 */
    if(wasMail) openSentBox(); else closeSendMat();
    /* 명함 없이 쓴 메일(cardId 없음)은 명함 기록이 없다 — 기록은 명함에 붙는다 */
    if(cardId) loadSendLog(cardId, ()=>{ const box=$('dSendLog'); if(box) box.innerHTML = sendLogHtml(cardId); });
  }catch(e){
    /* ⚠ 화면을 닫지 않는다. 쓴 글이 그대로 남아 있어야 고쳐서 다시 보낼 수 있다. */
    alert('보내지 못했습니다.\n\n' + ((e&&e.message)||'알 수 없는 오류'));
  }finally{
    clearInterval(tick);
    _sending = false;
    lockSendButtons(false);
  }
}
/* 보내는 동안 [보내기] 단추를 잠근다. 두 곳(위·아래)에 있으므로 둘 다. */
function lockSendButtons(on){
  document.querySelectorAll('.cpsendbtn, .sm-send').forEach(b=>{
    if(!/보내기|보내는 중/.test(b.textContent||'')) return;
    if(on){ b.dataset.send='1'; b.dataset.label=b.textContent; b.disabled=true; b.textContent='보내는 중… 0초'; }
    else if(b.dataset.send==='1'){ b.disabled=false; b.textContent=b.dataset.label||'보내기'; delete b.dataset.send; }
  });
}
/* 고른 자료를 내려받고, 받는사람·제목·본문이 채워진 메일창을 연다.
   자료 파일은 데이터베이스 안에 통째로 들어 있어 인터넷 주소가 없다 —
   그래서 링크를 걸 수 없고, 파일을 내려받아 손으로 붙이는 것이 지금 할 수 있는 최선이다.
   (발송 서버를 켜면 이 함수만 바꾸면 되고, 고르는 화면은 그대로 쓴다.) */
async function doSendMaterials(){
  const ids = [...document.querySelectorAll('#sendMatSheet .sm-chk:checked')].map(c=>c.dataset.id);
  if(!ids.length){ toast('보낼 자료를 하나 이상 선택하세요'); return; }
  const it = state.items[_sendMatId]; if(!it) return;
  const email = normEmail(it.email);
  if(!email){ toast('이 명함에 이메일이 없습니다'); return; }

  const nm = it.name || it.company || '';
  const lines = ids.map(id=>{ const m=_matMeta[id]||{};
    return '· ' + (m.name||'자료') + (m.desc ? ' — ' + m.desc : ''); }).join('\n');
  /* 제목·본문은 자료함 → ✉️ 메일 본문에서 고친 글을 쓴다.
     고른 자료가 한 갈래뿐이면 그 갈래 전용 글이 있으면 그것을 쓴다. */
  const tpl = pickMailTpl(matMailCfg(), ids.map(id=>matCat(_matMeta[id])));
  const vals = { 받는분: nm, 회사명: it.company||'', 자료목록: lines, 오늘: fmtDate(Date.now()) };
  const subject = mailFill(tpl.subject || MAIL_TPL_DEFAULT.subject, vals);
  const body    = mailFill(tpl.body    || MAIL_TPL_DEFAULT.body,    vals);
  /* ① 자동 발송이 켜져 있으면 서버가 회사 다음메일로 대신 보낸다 (첨부까지) */
  if(mailModeOf(matMailCfg()) === 'auto'){
    const cardId = _sendMatId, setName = _sendMatSetName;
    toast('회사 메일로 보내는 중…', 30000);
    try{
      const r = await postAutoMail({ cardId, to: email, subject, body, matIds: ids, set: setName });
      closeSendMat();
      toast(`✉️ 보냈습니다 — ${esc(r.from||'회사 메일')}에서 ${email} 로`
        + (r.files?` (첨부 ${r.files}개)`:'')
        + (r.missing?`\n⚠ 파일을 못 찾은 자료 ${r.missing}개는 빠졌습니다`:''), r.missing?12000:8000);
      /* 기록은 서버가 남겼다 — 화면은 다시 읽기만 한다 */
      loadSendLog(cardId, ()=>{ const box=$('dSendLog'); if(box) box.innerHTML = sendLogHtml(cardId); });
      return;
    }catch(e){
      /* ⚠ 여기서 멈추지 않는다. 자동 발송이 막혔다고 보내기 자체가 막히면
         일이 멈춘다 — 예전 방법(메일창 + 손으로 첨부)으로 이어서 간다. */
      toast('자동 발송이 안 돼 메일창으로 엽니다 — ' + ((e&&e.message)||'알 수 없음'), 10000);
    }
  }

  /* ② 예전 방법 — 자료를 내려받고 메일창을 연다. 첨부는 손으로 붙인다. */
  toast(`자료 ${ids.length}개를 내려받는 중…`, 20000);
  let got = 0;
  for(const id of ids){
    const m=_matMeta[id]; if(!m) continue;
    try{ await downloadMaterial(id); got++; }
    catch(e){ console.warn('[자료 내려받기]', id, e&&e.message); }
  }
  if(!got){ toast('자료를 내려받지 못했습니다 — 자료함에서 파일을 다시 올려주세요', 7000); return; }
  /* 보낸 기록을 **메일창을 열기 전에** 남긴다 — location.href 로 넘어간 뒤에는
     이 화면이 멈출 수 있어 기록이 빠진다. (대표 결정: 내려받기 누를 때 바로 남긴다) */
  logSentMaterials(_sendMatId, ids, email);
  /* 파일은 자동으로 붙지 않는다 — 메일창이 열리면 내려받은 파일을 끌어다 놓아야 한다 */
  location.href = `mailto:${encodeURIComponent(email)}`
    + `?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  closeSendMat();
  toast(`📥 자료 ${got}개를 내려받았습니다.\n메일창에 그 파일들을 끌어다 붙이고 보내세요`, 12000);
}
/* 서버에 보내 달라고 부른다.
   ⚠ 첨부 파일을 실어 보내지 않는다 — 자료 번호만 준다. 파일은 이미 실시간DB 에
     있으므로 서버가 직접 읽는 것이 빠르고, 도중에 끊겨 절반만 가는 일이 없다. */
async function postAutoMail(payload){
  const u = firebase.auth().currentUser;
  if(!u) throw new Error('로그인이 풀렸습니다');
  const token = await u.getIdToken();
  const res = await fetch(MAIL_FN_URL, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
    body: JSON.stringify(payload)
  });
  let j = null;
  try{ j = await res.json(); }catch(_){}
  if(!res.ok || !j || !j.ok) throw new Error((j&&j.error) || ('서버 응답 '+res.status));
  return j;
}
/* ── 보낸 기록 ──
   '이 업체에 제안서 보냈던가'에 답하려고 남긴다. 전 직원이 본다 (대표 결정) —
   담당자가 바뀌거나 자리를 비워도 이어받을 수 있어야 한다.

   ⚠ 개인 폴더 명함은 남기지 않는다. 기록 자리(pucards/sendLog)는 직원 누구나
     읽으므로, 남기는 순간 그 명함 번호가 드러난다. */
function logSentMaterials(cardId, ids, to){
  try{
    if(Store.mode!=='firebase' || !cardId) return;
    if((state.priv.items||{})[cardId]) return;
    const rec = sendLogRec({
      at: Date.now(),
      by: myEmail || '',
      to: to || '',
      names: ids.map(id=>(_matMeta[id]||{}).name || '자료'),
      set: _sendMatSetName || ''
    });
    firebase.database().ref(`${DB_ROOT}/sendLog/${cardId}`).push(rec)
      .then(()=>{ (state.sendLog[cardId] = state.sendLog[cardId] || {})['t'+rec.at] = rec; })
      .catch(e=>console.warn('[보낸 기록]', e&&e.message));
  }catch(_){}
}
/* 한 명함의 보낸 기록을 읽어 상세 화면에 채운다 — 명함을 열 때만 읽는다
   (6천 장 기록을 늘 들고 있을 이유가 없다) */
function loadSendLog(cardId, cb){
  if(Store.mode!=='firebase') { if(cb) cb(); return; }
  firebase.database().ref(`${DB_ROOT}/sendLog/${cardId}`).once('value')
    .then(s=>{ state.sendLog[cardId] = s.val() || {}; if(cb) cb(); })
    .catch(()=>{ if(cb) cb(); });
}
function sendLogHtml(cardId){
  const rows = sendLogList(state.sendLog[cardId], 5);
  if(!rows.length) return '';
  return `<div class="sendlog">
    <div class="slh">📤 보낸 자료 <span>${sendLogList(state.sendLog[cardId]).length}회</span></div>
    ${rows.map((r,i)=>`<div class="slrow ${i?'':'on'}">
      <div class="sld">${fmtDate(r.at)}${r.by?' · '+esc(String(r.by).split('@')[0]):''}</div>
      <div class="sln">${r.set?`<b>📦 ${esc(r.set)}</b> — `:''}${esc((r.names||[]).join(' · ')||'자료')}</div>
    </div>`).join('')}</div>`;
}
/* 자료 한 개를 파일로 내려받는다 (미리보기와 같은 방식으로 데이터를 되살린다) */
async function downloadMaterial(id){
  const m=_matMeta[id]; if(!m) throw new Error('자료 정보 없음');
  if(m.url){ window.open(m.url,'_blank'); return; }   /* 예전 Storage 방식 호환 */
  const arr = await matBytes(id);
  const t = matType(m.fileName) || {mime:'application/octet-stream'};
  const blob = new Blob([arr], {type:t.mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = m.fileName || ((m.name||'자료')+'.dat');
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* ══════ 자료함 — 본문 전용 화면 ══════
   팝업이 좁아 이름을 prompt 로만 받을 수 있었고 설명은 아예 넣을 곳이 없었다.

function setMatCat(c){ state.matCat = c || 'all'; renderMatPage(); }

  if(Store.mode!=='firebase'){ if(_tplBody===null) _tplBody=TPL_DEFAULT; if(cb) cb(); return; }
  firebase.database().ref(DB_ROOT+'/config/proposalTpl').once('value')
    .then(s=>{ _tplBody = (s.val()==null ? TPL_DEFAULT : String(s.val())); if(cb) cb(); })
    .catch(()=>{ _tplBody = TPL_DEFAULT; if(cb) cb(); });
}
function saveTpl(v){
  _tplBody = String(v==null?'':v);
  if(Store.mode!=='firebase') return toast('클라우드에 연결된 상태에서만 저장됩니다');
  firebase.database().ref(DB_ROOT+'/config/proposalTpl').set(_tplBody)
    .then(()=>{ toast('제안서 틀을 저장했습니다'); renderMatPage(); })
    .catch(e=>toast('저장 실패: '+((e&&e.message)||'')));

let _propCardId = null;
function makeProposal(){
  const it = state.items[_propCardId] || (state.priv.items||{})[_propCardId]; if(!it) return;
  if(typeof HWPX==='undefined') return toast('한글 문서 도구를 불러오지 못했습니다 — 새로고침 후 다시 시도하세요', 7000);
  const body = (_tplBody===null ? TPL_DEFAULT : _tplBody);
  const vals = {};
  tplFields(body).forEach(f=>{ const el=$('tpf_'+f); vals[f] = el ? el.value.trim() : ''; });
  const text = tplFill(body, vals);
  try{
    /* 첫 줄과 제목 줄만 굵게 — 나머지는 보통. 서식을 많이 손대면 한글에서 되레 지저분해진다 */
    const xml = text.split('\n').map((ln,i)=>
      HWPX.para(ln, (i<=2 && ln.trim()) ? HWPX.BOLD : '0')).join('');
    const who = (vals['회사명'] || it.company || it.name || '고객').replace(/[\\/:*?"<>|]/g,'');
    const d=new Date();
    const ymd = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    HWPX.download(xml, `제안서_${who}_${ymd}.hwpx`);
    toast('📄 한글문서를 내려받았습니다 — 한글에서 열어 확인하세요', 8000);
    try{ dedupBg.classList.remove('open'); }catch(_){}
  }catch(e){
    toast('문서를 만들지 못했습니다: '+((e&&e.message)||'알 수 없음'), 8000);
  }
}
function openMatPage(){ state.view='mat'; render();

  + `<button class="mattab" style="border-style:dashed;color:#1d4fc4" onclick="addMatCat()"
       title="제안서·계약서 말고 다른 갈래를 만듭니다">＋ 갈래</button>`
  + `<span style="width:1px;background:#e4e8f0;margin:0 3px"></span>`
  + `<button class="mattab ${cat==='set'?'on':''}" onclick="setMatCat('set')"
       title="여러 자료를 미리 묶어 두고 보낼 때 한 번에 고릅니다">📦 묶음 <b>${setList(_matSets).length}</b></button>`
  + `<button class="mattab ${cat==='mail'?'on':''}" onclick="setMatCat('mail')"
       title="자료를 보낼 때 열리는 메일의 제목·본문">✉️ 메일 본문</button>`
  + `<button class="mattab ${cat==='tpl'?'on':''}" onclick="setMatCat('tpl')"
       title="업체명·금액만 채우면 한글 제안서가 만들어집니다">📝 제안서 틀</button>`;
  if(cat==='set'){  el.innerHTML = matPageShell(tabs, matSetsHtml());  return; }
  if(cat==='mail'){ el.innerHTML = matPageShell(tabs, matMailHtml());  return; }
  /* 제안서 틀은 파일이 아니라 글이라 목록 대신 편집칸을 보여준다 */
  if(cat==='tpl'){
    if(_tplBody===null) loadTpl(()=>{ if(state.view==='mat') renderMatPage(); });
    el.innerHTML = matPageShell(tabs,
      _tplBody===null ? '<div class="matempty">불러오는 중…</div>' : tplEditorHtml());
    return;
  }
  const matIds = list.map(m=>m.id);
  const matSel = pickPrune(pickOf('mat'), matIds); pickPut('mat', matSel);
  const rows = list.length ? list.map((m,i)=>`
    <div class="matcard ${pickOn(matSel,m.id)?'pkon':''}">
      <div class="matline">
        <label class="matpk" title="골라서 한 번에 지우거나 옮깁니다"><input type="checkbox"
          ${pickOn(matSel,m.id)?'checked':''} onchange="pickHit('mat','${m.id}')"></label>
        <span class="matno" title="순번 — ▲▼ 로 바꿉니다">${i+1}</span>
        <span class="matord">
          <button onclick="moveMat('${m.id}',-1)" ${i===0?'disabled':''} title="위로">▲</button>
          <button onclick="moveMat('${m.id}',1)" ${i===list.length-1?'disabled':''} title="아래로">▼</button>
        </span>
        <span class="matic">${matIcon(m.fileName)}</span>
        <div class="matf">
          <label>이름</label>
          <input value="${esc(m.name||'')}" placeholder="예: 2025 인사노무자문 제안서"
            onchange="saveMatField('${m.id}','name',this.value)">
        </div>
        <div class="matf" style="flex:0 0 130px;min-width:120px">
          <label>갈래</label>
          <select onchange="saveMatField('${m.id}','cat',this.value)">
            ${cats.map(c=>`<option value="${c}" ${matCat(m)===c?'selected':''}>${esc(c)}</option>`).join('')}
          </select>
        </div>
        <div class="matacts">
          <button onclick="previewMat('${m.id}')" title="오른쪽 칸에서 내용 보기">👁 보기</button>
          <label class="matrep" title="파일 교체">🔄 교체<input type="file" accept="${MAT_ACCEPT}" style="display:none" onchange="replaceMaterialFile('${m.id}',this)"></label>
          <button class="matdel" onclick="deleteMaterial('${m.id}')" title="삭제">🗑</button>
        </div>
      </div>
      <div class="matf">
        <label>설명 <span style="font-weight:400;color:#8b98b3">— 메일 본문에 함께 들어갑니다</span></label>
        <input value="${esc(m.desc||'')}" placeholder="예: 자문 계약 전에 보내는 기본 제안서"
          onchange="saveMatField('${m.id}','desc',this.value)">
      </div>
      <div class="matmeta">📄 ${esc(m.fileName||'')} · ${m.size?((m.size/1024/1024).toFixed(1)+'MB · '):''}${fmtDate(m.uploadedAt)}</div>
    </div>`).join('')
    : (state.matQ
        ? `<div class="matempty">「${esc(state.matQ)}」로 찾은 자료가 없습니다.</div>`
        : cat==='all'
        ? `<div class="matempty">아직 자료가 없습니다.<br>오른쪽 위 <b>＋ 새 자료 올리기</b>로 제안서·계약서·홍보물을 올리세요.</div>`
        : `<div class="matempty">「${esc(cat)}」에 든 자료가 없습니다.<br>자료의 <b>갈래</b>를 이걸로 바꾸면 여기 모입니다.</div>`);
  /* 오른쪽 미리보기 — [보기]를 누른 자료의 내용을 목록 옆에서 바로 본다.
     내려받아 열지 않아도 어느 자료인지 확인하고 보낼 수 있다(대표 지시 2026-08-09). */
  const prevMeta = state.matPrevId ? _matMeta[state.matPrevId] : null;
  /* 제목줄에 **몇 번째 자료**인지 붙인다 — 왼쪽 목록의 순번과 눈으로 맞춘다 */
  const prevNo = prevMeta ? (list.findIndex(m=>m.id===state.matPrevId)+1) : 0;
  const panel = `<div id="matPrev">
      <div class="mph">${prevMeta
        ? `${prevNo?`<span class="matno">${prevNo}</span>`:''}${matIcon(prevMeta.fileName)} ${esc(prevMeta.name||'자료')}`
        : '👁 미리보기'}
        ${prevMeta?`<button class="mpx" onclick="closeMatPreview()" title="닫기">✕</button>`:''}</div>
      <div class="mpb" id="mpBody">${prevMeta ? '' : '<div class="mpmsg">왼쪽 목록에서 <b>👁 보기</b>를 누르면<br>여기에 내용이 나옵니다</div>'}</div>
    </div>`;
  el.innerHTML = matPageShell(tabs, `
    <div class="matsearch">
      <input id="matQ" value="${esc(state.matQ||'')}" placeholder="🔍 자료 이름·설명으로 찾기"
        oninput="state.matQ=this.value;renderMatPage();document.getElementById('matQ').focus()">
      ${state.matQ?`<button onclick="state.matQ='';renderMatPage()" title="지우기">✕</button>`:''}
    </div>
    <div class="matwrap">
      <div class="matlist">
        ${list.length ? pickBar('mat', matIds,
          `<button class="pkmv" onclick="pickMoveMat()">📁 갈래 옮기기</button>
           <button class="pkdel" onclick="pickDelMat()">🗑 지우기</button>`) : ''}
        ${rows}
        <p style="font-size:11.5px;color:#8b98b3;line-height:1.7;margin-top:12px">
          ※ 여기 올린 자료는 명함의 <b>이메일을 누를 때</b> 고를 수 있습니다.
          ▲▼ 로 순번을 바꾸면 고르는 화면에도 그대로 나옵니다.</p>
      </div>
      ${panel}
    </div>`, all.length);
  initMatDrop();
  if(state.matPrevId) fillMatPreview(state.matPrevId);
  /* 글자를 치면 화면을 다시 그리므로 커서가 끝으로 간다 — 끝에 두는 것이 맞다(계속 이어 친다) */
  const q=$('matQ'); if(q && state.matQ){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
}
/* [보기] — 오른쪽 칸에 내용을 채운다.
   한글 자료를 고치던 중이면 먼저 물어본다(heLeaveOk). */
function previewMat(id){
  if(_he && _he.id!==id && !heLeaveOk()) return;
  state.matPrevId=id; renderMatPage();
}
/* 미리보기 닫기 — 들고 있던 한글 문서도 함께 놓는다 */
function closeMatPreview(){
  if(!heLeaveOk()) return;
  state.matPrevId=''; renderMatPage();
}
/* 내용 채우기 — 한 번 읽은 자료는 다시 읽지 않는다.
   ⚠ 찾기칸에 글자를 칠 때마다 화면을 다시 그리는데, 그때마다 2MB 씩 다시
     내려받으면 타자마다 통신이 나간다. 마지막 자료의 결과를 들고 있다가 재사용. */
let _mpFor=null, _mpHtml='', _mpUrl=null;
let _matHwpCurrent=null;
function closeMaterialHwp(){ const el=$('matHwpBack'); if(el) el.remove(); _matHwpCurrent=null; }
function downloadMaterialOriginal(){
  if(!_matHwpCurrent) return;
  PureunHwp.download(_matHwpCurrent.bytes,_matHwpCurrent.name);
}
async function openMaterialHwp(bytes,name){
  try{ PureunHwp.validate(bytes,name); }
  catch(e){ toast('한글 파일 확인 실패: '+((e&&e.message)||''),7000); return; }
  closeMaterialHwp();
  _matHwpCurrent={bytes:bytes,name:name};
  const back=document.createElement('div'); back.id='matHwpBack'; back.className='mat-hwp-back';
  back.innerHTML='<div class="mat-hwp-modal" role="dialog" aria-modal="true"><div class="mat-hwp-head"><b></b><button type="button" onclick="closeMaterialHwp()">✕</button></div><div id="matHwpBody">미리보기를 준비하는 중…</div><div class="mat-hwp-foot"><button type="button" onclick="downloadMaterialOriginal()">📥 원본 저장</button><button type="button" onclick="closeMaterialHwp()">닫기</button></div></div>';
  back.querySelector('b').textContent='📕 '+name;
  back.onclick=function(e){if(e.target===back) closeMaterialHwp();};
  document.body.appendChild(back);
  try{ await PureunHwp.renderPreview($('matHwpBody'),bytes,name); }
  catch(e){ $('matHwpBody').innerHTML='<div class="mpmsg">미리보기를 만들지 못했습니다.<br>원본은 그대로 보관되어 있습니다.<br>아래 원본 저장을 이용해 주세요.</div>'; }
}
async function fillMatPreview(id){
  const box=$('mpBody'); if(!box) return;
  /* 한글 자료를 열어 두었으면 다시 받지 않는다 — 고치던 글이 날아가면 안 된다.
     찾기칸에 글자를 칠 때마다 화면을 다시 그리므로 이 갈래가 꼭 있어야 한다. */
  if(_he && _he.id===id){ heRender(); return; }
  /* 한글 화면이 켜 두었던 위→아래 채우기를 되돌린다 — 그림·PDF 는 가운데 맞춤이다 */
  box.style.display=''; box.style.alignItems='';
  if(_mpFor===id && _mpHtml){ box.innerHTML=_mpHtml; return; }
  const m=_matMeta[id];
  if(!m){ box.innerHTML='<div class="mpmsg">자료가 없습니다 (지워졌을 수 있습니다)</div>'; return; }
  const t=matType(m.fileName)||{};
  const dl=`<button class="mattab" style="margin-top:10px" onclick="downloadMaterial('${id}')">📥 내려받아 확인</button>`;
  if(m.url){ _mpFor=id; _mpHtml=`<iframe src="${esc(m.url)}"></iframe>`; box.innerHTML=_mpHtml; return; }
  if(!t.view && !/^(hwp|hwpx)$/.test(matExt(m.fileName))){
    _mpFor=id;
    _mpHtml=`<div class="mpmsg">📎 ${esc(m.fileName||'')}<br>이 형식은 브라우저로 미리 볼 수 없습니다.<br>${dl}</div>`;
    box.innerHTML=_mpHtml; return;
  }
  box.innerHTML='<div class="mpmsg">불러오는 중…</div>';
  try{
    const arr = await matBytes(id);
    if(state.matPrevId!==id) return;              /* 기다리는 사이 다른 것을 눌렀다 */
    if(_mpUrl){ try{URL.revokeObjectURL(_mpUrl)}catch(_){} _mpUrl=null; }
    if(/^(hwp|hwpx)$/.test(matExt(m.fileName))){
      /* 한글 자료는 오른쪽 칸에서 바로 보고 고친다 — 팝업으로 띄우지 않는다.
         담아 두기(_mpHtml)를 쓰지 않는다: 문서를 들고 있어야 고친 것이 살아 있다. */
      _mpFor=null; _mpHtml='';
      await heOpen(id, arr, m.fileName||m.name||'한글자료.hwp');
      return;
    }
    if((t.mime||'')==='text/plain'){
      _mpHtml=`<pre class="mptxt">${esc(new TextDecoder('utf-8').decode(arr).slice(0,20000))}</pre>`;
    }else{
      _mpUrl=URL.createObjectURL(new Blob([arr],{type:t.mime||'application/octet-stream'}));
      _mpHtml=(t.mime||'').startsWith('image/') ? `<img src="${_mpUrl}">` : `<iframe src="${_mpUrl}"></iframe>`;
    }
    _mpFor=id; box.innerHTML=_mpHtml;
  }catch(e){
    if(state.matPrevId!==id) return;   /* 기다리는 사이 다른 것을 눌렀다 — 남의 화면을 덮지 않는다 */
    box.innerHTML='<div class="mpmsg">읽지 못했습니다 — '+esc((e&&e.message)||'')+'</div>';
  }
}

/* ══════ 한글 자료(hwp·hwpx) — 오른쪽 칸에서 보고 고치기 ══════
   제안서·계약서를 내려받아 한글로 열고 다시 올리는 세 걸음이 번거로웠다.
   오른쪽 칸에서 줄마다 번호를 붙여 보여주고 그 자리에서 고친다(대표 지시 2026-08-10).

   ⚠ 글자만 바꾼다. 있는 문서 위에 글자를 갈아 넣고 다시 저장하므로 글꼴·표·도장
     자리는 그대로다. 줄을 새로 만들거나 표 칸을 늘리는 일은 한글에서 해야 한다.
   ⚠ 문서(_he.doc)는 WASM 쪽 기억을 쓴다. 다른 자료로 옮길 때 반드시 free() 한다.
     안 비우면 여러 개 열어 볼수록 브라우저가 무거워진다. */
let _he = null;   /* {id,name,bytes,doc,rows,edited,mode:'view'|'edit',busy} */

function heDirty(){
  return !!(_he && _he.mode==='edit' && PuHwpEdit.changedRows(_he.rows, _he.edited).length);
}
function heClose(){
  if(!_he) return;
  try{ if(_he.doc && _he.doc.free) _he.doc.free(); }catch(_){}
  _he=null;
}
/* 다른 자료로 옮기기 전에 물어본다 — 고친 것을 말없이 버리면 안 된다 */
function heLeaveOk(){
  if(!heDirty()) { heClose(); return true; }
  if(!confirm('고친 내용을 아직 저장하지 않았습니다.\n버리고 다른 자료를 볼까요?')) return false;
  heClose(); return true;
}

async function heOpen(id, bytes, name){
  const box=$('mpBody'); if(!box) return;
  heClose();
  box.innerHTML='<div class="mpmsg">📕 한글 문서를 여는 중…<br><span style="font-size:11.5px">처음 한 번은 조금 걸립니다</span></div>';
  try{
    const doc = await PureunHwp.openDoc(bytes, name);
    if(state.matPrevId!==id){ try{doc.free()}catch(_){} return; }   /* 기다리는 사이 다른 것을 눌렀다 */
    _he={id:id, name:name, bytes:bytes, doc:doc, rows:[], edited:{}, mode:'view', busy:false};
    /* 열면 곧바로 **번호 붙은 줄**을 보여준다 — 보고 고치는 것이 이 화면의 목적이다.
       글을 못 뽑는 문서(그림만 있는 것)면 원래 모습으로 물러난다. */
    try{ _he.rows = PuHwpEdit.readRows(doc); }catch(_){ _he.rows=[]; }
    if(_he.rows.length) _he.mode='edit';
    heRender();
  }catch(e){
    box.innerHTML='<div class="mpmsg">📕 '+esc(name)+'<br>한글 문서를 열지 못했습니다 — '+esc((e&&e.message)||'')+
      '<br><button class="mattab" style="margin-top:10px" onclick="downloadMaterial(\''+id+'\')">📥 내려받아 확인</button></div>';
  }
}

function heRender(){
  const box=$('mpBody'); if(!box || !_he) return;
  /* 미리보기 칸은 가운데 맞춤이다 — 여기서는 위에서 아래로 채워야 한다 */
  box.style.display='block'; box.style.alignItems='stretch';
  const edit = _he.mode==='edit';
  const chn = edit ? PuHwpEdit.changedRows(_he.rows,_he.edited).length : 0;
  box.innerHTML =
    `<div class="hebar">
      ${edit
        ? `<button onclick="heToView()">👁 원래 모습</button>
           <button onclick="heBig()">⤢ 크게</button>
           <button class="go" id="heSaveB" onclick="heSave()" ${chn?'':'disabled'}>💾 자료함에 저장</button>
           <button id="heDownB" onclick="heDownload()" ${chn?'':'disabled'}>📥 내려받기</button>
           <span class="sp"></span>
           <span class="cnt" id="heCnt">${chn?`고친 줄 <b>${chn}</b>개`:'고친 줄 없음'}</span>`
        : `<button class="go" onclick="heToEdit()">✏ 글 고치기</button>
           <button onclick="heBig()">⤢ 크게 보기</button>
           <button onclick="downloadMaterial('${_he.id}')">📥 원본 저장</button>`}
    </div>
    <div id="heBody"></div>
    ${edit ? `<div class="henote">번호는 <b>문서 안 줄 번호</b>입니다. 고칠 줄만 눌러 고치세요 —
       손대지 않은 줄은 건드리지 않습니다.<br>
       글꼴·표 모양은 그대로 남습니다. <b>줄을 새로 만들거나 표 칸을 늘리는 것은 한글에서</b> 해야 합니다.</div>` : ''}`;
  if(edit) heRenderRows(); else heRenderPages();
}

/* 원래 모습 — 문서를 그림으로 그린다. 고친 뒤에도 바뀐 모습이 보인다(바이트를 갈아 두었다). */
function heRenderPages(){
  const b=$('heBody'); if(!b) return;
  b.innerHTML='<div class="mpmsg">모습을 그리는 중…</div>';
  PureunHwp.renderPreview(b, _he.bytes, _he.name).catch(e=>{
    b.innerHTML='<div class="mpmsg">모습을 그리지 못했습니다 — '+esc((e&&e.message)||'')+
      '<br>글 고치기는 그대로 쓸 수 있습니다.</div>';
  });
}

/* 번호 붙은 줄 — 이것이 대표가 요청한 화면이다 */
function heRenderRows(){
  const b=$('heBody'); if(!b) return;
  const rows=_he.rows;
  if(!rows.length){
    b.innerHTML='<div class="mpmsg">고칠 글을 찾지 못했습니다.<br>글이 그림·글상자 안에 있는 문서일 수 있습니다.</div>';
    return;
  }
  b.innerHTML=`<div class="helist">${rows.map((r,i)=>{
    const v = _he.edited[i]==null ? r.text : _he.edited[i];
    const on = PuHwpEdit.clean(v)!==r.text;
    return `<div class="herow ${r.kind==='cell'?'cell':''} ${on?'on':''}" id="heR${i}">
      <span class="no" title="${r.kind==='cell'?'표 안':'본문'} ${r.no}번째 줄">${r.no}</span>
      <textarea rows="1" oninput="heInput(${i},this)"
        title="${r.kind==='cell'?`표 ${r.rc.row}행 ${r.rc.col}열`:'본문'}">${esc(v)}</textarea>
      ${r.kind==='cell'?`<span class="tag">표 ${r.rc.row}·${r.rc.col}</span>`:''}
    </div>`;
  }).join('')}</div>`;
  b.querySelectorAll('textarea').forEach(heFit);
}
function heFit(el){ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }
function heInput(i, el){
  if(!_he) return;
  _he.edited[i]=el.value;
  heFit(el);
  /* 고친 줄만 표시를 바꾸고 개수를 고친다 — 화면을 다시 그리면 글 쓰던 자리를 잃는다 */
  const row=$('heR'+i);
  if(row) row.classList.toggle('on', PuHwpEdit.clean(el.value)!==_he.rows[i].text);
  const n=PuHwpEdit.changedRows(_he.rows,_he.edited).length;
  if($('heCnt')) $('heCnt').innerHTML = n?`고친 줄 <b>${n}</b>개`:'고친 줄 없음';
  if($('heSaveB')) $('heSaveB').disabled = !n;
  if($('heDownB')) $('heDownB').disabled = !n;
}
function heToEdit(){
  if(!_he) return;
  try{ _he.rows = PuHwpEdit.readRows(_he.doc); }
  catch(e){ toast('글을 읽지 못했습니다 — '+((e&&e.message)||''), 6000); return; }
  _he.edited={}; _he.mode='edit'; heRender();
}
function heToView(){
  if(!_he) return;
  if(heDirty() && !confirm('고친 내용을 아직 저장하지 않았습니다.\n버리고 원래 모습을 볼까요?')) return;
  _he.edited={}; _he.mode='view'; heRender();
}
function heBig(){ if(_he) openMaterialHwp(_he.bytes, _he.name); }

/* ══════════════ 격자 편집기 — 서식을 표 모양 그대로 ══════════════
   서랍의 세로 목록으로는 서식을 못 고친다. 서식은 거의 전부 표라서
   칸을 한 줄씩 늘어놓으면 원래 모양이 사라진다(20행×3열 급여표 → 60줄).
   여기서는 표를 표로 그려 한 화면에서 훑고 고친다.

   ⚠ 문서(_mg.doc)는 WASM 쪽 기억을 쓴다. 닫을 때 반드시 free() 한다.
   ⚠ 원본 모습은 renderPreview(el, _mg.bytes, …) 로 그린다. bytes 다.
     doc 을 넘기면 그 문서가 죽어 편집이 통째로 멈춘다. */
let _mg = null;   /* {id,name,bytes,doc,grid,edited,busy} */

function mgChanged(){
  return _mg ? PuHwpEdit.changedRows(_mg.grid.units, _mg.edited).length : 0;
}
function closeMatEditor(){
  if(_mg && mgChanged() && !confirm('고친 내용을 아직 저장하지 않았습니다.\n버리고 닫을까요?')) return;
  if(_mg){ try{ if(_mg.doc && _mg.doc.free) _mg.doc.free(); }catch(_){} }
  _mg=null;
  const el=$('mgedBack'); if(el) el.remove();
}

async function openMatEditor(id){
  const m = _matMeta[id]; if(!m) return toast('자료를 찾지 못했습니다');
  const name = m.fileName || m.name || '한글자료.hwp';
  if(!/^(hwp|hwpx)$/.test(matExt(name)))
    return toast('한글 문서(.hwp·.hwpx)만 고칠 수 있습니다 — PDF 는 글자를 바꿀 수 없습니다', 7000);
  if(_mg) closeMatEditor();
  if(_mg) return;                                  /* 닫기를 취소했다 */

  const back=document.createElement('div');
  back.className='mged'; back.id='mgedBack';
  back.innerHTML='<div class="mged-box" role="dialog" aria-modal="true">'
    +'<div class="mged-head">📄 '+esc(m.name||name)+'<button class="x" onclick="closeMatEditor()">✕</button></div>'
    +'<div class="mged-body" id="mgedBody"><div class="mpmsg">📕 한글 문서를 여는 중…<br>'
    +'<span style="font-size:11.5px">처음 한 번은 조금 걸립니다</span></div></div></div>';
  back.addEventListener('click', e=>{ if(e.target===back) closeMatEditor(); });
  document.body.appendChild(back);

  try{
    const arr = await matBytes(id);
    const doc = await PureunHwp.openDoc(arr, name);
    if(!$('mgedBack')){ try{doc.free()}catch(_){} return; }   /* 기다리는 사이 닫았다 */
    _mg={id:id, name:name, bytes:arr, doc:doc, grid:{units:[],blocks:[],warn:{badCellInfo:0,textBoxes:0}},
         edited:{}, busy:false};
    try{ _mg.grid = PuHwpEdit.readGrid(doc); }catch(e){
      return mgFail('글을 읽지 못했습니다 — '+((e&&e.message)||''));
    }
    mgRender();
  }catch(e){
    mgFail('한글 문서를 열지 못했습니다 — '+((e&&e.message)||''));
  }
}
function mgFail(msg){
  const b=$('mgedBody'); if(b) b.innerHTML='<div class="mpmsg">'+esc(msg)+'</div>';
}

function mgRender(){
  const box=$('mgedBack'); if(!box || !_mg) return;
  const n=mgChanged(), w=_mg.grid.warn;
  const miss=[];
  if(w.textBoxes) miss.push('글상자 '+w.textBoxes+'개');
  if(w.badCellInfo) miss.push('자리를 모르는 칸 '+w.badCellInfo+'개');
  box.querySelector('.mged-box').innerHTML =
    '<div class="mged-head">📄 '+esc((_matMeta[_mg.id]||{}).name||_mg.name)
      +'<button class="x" onclick="closeMatEditor()">✕</button></div>'
    +'<div class="mged-bar">'
      +'<button onclick="mgPreview()">👁 원본 모습</button>'
      +'<button class="go" id="mgSaveB" onclick="mgSave()"'+(n?'':' disabled')+'>💾 자료함에 저장</button>'
      +'<button id="mgDownB" onclick="mgDownload()"'+(n?'':' disabled')+'>📥 내려받기</button>'
      +'<span class="cnt" id="mgCnt">'+(n?'고친 곳 <b>'+n+'</b>개':'고친 곳 없음')+'</span>'
    +'</div>'
    +'<div class="mged-body" id="mgedBody">'+mgGridHtml()+'</div>'
    +(miss.length
      ? '<div class="mged-note">⚠ 아직 못 읽는 것이 있습니다 — '+esc(miss.join(', '))
        +'. 이 부분은 한글에서 고쳐 주십시오.</div>'
      : '');
  mgFitAll();
}

function mgGridHtml(){
  const g=_mg.grid;
  if(!g.blocks.length) return '<div class="mpmsg">고칠 글을 찾지 못했습니다.<br>글이 그림 안에 있는 문서일 수 있습니다.</div>';
  return g.blocks.map(b=> b.kind==='body'
    ? '<div class="mgbody">'+mgLineHtml(b.unit)+'</div>'
    : mgTableHtml(b)).join('');
}

/* 한 줄 — 번호와 고칠 칸. 번호는 문서 안 차례이고 저장할 때 쓰는 열쇠이기도 하다. */
function mgLineHtml(i){
  const u=_mg.grid.units[i];
  const v=_mg.edited[i]==null ? u.text : _mg.edited[i];
  const on=PuHwpEdit.clean(v)!==u.text;
  return '<div class="mgline'+(on?' on':'')+'" id="mgL'+i+'">'
    +'<span class="no">'+u.no+'</span>'
    +'<textarea rows="1" oninput="mgInput('+i+',this)">'+esc(v)+'</textarea></div>';
}

/* 표를 표로 그린다.
   ⚠ 자리는 getCellInfo 가 준 row·col 만 쓴다. 칸 번호를 열 수로 나눠 짐작하면
     합친 칸이 하나만 있어도 그 뒤가 전부 어긋난다(실제 공문에 55개 있었다).
   ⚠ 합친 칸이 덮는 자리는 미리 막아 둔다. 안 막으면 칸이 오른쪽으로 밀린다. */
function mgTableHtml(b){
  const rows=Math.max(1,b.rows), cols=Math.max(1,b.cols);
  const taken={};                                  /* 'r-c' → 이미 다른 칸이 덮었다 */
  const at={};                                     /* 'r-c' → 거기서 시작하는 칸 */
  const orphan=[];                                 /* 자리를 모르는 칸 */
  b.cells.forEach(c=>{
    if(c.row==null || c.col==null){ orphan.push(c); return; }
    at[c.row+'-'+c.col]=c;
  });
  let h='<table class="mgtbl">';
  for(let r=0;r<rows;r++){
    h+='<tr>';
    for(let c=0;c<cols;c++){
      if(taken[r+'-'+c]) continue;
      const cell=at[r+'-'+c];
      if(!cell){ h+='<td></td>'; continue; }
      const rs=Math.max(1,cell.rowSpan), cs=Math.max(1,cell.colSpan);
      for(let dr=0;dr<rs;dr++) for(let dc=0;dc<cs;dc++)
        if(dr||dc) taken[(r+dr)+'-'+(c+dc)]=1;
      h+=`<td rowspan="${rs}" colspan="${cs}">`+cell.units.map(mgLineHtml).join('')+'</td>';
    }
    h+='</tr>';
  }
  h+='</table>';
  /* 자리를 못 읽은 칸도 고칠 수 있어야 한다. 조용히 빼면 영영 못 고친다. */
  if(orphan.length){
    h+='<div class="mgorph">⚠ 자리를 모르는 칸 '+orphan.length+'개 — 표 어디인지 알 수 없지만 고칠 수는 있습니다.'
      +orphan.map(c=>c.units.map(mgLineHtml).join('')).join('')+'</div>';
  }
  return h;
}

function mgFit(el){ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }
function mgFitAll(){ const b=$('mgedBody'); if(b) b.querySelectorAll('textarea').forEach(mgFit); }

/* 화면을 다시 그리지 않는다 — 그리면 글 쓰던 자리를 잃는다 */
function mgInput(i, el){
  if(!_mg) return;
  _mg.edited[i]=el.value;
  mgFit(el);
  const row=$('mgL'+i);
  if(row) row.classList.toggle('on', PuHwpEdit.clean(el.value)!==_mg.grid.units[i].text);
  const n=mgChanged();
  if($('mgCnt')) $('mgCnt').innerHTML = n?'고친 곳 <b>'+n+'</b>개':'고친 곳 없음';
  if($('mgSaveB')) $('mgSaveB').disabled=!n;
  if($('mgDownB')) $('mgDownB').disabled=!n;
}

/* 고친 줄을 문서에 넣고 새 바이트를 만든다.
   ⚠ 넣은 뒤에는 줄 길이가 달라졌다 — 반드시 다시 읽어야 다음 저장이 어긋나지 않는다. */
function heApply(){
  const ch = PuHwpEdit.changedRows(_he.rows, _he.edited);
  if(!ch.length) return {ok:0, failed:[]};
  const res = PuHwpEdit.applyRows(_he.doc, ch);
  _he.bytes = PuHwpEdit.exportBytes(_he.doc, _he.name);
  _he.rows = PuHwpEdit.readRows(_he.doc);
  _he.edited = {};
  return res;
}
function heTellFailed(res){
  if(!res.failed.length) return;
  toast('넣지 못한 줄: '+res.failed.map(f=>f.no+'번('+f.why+')').join(', '), 9000);
}
async function heSave(){
  if(!_he || _he.busy) return;
  const n = PuHwpEdit.changedRows(_he.rows,_he.edited).length;
  if(!n) return toast('고친 줄이 없습니다');
  if(!confirm(`고친 ${n}개 줄을 자료함의 「${_he.name}」에 저장합니다.\n예전 내용은 남지 않습니다. 진행할까요?`)) return;
  _he.busy=true;
  try{
    const res = heApply();
    heTellFailed(res);
    const t = matType(_he.name) || {mime:'application/octet-stream'};
    const file = new File([_he.bytes], _he.name, {type:t.mime});
    const cur = _matMeta[_he.id] || {};
    /* ⚠ 모습 보기로 먼저 돌려 둔다. putMaterial 이 화면을 다시 그리는데(matRefresh),
       그때 아직 '고치기'면 방금 저장한 목록이 한 번 더 그려져 눈이 깜빡인다. */
    _he.mode='view';
    await putMaterial(_he.id, cur.name || _he.name, file);   /* 갈래·설명·순서는 그대로 얹힌다 */
    toast('✅ 자료함에 저장했습니다');
  }catch(e){
    toast('저장하지 못했습니다 — '+((e&&e.message)||''), 8000);
  }finally{ _he.busy=false; }
}
function heDownload(){
  if(!_he || _he.busy) return;
  try{
    const res = heApply();
    heTellFailed(res);
    PureunHwp.download(_he.bytes, PuHwpEdit.editedName(_he.name), PuHwpEdit.extOf(_he.name));
    toast('📥 고친 문서를 내려받았습니다 — 자료함의 원본은 그대로입니다');
    heRender();
  }catch(e){ toast('만들지 못했습니다 — '+((e&&e.message)||''), 8000); }
}

/* ══════ 메일 화면 (본문 전체) ══════
   팝업으로는 본문·첨부를 손보기가 갑갑했다. 자료함·환경설정과 같은 방식으로 본문을 쓴다.
   state.mailSent 가 true 면 보낸 메일함, 아니면 쓰기. */
function openMailPage(pre){
  /* 설정을 읽은 뒤 판정한다 (openSendMaterials 와 같은 이유) */
  if(!_matLoaded && Store.mode==='firebase'){ loadMaterials(()=>openMailPage(pre)); return; }
  /* 「메일창만 열기」로 두었으면 여기서 보낼 수 없다 — 켜는 곳을 알려 준다.
     안 막으면 다 쓰고 [보내기]를 눌렀을 때 비로소 안 된다는 것을 알게 된다. */
  if(mailModeOf(matMailCfg())!=='auto')
    return toast('자료함 → ✉️ 메일 본문에서 「회사 메일로 바로 보내기」를 켜면 여기서 바로 쓸 수 있습니다', 8000);
  state.view='mail'; state.mailSent=false;
  /* 쓰다 만 글이 있으면 이어서 쓴다 — 명함에서 새로 들어온 경우(pre)는 그것이 먼저다 */
  if(!_compose && !pre){
    const d = loadDraft();
    if(d && composeTouched(d)){
      const when = new Date(d.at).toTimeString().slice(0,5);
      if(confirm(`${when} 에 쓰다 만 메일이 있습니다.\n\n받는 곳 · ${d.to||'(비어 있음)'}\n제목 · ${d.subject||'(없음)'}\n\n이어서 쓸까요?\n\n[취소]를 누르면 쓰다 만 글을 **버리고** 새 메일로 시작합니다.`)){
        _compose = Object.assign({ picking:true }, d);
        state.draftAt = when;
        if(d.lostFiles && d.lostFiles.length)
          setTimeout(()=>toast(`💻 내 PC 파일(${d.lostFiles.join(' · ')})은 다시 붙여 주세요 — 임시저장에는 담기지 않습니다`, 9000), 400);
      } else {
        /* 취소 = 버리고 새로. 지우기만 하면 자동저장이 되살릴 수 있으므로
           쓰던 편지도 함께 비운다 (대표 지시 2026-08-10). */
        clearDraft();
        _compose = null;
        toast('쓰다 만 메일을 버리고 새로 시작합니다', 5000);
      }
    }
  }
  if(!_compose || pre){
    const tpl = matMailCfg();
    const p = pre || {};
    const vals = { 받는분: p.name||'', 회사명: p.company||'', 자료목록:'', 오늘: fmtDate(Date.now()) };
    const subject0 = mailFill(tpl.subject || MAIL_TPL_DEFAULT.subject, vals);
    const body0 = mailFill(tpl.body || MAIL_TPL_DEFAULT.body, vals)
                    .replace(/^\s*님,?\s*/,'').replace(/\n{3,}/g,'\n\n');
    _compose = {
      cardId: p.cardId||'', to: p.to||'', cc:'',
      subject: subject0, body: body0,
      /* 처음 채워진 글을 기억해 둔다 — 손댔는지 견주는 잣대다(composeTouched) */
      base: { subject: subject0, body: body0 },
      ids: p.ids||[], files: [], picking: true
    };
  }
  render();
  try{ $('pcMain').scrollTop=0; }catch(_){}
  if(!_matLoaded && Store.mode==='firebase') loadMaterials(()=>{ if(state.view==='mail') renderMailPage(); });
}
/* ── 예약한 메일 ──
   서버 자리(pucards/scheduled)에 담겨 때를 기다리는 것들. 취소·되돌리기가 여기서 된다. */
function openSchedBox(){ state.view='mail'; state.mailSent='sched'; render();
  try{ $('pcMain').scrollTop=0; }catch(_){}
  loadSchedBox(()=>{ if(state.view==='mail' && state.mailSent==='sched'){ renderPCSide(); renderMailPage(); } }); }
function loadSchedBox(cb){
  if(Store.mode!=='firebase'){ if(cb) cb(); return; }
  firebase.database().ref(DB_ROOT+'/scheduled').limitToLast(200).once('value')
    .then(s=>{ state.schedBox = s.val()||{}; if(cb) cb(); })
    .catch(e=>{ console.warn('[예약메일]', e&&e.message); if(cb) cb(); });
}
function schedList(){
  return Object.entries(state.schedBox||{})
    .map(([id,v])=>Object.assign({id}, v||{}))
    .filter(v=>v.at)
    .sort((a,b)=>(a.at||0)-(b.at||0));
}
function schedBoxHtml(){
  const rows = schedList();
  const ids = rows.map(v=>v.id);
  const sel = pickPrune(pickOf('sched'), ids); pickPut('sched', sel);
  const body = rows.length ? rows.map((v,i)=>{
    const p = v.payload||{};
    const bad = v.state==='failed';
    return `<tr class="${bad?'bad':''} ${pickOn(sel,v.id)?'pkon':''}">
      <td class="pk"><label><input type="checkbox" ${pickOn(sel,v.id)?'checked':''}
        onchange="pickHit('sched','${v.id}')"><span class="no">${i+1}</span></label></td>
      <td class="w">${esc(fmtWhen(v.at))}<span>${bad?'보내지 못함':(v.state==='sending'?'보내는 중':'기다리는 중')}</span></td>
      <td class="b">${esc(staffName(v.by))}</td>
      <td><b>${esc(p.toName||'')}</b><span class="e">${esc(p.to||'')}</span></td>
      <td>${esc(p.subject||'')}<span class="e">${esc((p.matIds||[]).map(id=>(_matMeta[id]||{}).name||'자료').join(' · ')||'첨부 없음')}${
        bad?`<br><b style="color:#c0392b">${esc(String(v.error||'').split('\n')[0])}</b>`:''}</span></td>
      <td class="a">
        <button onclick="editScheduled('${v.id}')">고쳐 쓰기</button>
        <button onclick="cancelScheduled('${v.id}')">취소</button>
      </td></tr>`;
  }).join('')
    : `<tr><td colspan="6" class="none">예약해 둔 메일이 없습니다.</td></tr>`;
  return `
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <button class="setback" onclick="closeMailPage()">← 목록으로</button>
      <h2 style="margin:0;font-size:17px;color:#16223c">⏰ 예약한 메일</h2>
      <span style="font-size:12px;color:#8b98b3">${rows.length}통</span>
      <button class="mattab" style="margin-left:auto" onclick="openMailPage()">✏️ 새 메일</button>
    </div>
    ${pickBar('sched', ids, `<button class="pkdel" onclick="pickCancelSched()">🗑 예약 취소</button>`)}
    <table class="sbox"><thead><tr>
      <th class="pk"></th><th>보낼 때</th><th>예약한 사람</th><th>받는 곳</th><th>제목 · 첨부</th><th></th>
    </tr></thead><tbody>${body}</tbody></table>
    <p style="font-size:11.5px;color:#8b98b3;line-height:1.7;margin-top:12px">
      ※ 서버가 5분마다 살펴 보냅니다 — <b>창을 닫아도 나갑니다.</b> 정한 때보다 최대 5분 늦을 수 있습니다.<br>
      ※ 💻 내 PC 파일은 예약에 담기지 않습니다. 그런 첨부가 있으면 그때 직접 보내 주세요.</p>`;
}
function cancelScheduled(id){
  const v=(state.schedBox||{})[id]; if(!v) return;
  const p=v.payload||{};
  if(!confirm(`예약을 취소합니다.\n\n받는 곳 · ${p.to||''}\n보낼 때 · ${fmtWhen(v.at)}\n\n진행할까요?`)) return;
  firebase.database().ref(`${DB_ROOT}/scheduled/${id}`).remove()
    .then(()=>{ delete state.schedBox[id]; toast('예약을 취소했습니다'); renderPCSide(); renderMailPage(); })
    .catch(e=>toast('취소하지 못했습니다: '+((e&&e.message)||'')));
}
/* 예약을 걷어 쓰기 화면으로 — 고쳐서 다시 걸 수 있게 */
function editScheduled(id){
  const v=(state.schedBox||{})[id]; if(!v) return;
  const p=v.payload||{};
  if(!confirm(`이 예약을 걷어 고쳐 씁니다.\n\n예약은 지워지고 쓰기 화면으로 갑니다.\n진행할까요?`)) return;
  firebase.database().ref(`${DB_ROOT}/scheduled/${id}`).remove()
    .then(()=>{
      delete state.schedBox[id];
      _compose = { cardId:p.cardId||'', to:p.to||'', cc:p.cc||'', bcc:p.bcc||'',
        subject:p.subject||'', body:p.body||'',
        ids:(p.matIds||[]).filter(x=>_matMeta[x]), files:[],
        toMe:!!p.toMe, oneByOne:!!p.oneByOne, sendAt:v.at, picking:true, base:{} };

/* ── 가운데 손잡이로 좌우 넓이 조절 ──
   자료 서랍이 좁아 서류 이름과 미리보기가 답답했다. 끌어서 넓힌다 (대표 지시 2026-08-10).
   ⚠ 넓이는 **화면 너비의 절반까지**. 더 늘리면 편지 쓰는 자리가 서랍보다 좁아진다.
   ⚠ 끄는 동안 다시 그리지 않는다. 다시 그리면 잡고 있던 손잡이가 사라져 끌기가 끊긴다 —
     끝난 뒤에 한 번만 담아 둔다. */
const DRAWERW_LS = 'pucards_mail_drawerw';
const DRAWERW_MIN = 220, DRAWERW_DEFAULT = 300;
function drawerMax(){
  const w = $('pcMail') ? $('pcMail').clientWidth : 900;
  return Math.max(DRAWERW_MIN, Math.round(w * 0.5));   /* 화면의 절반까지 */
}
function setDrawerW(px, save){
  const w = Math.min(drawerMax(), Math.max(DRAWERW_MIN, Math.round(px)));
  state.drawerW = w;
  const wrap = document.querySelector('#pcMail .mwrap');
  if(wrap) wrap.style.setProperty('--drawer', w+'px');
  if(save) try{ localStorage.setItem(DRAWERW_LS, String(w)); }catch(_){}
  return w;
}
function loadDrawerW(){
  try{ const v=parseInt(localStorage.getItem(DRAWERW_LS)||'',10);
    if(v>0) state.drawerW=v; }catch(_){}
}
function initMailGrip(){
  const g=$('mGrip'); if(!g || g._grip) return; g._grip=true;
  const wrap = g.parentElement;
  g.addEventListener('pointerdown', e=>{
    e.preventDefault();
    const startX = e.clientX, startW = state.drawerW || DRAWERW_DEFAULT;
    g.setPointerCapture(e.pointerId);
    g.classList.add('on');
    document.body.classList.add('mresizing');
    const move = ev => setDrawerW(startW + (startX - ev.clientX), false);   /* 왼쪽으로 끌면 넓어진다 */
    const up = ev => {
      g.removeEventListener('pointermove', move);
      g.removeEventListener('pointerup', up);
      g.removeEventListener('pointercancel', up);
      g.classList.remove('on');
      document.body.classList.remove('mresizing');
      setDrawerW(state.drawerW, true);        /* 끝난 뒤 한 번만 담는다 */
    };
    g.addEventListener('pointermove', move);
    g.addEventListener('pointerup', up);
    g.addEventListener('pointercancel', up);
  });
  /* 두 번 누르면 원래대로 — 잘못 끌어 놓고 되돌릴 길이 있어야 한다 */
  g.addEventListener('dblclick', ()=>{ setDrawerW(DRAWERW_DEFAULT, true); toast('자료 서랍 넓이를 원래대로'); });
  if(wrap) wrap.style.setProperty('--drawer', (state.drawerW||DRAWERW_DEFAULT)+'px');
}

/* ── 글꼴·크기·굵게 ──
   ⚠ 보내는 글은 **글자만 있는 메일(text)** 이다. 그래서 이 설정은 **쓰는 동안

const BODYSTYLE_LS = 'pucards_mail_bodystyle';

const SIGN_DEFAULT =
`----------------------------------------

  F : 041-429-0222

/* ── 예약 발송 ──
   ⚠ 정해진 때에 깨어나는 서버가 따로 없다. 그래서 **이 브라우저가 켜져 있어야**
     나간다 — 창을 닫으면 안 나간다. 그 사실을 감추지 않고 그대로 알린다.
     감추면 「보냈는데 안 갔다」가 되고, 그것이 제일 나쁘다. */
function fmtWhen(ts){
  const d=new Date(ts||0); const p=n=>(n<10?'0':'')+n;
  return `${d.getMonth()+1}월 ${d.getDate()}일 ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function toLocalInput(ts){
  const d=new Date(ts||0); const p=n=>(n<10?'0':'')+n;
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
/* ⚠ 때를 재는 것은 **서버**다. 예전에는 이 화면이 재고 있어서 창을 닫으면
   안 나갔다 — 「예약했는데 안 갔다」가 되는 자리라 서버로 옮겼다(2026-08-10).
   여기서는 언제 보낼지만 정하고, [예약하기]를 누르면 서버 자리에 담긴다. */
function toggleSchedule(on){
  grabCompose(); if(!_compose) return;
  if(!on){ _compose.sendAt=0; renderMailPage(); return; }
  const d=new Date(Date.now()+3600000); d.setSeconds(0,0);
  _compose.sendAt = d.getTime();
  renderMailPage();
  toast('때를 정한 뒤 [예약하기]를 누르면 서버에 맡겨집니다 — 창을 닫아도 나갑니다', 8000);
}
function setSchedule(v){
  grabCompose(); if(!_compose) return;
  const t = new Date(v).getTime();
  if(!t || t < Date.now() + 30000) return toast('지금부터 30초 뒤 이후로 골라 주세요');
  _compose.sendAt = t;
  renderMailPage();
  toast(`${fmtWhen(t)} 에 보냅니다`);
}
function setComposeFlag(k, v){ grabCompose(); if(!_compose) return; _compose[k]=!!v; renderMailPage(); }

/* ── 임시저장 ──
   쓰다가 다른 화면으로 갔다 와도 이어 쓸 수 있어야 한다.
   ⚠ 이 브라우저에만 둔다. 서버에 두면 직원끼리 쓰다 만 편지가 섞인다.
   ⚠ 💻 내 PC 파일은 담지 않는다 — 8MB 짜리가 브라우저 저장칸을 금세 채운다.
     대신 이름만 남겨 무엇을 다시 붙여야 하는지 알린다. */
const DRAFT_LS = 'pucards_mail_draft';
function draftOf(c){
  if(!c) return null;
  return { cardId:c.cardId||'', to:c.to||'', cc:c.cc||'', bcc:c.bcc||'',
           subject:c.subject||'', body:c.body||'', ids:c.ids||[],
           base:c.base||{},          /* 잣대도 함께 — 이어 쓴 뒤에도 손댔는지 알 수 있게 */
           toMe:!!c.toMe, oneByOne:!!c.oneByOne,
           lostFiles:(c.files||[]).map(f=>f.name), at:Date.now() };
}
/* 손댄 편지인가 — 받는사람이 있거나, 첨부가 있거나, 제목·본문을 기본 글에서 바꿨나.
   ⚠ 이 판단이 없으면 **열어만 두어도** 기본 글이 임시저장되고, 다음에 들어올 때마다
     「이어서 쓸까요?」가 뜬다. 취소해도 30초 뒤 자동저장이 다시 만들어 되풀이됐다
     (2026-08-10 실제 증상). */
function composeTouched(c){
  if(!c) return false;
  if(String(c.to||'').trim()) return true;
  if(String(c.cc||'').trim() || String(c.bcc||'').trim()) return true;
  if((c.ids||[]).length || (c.files||[]).length) return true;
  const base = c.base || {};
  if(String(c.subject||'') !== String(base.subject||'')) return true;
  if(String(c.body||'')    !== String(base.body||''))    return true;
  return false;
}
function saveDraft(quiet){
  grabCompose();
  if(!_compose) return;
  if(!composeTouched(_compose)){
    /* 손대지 않았다 — 담아 둘 것이 없다. 남아 있던 것도 치운다. */
    clearDraft();
    if(!quiet) toast('아직 쓴 내용이 없습니다');
    return;
  }
  try{
    localStorage.setItem(DRAFT_LS, JSON.stringify(draftOf(_compose)));
    state.draftAt = new Date().toTimeString().slice(0,5);
    if(!quiet) toast('임시저장했습니다 — 다음에 「메일 쓰기」로 오면 이어서 씁니다', 6000);
    else { const el=document.querySelector('.mauto'); if(el) el.textContent='자동저장 '+state.draftAt; }
  }catch(e){ if(!quiet) toast('임시저장하지 못했습니다: '+((e&&e.message)||'')); }
}
function loadDraft(){
  try{ const v=JSON.parse(localStorage.getItem(DRAFT_LS)||'null');
    if(!v || !v.at) return null;
    v.ids = (v.ids||[]).filter(id=>_matMeta[id]);   /* 그 사이 지워진 자료는 뺀다 */
    v.files = [];
    return v;
  }catch(_){ return null; }
}
function clearDraft(){ try{ localStorage.removeItem(DRAFT_LS); }catch(_){} state.draftAt=''; }
/* 30초마다 조용히 담아 둔다 — 자리를 비운 사이 창이 닫혀도 글이 남는다 */

/* 첨부칸에 파일을 끌어다 놓기 */
function initMailDrop(){
  const z=$('cpDrop'); if(!z || z._dnd) return; z._dnd=true;
  ['dragenter','dragover'].forEach(ev=>z.addEventListener(ev, e=>{ e.preventDefault(); e.stopPropagation(); z.classList.add('over'); }));
  z.addEventListener('dragleave', e=>{ if(!z.contains(e.relatedTarget)) z.classList.remove('over'); });
  z.addEventListener('drop', async e=>{
    /* ⚠ window 에도 파일 드롭 처리기가 있다 — 여기서 끊지 않으면 명함 등록으로도 흘러간다 */
    e.preventDefault(); e.stopPropagation(); z.classList.remove('over');
    await addLocalFiles({ files: (e.dataTransfer&&e.dataTransfer.files)||[] });
  });
}
/* 받는사람 칸에 자동 찾기를 붙인다 — 화면을 새로 그릴 때마다 다시 매단다 */
function wireMailWrite(){
  initMailDrop();
  initMailGrip();
  const to=$('cpTo'), sug=$('cpSug'); if(!to||!sug) return;
  const close=()=>{ sug.innerHTML=''; sug.classList.remove('on'); };
  to.addEventListener('input', ()=>{
    if(_compose) _compose.to = to.value;
    /* 마지막 쉼표 뒤의 말로만 찾는다 — 여러 명을 적는 중일 수 있다 */
    const tail = to.value.split(/[,;]/).pop().trim();
    const hits = findPeople(state.items, tail, 8);
    if(!hits.length) return close();
    sug.innerHTML = hits.map(it=>{
      const em = normEmail(it.email);
      return `<div class="cpsi ${em?'':'off'}" ${em?`onclick="pickPerson('${it.id}')"`:''}>

        <span class="c">${esc(it.company||'')}</span>
        <span class="e">${em?esc(em):'이메일 없음'}</span></div>`;
    }).join('');
    sug.classList.add('on');
  });
  to.addEventListener('blur', ()=>{ setTimeout(close, 180); });   /* 누르는 것을 먼저 받게 조금 늦춘다 */
}
function pickPerson(id){
  const it = state.items[id]; if(!it) return;

/* 지금 화면에 보일 보낸 메일 — 걸러보기·찾기를 다 거친 결과.
   그리는 곳과 「골라서 한 번에」가 **같은 목록**을 봐야 한다. 따로 세면 개수가 어긋난다. */
function sentVisibleRows(){
  const q = String(state.sentQ||'').trim().toLowerCase().replace(/\s/g,'');
  let rows = Object.entries(state.sentBox||{})
    .map(([id,v])=>Object.assign({id}, v||{}))
    .filter(v=>v.at)
    .sort((a,b)=>(b.at||0)-(a.at||0));
  if(state.sentMine) rows = rows.filter(v=>String(v.by||'').toLowerCase()===String(myEmail||'').toLowerCase());
  /* 왼쪽 메뉴에서 고른 갈래·보낸 사람 */
  if(state.sentBy) rows = rows.filter(v=>String(v.by||'')===state.sentBy);
  if(state.sentCat){
    const catOf = v => { const ids=(v.ids||[]).filter(id=>_matMeta[id]);
      return ids.length ? matCat(_matMeta[ids[0]]) : ''; };
    rows = rows.filter(v=> state.sentCat==='__none' ? !catOf(v) : catOf(v)===state.sentCat);
  }
  if(q) rows = rows.filter(v=>[v.to,v.subject,(v.names||[]).join(' '),v.by,v.toName]
    .some(x=>String(x||'').toLowerCase().replace(/\s/g,'').includes(q)));
  return rows;
}

/* 같은 내용으로 다시 쓰기 — 받는사람·제목·본문·자료를 그대로 옮겨 쓰기 화면을 연다.
   ⚠ 💻 내 PC 파일은 옮기지 못한다. 그 파일은 서버에 두지 않았다(이번 편지에만 붙는 파일). */

/* ══════ 보낸 사람 이름 — 순수 로직 (테스트 대상) ══════
   대표 지시 2026-08-10: "보낸사람은 이름으로 나와야 된다."
   그동안 로그인 계정을 그대로 잘라 써서 「p001」로 나왔다. 사람 이름이 아니면
   누가 보냈는지 알 수 없다.

   ⚠ 명부를 아직 못 읽었거나 명부에 없는 계정이면 **계정 앞부분이라도 보여준다** —
     빈칸으로 두면 「누가 보냈는지 모르는 메일」이 되어 더 나쁘다. */
function staffNameOf(dirMap, email){
  const e = String(email||'').trim().toLowerCase();
  if(!e) return '';
  const hit = dirMap && dirMap[e];
  if(hit) return hit;
  return e.split('@')[0];
}
function staffName(email){ return staffNameOf(ErpMatch.nameByEmail, email); }

/* ══════ 목록 골라 한 번에 — 순수 로직 (테스트 대상) ══════
   대표 지시 2026-08-10: "푸른명함첩에 생성되는 서류들은 모두 넘버링 넣고 ㅁ 로
   체크해서 삭제 이동등 할 수 있는 시스템을 꼭 만들어 달라."

   자료함·보낸 메일·예약한 메일 **세 목록이 같은 방식**을 쓴다. 목록마다 다른 방식으로
   고르게 만들면 쓰는 사람이 매번 새로 배워야 한다.

   ⚠ 골라 둔 것에서 **지금 목록에 없는 것을 반드시 걸러낸다.** 고른 뒤 찾기말을 바꾸거나
     남이 지우면, 안 보이는 것이 조용히 딸려 와 함께 지워진다. */
function pickOn(sel, id){ return !!(sel && sel[id]); }
function pickToggle(sel, id){
  const s = Object.assign({}, sel||{});
  if (s[id]) delete s[id]; else s[id] = true;
  return s;
}
/* 지금 보이는 것 전부 켜기·끄기 — 걸러 놓은 것만 걸린다 */
function pickSetAll(sel, ids, on){
  const s = Object.assign({}, sel||{});
  (ids||[]).forEach(id => { if (on) s[id] = true; else delete s[id]; });
  return s;
}
/* 실제로 손댈 번호들 — **지금 목록에 있는 것만** */
function pickList(sel, ids){ return (ids||[]).filter(id => pickOn(sel, id)); }
/* 보이는 것이 다 켜져 있나 (「모두 고르기」 단추의 상태) */
function pickAllOn(sel, ids){
  return !!(ids && ids.length) && ids.every(id => pickOn(sel, id));
}
/* 목록에서 사라진 번호는 버린다 — 안 버리면 개수가 틀려 「3개 지우기」인데 2개만 지운다 */
function pickPrune(sel, ids){
  const live = new Set(ids||[]);
  const s = {};
  Object.keys(sel||{}).forEach(id => { if (live.has(id)) s[id] = true; });
  return s;
}
/* ══════ 목록 골라 한 번에 — 화면 ══════ */

/* 세 목록이 각각 따로 기억한다 — 자료함에서 고른 것이 메일 목록에 딸려가면 안 된다 */
function pickOf(kind){ state.pick = state.pick||{}; return state.pick[kind]||{}; }
function pickPut(kind, sel){ state.pick = state.pick||{}; state.pick[kind] = sel; }
function pickClear(kind){ pickPut(kind, {}); }

/* 골라 둔 개수와 단추를 그리는 띠 — 셋이 같은 모양이어야 한다 */
function pickBar(kind, ids, acts){
  const sel = pickOf(kind);
  const on = pickList(sel, ids);
  const allOn = pickAllOn(sel, ids);
  return `<div class="pkbar ${on.length?'on':''}">
    <label class="pkall"><input type="checkbox" ${allOn?'checked':''}
      onchange="pickToggleAll('${kind}')"> 모두 고르기 ${ids.length?`(${ids.length})`:''}</label>
    ${on.length
      ? `<span class="pkn"><b>${on.length}</b>개 골랐습니다</span>${acts}
         <button class="pkx" onclick="pickCancel('${kind}')">고르기 취소</button>`
      : `<span class="pkhint">☐ 를 눌러 여러 개를 고르면 한 번에 정리할 수 있습니다</span>`}
  </div>`;
}
/* 화면마다 다시 그리는 함수가 다르다 — 한 곳에 모아 둔다 */
function pickRedraw(kind){
  if (kind === 'mat') renderMatPage(); else renderMailPage();
}
/* 지금 화면에 보이는 번호들 — 걸러 놓은 것·찾은 것만.
   ⚠ 「모두 고르기」와 일괄 처리가 **이것만** 본다. 전체 목록을 보면 걸러서 안 보이는
     것까지 딸려 와 함께 지워진다. */
/* 자료함이 지금 보여주는 번호들 — renderMatPage 가 목록을 만드는 식과 **같은 식**이다.
   화면에서 값을 받아 두면 화면을 안 그린 채 눌렸을 때 낡은 값으로 지우게 된다. */
function matVisibleIds(){
  return matSearchList(matListByCat(state.matCat||'all'), state.matQ).map(m=>m.id);
}
function pickVisible(kind){
  if (kind === 'mat')  return matVisibleIds();
  if (kind === 'sent') return sentVisibleRows().map(v=>v.id);
  if (kind === 'sched') return schedList().map(v=>v.id);
  return [];
}
function pickHit(kind, id){ pickPut(kind, pickToggle(pickOf(kind), id)); pickRedraw(kind); }
function pickToggleAll(kind){
  const ids = pickVisible(kind);
  pickPut(kind, pickSetAll(pickOf(kind), ids, !pickAllOn(pickOf(kind), ids)));
  pickRedraw(kind);
}
function pickCancel(kind){ pickClear(kind); pickRedraw(kind); }

/* ── 보낸 메일 기록 지우기 ──
   기록만 지운다. 이미 나간 메일을 되돌리는 것이 아니라는 것을 말로 못 박는다. */
async function pickDelSent(){
  const ids = pickList(pickOf('sent'), pickVisible('sent'));
  if(!ids.length) return toast('고른 것이 없습니다');
  if(!confirm(`보낸 기록 ${ids.length}건을 지웁니다.\n\n`+
    `이미 나간 메일이 취소되는 것은 아닙니다 — 여기 남은 기록만 지웁니다.\n진행할까요?`)) return;
  try{
    const u = {};
    ids.forEach(id=>{ u[`${DB_ROOT}/sentBox/${id}`] = null; });
    if(Store.mode==='firebase') await firebase.database().ref().update(u);
    ids.forEach(id=>{ delete state.sentBox[id]; });
    pickClear('sent'); renderPCSide(); renderMailPage();
    toast(`🗑 보낸 기록 ${ids.length}건을 지웠습니다`, 5000);
  }catch(e){ toast('지우지 못했습니다: '+((e&&e.message)||''), 7000); }
}

/* ── 예약 여러 건 취소 ── */

/* ── 자료 여러 개 지우기·갈래 옮기기 ── */
async function pickDelMat(){
  const ids = pickList(pickOf('mat'), pickVisible('mat'));
  if(!ids.length) return toast('고른 것이 없습니다');
  const names = ids.map(id=>(_matMeta[id]||{}).name||'자료').slice(0,5).join(' · ');
  if(!confirm(`자료 ${ids.length}개를 지웁니다.\n${names}${ids.length>5?' …':''}\n\n`+
    `되돌릴 수 없습니다. 진행할까요?`)) return;
  try{
    const u = {};
    ids.forEach(id=>{ u[`${DB_ROOT}/materials/${id}`] = null; u[`${DB_ROOT}/materialFiles/${id}`] = null; });
    await firebase.database().ref().update(u);
    ids.forEach(id=>{
      delete _matMeta[id];
      if(state.matPrevId===id) state.matPrevId='';
      if(_he && _he.id===id) heClose();
    });
    pickClear('mat'); matRefresh();
    toast(`🗑 자료 ${ids.length}개를 지웠습니다`, 5000);
  }catch(e){ toast('지우지 못했습니다: '+((e&&e.message)||''), 7000); }
}
async function pickMoveMat(){
  const ids = pickList(pickOf('mat'), pickVisible('mat'));
  if(!ids.length) return toast('고른 것이 없습니다');
  const cats = MAT_CATS_NOW();
  const to = prompt(`자료 ${ids.length}개를 어느 갈래로 옮길까요?\n\n`+
    cats.map((c,i)=>`${i+1}. ${c}`).join('\n')+`\n\n번호나 갈래 이름을 적어 주세요.`);
  if(to===null) return;
  const t = String(to).trim();
  const cat = /^\d+$/.test(t) ? cats[parseInt(t,10)-1] : cats.find(c=>c===t);
  if(!cat) return toast('그런 갈래가 없습니다 — 자료함에서 갈래를 먼저 만들어 주세요', 6000);
  try{
    const u = {};
    ids.forEach(id=>{ u[`${DB_ROOT}/materials/${id}/cat`] = cat; });
    await firebase.database().ref().update(u);
    ids.forEach(id=>{ if(_matMeta[id]) _matMeta[id].cat = cat; });
    pickClear('mat'); matRefresh();
    toast(`📁 자료 ${ids.length}개를 「${cat}」로 옮겼습니다`, 5000);
  }catch(e){ toast('옮기지 못했습니다: '+((e&&e.message)||''), 7000); }
}

/* 자료함 화면의 껍데기 — 제목줄·탭줄은 어느 탭에서나 같다 */
function matPageShell(tabs, inner, n){
  /* 올리기 자리는 제목줄 오른쪽 끝에 작게 둔다 — 예전에는 목록 위에 큰 상자로
     자리를 크게 먹어서, 자료가 몇 개만 있어도 화면이 상자로 가득했다.
     파일 목록을 보는 탭에서만 나온다(묶음·메일 본문·제안서 틀에는 올릴 것이 없다). */
  const up = (n===undefined) ? '' : `
    <label class="matadd-sm" id="matDrop"
      title="누르거나, 파일을 이 자리에 끌어다 놓으세요 · PDF·워드·한글·PPT·엑셀·이미지 (8MB 이하)">
      ＋ 새 자료 올리기
      <input type="file" multiple accept="${MAT_ACCEPT}" style="display:none" onchange="addMaterial(this)">
    </label>`;
  return `
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <button class="setback" onclick="closeMatPage()">← 목록으로</button>
      <h2 style="margin:0 0 10px;font-size:17px;color:#16223c">📎 자료함</h2>
      ${n===undefined?'':`<span style="margin:0 0 10px;font-size:12px;color:#8b98b3">고객에게 보낼 자료를 여기서 관리합니다 · ${n}개</span>`}
      ${up}
    </div>
    <div class="mattabs">${tabs}</div>
    ${inner}`;
}
/* ── 갈래 만들기·이름 바꾸기·지우기 ──
   지울 때 자료를 함께 지우지 않는다. '기타'로 옮긴다 — 갈래는 서랍일 뿐이고
   서랍을 뺐다고 안에 든 것을 버리지는 않는다. */
function saveMatCats(arr){
  const clean = matCatsOf(arr).filter(c=>c!==MAT_CAT_ETC);   /* '기타'는 저장하지 않는다 — 늘 붙는다 */
  return firebase.database().ref(DB_ROOT+'/config/matCats').set(clean)
    .then(()=>{ _matCats = clean; });
}
function addMatCat(){
  const v = (prompt('새 갈래 이름을 입력하세요.\n(예: 산재서식, 취업규칙, 교육자료)')||'').trim();
  if(!v) return;
  if(v===MAT_CAT_ETC) return toast('「기타」는 이미 있는 갈래입니다');
  const cur = MAT_CATS_NOW().filter(c=>c!==MAT_CAT_ETC);
  if(cur.indexOf(v)>=0) return toast('같은 이름의 갈래가 이미 있습니다');
  saveMatCats(cur.concat([v]))
    .then(()=>{ toast(`갈래 「${v}」을(를) 만들었습니다`); setMatCat(v); })
    .catch(e=>toast('만들지 못했습니다: '+((e&&e.message)||'')));
}
function editMatCat(name){
  const n = matList().filter(m=>matCat(m)===name).length;
  const v = prompt(`갈래 「${name}」\n\n· 새 이름을 넣고 [확인] → 이름이 바뀝니다 (자료 ${n}개도 따라갑니다)\n`
    + `· 비워 두고 [확인] → 갈래를 지웁니다 (자료 ${n}개는 「기타」로 옮겨집니다)`, name);
  if(v===null) return;
  const to = String(v).trim();
  if(to===name) return;
  const cur = MAT_CATS_NOW().filter(c=>c!==MAT_CAT_ETC);
  if(to && cur.indexOf(to)>=0) return toast('같은 이름의 갈래가 이미 있습니다');
  if(to===MAT_CAT_ETC) return toast('「기타」라는 이름은 쓸 수 없습니다');

  const patch = to ? matCatRenamePatch(_matMeta, name, to) : matCatDeletePatch(_matMeta, name);
  if(!to && !confirm(`갈래 「${name}」을(를) 지웁니다.\n\n`
    + `· 안에 든 자료 ${n}개는 지워지지 않고 「기타」로 옮겨집니다\n\n진행할까요?`)) return;

  const upd = {};
  Object.keys(patch).forEach(id=>{ upd[`${DB_ROOT}/materials/${id}/cat`] = patch[id]; });
  const next = to ? cur.map(c=>c===name?to:c) : cur.filter(c=>c!==name);
  firebase.database().ref().update(upd)
    .then(()=>{ Object.keys(patch).forEach(id=>{ if(_matMeta[id]) _matMeta[id].cat = patch[id]; });
                return saveMatCats(next); })
    .then(()=>{ toast(to ? `갈래 이름을 「${to}」로 바꿨습니다` : `갈래를 지웠습니다 — 자료 ${n}개는 「기타」에 있습니다`, 6000);
                if(state.matCat===name) state.matCat = to || MAT_CAT_ETC;
                renderMatPage(); })
    .catch(e=>toast('바꾸지 못했습니다: '+((e&&e.message)||'')));
}
/* ── 순서 바꾸기 ── */
function moveMat(id, dir){
  const cat = state.matCat || 'all';
  const shown = matSearchList(matListByCat(cat), state.matQ);
  /* 화면에서 이웃한 줄과 자리를 바꾸고, 번호는 **전체 기준**으로 다시 매긴다 */
  const other = matNeighborId(shown, id, dir);
  if(!other) return;
  const order = matSwapOrder(matList(), id, other);
  if(!order) return;
  const upd = {};
  Object.keys(order).forEach(mid=>{
    upd[`${DB_ROOT}/materials/${mid}/order`] = order[mid];
    if(_matMeta[mid]) _matMeta[mid].order = order[mid];
  });
  renderMatPage();
  firebase.database().ref().update(upd).catch(e=>toast('순서를 저장하지 못했습니다: '+((e&&e.message)||'')));
}

            onchange="toggleSetItem('${s.id}','${m.id}',this.checked)">

  return `<button class="matadd" style="border:none;margin-bottom:12px" onclick="addMatSet()">＋ 새 묶음 만들기</button>

    <p style="font-size:11.5px;color:#8b98b3;line-height:1.7;margin-top:12px">

function addMatSet(){
  const v=(prompt('묶음 이름을 입력하세요.\n(예: 신규 자문 3종, 계약 마무리)')||'').trim();
  if(!v) return;
  const id='s'+Date.now()+Math.random().toString(36).slice(2,6);
  const rec={id, name:v, ids:[], order:Date.now()};
  firebase.database().ref(DB_ROOT+'/matSets/'+id).set(rec)
    .then(()=>{ _matSets[id]=rec; toast('묶음을 만들었습니다 — 담을 자료를 고르세요',5000); renderMatPage(); })
    .catch(e=>toast('만들지 못했습니다: '+((e&&e.message)||'')));
}
function saveSetName(id, v){
  const s=_matSets[id]; if(!s) return;
  const name=String(v||'').trim(); if(!name || name===s.name) return;
  s.name=name;
  firebase.database().ref(DB_ROOT+'/matSets/'+id+'/name').set(name)
    .then(()=>toast('묶음 이름을 바꿨습니다')).catch(e=>toast('저장 실패: '+((e&&e.message)||'')));
}
function toggleSetItem(sid, mid, on){
  const s=_matSets[sid]; if(!s) return;
  const ids = (s.ids||[]).filter(x=>x!==mid);
  if(on) ids.push(mid);
  s.ids = ids;
  firebase.database().ref(DB_ROOT+'/matSets/'+sid+'/ids').set(ids)
    .then(()=>renderMatPage()).catch(e=>toast('저장 실패: '+((e&&e.message)||'')));
}
function deleteMatSet(id){
  const s=_matSets[id]; if(!s) return;
  if(!confirm(`묶음 「${s.name||''}」을(를) 지웁니다.\n자료 자체는 지워지지 않습니다.\n\n진행할까요?`)) return;
  firebase.database().ref(DB_ROOT+'/matSets/'+id).remove()
    .then(()=>{ delete _matSets[id]; toast('묶음을 지웠습니다'); renderMatPage(); })
    .catch(e=>toast('지우지 못했습니다: '+((e&&e.message)||'')));
}

function saveMatMail(){
  const subject=($('mailSubj')||{}).value||'';
  const body=($('mailBody')||{}).value||'';
  const sel=state.matMailCat||'';
  const path = sel ? `${DB_ROOT}/config/matMail/byCat/${sel}` : `${DB_ROOT}/config/matMail`;
  const val  = sel ? {subject, body} : Object.assign({}, matMailCfg(), {subject, body});
  firebase.database().ref(path).set(val)
    .then(()=>{ if(sel){ _matMail=_matMail||{}; _matMail.byCat=_matMail.byCat||{}; _matMail.byCat[sel]=val; }
                else { _matMail=val; }
                toast('메일 글을 저장했습니다'); renderMatPage(); })
    .catch(e=>toast('저장 실패: '+((e&&e.message)||'')));
}
/* 보내는 주소 — 비밀이 아니라서 화면에서 넣는다.
   ⚠ 비밀번호는 여기 넣지 않는다. 이 자리는 직원 누구나 읽는다. */
function saveMailFrom(v){
  const s = String(v||'').trim();
  if(s && !/^[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]{2,}$/.test(s))
    return toast('메일 주소 형식이 아닙니다 (예: 370-6@hanmail.net)', 6000);
  firebase.database().ref(`${DB_ROOT}/config/matMail/from`).set(s)

function initMatDrop(){
  const z=$('matDrop'); if(!z || z._dnd) return; z._dnd=true;
  ['dragenter','dragover'].forEach(ev=>z.addEventListener(ev, e=>{ e.preventDefault(); z.classList.add('on'); }));
  z.addEventListener('dragleave', e=>{ if(!z.contains(e.relatedTarget)) z.classList.remove('on'); });
  z.addEventListener('drop', async e=>{
    /* ⚠ stopPropagation 을 빠뜨리면 안 된다. window 에도 파일 드롭 핸들러가 있어서
       같은 파일이 **명함 등록**으로도 흘러간다 — 한글·PDF 를 명함 사진으로 읽으려다
       "파일을 읽을 수 없습니다" 가 뜬다. 자료는 올라갔는데 오류만 보이니 더 헷갈린다. */
    e.preventDefault(); e.stopPropagation(); z.classList.remove('on');
    const files=[...((e.dataTransfer&&e.dataTransfer.files)||[])];
    const ok=files.filter(f=>matType(f.name));
    if(!ok.length){ toast('지원하지 않는 파일 형식입니다 (PDF·워드·한글·PPT·엑셀·이미지 등)'); return; }
    if(ok.length<files.length) toast(`지원하지 않는 형식 ${files.length-ok.length}개는 건너뜁니다`);
    for(const f of ok){
      await putMaterial('m'+Date.now()+Math.random().toString(36).slice(2,6), matNameOf(f.name), f);
    }
    toast(`올렸습니다 (${ok.length}개) — 설명은 목록에서 채우시면 됩니다`, 5000);
  });
}

/* 올린 파일 이름을 그대로 자료 이름으로 쓴다 (대표 지시 2026-08-09).
   예전에는 이름을 물어봤는데, 파일 이름을 이미 그렇게 지어 두고 올리므로
   똑같은 말을 한 번 더 치는 일이 됐다. 고칠 것은 목록에서 바로 고친다.
   확장자는 뗀다 — 아래 줄에 파일 이름이 따로 나오므로 두 번 보일 이유가 없다. */
function matNameOf(fileName){
  return String(fileName||'').replace(/\.[a-z0-9]+$/i,'').trim() || '자료';
}
async function addMaterial(input){
  const files = [...((input && input.files) || [])]; if(input) input.value='';
  if(!files.length) return;
  const ok = files.filter(f=>matType(f.name));
  if(!ok.length){ toast('지원하지 않는 파일 형식입니다 (PDF·워드·한글·PPT·엑셀·이미지 등)'); return; }
  if(ok.length<files.length) toast(`지원하지 않는 형식 ${files.length-ok.length}개는 건너뜁니다`);
  for(const f of ok){
    const id = 'm'+Date.now()+Math.random().toString(36).slice(2,6);
    await putMaterial(id, matNameOf(f.name), f);
  }
}
async function replaceMaterialFile(id, input){
  const file = input.files && input.files[0]; input.value='';
  if(!file) return;
  if(!matType(file.name)){ toast('지원하지 않는 파일 형식입니다 (PDF·워드·한글·PPT·엑셀·이미지 등)'); return; }
  const cur = _matMeta[id]; if(!cur) return;
  /* 열어 둔 한글 문서는 옛 파일이다 — 놓아야 새 파일을 보게 된다 */
  if(_he && _he.id===id) heClose();
  await putMaterial(id, cur.name, file);

/* 파일 본문은 명함 사진과 같은 방식으로 DB에 저장 (Storage 미사용 — 권한설정 불필요) */
async function putMaterial(id, name, file){
  if (file.size > 8*1024*1024){ toast(`파일이 너무 큽니다 (${(file.size/1024/1024).toFixed(1)}MB) — 8MB 이하만 올릴 수 있습니다`); return; }
  toast('업로드 중…');
  try{
    const dataUrl = await new Promise((res,rej)=>{
      const r=new FileReader();
      r.onload=()=>res(r.result);
      r.onerror=()=>rej(new Error('파일을 읽을 수 없습니다'));
      r.readAsDataURL(file);
    });
    /* ⚠ 있던 자료를 교체하는 것일 수 있다. 새 값으로 통째로 덮으면 갈래·설명·순서가
       사라진다 — 파일만 바꿨을 뿐인데 정리해 둔 것이 날아간다. 있던 것 위에 얹는다. */
    const old = _matMeta[id] || {};
    const meta = Object.assign({}, old, {
      id, name, fileName:file.name, size:file.size, uploadedAt: Date.now(),
      /* 새로 올리는 것이면 **지금 보고 있는 갈래**에 넣는다. 제안서 탭에서 올렸는데
         '기타'로 들어가면 방금 올린 것이 눈앞에서 사라진다. */
      cat: old.cat || matNewCat()
    });
    await firebase.database().ref(DB_ROOT+'/materialFiles/'+id).set(dataUrl);
    await firebase.database().ref(DB_ROOT+'/materials/'+id).set(meta);
    _matMeta[id]=meta;
    /* ⚠ 두 화면이 있다. 옛 팝업(renderMaterialShelf)만 새로 그리면 본문 자료함은
       그대로라 **올렸는데 목록에 안 나타난다.** 지금 보고 있는 쪽을 다시 그린다. */
    matRefresh();
    toast('✅ 올렸습니다');
  }catch(e){
    console.warn('[upload]', e&&e.message);
    toast('업로드 실패: '+((e&&e.message)||'알 수 없는 오류'));
  }
}
async function previewMaterial(id){
  const m=_matMeta[id]; if(!m) return;
  if (m.url){ window.open(m.url,'_blank'); return; }  /* 예전 Storage 방식으로 올린 자료 호환 */
  toast('여는 중…');
  try{
    const arr = await matBytes(id);
    if(/^(hwp|hwpx)$/.test(matExt(m.fileName))){ await openMaterialHwp(arr,m.fileName||m.name||'한글자료.hwp'); return; }
    const t = matType(m.fileName) || {mime:'application/octet-stream'};
    const url = URL.createObjectURL(new Blob([arr], {type:t.mime}));
    if (t.view){ window.open(url,'_blank'); }
    else { /* 한글·워드·PPT 등 브라우저가 못 여는 형식은 원본 파일명으로 내려받기 */
      const a=document.createElement('a'); a.href=url; a.download=m.fileName||'자료';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      toast('브라우저에서 바로 볼 수 없는 형식이라 내려받았습니다');
    }
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){ toast('미리보기 실패: '+((e&&e.message)||'')); }
}
async function deleteMaterial(id){
  const m=_matMeta[id]; if(!m) return;
  if(!confirm(`'${m.name}' 자료를 삭제할까요?`)) return;
  try{
    await firebase.database().ref(DB_ROOT+'/materials/'+id).remove();
    await firebase.database().ref(DB_ROOT+'/materialFiles/'+id).remove();
    delete _matMeta[id];
    /* 지운 자료를 미리보기가 들고 있으면 함께 접는다 */
    if(state.matPrevId===id){ state.matPrevId=''; if(_mpFor===id){ _mpFor=null; _mpHtml=''; } }
    if(_he && _he.id===id) heClose();          /* 지운 자료의 문서를 들고 있으면 안 된다 */
    matRefresh();
    toast('삭제했습니다');
  }catch(e){ toast('삭제 실패: '+((e&&e.message)||'')); }
}

const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function chosung(s){ let r='';
  for (const ch of String(s||'')){ const c=ch.charCodeAt(0);
    r += (c>=0xAC00 && c<=0xD7A3) ? CHO[Math.floor((c-0xAC00)/588)] : ch; }
  return r; }
