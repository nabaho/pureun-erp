/* ════════════ 🗑 휴지통 (30일 보관) ════════════ */
const TRASH_DAYS = 30;
function openTrash(){
  const all = Object.values(state.trash||{}).sort((a,b)=>(b._deletedAt||0)-(a._deletedAt||0));
  const dleft = ts => Math.max(0, TRASH_DAYS - Math.floor((Date.now()-(ts||0))/86400000));
  let rows;
  if (!all.length){
    rows = `<div style="padding:30px;text-align:center;color:var(--sub)">휴지통이 비어 있습니다</div>`;
  } else {
    rows = all.map(it=>{
      const name = it.kind==='biz' ? (it.company||'(상호 없음)') : (it.name||it.company||'(이름 없음)');
      const sub = [it.company, it.mobile||it.companyTel].filter(Boolean).join(' · ');
      const left = dleft(it._deletedAt);
      return `<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #e4e8f0;border-radius:9px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px;color:#1e2a47;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(name)}</div>
          <div style="font-size:12px;color:#8b98b3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(sub)}</div>
        </div>
        <span style="font-size:11.5px;color:${left<=3?'#c0392b':'#8b98b3'};white-space:nowrap">${left}일 남음</span>
        <button onclick="restoreFromTrash('${it.id}')" style="border:1px solid #cfe0ff;background:#eef4ff;color:#2452b5;border-radius:7px;padding:6px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap">♻️ 복원</button>
        <button onclick="hardDelFromTrash('${it.id}')" style="border:1px solid #f3c2c2;background:#fff;color:#c0392b;border-radius:7px;padding:6px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap">영구삭제</button>
      </div>`;
    }).join('');
  }
  const h = `
    <div class="mhead"><b>🗑 휴지통 (${all.length})</b>
      ${_panelTarget==='inline' ? '' : `<button class="iconbtn" onclick="folderDlgBg.classList.remove('open')">✕</button>`}</div>
    <div style="font-size:12.5px;color:#8b98b3;padding:0 4px 10px">삭제한 명함은 ${TRASH_DAYS}일간 보관되며, 그 후 자동으로 완전히 삭제됩니다.</div>
    <div style="max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:7px;padding:2px">${rows}</div>
    ${all.length?`<div class="mfoot"><button class="btn ghost" onclick="emptyTrash()" style="color:#c0392b">휴지통 비우기 (전체 영구삭제)</button></div>`:''}`;
  if(_panelTarget==='inline'){ showPanel(h); return; }
  $('folderDlg').innerHTML = h;
  $('folderDlgBg').classList.add('open');
}
function restoreFromTrash(id){
  Store.restore(id);
  toast('명함을 복원했습니다');
  setTimeout(function(){_refresh(openTrash)}, 300);
}
function hardDelFromTrash(id){
  if(!confirm('이 명함을 완전히 삭제할까요? 복구할 수 없습니다.')) return;
  Store.hardDel(id);
  toast('영구 삭제했습니다');
  setTimeout(function(){_refresh(openTrash)}, 300);
}
function emptyTrash(){
  const n=Object.keys(state.trash||{}).length; if(!n) return;
  if(!confirm(`휴지통의 ${n}건을 모두 완전히 삭제할까요? 복구할 수 없습니다.`)) return;
  Object.keys(state.trash).forEach(id=>Store.hardDel(id));
  toast('휴지통을 비웠습니다');
  $('folderDlgBg').classList.remove('open');
}
/* 30일 지난 항목 자동 영구삭제 (앱 시작 시 1회) */
function purgeTrash(){
  try{
    const now=Date.now(); let n=0;
    Object.values(state.trash||{}).forEach(it=>{
      if (it._deletedAt && (now-it._deletedAt) > TRASH_DAYS*86400000){ Store.hardDel(it.id); n++; }
    });
    if(n) console.log(`휴지통 자동 정리: ${n}건`);
  }catch(e){ console.error('휴지통 정리 실패', e); }
}

/* 백업 파일(JSON) 복원 */
function onRestoreFile(files){
  const f=files&&files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{
    let data;
    try{ data=JSON.parse(reader.result); }
    catch(e){ return toast('백업 파일을 읽을 수 없습니다 (JSON 형식 아님)'); }
    const items=data.items||{}, groups=data.groups||{};
    const ic=Object.keys(items).length, gc=Object.keys(groups).length;
    if(!ic && !gc) return toast('백업 파일에 데이터가 없습니다');
    const cur=Object.keys(state.items).length;
    if(!confirm(`백업 복원: 명함 ${ic}건, 폴더 ${gc}개를 불러옵니다.\n\n현재 ${cur}건과 합쳐집니다 (같은 명함은 덮어씀).\n진행할까요?`)) return;
    let done=0;
    Object.values(groups).forEach(g=>{ if(g&&g.id) Store.putGroup(g); });
    Object.values(items).forEach(it=>{ if(it&&it.id){ Store.put(it); done++; } });
    toast(`백업 복원 완료 — 명함 ${done}건, 폴더 ${gc}개`);
  };
  reader.readAsText(f);
}

/* 전체 백업 — items + groups를 JSON 파일로 (환경설정의 수동 버튼 전용) */
function backupNow(silent){
  const cnt = Object.keys(state.items||{}).length;
  if (!cnt){ if(!silent) toast('백업할 명함이 없습니다'); return; }
  try{
    if(!silent) toast(`백업 파일 만드는 중… (${cnt.toLocaleString()}건, 잠시만요)`,8000);
    const data = { backupAt: new Date().toISOString(), items: state.items, groups: state.groups };
    const json = JSON.stringify(data);
    const blob = new Blob([json], {type:'application/json'});
    const mb = (blob.size/1048576).toFixed(1);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `푸른명함첩_백업_${fmtDate(Date.now())}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    if(!silent) toast(`✅ 백업 완료 — ${cnt.toLocaleString()}건 (${mb}MB). 다운로드 폴더를 확인하세요`,6000);
  }catch(e){
    console.error('[backup]', e);
    if(!silent) toast('백업 실패: '+((e&&e.message)||'파일이 너무 크거나 브라우저 제한') + ' — 다운로드 차단 여부를 확인하세요',7000);
  }
}

  const targets = Object.values(state.items).filter(it=>it.kind===state.tab);

/* ════════════ 가져오기: 리멤버 엑셀 · 구글 CSV · vCard ════════════ */
async function needXLSX(){
  if (window.XLSX) return;
  await new Promise((res,rej)=>{ const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=res; s.onerror=rej; document.head.appendChild(s); });
}
async function onImportFile(files){
  const f=files[0]; if(!f) return;
  try{
    toast('파일 분석 중…',9000);
    let rows;
    if (/\.vcf$/i.test(f.name)) rows = parseVcf(await f.text());
    else if (/\.csv$/i.test(f.name) || /csv/i.test(f.type||'')){
      /* CSV는 UTF-8 텍스트로 직접 읽어야 한글이 안 깨진다 (구글·리멤버 CSV = UTF-8).
         예전엔 arrayBuffer→XLSX로 읽어 라틴으로 해석되며 'ì¶œ' 처럼 깨졌음 */
      await needXLSX();
      let text = await f.text();
      if (text.charCodeAt(0)===0xFEFF) text = text.slice(1);   /* BOM 제거 */
      const wb=XLSX.read(text,{type:'string'});
      rows = mapRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})); }
    else { await needXLSX();
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      rows = mapRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})); }
    rows = rows.filter(r=>r.name||r.company||r.mobile||r.tel);
    if (!rows.length) return toast('가져올 연락처를 찾지 못했습니다');
    previewImport(rows, f.name);
  }catch(e){ console.error(e); toast('파일을 읽지 못했습니다'); }
}

/* 열 이름 자동 인식(리멤버·구글·일반 엑셀 공통) */
function classify(h){
  h=String(h).toLowerCase().replace(/[\s\-_]/g,'');
  if(/label$/.test(h)) return null;                 // 구글 CSV의 'Label' 칸(값 아님)은 무시
  if(/^(이름|성명|name|fn)$/.test(h)) return 'name';
  if(/(familyname|lastname|성$)/.test(h)) return 'family';
  if(/(givenname|firstname)/.test(h)) return 'given';
  if(/(회사|company|organizationname|소속|조직)/.test(h)) return 'company';
  if(/(부서|department)/.test(h)) return 'dept';
  if(/(직책|직급|직함|jobtitle|organizationtitle|^title$)/.test(h)) return 'title';
  /* 리멤버 한글 헤더: 근무처/회사 전화·팩스는 회사용으로 분류 */
  if(/(근무처팩스|회사팩스|대표팩스)/.test(h)) return 'companyFax';
  if(/(근무처전화|회사전화|대표번호|대표전화)/.test(h)) return 'companyTel';
  if(/(휴대|핸드폰|mobile|cell)/.test(h)) return 'mobile';
  if(/(팩스|fax)/.test(h)) return 'fax';
  if(/(전화|phone|tel)/.test(h)) return 'tel';       // 직통전화
  if(/(메일|email)/.test(h)) return 'email';
  /* 명함 등록일 */
  if(/(등록일|등록날짜|createdate|regdate)/.test(h)) return 'createdAt';
  if(/(홈페이지|website|homepage|url)/.test(h)) return 'website';
  if(/address.*formatted|주소.*formatted/.test(h)) return 'address';   // 구글 CSV: Formatted만
  if(/(근무지주소|회사주소|근무처주소)/.test(h)) return 'companyAddr';
  if(/(주소|번지|소재지|address)/.test(h)) return 'address';
  if(/(담당자|담당|owner)/.test(h)) return 'owner';
  if(/(메모|노트|note|비고)/.test(h)) return 'memo';
  return null;
}
/* 리멤버→구글 CSV 이름 엉킴 복원
   First="수민\u00a0총무(천일통신)", Last="김"  →  "김수민"
   (성은 Last칸, 이름은 First의 특수공백 앞, 회사·직책은 별도 칸) */
function rememberGiven(first){
  if(!first) return '';
  let s=String(first).replace(/\u00a0/g,'\x01').trim().replace(/^#/,'').trim();
  s=s.replace(/\([^)]*\)/g,'').replace(/[()]/g,'').trim();   // 괄호 안 회사 제거
  s = s.replace(/\x01/g,' ').trim();        // 특수공백 → 일반공백으로 통일
  // 한글이 있으면: 직책/소속 키워드 이전까지의 첫 한글 토큰을 이름으로
  if (/[가-힣]/.test(s)){
    let head = s.split(/\s+/)[0];           // 공백 기준 첫 토큰(보통 "이름" 또는 "이름직책")
    const km = head.match(/[가-힣]+/);
    let nm = km ? km[0] : head;
    nm = nm.replace(/(노무사|노무법인|변호사|대표이사|대표|부장|차장|과장|이사|팀장|원장|센터장|부사장|총무|공인노무사|교수|전무이사|사무국장|전문위원|프로|소장|실장|본부장|상무|전무|사장|회장|주임|대리|사원|법인|사무소).*$/,'').trim();
    if (nm) return nm;
    const any = s.match(/[가-힣]{2,4}/); if(any) return any[0];
  }
  const han=s.match(/[\u4e00-\u9fff]+/); if(han) return han[0];
  s=s.replace(/\b(CEO|President|Vice|Director|Manager|Management|General|Senior|Chief|Head|Officer|대표|부장|차장|과장|이사|팀장|원장|센터장|부사장|총무|대표이사|공인노무사|노무사|변호사|교수|전무이사|사무국장|전문위원|프로)\b.*$/i,'').trim();
  return s.trim();
}
function rememberFixName(first, last){
  const f=String(first||''), l=String(last||'');
  // 케이스1: Last가 한 글자 한글 성 + First에 이름  →  성+이름
  if (/^[가-힣]\s*$/.test(l.replace(/\u00a0/g,' '))){
    const g=rememberGiven(f); if(g) return (l.trim()+g).trim();
  }
  // 케이스2: 한쪽 칸에 "이름\u00a0직책(회사" 형태가 들어있음 → 특수공백 앞에서 이름 추출
  for (const part of [l, f]){              // Last 먼저(보통 여기 이름 있음)
    const p=part.replace(/\u00a0/g,'\x01');
    if (p.includes('\x01')){
      const cand=rememberGiven(p.split('\x01')[0]+'\x01');
      if (cand) return cand;
    }
  }
  // 케이스3: 합쳐서 한글 이름 추출
  const g2=rememberGiven(f) || rememberGiven(l);
  return g2 || (l+f).replace(/\u00a0/g,' ').replace(/[()#]/g,'').trim();
}
/* 날짜 파싱: "2026년 06월 19일", "2026.06.19", "2026-06-19" 등 */
function parseKoreanDate(s){
  s=String(s||'').trim();
  const m=s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]).getTime();
  return Date.parse(s);
}
function mapRows(json){
  return json.map(r=>{
    const o={phones:[]};
    for (const [h,v0] of Object.entries(r)){
      const v=String(v0).trim(); if(!v) continue;
      const k=classify(h); if(!k) continue;
      const clean = s => String(s).split(':::')[0].trim()
        .replace(/^\*\s*(work|home|mobile|other|cell)?\s*/i,'').trim();   // 라벨 잔재 제거
      if (k==='phone'||k==='mobile')
        v.split(':::').forEach(p=>{ p=p.trim(); if(p)
          o.phones.push({v:p, m: k==='mobile' || /^01[016789]/.test(digits(p))}); });
      else if (k==='createdAt'){
        let t = parseKoreanDate(v);
        if (!isNaN(t)) o.createdAt = t;
      }
      else if (k==='email'||k==='address'||k==='companyAddr'){ const cv=clean(v); if(cv && !o[k]) o[k]=cv; }
      else if (k==='given') o.given=v;
      else if (k==='family') o.family=v;
      else if (o[k]) o[k] += (k==='memo' ? '\n' : ' ') + v;
      else o[k]=v;
    }
    /* 이름 조립: First/Last 칸을 보고 리멤버 엉킴이면 복원 */
    const rawFirst = o.given || '';
    const rawLast  = o.family || '';
    if (/[()\u00a0]|^#/.test(rawFirst+rawLast)) o.name = rememberFixName(rawFirst, rawLast);
    else if(!o.name) o.name = (rawLast+rawFirst).trim();
    else if(/[()\u00a0]|^#/.test(o.name)) o.name = rememberFixName(o.name, '');
    const mob=o.phones.find(p=>p.m), tel=o.phones.find(p=>!p.m);
    return { name:o.name||'', company:o.company||'', dept:o.dept||'', title:o.title||'',
      mobile:o.mobile||(mob?mob.v:''), tel:o.tel||(tel?tel.v:''), fax:o.fax||'', email:o.email||'',
      companyTel:o.companyTel||'', companyFax:o.companyFax||'', companyAddr:o.companyAddr||'', website:o.website||'',
      address:o.address||'', memo:o.memo||'', ...(o.createdAt?{createdAt:o.createdAt}:{}) };
  });
}
/* vCard 파서 (갤럭시·구글 내보내기, QP 인코딩 지원) */
function qpDecode(s){
  const bytes=[];
  for(let i=0;i<s.length;i++){
    if (s[i]==='=' && /^[0-9A-Fa-f]{2}$/.test(s.slice(i+1,i+3))){ bytes.push(parseInt(s.slice(i+1,i+3),16)); i+=2; }
    else for(const b of new TextEncoder().encode(s[i])) bytes.push(b);
  }
  try{ return new TextDecoder('utf-8').decode(new Uint8Array(bytes)); }catch(e){ return s; }
}
function parseVcf(text){
  text=text.replace(/\r/g,'').replace(/=\n/g,'').replace(/\n[ \t]/g,'');
  const out=[];
  text.split(/END:VCARD/i).forEach(block=>{
    if(!/BEGIN:VCARD/i.test(block)) return;
    const o={phones:[]};
    block.split('\n').forEach(line=>{
      const i=line.indexOf(':'); if(i<0) return;
      const prop=line.slice(0,i), P=prop.toUpperCase();
      let val=line.slice(i+1);
      if(/ENCODING=QUOTED-PRINTABLE/.test(P)) val=qpDecode(val);
      val=val.replace(/\\n/gi,'\n').replace(/\\,/g,',').trim();
      if(!val) return;
      if(P==='FN'||P.startsWith('FN;')) o.name=val;
      else if(P==='N'||P.startsWith('N;')){ if(!o.name){ const p=val.split(';'); o.name=((p[0]||'')+(p[1]||'')).trim(); } }
      else if(P.startsWith('ORG')){ const p=val.split(';'); o.company=p[0]||''; o.dept=p[1]||''; }
      else if(P.startsWith('TITLE')) o.title=o.title||val;
      else if(P.startsWith('TEL')) o.phones.push({v:val, m:/CELL|MOBILE/.test(P)||/^01[016789]/.test(digits(val))});
      else if(P.startsWith('EMAIL')) o.email=o.email||val;
      else if(P.startsWith('ADR')) o.address=o.address||val.split(';').filter(Boolean).join(' ');
      else if(P.startsWith('NOTE')) o.memo=val;
    });
    const mob=o.phones.find(p=>p.m), tel=o.phones.find(p=>!p.m);
    out.push({ name:o.name||'', company:o.company||'', dept:o.dept||'', title:o.title||'',
      mobile:mob?mob.v:'', tel:tel?tel.v:'', fax:'', email:o.email||'', address:o.address||'', memo:o.memo||'' });
  });
  return out;
}

/* 중복 매칭 키: 휴대폰 → 이메일 → 이름+회사 */
function rowKeys(r){
  const ks=[]; const d=digits(r.mobile);
  if(d.length>=9) ks.push('p'+d);
  if(r.email) ks.push('e'+String(r.email).toLowerCase().trim());
  if(r.name && r.company) ks.push('n'+(r.name+'|'+r.company).toLowerCase().replace(/\s/g,''));
  return ks;
}
function buildKeyMap(){
  const map={};
  Object.values(state.items).filter(it=>it.kind==='card')
    .forEach(it=>rowKeys(it).forEach(k=>{ if(!map[k]) map[k]=it.id; }));
  return map;
}
const matchExisting=(r,map)=>{ for(const k of rowKeys(r)) if(map[k]) return map[k]; return null; };

async function runImport(){

  const IMP_KEEP = {id:1,kind:1,thumb:1,thumb2:1,group:1,createdAt:1,fav:1,erpAutoFoldered:1,scope:1,phones:1};

      const ex = updates[exId] || {...state.items[exId]};

        if (impMode==='overwrite') ex[k]=r[k];      /* 최신값으로 덮어쓰기 */

      if (!String(it.company||'').trim()) it.group = friendG.id;  /* 회사 없음 → 지인 폴더 */
      updates[it.id]=it; add++;

    if (i%300===0) toast(`가져오는 중… ${i.toLocaleString()}/${rows.length.toLocaleString()}`,4000);
  }

      toast(`저장 중… ${Math.min(s+100,ids.length).toLocaleString()}/${ids.length.toLocaleString()}`,4000);
      await new Promise(r=>setTimeout(r,120));   // 과부하 방지로 살짝 쉼

    return;
  } else { Object.assign(state.items, updates); Store._ls(); render(); }
  toast(`✅ 가져오기 완료 — 신규 ${add.toLocaleString()}건${skip?`, 중복 ${skip.toLocaleString()}건 건너뜀`:''}${merge?`, ${impMode==='overwrite'?'덮어씀':'합침'} ${merge.toLocaleString()}건`:''}`,6000);

/* ════════════ 🧹 중복 정리 ════════════ */
const FIELD_LABEL=Object.fromEntries([...CARD_FIELDS,...BIZ_FIELDS].map(([k,l])=>[k,l]));
function itemKeys(it){
  if (it.kind==='biz'){ const d=digits(it.bizno); return d.length>=10 ? ['b'+d] : []; }
  return rowKeys(it);
}
function findDupGroups(){
  const arr=Object.values(state.items).filter(it=>it.kind===state.tab);
  const parent={}; arr.forEach(it=>parent[it.id]=it.id);
  const find=x=>parent[x]===x?x:(parent[x]=find(parent[x]));
  const uni=(a,b)=>{ parent[find(a)]=find(b); };
  const map={};
  arr.forEach(it=>itemKeys(it).forEach(k=>{ if(map[k]) uni(it.id,map[k]); else map[k]=it.id; }));
  const groups={};
  arr.forEach(it=>{ const r=find(it.id); (groups[r]=groups[r]||[]).push(it); });
  return Object.values(groups).filter(g=>g.length>1);
}
async function mergeGroup(ids){
  const items=ids.map(id=>state.items[id]).filter(Boolean);
  if (items.length<2) return;
  items.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  const base={...items[0]};
  const fields=(base.kind==='card'?CARD_FIELDS:BIZ_FIELDS).map(f=>f[0]);
  const norm=v=>String(v).toLowerCase().replace(/[\s\-]/g,'');
  const conflicts=[];
  items.slice(1).forEach(o=>{
    fields.forEach(k=>{
      if(!o[k]) return;
      if(!base[k]) base[k]=o[k];
      else if(k!=='memo' && norm(base[k])!==norm(o[k])) conflicts.push(`[병합] 다른 ${FIELD_LABEL[k]}: ${o[k]}`);
    });
    if(!base.thumb && o.thumb) base.thumb=o.thumb;
    if(o.memo && o.memo!==base.memo) base.memo=((base.memo||'')+'\n'+o.memo).trim();
    base.createdAt=Math.min(base.createdAt||Date.now(), o.createdAt||Date.now());
  });
  if (conflicts.length) base.memo=((base.memo||'')+'\n'+[...new Set(conflicts)].join('\n')).trim();
  if (!(await Store.getPhoto(base.id)))
    for (const o of items.slice(1)){ const p=await Store.getPhoto(o.id); if(p){ Store.putPhoto(base.id,p); break; } }
  Store.put(base);
  items.slice(1).forEach(o=>Store.del(o.id));
}

/* ════════════ 🔍 유사 항목 검사 (완전중복은 아니지만 같은 사람일 수 있는 명함) ════════════ */
const _simNorm  = s => String(s||'').toLowerCase().replace(/\s/g,'');
const _tail8    = s => { const d=digits(s); return d.length>=8 ? d.slice(-8) : ''; };
const _emailDom = s => { const m=String(s||'').toLowerCase().match(/@([^@\s]+)$/); return m?m[1]:''; };
function _simIgnoreSet(){ try{ return new Set(JSON.parse(localStorage.getItem('pucards_sim_ignore')||'[]')); }catch(_){ return new Set(); } }
function _simIgnoreSave(set){ try{ localStorage.setItem('pucards_sim_ignore', JSON.stringify([...set].slice(-5000))); }catch(_){} }
const _pairSig = (a,b) => [a,b].sort().join('~');
function _isExactDup(a,b){ const ka=new Set(rowKeys(a)); return rowKeys(b).some(k=>ka.has(k)); }
/* 같은 사람일 가능성이 있으나 완전중복은 아닌지 판단 */
function _isSimilar(a,b){
  if(_isExactDup(a,b)) return false;   /* 완전중복은 '중복 정리'가 담당 */
  const nEq=_simNorm(a.name)    && _simNorm(a.name)===_simNorm(b.name);
  const cEq=_simNorm(a.company) && _simNorm(a.company)===_simNorm(b.company);
  const tEq=_tail8(a.mobile)    && _tail8(a.mobile)===_tail8(b.mobile);
  const dEq=_emailDom(a.email)  && _emailDom(a.email)===_emailDom(b.email);
  const cEmpty=!_simNorm(a.company) || !_simNorm(b.company);
  /* 같은 이름 + (같은 회사/전화뒤8/이메일도메인/한쪽 회사없음)  또는  전화뒤8 같고 이름·회사 중 하나 일치 */
  return !!((nEq && (cEq||tEq||dEq||cEmpty)) || (tEq && (nEq||cEq)));
}
function findSimilarGroups(){
  const arr=Object.values(state.items).filter(it=>it && it.kind==='card');
  const ignore=_simIgnoreSet();
  /* 후보 축소: 이름·전화뒤8 버킷 안에서만 비교(전수비교 회피) */
  const buckets={};
  const addB=(k,it)=>{ if(!k) return; (buckets[k]=buckets[k]||[]).push(it); };
  arr.forEach(it=>{ addB('n'+_simNorm(it.name), it); addB('t'+_tail8(it.mobile), it); });
  const parent={}; arr.forEach(it=>parent[it.id]=it.id);
  const find=x=>parent[x]===x?x:(parent[x]=find(parent[x]));
  const uni=(a,b)=>{ parent[find(a)]=find(b); };
  const pairSeen=new Set(); let unioned=0;
  Object.values(buckets).forEach(items=>{
    if(items.length<2 || items.length>40) return;   /* 흔한 이름 등 너무 큰 묶음은 스킵(노이즈·성능) */
    for(let i=0;i<items.length;i++) for(let j=i+1;j<items.length;j++){
      const a=items[i], b=items[j]; const sig=_pairSig(a.id,b.id);
      if(pairSeen.has(sig)) continue; pairSeen.add(sig);
      if(ignore.has(sig)) continue;
      if(_isSimilar(a,b)){ if(find(a.id)!==find(b.id)){ uni(a.id,b.id); unioned++; } }
    }
  });
  if(!unioned) return [];
  const g={};
  arr.forEach(it=>{ const r=find(it.id); (g[r]=g[r]||[]).push(it); });
  return Object.values(g).filter(x=>x.length>1);
}

/* ════════════ 🧹 깨진 글자(인코딩 오류) 명함 정리 → 휴지통 ════════════
   UTF-8 한글을 라틴으로 잘못 읽으면 'ì¶œ ë°œ'처럼 깨진다. 정상 한글(U+AC00~) 없이
   연속바이트(U+0080~U+00BF)가 2개 이상이면 깨진 것으로 판정. */
function _hasMojibake(s){ s=String(s||'');
  if(/[가-힣]/.test(s)) return false;               /* 정상 한글이 있으면 안 깨진 것 */
  return (s.match(/[\u0080-\u02FF\u2010-\u2122\u20AC]/g)||[]).length >= 2;   /* 라틴 깨짐 문자 2개+ */
}
function itemMojibake(it){
  return _hasMojibake(it.name)||_hasMojibake(it.company)||_hasMojibake(it.title)
       ||_hasMojibake(it.dept)||_hasMojibake(it.companyAddr)||_hasMojibake(it.address);
}
async function openMojibakeCleanup(){
  const bad=Object.values(state.items).filter(it=>it&&it.kind==='card'&&itemMojibake(it));
  if(!bad.length) return toast('깨진 글자 명함이 없습니다 👍');
  const sample=bad.slice(0,6).map(it=>it.name||it.company||'(빈)').join(', ');

  toast('정리 중…',9000);
  if(Store.mode==='firebase'){
    const now=Date.now();
    for(let s=0;s<bad.length;s+=200){
      const chunk=bad.slice(s,s+200), trashUpd={}, itemUpd={};
      chunk.forEach(it=>{ trashUpd[it.id]={...it,_deletedAt:now,_photo:'',_photo2:''}; itemUpd[it.id]=null; removeIdx(it.id); });
      try{ await Store.db.ref(DB_ROOT+'/trash').update(trashUpd);
           await Store.db.ref(DB_ROOT+'/items').update(itemUpd);
           chunk.forEach(it=>{ Store.delPhoto(it.id); Store.delPhoto(it.id+'_b'); });
      }catch(e){ console.warn('[mojibake]', e&&e.message); }
      toast(`정리 중… ${Math.min(s+200,bad.length).toLocaleString()}/${bad.length.toLocaleString()}`,5000);
    }
  } else { bad.forEach(it=>Store.del(it.id)); }
  toast(`✅ 깨진 명함 ${bad.length.toLocaleString()}장을 휴지통으로 보냈습니다 (30일 복구 가능)`,7000);
  render();
}
/* ════════════ 🏢 이름 칸에 회사·기관명이 들어간 명함 정리 ════════════
   예) 이름='청풍중학교' → 회사로 이동 / 이름='가성훈사장-창성산업' → 이름·직책·회사로 분리 */
const _SURNAME = new Set('김이박최정강조윤장임한오서신권황안송류전홍고문양손배백허유남심노하곽성차주우구나민진지엄채원천방공현함변염여추도소석선설마길연위표명기반왕금옥육인맹제모탁국어은편용봉'
  + '가간갈감견경계동두라목미범복부빈사상승시종좌창태평피해형호화후흥');   /* 드문 성씨도 포함 (가성훈·계미정 등) */
const _MULTI_SN = ['남궁','황보','제갈','사공','선우','서문','독고','동방'];
const _ORG_KW = ['공사','공단','위원회','노동청','지청','센터','협회','조합','학교','대학','병원','의원','약국','은행','산업',
 '엔지니어링','테크','전자','식품','건설','물산','상사','기업','법인','사무소','세무','회계','법률','관광','마트','식당',
 '카페','호텔','모텔','농장','축산','정밀','기계','화학','제약','물류','운수','택배','공업','설비','시스템','솔루션',
 '컨설팅','노무','인력','건축','설계','자동차','부품','금속','철강','섬유','유통','무역','통신','정보','미디어','교육',
 '학원','어린이집','유치원','복지관','재단','지사','지점','공장','연구소','진흥원','보험','증권','농협','수협','시청',
 '군청','구청','주민센터','경찰서','소방서','세무서','치과','한의','요양','그룹','코리아','서비스','고속','개발'];
const _TITLE_SFX = ['대표이사','부사장','전무이사','상무이사','사무국장','본부장','센터장','조합장','위원장','사장','회장',
 '원장','대표','전무','상무','이사','부장','차장','과장','대리','주임','팀장','실장','소장','국장','반장','기사','교수',
 '선생','노무사','변호사','세무사','회계사','법무사','조정관','조사관','감독관','주무관','사무관','담당자','총무','님'];
/* 엄격 판정 — 고칠 필요가 있는지(성씨로 시작하는 2~3자 한글) */
function _isPersonName(s){
  s=String(s||'').trim();
  if(!/^[가-힣]{2,4}$/.test(s)) return false;
  if(_ORG_KW.some(k=>s.includes(k))) return false;
  if(_MULTI_SN.some(m=>s.startsWith(m))) return true;
  if(s.length>3) return false;
  return _SURNAME.has(s[0]);
}
/* 느슨한 판정 — 이미 '이름-회사'나 '이름+호칭' 형태로 쪼갠 조각이 사람 이름인지
   (드문 성씨 '가·간·견' 등도 살리되, 4자 이상 상호는 배제) */
function _looksPerson(s){
  s=String(s||'').trim();
  if(_ORG_KW.some(k=>s.includes(k))) return false;
  if(_MULTI_SN.some(m=>s.startsWith(m)) && /^[가-힣]{3,4}$/.test(s)) return true;
  return /^[가-힣]{2,3}$/.test(s);
}
/* 이름 뒤 호칭·직책 떼기 — '님' 먼저 떼고 긴 것부터 맞춰본다 */
function _stripTitle(s){
  s=String(s||'').trim();
  if(s.endsWith('님') && s.length>1) s=s.slice(0,-1).trim();
  const sorted=_TITLE_SFX.filter(t=>t!=='님').sort((a,b)=>b.length-a.length);
  for(const t of sorted){ if(s.endsWith(t) && s.length>t.length) return [s.slice(0,-t.length).trim(), t]; }
  return [s,''];
}
/* 한 건을 어떻게 고칠지 계산 — 고칠 필요 없으면 null */
function nameFixPlan(it){
  const nm=String(it.name||'').trim(); if(!nm) return null;
  if(_isPersonName(nm)) return null;                       /* 정상 */
  const co=String(it.company||'').trim();
  /* 1) '가성훈사장-창성산업' 처럼 구분자로 사람·회사가 붙은 경우 */
  const m=nm.split(/\s*[-–—_·]\s*/).filter(Boolean);
  if(m.length===2){
    const r=_stripTitle(m[0]);
    if(_looksPerson(r[0])){
      return { type:'분리', sure:true, name:r[0], company:(co||m[1]), title:(it.title||r[1]||''), dept:it.dept||'',
               memo:(co&&co!==m[1]) ? [it.memo,m[1]].filter(Boolean).join(' / ') : (it.memo||'') };
    }
  }
  /* 2) '홍영숙선생님' 처럼 사람+호칭 */
  const b=_stripTitle(nm);
  if(b[0]!==nm && _looksPerson(b[0])){
    return { type:'호칭분리', sure:true, name:b[0], company:co, title:(it.title||b[1]||''), dept:it.dept||'', memo:it.memo||'' };
  }
  /* 3) 기관·상호 → 회사 칸으로 (기존 회사값은 부서·메모로 보존) */
  const plan={ type:'회사로', sure:_ORG_KW.some(k=>nm.includes(k)), name:'', company:nm,
               title:it.title||'', dept:it.dept||'', memo:it.memo||'' };
  if(co && co!==nm){ if(!plan.dept) plan.dept=co; else plan.memo=[plan.memo,co].filter(Boolean).join(' / '); }
  return plan;
}
function nameFixList(){
  return Object.values(state.items)
    /* 한 번 고친 명함은 다시 잡지 않는다 (또 고치면 이름이 회사로 밀려남) */
    .filter(it=>it && it.kind===state.tab && !it.nameFixed && !inHiddenLocked(it))
    .map(it=>({it:it, plan:nameFixPlan(it)}))
    .filter(x=>x.plan);
}
function applyNameFix(id){
  const it=state.items[id]; if(!it) return;
  const p=nameFixPlan(it); if(!p) return;
  it.name=p.name; it.company=p.company; it.title=p.title; it.dept=p.dept; it.memo=p.memo;
  it.nameFixed=1; it.updatedAt=Date.now(); Store.put(it);
}

/* ════════════ 📞 이름·회사 칸에 전화번호·주소가 통째로 들어간 명함 정리 ════════════
   예) '아름다운정원화수목 041-415-0815 산33 천안시 동남구' → 회사·전화·주소로 분리 */
const _PHONE_RE = /(0\d{1,2}[-.\s]?\d{3,4}[-.\s]?\d{4}|1[5-8]\d{2}[-.\s]?\d{4})/g;
const _PROV_RE = /^(서울특별시|부산광역시|대구광역시|인천광역시|광주광역시|대전광역시|울산광역시|세종특별자치시|경기도|강원도|강원특별자치도|충청북도|충청남도|전라북도|전라남도|전북특별자치도|경상북도|경상남도|제주특별자치도|제주도|서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)$/;
const _isAddrTok = t => /^(산)?\d+[-\d]*$/.test(t)
  || _PROV_RE.test(t)
  || /(특별시|광역시|자치시|자치도)$/.test(t)
  || /^[가-힣]{2,8}(시|군|구|읍|면|동|리|로|길|가)$/.test(t);
/* 뒤섞인 문자열을 회사명 · 전화들 · 주소로 나눈다 */
function splitMixed(s){
  s=String(s||'').trim();
  const phones=[];
  s=s.replace(_PHONE_RE,(m)=>{ phones.push(m.trim().replace(/[.\s]/g,'-')); return ' '; });
  const toks=s.split(/\s+/).filter(Boolean);
  let cut=-1;
  for(let i=0;i<toks.length;i++){ if(_isAddrTok(toks[i])){ cut=i; break; } }
  let addr='';
  if(cut>0){                       /* 앞에 회사명이 남아 있을 때만 주소로 인정 */
    const tail=toks.slice(cut);
    if(tail.length>=2 || /(시|군|구|도)$/.test(tail[0])){ addr=tail.join(' '); toks.length=cut; }
  }
  return { text:toks.join(' ').trim(), phones, addr };
}
function mixedFixPlan(it){
  const src=String(it.name||'').trim() || String(it.company||'').trim();
  if(!src) return null;
  if(!_PHONE_RE.test(src)){ _PHONE_RE.lastIndex=0; return null; }
  _PHONE_RE.lastIndex=0;
  const r=splitMixed(src);
  if(!r.text) return null;                      /* 회사명이 안 남으면 손대지 않음 */
  const p={ company:r.text, name:'', mobile:it.mobile||'', companyTel:it.companyTel||'',
            companyFax:it.companyFax||'', companyAddr:it.companyAddr||'' };
  r.phones.forEach(ph=>{
    const d=digits(ph);
    if(d.startsWith('010')){ if(!p.mobile) p.mobile=ph; }
    else if(!p.companyTel) p.companyTel=ph;
    else if(!p.companyFax) p.companyFax=ph;
  });
  if(r.addr && !p.companyAddr) p.companyAddr=r.addr;
  return p;
}
function mixedFixList(){
  return Object.values(state.items)
    .filter(it=>it && it.kind===state.tab && !it.mixedFixed && !inHiddenLocked(it))
    .map(it=>({it:it, plan:mixedFixPlan(it)}))
    .filter(x=>x.plan);
}
function applyMixedFix(id){
  const it=state.items[id]; if(!it) return;
  const p=mixedFixPlan(it); if(!p) return;
  it.name=p.name; it.company=p.company; it.mobile=p.mobile; it.companyTel=p.companyTel;
  it.companyFax=p.companyFax; it.companyAddr=p.companyAddr;
  it.mixedFixed=1; it.updatedAt=Date.now(); Store.put(it);
}
function autoMixedFixAll(){
  const list=mixedFixList();
  if(!list.length) return toast('정리할 항목이 없습니다');

  let n=0; list.forEach(x=>{ applyMixedFix(x.it.id); n++; });

  render(); setTimeout(function(){_refresh(openMixedFix)},120);
}

    <p style="font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:10px">

    <b>명함은 지워지지 않습니다.</b></p>
    <button class="btn primary" style="width:100%;margin-bottom:12px" onclick="autoMixedFixAll()">⚡ ${list.length.toLocaleString()}건 모두 자동으로 나누기</button>`;
  list.slice(0,200).forEach(function(x){

  if(list.length>200) h+=`<p style="color:var(--sub);font-size:12px;padding:8px 2px">…외 ${(list.length-200).toLocaleString()}건 (자동 나누기를 쓰면 한 번에 처리됩니다)</p>`;

async function mergeSimilar(csv){ await mergeGroup(csv.split(',')); toast('병합 완료'); _refresh(openSimilar); }
function ignoreSimilar(csv){

/* ════════════ 🔗 ERP 대표자·담당자 대조 (업체관리에 있는데 명함첩에 없는 이름 찾기) ════════════ */
function findErpNameMismatch(){
  if(!ErpMatch.ready || !ErpMatch.companies) return null;
  const cards=Object.values(state.items).filter(it=>it&&it.kind==='card'&&it.name);
  const cardsByCo={};
  cards.forEach(it=>{ const k=ErpMatch._norm(it.company); if(k) (cardsByCo[k]=cardsByCo[k]||[]).push(it); });
  const rows=[];
  ErpMatch.companies.forEach(co=>{
    if(!co) return;
    const erpNames=[];
    if(co.ceo)  erpNames.push({role:'대표자', name:co.ceo});
    if(co.ceo2) erpNames.push({role:'대표자2', name:co.ceo2});
    [ ...((co.contacts||[]).map(c=>c&&c.name)), co.primaryContactName, co.contactName ]
      .filter(Boolean).forEach(nm=>erpNames.push({role:'담당자', name:nm}));
    if(!erpNames.length) return;
    let coCards=(cardsByCo[ErpMatch._norm(co.name)]||[]).slice();
    const bd=ErpMatch._digits(co.bizNo);
    if(bd.length>=10) cards.forEach(it=>{ if(ErpMatch._digits(it.bizno)===bd && coCards.indexOf(it)<0) coCards.push(it); });
    const cardNames=coCards.map(it=>ErpMatch._norm(it.name)).filter(Boolean);
    const missing=erpNames.filter(en=>{ const nn=ErpMatch._norm(en.name); if(!nn) return false;
      return !cardNames.some(cn=>ErpMatch._nameHit(cn,nn)); });
    if(missing.length) rows.push({ company:co.name||'(회사명없음)', bizNo:co.bizNo||'',
      missing:missing.map(m=>m.role+': '+m.name), haveCards:coCards.length });
  });
  return rows;
}
function openErpNameCheck(){
  const msg=(t)=>{ if(_panelTarget==='inline') return showPanel(
    `<div style="padding:22px;text-align:center;color:var(--sub);font-size:13px;line-height:1.8">${t}</div>`);
    toast(t,5000); };
  if(Store.mode!=='firebase') return msg('ERP 연결(Firebase) 상태에서만 대조할 수 있습니다');
  if(!ErpMatch.ready) return msg('ERP 업체관리 데이터를 불러오는 중입니다. 잠시 후 다시 눌러 주세요.');
  const rows=findErpNameMismatch();
  if(!rows) return msg('ERP 데이터를 아직 못 읽었습니다. 잠시 후 다시 시도하세요.');
  if(!rows.length) return msg('✅ 불일치 없음 — ERP 대표자·담당자가 모두 명함첩에 있습니다');
  rows.sort((a,b)=>b.missing.length-a.missing.length);
  let h=`<div class="mhead"><b>🔗 ERP 대표자·담당자 대조 — ${rows.length}개 회사</b>
    ${_closeBtn()}</div>
    <p style="font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:10px">
    푸른이알피 업체관리엔 <b>등록돼 있는데 명함첩엔 없는</b> 대표자·담당자예요. 명함을 추가하거나 이름 철자를 맞추면 연결됩니다.</p>`;
  rows.slice(0,200).forEach(r=>{
    h+=`<div class="ditem"><div class="v"><b>${esc(r.company)}</b>${r.bizNo?` <span style="color:var(--sub);font-size:11px">${esc(fmtBizno(r.bizNo))}</span>`:''}<br>
      <span style="color:var(--orange);font-size:12.5px">명함첩에 없음 — ${esc(r.missing.join(', '))}</span>
      <span style="color:var(--sub);font-size:11.5px"> · 이 회사 명함 ${r.haveCards}장</span></div></div>`;
  });
  if(rows.length>200) h+=`<p style="color:var(--sub);font-size:12px;padding:8px 2px">…외 ${rows.length-200}개 회사</p>`;
  showPanel(h);
}

/* ════════════ 📤 엑셀 내보내기 ════════════ */
async function exportXlsx(){
  await needXLSX();
  const isCard = state.tab==='card';
  const fields = isCard ? CARD_FIELDS : BIZ_FIELDS;
  /* 선택된 항목이 있으면 그것만, 없으면 전체 */
  const selIds = Object.keys(state.sel);
  let targets = Object.values(state.items).filter(it=>it.kind===state.tab);
  let scopeLabel = '전체';
  if (selIds.length){ targets = targets.filter(it=>state.sel[it.id]); scopeLabel = `선택${selIds.length}건`; }
  const rows = targets
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))
    .map(it=>{ const o={};
      fields.forEach(([k,l])=> o[l] = k==='bizno' ? fmtBizno(it[k]) : (it[k]||''));
      o['그룹'] = it.group && state.groups[it.group] ? state.groups[it.group].name : '';
      o['등록일'] = fmtDate(it.createdAt);
      return o; });
  if (!rows.length) return toast('내보낼 항목이 없습니다');
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, isCard?'명함':'사업자등록증');
  XLSX.writeFile(wb, `푸른명함첩_${isCard?'명함':'사업자등록증'}_${scopeLabel}_${fmtDate(Date.now())}.xlsx`);
  toast(`엑셀 파일을 내려받았습니다 (${scopeLabel} ${rows.length}건)`);
}

/* 열 너비 더블클릭 → 원래 크기로 복원 */
function resetColWidth(e, key){

function startColResize(e, key){
  e.preventDefault(); e.stopPropagation();
  const col = document.querySelector(`#pcTable col[data-col="${key}"]`);
  if(!col) return;
  const startX = e.clientX;
  const startW = col.getBoundingClientRect().width;
  const onMove = ev => {
    const w = Math.max(50, startW + (ev.clientX - startX));
    col.style.width = w + 'px';
  };
  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.body.style.cursor = '';
    if(!state.colW) state.colW = {};
    if(!state.colW[state.tab]) state.colW[state.tab] = {};
    state.colW[state.tab][key] = col.style.width;
    saveColPrefs();
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  document.body.style.cursor = 'col-resize';
}

/* 열 표시/숨김 — 탭별 열 정의 */
const COL_DEFS = {
  card: [['name','이름'],['company','회사'],['title','직책·부서'],['mobile','핸드폰'],
         ['companyTel','회사전화'],['companyFax','회사팩스'],['email','이메일'],['companyAddr','회사주소'],['date','등록일']],
  biz:  [['company','상호'],['ceo','대표자'],['bizno','사업자번호'],['address','소재지'],['date','등록일']]

function colHidden(key){ return !!(state.hiddenCols[state.tab]||{})[key]; }

/* 열 순서: 저장된 순서(colOrder) 우선, 없으면 COL_DEFS 기본 순서. 새 열은 뒤에 붙임 */
function orderedColKeys(){
  const base = (COL_DEFS[state.tab]||[]).map(c=>c[0]);
  const saved = state.colOrder && state.colOrder[state.tab];
  if(!saved || !saved.length) return base;
  const out = saved.filter(k=>base.includes(k));
  base.forEach(k=>{ if(!out.includes(k)) out.push(k); });
  return out;
}
/* 열 머리글 드래그로 좌우 순서 변경 (마우스, PC) */
let _dragCol = null;
function onColDragStart(e, key){ _dragCol=key; e.dataTransfer.effectAllowed='move';
  try{ e.dataTransfer.setData('text/plain', key); }catch(_){}
  const th=e.currentTarget; if(th) th.classList.add('col-dragging'); }
function onColDragOver(e, key){ e.preventDefault(); e.dataTransfer.dropEffect='move';
  const th=e.currentTarget; if(th && _dragCol && key!==_dragCol) th.classList.add('col-dragover'); }
function onColDragLeave(e){ const th=e.currentTarget; if(th) th.classList.remove('col-dragover'); }
function onColDragEnd(e){ const th=e.currentTarget; if(th) th.classList.remove('col-dragging');
  document.querySelectorAll('#pcTable th.col-dragover').forEach(t=>t.classList.remove('col-dragover')); }
function onColDrop(e, key){ e.preventDefault();
  document.querySelectorAll('#pcTable th.col-dragover').forEach(t=>t.classList.remove('col-dragover'));
  const from=_dragCol; _dragCol=null;
  if(!from || from===key) return;
  let order = orderedColKeys().filter(k=>k!==from);
  const ti = order.indexOf(key); if(ti<0) return;
  order.splice(ti, 0, from);
  if(!state.colOrder) state.colOrder={};
  state.colOrder[state.tab] = order;
  saveColPrefs();
  renderPCTable();
  toast('열 순서를 바꿨습니다');
}

/* 폴더 비밀번호 잠금 설정/해제/확인 (화면에서만 가림 — 진짜 보안 아님) */
function setFolderLock(id){
  const g=state.groups[id]; if(!g) return;
  if(!myEmail) return toast('로그인 후 잠글 수 있습니다');
  const pw=prompt(`'${g.name}' 폴더를 나만 보는 개인 폴더로 잠급니다.\n\n· 다른 직원에게는 폴더도 명함도 보이지 않습니다\n· 푸른이알피 등 다른 프로그램에서도 당겨올 수 없습니다\n· 오직 명함첩에서 비밀번호로만 열 수 있습니다\n\n비밀번호를 입력하세요`);
  if(pw===null) return;
  if(!pw.trim()) return toast('비밀번호가 비어 있습니다');
  g.locked=true; g.pw=pw; g.lockOwner=myEmail; Store.putGroup(g);
  if(state.unlocked) delete state.unlocked[id];
  /* 이 폴더 명함들을 공유 검색목록에서 즉시 제거 (다른 프로그램 노출 차단) */
  try{ Object.values(state.items).forEach(it=>{ if(it && (it.group||'')===id) removeIdx(it.id); }); }catch(_){}
  toast('🔒 나만 보는 폴더로 잠갔습니다 — 다른 직원·다른 프로그램에서 보이지 않습니다',6000);
  render();
}
function unsetFolderLock(id){
  const g=state.groups[id]; if(!g) return;
  /* 해제하려면 현재 비번 확인 (세션에서 이미 풀려있으면 생략) */
  if(!(state.unlocked&&state.unlocked[id])){
    const pw=prompt('잠금을 해제하려면 비밀번호를 입력하세요.');
    if(pw===null) return;
    if(pw!==g.pw) return toast('비밀번호가 틀렸습니다');
  }
  g.locked=false; delete g.pw; delete g.lockOwner; Store.putGroup(g);
  /* 잠금이 풀렸으니 공유 검색목록에 다시 넣는다 */
  try{ Object.values(state.items).forEach(it=>{ if(it && (it.group||'')===id) writeIdx(it); }); }catch(_){}
  toast('잠금을 해제했습니다 🔓');
  render();
}
/* 잠긴 폴더 클릭 시 비번 확인 → 세션 동안 해제 */
function tryUnlockFolder(id){
  const g=state.groups[id]; if(!g) return false;
  if(!g.locked) return true;
  if(state.unlocked && state.unlocked[id]) return true;
  const pw=prompt(`'${g.name}'은(는) 잠긴 폴더입니다. 비밀번호를 입력하세요.`);
  if(pw===null) return false;
  if(pw!==g.pw){ toast('비밀번호가 틀렸습니다'); return false; }
  if(!state.unlocked) state.unlocked={};
  state.unlocked[id]=true;
  toast('잠금을 풀었습니다 (이 세션 동안 표시)');
  return true;
}
/* 폴더 순서 한 칸 이동 (같은 부모 형제끼리 order 교환) */
function moveFolderOrder(id, dir){
  const g=state.groups[id]; if(!g) return;
  const sibs=Object.values(state.groups)
    .filter(x=>(x.kind||'card')===(g.kind||'card') && (x.parent||'')===(g.parent||''))
    .sort((a,b)=>(a.order||0)-(b.order||0));
  const idx=sibs.findIndex(x=>x.id===id);
  const swapIdx=idx+dir;
  if(swapIdx<0||swapIdx>=sibs.length) return;
  /* 형제 전체에 일련번호 order 부여 후, 두 항목 위치 교환 */
  sibs.forEach((s,i)=>{ s.order=i+1; });
  const a=sibs[idx], b=sibs[swapIdx];
  const t=a.order; a.order=b.order; b.order=t;
  Store.putGroup(a); Store.putGroup(b);
  toast('폴더 순서를 변경했습니다');
}
/* 표에서 바로 수정 (셀 더블클릭 → 인라인 입력) */
function startCellEdit(ev, id, field){
  ev.stopPropagation();
  const td=ev.currentTarget;
  if(td.querySelector('input')) return;          /* 이미 편집 중 */
  const it=state.items[id]; if(!it) return;
  const old=it[field]||'';
  td.dataset.editing='1';
  td.innerHTML=`<input class="cellEdit" value="${esc(old)}" style="width:100%;border:1.5px solid #3a4a73;border-radius:5px;padding:4px 6px;font-size:13px;font-family:inherit;box-sizing:border-box">`;
  const inp=td.querySelector('input');
  inp.focus(); inp.select();
  const commit=(save)=>{
    if(td._done) return; td._done=true;
    if(save){
      const v=inp.value.trim();
      if(v!==old){ it[field]=v; Store.put(it); toast('수정했습니다'); }
    }
    render();
  };
  inp.addEventListener('keydown', e=>{
    e.stopPropagation();
    if(e.key==='Enter'){ e.preventDefault(); commit(true); }
    else if(e.key==='Escape'){ e.preventDefault(); commit(false); }
  });
  inp.addEventListener('blur', ()=>commit(true));
}

function deleteFolder(id){
  const g=state.groups[id]; if(!g) return;
  const kids=Object.values(state.groups).filter(x=>(x.parent||'')===id);
  const msg = kids.length
    ? `'${g.name}' 폴더와 하위 폴더 ${kids.length}개를 삭제할까요? (명함은 미분류로 이동)`

function renderPCTable(){

  const kc={}; kindAll.forEach(it=>itemKeys(it).forEach(k=>kc[k]=(kc[k]||0)+1));
  const isDup = it => itemKeys(it).some(k=>kc[k]>1);
  /* 제목·정렬 */
  $('pcTitle').textContent =
    state.owner!=='all' ? `담당: ${state.owner}`
    : state.group!=='all' ? groupName(state.group)
    : (isCard?'전체 명함':'사업자등록증');
  $('pcCount').textContent = items.length.toLocaleString()+'개';
  $('pcSort').value = state.sort;
  /* 지역 드롭다운은 제거됨 (상단 한 줄 정리) — 지역 조건은 저장된 탭에서만 사용 */
  const incBtn=$('incompleteBtn');

/* ══════ 🔖 내 탭 (저장된 검색·필터 조건) ══════
   폴더는 '명함을 옮기는 서류함', 내 탭은 '조건으로 걸러 보는 즐겨찾기'.
   명함 데이터를 건드리지 않으므로 5천 장에도 즉시 적용된다. 전 직원 공유(pucards/views). */
function viewSnapshot(){
  const s=$('search');
  return {
    q: s ? s.value.trim() : '',
    group: state.group||'all', owner: state.owner||'all', region: state.region||'',
    erpFilter: state.erpFilter||'', colFilter: Object.assign({}, state.colFilter||{}),
    onlyPhone: !!state.onlyPhone, onlyEmail: !!state.onlyEmail,
    onlyIncomplete: !!state.onlyIncomplete, onlyPrivate: !!state.onlyPrivate, onlyDup: !!state.onlyDup,
    vtab: state.vtab||'',
    sort: state.sort||'date', sortKey: state.sortKey||null, sortDir: state.sortDir||'desc'
  };
}
/* 그 탭 조건에 해당하는 인원수 — 목록과 똑같은 기준으로 세기 위해 잠시 조건을 바꿔 계산 후 되돌린다 */
function countMatching(f){
  f=f||{};
  const s=$('search');
  const sv={ group:state.group, owner:state.owner, region:state.region, erpFilter:state.erpFilter,
    colFilter:state.colFilter, onlyPhone:state.onlyPhone, onlyEmail:state.onlyEmail,
    onlyIncomplete:state.onlyIncomplete, onlyPrivate:state.onlyPrivate, onlyDup:state.onlyDup,
    vtab:state.vtab, sort:state.sort, sortKey:state.sortKey, q:(s?s.value:'') };
  try{
    state.group=f.group||'all'; state.owner=f.owner||'all'; state.region=f.region||'';
    state.erpFilter=f.erpFilter||''; state.colFilter=f.colFilter||{};
    state.onlyPhone=!!f.onlyPhone; state.onlyEmail=!!f.onlyEmail;
    state.onlyIncomplete=!!f.onlyIncomplete; state.onlyPrivate=!!f.onlyPrivate; state.onlyDup=!!f.onlyDup;
    state.vtab=f.vtab||'';
    state.sort='date'; state.sortKey=null;          /* 세기만 하므로 가벼운 정렬로 */
    if(s) s.value=f.q||'';
    return listItems().length;
  }catch(e){ return 0; }
  finally{
    state.group=sv.group; state.owner=sv.owner; state.region=sv.region; state.erpFilter=sv.erpFilter;
    state.colFilter=sv.colFilter; state.onlyPhone=sv.onlyPhone; state.onlyEmail=sv.onlyEmail;
    state.onlyIncomplete=sv.onlyIncomplete; state.onlyPrivate=sv.onlyPrivate; state.onlyDup=sv.onlyDup;
    state.vtab=sv.vtab; state.sort=sv.sort; state.sortKey=sv.sortKey; if(s) s.value=sv.q;
  }
}
/* 지금 화면이 그 탭과 같은 조건인지 비교용 서명 (정렬은 제외 — 정렬 바꿔도 탭 선택 유지) */
function viewSig(f){
  f=f||{}; const c=f.colFilter||{};
  return JSON.stringify([f.q||'', f.group||'all', f.owner||'all', f.region||'', f.erpFilter||'',
    c.name||'', c.company||'', c.phone||'', c.email||'',
    !!f.onlyPhone, !!f.onlyEmail, !!f.onlyIncomplete, !!f.onlyPrivate, !!f.onlyDup, f.vtab||'']);
}
function applyView(id){
  const v=(state.views||{})[id]; if(!v) return;
  const f=v.f||{};
  if((v.kind||'card')!==state.tab){ state.tab=v.kind||'card'; }
  state.group=f.group||'all'; state.owner=f.owner||'all'; state.region=f.region||'';
  state.erpFilter=f.erpFilter||''; state.colFilter=Object.assign({}, f.colFilter||{});
  state.onlyPhone=!!f.onlyPhone; state.onlyEmail=!!f.onlyEmail;
  state.onlyIncomplete=!!f.onlyIncomplete; state.onlyPrivate=!!f.onlyPrivate; state.onlyDup=!!f.onlyDup;
  state.vtab=f.vtab||'';
  state.sort=f.sort||'date'; state.sortKey=f.sortKey||null; state.sortDir=f.sortDir||'desc';
  state.page=0; state.sel={}; state.view='list';
  const s=$('search'); if(s) s.value=f.q||'';
  const ps=$('pcSearch'); if(ps) ps.value=f.q||'';
  render();
}

    return;

  /* 어디에 · 무슨 조건으로 만들어지는지 이름 묻기 전에 알려준다 */

  if(f.onlyIncomplete) cond.push('정보부족만');
  if(f.onlyPrivate) cond.push('개인만');
  if(f.onlyDup) cond.push('중복만');
  let n=0; try{ n=countMatching(f); }catch(_){}
  const head = `📁 ${curScopeName()} 에만 보이는 탭을 만듭니다.\n`
             + `조건: ${cond.length?cond.join(' · '):'없음 (전체)'}\n`
             + `해당 인원: ${n.toLocaleString()}명\n\n탭 이름을 입력하세요`;
  const name=(prompt(head, dflt)||'').trim();
  if(!name) return;
  const v={ id:uid(), name, kind:state.tab, scope:(state.group||'all'), order:Date.now(), f };
  Store.putView(v);
  toast(`🔖 '${name}' 탭을 ${curScopeName()}에 만들었습니다`,4000);
}
/* ── 🏷 담는 탭: 선택한 명함을 탭에 담기 / 빼기 ── */
function manualTabsHere(){

    .filter(v=>v&&v.manual&&(v.kind||'card')===state.tab&&(v.scope||'all')===cur)

function selAddToTab(){

/* 새 담는 탭을 만들고 선택한 명함을 바로 담기 */
function createManualTabAndAdd(){
  const ids=Object.keys(state.sel);
  if(!ids.length) return toast('명함을 먼저 선택하세요');
  const name=(prompt(`📁 ${curScopeName()} 안에 '담는 탭'을 만듭니다.\n선택한 ${ids.length}개가 바로 담깁니다.\n\n탭 이름을 입력하세요 (예: 푸른노무법인)`,'')||'').trim();
  if(!name) return;
  const id=uid();
  const mf={ q:'', group:(state.group||'all'), owner:'all', region:'', erpFilter:'', colFilter:{},
    onlyPhone:false, onlyEmail:false, onlyIncomplete:false, onlyPrivate:false, onlyDup:false,
    vtab:id, sort:'date', sortKey:null, sortDir:'desc' };
  const v={ id, name, kind:state.tab, scope:(state.group||'all'), manual:true, order:Date.now(), f:mf };
  state.views[id]=v;      /* 공유 저장 반영 전에도 바로 담을 수 있게 */
  Store.putView(v);
  doAddToTab(id);
}
function doAddToTab(vid){
  const v=(state.views||{})[vid]; if(!v) return;
  const gid=(v.f&&v.f.group)||'all';
  const ids=Object.keys(state.sel); let n=0, moved=0;
  ids.forEach(sid=>{
    const it=state.items[sid]; if(!it) return;
    const arr=(it.vtabs||[]).slice();
    if(arr.indexOf(vid)<0) arr.push(vid);
    it.vtabs=arr;
    /* 탭이 특정 폴더 소속이면 그 폴더로 함께 옮긴다 (폴더 밖 명함이 탭에서 안 보이는 것 방지) */
    if(gid!=='all' && (it.group||'')!==gid){ it.group=gid; moved++; }
    Store.put(it); n++;
  });
  state.sel={}; render();
  toast(`🏷 ${n}개를 '${v.name}' 탭에 담았습니다`+(moved?` (${moved}개는 ${(state.groups[gid]||{}).name||'폴더'}로 함께 이동)`:''),5000);
}
function selRemoveFromTab(){
  if(!state.vtab) return;
  const v=(state.views||{})[state.vtab]; if(!v) return;
  const ids=Object.keys(state.sel);
  if(!ids.length) return toast('명함을 먼저 선택하세요');
  if(!confirm(`선택한 ${ids.length}개를 '${v.name}' 탭에서 뺄까요?\n\n· 탭에서만 빠지고 명함은 그대로 남습니다.`)) return;
  let n=0;
  ids.forEach(sid=>{ const it=state.items[sid]; if(!it) return;
    const arr=(it.vtabs||[]).filter(x=>x!==state.vtab);
    it.vtabs=arr; Store.put(it); n++; });
  state.sel={}; render();
  toast(`${n}개를 '${v.name}' 탭에서 뺐습니다`);
}

/* ══════ 패널 표시 — 환경설정 안에서는 팝업 없이 그 자리에 펼친다 ══════

   환경설정 탭에서 부르면 본문에 인라인으로 보여준다. */
let _panelTarget='modal';
function _closeBtn(){ return _panelTarget==='inline' ? '' :
  '<button class="iconbtn" onclick="dedupBg.classList.remove(\'open\')">✕</button>'; }
function showPanel(html){

function setSub(s){ state.setSub=s||''; renderSettingsPage(); }

function _refresh(fn){ if(state.view==='settings') renderSettingsPage(); else if(fn) fn(); }

function _go(sub, modalCall){ return _panelTarget==='inline' ? `setSub('${sub}')` : modalCall; }

/* ══════ 규칙 분류 — 순수 로직 (테스트 대상) ══════
   미분류로 쌓인 명함을 회사명 단어로 폴더에 나눠 담는다.
   '청' 처럼 짧은 말은 청소·청과에도 걸려 일부러 뺐다 — 시청·구청처럼 길게 적는다. */
const CLASSIFY_DEFAULTS = [
  { key:'nomu',   order:1, enabled:true, toGroupName:'노무사',
    words:['노무법인','노무사사무소','노무사무소'] },
  { key:'expert', order:2, enabled:true, toGroupName:'전문가',
    words:['세무','회계','법무','변호사','법률','변리','특허','감정평가'] },
  { key:'public', order:3, enabled:true, toGroupName:'기관·공공',
    words:['공단','공사','시청','구청','군청','도청','교육청','경찰청','소방서','협회','진흥원','재단','연구원','공제회'] },
  { key:'life',   order:4, enabled:true, toGroupName:'생활·기타',
    words:['배달','꽃배달','보험','갈비','식당','마트','택배','렌터카','화수목','미용실','세탁','피자','치킨'] }
];
/* 규칙이 하나도 없을 때만 기본 4개를 심는다.
   기록 이름(key)을 고정으로 써서, 두 사람이 동시에 심어도 같은 4개로 모인다.
   지운 뒤 다시 살아나지 않도록 이 기기에 1회만 표시 */
function seedClassifyRules(){
  try{
    if(Store.mode!=='firebase') return;
    if(localStorage.getItem('pucards_rules_v1')) return;
    if(Object.keys(state.rules||{}).length) return;
    CLASSIFY_DEFAULTS.forEach(r=>{ Store.putRule({...r, words:r.words.slice()}); });
    localStorage.setItem('pucards_rules_v1','1');
  }catch(e){ console.warn('[seedClassifyRules]', e&&e.message); }
}
/* 지금 쓸 규칙 — 저장된 게 있으면 그것, 없으면 기본값. 항상 order 오름차순 */
function classifyRuleList(){
  const saved = Object.values(state.rules||{}).filter(r=>r&&r.key);
  const list = saved.length ? saved : CLASSIFY_DEFAULTS.map(r=>({...r, words:r.words.slice()}));
  return list.slice().sort((a,b)=>(a.order||0)-(b.order||0));
}
/* 이 명함이 이 규칙에 걸리는가 — 회사명과 이름에서 단어를 찾는다.
   회사 칸이 비고 이름 칸에 상호가 들어온 명함이 많아 둘 다 본다. */
function ruleHit(it, r){
  if(!it || !r || r.enabled===false) return false;
  const hay = String(it.company||'') + ' ' + String(it.name||'');
  const ws = Array.isArray(r.words) ? r.words : [];
  for(let i=0;i<ws.length;i++){
    const w = String(ws[i]||'').trim();
    if(w && hay.indexOf(w) >= 0) return true;
  }
  return false;
}
/* 규칙별로 옮길 명함을 고른다.
   ① 미분류만 — 손으로 넣어 둔 폴더는 절대 안 건드린다
   ② 지금 보는 종류(명함/사업자)만
   ③ 위에서 아래로 먼저 맞은 규칙 하나만 (한 장이 두 폴더로 갈 수 없다) */
function classifyTargets(items, rules, kind){
  const on = (rules||[]).filter(r=>r && r.key && r.enabled!==false)
                        .slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const byKey = {}; on.forEach(r=>{ byKey[r.key] = []; });
  const unmatched = [];
  (items||[]).forEach(it=>{
    if(!it || !it.id) return;
    if(((it.kind==='biz') ? 'biz' : 'card') !== kind) return;
    if(String(it.group||'') !== '') return;
    let hit = null;
    for(let i=0;i<on.length;i++){ if(ruleHit(it, on[i])){ hit = on[i]; break; } }
    if(hit) byKey[hit.key].push(it); else unmatched.push(it);
  });
  return { byKey, unmatched, keys: on.map(r=>r.key) };
}
/* 규칙이 보낼 폴더 찾기 — id 가 아니라 이름으로 가리킨다.
   폴더를 지웠다 다시 만들어도 규칙이 살아남게 하려는 것이다 (autoFolder 의 ensure 와 같은 뜻).
   잠긴 폴더로는 보내지 않는다 — 남의 개인 폴더에 명함이 섞이면 되돌리기도 어렵다.
   이름으로 못 찾았다고 바로 '없다'고 보면 안 된다 — 규칙이 예전에 만든 폴더를 누가
   이름을 바꿔 버리면 이름 조회는 놓치지만, 그 폴더는 여전히 규칙의 결정적 id 자리에
   그대로 있다. 그걸 없는 셈 치고 새로 지어 update() 로 groups/<id> 를 통째로 써 버리면
   잠금·비밀번호·순서·부모가 다 날아간다 — 그래서 id로 한 번 더 확인해서 있으면 그
   폴더를 그대로 재사용한다(이름·잠금·순서는 절대 건드리지 않는다). 잠겨 있으면
   여느 때처럼 보내지 않는다 — '이름을 바꿔 잠그면 우회된다'는 구멍을 여기서 막는다. */
function findRuleGroup(groups, r, kind){
  const nm = _canon(r && r.toGroupName);
  const g = Object.values(groups||{}).find(x =>
    x && _canon(x.name) === nm && ((x.kind||'card') === kind));
  if(g) return g.locked ? { gid:null, locked:true } : { gid:g.id };
  const gid2 = ruleFolderId(kind, r && r.toGroupName);
  const g2 = (groups||{})[gid2];
  if(g2) return g2.locked ? { gid:null, locked:true } : { gid:g2.id };
  return { gid:null, missing:true };
}
/* 규칙이 새로 만들 폴더의 id — uid() 대신 종류+이름에서 그대로 뽑는다.
   두 사람이 동시에 [분류하기]를 눌러도 같은 폴더 하나로 모인다
   (seedClassifyRules 가 규칙 key를 고정해 두는 것과 같은 이유).
   Firebase 키 금지문자(. $ # [ ] / 와 제어문자)만 밑줄로 치환한다.
   findRuleGroup 이 이름을 놓쳤을 때 이 id로 한 번 더 찾아보므로, 같은 '순수 로직'
   토막 안에 둔다(테스트도 findRuleGroup 과 함께 돌릴 수 있게). */
function ruleFolderId(kind, name){
  const safe = _canon(name).replace(/[.$#[\]/\x00-\x1f\x7f]/g, '_');
  return `rule_${kind}_${safe || 'g'}`;
}
/* ══════ 규칙 분류 — 화면 ══════ */
/* 지금 보고 있는 종류(명함/사업자) 기준으로 규칙별 걸린 장수를 센다.
   화면과 적용이 같은 답을 보게 이 한 곳에서만 계산한다. */
function classifyPlan(){
  const kind  = state.tab==='biz' ? 'biz' : 'card';
  const rules = classifyRuleList();
  const items = Object.values(state.items||{});
  const plan  = classifyTargets(items, rules, kind);
  const blocked = {};
  rules.forEach(r=>{
    const t = findRuleGroup(state.groups||{}, r, kind);
    if(t.locked) blocked[r.key] = 'locked';
  });
  const targetN = rules.reduce((s,r)=> s + (blocked[r.key] ? 0 : ((plan.byKey[r.key]||[]).length)), 0);
  return { kind, rules, plan, blocked, targetN, unmatchedN: plan.unmatched.length };
}
/* 규칙 분류 화면 — 환경설정 안에서는 팝업 없이 그 자리에 펼친다. */
let _rulePreview = '';              /* 지금 펼쳐 본 규칙 key */
function openClassifyRules(){
  const P = classifyPlan();
  const kindName = P.kind==='biz' ? '사업자등록증' : '명함';
  const inline = _panelTarget==='inline';
  const midN = Object.values(state.items||{})
    .filter(it=>it && ((it.kind==='biz')?'biz':'card')===P.kind && String(it.group||'')==='').length;

  let h = inline
    ? `<p class="setnote">폴더가 정해지지 않은 <b>${kindName} ${midN.toLocaleString()}장</b>을 회사명 단어로 나눠 담습니다.
       <b>이미 폴더에 든 명함은 건드리지 않습니다.</b></p>`
    : `<div class="mhead"><b>🗂 규칙으로 한 번에 분류</b>${_closeBtn()}</div>
       <p style="font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:10px">
       폴더가 정해지지 않은 <b>${kindName} ${midN.toLocaleString()}장</b>을 회사명 단어로 나눠 담습니다.
       <b>이미 폴더에 든 명함은 건드리지 않습니다.</b></p>`;

  P.rules.forEach(r=>{
    const n = (P.plan.byKey[r.key]||[]).length;
    const off = r.enabled===false;
    const lock = P.blocked[r.key]==='locked';
    const words = (r.words||[]).join(' · ');
    /* 규칙이 만든 폴더를 사람이 딴 이름으로 바꿨을 수 있다 — 그때는 바뀐 이름을 보여준다.
       규칙에 적힌 이름만 찍으면 화면과 실제 들어갈 곳이 어긋난다. */
    const gHit = findRuleGroup(state.groups||{}, r, P.kind);
    const gNow = gHit.gid ? (state.groups||{})[gHit.gid] : null;
    const dest = (gNow && gNow.name) || r.toGroupName;
    h += `<div class="ditem" style="align-items:flex-start;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:center;gap:8px;width:100%">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:800;font-size:13px">
          <input type="checkbox" ${off?'':'checked'} ${lock?'disabled':''}
            onchange="toggleClassifyRule('${r.key}')"> → 📁 ${esc(dest)}</label>
        <b style="margin-left:auto;font-size:13px;color:${lock?'var(--red)':(off?'#9aa6bd':'var(--orange)')}">
          ${lock ? '잠긴 폴더 — 보낼 수 없음' : (off ? '꺼짐' : n.toLocaleString()+'장')}</b>
      </div>
      <div style="font-size:12px;color:var(--sub);line-height:1.6;word-break:keep-all">${esc(words)}</div>
      <div style="display:flex;gap:6px">
        <button class="btn ghost" style="padding:5px 11px;font-size:12px"
          onclick="editRuleWords('${r.key}')">단어 고치기</button>
        ${n && !off && !lock ? `<button class="btn ghost" style="padding:5px 11px;font-size:12px"
          onclick="previewRule('${r.key}')">${_rulePreview===r.key?'접기':'미리보기'}</button>` : ''}
      </div>
      ${_rulePreview===r.key ? ruleSampleHtml(P.plan.byKey[r.key]||[]) : ''}
    </div>`;
  });

  h += `<div class="ditem" style="align-items:center"><div class="v">
      <b style="color:var(--sub)">규칙에 안 걸림</b>
      <br><span style="font-size:12px;color:var(--sub)">손으로 정리하거나 단어를 더하세요</span></div>
      <b style="flex:none;font-size:13px;color:var(--sub)">${P.unmatchedN.toLocaleString()}장</b></div>`;

  h += P.targetN
    ? `<button class="btn primary" style="width:100%;margin-top:12px"
         onclick="applyClassifyRules()">✅ ${P.targetN.toLocaleString()}장 지금 분류하기</button>`
    : `<p style="font-size:12.5px;color:var(--green);padding:12px 4px;text-align:center">
         ✓ 규칙으로 옮길 ${kindName}이 없습니다</p>`;
  h += `<div id="undoBar"></div>`;     /* 되돌리기 줄 — Task 4에서 채운다 */
  h += `<p style="font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:10px">
    ※ 폴더만 바뀝니다. 명함은 지워지지 않고, 적용 뒤 <b>되돌리기</b>로 통째로 되돌릴 수 있어요.</p>`;
  showPanel(h);
  renderUndoBar();
}
/* 규칙 적용 — 명함 수천 장을 하나씩 쓰면 수천 번 통신한다.
   items·idx·되돌리기 기록을 한 번의 update() 로 몰아 보낸다 (rebuildIdxAll 과 같은 방식). */
async function applyClassifyRules(){
  if(Store.mode!=='firebase') return toast('클라우드에 연결된 상태에서만 됩니다');
  const P = classifyPlan();
  if(!P.targetN) return toast('옮길 명함이 없습니다');

  /* 보낼 폴더를 미리 확보한다 — 없으면 여기서는 '만들 정보'만 메모리에 쥐고 있는다.
     실제로 쓰기(groups/…)는 취소해도 빈 폴더가 안 남도록 확인 뒤 카드와 한 통신에 같이 보낸다. */
  const gidOf = {}; const newGroups = {};
  for(const r of P.rules){
    if(r.enabled===false || P.blocked[r.key]) continue;
    if(!(P.plan.byKey[r.key]||[]).length) continue;
    const t = findRuleGroup(state.groups||{}, r, P.kind);
    if(t.locked) continue;
    if(t.gid){ gidOf[r.key] = t.gid; continue; }
    const gid = ruleFolderId(P.kind, r.toGroupName);
    newGroups[gid] = { id:gid, name:r.toGroupName, kind:P.kind, order:Date.now() };
    gidOf[r.key] = gid;
  }

  /* 실제로 들어갈 폴더 이름을 보여준다.
     규칙이 만든 폴더를 나중에 사람이 딴 이름으로 바꿔 두면(이름은 달라도 같은 폴더다)
     규칙에 적힌 이름을 그대로 찍을 경우 "노무사로 간다"고 읽고 눌렀는데 실제로는
     '2025 폐업정리'로 들어간다 — 못 본 곳에 동의하게 만드는 셈이다. */
  const lines = P.rules.filter(r=>gidOf[r.key])
    .map(r=>{
      const g = (state.groups||{})[gidOf[r.key]];
      const nm = (g && g.name) || r.toGroupName;
      const renamed = nm !== r.toGroupName ? ` (규칙 이름: ${r.toGroupName})` : '';
      return `· ${nm}${renamed} ← ${(P.plan.byKey[r.key]||[]).length.toLocaleString()}장`;
    }).join('\n');
  if(!confirm(`아래대로 ${P.targetN.toLocaleString()}장을 옮깁니다.\n\n${lines}\n\n`
    + `· 폴더만 바뀝니다. 명함은 지워지지 않습니다\n`
    + `· 이미 폴더에 든 명함은 건드리지 않습니다\n`
    + `· 적용 뒤 [되돌리기]로 통째로 되돌릴 수 있습니다\n\n진행할까요?`)) return;

  /* confirm() 이 떠 있는 동안 Firebase 리스너는 멈춰 있다 — 그 사이 동료가 지운 카드가 있어도
     여기 온 순간까진 반영이 안 돼 있을 수 있다. 한 박자 넘겨 큐에 쌓인 갱신을 먼저 흘려보낸다. */
  await new Promise(r=>setTimeout(r,0));

  const batchId = uid();
  const upd = {}, logItems = {};
  const usedGids = new Set();
  let n = 0, skipped = 0;
  P.rules.forEach(r=>{
    const gid = gidOf[r.key]; if(!gid) return;
    (P.plan.byKey[r.key]||[]).forEach(planned=>{
      /* confirm() 을 보는 동안 지워졌거나, 이미 다른 곳으로 옮겨졌으면 건드리지 않는다 —
         그 사이의 사람 손 처리가 규칙보다 우선한다 */
      const cur = state.items[planned.id];
      if(!cur || String(cur.group||'') !== ''){ skipped++; return; }
      /* confirm() 을 보는 동안 동료가 이 목적지 폴더를 잠갔을 수 있다 — 색인 쓰기는 이미
         아래에서 잠금을 걸러내는데, 카드 이동만 그대로 두면 '카드는 잠긴 폴더로 들어갔는데
         색인엔 없다'는 불일치가 생긴다. 이동 자체를 건너뛰어 둘을 맞춘다. */
      if(state.groups[gid] && state.groups[gid].locked){ skipped++; return; }
      logItems[cur.id] = { from:'', to:gid };         /* 되돌릴 때 견줘 볼 원래·새 폴더 둘 다 남긴다 */
      upd[`items/${cur.id}/group`]     = gid;
      upd[`items/${cur.id}/updatedAt`] = Date.now();
      /* 폴더가 바뀌면 검색색인에 들어갈지 여부도 달라진다 — 같은 통신에 함께 고친다.
         (잠긴 폴더 제외는 writeIdx·rebuildIdxAll 과 같은 규칙) */
      const merged = { ...cur, group:gid };
      upd[`idx/${cur.id}`] = inLockedGroup(merged) ? null : idxRecord(merged);
      usedGids.add(gid);
      n++;
    });
  });

  if(!n){ toast('그 사이 대상이 모두 사라지거나 옮겨졌습니다 — 다시 열어 확인해 주세요', 6000); return; }

  /* 카드가 한 장도 안 간 폴더는 만들지 않는다 — 취소·전량 스킵 뒤에 빈 폴더만 남는 일을 막는다 */
  Object.values(newGroups).forEach(g=>{ if(usedGids.has(g.id)) upd[`groups/${g.id}`] = g; });
  upd[`classifyLog/${batchId}`]      = { id:batchId, at:firebase.database.ServerValue.TIMESTAMP, by:(myEmail||''), n, kind:P.kind };
  upd[`classifyLogItems/${batchId}`] = logItems;         /* 카드별 원래·새 폴더 — 되돌리기만 쓰는 무거운 맵이라 따로 둔다 */

  toast(`분류하는 중… ${n.toLocaleString()}장`, 30000);
  try{
    await Store.db.ref(DB_ROOT).update(upd);
    Object.values(newGroups).forEach(g=>{ if(usedGids.has(g.id)) state.groups[g.id] = g; }); /* 실제로 쓴 만큼만 로컬에도 반영 */
    await pruneClassifyLog();
    let msg = `✅ ${n.toLocaleString()}장을 폴더로 옮겼습니다 — 되돌리려면 [되돌리기]`;
    if(skipped) msg += ` (그 사이 지워지거나 옮겨진 ${skipped.toLocaleString()}장 제외)`;
    toast(msg, 8000);
    setTimeout(()=>_refresh(openClassifyRules), 400);
  }catch(e){
    toast('❌ 실패: ' + ((e&&e.message)||'알 수 없음'), 6000);
  }
}
/* 되돌리기 기록은 최근 10건만 남긴다 — 5,000장 기록이 쌓이면 무거워진다.
   classifyLog 에는 날짜·건수 같은 가벼운 정보만 담는다. 카드 5,000장짜리 맵(=classifyLogItems)은
   여기서 구독하지 않는다 — 그걸 구독하면 화면 한 줄 그리자고 전 직원이 로그인마다,
   그리고 남이 분류할 때마다 그 무거운 맵을 통째로 받게 된다. 되돌릴 때만 once() 로 딱 한 번 받는다. */
let _classifyLog = {};
/* ══════ _atMs — 순수 로직 (테스트 대상) ══════
   at 은 ServerValue.TIMESTAMP 로 쓴다(느리거나 빠른 PC 시계가 되돌리기 순서를 정하면 안 되니까).
   그런데 로컬 낙관적 갱신 단계에서는 아직 서버가 채워주기 전이라 숫자가 아니라
   {'.sv':'timestamp'} 같은 placeholder 객체로 잠깐 보일 수 있다 — 그 경우만 '지금'으로 본다.
   at 이 아예 없거나 이상한 값이면 '지금'이 아니라 가장 오래된 것(0)으로 봐야 한다 —
   안 그러면 기록 없는 항목이 되돌리기 버튼에 영원히 눌러앉고, pruneClassifyLog 가
   진짜 최근 기록보다 그걸 먼저 살려 둔다. */
function _atMs(v){
  if(typeof v==='number') return v;
  if(v && typeof v==='object' && v['.sv']==='timestamp') return Date.now();
  return 0;
}
/* ══════ _atMs 끝 ══════ */
function watchClassifyLog(){
  try{
    if(Store.mode!=='firebase') return;
    Store.db.ref(DB_ROOT+'/classifyLog').on('value', s=>{
      _classifyLog = s.val()||{};
      /* 화면이 이미 떠 있으면 그 자리에서 다시 그린다 — 늦게 도착한 기록도 놓치지 않게 */
      try{ if($('undoBar')) renderUndoBar(); }catch(_){}
    });
  }catch(e){ console.warn('[watchClassifyLog]', e&&e.message); }
}
async function pruneClassifyLog(){
  try{
    const all = Object.values(_classifyLog||{}).filter(x=>x&&x.id).sort((a,b)=>_atMs(b.at)-_atMs(a.at));
    if(all.length <= 10) return;
    const upd = {};
    all.slice(10).forEach(x=>{ upd[`classifyLog/${x.id}`] = null; upd[`classifyLogItems/${x.id}`] = null; });
    await Store.db.ref(DB_ROOT).update(upd);
  }catch(e){ console.warn('[pruneClassifyLog]', e&&e.message); }
}
/* 되돌리기 줄 — 가장 최근 적용 한 건을 화면에 채운다. 메타(날짜·건수·작성자)만으로 그린다 —
   카드별 맵은 여기서 안 받는다(무거워서, Important 5).
   Task 3이 남겨 둔 <div id="undoBar"> 안에만 쓴다. 그 자리가 없으면 아무것도 안 한다. */
function renderUndoBar(){
  const el = $('undoBar'); if(!el) return;
  const last = Object.values(_classifyLog||{}).filter(x=>x&&x.id)
    .sort((a,b)=>_atMs(b.at)-_atMs(a.at))[0];
  if(!last){ el.innerHTML=''; return; }
  const d = new Date(_atMs(last.at));
  const when = `${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const by = last.by ? ` · ${esc(last.by)}` : '';
  el.innerHTML = `<div class="ditem" style="align-items:center;margin-top:10px">
    <div class="v"><b>↩️ 마지막 분류</b>
      <br><span style="font-size:12px;color:var(--sub)">${when}${by} · ${(last.n||0).toLocaleString()}장</span></div>
    <button class="btn ghost" style="flex:none;padding:8px 14px"
      onclick="undoClassify('${last.id}')">되돌리기</button></div>`;
}
/* 되돌리기 — 기록해 둔 '원래 폴더'로 되돌린다. 단, 그 사이 사람이 손으로 다시 옮긴 카드는
   건너뛴다(그 판단이 규칙보다 이긴다) — 그러려면 카드별로 '이 배치가 보낸 폴더'도 함께
   기억해 둬야 지금 있는 자리와 견줄 수 있다(Critical). 카드별 맵은 여기서만 once() 로 받는다. */
async function undoClassify(batchId){
  if(Store.mode!=='firebase') return toast('클라우드에 연결된 상태에서만 됩니다');
  const log = (_classifyLog||{})[batchId];
  if(!log) return toast('되돌릴 기록을 찾지 못했습니다');

  let itemsSnap;
  try{
    const s = await Store.db.ref(DB_ROOT+'/classifyLogItems/'+batchId).once('value');
    itemsSnap = s.val() || {};
  }catch(e){ return toast('❌ 실패: ' + ((e&&e.message)||'알 수 없음'), 6000); }
  const ids = Object.keys(itemsSnap);
  if(!ids.length){
    /* classifyLog(메타)는 남아 있는데 classifyLogItems(카드별 맵)만 없다 — 예전에 지워졌거나
       프루닝이 어긋난 경우다. 여기서 메타만 지워 두지 않으면 되돌리기 버튼이 화면에
       영원히 남아, 눌러도 매번 이 토스트만 뜨는 죽은 버튼이 된다. */
    try{ await Store.db.ref(DB_ROOT).update({ [`classifyLog/${batchId}`]: null, [`classifyLogItems/${batchId}`]: null }); }
    catch(e){ console.warn('[undoClassify] 고아 메타 정리 실패', e&&e.message); }
    return toast('되돌릴 기록을 찾지 못했습니다');
  }

  /* 확인창에 누가·어디로 보낸 것인지 보여준다 — 이름·건수만 보고 누르는 일을 막는다.
     confirm() 은 그냥 텍스트 창이라 esc() 로 HTML 엔티티화하면 'R&D' 가 'R&amp;D' 로
     그대로 보인다 — applyClassifyRules 의 확인창과 똑같이 원문 그대로 보여준다. */
  const nameOf = gid => gid ? (state.groups[gid]?.name || '(삭제된 폴더)') : '미분류';
  const toCount = {};
  ids.forEach(id=>{ const to = itemsSnap[id].to||''; toCount[to] = (toCount[to]||0)+1; });
  const toLines = Object.keys(toCount)
    .map(gid=>`· ${nameOf(gid)} ← ${toCount[gid].toLocaleString()}장`).join('\n');
  const byWho = log.by ? `${log.by} 님이 적용한 ` : '';
  if(!confirm(`${byWho}${ids.length.toLocaleString()}장을 분류하기 전 상태로 되돌립니다.\n\n${toLines}\n\n`
    + `· 그 사이 사람이 손으로 다시 옮긴 카드는 건드리지 않고 건너뜁니다\n\n진행할까요?`)) return;

  /* confirm() 이 떠 있는 동안 스레드가 막혀 있어 Firebase 리스너 콜백이 못 들어온다 —
     확인창을 닫는 순간 큐에 쌓여 있던 갱신(동료의 수동 이동·삭제)이 한꺼번에 반영된다.
     한 박자 넘겨 그걸 먼저 흘려보내야, 바로 아래에서 state.items 를 읽을 때 방금 반영된
     최신 값을 본다 — applyClassifyRules 가 이미 하고 있는 것과 똑같다(Critical). */
  await new Promise(r=>setTimeout(r,0));

  const now = Date.now();
  const upd = {};
  let restored = 0, movedSince = 0, gone = 0;
  ids.forEach(id=>{
    const cur = state.items[id];
    if(!cur){ gone++; return; }                              /* 그 사이 지워졌다 */
    const rec = itemsSnap[id] || {};
    const to = String(rec.to||'');
    if(String(cur.group||'') !== to){ movedSince++; return; } /* 그 사이 딴 곳으로 옮겨졌다 — 그 결정이 이긴다 */
    const back = String(rec.from||'');
    upd[`items/${id}/group`]     = back;
    upd[`items/${id}/updatedAt`] = now;
    const merged = { ...cur, group:back };
    upd[`idx/${id}`] = inLockedGroup(merged) ? null : idxRecord(merged);
    restored++;
  });

  if(!restored){
    /* 하나도 못 되돌렸으면 기록을 지우지 않는다 — 지웠다가 나중에 다시 찾아야 할 수도 있다 */
    toast(movedSince
      ? `되돌릴 카드가 없습니다 — ${movedSince.toLocaleString()}장이 그 사이 손으로 옮겨졌습니다`
      : '되돌릴 카드가 없습니다', 6000);
    return;
  }
  upd[`classifyLog/${batchId}`]      = null;
  upd[`classifyLogItems/${batchId}`] = null;
  toast('되돌리는 중…', 30000);
  try{
    await Store.db.ref(DB_ROOT).update(upd);
    let msg = `↩️ ${restored.toLocaleString()}장을 되돌렸습니다`;    /* 실제로 되돌린 만큼만 알린다 */
    if(movedSince) msg += ` (그 사이 옮겨진 ${movedSince.toLocaleString()}장 제외)`;
    if(gone) msg += ` (삭제된 ${gone.toLocaleString()}장 제외)`;
    toast(msg, 8000);
    setTimeout(()=>_refresh(openClassifyRules), 400);
  }catch(e){
    toast('❌ 되돌리기 실패: ' + ((e&&e.message)||'알 수 없음'), 6000);
  }
}

/* ===== 자동 로그아웃 (무활동 60분) + 남은시간 배지 + 2분 전 경고 =====
   ERP·컨설팅과 같은 localStorage('pu_last_active') 공유 → 어느 앱을 써도 함께 리셋 */
(function(){
  var LIMIT=60*60*1000, WARN=2*60*1000, AKEY='pu_last_active';
  /* 포털 공용 설정의 자동 로그아웃 시간 반영 — 10~480분만 인정, 그 밖이면 기본값 유지 */
  function _applyIdleCfg(c){
    var m = c && parseInt(c.idleMinutes, 10);
    if(m >= 10 && m <= 480) LIMIT = m*60*1000;
  }
  try{ _applyIdleCfg(window.PU_CFG); }catch(e){}            /* 이미 로드됐으면 즉시 */
  try{ window.addEventListener('pu-cfg', function(ev){ _applyIdleCfg(ev.detail); }); }catch(e){}
  var warnBox=null, tick=null;
  function loggedIn(){ try{ var u=firebase.auth().currentUser; return !!(u&&u.email); }catch(e){ return false; } }
  function now(){ return Date.now(); }
  function getLast(){ try{ var v=parseInt(localStorage.getItem(AKEY)||'0',10); return v>0?v:now(); }catch(e){ return now(); } }
  function markActive(){ try{ localStorage.setItem(AKEY,String(now())); }catch(e){} hideWarn(); }
  function fmt(ms){ if(ms<0)ms=0; var s=Math.floor(ms/1000); return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2); }
  function doAutoLogout(){
    try{
      try{ firebase.auth().signOut(); }catch(_){}
      var ov=document.createElement('div'); ov.style.cssText='position:fixed;inset:0;background:#eef1f7;z-index:2147483647;'; document.body.appendChild(ov);
      setTimeout(function(){ location.replace('enter.html?v='+now()); }, 200);
    }catch(_){ location.replace('enter.html'); }
  }
  function showWarn(remMs){
    if(!warnBox){
      warnBox=document.createElement('div');
      warnBox.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:2147483646;background:#fff;border:1px solid #fca5a5;border-radius:12px;padding:14px 18px;box-shadow:0 14px 40px rgba(20,30,80,.22);display:flex;align-items:center;gap:14px;font-size:13px;color:#202124;';
      var msg=document.createElement('span'); msg.id='pu-warn-msg2'; msg.style.fontWeight='600';
      var btn=document.createElement('button'); btn.textContent='계속 사용'; btn.style.cssText='padding:7px 16px;border:none;background:#1e40af;color:#fff;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;';
      btn.addEventListener('click', markActive);
      warnBox.appendChild(msg); warnBox.appendChild(btn); document.body.appendChild(warnBox);
    }
    warnBox.style.display='flex';
    var m=document.getElementById('pu-warn-msg2'); if(m) m.textContent='⏱ 미사용으로 곧 로그아웃됩니다 ('+fmt(remMs)+' 남음)';
  }
  function hideWarn(){ if(warnBox) warnBox.style.display='none'; }
  ['mousemove','mousedown','keydown','touchstart','scroll','click'].forEach(function(ev){
    window.addEventListener(ev, markActive, {passive:true, capture:true});
  });
  try{ if(!localStorage.getItem(AKEY)) markActive(); }catch(e){}
  tick=setInterval(function(){
    var badges=document.querySelectorAll('.logoutTimer');
    if(!loggedIn()){ badges.forEach(function(b){ b.style.display='none'; }); hideWarn(); return; }
    var rem=LIMIT-(now()-getLast());
    badges.forEach(function(b){ b.style.display='inline-flex'; b.textContent='⏱ '+fmt(rem); });
    if(rem<=0){ clearInterval(tick); doAutoLogout(); return; }
    if(rem<=WARN){ showWarn(rem); } else { hideWarn(); }
  }, 1000);
})();
