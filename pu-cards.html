        : (state.mbQ||state.mbFilter) ? '찾은 메일이 없습니다.'
        : '아직 동기화된 메일이 없습니다.<br><b>새로고침 ↻</b> 를 눌러 다음메일에서 가져오세요.'}</div>`;

  const meta = _mbMeta && _mbMeta.at
    ? `마지막 동기화 ${fmtDate(_mbMeta.at)} ${new Date(_mbMeta.at).toTimeString().slice(0,5)}`
    : '아직 동기화하지 않았습니다';

  /* ⚠ 여기 위에 갈래 단추줄(전체메일·청구서·쇼핑·소셜·프로모션)이 있었다.
     대표 화면 2026-08-24 로 «통째로 없앴다» — "이부분 박스 모두 없애자".
     지금 어느 칸인지는 왼쪽 옆줄이 파랗게 켜져서 알려 준다.
     되살리려거든 낱말로 갈래를 짚던 mbClassify 도 함께 되살려야 한다(git 에 있다). */
  return `
    <div class="dm-tools">
      <input type="checkbox" class="chk" ${allOn?'checked':''} onclick="pickToggleAll('mbox')"
        title="보이는 것 모두 고르기">
      ${/* ⚠ 단추를 흐리게(disabled) 두지 않는다 — 다음메일함은 늘 같은 진하기로 있고,
            안 고른 채 누르면 「고른 것이 없습니다」로 알려 준다. 흐린 단추는 「이 앱은
            그 일을 못 한다」로 읽혀, 대표께서 눌러 보지도 않으신다. */''}
      <button onclick="mbTrash()" title="고른 메일을 다음메일 휴지통으로 옮깁니다">삭제</button>
      ${/* 답장은 메일 앱에서 가장 많이 쓰는 자리인데 없었다(대표 지시 2026-08-25) */''}
      <button onclick="mbReply(false)" title="보낸 사람에게 답장합니다">답장</button>
      <button onclick="mbReply(true)" title="받는 사람 모두에게 답장합니다">전체답장</button>
      <button onclick="mbForward()" title="고른 한 통을 우리 주소로 새로 써서 전달합니다">전달</button>
      <button onclick="mbResend()" title="같은 제목으로 새 편지를 씁니다">다시보내기</button>
      ${/* ⚠ 「이동」은 이제 «우리 앱 안에서만» 나누는 일이다(대표 지시 2026-08-26).
            다음메일에는 아무것도 쓰지 않는다 — 그래서 이름도 「분류」로 바꿨다.
            다음메일에서도 옮기고 싶으면 이 창 맨 아래 접힌 줄을 편다. */''}
      <button onclick="mbMove(event)"
        title="고른 메일을 푸른 분류 칸으로 옮깁니다 — 다음메일은 그대로입니다">분류 ˅</button>
      ${mbNow().charAt(0)===MB_RAW_P ? '' :
        `<button onclick="mbBinUndo()"
          title="옮긴 메일을 다음메일에 있는 제자리로 되돌립니다">원래대로 ↩</button>`}
      ${/* 열면 읽음이 되는데 «되돌릴 길»이 없었다 — 나중에 다시 볼 것을 표시해 두는 자리다 */''}
      <button onclick="mbReadMark(false)" title="고른 메일을 안 읽음으로 되돌립니다">안읽음</button>
      <button ${_mbBusy?'disabled':''} onclick="mbPull()"
        title="다음메일에 지금 붙어 목록을 새로 가져옵니다">${_mbBusy?'가져오는 중…':'새로고침 ↻'}</button>
      <span class="sp"></span>
      <span class="dm-search"><i>🔍</i>
        <input id="mbQ" placeholder="메일 검색" value="${esc(state.mbQ||'')}"
          oninput="state.mbQ=this.value;if(!event.isComposing)renderMailPage()"
          oncompositionend="state.mbQ=this.value;renderMailPage()"></span>
      <span class="dm-bar"></span>
      <button onclick="mbShowDetail()">상세</button>
      ${/* 몇 통씩 볼까 (대표 지시 2026-08-25) — 다음메일도 이 값을 고르게 해 둔다.
           ⚠ 「보이는 수」와 「받아 오는 수」가 같은 값이다. 따로 두면 화면에는 50통인데
             받아 오기는 500통이라, 눈에 안 보이는 곳에서 요금이 나간다. */''}
      <select class="dm-size" onchange="mbSetPageSize(this.value)" title="한 번에 몇 통씩 볼까">
        ${MB_SIZES.map(n=>`<option value="${n}" ${n===mbPageSize()?'selected':''}>${n}개씩</option>`).join('')}
      </select>
    </div>
    ${/* 안내줄 — 오른쪽 글귀는 다음메일함과 같은 그 문장이다. 방향키·스페이스가 실제로
          되게 만들어 두었다(mbKeyNav) — 안 되는 채로 적어 두면 거짓말이 된다.
          왼쪽에는 몇 통인지와 언제 가져온 것인지를 둔다. 거울이니 «언제 것인가»가
          늘 보여야 한다. */''}
    <div class="dm-hint" style="display:flex;gap:12px;text-align:left">
      <span style="flex:1">${rows.length
        ? `${rows.length.toLocaleString()}통 보는 중`
          + (mbBoxTotal() > rows.length ? ` · 이 칸에 모두 ${mbBoxTotal().toLocaleString()}통` : '')
          + (nPick?` · ${nPick}통 고름`:'') + ' · '
        : ''}${esc(meta)}</span>
      <span>＊ 메일 목록, 방향키로 이동, 스페이스로 선택</span></div>
    <div class="dm-list">${body}</div>
    ${/* ⚠ 「더 보기」는 «남은 것이 있을 때만» 보여 준다. 다 보고 있는데도 단추가 있으면
         눌러도 아무 일이 없어, 대표께서 「고장 났나」 하신다. */''}
    ${rows.length && mbBoxTotal() > rows.length
      ? `<button class="dm-more" onclick="mbMore()">이전 메일 더 보기</button>` : ''}`;
}

/* ── 방향키로 이동 · 스페이스로 선택 ──
   목록 위 안내줄에 그렇게 적혀 있다. 적어 두고 안 되게 두면 그 줄이 거짓말이 된다.
   ⚠ 글자 칸(찾기 상자 등)에 손이 가 있을 때는 아무것도 하지 않는다 — 스페이스를
     먹어 버리면 검색어에 빈칸을 못 넣는다. */
function mbKeyNav(e){
  if(state.view!=='mail' || state.mailSent!=='box' || state.mbOpen) return;
  const t = e.target;
  if(t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName||'') || t.isContentEditable)) return;
  const rows = mbVisibleRows();
  if(!rows.length) return;
  let i = Number(state.mbCursor);
  if(!Number.isInteger(i) || i<0 || i>=rows.length) i = -1;
  if(e.key==='ArrowDown'){ i = Math.min(rows.length-1, i+1); }
  else if(e.key==='ArrowUp'){ i = (i<0) ? 0 : Math.max(0, i-1); }
  else if(e.key===' ' || e.key==='Spacebar'){
    if(i<0) return; e.preventDefault(); pickHit('mbox', rows[i]._key); return;
  }
  else if(e.key==='Enter'){
    if(i<0) return; e.preventDefault(); mbOpenMsg(rows[i]._slug, rows[i].u); return;
  }
  else return;
  e.preventDefault();
  state.mbCursor = i;
  renderMailPage();
  const el = document.getElementById('mbRow'+i);
  if(el && el.scrollIntoView) el.scrollIntoView({ block:'nearest' });
}

/* 「상세」 — 다음메일은 상세검색 창을 연다. 우리는 지금 무엇으로 걸러져 있는지와
   이 목록이 어디서 온 것인지를 알려 준다(사람이 「왜 안 보이지」를 스스로 풀 수 있게). */
function mbShowDetail(){
  const f = {unread:'안 읽은 것만', flag:'중요 표시한 것만', att:'첨부 있는 것만'}[state.mbFilter||''] || '전체';
  alert(`지금 보고 있는 것\n\n`
    + `칸 · ${mbBoxName(mbNow())}\n거르개 · ${f}\n`
    + `찾는 말 · ${state.mbQ||'(없음)'}\n보인 통수 · ${mbVisibleRows().length.toLocaleString()}\n\n`
    + `이 목록은 다음메일(${mbMyAddr()||'회사 주소'})을 그대로 비춘 것입니다.\n`
    + `답장·폴더 만들기는 다음메일에서 하시고, 여기서는 읽기·전달·다시보내기·휴지통 옮기기를 하십니다.`);
}

/* ══════ 메일 한 통 열기 ══════
   본문은 실시간DB에 없다 — 서버가 그 자리에서 IMAP 으로 가져온다. */
function mbOpenMsg(slug, uid){
  state.mailSent='box'; state.mbOpen = { slug:slug, uid:String(uid), loading:true };
  renderMailPage();
  try{ $('pcMain').scrollTop=0; }catch(_){}
  const u = firebase.auth().currentUser;
  if(!u){ state.mbOpen.loading=false; state.mbOpen.err='로그인이 필요합니다'; return renderMailPage(); }
  u.getIdToken()
    .then(tok=>fetch(MB_FN+'readMailMessage', { method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+tok },
      body: JSON.stringify({ slug:slug, uid:String(uid) }) }))
    .then(r=>r.json().catch(()=>({})))
    .then(j=>{
      if(!state.mbOpen || state.mbOpen.uid!==String(uid)) return;   /* 그새 딴 것을 열었다 */
      if(!j.ok) throw new Error(j.error||'열지 못했습니다');
      state.mbOpen = Object.assign(state.mbOpen, { loading:false, err:'', html:j.html||'', text:j.text||'', atts:j.atts||[] });
      /* 읽음 표시 — 서버가 다음메일에도 같이 해 두었다. 목록도 굵기를 풀어 준다. */
      const box = _mbMsgs[slug]; if(box && box[uid]) box[uid].r = 1;
      const f = _mbFolders && _mbFolders[slug];
      if(f && Number(f.unseen||0)>0) f.unseen = Number(f.unseen)-1;
      renderPCSide(); renderMailPage();
      /* 목록에서 [답장]을 눌러 본문부터 가져온 경우 — 이제 답장 화면으로 간다 */
      if(state.mbReplyAfterOpen){ const all = state.mbReplyAfterOpen==='all';
        state.mbReplyAfterOpen=''; mbReply(all); }
    })
    .catch(e=>{
      if(!state.mbOpen) return;
      state.mbOpen.loading=false; state.mbOpen.err=(e&&e.message)||'열지 못했습니다';
      renderMailPage();
    });
}
function mbBack(){ state.mbOpen=null; renderMailPage(); }
/* 읽는 자리에서 누르는 전달·삭제 — 목록에서 고르지 않고 «지금 보는 이 통»에 한다.
   ⚠ 고른 것(pick)을 건드리지 않는다. 목록에서 딴 것을 골라 두었는데 여기서 누르면
     엉뚱한 메일이 지워진다. */
function mbOneRow(slug, uid){
  const v = (_mbMsgs[slug]||{})[String(uid)];
  return v ? Object.assign({}, v, { _slug:slug, _key:slug+':'+uid }) : null;
}
function mbForwardOne(slug, uid){
  const v = mbOneRow(slug, uid); if(!v) return toast('그 메일을 찾지 못했습니다');
  const head = `\n\n────────── 아래는 전달받은 메일입니다 ──────────\n`
    + `보낸이 · ${v.f||v.e||''}\n받은 때 · ${fmtDate(v.d)}\n제목 · ${v.s||''}\n`;
  openMailPage({ to:'', subject:'[전달] '+String(v.s||''), body:head });
  if(Number(v.a||0)) toast('첨부는 함께 가지 않습니다 — 첨부를 내려받은 뒤 붙여 주세요', 9000);
}
function mbTrashOne(slug, uid){
  const v = mbOneRow(slug, uid); if(!v) return toast('그 메일을 찾지 못했습니다');
  const trash = mbFolderOf('trash')[0];
  if(!trash) return toast('휴지통 폴더를 찾지 못했습니다 — 새로고침을 먼저 눌러 주세요', 8000);
  if(!confirm(`「${v.s||'(제목 없음)'}」 를 휴지통으로 옮깁니다.\n\n`
    + `⚠ 다음메일함에서도 휴지통으로 갑니다(되돌릴 수 있습니다).\n진행할까요?`)) return;
  mbMoveTo([v], trash.slug, '휴지통');
}

function mbReadHtml(){
  const o = state.mbOpen||{};
  const box = _mbMsgs[o.slug]||{};
  const v = box[o.uid]||{};
  const to = String(v.t||'').split(',').filter(Boolean).join(', ');
  /* 본문은 서버가 준 그대로 넣는다. 남의 HTML 이라 스크립트가 섞여 있을 수 있으므로
     꼬리표를 걷어낸 뒤에 넣는다 — 걷지 않으면 메일 한 통이 이 앱을 조종할 수 있다. */
  const bodyHtml = o.html ? mbCleanHtml(o.html)
    : o.text ? '<pre style="white-space:pre-wrap;font-family:inherit;margin:0">'+esc(o.text)+'</pre>'
    : '';
  return `<div class="dm-read">
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <button class="back" onclick="mbBack()">‹ ${esc(mbBoxName(o.slug))}</button>
      <span style="flex:1"></span>
      ${/* 읽는 자리에 손이 갈 것들 — 다음메일도 여기 둔다 */''}
      <button class="rbtn" onclick="mbReply(false)">답장</button>
      <button class="rbtn" onclick="mbReply(true)">전체답장</button>
      <button class="rbtn" onclick="mbForwardOne('${o.slug}','${o.uid}')">전달</button>
      <button class="rbtn" title="중요 표시 — 다음메일에도 함께 켜집니다"
        onclick="mbStar('${o.slug}','${o.uid}')">${Number(v.g||0)?'★ 중요':'☆ 중요'}</button>
      <button class="rbtn" onclick="mbTrashOne('${o.slug}','${o.uid}')">삭제</button>
    </div>
    <h3>${esc(v.s||'(제목 없음)')}</h3>
    <div class="meta">
      ${/* ⚠ 주소만 적으면 누구인지 모른다 — 명함첩에서 이름·회사를 찾아 «앞»에 세우고
            주소는 뒤에 작게 둔다(대표 지시 2026-08-25) */''}
      <span><b>보낸이</b> ${esc(mbNameOf(v.e, v.f)||'(모름)')}${v.e?' <i class="addr">'+esc(v.e)+'</i>':''}</span>
      <span><b>받는 곳</b> ${esc(mbNamesOf(to, v.tn)||'(없음)')}${to?' <i class="addr">'+esc(to)+'</i>':''}</span>
      <span><b>받은 때</b> ${esc(fmtDate(v.d)+' '+new Date(Number(v.d||0)).toTimeString().slice(0,5))}</span>
      ${/* 사람이 다음메일에서 보는 이름으로 적는다 — 「INBOX」라고 쓰면 같은 칸인지 모른다 */''}
      <span><b>폴더</b> ${esc(mbBoxName(o.slug))}</span>
    </div>
    ${(o.atts&&o.atts.length) ? `<div class="atts">${o.atts.map((a,i)=>
      `<button onclick="mbAtt(${i})" title="내려받기">📎 ${esc(a.name||'첨부')}${a.size?' · '+fmtMB(a.size):''}</button>`
    ).join('')}</div>` : ''}
    <div class="body">${o.loading ? '<div class="wait">본문을 가져오고 있습니다…</div>'
      : o.err ? '<div class="wait">열지 못했습니다 — '+esc(o.err)+'</div>'
      : (bodyHtml || '<div class="wait">본문이 없습니다.</div>')}</div>
    <div class="note">답장은 <b>다음메일에서</b> 하십니다 — 여기 목록은 다음메일을 비추는 거울이라,
      두 곳에서 따로 고치면 어느 쪽이 맞는지 알 수 없습니다.
      이 자리에서는 <b>전달·다시보내기</b>(우리 회사 주소로 새로 씀)와 <b>휴지통 옮기기</b>를 하십니다.</div>
  </div>`;
}

/* 남의 HTML 을 화면에 넣기 전에 위험한 것을 걷어낸다.
   ⚠ script·이벤트 속성·바깥 창을 부르는 것을 지운다. 이것을 빼면 메일 한 통이
     이 앱의 자료를 읽어 딴 곳으로 보낼 수 있다. */
function mbCleanHtml(html){
  let s = String(html||'');
  s = s.replace(/<\s*(script|iframe|object|embed|link|meta|base)\b[\s\S]*?<\s*\/\s*\1\s*>/gi, '');
  s = s.replace(/<\s*(script|iframe|object|embed|link|meta|base)\b[^>]*>/gi, '');
  s = s.replace(/\son[a-z]+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '');
  s = s.replace(/(href|src|action)\s*=\s*("|')?\s*javascript:[^"'\s>]*/gi, '$1="#"');
  return s;
}

/* 첨부 하나 내려받기 — 서버가 그 자리에서 IMAP 으로 받아 넘긴다(창고에 옮겨 담지 않는다) */
function mbAtt(i){
  const o = state.mbOpen||{}; const a = (o.atts||[])[i]; if(!a) return;
  toast('첨부를 가져오고 있습니다…', 3000);
  const u = firebase.auth().currentUser;
  if(!u) return toast('로그인이 필요합니다');
  u.getIdToken()
    .then(tok=>fetch(MB_FN+'readMailAttachment', { method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+tok },
      body: JSON.stringify({ slug:o.slug, uid:o.uid, index:i }) }))
    .then(r=>r.json().catch(()=>({})))
    .then(j=>{
      if(!j.ok) throw new Error(j.error||'내려받지 못했습니다');
      const bin = atob(j.b64||'');
      const buf = new Uint8Array(bin.length);
      for(let k=0;k<bin.length;k++) buf[k]=bin.charCodeAt(k);
      const url = URL.createObjectURL(new Blob([buf], { type:j.mime||'application/octet-stream' }));
      const el = document.createElement('a');
      el.href=url; el.download=j.name||a.name||'첨부'; document.body.appendChild(el); el.click();
      setTimeout(()=>{ URL.revokeObjectURL(url); el.remove(); }, 1500);
      toast('📥 '+(j.name||a.name||'첨부')+' 를 내려받았습니다');
    })
    .catch(e=>toast('내려받지 못했습니다 — '+((e&&e.message)||e), 8000));
}

/* ══════ 표시 켜고 끄기 — 중요(★) · 읽음 (대표 지시 2026-08-25) ══════
   ⚠ 별이 «보이기만 하고 눌리지 않던» 자리다. 보이는데 안 눌리면 고장으로 읽힌다.
   ⚠ 되돌릴 수 있는 것이라(다시 누르면 된다) 물어보지 않는다 — 별을 누를 때마다
     「하시겠습니까」가 뜨면 못 쓴다. 화면을 먼저 바꾸고 서버에 맡긴다(빠르게 보이게),
     실패하면 되돌리고 까닭을 말한다. */
function mbFlag(slug, uid, flag, on){
  const box = _mbMsgs[slug]; const row = box && box[String(uid)];
  const key = (flag==='star') ? 'g' : 'r';
  const before = row ? Number(row[key]||0) : 0;
  if(row) row[key] = on ? 1 : 0;
  renderMailPage(); renderPCSide();
  const u = firebase.auth().currentUser;
  if(!u){ if(row) row[key]=before; renderMailPage(); return toast('로그인이 필요합니다'); }
  u.getIdToken()
    .then(tok=>fetch(MB_FN+'flagMailMessages', { method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+tok },
      body: JSON.stringify({ slug:slug, uids:[String(uid)], flag:flag, on:!!on }) }))
    .then(r=>r.json().catch(()=>({})))
    .then(j=>{ if(!j.ok) throw new Error(j.error||'표시하지 못했습니다'); })
    .catch(e=>{
      if(row) row[key] = before;      // 되돌린다 — 화면만 바뀌고 다음메일은 그대로면 거짓말이 된다
      renderMailPage(); renderPCSide();
      toast('표시하지 못했습니다 — '+((e&&e.message)||e), 8000);
    });
}
function mbStar(slug, uid){
  const row = (_mbMsgs[slug]||{})[String(uid)];
  mbFlag(slug, uid, 'star', !(row && Number(row.g||0)));
}
/* 고른 것들의 읽음 표시를 한꺼번에 — 다음메일의 「읽음/안읽음」 자리다 */
function mbReadMark(on){
  const picked = mbPicked();
  if(!picked.length) return toast('고른 것이 없습니다');
  const byBox = {};
  picked.forEach(v=>{ (byBox[v._slug] = byBox[v._slug]||[]).push(String(v.u)); });
  const u = firebase.auth().currentUser;
  if(!u) return toast('로그인이 필요합니다');
  u.getIdToken().then(tok=>Promise.all(Object.keys(byBox).map(slug=>
    fetch(MB_FN+'flagMailMessages', { method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+tok },
      body: JSON.stringify({ slug:slug, uids:byBox[slug], flag:'read', on:!!on }) })
      .then(r=>r.json().catch(()=>({})))
  ))).then(res=>{
    const bad = res.find(j=>!j||!j.ok);
    if(bad) throw new Error((bad&&bad.error)||'표시하지 못했습니다');
    picked.forEach(v=>{ const row=(_mbMsgs[v._slug]||{})[String(v.u)]; if(row) row.r = on?1:0; });
    pickClear('mbox'); renderPCSide(); renderMailPage();
    toast(`${picked.length}통을 ${on?'읽음':'안 읽음'}으로 표시했습니다`);
  }).catch(e=>toast('표시하지 못했습니다 — '+((e&&e.message)||e), 8000));
}

/* ══════ 답장 · 전체답장 (대표 지시 2026-08-25) ══════
   메일 앱에서 가장 많이 쓰는 자리인데 없었다 — 전달·다시보내기만 있었다.
   ⚠ 답장도 «우리 회사 주소로 새로 쓰는» 것이다(다음메일이 아니라 우리 서버가 보낸다).
     그래야 보낸 기록이 앱에도 남고 자료함의 자료를 붙일 수 있다.
   ⚠ 본문을 인용해 넣는다 — 인용 없이 「네 알겠습니다」만 가면 받는 쪽이 무슨 이야기인지
     모른다. 열어 둔 메일의 본문을 쓰므로, 목록에서 바로 누르면 먼저 열어 온다. */
function mbReplyBody(v, text){
  const when = fmtDate(v.d) + ' ' + new Date(Number(v.d||0)).toTimeString().slice(0,5);
  const head = `\n\n────────── ${when} ${v.f||v.e||''} 님이 쓰신 글 ──────────\n`;
  const body = String(text||'').split(/\r?\n/).map(ln=>'> '+ln).join('\n');
  return head + body;
}
function mbReply(all){
  const o = state.mbOpen;
  const v = o ? ((_mbMsgs[o.slug]||{})[o.uid]||{}) : mbPicked()[0];
  if(!v || !v.u) return toast('답장할 메일을 고르세요');
  /* 목록에서 눌렀으면 본문이 아직 없다 — 먼저 열고 나서 답장 화면으로 간다 */
  if(!o || o.uid !== String(v.u)){
    toast('본문을 가져온 뒤 답장 화면으로 갑니다…', 4000);
    state.mbReplyAfterOpen = all ? 'all' : 'one';
    return mbOpenMsg(v._slug||o&&o.slug, v.u);
  }
  const me = mbMyAddr().toLowerCase();
  const to = String(v.e||'');
  /* 전체답장 — 원래 받는 사람들도 함께. 나는 뺀다(나에게 또 보내지 않는다). */
  const cc = all ? String(v.t||'').split(',').map(s=>s.trim())
      .filter(s=>s && s.toLowerCase()!==me && s.toLowerCase()!==to.toLowerCase()).join(', ')
    : '';
  const subj = /^re\s*:/i.test(String(v.s||'')) ? String(v.s) : 'RE: ' + String(v.s||'');
  openMailPage({ to:to, cc:cc, subject:subj, body: mbReplyBody(v, o.text || htmlToTextC(o.html||'')) });
}

/* ══════ 전달 · 다시보내기 ══════
   답장이 아니다 — 우리 회사 주소로 **새 편지**를 쓴다. 그래야 보낸 기록이 앱에도 남고,
   자료함의 자료를 붙일 수 있다. */
/* 고른 것들. ☐ 를 안 눌렀어도 방향키로 짚어 둔 줄이 있으면 그것을 고른 것으로 본다 —
   짚어 놓고 [전달]을 눌렀는데 「고른 것이 없습니다」가 뜨면 사람은 무엇이 잘못인지 모른다. */
function mbPicked(){
  const rows = mbVisibleRows();
  const sel = pickOf('mbox');
  const on = rows.filter(v=>pickOn(sel, v._key));
  if(on.length) return on;
  const i = Number(state.mbCursor);
  return (Number.isInteger(i) && i>=0 && i<rows.length) ? [rows[i]] : [];
}
function mbForward(){
  const picked = mbPicked();
  if(picked.length>1) return toast('전달은 한 통씩 합니다 — 하나만 골라 주세요', 6000);
  const v = picked[0]; if(!v) return toast('전달할 메일을 하나 고르세요');
  const head = `\n\n────────── 아래는 전달받은 메일입니다 ──────────\n`
    + `보낸이 · ${v.f||v.e||''}\n받은 때 · ${fmtDate(v.d)}\n제목 · ${v.s||''}\n`;
  openMailPage({ to:'', subject:'[전달] '+String(v.s||''), body:head });
  if(Number(v.a||0)) toast('첨부는 함께 가지 않습니다 — 메일을 열어 첨부를 내려받은 뒤 붙여 주세요', 9000);
}
function mbResend(){
  const picked = mbPicked();
  if(picked.length>1) return toast('다시보내기는 한 통씩 합니다 — 하나만 골라 주세요', 6000);
  const v = picked[0]; if(!v) return toast('다시 보낼 메일을 하나 고르세요');
  const f = mbFolderBy(v._slug)||{};
  const to = (f.kind==='sent'||f.kind==='drafts') ? String(v.t||'') : String(v.e||'');
  openMailPage({ to:to, subject:String(v.s||''), body:'' });
}

/* ══════ 휴지통으로 · 폴더 옮기기 ══════
   ⚠ 여기서만 다음메일을 «고친다». 반드시 물어본 뒤에 한다 — 거울이 원본을 고치는
     자리이므로, 사람이 그렇게 하겠다고 말했을 때만 움직여야 한다.
   ⚠ 지우는 것이 아니라 «휴지통으로 옮기는» 것이다. 다음메일 휴지통에서 되돌릴 수 있다. */
function mbTrash(){
  const picked = mbPicked(); if(!picked.length) return toast('고른 것이 없습니다');
  const trash = mbFolderOf('trash')[0];
  if(!trash) return toast('휴지통 폴더를 찾지 못했습니다 — 새로고침을 먼저 눌러 주세요', 8000);
  const names = picked.slice(0,4).map(v=>v.s||'(제목 없음)').join('\n· ');
  if(!confirm(`메일 ${picked.length}통을 휴지통으로 옮깁니다.\n\n· ${names}${picked.length>4?'\n· …':''}\n\n`
    + `⚠ 다음메일함에서도 휴지통으로 갑니다(되돌릴 수 있습니다).\n진행할까요?`)) return;
  mbMoveTo(picked, trash.slug, '휴지통');

/* ── 어디로 옮길까 — «누른 자리 옆»에 폴더를 늘어놓고 눌러서 고른다 ──
   ⚠ 예전에는 브라우저 알림창에 「1. 자문사답변 2. 급여 … 번호를 적어 주세요」가 떴다.
     폴더가 스물여덟이라 목록이 화면을 넘겼고, 세어 가며 번호를 적어야 했다
     (대표 지시 2026-08-25 — 폴더 손보는 창과 같은 까닭). */
/* ⚠ 2026-08-26 로 이 창이 «우리 칸» 창이 되었다. 고르면 다음메일이 아니라 쪽지가 바뀐다.
     다음메일에서도 옮기는 옛 길은 맨 아래 한 줄로 접어 두었다 — 없애지는 않았다.
     (2026-08-25 에 만든 길이고, 다음메일 폴더를 진짜로 정리하려는 날이 올 수 있다) */
function mbMove(ev){
  const picked = mbPicked(); if(!picked.length) return toast('고른 것이 없습니다');
  /* 숨긴 칸은 옮길 곳으로 내놓지 않는다 — 치운 칸에 넣으면 그 자리에서 사라진다 */
  const bins = mbBins().filter(b=>!mbHidden(b.id));
  const m = $('folderMenu'); if(!m) return;
  const nowId = mbNow();
  m.innerHTML = `<div class="fmhead">${picked.length.toLocaleString()}통을 어느 칸으로
      <span>우리 앱에서만 — 다음메일은 그대로</span></div>
    <div class="fmlist">${bins.map(b=>{
      if(nowId === MB_BIN_P + b.id) return '';
      const c = mbBinCount(b);
      return `<div class="fmi" style="padding-left:${14+Number(b.depth||0)*13}px"
        onclick="mbBinPut('${b.id}')">📂 ${esc(b.name)}${c.n?` <span style="color:#a8abb2">${c.n}</span>`:''}</div>`;
    }).join('')}</div>
    <div class="fmform">
      <input id="mbBinName" placeholder="새 칸 이름" maxlength="40"
        onkeydown="if(event.key==='Enter')mbBinCreate();if(event.key==='Escape')closeFolderMenu()">
      <button onclick="mbBinCreate()">만들기</button>
    </div>

      onclick="mbMoveDaum(event)" title="다음메일 폴더 자체를 옮깁니다 — 다음메일에서도 바뀝니다">
      ⚠ 다음메일에서도 옮기기 ›</div>`;
  mbPlaceMenu(m, ev);
}
/* 옛 길 — 다음메일 폴더를 진짜로 옮긴다. 여기만 다음메일을 고친다. */
function mbMoveDaum(ev){
  if(ev) ev.stopPropagation();
  const picked = mbPicked(); if(!picked.length) return toast('고른 것이 없습니다');
  const dests = mbFolders().filter(f=>f.kind==='custom'||f.kind==='archive'||f.kind==='inbox');
  if(!dests.length) return toast('옮길 폴더가 없습니다 — 새로고침을 먼저 눌러 주세요', 8000);
  const m = $('folderMenu'); if(!m) return;
  const delim = mbDelim();
  m.innerHTML = `<div class="fmhead">${picked.length.toLocaleString()}통을 어디로 <span>다음메일에서도 옮겨집니다</span></div>
    <div class="fmlist">${dests.map(f=>{
      /* 층이 있으면 들여써서 어버이 밑에 있다는 것이 보이게 */
      const at = delim ? String(f.path||'').lastIndexOf(delim) : -1;
      const depth = (delim && at>0) ? String(f.path).split(delim).length-1 : 0;
      const leaf = at>0 ? String(f.path).slice(at+delim.length) : f.name;
      return `<div class="fmi" style="padding-left:${14+depth*13}px"
        onclick="closeFolderMenu();mbMovePicked('${f.slug}')">📁 ${esc(leaf)}</div>`;
    }).join('')}</div>`;
}
/* 창에서 고른 뒤 — 고른 목록은 그 사이 바뀌지 않는다(창을 여는 동안 목록을 안 건드린다) */
function mbMovePicked(toSlug){
  const f = mbFolderBy(toSlug); if(!f) return;
  const picked = mbPicked(); if(!picked.length) return toast('고른 것이 없습니다');
  mbMoveTo(picked, toSlug, f.name);
}
function mbMoveTo(picked, toSlug, toName){
  const byBox = {};
  picked.forEach(v=>{ (byBox[v._slug] = byBox[v._slug]||[]).push(String(v.u)); });
  const u = firebase.auth().currentUser;
  if(!u) return toast('로그인이 필요합니다');
  toast('옮기고 있습니다…', 3000);
  u.getIdToken().then(tok=>{
    const jobs = Object.keys(byBox).map(from=>fetch(MB_FN+'moveMailMessages', {
      method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+tok },
      body: JSON.stringify({ from:from, to:toSlug, uids:byBox[from] })
    }).then(r=>r.json().catch(()=>({}))));
    return Promise.all(jobs);
  }).then(res=>{
    const bad = res.find(j=>!j || !j.ok);
    if(bad) throw new Error((bad&&bad.error)||'옮기지 못했습니다');
    /* 화면에서 먼저 걷어낸다 — 다음 동기화가 서버 쪽 자리도 맞춰 준다 */
    picked.forEach(v=>{ if(_mbMsgs[v._slug]) delete _mbMsgs[v._slug][String(v.u)]; });
    pickClear('mbox'); state.mbOpen=null;
    renderPCSide(); renderMailPage();
    toast(`📁 ${picked.length}통을 「${toName}」(으)로 옮겼습니다`, 6000);
  }).catch(e=>toast('옮기지 못했습니다 — '+((e&&e.message)||e), 8000));
}

const COL_DEFAULT_W = {
  card: { name:'7%', company:'11%', title:'10%', mobile:'9%', companyTel:'9%', companyFax:'9%', email:'12%', companyAddr:'13%', date:'74px', manager:'128px' },
  biz:  { company:'19%', ceo:'9%', bizno:'12%', bizType:'12%', bizItem:'14%', address:'auto', date:'82px', manager:'128px' }
};
/* 열 너비 더블클릭 → 원래 크기로 복원 */
function resetColWidth(e, key){
  e.preventDefault(); e.stopPropagation();
  if(state.colW && state.colW[state.tab]) delete state.colW[state.tab][key];
  saveColPrefs();
  render();
  toast('열 너비를 원래대로 되돌렸습니다');
}
function startColResize(e, key){
  e.preventDefault(); e.stopPropagation();
  const col = document.querySelector(`#pcTable col[data-col="${key}"]`);
  if(!col) return;
  const startX = e.clientX;
  const startW = col.getBoundingClientRect().width;
  const onMove = ev => {
    const w = Math.max(50, startW + (ev.clientX - startX));
    col.style.width = w + 'px';
  };
  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.body.style.cursor = '';
    if(!state.colW) state.colW = {};
    if(!state.colW[state.tab]) state.colW[state.tab] = {};
    state.colW[state.tab][key] = col.style.width;
    saveColPrefs();
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  document.body.style.cursor = 'col-resize';
}

/* 열 표시/숨김 — 탭별 열 정의 */
const COL_DEFS = {
  card: [['name','이름'],['company','회사'],['title','직책·부서'],['mobile','핸드폰'],
         ['companyTel','회사전화'],['companyFax','회사팩스'],['email','이메일'],['companyAddr','회사주소'],['date','등록일']],
  /* 업태·종목은 계약서·업체관리에 그대로 옮겨 적는 칸이다 — 목록에서 바로 보여야
     사업자등록증을 하나씩 열어 보지 않는다 */
  biz:  [['company','상호'],['ceo','대표자'],['bizno','사업자번호'],['bizType','업태'],['bizItem','종목'],
         ['address','소재지'],['date','등록일']]
};
function colHidden(key){ return !!(state.hiddenCols[state.tab]||{})[key]; }

/* 열 순서: 저장된 순서(colOrder) 우선, 없으면 COL_DEFS 기본 순서. 새 열은 뒤에 붙임 */
function orderedColKeys(){
  const base = (COL_DEFS[state.tab]||[]).map(c=>c[0]);
  const saved = state.colOrder && state.colOrder[state.tab];
  if(!saved || !saved.length) return base;
  const out = saved.filter(k=>base.includes(k));
  base.forEach(k=>{ if(!out.includes(k)) out.push(k); });
  return out;
}
/* 열 머리글 드래그로 좌우 순서 변경 (마우스, PC) */
let _dragCol = null;
function onColDragStart(e, key){ _dragCol=key; e.dataTransfer.effectAllowed='move';
  try{ e.dataTransfer.setData('text/plain', key); }catch(_){}
  const th=e.currentTarget; if(th) th.classList.add('col-dragging'); }
function onColDragOver(e, key){ e.preventDefault(); e.dataTransfer.dropEffect='move';
  const th=e.currentTarget; if(th && _dragCol && key!==_dragCol) th.classList.add('col-dragover'); }
function onColDragLeave(e){ const th=e.currentTarget; if(th) th.classList.remove('col-dragover'); }
function onColDragEnd(e){ const th=e.currentTarget; if(th) th.classList.remove('col-dragging');
  document.querySelectorAll('#pcTable th.col-dragover').forEach(t=>t.classList.remove('col-dragover')); }
function onColDrop(e, key){ e.preventDefault();
  document.querySelectorAll('#pcTable th.col-dragover').forEach(t=>t.classList.remove('col-dragover'));
  const from=_dragCol; _dragCol=null;
  if(!from || from===key) return;
  let order = orderedColKeys().filter(k=>k!==from);
  const ti = order.indexOf(key); if(ti<0) return;
  order.splice(ti, 0, from);
  if(!state.colOrder) state.colOrder={};
  state.colOrder[state.tab] = order;
  saveColPrefs();
  renderPCTable();
  toast('열 순서를 바꿨습니다');
}
function toggleColMenu(ev){
  ev.stopPropagation();
  const m=$('colMenu');
  if (m.style.display==='block'){ m.style.display='none'; return; }
  const defs=COL_DEFS[state.tab]||[];
  m.innerHTML = `<div style="font-size:11.5px;color:#8b98b3;padding:2px 6px 8px;font-weight:700">보일 열 선택</div>`
    + defs.map(([k,label])=>`<label style="display:flex;align-items:center;gap:8px;font-size:13.5px;padding:7px 6px;cursor:pointer;color:#1e2a47">
        <input type="checkbox" ${colHidden(k)?'':'checked'} onchange="setColVisible('${k}',this.checked)" style="width:15px;height:15px"> ${label}</label>`).join('');
  m.style.display='block';
  setTimeout(()=>document.addEventListener('click', closeColMenu, {once:true}), 0);
}
function closeColMenu(){ const m=$('colMenu'); if(m) m.style.display='none'; }
function setColVisible(key, visible){
  if(!state.hiddenCols[state.tab]) state.hiddenCols[state.tab]={};
  if(visible) delete state.hiddenCols[state.tab][key];
  else state.hiddenCols[state.tab][key]=true;
  saveColPrefs();
  renderPCTable();
}
/* 열 설정(숨김·너비) localStorage 저장/복원 */
function saveColPrefs(){
  try{ localStorage.setItem('pucards_colPrefs', JSON.stringify({hiddenCols:state.hiddenCols, colW:state.colW, colOrder:state.colOrder})); }catch(e){}
}
function loadColPrefs(){
  try{
    const p=JSON.parse(localStorage.getItem('pucards_colPrefs')||'{}');
    if(p.hiddenCols) state.hiddenCols=p.hiddenCols;
    if(p.colW) state.colW=p.colW;
    if(p.colOrder) state.colOrder=p.colOrder;
  }catch(e){}
}
function toggleCollapse(id){ state.collapsed[id]=!state.collapsed[id]; render(); }
function toggleAllFolders(){
  const groups=Object.values(state.groups).filter(g=>(g.kind||'card')===state.tab && canSeeGroup(g));
  const anyOpen = groups.some(g=>groups.some(c=>(c.parent||'')===g.id) && !state.collapsed[g.id]);
  groups.forEach(g=>{ state.collapsed[g.id]=anyOpen; });
  render();
}

/* 새 폴더 만들기 — 메일함식 팝업 (부모 지정 가능) */
function openFolderDialog(parent){
  $('folderDlg').innerHTML = `
    <div class="mhead"><b>${parent?'하위 폴더 만들기':'새 폴더 만들기'}</b>
      <button class="iconbtn" onclick="folderDlgBg.classList.remove('open')">✕</button></div>
    <div class="field"><input id="newFolderName" placeholder="폴더 이름 (예: 1.자문사답변)"
       onkeydown="if(event.key==='Enter')confirmNewFolder('${parent}')"></div>
    <div class="mfoot">
      <button class="btn primary" onclick="confirmNewFolder('${parent}')">만들기</button>
      <button class="btn ghost" onclick="folderDlgBg.classList.remove('open')">취소</button></div>`;
  $('folderDlgBg').classList.add('open');
  setTimeout(()=>{ const i=$('newFolderName'); if(i) i.focus(); }, 50);
}
function confirmNewFolder(parent){
  const name=$('newFolderName').value.trim(); if(!name) return toast('폴더 이름을 입력하세요');
  Store.putGroup({id:uid(), name, parent:parent||'', kind:state.tab, order:Date.now()});
  if(parent) state.collapsed[parent]=false;
  $('folderDlgBg').classList.remove('open');
  toast('폴더를 만들었습니다');
}

/* 폴더 ⋮ 메뉴 — 비우기 없이 노무법인용으로: 하위폴더 추가 / 이름변경 / 삭제 */
function openFolderMenu(ev, id){
  const m=$('folderMenu');
  /* 개인 창고 폴더 — 여기서 할 수 있는 것은 잠금 해제뿐이다.
     이름변경·삭제·순서이동은 모두 공용 자리(state.groups)를 만지므로 개인 창고에는 못 쓴다. */
  if((state.priv.groups||{})[id]){
    m.innerHTML = `<div class="fmi" onclick="closeFolderMenu();unsetFolderLock('${id}')">🔓 잠금 해제 (공용으로 되돌리기)</div>`;
    m.style.display='block';
    m.style.left=Math.min(ev.clientX, window.innerWidth-230)+'px';
    m.style.top=Math.min(ev.clientY, window.innerHeight-80)+'px';
    setTimeout(()=>document.addEventListener('click', closeFolderMenu, {once:true}), 0);
    return;
  }
  const g=state.groups[id]; if(!g) return;
  /* 같은 부모 형제 중 위/아래 이동 가능 여부 */
  const sibs=Object.values(state.groups).filter(x=>(x.kind||'card')===(g.kind||'card') && (x.parent||'')===(g.parent||'')).sort((a,b)=>(a.order||0)-(b.order||0));
  const idx=sibs.findIndex(x=>x.id===id);
  const canUp=idx>0, canDown=idx<sibs.length-1;
  const lockItem = g.locked
    ? `<div class="fmi" onclick="closeFolderMenu();unsetFolderLock('${id}')">🔓 잠금 해제</div>`
    : `<div class="fmi" onclick="closeFolderMenu();setFolderLock('${id}')">🔒 비밀번호 잠금</div>`;
  m.innerHTML = `
    <div class="fmi" onclick="closeFolderMenu();renameFolder('${id}')">✏️ 이름 변경</div>
    <div class="fmi" onclick="closeFolderMenu();moveCardsHere('${id}')">📥 선택 명함 이 폴더로</div>
    ${canUp?`<div class="fmi" onclick="closeFolderMenu();moveFolderOrder('${id}',-1)">⬆ 위로</div>`:''}
    ${canDown?`<div class="fmi" onclick="closeFolderMenu();moveFolderOrder('${id}',1)">⬇ 아래로</div>`:''}
    ${lockItem}
    <div class="fmi danger" onclick="closeFolderMenu();deleteFolder('${id}')">🗑 폴더 삭제</div>`;
  m.style.display='block';
  const x=Math.min(ev.clientX, window.innerWidth-170), y=Math.min(ev.clientY, window.innerHeight-260);
  m.style.left=x+'px'; m.style.top=y+'px';
  setTimeout(()=>document.addEventListener('click', closeFolderMenu, {once:true}), 0);
}
/* 폴더 잠그기 — 명함·사진·폴더기록을 대표 전용 창고로 실제로 옮긴다.
   예전에는 화면에서 가리기만 했다(자료는 직원 누구나 읽을 수 있었다).
   이제는 서버 규칙이 막는 자리로 옮기므로, 코드를 고쳐도 남은 못 본다. */
async function setFolderLock(id){
  const g=state.groups[id]; if(!g) return;
  if(!state.isAdmin) return toast('대표만 폴더를 잠글 수 있습니다');
  if(Store.mode!=='firebase') return toast('클라우드에 연결된 상태에서만 됩니다');
  if(!privRoot()) return toast('로그인 정보를 읽지 못했습니다');

  const ids = Object.values(state.items).filter(it=>it && (it.group||'')===id).map(it=>it.id);
  if(!confirm(`'${g.name}' 폴더를 대표님만 보는 개인 폴더로 잠급니다.\n\n`
    + `· 명함 ${ids.length.toLocaleString()}장과 사진이 대표님 전용 창고로 옮겨집니다\n`
    + `· 다른 직원에게는 폴더도 명함도 보이지 않습니다 (서버가 막습니다)\n`
    + `· 푸른이알피 등 다른 프로그램에서도 당겨올 수 없습니다\n`
    + `· 잠근 뒤에는 [🔒 개인 폴더 열기]로 비밀번호를 넣어야 보입니다\n\n진행할까요?`)) return;

  let rec = null;
  try{ rec = await privLockRec(); }
  catch(e){
    if(isDenied(e)) return tellVaultRuleMissing();
    return toast('개인 창고를 읽지 못했습니다 — ' + ((e&&e.message)||''));
  }
  if(!rec){ const ok = await setPrivatePassword(); if(!ok) return; }

  toast(`옮기는 중… ${ids.length.toLocaleString()}장`, 30000);
  try{
    const upd = movePaths(ids, id, 'lock');
    const P = privRoot();
    for(const cid of ids){
      const it = state.items[cid]; if(!it){ delete upd[`${P}/items/${cid}`]; delete upd[`${P}/photos/${cid}`]; continue; }
      const body = {...it}; delete body.thumb; delete body.thumb2;
      upd[`${P}/items/${cid}`] = body;
      const ph = await Store.getPhoto(cid).catch(()=>'');
      if(ph) upd[`${P}/photos/${cid}`] = ph; else delete upd[`${P}/photos/${cid}`];
      /* 썸네일도 함께 옮긴다 — 두고 가면 목록 그림으로 누구인지 보인다 */
      const th = it.thumb || await Store.getThumb(cid).catch(()=>'');
      if(th){ upd[`${P}/thumbs/${cid}`] = th; upd[`${DB_ROOT}/thumbs/${cid}`] = null; }
    }
    const pg = { ...g, locked:true, lockedAt:Date.now() };
    delete pg.pw;                       /* 옛 평문 비밀번호는 옮기지 않고 버린다 */
    upd[`${P}/groups/${id}`] = pg;
    /* 지문 남기기 — 사진첩이 이 사람을 다시 공용에 만들지 않게 */
    const moving = ids.map(cid=>state.items[cid]).filter(Boolean);
    Object.assign(upd, await lockKeyUpdates(moving, true));
    /* 번호 열쇠도 거둔다 — 검색목록에서 빼 놓고 이 자리를 두면 그리로 되짚어 간다 */
    moving.forEach(it=>{ const k=byKeyOf(it); if(k) upd[`${DB_ROOT}/${BYKEY}/${k}`] = null; });
    await Store.db.ref().update(upd);
    toast(`🔒 '${g.name}'을(를) 개인 폴더로 옮겼습니다 — [🔒 개인 폴더 열기]로 보실 수 있습니다`,9000);
    if(state.group===id) state.group='all';
    render();
  }catch(e){
    toast('❌ 옮기지 못했습니다: ' + ((e&&e.message)||'알 수 없음'), 8000);
  }
}
/* ══════ 개인 폴더 「지문」 (pucards/lockkeys) ══════
   개인 폴더로 옮긴 명함은 공유 검색목록에서 빠지므로, 사진첩이 다시 찍었을 때
   "이미 있다"를 알 길이 없어 공용 목록에 새로 만들어 버린다 —
   감춘 사람이 도로 드러난다. 그래서 되돌릴 수 없게 뭉갠 번호 지문만 남긴다.
   담기는 것은 지문뿐이다(이름·회사·폴더 이름 없음). 자세한 것은 js/pu-lockkey.js.

   ⚠ 이 목록이 없어도 명함은 멀쩡하다. 그래서 지문 만들기가 실패해도
     옮기는 일 자체는 막지 않는다(사진첩 알림만 못 하게 될 뿐이다). */
async function lockKeyUpdates(items, on){
  const out = {}; const LK = window.PuLockKey;
  if(!LK) return out;
  for(const it of items){
    try{
      const fp = await LK.fingerprint(LK.keyOfItem(it));
      if(fp) out[LK.pathOf(fp)] = on ? 1 : null;
    }catch(_){ /* 한 장 실패가 전체를 멈추게 하지 않는다 */ }
  }
  return out;
}

/* 잠금 풀기 — 개인 창고에서 공용 자리로 되돌린다. 검색목록에도 다시 넣는다. */
async function unsetFolderLock(id){
  const g = (state.priv.groups||{})[id] || state.groups[id]; if(!g) return;
  if(!state.privOpen) return toast('먼저 [🔒 개인 폴더 열기]로 여세요');
  if(Store.mode!=='firebase') return toast('클라우드에 연결된 상태에서만 됩니다');

  const ids = Object.values(state.priv.items).filter(it=>it && (it.group||'')===id).map(it=>it.id);
  if(!confirm(`'${g.name}' 폴더의 잠금을 풉니다.\n\n`
    + `· 명함 ${ids.length.toLocaleString()}장이 공용 자리로 되돌아갑니다\n`
    + `· 다른 직원과 푸른이알피에서도 다시 보입니다\n\n진행할까요?`)) return;

  toast(`되돌리는 중… ${ids.length.toLocaleString()}장`, 30000);
  try{
    const upd = movePaths(ids, id, 'unlock');
    const P = privRoot();
    for(const cid of ids){
      const it = state.priv.items[cid];
      if(!it){ delete upd[`${DB_ROOT}/items/${cid}`]; delete upd[`${DB_ROOT}/photos/${cid}`]; continue; }
      const body = {...it}; delete body.thumb; delete body.thumb2;
      upd[`${DB_ROOT}/items/${cid}`] = body;
      const ph = await Store.getPhoto(cid).catch(()=>'');
      if(ph) upd[`${DB_ROOT}/photos/${cid}`] = ph; else delete upd[`${DB_ROOT}/photos/${cid}`];
      const th = it.thumb || await Store.getThumb(cid).catch(()=>'');
      if(th){ upd[`${DB_ROOT}/thumbs/${cid}`] = th; upd[`${P}/thumbs/${cid}`] = null; }
      upd[`${DB_ROOT}/idx/${cid}`] = idxRecord(it);   /* 값이 없으면 null 이 들어가 지워진다 */
    }
    const pub = { ...g };
    delete pub.locked; delete pub.lockedAt; delete pub.pw; delete pub.lockOwner;
    upd[`${DB_ROOT}/groups/${id}`] = pub;
    /* 지문 지우기 — 단, **개인 창고에 남는 다른 명함이 같은 번호를 쓰고 있으면 남긴다.**
       한 사람의 명함이 개인 폴더 두 곳에 있을 수 있다. 그냥 지우면 아직 감춰 둔
       쪽까지 사진첩이 다시 만들어 버린다. */
    const leaving = ids.map(cid=>state.priv.items[cid]).filter(Boolean);
    /* 번호 열쇠를 되돌린다 — 공용으로 나왔으니 사진첩이 다시 찾아갈 수 있어야 한다 */
    leaving.forEach(it=>{ const k=byKeyOf(it); if(k) upd[`${DB_ROOT}/${BYKEY}/${k}`] = it.id; });
    const staying = Object.values(state.priv.items)
                      .filter(it=>it && (it.group||'')!==id);
    const dropAll  = await lockKeyUpdates(leaving, false);
    const keepBack = await lockKeyUpdates(staying, true);
    Object.keys(dropAll).forEach(p=>{ if(!(p in keepBack)) upd[p] = null; });
    await Store.db.ref().update(upd);
    toast(`🔓 '${g.name}' 잠금을 풀었습니다 — 다시 모두에게 보입니다`,7000);
    render();
  }catch(e){
    toast('❌ 되돌리지 못했습니다: ' + ((e&&e.message)||'알 수 없음'), 8000);
  }
}
/* 폴더를 열 수 있나.
   새 방식(개인 창고)은 이미 비밀번호를 지나 열려 있으므로 그냥 통과시킨다.
   옛 방식으로 잠긴 폴더는 아직 안 옮긴 것이라 예전대로 비밀번호를 묻는다. */
function tryUnlockFolder(id){
  if((state.priv.groups||{})[id]) return true;
  const g=state.groups[id]; if(!g) return false;
  if(!g.locked) return true;
  if(state.unlocked && state.unlocked[id]) return true;
  const pw=prompt(`'${g.name}'은(는) 잠긴 폴더입니다. 비밀번호를 입력하세요.`);
  if(pw===null) return false;
  if(pw!==g.pw){ toast('비밀번호가 틀렸습니다'); return false; }
  if(!state.unlocked) state.unlocked={};
  state.unlocked[id]=true;
  toast('잠금을 풀었습니다 (이 세션 동안 표시)');
  return true;
}
/* 옛 방식으로 잠긴 폴더를 개인 창고로 옮긴다. 저절로 돌지 않는다 — 대표가 누를 때만. */
async function migrateLockedFolders(){
  if(!state.isAdmin) return toast('대표만 할 수 있습니다');
  const olds = Object.values(state.groups).filter(g=>g && g.locked);
  if(!olds.length) return toast('옮길 옛 잠금 폴더가 없습니다 👍');
  const n = olds.reduce((s,g)=> s + Object.values(state.items).filter(it=>it&&(it.group||'')===g.id).length, 0);
  if(!confirm(`옛 방식으로 잠긴 폴더 ${olds.length}개(명함 ${n.toLocaleString()}장)를\n`
    + `대표님 전용 창고로 옮깁니다.\n\n`
    + `옮긴 뒤에는 [🔒 개인 폴더 열기]로 비밀번호를 넣어야 보입니다.\n\n진행할까요?`)) return;
  for(const g of olds){ await setFolderLock(g.id); }
  toast('옮기기를 마쳤습니다 — [🔒 개인 폴더 열기]로 확인하세요',9000);
}
/* 폴더 순서 한 칸 이동 (같은 부모 형제끼리 order 교환) */
function moveFolderOrder(id, dir){
  const g=state.groups[id]; if(!g) return;
  const sibs=Object.values(state.groups)
    .filter(x=>(x.kind||'card')===(g.kind||'card') && (x.parent||'')===(g.parent||''))
    .sort((a,b)=>(a.order||0)-(b.order||0));
  const idx=sibs.findIndex(x=>x.id===id);
  const swapIdx=idx+dir;
  if(swapIdx<0||swapIdx>=sibs.length) return;
  /* 형제 전체에 일련번호 order 부여 후, 두 항목 위치 교환 */
  sibs.forEach((s,i)=>{ s.order=i+1; });
  const a=sibs[idx], b=sibs[swapIdx];
  const t=a.order; a.order=b.order; b.order=t;
  Store.putGroup(a); Store.putGroup(b);
  toast('폴더 순서를 변경했습니다');
}
/* 표에서 바로 수정 (셀 더블클릭 → 인라인 입력) */
function startCellEdit(ev, id, field){
  ev.stopPropagation();
  const td=ev.currentTarget;
  if(td.querySelector('input')) return;          /* 이미 편집 중 */
  const it=state.items[id]; if(!it) return;
  const old=it[field]||'';
  td.dataset.editing='1';
  td.innerHTML=`<input class="cellEdit" value="${esc(old)}" style="width:100%;border:1.5px solid #3a4a73;border-radius:5px;padding:4px 6px;font-size:13px;font-family:inherit;box-sizing:border-box">`;
  const inp=td.querySelector('input');
  inp.focus(); inp.select();
  const commit=(save)=>{
    if(td._done) return; td._done=true;
    if(save){
      const v=inp.value.trim();
      if(v!==old){ it[field]=v; Store.put(it); toast('수정했습니다'); }
    }
    render();
  };
  inp.addEventListener('keydown', e=>{
    e.stopPropagation();
    if(e.key==='Enter'){ e.preventDefault(); commit(true); }
    else if(e.key==='Escape'){ e.preventDefault(); commit(false); }
  });
  inp.addEventListener('blur', ()=>commit(true));
}

function deleteFolder(id){

  const kids=Object.values(state.groups).filter(x=>(x.parent||'')===id);
  const msg = kids.length
    ? `'${g.name}' 폴더와 하위 폴더 ${kids.length}개를 삭제할까요? (명함은 미분류로 이동)`
    : `'${g.name}' 폴더를 삭제할까요? (명함은 미분류로 이동)`;

  delRec(id);

    const erpBadge = (function(){

      /* ── 한 줄로 줄인다 (대표 지시 2026-08-11: "간단하게 보일 수 있도록, 컴팩트하게") ──

         158px 칸에서 두세 줄로 접히고 줄 높이가 늘어났다.

      const _all = ErpMatch.mgrs(it);

      const _more = _all.length > 1 ? _all.length - 1 : 0;
      /* 눌러서 그 담당 노무사 것만 걸러 본다(2026-08-11).

      const _click = _one

        ? ` onclick="event.stopPropagation();filterErpMgr('${esc(_one.replace(/'/g,"\\'"))}')"`

      let h = t

      if (_more) h += `<span class="mgx" title="부담당 ${esc(_all.slice(1).join(', '))}">+${_more}</span>`;
      /* 이 사람이 그 회사의 ERP 대표자/담당자인지 — 한 글자로 */
      const _role = ErpMatch.role(it);
      if (_role==='ceo') h += `<span class="mgr r-ceo" title="이 명함 주인이 푸른이알피 업체관리에 이 회사 대표자로 등록됨">대</span>`;
      else if (_role==='contact') h += `<span class="mgr r-con" title="이 명함 주인이 푸른이알피 업체관리에 이 회사 담당자로 등록됨">담</span>`;
      else if (ErpMatch.isContact(it)) h += `<span class="mgr r-work" title="업체관리에 이 명함 주인이 실무 담당자로 등록됨">실</span>`;
      const _m = ErpMatch.match(it);
      /* ⚠ 「퇴사」가 아니라 「계약해지」다(2026-08-11) — 이 배지는 **업체**의 상태다.
         명함 줄에 「퇴사」라고 적으면 그 사람이 회사를 나간 것으로 읽힌다. */
      if (_m && _m.left) h += `<span class="mgq" title="업체관리에서 종료·해지·폐업으로 표시된 거래처 (계약해지)">🚪</span>`;
      return h;
    })();
    const actCell = `<td onclick="event.stopPropagation()" style="text-align:center;white-space:nowrap">
        <button onclick="openEditor(state.items['${it.id}'])" title="수정" style="border:none;background:none;cursor:pointer;font-size:14px;padding:3px 5px">✏️</button>
        <button onclick="delItem('${it.id}')" title="삭제" style="border:none;background:none;cursor:pointer;font-size:14px;padding:3px 5px">🗑</button></td>`;
    rows += `<tr data-selid="${it.id}" class="${state.sel[it.id]?'pkon':''}" draggable="true" ondragstart="onRowDrag(event,'${it.id}')" onclick="openDetail('${it.id}')" oncontextmenu="openRowMenu(event,'${it.id}')">${chk}<td class="num">${i+1}</td>${order.map(k=>TD[k](it)).join('')}<td class="dt mgcell">${erpBadge}${dup}</td>${actCell}</tr>`;
  });
  if (!rows) rows = `<tr><td class="pcempty" colspan="${order.length+4}">등록된 항목이 없습니다 — 우측 상단 [＋ 명함 등록] 또는 이미지·PDF를 화면에 끌어다 놓으세요. (Ctrl+V 붙여넣기 가능)</td></tr>`;
  $('pcTable').innerHTML = `${colg}<thead>${thead}</thead><tbody>${rows}</tbody>`;
  /* 숨긴 열 적용: 해당 클래스 셀을 display:none */
  const hidden = state.hiddenCols[state.tab] || {};
  const hideCss = Object.keys(hidden).filter(k=>hidden[k])
    .map(k=>`#pcTable .col-${k}{display:none}`).join('');
  let st=$('colHideStyle'); if(!st){ st=document.createElement('style'); st.id='colHideStyle'; document.head.appendChild(st); }
  st.textContent = hideCss;
  /* 페이지 이동 바 */
  const pager=$('pcPager');
  if (totalPages>1){
    const btn=(label,pg,dis)=>`<button onclick="state.page=${pg};render()" ${dis?'disabled':''}
      style="border:1px solid #dde3ee;background:${dis?'#f1f4fa':'#fff'};border-radius:8px;padding:7px 13px;font-weight:700;color:#33415e;cursor:${dis?'default':'pointer'}">${label}</button>`;
    pager.innerHTML = btn('◀ 이전', state.page-1, state.page===0)
      + `<span>${(start+1).toLocaleString()}–${Math.min(start+size,items.length).toLocaleString()} / ${items.length.toLocaleString()}개 &nbsp;(${state.page+1}/${totalPages}쪽)</span>`
      + btn('다음 ▶', state.page+1, state.page>=totalPages-1);
  } else pager.innerHTML='';
}
/* ══════ 🔖 내 탭 (저장된 검색·필터 조건) ══════
   폴더는 '명함을 옮기는 서류함', 내 탭은 '조건으로 걸러 보는 즐겨찾기'.
   명함 데이터를 건드리지 않으므로 5천 장에도 즉시 적용된다. 전 직원 공유(pucards/views). */
function viewSnapshot(){
  const s=$('search');
  return {
    q: s ? s.value.trim() : '',
    group: state.group||'all', owner: state.owner||'all', region: state.region||'',
    erpFilter: state.erpFilter||'', erpMgr: state.erpMgr||'', colFilter: Object.assign({}, state.colFilter||{}),
    onlyPhone: !!state.onlyPhone, onlyEmail: !!state.onlyEmail,
    onlyIncomplete: !!state.onlyIncomplete, onlyPrivate: !!state.onlyPrivate, onlyDup: !!state.onlyDup,
    vtab: state.vtab||'',
    sort: state.sort||'date', sortKey: state.sortKey||null, sortDir: state.sortDir||'desc'
  };
}
/* 그 탭 조건에 해당하는 인원수 — 목록과 똑같은 기준으로 세기 위해 잠시 조건을 바꿔 계산 후 되돌린다 */
function countMatching(f){
  f=f||{};
  const s=$('search');
  const sv={ group:state.group, owner:state.owner, region:state.region, erpFilter:state.erpFilter, erpMgr:state.erpMgr,
    colFilter:state.colFilter, onlyPhone:state.onlyPhone, onlyEmail:state.onlyEmail,
    onlyIncomplete:state.onlyIncomplete, onlyPrivate:state.onlyPrivate, onlyDup:state.onlyDup,
    vtab:state.vtab, sort:state.sort, sortKey:state.sortKey, q:(s?s.value:'') };
  try{
    state.group=f.group||'all'; state.owner=f.owner||'all'; state.region=f.region||'';
    state.erpFilter=f.erpFilter||''; state.erpMgr=f.erpMgr||''; state.colFilter=f.colFilter||{};
    state.onlyPhone=!!f.onlyPhone; state.onlyEmail=!!f.onlyEmail;
    state.onlyIncomplete=!!f.onlyIncomplete; state.onlyPrivate=!!f.onlyPrivate; state.onlyDup=!!f.onlyDup;
    state.vtab=f.vtab||'';
    state.sort='date'; state.sortKey=null;          /* 세기만 하므로 가벼운 정렬로 */
    if(s) s.value=f.q||'';
    return listItems().length;
  }catch(e){ return 0; }
  finally{
    state.group=sv.group; state.owner=sv.owner; state.region=sv.region; state.erpFilter=sv.erpFilter; state.erpMgr=sv.erpMgr||'';
    state.colFilter=sv.colFilter; state.onlyPhone=sv.onlyPhone; state.onlyEmail=sv.onlyEmail;
    state.onlyIncomplete=sv.onlyIncomplete; state.onlyPrivate=sv.onlyPrivate; state.onlyDup=sv.onlyDup;
    state.vtab=sv.vtab; state.sort=sv.sort; state.sortKey=sv.sortKey; if(s) s.value=sv.q;
  }
}
/* 지금 화면이 그 탭과 같은 조건인지 비교용 서명 (정렬은 제외 — 정렬 바꿔도 탭 선택 유지) */
function viewSig(f){
  f=f||{}; const c=f.colFilter||{};
  return JSON.stringify([f.q||'', f.group||'all', f.owner||'all', f.region||'', f.erpFilter||'', f.erpMgr||'',
    c.name||'', c.company||'', c.phone||'', c.email||'',
    !!f.onlyPhone, !!f.onlyEmail, !!f.onlyIncomplete, !!f.onlyPrivate, !!f.onlyDup, f.vtab||'']);
}
function applyView(id){
  const v=(state.views||{})[id]; if(!v) return;
  const f=v.f||{};
  if((v.kind||'card')!==state.tab){ state.tab=v.kind||'card'; }
  state.group=f.group||'all'; state.owner=f.owner||'all'; state.region=f.region||'';
  state.erpFilter=f.erpFilter||''; state.erpMgr=f.erpMgr||''; state.colFilter=Object.assign({}, f.colFilter||{});
  state.onlyPhone=!!f.onlyPhone; state.onlyEmail=!!f.onlyEmail;
  state.onlyIncomplete=!!f.onlyIncomplete; state.onlyPrivate=!!f.onlyPrivate; state.onlyDup=!!f.onlyDup;
  state.vtab=f.vtab||'';
  state.sort=f.sort||'date'; state.sortKey=f.sortKey||null; state.sortDir=f.sortDir||'desc';
  state.page=0; state.sel={}; state.view='list';
  /* 폰 찾기 칸의 값은 state.q 에도 적는다 — 화면을 옮길 때 syncMobileSearchFor() 가
     이 값을 칸에 되돌려 놓는다. 여기서 빠뜨리면 탭을 한 번 눌렀을 때 탭 조건의
     검색어만 조용히 사라진다(최종 전체 리뷰 I4 의 뒷정리). */
  state.q = f.q||'';
  const s=$('search'); if(s) s.value=f.q||'';
  const ps=$('pcSearch'); if(ps) ps.value=f.q||'';
  try{ _syncSearchX(); }catch(_){}      /* 탭으로 검색어가 들어와도 ✕ 가 따라 나와야 한다 */
  render();
}
function saveCurrentAsView(){
  const f=viewSnapshot();
  /* 폴더는 탭의 '소속'이라 조건으로 치지 않는다 — 폴더 안에서 조건 없이 만들면 '담는 탭' */
  const hasCond = f.q||f.region||f.erpFilter||f.erpMgr||(f.owner&&f.owner!=='all')
    ||f.onlyPhone||f.onlyEmail||f.onlyIncomplete||f.onlyPrivate||f.onlyDup
    ||Object.keys(f.colFilter||{}).some(k=>f.colFilter[k]);
  /* 조건이 없으면 '담는 탭' — 명함을 직접 골라 담는 칸으로 만든다 */
  if(!hasCond){
    if(!confirm(`📁 ${curScopeName()} 안에 '담는 탭'을 만듭니다.\n\n· 명함을 골라서 직접 담는 칸이에요 (폴더 안의 작은 칸)\n· 만든 뒤: 명함 선택 → [🏷 탭에 담기]\n\n계속할까요?`)) return;
    const name0=(prompt(`담는 탭 이름을 입력하세요\n(예: 푸른노무법인, 대전충청노무사)`,'')||'').trim();
    if(!name0) return;
    const id=uid();
    const mf={ q:'', group:(state.group||'all'), owner:'all', region:'', erpFilter:'', erpMgr:'', colFilter:{},
      onlyPhone:false, onlyEmail:false, onlyIncomplete:false, onlyPrivate:false, onlyDup:false,
      vtab:id, sort:'date', sortKey:null, sortDir:'desc' };
    Store.putView({ id, name:name0, kind:state.tab, scope:(state.group||'all'), manual:true, order:Date.now(), f:mf });
    toast(`🏷 '${name0}' 담는 탭을 만들었습니다 — 명함을 선택해 [🏷 탭에 담기]로 넣으세요`,6000);
    return;
  }
  const dflt = f.q || f.region || f.erpFilter || (f.colFilter&&(f.colFilter.company||f.colFilter.name)) || '';
  /* 어디에 · 무슨 조건으로 만들어지는지 이름 묻기 전에 알려준다 */
  const cond=[]; const c=f.colFilter||{};
  if(f.q) cond.push(`검색 "${f.q}"`);
  if(f.region) cond.push('지역 '+f.region);
  if(f.erpFilter) cond.push('ERP '+f.erpFilter);
  if(f.erpMgr) cond.push('담당 '+f.erpMgr);
  if(c.company) cond.push(`회사에 "${c.company}"`);
  if(c.name) cond.push(`이름에 "${c.name}"`);
  if(c.phone) cond.push(`전화에 "${c.phone}"`);
  if(c.email) cond.push(`이메일에 "${c.email}"`);
  if(f.owner&&f.owner!=='all') cond.push('담당 '+f.owner);
  if(f.onlyPhone) cond.push('전화있음');
  if(f.onlyEmail) cond.push('이메일있음');
  if(f.onlyIncomplete) cond.push('정보부족만');
  if(f.onlyPrivate) cond.push('개인만');
  if(f.onlyDup) cond.push('중복만');
  let n=0; try{ n=countMatching(f); }catch(_){}
  const head = `📁 ${curScopeName()} 에만 보이는 탭을 만듭니다.\n`
             + `조건: ${cond.length?cond.join(' · '):'없음 (전체)'}\n`
             + `해당 인원: ${n.toLocaleString()}명\n\n탭 이름을 입력하세요`;
  const name=(prompt(head, dflt)||'').trim();
  if(!name) return;
  const v={ id:uid(), name, kind:state.tab, scope:(state.group||'all'), order:Date.now(), f };
  Store.putView(v);
  toast(`🔖 '${name}' 탭을 ${curScopeName()}에 만들었습니다`,4000);
}

  const id=uid();
  const mf={ q:'', group:(state.group||'all'), owner:'all', region:'', erpFilter:'', erpMgr:'', colFilter:{},
    onlyPhone:false, onlyEmail:false, onlyIncomplete:false, onlyPrivate:false, onlyDup:false,
    vtab:id, sort:'date', sortKey:null, sortDir:'desc' };
  const v={ id, name, kind:state.tab, scope:(state.group||'all'), manual:true, order:Date.now(), f:mf };
  state.views[id]=v;      /* 공유 저장 반영 전에도 바로 담을 수 있게 */
  Store.putView(v);
  doAddToTab(id);
}
function doAddToTab(vid){
  const v=(state.views||{})[vid]; if(!v) return;
  const gid=(v.f&&v.f.group)||'all';
  const ids=Object.keys(state.sel); let n=0, moved=0;
  ids.forEach(sid=>{
    const it=state.items[sid]; if(!it) return;
    const arr=(it.vtabs||[]).slice();
    if(arr.indexOf(vid)<0) arr.push(vid);
    it.vtabs=arr;
    /* 탭이 특정 폴더 소속이면 그 폴더로 함께 옮긴다 (폴더 밖 명함이 탭에서 안 보이는 것 방지) */
    if(gid!=='all' && (it.group||'')!==gid){ it.group=gid; moved++; }
    Store.put(it); n++;
  });
  state.sel={}; render();
  toast(`🏷 ${n}개를 '${v.name}' 탭에 담았습니다`+(moved?` (${moved}개는 ${(state.groups[gid]||{}).name||'폴더'}로 함께 이동)`:''),5000);
}
function selRemoveFromTab(){
  if(!state.vtab) return;
  const v=(state.views||{})[state.vtab]; if(!v) return;
  const ids=Object.keys(state.sel);
  if(!ids.length) return toast('명함을 먼저 선택하세요');
  if(!confirm(`선택한 ${ids.length}개를 '${v.name}' 탭에서 뺄까요?\n\n· 탭에서만 빠지고 명함은 그대로 남습니다.`)) return;
  let n=0;
  ids.forEach(sid=>{ const it=state.items[sid]; if(!it) return;
    const arr=(it.vtabs||[]).filter(x=>x!==state.vtab);
    it.vtabs=arr; Store.put(it); n++; });
  state.sel={}; render();
  toast(`${n}개를 '${v.name}' 탭에서 뺐습니다`);
}
/* 지금 보고 있는 곳(대시보드) 이름 — 탭은 이 안에서만 보인다 */
function curScopeName(){
  const g=state.group;
  if(!g||g==='all') return state.tab==='biz' ? '전체 사업자등록증' : '전체 명함';
  if(g==='') return '미분류';
  return (state.groups[g]||{}).name || '이 폴더';
}
/* 칩의 ⋮ → 버튼 메뉴 (보기·이름변경·조건갱신·삭제) */
function viewMenu(id){
  const v=(state.views||{})[id]; if(!v) return;
  $('menuM').innerHTML=`
    <div class="mhead"><b>🔖 ${esc(v.name)}</b><button class="iconbtn" onclick="menuBg.classList.remove('open')">✕</button></div>
    <button class="sheetbtn" onclick="menuBg.classList.remove('open');applyView('${id}')">👁 이 조건으로 보기</button>
    <button class="sheetbtn" onclick="menuBg.classList.remove('open');renameView('${id}')">✏️ 이름 변경</button>
    <button class="sheetbtn" onclick="menuBg.classList.remove('open');updateView('${id}')">🔄 지금 화면 조건으로 갱신</button>
    <button class="sheetbtn" onclick="menuBg.classList.remove('open');deleteView('${id}')" style="color:#c0392b">🗑 이 탭 삭제
      <span style="margin-left:auto;color:var(--sub);font-size:12px">명함은 그대로</span></button>`;
  $('menuBg').classList.add('open');
}
function renameView(id){
  const v=(state.views||{})[id]; if(!v) return;
  const nm=(prompt('새 탭 이름', v.name)||'').trim(); if(!nm) return;
  Store.putView(Object.assign({}, v, {name:nm})); toast('탭 이름을 바꿨습니다');
}
function updateView(id){
  const v=(state.views||{})[id]; if(!v) return;
  if(!confirm(`'${v.name}' 탭을 지금 화면의 조건으로 덮어쓸까요?`)) return;
  Store.putView(Object.assign({}, v, {f:viewSnapshot(), kind:state.tab})); toast('탭 조건을 갱신했습니다');
}
function deleteView(id){
  const v=(state.views||{})[id]; if(!v) return;
  if(!confirm(`'${v.name}' 탭을 삭제할까요?\n\n· 탭(보기 조건)만 없어지고 명함은 그대로입니다.`)) return;
  Store.delView(id); toast(`'${v.name}' 탭을 삭제했습니다`);
  if($('dedupBg').classList.contains('open')) setTimeout(function(){_refresh(openViewManager)}, 80);   /* 관리창 열려 있으면 갱신 */
}
/* 환경설정 → 내 탭 전체 관리 (한 곳에서 삭제·이름변경) */
function openViewManager(){
  const vs=Object.values(state.views||{}).filter(v=>v&&v.id)
            .sort((a,b)=>((a.kind||'card')===(b.kind||'card') ? (a.order||0)-(b.order||0) : ((a.kind||'card')==='card'?-1:1)));
  if(!vs.length){
    if(_panelTarget==='inline') return showPanel(`<div style="padding:22px;text-align:center;color:var(--sub);font-size:13px;line-height:1.8">
      아직 만들어 둔 탭이 없습니다.<br>목록 화면에서 조건을 걸고 <b>[＋ 탭 추가]</b>를 누르면 여기서 관리할 수 있어요.</div>`);
    $('dedupBg').classList.remove('open');
    return toast('만들어 둔 탭이 없습니다 — 목록 화면에서 [＋ 탭 추가]로 만드세요',5000); }
  const desc = f => {
    f=f||{}; const c=f.colFilter||{}; const out=[];
    if(f.q) out.push(`검색 "${f.q}"`);
    if(f.group&&f.group!=='all') out.push('폴더 '+((state.groups[f.group]||{}).name||'(삭제된 폴더)'));
    if(f.owner&&f.owner!=='all') out.push('담당 '+f.owner);
    if(f.region) out.push('지역 '+f.region);
    if(f.erpFilter) out.push('ERP '+f.erpFilter);
    if(f.erpMgr) out.push('담당 '+f.erpMgr);
    if(c.company) out.push(`회사에 "${c.company}"`);
    if(c.name) out.push(`이름에 "${c.name}"`);
    if(c.phone) out.push(`전화에 "${c.phone}"`);
    if(c.email) out.push(`이메일에 "${c.email}"`);
    if(f.onlyPhone) out.push('전화있음');
    if(f.onlyEmail) out.push('이메일있음');
    if(f.onlyIncomplete) out.push('정보부족만');
    if(f.onlyPrivate) out.push('개인만');
    if(f.onlyDup) out.push('중복만');
    return out.length ? out.join(' · ') : '조건 없음 (전체 보기)';
  };
  let h=`<div class="mhead"><b>🔖 내 탭 관리 — ${vs.length}개</b>
    ${_closeBtn()}</div>
    <p style="font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:10px">
    탭은 <b>보기 조건</b>일 뿐이라, 삭제해도 <b>명함은 그대로</b>입니다. 전 직원이 함께 쓰는 탭이에요.</p>`;
  vs.forEach(v=>{
    const sc=(v.scope||'all');
    const scName = sc==='all' ? ((v.kind||'card')==='biz'?'전체 사업자등록증':'전체 명함')
                 : (sc==='' ? '미분류' : ((state.groups[sc]||{}).name || '(삭제된 폴더)'));
    h+=`<div class="ditem" style="align-items:center"><div class="v">
      <b>🔖 ${esc(v.name)}</b> <span style="font-size:11px;color:var(--sub)">${(v.kind||'card')==='biz'?'사업자':'명함'}</span>
      <span style="font-size:11px;color:#1d4fc4;background:#eef4ff;border:1px solid #cfe0fb;border-radius:8px;padding:1px 7px;margin-left:4px">📁 ${esc(scName)}</span><br>
      <span style="font-size:12px;color:var(--sub)">${esc(desc(v.f))}</span></div>
      <div style="display:flex;gap:6px;flex:none;margin-left:8px">
        <button class="btn ghost" style="padding:7px 12px" onclick="renameView('${v.id}');setTimeout(function(){_refresh(openViewManager)},80)">이름</button>
        <button class="btn ghost" style="padding:7px 12px;color:#c0392b" onclick="deleteView('${v.id}')">삭제</button>
      </div></div>`;
  });
  showPanel(h);
}
/* 탭은 '지금 보고 있는 폴더(대시보드)'에 소속 — 그 폴더에서만 보인다. 각 탭에 인원수 표시 */
/* 지금 폴더는 그대로 두고 탭·검색·필터만 모두 푼다.
   폴더를 다시 누르는 것과 결과는 같지만, 눈이 목록에서 왼쪽 끝까지 갔다 오지 않아도 된다. */
function showAllInFolder(){
  state.erpFilter=''; state.erpMgr=''; state.vtab=''; state.owner='all'; state.region='';
  state.colFilter={};
  state.onlyPhone=false; state.onlyEmail=false; state.onlyDup=false;
  state.onlyIncomplete=false; state.onlyPrivate=false;
  state.q = '';                        /* 폰 찾기말도 함께 비운다(I4) */
  const s=$('search');   if(s) s.value='';
  const p=$('pcSearch'); if(p) p.value='';
  try{ _syncSearchX(); }catch(_){}
  state.page=0; state.view='list'; state.sel={};
  render();
}
/* ══════ 탭 칩 — 순수 로직 (테스트 대상) ══════
   대표 보고 2026-08-15: "전문가 안에서 이미 만들어진 변호사 탭으로 옮기려는데 계속 복잡하다."

   까닭은 **탭이 두 종류인데 구분이 안 되는 것**이었다.
     · 조건 탭 — 검색·필터를 저장한 탭. 자료가 바뀌면 자동으로 따라온다. **담을 수 없다.**
     · 담는 탭 — 명함을 골라 넣는 칸.
   같은 「＋ 탭 추가」가 그때 조건이 걸렸는지에 따라 둘 중 하나를 만드는데, 칩이
   🏷 와 🔖 로 거의 똑같이 생겨 눈으로 못 갈랐다. 게다가 「🏷 탭」으로 담으려 하면
   조건 탭은 목록에서 아예 빠져, 화면에 보이는 탭을 목록에서 못 찾는 일이 생겼다. */

/* 한눈에 갈리는 그림표 — 🔍 는 「찾아서 모은다」, 🏷 는 「골라 담는다」 */
function tabIcon(v){ return (v && v.manual) ? '🏷' : '🔍'; }

/* 고른 명함이 있으면 칩이 «담는 단추»가 된다 — 무엇이 일어날지 미리 알려 준다 */
function tabChipTip(v, selN){
  const n = selN || 0;
  if (!v) return '';
  if (n && v.manual)  return `고른 ${n}개를 이 탭에 담습니다`;
  if (n && !v.manual) return `🔍 조건 탭이라 명함을 담을 수 없습니다 — ⋮ 의 「지금 화면 조건으로 갱신」을 쓰세요`;
  return v.manual ? '담는 탭 — 골라 담은 명함만' : '조건 탭 — 조건에 맞는 명함';
}

/* 칩을 눌렀을 때 무엇을 할지. 화면을 안 건드리고 «무엇을 할지»만 정한다. */
function tabChipAction(v, selN){
  if (!v) return 'none';
  if (!selN) return 'apply';          /* 고른 것이 없으면 예전 그대로 — 그 탭 보기 */
  return v.manual ? 'add' : 'cant';   /* 조건 탭에는 담을 수 없다 */
}
/* ══════ 탭 칩 — 화면 ══════ */

function tabChipClick(id){
  const v = (state.views||{})[id]; if (!v) return;
  const n = Object.keys(state.sel||{}).length;
  const act = tabChipAction(v, n);
  if (act === 'apply') return applyView(id);
  if (act === 'cant') return toast(tabChipTip(v, n), 8000);
  if (!confirm(`고른 ${n}개를 🏷 '${v.name}' 탭에 담을까요?\n\n명함은 지워지지 않습니다.`)) return;
  doAddToTab(id);
}

function renderMyTabsHtml(){
  const cur = state.group||'all';
  const vs=Object.values(state.views||{})
            .filter(v=>v&&v.id&&(v.kind||'card')===state.tab&&(v.scope||'all')===cur)
            .sort((a,b)=>(a.order||0)-(b.order||0));
  /* 고른 명함이 있으면 담는 탭 칩이 «＋ 담기» 로 바뀐다(대표 지시 2026-08-15) */
  const selN = Object.keys(state.sel||{}).length;
  const sig=viewSig(viewSnapshot());
  /* 폴더 안에서 자문·급여 탭을 눌렀다가 다시 폴더 전체를 보려면 왼쪽 폴더를 또 눌러야 했다.
     탭 줄 맨 앞에 「전체」를 두어 한 번에 돌아온다. 조건이 하나도 없을 때 켜진 상태가 된다. */
  const allSig = viewSig({ group: cur });
  const allOn  = (sig === allSig);
  let allN = 0; try{ allN = countMatching({ group: cur }); }catch(_){}
  const gName = cur==='all' ? (state.tab==='card'?'전체 명함':'전체 사업자')
                            : ((state.groups[cur]||allGroups()[cur]||{}).name || '이 폴더');
  let h = `<span style="display:inline-flex;align-items:center;cursor:pointer;
      border:1.5px solid ${allOn?'#1e2a47':'#d7dfec'};background:${allOn?'#1e2a47':'#fff'};
      color:${allOn?'#fff':'#33415e'};border-radius:18px;font-weight:700;font-size:12.5px;
      padding:6px 13px;margin-right:2px"
      onclick="showAllInFolder()" title="${esc(gName)} 전체를 봅니다 — 탭·검색·필터를 모두 풉니다">📋 전체
      <b style="margin-left:5px;font-weight:800;${allOn?'':'color:#5a6885'}">${allN.toLocaleString()}</b></span>`;
  h+=vs.map(v=>{
    const on=viewSig(v.f)===sig;
    let n=0; try{ n=countMatching(v.f); }catch(_){}
    /* 대표만 좌우로 끌어 탭 순서를 바꾼다. 「📋 전체」 칩은 저장된 탭이 아니라
       늘 맨 앞이므로 끌 수 없다(위쪽에서 따로 그린다). */
    return `<span draggable="${state.isAdmin ? 'true' : 'false'}"
      ondragstart="onOrdDragStart(event,'view','${v.id}','')"
      ondragend="onOrdDragEnd(event)"
      ondragover="onOrdDragOver(event)"
      ondragleave="onOrdDragLeave(event)"
      ondrop="onOrdDrop(event,'view','${v.id}','')"
      style="display:inline-flex;align-items:center;border:1.5px solid ${on?'#1d4ed8':'#cfe0fb'};background:${on?'#1d4ed8':'#f4f9ff'};color:${on?'#fff':'#1d4fc4'};border-radius:18px;font-weight:700;font-size:12.5px;overflow:hidden">
      <span style="cursor:pointer;padding:6px 4px 6px 13px" onclick="tabChipClick('${v.id}')" title="${tabChipTip(v, selN)}">${
        tabChipAction(v, selN)==='add' ? '＋' : ''}${tabIcon(v)} ${esc(v.name)}
        <b style="margin-left:5px;font-weight:800;${on?'':'color:#5a6885'}">${n.toLocaleString()}</b></span>
      <span style="cursor:pointer;padding:6px 9px 6px 4px;opacity:.75;font-size:13px" onclick="viewMenu('${v.id}')" title="이름변경 · 조건갱신 · 삭제">⋮</span></span>`;
  }).join('');
  h+=`<button onclick="saveCurrentAsView()" title="지금 화면의 검색·필터 조건을 이 폴더 전용 탭으로 저장합니다" style="border:1.5px dashed #c3d0e6;background:#fff;color:#5a6885;border-radius:18px;padding:6px 13px;font-weight:700;font-size:12.5px;cursor:pointer">＋ 탭 추가</button>`;
  return h;
}

/* 탭 줄 — 지금 폴더(대시보드)에 속한 탭만 표시. 자문·급여 등 ERP 유형도 '탭'으로 직접 추가/삭제
   ⚠ 기업 상세도 «같은 자리»를 쓴다 — 대표 지시 2026-08-17("탭생성은 명함이나 사업자와
     같이 나와야 되는데"). 화면마다 무엇을 그리는지만 여기서 갈린다. */
function renderErpTabs(){
  const el=$('pcErpTabs'); if(!el) return;
  el.innerHTML = state.view==='co' ? renderCoFTabsHtml() : renderMyTabsHtml();
}

/* ══════ 패널 표시 — 환경설정 안에서는 팝업 없이 그 자리에 펼친다 ══════
   같은 화면(중복 정리·휴지통·내 탭 관리 등)을 목록에서 부르면 팝업으로,
   환경설정 탭에서 부르면 본문에 인라인으로 보여준다. */
let _panelTarget='modal';
function _closeBtn(){ return _panelTarget==='inline' ? '' :
  '<button class="iconbtn" onclick="dedupBg.classList.remove(\'open\')">✕</button>'; }
function showPanel(html){
  if(_panelTarget==='inline'){
    const el=$('setInline');
    if(el){ el.innerHTML = (state.setSub ? `<button class="setback" onclick="setSub('')">← 정리 센터로</button>` : '') + html; return; }
  }
  $('dedupM').innerHTML=html; $('dedupBg').classList.add('open');
}
function setSub(s){ state.setSub=s||''; renderSettingsPage(); }
/* 정리 작업 뒤 화면 갱신 — 환경설정 안이면 인라인을 다시 그리고, 목록에서면 팝업을 다시 연다 */
function _refresh(fn){ if(state.view==='settings') renderSettingsPage(); else if(fn) fn(); }
/* 정리 센터의 각 줄을 눌렀을 때 — 인라인이면 하위 화면으로, 팝업이면 팝업으로 */
function _go(sub, modalCall){ return _panelTarget==='inline' ? `setSub('${sub}')` : modalCall; }

/* ══════ 규칙 분류 — 순수 로직 (테스트 대상) ══════
   미분류로 쌓인 명함을 회사명 단어로 폴더에 나눠 담는다.
   '청' 처럼 짧은 말은 청소·청과에도 걸려 일부러 뺐다 — 시청·구청처럼 길게 적는다. */
const CLASSIFY_DEFAULTS = [
  { key:'nomu',   order:1, enabled:true, toGroupName:'노무사',
    words:['노무법인','노무사사무소','노무사무소'] },
  { key:'expert', order:2, enabled:true, toGroupName:'전문가',
    words:['세무','회계','법무','변호사','법률','변리','특허','감정평가'] },
  { key:'public', order:3, enabled:true, toGroupName:'기관·공공',
    words:['공단','공사','시청','구청','군청','도청','교육청','경찰청','소방서','협회','진흥원','재단','연구원','공제회'] },
  { key:'life',   order:4, enabled:true, toGroupName:'생활·기타',
    words:['배달','꽃배달','보험','갈비','식당','마트','택배','렌터카','화수목','미용실','세탁','피자','치킨'] }
];
/* 규칙이 하나도 없을 때만 기본 4개를 심는다.
   기록 이름(key)을 고정으로 써서, 두 사람이 동시에 심어도 같은 4개로 모인다.
   지운 뒤 다시 살아나지 않도록 이 기기에 1회만 표시 */
function seedClassifyRules(){
  try{
    if(Store.mode!=='firebase') return;
    if(localStorage.getItem('pucards_rules_v1')) return;
    if(Object.keys(state.rules||{}).length) return;
    CLASSIFY_DEFAULTS.forEach(r=>{ Store.putRule({...r, words:r.words.slice()}); });
    localStorage.setItem('pucards_rules_v1','1');
  }catch(e){ console.warn('[seedClassifyRules]', e&&e.message); }
}
/* 지금 쓸 규칙 — 저장된 게 있으면 그것, 없으면 기본값. 항상 order 오름차순 */
function classifyRuleList(){
  const saved = Object.values(state.rules||{}).filter(r=>r&&r.key);
  const list = saved.length ? saved : CLASSIFY_DEFAULTS.map(r=>({...r, words:r.words.slice()}));
  return list.slice().sort((a,b)=>(a.order||0)-(b.order||0));
}
/* 이 명함이 이 규칙에 걸리는가 — 회사명과 이름에서 단어를 찾는다.
   회사 칸이 비고 이름 칸에 상호가 들어온 명함이 많아 둘 다 본다. */
function ruleHit(it, r){
  if(!it || !r || r.enabled===false) return false;
  const hay = String(it.company||'') + ' ' + String(it.name||'');
  const ws = Array.isArray(r.words) ? r.words : [];
  for(let i=0;i<ws.length;i++){
    const w = String(ws[i]||'').trim();
    if(w && hay.indexOf(w) >= 0) return true;
  }
  return false;
}
/* 규칙별로 옮길 명함을 고른다.
   ① 미분류만 — 손으로 넣어 둔 폴더는 절대 안 건드린다
   ② 지금 보는 종류(명함/사업자)만
   ③ 위에서 아래로 먼저 맞은 규칙 하나만 (한 장이 두 폴더로 갈 수 없다) */
function classifyTargets(items, rules, kind){
  const on = (rules||[]).filter(r=>r && r.key && r.enabled!==false)
                        .slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const byKey = {}; on.forEach(r=>{ byKey[r.key] = []; });
  const unmatched = [];
  (items||[]).forEach(it=>{
    if(!it || !it.id) return;
    if(((it.kind==='biz') ? 'biz' : 'card') !== kind) return;
    if(String(it.group||'') !== '') return;
    let hit = null;
    for(let i=0;i<on.length;i++){ if(ruleHit(it, on[i])){ hit = on[i]; break; } }
    if(hit) byKey[hit.key].push(it); else unmatched.push(it);
  });
  return { byKey, unmatched, keys: on.map(r=>r.key) };
}
/* 규칙이 보낼 폴더 찾기 — id 가 아니라 이름으로 가리킨다.
   폴더를 지웠다 다시 만들어도 규칙이 살아남게 하려는 것이다 (autoFolder 의 ensure 와 같은 뜻).
   잠긴 폴더로는 보내지 않는다 — 남의 개인 폴더에 명함이 섞이면 되돌리기도 어렵다.
   이름으로 못 찾았다고 바로 '없다'고 보면 안 된다 — 규칙이 예전에 만든 폴더를 누가
   이름을 바꿔 버리면 이름 조회는 놓치지만, 그 폴더는 여전히 규칙의 결정적 id 자리에
   그대로 있다. 그걸 없는 셈 치고 새로 지어 update() 로 groups/<id> 를 통째로 써 버리면
   잠금·비밀번호·순서·부모가 다 날아간다 — 그래서 id로 한 번 더 확인해서 있으면 그
   폴더를 그대로 재사용한다(이름·잠금·순서는 절대 건드리지 않는다). 잠겨 있으면
   여느 때처럼 보내지 않는다 — '이름을 바꿔 잠그면 우회된다'는 구멍을 여기서 막는다. */
function findRuleGroup(groups, r, kind){
  const nm = _canon(r && r.toGroupName);
  const g = Object.values(groups||{}).find(x =>
    x && _canon(x.name) === nm && ((x.kind||'card') === kind));
  if(g) return g.locked ? { gid:null, locked:true } : { gid:g.id };
  const gid2 = ruleFolderId(kind, r && r.toGroupName);
  const g2 = (groups||{})[gid2];
  if(g2) return g2.locked ? { gid:null, locked:true } : { gid:g2.id };
  return { gid:null, missing:true };
}
/* 규칙이 새로 만들 폴더의 id — uid() 대신 종류+이름에서 그대로 뽑는다.
   두 사람이 동시에 [분류하기]를 눌러도 같은 폴더 하나로 모인다
   (seedClassifyRules 가 규칙 key를 고정해 두는 것과 같은 이유).
   Firebase 키 금지문자(. $ # [ ] / 와 제어문자)만 밑줄로 치환한다.
   findRuleGroup 이 이름을 놓쳤을 때 이 id로 한 번 더 찾아보므로, 같은 '순수 로직'
   토막 안에 둔다(테스트도 findRuleGroup 과 함께 돌릴 수 있게). */
function ruleFolderId(kind, name){
  const safe = _canon(name).replace(/[.$#[\]/\x00-\x1f\x7f]/g, '_');
  return `rule_${kind}_${safe || 'g'}`;
}
/* ══════ 규칙 분류 — 화면 ══════ */
/* 지금 보고 있는 종류(명함/사업자) 기준으로 규칙별 걸린 장수를 센다.
   화면과 적용이 같은 답을 보게 이 한 곳에서만 계산한다. */
function classifyPlan(){
  const kind  = state.tab==='biz' ? 'biz' : 'card';
  const rules = classifyRuleList();
  const items = Object.values(state.items||{});
  const plan  = classifyTargets(items, rules, kind);
  const blocked = {};
  rules.forEach(r=>{
    const t = findRuleGroup(state.groups||{}, r, kind);
    if(t.locked) blocked[r.key] = 'locked';
  });
  const targetN = rules.reduce((s,r)=> s + (blocked[r.key] ? 0 : ((plan.byKey[r.key]||[]).length)), 0);
  return { kind, rules, plan, blocked, targetN, unmatchedN: plan.unmatched.length };
}
/* 규칙 분류 화면 — 환경설정 안에서는 팝업 없이 그 자리에 펼친다. */
let _rulePreview = '';              /* 지금 펼쳐 본 규칙 key */
function openClassifyRules(){
  const P = classifyPlan();
  const kindName = P.kind==='biz' ? '사업자등록증' : '명함';
  const inline = _panelTarget==='inline';
  const midN = Object.values(state.items||{})
    .filter(it=>it && ((it.kind==='biz')?'biz':'card')===P.kind && String(it.group||'')==='').length;

  let h = inline
    ? `<p class="setnote">폴더가 정해지지 않은 <b>${kindName} ${midN.toLocaleString()}장</b>을 회사명 단어로 나눠 담습니다.
       <b>이미 폴더에 든 명함은 건드리지 않습니다.</b></p>`
    : `<div class="mhead"><b>🗂 규칙으로 한 번에 분류</b>${_closeBtn()}</div>
       <p style="font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:10px">
       폴더가 정해지지 않은 <b>${kindName} ${midN.toLocaleString()}장</b>을 회사명 단어로 나눠 담습니다.
       <b>이미 폴더에 든 명함은 건드리지 않습니다.</b></p>`;

  P.rules.forEach(r=>{
    const n = (P.plan.byKey[r.key]||[]).length;
    const off = r.enabled===false;
    const lock = P.blocked[r.key]==='locked';
    const words = (r.words||[]).join(' · ');
    /* 규칙이 만든 폴더를 사람이 딴 이름으로 바꿨을 수 있다 — 그때는 바뀐 이름을 보여준다.
       규칙에 적힌 이름만 찍으면 화면과 실제 들어갈 곳이 어긋난다. */
    const gHit = findRuleGroup(state.groups||{}, r, P.kind);
    const gNow = gHit.gid ? (state.groups||{})[gHit.gid] : null;
    const dest = (gNow && gNow.name) || r.toGroupName;
    h += `<div class="ditem" style="align-items:flex-start;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:center;gap:8px;width:100%">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:800;font-size:13px">
          <input type="checkbox" ${off?'':'checked'} ${lock?'disabled':''}
            onchange="toggleClassifyRule('${r.key}')"> → 📁 ${esc(dest)}</label>
        <b style="margin-left:auto;font-size:13px;color:${lock?'var(--red)':(off?'#9aa6bd':'var(--orange)')}">
          ${lock ? '잠긴 폴더 — 보낼 수 없음' : (off ? '꺼짐' : n.toLocaleString()+'장')}</b>
      </div>
      <div style="font-size:12px;color:var(--sub);line-height:1.6;word-break:keep-all">${esc(words)}</div>
      <div style="display:flex;gap:6px">
        <button class="btn ghost" style="padding:5px 11px;font-size:12px"
          onclick="editRuleWords('${r.key}')">단어 고치기</button>
        ${n && !off && !lock ? `<button class="btn ghost" style="padding:5px 11px;font-size:12px"
          onclick="previewRule('${r.key}')">${_rulePreview===r.key?'접기':'미리보기'}</button>` : ''}
      </div>
      ${_rulePreview===r.key ? ruleSampleHtml(P.plan.byKey[r.key]||[]) : ''}
    </div>`;
  });

  h += `<div class="ditem" style="align-items:center"><div class="v">
      <b style="color:var(--sub)">규칙에 안 걸림</b>
      <br><span style="font-size:12px;color:var(--sub)">손으로 정리하거나 단어를 더하세요</span></div>
      <b style="flex:none;font-size:13px;color:var(--sub)">${P.unmatchedN.toLocaleString()}장</b></div>`;

  h += P.targetN
    ? `<button class="btn primary" style="width:100%;margin-top:12px"
         onclick="applyClassifyRules()">✅ ${P.targetN.toLocaleString()}장 지금 분류하기</button>`
    : `<p style="font-size:12.5px;color:var(--green);padding:12px 4px;text-align:center">
         ✓ 규칙으로 옮길 ${kindName}이 없습니다</p>`;
  h += `<div id="undoBar"></div>`;     /* 되돌리기 줄 — Task 4에서 채운다 */
  h += `<p style="font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:10px">
    ※ 폴더만 바뀝니다. 명함은 지워지지 않고, 적용 뒤 <b>되돌리기</b>로 통째로 되돌릴 수 있어요.</p>`;
  showPanel(h);
  renderUndoBar();
}
/* 규칙 적용 — 명함 수천 장을 하나씩 쓰면 수천 번 통신한다.
   items·idx·되돌리기 기록을 한 번의 update() 로 몰아 보낸다 (rebuildIdxAll 과 같은 방식). */
async function applyClassifyRules(){
  if(Store.mode!=='firebase') return toast('클라우드에 연결된 상태에서만 됩니다');
  const P = classifyPlan();
  if(!P.targetN) return toast('옮길 명함이 없습니다');

  /* 보낼 폴더를 미리 확보한다 — 없으면 여기서는 '만들 정보'만 메모리에 쥐고 있는다.
     실제로 쓰기(groups/…)는 취소해도 빈 폴더가 안 남도록 확인 뒤 카드와 한 통신에 같이 보낸다. */
  const gidOf = {}; const newGroups = {};
  for(const r of P.rules){
    if(r.enabled===false || P.blocked[r.key]) continue;
    if(!(P.plan.byKey[r.key]||[]).length) continue;
    const t = findRuleGroup(state.groups||{}, r, P.kind);
    if(t.locked) continue;
    if(t.gid){ gidOf[r.key] = t.gid; continue; }
    const gid = ruleFolderId(P.kind, r.toGroupName);
    newGroups[gid] = { id:gid, name:r.toGroupName, kind:P.kind, order:Date.now() };
    gidOf[r.key] = gid;
  }

  /* 실제로 들어갈 폴더 이름을 보여준다.
     규칙이 만든 폴더를 나중에 사람이 딴 이름으로 바꿔 두면(이름은 달라도 같은 폴더다)
     규칙에 적힌 이름을 그대로 찍을 경우 "노무사로 간다"고 읽고 눌렀는데 실제로는
     '2025 폐업정리'로 들어간다 — 못 본 곳에 동의하게 만드는 셈이다. */
  const lines = P.rules.filter(r=>gidOf[r.key])
    .map(r=>{
      const g = (state.groups||{})[gidOf[r.key]];
      const nm = (g && g.name) || r.toGroupName;
      const renamed = nm !== r.toGroupName ? ` (규칙 이름: ${r.toGroupName})` : '';
      return `· ${nm}${renamed} ← ${(P.plan.byKey[r.key]||[]).length.toLocaleString()}장`;
    }).join('\n');
  if(!confirm(`아래대로 ${P.targetN.toLocaleString()}장을 옮깁니다.\n\n${lines}\n\n`
    + `· 폴더만 바뀝니다. 명함은 지워지지 않습니다\n`
    + `· 이미 폴더에 든 명함은 건드리지 않습니다\n`
    + `· 적용 뒤 [되돌리기]로 통째로 되돌릴 수 있습니다\n\n진행할까요?`)) return;

  /* confirm() 이 떠 있는 동안 Firebase 리스너는 멈춰 있다 — 그 사이 동료가 지운 카드가 있어도
     여기 온 순간까진 반영이 안 돼 있을 수 있다. 한 박자 넘겨 큐에 쌓인 갱신을 먼저 흘려보낸다. */
  await new Promise(r=>setTimeout(r,0));

  const batchId = uid();
  const upd = {}, logItems = {};
  const usedGids = new Set();
  let n = 0, skipped = 0;
  P.rules.forEach(r=>{
    const gid = gidOf[r.key]; if(!gid) return;
    (P.plan.byKey[r.key]||[]).forEach(planned=>{
      /* confirm() 을 보는 동안 지워졌거나, 이미 다른 곳으로 옮겨졌으면 건드리지 않는다 —
         그 사이의 사람 손 처리가 규칙보다 우선한다 */
      const cur = state.items[planned.id];
      if(!cur || String(cur.group||'') !== ''){ skipped++; return; }
      /* confirm() 을 보는 동안 동료가 이 목적지 폴더를 잠갔을 수 있다 — 색인 쓰기는 이미
         아래에서 잠금을 걸러내는데, 카드 이동만 그대로 두면 '카드는 잠긴 폴더로 들어갔는데
         색인엔 없다'는 불일치가 생긴다. 이동 자체를 건너뛰어 둘을 맞춘다. */
      if(state.groups[gid] && state.groups[gid].locked){ skipped++; return; }
      logItems[cur.id] = { from:'', to:gid };         /* 되돌릴 때 견줘 볼 원래·새 폴더 둘 다 남긴다 */
      upd[`items/${cur.id}/group`]     = gid;
      upd[`items/${cur.id}/updatedAt`] = Date.now();
      /* 폴더가 바뀌면 검색색인에 들어갈지 여부도 달라진다 — 같은 통신에 함께 고친다.
         (잠긴 폴더 제외는 writeIdx·rebuildIdxAll 과 같은 규칙) */
      const merged = { ...cur, group:gid };
      upd[`idx/${cur.id}`] = inLockedGroup(merged) ? null : idxRecord(merged);
      usedGids.add(gid);
      n++;
    });
  });

  if(!n){ toast('그 사이 대상이 모두 사라지거나 옮겨졌습니다 — 다시 열어 확인해 주세요', 6000); return; }

  /* 카드가 한 장도 안 간 폴더는 만들지 않는다 — 취소·전량 스킵 뒤에 빈 폴더만 남는 일을 막는다 */
  Object.values(newGroups).forEach(g=>{ if(usedGids.has(g.id)) upd[`groups/${g.id}`] = g; });
  upd[`classifyLog/${batchId}`]      = { id:batchId, at:firebase.database.ServerValue.TIMESTAMP, by:(myEmail||''), n, kind:P.kind };
  upd[`classifyLogItems/${batchId}`] = logItems;         /* 카드별 원래·새 폴더 — 되돌리기만 쓰는 무거운 맵이라 따로 둔다 */

  toast(`분류하는 중… ${n.toLocaleString()}장`, 30000);
  try{
    await Store.db.ref(DB_ROOT).update(upd);
    Object.values(newGroups).forEach(g=>{ if(usedGids.has(g.id)) state.groups[g.id] = g; }); /* 실제로 쓴 만큼만 로컬에도 반영 */
    await pruneClassifyLog();
    let msg = `✅ ${n.toLocaleString()}장을 폴더로 옮겼습니다 — 되돌리려면 [되돌리기]`;
    if(skipped) msg += ` (그 사이 지워지거나 옮겨진 ${skipped.toLocaleString()}장 제외)`;
    toast(msg, 8000);
    setTimeout(()=>_refresh(openClassifyRules), 400);
  }catch(e){
    toast('❌ 실패: ' + ((e&&e.message)||'알 수 없음'), 6000);
  }
}
/* 되돌리기 기록은 최근 10건만 남긴다 — 5,000장 기록이 쌓이면 무거워진다.
   classifyLog 에는 날짜·건수 같은 가벼운 정보만 담는다. 카드 5,000장짜리 맵(=classifyLogItems)은
   여기서 구독하지 않는다 — 그걸 구독하면 화면 한 줄 그리자고 전 직원이 로그인마다,
   그리고 남이 분류할 때마다 그 무거운 맵을 통째로 받게 된다. 되돌릴 때만 once() 로 딱 한 번 받는다. */
let _classifyLog = {};
/* ══════ _atMs — 순수 로직 (테스트 대상) ══════
   at 은 ServerValue.TIMESTAMP 로 쓴다(느리거나 빠른 PC 시계가 되돌리기 순서를 정하면 안 되니까).
   그런데 로컬 낙관적 갱신 단계에서는 아직 서버가 채워주기 전이라 숫자가 아니라
   {'.sv':'timestamp'} 같은 placeholder 객체로 잠깐 보일 수 있다 — 그 경우만 '지금'으로 본다.
   at 이 아예 없거나 이상한 값이면 '지금'이 아니라 가장 오래된 것(0)으로 봐야 한다 —
   안 그러면 기록 없는 항목이 되돌리기 버튼에 영원히 눌러앉고, pruneClassifyLog 가
   진짜 최근 기록보다 그걸 먼저 살려 둔다. */
function _atMs(v){
  if(typeof v==='number') return v;
  if(v && typeof v==='object' && v['.sv']==='timestamp') return Date.now();
  return 0;
}
/* ══════ _atMs 끝 ══════ */
function watchClassifyLog(){
  try{
    if(Store.mode!=='firebase') return;
    Store.db.ref(DB_ROOT+'/classifyLog').on('value', s=>{
      _classifyLog = s.val()||{};

async function pruneClassifyLog(){

    <button class="btn ghost" style="flex:none;padding:8px 14px"
      onclick="undoClassify('${last.id}')">되돌리기</button></div>`;

/* 되돌리기 — 기록해 둔 '원래 폴더'로 되돌린다. 단, 그 사이 사람이 손으로 다시 옮긴 카드는
   건너뛴다(그 판단이 규칙보다 이긴다) — 그러려면 카드별로 '이 배치가 보낸 폴더'도 함께
   기억해 둬야 지금 있는 자리와 견줄 수 있다(Critical). 카드별 맵은 여기서만 once() 로 받는다. */
async function undoClassify(batchId){
  if(Store.mode!=='firebase') return toast('클라우드에 연결된 상태에서만 됩니다');
  const log = (_classifyLog||{})[batchId];
  if(!log) return toast('되돌릴 기록을 찾지 못했습니다');

  let itemsSnap;
  try{
    const s = await Store.db.ref(DB_ROOT+'/classifyLogItems/'+batchId).once('value');
    itemsSnap = s.val() || {};
  }catch(e){ return toast('❌ 실패: ' + ((e&&e.message)||'알 수 없음'), 6000); }
  const ids = Object.keys(itemsSnap);
  if(!ids.length){
    /* classifyLog(메타)는 남아 있는데 classifyLogItems(카드별 맵)만 없다 — 예전에 지워졌거나
       프루닝이 어긋난 경우다. 여기서 메타만 지워 두지 않으면 되돌리기 버튼이 화면에
       영원히 남아, 눌러도 매번 이 토스트만 뜨는 죽은 버튼이 된다. */
    try{ await Store.db.ref(DB_ROOT).update({ [`classifyLog/${batchId}`]: null, [`classifyLogItems/${batchId}`]: null }); }
    catch(e){ console.warn('[undoClassify] 고아 메타 정리 실패', e&&e.message); }
    return toast('되돌릴 기록을 찾지 못했습니다');
  }

  /* 확인창에 누가·어디로 보낸 것인지 보여준다 — 이름·건수만 보고 누르는 일을 막는다.
     confirm() 은 그냥 텍스트 창이라 esc() 로 HTML 엔티티화하면 'R&D' 가 'R&amp;D' 로
     그대로 보인다 — applyClassifyRules 의 확인창과 똑같이 원문 그대로 보여준다. */
  const nameOf = gid => gid ? (state.groups[gid]?.name || '(삭제된 폴더)') : '미분류';
  const toCount = {};
  ids.forEach(id=>{ const to = itemsSnap[id].to||''; toCount[to] = (toCount[to]||0)+1; });
  const toLines = Object.keys(toCount)
    .map(gid=>`· ${nameOf(gid)} ← ${toCount[gid].toLocaleString()}장`).join('\n');
  const byWho = log.by ? `${log.by} 님이 적용한 ` : '';
  if(!confirm(`${byWho}${ids.length.toLocaleString()}장을 분류하기 전 상태로 되돌립니다.\n\n${toLines}\n\n`
    + `· 그 사이 사람이 손으로 다시 옮긴 카드는 건드리지 않고 건너뜁니다\n\n진행할까요?`)) return;

  /* confirm() 이 떠 있는 동안 스레드가 막혀 있어 Firebase 리스너 콜백이 못 들어온다 —
     확인창을 닫는 순간 큐에 쌓여 있던 갱신(동료의 수동 이동·삭제)이 한꺼번에 반영된다.
     한 박자 넘겨 그걸 먼저 흘려보내야, 바로 아래에서 state.items 를 읽을 때 방금 반영된
     최신 값을 본다 — applyClassifyRules 가 이미 하고 있는 것과 똑같다(Critical). */
  await new Promise(r=>setTimeout(r,0));

  const now = Date.now();
  const upd = {};
  let restored = 0, movedSince = 0, gone = 0;
  ids.forEach(id=>{
    const cur = state.items[id];
    if(!cur){ gone++; return; }                              /* 그 사이 지워졌다 */
    const rec = itemsSnap[id] || {};
    const to = String(rec.to||'');
    if(String(cur.group||'') !== to){ movedSince++; return; } /* 그 사이 딴 곳으로 옮겨졌다 — 그 결정이 이긴다 */
    const back = String(rec.from||'');
    upd[`items/${id}/group`]     = back;
    upd[`items/${id}/updatedAt`] = now;
    const merged = { ...cur, group:back };
    upd[`idx/${id}`] = inLockedGroup(merged) ? null : idxRecord(merged);
    restored++;
  });

  if(!restored){
    /* 하나도 못 되돌렸으면 기록을 지우지 않는다 — 지웠다가 나중에 다시 찾아야 할 수도 있다 */
    toast(movedSince
      ? `되돌릴 카드가 없습니다 — ${movedSince.toLocaleString()}장이 그 사이 손으로 옮겨졌습니다`
      : '되돌릴 카드가 없습니다', 6000);
    return;
  }
  upd[`classifyLog/${batchId}`]      = null;
  upd[`classifyLogItems/${batchId}`] = null;
  toast('되돌리는 중…', 30000);
  try{
    await Store.db.ref(DB_ROOT).update(upd);
    let msg = `↩️ ${restored.toLocaleString()}장을 되돌렸습니다`;    /* 실제로 되돌린 만큼만 알린다 */
    if(movedSince) msg += ` (그 사이 옮겨진 ${movedSince.toLocaleString()}장 제외)`;
    if(gone) msg += ` (삭제된 ${gone.toLocaleString()}장 제외)`;
    toast(msg, 8000);
    setTimeout(()=>_refresh(openClassifyRules), 400);
  }catch(e){
    toast('❌ 되돌리기 실패: ' + ((e&&e.message)||'알 수 없음'), 6000);
  }
}

function toggleClassifyRule(key){

/* 단어 고치기 — 쉼표로 나눠 적는다 */
function editRuleWords(key){
  const cur = classifyRuleList().find(r=>r.key===key); if(!cur) return;
  const now = (cur.words||[]).join(', ');
  const txt = prompt(`📁 ${cur.toGroupName} 로 보낼 단어를 쉼표로 나눠 적으세요.\n\n`
    + `· 회사명이나 이름에 이 말이 있으면 이 폴더로 갑니다\n`
    + `· 짧은 말은 엉뚱한 곳에 걸립니다 (예: '청' → 청소·청과)`, now);
  if(txt===null) return;
  const words = txt.split(',').map(s=>s.trim()).filter(Boolean);
  if(!words.length) return toast('단어가 비어 있습니다');
  Store.putRule({ ...cur, words, enabled: cur.enabled!==false });
  setTimeout(()=>_refresh(openClassifyRules), 60);
}
