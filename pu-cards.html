async function runImport(){
  const _modeEl = document.querySelector('input[name="imp_mode"]:checked');
  const impMode = _modeEl ? _modeEl.value : 'skip';   /* skip | merge | overwrite */
  const IMP_KEEP = {id:1,kind:1,thumb:1,thumb2:1,group:1,createdAt:1,fav:1,erpAutoFoldered:1,scope:1,phones:1};
  const rows=pendingImport||[]; pendingImport=null;
  /* 인코딩 깨짐 방어 — 상당수가 깨진 파일이면 한 번 더 확인 */
  const _bad = rows.filter(r=>_hasMojibake(r.name)||_hasMojibake(r.company)).length;
  if (_bad>0 && _bad/Math.max(1,rows.length) > 0.2){
    if(!confirm(`⚠️ 글자가 깨진 명함이 ${_bad.toLocaleString()}건입니다.\n이대로 가져오면 깨진 명함이 생깁니다.\n\n그래도 진행할까요?\n(권장: 취소하고 파일을 UTF-8 / vCard로 다시 내보내세요)`)) { $('impBg').classList.remove('open'); return; }
  }
  $('impBg').classList.remove('open');
  if (Store.mode==='local' && rows.length>300 &&
      !confirm('데모 모드에서는 대량 가져오기가 기기 용량을 초과할 수 있습니다.\nFirebase 연결 후 진행을 권장합니다. 계속할까요?')) return;
  /* 회사 없는 연락처를 모을 "지인" 그룹 확보(없으면 생성) */
  let friendG = Object.values(state.groups).find(g=>g.name==='지인');
  if (!friendG){ friendG={id:uid(), name:'지인', order:Date.now()}; Store.putGroup(friendG); }
  const map=buildKeyMap();
  const updates={}; let add=0,merge=0,skip=0,i=0;
  for (const r of rows){
    i++;
    const exId=matchExisting(r,map);
    if (exId){
      if (impMode==='skip'){ skip++; continue; }   /* 중복 완전 배제 — 기존 항목 안 건드림 */
      const ex = updates[exId] || {...state.items[exId]};
      Object.keys(r).forEach(k=>{ if(IMP_KEEP[k] || !r[k]) return;
        if (impMode==='overwrite') ex[k]=r[k];      /* 최신값으로 덮어쓰기 */
        else if (!ex[k]) ex[k]=r[k];                /* merge: 빈 칸만 채움 */
      });
      ex.updatedAt=Date.now(); updates[exId]=ex; merge++;
    } else {
      const it={ id:uid(), kind:'card', thumb:'', group:'', createdAt:Date.now(), updatedAt:Date.now(), ...r };
      delete it.phones;
      if (!String(it.company||'').trim()) it.group = friendG.id;  /* 회사 없음 → 지인 폴더 */
      updates[it.id]=it; add++;
      rowKeys(r).forEach(k=>{ if(!map[k]) map[k]=it.id; });
    }
    if (i%300===0) toast(`가져오는 중… ${i.toLocaleString()}/${rows.length.toLocaleString()}`,4000);
  }
  if (Store.mode==='firebase'){
    const ids=Object.keys(updates);
    let ok=0, fail=0;
    for (let s=0;s<ids.length;s+=100){
      const chunk={}; ids.slice(s,s+100).forEach(id=>chunk[id]=updates[id]);
      try {
        await Store.db.ref(DB_ROOT+'/items').update(chunk);
        ok += Object.keys(chunk).length;
      } catch(e){ console.error('저장 실패 묶음', e); fail += Object.keys(chunk).length; }
      toast(`저장 중… ${Math.min(s+100,ids.length).toLocaleString()}/${ids.length.toLocaleString()}`,4000);
      await new Promise(r=>setTimeout(r,120));   // 과부하 방지로 살짝 쉼
    }
    toast(`✅ 가져오기 완료 — 신규 ${ok.toLocaleString()}건 추가${skip?`, 중복 ${skip.toLocaleString()}건 건너뜀`:''}${merge?`, ${impMode==='overwrite'?'덮어씀':'합침'} ${merge.toLocaleString()}건`:''}${fail?`, 실패 ${fail}건(다시 시도하세요)`:''}`,7000);
    return;
  } else { Object.assign(state.items, updates); Store._ls(); render(); }
  toast(`✅ 가져오기 완료 — 신규 ${add.toLocaleString()}건${skip?`, 중복 ${skip.toLocaleString()}건 건너뜀`:''}${merge?`, ${impMode==='overwrite'?'덮어씀':'합침'} ${merge.toLocaleString()}건`:''}`,6000);
}

/* ════════════ 🧹 중복 정리 ════════════ */
const FIELD_LABEL=Object.fromEntries([...CARD_FIELDS,...BIZ_FIELDS].map(([k,l])=>[k,l]));
function itemKeys(it){
  if (it.kind==='biz'){ const d=digits(it.bizno); return d.length>=10 ? ['b'+d] : []; }
  return rowKeys(it);
}
function findDupGroups(){
  const arr=Object.values(state.items).filter(it=>it.kind===state.tab);
  const parent={}; arr.forEach(it=>parent[it.id]=it.id);
  const find=x=>parent[x]===x?x:(parent[x]=find(parent[x]));
  const uni=(a,b)=>{ parent[find(a)]=find(b); };
  const map={};
  arr.forEach(it=>itemKeys(it).forEach(k=>{ if(map[k]) uni(it.id,map[k]); else map[k]=it.id; }));
  const groups={};
  arr.forEach(it=>{ const r=find(it.id); (groups[r]=groups[r]||[]).push(it); });
  /* ★ 이름이 서로 다르면 '확실한 중복'이 아니다.
     한 회사가 대표 이메일(info@…) 하나를 여럿이 함께 쓰거나, 회사 대표번호를
     휴대폰 칸에 적어 둔 명함이 흔하다. 그것만 보고 합치면 김철수와 박영희가
     한 장으로 합쳐지고 한 사람이 휴지통으로 사라진다 — 합친 뒤에는 어느 값이
     누구 것이었는지 알 수 없어 되돌려도 원래대로 돌아오지 않는다.
     이름이 엇갈리면 애초에 같은 사람이 아니므로 중복으로 세지 않는다. */
  return Object.values(groups).filter(g=>g.length>1).filter(g=>{
    const names=new Set(g.map(x=>String(x.name||'').toLowerCase().replace(/\s/g,'')).filter(Boolean));
    return names.size<=1;
  });
}
/* keepId — 사람이 「남길 것」으로 고른 명함을 바탕으로 삼는다.
   안 넘기면 예전처럼 가장 최근에 고친 것이 바탕이다. */
async function mergeGroup(ids, keepId){
  const items=ids.map(id=>state.items[id]).filter(Boolean);
  if (items.length<2) return;
  items.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if (keepId){
    const at = items.findIndex(x=>x.id===keepId);
    if (at>0) items.unshift(items.splice(at,1)[0]);      /* 고른 것을 맨 앞으로 */
  }
  const base={...items[0]};
  const fields=(base.kind==='card'?CARD_FIELDS:BIZ_FIELDS).map(f=>f[0]);
  const norm=v=>String(v).toLowerCase().replace(/[\s\-]/g,'');
  const conflicts=[];
  items.slice(1).forEach(o=>{
    fields.forEach(k=>{
      if(!o[k]) return;
      if(!base[k]) base[k]=o[k];
      else if(k!=='memo' && norm(base[k])!==norm(o[k])) conflicts.push(`[병합] 다른 ${FIELD_LABEL[k]}: ${o[k]}`);
    });
    if(!base.thumb && o.thumb) base.thumb=o.thumb;
    if(o.memo && o.memo!==base.memo) base.memo=((base.memo||'')+'\n'+o.memo).trim();
    base.createdAt=Math.min(base.createdAt||Date.now(), o.createdAt||Date.now());
  });
  if (conflicts.length) base.memo=((base.memo||'')+'\n'+[...new Set(conflicts)].join('\n')).trim();
  if (!(await Store.getPhoto(base.id)))
    for (const o of items.slice(1)){ const p=await Store.getPhoto(o.id); if(p){ Store.putPhoto(base.id,p); break; } }
  Store.put(base);
  items.slice(1).forEach(o=>Store.del(o.id));
}
/* 한 번에 정리 — **안전한 것만 자동, 나머지는 사람이 본다**(대표 결정 2026-08-10).
   예전에는 이름이 엇갈리는 묶음을 애초에 목록에 넣지 않아, 「모두 자동 병합」을 눌러도
   그 묶음들은 그대로 남고 왜 남았는지 말해 주지 않았다. 이제 둘로 갈라 보여준다. */

  }

async function mergeOne(csv){ await mergeGroup(csv.split(',')); toast('병합 완료'); _refresh(openDedup); }
/* 확실한 중복(이름까지 같은 것)만 합친다 — 이름이 엇갈리는 묶음은 손대지 않는다 */
async function autoMergeAll(){

/* ══════ 중복 판단 — 순수 로직 (테스트 대상) ══════
   대표 지시 2026-08-10: "중복 단어 클릭하면 중복 삭제 또는 합치기 등 판단할 수 있는
   부분을 팝업시켜주고 한번에 정리 할 수 있게도."

   ⚠ 여기가 왜 따로 필요한가 — 배지(`isDup`)와 「🧹 중복 정리」(`findDupGroups`)의
     기준이 달랐다. 배지는 열쇠 하나만 겹치면 붙는데, 정리는 **이름이 엇갈리는 묶음을
     버린다**(회사 대표이메일을 여럿이 함께 쓰는 명함을 합치면 사람이 사라지므로 옳다).
     그래서 배지를 영원히 달고 있으면서 정리 목록에는 없는 명함이 생겼다 —
     사람이 「이건 다른 사람이다」라고 말할 자리가 없었다.
     이 층은 **이름으로 걸러내지 않고 묶고**, 대신 이름이 모이는지를 따로 알려 준다.
     걸러내는 것은 자동 합치기만 하고, 사람은 다 본다. */
const DUP_IGNORE_LS = 'pucards_dup_ignore';

/* 짝 서명 — 어느 쪽을 먼저 넣어도 한 가지 모양이어야 한다.
   안 그러면 「중복 아님」을 눌러도 반대 방향에서 다시 겹친 것으로 읽힌다. */
function dupIgnoreKey(a, b){ return [String(a), String(b)].sort().join('~'); }

/* 두 명함이 이어지나 — 열쇠가 겹치고, 「중복 아님」으로 적어 둔 짝이 아닐 때.
   keysOf 는 열쇠를 이미 뽑아 둔 것이 있을 때만 넘긴다(아래 묶기에서 쓴다).
   규칙은 **여기 한 곳에만** 있어야 한다 — 묶기와 배지가 서로 다른 답을 하면
   「배지는 있는데 정리 목록엔 없다」가 다시 생긴다. */
function dupLinked(a, b, ignore, keysOf){
  if (!a || !b || a.id === b.id) return false;
  if (ignore && ignore.has && ignore.has(dupIgnoreKey(a.id, b.id))) return false;
  const K = keysOf || itemKeys;
  const ka = new Set(K(a));
  return K(b).some(k => ka.has(k));
}

/* 겹친 묶음 전부. **이름으로 걸러내지 않는다** — 사람이 보고 판단할 것이다.
   짝마다 봐야 하므로(「중복 아님」이 짝 단위) 열쇠 맵 대신 이어붙이기로 묶는다. */
function dupGroupsOf(items, ignore){
  const arr = (items||[]).slice();
  const parent = {}; arr.forEach(it => { parent[it.id] = it.id; });
  const find = x => parent[x] === x ? x : (parent[x] = find(parent[x]));
  /* 열쇠를 한 번만 뽑아 둔다 — 6천 장을 짝마다 다시 뽑으면 표를 그릴 때마다 버벅인다 */
  const memo = {};
  const keysOf = it => (memo[it.id] || (memo[it.id] = itemKeys(it)));
  /* 열쇠가 같은 것끼리만 견준다 — 6천 장을 서로 다 견주면(1800만 번) 화면이 멈춘다 */
  const byKey = {};
  arr.forEach(it => keysOf(it).forEach(k => { (byKey[k] = byKey[k] || []).push(it); }));
  const hasIgn = !!(ignore && ignore.size);
  Object.keys(byKey).forEach(k => {
    const list = byKey[k];
    /* 「중복 아님」이 없으면 — 거의 언제나 그렇다 — 이 열쇠를 나눠 가진 것들은
       **전부** 이어진다. 짝마다 견줄 필요 없이 줄줄이 잇는다.
       ⚠ 이 빠른 길이 없으면 한 회사 대표이메일을 1,200장이 함께 쓸 때 짝을 72만 번
         견주게 되어(74ms) 찾기칸에 글자를 칠 때마다 화면이 걸린다. */
    if (!hasIgn){
      for (let i = 1; i < list.length; i++) parent[find(list[0].id)] = find(list[i].id);
      return;
    }
    for (let i = 0; i < list.length; i++)
      for (let j = i + 1; j < list.length; j++)
        if (find(list[i].id) !== find(list[j].id) && dupLinked(list[i], list[j], ignore, keysOf))
          parent[find(list[i].id)] = find(list[j].id);
  });
  const groups = {};
  arr.forEach(it => { const r = find(it.id); (groups[r] = groups[r] || []).push(it); });
  return Object.values(groups).filter(g => g.length > 1);
}

/* 배지를 붙일 명함 번호들 — 표가 이것으로 ⚠중복 을 그린다.
   ⚠ 묶기와 **같은 함수**를 쓴다. 예전에는 배지가 열쇠 개수만 세어, 「중복 아님」을
     눌러도 배지가 그대로 남았다. */
function dupIdSet(items, ignore){
  const s = new Set();
  dupGroupsOf(items, ignore).forEach(g => g.forEach(it => s.add(it.id)));
  return s;
}

/* 이 명함이 든 묶음 하나만 */
function dupGroupFor(items, id, ignore){
  const g = dupGroupsOf(items, ignore).find(x => x.some(it => it.id === id));
  return g || [];
}

/* 이름이 하나로 모이나 → 확실한 중복인가.
   빈 이름은 셈에서 뺀다(사업자등록증은 이름 칸이 없다). */
function dupSameName(group){
  const names = new Set((group||[])
    .map(x => String(x.name||'').toLowerCase().replace(/\s/g,''))
    .filter(Boolean));
  return names.size <= 1;
}

/* 기본으로 남길 것 — 가장 최근에 고친 것. 사람이 라디오로 바꿀 수 있다. */
function dupPickKeeper(group){
  const g = (group||[]).slice().sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));
  return g.length ? g[0].id : '';
}

/* 칸별 비교표 — 무엇이 다른지 **눈으로 보여야** 판단이지 도박이 아니다.
   state 는 네 가지.
     same     다 같음 (표에서 흐리게)
     fill     한쪽이 비어 있음 → 합치면 채워진다
     diff     값이 다름 → 합치면 메모에 [병합] 으로 남는다
     namediff 이름이 다름 → **다른 사람일 수 있다.** 가장 세게 알린다
   값이 다 비어 있는 칸은 아예 넣지 않는다 — 빈 줄만 스무 개면 다른 것이 안 보인다. */
function dupFieldRows(group, fields){
  const norm = v => String(v==null?'':v).toLowerCase().replace(/[\s\-]/g,'');
  const out = [];
  (fields||[]).forEach(f => {
    const key = f[0], label = f[1];
    const vals = group.map(it => String(it[key]==null?'':it[key]).trim());
    if (!vals.some(Boolean)) return;                       /* 아무도 안 적은 칸 */
    const filled = vals.filter(Boolean);
    const uniq = new Set(filled.map(norm));
    let state = 'same';
    if (uniq.size > 1) state = (key === 'name') ? 'namediff' : 'diff';
    else if (filled.length < vals.length) state = 'fill';
    out.push({ key: key, label: label, vals: vals, state: state });
  });
  return out;
}

/* ══════ 중복 판단 — 화면 ══════ */

/* 「중복 아님」으로 적어 둔 짝 — **이 PC에만** 남긴다(대표 결정 2026-08-10).
   유사 항목 검사의 무시 목록과 같은 방식이다. 서버 규칙을 손대지 않아 가볍다. */
function dupIgnoreSet(){
  try{ return new Set(JSON.parse(localStorage.getItem(DUP_IGNORE_LS)||'[]')); }catch(_){ return new Set(); }
}
function dupIgnoreSave(set){
  try{ localStorage.setItem(DUP_IGNORE_LS, JSON.stringify([...set].slice(-5000))); }catch(_){}
}
/* 묶음 안의 **모든 짝**을 적어 둔다 — 하나만 적으면 셋 이상 겹친 묶음이 안 풀린다 */
function dupIgnoreAdd(ids){
  const s = dupIgnoreSet();
  for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++) s.add(dupIgnoreKey(ids[i],ids[j]));
  dupIgnoreSave(s); return s;
}

/* 지금 종류의 명함 전부 — 개인 폴더(잠금) 명함은 넣지 않는다.
   ⚠ 공용 목록에 개인 명함이 옆에 나오면 숨긴 사실 자체가 드러난다. */
function dupPool(){ return Object.values(state.items).filter(it=>it.kind===state.tab); }

let _dupFixIds = [];      /* 지금 팝업이 다루는 명함들 */
let _dupFixKeep = '';     /* 남길 것 */

/* ⚠중복 을 눌렀을 때 */
function openDupFix(id){
  const group = dupGroupFor(dupPool(), id, dupIgnoreSet());
  if (group.length < 2){
    /* 방금 다른 화면에서 정리된 뒤일 수 있다 — 표를 다시 그려 배지를 없앤다 */
    toast('겹친 명함이 없습니다 — 이미 정리된 것 같습니다');
    render(); return;
  }
  /* 최근에 고친 것을 왼쪽에 — 남길 것이 맨 앞이면 눈이 편하다 */
  _dupFixIds = group.slice().sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0)).map(x=>x.id);
  _dupFixKeep = dupPickKeeper(group);
  drawDupFix();
}

function drawDupFix(){
  const group = _dupFixIds.map(i=>state.items[i]).filter(Boolean);
  if (group.length < 2){ dedupBg.classList.remove('open'); render(); return; }
  const fields = (state.tab==='card' ? CARD_FIELDS : BIZ_FIELDS);
  const rows = dupFieldRows(group, fields);
  const okName = dupSameName(group);
  const title = state.tab==='card'
    ? (group[0].name||group[0].company||'(이름 없음)')
    : (group[0].company||'(상호 없음)');
  const ignN = dupIgnoreSet().size;
  const others = dupGroupsOf(dupPool(), dupIgnoreSet()).length - 1;

  /* 무엇 때문에 겹쳤는지 한 줄로 — 「왜 이게 중복인가」에 먼저 답한다 */
  const why = (function(){
    const shared = rows.filter(r=>r.state==='same' && ['mobile','email','bizno'].indexOf(r.key)>=0)
      .map(r=>r.label);
    if (rows.some(r=>r.state==='same' && r.key==='name')) shared.unshift('이름');
    return shared.length ? shared.join('·')+'이(가) 같습니다' : '열쇠가 겹칩니다';
  })();

  let h = `<div class="mhead"><b>⚠ 겹친 ${state.tab==='card'?'명함':'사업자등록증'} ${group.length}장</b>
      <span style="font-size:12.5px;color:var(--sub);font-weight:400;margin-left:6px">${esc(title)}</span>
      ${_closeBtn()}</div>`;

  h += okName
    ? `<div class="dupok">✓ ${esc(why)}. 이름도 같아 <b>같은 사람</b>으로 보입니다 — 합쳐도 됩니다.</div>`
    : `<div class="dupwarn"><b>이름이 서로 다릅니다.</b> ${esc(why)} — 회사 대표번호·대표이메일을
         여럿이 함께 쓰는 경우일 수 있습니다. <b>합치면 한 사람이 사라지고 되돌려도 원래대로
         돌아오지 않습니다.</b> 다른 사람이면 아래 「중복 아님」을 눌러 주세요.</div>`;

  h += `<div class="dupwrap"><table class="duptbl"><thead><tr><th class="k"></th>`;
  group.forEach(it=>{
    const on = _dupFixKeep===it.id;
    h += `<th class="${on?'keep':''}">
      <label><input type="radio" name="dupkeep" ${on?'checked':''}
        onchange="dupFixPick('${it.id}')"> 남길 것</label>
      <span>${fmtDate(it.updatedAt||it.createdAt)}</span>
      ${it.owner?`<span>담당 ${esc(it.owner)}</span>`:''}</th>`;
  });
  h += `</tr></thead><tbody>`;
  rows.forEach(r=>{
    h += `<tr class="s-${r.state}"><td class="k">${esc(r.label)}</td>`;
    r.vals.forEach((v,i)=>{
      const on = _dupFixKeep===group[i].id;
      h += `<td class="${on?'keep':''}">${v ? esc(v) : '<i>비어 있음</i>'}</td>`;
    });
    h += `</tr>`;
  });
  h += `</tbody></table></div>
    <div class="dupleg">
      <span class="s-namediff">다른 사람일 수 있음</span>
      <span class="s-diff">값이 다름 — 메모에 남습니다</span>
      <span class="s-fill">빈 칸을 채웁니다</span>
    </div>
    <div class="dupacts">
      <button class="btn primary" onclick="dupFixMerge()">한 장으로 합치기</button>
      <button class="btn ghost danger" onclick="dupFixTrash()">고른 것만 남기고 휴지통</button>
      <button class="btn ghost" onclick="dupFixNotDup()">중복 아님</button>
    </div>
    <p class="dupnote">합치기 — 고른 것을 바탕으로 빈 칸을 채우고, 값이 다르면 메모에 <b>[병합]</b>으로 남깁니다. 사진도 지킵니다.<br>
      휴지통 — 30일 안에 되살릴 수 있습니다 (환경설정 → 정리 → 휴지통).</p>
    <div class="dupfoot">
      ${others>0
        ? `<span>이 종류에 겹친 묶음이 <b>${others}개</b> 더 있습니다</span>
           <button class="btn ghost" style="margin-left:auto" onclick="openDedup()">한 번에 정리 →</button>`
        : `<span>겹친 묶음은 이것뿐입니다</span>`}
    </div>
    ${ignN ? `<div class="dupfoot"><span>「중복 아님」으로 적어 둔 짝 <b>${ignN}</b>건 (이 PC)</span>
        <button class="btn ghost" style="margin-left:auto" onclick="openDupIgnored()">보기·되돌리기</button></div>` : ''}`;
  showPanel(h);
}
function dupFixPick(id){ _dupFixKeep=id; drawDupFix(); }

async function dupFixMerge(){
  const group = _dupFixIds.map(i=>state.items[i]).filter(Boolean);
  if (group.length<2) return;
  /* 이름이 엇갈리면 한 번 더 묻는다 — 이 한 번이 사람 한 명을 지킨다 */
  if (!dupSameName(group) &&
      !confirm(`이름이 서로 다릅니다 (${group.map(x=>x.name||'(없음)').join(' / ')}).\n`+
               `다른 사람이면 합치면 안 됩니다.\n\n정말 한 장으로 합칠까요?`)) return;
  await mergeGroup(_dupFixIds, _dupFixKeep);
  dedupBg.classList.remove('open');
  render();
  toast('✅ 한 장으로 합쳤습니다 — 값이 다른 것은 메모에 남았습니다',6000);
}

async function dupFixTrash(){
  const drop = _dupFixIds.filter(i=>i!==_dupFixKeep);
  if (!drop.length) return toast('지울 것이 없습니다');
  const keep = state.items[_dupFixKeep]||{};
  if (!confirm(`「${keep.name||keep.company||'고른 명함'}」 하나만 남기고 ${drop.length}장을 휴지통으로 옮깁니다.\n`+
               `30일 안에 되살릴 수 있습니다. 진행할까요?`)) return;
  for (const id of drop) await Store.del(id);
  dedupBg.classList.remove('open');
  render();
  toast(`🗑 ${drop.length}장을 휴지통으로 옮겼습니다 — 되살리려면 환경설정 → 정리 → 휴지통`,7000);
}

function dupFixNotDup(){
  dupIgnoreAdd(_dupFixIds.slice());
  dedupBg.classList.remove('open');
  render();
  toast('겹친 것 아님으로 적었습니다 — 이 PC에서 ⚠중복 표시가 사라집니다',6000);
}

/* 「중복 아님」 목록 — 되돌릴 길이 없는 지우기는 만들지 않는다 */
function openDupIgnored(){
  const s = dupIgnoreSet();
  if (!s.size) return toast('적어 둔 것이 없습니다');
  const nameOf = id => { const it=state.items[id]; return it ? (it.name||it.company||id) : '(지워진 명함)'; };
  let h = `<div class="mhead"><b>중복 아님으로 적어 둔 짝 — ${s.size}건</b>${_closeBtn()}</div>
    <p style="font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:10px">
      이 PC에만 적혀 있습니다. 지우면 ⚠중복 표시가 다시 나타납니다.</p>`;
  [...s].slice(-200).reverse().forEach(k=>{
    const [a,b]=k.split('~');
    h += `<div class="ditem" style="align-items:center"><div class="v">
      <b>${esc(nameOf(a))}</b> <span style="color:var(--sub)">↔</span> <b>${esc(nameOf(b))}</b></div>
      <button class="btn ghost" style="flex:none;padding:8px 14px" onclick="dupUnignore('${k}')">되돌리기</button></div>`;
  });
  if (s.size>200) h += `<p style="color:var(--sub);font-size:12px;padding:8px 2px">…외 ${s.size-200}건</p>`;
  showPanel(h);
}
function dupUnignore(key){
  const s = dupIgnoreSet(); s.delete(key); dupIgnoreSave(s);
  render(); openDupIgnored();
}

/* ════════════ 🔍 유사 항목 검사 (완전중복은 아니지만 같은 사람일 수 있는 명함) ════════════ */
const _simNorm  = s => String(s||'').toLowerCase().replace(/\s/g,'');
const _tail8    = s => { const d=digits(s); return d.length>=8 ? d.slice(-8) : ''; };
const _emailDom = s => { const m=String(s||'').toLowerCase().match(/@([^@\s]+)$/); return m?m[1]:''; };
function _simIgnoreSet(){ try{ return new Set(JSON.parse(localStorage.getItem('pucards_sim_ignore')||'[]')); }catch(_){ return new Set(); } }
function _simIgnoreSave(set){ try{ localStorage.setItem('pucards_sim_ignore', JSON.stringify([...set].slice(-5000))); }catch(_){} }
const _pairSig = (a,b) => [a,b].sort().join('~');
function _isExactDup(a,b){ const ka=new Set(rowKeys(a)); return rowKeys(b).some(k=>ka.has(k)); }
/* 같은 사람일 가능성이 있으나 완전중복은 아닌지 판단 */
function _isSimilar(a,b){
  if(_isExactDup(a,b)) return false;   /* 완전중복은 '중복 정리'가 담당 */
  const nEq=_simNorm(a.name)    && _simNorm(a.name)===_simNorm(b.name);
  const cEq=_simNorm(a.company) && _simNorm(a.company)===_simNorm(b.company);
  const tEq=_tail8(a.mobile)    && _tail8(a.mobile)===_tail8(b.mobile);
  const dEq=_emailDom(a.email)  && _emailDom(a.email)===_emailDom(b.email);
  const cEmpty=!_simNorm(a.company) || !_simNorm(b.company);
  /* 같은 이름 + (같은 회사/전화뒤8/이메일도메인/한쪽 회사없음)  또는  전화뒤8 같고 이름·회사 중 하나 일치 */
  return !!((nEq && (cEq||tEq||dEq||cEmpty)) || (tEq && (nEq||cEq)));
}
function findSimilarGroups(){
  const arr=Object.values(state.items).filter(it=>it && it.kind==='card');
  const ignore=_simIgnoreSet();
  /* 후보 축소: 이름·전화뒤8 버킷 안에서만 비교(전수비교 회피) */
  const buckets={};
  const addB=(k,it)=>{ if(!k) return; (buckets[k]=buckets[k]||[]).push(it); };
  arr.forEach(it=>{ addB('n'+_simNorm(it.name), it); addB('t'+_tail8(it.mobile), it); });
  const parent={}; arr.forEach(it=>parent[it.id]=it.id);
  const find=x=>parent[x]===x?x:(parent[x]=find(parent[x]));
  const uni=(a,b)=>{ parent[find(a)]=find(b); };
  const pairSeen=new Set(); let unioned=0;
  Object.values(buckets).forEach(items=>{
    if(items.length<2 || items.length>40) return;   /* 흔한 이름 등 너무 큰 묶음은 스킵(노이즈·성능) */
    for(let i=0;i<items.length;i++) for(let j=i+1;j<items.length;j++){
      const a=items[i], b=items[j]; const sig=_pairSig(a.id,b.id);
      if(pairSeen.has(sig)) continue; pairSeen.add(sig);
      if(ignore.has(sig)) continue;
      if(_isSimilar(a,b)){ if(find(a.id)!==find(b.id)){ uni(a.id,b.id); unioned++; } }
    }
  });
  if(!unioned) return [];
  const g={};
  arr.forEach(it=>{ const r=find(it.id); (g[r]=g[r]||[]).push(it); });
  return Object.values(g).filter(x=>x.length>1);
}
function openSimilar(){
  const groups=findSimilarGroups();
  if(!groups.length){
    const msg='유사한 명함이 없습니다 👍';
    if(_panelTarget==='inline') return showPanel(`<div style="padding:22px;text-align:center;color:var(--sub);font-size:13px;line-height:1.8">${msg}</div>`);
    return toast(msg);
  }
  let h=`<div class="mhead"><b>🔍 유사 항목 — ${groups.length}묶음</b>
    ${_closeBtn()}</div>
    <p style="font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:10px">

/* ════════════ 🧹 깨진 글자(인코딩 오류) 명함 정리 → 휴지통 ════════════
   UTF-8 한글을 라틴으로 잘못 읽으면 'ì¶œ ë°œ'처럼 깨진다. 정상 한글(U+AC00~) 없이
   연속바이트(U+0080~U+00BF)가 2개 이상이면 깨진 것으로 판정. */
function _hasMojibake(s){ s=String(s||'');
  if(/[가-힣]/.test(s)) return false;               /* 정상 한글이 있으면 안 깨진 것 */
  return (s.match(/[\u0080-\u02FF\u2010-\u2122\u20AC]/g)||[]).length >= 2;   /* 라틴 깨짐 문자 2개+ */
}
function itemMojibake(it){
  return _hasMojibake(it.name)||_hasMojibake(it.company)||_hasMojibake(it.title)
       ||_hasMojibake(it.dept)||_hasMojibake(it.companyAddr)||_hasMojibake(it.address);
}
async function openMojibakeCleanup(){
  const bad=Object.values(state.items).filter(it=>it&&it.kind==='card'&&itemMojibake(it));
  if(!bad.length) return toast('깨진 글자 명함이 없습니다 👍');
  const sample=bad.slice(0,6).map(it=>it.name||it.company||'(빈)').join(', ');
  if(!confirm(`글자가 깨진(인코딩 오류) 명함 ${bad.length}장을 발견했습니다.\n예: ${sample} …\n\n휴지통으로 보낼까요? (30일간 복구 가능)\n· 잘못된 CSV 가져오기로 생긴 것들입니다.\n· 보낸 뒤 올바르게 다시 가져오면 됩니다.`)) return;
  toast('정리 중…',9000);
  if(Store.mode==='firebase'){
    const now=Date.now();
    for(let s=0;s<bad.length;s+=200){
      const chunk=bad.slice(s,s+200), trashUpd={}, itemUpd={};
      chunk.forEach(it=>{ trashUpd[it.id]={...it,_deletedAt:now,_photo:'',_photo2:''}; itemUpd[it.id]=null; removeIdx(it.id, it); });
      try{ await Store.db.ref(DB_ROOT+'/trash').update(trashUpd);
           await Store.db.ref(DB_ROOT+'/items').update(itemUpd);
           chunk.forEach(it=>{ Store.delPhoto(it.id); Store.delPhoto(it.id+'_b');
                               Store.delThumb(it.id); Store.delThumb(it.id+'_b'); });
      }catch(e){ console.warn('[mojibake]', e&&e.message); }
      toast(`정리 중… ${Math.min(s+200,bad.length).toLocaleString()}/${bad.length.toLocaleString()}`,5000);
    }
  } else { bad.forEach(it=>Store.del(it.id)); }
  toast(`✅ 깨진 명함 ${bad.length.toLocaleString()}장을 휴지통으로 보냈습니다 (30일 복구 가능)`,7000);
  render();
}
/* ════════════ 🏢 이름 칸에 회사·기관명이 들어간 명함 정리 ════════════
   예) 이름='청풍중학교' → 회사로 이동 / 이름='가성훈사장-창성산업' → 이름·직책·회사로 분리 */
const _SURNAME = new Set('김이박최정강조윤장임한오서신권황안송류전홍고문양손배백허유남심노하곽성차주우구나민진지엄채원천방공현함변염여추도소석선설마길연위표명기반왕금옥육인맹제모탁국어은편용봉'
  + '가간갈감견경계동두라목미범복부빈사상승시종좌창태평피해형호화후흥');   /* 드문 성씨도 포함 (가성훈·계미정 등) */
const _MULTI_SN = ['남궁','황보','제갈','사공','선우','서문','독고','동방'];
const _ORG_KW = ['공사','공단','위원회','노동청','지청','센터','협회','조합','학교','대학','병원','의원','약국','은행','산업',
 '엔지니어링','테크','전자','식품','건설','물산','상사','기업','법인','사무소','세무','회계','법률','관광','마트','식당',
 '카페','호텔','모텔','농장','축산','정밀','기계','화학','제약','물류','운수','택배','공업','설비','시스템','솔루션',
 '컨설팅','노무','인력','건축','설계','자동차','부품','금속','철강','섬유','유통','무역','통신','정보','미디어','교육',
 '학원','어린이집','유치원','복지관','재단','지사','지점','공장','연구소','진흥원','보험','증권','농협','수협','시청',
 '군청','구청','주민센터','경찰서','소방서','세무서','치과','한의','요양','그룹','코리아','서비스','고속','개발'];
const _TITLE_SFX = ['대표이사','부사장','전무이사','상무이사','사무국장','본부장','센터장','조합장','위원장','사장','회장',
 '원장','대표','전무','상무','이사','부장','차장','과장','대리','주임','팀장','실장','소장','국장','반장','기사','교수',
 '선생','노무사','변호사','세무사','회계사','법무사','조정관','조사관','감독관','주무관','사무관','담당자','총무','님'];
/* 엄격 판정 — 고칠 필요가 있는지(성씨로 시작하는 2~3자 한글) */
function _isPersonName(s){
  s=String(s||'').trim();
  if(!/^[가-힣]{2,4}$/.test(s)) return false;
  if(_ORG_KW.some(k=>s.includes(k))) return false;
  if(_MULTI_SN.some(m=>s.startsWith(m))) return true;
  if(s.length>3) return false;
  return _SURNAME.has(s[0]);
}
/* 느슨한 판정 — 이미 '이름-회사'나 '이름+호칭' 형태로 쪼갠 조각이 사람 이름인지
   (드문 성씨 '가·간·견' 등도 살리되, 4자 이상 상호는 배제) */
function _looksPerson(s){
  s=String(s||'').trim();
  if(_ORG_KW.some(k=>s.includes(k))) return false;
  if(_MULTI_SN.some(m=>s.startsWith(m)) && /^[가-힣]{3,4}$/.test(s)) return true;
  return /^[가-힣]{2,3}$/.test(s);
}
/* 이름 뒤 호칭·직책 떼기 — '님' 먼저 떼고 긴 것부터 맞춰본다 */
function _stripTitle(s){
  s=String(s||'').trim();
  if(s.endsWith('님') && s.length>1) s=s.slice(0,-1).trim();
  const sorted=_TITLE_SFX.filter(t=>t!=='님').sort((a,b)=>b.length-a.length);
  for(const t of sorted){ if(s.endsWith(t) && s.length>t.length) return [s.slice(0,-t.length).trim(), t]; }
  return [s,''];
}
/* 한 건을 어떻게 고칠지 계산 — 고칠 필요 없으면 null */
function nameFixPlan(it){
  const nm=String(it.name||'').trim(); if(!nm) return null;
  if(_isPersonName(nm)) return null;                       /* 정상 */
  const co=String(it.company||'').trim();
  /* 1) '가성훈사장-창성산업' 처럼 구분자로 사람·회사가 붙은 경우 */
  const m=nm.split(/\s*[-–—_·]\s*/).filter(Boolean);
  if(m.length===2){
    const r=_stripTitle(m[0]);
    if(_looksPerson(r[0])){
      return { type:'분리', sure:true, name:r[0], company:(co||m[1]), title:(it.title||r[1]||''), dept:it.dept||'',
               memo:(co&&co!==m[1]) ? [it.memo,m[1]].filter(Boolean).join(' / ') : (it.memo||'') };
    }
  }
  /* 2) '홍영숙선생님' 처럼 사람+호칭 */
  const b=_stripTitle(nm);
  if(b[0]!==nm && _looksPerson(b[0])){
    return { type:'호칭분리', sure:true, name:b[0], company:co, title:(it.title||b[1]||''), dept:it.dept||'', memo:it.memo||'' };
  }
  /* 3) 기관·상호 → 회사 칸으로 (기존 회사값은 부서·메모로 보존) */
  const plan={ type:'회사로', sure:_ORG_KW.some(k=>nm.includes(k)), name:'', company:nm,
               title:it.title||'', dept:it.dept||'', memo:it.memo||'' };
  if(co && co!==nm){ if(!plan.dept) plan.dept=co; else plan.memo=[plan.memo,co].filter(Boolean).join(' / '); }
  return plan;
}
function nameFixList(){
  return Object.values(state.items)
    /* 한 번 고친 명함은 다시 잡지 않는다 (또 고치면 이름이 회사로 밀려남) */
    .filter(it=>it && it.kind===state.tab && !it.nameFixed && !inHiddenLocked(it))
    .map(it=>({it:it, plan:nameFixPlan(it)}))
    .filter(x=>x.plan);
}
function applyNameFix(id){
  const it=state.items[id]; if(!it) return;
  const p=nameFixPlan(it); if(!p) return;
  it.name=p.name; it.company=p.company; it.title=p.title; it.dept=p.dept; it.memo=p.memo;
  it.nameFixed=1; it.updatedAt=Date.now(); Store.put(it);
}
function autoNameFixSure(){
  const list=nameFixList().filter(x=>x.plan.sure);
  if(!list.length) return toast('자동으로 고칠 수 있는 항목이 없습니다');
  if(!confirm(`확실한 ${list.length.toLocaleString()}건을 자동으로 정리할까요?\n\n· 이름 칸의 회사·기관명을 회사 칸으로 옮깁니다\n· 사람+회사가 붙은 것은 이름·직책·회사로 나눕니다\n· 명함은 삭제되지 않습니다`)) return;
  let n=0; list.forEach(x=>{ applyNameFix(x.it.id); n++; });
  toast(`✅ ${n.toLocaleString()}건을 정리했습니다`,5000);
  render(); setTimeout(function(){_refresh(openNameFix)}, 120);
}
function openNameFix(){
  const list=nameFixList();
  if(!list.length){
    const msg='이름 칸이 이상한 명함이 없습니다 👍';
    if(_panelTarget==='inline') return showPanel(`<div style="padding:22px;text-align:center;color:var(--sub);font-size:13px;line-height:1.8">${msg}</div>`);
    $('dedupBg').classList.remove('open'); return toast(msg);
  }
  const sureN=list.filter(x=>x.plan.sure).length;
  let h=`<div class="mhead"><b>🏢 이름 칸에 회사명 — ${list.length.toLocaleString()}건</b>
    ${_closeBtn()}</div>
    <p style="font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:10px">
    이름 자리에 <b>회사·기관명</b>이 들어간 명함이에요. 고치면 회사 칸으로 옮겨지고, 사람+회사가 붙은 것은 나눠집니다.
    <b>명함은 지워지지 않습니다.</b></p>
    ${sureN?`<button class="btn primary" style="width:100%;margin-bottom:12px" onclick="autoNameFixSure()">⚡ 확실한 ${sureN.toLocaleString()}건 자동 정리</button>`:''}`;
  list.slice(0,200).forEach(function(x){
    const it=x.it, plan=x.plan;
    const after=[plan.name?'이름 '+esc(plan.name):'', plan.company?'회사 '+esc(plan.company):'',
                 plan.title?'직책 '+esc(plan.title):'', plan.dept?'부서 '+esc(plan.dept):''].filter(Boolean).join(' · ');
    h+=`<div class="ditem" style="align-items:center"><div class="v">
      <span style="font-size:11px;color:${plan.sure?'#0f7a44':'#9a5b00'};font-weight:700">${plan.sure?'확실':'검토'} · ${plan.type}</span><br>
      <b>${esc(it.name||'')}</b>${it.company?` <span style="color:var(--sub);font-size:12px">/ ${esc(it.company)}</span>`:''}<br>
      <span style="font-size:12px;color:#0f7a44">→ ${after}</span></div>
      <button class="btn ghost" style="flex:none;padding:8px 14px" onclick="applyNameFix('${it.id}');render();setTimeout(function(){_refresh(openNameFix)},80)">고치기</button></div>`;
  });
  if(list.length>200) h+=`<p style="color:var(--sub);font-size:12px;padding:8px 2px">…외 ${(list.length-200).toLocaleString()}건 (자동 정리를 쓰면 한 번에 처리됩니다)</p>`;

/* ════════════ 📞 이름·회사 칸에 전화번호·주소가 통째로 들어간 명함 정리 ════════════
   예) '아름다운정원화수목 041-415-0815 산33 천안시 동남구' → 회사·전화·주소로 분리 */
const _PHONE_RE = /(0\d{1,2}[-.\s]?\d{3,4}[-.\s]?\d{4}|1[5-8]\d{2}[-.\s]?\d{4})/g;
const _PROV_RE = /^(서울특별시|부산광역시|대구광역시|인천광역시|광주광역시|대전광역시|울산광역시|세종특별자치시|경기도|강원도|강원특별자치도|충청북도|충청남도|전라북도|전라남도|전북특별자치도|경상북도|경상남도|제주특별자치도|제주도|서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)$/;
const _isAddrTok = t => /^(산)?\d+[-\d]*$/.test(t)
  || _PROV_RE.test(t)
  || /(특별시|광역시|자치시|자치도)$/.test(t)
  || /^[가-힣]{2,8}(시|군|구|읍|면|동|리|로|길|가)$/.test(t);
/* 뒤섞인 문자열을 회사명 · 전화들 · 주소로 나눈다 */
function splitMixed(s){
  s=String(s||'').trim();
  const phones=[];
  s=s.replace(_PHONE_RE,(m)=>{ phones.push(m.trim().replace(/[.\s]/g,'-')); return ' '; });
  const toks=s.split(/\s+/).filter(Boolean);
  let cut=-1;
  for(let i=0;i<toks.length;i++){ if(_isAddrTok(toks[i])){ cut=i; break; } }
  let addr='';
  if(cut>0){                       /* 앞에 회사명이 남아 있을 때만 주소로 인정 */
    const tail=toks.slice(cut);
    if(tail.length>=2 || /(시|군|구|도)$/.test(tail[0])){ addr=tail.join(' '); toks.length=cut; }
  }
  return { text:toks.join(' ').trim(), phones, addr };
}
function mixedFixPlan(it){
  const src=String(it.name||'').trim() || String(it.company||'').trim();
  if(!src) return null;
  if(!_PHONE_RE.test(src)){ _PHONE_RE.lastIndex=0; return null; }
  _PHONE_RE.lastIndex=0;
  const r=splitMixed(src);
  if(!r.text) return null;                      /* 회사명이 안 남으면 손대지 않음 */
  const p={ company:r.text, name:'', mobile:it.mobile||'', companyTel:it.companyTel||'',
            companyFax:it.companyFax||'', companyAddr:it.companyAddr||'' };
  r.phones.forEach(ph=>{
    const d=digits(ph);

async function mergeSimilar(csv){ await mergeGroup(csv.split(',')); toast('병합 완료'); _refresh(openSimilar); }
function ignoreSimilar(csv){

/* ════════════ 🔗 ERP 대표자·담당자 대조 (업체관리에 있는데 명함첩에 없는 이름 찾기) ════════════ */
function findErpNameMismatch(){
  if(!ErpMatch.ready || !ErpMatch.companies) return null;
  const cards=Object.values(state.items).filter(it=>it&&it.kind==='card'&&it.name);
  const cardsByCo={};
  cards.forEach(it=>{ const k=ErpMatch._norm(it.company); if(k) (cardsByCo[k]=cardsByCo[k]||[]).push(it); });
  const rows=[];
  ErpMatch.companies.forEach(co=>{
    if(!co) return;
    const erpNames=[];
    if(co.ceo)  erpNames.push({role:'대표자', name:co.ceo});
    if(co.ceo2) erpNames.push({role:'대표자2', name:co.ceo2});
    [ ...((co.contacts||[]).map(c=>c&&c.name)), co.primaryContactName, co.contactName ]
      .filter(Boolean).forEach(nm=>erpNames.push({role:'담당자', name:nm}));
    if(!erpNames.length) return;
    let coCards=(cardsByCo[ErpMatch._norm(co.name)]||[]).slice();
    const bd=ErpMatch._digits(co.bizNo);
    if(bd.length>=10) cards.forEach(it=>{ if(ErpMatch._digits(it.bizno)===bd && coCards.indexOf(it)<0) coCards.push(it); });
    const cardNames=coCards.map(it=>ErpMatch._norm(it.name)).filter(Boolean);
    const missing=erpNames.filter(en=>{ const nn=ErpMatch._norm(en.name); if(!nn) return false;
      return !cardNames.some(cn=>ErpMatch._nameHit(cn,nn)); });
    if(missing.length) rows.push({ company:co.name||'(회사명없음)', bizNo:co.bizNo||'',
      missing:missing.map(m=>m.role+': '+m.name), haveCards:coCards.length });
  });
  return rows;
}
function openErpNameCheck(){
  const msg=(t)=>{ if(_panelTarget==='inline') return showPanel(
    `<div style="padding:22px;text-align:center;color:var(--sub);font-size:13px;line-height:1.8">${t}</div>`);
    toast(t,5000); };
  if(Store.mode!=='firebase') return msg('ERP 연결(Firebase) 상태에서만 대조할 수 있습니다');
  if(!ErpMatch.ready) return msg('ERP 업체관리 데이터를 불러오는 중입니다. 잠시 후 다시 눌러 주세요.');
  const rows=findErpNameMismatch();
  if(!rows) return msg('ERP 데이터를 아직 못 읽었습니다. 잠시 후 다시 시도하세요.');
  if(!rows.length) return msg('✅ 불일치 없음 — ERP 대표자·담당자가 모두 명함첩에 있습니다');
  rows.sort((a,b)=>b.missing.length-a.missing.length);
  let h=`<div class="mhead"><b>🔗 ERP 대표자·담당자 대조 — ${rows.length}개 회사</b>
    ${_closeBtn()}</div>
    <p style="font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:10px">
    푸른이알피 업체관리엔 <b>등록돼 있는데 명함첩엔 없는</b> 대표자·담당자예요. 명함을 추가하거나 이름 철자를 맞추면 연결됩니다.</p>`;
  rows.slice(0,200).forEach(r=>{
    h+=`<div class="ditem"><div class="v"><b>${esc(r.company)}</b>${r.bizNo?` <span style="color:var(--sub);font-size:11px">${esc(fmtBizno(r.bizNo))}</span>`:''}<br>
      <span style="color:var(--orange);font-size:12.5px">명함첩에 없음 — ${esc(r.missing.join(', '))}</span>
      <span style="color:var(--sub);font-size:11.5px"> · 이 회사 명함 ${r.haveCards}장</span></div></div>`;
  });
  if(rows.length>200) h+=`<p style="color:var(--sub);font-size:12px;padding:8px 2px">…외 ${rows.length-200}개 회사</p>`;
  showPanel(h);
}

/* ════════════ 📤 엑셀 내보내기 ════════════ */
async function exportXlsx(){
  await needXLSX();
  const isCard = state.tab==='card';
  const fields = isCard ? CARD_FIELDS : BIZ_FIELDS;
  /* 선택된 항목이 있으면 그것만, 없으면 전체 */
  const selIds = Object.keys(state.sel);
  let targets = Object.values(state.items).filter(it=>it.kind===state.tab);
  let scopeLabel = '전체';
  if (selIds.length){ targets = targets.filter(it=>state.sel[it.id]); scopeLabel = `선택${selIds.length}건`; }
  const rows = targets
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))
    .map(it=>{ const o={};
      fields.forEach(([k,l])=> o[l] = k==='bizno' ? fmtBizno(it[k]) : (it[k]||''));
      o['그룹'] = it.group && state.groups[it.group] ? state.groups[it.group].name : '';
      o['등록일'] = fmtDate(it.createdAt);
      return o; });
  if (!rows.length) return toast('내보낼 항목이 없습니다');
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, isCard?'명함':'사업자등록증');
  XLSX.writeFile(wb, `푸른명함첩_${isCard?'명함':'사업자등록증'}_${scopeLabel}_${fmtDate(Date.now())}.xlsx`);
  toast(`엑셀 파일을 내려받았습니다 (${scopeLabel} ${rows.length}건)`);
}

    const unlocked = isLocked && state.unlocked && state.unlocked[g.id];
    const icon = isPriv ? '🔓' : (isLocked ? (unlocked ? '🔓' : '🔒') : '📁');
    /* 폴더를 옮기면 앞 폴더의 탭 조건(ERP유형·칸검색)은 해제 — 탭은 폴더마다 따로이므로 */
    const reset = `state.view='list';state.owner='all';state.region='';state.erpFilter='';state.colFilter={};state.page=0;`;
    const openClick = isLocked
      ? `if(tryUnlockFolder('${g.id}')){state.group='${g.id}';${reset}}render()`
      : `state.group='${g.id}';${reset}render()`;
    /* 개인 창고 폴더는 끌어 옮기지 않는다 — 공용 자리로 떨어지면 그 자리에서 드러난다 */
    if(isPriv) return `<div class="pcitem folderrow ${on?'on':''}" style="padding-left:11px">
        <span style="width:13px;display:inline-block"></span>
        <span class="gname" onclick="${openClick}" title="개인 폴더 — 대표님만 보입니다">${icon} ${esc(g.name)}</span>
        <span class="gcount">${n}</span>
        <span class="gmenu" onclick="event.stopPropagation();openFolderMenu(event,'${g.id}')" title="관리">⋮</span>
      </div>`;
    return `<div class="pcitem folderrow ${on?'on':''}" style="padding-left:11px"
        draggable="true"
        ondragstart="onFolderDrag(event,'${g.id}')"
        ondragend="this.classList.remove('dragging')"
        ondragover="event.preventDefault();this.classList.add('dropover')"
        ondragleave="this.classList.remove('dropover')" ondrop="onFolderOrCardDrop(event,'${g.id}')">
        <span style="width:13px;display:inline-block"></span>
        <span class="gname" onclick="${openClick}">${icon} ${esc(g.name)}</span>
        <span class="gcount">${isLocked&&!unlocked?'🔒':n}</span>
        <span class="gmenu" onclick="event.stopPropagation();openFolderMenu(event,'${g.id}')" title="관리">⋮</span>
      </div>`;
  };
  h += `<div id="pcFolderList">`;
  groups.forEach(g=> h += folderRow(g));
  h += `</div>`;

  h += `<div class="pcsec">담당자별 (직원)</div>`;
  const owners=[...new Set(kindArr.map(it=>String(it.owner||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
  if (!owners.length)
    h += `<div class="pchintside">명함에 담당자를 입력하면<br>여기에 자동으로 분류됩니다</div>`;
  owners.forEach(o=>{
    h += pcItem(`onclick="state.view='list';state.owner='${esc(o)}';state.group='all';state.region='';state.page=0;render()"`,
      '👤 '+esc(o), kindArr.filter(it=>String(it.owner||'').trim()===o).length, state.owner===o);
  });

  /* 맨 아래 고정 환경설정 — 로그아웃은 오른쪽 위(#pcTopRight)로 옮겼다 */
  /* 옛 방식으로 잠긴 폴더가 남아 있으면 그것부터 알린다.
     그냥 두면 「🔒 개인폴더」(옛 방식, 비밀번호가 DB에 그대로)와
     「🔒 개인 폴더 열기」(새 방식)가 나란히 보여 같은 것이 둘로 보인다. */
  const oldLocked = Object.values(state.groups).filter(g=>g && g.locked).length;
  h += `<div class="pcside-bottom">
    ${state.isAdmin && oldLocked ? `<button class="pcside-settings" onclick="migrateLockedFolders()"
      style="background:#7a4a12;border-color:#a4671c"
      title="옛 방식으로 잠긴 폴더는 비밀번호가 그대로 저장돼 있어 직원이 들여다볼 수 있습니다. 대표님 전용 창고로 옮기면 서버가 막아 줍니다.">⚠ 옛 잠금 폴더 ${oldLocked}개 옮기기</button>` : ''}
    ${state.isAdmin ? `<button class="pcside-settings" onclick="openPrivateVault()"
      title="대표만 보는 개인 폴더 — 비밀번호를 맞혀야 자료를 가져옵니다">${state.privOpen?'🔓 개인 폴더 닫기':'🔒 개인 폴더 열기'}</button>` : ''}
    <button class="pcside-settings" onclick="openSettingsPage()" title="정리·데이터·연동·탭·계정 설정 (별도 화면으로 열림)">⚙️ 환경설정</button>
  </div>`;
  $('pcSide').innerHTML = h;
}
/* ── 메일 갈래의 왼쪽 메뉴 ──
   명함이 「전체 → 폴더 → 담당자별」이듯, 메일도 「전체 → 갈래별 → 보낸 사람별」로 둔다.
   갈래는 자료함의 갈래를 그대로 쓴다 — 무엇을 보냈는지가 곧 분류다.
   ⚠ 자료 없이 글만 보낸 메일이 어디에도 안 잡히면 사라진 것처럼 보인다 — 따로 한 줄 둔다. */
function mailSideHtml(){
  const rows = Object.values(state.sentBox||{}).filter(v=>v&&v.at);
  const cats = MAT_CATS_NOW();
  /* 이 메일이 어느 갈래인가 — 붙인 자료의 갈래. 여러 갈래가 섞이면 첫 자료를 따른다. */
  const catOf = v => {
    const ids = (v.ids||[]).filter(id=>_matMeta[id]);
    if(!ids.length) return '';
    return matCat(_matMeta[ids[0]]);
  };
  const nAll = rows.length;
  let h = '';
  /* 쓰기가 먼저다 — 제일 자주 누르는 것이 맨 위에 있어야 한다 (대표 지시 2026-08-10) */
  h += pcItem(`onclick="openMailPage()"`, '✏️ 메일 쓰기', undefined, !state.mailSent);
  h += pcItem(`onclick="openSentBox()"`, '📤 보낸 메일', nAll,
              state.mailSent===true && !state.sentCat && !state.sentBy);
  h += pcItem(`onclick="openSchedBox()"`, '⏰ 예약한 메일', schedList().length || undefined,
              state.mailSent==='sched');

  /* ── 나눠 보기 한 칸 ──
     예전에는 「보낸 자료 갈래」와 「보낸 사람별(직원)」이 각각 제목줄을 갖고 사람마다
     한 줄씩 늘어서, 직원이 늘수록 왼쪽이 사람 이름으로 가득 찼다.
     대표 지시 2026-08-10: "사람별로 이렇게 나오지 말고 하나의 대시보드 또는 폴더
     형태로" → 갈래와 사람을 **한 칸**에 넣고, 사람은 접어 둔다. */
  if(rows.length){
    h += `<div class="pcsec">보낸 메일 나눠 보기</div>`;
    cats.forEach(c=>{
      const n = rows.filter(v=>catOf(v)===c).length;
      if(!n) return;
      h += pcItem(`onclick="sentFilterCat('${esc(c)}')"`, '📁 '+esc(c), n, state.sentCat===c);
    });
    const nNone = rows.filter(v=>!catOf(v)).length;
    if(nNone) h += pcItem(`onclick="sentFilterCat('__none')"`, '✉️ 자료 없이 보낸 것', nNone, state.sentCat==='__none');

    /* 보낸 사람 — 한 줄로 접어 둔다. 누르면 그 아래에 사람이 펼쳐진다. */
    const bys = [...new Set(rows.map(v=>String(v.by||'').trim()).filter(Boolean))]
      .sort((a,b)=>staffName(a).localeCompare(staffName(b),'ko'));
    if(bys.length){
      const open = !!state.sentByOpen || !!state.sentBy;
      /* 접혔을 때도 **누가 보냈는지**는 보여야 의미가 있다 — 이름 몇 개를 적어 둔다 */
      const who = bys.map(staffName).slice(0,2).join(' · ') + (bys.length>2?` 외 ${bys.length-2}`:'');
      h += `<div class="pcitem pcfold ${open?'open':''}" onclick="toggleSentBy()">
        <span class="ic">${open?'▾':'▸'}</span>👥 보낸 사람
        <span class="who">${esc(who)}</span></div>`;
      if(open) bys.forEach(b=>{
        h += pcItem(`onclick="sentFilterBy('${esc(b)}')"`, '　👤 '+esc(staffName(b)),
                    rows.filter(v=>String(v.by||'')===b).length, state.sentBy===b);
      });
    }
  } else {
    h += `<div class="pchintside">아직 보낸 메일이 없습니다.<br>위 <b>메일 쓰기</b>로 보내 보세요</div>`;
  }

  /* ── 자료함을 메일 안의 폴더로 ──
     명함이 「폴더」를 갖듯 메일도 「자료 갈래」를 폴더로 갖는다 (대표 지시 2026-08-10).
     맨 아래 단추로 빼 두었더니 딴 곳에 있는 것처럼 보였다.
     여기서 갈래를 고르면 오른쪽 자료 서랍이 그 갈래만 보여 준다 — 편지를 쓰면서
     자료함까지 갔다 올 일이 없다. */
  const mats = matList();
  h += `<div class="pcsec" style="display:flex;align-items:center">📎 자료함
        <span onclick="openMatPage()" title="자료 올리기·이름·순서 관리"
          style="margin-left:auto;cursor:pointer;font-weight:700">＋</span></div>`;
  /* 관리 화면은 맨 아래에 있어서 자료를 보다가 고치려면 사이드바 끝까지 내려가야 했다.
     자료함 머리와 목록 사이에 두어 손이 바로 닿게 한다. */
  h += `<button class="pcside-mat" onclick="openMatPage()"
      title="자료 올리기·갈래·순서·묶음·메일 본문 틀">🗂 자료함 관리</button>`;
  h += pcItem(`onclick="pickMatCat('')"`, '📋 전체 자료', mats.length, !state.matPick);
  MAT_CATS_NOW().forEach(c=>{
    const n = mats.filter(m=>matCat(m)===c).length;
    if(!n) return;
    h += pcItem(`onclick="pickMatCat('${esc(c)}')"`, '📁 '+esc(c), n, state.matPick===c);
  });
  if(!mats.length) h += `<div class="pchintside">자료가 없습니다.<br>위 <b>＋</b> 로 올려주세요</div>`;

  h += `<div class="pcside-bottom">
    <button class="pcside-settings" onclick="openSettingsPage()" title="정리·데이터·연동·탭·계정 설정">⚙️ 환경설정</button>
  </div>`;
  return h;
}
/* 왼쪽에서 자료 갈래를 고르면 오른쪽 서랍이 그 갈래만 보인다.
   쓰기 화면이 아니면 쓰기 화면으로 옮겨 간다 — 자료를 고른다는 건 편지를 쓴다는 뜻이다. */
function pickMatCat(c){
  state.matPick = (state.matPick===c ? '' : c);
  if(state.mailSent) openMailPage(); else { renderPCSide(); renderMailPage(); }
}
function sentFilterCat(c){ state.mailSent=true; state.sentCat = (state.sentCat===c?'':c); state.sentBy=''; openSentBox(); }
function sentFilterBy(b){ state.mailSent=true; state.sentBy = (state.sentBy===b?'':b); state.sentCat=''; openSentBox(); }
/* 「보낸 사람」 접기·펼치기. 접을 때 골라 둔 사람도 함께 풀어야 목록과 왼쪽이 어긋나지 않는다 */
function toggleSentBy(){
  state.sentByOpen = !state.sentByOpen;
  if(!state.sentByOpen && state.sentBy){ state.sentBy=''; openSentBox(); return; }
  renderPCSide();
}

function switchTab(t){ state.view='list'; state.tab=t; state.group='all'; state.owner='all'; state.region='';
  state.erpFilter=''; state.colFilter={}; state.page=0; state.sel={}; state.view='list'; render(); }
function toggleSidebar(){ $('pcRoot').classList.toggle('sidehidden'); }

/* 열 너비 드래그 조절 */
/* 열 기본 너비 (더블클릭 복원용) — colgroup 정의와 일치 */
const COL_DEFAULT_W = {
  card: { name:'7%', company:'11%', title:'10%', mobile:'9%', companyTel:'9%', companyFax:'9%', email:'12%', companyAddr:'13%', date:'74px' },
  biz:  { company:'19%', ceo:'9%', bizno:'12%', bizType:'12%', bizItem:'14%', address:'auto', date:'82px' }
};
/* 열 너비 더블클릭 → 원래 크기로 복원 */
function resetColWidth(e, key){
  e.preventDefault(); e.stopPropagation();
  if(state.colW && state.colW[state.tab]) delete state.colW[state.tab][key];
  saveColPrefs();
  render();
  toast('열 너비를 원래대로 되돌렸습니다');
}
function startColResize(e, key){
  e.preventDefault(); e.stopPropagation();
  const col = document.querySelector(`#pcTable col[data-col="${key}"]`);
  if(!col) return;
  const startX = e.clientX;
  const startW = col.getBoundingClientRect().width;
  const onMove = ev => {
    const w = Math.max(50, startW + (ev.clientX - startX));
    col.style.width = w + 'px';
  };
  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.body.style.cursor = '';
    if(!state.colW) state.colW = {};
    if(!state.colW[state.tab]) state.colW[state.tab] = {};
    state.colW[state.tab][key] = col.style.width;
    saveColPrefs();
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  document.body.style.cursor = 'col-resize';
}

/* 열 표시/숨김 — 탭별 열 정의 */
const COL_DEFS = {
  card: [['name','이름'],['company','회사'],['title','직책·부서'],['mobile','핸드폰'],
         ['companyTel','회사전화'],['companyFax','회사팩스'],['email','이메일'],['companyAddr','회사주소'],['date','등록일']],
  /* 업태·종목은 계약서·업체관리에 그대로 옮겨 적는 칸이다 — 목록에서 바로 보여야
     사업자등록증을 하나씩 열어 보지 않는다 */
  biz:  [['company','상호'],['ceo','대표자'],['bizno','사업자번호'],['bizType','업태'],['bizItem','종목'],
         ['address','소재지'],['date','등록일']]
};
function colHidden(key){ return !!(state.hiddenCols[state.tab]||{})[key]; }

/* 열 순서: 저장된 순서(colOrder) 우선, 없으면 COL_DEFS 기본 순서. 새 열은 뒤에 붙임 */
function orderedColKeys(){
  const base = (COL_DEFS[state.tab]||[]).map(c=>c[0]);
  const saved = state.colOrder && state.colOrder[state.tab];
  if(!saved || !saved.length) return base;
  const out = saved.filter(k=>base.includes(k));
  base.forEach(k=>{ if(!out.includes(k)) out.push(k); });
  return out;
}
/* 열 머리글 드래그로 좌우 순서 변경 (마우스, PC) */
let _dragCol = null;
function onColDragStart(e, key){ _dragCol=key; e.dataTransfer.effectAllowed='move';
  try{ e.dataTransfer.setData('text/plain', key); }catch(_){}
  const th=e.currentTarget; if(th) th.classList.add('col-dragging'); }
function onColDragOver(e, key){ e.preventDefault(); e.dataTransfer.dropEffect='move';
  const th=e.currentTarget; if(th && _dragCol && key!==_dragCol) th.classList.add('col-dragover'); }
function onColDragLeave(e){ const th=e.currentTarget; if(th) th.classList.remove('col-dragover'); }
function onColDragEnd(e){ const th=e.currentTarget; if(th) th.classList.remove('col-dragging');
  document.querySelectorAll('#pcTable th.col-dragover').forEach(t=>t.classList.remove('col-dragover')); }
function onColDrop(e, key){ e.preventDefault();
  document.querySelectorAll('#pcTable th.col-dragover').forEach(t=>t.classList.remove('col-dragover'));
  const from=_dragCol; _dragCol=null;
  if(!from || from===key) return;
  let order = orderedColKeys().filter(k=>k!==from);
  const ti = order.indexOf(key); if(ti<0) return;
  order.splice(ti, 0, from);
  if(!state.colOrder) state.colOrder={};
  state.colOrder[state.tab] = order;
  saveColPrefs();
  renderPCTable();
  toast('열 순서를 바꿨습니다');
}
function toggleColMenu(ev){
  ev.stopPropagation();
  const m=$('colMenu');
  if (m.style.display==='block'){ m.style.display='none'; return; }
  const defs=COL_DEFS[state.tab]||[];
  m.innerHTML = `<div style="font-size:11.5px;color:#8b98b3;padding:2px 6px 8px;font-weight:700">보일 열 선택</div>`
    + defs.map(([k,label])=>`<label style="display:flex;align-items:center;gap:8px;font-size:13.5px;padding:7px 6px;cursor:pointer;color:#1e2a47">
        <input type="checkbox" ${colHidden(k)?'':'checked'} onchange="setColVisible('${k}',this.checked)" style="width:15px;height:15px"> ${label}</label>`).join('');
  m.style.display='block';
  setTimeout(()=>document.addEventListener('click', closeColMenu, {once:true}), 0);
}
function closeColMenu(){ const m=$('colMenu'); if(m) m.style.display='none'; }
function setColVisible(key, visible){
  if(!state.hiddenCols[state.tab]) state.hiddenCols[state.tab]={};
  if(visible) delete state.hiddenCols[state.tab][key];
  else state.hiddenCols[state.tab][key]=true;
  saveColPrefs();
  renderPCTable();
}
/* 열 설정(숨김·너비) localStorage 저장/복원 */
function saveColPrefs(){
  try{ localStorage.setItem('pucards_colPrefs', JSON.stringify({hiddenCols:state.hiddenCols, colW:state.colW, colOrder:state.colOrder})); }catch(e){}
}
function loadColPrefs(){
  try{
    const p=JSON.parse(localStorage.getItem('pucards_colPrefs')||'{}');
    if(p.hiddenCols) state.hiddenCols=p.hiddenCols;
    if(p.colW) state.colW=p.colW;
    if(p.colOrder) state.colOrder=p.colOrder;
  }catch(e){}
}
function toggleCollapse(id){ state.collapsed[id]=!state.collapsed[id]; render(); }
function toggleAllFolders(){
  const groups=Object.values(state.groups).filter(g=>(g.kind||'card')===state.tab && canSeeGroup(g));
  const anyOpen = groups.some(g=>groups.some(c=>(c.parent||'')===g.id) && !state.collapsed[g.id]);
  groups.forEach(g=>{ state.collapsed[g.id]=anyOpen; });
  render();
}

/* 새 폴더 만들기 — 메일함식 팝업 (부모 지정 가능) */
function openFolderDialog(parent){
  $('folderDlg').innerHTML = `
    <div class="mhead"><b>${parent?'하위 폴더 만들기':'새 폴더 만들기'}</b>
      <button class="iconbtn" onclick="folderDlgBg.classList.remove('open')">✕</button></div>
    <div class="field"><input id="newFolderName" placeholder="폴더 이름 (예: 1.자문사답변)"
       onkeydown="if(event.key==='Enter')confirmNewFolder('${parent}')"></div>
    <div class="mfoot">
      <button class="btn primary" onclick="confirmNewFolder('${parent}')">만들기</button>
      <button class="btn ghost" onclick="folderDlgBg.classList.remove('open')">취소</button></div>`;
  $('folderDlgBg').classList.add('open');
  setTimeout(()=>{ const i=$('newFolderName'); if(i) i.focus(); }, 50);
}
function confirmNewFolder(parent){
  const name=$('newFolderName').value.trim(); if(!name) return toast('폴더 이름을 입력하세요');
  Store.putGroup({id:uid(), name, parent:parent||'', kind:state.tab, order:Date.now()});
  if(parent) state.collapsed[parent]=false;
  $('folderDlgBg').classList.remove('open');
  toast('폴더를 만들었습니다');
}

/* 폴더 ⋮ 메뉴 — 비우기 없이 노무법인용으로: 하위폴더 추가 / 이름변경 / 삭제 */
function openFolderMenu(ev, id){
  const m=$('folderMenu');
  /* 개인 창고 폴더 — 여기서 할 수 있는 것은 잠금 해제뿐이다.
     이름변경·삭제·순서이동은 모두 공용 자리(state.groups)를 만지므로 개인 창고에는 못 쓴다. */
  if((state.priv.groups||{})[id]){
    m.innerHTML = `<div class="fmi" onclick="closeFolderMenu();unsetFolderLock('${id}')">🔓 잠금 해제 (공용으로 되돌리기)</div>`;
    m.style.display='block';
    m.style.left=Math.min(ev.clientX, window.innerWidth-230)+'px';
    m.style.top=Math.min(ev.clientY, window.innerHeight-80)+'px';
    setTimeout(()=>document.addEventListener('click', closeFolderMenu, {once:true}), 0);
    return;
  }
  const g=state.groups[id]; if(!g) return;
  /* 같은 부모 형제 중 위/아래 이동 가능 여부 */
  const sibs=Object.values(state.groups).filter(x=>(x.kind||'card')===(g.kind||'card') && (x.parent||'')===(g.parent||'')).sort((a,b)=>(a.order||0)-(b.order||0));
  const idx=sibs.findIndex(x=>x.id===id);
  const canUp=idx>0, canDown=idx<sibs.length-1;
  const lockItem = g.locked
    ? `<div class="fmi" onclick="closeFolderMenu();unsetFolderLock('${id}')">🔓 잠금 해제</div>`
    : `<div class="fmi" onclick="closeFolderMenu();setFolderLock('${id}')">🔒 비밀번호 잠금</div>`;
  m.innerHTML = `
    <div class="fmi" onclick="closeFolderMenu();renameFolder('${id}')">✏️ 이름 변경</div>
    <div class="fmi" onclick="closeFolderMenu();moveCardsHere('${id}')">📥 선택 명함 이 폴더로</div>
    ${canUp?`<div class="fmi" onclick="closeFolderMenu();moveFolderOrder('${id}',-1)">⬆ 위로</div>`:''}
    ${canDown?`<div class="fmi" onclick="closeFolderMenu();moveFolderOrder('${id}',1)">⬇ 아래로</div>`:''}
    ${lockItem}
    <div class="fmi danger" onclick="closeFolderMenu();deleteFolder('${id}')">🗑 폴더 삭제</div>`;
  m.style.display='block';
  const x=Math.min(ev.clientX, window.innerWidth-170), y=Math.min(ev.clientY, window.innerHeight-260);
  m.style.left=x+'px'; m.style.top=y+'px';
  setTimeout(()=>document.addEventListener('click', closeFolderMenu, {once:true}), 0);
}
/* 폴더 잠그기 — 명함·사진·폴더기록을 대표 전용 창고로 실제로 옮긴다.
   예전에는 화면에서 가리기만 했다(자료는 직원 누구나 읽을 수 있었다).
   이제는 서버 규칙이 막는 자리로 옮기므로, 코드를 고쳐도 남은 못 본다. */
async function setFolderLock(id){
  const g=state.groups[id]; if(!g) return;
  if(!state.isAdmin) return toast('대표만 폴더를 잠글 수 있습니다');
  if(Store.mode!=='firebase') return toast('클라우드에 연결된 상태에서만 됩니다');
  if(!privRoot()) return toast('로그인 정보를 읽지 못했습니다');

  const ids = Object.values(state.items).filter(it=>it && (it.group||'')===id).map(it=>it.id);
  if(!confirm(`'${g.name}' 폴더를 대표님만 보는 개인 폴더로 잠급니다.\n\n`
    + `· 명함 ${ids.length.toLocaleString()}장과 사진이 대표님 전용 창고로 옮겨집니다\n`
    + `· 다른 직원에게는 폴더도 명함도 보이지 않습니다 (서버가 막습니다)\n`
    + `· 푸른이알피 등 다른 프로그램에서도 당겨올 수 없습니다\n`
    + `· 잠근 뒤에는 [🔒 개인 폴더 열기]로 비밀번호를 넣어야 보입니다\n\n진행할까요?`)) return;

  let rec = null;
  try{ rec = await privLockRec(); }
  catch(e){
    if(isDenied(e)) return tellVaultRuleMissing();
    return toast('개인 창고를 읽지 못했습니다 — ' + ((e&&e.message)||''));
  }
  if(!rec){ const ok = await setPrivatePassword(); if(!ok) return; }

  toast(`옮기는 중… ${ids.length.toLocaleString()}장`, 30000);
  try{
    const upd = movePaths(ids, id, 'lock');
    const P = privRoot();
    for(const cid of ids){
      const it = state.items[cid]; if(!it){ delete upd[`${P}/items/${cid}`]; delete upd[`${P}/photos/${cid}`]; continue; }
      const body = {...it}; delete body.thumb; delete body.thumb2;
      upd[`${P}/items/${cid}`] = body;
      const ph = await Store.getPhoto(cid).catch(()=>'');
      if(ph) upd[`${P}/photos/${cid}`] = ph; else delete upd[`${P}/photos/${cid}`];
      /* 썸네일도 함께 옮긴다 — 두고 가면 목록 그림으로 누구인지 보인다 */
      const th = it.thumb || await Store.getThumb(cid).catch(()=>'');
      if(th){ upd[`${P}/thumbs/${cid}`] = th; upd[`${DB_ROOT}/thumbs/${cid}`] = null; }
    }
    const pg = { ...g, locked:true, lockedAt:Date.now() };
    delete pg.pw;                       /* 옛 평문 비밀번호는 옮기지 않고 버린다 */
    upd[`${P}/groups/${id}`] = pg;
    /* 지문 남기기 — 사진첩이 이 사람을 다시 공용에 만들지 않게 */
    const moving = ids.map(cid=>state.items[cid]).filter(Boolean);
    Object.assign(upd, await lockKeyUpdates(moving, true));
    /* 번호 열쇠도 거둔다 — 검색목록에서 빼 놓고 이 자리를 두면 그리로 되짚어 간다 */
    moving.forEach(it=>{ const k=byKeyOf(it); if(k) upd[`${DB_ROOT}/${BYKEY}/${k}`] = null; });
    await Store.db.ref().update(upd);
    toast(`🔒 '${g.name}'을(를) 개인 폴더로 옮겼습니다 — [🔒 개인 폴더 열기]로 보실 수 있습니다`,9000);
    if(state.group===id) state.group='all';
    render();
  }catch(e){
    toast('❌ 옮기지 못했습니다: ' + ((e&&e.message)||'알 수 없음'), 8000);
  }
}
/* ══════ 개인 폴더 「지문」 (pucards/lockkeys) ══════
   개인 폴더로 옮긴 명함은 공유 검색목록에서 빠지므로, 사진첩이 다시 찍었을 때
   "이미 있다"를 알 길이 없어 공용 목록에 새로 만들어 버린다 —
   감춘 사람이 도로 드러난다. 그래서 되돌릴 수 없게 뭉갠 번호 지문만 남긴다.
   담기는 것은 지문뿐이다(이름·회사·폴더 이름 없음). 자세한 것은 js/pu-lockkey.js.

   ⚠ 이 목록이 없어도 명함은 멀쩡하다. 그래서 지문 만들기가 실패해도
     옮기는 일 자체는 막지 않는다(사진첩 알림만 못 하게 될 뿐이다). */
async function lockKeyUpdates(items, on){
  const out = {}; const LK = window.PuLockKey;
  if(!LK) return out;
  for(const it of items){
    try{
      const fp = await LK.fingerprint(LK.keyOfItem(it));
      if(fp) out[LK.pathOf(fp)] = on ? 1 : null;
    }catch(_){ /* 한 장 실패가 전체를 멈추게 하지 않는다 */ }
  }
  return out;
}

/* 잠금 풀기 — 개인 창고에서 공용 자리로 되돌린다. 검색목록에도 다시 넣는다. */
async function unsetFolderLock(id){
  const g = (state.priv.groups||{})[id] || state.groups[id]; if(!g) return;
  if(!state.privOpen) return toast('먼저 [🔒 개인 폴더 열기]로 여세요');
  if(Store.mode!=='firebase') return toast('클라우드에 연결된 상태에서만 됩니다');

  const ids = Object.values(state.priv.items).filter(it=>it && (it.group||'')===id).map(it=>it.id);
  if(!confirm(`'${g.name}' 폴더의 잠금을 풉니다.\n\n`
    + `· 명함 ${ids.length.toLocaleString()}장이 공용 자리로 되돌아갑니다\n`
    + `· 다른 직원과 푸른이알피에서도 다시 보입니다\n\n진행할까요?`)) return;

  toast(`되돌리는 중… ${ids.length.toLocaleString()}장`, 30000);
  try{
    const upd = movePaths(ids, id, 'unlock');
    const P = privRoot();
    for(const cid of ids){
      const it = state.priv.items[cid];
      if(!it){ delete upd[`${DB_ROOT}/items/${cid}`]; delete upd[`${DB_ROOT}/photos/${cid}`]; continue; }
      const body = {...it}; delete body.thumb; delete body.thumb2;
      upd[`${DB_ROOT}/items/${cid}`] = body;
      const ph = await Store.getPhoto(cid).catch(()=>'');
      if(ph) upd[`${DB_ROOT}/photos/${cid}`] = ph; else delete upd[`${DB_ROOT}/photos/${cid}`];
      const th = it.thumb || await Store.getThumb(cid).catch(()=>'');
      if(th){ upd[`${DB_ROOT}/thumbs/${cid}`] = th; upd[`${P}/thumbs/${cid}`] = null; }
      upd[`${DB_ROOT}/idx/${cid}`] = idxRecord(it);   /* 값이 없으면 null 이 들어가 지워진다 */
    }
    const pub = { ...g };
    delete pub.locked; delete pub.lockedAt; delete pub.pw; delete pub.lockOwner;
    upd[`${DB_ROOT}/groups/${id}`] = pub;
    /* 지문 지우기 — 단, **개인 창고에 남는 다른 명함이 같은 번호를 쓰고 있으면 남긴다.**
       한 사람의 명함이 개인 폴더 두 곳에 있을 수 있다. 그냥 지우면 아직 감춰 둔
       쪽까지 사진첩이 다시 만들어 버린다. */
    const leaving = ids.map(cid=>state.priv.items[cid]).filter(Boolean);
    /* 번호 열쇠를 되돌린다 — 공용으로 나왔으니 사진첩이 다시 찾아갈 수 있어야 한다 */
    leaving.forEach(it=>{ const k=byKeyOf(it); if(k) upd[`${DB_ROOT}/${BYKEY}/${k}`] = it.id; });
    const staying = Object.values(state.priv.items)
                      .filter(it=>it && (it.group||'')!==id);
    const dropAll  = await lockKeyUpdates(leaving, false);
    const keepBack = await lockKeyUpdates(staying, true);
    Object.keys(dropAll).forEach(p=>{ if(!(p in keepBack)) upd[p] = null; });
    await Store.db.ref().update(upd);
    toast(`🔓 '${g.name}' 잠금을 풀었습니다 — 다시 모두에게 보입니다`,7000);
    render();
  }catch(e){
    toast('❌ 되돌리지 못했습니다: ' + ((e&&e.message)||'알 수 없음'), 8000);
  }
}
/* 폴더를 열 수 있나.
   새 방식(개인 창고)은 이미 비밀번호를 지나 열려 있으므로 그냥 통과시킨다.
   옛 방식으로 잠긴 폴더는 아직 안 옮긴 것이라 예전대로 비밀번호를 묻는다. */
function tryUnlockFolder(id){
  if((state.priv.groups||{})[id]) return true;
  const g=state.groups[id]; if(!g) return false;
  if(!g.locked) return true;
  if(state.unlocked && state.unlocked[id]) return true;
  const pw=prompt(`'${g.name}'은(는) 잠긴 폴더입니다. 비밀번호를 입력하세요.`);
  if(pw===null) return false;
  if(pw!==g.pw){ toast('비밀번호가 틀렸습니다'); return false; }
  if(!state.unlocked) state.unlocked={};
  state.unlocked[id]=true;
  toast('잠금을 풀었습니다 (이 세션 동안 표시)');
  return true;
}
/* 옛 방식으로 잠긴 폴더를 개인 창고로 옮긴다. 저절로 돌지 않는다 — 대표가 누를 때만. */
async function migrateLockedFolders(){
  if(!state.isAdmin) return toast('대표만 할 수 있습니다');
  const olds = Object.values(state.groups).filter(g=>g && g.locked);
  if(!olds.length) return toast('옮길 옛 잠금 폴더가 없습니다 👍');
  const n = olds.reduce((s,g)=> s + Object.values(state.items).filter(it=>it&&(it.group||'')===g.id).length, 0);
  if(!confirm(`옛 방식으로 잠긴 폴더 ${olds.length}개(명함 ${n.toLocaleString()}장)를\n`
    + `대표님 전용 창고로 옮깁니다.\n\n`
    + `옮긴 뒤에는 [🔒 개인 폴더 열기]로 비밀번호를 넣어야 보입니다.\n\n진행할까요?`)) return;
  for(const g of olds){ await setFolderLock(g.id); }
  toast('옮기기를 마쳤습니다 — [🔒 개인 폴더 열기]로 확인하세요',9000);
}
/* 폴더 순서 한 칸 이동 (같은 부모 형제끼리 order 교환) */
function moveFolderOrder(id, dir){
  const g=state.groups[id]; if(!g) return;
  const sibs=Object.values(state.groups)
    .filter(x=>(x.kind||'card')===(g.kind||'card') && (x.parent||'')===(g.parent||''))
    .sort((a,b)=>(a.order||0)-(b.order||0));
  const idx=sibs.findIndex(x=>x.id===id);
  const swapIdx=idx+dir;
  if(swapIdx<0||swapIdx>=sibs.length) return;
  /* 형제 전체에 일련번호 order 부여 후, 두 항목 위치 교환 */
  sibs.forEach((s,i)=>{ s.order=i+1; });
  const a=sibs[idx], b=sibs[swapIdx];
  const t=a.order; a.order=b.order; b.order=t;
  Store.putGroup(a); Store.putGroup(b);
  toast('폴더 순서를 변경했습니다');
}
/* 표에서 바로 수정 (셀 더블클릭 → 인라인 입력) */
function startCellEdit(ev, id, field){
  ev.stopPropagation();
  const td=ev.currentTarget;
  if(td.querySelector('input')) return;          /* 이미 편집 중 */
  const it=state.items[id]; if(!it) return;
  const old=it[field]||'';
  td.dataset.editing='1';
  td.innerHTML=`<input class="cellEdit" value="${esc(old)}" style="width:100%;border:1.5px solid #3a4a73;border-radius:5px;padding:4px 6px;font-size:13px;font-family:inherit;box-sizing:border-box">`;
  const inp=td.querySelector('input');
  inp.focus(); inp.select();
  const commit=(save)=>{
    if(td._done) return; td._done=true;
    if(save){
      const v=inp.value.trim();
      if(v!==old){ it[field]=v; Store.put(it); toast('수정했습니다'); }
    }
    render();
  };
  inp.addEventListener('keydown', e=>{
    e.stopPropagation();
    if(e.key==='Enter'){ e.preventDefault(); commit(true); }
    else if(e.key==='Escape'){ e.preventDefault(); commit(false); }
  });
  inp.addEventListener('blur', ()=>commit(true));
}

    ? `'${g.name}' 폴더와 하위 폴더 ${kids.length}개를 삭제할까요? (명함은 미분류로 이동)`

function renderPCTable(){
  const isCard = state.tab==='card';
  const items = listItems();
  /* ⚠중복 표시 — **정리 팝업과 같은 함수**로 판정한다.
     예전에는 여기서 열쇠 개수만 세어, 「중복 아님」으로 적어 둔 짝도 배지가 남았다. */
  const kindAll = Object.values(state.items).filter(it=>it.kind===state.tab);
  const dupIds = dupIdSet(kindAll, dupIgnoreSet());
  const isDup = it => dupIds.has(it.id);
  /* 제목·정렬 */
  $('pcTitle').textContent =
    state.owner!=='all' ? `담당: ${state.owner}`
    : state.group!=='all' ? groupName(state.group)
    : (isCard?'전체 명함':'사업자등록증');
  $('pcCount').textContent = items.length.toLocaleString()+'개';
  $('pcSort').value = state.sort;
  /* 지역 드롭다운은 제거됨 (상단 한 줄 정리) — 지역 조건은 저장된 탭에서만 사용 */
  const incBtn=$('incompleteBtn');
  if(incBtn){
    if(state.onlyIncomplete){ incBtn.style.background='#3a4a73'; incBtn.style.color='#fff'; incBtn.style.borderColor='#3a4a73'; incBtn.textContent='✓ 정보부족'; }
    else { incBtn.style.background='#fff'; incBtn.style.color='#33415e'; incBtn.style.borderColor='#dde3ee'; incBtn.textContent='정보부족'; }
  }
  /* 조건 필터 버튼 제거됨 — pcFilters 영역 비움 */
  $('pcFilters').innerHTML = '';
  /* 현재 페이지 분량만 잘라서 렌더 (메모리 보호) */
  const size = state.pageSize || 100;
  const totalPages = Math.max(1, Math.ceil(items.length/size));
  if (state.page >= totalPages) state.page = totalPages-1;
  if (state.page < 0) state.page = 0;
  const start = state.page*size;
  const pageItems = items.slice(start, start+size);
  /* 선택 작업 바 */
  const n=Object.keys(state.sel).length;
  /* 이 페이지를 다 골랐는데 찾은 결과가 더 있으면 막대 안에서 알려 준다.
     이 안내가 없으면 100건만 지워진 것을 모른 채 '다 지웠다'고 여기게 된다. */
  const pageAllSel = pageItems.length>0 && pageItems.every(it=>state.sel[it.id]);
  /* 범위를 안 좁혔으면 selectAllMatching 이 거부한다 — 눌러도 안 되는 단추를 보이면 안 된다 */
  let _narrow=false; try{ _narrow = listNarrowed(); }catch(_){}
  const moreBtn = (_narrow && pageAllSel && items.length > pageItems.length && n < items.length)
    ? `<button onclick="selectAllMatching()" style="border-color:#d9a441;color:#92400e;background:#fff8ec"
         title="지금 조건에 맞는 것을 모두 고릅니다">→ ${items.length.toLocaleString()}건 모두</button><span class="sep"></span>`
    : '';
  /* 자주 쓰는 넷만 겉에. 나머지는 ⋯ 안 — 삭제도 여기 넣어 오누름을 막는다. */
  $('pcSel').innerHTML = n ? `<div class="bar"><b>${n}개 선택</b><span class="sep"></span>${moreBtn}
      <button onclick="selPickGroup()" title="선택한 명함을 폴더로 한 번에 이동">📁 폴더</button>
      <button onclick="selAddToTab()" title="선택한 명함을 이 폴더의 '담는 탭'에 넣기">🏷 탭</button>
      <button onclick="selMailCopy()" title="이메일을 쉼표로 묶어 복사 — 메일 쓰기창 숨은참조 칸에 붙여넣기">📧 주소 복사</button>
      <button onclick="openSelMore(event)" title="담당자 지정 · 단체 복사 · 단체 메일 · 주소록 내보내기 · 삭제">⋯</button>
      <span class="sep"></span>
      <button class="icon" onclick="state.sel={};render()" title="선택 모두 해제" aria-label="선택 모두 해제">✕</button>
    </div>` : '';
  /* 고른 것이 화면 밖으로 밀려도 막대는 늘 보인다 — 목록 위에 떠 있기 때문 */
  /* 표 */
  const sortArrow = key => state.sortKey===key ? (state.sortDir==='asc'?' ▲':' ▼') : '';
  /* 열 너비: 사용자가 드래그로 조정한 값(state.colW)이 있으면 우선 적용 */
  const cw = (state.colW && state.colW[state.tab]) || {};
  const DW = COL_DEFAULT_W[state.tab] || {};
  const rz = key => `<span class="colresize" draggable="false" onmousedown="startColResize(event,'${key}')" ondblclick="resetColWidth(event,'${key}')" onclick="event.stopPropagation()" title="드래그: 너비 조절 · 더블클릭: 원래 크기로"></span>`;
  const dragAttr = key => `draggable="true" ondragstart="onColDragStart(event,'${key}')" ondragover="onColDragOver(event,'${key}')" ondragleave="onColDragLeave(event)" ondrop="onColDrop(event,'${key}')" ondragend="onColDragEnd(event)"`;
  /* 데이터 열 조각: colgroup / 헤더(th) / 셀(td) — 순서 배열대로 조합 */
  const colFrag = key => `<col data-col="${key}" style="width:${cw[key]||DW[key]||'auto'}">`;
  const TH = state.tab==='card' ? {
    name:       `<th class="col-name" ${dragAttr('name')} onclick="sortBy('name')" style="cursor:pointer">이름${sortArrow('name')}${rz('name')}</th>`,
    company:    `<th class="col-company" ${dragAttr('company')} onclick="sortBy('company')" style="cursor:pointer">회사${sortArrow('company')}${rz('company')}</th>`,
    title:      `<th class="col-title" ${dragAttr('title')}>직책·부서${rz('title')}</th>`,
    mobile:     `<th class="col-mobile" ${dragAttr('mobile')} onclick="sortBy('phone')" style="cursor:pointer">핸드폰${sortArrow('phone')}${rz('mobile')}</th>`,
    companyTel: `<th class="col-companyTel" ${dragAttr('companyTel')}>회사전화${rz('companyTel')}</th>`,
    companyFax: `<th class="col-companyFax" ${dragAttr('companyFax')}>회사팩스${rz('companyFax')}</th>`,
    email:      `<th class="col-email" ${dragAttr('email')}>이메일${rz('email')}</th>`,
    companyAddr:`<th class="col-companyAddr" ${dragAttr('companyAddr')}>회사주소${rz('companyAddr')}</th>`,
    date:       `<th class="col-date" ${dragAttr('date')} onclick="sortBy('date')" style="cursor:pointer;text-align:right">등록일${sortArrow('date')}${rz('date')}</th>`,
  } : {
    company: `<th class="col-company" ${dragAttr('company')} onclick="sortBy('company')" style="cursor:pointer">상호${sortArrow('company')}${rz('company')}</th>`,
    ceo:     `<th class="col-ceo" ${dragAttr('ceo')}>대표자${rz('ceo')}</th>`,
    bizno:   `<th class="col-bizno" ${dragAttr('bizno')}>사업자번호${rz('bizno')}</th>`,
    bizType: `<th class="col-bizType" ${dragAttr('bizType')}>업태${rz('bizType')}</th>`,
    bizItem: `<th class="col-bizItem" ${dragAttr('bizItem')}>종목${rz('bizItem')}</th>`,
    address: `<th class="col-address" ${dragAttr('address')}>소재지${rz('address')}</th>`,
    date:    `<th class="col-date" ${dragAttr('date')} onclick="sortBy('date')" style="cursor:pointer;text-align:right">등록일${sortArrow('date')}${rz('date')}</th>`,
  };
  const TD = state.tab==='card' ? {
    /* 사람 이름이 없는 기관·상호 명함은 회사명을 이름 자리에 보여준다 (＇이름 없음＇ 대신) */
    name:       it => `<td class="nm col-name" ondblclick="startCellEdit(event,'${it.id}','name')">${it.fav?'⭐ ':''}${
                        it.name ? esc(it.name)
                        : (it.company ? `<span style="color:#0c7a64" title="사람 이름 없이 기관·상호로 등록된 명함">🏢 ${esc(it.company)}</span>`
                                      : `<span style="color:#b6bfd0">(이름 없음)</span>`)}</td>`,
    company:    it => `<td class="co col-company" ondblclick="startCellEdit(event,'${it.id}','company')">${esc(it.company||'')}</td>`,
    title:      it => `<td class="col-title" ondblclick="startCellEdit(event,'${it.id}','title')">${esc([it.title,it.dept].filter(Boolean).join('·'))}</td>`,
    mobile:     it => `<td class="col-mobile" ondblclick="startCellEdit(event,'${it.id}','mobile')">${esc(it.mobile||'')}</td>`,
    companyTel: it => `<td class="col-companyTel" ondblclick="startCellEdit(event,'${it.id}','companyTel')">${esc(it.companyTel||it.tel||'')}</td>`,
    companyFax: it => `<td class="col-companyFax" ondblclick="startCellEdit(event,'${it.id}','companyFax')">${esc(it.companyFax||it.fax||'')}</td>`,
    /* 이메일은 **한 번 누르면 메일 쓰기**로 간다 (대표 지시 2026-08-10).
       ⚠ 고치는 것은 예전대로 두 번 누르기다. 그래서 누른 뒤 곧바로 열지 않고
         두 번 누르기인지 잠깐 기다려 본다 — 안 기다리면 고치려고 두 번 누를 때
         첫 번째에 화면이 넘어가 버린다. */
    email:      it => `<td class="col-email" ondblclick="startCellEdit(event,'${it.id}','email')">${
      it.email
        ? `<a href="#" class="mailto" onclick="clickMailCell(event,'${it.id}');return false"
             title="눌러서 이 사람에게 메일 쓰기 (고치려면 두 번 누르기)">${esc(it.email)}</a>`
        : ''}</td>`,
    companyAddr:it => `<td class="col-companyAddr" style="font-size:12px;color:#5a6885" ondblclick="startCellEdit(event,'${it.id}','companyAddr')">${esc(it.companyAddr||it.address||'')}</td>`,
    date:       it => `<td class="dt col-date">${fmtDate(it.createdAt)}</td>`,
  } : {
    company: it => `<td class="nm col-company">${it.fav?'⭐ ':''}${esc(it.company||'(상호 없음)')}</td>`,
    ceo:     it => `<td class="col-ceo">${esc(it.ceo||'')}</td>`,
    bizno:   it => `<td class="col-bizno">${esc(fmtBizno(it.bizno))}</td>`,
    bizType: it => `<td class="col-bizType" ondblclick="startCellEdit(event,'${it.id}','bizType')">${esc(it.bizType||'')}</td>`,
    bizItem: it => `<td class="col-bizItem" ondblclick="startCellEdit(event,'${it.id}','bizItem')">${esc(it.bizItem||'')}</td>`,
    address: it => `<td class="col-address">${esc(it.address||'')}</td>`,
    date:    it => `<td class="dt col-date">${fmtDate(it.createdAt)}</td>`,
  };
  const order = orderedColKeys();
  /* 앞뒤 고정 열: [체크박스][#] … 데이터 열 … [담당][관리] */
  /* 번호 칸은 최대 4자리(5,810 등)까지 보이도록 넉넉히 */
  /* 담당 칸이 48px 이던 때는 table-layout:fixed 라 「자문 김보람」이 잘려
     담당 노무사가 누구인지 안 보였다(대표 지시 2026-08-11). 이름이 다 보일 만큼 준다. */
  const cgFront = state.tab==='card' ? `<col style="width:30px"><col style="width:52px">` : `<col style="width:32px"><col style="width:52px">`;
  const cgBack  = state.tab==='card' ? `<col style="width:158px"><col style="width:54px">` : `<col style="width:158px"><col style="width:60px">`;
  const colg = `<colgroup>${cgFront}${order.map(colFrag).join('')}${cgBack}</colgroup>`;
  const filterRow = '';
  const allChecked = pageItems.length>0 && pageItems.every(it=>state.sel[it.id]);
  const headChk = `<th><input type="checkbox" ${allChecked?'checked':''} onchange="toggleSelectAll(this.checked)" title="이 페이지 전체 선택"></th>`;
  const thead = `<tr>${headChk}<th class="num">#</th>${order.map(k=>TH[k]||'').join('')}<th style="text-align:right">담당</th><th style="text-align:center">관리</th></tr>` + filterRow;
  let rows='';
  pageItems.forEach((it,pi)=>{
    const i = start + pi;
    const chk=`<td onclick="event.stopPropagation()"><input type="checkbox" ${state.sel[it.id]?'checked':''} onchange="toggleSel('${it.id}')"></td>`;
    /* 눌러서 누구와 겹쳤는지 보고 판단한다(대표 지시 2026-08-10).
       stopPropagation — 줄을 누르면 상세보기가 열리므로 막지 않으면 둘이 겹친다. */
    const dup = isDup(it)
      ? `<span class="dup" title="눌러서 겹친 명함 확인·정리"
           onclick="event.stopPropagation();openDupFix('${it.id}')">⚠중복</span>` : '';
    /* ERP 연결 배지: 업체 유형(자문/급여/노조/기금) + 실무담당 여부 (업체관리 실시간 매칭) */
    const erpBadge = (function(){
      const t = ErpMatch.type(it); if(!t && !ErpMatch.match(it)) return '';
      const cMap = { '자문':'#1e40af', '급여':'#166534', '노조':'#6d28d9', '기금':'#92400e', '사무대행':'#0f766e' };
      /* 「ERP·자문」만 나오고 담당 노무사 이름이 어디에도 안 보였다 — 이름은 title(마우스를
         올려야 보이는 곳)에만 있었다. 「ERP·」는 이 칸이 죄다 ERP 라 늘 같은 말이어서 버리고,
         그 자리에 정작 알고 싶은 담당자 이름을 넣는다 → 「자문 김보람」 (대표 지시 2026-08-11). */
      const _mgr = ErpMatch.label(it);
      let h = t ? `<span title="푸른이알피 업체관리 연결 · ${esc(ErpMatch.full(it))||'담당 노무사 미지정'}" style="display:inline-block;background:${cMap[t]||'#475569'}18;color:${cMap[t]||'#475569'};border:1px solid ${cMap[t]||'#475569'}44;border-radius:8px;padding:1px 7px;font-size:11px;font-weight:700;white-space:nowrap">${esc(t)}${_mgr?' '+esc(_mgr):''}</span>` : '';
      /* 이 사람이 그 회사의 ERP 대표자/담당자인지 */
      const _role = ErpMatch.role(it);
      if (_role==='ceo') h += ` <span title="이 명함 주인이 푸른이알피 업체관리에 이 회사 대표자로 등록됨" style="display:inline-block;background:#e0e7ff;color:#3730a3;border:1px solid #a5b4fc;border-radius:8px;padding:1px 7px;font-size:11px;font-weight:700;white-space:nowrap">🏢 대표자</span>`;
      else if (_role==='contact') h += ` <span title="이 명함 주인이 푸른이알피 업체관리에 이 회사 담당자로 등록됨" style="display:inline-block;background:#dcfce7;color:#166534;border:1px solid #86efac;border-radius:8px;padding:1px 7px;font-size:11px;font-weight:700;white-space:nowrap">🏢 담당자</span>`;
      else if (ErpMatch.isContact(it)) h += ` <span title="업체관리에 이 명함 주인이 실무 담당자로 등록됨" style="display:inline-block;background:#fef3c7;color:#92400e;border:1px solid #fcd34d;border-radius:8px;padding:1px 7px;font-size:11px;font-weight:700;white-space:nowrap">실무담당</span>`;
      const _m = ErpMatch.match(it);
      if (_m && _m.left) h += ` <span title="업체관리에서 종료·해지된 거래처 (업체퇴사)" style="display:inline-block;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;border-radius:8px;padding:1px 7px;font-size:11px;font-weight:700;white-space:nowrap">🚪 퇴사</span>`;
      return h;
    })();
    const actCell = `<td onclick="event.stopPropagation()" style="text-align:center;white-space:nowrap">
        <button onclick="openEditor(state.items['${it.id}'])" title="수정" style="border:none;background:none;cursor:pointer;font-size:14px;padding:3px 5px">✏️</button>
        <button onclick="delItem('${it.id}')" title="삭제" style="border:none;background:none;cursor:pointer;font-size:14px;padding:3px 5px">🗑</button></td>`;
    rows += `<tr draggable="true" ondragstart="onRowDrag(event,'${it.id}')" onclick="openDetail('${it.id}')" oncontextmenu="openRowMenu(event,'${it.id}')">${chk}<td class="num">${i+1}</td>${order.map(k=>TD[k](it)).join('')}<td class="dt" style="white-space:normal;line-height:1.9">${erpBadge}${erpBadge&&dup?' ':''}${dup}</td>${actCell}</tr>`;
  });
  if (!rows) rows = `<tr><td class="pcempty" colspan="${order.length+4}">등록된 항목이 없습니다 — 우측 상단 [＋ 명함 등록] 또는 이미지·PDF를 화면에 끌어다 놓으세요. (Ctrl+V 붙여넣기 가능)</td></tr>`;
  $('pcTable').innerHTML = `${colg}<thead>${thead}</thead><tbody>${rows}</tbody>`;
  /* 숨긴 열 적용: 해당 클래스 셀을 display:none */
  const hidden = state.hiddenCols[state.tab] || {};
  const hideCss = Object.keys(hidden).filter(k=>hidden[k])
    .map(k=>`#pcTable .col-${k}{display:none}`).join('');
  let st=$('colHideStyle'); if(!st){ st=document.createElement('style'); st.id='colHideStyle'; document.head.appendChild(st); }
  st.textContent = hideCss;
  /* 페이지 이동 바 */
  const pager=$('pcPager');
  if (totalPages>1){
    const btn=(label,pg,dis)=>`<button onclick="state.page=${pg};render()" ${dis?'disabled':''}
      style="border:1px solid #dde3ee;background:${dis?'#f1f4fa':'#fff'};border-radius:8px;padding:7px 13px;font-weight:700;color:#33415e;cursor:${dis?'default':'pointer'}">${label}</button>`;
    pager.innerHTML = btn('◀ 이전', state.page-1, state.page===0)
      + `<span>${(start+1).toLocaleString()}–${Math.min(start+size,items.length).toLocaleString()} / ${items.length.toLocaleString()}개 &nbsp;(${state.page+1}/${totalPages}쪽)</span>`
      + btn('다음 ▶', state.page+1, state.page>=totalPages-1);
  } else pager.innerHTML='';
}
/* ══════ 🔖 내 탭 (저장된 검색·필터 조건) ══════
   폴더는 '명함을 옮기는 서류함', 내 탭은 '조건으로 걸러 보는 즐겨찾기'.
   명함 데이터를 건드리지 않으므로 5천 장에도 즉시 적용된다. 전 직원 공유(pucards/views). */
function viewSnapshot(){
  const s=$('search');
  return {
    q: s ? s.value.trim() : '',
    group: state.group||'all', owner: state.owner||'all', region: state.region||'',
    erpFilter: state.erpFilter||'', colFilter: Object.assign({}, state.colFilter||{}),
    onlyPhone: !!state.onlyPhone, onlyEmail: !!state.onlyEmail,
    onlyIncomplete: !!state.onlyIncomplete, onlyPrivate: !!state.onlyPrivate, onlyDup: !!state.onlyDup,
    vtab: state.vtab||'',
    sort: state.sort||'date', sortKey: state.sortKey||null, sortDir: state.sortDir||'desc'
  };
}
/* 그 탭 조건에 해당하는 인원수 — 목록과 똑같은 기준으로 세기 위해 잠시 조건을 바꿔 계산 후 되돌린다 */
function countMatching(f){
  f=f||{};
  const s=$('search');
  const sv={ group:state.group, owner:state.owner, region:state.region, erpFilter:state.erpFilter,
    colFilter:state.colFilter, onlyPhone:state.onlyPhone, onlyEmail:state.onlyEmail,
    onlyIncomplete:state.onlyIncomplete, onlyPrivate:state.onlyPrivate, onlyDup:state.onlyDup,
    vtab:state.vtab, sort:state.sort, sortKey:state.sortKey, q:(s?s.value:'') };
  try{
    state.group=f.group||'all'; state.owner=f.owner||'all'; state.region=f.region||'';
    state.erpFilter=f.erpFilter||''; state.colFilter=f.colFilter||{};
    state.onlyPhone=!!f.onlyPhone; state.onlyEmail=!!f.onlyEmail;
    state.onlyIncomplete=!!f.onlyIncomplete; state.onlyPrivate=!!f.onlyPrivate; state.onlyDup=!!f.onlyDup;
    state.vtab=f.vtab||'';
    state.sort='date'; state.sortKey=null;          /* 세기만 하므로 가벼운 정렬로 */
    if(s) s.value=f.q||'';
    return listItems().length;
  }catch(e){ return 0; }
  finally{
    state.group=sv.group; state.owner=sv.owner; state.region=sv.region; state.erpFilter=sv.erpFilter;
    state.colFilter=sv.colFilter; state.onlyPhone=sv.onlyPhone; state.onlyEmail=sv.onlyEmail;
    state.onlyIncomplete=sv.onlyIncomplete; state.onlyPrivate=sv.onlyPrivate; state.onlyDup=sv.onlyDup;
    state.vtab=sv.vtab; state.sort=sv.sort; state.sortKey=sv.sortKey; if(s) s.value=sv.q;
  }
}
/* 지금 화면이 그 탭과 같은 조건인지 비교용 서명 (정렬은 제외 — 정렬 바꿔도 탭 선택 유지) */
function viewSig(f){
  f=f||{}; const c=f.colFilter||{};
  return JSON.stringify([f.q||'', f.group||'all', f.owner||'all', f.region||'', f.erpFilter||'',
    c.name||'', c.company||'', c.phone||'', c.email||'',
    !!f.onlyPhone, !!f.onlyEmail, !!f.onlyIncomplete, !!f.onlyPrivate, !!f.onlyDup, f.vtab||'']);
}
function applyView(id){
  const v=(state.views||{})[id]; if(!v) return;
  const f=v.f||{};
  if((v.kind||'card')!==state.tab){ state.tab=v.kind||'card'; }
  state.group=f.group||'all'; state.owner=f.owner||'all'; state.region=f.region||'';
  state.erpFilter=f.erpFilter||''; state.colFilter=Object.assign({}, f.colFilter||{});
  state.onlyPhone=!!f.onlyPhone; state.onlyEmail=!!f.onlyEmail;
  state.onlyIncomplete=!!f.onlyIncomplete; state.onlyPrivate=!!f.onlyPrivate; state.onlyDup=!!f.onlyDup;
  state.vtab=f.vtab||'';
  state.sort=f.sort||'date'; state.sortKey=f.sortKey||null; state.sortDir=f.sortDir||'desc';
  state.page=0; state.sel={}; state.view='list';
  const s=$('search'); if(s) s.value=f.q||'';
  const ps=$('pcSearch'); if(ps) ps.value=f.q||'';
  try{ _syncSearchX(); }catch(_){}      /* 탭으로 검색어가 들어와도 ✕ 가 따라 나와야 한다 */
  render();
}
function saveCurrentAsView(){
  const f=viewSnapshot();
  /* 폴더는 탭의 '소속'이라 조건으로 치지 않는다 — 폴더 안에서 조건 없이 만들면 '담는 탭' */
  const hasCond = f.q||f.region||f.erpFilter||(f.owner&&f.owner!=='all')
    ||f.onlyPhone||f.onlyEmail||f.onlyIncomplete||f.onlyPrivate||f.onlyDup
    ||Object.keys(f.colFilter||{}).some(k=>f.colFilter[k]);
  /* 조건이 없으면 '담는 탭' — 명함을 직접 골라 담는 칸으로 만든다 */
  if(!hasCond){
    if(!confirm(`📁 ${curScopeName()} 안에 '담는 탭'을 만듭니다.\n\n· 명함을 골라서 직접 담는 칸이에요 (폴더 안의 작은 칸)\n· 만든 뒤: 명함 선택 → [🏷 탭에 담기]\n\n계속할까요?`)) return;
    const name0=(prompt(`담는 탭 이름을 입력하세요\n(예: 푸른노무법인, 대전충청노무사)`,'')||'').trim();
    if(!name0) return;
    const id=uid();
    const mf={ q:'', group:(state.group||'all'), owner:'all', region:'', erpFilter:'', colFilter:{},
      onlyPhone:false, onlyEmail:false, onlyIncomplete:false, onlyPrivate:false, onlyDup:false,
      vtab:id, sort:'date', sortKey:null, sortDir:'desc' };
    Store.putView({ id, name:name0, kind:state.tab, scope:(state.group||'all'), manual:true, order:Date.now(), f:mf });
    toast(`🏷 '${name0}' 담는 탭을 만들었습니다 — 명함을 선택해 [🏷 탭에 담기]로 넣으세요`,6000);
    return;
  }
  const dflt = f.q || f.region || f.erpFilter || (f.colFilter&&(f.colFilter.company||f.colFilter.name)) || '';
  /* 어디에 · 무슨 조건으로 만들어지는지 이름 묻기 전에 알려준다 */
  const cond=[]; const c=f.colFilter||{};
  if(f.q) cond.push(`검색 "${f.q}"`);
  if(f.region) cond.push('지역 '+f.region);
  if(f.erpFilter) cond.push('ERP '+f.erpFilter);
  if(c.company) cond.push(`회사에 "${c.company}"`);
  if(c.name) cond.push(`이름에 "${c.name}"`);
  if(c.phone) cond.push(`전화에 "${c.phone}"`);
  if(c.email) cond.push(`이메일에 "${c.email}"`);
  if(f.owner&&f.owner!=='all') cond.push('담당 '+f.owner);
  if(f.onlyPhone) cond.push('전화있음');
  if(f.onlyEmail) cond.push('이메일있음');
  if(f.onlyIncomplete) cond.push('정보부족만');
  if(f.onlyPrivate) cond.push('개인만');
  if(f.onlyDup) cond.push('중복만');
  let n=0; try{ n=countMatching(f); }catch(_){}
  const head = `📁 ${curScopeName()} 에만 보이는 탭을 만듭니다.\n`
             + `조건: ${cond.length?cond.join(' · '):'없음 (전체)'}\n`
             + `해당 인원: ${n.toLocaleString()}명\n\n탭 이름을 입력하세요`;
  const name=(prompt(head, dflt)||'').trim();
  if(!name) return;
  const v={ id:uid(), name, kind:state.tab, scope:(state.group||'all'), order:Date.now(), f };
  Store.putView(v);
  toast(`🔖 '${name}' 탭을 ${curScopeName()}에 만들었습니다`,4000);
}
/* ── 🏷 담는 탭: 선택한 명함을 탭에 담기 / 빼기 ── */
function manualTabsHere(){
  const cur=state.group||'all';
  return Object.values(state.views||{})
    .filter(v=>v&&v.manual&&(v.kind||'card')===state.tab&&(v.scope||'all')===cur)
    .sort((a,b)=>(a.order||0)-(b.order||0));
}
function selAddToTab(){
  const ids=Object.keys(state.sel);
  if(!ids.length) return toast('명함을 먼저 선택하세요');
  const tabs=manualTabsHere();
  $('menuM').innerHTML=`
    <div class="mhead"><b>🏷 ${ids.length}개 명함을 담을 탭</b><button class="iconbtn" onclick="menuBg.classList.remove('open')">✕</button></div>
