/* ══════ 보낸 사람 이름 — 순수 로직 (테스트 대상) ══════
   대표 지시 2026-08-10: "보낸사람은 이름으로 나와야 된다."
   그동안 로그인 계정을 그대로 잘라 써서 「p001」로 나왔다. 사람 이름이 아니면
   누가 보냈는지 알 수 없다.

   ⚠ 명부를 아직 못 읽었거나 명부에 없는 계정이면 **계정 앞부분이라도 보여준다** —
     빈칸으로 두면 「누가 보냈는지 모르는 메일」이 되어 더 나쁘다. */
function staffNameOf(dirMap, email){
  const e = String(email||'').trim().toLowerCase();
  if(!e) return '';
  const hit = dirMap && dirMap[e];
  if(hit) return hit;
  return e.split('@')[0];
}
function staffName(email){ return staffNameOf(ErpMatch.nameByEmail, email); }

/* ══════ 목록 골라 한 번에 — 순수 로직 (테스트 대상) ══════
   대표 지시 2026-08-10: "푸른명함첩에 생성되는 서류들은 모두 넘버링 넣고 ㅁ 로
   체크해서 삭제 이동등 할 수 있는 시스템을 꼭 만들어 달라."

   자료함·보낸 메일·예약한 메일 **세 목록이 같은 방식**을 쓴다. 목록마다 다른 방식으로
   고르게 만들면 쓰는 사람이 매번 새로 배워야 한다.

   ⚠ 골라 둔 것에서 **지금 목록에 없는 것을 반드시 걸러낸다.** 고른 뒤 찾기말을 바꾸거나
     남이 지우면, 안 보이는 것이 조용히 딸려 와 함께 지워진다. */
function pickOn(sel, id){ return !!(sel && sel[id]); }
function pickToggle(sel, id){
  const s = Object.assign({}, sel||{});
  if (s[id]) delete s[id]; else s[id] = true;
  return s;
}
/* 지금 보이는 것 전부 켜기·끄기 — 걸러 놓은 것만 걸린다 */
function pickSetAll(sel, ids, on){
  const s = Object.assign({}, sel||{});
  (ids||[]).forEach(id => { if (on) s[id] = true; else delete s[id]; });
  return s;
}
/* 실제로 손댈 번호들 — **지금 목록에 있는 것만** */
function pickList(sel, ids){ return (ids||[]).filter(id => pickOn(sel, id)); }
/* 보이는 것이 다 켜져 있나 (「모두 고르기」 단추의 상태) */
function pickAllOn(sel, ids){
  return !!(ids && ids.length) && ids.every(id => pickOn(sel, id));
}
/* 목록에서 사라진 번호는 버린다 — 안 버리면 개수가 틀려 「3개 지우기」인데 2개만 지운다 */
function pickPrune(sel, ids){
  const live = new Set(ids||[]);
  const s = {};
  Object.keys(sel||{}).forEach(id => { if (live.has(id)) s[id] = true; });
  return s;
}
/* ══════ 목록 골라 한 번에 — 화면 ══════ */

/* 세 목록이 각각 따로 기억한다 — 자료함에서 고른 것이 메일 목록에 딸려가면 안 된다 */
function pickOf(kind){ state.pick = state.pick||{}; return state.pick[kind]||{}; }
function pickPut(kind, sel){ state.pick = state.pick||{}; state.pick[kind] = sel; }
function pickClear(kind){ pickPut(kind, {}); }

/* 골라 둔 개수와 단추를 그리는 띠 — 셋이 같은 모양이어야 한다 */
/* 고른 것이 있을 때만 나오는 얇은 띠 (대표 지시 2026-08-15: "한 줄로 컴팩트하게").
   ⚠ 「모두 고르기」는 여기 두지 않는다 — 표 머리의 ☐ 로 옮겼다(pickHeadBox).
     늘 자리를 차지하던 안내 줄도 뺐다. 고른 것이 없으면 띠 자체가 없다. */
function pickBar(kind, ids, acts){
  const sel = pickOf(kind);
  const on = pickList(sel, ids);
  if(!on.length) return '';
  return `<div class="pkbar on">
    <span class="pkn"><b>${on.length}</b>개 골랐습니다</span>${acts}
    <button class="pkx" onclick="pickCancel('${kind}')">고르기 취소</button>
  </div>`;
}
/* 표 머리의 전체 고르기 ☐ — 「보낸 때」 왼쪽 칸에 들어간다 */
function pickHeadBox(kind, ids){
  const allOn = pickAllOn(pickOf(kind), ids);
  return `<th class="pk"><input type="checkbox" ${allOn?'checked':''}
    onchange="pickToggleAll('${kind}')" title="이 목록 ${ids.length}개를 모두 고르거나 풉니다"></th>`;
}
/* 카드로 늘어선 목록(자료함)용 — 표가 없으니 첫 카드의 ☐ 바로 위에 한 줄로 둔다 */
function pickHeadLine(kind, ids){
  if(!ids.length) return '';
  const allOn = pickAllOn(pickOf(kind), ids);
  return `<label class="matpkhead" title="이 목록 ${ids.length}개를 모두 고르거나 풉니다">
    <input type="checkbox" ${allOn?'checked':''} onchange="pickToggleAll('${kind}')">모두 고르기</label>`;
}
/* 화면마다 다시 그리는 함수가 다르다 — 한 곳에 모아 둔다 */
function pickRedraw(kind){
  if (kind === 'mat') renderMatPage(); else renderMailPage();
}
/* 지금 화면에 보이는 번호들 — 걸러 놓은 것·찾은 것만.
   ⚠ 「모두 고르기」와 일괄 처리가 **이것만** 본다. 전체 목록을 보면 걸러서 안 보이는
     것까지 딸려 와 함께 지워진다. */
/* 자료함이 지금 보여주는 번호들 — renderMatPage 가 목록을 만드는 식과 **같은 식**이다.
   화면에서 값을 받아 두면 화면을 안 그린 채 눌렸을 때 낡은 값으로 지우게 된다. */
function matVisibleIds(){
  return matSearchList(matListByCat(state.matCat||'all'), state.matQ).map(m=>m.id);
}
function pickVisible(kind){
  if (kind === 'mat')  return matVisibleIds();
  if (kind === 'mbox') return mbVisibleKeys();
  if (kind === 'sent') return sentVisibleRows().map(v=>v.id);
  if (kind === 'sched') return schedList().map(v=>v.id);
  return [];
}
function pickHit(kind, id){ pickPut(kind, pickToggle(pickOf(kind), id)); pickRedraw(kind); }
function pickToggleAll(kind){
  const ids = pickVisible(kind);
  pickPut(kind, pickSetAll(pickOf(kind), ids, !pickAllOn(pickOf(kind), ids)));
  pickRedraw(kind);
}
function pickCancel(kind){ pickClear(kind); pickRedraw(kind); }

/* ── 보낸 메일 기록 지우기 — 없앰(대표 지시 2026-08-23) ──
   ☐ 를 거두니 고를 수가 없어 이 길로 들어올 방법이 없어졌다. 안 부르는 함수를
   남기면 다음 사람이 「쓰는 줄」 알고 고치게 된다. 되살릴 일이 생기면 git 에서
   되돌리면 된다: 이 자리에 pickDelSent() 가 있었다. */

/* ── 예약 여러 건 취소 ── */
async function pickCancelSched(){
  const ids = pickList(pickOf('sched'), pickVisible('sched'));
  if(!ids.length) return toast('고른 것이 없습니다');
  if(!confirm(`예약 ${ids.length}건을 취소합니다.\n\n아직 나가지 않은 메일이라 나가지 않게 됩니다.\n진행할까요?`)) return;
  try{
    const u = {};
    ids.forEach(id=>{ u[`${DB_ROOT}/scheduled/${id}`] = null; });
    await firebase.database().ref().update(u);
    ids.forEach(id=>{ delete state.schedBox[id]; });
    pickClear('sched'); renderPCSide(); renderMailPage();
    toast(`🗑 예약 ${ids.length}건을 취소했습니다`, 5000);
  }catch(e){ toast('취소하지 못했습니다: '+((e&&e.message)||''), 7000); }
}

/* ── 자료 여러 개 지우기·갈래 옮기기 ── */
async function pickDelMat(){
  const ids = pickList(pickOf('mat'), pickVisible('mat'));
  if(!ids.length) return toast('고른 것이 없습니다');
  const names = ids.map(id=>(_matMeta[id]||{}).name||'자료').slice(0,5).join(' · ');
  if(!confirm(`자료 ${ids.length}개를 지웁니다.\n${names}${ids.length>5?' …':''}\n\n`+
    `되돌릴 수 없습니다. 진행할까요?`)) return;
  try{
    const u = {};
    ids.forEach(id=>{ u[`${DB_ROOT}/materials/${id}`] = null; u[`${DB_ROOT}/materialFiles/${id}`] = null; });

    ids.forEach(id=>{
      delete _matMeta[id];
      if(state.matPrevId===id) state.matPrevId='';
      if(_he && _he.id===id) heClose();
      if(_mg && _mg.id===id) mgClose();
    });
    pickClear('mat'); matRefresh();
    toast(`🗑 자료 ${ids.length}개를 지웠습니다`, 5000);
  }catch(e){ toast('지우지 못했습니다: '+((e&&e.message)||''), 7000); }
}
async function pickMoveMat(){
  const ids = pickList(pickOf('mat'), pickVisible('mat'));
  if(!ids.length) return toast('고른 것이 없습니다');
  const cats = MAT_CATS_NOW();
  const to = prompt(`자료 ${ids.length}개를 어느 갈래로 옮길까요?\n\n`+
    cats.map((c,i)=>`${i+1}. ${c}`).join('\n')+`\n\n번호나 갈래 이름을 적어 주세요.`);
  if(to===null) return;
  const t = String(to).trim();
  const cat = /^\d+$/.test(t) ? cats[parseInt(t,10)-1] : cats.find(c=>c===t);
  if(!cat) return toast('그런 갈래가 없습니다 — 자료함에서 갈래를 먼저 만들어 주세요', 6000);
  try{
    const u = {};
    ids.forEach(id=>{ u[`${DB_ROOT}/materials/${id}/cat`] = cat; });
    await firebase.database().ref().update(u);
    ids.forEach(id=>{ if(_matMeta[id]) _matMeta[id].cat = cat; });
    pickClear('mat'); matRefresh();
    toast(`📁 자료 ${ids.length}개를 「${cat}」로 옮겼습니다`, 5000);
  }catch(e){ toast('옮기지 못했습니다: '+((e&&e.message)||''), 7000); }
}

/* 자료함 화면의 껍데기 — 제목줄·탭줄은 어느 탭에서나 같다 */
function matPageShell(tabs, inner, n){

     자리를 크게 먹어서, 자료가 몇 개만 있어도 화면이 상자로 가득했다.
     파일 목록을 보는 탭에서만 나온다(묶음·메일 본문·제안서 틀에는 올릴 것이 없다). */
  const up = (n===undefined) ? '' : `
    <label class="matadd-sm" id="matDrop"
      title="누르거나, 파일을 이 자리에 끌어다 놓으세요 · PDF·워드·한글·PPT·엑셀·이미지 (8MB 이하)">
      ＋ 새 자료 올리기
      <input type="file" multiple accept="${MAT_ACCEPT}" style="display:none" onchange="addMaterial(this)">
    </label>`;
  return `
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <button class="setback" onclick="closeMatPage()">← 목록으로</button>
      <h2 style="margin:0 0 10px;font-size:17px;color:#16223c">📎 자료함</h2>
      ${n===undefined?'':`<span style="margin:0 0 10px;font-size:12px;color:#8b98b3">고객에게 보낼 자료를 여기서 관리합니다 · ${n}개</span>`}

    <div class="mattabs">${tabs}</div>
    ${inner}`;
}
/* ── 갈래 만들기·이름 바꾸기·지우기 ──
   지울 때 자료를 함께 지우지 않는다. '기타'로 옮긴다 — 갈래는 서랍일 뿐이고
   서랍을 뺐다고 안에 든 것을 버리지는 않는다. */
function saveMatCats(arr){
  const clean = matCatsOf(arr).filter(c=>c!==MAT_CAT_ETC);   /* '기타'는 저장하지 않는다 — 늘 붙는다 */
  return firebase.database().ref(DB_ROOT+'/config/matCats').set(clean)
    .then(()=>{ _matCats = clean; });
}
function addMatCat(){
  const v = (prompt('새 갈래 이름을 입력하세요.\n(예: 산재서식, 취업규칙, 교육자료)')||'').trim();
  if(!v) return;
  if(v===MAT_CAT_ETC) return toast('「기타」는 이미 있는 갈래입니다');
  const cur = MAT_CATS_NOW().filter(c=>c!==MAT_CAT_ETC);
  if(cur.indexOf(v)>=0) return toast('같은 이름의 갈래가 이미 있습니다');
  saveMatCats(cur.concat([v]))
    .then(()=>{ toast(`갈래 「${v}」을(를) 만들었습니다`); setMatCat(v); })
    .catch(e=>toast('만들지 못했습니다: '+((e&&e.message)||'')));
}
function editMatCat(name){
  const n = matList().filter(m=>matCat(m)===name).length;
  const v = prompt(`갈래 「${name}」\n\n· 새 이름을 넣고 [확인] → 이름이 바뀝니다 (자료 ${n}개도 따라갑니다)\n`
    + `· 비워 두고 [확인] → 갈래를 지웁니다 (자료 ${n}개는 「기타」로 옮겨집니다)`, name);
  if(v===null) return;
  const to = String(v).trim();
  if(to===name) return;
  const cur = MAT_CATS_NOW().filter(c=>c!==MAT_CAT_ETC);
  if(to && cur.indexOf(to)>=0) return toast('같은 이름의 갈래가 이미 있습니다');
  if(to===MAT_CAT_ETC) return toast('「기타」라는 이름은 쓸 수 없습니다');

  const patch = to ? matCatRenamePatch(_matMeta, name, to) : matCatDeletePatch(_matMeta, name);
  if(!to && !confirm(`갈래 「${name}」을(를) 지웁니다.\n\n`
    + `· 안에 든 자료 ${n}개는 지워지지 않고 「기타」로 옮겨집니다\n\n진행할까요?`)) return;

  const upd = {};
  Object.keys(patch).forEach(id=>{ upd[`${DB_ROOT}/materials/${id}/cat`] = patch[id]; });
  const next = to ? cur.map(c=>c===name?to:c) : cur.filter(c=>c!==name);
  firebase.database().ref().update(upd)
    .then(()=>{ Object.keys(patch).forEach(id=>{ if(_matMeta[id]) _matMeta[id].cat = patch[id]; });
                return saveMatCats(next); })
    .then(()=>{ toast(to ? `갈래 이름을 「${to}」로 바꿨습니다` : `갈래를 지웠습니다 — 자료 ${n}개는 「기타」에 있습니다`, 6000);
                if(state.matCat===name) state.matCat = to || MAT_CAT_ETC;
                renderMatPage(); })
    .catch(e=>toast('바꾸지 못했습니다: '+((e&&e.message)||'')));
}
/* ── 순서 바꾸기 ── */
function moveMat(id, dir){
  const cat = state.matCat || 'all';
  const shown = matSearchList(matListByCat(cat), state.matQ);
  /* 화면에서 이웃한 줄과 자리를 바꾸고, 번호는 **전체 기준**으로 다시 매긴다 */
  const other = matNeighborId(shown, id, dir);
  if(!other) return;
  const order = matSwapOrder(matList(), id, other);
  if(!order) return;
  const upd = {};
  Object.keys(order).forEach(mid=>{
    upd[`${DB_ROOT}/materials/${mid}/order`] = order[mid];
    if(_matMeta[mid]) _matMeta[mid].order = order[mid];
  });
  renderMatPage();
  firebase.database().ref().update(upd).catch(e=>toast('순서를 저장하지 못했습니다: '+((e&&e.message)||'')));
}

function addMatSet(){
  const v=(prompt('묶음 이름을 입력하세요.\n(예: 신규 자문 3종, 계약 마무리)')||'').trim();
  if(!v) return;
  const id='s'+Date.now()+Math.random().toString(36).slice(2,6);
  const rec={id, name:v, ids:[], order:Date.now()};
  firebase.database().ref(DB_ROOT+'/matSets/'+id).set(rec)
    .then(()=>{ _matSets[id]=rec; toast('묶음을 만들었습니다 — 담을 자료를 고르세요',5000); renderMatPage(); })
    .catch(e=>toast('만들지 못했습니다: '+((e&&e.message)||'')));
}
function saveSetName(id, v){
  const s=_matSets[id]; if(!s) return;
  const name=String(v||'').trim(); if(!name || name===s.name) return;
  s.name=name;
  firebase.database().ref(DB_ROOT+'/matSets/'+id+'/name').set(name)
    .then(()=>toast('묶음 이름을 바꿨습니다')).catch(e=>toast('저장 실패: '+((e&&e.message)||'')));
}
function toggleSetItem(sid, mid, on){
  const s=_matSets[sid]; if(!s) return;
  const ids = (s.ids||[]).filter(x=>x!==mid);
  if(on) ids.push(mid);
  s.ids = ids;
  firebase.database().ref(DB_ROOT+'/matSets/'+sid+'/ids').set(ids)
    .then(()=>renderMatPage()).catch(e=>toast('저장 실패: '+((e&&e.message)||'')));
}
function deleteMatSet(id){
  const s=_matSets[id]; if(!s) return;
  if(!confirm(`묶음 「${s.name||''}」을(를) 지웁니다.\n자료 자체는 지워지지 않습니다.\n\n진행할까요?`)) return;
  firebase.database().ref(DB_ROOT+'/matSets/'+id).remove()
    .then(()=>{ delete _matSets[id]; toast('묶음을 지웠습니다'); renderMatPage(); })
    .catch(e=>toast('지우지 못했습니다: '+((e&&e.message)||'')));
}

function saveMatMail(){
  const subject=($('mailSubj')||{}).value||'';
  const body=($('mailBody')||{}).value||'';
  const sel=state.matMailCat||'';
  const path = sel ? `${DB_ROOT}/config/matMail/byCat/${sel}` : `${DB_ROOT}/config/matMail`;
  const val  = sel ? {subject, body} : Object.assign({}, matMailCfg(), {subject, body});
  firebase.database().ref(path).set(val)
    .then(()=>{ if(sel){ _matMail=_matMail||{}; _matMail.byCat=_matMail.byCat||{}; _matMail.byCat[sel]=val; }
                else { _matMail=val; }
                toast('메일 글을 저장했습니다'); renderMatPage(); })
    .catch(e=>toast('저장 실패: '+((e&&e.message)||'')));
}
/* 보내는 주소 — 비밀이 아니라서 화면에서 넣는다.
   ⚠ 비밀번호는 여기 넣지 않는다. 이 자리는 직원 누구나 읽는다. */
function saveMailFrom(v){
  const s = String(v||'').trim();
  if(s && !/^[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]{2,}$/.test(s))
    return toast('메일 주소 형식이 아닙니다 (예: 370-6@hanmail.net)', 6000);
  firebase.database().ref(`${DB_ROOT}/config/matMail/from`).set(s)
    .then(()=>{ _matMail = _matMail || {}; _matMail.from = s;
      toast(s?`보내는 주소를 ${s} 로 정했습니다`:'보내는 주소를 비웠습니다'); renderMatPage(); })
    .catch(e=>toast('저장 실패: '+((e&&e.message)||'')));
}
/* 쓰기 화면에서 바로 바꾸기 (대표 지시 2026-08-24 「보내는사람 주소를 바꿀수 있나?」).
   ⚠ 대표만. 전 직원이 함께 쓰는 회사 발송 주소라 직원이 바꾸면 모두의 메일이 흔들린다.
   ⚠ 저장은 이미 있는 saveMailFrom 을 그대로 쓴다 — 두 벌로 만들면 한쪽만 고친다. */
function editMailFrom(){
  if(!state.isAdmin) return toast('보내는 주소는 대표님만 바꿀 수 있습니다', 6000);
  const now = matMailCfg().from || '';
  const v = prompt('회사 발송 주소입니다.\n전 직원이 함께 쓰므로 바꾸면 모두에게 적용됩니다.\n\n'
    + '⚠ 다음메일 계정과 같은 주소여야 실제로 나갑니다.', now);
  if(v===null) return;
  saveMailFrom(v);
  if(state.view==='mail') setTimeout(renderMailPage, 300);
}

/* ── 나에게 시험 발송 ──
   설정이 맞는지 보려고 고객에게 진짜 메일을 보낼 수는 없다. 로그인한 본인에게
   한 통 보내 본다. 첨부도 명함도 걸지 않으므로 보낸 기록도 남지 않는다.
   ⚠ 실패하면 서버가 준 말을 그대로 보여 준다 — 어디가 막혔는지는 그 말에 있다. */
async function sendTestMail(){
  const cfg = matMailCfg();
  if(!cfg.from) return toast('먼저 「보내는 주소」를 넣어 주세요');
  /* 받을 곳을 물어본다. 처음 값은 **회사 메일 자기 자신** —
     로그인 계정(myEmail)은 앱에 들어올 때 쓰는 이름일 뿐 진짜 메일함이 아닐 수 있다.
     실제로 p001@pureun.kr 로 보냈다가 구글이 「그런 주소 없다」로 반송했다(2026-08-09). */
  const to = (prompt('시험 메일을 어디로 받으시겠습니까?\n\n'
    + '· 회사 메일로 그냥 두면 자기 자신에게 보냅니다 (가장 확실합니다)\n'

    + `고객에게는 가지 않습니다. 진행할까요?`)) return;
  toast('시험 메일을 보내는 중…', 30000);
  try{
    const r = await postAutoMail({
      to: to,
      subject: '[푸른 기업정보함] 자료 메일 시험 발송',
      body: '이 메일이 보이면 자료 메일 자동 발송이 준비된 것입니다.\n\n'
          + `보내는 주소 · ${cfg.from}\n보낸 때 · ${fmtDate(Date.now())}\n\n푸른노무법인\n`,
      matIds: []
    });
    toast(`✅ 보냈습니다 — ${esc(r.from||cfg.from)} 에서 ${esc(to)} 로\n`
      + `받은편지함을 확인해 주세요 (스팸함도 함께)`, 12000);
  }catch(e){
    alert('시험 발송이 안 됐습니다.\n\n' + ((e&&e.message)||'알 수 없는 오류'));
  }
}

/* 이름·설명은 칸에서 나갈 때 저장한다 — 저장 단추를 따로 두면 안 누르고 넘어간다 */
function saveMatField(id, key, val){
  const m=_matMeta[id]; if(!m) return;
  const v=String(val||'').trim();
  if((m[key]||'')===v) return;
  m[key]=v;
  firebase.database().ref(DB_ROOT+'/materials/'+id+'/'+key).set(v)
    .then(()=>toast(key==='name'?'이름을 바꿨습니다':'설명을 저장했습니다'))
    .catch(e=>toast('저장 실패: '+((e&&e.message)||'')));
}
function initMatDrop(){
  const z=$('matDrop'); if(!z || z._dnd) return; z._dnd=true;
  ['dragenter','dragover'].forEach(ev=>z.addEventListener(ev, e=>{ e.preventDefault(); z.classList.add('on'); }));
  z.addEventListener('dragleave', e=>{ if(!z.contains(e.relatedTarget)) z.classList.remove('on'); });
  z.addEventListener('drop', async e=>{
    /* ⚠ stopPropagation 을 빠뜨리면 안 된다. window 에도 파일 드롭 핸들러가 있어서
       같은 파일이 **명함 등록**으로도 흘러간다 — 한글·PDF 를 명함 사진으로 읽으려다
       "파일을 읽을 수 없습니다" 가 뜬다. 자료는 올라갔는데 오류만 보이니 더 헷갈린다. */
    e.preventDefault(); e.stopPropagation(); z.classList.remove('on');
    const files=[...((e.dataTransfer&&e.dataTransfer.files)||[])];
    const ok=files.filter(f=>matType(f.name));
    if(!ok.length){ toast('지원하지 않는 파일 형식입니다 (PDF·워드·한글·PPT·엑셀·이미지 등)'); return; }
    if(ok.length<files.length) toast(`지원하지 않는 형식 ${files.length-ok.length}개는 건너뜁니다`);
    for(const f of ok){
      await putMaterial('m'+Date.now()+Math.random().toString(36).slice(2,6), matNameOf(f.name), f);
    }
    toast(`올렸습니다 (${ok.length}개) — 설명은 목록에서 채우시면 됩니다`, 5000);
  });
}

/* ── 자료함 (대시보드에서: 관리 — 올리기·교체·미리보기·삭제) ── */

/* PDF를 자료함 시트 위로 끌어다 놓으면 업로드 */
function initShelfDnd(){
  const sh=$('matShelfSheet'); if(sh._dnd) return; sh._dnd=true;
  ['dragenter','dragover'].forEach(ev=>sh.addEventListener(ev, e=>{ e.preventDefault(); sh.classList.add('dragging'); }));
  sh.addEventListener('dragleave', e=>{ if(!sh.contains(e.relatedTarget)) sh.classList.remove('dragging'); });
  sh.addEventListener('drop', async e=>{
    /* 본문 자료함(initMatDrop)과 같은 이유로 여기서 이벤트를 끊는다 */
    e.preventDefault(); e.stopPropagation(); sh.classList.remove('dragging');
    const files=[...((e.dataTransfer&&e.dataTransfer.files)||[])];
    const ok=files.filter(f=>matType(f.name));
    if(!ok.length){ toast('지원하지 않는 파일 형식입니다 (PDF·워드·한글·PPT·엑셀·이미지 등)'); return; }
    if(ok.length<files.length) toast(`지원하지 않는 형식 ${files.length-ok.length}개는 건너뜁니다`);
    for(const f of ok){
      await putMaterial('m'+Date.now()+Math.random().toString(36).slice(2,6), matNameOf(f.name), f);
    }
  });
}
function closeMatShelf(){ $('matShelfBg').classList.remove('open'); }
/* 새 자료가 들어갈 갈래 — 지금 열어 둔 탭. 「전체」나 탭이 아닌 화면(묶음·메일틀)에서
   올렸으면 갈래를 정하지 않는다(= 기타). */
function matNewCat(){
  const c = state.matCat || 'all';
  return (MAT_CATS_NOW().indexOf(c) >= 0 && c !== MAT_CAT_ETC) ? c : '';
}
/* 자료함은 화면이 둘이다 — 본문(pcMat)과 옛 팝업(matShelfSheet).
   올리기·삭제 뒤에 **지금 보고 있는 쪽**을 다시 그린다. 한쪽만 그리면
   "올렸는데 목록에 안 나온다"가 된다. */
function matRefresh(){
  try{ if(state.view==='mat') renderMatPage(); }catch(_){}
  try{ if($('matShelfBg') && $('matShelfBg').classList.contains('open')) renderMaterialShelf(); }catch(_){}
}
function renderMaterialShelf(){
  const list = matList();
  const rows = list.length ? list.map(m=>`
      <div class="sm-slot">
        <span class="sm-ic">${matIcon(m.fileName)}</span>
        <div class="sm-sinfo"><div class="n">${esc(m.name||'자료')}</div><div class="f">${esc(m.fileName||'')} · ${fmtDate(m.uploadedAt)}</div></div>
        <div class="shelf-acts">
          <button title="미리보기" onclick="previewMaterial('${m.id}')">👁</button>
          <button title="서식을 표 모양 그대로 펼쳐 한 화면에서 고칩니다" onclick="openMatEditor('${m.id}')">✏</button>
          <label title="파일 교체" class="shelf-rep">🔄<input type="file" accept="${MAT_ACCEPT}" style="display:none" onchange="replaceMaterialFile('${m.id}',this)"></label>
          <button title="삭제" onclick="deleteMaterial('${m.id}')">🗑</button>
        </div>
      </div>`).join('')
    : `<div class="sm-empty">아직 자료가 없습니다.<br>아래 <b>＋ 새 자료 올리기</b>로 회사소개서·계약서 등을 올리세요.</div>`;
  $('matShelfSheet').innerHTML = `
    <div class="sm-head">
      <div class="sm-htxt"><div class="t">📎 자료함</div><div class="s">고객에게 보낼 자료를 여기서 관리합니다</div></div>
      <button class="sm-x" onclick="closeMatShelf()">✕</button>
    </div>
    <label class="shelf-add">＋ 새 자료 올리기 (파일 끌어다 놓기도 가능)<input type="file" accept="${MAT_ACCEPT}" style="display:none" onchange="addMaterial(this)"></label>
    ${rows}
    <div class="sm-note">여기 올린 자료가 고객 명함의 "자료 보내기"에 자동으로 나타납니다. PDF·워드·한글(hwp/hwpx)·PPT·엑셀·이미지 파일을 이 창에 끌어다 놓아도 올라갑니다 (8MB 이하).</div>`;
}
/* 올린 파일 이름을 그대로 자료 이름으로 쓴다 (대표 지시 2026-08-09).
   예전에는 이름을 물어봤는데, 파일 이름을 이미 그렇게 지어 두고 올리므로
   똑같은 말을 한 번 더 치는 일이 됐다. 고칠 것은 목록에서 바로 고친다.
   확장자는 뗀다 — 아래 줄에 파일 이름이 따로 나오므로 두 번 보일 이유가 없다. */
function matNameOf(fileName){
  return String(fileName||'').replace(/\.[a-z0-9]+$/i,'').trim() || '자료';
}
async function addMaterial(input){
  const files = [...((input && input.files) || [])]; if(input) input.value='';
  if(!files.length) return;
  const ok = files.filter(f=>matType(f.name));
  if(!ok.length){ toast('지원하지 않는 파일 형식입니다 (PDF·워드·한글·PPT·엑셀·이미지 등)'); return; }
  if(ok.length<files.length) toast(`지원하지 않는 형식 ${files.length-ok.length}개는 건너뜁니다`);
  for(const f of ok){
    const id = 'm'+Date.now()+Math.random().toString(36).slice(2,6);
    await putMaterial(id, matNameOf(f.name), f);
  }
}
async function replaceMaterialFile(id, input){
  const file = input.files && input.files[0]; input.value='';
  if(!file) return;
  if(!matType(file.name)){ toast('지원하지 않는 파일 형식입니다 (PDF·워드·한글·PPT·엑셀·이미지 등)'); return; }
  const cur = _matMeta[id]; if(!cur) return;
  /* 열어 둔 한글 문서는 옛 파일이다 — 놓아야 새 파일을 보게 된다 */
  if(_he && _he.id===id) heClose();
  if(_mg && _mg.id===id) mgClose();
  await putMaterial(id, cur.name, file);
}
/* 파일 본문은 명함 사진과 같은 방식으로 DB에 저장 (Storage 미사용 — 권한설정 불필요) */
/* 올렸는지 못 올렸는지를 **돌려준다**(true/false).
   예전엔 아무것도 안 돌려주고 안에서 실패 알림만 띄웠다. 그래서 부르는 쪽은
   실패를 알 길이 없어 「✅ 저장했습니다」를 덧씌워 버렸다 — 계약서가 안 올라갔는데
   올라갔다고 말하는 셈이다. 부르는 쪽이 사실을 알 수 있어야 한다.
   ⚠ 던지지 않고 false 를 돌려준다. 이미 이 함수를 쓰는 여섯 곳이 반환값을 안 보므로
     던지면 그쪽들이 다 깨진다. */
async function putMaterial(id, name, file){
  if (file.size > 8*1024*1024){ toast(`파일이 너무 큽니다 (${(file.size/1024/1024).toFixed(1)}MB) — 8MB 이하만 올릴 수 있습니다`); return false; }
  toast('업로드 중…');
  try{
    const dataUrl = await new Promise((res,rej)=>{
      const r=new FileReader();
      r.onload=()=>res(r.result);
      r.onerror=()=>rej(new Error('파일을 읽을 수 없습니다'));
      r.readAsDataURL(file);
    });
    /* ⚠ 있던 자료를 교체하는 것일 수 있다. 새 값으로 통째로 덮으면 갈래·설명·순서가
       사라진다 — 파일만 바꿨을 뿐인데 정리해 둔 것이 날아간다. 있던 것 위에 얹는다. */
    const old = _matMeta[id] || {};
    const meta = Object.assign({}, old, {
      id, name, fileName:file.name, size:file.size, uploadedAt: Date.now(),
      /* 새로 올리는 것이면 **지금 보고 있는 갈래**에 넣는다. 제안서 탭에서 올렸는데
         '기타'로 들어가면 방금 올린 것이 눈앞에서 사라진다. */
      cat: old.cat || matNewCat()
    });
    await firebase.database().ref(DB_ROOT+'/materialFiles/'+id).set(dataUrl);
    await firebase.database().ref(DB_ROOT+'/materials/'+id).set(meta);
    _matMeta[id]=meta;
    /* ⚠ 두 화면이 있다. 옛 팝업(renderMaterialShelf)만 새로 그리면 본문 자료함은
       그대로라 **올렸는데 목록에 안 나타난다.** 지금 보고 있는 쪽을 다시 그린다. */
    matRefresh();
    toast('✅ 올렸습니다');
    return true;
  }catch(e){
    console.warn('[upload]', e&&e.message);
    toast('업로드 실패: '+((e&&e.message)||'알 수 없는 오류'));
    return false;
  }
}
async function previewMaterial(id){
  const m=_matMeta[id]; if(!m) return;
  if (m.url){ window.open(m.url,'_blank'); return; }  /* 예전 Storage 방식으로 올린 자료 호환 */
  toast('여는 중…');
  try{
    const arr = await matBytes(id);
    if(/^(hwp|hwpx)$/.test(matExt(m.fileName))){ await openMaterialHwp(arr,m.fileName||m.name||'한글자료.hwp'); return; }
    const t = matType(m.fileName) || {mime:'application/octet-stream'};
    const url = URL.createObjectURL(new Blob([arr], {type:t.mime}));
    if (t.view){ window.open(url,'_blank'); }
    else { /* 한글·워드·PPT 등 브라우저가 못 여는 형식은 원본 파일명으로 내려받기 */
      const a=document.createElement('a'); a.href=url; a.download=m.fileName||'자료';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      toast('브라우저에서 바로 볼 수 없는 형식이라 내려받았습니다');
    }
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){ toast('미리보기 실패: '+((e&&e.message)||'')); }
}
async function deleteMaterial(id){
  const m=_matMeta[id]; if(!m) return;
  if(!confirm(`'${m.name}' 자료를 삭제할까요?`)) return;
  try{
    await firebase.database().ref(DB_ROOT+'/materials/'+id).remove();
    await firebase.database().ref(DB_ROOT+'/materialFiles/'+id).remove();
    delete _matMeta[id];
    /* 지운 자료를 미리보기가 들고 있으면 함께 접는다 */
    if(state.matPrevId===id){ state.matPrevId=''; if(_mpFor===id){ _mpFor=null; _mpHtml=''; } }
    if(_he && _he.id===id) heClose();          /* 지운 자료의 문서를 들고 있으면 안 된다 */
    if(_mg && _mg.id===id) mgClose();          /* 격자 편집기도 마찬가지다 */
    matRefresh();
    toast('삭제했습니다');
  }catch(e){ toast('삭제 실패: '+((e&&e.message)||'')); }
}
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const digits = s => String(s||'').replace(/\D/g,'');
const fmtDate = ts => { const d=new Date(ts||0);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; };
const fmtBizno = v => { const d=digits(v); return d.length===10 ? `${d.slice(0,3)}-${d.slice(3,5)}-${d.slice(5)}` : (v||''); };
function toast(msg, ms=2600){ const t=$('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.style.display='none', ms); }

/* ── 탭 / 정렬 ── */
function setTab(tab){ state.tab=tab; state.group='all'; state.page=0;
  /* 기업 상세는 갈래가 아니라 화면이다 — 명함·사업자로 돌아올 때 그 화면에서 나온다.
     안 그러면 명함 탭을 눌러도 회사 목록이 그대로 남는다. */
  if(state.view==='co') state.view='list';
  resetSelOnViewSwitch();
  /* 탭 «켜짐» 표시는 render()->syncMobileTabs() 가 상태에서 끌어내 그린다 — 여기서
     손으로 칠하지 않는다(두 곳에서 같은 일을 하면 한쪽만 고쳤을 때 어긋난다). */
  syncMobileSearchFor('list');
  render(); }
/* 폰 「🏢 기업 상세」 단추 — 겉모습은 탭이지만 갈래(state.tab)가 아니라 화면(state.view)을
   바꾼다. state.tab 에 셋째 값을 끼우면 it.kind===state.tab 인 자리들이 회사를 하나도
   못 찾고, 「사업자등록증」으로 잘못 불리는 안내문이 여럿 생긴다(대표 지시 2026-08-12). */
function openCoMobile(){
  state.view='co';
  resetSelOnViewSwitch();
  /* 탭 «켜짐» 표시는 render()->syncMobileTabs() 가 상태에서 끌어내 그린다. */
  syncMobileSearchFor('co');
  /* ★ 최종 전체 리뷰(2026-08-16) C1 — 예전에는 여기서 state.view 만 세우고 render() 를
     불렀다. 그런데 회사 폴더·탭·서류를 실어 오는 세 구독(loadCoInfo/loadCoFolders/
     loadCoTagHidden)은 PC 옆줄에서만 닿는 openCoPage() 안에서만 시작됐다 — 폰에서는
     _coInfo·_coFolders·_coTagHidden 이 영영 {} 라, 폴더 시트가 텅 비고 카드에 폴더·탭
     딱지가 안 붙고, 새 폴더·탭 담기·이알피 가져오기가 서버에는 쓰고 «성공» 안내까지
     띄운 뒤 화면은 그대로였다(되돌아올 신호가 없으니까). 두 진입로가 같은 자료 준비를
     하도록 enterCoView() 하나로 모은다 — 두 곳에 베끼면 한쪽만 고쳐진다. */
  enterCoView();
}
/* 화면을 오갈 때(명함⇄사업자⇄기업 상세) 고른 것과 편집 모드를 푼다 — 안 그러면

/* 폰 도구 단추를 지금 화면에 맞춘다(#subbar 의 ⇅ 정렬, ＋ 카메라 fab).

   글자와 실제로 걸린 거르개가 같은 것을 가리키게 맞춘다. PC 쪽 syncPcSearchFor 와 같은 몫.
   ★ 최종 전체 리뷰(2026-08-16) I4 — 예전엔 안내문구만 바꿨다. 기업 상세에서 「대명」을
     치고 명함 탭에서 「홍길동」을 친 뒤 다시 기업 상세로 오면, 칸에는 「홍길동」이 보이는데
     목록은 여전히 state.coQ 의 「대명」으로 걸러져 있었다(거꾸로도 마찬가지). */
function syncMobileSearchFor(view){

    s.value = state.q || '';
  }
}
function toggleSort(){

     뒤집으면 이름표만 「이름순」으로 바뀌고 목록은 꿈쩍도 안 한다 — 「눌렀는데 아무 일도
     안 난다」. 단추 자체는 syncMobileChrome() 이 감추지만, 다른 길로 불려도 이름표가
     거짓말하지 않도록 여기서도 막는다. */

  $('sortLabel').textContent = state.sort==='date' ? '등록일순' : '이름순'; render(); }

/* ── 목록 데이터 ── */
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function chosung(s){ let r='';
  for (const ch of String(s||'')){ const c=ch.charCodeAt(0);
    r += (c>=0xAC00 && c<=0xD7A3) ? CHO[Math.floor((c-0xAC00)/588)] : ch; }
  return r; }
/* 빈 명함(이름·회사·전화·이메일 모두 없음) 목록 — 정리 센터 건수 표시에도 사용 */
function emptyTargets(){
  return Object.values(state.items).filter(it=>it&&it.kind===state.tab)
    .filter(it=> !String(it.name||'').trim() && !String(it.company||'').trim()
              && !String(it.mobile||'').trim() && !String(it.tel||'').trim()
              && !String(it.companyTel||'').trim() && !String(it.email||'').trim());
}
/* 빈 명함 정리 — 이름·회사·전화·이메일이 모두 없는 항목 삭제 */
async function cleanEmpty(){
  const targets = Object.values(state.items).filter(it=>it.kind===state.tab)
    .filter(it=> !String(it.name||'').trim() && !String(it.company||'').trim()
              && !String(it.mobile||'').trim() && !String(it.tel||'').trim()
              && !String(it.companyTel||'').trim() && !String(it.email||'').trim());
  if (!targets.length) return toast('빈 명함이 없습니다');
  if (!confirm(`이름·회사·전화·이메일이 모두 없는 빈 명함 ${targets.length}건을 삭제할까요?`)) return;
  targets.forEach(it=>Store.del(it.id));
  toast(`빈 명함 ${targets.length}건을 삭제했습니다`);
}

/* 회사주소 앞 시·도 추출 (지역 필터용) */
function regionOf(it){
  const a=String(it.companyAddr||it.address||'').trim(); if(!a) return '';
  const m=a.match(/^(서울특별시|부산광역시|대구광역시|인천광역시|광주광역시|대전광역시|울산광역시|세종특별자치시|제주특별자치도|강원특별자치도|충청북도|충청남도|전라북도|전라남도|경상북도|경상남도|경기도|서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)/);
  if(!m) return '';
  const map={'서울특별시':'서울','부산광역시':'부산','대구광역시':'대구','인천광역시':'인천','광주광역시':'광주','대전광역시':'대전','울산광역시':'울산','세종특별자치시':'세종','경기도':'경기','강원특별자치도':'강원','충청북도':'충북','충청남도':'충남','전라북도':'전북','전라남도':'전남','경상북도':'경북','경상남도':'경남','제주특별자치도':'제주'};
  return map[m[1]]||m[1];
}
function listItems(){
  const q = $('search').value.trim().toLowerCase();
  const qc = q.replace(/\s/g,'');
  const isCho = qc && /^[ㄱ-ㅎ]+$/.test(qc);   /* 초성 검색: ㅎㄱㄷ → 홍길동 */
  const arr = Object.values(allItems())
    .filter(it => it.kind===state.tab)
    .filter(it => {
      if (state.group==='all') return true;
      return (it.group||'')===state.group;
    })
    .filter(it => state.owner==='all' || (it.owner||'')===state.owner)
    /* 담는 탭(직접 골라 담은 탭)이 켜져 있으면 그 탭에 담긴 명함만 */
    .filter(it => !state.vtab || (it.vtabs||[]).indexOf(state.vtab)>=0)
    .filter(it => {
      /* 잠긴 폴더(세션에서 해제 안 된)의 명함은 숨김. 단 그 폴더를 직접 열고 있으면 보임 */
      const gid = it.group||'';
      if (!gid) return true;
      const g = state.groups[gid];
      if (!g || !g.locked) return true;
      if (!canSeeGroup(g)) return false;                        /* 남의 잠긴 폴더 → 아예 안 보임 */
      if (state.unlocked && state.unlocked[gid]) return true;   /* 세션에서 풀림 */
      if (state.group===gid) return true;                       /* 그 폴더를 직접 보는 중 */
      return false;
    })
    .filter(it => !state.region || regionOf(it)===state.region)
    .filter(it => !q || [it.name,it.company,it.title,it.dept,it.mobile,it.tel,it.email,
                         it.ceo,it.bizno,it.address].some(v => String(v||'').toLowerCase().includes(q)
                         || (digits(q).length>=3 && digits(v).includes(digits(q))))
                || (isCho && [it.name,it.company,it.ceo].some(v=>chosung(v).replace(/\s/g,'').includes(qc))))
    /* 칸별 검색 필터 */
    .filter(it => {
      const f = state.colFilter || {};
      const has = (key, val) => !val || String(it[key]||'').toLowerCase().includes(String(val).toLowerCase());
      if (f.name && !(String(it.name||'').toLowerCase().includes(f.name.toLowerCase()))) return false;
      if (f.company && !(String(it.company||'').toLowerCase().includes(f.company.toLowerCase()))) return false;
      if (f.phone){ const d=digits(f.phone); if(!(digits(it.mobile).includes(d)||digits(it.tel).includes(d)||digits(it.companyTel).includes(d))) return false; }
      if (f.email && !has('email', f.email)) return false;
      return true;
    })
    /* 조건 필터: 전화있음 / 이메일있음 / 중복만 */
    .filter(it => {
      if (state.onlyPhone && !(it.mobile||it.tel||it.companyTel)) return false;
      if (state.onlyEmail && !it.email) return false;
      if (state.onlyIncomplete && (it.mobile||it.tel||it.companyTel) && it.email) return false;
      if (state.onlyPrivate && it.scope!=='private') return false;
      /* ERP 연결 필터: 자문/급여/노조/기금(유형) · linked(연결만) · none(미연결) */
      if (state.erpFilter){
        const m = ErpMatch.match(it);
        if (state.erpFilter==='none'){ if(m) return false; }
        else if (state.erpFilter==='linked'){ if(!m) return false; }
        else { if(!m || (m.type||'')!==state.erpFilter) return false; }
      }
      /* 담당 노무사 필터 — 표의 「담당」 배지를 눌러 걸린다(대표 지시 2026-08-11).
         유형 필터(위)와 따로 걸린다 — 「급여」만 보기와 「김보람 담당만 보기」는 다른 일이고,
         둘을 함께 걸면 「급여 중에서 김보람이 맡은 것」이 된다. */
      if (state.erpMgr && !ErpMatch.mgrs(it).includes(state.erpMgr)) return false;
      return true;
    });
  /* 중복만 보기 */
  let result = arr;
  if (state.onlyDup){
    const kc={}; Object.values(state.items).filter(x=>x.kind===state.tab)
      .forEach(x=>itemKeys(x).forEach(k=>kc[k]=(kc[k]||0)+1));
    result = arr.filter(it=>itemKeys(it).some(k=>kc[k]>1));
  }
  /* 헤더 클릭 정렬(PC) 우선, 없으면 기존 등록일/이름순 */
  if (state.sortKey){
    const dir = state.sortDir==='asc' ? 1 : -1;
    const val = (it)=>{
      switch(state.sortKey){
        case 'name': return it.name||it.company||'';
        case 'company': return it.company||'';
        case 'phone': return digits(it.mobile||it.tel||'');
        case 'date': return it.createdAt||0;
        default: return '';
      }
    };
    result.sort((a,b)=>{ const x=val(a),y=val(b);
      if (typeof x==='number') return (x-y)*dir;
      return String(x).localeCompare(String(y),'ko')*dir; });
  }
  else if (state.sort==='name')
    result.sort((a,b)=>String(a.name||a.company||'').localeCompare(String(b.name||b.company||''),'ko'));
  else result.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return result;
}

/* ── 렌더링 ── */
/* _quiet: 썸네일 옮기기처럼 items 를 수십 번 고치는 작업 중에는 다시 그리지 않는다
   (4,400줄을 배치마다 새로 그리면 몇 초씩 멈춘다) */
let _quiet = false;
/* 위 탭의 «켜짐» 표시는 화면 상태에서 끌어낸다 — setTab·openCoMobile 두 곳에서 손으로
   칠하면, 그 둘을 안 거치고 화면만 바꾸는 길(☰ 자료함·메일을 닫고 나올 때 등)에서
   탭은 「기업 상세」가 켜진 채 목록이 보이는 어긋남이 생긴다. */
function syncMobileTabs(){
  const co = state.view==='co';
  const t = $('tabCard'), b = $('tabBiz'), c = $('tabCo');
  if(t) t.classList.toggle('on', !co && state.tab==='card');
  if(b) b.classList.toggle('on', !co && state.tab==='biz');
  if(c) c.classList.toggle('on', co);
}
function render(){ if(_quiet) return; saveLastScreen(); syncMobileTabs(); syncMobileChrome();
  /* 메일 화면일 때는 갈래 줄·거르개 줄을 접는다 — 명함 목록 것이라 여기서는 뜻이 없다 */
  document.body.classList.toggle('mailview', state.view==='mail');
  if(state.view==='mail') return renderMailMobile();
  if(state.view==='co') return renderCoMobileList();
  renderSubbar(); renderSidebar(); renderList(); }

/* ══════ 마지막 본 화면 (대표 지시 2026-08-10) ══════
   "로그아웃 또는 다른 화면을 보다가 다시 명함·메일로 들어오면 마지막 들어왔던
    화면으로 기록해서 들어오게 해달라. 그리고 로그인 하는 사람마다 다를 텐데
    그 사람마다 각자 마지막 본 화면으로 보게 해라."

   ⚠ **사람마다 따로** 적는다. 한 PC를 여러 사람이 쓰므로 열쇠에 계정을 넣지
     않으면 앞사람이 보던 화면이 뒷사람에게 열린다.
   ⚠ 이 기기에만 적는다(localStorage). 화면 취향은 자리마다 다르고, 서버에 두면
     사무실 PC에서 보던 것이 폰에서 열린다.
   ⚠ 누구인지 모르는 동안에는 **적지도 읽지도 않는다.** 로그인 전 render 가
     먼저 도는데, 거기서 적으면 'anon' 자리에 남아 다음 사람에게 샌다. */
const LASTV_PREFIX = 'pucards_lastscreen_';
function lastScreenKey(){ return LASTV_PREFIX + (myUid || myEmail || ''); }
let _lastScreenSig = '';
function saveLastScreen(){
  if(!myUid && !myEmail) return;
  /* box 는 다음메일함의 «어느 칸»인가 — 이것까지 적어야 받은메일함을 보다 나갔을 때
     받은메일함으로 돌아온다(칸만 기억하면 늘 첫 칸으로 열린다). */
  const s = { view: state.view || 'list', tab: state.tab || 'card', mail: state.mailSent || false,
              box: (state.mailSent === 'box' ? (state.mbBox || '') : '') };
  const sig = JSON.stringify(s);
  if(sig === _lastScreenSig) return;   // 바뀔 때만 적는다 — render 는 수시로 돈다
  _lastScreenSig = sig;
  try{ localStorage.setItem(lastScreenKey(), sig); }catch(_){}
}

/* 들어올 때 한 번만. 화면을 직접 그리지 않고 **사람이 누르는 것과 같은 함수**를
   부른다 — 그래야 그 화면에 필요한 자료(자료함·보낸 메일 등)도 함께 딸려 온다. */
/* 주소가 메일 화면을 가리키는가 — 홈 화면의 「메일」 아이콘이 이 주소로 들어온다.
   ⚠ 머리(<head>)의 manifest 갈아 끼우기와 «같은 조건»이어야 한다. 한쪽만 고치면
     아이콘 이름은 메일인데 열리는 화면은 명함 목록이 된다. */
function urlWantsMail(){
  try{ return /(^|[?&])view=mail(&|$)/.test(location.search); }catch(_){ return false; }
}
/* ── 바탕화면에 「메일」 아이콘 만들기 (대표 지시 2026-08-21) ──
   ⚠ 아이콘은 «그 순간 걸려 있는 manifest» 로 담긴다. 명함 화면에서 누르면
     기업정보함이 담긴다 — 그래서 메일 문으로 먼저 옮긴 뒤 다시 부른다. */
let _pwaPrompt = null;
try{ window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); _pwaPrompt = e; }); }catch(_){}

function addMailIcon(){
  if(!urlWantsMail()){ location.href = 'pu-cards.html?view=mail&addicon=1'; return; }
  if(_pwaPrompt){ const p = _pwaPrompt; _pwaPrompt = null; p.prompt(); return; }

     못 한다고만 하면 길이 끊긴다. 어디로 가야 되는지까지 적는다. */

      + '※ 카카오톡·네이버 앱 «안의» 브라우저에서는 안 됩니다.\n'
      + '   크롬이나 삼성인터넷으로 이 주소를 열어 주세요.');

let _lastScreenDone = false;
function restoreLastScreen(){
  if(_lastScreenDone) return;
  if(!myUid && !myEmail) return;       // 아직 누구인지 모른다 — 다음 기회에
  _lastScreenDone = true;
  /* ★ 「푸른 메일」 아이콘으로 들어왔으면 주소가 이긴다 — 저장된 마지막 화면보다 앞선다.
     안 그러면 메일 아이콘을 눌렀는데 «마지막에 보던 명함 목록»이 열린다.
     그 창에서 목록으로 옮겨 가는 것은 자유다(‹ 목록) — 첫 화면만 정해 준다. */
  if(urlWantsMail()){
    /* ★ 첫 화면은 «받은메일함»이다 (대표 지시 2026-08-24 「메일함을 완벽하게 똑같이」).
       예전에는 쓰기 화면이 열렸다 — 메일함을 열었는데 빈 편지지가 나오는 셈이었고,
       쓰다 만 글이 있으면 「이어서 쓸까요?」 물음까지 문을 막았다.
       쓰기는 옆줄 [메일쓰기] 로 간다. */
    openMailBox('');
    /* 아이콘 만들려고 옮겨 온 길이면 이어서 마저 한다 — 브라우저가 알림을
       띄울 틈을 조금 준다(beforeinstallprompt 는 화면이 뜬 뒤에 온다). */
    try{ if(/(^|[?&])addicon=1(&|$)/.test(location.search)) setTimeout(addMailIcon, 900); }catch(_){}
    return;
  }
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(lastScreenKey()) || 'null'); }catch(_){}
  if(!s || !s.view) return;            // 처음 오신 분 — 기본 화면 그대로
  if(s.view === 'mat'){ openMatPage(); return; }
  /* 기업 상세 — 폰에만 갈래를 둔다(최종 전체 리뷰 M7). 이 화면은 이번 브랜치에서 처음
     생겨 갈래가 없었고, 그래서 폰에서 기업 상세를 보다 나갔다 들어오면 명함으로 열렸다.
     PC 는 예전 그대로 둔다 — PC 동작을 바꾸지 않는 것이 이번 범위의 약속이다. */
  if(s.view === 'co'){
    let isPc = false; try{ isPc = document.body.classList.contains('pc'); }catch(_){}
    if(!isPc){ openCoMobile(); return; }
  }
  if(s.view === 'mail'){
    /* ⚠ 'box'(다음메일함 목록)를 «맨 앞에» 둔다. 아래 `else if(s.mail)` 은 값이 있으면
       참이라, 이 줄이 없으면 메일함을 보다 나갔다 들어올 때 「보낸 메일」이 열린다
       (2026-08-24 에 그랬다). 갈래를 더할 때 이 자리를 함께 고쳐야 한다. */
    if(s.mail === 'box') openMailBox(s.box || '');
    else if(s.mail === 'inbox') openInbox();
    else if(s.mail === 'sched') openSchedBox();
    else if(s.mail) openSentBox();
    else openMailPage();
    return;
  }
  /* 목록 — 명함/사업자 중 마지막에 보던 쪽 */
  if(s.tab && s.tab !== state.tab) switchTab(s.tab);
}

/* ══════ 목록 나눠 보기 — 순수 로직 (테스트 대상) ══════
   긴 목록을 통째로 그리면 화면 조각이 수만 개가 되어 멈춘다. 더 나쁜 것은 네모 하나
   누를 때마다 처음부터 다시 그린다는 점이다. 그래서 「몇 개씩」 잘라 그린다.
   재 본 값(2026-08-16, 명함 6,270장): 통째 37,625조각·226ms → 100장씩 600조각·8ms.

   ⚠ 이 셈은 명함 목록·명함 표·기업 상세가 **한 벌**을 쓴다. 두 벌로 두면 한쪽만
     고쳤을 때 「1쪽인데 101번째부터 보인다」 같은 어긋남이 조용히 생긴다.
   ⚠ 쪽 번호는 **0부터** 센다(옛 명함 표가 그랬다). 화면에 적을 때만 +1 한다. */
const PAGE_SIZES = [50, 100, 200, 300, 500, 999999];
const LIST_PAGE_DEFAULT = 100;
/* 아는 값만 받는다 — 저장된 값이 깨졌거나 옛 값이어도 목록이 통째로 사라지면 안 된다 */
function pageSizeOk(v, def){
  const d = PAGE_SIZES.indexOf(def) >= 0 ? def : LIST_PAGE_DEFAULT;
  const n = (v === 'all') ? 999999 : Math.floor(Number(v));
  return PAGE_SIZES.indexOf(n) >= 0 ? n : d;
}
/* 아래 셋은 «이미 고른» 개수를 받는다. 그래도 0 이나 헛값이 들어오면 한 줄도 못 보게
   되므로 기본으로 되돌린다 — 화면이 비는 것보다는 낫다. */
const pageStep = size => { const n = Math.floor(Number(size)); return n >= 1 ? n : LIST_PAGE_DEFAULT; };
/* 총 쪽수 — 빈 목록도 1쪽이다. 0쪽이면 「0/0쪽」이라 적히고 앞뒤 단추가 둘 다 죽는다 */
function pageCount(total, size){
  return Math.max(1, Math.ceil((Number(total) || 0) / pageStep(size)));
}
/* 쪽 번호를 범위 안으로 — 21쪽을 보다가 조건을 바꾸면 그 쪽이 없어진다 */
function pageClamp(page, total, size){
  const last = pageCount(total, size) - 1;
  const p = Math.floor(Number(page) || 0);
  return p < 0 ? 0 : (p > last ? last : p);
}
/* 지금 쪽에 보일 것만 잘라 준다. 그리기와 「이 쪽 모두 고르기」가 **이 하나**를 같이 본다 */
function pageSlice(list, page, size){
  const all = Array.isArray(list) ? list : [];
  const s = pageStep(size);
  const total = all.length;
  const pages = pageCount(total, s);
  const p = pageClamp(page, total, s);
  const start = p * s;
  const rows = all.slice(start, start + s);
  return { rows, page: p, pages, size: s, total,
           from: total ? start + 1 : 0, to: start + rows.length };
}
/* ⭐ 즐겨찾기를 맨 앞으로 — 잘라 그리려면 «자르기 전에» 차례가 정해져 있어야 한다.
   예전에는 그리면서 즐겨찾기와 나머지를 따로 돌아 차례가 화면에만 있었다. */
function favFirst(items){
  const arr = items || [];
  return arr.filter(i => i.fav).concat(arr.filter(i => !i.fav));
}
/* ══════ 목록 나눠 보기 — 화면 ══════ */
/* 쪽 옮기기 띠 — 명함 표(#pcPager)와 같은 글귀. 목록마다 세는 말만 다르다(장/곳) */
function pagerHtml(info, unit, go){
  if(info.pages <= 1) return '';
  const btn = (label, pg, dis) => `<button ${dis?'disabled':''}
    ${dis?'':`onclick="${go}(${pg})"`}>${label}</button>`;
  return `<div class="copager">
    ${btn('◀ 이전', info.page-1, info.page===0)}
    <span>${info.from.toLocaleString()}–${info.to.toLocaleString()} / ${info.total.toLocaleString()}${unit}
      &nbsp;(${info.page+1}/${info.pages}쪽)</span>
    ${btn('다음 ▶', info.page+1, info.page>=info.pages-1)}
  </div>`;
}
/* 폰 명함 목록의 쪽 옮기기 — 누르면 맨 위로 올려 준다(안 그러면 새 쪽의 한가운데가 보인다) */
function listGoPage(p){
  state.page = p;
  render();
  try{ window.scrollTo(0,0); const m=$('main'); if(m) m.scrollTop=0; }catch(_){}
}

function renderList(){
  const items = listItems();
  if (!items.length){
    $('list').innerHTML = `<div class="empty">등록된 항목이 없습니다.<br><br>
      주황 <b style="color:var(--orange)">＋</b> 버튼으로 촬영하거나,<br>
      PC에서는 이미지·PDF를 화면에 끌어다 놓거나<br>카톡 이미지 복사 후 <b>Ctrl+V</b> 하면 자동 등록됩니다.</div>`;
    return;
  }
  function rowHtml(it){
    const isCard = state.tab==='card';
    const name = isCard ? (it.name || it.company || '(이름 없음)') : (it.company||'(상호 없음)');
    const l1 = isCard ? [it.title,it.dept].filter(Boolean).join(' / ') : (it.ceo ? '대표자 '+it.ceo : '');
    const l2 = isCard ? (it.company||'') : fmtBizno(it.bizno);
    /* 썸네일 상태 세 가지를 가른다 —
       ① it.thumb 에 값이 있다 = 옛 자료(아직 안 옮김) 또는 이미 받아 둔 것 → 바로 그린다
       ② it.thumb 이 빈 문자열 = 사진 없는 명함 → 첫 글자만, 받으러 가지 않는다
       ③ it.thumb 이 아예 없다 = 옮겨진 자료 → 화면에 들어올 때 받는다 */
    let thumbSrc = '', needFetch = false;
    if (it.thumb) thumbSrc = it.thumb;
    else if (it.thumb === '') thumbSrc = '';
    else if (Store.thumbCache[it.id] !== undefined) thumbSrc = Store.thumbCache[it.id];
    else needFetch = true;
    const th = thumbSrc ? `<img src="${thumbSrc}" loading="lazy">` : esc(name.charAt(0));
    const click = state.selMode ? `toggleSel('${it.id}')` : `openDetail('${it.id}')`;
    return `<div class="row" draggable="${!state.selMode}"
      ondragstart="onRowDrag(event,'${it.id}')" ondragend="this.classList.remove('dragging')"
      onclick="${click}">
      ${state.selMode?`<div class="selmark">${state.sel[it.id]?'✅':'⚪'}</div>`:''}
      <div class="rowmain"><div class="nm">${it.fav?'<span class="fav">⭐</span>':''}${esc(name)}${it.scope==='private'?'<span class="pv">개인</span>':''}</div>
        ${(function(){var e=ErpMatch.label(it);return e?`<div class="erpmgr">🏢 푸른담당 ${esc(e)}</div>`:'';})()}
        ${l1?`<div class="l1">${esc(l1)}</div>`:''}
        ${l2?`<div class="l2">${esc(l2)}</div>`:''}</div>
      <div class="thumb"${needFetch?` data-th="${it.id}"`:''}>${th}</div></div>`;
  }
  /* 이 쪽에 보일 것만 그린다 — 6,270장을 통째로 그리면 조각이 37,625개가 되어
     명함 하나 고를 때마다(toggleSel→render) 0.2~0.5초씩 멈췄다(대표 확인 2026-08-16).
     ⚠ 개수·쪽은 명함 표(#pcPageSize/#pcPager)와 **같은 state.pageSize/state.page** 를 쓴다.
       같은 명함을 보는 같은 목록이므로 따로 두면 폰과 PC가 서로 다른 쪽을 가리킨다. */
  const ordered = favFirst(items);
  const info = pageSlice(ordered, state.page, pageSizeOk(state.pageSize, LIST_PAGE_DEFAULT));
  state.page = info.page;                 /* 범위 밖이었으면 당겨진 값을 되꽂는다 */
  let h='', lastDate='', favHead=false;
  info.rows.forEach(it=>{
    /* ⭐ 머리는 즐겨찾기가 이 쪽에 실제로 있을 때만, 한 번만 */
    if (it.fav){
      if (!favHead){ h += `<div class="datehead">⭐ 즐겨찾기</div>`; favHead=true; }
      h += rowHtml(it); return;
    }
    if (state.sort==='date'){
      const d = fmtDate(it.createdAt||it.updatedAt);
      if (d!==lastDate){ h += `<div class="datehead">${d}</div>`; lastDate=d; }
    }
    h += rowHtml(it);
  });
  $('list').innerHTML = h + pagerHtml(info, '장', 'listGoPage');
  thumbWatch();
}

/* ── 화면에 들어온 명함만 썸네일을 받는다 ──
   4,400장을 한꺼번에 받으면 열 때마다 약 90MB. 보이는 것만 받으면 한 화면당 1MB 남짓이다.
   미리 300px 앞에서 받아 두어 내리는 도중에 빈 칸이 보이지 않게 한다. */
let _thObs = null;
function thumbFill(el){
  const id = el.getAttribute('data-th'); if(!id) return;
  el.removeAttribute('data-th');            /* 두 번 받지 않게 먼저 뗀다 */
  Store.getThumb(id).then(t=>{
    if(!t) return;                          /* 사진 없는 명함 — 첫 글자 그대로 둔다 */
    const it = state.items[id];
    if(it) it.thumb = t;                    /* 상세·확대·끌기 등 나머지 화면이 그대로 쓰게 되꽂는다 */
    if(el.isConnected) el.innerHTML = `<img src="${t}" loading="lazy">`;
  }).catch(()=>{});
}
let _thSeen = false, _thFallback = null;
function thumbWatch(){
  const els = document.querySelectorAll('#list .thumb[data-th]');
  if(!els.length) return;
  if(!('IntersectionObserver' in window)){ els.forEach(thumbFill); return; }
  if(!_thObs) _thObs = new IntersectionObserver(entries=>{
    _thSeen = true;                         /* 관찰기가 살아 있다는 증거 */
    entries.forEach(e=>{ if(e.isIntersecting){ _thObs.unobserve(e.target); thumbFill(e.target); } });
  }, { rootMargin:'300px 0px' });
  els.forEach(el=>_thObs.observe(el));
  /* 안전망 — 관찰기가 한 번도 안 알려 주면(창이 숨겨져 있거나 배치가 특이하면)
     앞쪽 30장만이라도 채운다. 빈 칸만 보이는 화면이 되는 것보다 낫다. */
  clearTimeout(_thFallback);
  _thFallback = setTimeout(function(){
    if(_thSeen) return;
    Array.prototype.slice.call(document.querySelectorAll('#list .thumb[data-th]'), 0, 30).forEach(thumbFill);
  }, 1500);
}
/* 상세·수정 화면은 썸네일이 있어야 사진 자리가 만들어진다(`it.thumb ? <img> : ''`).
   목록에서 아직 안 받은 명함도 검색·바로가기로 열 수 있으므로 여기서 한 번 챙긴다.
   앞·뒷면 두 장을 한 번에 받아 두면 그 뒤 화면들은 손댈 것이 없다. */
function ensureThumbs(id){
  const it = state.items[id];
  if(!it || it.thumb !== undefined) return Promise.resolve(it);
  return Promise.all([Store.getThumb(id), Store.getThumb(id+'_b')])
    .then(([a,b])=>{ it.thumb=a||''; it.thumb2=b||''; return it; })
    .catch(()=>{ it.thumb=it.thumb||''; return it; });
}

/* ══════ 한 번만 실행: 실시간DB 에 있는 원본 사진을 창고로 옮긴다 ══════
   대표 결정 2026-08-09 — 명함 4,400장 약 1.7GB 가 무료 한도(1GB)를 이것 하나로
   넘겨 데이터베이스가 멈출 뻔했다. 창고로 옮기면 0.1GB 로 떨어진다.

   ⚠ 순서를 지킨다: **올리고 → 되읽어 확인하고 → 그제야 지운다.**
      확인을 건너뛰고 지우면 창고에 안 올라간 사진이 영영 사라진다. 명함 사진은
      다시 찍을 수 없는 것이 많다(그 사람을 또 만나야 한다).
   ⚠ 개인 폴더 명함은 건드리지 않는다 — 창고 규칙에 그 자리가 없다(Store._inBucket).
   ⚠ 한 장씩 천천히 한다. 몰아서 던지면 창고가 막고, 실패한 것이 어느 장인지 모른다.
      중간에 끊겨도 다시 실행하면 **남은 것만** 이어서 한다(이미 옮긴 것은 건너뛴다). */
window.pucardsMovePhotosToStorage = async function(){
  if(Store.mode!=='firebase'){ console.log('실시간 공유 모드에서만 됩니다'); return; }
  if(typeof firebase==='undefined' || !firebase.storage){ console.log('창고를 쓸 수 없습니다 — 새로고침 후 다시'); return; }

  console.log('[명함첩] 실시간DB 에서 사진 목록을 읽는 중… (잠시 걸립니다)');
  let snap;
  try { snap = await Store.db.ref(`${DB_ROOT}/photos`).once('value'); }
  catch(e){ console.log('목록을 읽지 못했습니다: ' + (e && e.message)); return; }
  const all = snap.val() || {};
  const ids = Object.keys(all);
  if(!ids.length){ console.log('옮길 사진이 없습니다 — 이미 끝났습니다.'); toast('사진 옮기기 — 할 것 없음'); return; }

  const totalMB = (ids.reduce((s,k)=>s+String(all[k]||'').length,0)/1048576).toFixed(1);
  if(!confirm(`명함 사진 ${ids.length}장(약 ${totalMB}MB)을 파일 창고로 옮깁니다.\n\n` +
              `· 한 장씩 올리고 확인한 뒤에 실시간DB 에서 지웁니다\n` +
              `· 창을 닫지 마세요. 끊겨도 다시 실행하면 이어서 합니다\n\n계속할까요?`)) return;

  console.log(`[명함첩] ${ids.length}장(약 ${totalMB}MB) 옮기기 시작 — 창을 닫지 마세요`);
  _quiet = true;
  let done=0, skipped=0, failed=0;
  const bad = [];
  try {
    for(const id of ids){
      const dataUrl = all[id];
      if(!dataUrl || String(dataUrl).indexOf('data:')!==0){ skipped++; continue; }  // 빈 값·깨진 값은 두고 본다
      try {
        await Store._putToBucket(id, dataUrl);
        /* 되읽어 **실제로 들어갔는지** 본다. 여기서 걸리면 지우지 않는다. */
        const back = await Store._fetchFromBucket(id);
        if(!back || back.indexOf('data:')!==0) throw new Error('되읽기 실패');
        await Store.db.ref(`${DB_ROOT}/photos/${id}`).remove();
        delete Store.photoCache[id];
        done++;
      } catch(e){
        failed++; bad.push(id);
        console.warn(`  ✗ ${id} — ${e && e.message} (실시간DB 에 그대로 둡니다)`);
      }
      if((done+failed+skipped) % 100 === 0) console.log(`  ${done+failed+skipped} / ${ids.length} (옮김 ${done} · 실패 ${failed})`);
    }
  } finally { _quiet = false; }

  console.log(`[명함첩] 끝 — 옮김 ${done}장 · 건너뜀 ${skipped}장 · 실패 ${failed}장`);
  if(failed) console.log('  실패한 것은 실시간DB 에 그대로 있습니다. 다시 실행하면 재시도합니다:', bad.slice(0,20));
  toast(`사진 ${done}장을 창고로 옮겼습니다${failed?` (실패 ${failed}장)`:''} — 새로고침해 주세요`);
};

/* ── 한 번만 실행: 옛 명함의 썸네일을 items 밖(thumbs/)으로 옮긴다 ──
   옮기기 전에는 items 안에 썸네일이 그대로 있어 여전히 다 내려받는다.
   50장씩 원자적으로(다중경로 update) 옮기므로 도중에 끊겨도 다시 실행하면 이어서 한다.
   값은 시작할 때 한 번 떠 두고 쓴다 — 도중에 실시간 구독이 state.items 를 갈아끼우기 때문. */
window.pucardsMoveThumbs = async function(){
  if(Store.mode!=='firebase'){ console.log('실시간 공유 모드에서만 됩니다'); return; }
  const src = state.items;
  const jobs = [];
  Object.keys(src).forEach(id=>{
    const it = src[id]; if(!it) return;
    if(it.thumb)  jobs.push({ id, tid:id,        field:'thumb',  v:it.thumb  });
    if(it.thumb2) jobs.push({ id, tid:id+'_b',   field:'thumb2', v:it.thumb2 });
  });
  if(!jobs.length){ console.log('옮길 썸네일이 없습니다 — 이미 끝났습니다.'); toast('썸네일 옮기기 — 할 것 없음'); return; }
  const totalMB = (jobs.reduce((s,j)=>s+j.v.length,0)/1048576).toFixed(1);
  console.log(`[명함첩] 썸네일 ${jobs.length}장(약 ${totalMB}MB) 옮기기 시작 — 창을 닫지 마세요`);
  _quiet = true;
  let done = 0;
  try {
    for(let i=0;i<jobs.length;i+=50){
      const u = {};
      jobs.slice(i,i+50).forEach(j=>{
        u[`${DB_ROOT}/thumbs/${j.tid}`] = j.v;
        u[`${DB_ROOT}/items/${j.id}/${j.field}`] = null;
      });
      await Store.db.ref().update(u);
      done += Object.keys(u).length/2;
      if(done % 500 < 50) console.log(`  ${done} / ${jobs.length}`);
    }
    console.log(`[명함첩] 끝 — ${done}장, 약 ${totalMB}MB 를 items 밖으로 옮겼습니다. 새로고침하세요.`);
    toast(`썸네일 ${done}장 옮김 — 새로고침해 주세요`);
  } catch(e){
    console.log(`[명함첩] ${done}장까지 옮기고 멈췄습니다: ${e && e.message} — 다시 실행하면 이어서 합니다`);
    toast('썸네일 옮기기 중단 — 다시 실행해 주세요');
  } finally { _quiet = false; render(); }
};

/* ── 한 번만 실행: 이미 쌓인 원본 사진을 800px 로 줄인다 ──
   원본은 1600px 로 담겨 있어 장당 약 0.4MB × 4,400장 ≈ 1.7GB — 무료 저장 한도(1GB)를 이것 하나로 넘긴다.
   파일 창고를 못 쓰는 계정이라(신규 버킷은 유료 전용) 줄이는 것 말고는 길이 없다.
   ⚠ 화질은 되돌릴 수 없다. 한 장씩 받아 다시 만들어 덮어쓴다.
   이미 800px 이하면 건드리지 않으므로 중간에 끊겨도 다시 실행하면 이어서 한다. */
window.pucardsShrinkPhotos = async function(){
  if(Store.mode!=='firebase'){ console.log('실시간 공유 모드에서만 됩니다'); return; }
  /* 되돌릴 수 없는 작업이라 한 번 묻는다.
     유료(Blaze)로 올려 사진을 파일 창고로 옮길 생각이면 **깎을 이유가 없다** —
     창고로 가면 원본 화질 그대로 옮길 수 있다. 그 전에 깎으면 원본이 영영 사라진다. */
  const yes = confirm(
    '명함 사진을 800px(사업자등록증은 1400px)로 줄입니다.\n\n' +
    '⚠ 화질은 되돌릴 수 없습니다. 원본 1600px 이 사라집니다.\n\n' +
    '유료 요금제로 올려 파일 창고를 쓸 계획이라면 지금 줄이지 마세요 —\n' +
    '창고로 옮기면 원본 화질 그대로 용량 문제가 해결됩니다.\n\n' +
    '그래도 지금 줄이시겠습니까?');
  if(!yes){ console.log('취소했습니다 — 사진은 그대로입니다.'); return; }
  const ids = [];
  Object.keys(state.items).forEach(id=>{ ids.push(id); ids.push(id+'_b'); });
  console.log(`[명함첩] 사진 줄이기 시작 — 확인할 자리 ${ids.length}곳. 오래 걸립니다(수 분). 창을 닫지 마세요.`);
  let looked=0, shrunk=0, before=0, after=0, err=0;
  for(const pid of ids){
    looked++;
    try{
      const snap = await Store.db.ref(`${DB_ROOT}/photos/${pid}`).once('value');
      const cur = snap.val();
      if(!cur) continue;
      const small = await shrinkForStore(cur, photoKeepMax(pid));   /* 사업자등록증은 덜 줄인다 */
      if(small.length >= cur.length) continue;          /* 이미 작다 — 쓰지 않는다 */
      await Store.db.ref(`${DB_ROOT}/photos/${pid}`).set(small);
      Store.photoCache[pid] = small;
      shrunk++; before += cur.length; after += small.length;
    }catch(e){ err++; }
    if(looked % 200 === 0){
      console.log(`  ${looked} / ${ids.length} 확인 · ${shrunk}장 줄임 · ` +
        `${(before/1048576).toFixed(0)}MB → ${(after/1048576).toFixed(0)}MB`);
      toast(`사진 줄이는 중… ${looked}/${ids.length}`, 4000);
    }
  }
  const saved = ((before-after)/1048576).toFixed(0);
  console.log(`[명함첩] 끝 — ${shrunk}장을 줄여 약 ${saved}MB 를 비웠습니다.` + (err?` (실패 ${err}건)`:''));
  toast(`사진 ${shrunk}장 줄임 — 약 ${saved}MB 비움`);
};

/* ══════ 끌어서 여러 개 고르기 — 순수 로직 (테스트 대상) ══════
   대표 지시 2026-08-17: "ㅁ 체크할 때 하나씩 하면 힘들다. 마우스로 드래그해서 한 번에
   여러 개 가능하게 해달라 — 명함·사업자 모두 이동·삭제·변경까지."

   ★ 엑셀과 같은 손놀림이다. 첫 네모를 누른 순간 그것이 «켜짐/꺼짐» 중 하나로 정해지고,
     끌고 지나가는 줄이 모두 «같은 상태»가 된다. 지나갈 때마다 뒤집으면(toggle) 손이
     살짝 흔들려 같은 줄을 두 번 지날 때 값이 되돌아가 버린다.
   ★ 처음 누른 줄부터 «지금 줄까지 통째로» 다시 칠한다. 지나간 줄만 칠하면, 너무 많이
     내려갔다가 되올라올 때 아까 칠한 것이 안 풀린다.

   ⚠ 이것은 «네모 칸»에서만 시작한다. 줄 몸통에는 이미 「끌어서 폴더로 옮기기」가
     붙어 있어, 같은 자리에서 두 가지가 시작되면 어느 쪽인지 알 수 없다. */
function dragRange(ids, fromId, toId){
  const arr = ids || [];
  const a = arr.indexOf(fromId), b = arr.indexOf(toId);
  if(a < 0 || b < 0) return [];
  return arr.slice(Math.min(a, b), Math.max(a, b) + 1);
}
/* 고른 것 꾸러미에 켜고 끄기 — 끌 때는 «칸 자체를 없앤다».
   빈 값을 남기면 Object.keys 로 세는 곳들이 안 고른 것까지 세게 된다. */
function dragApply(bag, ids, on){
  const b = bag || {};
  (ids || []).forEach(id => { if(on) b[id] = 1; else delete b[id]; });
  return b;
}
/* 범위 밖으로 빠진 줄을 «끌기 전 상태»로 되돌린다.
   ⚠ 이것이 없으면 아래로 너무 많이 끌었다가 되올라와도 지나쳤던 줄이 그대로 남는다
     (2026-08-17 실제로 확인: 5줄까지 끌고 2줄로 되올라왔는데 5줄이 고른 채였다).
   ⚠ 그냥 «꺼짐»으로 만들면 안 된다 — 끌기 전에 이미 골라 두었던 줄까지 풀려 버린다. */
function dragRestore(bag, ids, before){
  const b = bag || {};
  const had = (before && typeof before.has === 'function') ? before : { has: () => false };
  (ids || []).forEach(id => { if(had.has(id)) b[id] = 1; else delete b[id]; });
  return b;
}
/* 지난번 범위에서 이번 범위에 «없는» 것들 — 되돌릴 대상 */
function dragDropped(prevIds, nextIds){
  const keep = new Set(nextIds || []);
  return (prevIds || []).filter(id => !keep.has(id));
}

/* ══════ 끌어서 여러 개 고르기 — 화면 ══════ */
let _dragSel = null;
/* 갈래마다 «지금 화면에 보이는 차례»와 «고른 꾸러미»가 다르다 — 한 곳에 모아 둔다.
   ⚠ 차례는 반드시 «그린 것과 같은 차례»여야 한다. 따로 계산하면 끌었을 때
     화면에 안 보이는 줄이 사이에 끼어 함께 고르진다. */
function dragSelCtx(kind){
  if(kind === 'co'){
    return { bag: state.coSel,
             ids: [...document.querySelectorAll('.cotbl [data-selid]')].map(e=>e.dataset.selid),
             done: ()=>renderCoAny() };
  }
  return { bag: state.sel,
           ids: [...document.querySelectorAll('#pcTable [data-selid]')].map(e=>e.dataset.selid),
           done: ()=>{ renderSelbar(); render(); } };
}
/* 끄는 동안에는 화면을 통째로 다시 그리지 않는다 — 다시 그리면 마우스가 좇던 줄이
   사라져 끌기가 끊기고, 4천 줄이면 한 칸 지날 때마다 멈춘다. 네모만 직접 칠한다. */
function dragPaint(kind, ids, on){
  const root = kind === 'co' ? document.querySelector('.cotbl') : document.getElementById('pcTable');
  if(!root) return;
  (ids || []).forEach(id=>{
    const row = root.querySelector(`[data-selid="${CSS.escape(id)}"]`);
    if(!row) return;
    const box = row.querySelector('input[type=checkbox]');
    if(box) box.checked = !!on;
    row.classList.toggle('pkon', !!on);
  });
}
function dragSelStart(ev, kind, id){
  if(ev && ev.button) return;              /* 왼쪽 단추만 */
  if(ev){ ev.preventDefault(); ev.stopPropagation(); }
  const ctx = dragSelCtx(kind);
  const on = !ctx.bag[id];
  /* 끌기 «전» 상태를 찍어 둔다 — 되올라올 때 원래대로 돌리려면 이것이 있어야 한다 */
  const before = new Set(Object.keys(ctx.bag));
  _dragSel = { kind:kind, ids:ctx.ids, anchor:id, on:on, last:id, before:before, span:[id] };
  dragApply(ctx.bag, [id], on);
  dragPaint(kind, [id], on);
  document.body.classList.add('dragselling');
  document.addEventListener('mouseover', dragSelOver, true);
  document.addEventListener('mouseup', dragSelEnd, { once:true });
}
function dragSelOver(ev){
  if(!_dragSel) return;
  const row = ev.target && ev.target.closest && ev.target.closest('[data-selid]');
  if(!row) return;
  const id = row.dataset.selid;
  if(!id || id === _dragSel.last) return;
  _dragSel.last = id;
  const ctx = dragSelCtx(_dragSel.kind);
  /* 처음 누른 줄부터 지금 줄까지 통째로 — 되올라와도 아귀가 맞는다 */
  const span = dragRange(_dragSel.ids, _dragSel.anchor, id);
  /* 범위 밖으로 빠진 줄은 «끌기 전» 상태로 되돌린다 — 이것이 없으면 아래로 많이
     끌었다가 되올라와도 지나쳤던 줄이 고른 채로 남는다(2026-08-17 실제 확인). */
  const gone = dragDropped(_dragSel.span, span);
  dragRestore(ctx.bag, gone, _dragSel.before);
  gone.forEach(g => dragPaint(_dragSel.kind, [g], !!ctx.bag[g]));
  dragApply(ctx.bag, span, _dragSel.on);
  dragPaint(_dragSel.kind, span, _dragSel.on);
  _dragSel.span = span;
}
function dragSelEnd(){
  document.removeEventListener('mouseover', dragSelOver, true);
  document.body.classList.remove('dragselling');
  const d = _dragSel; _dragSel = null;
  if(!d) return;
  dragSelCtx(d.kind).done();               /* 이때 한 번만 다시 그린다 — 개수·도구줄 갱신 */
}
/* ── 찾은 결과 전체를 한 번에 다루기 ──
   맨 위 체크는 '이 페이지'만 고른다. 312건을 찾아 놓고도 100건씩 네 번 지워야 했다.
   그렇다고 아무 조건 없이 6,275건을 한 번에 고르게 하면 사고가 난다 —

  const q = ($('search') && $('search').value.trim()) || ($('pcSearch') && $('pcSearch').value.trim()) || '';

/* ══════ 끌어서 순서 바꾸기 (대표 지시 2026-08-16) ══════
   네 목록이 같은 계산·같은 저장을 쓴다 — 명함·사업자 폴더, 기업 상세 폴더,
   메인 탭, 폴더 안 ＃탭. 같은 일을 네 곳에 베끼면 한 곳만 고쳐져 어긋난다.
   ⚠ 이미 있는 ⋮ 메뉴의 「⬆위로 ⬇아래로」(moveFolderOrder)는 그대로 둔다 —
     드래그가 안 되는 자리(폰·터치)의 길이자, 이 기능이 고장 나도 쓸 수 있는 길이다. */

/* 끈 것을 놓은 자리 «앞»(after 가 거짓) 또는 «뒤»(after 가 참)에 끼워 넣고
   1..n 으로 번호를 다시 매긴다.
   ⚠ 늘 앞에만 꽂으면 **맨 끝자리에는 영영 놓을 수 없다** — [가,나,다,라] 에서 「가」를
     「라」에 놓아도 [나,다,가,라] 가 될 뿐이다. 그래서 앞/뒤를 밖에서 받는다.
   ⚠ 앞/뒤 판단은 여기서 하지 않는다 — 이 함수는 화면을 모르는 순수 계산으로 남긴다
     (그래야 검사로 못 박을 수 있다). 판단은 ordIsAfter 하나가 맡는다.
   돌려주는 것은 **값이 실제로 달라진 것만** — 안 바뀐 것까지 저장하면
   서버에 쓸데없는 쓰기가 나가고, 남이 그 사이 고친 것과 부딪힐 일만 는다. */
function reorderList(list, dragId, dropId, after){
  const arr = (list||[]).slice();
  if(dragId === dropId) return [];
  const from = arr.findIndex(x=>x && x.id===dragId);
  const to   = arr.findIndex(x=>x && x.id===dropId);
  if(from < 0 || to < 0) return [];
  const moved = arr.splice(from, 1)[0];
  const at = arr.findIndex(x=>x && x.id===dropId);
  arr.splice(after ? at+1 : at, 0, moved);
  const out = [];
  arr.forEach((x,i)=>{ const n = i+1; if((x.order||0) !== n) out.push({ id:x.id, order:n }); });
  return out;
}

/* 어느 목록이 «가로»인가 — 윗줄 탭 칩 둘(명함의 view, 기업 상세의 coftab)이 가로,
   옆줄 폴더 둘(group·cofolder)이 세로다.
   ⚠ coftab 은 2026-08-17 에 옆줄에서 윗줄(#pcErpTabs)로 옮겨 가며 축이 «바뀌었다».
     축을 안 따라 옮기면 가로로 늘어선 칩을 위/아래 절반으로 재게 되어, 놓이는 자리가
     눈에 보이는 선(#pcErpTabs 안에서는 세로선)과 어긋난다.
   ⚠ CSS 를 훑어 축을 알아내면 안 된다 — 스타일을 손대는 순간 조용히 축이 뒤집힌다.
     목록 갈래(kind)로 정하면 화면을 아무리 고쳐도 판단이 안 흔들린다. */
const ORD_HORIZONTAL = { view:true, coftab:true };

/* 가리킨 자리가 그 칸의 «뒤쪽 절반»이면 뒤에, «앞쪽 절반»이면 앞에 꽂는다.
   세로 목록은 아래 절반이 뒤, 가로 목록(메인 탭)은 오른쪽 절반이 뒤다.
   ⚠ 이 판단은 «선을 그리는 곳(onOrdDragOver)»과 «실제로 놓는 곳(onOrdDrop)» 둘이 쓴다.
     두 곳이 따로 재면 선은 아래에 그어 놓고 위에 꽂히는 어긋남이 난다 — 그래서
     한 함수로 모아 둘이 절대 갈라설 수 없게 한다.
   ⚠ 화면을 읽지 않는다 — 네모(rect)와 좌표만 받는 순수 계산이라 검사로 못 박을 수 있다. */
function ordIsAfter(kind, rect, clientX, clientY){
  if(!rect) return false;
  return ORD_HORIZONTAL[kind] === true          /* === true 로 본다 — 'constructor' 같은 이름이
                                                   물려받은 값에 걸려 축이 뒤집히지 않게 */
    ? (clientX - rect.left) > (rect.width  / 2)
    : (clientY - rect.top ) > (rect.height / 2);
}

/* 목록마다 다른 것은 «형제가 누구인가»와 «어디에 저장하는가» 둘뿐이다.
   그 둘만 여기서 알려 주고, 나머지(계산·저장·손놀림)는 네 목록이 함께 쓴다.
   ⚠ 형제 범위를 틀리면 남의 목록 번호까지 다시 매긴다 — 명함 폴더와 사업자 폴더는
     같은 state.groups 에 kind 로만 갈려 있어 특히 조심해야 한다. */
function ordSiblings(kind, id, scope){
  if(kind === 'group'){
    const g = (state.groups||{})[id]; if(!g) return null;
    /* moveFolderOrder 와 같은 형제 기준을 쓴다 — 두 곳이 다르면 메뉴와 드래그가 어긋난다 */
    const list = Object.values(state.groups||{})
      .filter(x=>x && (x.kind||'card')===(g.kind||'card') && (x.parent||'')===(g.parent||''))
      .sort((a,b)=>(a.order||0)-(b.order||0));
    return { list,
      pathOf: i => 'groups/'+i+'/order',
      applyLocal: (i,o) => { if(state.groups[i]) state.groups[i].order = o; } };
  }
  if(kind === 'cofolder'){
    if(!(_coFolders||{})[id]) return null;
    const list = Object.values(_coFolders||{}).sort((a,b)=>(a.order||0)-(b.order||0));
    return { list,
      pathOf: i => 'coFolders/'+i+'/order',
      applyLocal: (i,o) => { if(_coFolders[i]) _coFolders[i].order = o; } };
  }
  if(kind === 'coftab'){
    const f = (_coFolders||{})[scope]; if(!f || !f.tabs || !f.tabs[id]) return null;
    /* 화면에 그리는 것과 «같은 함수»를 쓴다 — 여기서 따로 줄 세우면 order 가 같거나
       비었을 때(coFTabList 는 이름 가나다순으로 가른다) 대표가 보고 있는 차례와
       다른 차례로 번호가 다시 매겨진다. 베낀 두 벌보다 한 벌이 낫다. */
    const list = coFTabList(f);
    return { list,
      pathOf: i => 'coFolders/'+scope+'/tabs/'+i+'/order',
      applyLocal: (i,o) => { if(f.tabs[i]) f.tabs[i].order = o; } };
  }
  if(kind === 'view'){
    const v = (state.views||{})[id]; if(!v) return null;
    /* renderMyTabsHtml 과 같은 거르개를 쓴다 — 지금 화면에 보이는 탭끼리만 형제다 */
    const list = Object.values(state.views||{})
      .filter(x=>x && x.id && (x.kind||'card')===(v.kind||'card') && (x.scope||'all')===(v.scope||'all'))
      .sort((a,b)=>(a.order||0)-(b.order||0));
    return { list,
      pathOf: i => 'views/'+i+'/order',
      applyLocal: (i,o) => { if(state.views[i]) state.views[i].order = o; } };
  }
  return null;
}

/* 바뀐 order 만 모아 **한 번의 update()** 로 보낸다.
   ⚠ 레코드를 통째로 set 하면 안 된다 — 그 사이 남이 고친 이름이 되돌아간다
     (2026-08-11 「한 건 저장이 레코드 통째라 남의 칸을 되돌리던 것」과 같은 종류). */
function saveOrder(kind, dragId, dropId, scope, after){
  if(!state.isAdmin){ return Promise.resolve(); }   /* 화면 게이트를 넘겨도 여기서 막는다 */
  const spec = ordSiblings(kind, dragId, scope||'');
  if(!spec) return Promise.resolve();
  const changed = reorderList(spec.list, dragId, dropId, after);
  if(!changed.length) return Promise.resolve();     /* 바꿀 것이 없으면 서버를 안 부른다 */
  if(Store.mode!=='firebase'){ toast('클라우드에 연결된 상태에서만 순서를 바꿀 수 있습니다'); return Promise.resolve(); }
  const upd = {};
  changed.forEach(x=>{ upd[spec.pathOf(x.id)] = x.order; });
  /* 화면이 곧바로 새 순서로 그려지게 메모리도 함께 바꾼다 — 서버 메아리를 기다리면 한 박자 늦다 */
  changed.forEach(x=>{ spec.applyLocal(x.id, x.order); });
  render();
  return Store.db.ref(DB_ROOT).update(upd)
    .then(()=>{ toast('순서를 바꿨습니다'); })
    .catch(e=>{
      toast('순서 저장 실패: '+((e&&e.message)||''));
      render();   /* 서버의 실제 순서로 되돌린다 — 성공한 척 남지 않게 */
    });
}

/* 지금 끌고 있는 것. 명함을 끄는 dragId·폴더를 끄는 dragFolderId 와 **따로** 둔다 —
   같은 폴더 줄이 「명함을 받는 자리」이기도 해서, 무엇을 끌었는지 섞이면
   순서를 바꾸려다 명함이 옮겨지는 사고가 난다. */
let _dragOrd = null;
function onOrdDragStart(e, kind, id, scope){
  if(!state.isAdmin) return;
  _dragOrd = { kind:kind, id:id, scope:scope||'' };
  try{ e.dataTransfer.effectAllowed='move'; }catch(_){}
  e.currentTarget.classList.add('ord-dragging');
  e.stopPropagation();
}
/* 선 두 가지를 한꺼번에 지운다 — 하나만 지우면 반대쪽 선이 남아 엉뚱한 자리를 가리킨다 */
function ordUnmark(el){
  if(!el || !el.classList) return;
  el.classList.remove('ord-dragover');
  el.classList.remove('ord-dragover-after');
}
/* 지금 이 줄의 어느 쪽에 꽂히는가 — 선 그리기와 실제 놓기가 «같은 한 줄»을 쓴다 */
function ordAfterFromEvent(kind, el, e){
  let r = null; try{ r = el && el.getBoundingClientRect ? el.getBoundingClientRect() : null; }catch(_){}
  return ordIsAfter(kind, r, e.clientX, e.clientY);
}
function onOrdDragOver(e){
  if(!_dragOrd) return;                 /* 명함을 끄는 중이면 기존 길에 맡긴다 */
  e.preventDefault(); e.stopPropagation();
  try{ e.dataTransfer.dropEffect='move'; }catch(_){}
  /* 놓을 자리를 «놓기와 똑같은 계산»으로 정해 그쪽 모서리에만 선을 긋는다.
     끌고 있는 것의 갈래로 축을 정한다 — 갈래가 다르면 어차피 onOrdDrop 이 안 받는다. */
  const after = ordAfterFromEvent(_dragOrd.kind, e.currentTarget, e);
  ordUnmark(e.currentTarget);
  e.currentTarget.classList.add(after ? 'ord-dragover-after' : 'ord-dragover');
}
function onOrdDragLeave(e){ ordUnmark(e.currentTarget); }
function onOrdDragEnd(e){
  e.currentTarget.classList.remove('ord-dragging');
  _dragOrd = null;
  document.querySelectorAll('.ord-dragover,.ord-dragover-after').forEach(ordUnmark);
}
function onOrdDrop(e, kind, id, scope){
  ordUnmark(e.currentTarget);
  if(!_dragOrd) return;                 /* 명함 드롭 — 기존 onFolderOrCardDrop 이 맡는다 */
  e.preventDefault(); e.stopPropagation();
  const d = _dragOrd; _dragOrd = null;
  if(d.kind !== kind || (d.scope||'') !== (scope||'')) return;   /* 다른 목록끼리는 안 섞는다 */
  /* 선을 그릴 때와 같은 함수로 앞/뒤를 다시 정한다 — 보이던 선과 결과가 어긋나지 않는다 */
  const after = ordAfterFromEvent(kind, e.currentTarget, e);
  saveOrder(kind, d.id, id, scope||'', after);
}

/* ══════ 고른 회사를 끌어서 옆줄 폴더에 놓기 (대표 지시 2026-08-17) ══════
   「클릭한 것 마우스 드래그해서 폴더로 옮길 수 있게 하고」 — 표에서 체크한 회사를
   집어 옆줄 폴더 줄에 떨어뜨리면 그 폴더로 옮겨진다.

   ★ 같은 폴더 줄이 이제 «세 가지» 드래그를 받는다. 무엇을 끌고 있는지가 섞이면
     순서를 바꾸려다 회사가 옮겨지는 사고가 난다. 그래서 신호를 셋 «따로» 둔다 —
       dragId      … 명함 한 장을 끄는 중 (onRowDrag → onFolderOrCardDrop)
       _dragOrd    … 폴더·탭의 순서를 바꾸는 중 (onOrdDragStart → onOrdDrop, 대표만)
       _dragCo     … 고른 회사를 끄는 중 (onCoRowDragStart → onCoFolderDrop)  ← 새로 붙는 것
     저마다의 받는 곳은 «제 신호가 없으면 곧바로 되돌아 나온다». 시작할 때 나머지 둘을
     비우므로 두 신호가 동시에 켜져 있는 일도 없다.
   ⚠ 폴더 «순서» 바꾸기는 대표만이지만, 회사를 폴더로 옮기는 것은 «누구나» 한다 —
     지금도 직원이 「📁 폴더로 옮기기」로 하는 일이다. state.isAdmin 으로 막지 않는다. */
let _dragCo = null;
function onCoRowDragStart(e, key){
  /* 체크한 줄만 끌린다 — 체크 안 한 줄을 끌면 아무 일도 안 일어난다.
     ⚠ 「끈 줄 하나만 옮기기」로 하면, 14곳을 골라 둔 채 15번째 줄을 무심코 끌었을 때
       골라 둔 14곳이 조용히 풀리고 엉뚱한 한 곳만 옮겨진다. 고른 것을 건드리지 않는
       쪽이 예측할 수 있다(표에도 draggable 이 고른 줄에만 붙는다). */
  if(!state.coSel || !state.coSel[key]) return;
  const keys = Object.keys(state.coSel);
  if(!keys.length) return;
  _dragCo = { keys: keys };
  dragId = null; dragFolderId = null; _dragOrd = null;
  /* ⚠ 파이어폭스는 setData 가 없으면 드래그를 아예 시작하지 않는다 */
  try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', String(keys.length)); }catch(_){}
  /* 흐릿해지는 표시도 순서 드래그(.ord-dragging)와 «따로» 둔다 — 이름이 섞이면
     다음 사람이 이 줄을 순서 드래그로 읽는다 */
  if(e.currentTarget && e.currentTarget.classList) e.currentTarget.classList.add('codragging');
  e.stopPropagation();
}
function onCoRowDragEnd(e){
  _dragCo = null;
  if(e.currentTarget && e.currentTarget.classList) e.currentTarget.classList.remove('codragging');
  try{ document.querySelectorAll('.codrop').forEach(el=>el.classList.remove('codrop')); }catch(_){}
}
/* 「여기에 놓입니다」 — 커서 밑의 폴더 줄에만 표시한다 */
function onCoFolderDragOver(e){
  if(!_dragCo) return;                  /* 회사를 끄는 중이 아니면 순서·명함 길에 맡긴다 */
  e.preventDefault(); e.stopPropagation();
  try{ e.dataTransfer.dropEffect='move'; }catch(_){}
  e.currentTarget.classList.add('codrop');
}
function onCoFolderDragLeave(e){ if(e.currentTarget && e.currentTarget.classList) e.currentTarget.classList.remove('codrop'); }
function onCoFolderDrop(e, folderId){
  if(e.currentTarget && e.currentTarget.classList) e.currentTarget.classList.remove('codrop');
  if(!_dragCo) return;                  /* 순서 드래그(onOrdDrop)·명함 드래그가 맡는다 */
  e.preventDefault(); e.stopPropagation();
  const d = _dragCo; _dragCo = null;
  if(!d.keys.length) return;
  /* ⚠ 옮기는 길은 하나뿐이다 — coMoveSelTo. 여기서 따로 쓰면 옛 이름 열쇠 비우기·
     한 통에 모아 보내기·알림이 두 벌이 되어 한쪽만 고쳐진다(그 함수가 알린다). */
  return coMoveSelTo(folderId);
}

/* ── 사이드바 폭 조절(PC) ── */

function openAddSheet(){
  $('addM').innerHTML = `
    <div class="mhead"><b>${state.tab==='card'?'명함':'사업자등록증'} 추가</b>

/* ── ＋ FAB: 한 번 누르면 바로 촬영 (파일·직접 입력은 길게 누르기) ──
   이제 촬영은 사진첩 카메라 한 곳으로 간다(openCamera 가 넘긴다). */
(function(){
  const fab = $('fab'); if(!fab) return;
  let timer = null, longFired = false;
  const clear = () => { if(timer){ clearTimeout(timer); timer = null; } };
  fab.addEventListener('pointerdown', () => {
    longFired = false;
    clear();
    timer = setTimeout(() => { longFired = true; openAddSheet(); }, 550);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => fab.addEventListener(ev, clear));
  fab.addEventListener('contextmenu', e => e.preventDefault());   /* 길게 누를 때 뜨는 브라우저 메뉴 차단 */
  fab.addEventListener('click', e => {
    if(longFired){ longFired = false; e.preventDefault(); return; }   /* 길게 눌러 시트를 연 경우 */
    openCamera();
  });
})();
</script>
<script>
/* ════════════ 파일 입력 루프: 촬영·파일·드래그·Ctrl+V → AI → 저장 ════════════ */
const fileQueue=[]; let processing=false;
function onFiles(files){ [...files].forEach(f=>fileQueue.push(f)); pumpQueue(); }
async function pumpQueue(){
  if (processing || !fileQueue.length) return;
  processing=true;
  const f=fileQueue.shift();
  try{
    toast('이미지 처리·선명 보정 중…',9000);
    let photo = await fileToImage(f);
    try{ photo = await enhance(photo); }catch(_){}
    const thumb = await makeThumb(photo);
    let pre={};
    if (aiReady()){
      toast('🤖 AI가 정보를 읽고 있습니다…',15000);
      try{ pre = await aiExtract(photo, state.tab); }
      catch(e){ console.error(e); toast('AI 추출 실패 — 직접 입력해주세요'); }
    } else toast('로그인하면 AI가 자동으로 읽어 줍니다 — 지금은 직접 입력 모드입니다');
    openEditor(null, {photo, thumb}, pre);
  }catch(e){ console.error(e); toast('파일을 읽을 수 없습니다'); processing=false; pumpQueue(); }
}
function queueNext(){ processing=false; pumpQueue(); }

async function fileToImage(f){
  if (f.type==='application/pdf' || /\.pdf$/i.test(f.name||'')) return pdfToImage(f);
  const url=URL.createObjectURL(f);
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  URL.revokeObjectURL(url);
  return shrink(img);
}
function shrink(img){
  /* OCR 정확도·선명도를 위해 넉넉한 해상도·화질 유지 (최대 1600px, 품질 .85) */
  const M=1600, r=Math.min(1, M/Math.max(img.width,img.height));
  const c=document.createElement('canvas');
  c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.85);
}
/* 자동 선명도·명암 보정 — 흐릿하거나 어두운 명함 글자를 또렷하게 (자동) */
function enhance(dataUrl){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const w=img.width, h=img.height;
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        const ctx=c.getContext('2d'); ctx.drawImage(img,0,0);
        const im=ctx.getImageData(0,0,w,h), d=im.data, total=w*h;
        /* 1) 자동 명암: 밝기 2~98% 구간을 0~255로 늘려 대비를 살림 */
        const hist=new Uint32Array(256);
        for(let i=0;i<d.length;i+=4){ hist[(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)|0]++; }
        const cut=total*0.02; let acc=0, lo=0, hi=255;
        for(let i=0;i<256;i++){ acc+=hist[i]; if(acc>=cut){ lo=i; break; } }
        acc=0; for(let i=255;i>=0;i--){ acc+=hist[i]; if(acc>=cut){ hi=i; break; } }
        if(hi-lo<32){ lo=0; hi=255; }
        const lut=new Uint8Array(256);
        for(let i=0;i<256;i++){ const v=(i-lo)*255/(hi-lo); lut[i]=v<0?0:v>255?255:v; }
        for(let i=0;i<d.length;i+=4){ d[i]=lut[d[i]]; d[i+1]=lut[d[i+1]]; d[i+2]=lut[d[i+2]]; }
        /* 2) 언샤프(선명): 라플라시안 가중으로 윤곽 강화 */
        const out=new Uint8ClampedArray(d), amt=0.7, W4=w*4;
        for(let y=1;y<h-1;y++){
          for(let x=1;x<w-1;x++){
            const o=(y*w+x)*4;
            for(let ch=0;ch<3;ch++){
              const p=o+ch;
              const lap=4*d[p]-d[p-4]-d[p+4]-d[p-W4]-d[p+W4];
              const v=d[p]+amt*lap;
              out[p]=v<0?0:v>255?255:v;
            }
          }
        }
        im.data.set(out); ctx.putImageData(im,0,0);
        res(c.toDataURL('image/jpeg',.9));
      }catch(e){ res(dataUrl); }   /* 실패 시 원본 그대로 */
    };
    img.onerror=()=>res(dataUrl);
    img.src=dataUrl;
  });
}
/* ── 보관용 사진 크기 ──
   실시간DB에는 사진이 '글자'로 담기므로 원본 크기가 곧바로 저장용량이 된다.
   파일 창고(Storage)는 이 계정(체험판)에서 못 쓴다 — 신규 버킷은 유료에서만 열린다.
   그래서 **읽기(OCR)에는 1600px 원본을 그대로 쓰고, 보관만 줄여서 넣는다.**

   ★ 종류마다 크기가 다르다 —
     명함은 90×50mm 라 800px 이면 약 226dpi 로 잔글씨도 읽힌다.
     사업자등록증은 A4(210×297mm)라 800px 이면 약 68dpi — 글씨를 못 읽는다.
     증빙으로 쓰는 서류라 1400px(약 120dpi)로 남긴다. 같은 값으로 줄이면 서류를 버리는 셈이다. */
const PHOTO_KEEP_MAX = 800;         // 명함
const PHOTO_KEEP_MAX_DOC = 1400;    // 사업자등록증 등 A4 서류
const PHOTO_KEEP_Q = 0.8;
/* 그 사진이 붙은 항목이 사업자등록증이면 큰 쪽을 쓴다. id 뒤의 '_b'(뒷면)는 떼고 본다. */
function photoKeepMax(photoId){
  const base = String(photoId||'').replace(/_b$/, '');
  const it = (typeof state !== 'undefined' && state.items) ? state.items[base] : null;
  return (it && it.kind === 'biz') ? PHOTO_KEEP_MAX_DOC : PHOTO_KEEP_MAX;
}
function shrinkForStore(dataUrl, max){
  const MAX = max || PHOTO_KEEP_MAX;
  return new Promise(res=>{
    if(!dataUrl || dataUrl.length < 60000) return res(dataUrl);   /* 이미 작으면 손대지 않는다 */
    const i=new Image();
    i.onload=()=>{
      const m=Math.max(i.width,i.height);
      if(m<=MAX) return res(dataUrl);
      const r=MAX/m, c=document.createElement('canvas');
      c.width=Math.round(i.width*r); c.height=Math.round(i.height*r);
      c.getContext('2d').drawImage(i,0,0,c.width,c.height);
      const out=c.toDataURL('image/jpeg',PHOTO_KEEP_Q);
      res(out.length < dataUrl.length ? out : dataUrl);           /* 되레 커지면 원본 유지 */
    };
    i.onerror=()=>res(dataUrl);
    i.src=dataUrl;
  });
}

/* 목록용 썸네일(약 5~10KB) — 목록 로딩을 가볍게 유지 */
function makeThumb(dataUrl){
  return new Promise(res=>{ const i=new Image();
    i.onload=()=>{ const M=320, r=Math.min(1, M/Math.max(i.width,i.height));
      const c=document.createElement('canvas');
      c.width=Math.round(i.width*r); c.height=Math.round(i.height*r);
      c.getContext('2d').drawImage(i,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',.65)); };
    i.onerror=()=>res(''); i.src=dataUrl; });
}
async function pdfToImage(f){
  if (!window.pdfjsLib){
    await new Promise((res,rej)=>{ const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const buf=await f.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({ isEvalSupported: false, data:buf}).promise;
  const page=await pdf.getPage(1);
  const vp=page.getViewport({scale:2});
  const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
  await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  const img=new Image(); img.src=c.toDataURL('image/jpeg',.85);
  await new Promise(r=>img.onload=r);
  return shrink(img);
}

let dragDepth=0;
/* 창 아무 데나 파일을 떨어뜨리면 **명함 등록**으로 간다. 그런데 자료함·환경설정
   화면에서는 그 자리에 떨어뜨릴 일이 없다 — 자료를 올리려던 것이다.
   그리로 흘러가면 한글·PDF 를 명함 사진으로 읽으려다 "파일을 읽을 수 없습니다"
   가 뜬다. 목록 화면일 때만 받는다. */
function cardDropOk(){ return (state.view||'list')==='list'; }
window.addEventListener('dragenter',e=>{ if(cardDropOk() && [...e.dataTransfer.types].includes('Files')){ dragDepth++; $('dropov').classList.add('open'); }});
window.addEventListener('dragleave',()=>{ if(--dragDepth<=0){ dragDepth=0; $('dropov').classList.remove('open'); }});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{ e.preventDefault(); dragDepth=0; $('dropov').classList.remove('open');
  if(!cardDropOk()){ toast('자료함에서는 오른쪽 위 「＋ 새 자료 올리기」 자리에 놓아 주세요',6000); return; }
  if(e.dataTransfer.files.length) onFiles(e.dataTransfer.files); });
window.addEventListener('paste',e=>{
  const imgs=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith('image/'));
  if(imgs.length){ e.preventDefault(); onFiles(imgs.map(i=>i.getAsFile())); }
});

/* ════════════ AI 자동 추출 ════════════
   ⚠ 2026-08-17 — **열쇠를 브라우저에서 뺐다.** 서버(readDoc)가 열쇠를 들고
     구글을 부르고, 여기서는 사진과 프롬프트만 보낸다.
     예전에는 이 함수가 열쇠를 직접 들고 구글을 불렀는데, 그 열쇠가 실시간DB 에
     평문으로 있고 규칙상 **로그인한 모든 직원이 읽었다.** 게다가 AI 스튜디오
     열쇠라 웹사이트 제한 같은 자물쇠를 채울 방법도 없었다.
   ⚠ 프롬프트는 **한 글자도 안 바꿨다** — 바꾸면 이미 읽힌 명함과 답이 갈린다. */
async function aiExtract(dataUrl, kind){
  const prompt = kind==='card'
    ? `이 명함 이미지에서 정보를 추출해 JSON으로만 답하세요. 키: name(이름), company(회사명), dept(부서), title(직책), mobile(휴대폰), tel(직통전화), fax(개인팩스), email(이메일), companyTel(회사 대표번호), companyFax(회사 팩스), companyAddr(회사 주소), website(홈페이지), address(개인 주소), memo(기타 정보). 없는 값은 빈 문자열. 전화번호는 010-1234-5678 형식. JSON 외 텍스트 금지.`
    : `이 사업자등록증 이미지에서 정보를 추출해 JSON으로만 답하세요. 키: company(상호/법인명), ceo(대표자), bizno(사업자등록번호), corpno(법인등록번호), openDate(개업연월일), bizType(업태), bizItem(종목), companyTel(대표번호), companyFax(팩스), address(사업장 소재지), memo(기타). 없는 값은 빈 문자열. JSON 외 텍스트 금지.`;
  const parts=[
    {inline_data:{mime_type:'image/jpeg',data:dataUrl.split(',')[1]}},
    {text:prompt}];
  const reply = await PuAiCall.ask(parts, { auth: firebase.auth(), fetch: pcFetch });
  return JSON.parse(PuAiCall.textOf(reply));
}

/* ══════ 팝업은 먼저, 사진은 나중 — 순수 로직 (테스트 대상) ══════
   대표 보고 2026-08-15: "폰에서 창 열 때 2초". 재 보니 팝업을 만드는 데 드는 시간은
   4ms 인데, 사진(썸네일)을 서버에서 받을 때까지 **아무것도 안 그리고 기다렸다.**
   서버가 350ms 면 팝업도 361ms — 지연이 통신 시간을 그대로 따라갔다.
   이름·회사·전화·이메일은 이미 손안에 있으므로 **먼저 띄우고 사진은 오면 끼워 넣는다.** */

/* 사진 자리 — 아직 안 받았으면 **빈 자리를 미리 만들어** 둔다.
   자리가 없으면 나중에 사진이 와도 넣을 곳이 없어 창을 통째로 다시 그려야 한다.
   ⚠ 사진이 없는 것으로 «확인된» 명함('')은 자리를 안 만든다 — 빈 칸만 남는다. */
function photoSlot(elId, thumb, zoomId, cls, extraStyle){
  if (thumb === '') return '';
  const st = (thumb ? '' : 'display:none;') + (extraStyle || '');
  return `<img class="${cls}" id="${elId}"${thumb ? ` src="${thumb}"` : ''}`
       + `${st ? ` style="${st}"` : ''} onclick="zoom('${zoomId}')">`;
}

/* 뒤늦게 도착한 사진을 열려 있는 팝업에 끼워 넣는다.
   ⚠ 그 사이 다른 명함을 열었으면 손대지 않는다 — 앞 명함 사진이 뒤 명함 창에 붙는다. */
function fillDetailPhotos(id){
  const it = state.items[id]; if (!it) return;
  const put = (elId, src) => {
    const im = document.getElementById(elId); if (!im) return;
    if (src){ im.src = src; im.style.display = ''; } else { im.remove(); }
  };
  const mine = elId => {
    const box = elId[0]==='p' ? document.getElementById('pcDetail') : document.getElementById('detailM');
    return box && box.dataset.cardId === id;
  };
  if (mine('dphoto')){ put('dphoto', it.thumb); put('dphoto2', it.thumb2); }
  if (mine('pcdphoto')){ put('pcdphoto', it.thumb); put('pcdphoto2', it.thumb2); }
  /* 흐린 썸네일에서 멈추지 않게 원본까지 이어 받는다 — 창을 열 때 도는 것과 같은 길이다.
     ⚠ 이 줄이 없으면 사진이 흐린 채로 남는다(열 때는 thumb 이 undefined 라 그 길이 안 돌았다). */
  ['dphoto','pcdphoto'].forEach(el=>{
    if (it.thumb && mine(el)) Store.getPhoto(id).then(p=>{ const im=document.getElementById(el); if(p&&im&&mine(el)) im.src=p; });
  });
  ['dphoto2','pcdphoto2'].forEach(el=>{
    if (it.thumb2 && mine(el)) Store.getPhoto(id+'_b').then(p=>{ const im=document.getElementById(el); if(p&&im&&mine(el)) im.src=p; });
  });
}
