    hd.style.display = (isSet||isMat||isMail||(isCo && !state.coFolder)) ? 'none' : '';
    if(hd.classList) hd.classList.toggle('cohead', isCo);
  }
  const st=$('pcSettings'); if(st) st.style.display = isSet ? 'block' : 'none';
  const mt=$('pcMat');      if(mt) mt.style.display = isMat ? 'block' : 'none';
  const ml=$('pcMail');     if(ml) ml.style.display = isMail ? 'block' : 'none';
  /* 메일 창에서는 옆줄·머리줄이 «다음메일함 차림»이 된다 (대표 지시 2026-08-24).
     클래스 하나로 갈라 둔다 — 명함 창의 남색 옆줄은 그대로여야 한다. */
  const rt=$('pcRoot'); if(rt&&rt.classList) rt.classList.toggle('mailmode', isMail||isMat);
  if(isMail||isMat) mbEnsureFolders();   /* 메일 창에 들어오면 폴더 목록을 한 번 가져온다 */
  if(isMail) mbEnsureBins();             /* 푸른 분류 칸과 «옮긴 것» 쪽지도 한 번만 */
  const co=$('pcCo');       if(co) co.style.display = isCo ? 'block' : 'none';
  /* 기업정보를 나서면 찾기 칸을 명함첩 것으로 되돌린다 — 회사를 찾던 글자가
     그대로 남아 있으면 명함 목록이 조용히 걸러진 채 보인다. */
  if(!isCo) syncPcSearchFor('list');
  if(isSet){ renderSettingsPage(); return; }
  if(isMat){ renderMatPage(); return; }
  if(isMail){ renderMailPage(); return; }
  if(isCo){ renderErpTabs(); renderCoPage(); return; }
  renderErpTabs(); renderPCTable();
}

/* ══════════════ 🏢 기업정보 ══════════════
   회사 하나에 얽힌 것이 지금은 갈래별로 흩어져 있다 — 사업자등록증은 사업자 갈래에,
   사람은 명함에, 담당 노무사·업체유형은 푸른이알피에. 「이 회사가 어떤 곳이더라」에
   답하려면 세 곳을 오가야 했다. 여기서 회사를 가운데 놓고 한데 모은다(대표 지시 2026-08-12).

   ⚠ 새 「갈래」로 만들지 않았다. 명함첩 코드는 「명함 아니면 사업자」 둘뿐이라고
     가정하는 곳이 아홉 군데, state.tab 을 쓰는 곳이 일흔두 군데다. 셋째 갈래를 끼우면
     검색·중복정리·내보내기·개인폴더가 다 흔들린다. 자료함·메일처럼 **화면**으로 둔다.

   ⚠ 회사를 가르는 열쇠는 **사업자번호**다. 상호는 「(주)한서정공」과 「한서정공」처럼
     적는 사람마다 달라 같은 회사가 둘로 갈린다. 번호가 없을 때만 상호로 묶는다. */
const CO_FIELDS = [
  ['bizno','사업자번호'], ['ceo','대표자'], ['corpno','법인등록번호'], ['address','소재지'],
  ['companyTel','대표번호'], ['mobile','휴대폰'], ['email','이메일'], ['homepage','홈페이지'],
  ['bizType','업태'], ['bizItem','종목'], ['openDate','개업일'], ['smeType','기업규모'],
  /* ⚠ 기술보호울타리·현장클리닉이 «자격을 가리는» 숫자다 (대표 지시 2026-08-23) —
     사업장 정보 화면을 캡처해 담을 때 이 셋이 없으면 값은 읽히는데 정작 여기서
     안 보여 포털을 다시 열어 봐야 했다. js/pu-doc-file.js 의 KEEP 과 짝이다 —
     한쪽만 늘리면 값은 쌓이는데 화면에 안 나온다(또는 그 반대). */
  ['product','주생산품'], ['sales','직전년도 매출액'], ['workers','상시근로자수'],
  /* 서식·신청서에서 읽히는 것들 — 기술·경영 혁신 지원신청서가 이 칸들을 채운다 */
  ['docName','서류이름'], ['applyNo','지정번호'], ['applyItems','통상영향 품목'],
  ['applyField','지원 희망분야'], ['applyDetail','세부 내용'], ['applyDate','신청일'],
  ['dueDays','처리기간'], ['birth','생년월일']
];
/* 회사별 딸림 정보(서식에서 읽은 칸 등). 항목(items)을 건드리지 않으려고 따로 둔다 —
   items 를 늘리면 검색 색인·중복정리가 다 따라 움직인다. 열쇠는 사업자번호. */
let _coInfo = {};
let _coInfoOn = false;
function loadCoInfo(cb){
  if(_coInfoOn || Store.mode!=='firebase'){ cb && cb(); return; }
  _coInfoOn = true;
  /* 폴더·탭 개수가 옆줄에도 보이므로 renderCoPage() 만 부르면 옆줄 숫자가 안 바뀐다
     (최종 전체 리뷰 2026-08-14 — loadCoFolders/loadCoTagHidden 과 같은 이유). */
  /* ── 건별로 받는다 (대표 지시 2026-08-23 「하루 천원, 더 낮출 수 없나」) ──
     coInfo 에는 회사가 최대 4,000곳 담긴다. `.on('value')` 로 통째 구독하면
     누가 «폴더를 하나 옮길 때마다» 그 4,000곳이 명함첩을 켜 둔 모든 기기로 다시 내려갔다.
     폴더·탭 배정은 한 번에 여러 건을 고치므로(chunk 로 나눠 update) 더 자주 터진다.
     items 를 건별로 바꾼 것과 «같은 이유·같은 방법» 이다(watchCardMap).
     ⚠ 화면을 다시 그리는 시점은 그대로다 — watchCardMap 이 잔물결을 140ms 로 묶어
       settled 에서 한 번만 부른다. 첫 적재에 4,000번 그리지 않는다. */
  watchCardMap(Store.db.ref(DB_ROOT+'/coInfo'), value => { _coInfo = value || {}; },
               () => { coListBust(); renderCoSoon(); });
  cb && cb();
}
const coKeyOf = it => { const d=digits(it.bizno||''); return d.length>=10 ? d : ('n'+_norm(it.company||'')); };

/* 회사 열쇠가 이름 열쇠(n...)에서 사업자번호 열쇠로 바뀌면, 옛 이름 열쇠에 있던
   folder·tags 가 안 보이게 된다 — 사업자등록증이 나중에 들어온 회사가 이 경우다
   (설계서 2026-08-13, "회사 열쇠가 바뀌어 폴더가 끊어짐" 대비).
   ⚠ 조용한 배경 쓰기로 옮기지 않는다. 옮기다 실패하면 대표가 모르는 새 사라진다.
     읽을 때 두 열쇠의 값을 합쳐 보여준다 — 사람이 다시 손대면 그때부터 새 열쇠에 남는다. */
function coEffectiveExtra(key, name, coInfoMap){
  const cur = coInfoMap[key];
  const nameKey = 'n'+_norm(name||'');
  if(nameKey===key) return cur || null;   /* 합칠 상대가 없다 */
  const old = coInfoMap[nameKey];
  if(!old) return cur || null;
  if(!cur) return old;
  /* 폴더는 하나만 있을 수 있다 — 새 열쇠에서 사람이 다시 정한 것을 우선한다.
     탭은 여럿 겹칠 수 있다 — 옛 것도 새 것도 버리지 않는다. */
  const tags = {}; for(let k in old.tags||{}) tags[k] = old.tags[k]; for(let k in cur.tags||{}) tags[k] = cur.tags[k];
  const docs = {}; for(let k in old.docs||{}) docs[k] = old.docs[k]; for(let k in cur.docs||{}) docs[k] = cur.docs[k];
  const folder = cur.folder || old.folder || '';
  const result = {};
  for(let k in old) if(old.hasOwnProperty(k)) result[k] = old[k];
  for(let k in cur) if(cur.hasOwnProperty(k)) result[k] = cur[k];
  result.tags = tags;
  result.docs = docs;
  result.folder = folder;
  return result;
}

/* 흩어진 것을 회사 하나로 모은다. 사업자등록증이 뼈대가 되고, 명함·ERP·서식이 살을 붙인다. */
/* ══════ 회사 목록 다시 조립하기 — 순수 로직 (테스트 대상) ══════
   기업 상세는 그릴 때마다 명함 6,616장을 두 번 훑고 회사 4,100곳마다 푸른이알피를
   맞춰 «회사 목록을 통째로 다시 조립»했다. 한 번에 25ms, 한 번 그릴 때 두 번 부르니
   50ms — 「50개씩 보기」로 줄여도 안 줄어드는 고정비다(대표 확인 2026-08-16,
   50줄만 그리는데 53ms 중 51ms 가 이 조립이었다).

   더 나쁜 것은 이것이 **한 번으로 안 끝난다**는 점이다. 명함·폴더·회사정보 세 자리를
   실시간으로 듣고 있어, 저장이 한 건 오갈 때마다 화면을 다시 그린다. 저장이 몰리면
   50ms 짜리가 수백 번 겹쳐 화면이 계속 멈춘다.

   ⚠ 「언제 다시 조립할까」를 손으로 짚지 않는다 — 한 곳만 놓치면 새 명함이 회사
     목록에 조용히 안 나타난다. 자료가 들어오는 «문»이 셋뿐이므로(명함·회사정보·
     푸른이알피), 그 문에서만 표를 새로 뽑는다(coListBust). 문이 아닌 곳에서 값이
     바뀌는 길은 없다 — 저장은 모두 그 문을 되돌아 들어온다. */
let _coListMemo = null;
function coListBust(){ _coListMemo = null; }
function coList(){
  if(_coListMemo) return _coListMemo;
  return (_coListMemo = coListBuild());
}
function coListBuild(){
  if(typeof _coWatch!=='undefined' && _coWatch) _coWatch.builds++;
  const by = {};
  /* ⚠ from 은 «이 칸을 어디서 채웠는지» 다 (대표 지시 2026-08-24, 4순위).
     값만 옮기면 나중에 「이 대표자 어디서 봤더라」에 답할 길이 아예 없다 —
     등록증에서 온 것인지 명함인지 푸른이알피인지 구별이 안 된다.
     ⚠ 서버를 «더 읽지 않는다». 이미 손에 든 것을 적어 두기만 한다. */
  const take = (k, src, from) => {
    const o = by[k] || (by[k] = { key:k, name:'', bizno:'', cards:[], bizs:[], docs:0, erp:null,
                                  extra:{}, srcOf:{} });
    Object.keys(src||{}).forEach(f=>{ if(src[f] && !o[f]){ o[f]=src[f]; o.srcOf[f]=from; } });
    return o;
  };
  /* 상호 → 사업자번호 열쇠. 명함에는 사업자번호가 거의 안 적혀 있어서, 이 다리가 없으면
     같은 회사가 「등록증 쪽」과 「명함 쪽」으로 갈라져 목록에 두 줄로 뜬다(실제로 그랬다). */
  const nameIdx = {};
  /* ① 사업자등록증 — 회사의 뼈대 */
  Object.values(allItems()).filter(it=>it.kind==='biz').forEach(it=>{
    const k = coKeyOf(it);
    const o = take(k, { name:it.company, bizno:it.bizno, ceo:it.ceo, address:it.address,
      corpno:it.corpno, bizType:it.bizType, bizItem:it.bizItem, openDate:it.openDate, smeType:it.smeType },
      '사업자등록증');
    o.docs++;
    /* ⚠ 세는 것만으로는 지울 수 없다 — 어느 등록증인지 알아야 한다(대표 지시 2026-08-26
       「데이터가 삭제가 필요한데」). 원본을 담아 둔다: 새로 서버를 읽지 않는다. */
    o.bizs.push(it);
    const n = _norm(it.company); if(n && !nameIdx[n]) nameIdx[n] = k;
  });
  /* ② 명함 — 그 회사 사람들. 회사가 사업자등록증 없이 명함만 있는 경우도 살린다. */
  Object.values(allItems()).filter(it=>it.kind!=='biz' && (it.company||'').trim()).forEach(it=>{
    const k = (digits(it.bizno||'').length>=10) ? coKeyOf(it)
            : (nameIdx[_norm(it.company)] || coKeyOf(it));
    const o = take(k, { name:it.company, bizno:it.bizno }, '명함');
    o.cards.push(it);
  });
  /* ③ 푸른이알피 — 업체유형·담당 노무사 */
  Object.values(by).forEach(o=>{
    const m = ErpMatch.match({ bizno:o.bizno, company:o.name });
    if(m){ o.erp = m; if(!o.ceo && m.ceoRaw){ o.ceo = m.ceoRaw; o.srcOf.ceo = '푸른이알피'; } }
    /* ④ 서식에서 읽은 칸 + 폴더·탭. 열쇠가 바뀌었어도 옛 기록을 합쳐 보여준다. */
    const ex = coEffectiveExtra(o.key, o.name, _coInfo);
    if(ex){ o.extra = ex; o.folder = ex.folder || ''; }
  });
  return Object.values(by).filter(o=>o.name)
    .sort((a,b)=>String(a.name).localeCompare(String(b.name),'ko'));
}
/* ⚠ 사업자번호가 없는 회사는 이 이름꼴이 그대로 Realtime DB 열쇠(coInfo/n회사이름/...)가
   된다. DB 열쇠에 못 쓰는 글자(. # $ [ ] /)가 이름에 있으면 쓰기가 그 자리에서 막히거나
   (점 등) 딴 경로로 새 버린다(슬래시). coCleanTagName 과 같은 글자를 뺀다
   (최종 전체 리뷰 2026-08-14, "이름꼴 열쇠 미검증"). */
const _norm = s => String(s||'').replace(/\s|\(주\)|주식회사|㈜/g,'').replace(/[.#$/[\]]/g,'').toLowerCase();

/* ★ 기업 상세로 들어가는 **공용 길** — PC 옆줄(openCoPage)과 폰 탭(openCoMobile)이
   둘 다 여기를 거친다(최종 전체 리뷰 2026-08-16, C1).
   예전에는 이 준비가 openCoPage() 안에만 있었다. 그런데 openCoPage() 는 renderPCSide()
   안의 옆줄 단추(#pcRoot)에서만 불려 폰에서는 닿을 수 없었다 — 폰으로 들어가면
   _coInfo·_coFolders·_coTagHidden 이 영영 {} 인 채였다. 회사 목록과 이알피 딱지는
   allItems()·ErpMatch 에서 오므로 화면은 그럴듯해 보이는데 속이 비어 있었다:
   폴더 시트에 폴더도 태그도 안 뜨고, 카드에 📁·탭 딱지가 안 붙고, 「폴더로 옮기기」에
   「폴더 없음」뿐이고, 새 폴더·탭 담기·이알피 가져오기가 서버에 쓰고 «성공» 까지
   띄운 뒤 화면은 그대로였다(구독이 없어 되돌아오는 신호가 없다).
   ⚠ 두 진입로가 각자 이 목록을 베끼면 다음에 하나가 늘 때 한쪽만 고쳐진다 —
     그래서 함수 하나로 모은다. PC 전용 뒷정리($('pcMain').scrollTop=0)만 밖에 남긴다. */
function enterCoView(){
  state.view='co'; state.coPick='';
  /* 몇 개씩 볼지는 이 PC에 기억해 둔다 — 열 때마다 다시 고르게 하면 안 된다.
     쪽은 늘 첫 쪽부터 — 어제 보던 21쪽을 오늘 다시 열어 주는 것은 반갑지 않다. */
  try{ state.coPageSize = coPageSizeOk(localStorage.getItem('pucards_co_pagesize')); }catch(_){}
  state.coPage = 0;
  render();
  loadCoInfo(); loadCoFolders(); loadCoTagHidden();
}
/* PC 전용 뒷정리만 여기 남긴다 — 맨 위로 올리기와 5초 진단(coWatchStart)은
   옆줄로 들어올 때만 뜻이 있다. 폰은 enterCoView() 만 탄다. */
function openCoPage(){ enterCoView(); try{ $('pcMain').scrollTop=0; }catch(_){} coWatchStart(); }
function closeCoPage(){ state.view='list'; render(); }

/* ══════ 기업 상세가 멈추면 스스로 이름을 대게 — 순수 로직 (테스트 대상) ══════
   2026-08-16 대표 화면: 기업 상세에 들어가면 화면이 계속 멈추고 콘솔에 파이어베이스
   오류가 1,000건 넘게 쏟아졌다. 코드를 아무리 읽어도 «무엇이» 그 오류를 내는지 못
   짚었다 — 짐작으로 고치면 엉뚱한 곳을 건드린다. 그래서 다음에 또 멈추면 화면이
   스스로 알려 주게 한다: 5초 동안 몇 번 다시 그렸고, 회사 목록을 몇 번 다시 조립했고,
   서버가 안 받아 준 저장이 몇 건 밀려 있는지. */
function coWatchVerdict(s){
  const out = [];
  /* 서버로 나간 저장이 제일 먼저다 — 오류 폭주는 거의 언제나 여기서 나온다 */
  if(s.writes > 100) out.push('5초 동안 저장을 '+s.writes.toLocaleString()+'번 보냈습니다'
    + (s.busiest ? ' — 가장 많은 곳: '+s.busiest : ''));
  if(s.parked > 0) out.push('서버가 거부한 저장 '+s.parked+'건이 밀려 있습니다');
  else if(s.pending > 10) out.push('아직 못 보낸 저장 '+s.pending+'건이 밀려 있습니다');
  if(s.renders > 10) out.push('화면을 '+s.renders+'번 다시 그렸습니다 — 저장이 몰려 들어오고 있습니다');

let _coWatch = null;
function coWatchStart(){
  if(_coWatch) return;                       /* 이미 보고 있으면 그대로 둔다 */
  _coWatch = { renders:0, builds:0, blockedMs:0 };
  /* 「지금부터 5초 동안」 몇 번 저장이 나갔는지를 세려면 0에서 시작해야 한다 */

    });

  }catch(_){}
  setTimeout(()=>{
    try{ obs && obs.disconnect(); }catch(_){}
    const q = (window.PUResilience && PUResilience.stats)
      ? PUResilience.stats() : { pending:0, parked:0, writes:0, busiest:[], worst:[] };
    const top = (q.busiest && q.busiest[0]) ? (q.busiest[0].where+' '+q.busiest[0].n.toLocaleString()+'번') : '';
    const s = { renders:_coWatch.renders, builds:_coWatch.builds, blockedMs:_coWatch.blockedMs,

    _coWatch = null;

      +'번 · 멈춤 '+Math.round(s.blockedMs)+'ms · 저장 보냄 '+s.writes+'번'
      +' · 밀린 저장 '+s.pending+'건 · 거부된 저장 '+s.parked+'건');
    const lines = coWatchVerdict(s);
    lines.forEach(m=>console.log('   → '+m));
    if(q.busiest && q.busiest.length) console.log('   저장이 나간 곳:', q.busiest);
    if(q.worst && q.worst.length) console.log('   거부된 저장:', q.worst);
    coWatchShow(lines);
  }, 5000);
}

/* ── 이알피(사무관리) 사업 기록 — 읽기 전용 ──
   회사 상세 팝업에 이력을 보여주고, 폴더를 이알피 사업 유형에서 골라 만들 때 쓴다
   (대표 지시 2026-08-14). ⚠ data/cases, data/consultings 등은 이알피(pu-erp.html)의
   원장이다 — 여기서는 절대 쓰지 않는다, 읽기만 한다.
   ⚠ 사건관리는 레코드마다 typeName 이 이미 박혀 있지만, 나머지는 typeCode 만
     있고 사람이 읽는 이름은 별도 사전(data/biz_cons_types 등, 통째 배열 자리 — 레코드별
     자리가 아니다)에서 찾아야 한다.

   ── 2026-08-24 대표 지시로 넓힘 ──
   "동일 사업장에서 다양한 컨설팅을 여러 번 한 경우에 몇 년도 어떤 컨설팅 얼마 금액 등에
    대한 기록들을 모두 연결시켜 남겨 둬라. 그렇게 해야 한 번에 관리가 된다."
   · 컨설팅·사건만 읽던 것을 **기금·기타사업까지 넷**으로 넓혔다 — 「한 번에 관리」가

   · 사업자번호로만 잇던 것을 **이름으로도** 잇는다. 컨설팅 건에 사업자번호가 비어

const ERP_HIST_KINDS = [
  { kind:'consulting',    store:'consultings',    types:'biz_cons_types',  label:'컨설팅' },
  { kind:'case',          store:'cases',          types:'',                label:'사건' },
  { kind:'fund',          store:'funds',          types:'biz_fund_types',  label:'기금' },
  { kind:'other',         store:'other_projects', types:'biz_other_types', label:'기타' }
];
let _erpCaseCons = null;
let _erpCaseConsLoading = false;
let _erpConsTypes = null;
/* 사업마다 유형 이름 사전이 따로다 — { consulting:[...], fund:[...], other:[...] }.
   ⚠ 검사 둘(cards-erp-case-cons · cards-co-erp-history)이 이 이름을 ctx 로 쥐여 준다.
     vm 에서 top-level let 은 컨텍스트 프로퍼티가 아니라 밖에서 손댈 수 없기 때문이다. */
let _erpHistTypes = {};
let _erpCaseConsWaiters = [];
/* ⚠ 최종 전체 리뷰(2026-08-14): 조회가 아직 도는 중일 때 두 번째로 부르면 예전엔
   cb(null) 로 바로 답해 버렸다 — 이 세션의 첫 조회는 이알피의 사건·컨설팅 전부를
   가져오므로 짧은 순간이 아니다. 그 사이 가회사 패널을 열고 나회사 패널로 바꾸면,
   가회사의 fetch 가 나중에 끝나면서 그 콜백이 지금 화면(나회사)의 이력 칸에 가회사
   기록을 써 버리는 사고로 이어졌다. 도는 중이면 콜백을 큐에 담아 두고, 실제 결과가
   오면(성공이든 실패든) 그때 한꺼번에 불러 준다 — 아무도 틀린 답(null)을 미리
   받지 않는다. */
function loadErpCaseCons(cb){
  if(_erpCaseCons){ cb && cb(_erpCaseCons); return; }
  if(_erpCaseConsLoading){ if(cb) _erpCaseConsWaiters.push(cb); return; }
  if(Store.mode!=='firebase' || typeof firebase==='undefined' || !firebase.database){ cb && cb(null); return; }
  _erpCaseConsLoading = true;
  const db = firebase.database();
  /* 자리를 손으로 늘어놓지 않는다 — 목록(ERP_HIST_KINDS) 하나만 고치면 읽는 곳과
     이름 사전이 함께 따라온다. 손으로 늘어놓으면 사업을 하나 더할 때 한쪽만 늘어난다. */
  const paths = ERP_HIST_KINDS.map(s=>'data/'+s.store+'/v')
    .concat(ERP_HIST_KINDS.filter(s=>s.types).map(s=>'data/'+s.types));
  Promise.all(paths.map(p=>db.ref(p).once('value'))).then(snaps=>{
    const byBiz = {}, byName = {};
    const push = (rec, kind) => {
      const r = Object.assign({}, rec, { _kind: kind });
      const b = digits(rec.bizNo||'');
      if(b.length>=10){ (byBiz[b] = byBiz[b]||[]).push(r); return; }
      /* ⚠ 사업자번호가 없으면 **이름으로** 담는다. 예전에는 여기서 버렸다 —
         컨설팅 건에 번호를 안 적는 일이 흔해서, 이름이 똑같은데도 이력이 하나도
         안 붙었다(대표 화면 2026-08-24). 다만 이름은 같은 이름 다른 회사일 수
         있으므로 _byName 표를 달아 화면이 그 사실을 밝힌다. */
      const n = _norm(rec.companyName || rec.company || rec.name || '');
      if(!n) return;
      r._byName = true;
      (byName[n] = byName[n]||[]).push(r);
    };
    ERP_HIST_KINDS.forEach((s, i)=>{
      Object.values(snaps[i].val()||{}).forEach(r=>{ if(r) push(r, s.kind); });
    });
    /* ⚠ 이알피의 코드표는 `{v: [...], u: 갱신시각}` 으로 싸여 있다.
       이 껍데기를 안 벗기면 Object.values 가 `[[유형들], 갱신시각]` 을 만들어
       유형을 하나도 못 찾고, 화면에 이름 대신 **코드가 그대로**(consulting-mp0w1084)
       나온다(대표 보고 2026-08-15). 다른 앱들(gov-consulting·kcareer)은 이미 벗기고 있다.
       위 기록들은 `/v` 를 붙여 읽어서 이 문제가 없었다. */
    const withTypes = ERP_HIST_KINDS.filter(s=>s.types);
    _erpHistTypes = {};
    withTypes.forEach((s, j)=>{
      _erpHistTypes[s.kind] = erpUnwrapList(snaps[ERP_HIST_KINDS.length + j].val());
    });
    _erpConsTypes = _erpHistTypes.consulting || [];
    _erpCaseCons = { byBiz, byName };
    _erpCaseConsLoading = false;
    const waiters = _erpCaseConsWaiters; _erpCaseConsWaiters = [];
    cb && cb(_erpCaseCons);
    waiters.forEach(w=>w(_erpCaseCons));
  }).catch(e=>{
    _erpCaseConsLoading = false;
    console.warn('[erpCaseCons]', e&&e.message);
    const waiters = _erpCaseConsWaiters; _erpCaseConsWaiters = [];
    cb && cb(null);
    waiters.forEach(w=>w(null));
  });
}
/* ══════ 이알피 코드표 읽기 — 순수 로직 (테스트 대상) ══════ */

/* 이알피 자료는 `{v: [...], u: 갱신시각}` 으로 싸여 오기도 하고 그냥 오기도 한다.
   껍데기를 벗기고 늘 배열로 돌려준다 — 다른 앱(gov-consulting·kcareer)과 같은 규칙이다. */
function erpUnwrapList(raw){
  const v = (raw && typeof raw==='object' && 'v' in raw) ? raw.v : raw;
  if (Array.isArray(v)) return v.filter(Boolean);
  if (v && typeof v==='object') return Object.values(v).filter(Boolean);
  return [];
}

/* 이 기록이 어떤 유형인지 — 코드가 어디에 적혀 있는지가 자료마다 다르다.
   이알피는 새 자료를 `typeCodes.consulting` 에, 옛 자료를 `typeCode` 에 적는다
   (kcareer 의 typeCodeOf 와 같은 규칙). 한쪽만 보면 그 자료들이 「(이름 없음)」이 된다. */
/* ⚠ 2026-08-24: 기금·기타사업까지 넓혔다. 예전에는 case 가 아니면 죄다 consulting
   으로 몰았는데, 그러면 기금 기록의 typeCodes.fund 를 못 보고 「(이름 없음)」이 된다. */
const ERP_TYPE_KEYS = { case:'case', consulting:'consulting', fund:'fund', other:'other' };
function erpTypeCodeOf(rec, kind){
  if(!rec) return '';
  const k = ERP_TYPE_KEYS[kind] || 'consulting';
  const c = rec.typeCodes && rec.typeCodes[k];
  return String(c || rec.typeCode || '');
}

/* 코드 → 사람이 읽는 이름. 못 찾으면 코드를 그대로 돌려준다 —
   빈칸으로 두면 「이름 없는 사업」이 여럿 생겨 어느 것이 어느 것인지 알 수 없다. */
function erpTypeNameFrom(types, typeCode){
  if(!typeCode) return '';
  const t = (types||[]).find(x=>x && String(x.code)===String(typeCode));
  return (t && t.name) ? t.name : typeCode;
}

/* ══════ 이 회사에서 한 일 — 순수 로직 (대표 승인 목업 2026-08-24) ══════
   화면이 쓰는 값은 모두 여기서 뽑는다. 그려 보지 않고도 「해가 맞나·금액이 맞나·
   걸러기가 맞나」를 잴 수 있어야 한다. */

const ERP_HIST_LABEL = { consulting:'컨설팅', case:'사건', fund:'기금', other:'기타' };
/* 이알피의 상태값을 넷으로 모은다. 이알피는 사업마다 조금씩 다른 낱말을 쓴다
   (open/active, closed/done) — 화면에서 갈라지면 「완료」와 「종료」가 따로 세어진다. */
const ERP_HIST_STAT = { pending:'wait', wait:'wait', open:'run', active:'run', ongoing:'run',
                        closed:'done', done:'done', complete:'done', cancelled:'cancel', canceled:'cancel' };
const ERP_HIST_STAT_LABEL = { wait:'대기', run:'진행중', done:'완료', cancel:'취소' };
const ERP_HIST_SORTS = [['newest','최근 해부터'], ['oldest','오래된 해부터'],
                        ['fee','금액 큰 순'], ['kind','갈래별']];

/* 해로 묶는 정렬인가. ⚠ 금액순·갈래별에 해 머리줄을 붙이면 **묶음이 정렬을 이긴다** —
   금액 큰 순으로 봤는데 1,650만원이 아래에 있게 된다. 그럴 때는 줄마다 해를 붙인다. */
function erpHistGrouped(sort){ return sort === 'newest' || sort === 'oldest'; }

/* 이 기록의 해. 시작일 → 접수일 → 끝난일 → 종료 도장 차례로 본다.
   ⚠ 못 찾으면 0 을 준다 — 오늘 해로 메우면 십 년 전 사건이 올해 것으로 올라온다. */
function erpHistYear(rec){
  const cand = [rec && rec.startDate, rec && rec.receiveDate, rec && rec.endDate,
                rec && rec.closeDate, rec && rec.closedDate, rec && rec.closedAt];
  for(let i=0;i<cand.length;i++){
    const m = String(cand[i]||'').match(/(19|20)\d{2}/);
    if(m) return Number(m[0]);
  }
  return 0;
}
/* 「2026-03-02」 에서 월·일만 — 해는 머리줄이나 줄 앞에 따로 붙는다 */
function erpHistMd(v){
  const m = String(v||'').match(/(\d{1,2})[-./](\d{1,2})\s*$/);
  return m ? (String(m[1]).padStart(2,'0')+'-'+String(m[2]).padStart(2,'0')) : '';
}
/* 받은 금액. 이알피는 계약금·잔금으로 갈라 담고, 옛 자료는 fee 한 칸에 담았다.
   ⚠ contractFee 가 있으면 fee 를 더하지 않는다 — 옛 자료를 옮길 때 fee 를 반씩
     갈라 두었으므로(ProjectManagementShared 의 마이그레이션) 더하면 두 배가 된다. */
function erpHistFee(rec){
  const n = v => Number(v) || 0;
  const split = n(rec && rec.contractFee) + n(rec && rec.balanceFee)
              + n(rec && rec.retainerFee) + n(rec && rec.successFee);
  return split || n(rec && rec.fee);
}
function erpHistStat(rec){
  const s = String((rec && rec.status) || '').toLowerCase();
  if(rec && rec.permanentArchived) return 'done';
  return ERP_HIST_STAT[s] || (s ? 'run' : 'wait');
}
/* 이 기록의 유형 이름. 사건만 레코드에 박혀 있고 나머지는 사전을 찾아야 한다. */
function erpHistName(rec, typesByKind){
  const kind = (rec && rec._kind) || 'consulting';
  if(kind === 'case') return String((rec && rec.typeName) || '').trim();
  const dict = (typesByKind || {})[kind] || null;
  return erpTypeNameFrom(dict, erpTypeCodeOf(rec, kind));
}
/* 기록 하나 → 화면 한 줄 */
function erpHistRow(rec, typesByKind){
  return {
    kind: (rec && rec._kind) || 'consulting',
    name: erpHistName(rec, typesByKind) || '(이름 없음)',
    year: erpHistYear(rec),
    from: erpHistMd(rec && (rec.startDate || rec.receiveDate)),
    to:   erpHistMd(rec && (rec.endDate || rec.closeDate || rec.closedDate)),
    mgr:  String((rec && rec.managerMain) || ''),
    no:   String((rec && (rec.no || rec.mgmtNo)) || ''),
    fee:  erpHistFee(rec),
    stat: erpHistStat(rec),
    byName: !!(rec && rec._byName)
  };
}

/* 이 회사의 기록 모으기 — 사업자번호가 맞으면 그것만, 없으면 이름으로.
   ⚠ 번호로 찾았으면 이름 쪽은 **안 본다.** 번호가 회사를 딱 가리키는데 같은 이름
     남의 회사까지 섞으면 남의 금액이 합계에 들어간다.
   ⚠ 번호로 못 찾았을 때만 이름으로 간다 — 그것이 지금까지 이력이 하나도 안 붙던 자리다. */
function erpHistRecsFor(data, bizno, name){
  if(!data) return [];
  const b = digits(bizno||'');
  const byBiz = data.byBiz || {};
  if(b.length>=10 && byBiz[b] && byBiz[b].length) return byBiz[b].slice();
  const n = _norm(name||'');
  const byName = data.byName || {};
  return (n && byName[n]) ? byName[n].slice() : [];
}

/* 깔때기. ⚠ 갈래를 하나도 안 켰으면 **전체**다 — 안 켠 상태를 「아무것도 안 보임」으로
   두면 마지막 칩을 끈 순간 목록이 비어 고장으로 읽힌다. */
function erpHistPick(rows, pick){
  const p = pick || {};
  const kinds = Object.keys(p.kinds || {}).filter(k=>p.kinds[k]);
  return (rows||[]).filter(r=>{
    if(kinds.length && kinds.indexOf(r.kind)<0) return false;
    if(p.year && p.year!=='all' && String(r.year)!==String(p.year)) return false;
    if(p.stat && p.stat!=='all' && r.stat!==p.stat) return false;
    return true;
  });
}
function erpHistSort(rows, sort){
  const a = (rows||[]).slice();
  const ord = ['consulting','case','fund','other'];
  if(sort==='oldest') a.sort((x,y)=> (x.year-y.year) || String(x.from).localeCompare(String(y.from)));
  else if(sort==='fee') a.sort((x,y)=> (y.fee-x.fee) || (y.year-x.year));
  else if(sort==='kind') a.sort((x,y)=> (ord.indexOf(x.kind)-ord.indexOf(y.kind)) || (y.year-x.year));
  else a.sort((x,y)=> (y.year-x.year) || String(y.from).localeCompare(String(x.from)));
  return a;
}
/* 합계 — 건수·금액·몇 개 해. ⚠ 걸러 놓고 전체 합계를 보여주면 숫자를 잘못 읽는다.
   그래서 «보이는 것»의 합계를 따로 셀 수 있게 이 함수를 두 번 부른다. */
function erpHistSum(rows){
  const list = rows || [];
  const ys = {};
  let fee = 0;
  list.forEach(r=>{ fee += Number(r.fee)||0; if(r.year) ys[r.year]=1; });
  return { n: list.length, fee: fee, years: Object.keys(ys).length };
}
/* 갈래마다 몇 건인가 — 칩에 숫자를 달고, 0건인 갈래는 칩을 아예 안 만들려고 쓴다 */
function erpHistCounts(rows){
  const c = {};
  (rows||[]).forEach(r=>{ c[r.kind] = (c[r.kind]||0)+1; });
  return c;
}
/* 이름표(「컨설팅·현장클리닉」)에서 갈래 머리를 뗀다 — 폴더 이름에는 갈래를 안 넣는다.
   ⚠ 목록에서 만든다. 손으로 「사건·|컨설팅·」만 적어 두면 기금·기타사업이 붙은 뒤
     폴더 이름이 「기금·복지기금 설립」으로 남는다. */
function erpHistStripKind(label){
  const s = String(label||'');
  const heads = Object.keys(ERP_HIST_LABEL).map(k=>ERP_HIST_LABEL[k]);
  for(let i=0;i<heads.length;i++){
    if(s.indexOf(heads[i]+'·')===0) return s.slice(heads[i].length+1);
  }
  return s;
}

/* 큰 금액은 짧게 — 합계 띠 오른쪽의 「모두 9건 3,910만원」 자리에 쓴다 */
function erpHistShortWon(n){
  const v = Number(n)||0;
  if(v>=100000000) return (Math.round(v/10000000)/10)+'억원';
  if(v>=10000) return Math.round(v/10000).toLocaleString()+'만원';
  return v.toLocaleString()+'원';
}

/* ══════ 이알피 코드표 읽기 — 화면 ══════ */
/* ⚠ 한 줄로 줄이지 말 것 — 검사 두 개가 이 함수를 선언 첫 글자부터
   「줄 첫머리의 }」 까지로 잘라 쓴다(cards-erp-case-cons · cards-co-erp-import).
   ⚠ 이 주석에 함수 이름을 그대로 쓰지 않는다 — 검사가 indexOf 로 찾다가
     주석을 먼저 집어 주석 한가운데부터 잘라 문법오류가 난다(실제로 겪음). */
function erpConsTypeName(typeCode){
  return erpTypeNameFrom(_erpConsTypes, typeCode);
}

/* 담당자 사번(managerMain, 예: 'p001')을 사람 이름으로 — user_dir 매핑은 ErpMatch.load()
   가 이미 만들어 둔 nameByEmail(사번@pureun.kr → 이름)을 그대로 쓴다(같은 규칙을
   두 곳에 안 둔다). */
function erpMgrName(sid){
  if(!sid) return '';
  const email = String(sid).toLowerCase().replace(/-/g,'') + '@pureun.kr';
  return ErpMatch.nameByEmail[email] || sid;
}
/* 이력 한 줄 — 윗층은 갈래·이름·금액 셋뿐이고, 아랫층은 옅은 글씨로 기간·담당·번호와
   오른쪽 끝 상태다(대표 승인 목업 2026-08-24). 지금까지는 이 여섯이 한 덩이로 섞여
   어느 것이 이름이고 어느 것이 기간인지 매번 읽어야 했다.
   ⚠ grouped=true 면 해는 머리줄에 있으니 줄에 또 안 붙인다. false 면 줄 앞에 붙인다 —
     둘 다 안 붙이면 금액순으로 볼 때 몇 년 것인지 알 수 없다. */
function erpHistRowHtml(row, grouped){
  const kind = ERP_HIST_LABEL[row.kind] ? row.kind : 'other';
  const per = [(grouped || !row.year) ? '' : String(row.year),
               row.from ? (row.from + '~' + (row.to || '')) : ''].filter(Boolean).join(' · ');
  const tail = [per, row.mgr ? erpMgrName(row.mgr) : '', row.no].filter(Boolean).join(' · ');
  return `<div class="cohist-row">
    <div class="l1"><span class="bd k-${kind}">${esc(ERP_HIST_LABEL[kind])}</span>
      <span class="nm">${esc(row.name)}</span>
      ${row.byName?`<span class="cohist-byname" title="사업자번호가 없어 이름으로 이었습니다 — 같은 이름 다른 회사일 수 있습니다">이름</span>`:''}
      <span class="fee">${row.fee?row.fee.toLocaleString()+'원':'—'}</span></div>
    <div class="l2"><span class="sp">${esc(tail)}</span>
      <span class="st s-${row.stat}">${esc(ERP_HIST_STAT_LABEL[row.stat]||'')}</span></div>
  </div>`;
}

/* 지금 보고 있는 회사와 깔때기 상태.
   ⚠ **회사를 열 때마다 처음 상태로 돌린다**(대표 승인 목업 2026-08-24) — 어제 걸어 둔
     조건이 남아 있으면 「이 회사는 기록이 없다」고 잘못 읽는다.
   ⚠ var 로 둔다. 검사가 이 함수 묶음을 vm 에 떠서 돌리는데, top-level let 은 컨텍스트
     프로퍼티가 아니라 밖에서 손을 못 댄다. */
var _coHist = { o:null, data:null, pick:null };
function coHistFresh(){ return { kinds:{}, year:'all', stat:'all', sort:'newest' }; }

function renderCoErpHistory(o, data){
  _coHist = { o:o, data:data, pick:coHistFresh() };
  coHistPaint();
}
/* 깔때기를 만질 때는 이력 칸만 다시 그린다 — 패널을 통째로 다시 그리면 스크롤이 튄다 */
function coHistSet(what, val){
  if(!_coHist.pick) return;
  if(what==='kind'){
    if(!val) _coHist.pick.kinds = {};                      /* 「전체」는 갈래 고르기를 통째로 푼다 */
    else _coHist.pick.kinds[val] = !_coHist.pick.kinds[val];
  } else if(what==='reset'){ _coHist.pick = coHistFresh(); }
  else _coHist.pick[what] = val;
  coHistPaint();
}
function coHistPaint(){
  const box = $('coErpHistBox'); if(!box) return;
  const o = _coHist.o, data = _coHist.data, pick = _coHist.pick || coHistFresh();
  if(!o || !data){ box.innerHTML=''; return; }
  const recs = erpHistRecsFor(data, o.bizno, o.name);
  /* 기록이 없으면 칸 자체를 안 그린다 — 메모 없으면 메모 칸을 안 그리는 것과 같은 결 */
  if(!recs.length){ box.innerHTML=''; return; }

  const all = recs.map(r=>erpHistRow(r, _erpHistTypes));
  const rows = erpHistSort(erpHistPick(all, pick), pick.sort);
  const sumAll = erpHistSum(all), sumNow = erpHistSum(rows);
  const counts = erpHistCounts(all);
  const filtered = rows.length !== all.length;
  const grouped = erpHistGrouped(pick.sort);

  /* 갈래 칩 — 0건인 갈래는 아예 만들지 않는다. 눌러도 안 되는 단추는 고장으로 읽힌다. */
  const anyKind = Object.keys(pick.kinds||{}).some(k=>pick.kinds[k]);
  let chips = `<span class="cohist-chip k-all${anyKind?'':' on'}" onclick="coHistSet('kind','')">`
    + `전체 <span class="n">${all.length}</span></span>`;
  Object.keys(ERP_HIST_LABEL).forEach(k=>{
    if(!counts[k]) return;
    chips += `<span class="cohist-chip k-${k}${pick.kinds[k]?' on':''}" onclick="coHistSet('kind','${k}')">`
      + `${esc(ERP_HIST_LABEL[k])} <span class="n">${counts[k]}</span></span>`;
  });

  const years = {}; all.forEach(r=>{ if(r.year) years[r.year]=1; });
  const yearOpts = ['<option value="all">전체</option>'].concat(
    Object.keys(years).sort().reverse().map(y=>
      `<option value="${y}"${String(pick.year)===y?' selected':''}>${y}</option>`)).join('');
  const statOpts = ['<option value="all">전체</option>'].concat(
    Object.keys(ERP_HIST_STAT_LABEL).map(s=>
      `<option value="${s}"${pick.stat===s?' selected':''}>${esc(ERP_HIST_STAT_LABEL[s])}</option>`)).join('');
  const sortOpts = ERP_HIST_SORTS.map(s=>
    `<option value="${s[0]}"${pick.sort===s[0]?' selected':''}>${esc(s[1])}</option>`).join('');

  let list = '';
  if(!rows.length){
    list = `<div class="cohist-none">고른 조건에 맞는 기록이 없습니다.<br>
      <span style="font-size:11px">갈래·해·상태를 넓혀 보세요.</span></div>`;
  } else {
    let curY = null;
    rows.forEach(r=>{
      if(grouped && r.year !== curY){
        curY = r.year;
        const mine = rows.filter(x=>x.year===curY);
        const s = erpHistSum(mine);
        list += `<div class="cohist-yr"><span class="n">${curY?curY+'년':'해 모름'}</span>`
          + `<span class="ln"></span><span class="t">${s.n}건 · ${s.fee.toLocaleString()}원</span></div>`;
      }
      list += erpHistRowHtml(r, grouped);
    });
  }

  box.innerHTML = `<div class="pdsec" style="margin-top:16px">이 회사에서 한 일`
    + ` <span style="font-weight:400;color:#a8b2c6">${sumAll.n}건`
    + `${sumAll.years?' · '+sumAll.years+'개 해':''}</span></div>`
    + `<div class="cohist-sum">${filtered?'<span>보이는 것</span>':'<span>모두</span>'}`
    + `<b>${sumNow.fee.toLocaleString()}원</b>`
    + `<span>· ${sumNow.n}건${sumNow.years?' · '+sumNow.years+'개 해':''}</span>`
    + `${filtered?`<span class="of">모두 ${sumAll.n}건 ${esc(erpHistShortWon(sumAll.fee))}</span>`:''}</div>`
    /* 건이 셋보다 적으면 깔때기를 아예 안 보인다 — 두 건 앞에 조작줄 두 줄은 자리만 먹는다 */
    + (all.length < 3 ? '' : `<div class="cohist-funnel">
        <div class="cohist-chips">${chips}</div>
        <div class="cohist-picks">
          <label>해 <select onchange="coHistSet('year',this.value)">${yearOpts}</select></label>
          <label>상태 <select onchange="coHistSet('stat',this.value)">${statOpts}</select></label>
          <label>정렬 <select onchange="coHistSet('sort',this.value)">${sortOpts}</select></label>
          ${filtered||pick.sort!=='newest'?`<button class="cohist-reset" onclick="coHistSet('reset')">되돌리기</button>`:''}
        </div></div>`)
    + list;
}

/* 회사가 어떤 사업으로 들어왔는지 — 사진첩에서 서식을 보낼 때 그 서류이름이 딱지가 된다.
   기업정보는 「특정 사업 때문에」 모이는 일이 많다(대표 지시 2026-08-12). 명함이 폴더를
   갖듯 회사도 사업으로 갈라 봐야 「이번 지원사업에 넣은 곳이 어디였더라」에 답할 수 있다. */
const coTagsOf = o => Object.keys((o.extra && o.extra.tags) || {});

/* ══════ 폴더 안의 탭 — 순수 로직 (테스트 대상) ══════
   대표 지시 2026-08-16: "폴더 안에 메인에 탭을 만들 수 있도록 해달라."
   명함의 「담는 탭」과 같은 것이다 — 폴더가 「어디에 두었나」라면, 탭은 그 안에서
   「어떤 일로 묶었나」다. 한 회사는 폴더 하나에만 들어가지만 탭은 여럿 붙을 수 있다.

   ⚠ 탭은 «폴더에 딸린다»(coFolders/{폴더}/tabs/{탭}). 폴더와 따로 두면 폴더를 지웠을 때
     주인 없는 탭이 남고, 같은 이름 탭이 폴더마다 겹칠 때 어느 폴더 것인지 알 수 없다.
   ⚠ 회사가 어느 탭에 담겼는지는 coInfo/{회사}/ftabs/{탭}=true 로 둔다 — 폴더(folder)와
     같은 자리에 있어야 「폴더·탭 비우기」가 한 번에 뗄 수 있다. */
const coFTabsOf = o => Object.keys((o.extra && o.extra.ftabs) || {});
/* 이 폴더에 만들어 둔 탭들 — 만든 차례대로 */
function coFTabList(folder){
  const tabs = (folder && folder.tabs) || {};
  return Object.keys(tabs).map(id => ({ id: id, name: (tabs[id] && tabs[id].name) || '이름 없음',
                                        order: Number((tabs[id] && tabs[id].order) || 0) }))
    .sort((a, b) => (a.order - b.order) || a.name.localeCompare(b.name, 'ko'));
}
/* 탭마다 회사가 몇 곳인가 — 이 폴더 «안에 있는» 회사만 센다.
   폴더 밖 회사에 옛 탭 표시가 남아 있어도 세면 안 된다 — 숫자가 안 맞는다. */
function coFTabCounts(list, folderId){
  const inFolder = (list || []).filter(o => o && o.folder === folderId);
  const c = {};
  inFolder.forEach(o => coFTabsOf(o).forEach(t => { c[t] = (c[t] || 0) + 1; }));
  return { all: inFolder.length, byTab: c };
}
/* 고른 회사를 탭에 담거나 빼는 통 — 한 곳씩 보내지 않는다(2026-08-16 폭주의 교훈) */
function coFTabPlan(keys, tabId, on, chunk){
  const arr = (keys || []).filter(Boolean);
  const size = Math.max(1, Math.floor(Number(chunk)) || 1);
  const out = [];
  if(!tabId) return out;
  for(let i = 0; i < arr.length; i += size){
    const upd = {};
    arr.slice(i, i + size).forEach(k => { upd['coInfo/' + k + '/ftabs/' + tabId] = on ? true : null; });
    if(Object.keys(upd).length) out.push(upd);
  }
  return out;
}
/* ══════ 폴더 안의 탭 — 화면 ══════ */
/* ＃탭 줄 — 명함·사업자의 탭 칩과 «같은 자리(#pcErpTabs)·같은 모양»으로 그린다.
   대표 지시 2026-08-17: "이거 뭐냐 갑자기 왜 폴더 아래 이렇게 나왔나.
   탭생성은 명함이나 사업자와 같이 나와야 되는데."
   예전에는 이 줄이 옆줄의 폴더 «아래»에 들여쓴 채 파고들어 있었다. 같은 앱 안에서
   탭이 두 가지 모양으로 갈라져, 명함을 쓰던 손이 기업 상세에서 길을 잃었다.
   이제 어느 화면이든 «폴더는 왼쪽, 탭은 윗줄»로 읽힌다.

   ⚠ 탭은 폴더에 «딸린다». 폴더를 안 골랐으면 보여 줄 탭이 없으므로 빈 글자를 준다 —
     엉뚱한 폴더의 탭을 섞어 보이거나 눌러도 안 되는 칩을 두면 안 된다.
   ⚠ 칩 모양은 renderMyTabsHtml 의 것을 그대로 따른다. 한쪽만 고치면 대표가 지금
     지적한 그 어긋남이 다시 생긴다. */
/* ⚠ 2026-08-26 대표 화면: 「전체」에서 이 줄이 통째로 비어 있었다.
     예전에는 폴더가 없으면 여기서 바로 되돌아갔는데, 그 뒤에 붙여 둔 것들
     (🚪 종료 · 🔢 번호 없음 · 📋 정보부족 · 개수 고르기)까지 같이 사라졌다.
     4,143곳을 보면서 «몇 개씩 볼지 고를 길이 없었다.»
     탭 칩만 폴더에 딸린다 — 도구는 폴더와 상관이 없다. 그래서 둘을 갈라 놓는다. */
function renderCoFTabsHtml(){
  const f = (_coFolders||{})[state.coFolder];
  return (f ? coFTabChipsHtml(f) : '') + coToolsHtml();
}
function coFTabChipsHtml(f){
  const cnt = coFTabCounts(coList(), f.id);
  const allOn = !state.coFTab;
  /* 「＃ 전체」 — 명함의 「📋 전체」 칩과 같은 결. 탭을 눌렀다가 폴더 전체로 한 번에 돌아온다.
     저장된 탭이 아니라 늘 맨 앞이므로 끌 수 없다. */
  let h = `<span style="display:inline-flex;align-items:center;cursor:pointer;
      border:1.5px solid ${allOn?'#1e2a47':'#d7dfec'};background:${allOn?'#1e2a47':'#fff'};
      color:${allOn?'#fff':'#33415e'};border-radius:18px;font-weight:700;font-size:12.5px;
      padding:6px 13px;margin-right:2px"
      onclick="pickCoFTab('')" title="${esc(f.name)} 폴더의 회사를 모두 봅니다 — 고른 탭을 풉니다">＃ 전체
      <b style="margin-left:5px;font-weight:800;${allOn?'':'color:#5a6885'}">${cnt.all.toLocaleString()}</b></span>`;
  h += coFTabList(f).map(t=>{
    const on = state.coFTab===t.id;
    const n  = cnt.byTab[t.id]||0;
    /* 대표만 좌우로 끌어 차례를 바꾼다. scope 로 부모 폴더 id 를 넘긴다 —
       안 넘기면 다른 폴더의 탭끼리 형제가 되어 엉뚱한 폴더의 순서가 바뀐다. */
    return `<span draggable="${state.isAdmin ? 'true' : 'false'}"
      ondragstart="onOrdDragStart(event,'coftab','${t.id}','${f.id}')"
      ondragend="onOrdDragEnd(event)"
      ondragover="onOrdDragOver(event)"
      ondragleave="onOrdDragLeave(event)"
      ondrop="onOrdDrop(event,'coftab','${t.id}','${f.id}')"
      style="display:inline-flex;align-items:center;border:1.5px solid ${on?'#1d4ed8':'#cfe0fb'};background:${on?'#1d4ed8':'#f4f9ff'};color:${on?'#fff':'#1d4fc4'};border-radius:18px;font-weight:700;font-size:12.5px;overflow:hidden">
      <span style="cursor:pointer;padding:6px 4px 6px 13px" onclick="pickCoFTab('${t.id}')" title="${esc(t.name)} 탭에 담은 회사만 봅니다">＃ ${esc(t.name)}
        <b style="margin-left:5px;font-weight:800;${on?'':'color:#5a6885'}">${n.toLocaleString()}</b></span>
      <span style="cursor:pointer;padding:6px 9px 6px 4px;opacity:.75;font-size:13px" onclick="openCoFTabMenu(event,'${f.id}','${t.id}')" title="이름변경 · 삭제">⋮</span></span>`;
  }).join('');
  h += `<button onclick="newCoFTab('${f.id}')" title="「${esc(f.name)}」 폴더 안에서 회사를 다시 갈래로 묶습니다" style="border:1.5px dashed #c3d0e6;background:#fff;color:#5a6885;border-radius:18px;padding:6px 13px;font-weight:700;font-size:12.5px;cursor:pointer">＋ 탭 만들기</button>`;
  return h;
}

/* ── "이알피에서 가져오기" — 사업 유형별로 회사를 한꺼번에 폴더에 담는다 ──

   사업자등록증) 회사만 담고, 없으면 건너뛰고 안내한다. */
function coErpFolderCandidates(cb){
  loadErpCaseCons(data=>{
    if(!data){ cb([]); return; }
    const byType = {};
    /* ⚠ 폴더로 담는 것은 **사업자번호로 맞춘 회사만**이다(아래 coImportFolderFromType 가
       10자리로 맞춘다). 그래서 여기서도 byBiz 만 본다 — 이름으로 이은 기록까지 후보에
       넣으면 「23곳 후보」라고 해 놓고 정작 담기는 것은 두 곳이 된다.
       ⚠ 이름표는 erpHistRowHtml 과 **같은 규칙**을 쓴다(_erpHistTypes) — 두 벌로 두면
         기금·기타사업이 여기서만 「(이름 없음)」이 된다. */
    Object.values(data.byBiz||{}).forEach(recs=>recs.forEach(rec=>{
      const kind = ERP_HIST_LABEL[rec._kind] ? rec._kind : 'other';
      const label = ERP_HIST_LABEL[kind] + '·' + (erpHistName(rec, _erpHistTypes) || '(이름 없음)');
      (byType[label] = byType[label]||[]).push(rec);
    }));
    const list = Object.keys(byType).map(label=>({
      label, kind: byType[label][0]._kind, n: byType[label].length, recs: byType[label]
    })).sort((a,b)=>b.n-a.n);
    cb(list);
  });
}
async function coImportFolderFromType(label, recs){
  /* ⚠ 최종 전체 리뷰(2026-08-14) — 세 가지를 고쳤다.
     1) 하나도 못 찾으면(matched===0) 폴더 자체를 안 만든다 — 예전엔 폴더부터 만들고
        나서야 매칭을 셌는데, 그러면 담을 회사가 하나도 없어도 빈 폴더가 사이드바에
        남아 손으로 지워야 했다. 매칭부터 세고, 있을 때만 폴더를 만들거나 이어 쓴다.
     2) 이미 다른 폴더에 있던 회사를 조용히 옮기지 않는다 — 몇 곳이 다른 폴더에서
        옮겨졌는지 안내에 포함한다(매칭 안 된 회사를 건너뛴 수를 알리는 것과 같은 결).
     3) 새 폴더를 만든 것인지 이미 있는 폴더에 이어 담은 것인지 안내 문구로 구분한다
        — 지금까지는 문구가 같아서 "이름이 같은 남의 폴더에 합쳐진 것"을 알 길이 없었다. */
  if(Store.mode!=='firebase') return toast('클라우드에 연결된 상태에서만 됩니다');
  const name = erpHistStripKind(label);

  const byKey = {}; coList().forEach(o=>{ const b=digits(o.bizno||''); if(b.length>=10) byKey[b]=o; });
  const matchedCos = []; let skipped=0;
  recs.forEach(rec=>{
    const b = digits(rec.bizNo||'');
    const co = byKey[b];
    if(!co){ skipped++; return; }
    matchedCos.push(co);
  });
  if(!matchedCos.length){ toast(`「${name}」 사업에서 담을 회사를 찾지 못했습니다`); return; }

  const existing = Object.values(_coFolders).find(f=>f.name===name);
  const folderId = existing ? existing.id : uid();
  let reassigned = 0;
  const upd = {};
  matchedCos.forEach(co=>{
    if(co.folder && co.folder!==folderId) reassigned++;
    upd['coInfo/'+co.key+'/folder'] = folderId;
  });
  if(!existing){
    let by=''; try{ by=(firebase.auth().currentUser||{}).email||''; }catch(_){}
    putCoFolder({ id:folderId, name, order:Date.now(), at:Date.now(), by });
  }
  try{
    await Store.db.ref(DB_ROOT).update(upd);
  }catch(e){
    return toast('가져오기 실패: '+((e&&e.message)||''));
  }
  const parts = [`${matchedCos.length}곳을 「${name}」 폴더에 ${existing?'이어 ':''}담았습니다`];
  if(reassigned) parts.push(`${reassigned}곳은 다른 폴더에서 옮겨졌습니다`);
  if(skipped) parts.push(`${skipped}곳은 명함·사업자등록증이 없어 건너뛰었습니다`);
  toast(parts.join(' · '));
  renderCoAny();
}

  /* ⚠ 재검토(2026-08-14): _coErpImportCache 만 보고 다시 안 불러오게 막으면, 응답이
     오기 전에 탭을 눌렀다 뗐다 하면 같은 조회를 여러 번 부르고, 나중에 도착한 응답이
     "이름으로 만들기" 탭으로 옮겨 타이핑 중인 화면을 조용히 덮어써 버린다.
     _coErpImportLoading 으로 이미 도는 중인지 막고, 응답이 왔을 때 지금도 여전히

   기업정보가 손댈 물건이 아니다(설계서 "안 하기로 한 것": 회사를 손으로 새로 만들지도

/* 지금 화면에 보이는 목록 — 「전체 고르기」와 화면 그리기가 **같은 목록**을 봐야 한다.
   따로 계산하면 거르개를 켠 채 전체 고르기를 눌렀을 때 안 보이는 회사까지 골라진다. */
/* 거르는 차례는 여기 한 곳에만 둔다 — 예전에 renderCoPage 가 따로 걸러서
   정렬(coSorted)이 화면엔 안 먹힌 적이 있다. 열 깔때기(coColFilter)도 같은 실수를
   반복하지 않으려고 처음부터 이 함수 안에 넣는다.
   skipCol 을 주면 그 칸의 깔때기만 빼고 거른다 — 깔때기를 열 때 "이 칸을 지금 값으로
   거르지 않았다면 무엇이 보일까"를 보여줘야 하기 때문이다(안 그러면 목록이 늘 하나만
   남아 다른 값으로 못 바꾼다). */
function coFilteredList(skipCol){
  const q = String(state.coQ||'').trim().toLowerCase();
  let list = coList();
  if(state.coFolder) list = list.filter(o=>o.folder===state.coFolder);
  /* 폴더 안의 탭 — 폴더를 고른 상태에서만 뜻이 있다 */
  if(state.coFolder && state.coFTab) list = list.filter(o=>coFTabsOf(o).indexOf(state.coFTab)>=0);
  if(state.coTag) list = list.filter(o=>coTagsOf(o).indexOf(state.coTag)>=0);
  if(q) list = list.filter(o=>(o.name+' '+(o.bizno||'')+' '+(o.ceo||'')).toLowerCase().indexOf(q)>=0);
  Object.keys(state.coColFilter||{}).forEach(f=>{
    if(f===skipCol) return;
    const get = CO_SORT[f]; if(!get) return;
    list = list.filter(o=>get(o)===state.coColFilter[f]);
  });
  /* ── 푸른이알피 종료 업체만 (대표 지시 2026-08-24) ──
     o.erp.left 는 이미 ErpMatch 가 계산해 둔 값이다(companies[].status==='closed').
     ERP 에 없는 회사(o.erp 가 null)는 정보가 없을 뿐 종료가 아니다 — left 가
     undefined 라 아래 필터에서 자연히 빠진다. */
  if(state.coOnlyClosed) list = list.filter(o=>o.erp && o.erp.left);
  /* ── 사업자번호 없는 회사만 (대표 지시 2026-08-24, 2순위) ──
     회사를 가르는 열쇠가 사업자번호다(coKeyOf). 번호가 없으면 이름으로 열쇠를 만드는데,
     사진첩은 언제나 coInfo/{사업자번호} 로 보낸다 — 그래서 번호 없는 회사는
     사진첩이 보낸 정보를 «받을 수 없다». 채워야 할 곳을 눈에 보이게 한다. */
  if(state.coOnlyNoBiz) list = list.filter(o=>!String(o.bizno||'').trim());
  /* ── 정보부족만 (대표 지시 2026-08-24, 3순위) ──
     대표자·소재지·대표번호 중 하나라도 비면 부족이다. 명함의 「정보부족」과 같은 결
     (명함도 전화 또는 이메일이 없으면 부족으로 본다) — 어디부터 채울지 정할 수 있게 한다. */
  if(state.coOnlyIncomplete) list = list.filter(coLacks);
  return list;
}
/* 번호 없는 회사 수 — 폴더·태그·검색은 그대로 두고 센다(종료 개수와 같은 결). */
function coNoBizCount(){
  return coFilteredList(null).filter(o=>!String(o.bizno||'').trim()).length;
}
/* 종료 개수 — 폴더·태그·검색·다른 열 거르기는 그대로 두고 센다.
   ⚠ coColFilter 의 skipCol 과 달리 여기는 «뺄 자신»이 없다 — 마지막에 붙이는
     .filter(erp.left) 가 이미 종료만 남기므로, coOnlyClosed 가 켜져 있어 한 번 더
     걸러져도 «같은 조건을 두 번 거는 것»일 뿐 결과가 달라지지 않는다. */
function coClosedCount(){
  return coFilteredList(null).filter(o=>o.erp && o.erp.left).length;
}
/* ⚠ 여기에 «거른 결과 기억하기»를 넣었다가 되돌렸다 (2026-08-26).
   도구줄에 개수를 적으면서 coVisible() 이 한 번 그릴 때 두 번 불리게 됐는데,
   그것을 기억으로 아끼려 했다. 그런데
     · 도구줄은 이미 coClosedCount·coNoBizCount·coIncompleteCount 로 «세 번» 거른다.
       한 번 더 거르는 것은 새로운 종류의 짐이 아니다.
     · 2026-08-13 의 멈춤은 «표를 조립하는 것»(coListBuild, 53ms 중 51ms)이었고
       그것은 이미 _coListMemo 로 아끼고 있다. 거르기·정렬은 그 무게가 아니다.
     · 기억이 어긋나면 «찾아 쳤는데 목록이 그대로»인 조용한 버그가 된다.
       열쇠에 넣을 입력을 하나 빠뜨리면 그 순간 그렇게 된다.
   아끼는 값이 작고 틀렸을 때가 조용하다 — 그래서 안 넣는다. */
function coVisible(){
  return coSorted(coFilteredList(null));
}
/* ══════ 기업 상세 나눠 보기 — 화면 ══════
   자르는 셈은 명함 목록과 **한 벌**을 쓴다(pageSlice 등, 「목록 나눠 보기 — 순수 로직」).
   두 벌로 두면 한쪽만 고쳤을 때 조용히 어긋난다. */
const CO_PAGE_DEFAULT = 200;   /* 회사 한 줄은 칸이 많아 명함(100)보다 조금 적게 */
const coPageSizeOk = v => pageSizeOk(v, CO_PAGE_DEFAULT);
/* 지금 쪽 — 그리기·전체 고르기가 갈라지지 않게 한 곳에서만 계산한다.
   자르면서 쪽 번호가 범위 안으로 당겨졌으면 그것을 state 에 되꽂는다(안 그러면
   「다음 ▶」이 이미 없는 쪽을 가리킨 채 남는다). */
function coPage(){
  const info = pageSlice(coVisible(), state.coPage, coPageSizeOk(state.coPageSize));
  state.coPage = info.page;
  return info;
}
function coSetPageSize(v){
  const n = coPageSizeOk(v);
  /* 「전체」는 남겨 둔다 — 4,138곳을 한꺼번에 골라 폴더로 옮겨야 할 때가 있다.
     다만 왜 멈추는지는 눌렀을 때 한 번 알려 준다(대표 결정 2026-08-15). */
  if(n >= 999999 && coVisible().length > 1000 &&
     !confirm(coVisible().length.toLocaleString()+'곳을 한 화면에 모두 펼칩니다.\n\n'
       + '그리는 데 1초쯤 멈추고, 네모를 누를 때마다 다시 멈춥니다.\n계속할까요?')) return;
  state.coPageSize = n; state.coPage = 0;
  try{ localStorage.setItem('pucards_co_pagesize', String(n)); }catch(_){}
  closePcDetail(); renderCoAny();
}
function coGoPage(p){ state.coPage = p; closePcDetail(); renderCoAny(); }
/* 몇 개씩 볼지 고르는 칸 — 명함 표의 #pcPageSize 와 같은 모양·같은 자리(목록 오른쪽 위) */
function coSizeSelHtml(size){
  const cur = coPageSizeOk(size);
  const opt = (v, label) => `<option value="${v}" ${cur===v?'selected':''}>${label}</option>`;
  return `<select class="copgsize" onchange="coSetPageSize(this.value)"
      title="한 쪽에 보일 회사 수 — 적을수록 빨라집니다">
    ${opt(50,'50개')}${opt(100,'100개')}${opt(200,'200개')}${opt(300,'300개')}${opt(500,'500개')}${opt(999999,'전체')}
  </select>`;
}
/* 쪽 옮기기 — 명함 표의 #pcPager 와 같은 글귀("1–200 / 4,138곳  (1/21쪽)") */
function coPagerHtml(info){ return pagerHtml(info, '곳', 'coGoPage');
}

/* 열 머리를 눌러 정렬한다 — 사업자 표와 같은 손놀림.
   ⚠ 숫자 칸(명함·등록증)은 글자로 견주면 10 이 9 보다 앞선다. 칸마다 무엇으로
     견줄지 따로 정한다. 빈 값은 늘 뒤로 보낸다 — 없는 것이 위로 올라오면
     정작 봐야 할 것이 아래로 밀린다. */
const CO_SORT = {
  name:  o => String(o.name||''),
  type:  o => String((o.erp && o.erp.type) || ''),
  bizno: o => String(o.bizno||''),
  cards: o => o.cards.length,
  docs:  o => o.docs||0,
  mgr:   o => String((o.erp && o.erp.main) || '')
};
function coSorted(list){
  const s = state.coSort || {};
  const get = CO_SORT[s.key]; if(!get) return list;
  const dir = s.dir==='desc' ? -1 : 1;
  return list.slice().sort((a,b)=>{
    const x=get(a), y=get(b);
    if(typeof x==='number') return (x-y)*dir;
    /* 빈 값은 방향과 상관없이 뒤로 */
    if(!x && y) return 1;
    if(x && !y) return -1;
    return String(x).localeCompare(String(y),'ko')*dir;
  });
}
function coSortBy(key){
  const s = state.coSort || {};
  state.coSort = (s.key===key)
    ? { key:key, dir: s.dir==='asc' ? 'desc' : 'asc' }
    : { key:key, dir: (key==='cards'||key==='docs') ? 'desc' : 'asc' };  /* 숫자는 많은 것부터가 쓸모 있다 */
  state.coPage=0;                                   /* 차례가 바뀌었으니 첫 쪽부터 다시 본다 */
  closePcDetail(); renderCoPage();
}
const coArrow = k => (state.coSort && state.coSort.key===k) ? (state.coSort.dir==='desc'?' ▾':' ▴') : '';

/* 열 깔때기 — 유형·담당처럼 값 가짓수가 적은 칸만 둔다. 상호·사업자번호는 회사마다
   달라 골라서 거르는 게 뜻이 없다(대표 지시 2026-08-14).
   ⚠ #folderMenu 를 재사용한다 — 명함 폴더 메뉴와 같은 팝업이고, 한 번에 하나만
     열리므로 새 DOM 을 안 만들어도 된다. */
function openCoColFilter(ev, field){
  const get = CO_SORT[field]; if(!get) return;
  /* 이 칸의 깔때기만 빼고 거른 목록으로 값을 센다 — 안 그러면 이미 고른 값만
     남아 있어 다른 값으로 못 바꾼다. */
  const rows = coFilteredList(field);
  const counts = {};
  rows.forEach(o=>{ const v=get(o); if(v) counts[v]=(counts[v]||0)+1; });
  const cur = (state.coColFilter||{})[field] || '';
  const m = $('folderMenu');
  let html = `<div class="fmi ${!cur?'on':''}" onclick="closeFolderMenu();coApplyColFilter('${field}','')">전체 <span class="fmn">${rows.length}</span></div>`;
  Object.keys(counts).sort((a,b)=>a.localeCompare(b,'ko')).forEach(v=>{
    const safe = v.replace(/'/g,"\\'");
    html += `<div class="fmi ${cur===v?'on':''}" onclick="closeFolderMenu();coApplyColFilter('${field}','${safe}')">${esc(v)} <span class="fmn">${counts[v]}</span></div>`;
  });
  m.innerHTML = html;
  m.style.display='block';
  const x=Math.min(ev.clientX, window.innerWidth-170), y=Math.min(ev.clientY, window.innerHeight-260);
  m.style.left=x+'px'; m.style.top=y+'px';
  setTimeout(()=>document.addEventListener('click', closeFolderMenu, {once:true}), 0);
}
function coApplyColFilter(field, value){
  state.coColFilter = state.coColFilter || {};
  if(value) state.coColFilter[field]=value; else delete state.coColFilter[field];
  state.coPage=0;
  closePcDetail(); renderCoPage();
}

function renderCoPage(){
  const el=$('pcCo'); if(!el) return;
  if(typeof _coWatch!=='undefined' && _coWatch) _coWatch.renders++;
  const all = coList();
  const tags = coTagList(all);
  /* ⚠ 거르는 차례는 coVisible() 한 곳에만 둔다 — 예전엔 여기서 따로 거르고 있어
     정렬(coSorted)을 coVisible 안에만 붙였더니 이 화면에는 안 먹혔다.
     두 곳에서 같은 일을 하면 한쪽만 고쳤을 때 이렇게 어긋난다. */
  /* ⚠ 여기서 coVisible() 을 또 부르지 않는다 — coPage() 안에서 부르고 그 결과를 잘라 준다.
     자르는 곳이 둘이면 「전체 고르기」가 화면에 없는 회사까지 고르는 일이 다시 생긴다. */
  const info = coPage();
  /* 사업 탭 — 서식을 보낼수록 저절로 늘어난다. 손으로 만들 필요가 없다.
     ⚠ 맨 앞에 있던 「🏢 거래처만」 단추와 그 뒤 세로 가름줄은 대표 지시 2026-08-17 로
       없앴다 — 회사 갈래는 대표가 만든 폴더(옆줄)로만 나눈다. */
  const tabs = `<div class="cotabs">
      <button class="${state.coTag?'':'on'}" onclick="pickCoTag('')">전체 <i>${all.length}</i></button>
      ${tags.map(x=>`<button class="${state.coTag===x.t?'on':''}" onclick="pickCoTag('${esc(x.t.replace(/'/g,"\\'"))}')"
        title="${esc(x.t)}">${esc(x.t)} <i>${x.n}</i></button>`).join('')}
      ${tags.length?'':'<span class="cohint">사진첩에서 서식·신청서를 기업 상세로 보내면 그 서류 이름으로 갈래가 생깁니다</span>'}
    </div>`;
  /* 머리줄은 지웠다 — 옆줄에 이미 「🏢 기업정보」가 있고, 무엇을 모았는지는 한 번 읽으면
     그만인 설명이라 화면 맨 위 한 줄을 늘 차지할 값어치가 없었다(대표 지시 2026-08-13). */
  /* 찾기 칸은 화면 맨 위 것 하나만 쓴다 — 같은 일을 하는 칸이 둘이면 어느 쪽에
     쳐야 하는지 헷갈리고, 한쪽에 남은 글자가 다른 쪽 결과를 조용히 거른다. */
  syncPcSearchFor('co');
  el.innerHTML = `<div class="setwrap">${coListHtml(info)}</div>`;
}
/* 명함첩 목록과 같은 결로 — 한 줄에 한 회사, 왼쪽에 네모와 번호.
   회사가 수백 곳이면 「몇 번째까지 봤더라」를 번호로 짚고, 골라서 한꺼번에 다루려면
   네모가 있어야 한다(대표 지시 2026-08-13). */
function coListHtml(info){
  const list = info.rows;
  if(!info.total) return `<div class="cpnone" style="padding:20px 2px">회사를 찾지 못했습니다</div>`;
  const allOn = list.length>0 && list.every(o=>state.coSel[o.key]);
  const nSel = Object.keys(state.coSel).length;
  /* 이 쪽을 다 골랐는데 찾은 결과가 더 있으면 막대 안에서 알려 준다 — 명함 표와 같은 규칙.
     이 안내가 없으면 200곳만 옮겨진 것을 모른 채 「다 옮겼다」고 여기게 된다. */
  const moreBtn = (allOn && info.total > list.length && nSel < info.total)
    ? `<button class="comore" onclick="coSelAllMatching()"
         title="지금 조건에 맞는 회사를 모두 고릅니다">→ ${info.total.toLocaleString()}곳 모두</button>` : '';
  /* 고른 것이 있을 때만 뜨고, 0곳이 되면 통째로 사라진다(nSel 하나로 갈린다).
     ⚠ 감싸개(.cosellift)가 화면 «아래»에 붙여 따라오게 한다 — 171번째 줄까지 내려가
       골랐는데 도구줄이 화면 밖 저 위에 있으면, 무엇을 할 수 있는지 아무 데도 안 보인다
       (대표 화면 2026-08-17). 감싸개는 이 PC 표에만 씌운다 — 폰 목록도 .coselbar 를
       쓰지만 폰에는 제 도구줄이 따로 있다(renderCoMobileList). */
  const selbar = nSel ? `<div class="cosellift"><div class="coselbar">
      <b>${nSel}곳 선택</b>${moreBtn}
      <button onclick="coMoveToFolder()">📁 폴더로 옮기기</button>
      <button onclick="coAssignTag()">🏷 서류 탭에 담기</button>
      ${state.coFolder ? '<button onclick="coAssignFTab()" title="이 폴더 안의 탭에 담습니다">＃ 탭에 담기</button>' : ''}
      ${/* 고른 회사에 붙은 담당자 주소록 (대표 지시 2026-08-24 「주소록 내보내기 만들어라」).
           수신거부·이메일 없음·잠긴 폴더는 mailTargets 가 걸러 준다.
           ⚠ PC 에만 둔다 — 폰에서 CSV 를 내려받아 다음 주소록에 넣을 일이 없다. */''}
      <button onclick="coMailCsv()"
        title="고른 회사의 담당자 주소록을 CSV 로 내려받습니다 — 수신거부는 자동으로 빠집니다">📇 주소록 내보내기</button>
      <button onclick="state.coSel={};renderCoAny()">선택 해제</button>
      <button class="coclear" onclick="coClearOrg()"
        title="고른 회사에 붙여 둔 폴더·탭을 뗍니다 — 명함은 지워지지 않습니다">🧹 폴더·탭 비우기</button>
      ${/* ⚠ 「선택 해제」 바로 옆에 두지 않는다 — 명함 쪽에서 그 자리에 있던 삭제를
           잘못 눌러 ⋯ 안으로 옮긴 적이 있다(12846). 줄의 «맨 끝»에 따로 세운다.
           ⚠ 회사가 아니라 «명함·등록증»이 지워진다는 것을 딱지에 적는다. */''}
      <button class="codel" onclick="coDelSel()"
        title="고른 회사의 명함·사업자등록증을 휴지통으로 보냅니다 — 30일 안에 되살릴 수 있습니다">🗑 삭제 (휴지통)</button>
      <span class="codraghint">끌어서 왼쪽 폴더에 놓아도 옮겨집니다</span>
    </div></div>` : '';
  /* ⚠ 대표 화면 2026-08-24 「화면 중간에 이상하다 깔끔하게 사업자와 똑같은 형태로」로
     여기 있던 별도 줄(모두 N곳 · 지금 1–N번째 · 쪽 크기 · 표 위 쪽 옮기기)을 없앴다.
     쪽 크기 고르기는 renderCoFTabsHtml() 안으로 옮겨 탭 줄과 «한 줄»이 되었고
     (사업자의 #pcTools 와 같은 자리), 표 위 쪽 옮기기는 사업자에 없는 줄이라 지웠다.
     표 «아래» 쪽 옮기기(coPagerHtml)는 그대로 남아 있다 — 다음 쪽으로 가는 유일한 길이다. */
  /* ⚠ 마지막에 **남는 폭을 먹는 빈 칸**을 둔다. 없으면 상호 칸이 남은 폭을 다 먹어
     사업자번호·가진 것·담당이 화면 오른쪽 끝까지 밀려난다 — 눈이 좌우로 멀리 오간다
     (대표 화면 2026-08-13). 유형(자문·급여…)도 상호 옆에 붙이지 않고 제 칸을 준다. */
  /* ⚠ 도구줄(selbar)은 표 «뒤»에 온다 — 흐름 안의 마지막 자리라야 sticky 가 맨 아래까지
       내려갔을 때 쪽넘김 아래로 내려앉아 마지막 줄도 쪽넘김도 덮지 않는다. */
  return `${coOrphanBarHtml()}<table class="cotbl">
    <colgroup><col style="width:34px"><col style="width:46px"><col style="width:300px">
      <col style="width:76px"><col style="width:132px"><col style="width:170px">
      <col style="width:110px"><col></colgroup>
    <thead><tr>
      <th><input type="checkbox" ${allOn?'checked':''} onchange="coSelAll(this.checked)" title="이 쪽에 보이는 ${list.length}곳을 모두 고르거나 풉니다"></th>
      <th class="num">#</th>
      <th class="cosort" onclick="coSortBy('name')" title="상호로 정렬">상호${coArrow('name')}</th>
      <th class="cosort" onclick="coSortBy('type')" title="자문·급여 유형으로 정렬">유형${coArrow('type')}<span class="cofunnel ${state.coColFilter.type?'on':''}" onclick="event.stopPropagation();openCoColFilter(event,'type')" title="유형으로 거르기">▽</span></th>
      <th class="cosort" onclick="coSortBy('bizno')" title="사업자번호로 정렬">사업자번호${coArrow('bizno')}</th>
      <th class="cosort" onclick="coSortBy('docs')" title="가진 등록증 수로 정렬 — 빠진 곳을 찾을 때">가진 것${coArrow('docs')}</th>
      <th class="cosort" onclick="coSortBy('mgr')" title="담당 노무사로 정렬">담당${coArrow('mgr')}<span class="cofunnel ${state.coColFilter.mgr?'on':''}" onclick="event.stopPropagation();openCoColFilter(event,'mgr')" title="담당으로 거르기">▽</span></th>
      <th></th>
    </tr></thead><tbody>${list.map((o,i)=>{
    const t = o.erp && o.erp.type;
    /* ⚠ 빠진 것을 붉게 알리는 건 **우리가 일하는 회사**에만 뜻이 있다.
       명함 한 장만 있는 회사까지 붉게 칠하니 4,140곳이 온통 붉어져, 정작 봐야 할
       거래처의 빠진 서류가 묻혔다(대표 화면 2026-08-13). 푸른이알피 거래처이거나
       사업 딱지가 붙은 회사만 짚는다. */
    const care = coCares(o);
    const miss = s => care ? `<i class="miss">${s}</i>` : '';
    /* ⚠ 열쇠에 작은따옴표가 들어 있으면 줄을 눌러도 «아무 일도 안 일어난다».
       사업자번호가 없는 회사의 열쇠는 'n'+회사이름이고(coKeyOf), 이름 다듬기(_norm)는
       공백·(주)·주식회사·㈜·[.#$/[]] 만 지울 뿐 «작은따옴표는 안 지운다».
       esc() 가 ' 를 &#39; 로 바꿔 주지만, 브라우저는 큰따옴표 onclick 속성을 읽을 때
       그 엔티티를 먼저 ' 로 «되돌린 뒤» 자바스크립트로 실행한다 — 인자가 중간에 끊겨
       구문 오류가 나고 조용히 실패한다.
       ★ 반드시 «먼저» 역슬래시를 붙이고 «그 다음» esc 한다. 순서를 뒤집으면
         이미 &#39; 로 바뀌어 있어 아무것도 안 걸리는 죽은 코드가 된다.
       같은 방식이 이 파일 여러 곳에 이미 있다 — 폴더 이름(7792행)·딱지(10079행)·담당 노무사(8612행).
       ⚠ 폰 목록(renderCoMobileList)을 고쳤다는 327e3a0 은 «아직 main 에 없다»(다른 갈래).
         그쪽이 들어올 때 같은 자리를 또 손대게 되므로, 여기 규칙을 그대로 따르면 된다. */
    const kJs = esc(String(o.key).replace(/'/g,"\\'"));
    /* 체크한 줄만 끌 수 있다 — 끌면 «고른 것 전부»가 함께 간다(onCoRowDragStart).
       체크 안 한 줄에는 draggable 이 아예 안 붙어 끌어도 아무 일이 안 일어난다.
       그래야 14곳을 골라 둔 채 다른 줄을 무심코 끌어도 골라 둔 것이 안 흐트러진다. */
    const coOn = !!state.coSel[o.key];
    return `<tr class="corow ${coOn?'pkon':''}" data-selid="${kJs}" draggable="${coOn?'true':'false'}"
      ondragstart="onCoRowDragStart(event,'${kJs}')" ondragend="onCoRowDragEnd(event)"
      onclick="pickCo('${kJs}')">
      <td class="selcell" onclick="event.stopPropagation()"
        onmousedown="dragSelStart(event,'co','${kJs}')"
        title="끌어서 여러 곳을 한 번에 고를 수 있습니다"><input type="checkbox" ${coOn?'checked':''}
        onchange="coToggle('${kJs}')"></td>
      <td class="num">${info.from + i}</td>
      <td class="conm"><span class="nm">${esc(o.name)}</span>
        ${o.erp && o.erp.left ? `<span class="mgq" title="업체관리에서 종료·해지·폐업으로 표시된 거래처 (계약해지)">🚪</span>` : ''}
        ${(function(){ const n = coConflictN(o); return n
          ? `<span class="mgw" title="사진첩에서 읽은 값이 지금 값과 다릅니다 — 눌러서 확인해 주세요 (${n}개 칸)">⚠</span>` : ''; })()}
        ${coTagsOf(o).map(x=>`<span class="tg">${esc(x)}</span>`).join('')}</td>
      <td>${t?`<span class="ty">${esc(t)}</span>`:''}</td>
      <td class="bz">${o.bizno?esc(o.bizno):miss('없음')}</td>
      <td class="bits">
        ${o.cards.length?`<i>명함 ${o.cards.length}</i>`:''}
        ${o.docs?`<i>등록증 ${o.docs}</i>`:miss('등록증 없음')}
        ${/* 무엇이 빠졌는지 «줄에서» 알려 준다 — 개수만 세면 회사를 하나씩 열어 봐야 한다
             (대표 지시 2026-08-24, 3순위). */''}
        ${(function(){ const m = coMissing(o); return m.length
          ? miss(m.join('·') + ' 없음') : ''; })()}
      </td>
      <td class="mgr">${o.erp&&o.erp.main?esc(o.erp.main):''}</td>
      <td></td>
    </tr>`;
  }).join('')}</tbody></table>${coPagerHtml(info)}${selbar}`;
}
/* 이 회사 값이 어느 서류에서 왔는지 — 사진첩에서 보낼 때 남긴 기록.
   「이 숫자 어디서 봤더라」에 답하려면 출처가 보여야 한다.
   ⚠ 아직 눌러서 그 사진을 바로 열지는 못한다. 사진첩에 「사진 하나를 주소로 여는 길」이
     없어서다 — 그건 사진첩 쪽 일이라 따로 만든다. 지금은 어느 서류·언제·누가까지 보인다. */
/* ══════ 값이 어긋난 칸 (대표 지시 2026-08-24, 1순위) ══════
   사진첩이 읽은 값이 기업 상세의 기존 값과 다를 때, 값은 «안 덮고» 여기 남겨 둔다
   (js/pu-doc-file.js 의 sendToCoInfo). 예전에는 조용히 버려져서 어긋난 값이 있다는
   사실 자체를 아무도 몰랐다 — 계약서·신고서에 틀린 대표자·소재지가 그대로 나갔다.
   ⚠ 사람이 판단할 것이라 «자동으로 고치지 않는다». 두 값을 나란히 보여 주고
     원본 서류로 가는 길만 열어 둔다. */
function coConflictN(o){
  return Object.keys((o && o.extra && o.extra.conflicts) || {}).length;
}
function coConflictHtml(o){
  const cf = (o.extra && o.extra.conflicts) || {};
  const keys = Object.keys(cf);
  if(!keys.length) return '';
  const label = k => (CO_FIELDS.find(f=>f[0]===k) || [k,k])[1];
  return `<div class="pcsec" style="margin:16px 4px 8px">⚠ 값이 다른 칸 ${keys.length}개</div>
    <p class="setnote" style="margin:0 4px 8px">사진첩에서 읽은 값이 지금 값과 다릅니다.
      <b>고치지 않고 그대로 두었습니다</b> — 어느 쪽이 맞는지 보고 정해 주세요.</p>
    ${keys.map(k=>{
      const c = cf[k] || {};
      return `<div class="coclash">
        <div class="ck">${esc(label(k))}</div>
        <div class="cv"><span class="cnow">지금 ${esc(c.had||'')}</span>
          <span class="cnew">읽은 값 ${esc(c.got||'')}</span></div>
        <div class="cm">${esc(c.doc||'서식')}${c.by?` · ${esc(c.by)}`:''}${c.at?` · ${fmtDate(c.at)}`:''}
          ${c.photoId?`<em style="font-style:normal;color:#1d4fc4;cursor:pointer;margin-left:6px"
            onclick="openCoDoc('${esc(c.photoYear||'')}','${esc(c.photoId)}','${esc(c.photoOwner||'')}')"
            title="이 값이 나온 서류를 사진첩에서 엽니다">📷 원본 보기</em>`:''}</div>
      </div>`;
    }).join('')}`;
}
function coDocsHtml(o){
  const docs = Object.values((o.extra && o.extra.docs) || {})
    .sort((a,b)=>(b.at||0)-(a.at||0));
  if(!docs.length) return '';
  return `<div class="pcsec" style="margin:16px 4px 8px">읽어 온 서류 ${docs.length}건</div>
    ${docs.map(d=>`<div class="cof codoc" onclick="openCoDoc('${esc(d.year||'')}','${esc(d.id||'')}','${esc(d.owner||'')}')"
        title="사진첩에서 이 서류를 엽니다">
      <span>${esc(d.name||'서식')}</span>
      <b>${d.at?fmtDate(d.at):''}${d.by?` · ${esc(d.by)}`:''}
        <i style="font-style:normal;color:#9aa6bf;font-size:11.5px"> · 사진첩 ${esc(d.year||'')}</i>
        <em style="font-style:normal;color:#1d4fc4;font-size:11.5px;margin-left:6px">📷 원본 보기</em></b>
    </div>`).join('')}`;
}
/* 사진첩에서 그 서류를 연다.
   ⚠ 새 창으로 연다 — 지금 창을 갈아타면 보던 회사와 고르던 것이 다 날아간다.
     대표는 서류를 확인하고 다시 이 회사로 돌아오려는 것이다. */
function openCoDoc(year, id, owner){
  if(!id) return toast('이 기록에는 사진 번호가 없습니다 — 예전 방식으로 보낸 서류입니다', 7000);
  const q = 'photo=' + encodeURIComponent(id)
          + (year ? '&year=' + encodeURIComponent(year) : '')
          + (owner ? '&owner=' + encodeURIComponent(owner) : '');
  window.open('pu-photos.html?' + q, '_blank');
}
/* ══════ 어느 회사에도 안 붙은 기업정보 = 고아 (대표 지시 2026-08-24, 2순위) ══════
   사진첩은 언제나 coInfo/{사업자번호} 로 보낸다. 그런데 기업 상세의 회사 목록은
   «명함·사업자등록증에서» 조립된다 — 그 번호를 가진 회사가 여기 없으면 보낸 값은
   어느 줄에도 안 붙고 아무 화면에도 안 보인다. 읽어 놓고 잃어버리는 것이다.

   ⚠ 회사의 «이름열쇠»(n+이름) 기록은 고아가 아니다 — coEffectiveExtra 가 그 회사에
     합쳐 준다. 그것까지 고아로 세면 멀쩡한 것을 문제라고 알리게 된다.
   ⚠ 폴더·탭만 든 껍데기는 안 센다. 회사가 사라져 남은 배정 자국일 뿐 잃은 정보가 없다.
   ⚠ 자동으로 이어 붙이지 않는다. 이름이 같다고 기계가 붙이면 엉뚱한 회사에 남의
     대표자·소재지가 들어가고 되돌리기 어렵다 — 이름이 같은 회사를 «짚어만» 준다. */
function coOrphanList(){
  const cos = coList();
  const own = {};
  cos.forEach(function(o){
    own[o.key] = 1;
    own['n' + _norm(o.name || '')] = 1;      /* 그 회사가 주워 갈 옛 이름열쇠 */
  });
  const byName = {};
  cos.forEach(function(o){ const n=_norm(o.name||''); if(n && !byName[n]) byName[n]=o.name; });
  const out = [];
  Object.keys(_coInfo || {}).forEach(function(k){
    if(own[k]) return;
    const rec = _coInfo[k] || {};
    /* 무엇이 들었나 — 화면이 이름표를 아는 칸만 센다(모르는 칸은 보여줄 수도 없다) */
    const fields = CO_FIELDS.map(f=>f[0])
      .filter(f => rec[f] != null && String(rec[f]).trim() !== '');
    const docs = Object.keys(rec.docs || {}).length;
    if(!fields.length && !docs) return;       /* 폴더·탭만 든 껍데기 */
    const nm = String(rec.company || '').trim();
    out.push({ key:k, name:nm, fields:fields, docs:docs,
               sameName: (nm && byName[_norm(nm)]) || '',
               at: rec.at || 0, by: rec.by || '' });
  });
  return out.sort((a,b)=>(b.at||0)-(a.at||0));
}
/* 회사 목록 위 알림 띠 — 0건이면 아무 것도 안 띄운다(늘 뜨는 띠는 안 읽힌다). */

/* 탭 이름 다듬기 — js/pu-doc-file.js 의 sendToCoInfo 와 같은 규칙이다.
   ⚠ 두 곳이 같은 규칙을 따로 두고 있다. 한쪽만 고치면 사진첩에서 자동으로 붙는 탭과
     여기서 손으로 만드는 탭의 이름 규칙이 어긋난다 — 다음에 규칙을 바꿀 때 두 곳을 같이 본다. */
function coCleanTagName(s){
  return String(s||'').trim().replace(/[.#$/[\]]/g,' ').replace(/\s+/g,' ').trim();

/* ── 골라 둔 회사를 폴더로 옮기거나 탭에 담기 ──

/* ══════ 고른 회사의 폴더·탭 비우기 — 순수 로직 (테스트 대상) ══════
   대표 지시 2026-08-16: 기업 상세에 「삭제」가 필요하다 → 물어보니 «명함을 지우는 것이
   아니라» 붙여 둔 폴더·탭을 떼는 것이었다. 회사는 따로 저장된 기록이 아니라 명함과
   등록증을 모아 만든 화면이라, 여기서 지울 수 있는 것은 «붙여 둔 것»뿐이다.
   ⚠ 명함·사업자등록증은 절대 건드리지 않는다. 그것을 지우는 길은 명함 목록에만 둔다. */
/* ══════ 기업 상세 선택 삭제 — 순수 로직 (테스트 대상) ══════
   대표 지시 2026-08-26: "데이터가 삭제가 필요한데 이부분은 어디에도 반영이 되지 않았다
                        선택시 삭제 어떻게 해야하는지 확인 해달라."

   ★ 회사는 «저장된 기록이 아니다» — 명함과 등록증을 사업자번호로 모아 그 자리에서
     만드는 화면이다(coListBuild). 그래서 「이 회사를 지운다」는
     «그 회사에 붙은 명함 N장 + 등록증 M장을 지운다» 는 뜻이다. 회사만 따로 지울
     대상이 없다. 확인 창에 그 장수를 반드시 적는다 — 안 적으면 회사 3곳을 지운다고
     생각하고 명함 70장을 지운다.

   ★ 폴더·탭·서식 정보(coInfo)는 «남긴다» (대표 결정 2026-08-26)
     휴지통은 명함만 되살린다. coInfo 를 함께 지우면 되살려도 폴더·탭·서식이 안 돌아온다.
     남겨 두면 열쇠(사업자번호)로 저절로 다시 붙는다 — 되살리는 순간 그대로 돌아온다.
     되살릴 때까지 「어느 회사에도 안 붙은 기업정보」 알림에 잡히는 것은 그 값을 치른 것이다.
   ⚠ 그러므로 coClearOrg(폴더·탭 비우기)와 «다른 일»이다. 둘을 합치지 않는다. */

/* 무엇이 몇 장 지워지는가 — 고른 회사들에서 명함·등록증 id 를 모은다 */
function coDelPlan(rows){
  const cards = [], bizs = [];
  (rows||[]).forEach(function(o){
    if(!o) return;
    (o.cards||[]).forEach(function(it){ if(it && it.id) cards.push(it.id); });
    (o.bizs ||[]).forEach(function(it){ if(it && it.id) bizs.push(it.id); });
  });
  return { n:(rows||[]).length, cards:cards, bizs:bizs,
           ids: cards.concat(bizs), total: cards.length + bizs.length };
}
/* 확인 창 글귀 — 회사 수가 아니라 «장수»를 앞세운다 */
function coDelAskText(plan){
  const p = plan || {};
  const bits = [];
  if(p.cards && p.cards.length) bits.push('명함 ' + p.cards.length.toLocaleString() + '장');
  if(p.bizs  && p.bizs.length)  bits.push('사업자등록증 ' + p.bizs.length.toLocaleString() + '장');
  return (p.n||0).toLocaleString() + '곳을 휴지통으로 보냅니다.\n\n'
    + '지워지는 것: ' + (bits.length ? bits.join(' · ') : '없음') + '\n'
    + '전 직원 명함첩에서 사라집니다. 30일 안에는 휴지통에서 되살릴 수 있습니다.\n\n'
    + '폴더·탭·서식 정보는 지우지 않습니다 — 되살리면 그대로 돌아옵니다.';
}

/* 고른 회사를 휴지통으로 — 명함 삭제와 «같은 길»(Store.del)을 탄다.
   ⚠ 새 삭제 길을 만들지 않는다. 만들면 휴지통·검색목록(idx·bykey)·개인 명함 갈림
     같은 것을 한 벌 더 챙겨야 하고, 한쪽만 고쳐지는 날이 온다.
   ⚠ 한꺼번에 다 던지지 않고 나눠 보낸다 — 2026-08 오류 폭주가 「한 건씩 수천 번」
     이었다. 명함 쪽 delSel 은 그냥 훑지만, 여기는 회사 한 곳에 명함이 여러 장이라
     장수가 훨씬 크다(3곳 = 7장이 아니라 30곳 = 수백 장이 된다). */
const CO_DEL_CHUNK = 50;
async function coDelSel(){
  const keys = Object.keys(state.coSel||{});
  if(!keys.length) return toast('회사를 먼저 고르세요');
  const bySel = coList().filter(o=>state.coSel[o.key]);
  const plan = coDelPlan(bySel);
  if(!plan.total) return toast('고른 회사에 지울 명함·등록증이 없습니다');
  /* 명함 선택 삭제와 «같은 기준»(DEL_TYPE_MIN=100장). 대표 결정 2026-08-26.
     ⚠ 세는 것은 회사 수가 아니라 장수다 — 20곳이 300장일 수 있다. */
  if(plan.total > DEL_TYPE_MIN){
    const ans = prompt(coDelAskText(plan) + '\n\n정말 지우려면 아래에 삭제 라고 입력하세요');
    if(ans===null) return;
    if(String(ans).trim()!=='삭제') return toast('입력이 달라 지우지 않았습니다');
  } else {
    if(!confirm(coDelAskText(plan))) return;
  }
  let done = 0;
  for(let i=0;i<plan.ids.length;i+=CO_DEL_CHUNK){
    const part = plan.ids.slice(i, i+CO_DEL_CHUNK);
    await Promise.all(part.map(id=>Store.del(id).catch(err=>{
      console.warn('[기업 상세 삭제]', id, err);
    })));
    done += part.length;
    if(plan.ids.length > CO_DEL_CHUNK) toast(`지우는 중… ${done.toLocaleString()}/${plan.ids.length.toLocaleString()}장`);
  }
  state.coSel = {};
  coListBust(); closePcDetail(); renderCoAny();
  toast(`${plan.n.toLocaleString()}곳 · ${plan.total.toLocaleString()}장을 휴지통으로 옮겼습니다`
    + ` — 되살리려면 환경설정 → 정리 → 휴지통`, 7000);
}

const CO_CLEAR_CHUNK = 400;
const CO_CLEAR_TYPE_MIN = 20;      /* 이보다 많으면 「비우기」를 손으로 치게 한다 */
/* 실제로 비워질 것이 얼마나 되는가 — 아무것도 안 붙은 회사는 세지 않는다.
   「100곳 비웁니다」라고 해 놓고 실제로 3곳만 바뀌면 사람이 무엇을 한 건지 모른다. */
function coClearStats(list){
  let n = 0, folders = 0, tags = 0;
  (list || []).forEach(o => {
    const t = Math.max(0, Number((o && o.tagCount) || 0));
    const f = !!(o && o.folder);
    if (f) folders++;
    if (t) tags += t;
    if (f || t) n++;
  });
  return { n: n, folders: folders, tags: tags, total: (list || []).length };
}
/* 보낼 통을 만든다 — 한 곳씩 보내면 4,138번이 나간다(2026-08-16 폭주의 교훈).
   ⚠ 옛 이름 열쇠도 함께 비운다. coEffectiveExtra 가 옛 열쇠의 값을 끌어와 합쳐
     보여주므로, 새 열쇠만 비우면 «비웠는데 그대로 보이는» 일이 생긴다
     (coMoveSelTo 가 같은 이유로 같은 일을 한다). */
function coClearPlan(list, chunk){
  const arr = (list || []).filter(o => o && o.key);
  const size = Math.max(1, Math.floor(Number(chunk)) || 1);
  const out = [];
  for (let i = 0; i < arr.length; i += size){
    const upd = {};
    arr.slice(i, i + size).forEach(o => {
      upd['coInfo/' + o.key + '/folder'] = null;
      upd['coInfo/' + o.key + '/tags'] = null;
      upd['coInfo/' + o.key + '/ftabs'] = null;
      if (o.nameKey && o.nameKey !== o.key){
        upd['coInfo/' + o.nameKey + '/folder'] = null;
        upd['coInfo/' + o.nameKey + '/tags'] = null;
        upd['coInfo/' + o.nameKey + '/ftabs'] = null;
      }
    });
    if (Object.keys(upd).length) out.push(upd);
  }
  return out;
}
/* ══════ 고른 회사의 폴더·탭 비우기 — 화면 ══════ */
async function coClearOrg(){
  const keys = Object.keys(state.coSel);
  if(!keys.length) return toast('회사를 먼저 선택하세요');
  const byKey = {}; coList().forEach(o=>{ byKey[o.key]=o; });
  const list = keys.map(k=>{
    const o = byKey[k];
    return { key:k, name:(o&&o.name)||'', nameKey: o ? 'n'+_norm(o.name||'') : null,
             folder:(o&&o.folder)||'', tagCount: o ? coTagsOf(o).length : 0 };
  });
  const s = coClearStats(list);
  if(!s.n) return toast('고른 회사에는 뗄 폴더·탭이 없습니다');
  const head = `회사 ${s.n.toLocaleString()}곳의 폴더·탭을 뗍니다.\n\n`
    + `· 폴더 ${s.folders.toLocaleString()}곳 · 탭 ${s.tags.toLocaleString()}개가 떨어집니다\n`
    + `· 명함과 사업자등록증은 지워지지 않습니다\n`
    + `· 되돌리려면 다시 지정해야 합니다\n\n`;
  if(s.n > CO_CLEAR_TYPE_MIN){
    const ans = prompt(head + '비우려면 아래에 비우기 라고 입력하세요');
    if(ans===null) return;
    if(String(ans).trim()!=='비우기') return toast('입력이 달라 비우지 않았습니다');
  } else if(!confirm(head + '계속할까요?')) return;
  const plan = coClearPlan(list, CO_CLEAR_CHUNK);
  try{
    for(const upd of plan) await Store.db.ref(DB_ROOT).update(upd);
  }catch(e){ return toast('비우기 실패: '+((e&&e.message)||'')); }
  state.coSel = {}; coListBust(); closePcDetail(); renderCoAny();
  toast(`🧹 ${s.n.toLocaleString()}곳의 폴더·탭을 뗐습니다 — 명함은 그대로입니다`, 6000);
}

async function coMoveSelTo(folderId){
  const keys = Object.keys(state.coSel);
  const byKey = {}; coList().forEach(o=>{ byKey[o.key]=o; });
  const upd = {};
  keys.forEach(k=>{
    upd['coInfo/'+k+'/folder'] = folderId || null;
    /* 회사 열쇠가 사업자번호로 바뀐 뒤에도 옛 이름 열쇠에 folder 값이 남아 있으면,
       coEffectiveExtra 가 그걸 다시 끌어와 "폴더 없음"으로 옮겨도 그대로 보인다
       (최종 전체 리뷰 2026-08-14). 사람이 누른 한 번의 조작 안에서 옛 열쇠도 같이
       비운다 — 조용한 배경 쓰기가 아니라 이 옮기기 자체가 하는 일이다.
       ⚠ 아주 드물게 이름이 완전히 같은 서로 다른 두 회사(하나는 사업자번호가 있고
       하나는 없는)가 있으면, 이 옛 열쇠 비우기가 그 "남"의 폴더까지 비울 수 있다 —
       coList()가 애초에 이 둘을 읽을 때도 한 줄로 합쳐 보여주는 것과 같은 한계다. */
    const o = byKey[k];
    const nameKey = o ? 'n'+_norm(o.name||'') : null;
    if(nameKey && nameKey!==k) upd['coInfo/'+nameKey+'/folder'] = null;
  });
  try{

/* 회사 상세 — 오른쪽 팝업(#pcDetail, 명함 상세와 같은 패널) 안에 넣을 내용만 만든다.
   목록 화면을 통째로 바꿔 그리던 예전 coDetailHtml 은 없앤다(대표 지시 2026-08-14,
   "화면 전환 대신 오른쪽 팝업으로"). */
/* ══════ 회사 값 하나 꺼내기 — «한 곳에만» 둔다 (대표 지시 2026-08-24, 3순위) ══════
   서식에서 읽은 값(extra)이 사업자등록증에서 온 값(o)보다 앞선다 — 나중에 읽은 것이
   더 최신이기 때문이다.
   ⚠ 상세 패널과 「정보부족」 판정이 «같은 함수»를 쓴다. 따로 만들면 화면에는 보이는데
     부족으로 세거나 그 반대가 되고, 그 어긋남은 아무도 눈치 못 챈다. */
function coVal(o, f){
  if(!o) return '';
  /* ⚠ «다듬은 뒤에» 고른다. 예전에는 다듬기 전 값으로 골라서, 서식에 공백만 든 칸이
     («'   '» 은 참이다) 등록증에서 온 멀쩡한 값을 가렸다 — 화면은 빈칸이 되고
     「정보부족」으로도 세어졌다(2026-08-24, 4순위를 만들다 드러났다). */
  const ex = String((o.extra && o.extra[f]) == null ? '' : o.extra[f]).trim();
  return ex || String(o[f] == null ? '' : o[f]).trim();
}
/* ══════ 이 값이 «어디서» 왔나 (대표 지시 2026-08-24, 4순위) ══════
   한 회사 값은 네 곳에서 온다 — 사업자등록증 · 명함 · 푸른이알피 · 사진첩 서식.
   값만 보여 주면 「이 매출액 어디서 봤더라」에 답할 수가 없어, 사진첩에 그 서류가
   그대로 있는데도 다시 찾아 헤매게 된다. 어느 쪽이 더 믿을 만한지도 못 가린다.
   ⚠ coVal 이 «고른 쪽»의 출처를 말해야 한다. 보이는 값은 서식 것인데 출처는 등록증이라
     하면, 엉뚱한 서류를 뒤지게 된다 — 그래서 고르는 차례를 여기서 그대로 되풀이한다.
   ⚠ 모르면 null 을 준다. 지어내지 않는다. */
function coSrcOf(o, f){
  const ex = (o && o.extra) || {};
  if(String(ex[f] == null ? '' : ex[f]).trim()){
    /* 서식에서 온 값 — src 는 docs 의 열쇠 하나만 가리킨다(요금 때문에 통째로 안 베낀다) */
    const d = (ex.src && ex.docs && ex.docs[ex.src[f]]) || null;
    if(d) return { label: d.name || '서식', at: d.at || 0, by: d.by || '',
                   photoId: String(d.id || ''), photoYear: String(d.year || ''),
                   photoOwner: String(d.owner || '') };
    /* 4순위 이전에 들어온 값에는 src 가 없다. 「서식에서 왔다」까지는 참이라 그건 말한다 —
       그것마저 숨기면 등록증에서 온 값과 구별이 안 된다. */
    return { label:'서식', at:0, by:'', photoId:'', photoYear:'', photoOwner:'' };
  }
  const from = (o && o.srcOf && o.srcOf[f]) || '';
  return from ? { label: from, at:0, by:'', photoId:'', photoYear:'', photoOwner:'' } : null;
}
/* 값 밑에 붙는 작은 출처 한 줄 */
function coSrcTagHtml(o, f){
  const s = coSrcOf(o, f);

    (s.photoId ? `<em onclick="event.stopPropagation();openCoDoc('${esc(s.photoYear)}','${esc(s.photoId)}','${esc(s.photoOwner)}')"

/* 계약서·신고서를 쓸 때 있어야 하는 셋. 하나라도 비면 「정보부족」이다.
   ⚠ 사업자번호는 «일부러 뺐다» — 2순위 「🔢 번호 없음」 토글이 따로 맡는다.

   ⚠ 명함 한 장만 있는 회사까지 세면 4,140곳이 죄다 「정보부족」이 되어, 정작 채워야 할

     (대표 화면 2026-08-13 — 온통 붉어진 그 화면). 한 곳에 두어 어긋나지 않게 한다. */

/* ══════ 몰아친 다시 그리기를 한 번으로 묶기 — 순수 로직 (테스트 대상) ══════
   명함·폴더·회사정보 세 자리를 실시간으로 듣고 있어, 저장이 한 건 오갈 때마다 화면을
   다시 그린다. 자동 폴더 배정처럼 저장이 몰리면 «한 건마다» 통째로 다시 그려 그 시간이
   그대로 쌓인다 — 화면이 계속 멈춘 것처럼 보인다. 사람 눈에는 마지막 한 번만 보이면
   되므로, 같은 프레임에 몰린 것을 한 번으로 묶는다.

   ⚠ 「나중에 그린다」가 아니라 「몰린 것을 한 번만 그린다」다. 밀린 그리기는 다음
     프레임에 반드시 일어난다 — 건너뛰면 저장한 것이 화면에 안 보인다.
   ⚠ 사람이 누른 것(단추·네모)은 묶지 않는다. 그건 바로 보여야 한다. */
function makeBurstRunner(schedule, run){
  let waiting = false;
  return function(){
    if(waiting) return;          /* 이미 예약돼 있으면 그 한 번에 함께 실린다 */
    waiting = true;
    schedule(function(){ waiting = false; run(); });
  };
}
/* 한 프레임 뒤에 부른다.
   ⚠ 창이 숨어 있으면(다른 탭에 가 있으면) 브라우저가 프레임을 아예 안 준다. 그대로
     두면 밀린 그리기가 영영 안 일어나 돌아왔을 때 옛 화면이 남는다. 숨어 있을 때는
     시간으로 깨운다 — 이 앱은 창을 여러 개 띄워 놓고 쓴다. */
const _soonTick = fn => {
  const hidden = (typeof document !== 'undefined') && document.hidden;
  if (hidden || typeof requestAnimationFrame !== 'function') return setTimeout(fn, 16);
  requestAnimationFrame(fn);
};
/* 실시간으로 들어온 것 때문에 다시 그릴 때만 이것을 쓴다 */

/* ===== 자동 로그아웃 (무활동 60분) + 남은시간 배지 + 2분 전 경고 =====
   ERP·컨설팅과 같은 localStorage('pu_last_active') 공유 → 어느 앱을 써도 함께 리셋 */
(function(){
  var LIMIT=60*60*1000, WARN=2*60*1000, AKEY='pu_last_active';
  /* 포털 공용 설정의 자동 로그아웃 시간 반영 — 10~480분만 인정, 그 밖이면 기본값 유지 */
  function _applyIdleCfg(c){
    var m = c && parseInt(c.idleMinutes, 10);
    if(m >= 10 && m <= 480) LIMIT = m*60*1000;
  }
  try{ _applyIdleCfg(window.PU_CFG); }catch(e){}            /* 이미 로드됐으면 즉시 */
  try{ window.addEventListener('pu-cfg', function(ev){ _applyIdleCfg(ev.detail); }); }catch(e){}
  function persistentAutoLogin(){ try{ return localStorage.getItem('pu_portal_auto') === '1'; }catch(e){ return false; } }
  function shouldPauseIdle(){ return persistentAutoLogin() && document.hidden; }
  var warnBox=null, tick=null;
  function loggedIn(){ try{ var u=firebase.auth().currentUser; return !!(u&&u.email); }catch(e){ return false; } }
  function now(){ return Date.now(); }
  function getLast(){ try{ var v=parseInt(localStorage.getItem(AKEY)||'0',10); return v>0?v:now(); }catch(e){ return now(); } }
  function markActive(){ try{ localStorage.setItem(AKEY,String(now())); }catch(e){} hideWarn(); }
  function resumeAutoSession(){ if(persistentAutoLogin()) markActive(); }
  function fmt(ms){ if(ms<0)ms=0; var s=Math.floor(ms/1000); return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2); }
  function doAutoLogout(){
    try{
      try{ firebase.auth().signOut(); }catch(_){}
      var ov=document.createElement('div'); ov.style.cssText='position:fixed;inset:0;background:#eef1f7;z-index:2147483647;'; document.body.appendChild(ov);
      setTimeout(function(){ location.replace('enter.html?v='+now()); }, 200);
    }catch(_){ location.replace('enter.html'); }
  }
  function showWarn(remMs){
    if(!warnBox){
      warnBox=document.createElement('div');
      warnBox.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:2147483646;background:#fff;border:1px solid #fca5a5;border-radius:12px;padding:14px 18px;box-shadow:0 14px 40px rgba(20,30,80,.22);display:flex;align-items:center;gap:14px;font-size:13px;color:#202124;';
      var msg=document.createElement('span'); msg.id='pu-warn-msg2'; msg.style.fontWeight='600';
      var btn=document.createElement('button'); btn.textContent='계속 사용'; btn.style.cssText='padding:7px 16px;border:none;background:#1e40af;color:#fff;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;';
      btn.addEventListener('click', markActive);
      warnBox.appendChild(msg); warnBox.appendChild(btn); document.body.appendChild(warnBox);
    }
    warnBox.style.display='flex';
    var m=document.getElementById('pu-warn-msg2'); if(m) m.textContent='⏱ 미사용으로 곧 로그아웃됩니다 ('+fmt(remMs)+' 남음)';
  }
  function hideWarn(){ if(warnBox) warnBox.style.display='none'; }
  ['mousemove','mousedown','keydown','touchstart','scroll','click'].forEach(function(ev){
    window.addEventListener(ev, markActive, {passive:true, capture:true});
  });
  window.addEventListener('pageshow', resumeAutoSession, {passive:true});
  window.addEventListener('focus', resumeAutoSession, {passive:true});
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) resumeAutoSession(); }, {passive:true});
  resumeAutoSession();
  try{ if(!localStorage.getItem(AKEY)) markActive(); }catch(e){}
  tick=setInterval(function(){
    var badges=document.querySelectorAll('.logoutTimer');
    if(!loggedIn()){ badges.forEach(function(b){ b.style.display='none'; }); hideWarn(); return; }
    if(shouldPauseIdle()) return;
    var rem=LIMIT-(now()-getLast());
    badges.forEach(function(b){ b.style.display='inline-flex'; b.textContent='⏱ '+fmt(rem); });
    if(rem<=0){ clearInterval(tick); doAutoLogout(); return; }
    if(rem<=WARN){ showWarn(rem); } else { hideWarn(); }
  }, 1000);
})();

<script>
/* 부팅 스플래시 제거: 앱 렌더 직후(더블 rAF) + 안전 타임아웃 */

/* ══════ 개인 창고 — 순수 로직 (테스트 대상) ══════
   비밀번호를 저장하지 않는다. 같은 방식으로 다시 계산해 견주기만 한다.
   자료를 들여다봐도 비밀번호를 알아낼 수 없다. */
const PW_ITER = 100000;
const _b64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
const _unb64 = s => { const b=atob(s); const u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; };
function newSalt(){ const u=new Uint8Array(16); crypto.getRandomValues(u); return _b64(u.buffer); }
async function pwHash(pw, saltB64, iter){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(String(pw)), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name:'PBKDF2', salt:_unb64(saltB64), iterations: iter||PW_ITER, hash:'SHA-256' }, key, 256);
  return _b64(bits);
}
/* 옮길 자리 목록을 만든다 — 값이 아니라 '어느 경로를 건드리는가'가 핵심이라
   그것만 따로 계산해 검사할 수 있게 뺐다.
   dir='lock'   공용 → 개인 (공용 자리는 null 로 지운다)
   dir='unlock' 개인 → 공용 (개인 자리는 null 로 지운다)
   실제 값(명함 내용·사진)은 화면 쪽에서 채워 넣는다. */
function movePaths(ids, gid, dir){
  const P = privRoot(); const out = {};
  const lock = dir === 'lock';
  (ids||[]).forEach(id=>{
    out[`${P}/items/${id}`]  = lock ? 1 : null;
    out[`${P}/photos/${id}`] = lock ? 1 : null;
    out[`${DB_ROOT}/items/${id}`]  = lock ? null : 1;
    out[`${DB_ROOT}/photos/${id}`] = lock ? null : 1;
    /* 공유 검색목록에는 잠글 때 '지우기'만 넣고, 풀 때 되살릴 값을 넣는다.
       개인 명함이 여기 남으면 푸른이알피 같은 다른 앱이 읽는다. */
    out[`${DB_ROOT}/idx/${id}`] = lock ? null : 1;
  });
  out[`${P}/groups/${gid}`]        = lock ? 1 : null;
  out[`${DB_ROOT}/groups/${gid}`]  = lock ? null : 1;
  return out;
}
/* ══════ 개인 창고 — 화면 ══════ */
let _privRefs = [];   /* 구독 해제용 */

/* 비밀번호 기록만 먼저 읽는다 — 명함은 아직 안 가져온다 */
async function privLockRec(){
  if(Store.mode!=='firebase' || !privRoot()) return null;
  const s = await Store.db.ref(privRoot()+'/lock').once('value');
  return s.val() || null;
}
/* 처음 잠글 때 비밀번호를 정한다 */
async function setPrivatePassword(){
  const pw = prompt('개인 폴더 비밀번호를 정하세요.\n\n'
    + '· 잊어버려도 명함은 사라지지 않습니다 (대표님 로그인으로 다시 정할 수 있습니다)\n'
    + '· 자리를 비운 사이 누가 화면을 만지는 것을 막는 장치입니다');
  if(pw===null) return null;
  if(!String(pw).trim()){ toast('비밀번호가 비어 있습니다'); return null; }
  const pw2 = prompt('한 번 더 입력하세요.');
  if(pw2===null) return null;
  if(pw!==pw2){ toast('두 번 입력한 비밀번호가 다릅니다'); return null; }
  const salt = newSalt();
  const hash = await pwHash(pw, salt, PW_ITER);
  await Store.db.ref(privRoot()+'/lock').set({ salt, iter:PW_ITER, hash });
  return true;
}
/* 개인 창고 자리가 서버에서 아직 안 열렸을 때 — 무엇을 해야 하는지까지 알린다.
   permission_denied 원문을 그대로 띄우면 영어 한 줄이라 아무도 다음 걸음을 모른다.
   규칙은 코드 배포로 적용되지 않는다 — 콘솔에 직접 붙여넣어야 한다. */
function isDenied(e){
  const m = String((e&&(e.code||e.message))||'');
  return /permission[_ ]denied|PERMISSION_DENIED/i.test(m);
}
/* 명함 구독이 서버에서 끊겼을 때 — 원인을 «맞게» 말한다.
   예전에는 무조건 「App Check 를 켜셨다면…」이라고만 했다(2026-08-16 대표 콘솔).
   그런데 같은 PERMISSION_DENIED 가 나는 훨씬 흔한 길이 따로 있다: 로그인 토큰이
   만료되거나 다른 탭에서 로그아웃해 auth 가 비면, 규칙(auth != null)이 모든 구독을
   끊는다. 엉뚱한 원인을 대면 사람이 App Check 를 뒤지느라 시간을 버린다. */
function deniedCauseOf(user, appCheckOn){
  if(!user) return 'auth';                 /* 로그인이 비어 있다 — 가장 흔한 원인 */
  if(!appCheckOn) return 'appcheck';       /* 로그인은 있는데 막혔다 — App Check 강제이거나 규칙 */
  return 'rules';
}
function itemsDeniedTell(e){
  let user=null; try{ user = firebase.auth().currentUser; }catch(_){}
  const why = deniedCauseOf(user, FB_APPCHECK_ON);
  if(why==='auth'){
    console.error('[명함첩] 로그인이 풀려 실시간 구독이 끊겼습니다 — 포털에서 다시 로그인해 주세요.');
    toast('로그인이 풀렸습니다 — 다시 로그인해 주세요', 8000);

      + 'pu-cards.html 의 FB_APPCHECK_ON 을 true 로 되돌려야 합니다. 아니라면 규칙(Rules)이 바뀌었는지 확인해 주세요.');

}
function tellVaultRuleMissing(){
  /* 줄바꿈을 배열로 잇는다 — 붙여넣을 JSON 안에 따옴표가 많아 한 줄 문자열로 쓰면
     보이지 않는 곳에서 어긋난다. */
  const rule = [
    '"pucards_private": {',
    '  "$uid": {',
    '    ".read": "auth != null && auth.uid === $uid",',
    '    ".write": "auth != null && auth.uid === $uid"',
    '  }',
    '}'
  ].join('\n');
  alert([
    '개인 폴더 자리가 서버에서 아직 열리지 않았습니다.',

    '',
    '① Firebase 콘솔 → Realtime Database → [규칙] 탭',
    '② "pucards" 덩어리 바로 아래에 넣기 (앞 줄 끝에 쉼표)',
    '③ [게시]',
    '',
    rule,
    '',
    '넣은 뒤 이 화면을 새로고침하고 다시 눌러 주세요.',

/* 개인 폴더 열기 — 맞은 뒤에야 구독한다.
   ★ 비밀번호를 맞히기 전에는 개인 자료를 브라우저로 가져오지도 않는다. */
async function openPrivateVault(){
  if(!state.isAdmin) return toast('대표만 열 수 있습니다');
  if(Store.mode!=='firebase') return toast('클라우드에 연결된 상태에서만 됩니다');
  if(state.privOpen) return closePrivateVault();
  let rec;
  try{ rec = await privLockRec(); }
  catch(e){
    if(isDenied(e)) return tellVaultRuleMissing();
    return toast('개인 창고를 읽지 못했습니다 — ' + ((e&&e.message)||''));
  }
  if(!rec) return toast('아직 잠근 폴더가 없습니다. 폴더 ⋮ → 🔒 잠금으로 만드세요',5000);
  const pw = prompt('개인 폴더 비밀번호를 입력하세요.');
  if(pw===null) return;
  const h = await pwHash(pw, rec.salt, rec.iter||PW_ITER);
  if(h !== rec.hash) return toast('비밀번호가 틀렸습니다');

  const P = privRoot();
  const bind = (sub, key) => {
    const ref = Store.db.ref(P+'/'+sub);
    const fn = ref.on('value', s => { state.priv[key] = s.val()||{}; render(); });
    _privRefs.push([ref, fn]);
  };
  bind('items','items'); bind('groups','groups'); bind('trash','trash');
  state.privOpen = true;
  toast('🔓 개인 폴더를 열었습니다 — 새로고침하면 다시 잠깁니다',5000);
  render();
  /* 열 때마다 지문을 맞춰 둔다 — 기다리지 않는다(화면은 이미 떴다).
     이 장치를 만들기 전에 잠근 폴더에는 지문이 없고, 개인 명함의 번호를
     고치면 옛 지문이 남는다. 여기서 조용히 메운다. */
  setTimeout(()=>{ syncLockKeys().catch(()=>{}); }, 0);
}
/* 개인 창고에 있는 명함의 지문 중 **빠진 것만** 채운다.
   지우지는 않는다 — 옛 지문 하나가 남아 있어도 잃는 것은 없지만
   (사진첩이 "이미 있다"고 한 번 더 막을 뿐), 잘못 지우면 감춘 사람이 드러난다. */
async function syncLockKeys(){
  if(!state.privOpen || Store.mode!=='firebase' || !window.PuLockKey) return;
  const items = Object.values(state.priv.items||{}).filter(Boolean);
  if(!items.length) return;
  const want = await lockKeyUpdates(items, true);
  const paths = Object.keys(want);
  if(!paths.length) return;
  const snap = await Store.db.ref('pucards/lockkeys').once('value');
  const have = snap.val() || {};
  const upd = {};
  paths.forEach(p=>{ const fp = p.split('/').pop(); if(!have[fp]) upd[p] = 1; });
  if(Object.keys(upd).length) await Store.db.ref().update(upd);
}
function closePrivateVault(){
  _privRefs.forEach(([ref,fn])=>{ try{ ref.off('value', fn); }catch(_){} });
  _privRefs = [];
  state.priv = {items:{},groups:{},trash:{}};
  state.privOpen = false;
  if(state.group && !state.groups[state.group]) state.group='all';
  toast('🔒 개인 폴더를 닫았습니다');
  render();
}
/* ⚠ isPrivGroup·isPrivItem·allItems·allGroups 는 **맨 위 덩어리로 옮겼다**(2026-08-09).
   여기(마지막 <script>)에 있었는데, 첫 화면을 그리는 코드는 앞 덩어리에 있어서
   PC 로 열 때마다 `allItems is not defined` 가 났다. 함수 끌어올림은 자기 <script>

   눈에 안 띄었을 뿐이다.

   덩어리)으로 옮겼다**(2026-08-15). renderPC() 가 이 덩어리 마지막 render() 로

   정의를 아직 못 만나 `syncPcSearchFor is not defined` 로 화면이 뜨자마자 깨졌다. */

/* ── 검색칸: 글자가 있을 때만 ✕ 를 보이고, 누르면 한 번에 지운다 ──
   예전에는 백스페이스로 하나씩 지워야 했다.
   모바일 칸(#search)이 실제 검색을 읽으므로 두 곳을 늘 같이 맞춘다.
   ⚠ 정의는 renderPC() 앞(PC 렌더링 덩어리)에 있다 — 여기서는 호출만 한다. */
/* 기업정보 화면에서는 이 칸이 **회사를 찾는다.** 예전엔 화면 안에 찾기 칸이 하나 더
   있어 같은 일을 하는 칸이 둘이었다 — 위에 치면 명함첩으로 튕겨 나가고, 안에 쳐야
   회사가 걸렸다(대표 지시 2026-08-13). 한 칸으로 모은다. */
function onPcSearchInput(v){
  /* ⚠ 기업정보에서 친 글자를 명함첩 찾기칸(#search)에 옮기면 안 된다 — 회사 이름을
     친 채 명함으로 나가면 명함 목록이 그 글자로 조용히 걸러진 채 보인다(실제로 그랬다). */

function clearPcSearch(){
  const p = $('pcSearch'); if(p) p.value = '';
  if(state.view === 'co'){ state.coQ=''; state.coPage=0; closePcDetail(); _syncSearchX(); renderCoPage(); if(p) p.focus(); return; }
  const s = $('search');   if(s) s.value = '';

/* Esc 로도 지운다 — 검색칸에 커서가 있을 때만. 다른 화면의 Esc 를 뺏지 않는다. */
document.addEventListener('keydown', function(e){
  if(e.key!=='Escape') return;
  const p = $('pcSearch');
  if(p && document.activeElement===p && p.value){ e.stopPropagation(); clearPcSearch(); }
