    + '비공개로 바꾸는 자리를 못 찾으면 <b>아무것도 하지 않고 멈춥니다</b> — 엉뚱한 것을 건드리지 않기 위해서입니다.</div></div>';
  h += '<div style="margin-top:10px;display:flex;gap:7px">'
    + '<a class="btn pri" style="text-decoration:none" href="' + esc(url)
    + '" target="_blank" rel="noopener">홈페이지에서 이 사람 글 열기</a>'
    + '<a class="btn" style="text-decoration:none" href="' + esc(PuHomeExport.loginUrl()) + '" target="_blank" rel="noopener">홈페이지 로그인</a>' + 
    '<span class="sub" style="align-self:center">편집 화면 대신 그냥 홈페이지가 뜨면 먼저 로그인</span></div>';
  h += modalFoot('');
  openModal(h);
}
window.copyPrivate = copyPrivate;

function memberBandHtml(d, rec) {
  const kept = keptOf(rec);
  const mark = rosterMarkOf(d.name || '');
  const st = ((App.check && App.check.members) || {})[d.key] || {};
  let h = '';

  if (kept) {
    h += '<div class="band keep"><b>홈페이지에 남기기로 함</b> — '
      + esc(kept.why || '(사유 없음)') + '<br>'
      + '<span class="sm">' + esc(kept.by || '(표시한 사람 모름)') + ' · '
      + esc(kept.at || '(날짜 모름)')
      + ' · 명부에 퇴사로 찍혀 있어도 「내릴 것(퇴사)」 딱지를 달지 않고 내용 대조만 합니다. '
      + '예외를 풀면 다음 「홈페이지 다시 확인」에서 퇴사 판정을 다시 받습니다.</span></div>';
  }

  if (mark && mark.kind === 'left' && !kept) {
    const 내려감 = st.status === 'done';
    h += '<div class="band ' + (내려감 ? 'keep' : 'rm') + '">'
      /* ★ 딱지에서는 날짜를 뗐지만(2026-09-02) 이 띠는 자리가 넉넉하다 —
         「언제 퇴사했나」는 내릴지 정할 때 꼭 보이는 값이라 여기서는 적는다. */
      + '<b>푸른ERP 명부: ' + esc(mark.label + (mark.leftAt ? ' ' + mark.leftAt : '')) + '</b> · '
      + (내려감 ? '홈페이지에서도 <b>내려간 것으로 확인</b>됐습니다.'
         : (st.status ? '홈페이지에는 <b>아직 올라가 있습니다</b>.'
            : '홈페이지에 올라가 있는지는 <b>「홈페이지 다시 확인」</b>을 눌러야 알 수 있습니다.'))
      + '<br><span class="sm">'
      + (내려감 ? '더 하실 일은 없습니다. 이름이 다른 쪽에 남아 있으면 위 안내 띠로 알려 드립니다.'
         : '내리시려면 아래 <b>「홈페이지에서 비공개로」</b>를 누르십시오 — '
           + '<b>삭제가 아니라 감추는 것</b>이라 잘못 내렸어도 되살릴 수 있습니다.')
      + '</span></div>';
  }

  /* ★ 채우기로 «안 되는» 것이 있으면 먼저 말한다 — 단추를 누르고 나서 알면 늦다 */
  const gap = fillGapNote(st,
    '홈페이지에서 이 사람 글을 열고 그 칸을 고친 뒤 저장하시면 됩니다. 경력사항은 단추로 채우면 됩니다.');
  if (gap) h += '<div class="band ask">' + gap + '</div>';

  if (mark && mark.kind !== 'left') {
    h += '<div class="band ask"><b>' + esc(mark.label) + '</b> — ' + esc(mark.detail) + '<br>'
      + '<span class="sm">명부는 푸른ERP 것이라 여기서는 읽기만 합니다. '
      + '지사장처럼 고용관계가 아닌 분은 아래 <b>「홈페이지에 남기기」</b>로 사유를 남겨 두십시오.</span></div>';
  }
  return h;
}

function memberEdit(d) {
  const rec = App.members[d.key] || {};
  const rep = riskReport(d.careers, App.lineFormat);
  /* 머리는 고정, 가운데(.esc)만 구르고, 발(.eft)의 단추는 늘 같은 자리에 있다 */
  let h = '<div class="edit">';
  h += '<div class="ehd">' + memberBandHtml(d, rec) + '</div>';
  h += '<div class="esc">';
  /* ══ 위 두 줄은 «붙여 둔다» (대표 지시 2026-09-03 「상단은 틀고정하는게 맞다」) ══
     경력 열여덟 줄을 고치다 보면 「누구 자료인지·올림인지」가 위로 사라졌다.
     ★ 붙이는 것은 여기까지다 — 아래(메인 설명·담당 업무·경력)는 구른다.
       더 붙이면 굴릴 자리가 없어진다. */
  /* ★ 붙는 것은 «따로 모아» 둔다 — 어디까지가 틀고정인지 코드에서 바로 보인다.
     전에는 h 에 바로 이어 붙여, 닫는 자리가 «주석에만» 있었다. 주석은 검사가
     걷어내므로(잘 쓴 주석이 검사를 통과시키는 것을 막으려고 걷는다) 「여기까지 붙는다」를
     기계가 확인할 길이 없었다. 이제 붙은칸에 담긴 것이 곧 붙는 것이다. */
  let 붙은칸 = '';
  붙은칸 += '<div class="fldbar">'
    /* ── 구분 (대표 지시 2026-09-02 「직원들도 변경 가능하게」) ──
       홈페이지 구성원 쪽이 노무사·직원 두 덩이로 나뉘어 있다. 어느 쪽 사람인지는
       바로 보이고 바로 바꿀 수 있어야 한다.
       ⚠ 옛 자료에는 이 값이 없다 — memberKind 가 직책에서 읽어 낸다(지우고 다시 적게 하지 않는다).
       ★ 라벨이 「이름」이었는데 이름 칸이 아래 줄로 내려갔으므로 「구분」으로 고쳤다
         (2026-09-03) — 이름표와 딱지가 어긋나면 무엇을 고르는지 헷갈린다. */
    + '<label style="margin:0">구분</label>'
    + MEMBER_KINDS.map(mk =>
        '<button class="chip' + (d.mkind === mk.key ? ' on' : '') + '"'
        + ' onclick="kindSet(\'' + mk.key + '\')">' + esc(mk.label) + '</button>').join('')
    /* ★ 「홈페이지에 올림/안 올림」을 이 줄 «오른쪽»에 함께 둔다
       (대표 지적 2026-09-03 「1줄 또는 2줄로 간단하게」).
       따로 두면 라벨 한 줄 + 딱지 한 줄로 «두 줄»을 먹었다.
       둘 다 «이 사람 하나»에 대한 스위치라 한 줄에 있어도 뜻이 안 섞인다 —
       다만 사이를 벌리고 이름표를 붙여 어느 딱지가 무엇인지 헷갈리지 않게 한다. */
    + '<span style="flex:1"></span>'
    /* ★ 「새 홈페이지에」라고 갈라 적는다 (대표 결정 2026-09-06 ㉯).
       ⚠ 아래 「퇴사 경고 끄기」와 헷갈리던 자리다 — 이름만 보면 둘 다 「올리냐 마냐」로
         보였는데, 이것은 «새» 홈페이지에서 빼는 것이고 저것은 «지금» 홈페이지 이야기다. */
    + '<span class="sub" style="font-weight:800">새 홈페이지에'
    + '<span class="tip" title="빼기로 두면 「새 홈페이지에 올리기」에서 빠지고 할 일에도 안 잡힙니다. 우리 목록에는 그대로 남습니다">?</span></span>'
    + '<button class="chip' + (d.offSite ? '' : ' on') + '" onclick="offSiteSet(false)">넣기</button>'
    + '<button class="chip' + (d.offSite ? ' on' : '') + '" onclick="offSiteSet(true)">빼기</button>'
    + '</div>';
  /* ⚠ 「홈페이지에 올림/안 올림」은 위 «구분 줄»에 있다 (2026-09-03).
     여기에 다시 만들지 말 것 — 따로 두면 두 줄을 먹는다. */
  /* ══ 이름·직책1·직책2·글번호를 «한 줄»에 (대표 지시 2026-09-03 「더 줄여줄수 없나」) ══
     이름이 줄 하나를 통째로 쓰고 있었다 — 세 글자에 너비 1,180px 였다.
     ★ 라벨은 칸 «안 왼쪽»으로 넣어 라벨 줄도 없앤다(.inl).
       placeholder 가 아니다 — 값을 채워도 이름표가 남는다.
     ★ 재어 본 값: 편집칸 위쪽이 165px → 100px (한 줄 반). */
  붙은칸 += '<div class="two">'
    + '<div class="inl" style="flex:0 0 178px"><b>이름</b>'
    + '<input value="' + esc(d.name) + '" oninput="fieldEdit(\'name\',this.value)"></div>'
    + '<div class="inl"><b>직책1</b>'
    + '<input value="' + esc(d.position1) + '" oninput="fieldEdit(\'position1\',this.value)"></div>'
    + '<div class="inl"><b>직책2</b>'
    + '<input value="' + esc(d.position2) + '" oninput="fieldEdit(\'position2\',this.value)"></div>'
    /* ★ 「홈페이지 글 번호」 → 「글 번호」 (대표 지적 2026-09-02).
       숫자 몇 자리인데 라벨이 길어 칸이 넓었다. 긴 이름은 물음표로 옮긴다. */
    + '<div class="inl" style="flex:0 0 118px"><b>글 번호'
    + '<span class="tip" title="홈페이지 글의 번호입니다 — 이 번호로 홈페이지 글과 짝지어집니다">?</span></b>'
    + '<input value="' + esc(d.srl) + '" oninput="fieldEdit(\'srl\',this.value)"></div>'
    + '</div>';
  /* ⚠ 붙은 칸은 여기서 끝나지 «않는다» — 대표 지시 2026-09-03 「이 부분 전체 틀고정해야
     한다」로 경력 목록 «위 전부»(구분·이름줄·메인 설명·담당 업무·경력사항 이름줄)를
     붙였다. 붙는 것은 모두 «붙은칸» 에 담긴다 — 담기지 않은 것은 구른다.
     ★ 전에는 두 줄만 붙였다. 되돌리지 말 것. */
  /* ★ 비어 있으면 «한 줄»로 접는다 (대표 지적 2026-09-02) — 빈 칸이 세 줄을 먹고 있었다.
     누르면(onfocus) 펴진다. 글이 있으면 처음부터 펴져 있다.
   ★ 긴 설명은 라벨 «글자»가 아니라 물음표에 넣는다 — 라벨이 칸보다 길었다.
     뜻을 지우는 것이 아니다: 마우스를 올리면 그대로 뜬다.
   ★ 비어 있으면 라벨을 «칸과 한 줄»에 둔다 (대표 지적 2026-09-02 「한줄 안되나」) —
     라벨이 위에 따로 있으면 빈 칸 하나가 두 줄을 쓴다. 글이 있으면 라벨을 위로 올린다
     (글이 여러 줄로 늘어나는데 라벨이 옆에 붙어 있으면 어디까지가 그 칸인지 흐려진다).
   ★ 안내 글도 짧게 — 「비어 있습니다 — 누르면 펴집니다」는 칸보다 길었다. */
  /* ★ 비어 있으면 라벨을 칸 «안»에 넣어 한 줄로 끝낸다 (.inl — 2026-09-03).
     글이 들어오면 라벨을 «위»로 올린다(.fld) — 여러 줄로 늘어나는 칸에 이름표가
     옆에 붙어 있으면 어디까지가 그 칸인지 흐려진다. */
  const 설명있나 = !!String(d.intro || '').trim();
  const 설명팁 = '<span class="tip" title="홈페이지 공개 화면에 안 나와 읽어올 수 없습니다 — 홈페이지 편집 화면을 보고 채우십시오">?</span>';
  붙은칸 += 설명있나
    ? '<div class="fld"><label>메인 설명' + 설명팁 + '</label>'
      + '<textarea rows="3" oninput="fieldEdit(\'intro\',this.value)">'
      + esc(d.intro) + '</textarea></div>'
    : '<div class="inl two-row"><b>메인 설명' + 설명팁 + '</b>'
      + '<textarea rows="1" onfocus="this.rows=3" placeholder="비어 있음"'
      + ' oninput="fieldEdit(\'intro\',this.value)"></textarea></div>';

  /* ── 담당 업무 (대표 지시 2026-09-02 「직원들 업무도 넣을 수 있게」) ──
     ⚠ 경력사항 «앞»에 둔다 — 직원에게는 경력보다 「무슨 일을 하는가」가 먼저다.
     ⚠ 홈페이지의 어느 칸에 넣을지는 사람이 정한다. 그래서 경력사항 붙여넣기에
       섞지 «않고», 이 칸만 따로 복사하는 단추를 준다 — 섞으면 경력 칸에 업무가 들어간다. */
  const 업무 = d.duties || [];
  /* ★ 비어 있으면 「＋ 줄 추가」를 «라벨 줄»에 둔다 (대표 지적 2026-09-03) —
     빈 칸 하나가 라벨 한 줄 + 빈 상자 한 줄로 두 줄을 먹고 있었다.
     줄이 하나라도 있으면 상자를 펴서 지금처럼 보여 준다. */
  붙은칸 += '<div class="fld"><div class="fldbar">'
    + '<label style="margin:0">담당 업무' + (업무.length ? ' — ' + 업무.length + '줄' : '') + '</label>'
    + (업무.length
        ? '<button class="btn" style="padding:3px 9px;font-size:11.5px" onclick="copyDuties()"'
          + ' title="홈페이지의 알맞은 칸에 붙여넣으십시오">📋 복사</button>'
        : '<button class="btn" style="padding:3px 9px;font-size:11.5px" onclick="dutyAdd()">＋ 줄 추가</button>')
    + '</div>'
    + (업무.length ? '<div class="car" id="dutyBox">' : '<div id="dutyBox" hidden>')
    + 업무.map((line, i) =>
        '<div class="l"><span class="no">' + (i + 1) + '</span>'
        + '<input value="' + esc(line) + '" oninput="dutyEdit(' + i + ',this.value)">'
        + '<button class="x" title="위로" onclick="dutyMove(' + i + ',-1)">▲</button>'
        + '<button class="x" title="아래로" onclick="dutyMove(' + i + ',1)">▼</button>'
        + '<button class="x" title="줄 삭제" onclick="dutyDel(' + i + ')">✕</button></div>').join('')
    + (업무.length ? '<div class="add" onclick="dutyAdd()">＋ 줄 추가</div>' : '')
    + '</div></div>';

  /* ── 「경력관리에서 가져오기」를 «경력사항 옆»에 둔다 (대표 지시 2026-09-02
       「경력사항은 경력관리에 가져오고 선택가능하게해줘」) ──
     길은 처음부터 있었다(아래 단추줄의 openPull). 다만 화면 «맨 아래»에만 있어서,
     경력사항을 보고 있는 사람 눈에는 안 띄었다 — 폰에서는 열여덟 줄을 다 지나야 나온다.
     ⚠ 아래 단추줄의 것을 «옮기지» 않고 여기에 하나 더 둔다. PC 에서 아래 단추줄로
       일하던 사람의 손버릇을 뺏지 않기 위해서다. */
  /* ★ 경력사항의 «이름줄»은 붙은 칸 안에, «목록»은 구르는 칸에 둔다 (2026-09-03).
     그래서 .fld 하나를 둘로 가른다 — 이름줄만 감싸고, 목록은 붙은 칸을 닫은 뒤 감싼다.
     ⚠ 한 .fld 안에서 .stick 을 닫으면 태그가 어긋난다(닫는 짝이 안 맞는다). */
  붙은칸 += '<div class="fld"><div class="fldbar">'
    + '<label style="margin:0">경력사항 — ' + d.careers.length + '줄</label>'
    + '<button class="btn" style="padding:3px 9px;font-size:11.5px" onclick="openPull()"'
    + ' title="경력관리에 담긴 위촉장·학력·자격증에서 골라 넣습니다">⤓ 경력관리에서 가져오기</button>'
    + '<span style="flex:1"></span>'
    /* 전현이 있을 만한 줄인데 안 고른 것이 몇인지 — 조용히 빠지는 것을 막는다 */
    + '<span class="sub" id="eraInfo" style="font-size:11.5px">' + eraInfoText(d.careers) + '</span>'
    + '</div></div>';

  /* ══ 여기까지가 붙는다. 경력 «목록»은 아래 — 구르는 칸이다 ══ */
  h += '<div class="stick shadow">' + 붙은칸 + '</div>';
  h += '<div class="fld">'
    + '<div class="car" id="careerBox">'
    /* ★ 칸에는 «속글»만 넣는다 — 앞한자는 딱지가 쥔다(대표 지시 2026-09-03).
       「現」·「前」은 자판으로 바로 안 나와서, 열여덟 줄을 고치려면 한자를 열여덟 번
       찾아 넣어야 했다. 딱지를 누르면 «맨 앞의 한자만» 바뀌고 뒤 글은 안 건드린다. */
    + d.careers.map((line, i) => {
        const era = PuHomeCareer.eraOf(line);
        const 골라야 = !era && ERA_LIKELY.test(line);
        return '<div class="l' + (골라야 ? ' needpick' : '') + '">'
        + '<span class="no">' + (i + 1) + '</span>'
        + eraPickHtml(era, k => 'careerEra(' + i + ',\'' + k + '\')')
        + '<input value="' + esc(PuHomeCareer.eraBody(line)) + '" oninput="careerEdit(' + i + ',this.value)">'
        + '<button class="x" title="위로" onclick="careerMove(' + i + ',-1)">▲</button>'
        + '<button class="x" title="아래로" onclick="careerMove(' + i + ',1)">▼</button>'
        + '<button class="x" title="줄 삭제" onclick="careerDel(' + i + ')">✕</button></div>';
      }).join('')
    + '<div class="add" onclick="careerAdd()">＋ 줄 추가</div></div></div>';

  if (rep.broken.length) {
    h += '<div class="bar bad"><b>⚠ 「감싸기」와 겹치는 줄이 ' + rep.broken.length + '줄 있습니다</b> — '
      + '이 상태로 내보내면 짝이 안 맞는 HTML 이 되어 <b>그 뒤 화면 구조가 통째로 깨질 수</b> 있습니다. '
      + '줄에서 &lt;div&gt; 를 지우거나 줄 모양을 「줄바꿈만」으로 바꾸십시오.</div>';
  }
  if (rep.soft.length) {
    h += '<div class="bar warn"><b>꺾쇠가 든 줄이 ' + rep.soft.length + '줄 있습니다</b> — '
      + '이 줄은 홈페이지에서 안 보일 수 있습니다. 일부러 쓴 표기일 수 있어 지우지 않습니다.</div>';
  }

  /* ★ 글 번호가 남과 겹치면 편집 주소가 남의 글이다 — 붙여넣기 단추부터 잠근다 */
  const clash = srlConflict(d.key, d.srl);
  if (clash.length) {
    h += '<div class="bar bad"><b>홈페이지 글 번호가 ' + esc(clash.join(', ')) + ' 님과 겹칩니다</b> — '
      + '이대로 붙여넣으면 그분 경력이 이 사람 것으로 덮입니다. '
      + '어느 쪽 글 번호가 잘못 적혔는지 고칠 때까지 붙여넣기를 막아 둡니다.</div>';
  }
  h += '</div>';   // .esc 끝 — 여기까지가 구르는 칸이다

  /* 「홈페이지에 남기기」 예외가 있으면 «푸는» 단추를, 없으면 «남기는» 단추를 준다.
     사유와 표시한 사람은 위 머리 띠(memberBandHtml)가 늘 보여준다 —
     숨기면 명부상 퇴사자인데 왜 「내릴 것」 경고가 없는지 알 길이 없다. */
  const kept = keptOf(rec);
  /* ★ 「내릴 것(퇴사)」일 때만 내리는 단추를 준다 — 늘 보이면 잘못 누른다 */
  const 내릴것 = (((App.check && App.check.members) || {})[d.key] || {}).status === 'toRemove';
  /* ══ 아래 띠 — «고른 사람 하나»에 대한 것만 (대표 결정 2026-09-06 ㉯) ══
     ★ 이름표를 붙인다. 위 띠는 화면 전체, 여기는 이 사람 하나다 — 그 갈림이 안 보여
       「누르면 무엇이 올라가나」가 흐렸다.
     ★ 파란 단추는 «저장» 하나. 전에는 「채우기용 복사」가 파랗고 저장이 회색이라,
       고친 것을 저장 안 하고 복사부터 누르게 되어 있었다.
     ★ 「경력관리에서 당겨오기」를 뗐다 — 경력사항 줄의 「⤓ 경력관리에서 가져오기」와
       «같은 openPull» 인데 이름만 달라 두 기능처럼 보였다. 칸 옆이 제 자리다.
     ★ 한 해에 몇 번 쓰는 것은 «⋯» 안으로 접는다(되돌리기·퇴사 경고 끄기·비공개로).
       늘 자리를 차지할 까닭이 없다. */
  const 더보기 = [];
  더보기.push('<button class="btn" onclick="openHistory()">되돌리기</button>');
  더보기.push(kept
    ? '<button class="btn keep" onclick="keepOnSiteClear()">퇴사 경고 되살리기</button>'
    : '<button class="btn keep" onclick="keepOnSiteAsk()">퇴사 경고 끄기 (사유 남김)</button>');
  if (내릴것) {
    더보기.push('<button class="btn rm" onclick="copyPrivate(\'' + esc(d.key) + '\')"'
      + ' title="지우지 않습니다 — 홈페이지에서 안 보이게만 합니다">'
      + '지금 홈페이지에서 비공개로</button>');
  }

  h += '<div class="eft">'
    + '<span class="tag">' + esc(d.name || '이 사람') + ' 한 사람</span>'
    + '<button class="btn pri" onclick="saveDraft()">저장</button>'
    + '<span id="dirtyMark" style="color:var(--bad);font-size:12px;font-weight:700">' + (App.dirty ? '● 저장 안 됨' : '') + '</span>'
    + '<span class="sep"></span>'
    + '<button class="btn" onclick="openPaste()"' + (clash.length ? ' disabled' : '')
    + '>지금 홈페이지용 복사</button>'
    + (d.srl ? '<a class="btn" style="text-decoration:none" href="'
               + esc(PuHomeExport.editUrl('member', d.srl))
               + '" target="_blank" rel="noopener">지금 홈페이지에서 이 사람 글</a>' : '')
    + '<span class="sep"></span>'
    + '<details class="more"><summary class="btn">⋯</summary>'
    + '<div class="morebox">' + 더보기.join('') + '</div></details>'
    + '<span style="flex:1"></span>'
    + '<span class="sub">' + (rec.updatedAt ? '마지막 수정: ' + esc(stamp(rec.updatedAt)) + ' · ' + esc(rec.updatedBy || '') : '수정 기록 없음') + '</span>'
    + '</div>';
  return h + '</div>';
}

/* 쪽에서 «왜» 붙여넣을 내용을 안 주는지. 덧창과 편집 화면이 같은 말을 쓴다 —
   두 곳에 따로 쓰면 한쪽만 고쳐져 서로 다른 말을 하게 된다. */
/* 왜 «통째로 붙여넣기»는 여전히 없는가 — 줄 단위로 고치는 길이 생긴 뒤에도 그렇다.
   ★ 이 글을 지우지 않는다. 나중에 「편하게 통째로 넣자」는 말이 반드시 다시 나온다. */
function pagePasteWhy() {
  return '<b>통째로 붙여넣기는 드리지 않습니다 — 대신 «줄마다» 고칩니다.</b><br>'
    + '아래 <b>대조 기준 글자</b>는 홈페이지에서 태그를 걷고 줄을 뭉쳐 만든 것입니다. '
    + '이 글자를 홈페이지에 통째로 붙여넣으면 <b>지도·표·구획·지사 탭</b>이 통째로 사라집니다. '
    + '(오시는길은 한 줄 275자, 노동사건대리는 한 줄 2412자가 됩니다.)<br>'
    + '게다가 그렇게 부서진 쪽을 다시 읽으면 같은 글자가 나와 딱지가 <b>「같음」</b>으로 떠서, '
    + '부서진 줄도 모르게 됩니다.<br>'
    + '그래서 위 <b>홈페이지 화면</b> 칸에서 <b>줄을 하나씩</b> 고치고 '
    + '<b>「홈페이지에 채우기용 복사」</b>를 누르십시오 — '
    + '고치신 줄의 <b>글자만</b> 제자리에서 갈아 끼우고, 태그는 한 글자도 건드리지 않습니다.';
}

/* 편집칸 맨 위 «한 줄» 안내 (5차 지시 — 「불필요한 설명은 모두 정리」).
   ★ 네 줄짜리 파란 띠를 쪽마다 매번 읽게 하지 않는다. 한 줄만 두고 이유는 접어 둔다.
     이유를 «없애지는» 않는다 — 붙여넣기를 안 드리는 까닭은 언제든 펼쳐 볼 수 있어야 한다. */
function noteOneLine(short, why, whyLabel) {
  return '<details class="note1"><summary>' + short
    + '<span class="more">' + esc(whyLabel || '왜 그런가') + '</span></summary>'
    + '<div class="w">' + why + '</div></details>';
}

/* ★ 홈페이지와 «같은 순서·같은 줄»로 보여준다 (2차 설계 ②).
   줄 목록은 부품(PuHomeParse.parsePageLines)이 만들고, 화면은 그대로 늘어놓기만 한다.
   ★ 대조는 여전히 «뭉친 글자»(parsePageText)로 한다 — 줄 모양대로 견주면 공백 하나로
     「다름」이 쏟아진다. 대조 규칙은 이 함수와 아무 상관이 없다.
   ★ 줄 목록은 «홈페이지에서 읽어온 것»이라야 만들 수 있다. 우리가 저장해 둔 대조 기준
     글자는 이미 뭉쳐 있어 줄을 되살릴 수 없다. 못 읽었으면 빈 줄로 지어내지 않고
     그 사실을 그대로 말한다. */
/* ══════ 홈페이지에 올리기 (대표 결정 2026-08-31 「나」) ══════
   ★ 우리 자료로 «구성원 쪽»을 그려 저장소에 올린다. 올리면 1~2분 뒤 홈페이지에 뜬다.
   ★ 그리는 몸통은 부품(PuSitePeople)이 갖고 있다 — 명령줄도 같은 것을 쓴다.
     그래서 «여기서 미리 본 것»과 «실제로 올라가는 것»이 다를 수 없다.
   ★ 얼굴 사진은 홈페이지 것을 그대로 이어받는다(우리는 사진을 갖고 있지 않다).
     사진을 못 찾은 사람은 «올리지 않고» 이름을 알린다. */
async function publishPeople() {
  if (App.publishing) return;
  if (!App.isAdmin) { await say('총괄관리자만 올릴 수 있습니다', ''); return; }
  App.publishing = true; App.render();
  try {
    /* 지금 올라가 있는 쪽을 먼저 읽는다 — 사진과 «틀»을 그대로 이어받기 위해서다 */
    const res = await fetch(SITE_BASE + '/people/index.html?t=' + Date.now());
    if (!res.ok) throw new Error('지금 홈페이지 쪽을 읽지 못했습니다 (' + res.status + ')');
    const 지금쪽 = await res.text();

    /* ★ 「안 올림」으로 표시한 사람은 빼고 넘긴다 — 사람이 이미 정한 것이다 */
    const ours = Object.keys(App.members)
      .filter(k => !offSiteOf(App.members[k]))
      .map(k => Object.assign({}, App.members[k], { key: k }));
    const 고른것 = PuSitePeople.올릴사람(지금쪽, ours);
    if (!고른것.갈것.length) {
      await say('올릴 사람이 없습니다',
        '홈페이지 글 번호와 사진이 맞는 사람이 하나도 없습니다.' +
        (고른것.못갈것.length ? '\n\n' + 고른것.못갈것.map(x => '· ' + x.이름 + ' — ' + x.why).join('\n') : ''));
      return;
    }

    const 새쪽 = PuSitePeople.쪽그리기(지금쪽, 고른것.갈것);
    if (새쪽 === 지금쪽) {
      await say('바뀐 것이 없습니다', '지금 올라가 있는 것과 같습니다 — 올리지 않았습니다.');
      return;
    }

    /* ★ 무엇이 올라가는지 «먼저 보여주고» 묻는다. 묻지 않고 올리면 되돌릴 틈이 없다 */
    const ok = await askYes('홈페이지에 올릴까요?',
      '구성원 ' + 고른것.갈것.length + '명으로 «구성원 소개» 쪽을 다시 만듭니다.\n' +
      고른것.갈것.map(p => '· ' + p.이름 + (p.직책1 ? ' ' + p.직책1 : '') + ' · 경력 ' + p.경력.length + '줄').join('\n') +
      (고른것.못갈것.length ? '\n\n[못 올리는 사람]\n' + 고른것.못갈것.map(x => '· ' + x.이름 + ' — ' + x.why).join('\n') : '') +
      '\n\n올리면 1~2분 뒤 홈페이지에 뜹니다.', '올리기');
    if (!ok) return;

    const 답 = await 올리기('site/people/index.html', 새쪽,
      '구성원 ' + 고른것.갈것.length + '명');
    toast('올렸습니다 — 1~2분 뒤 홈페이지에 뜹니다' + (답.commit ? ' (' + 답.commit + ')' : ''));
  } catch (e) {
    console.warn('[홈페이지 올리기]', e);
    await say('올리지 못했습니다', (e && e.message) || String(e));
  } finally {
    App.publishing = false; App.render();
  }
}
window.publishPeople = publishPeople;

/* 쪽 본문을 새 홈페이지에 올린다 (대표 지시 2026-08-31 「나머지도 순서대로」).
   ★ 구성원은 카드를 «찍어 내면» 됐다. 쪽은 본문 안에 지도·표·구획·지사 탭이 들어 있어
     통째로 갈아 끼우면 그것들이 사라진다 — 그래서 «고치신 줄의 글자만» 갈아 끼운다.
     그 일은 이미 증명해 둔 부품이 한다(실제 열두 쪽으로 「태그가 한 글자도 안 바뀐다」).
   ★ 고치는 자리는 «본문»뿐이다. 쪽 전체에 대고 하면 발에도 있는 글(회사 이름·전화번호)이
     「두 군데라 못 한다」고 헛걸린다. */
async function publishPage(mid) {
  if (App.publishing) return;
  if (!App.isAdmin) { await say('총괄관리자만 올릴 수 있습니다', ''); return; }
  /* ★ pageFixList 를 쓴다 — 여기가 «몇 번째»(n)와 «모두 몇 군데»(of)를
     실어 보내는 자리다. 지우개(PuSitePage.고칠줄)는 글자만 넘기므로
     똘잔은 줄을 못 짚았다 — 그러면 때 자물쇠가 다시 생긴다. */
  const 고칠것 = pageFixList(mid);
  if (!고칠것.length) {
    await say('고친 줄이 없습니다',
      '위 「홈페이지 화면」 칸에서 고칠 줄을 «그 자리에서» 고치신 뒤에 눌러 주십시오.');
    return;
  }
  App.publishing = true; App.render();
  try {
    /* raw 는 «파일»만 읽는다 — 폴더 주소(/work1/)로는 못 읽는다 */
    const res = await fetch(SITE_BASE + '/' + mid + '/index.html?t=' + Date.now());
    if (!res.ok) throw new Error('새 홈페이지의 이 쪽을 읽지 못했습니다 (' + res.status + ')');
    const 지금쪽 = await res.text();

    const out = PuSitePage.쪽고치기(지금쪽, 고칠것, PuHomeFill.applyLineEdits);
    if (!out.done.length) {
      await say('채운 줄이 없습니다',
        out.skipped.map(x => '· ' + x.before + '\n   → ' + x.why).join('\n'));
      return;
    }

    const ok = await askYes('새 홈페이지에 올릴까요?',
      out.done.length + '줄을 갈아 끼웁니다. 지도·표·구획은 그대로입니다.\n\n' +
      out.done.map(d => '· ' + d.before + '\n   → ' + d.after).join('\n') +
      (out.skipped.length ? '\n\n[건너뛴 줄]\n' +
        out.skipped.map(x => '· ' + x.before + ' — ' + x.why).join('\n') : '') +
      '\n\n올리면 1~2분 뒤 홈페이지에 뜹니다.', '올리기');
    if (!ok) return;

    const 답 = await 올리기('site/' + mid + '/index.html', out.html,
      (PAGE_LABEL[mid] || mid) + ' ' + out.done.length + '줄');

    /* 올린 줄은 «고칠 줄» 목록에서 지운다 — 남겨 두면 다음에 또 올리게 된다.
       ★ «몇 번째»까지 맞춰 지운다 (2026-09-03). 글자만 보고 지우면,
         같은 글의 1번째만 올라갔는데 2번째 고침까지 함께 지워져 조용히 안 올라간다. */
    const 남길것 = {};
    Object.keys(App.pageFix[mid] || {}).forEach(k => {
      const { n, text } = runOfKey(k);
      const 올라갔나 = out.done.some(d =>
        d.before === text && (d.n == null ? n === 1 : d.n === n));
      if (!올라갔나) 남길것[k] = App.pageFix[mid][k];
    });
    App.pageFix[mid] = 남길것;
    toast('올렸습니다 — 1~2분 뒤 홈페이지에 뜹니다' + (답.commit ? ' (' + 답.commit + ')' : ''));
  } catch (e) {
    console.warn('[쪽 올리기]', e);
    await say('올리지 못했습니다', (e && e.message) || String(e));
  } finally {
    App.publishing = false; App.render();
  }
}
window.publishPage = publishPage;

/* ══════ 자문사 로고 관리 (대표 지시 2026-08-31 「나머지도 순서대로」) ══════

  const 지금 = PuSitePartner.올릴로고(App.siteLogos, App.partnerLogos).갈것.map(x => x.srl);

/* 쪽 하나를 저장소에 올린다 — 여러 쪽을 올려야 하는 곳이 생겨 하나로 모았다 */
async function 올리기(path, content, note) {
  const token = await firebase.auth().currentUser.getIdToken();
  const up = await fetch(PUBLISH_URL, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: path, content: content, note: note })
  });
  const 답 = await up.json().catch(() => ({}));
  if (!up.ok) throw new Error(답.error || ('서버가 ' + up.status + ' 을 돌려줬습니다'));
  return 답;
}

/* ══════════════════════════════════════════════════════════════════════════
   로고 붙여넣기 (대표 요청 2026-09-02 「캡쳐 후 붙여넣기로 쉽게 해결하고 싶다」)
   ══════════════════════════════════════════════════════════════════════════
   ★ 캡쳐로 넣으면 «흰 네모»가 생긴다 — 재 봤다(2026-09-02):
     자문사 로고들은 «투명 배경» PNG(9~13KB)이고, 로고가 앉는 자리는 «연한 회색» 칸이다.
     캡쳐는 그 사이트의 흰 배경이 박히므로, 회색 칸 안에 흰 네모가 남는다.
     로고가 나란히 늘어서는 자리라 한 장만 달라도 눈에 띈다.
   ★ 그래서 «막지 않고» 미리보기를 실제 배경색 위에 깔아 눈으로 보이게 하고,
     흰 테두리가 잡히면 「우클릭 → 이미지 복사」를 권한다. 그것이 손도 덜 간다
     (캡쳐 도구를 열 필요가 없고, 원본 PNG 가 투명 그대로 온다).
   ★ 흰색을 «자동으로 투명하게 만들지 않는다» — 로고 안의 흰 글자·흰 도형에 구멍이 뚫린다.
     조용히 망가지는 쪽이라, 알려만 주고 사람이 고른다. */

/* 홈페이지에서 로고는 120~180px 로 보인다 — 600px 이면 넉넉하고, 700KB 한도에 안 걸린다 */
const LOGO_MAX_W = 600;

/* 붙인(또는 고른) 그림을 다룬다 — 줄이고, 흰 테두리인지 잰다.
   ★ 캔버스를 지나므로 결과는 늘 PNG 다(투명이 있으면 그대로 살아 있다). */
function 로고그림다루기(file) {
  return new Promise(function (resolve, reject) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onerror = function () {
      URL.revokeObjectURL(url);
      reject(new Error('그림을 읽지 못했습니다 — 그림이 아닌 것을 붙이셨을 수 있습니다.'));
    };
    img.onload = function () {
      URL.revokeObjectURL(url);
      const w0 = img.naturalWidth, h0 = img.naturalHeight;
      if (!w0 || !h0) { reject(new Error('그림 크기를 알 수 없습니다.')); return; }
      const 배 = Math.min(1, LOGO_MAX_W / w0);
      const w = Math.max(1, Math.round(w0 * 배));
      const h = Math.max(1, Math.round(h0 * 배));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      let 흰테두리 = false;
      try { 흰테두리 = 흰테두리인가(cv); } catch (e) { /* 못 읽으면 알리지 않는다 */ }
      const dataUrl = cv.toDataURL('image/png');
      resolve({
        dataUrl: dataUrl, w: w, h: h, 원래폭: w0,
        줄였나: 배 < 1,
        바이트: Math.round((String(dataUrl).split(',')[1] || '').length * 3 / 4),
        흰테두리: 흰테두리
      });
    };
    img.src = url;
  });
}

/* 네 변이 «거의 흰색이고 속이 안 비쳤나» — 캡쳐로 넣은 그림의 표시다.
   ★ 투명한 로고는 변이 «비어 있다»(알파가 낮다). 그것을 흰색으로 세면 안 된다 —
     제대로 넣은 로고에도 경고가 떠서, 다음부터 경고를 안 읽게 된다. */
function 흰테두리인가(cv) {
  const cx = cv.getContext('2d');
  const w = cv.width, h = cv.height;
  if (w < 4 || h < 4) return false;
  const 점들 = [];
  const N = 12;
  for (let i = 0; i < N; i++) {
    const x = Math.round((w - 1) * i / (N - 1));
    const y = Math.round((h - 1) * i / (N - 1));
    [[x, 0], [x, h - 1], [0, y], [w - 1, y]].forEach(function (p) {
      점들.push(cx.getImageData(p[0], p[1], 1, 1).data);
    });
  }
  let 흰것 = 0, 비친것 = 0;
  점들.forEach(function (d) {
    if (d[3] < 32) { 비친것++; return; }
    if (d[0] > 238 && d[1] > 238 && d[2] > 238) 흰것++;
  });
  if (비친것 > 점들.length * 0.2) return false;      // 투명 로고다
  return 흰것 > 점들.length * 0.8;
}

/* Ctrl+V — 로고 창이 열려 있을 때만 받는다.
   ★ 그림이 아니면 «아무것도 안 한다» — 글자 붙여넣기를 막으면 다른 칸이 못 쓰게 된다. */
async function onLogoPaste(e) {
  if (!App.logoPasteOn) return;
  const items = (e.clipboardData && e.clipboardData.items) || [];
  let f = null;
  for (let i = 0; i < items.length; i++) {
    if (String(items[i].type || '').indexOf('image/') === 0) { f = items[i].getAsFile(); break; }
  }
  if (!f) return;
  e.preventDefault();
  try {
    if (!App.isAdmin) throw new Error('총괄관리자만 올릴 수 있습니다.');
    App.logoPick = await 로고그림다루기(f);
    drawPartnerLogos();
  } catch (err) {
    console.warn('[로고 붙여넣기]', err);
    await say('붙여넣지 못했습니다', (err && err.message) || String(err));
  }
}

/* 붙인 그림을 담는다 — 저장소로 보내고 목록 뒤에 붙인다 */

  } catch (e) {
    console.warn('[로고 담기]', e);

  }
}

/* 붙여넣기 칸을 누르면 그 자리에 초점을 준다 — 어디에 붙는지 눈에 보이게 */
function focusLogoPaste(el) { try { el.focus(); } catch (e) {} }

/* ★ 새 자문사 로고를 넣는다 — 그림을 «저장소»에 담고 목록 뒤에 붙인다.
   ★ 왜 창고(Storage)가 아니라 저장소인가:
     ① 홈페이지가 «통째로 한 덩어리»로 남아 어느 곳으로 옮겨도 그대로 돈다
     ② 창고는 무료 한도가 없다 — 로고 몇 장에 셈을 붙일 이유가 없다
     ③ 창고 주소는 토큰이 붙어 길고, 토큰이 사라지면 그림이 통째로 안 보인다
   ★ 여기서는 «담기»까지만 한다. 쪽에 실제로 실리는 것은 「올리기」를 눌렀을 때다. */
/* 로고 한 장을 저장소에 담는다 — 파일 고르기와 붙여넣기가 «같은 길»을 쓴다.
   ★ 길이 둘이면 한쪽만 고쳐진다. 실제로 한도·이름 규칙이 두 벌이 될 자리였다.
   ★ 파일 이름은 «우리가» 짓는다 — 한글·빈칸·따옴표가 든 이름이 주소가 되면 깨지고,
     붙여넣기에는 파일 이름이 아예 «없다». 시각으로 지으면 겹치지도 않는다.
   ★ 여기서는 «담기»까지만 한다. 쪽에 실리는 것은 「올리기」를 눌렀을 때다. */
/* ★ 로고 이름은 시각으로 짓는데, «여러 장을 한꺼번에» 담으면 같은 밀리초에 둘이 만들어져
   이름이 겹친다 — 겹치면 뒤엣것이 앞엣것을 덮어써 로고 한 장이 조용히 사라진다.
   (2026-09-06 「여러장 한번에」를 만들며 미리 막았다. 한 장씩일 때는 안 나던 일이다.)
   그래서 이미 담긴 열쇠와 견주어 비어 있는 이름을 찾는다. */
function 로고열쇠() {
  const 있는것 = {};
  (((App.partnerLogos || {}).추가) || []).forEach(x => { if (x && x.srl) 있는것[x.srl] = 1; });
  const 밑 = 'n' + Date.now();
  let 열쇠 = 밑, n = 1;
  while (있는것[열쇠]) { n += 1; 열쇠 = 밑 + '-' + n; }
  return 열쇠;
}

async function 로고담기(base64, 끝, 사연) {
  if (!App.isAdmin) throw new Error('총괄관리자만 올릴 수 있습니다.');
  if (!base64) throw new Error('그림이 비어 있습니다.');
  const 바이트 = Math.round(base64.length * 3 / 4);
  const 한도 = 700 * 1024;
  if (바이트 > 한도) throw new Error('그림이 너무 큽니다(' + Math.round(바이트 / 1024) + 'KB). '
    + '한도는 700KB 입니다 — 로고는 보통 5~70KB 입니다.');
  const 열쇠 = 로고열쇠();
  const 이름 = 열쇠 + '.' + 끝;
  const 자리 = 'site/files/logo/' + 이름;
  const token = await firebase.auth().currentUser.getIdToken();
  const up = await fetch(PUBLISH_URL, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: 자리, content: base64, image: true,
                           note: '자문사 로고 ' + (사연 || '') })
  });
  const 답 = await up.json().catch(() => ({}));
  if (!up.ok) throw new Error(답.error || ('서버가 ' + up.status + ' 을 돌려줬습니다'));
  App.partnerLogos.추가 = (App.partnerLogos.추가 || [])
    .concat([{ srl: 열쇠, 그림: '../files/logo/' + 이름 }]);
  await savePartnerLogos();
  return 답;
}

/* 파일 한 장을 살펴 담는다 — 파일 고르기·끌어다 놓기가 «같은 길»을 쓴다.
   ⚠ 길이 둘이면 한쪽만 고쳐져 한도·확장자 규칙이 두 벌이 된다. */
async function 로고파일담기(f) {
  const 한도 = 700 * 1024;
  if (f.size > 한도) throw new Error('너무 큽니다(' + Math.round(f.size / 1024) + 'KB, 한도 700KB)');
  const 끝 = (f.name.split('.').pop() || '').toLowerCase();
  const 되는것 = { png: 1, jpg: 1, jpeg: 1, webp: 1, svg: 1 };
  if (!되는것[끝]) throw new Error('png·jpg·webp·svg 만 됩니다 (' + 끝 + ')');
  const base64 = await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error('그림을 읽지 못했습니다'));
    r.onload = () => resolve(String(r.result).split(',')[1] || '');
    r.readAsDataURL(f);
  });
  return 로고담기(base64, 끝, f.name);
}

/* ══════ 여러 장을 한꺼번에 (대표 지시 2026-09-06 「여러장 한번에」) ══════
   ★ 한 장이 잘못돼도 «나머지는 담는다». 열 장 중 한 장이 크다고 열 장을 다 물리면,
     어느 것이 문제였는지 모른 채 처음부터 다시 골라야 한다.
     못 담은 것만 이름과 까닭을 모아 끝에 한 번 알린다.
   ★ 한 장씩 차례로 담는다 — 한꺼번에 던지면 서버가 밀리고, 어디까지 됐는지도 안 보인다. */
async function 로고여러장(파일들) {
  const 목록 = Array.prototype.slice.call(파일들 || []);
  if (!목록.length) return;
  if (!App.isAdmin) { await say('총괄관리자만 올릴 수 있습니다', ''); return; }
  const 된것 = [], 안된것 = [];
  const 칸 = $('logoDrop');
  const 알림 = (s) => { if (칸) 칸.textContent = s; };
  for (let i = 0; i < 목록.length; i++) {
    const f = 목록[i];
    알림('담는 중… ' + (i + 1) + ' / ' + 목록.length + '  ' + f.name);
    try { await 로고파일담기(f); 된것.push(f.name); }
    catch (e) {
      console.warn('[로고 넣기]', f.name, e);
      안된것.push(f.name + ' — ' + ((e && e.message) || String(e)));
    }
  }
  drawPartnerLogos();
  if (!안된것.length) {
    toast(된것.length + '장을 담았습니다 — 아래 «홈페이지에 올리기»를 눌러야 실립니다.');
  } else {
    await say(된것.length + '장을 담았고, ' + 안된것.length + '장은 못 담았습니다',
      '<div class="pre">' + 안된것.map(esc).join('\n') + '</div>'
      + '<div class="sub" style="margin-top:6px">담긴 것은 그대로 있습니다 — '
      + '못 담은 것만 고쳐서 다시 넣으시면 됩니다.</div>');
  }
}

/* 끌어다 놓기 — 폴더에서 로고 여러 장을 통째로 집어 던질 수 있게 한다.

async function publishPartner() {
  if (App.publishing) return;
  if (!App.isAdmin) { await say('총괄관리자만 올릴 수 있습니다', ''); return; }
  App.publishing = true;
  try {
    const res = await fetch(SITE_BASE + '/partner/index.html?t=' + Date.now());
    if (!res.ok) throw new Error('자문사 쪽을 읽지 못했습니다 (' + res.status + ')');
    const 지금쪽 = await res.text();
    const 고른것 = PuSitePartner.올릴로고(지금쪽, App.partnerLogos);
    const 새쪽 = PuSitePartner.쪽그리기(지금쪽, 고른것.갈것);

    /* ★ 메인에도 «같은 로고 띠»가 흐른다. 자문사 쪽만 고치고 메인을 그대로 두면

       (원래 홈페이지는 한 자료를 두 쪽이 끌어다 썼는데, 굳히면서 그 연결이 끊겼다.) */
    let 새메인 = null, 지금메인 = null;
    try {
      const mres = await fetch(SITE_BASE + '/index.html?t=' + Date.now());
      if (mres.ok) {
        지금메인 = await mres.text();
        const 모든로고 = PuSitePartner.로고읽기(지금쪽);
        const 그린것 = PuSitePartner.메인그리기(지금메인, 고른것.갈것, 모든로고);
        if (그린것 !== 지금메인) 새메인 = 그린것;
      }
    } catch (e) {
      console.warn('[메인 로고 띠]', e);   // 메인을 못 읽어도 자문사 쪽은 올린다
    }

    if (새쪽 === 지금쪽 && !새메인) {

    }
    const ok = await askYes('홈페이지에 올릴까요?',

      (고른것.숨긴것.length ? '\n숨기는 로고 ' + 고른것.숨긴것.length + '장' : '') +
      (새메인 ? '\n메인 화면의 흐르는 로고 띠도 함께 바꿉니다.' : '') +
      '\n\n올리면 1~2분 뒤 홈페이지에 뜹니다.', '올리기');
    if (!ok) return;

    let 올린쪽 = 0;
    if (새쪽 !== 지금쪽) {
      await 올리기('site/partner/index.html', 새쪽, '자문사 로고 ' + 고른것.갈것.length + '장');
      올린쪽++;
    }
    if (새메인) {
      await 올리기('site/index.html', 새메인, '메인 로고 띠 ' + 고른것.갈것.length + '장');
      올린쪽++;
    }
    /* ★ 올리고 나면 «새로 넣은 것» 목록을 비운다. 이제 쪽에서 읽히므로,
       안 비우면 다음에 열 때 같은 로고가 한 번 더 붙는다. */
    if ((App.partnerLogos.추가 || []).length) {

    toast(올린쪽 + '쪽을 올렸습니다 — 1~2분 뒤 홈페이지에 뜹니다');
  } catch (e) {
    console.warn('[자문사 올리기]', e);
    await say('올리지 못했습니다', (e && e.message) || String(e));

}

/* 쪽 하나만 홈페이지에서 읽어 온다 (5차 지시 ③).
   ★ 「홈페이지 다시 확인」과 «다른 것»이다: 이건 어떻게 보이는지 보려고 읽는 것이라
     읽은 결과로 딱지를 새로 붙이지 않는다. 딱지는 확인을 누를 때만 바뀐다 —
     여기서 딱지까지 손대면 「저절로 돌지 않는다」는 약속이 깨진다.
   ★ 줄 목록은 저장하지 않는다(보여주기 전용). 그래서 화면을 새로 열면 «확인 시각은
     남아 있는데 줄 목록은 비어» 있었다 — 대조는 해 놨는데 「아직 읽지 않았습니다」가
     떠서, 어떻게 보이는지 볼 방법이 없었다. 한 쪽만 읽으면 금방이다. */
/* ★ 쪽을 고르면 «저절로» 읽어온다 (대표 결정 2026-09-06 ㉮).
   왜 — 읽어온 줄은 화면에서만 살고 저장하지 않는다(홈페이지를 비추는 값이라 굳히면 낡는다).
   그래서 화면을 새로 열면 「홈페이지 확인 9/3」이라 적혀 있는데도 줄은 비어 있었고,
   쪽마다 단추를 눌러야 «어떻게 보이는지»를 볼 수 있었다. 안 누르면 늘 덩어리 글자만 보인다.
   ⚠ 조용히 읽는다 — 사람이 부른 것이 아니므로 알림창도 토스트도 띄우지 않는다.
     못 읽으면 그냥 「이 쪽 읽어오기」 단추가 남는다(늘 있던 그 자리다). */
function 쪽자동읽기() {
  const d = App.draft;
  if (!d || d.kind !== 'page') return;
  if (App.reading) return;
  if (Array.isArray((App.pageLines || {})[d.key])) return;   // 이미 읽었다
  readOnePage(d.key, true);
}

async function readOnePage(mid, 조용히) {
  if (App.reading) return;
  App.reading = mid;
  App.render();
  let 잘못 = null;
  let 버린고침 = 0;
  try {
    const token = await firebase.auth().currentUser.getIdToken();
    const res = await fetch(READ_HOMEPAGE_URL, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: mid })
    });
    if (!res.ok) throw new Error('서버가 ' + res.status + ' 을 돌려줬습니다');
    const data = await res.json();
    if (typeof data.html !== 'string') throw new Error('내용이 비어 있습니다');
    버린고침 = keepPageHtml(mid, data.html);
  } catch (e) {
    console.warn('[쪽 읽기]', e);
    잘못 = (e && e.message) || String(e);
  }
  App.reading = '';
  App.render();
  if (잘못) {
    /* 저절로 읽다 실패한 것으로 창을 띄우지 않는다 — 쪽을 고를 때마다 창이 뜬다.
       읽어오는 단추가 그대로 남아, 사람이 누르면 그때는 까닭을 알려 준다. */
    if (조용히) { console.warn('[쪽 저절로 읽기] 실패', mid, 잘못); return; }
    await say('이 쪽을 읽지 못했습니다',
      '홈페이지에서 이 쪽을 읽어오지 못했습니다 — ' + 잘못 + '\n'
      + '딱지와 자료는 건드리지 않았습니다. 잠시 뒤 다시 눌러 주십시오.');
    return;
  }
  if (조용히) return;              // 사람이 부른 것이 아니면 조용히 끝낸다
  const n = (App.pageLines[mid] || []).length;
  toast((n ? (n + '줄을 읽었습니다 — 홈페이지에 보이는 그대로입니다.')
           : '읽었지만 본문 줄을 찾지 못했습니다.')
    + (버린고침 ? ' 고쳐 두신 ' + 버린고침 + '줄은 홈페이지에서 사라져 지웠습니다.' : ''));
}
window.readOnePage = readOnePage;

/* 읽어온 쪽 하나를 «두 가지 모양»으로 담는다 — 보여줄 줄과 고칠 줄.
   ★ 한 군데서만 담는다. 두 군데서 따로 담으면 한쪽만 고쳐지고 어긋난다.
   ★ 고쳐 두신 줄은 «원래 글자»로 붙들어 둔다(줄 번호가 아니라). 다시 읽는 사이
     홈페이지 줄이 하나 늘어도 고친 것이 엉뚱한 줄로 옮겨 붙지 않는다. */
function keepPageHtml(mid, html) {
  /* ★ 원본 HTML 을 남긴다 — 실시간 미리보기가 이것으로 «올릴 그 HTML»을 만든다.
     예전에는 파싱만 하고 버렸다. 안 남기면 미리보기가 쪽을 다시 받아야 한다. */
  (App.pageHtml || (App.pageHtml = {}))[mid] = html;
  App.pageLines[mid] = PuHomeParse.parsePageLines(html);
  App.pageRuns[mid] = PuHomeFill.fixableRuns(PuHomeParse.pageBodyHtml(html));
  /* 이제 없는 줄에 걸린 고침은 버린다 — 없는 자리를 채울 수는 없다.
     ★ «몇 번째»까지 맞춰 본다 (2026-09-03) — 글자만 보면, 두 군데였던 줄이
       한 군데로 줄었을 때 「2번째」에 걸린 고침이 살아남아 엉뚱한 자리를 채운다. */
  const fix = App.pageFix[mid];
  if (!fix) return 0;
  const 있는자리 = {};
  App.pageRuns[mid].forEach(r => { 있는자리[runKey(r)] = 1; });
  let 버림 = 0;
  Object.keys(fix).forEach(k => {
    /* 옛 열쇠(글자만)는 1번째로 봐서 맞춰 본다 */
    const { n, text } = runOfKey(k);
    if (!있는자리[String(n) + runSep() + text]) { delete fix[k]; 버림++; }
  });
  return 버림;
}

function readPageBtn(mid, label) {
  return '<button class="btn sm" onclick="readOnePage(\'' + esc(mid) + '\')"'
    + (App.reading === mid ? ' disabled' : '') + '>'
    + (App.reading === mid ? '읽는 중…' : esc(label || '이 쪽 다시 읽기')) + '</button>';
}

/* ══════ 쪽 본문 고치기 (대표 지시 「모두 다 — 쪽 본문 안 깨지게」) ══════
   ★ 여기서 고친 글은 «우리 자료가 아니다». 홈페이지에 채울 쪽지가 될 뿐이다.
     그래서 저장하지 않고, 채운 뒤에는 「홈페이지 다시 확인」으로 되읽는다. */
function pageFixOf(mid) { return (App.pageFix[mid] = App.pageFix[mid] || {}); }

/* ── 고친 줄을 담는 열쇠 (대표 지시 2026-09-03 「자물쇄 같이 실물」) ──
   ★ 예전에는 «글자»를 열쇠로 썼다. 그러면 똑같은 줄이 두 군데 있을 때
     두 자리를 갈라 담을 수 없다 — 그래서 자물쇠로 막아 두었던 것이다.
     이제 «몇 번째»를 열쇠에 함께 넣어 자리마다 따로 담는다.
   ★ 가름쇠로  을 쓴다 — 사람이 칠 수 없는 글자라 글줄과 섞일 일이 없다.
     (: 나 | 같은 것을 쓰면 그 글자가 든 줄에서 열쇠가 쪼개진다.) */
/* ⚠ 가름쇠를 const 로 두지 말 것 — 화면 검사가 «함수 단위»로 꺼내 돌리므로
     const 는 딸려오지 않아 「runKey is not defined」로 검사가 통째로 껴진다. */
function runSep() { return ''; }
function runKey(r) { return String(r.n || 1) + runSep() + r.text; }
function runOfKey(k) {
  const i = String(k).indexOf(runSep());
  /* 가름쇠가 없으면 옛 열쇠(글자만) — 1번째로 본다 */
  if (i < 0) return { n: 1, text: String(k) };
  return { n: Number(String(k).slice(0, i)) || 1, text: String(k).slice(i + 1) };
}

function pageFixList(mid) {
  const fix = App.pageFix[mid] || {};
  const runs = (App.pageRuns || {})[mid] || [];
  return Object.keys(fix)
    .map(k => {
      const { n, text } = runOfKey(k);
      const 그줄 = runs.find(r => r.text === text && (r.n || 1) === n);
      /* ★ of 를 함께 실어 보낸다 — 채울 때 «그 사이 홈페이지가 바뀌었나»를
         이것으로 가린다. 없으면 채우개가 옛 규칙(여러 군데면 건너뛰기)으로 돈다. */
      return { before: text, after: String(fix[k]), n: n, of: 그줄 ? 그줄.of : undefined };
    })
    .filter(x => x.after.trim() && x.after !== x.before);
}

/* ══════ 좌우 두 칸 — 왼쪽 홈페이지 화면 (대표 지시 2026-09-03 「듀얼화면 붙여라」) ══════
   ★ 왼쪽에 넣는 것은 «고칠 수 있는 자리»(본문)다. 머리띠·발치는 넣지 않는다 —
     거기 글자는 이 화면에서 못 고치므로, 보여 주면 「왜 안 눌리지」가 된다.
   ★ 쪽의 제 스크립트는 넣지 않는다. 슬라이드·지도가 틀 안에서 돌면 자리가 흔들려
     짝지은 글자가 눈앞에서 움직인다. 꾸밈(CSS)만 가져온다.
   ★ 길을 «진짜 주소»로 돌린다 — 안 돌리면 꾸밈도 사진도 하나도 안 붙어
     「민무늬 맨 글」이 된다(2026-09-03 목업에서 그렇게 나왔다). */
function pageFrameDoc(mid) {
  const 원본 = (App.pageHtml || {})[mid] || '';
  if (!원본) return '';
  const 밑 = PuHomeExport.ORIGIN.replace(/\/+$/, '') + '/' + mid + '/';
  const 머리 = (/<head[^>]*>([\s\S]*?)<\/head>/i.exec(원본) || [, ''])[1];
  const 꾸밈 = (머리.match(/<link[^>]+rel="stylesheet"[^>]*>|<style[^>]*>[\s\S]*?<\/style>/gi) || [])
    .join('\n');
  let 몸 = '';
  try { 몸 = PuHomeFill.markRuns(PuHomeParse.pageBodyHtml(원본)); }
  catch (e) { console.warn('[좌우 두 칸] 표를 못 달았습니다', e); 몸 = ''; }
  return '<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">'
    + '<base href="' + esc(밑) + '">' + 꾸밈
    + '<style>'
    /* 우리가 더하는 꾸밈은 «pu-» 로 시작한다 — 쪽의 이름과 겹치지 않게 */
    + 'html,body{margin:0;padding:12px;background:#fff}'
    + '.pu-run{cursor:pointer;border-radius:3px;'
    + 'box-shadow:0 0 0 1px rgba(217,119,6,.30);background:rgba(253,224,71,.20)}'
    + '.pu-run:hover{background:rgba(253,224,71,.60)}'
    + '.pu-run.pu-on{background:#fde68a;box-shadow:0 0 0 2px #d97706}'
    + '.pu-run.pu-ch{background:#bbf7d0;box-shadow:0 0 0 2px #166534}'
    /* ★ 지도는 «안 그려진다» — 쪽의 스크립트를 일부러 안 넣기 때문이다.
         그대로 두면 큰 빈 칸이 생겨 「왜 비어 있지」가 된다. 자리와 까닭을 적어 둔다.
       ⚠ 지도는 여기서 고치는 것이 아니다 — 그 사실도 함께 말해 준다. */
    + '.root_daum_roughmap{min-height:0!important;height:64px!important;'
    + 'background:#f8fafc;border:1px dashed #cbd5e1;border-radius:8px;'
    + 'display:flex;align-items:center;justify-content:center}'
    + '.root_daum_roughmap::after{content:"지도 자리 — 여기서는 안 고칩니다";'
    + 'color:#94a3b8;font-size:12px}'
    + '.root_daum_roughmap > *{display:none}'
    + '</style></head><body>' + 몸 + '</body></html>';
}

/* 틀 안 문서를 꺼낸다. 못 꺼내면 «조용히» 아무 일도 안 한다 —
   좌우 짝짓기는 덤이지 고치는 일 자체가 아니다. */
function pageFrameDoc안() {
  const f = document.getElementById('pgFrame');
  try { return (f && f.contentDocument) || null; } catch (e) { return null; }
}

function pageFrameReady() {
  const d = pageFrameDoc안();
  if (!d) return;
  /* 왼쪽 글자를 누르면 오른쪽 칸으로 간다 */
  d.addEventListener('click', function (e) {
    const m = e.target && e.target.closest && e.target.closest('.pu-run');
    if (!m) return;
    e.preventDefault();
    const i = Number(m.getAttribute('data-i'));
    const inp = document.querySelector('.rows .l input[data-i="' + i + '"]');
    if (inp) { inp.focus(); inp.select(); }
  }, true);
  /* 이미 고쳐 둔 줄은 «초록»으로 — 다시 열었을 때 무엇을 건드렸는지 보인다 */
  document.querySelectorAll('.rows .l.ch').forEach(function (l) {
    const i = l.getAttribute('data-i');
    const m = d.querySelector('.pu-run[data-i="' + i + '"]');
    const inp = l.querySelector('input');
    if (m && inp) { m.textContent = inp.value; m.classList.add('pu-ch'); }
  });
}
window.pageFrameReady = pageFrameReady;

/* 오른쪽 칸에 들어가면 왼쪽 글자를 켜고 보이는 자리로 굴린다 */
function pageRunFocus(i) {
  const d = pageFrameDoc안();
  if (!d) return;
  d.querySelectorAll('.pu-run.pu-on').forEach(x => x.classList.remove('pu-on'));
  const m = d.querySelector('.pu-run[data-i="' + i + '"]');
  if (!m) return;
  m.classList.add('pu-on');
  try { m.scrollIntoView({ block: 'center' }); } catch (e) { m.scrollIntoView(); }
}
window.pageRunFocus = pageRunFocus;

function pageDualToggle() { App.dualOff = !App.dualOff; App.render(); }
window.pageDualToggle = pageDualToggle;

function pageRunEdit(mid, key, text, val, i) {
  const fix = pageFixOf(mid);
  if (String(val) === text) delete fix[key]; else fix[key] = String(val);
  /* ★ 왼쪽 화면이 «그 자리에서» 함께 바뀐다 — 올리기 전에 결과를 본다.
     ⚠ 글자만 바꾼다. 태그를 건드리면 왼쪽 화면이 무너져 무엇을 보고 있는지 알 수 없게 된다. */
  if (i != null) {
    const d = pageFrameDoc안();
    const m = d && d.querySelector('.pu-run[data-i="' + i + '"]');
    if (m) {
      const 바뀜 = String(val) !== text && String(val).trim();
      m.textContent = 바뀜 ? String(val) : text;
      m.classList.toggle('pu-ch', !!바뀜);
    }
    const 줄 = document.querySelector('.rows .l[data-i="' + i + '"]');
    if (줄) 줄.classList.toggle('ch', String(val) !== text && !!String(val).trim());
  }
  /* ★ 다시 그리지 않는다 — 글을 치는 중에 다시 그리면 커서가 맨 앞으로 튄다.
     단추의 숫자만 손으로 갈아 끼운다. */
  const b = document.getElementById('pfixBtn');
  if (b) {
    const n = pageFixList(mid).length;
    b.disabled = !n;
    b.textContent = n ? ('홈페이지에 채우기용 복사 (' + n + '줄)') : '고친 줄이 없습니다';
  }
}
window.pageRunEdit = pageRunEdit;

function resetPageFix(mid) {
  App.pageFix[mid] = {};
  App.render();
  toast('고친 줄을 모두 되돌렸습니다.');
}
window.resetPageFix = resetPageFix;

/* 「홈페이지에 채우기용 복사」 — 쪽지를 만들어 클립보드에 담고, 순서를 알려 준다. */

    + '</ol><div class="sub" style="margin-top:5px">'

    + '원래 글을 못 찾은 줄은 <b>건너뛰고 무엇을 건너뛰었는지 알려 줍니다</b> — '
    + '그 사이 남이 고친 글을 덮지 않기 위해서입니다.</div></div>';

    '<span class="sub" style="align-self:center">편집 화면 대신 그냥 홈페이지가 뜨면 먼저 로그인</span></div>';

window.copyPageFix = copyPageFix;

function pageLinesHtml(mid) {
  const lines = (App.pageLines || {})[mid];
  if (!Array.isArray(lines)) {
    /* 없는 줄을 빈 줄로 지어내 보여 드리지 않는다 — 대신 «읽어오는 단추»를 준다 */
    return '<div class="fld"><label>홈페이지 화면 — 아직 안 읽었습니다'
      + '<span style="flex:1"></span>' + readPageBtn(mid, '이 쪽 읽어오기') + '</label>'
      + '<div class="note1 plain"><div>'
      + '홈페이지에 <b>어떻게 보이는지</b> 보시려면 위 <b>이 쪽 읽어오기</b>(또는 머리띠의 '
      + '<b>홈페이지 다시 확인</b>)를 누르십시오.</div></div></div>';
  }
  if (!lines.length) {
    return '<div class="fld"><label>홈페이지 화면 — 본문 줄을 못 찾았습니다'
      + '<span style="flex:1"></span>' + readPageBtn(mid) + '</label>'
      + '<div class="note1 rm plain"><div>홈페이지는 읽었지만 이 쪽에서 '
      + '«본문 줄»을 찾지 못했습니다 — 게시판형 쪽이거나 화면 구조가 바뀐 것일 수 있습니다. '
      + '아래 대조 기준 글자는 그대로 씁니다.</div></div></div>';
  }
  /* ★ 줄마다 «생김새»를 달리한다 (5차 지시 ③ — 「줄 변화 없이 너무 일률적이다」).
     쪽 제목·구획번호(01 02)·연락처가 본문과 같은 모양이면 어디가 어디인지 알 수 없다.
     ★ 꾸밈은 «CSS 이름»으로만 붙인다. 줄 글자에 표시를 덧붙이면 그 표시가 자료로 흘러
       홈페이지에 찍힌다. 줄 글자는 읽어온 그대로만 보여준다. */
  const kindOf = t => {
    if (/^\d{1,2}$/.test(t)) return ' sec';                     // 01 02 같은 구획번호
    if (/^(T\.|F\.|E\.|Tel|Fax|전화|팩스)/i.test(t)) return ' tel';   // 연락처 줄
    if (t.length <= 16 && !/\s/.test(t)) return ' head';        // 자문서비스·법률자문·천안본사
    return '';
  };
  /* ★ 줄을 «고칠 수 있게» 한다 (대표 지시 「모두 다 — 쪽 본문 안 깨지게」).
     보여주는 줄(pageLines)과 고치는 줄(pageRuns)은 같은 자리에서 나오지만 나누는 결이
     다르다 — 굵은 글씨처럼 줄 안에 태그가 끼면 고치는 줄이 더 잘게 나뉜다.
     ★ 잘게 나뉜 쪽을 «고치는 줄»로 삼는다. 갈아 끼울 수 있는 것이 그 단위이기 때문이다.
       (뭉쳐 보여 주고 잘게 채우면, 고친 줄이 조용히 안 채워진다.) */
  const runs = (App.pageRuns || {})[mid];
  if (!Array.isArray(runs) || !runs.length) {
    return '<div class="fld"><label>홈페이지 화면 — ' + lines.length + '줄'
      + '<span style="flex:1"></span>' + readPageBtn(mid) + '</label>'
      + '<div class="rows">' + lines.map((l, i) =>
          '<div class="l' + kindOf(String(l)) + '"><span class="n">' + (i + 1) + '</span>'
          + '<span class="t">' + esc(l) + '</span></div>').join('')
      + '</div></div>';
  }
  const fix = App.pageFix[mid] || {};
  const 고친수 = pageFixList(mid).length;
  /* ★ 자물쇠가 사라졌다 (2026-09-03) — 똑같은 줄도 «몇 번째»를 골라 고친다.
     대신 그런 줄이 몇 개인지는 알려 준다: 「1/2」 딱지가 붙은 줄이 그것이다. */
  const 겹친줄 = runs.filter(r => r.of > 1).length;
  /* ══ 좌우 두 칸 (대표 지시 2026-09-03 「듀얼화면 붙여라」) ══════════════════
     승인 목업: docs/mockups/home-page-dual.html
     왼쪽에 «진짜 홈페이지 화면», 오른쪽에 «그 줄의 칸». 한 화면에서 보며 고친다.
     ★ 왜 필요했나 — 대표 지적 「설명하면 판단이 너무어렵다 … 한화면 보면서 직접
       고치면된다 … 연결되어 정리되면 수정도 어렵고 뭐가 잘못되었는지 알지도 못한다」.
     ★ 왼쪽은 «틀(iframe)»에 넣는다. 이 화면에 그대로 끼우면 홈페이지의 꾸밈이
       푸른토탈 화면을 통째로 망가뜨린다(body·h1·.btn 같은 이름이 겹친다). */
  /* ★ 줄을 «항목»으로 묶어 보여 준다 (대표 결정 2026-09-06 ㉰).
     홈페이지가 「01 / 법률자문 / 설명…」 짜임인데 화면은 줄만 죽 세워, 어디서 어디까지가
     한 업무인지 알 수 없었다(대표 지적 「구분이 어렵다」).
     ★ 묶는 자리를 «지어내지 않는다» — 「01」 같은 번호 줄이 나오면 거기서 새 항목이
       시작되는 것으로 본다. 홈페이지가 실제로 그렇게 되어 있다.
     ⚠ 묶는 것은 «보여 주는 방식»일 뿐이다. 홈페이지에 채우는 단위는 여전히 «줄»이다 —
       통째로 갈아 끼우면 지도·표·구획이 깨진다. 아래 input 은 그대로 줄 하나씩이다. */
  const 항목머리 = (i) => {
    if (!/^\d{1,2}$/.test(String(runs[i].text || ''))) return '';
    const 제목 = (runs[i + 1] && String(runs[i + 1].text || '').trim()) || '';
    return '<div class="grp"><span class="gn">' + esc(runs[i].text) + '</span>'
      + (제목 ? '<span class="gt">' + esc(제목) + '</span>' : '') + '</div>';
  };
  const 항목수 = runs.filter(r => /^\d{1,2}$/.test(String(r.text || ''))).length;

  return '<div class="fld"><label>홈페이지 화면 — '
    + (항목수 ? '업무 ' + 항목수 + '개 · ' : '') + runs.length + '줄'
    + '<span class="tip">왼쪽 글자를 누르면 오른쪽 칸으로 갑니다</span>'
    + '<span style="flex:1"></span>'
    + '<button class="btn sm" onclick="pageDualToggle()">'
    + (App.dualOff ? '좌우로 보기' : '한 칸으로 보기') + '</button>'
    + readPageBtn(mid) + '</label>'
    + '<div class="dual' + (App.dualOff ? ' off' : '') + '">'
    + (App.dualOff ? '' :
        '<div class="dl"><iframe id="pgFrame" title="홈페이지 화면"'
        + ' sandbox="allow-same-origin" srcdoc="' + esc(pageFrameDoc(mid)) + '"'
        + ' onload="pageFrameReady()"></iframe></div>')
    + '<div class="dr">'
    + '<div class="rows">' + runs.map((r, i) => {
        const key = runKey(r);
        const now = fix[key] != null ? fix[key] : r.text;
        const 바뀜 = String(now) !== r.text && String(now).trim();
        /* ★ 똑같은 줄이 여럿이면 «몇 번째»인지 보여 준다 (대표 지시 2026-09-03).
           예전에는 자물쇠를 걸어 아예 못 고치게 했는데, 오시는길에서는 그게 절반이었다.
           이제 자리마다 따로 고치므로, 사람이 «어느 자리인지» 알아야 한다. */
        const 차례 = (r.of > 1)
          ? '<span class="nth" title="이 쪽에 똑같은 글이 ' + r.of + '군데 있습니다 —'
            + ' 지금 고치는 것은 ' + r.n + '번째입니다">' + r.n + '/' + r.of + '</span>'
          : '';
        return 항목머리(i)
          + '<div class="l' + kindOf(r.text) + (바뀜 ? ' ch' : '')
          + (r.of > 1 ? ' dup' : '')
          + '" data-i="' + i + '"><span class="n">' + (i + 1) + '</span>' + 차례
          /* ★ 원래 글자와 «열쇠»를 그대로 실어 보낸다 — 이것이 홈페이지에서 자리를 찾는 실마리다.
             따옴표·꺾쇠가 든 줄이 있으므로 JSON 으로 싸고 HTML 로 한 번 더 감싼다.
             ★ data-i 는 «왼쪽 화면의 그 글자»와 짝짓는 번호다(markRuns 가 단 표와 같다). */
          + '<input class="t" value="' + esc(now) + '" spellcheck="false" data-i="' + i + '"'
          + ' onfocus="pageRunFocus(' + i + ')"'
          + ' oninput="pageRunEdit(\'' + esc(mid) + '\',' + esc(JSON.stringify(key))
          + ',' + esc(JSON.stringify(r.text)) + ',this.value,' + i + ')">'
          + '</div>';
      }).join('')
    + '</div>'
    + '</div></div>'
    + '<div class="pfixbar">'
    + '<button class="btn pri sm" id="pfixBtn" onclick="copyPageFix(\'' + esc(mid) + '\')"'
    + (고친수 ? '' : ' disabled') + '>'
    + (고친수 ? '홈페이지에 채우기용 복사 (' + 고친수 + '줄)' : '고친 줄이 없습니다') + '</button>'
    + (고친수 ? '<button class="btn sm" onclick="publishPage(\'' + esc(mid) + '\')"'
               + (App.publishing ? ' disabled' : '')
               + ' title="새 홈페이지(미리보기)에 고친 줄만 갈아 끼워 올립니다">'
               + (App.publishing ? '올리는 중…' : '새 홈페이지에 올리기 (' + 고친수 + '줄)')
               + '</button>' : '')
    + (고친수 ? '<button class="btn sm" onclick="resetPageFix(\'' + esc(mid)
               + '\')">고친 줄 되돌리기</button>' : '')
    + '<span class="tip" style="flex:1">고친 줄만 갈아 끼웁니다 — 지도·표·구획은 그대로입니다. '
    + '저장은 홈페이지에서 사람이 누릅니다.</span></div>'
    + '<div class="legend2"><span><b class="k-head">굵은 남색</b> 쪽 제목·소제목</span>'
    + '<span><b class="k-sec">주황 숫자</b> 구획(01·02)</span>'
    + '<span class="k-tel">회색 연락처</span>'
    + (겹친줄 ? '<span><b class="nth">1/2</b> ' + 겹친줄
        + '줄 — 똑같은 글이 여럿입니다. 딱지의 숫자가 «몇 번째»인지입니다</span>' : '')
    + '</div></div>';
}

/* 기준 글자를 «홈페이지에서 읽어온 줄»로 나눈다 (5차 지시).
   ★ 나누는 자리를 지어내지 않는다 — 홈페이지 줄 그대로다. 읽지 않았으면 나누지 않고
     왜 못 하는지 말한다. 「T.」·「F.」 같은 표시로 끊으면 쪽마다 엉뚱한 데서 끊긴다.
   ★ 글자 자체가 달라질 수 있다(홈페이지 글로 채워지므로). 지금 글자와 «뜻이 다를 때만»
     물어본다 — 같은 글을 줄만 나누는 것은 물어볼 일이 아니다.
   ★ 초안만 고친다. 「대조 기준 저장」을 눌러야 자료에 남는다. */
async function splitByLive() {
  const d = App.draft;
  if (!d || d.kind !== 'page') return;
  const lines = (App.pageLines || {})[d.key];
  if (!Array.isArray(lines) || !lines.length) {
    await say('아직 홈페이지를 읽지 않았습니다',
      '위 「홈페이지 다시 확인」을 누르면 홈페이지에서 읽어온 «줄 모양»으로 나눠 드립니다. '
      + '없는 줄을 지어내 나누지는 않습니다 — 엉뚱한 데서 끊으면 확인이 더 어려워집니다.');
    return;
  }
  const next = lines.join('\n');
  const same = PuHomeParse.tidy(next) === PuHomeParse.tidy(d.text || '');
  if (!same && String(d.text || '').trim()) {
    const ok = await askYes('지금 기준 글자와 홈페이지 글이 다릅니다',
      '홈페이지에서 읽어온 줄로 채우면 지금 기준 글자는 «홈페이지 글»로 바뀝니다. '
      + '줄만 나누는 것이 아니라 내용도 홈페이지 것이 됩니다.\n'
      + '(「대조 기준 저장」을 눌러야 자료에 남고, 「되돌리기」로 되살릴 수 있습니다.)',
      '홈페이지 글로 채우기');
    if (!ok) return;
  }
  d.text = next;
  App.dirty = true;
  App.render();
  toast(lines.length + '줄로 나눴습니다. 확인하신 뒤 「대조 기준 저장」을 누르십시오.'
    + (same ? '' : ' 내용도 홈페이지 글로 바뀌었습니다.'));
}
window.splitByLive = splitByLive;

function pageEdit(d) {
  const rec = App.pages[d.key] || {};
  const url = PuHomeExport.editUrl('page', d.key);
  /* 쪽 갈래도 구성원과 «같은 틀»이다 — 머리 고정, 가운데만 구름, 발 고정.
     갈래를 옮겨도 단추가 같은 자리에 있어 틀이 안 흔들린다. */
  let h = '<div class="edit">';
  /* 한 줄 + 접기 (5차 지시 ②) — 네 줄짜리 띠를 쪽마다 매번 읽지 않는다.
     이유는 없애지 않고 「왜 안 되나」에 접어 둔다. */
  h += '<div class="ehd">' + noteOneLine(
        '<b>줄을 하나씩</b> 고쳐 홈페이지에 채웁니다 — 지도·표·구획은 그대로입니다.',
        pagePasteWhy(), '통째로는 왜 안 되나') + '</div>';
  h += '<div class="esc">';
  h += pageLinesHtml(d.key);
  /* ★ 편집칸은 «읽기 전용으로 만들지 않았다». 이 글자는 대조 기준값이라, 홈페이지를 직접
     고친 뒤 기준값도 맞춰 주지 않으면 딱지가 영영 「안 올라감」에 묶인다. 고칠 길을 없애면
     그 묶인 상태를 풀 방법이 사라진다. 대신 «홈페이지로 가지 않는다»고 칸 이름에 못 박는다. */
  /* ★ 5차 지시 — 「한 줄로 이어져 있으면 확인이 어렵고 수정도 어렵다」.
     기준 글자는 홈페이지에서 태그를 걷고 줄을 뭉쳐 만든 것이라 한 줄 275자짜리 덩어리다.
     ★ 줄바꿈을 넣어도 «대조는 그대로»다 — 대조는 공백을 뭉쳐 견준다
       (PuHomeParse.tidy 가 \s+ 를 한 칸으로 바꾼 뒤 견준다. 우리 글자와 홈페이지 글자
       양쪽에 똑같이 걸린다). 그래서 읽기 좋게 나눠도 딱지가 「안 올라감」에 묶이지 않는다.
     ★ 나누는 자리는 «지어내지 않는다». 홈페이지에서 읽어온 줄 그대로만 쓴다 —
       엉뚱한 데서 끊으면 확인이 더 어려워진다. */
  /* ★ 대조 기준 글자는 «접어» 둔다 (대표 결정 2026-09-06 ㉯).
     이것은 태그를 걷고 줄을 뭉쳐 만든 «기계가 견주는 값»이다. 사람이 읽을 글이 아닌데
     화면 한복판에 가장 크게 있어, 그것이 편집칸인 줄 알게 됐다
     (대표 지적 「이렇게 보면 전혀 확인이 안 되고 구분이 어렵다」).
     ⚠ 없애지는 «않는다» — 홈페이지를 직접 고친 뒤 기준값을 맞춰 주지 않으면 딱지가
       영영 「안 올라감」에 묶이고, 그것을 푸는 유일한 길이 이 칸이다. */
  const 줄있음 = Array.isArray((App.pageLines || {})[d.key]) && App.pageLines[d.key].length > 0;
  h += '<details class="why1"><summary>대조 기준 글자 (/' + esc(d.key) + ')'
    + ' — 기계가 견주는 값입니다. 평소엔 안 보셔도 됩니다</summary><div class="w">'
    + '<div class="fld"><label><span class="tip">홈페이지로 가지 않습니다 · 줄바꿈은 대조에 영향 없음</span>'
    + '<span style="flex:1"></span>'
    + '<button class="btn sm" onclick="splitByLive()"' + (줄있음 ? '' : ' disabled')
    + ' title="' + (줄있음 ? '홈페이지에서 읽어온 줄 그대로 나눕니다'
                          : '먼저 위 「이 쪽 읽어오기」를 눌러야 줄 모양을 알 수 있습니다')
    + '">홈페이지 줄 모양으로 나누기'
    + (줄있음 ? ' (' + App.pageLines[d.key].length + '줄)' : '') + '</button></label>'
    + '<textarea rows="9" oninput="fieldEdit(\'text\',this.value)">' + esc(d.text) + '</textarea></div>'
    + '</div></details>';
  /* 「고치는 순서」는 접어 둔다 — 한 번 익히면 매번 읽을 글이 아니다 */
  h += '<details class="why1"><summary>이 쪽을 고치는 순서</summary><div class="w"><ol>'
    + '<li>위 <b>홈페이지 화면</b> 칸에서 <b>고칠 줄을 그 자리에서 고친다</b> → '
    + '<b>홈페이지에 채우기용 복사</b> → 홈페이지 편집 화면에서 <b>★ 푸른ERP 쪽 채우기</b> → <b>저장</b>'
    + ' <span class="sub">(홈페이지 관리자 화면에서 직접 고치셔도 됩니다)</span></li>'
    + '<li>돌아와 <b>홈페이지 다시 확인</b> → 딱지가 「안 올라감」으로 바뀝니다</li>'
    + '<li>바꾼 내용을 그대로 두려면 <b>대조 기준 글자</b>를 홈페이지와 맞춘 뒤 <b>대조 기준 저장</b> — '
    + '<b>대조 기준 저장만으로는 딱지가 바뀌지 않습니다.</b> 그 뒤 <b>홈페이지 다시 확인</b>을 '
    + '한 번 더 눌러야 「같음」이 됩니다</li>'
    + '</ol></div></details>';

  const 분리가능 = canDetachPage(d.key);
  h += '</div>';   // .esc 끝

  /* 「목록에서 분리」 — ★ 홈페이지 쪽을 지우는 것이 아니라고 «단추에» 적어 둔다.
     「분리」를 «홈페이지에서 없애기»로 읽으면 지워진 줄 알고 확인을 안 하게 된다.
     설명 덩어리를 늘 띄우는 대신 단추에 붙여, 누르기 직전에 읽히게 한다. */
  h += '<div class="eft">'
    + '<button class="btn" onclick="saveDraft()">대조 기준 저장</button>'
    + '<button class="btn" onclick="openHistory()">되돌리기</button>'
    + (분리가능 ? '<button class="btn" onclick="detachPage(\'' + esc(d.key) + '\')"'
                + ' title="홈페이지 쪽을 지우지 않습니다 — 통합시스템이 이 쪽을 더 이상 대조하지 않는다는'
                + ' 뜻입니다. 홈페이지에서 없애는 것은 관리자 화면에서 사람이 합니다.">'
                + '목록에서 분리</button>' : '')
    + '<span id="dirtyMark" style="color:var(--bad);font-size:12px;font-weight:700">' + (App.dirty ? '● 저장 안 됨' : '') + '</span>'
    + '<span style="flex:1"></span>'
    + (url ? '<a class="btn pri" style="text-decoration:none" href="' + esc(url) + '" target="_blank" rel="noopener">'
             + '홈페이지에서 이 쪽 열기</a>' : '')
    + '<span class="sub">' + (rec.updatedAt ? '마지막 수정: ' + esc(stamp(rec.updatedAt)) + ' · ' + esc(rec.updatedBy || '') : '수정 기록 없음') + '</span>'
    + '</div>';
  return h + '</div>';
}

/* 딱지 안내 — 앱 맨 아래 한 줄. 명부 딱지와 대조 딱지가 «다른 것»임을 여기서 밝힌다. */
/* ★ 5차 지시 ② — 맨 아래 줄에 딱지 아홉 개와 설명 두 줄이 늘 깔려 있었다.
   딱지 뜻은 «목록 위 걸러 보기 딱지»에 그대로 있고(거기서 누르면 걸러진다), 그 딱지들이
   화면에 이미 색으로 붙어 있다. 여기서는 «한 번만 알면 되는 두 가지»만 남긴다:
     ⓐ 대조 딱지는 저절로 돌지 않는다 ⓑ 홈페이지는 자동으로 바뀌지 않는다.
   딱지 뜻 전체는 접어 둔다 — 처음 쓰는 사람은 펼쳐 보면 된다. */
function legendHtml() {
  return '<div class="legend">'
    + '<details class="why1" style="margin:0;padding:2px 8px;background:#fff;border:0">'
    + '<summary style="font-size:11.5px">딱지 뜻 보기</summary><div class="w">'
    + '<span class="pill rm">퇴사 (명부)</span> <span class="pill ask">명부에 없음</span> '
    + '<span class="pill keep">남김</span> ← 명부만 보고 붙습니다 (화면을 열면 바로)<br>'
    + ['same', 'pending', 'toAdd', 'toRemove', 'liveOnly', 'done']
        .map(s => '<span class="pill ' + s + '">' + esc(STATUS_TEXT[s]) + '</span>').join(' ')
    + ' ← 「홈페이지 다시 확인」을 누를 때만 새로 붙습니다</div></details>'
    + '<span class="sub">대조 딱지는 <b>확인을 누를 때만</b> 새로 붙습니다 — 저절로 돌지 않습니다.</span>'
    + '<span style="flex:1"></span>'
    + '<span class="sub">홈페이지는 자동으로 바뀌지 않습니다 — 붙여넣기 한 번은 사람이 합니다.</span>'
    + '</div>';
}
</script>
