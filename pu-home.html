async function restoreFrom(histKey, ts) {
  const d = App.draft;
  if (!d) return;
  const yes = await askYes('이 시점의 내용으로 되살릴까요?',
    '지금 내용은 이력에 남습니다. 홈페이지는 그대로이며, 되살린 뒤 <b>다시 붙여넣어야</b> 바뀝니다.',
    '되살리기');
  if (!yes) return;
  try {
    const snap = await db.ref('homepage/history/' + histKey + '/' + ts + '/before').once('value');
    const before = snap.val();
    if (!before) { await say('되살릴 내용을 찾지 못했습니다', '이 시점의 이력이 비어 있습니다.'); return; }
    // 되살리기도 저장이다 — saveRecord 를 그대로 써서 되살리기 «직전» 값도 이력에 남긴다.
    if (d.kind === 'member') {
      const next = { name: before.name || '', position1: before.position1 || '', position2: before.position2 || '',
                     intro: before.intro || '', srl: before.srl || '', careers: (before.careers || []).slice() };
      /* 되돌리기는 «내용»을 되살리는 것이다. 「홈페이지에 남기기」는 내용이 아니라 사람이
         내린 판단이므로 «지금 것»을 그대로 둔다 — 되살리기 한 번에 예외가 사라지면
         퇴사 경고가 다시 쏟아지고, 왜 그런지 알 길이 없다. */
      const kept = (App.members[d.key] || {}).keepOnSite;
      if (kept) next.keepOnSite = kept;
      await saveRecord('member', d.key, next);
      App.members[d.key] = Object.assign({}, next);
    } else {
      const next = { text: before.text || '' };
      await saveRecord('page', d.key, next);
      App.pages[d.key] = Object.assign({}, next);
    }
    markChanged(d.kind, d.key);
    loadDraft();
    closeModal();
    App.render();
    toast('되살렸습니다. 홈페이지는 다시 붙여넣어야 바뀝니다.');
  } catch (e) {
    await say('되살리지 못했습니다', esc((e && e.message) || e));
  }
}
window.restoreFrom = restoreFrom;

/* ══════ 경력관리에서 당겨오기 ══════
   경력관리(kcareer)는 사람마다 «자기 계정»에 자료를 둔다. 그래서 남의 자료는
   규칙이 막을 수 있다 — 막히면 그 사람만 건너뛰고 화면에 알린다. */
/* era — 줄마다 사람이 고른 앞한자. 안 적힌 줄은 «자동»(pullAutoEra)이 첫 값이다.
   ⚠ 「안 적힘」과 「없음으로 골랐음」을 갈라야 한다. 둘 다 '' 로 두면 자동이 現 인
     줄에서 «없음을 고른 것이 자동으로 되돌아간다» — 그래서 undefined 로 가른다. */
const Pull = { open: false, kind: 'wiccok', items: {}, sel: {}, era: {}, err: '', name: '' };

function careerKindOf(key) {
  const hit = CAREER_KINDS.filter(k => k.key === key);
  return hit.length ? hit[0] : null;
}

/* 이 갈래가 경력관리 표에 «기간» 칸을 실제로 가지고 있는지. 없는 갈래(자격증·수료증·강의)는
   기간을 몰라서가 아니라 애초에 기간이라는 개념이 없어 늘 unknown 이 뜬다 — 그 갈래에는
   「기간 모름」 꼬리표를 붙이지 않는다. */
function kindHasPeriod(key) {
  const k = careerKindOf(key);
  return !!(k && k.hasPeriod);
}

/* ══ 前/現 고르개 (대표 지시 2026-09-03 「전, 현 한자를 선택해야할 경우가 많다.
     이부분은 경력관리와 연결해서 선택하고 전현도 선택할 수 있게 해달라」) ══════════
   승인받은 목업: docs/mockups/home-career-eraprefix.html

   ★ 한 벌만 만든다 — 두 자리(경력사항 줄 · 가져오기 창)가 같은 것을 쓴다.
     두 벌로 만들면 한쪽만 고쳐져 「대표 화면은 그대로」가 된다(2026-09-02 그 일).
   ★ 세 자리다: 現 · 前 · 없음. 켜진 것을 다시 누르면 «없음»으로 돌아간다.
   ⚠ 덧창의 <label class="pk"> 안에서도 쓴다 — 딱지를 누르면 label 이 체크를
     뒤집어 버리므로 기본 동작을 막는다. 단추의 onclick 은 그보다 먼저 돈다.
   ⚠ type="button" — form 이 없어도 붙여 둔다. 나중에 form 안에 들어가면 «저장»이 아니라
     제출이 되어 화면이 새로 뜬다(고른 것이 통째로 사라진다). */
function eraPickHtml(era, 부름꼴) {
  const 단추 = (k, cls) => '<button type="button" class="' + cls + (era === k ? ' on' : '') + '"'
    + ' title="' + (k === 'now' ? '現' : '前') + ' 으로 (다시 누르면 없음)"'
    + ' onclick="' + 부름꼴(k) + '">' + (k === 'now' ? '現' : '前') + '</button>';
  return '<span class="era" onclick="event.preventDefault()">'
    + 단추('now', '') + 단추('past', 'past') + '</span>';
}

/* 전현이 «있을 만한» 줄 — 안 골랐으면 눈에 띄게 한다. 이 말이 없는 줄
   (학력·자격증)에는 안 고른 것이 잘못이 아니므로 조르지 않는다. */
const ERA_LIKELY = /(위원|대표|자문|위촉|이사|감사|고문)/;

/* ── 가져올 때의 앞한자 «첫 값» ──
   ★ 위촉장만 기간으로 現/前 을 가른다. 지금까지와 같다.
   ★ 나머지(학력·자격증·수료증·강의)는 «없음»으로 둔다. 여태 「現 공인노무사」·
     「前 고려대학교 노동대학원 졸업」처럼 들어가서 사람이 늘 손으로 지웠다 —
     실제 홈페이지의 학력·자격증 줄에는 한자가 하나도 안 붙어 있다(목업 규칙 ⑤).
   ★ 자동은 «첫 값»일 뿐이다 — 어느 것이든 딱지를 눌러 바꿀 수 있다(목업 규칙 ④). */
const ERA_AUTO_KINDS = { wiccok: true };
function pullAutoEra(kind, line) {
  if (!ERA_AUTO_KINDS[kind]) return '';
  return line.ended ? 'past' : 'now';
}
/* 지금 이 줄에 걸린 앞한자 — 사람이 고른 것이 있으면 그것, 없으면 자동 */
/* ⚠ era 칸이 아예 없을 수도 있다(옛 상태 객체·다른 데서 Pull 을 새로 만든 경우).
   그때는 «자동»으로 물러선다 — 딱지 하나 때문에 가져오기 창이 통째로 죽으면 안 된다. */
function pullEraOf(kind, i, line) {
  const v = (Pull.era || {})[kind + ':' + i];
  return v === undefined ? pullAutoEra(kind, line) : v;
}
function pullEra(kind, i, era) {
  const it = (Pull.items[kind] || [])[i];
  if (!it) return;
  const line = PuHomeCareer.toLine(toCareerItem(it, kind), todayString());
  const 지금 = pullEraOf(kind, i, line);
  if (!Pull.era) Pull.era = {};
  Pull.era[kind + ':' + i] = (지금 === era ? '' : era);
  /* 목록만 갈아 끼운다 — 창을 통째로 다시 그리면 찾는 칸의 커서가 맨 앞으로 튄다 */
  const 통 = document.getElementById('pullList');
  if (통) 통.innerHTML = pullListHtml(todayString()); else renderPull();
}
window.pullEra = pullEra;

/* 읽어야 할 «저장통» 목록. 자격증과 수료증은 같은 통(cert)이라 한 번만 읽는다. */
function kcareerStores() {
  const seen = {};
  CAREER_KINDS.forEach(k => { seen[k.store] = true; });
  return Object.keys(seen);
}

/* 저장통 → 갈래. 한 통(cert)에서 자격증과 수료증이 제목으로 갈린다. */
function splitByKind(stores) {
  const out = {};
  CAREER_KINDS.forEach(k => {
    const rows = Array.isArray((stores || {})[k.store]) ? stores[k.store] : [];
    out[k.key] = k.keep ? rows.filter(k.keep) : rows.slice();
  });
  return out;
}

function kcareerFromLocal() {
  /* 같은 주소(origin)에서 도는 앱이라 «내» 경력관리 자료는 이 브라우저에 그대로 있다.
     서버 규칙이 남의 자료를 막아도 내 것은 이 길로 읽힌다.
     ★ 읽는 이름은 «갈래»가 아니라 «저장통»이다 — cm3_license 는 존재하지 않는다. */
  const stores = {};
  kcareerStores().forEach(name => {
    try { stores[name] = JSON.parse(localStorage.getItem(KCAREER_NS + name) || '[]') || []; }
    catch (e) { stores[name] = []; }
  });
  return splitByKind(stores);
}

function kcareerFromDb(uid) {
  /* 클라우드 사본(kcareer/{uid}/ls)도 «cm3_ 를 뗀 저장통 이름»으로 들어 있다
     (kcareer.html fbGatherLS 가 이름표만 떼서 올린다). 갈래 이름으로 찾으면 늘 빈손이다. */
  return db.ref('kcareer/' + uid + '/ls').once('value').then(s => {
    const ls = s.val() || {};
    const stores = {};
    kcareerStores().forEach(name => {
      try { stores[name] = JSON.parse(ls[name] || '[]') || []; }
      catch (e) { stores[name] = []; }
    });
    return splitByKind(stores);
  });
}

/* 이름 → 사번 → 계정(uid). 한 번도 로그인 안 한 사람은 uid 가 없다.
   ★ 「못 읽었다」와 「그런 사람이 없다」를 «갈라서» 돌려준다. 둘 다 null 로 삼켜 같은 말을
     하면, 규칙이 막은 것을 사람이 없는 것으로 알고 엉뚱한 데(이름 철자)를 고치게 된다. */
function uidOfName(name) {
  const want = String(name || '').trim();
  return readRosterSource().then(r => {
    if (!r || !r.list) return { uid: null, why: 'rosterFail' };
    const hits = r.list.filter(u => u && String(u.name || '').trim() === want);
    if (!hits.length) return { uid: null, why: 'noName' };
    if (hits.length > 1) return { uid: null, why: 'dupName' };
    const sid = hits[0].sid;
    return db.ref('uid_roles').once('value').then(s => {
      const v = s.val() || {};
      let best = null;
      Object.keys(v).forEach(uid => {
        const r2 = v[uid];
        if (!r2 || r2.sid !== sid) return;
        if (!best || (r2.updatedAt || 0) > best.t) best = { uid: uid, t: r2.updatedAt || 0 };
      });
      return best ? { uid: best.uid, why: 'ok' } : { uid: null, why: 'noAccount' };
    }, e => {
      console.warn('[계정 목록]', e && e.code);
      return { uid: null, why: 'rolesFail', code: (e && e.code) || '' };
    });
  });
}

/* 위 why 를 사람 말로. 못 읽은 것과 없는 것을 서로 다른 문장으로 적는다. */
function uidFailText(name, r) {
  const who = '「' + name + '」';
  switch (r && r.why) {
    case 'noName':
      return '푸른ERP 직원 명부에 ' + who + ' 이름이 없습니다 — 이름 철자가 다를 수 있습니다.';
    case 'dupName':
      return '푸른ERP 직원 명부에 ' + who + ' 이름이 둘 이상이라 누구 것인지 단정할 수 없습니다 (동명이인).';
    case 'noAccount':
      return who + ' 님은 아직 통합시스템에 로그인한 적이 없어 계정(uid)이 없습니다 — 자료를 당겨올 곳이 없습니다.';
    case 'rosterFail':
      return '직원 명부를 «읽지 못했습니다» — ' + who + ' 님이 없다는 뜻이 아닙니다. '
        + '권한이나 그물 문제일 수 있으니 잠시 뒤 다시 눌러 주십시오.';
    case 'rolesFail':
      return '계정 목록(uid_roles)을 «읽지 못했습니다»' + (r && r.code ? '(' + r.code + ')' : '')
        + ' — ' + who + ' 님이 없다는 뜻이 아닙니다.';
    default:
      return who + ' 님의 계정을 찾지 못했습니다.';
  }
}

/* 갈래를 통틀어 몇 건이나 읽혔는지 — 「0건」과 「못 읽음」을 가르는 데 쓴다 */
function careerCount(items) {
  return CAREER_KINDS.reduce((n, k) => n + (((items || {})[k.key]) || []).length, 0);
}

function openPull() {
  const d = App.draft;
  if (!d || d.kind !== 'member') return;
  Pull.open = true; Pull.kind = 'wiccok'; Pull.items = {}; Pull.sel = {}; Pull.era = {};
  Pull.err = ''; Pull.name = d.name;
  openModal('<h2>경력관리에서 가져오기</h2><div class="sub">경력관리 자료를 읽고 있습니다…</div>');

  uidOfName(d.name).then(r => {
    const uid = r && r.uid;
    const myUid = (App.me && App.me.uid) || '';
    if (uid && uid === myUid) {
      /* ★ 내 것은 먼저 이 브라우저(localStorage)에서 본다. 다만 이 브라우저에서 경력관리를
         한 번도 안 열었으면 로컬이 «비어 있다» — 그걸 「없다」고 하면 거짓말이 된다.
         경력관리가 밀어 넣은 클라우드 사본(kcareer/{uid}/ls)을 한 번 더 보고 나서 말한다.
         (규칙상 kcareer/$uid 는 본인만 읽을 수 있으니 내 것은 이 길로 읽힌다.) */
      const local = kcareerFromLocal();
      if (careerCount(local) > 0) { Pull.items = 경력차례(local); renderPull(); return null; }
      return kcareerFromDb(uid).then(items => {
        Pull.items = 경력차례(items);
        if (careerCount(items) === 0) {
          Pull.err = '이 브라우저에도, 경력관리 클라우드 사본에도 자료가 없습니다 — '
            + '경력관리(kcareer.html)를 열어 «클라우드 저장»을 한 번 눌러 주십시오.';
        }
        renderPull();
      }).catch(e => {
        console.warn('[경력관리 클라우드]', e && e.code);
        Pull.items = 경력차례(local);
        Pull.err = '이 브라우저에 경력관리 자료가 없고, 클라우드 사본도 «읽지 못했습니다»'
          + (e && e.code ? '(' + e.code + ')' : '') + ' — 자료가 없다는 뜻이 아닙니다.';
        renderPull();
      });
    }
    if (!uid) {
      Pull.err = uidFailText(d.name, r);
      Pull.items = {};
      renderPull();
      return null;
    }
    return kcareerFromDb(uid).then(items => { Pull.items = 경력차례(items); renderPull(); }).catch(e => {
      Pull.err = '「' + d.name + '」 님의 경력관리 자료를 읽지 못했습니다. '
        + '경력관리 자료는 본인 계정에만 열려 있어, 본인이 직접 뽑아 주셔야 합니다.';
      Pull.items = {};
      renderPull();
    });
  }).catch(e => {
    /* 여기까지 새면 창이 「읽고 있습니다…」에 멈춰 버린다 — 조용히 멈추지 않는다 */
    console.warn('[당겨오기]', e);
    Pull.err = '경력관리 자료를 찾는 중 문제가 생겼습니다 — ' + ((e && (e.code || e.message)) || e);
    Pull.items = {};
    renderPull();
  });
}
window.openPull = openPull;

/* 경력관리 항목 → 문장 만들기 부품이 받는 모양.
   ★ 칸 이름은 갈래마다 «다르다». 아무거나 넉넉히 받아 주면 조용히 빈칸이 되므로
     갈래별 pick(CAREER_KINDS)으로만 옮긴다. 만든 문장은 손으로 고칠 수 있다. */
function toCareerItem(it, kind) {
  const o = it || {};
  const k = careerKindOf(kind);
  const p = (k && k.pick) ? (k.pick(o) || {}) : {};
  const s = v => String(v == null ? '' : v).trim();
  return { org: s(p.org), role: s(p.role), title: s(p.title), period: s(p.period), end: s(p.end) };
}
/* 화면에 「언제 것인지」를 보여 준다. 갈래마다 날짜 칸 이름이 다르다. */
function itemWhen(it, kind) {
  const k = careerKindOf(kind);
  const p = (k && k.pick) ? (k.pick(it || {}) || {}) : {};
  return String(p.when == null ? '' : p.when).trim();
}

/* ══════ 경력을 «최근 것부터» 놓는다 (대표 지시 2026-09-03) ══════
   「경력관리는 최근기간 순서로 정리해달라」
   ★ 자료가 오는 차례는 «담은 차례»다 — 2026.04 · 2026.07 · 2026.04 · 2026.08 …
     이렇게 뒤섞여 나와서, 103건 가운데 무엇이 요즘 것인지 눈으로 못 고른다.
   ★ 날짜를 «표시 글(when)» 하나에서만 읽는다. 갈래마다 칸 이름이 다른데
     (위촉장은 periodStart, 자격증은 date, 학력은 period …), 여기서 갈래별로
     또 갈라 읽으면 두 곳이 어긋나 «화면에 보이는 날짜»와 «줄 세운 날짜»가 달라진다.
   ⚠ 차례를 «자료를 받을 때» 정한다. 그릴 때 정하면 체크한 번호(kind:i)가 어긋나
     엉뚱한 것이 골라진다 — 고른 것과 넣는 것이 달라지는 조용한 사고다. */

/* 「2026.04.29」·「2026-4-9」·「2026.04」·「2026」 → 20260429 / 20260409 / 20260400 / 20260000 */
function 날짜숫자(s) {
  const m = /(\d{4})\s*[.\-/년]?\s*(\d{1,2})?\s*[.\-/월]?\s*(\d{1,2})?/.exec(String(s == null ? '' : s));
  if (!m) return 0;
  return Number(m[1]) * 10000 + Number(m[2] || 0) * 100 + Number(m[3] || 0);
}

/* 한 건의 «시작」과 「끝」. 없으면 0 — 0 은 맨 뒤로 간다. */
function 기간숫자(it, kind) {
  const 조각 = itemWhen(it, kind).split('~');
  return { 시작: 날짜숫자(조각[0]), 끝: 조각.length > 1 ? 날짜숫자(조각[1]) : 0 };
}

/* 갈래마다 «최근 시작한 것»부터.
   ★ 날짜 없는 것(0)은 «저절로» 맨 뒤로 간다 — 내림차순이라 0 이 가장 작다.
     따로 막는 줄을 두었다가 걷어냈다: 되돌림으로 걸어 보니 «있으나 없으나 같았다».
     하는 일 없는 줄을 남겨 두면 다음 사람이 그것을 «규칙»으로 읽는다.
   ★ 날짜 없는 것끼리는 «담은 차례 그대로»다 — 자바스크립트 정렬이 차례를 지킨다.
     강의·수료증에는 날짜가 빈 것이 흔한데, 그것이 뒤죽박죽이면 찾기가 더 어렵다.
   ⚠ 원본 목록을 «제자리에서» 뒤집지 않는다(slice) — 같은 자료를 보는 다른 화면이
     함께 흔들린다. */
function 경력차례(items) {
  const out = {};
  Object.keys(items || {}).forEach(kind => {
    const 목록 = items[kind];
    if (!Array.isArray(목록)) { out[kind] = 목록; return; }
    out[kind] = 목록.slice().sort((a, b) => {
      const A = 기간숫자(a, kind), B = 기간숫자(b, kind);
      if (A.시작 !== B.시작) return B.시작 - A.시작;   /* 최근 시작이 위로 (없으면 0 → 뒤로) */
      return B.끝 - A.끝;                              /* 같은 날 시작이면 늦게 끝나는 것이 위로 */
    });
  });
  return out;
}

/* ══════ 찾기와 깔때기 (대표 지시 2026-09-05) ══════
   「찾기기능 과 필터링 기능도 만들어라 깔데기기능이 좋을것 같다」
   ★ 한 갈래가 103건이다. 눈으로 훑어 고르는 것은 사람이 할 일이 아니다.
   ⚠ 거르는 것은 «보여 주는 것»뿐이다. 고른 것(Pull.sel)은 kind:i 로 붙드는데,
     그 i 는 «거르기 전» 자리다. 거르면서 번호를 다시 매기면 체크한 것과
     들어가는 것이 달라진다 — 화면으로는 알 수 없는 사고다.
     그래서 아래는 «원래 번호를 들고» 거른다. */

/* 찾기 글 다듬기 — 띄어쓰기를 지우고 소문자로. 「서산 지사」로 쳐도 「서산지사」가 걸린다 */
function 찾기꼴(s) {
  return String(s == null ? '' : s).toLowerCase().replace(/\s+/g, '');
}

/* 한 건이 지금 깔때기를 지나는가 */
function pullPass(it, i, today) {
  const kind = Pull.kind;
  const line = PuHomeCareer.toLine(toCareerItem(it, kind), today);
  const 기간있는갈래 = kindHasPeriod(kind);

  /* ① 깔때기 */
  const f = Pull.f || '';
  if (f === 'now'     && !(기간있는갈래 ? (!line.ended) : true)) return false;
  if (f === 'past'    && !(기간있는갈래 && line.ended)) return false;
  if (f === 'unknown' && !(기간있는갈래 && line.unknown && !line.ended)) return false;
  if (f === 'picked'  && !Pull.sel[kind + ':' + i]) return false;

  /* ② 찾기 — 보이는 글(제목)과 기간 둘 다에서 찾는다.
       기간으로도 찾을 수 있어야 「2026」 같은 해로 좁힐 수 있다. */
  const q = 찾기꼴(Pull.q);
  if (!q) return true;
  return 찾기꼴(line.text + ' ' + itemWhen(it, kind)).indexOf(q) >= 0;
}

/* 지금 보여 줄 것들 — «원래 번호»를 함께 들고 온다 */
function pullVisible(today) {
  const items = Pull.items[Pull.kind] || [];
  const out = [];
  items.forEach((it, i) => { if (pullPass(it, i, today)) out.push({ it: it, i: i }); });
  return out;
}

function pullFunnel(f) { Pull.f = (Pull.f === f ? '' : f); renderPull(); }
window.pullFunnel = pullFunnel;

/* ⚠ 글을 치는 중에 창을 통째로 다시 그리면 «커서가 튄다» — 목록만 갈아 끼운다.
   (편집칸에서 같은 일을 겪었다: pageRunEdit 의 주석 참고.) */
function pullFind(v) {
  Pull.q = String(v == null ? '' : v);
  const 통 = document.getElementById('pullList');
  if (통) 통.innerHTML = pullListHtml(todayString());
  pullCountPaint();
}
window.pullFind = pullFind;

function pullClearFind() { Pull.q = ''; renderPull(); }
window.pullClearFind = pullClearFind;

function pullTab(kind) { Pull.kind = kind; renderPull(); }
/* 지금 «보이는 것»을 통째로 고르거나 푼다 — 다른 갈래는 건드리지 않는다.
   ★ 2026-09-05: 「보이는 것」으로 바꿨다. 찾기·깔때기로 좁혀 놓고 「전부 고르기」를
     눌렀는데 «안 보이는 것까지» 골라지면, 무엇이 들어가는지 눈으로 확인할 수 없다.
     좁혀 놓고 고르는 것이 이 단추를 쓰는 까닭이다. */
function pullAll(on) {
  const today = todayString();
  pullVisible(today).forEach(v => {
    const id = Pull.kind + ':' + v.i;
    if (on) Pull.sel[id] = true; else delete Pull.sel[id];
  });
  renderPull();
}
function pullToggle(kind, i) {
  const id = kind + ':' + i;
  if (Pull.sel[id]) delete Pull.sel[id]; else Pull.sel[id] = true;
  renderPull();
}
window.pullTab = pullTab; window.pullToggle = pullToggle; window.pullAll = pullAll;

/* 고른 수·보이는 수를 «글자만» 갈아 끼운다 — 찾는 중에 창을 다시 그리지 않으려고 */
function pullCountPaint() {
  const el = document.getElementById('pullCount');
  if (!el) return;
  const items = Pull.items[Pull.kind] || [];
  const 보임 = pullVisible(todayString()).length;
  const 고른수 = items.filter((_, i) => Pull.sel[Pull.kind + ':' + i]).length;
  el.textContent = (보임 === items.length ? items.length + '건' : 보임 + '건 보임 (전체 ' + items.length + ')')
    + ' · 이 갈래에서 ' + 고른수 + '건 골랐습니다';
}

/* 목록만 그린다 — 찾는 중에 창을 통째로 다시 그리면 커서가 튄다.
   ★ 번호는 «원래 자리»(v.i)다. 걸러 놓고 1부터 다시 매기면, 화면의 번호와
     체크가 붙드는 번호(kind:i)가 갈라져 사람이 헷갈린다. */
function pullListHtml(today) {
  const items = Pull.items[Pull.kind] || [];
  const 보임 = pullVisible(today);
  if (!보임.length) {
    return '<div class="pullnone">찾는 것이 없습니다 — <b>' + items.length + '건</b> 가운데 0건.'
      + '<br>찾는 글이나 깔때기를 풀어 보십시오.</div>';
  }
  // ★ 자격증·수료증·강의는 기간 개념이 없는 갈래라 늘 unknown 이 뜬다 — 그 헛경고를
  //   보여 주지 않는다.
  const hasPeriod = kindHasPeriod(Pull.kind);
  /* ⚠ 딱지는 «기간이 어떤가»만 말한다. 예전에는 「기간 끝남 → 前」처럼 무엇이 들어갈지도
     함께 적었는데, 이제 사람이 앞한자를 바꿀 수 있어 그 말이 «틀린 안내»가 된다.
     무엇이 들어가는지는 아래 굵은 글씨가 그대로 보여 준다. */
  const 전현있는갈래 = !!ERA_AUTO_KINDS[Pull.kind];
  return 보임.map(v => {
    const it = v.it, i = v.i;
    const line = PuHomeCareer.toLine(toCareerItem(it, Pull.kind), today);
    const id = Pull.kind + ':' + i;
    const era = pullEraOf(Pull.kind, i, line);
    const tag = !전현있는갈래
      ? '<span class="pill unknown">전현 없는 갈래</span>'
      : ((hasPeriod && line.ended) ? '<span class="pill toRemove">기간 끝남</span>'
        : ((hasPeriod && line.unknown) ? '<span class="pill unknown">기간 모름</span>'
          : '<span class="pill toAdd">하고 있음</span>'));
    /* 번호는 화면에서 세는 용도다 — 넣는 글자에는 들어가지 않는다 */
    return '<label class="pk"><input type="checkbox" ' + (Pull.sel[id] ? 'checked' : '')
      + ' onchange="pullToggle(\'' + Pull.kind + '\',' + i + ')">'
      + '<span class="num">' + (i + 1) + '</span>'
      + eraPickHtml(era, k => 'pullEra(\'' + Pull.kind + '\',' + i + ',\'' + k + '\')')
      + '<div class="t"><b>' + esc(PuHomeCareer.withEra(line.text, era)) + '</b>'
      + '<div class="d">' + esc(itemWhen(it, Pull.kind) || '기간 정보 없음') + '</div></div>' + tag + '</label>';
  }).join('');
}

function renderPull() {
  const today = todayString();
  const items = Pull.items[Pull.kind] || [];
  /* ══ 머리를 «붙여 둔다» (대표 지시 2026-09-05 「상단 틀고정」) ══
     103건을 구르는 동안 갈래 탭·찾기·깔때기가 위로 사라지면
     무엇을 보고 있었는지 잃는다. */
  let h = '<div class="pullhead">';
  /* 이름은 «가져오기» 하나로 — 아래 단추줄과 칸 옆이 다른 이름이면 두 기능처럼 보인다
     (2026-09-06 대표께서 「겹침」으로 짚으신 자리. tests/home-career-pull.test.js ⓑ) */
  h += '<h2>' + esc(Pull.name) + ' — 경력관리에서 가져오기</h2>';
  h += '<div class="sub">체크한 것만 경력사항에 들어갑니다. 넣은 뒤 <b>표현은 손으로 다듬을 수 있습니다.</b></div>';

  h += '<div class="tabs">' + CAREER_KINDS.map(k => {
    const n = (Pull.items[k.key] || []).length;
    return '<button class="' + (k.key === Pull.kind ? 'on' : '') + '" onclick="pullTab(\'' + k.key + '\')">'
      + esc(k.label) + ' ' + n + '</button>';
  }).join('') + '</div>';

  /* ── 찾기 + 깔때기 ── */
  const 깔 = [['now', '現 하는 중'], ['past', '前 끝남'], ['unknown', '기간 모름'], ['picked', '고른 것']];
  h += '<div class="pullbar">'
    + '<label class="find"><span>🔎</span>'
    + '<input value="' + esc(Pull.q || '') + '" placeholder="이름·기관·연도로 찾기"'
    + ' oninput="pullFind(this.value)" spellcheck="false">'
    + (Pull.q ? '<button onclick="pullClearFind()" title="찾기 지우기">✕</button>' : '')
    + '</label>'
    + '<span class="funnel">'
    + 깔.map(([k, l]) => '<button class="' + (Pull.f === k ? 'on' : '') + '"'
        + ' onclick="pullFunnel(\'' + k + '\')">' + esc(l) + '</button>').join('')
    + '</span></div>';

  // 홈페이지에 現 으로 올라가 있는데 기간이 끝난 것 — 밖에서 보기에 나쁘다
  // ★ 이 띠는 «붙는 머리 밖»에 둔다. 길어질 수 있는 글이라(줄마다 한 줄) 붙여 두면
  //   화면을 통째로 먹어 정작 고를 목록이 안 보인다.
  const all = [];
  CAREER_KINDS.forEach(k => (Pull.items[k.key] || []).forEach(it => all.push(toCareerItem(it, k.key))));
  const expired = (App.draft && App.draft.careers)
    ? (PuHomeCareer.expiredInLive(App.draft.careers, all, today) || []) : [];
  const 만료띠 = expired.length
    ? '<div class="bar warn"><b>홈페이지에 만료된 직함이 걸려 있습니다 — ' + expired.length + '줄</b>'
      + '<div class="pre" style="margin-top:6px">' + expired.map(esc).join('\n') + '</div></div>'
    : '';

  if (!items.length) {
    h += '</div>' + 만료띠 + '<div class="empty">이 갈래에 항목이 없습니다.</div>';
  } else {
    /* ── 「전부 고르기」 (대표 지시 2026-09-02) ──
       한 갈래에 열여덟 줄이 있으면 폰에서 열여덟 번을 눌러야 했다.
       ⚠ «이 갈래만» 고른다 — 모든 갈래를 한꺼번에 고르면, 자격증까지 딸려 들어간 것을
         나중에 하나씩 지워야 한다. 무엇이 들어가는지는 눈으로 보고 고르는 것이 맞다.
       ★ 2026-09-05: «보이는 것»만 고른다. 좁혀 놓고 고르는 것이 이 단추를 쓰는 까닭이다. */
    const 보임 = pullVisible(today);
    const 고른수 = items.filter((_, i) => Pull.sel[Pull.kind + ':' + i]).length;
    h += '<div class="fldbar" style="margin:7px 0 0">'
      + '<button class="btn" style="padding:3px 9px;font-size:11.5px" onclick="pullAll(1)"'
      + (보임.length ? '' : ' disabled') + '>'
      + (보임.length === items.length ? '전부 고르기 (' + items.length + ')'
                                      : '보이는 것 고르기 (' + 보임.length + ')') + '</button>'
      + '<button class="btn" style="padding:3px 9px;font-size:11.5px" onclick="pullAll(0)"'
      + (고른수 ? '' : ' disabled') + '>'
      + (보임.length === items.length ? '고른 것 풀기' : '보이는 것 풀기') + '</button>'
      + '<span class="sub" id="pullCount" style="font-size:11.5px"></span>'
      + '</div>';
    h += '</div>';   /* .pullhead 끝 — 여기까지가 붙어 있는 머리다 */
    h += 만료띠;
    h += '<div class="car" id="pullList">' + pullListHtml(today) + '</div>';
  }

  const n = Object.keys(Pull.sel).length;
  h += '<div class="guide"><b>앞의 한자를 정하는 규칙</b><ol>'
    + '<li>위촉장은 기간이 <b>안 끝난 것</b> → <span class="kbd">現 …</span></li>'
    + '<li>위촉장은 기간이 <b>끝난 것</b> → <span class="kbd">前 …</span></li>'
    + '<li>기간을 <b>모르는 것</b>은 끝났다고 단정하지 않고 <b>現</b> 으로 두되 「기간 모름」 표시를 남깁니다</li>'
    + '<li>학력·자격증·수료증·강의는 <b>한자를 안 붙입니다</b> — 「現 공인노무사」가 되지 않게</li>'
    + '<li><b>어느 것이든 <span class="kbd">現</span><span class="kbd">前</span> 딱지를 눌러 바꿀 수 있습니다</b>'
    + ' — 위의 것은 «첫 값»일 뿐입니다. 켜진 딱지를 다시 누르면 한자가 빠집니다</li>'
    + '</ol></div>';
  h += '<div class="foot"><button class="btn pri" onclick="pullApply()"' + (n ? '' : ' disabled') + '>'
    + '체크한 것 넣기' + (n ? ' (' + n + '건)' : '') + '</button>'
    + '<button class="btn" onclick="closeModal()">닫기</button></div>';
  /* ★ stickhead — 이 덧창만 위 여백을 «첫 아이»에게 넘긴다(붙은 머리가 틈을 덮게).
       다른 덧창은 그대로 둔다. */
  openModal(h, 'stickhead');
  pullCountPaint();
}

function pullApply() {
  const d = App.draft;
  if (!d || d.kind !== 'member') return;
  const today = todayString();
  const added = [];
  Object.keys(Pull.sel).forEach(id => {
    const at = id.lastIndexOf(':');
    const kind = id.slice(0, at), i = Number(id.slice(at + 1));
    const it = (Pull.items[kind] || [])[i];
    if (!it) return;
    const line = PuHomeCareer.toLine(toCareerItem(it, kind), today);
    /* ★ 앞한자는 «화면에서 고른 것»을 그대로 쓴다. 여기서 line.text 를 그냥 쓰면
       사람이 딱지로 고쳐 놓은 것이 조용히 자동값으로 되돌아간다 — 화면과 들어간 글이
       달라지고, 오류도 안 나서 알 수가 없다. */
    let text = PuHomeCareer.withEra(line.text, pullEraOf(kind, i, line));
    // ★ 기간 개념이 있는 갈래(위촉장·학력)에서만 「기간 모름」을 붙인다 — 자격증·수료증·
    //   강의는 애초에 기간이 없는 갈래라 이 표시가 늘 붙어 그대로 홈페이지 글로 나간다.
    if (line.unknown && kindHasPeriod(kind)) text += '  ※기간 모름';
    if (d.careers.indexOf(text) < 0) { d.careers.push(text); added.push(text); }
  });
  App.dirty = true;
  closeModal();
  App.render();
  toast(added.length ? (added.length + '줄을 넣었습니다. 확인 후 저장하세요.') : '넣을 새 줄이 없습니다.');
}
window.pullApply = pullApply;

/* ══════ 덧창 ══════ */
/* 덧창을 연다. 둘째 값은 «이 덧창만»의 표시다 — 부르는 쪽이 정하고, 안 넘기면 맨 덧창이다.
     true      → 넓게 열기(wide). 예전부터 쓰던 부름꼴이라 그대로 받는다.
     'stickhead' 같은 글자 → 그 클래스를 붙인다(머리를 붙여 두는 덧창).
   ⚠ 늘 «지웠다가» 붙인다 — 안 지우면 앞서 연 덧창의 표시가 남아, 넓힌 창을 되돌리지 않으면
     다음에 뜨는 사유 입력 창까지 1000px 로 벌어지고 여백 없는 덧창이 엉뚱한 곳에서 뜬다.
   ⚠★ true 를 글자처럼 이어 붙이면 class 가 'modalCard true' 가 되어 넓히기가 «조용히» 죽는다.
      오류도 안 나고 창만 좁게 뜬다 — 그래서 참/거짓과 글자를 갈라 본다. */
function openModal(html, mark) {
  const card = $('modalCard');
  const cls = mark === true ? 'wide' : (typeof mark === 'string' ? mark : '');
  card.className = 'modalCard' + (cls ? ' ' + cls : '');
  card.innerHTML = html;
  $('modal').classList.add('on');
}
/* ★ 창을 닫으면 붙여넣기를 «끈다» — 안 끄면 다른 화면에서 Ctrl+V 를 눌러도
     로고로 받아 버린다. 붙여 두었던 그림도 함께 버린다(담지 않은 것은 없던 일이다). */
function closeModal() {
  $('modal').classList.remove('on'); Pull.open = false;
  App.logoPasteOn = false; App.logoPick = null;
  /* 자문사 고르기도 닫힌 것으로 둔다 — 안 끄면 저장이 끝난 뒤 없는 창을 다시 그린다 */
  Pick.open = false;
}
function modalBackdrop(e) { if (e.target === $('modal')) closeModal(); }
function modalFoot(note) {
  return '<div class="foot">' + (note ? '<span class="sub">' + esc(note) + '</span>' : '')
    + '<span style="flex:1"></span><button class="btn" onclick="closeModal()">닫기</button></div>';
}
window.closeModal = closeModal; window.modalBackdrop = modalBackdrop;
/* Esc — 화면 안 창이 떠 있으면 그것부터 닫는다(덧창 위에 떠 있기 때문이다).
   그만두기와 같은 뜻이라 dlgCancel 을 쓴다 — 답을 안 준 채 닫으면 부른 쪽이 멈춘다. */
/* ★ 붙여넣기는 문서에 «한 번만» 단다 — 창을 그릴 때마다 달면 겹쳐서 여러 번 돈다.
   실제로 받는지는 App.logoPasteOn 이 가른다(로고 창이 열려 있을 때만). */
document.addEventListener('paste', onLogoPaste);

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (Dlg.done) { dlgCancel(); return; }
  closeModal();
});

/* ══════ 화면 그리기 ══════ */

/* ★ 틀은 붙박이다 (3차 설계 §2). 페이지 자체는 굴리지 않는다 — 고르는 사람이
     바뀌어도 길이가 안 바뀐다.
   ★ 4차 지시로 «세로 넷»에서 «가로 셋»으로 바꿨다(목업 v6b):
       머리띠(위 고정) → 몸통[ 기둥(대시보드+할 일) · 목록 · 편집칸 ] → 딱지 안내(아래).
     안내 띠를 기둥 아래쪽 「할 일」로 옮겼다 — 위에 쌓여 있을 때는 띠가 두세 개만 떠도
     몸통 높이를 최대 34% 까지 먹어 목록과 편집칸이 눌렸다. */
function screen() {
  if (App.loading) return '<div class="empty">자료를 읽고 있습니다…</div>';
  return '<div class="app">'
    + '<div class="top">' + appbarHtml() + '</div>'
    /* ★ 미리보기를 펴면 편집칸과 «나란히» 놓는다. 접으면 지금과 똑같다. */
    + '<div class="body">' + railHtml() + listHtml()
      + (App.preview ? '<div class="pane2">' + editHtml() + prevHtml() + '</div>' : editHtml())
      + '</div>'
    + legendHtml()
    + '</div>';
}

/* 왼쪽 기둥 — «무엇을 볼까»(대시보드 카드)와 «무엇을 해야 하나»(할 일)를 한 기둥에 둔다.
   눈이 왼쪽에서 오른쪽으로만 움직인다: 갈래 고르기 → 줄 고르기 → 고치기. */
function railHtml() {
  return '<div class="rail">'
    + '<div class="rh">무엇을 볼까</div>'
    + '<div class="dash">' + dashHtml() + '</div>'
    + todoHtml()
    + '</div>';
}

function appbarHtml() {
  const at = App.check && App.check.at;
  return '<div class="appbar">'
    + '<div class="ttl">홈페이지 관리</div>'
    + '<span class="when">홈페이지 확인 ' + esc(at ? stampShort(at) : '아직 안 함') + '</span>'
    + '<div class="sp"></div>'
    /* ★ 이 띠가 «무엇에 대한 것인지» 이름표로 못 박는다 (대표 결정 2026-09-06 ㉯).
       까닭 — 「홈페이지」가 붙은 단추가 한 화면에 일곱이었고, 다섯은 «지금» 홈페이지
       (라이믹스, 우리가 못 고침) 를, 둘은 «새» 홈페이지(우리 거울, 자동으로 올라감) 를
       가리켰다. 헷갈린 것은 단추가 많아서가 아니라 «어느 것이 무엇에 대한 것인지»가
       안 적혀 있어서였다. 위는 화면 전체, 아래(.eft)는 고른 사람 하나다. */
    + '<span class="tag">이 화면 전체</span>'
    + '<label class="sub">줄 모양 '
    + '<select onchange="setLineFormat(this.value)">'
    + '<option value="plain"' + (App.lineFormat === 'plain' ? ' selected' : '') + '>줄바꿈만 (기본)</option>'
    + '<option value="div"' + (App.lineFormat === 'div' ? ' selected' : '') + '>줄마다 감싸기</option>'
    + '</select></label>'
    /* ★ 미리보기 — 기본은 접힘. 켜면 편집칸 오른쪽에 붙는다(대표 결정 2026-09-02 ㉮) */
    + '<button class="btn' + (App.preview ? ' on' : '') + '" onclick="togglePreview()"'
    + ' title="고치는 대로 홈페이지에 어떻게 보이는지 옆에서 보여 드립니다">'
    + (App.preview ? '👁 미리보기 끄기' : '👁 미리보기') + '</button>'
    /* ★ 「지금 / 새」로 갈라 적는다 (대표 결정 2026-09-06 ㉯) —
         지금 홈페이지 = 손님이 보는 라이믹스. 읽고 견주기만 된다.
         새 홈페이지  = 우리 거울. 자동으로 올라간다.
       ⚠ 도메인을 옮기면 「새」가 「지금」이 된다. 그때 «지금» 붙은 것들을 통째로 지우고
         「새」를 떼면 끝나도록 이름을 지었다 — 한 자리에서 끝난다.
       ★ 파란 단추는 이 띠에 «하나»다(올리기). 대조는 읽기만 하는 일이라 파랗지 않다 —
         전에는 대조가 파랗고 정작 저장이 회색이었다. */
    + '<span class="sep"></span>'
    + '<button class="btn" onclick="checkHomepage()"' + (App.checking ? ' disabled' : '') + '>'
    + (App.checking ? '확인 중…' : '지금 홈페이지와 대조') + '</button>'
    /* ★ 「홈페이지에 올리기」는 «구성원 갈래를 볼 때»만 보인다.
       늘 보이면 쪽·자문사를 보다가 눌러 구성원이 올라간다 —
       무엇이 올라가는지와 지금 보는 화면이 맞아야 사람이 안 헷갈린다. */
    /* ⚠ 자문사 단추(고르기·로고 관리)를 여기 «머리띠»에 두지 않는다
       (대표 지시 2026-09-06 「자문사 고르기를 별도로 위에 두지 마라.
        로고 관리도 자문사에 대한 부분은 여기 화면에서 정리하게 해야 된다」).
       머리띠는 «화면 전체»에 대한 자리다(대조·미리보기·열기). 자문사에만 쓰는 것을
       거기 두면 자문사 화면 안(목록 머리)에도 같은 단추가 생겨 둘이 된다 —
       실제로 2026-09-06 에 「자문사 고르기」가 위아래 두 곳에 생겼다.
       ★ 둘 다 목록 머리(listHtml)에 모여 있다. 여기로 되돌리지 말 것. */
    + '<a class="btn" style="text-decoration:none" href="' + esc(PuHomeExport.ORIGIN)
    + '" target="_blank" rel="noopener">지금 홈페이지 보기</a>'
    + (App.group === 'members'
        ? '<span class="sep"></span>'
          + '<button class="btn pri" onclick="publishPeople()"' + (App.publishing ? ' disabled' : '')
          + ' title="여기 자료로 «구성원 소개» 쪽을 다시 만들어 올립니다. 무엇이 올라가는지 먼저 보여드립니다.">'
          + (App.publishing ? '올리는 중…' : '새 홈페이지에 올리기') + '</button>'
        : '')
    + '</div>';
}

/* ══════ 할 일 (5차 지시 — 「정보가 너무 혼재되어 판단이 어렵다」) ══════
   ★ 할 일 하나가 «한 줄»이다: 무엇을 · 몇 건 · 누구를 · 가는 단추. «방법»은 접어 둔다.
     띠마다 방법을 펼쳐 두면 칸이 글로 차서 정작 무슨 일이 있는지 안 보인다.
   ★ 할 일이 «아닌 것»은 여기 두지 않는다 — 「홈페이지에 남기기로 한 사람」은 목록 딱지와
     편집칸 머리띠가 이미 말한다. 할 일 칸에 두면 매일 할 일이 하나 늘어난 것처럼 보인다.
   ★ 못 읽음·저장 실패 같은 «사고»도 여기 모은다. 조용히 삼키면 사장님이 멀쩡한 줄 안다. */

/* 갈래를 통틀어 조건에 맞는 줄을 모은다. 어느 갈래의 줄인지 함께 들고 온다 —
   「보기」 단추가 그 갈래로 옮겨 가며 걸러야 하기 때문이다. */
function rowsWith(pred) {
  return GROUPS.reduce((a, g) => a.concat(
    rowsOf(g.key).filter(pred).map(r => ({ g: g.key, gl: g.label, key: r.key, name: r.name }))), []);
}

/* 이름 몇 개만 앞에 보여 준다. 스무 명을 다 늘어놓으면 그게 또 글 덩어리가 된다. */
function someNames(list, max) {
  const n = max || 3;
  const names = list.map(x => x.name);
  return esc(names.slice(0, n).join(' · ')) + (names.length > n ? ' 외 ' + (names.length - n) + '건' : '');
}

/* 갈래별 「보기」 단추 — 같은 딱지를 갈래마다 하나씩 */
function seeBtns(list, filterKey) {
  const seen = {}, out = [];
  list.forEach(x => {
    if (seen[x.g]) return;
    seen[x.g] = true;
    out.push('<button class="btn sm" onclick="App.filt(\'' + esc(filterKey) + '\',\'' + esc(x.g) + '\')">'
      + esc(x.gl) + '에서 보기</button>');
  });
  return out.join('');
}

function jobCard(j) {
  return '<div class="job ' + (j.cls || '') + '">'
    + '<div class="h">' + j.t + (j.n ? '<span class="cnt">' + j.n + '</span>' : '') + '</div>'
    + (j.who ? '<div class="who">' + j.who + '</div>' : '')
    + (j.go ? '<div class="go">' + j.go + '</div>' : '')
    + (j.why ? '<details><summary>' + esc(j.whyTitle || '어떻게 하면 되나')
               + '</summary><p>' + j.why + '</p></details>' : '')
    + '</div>';
}

/* 할 일 목록. 급한 것(사고)부터, 그다음 홈페이지에 남아 있는 것, 그다음 채울 것. */
function jobsOf() {
  const jobs = [];
  const add = j => { if (j) jobs.push(j); };

  /* ── 사고: 못 읽음·못 함·저장 실패 ── */
  if (App.checkMsg) {
    add({ cls: App.checkBad ? '' : 'warn', t: '홈페이지 확인이 끝까지 못 갔습니다',
          who: esc(App.checkMsg),
          why: '자료와 지난 딱지는 «건드리지 않았습니다». 잠시 뒤 다시 눌러 보십시오.',
          go: '<button class="btn sm" onclick="checkHomepage()"'
              + (App.checking ? ' disabled' : '') + '>다시 확인</button>' });
  }
  if (App.dataErr) add({ cls: '', t: '통합시스템 자료를 못 읽었습니다', who: esc(App.dataErr),
    why: '목록이 비어 보이는 것이 「자료가 없다」는 뜻은 아닙니다. 파이어베이스 규칙일 수 있습니다.',
    go: '<button class="btn sm" onclick="location.reload()">다시 읽기</button>' });
  if (App.companiesErr) add({ cls: '', t: '자문사 목록(업체관리)을 못 읽었습니다',
    who: esc(App.companiesErr),
    go: '<button class="btn sm" onclick="location.reload()">다시 읽기</button>' });
  if (App.staffErr) add({ cls: 'warn', t: '푸른ERP 직원 명부를 온전히 못 봤습니다', who: esc(App.staffErr) });
  if (App.saveErr) add({ cls: 'warn', t: '저장하지 못한 것이 있습니다', who: esc(App.saveErr) });

  /* ── 남의 글을 덮을 수 있는 것 (가장 위험하다) ── */
  const ourDup = PuHomeDiff.duplicateOurKeys(
    Object.keys(App.members || {}).map(k => Object.assign({}, App.members[k], { key: k })));
  if (ourDup.length) {
    add({ cls: '', t: '같은 홈페이지 글 번호를 두 사람이 씁니다', n: ourDup.length,
      who: ourDup.map(x => '글 번호 ' + esc(x.srl) + ' — ' + esc(x.names.join(', '))).join(' / '),
      why: '이대로 두면 붙여넣기가 «남의 글»을 덮습니다. 겹친 줄은 붙여넣기를 막아 두었습니다 — '
         + '어느 쪽 글 번호가 잘못 적혔는지 고쳐 주십시오.' });
  }
  const dup = (App.check && App.check.duplicates) || [];
  if (dup.length) {
    add({ cls: '', t: '홈페이지에 같은 글 번호가 두 번 있습니다', n: dup.length,
      who: esc(dup.join(', ')),
      why: '통합시스템은 먼저 나온 글을 기준으로 대조합니다. 홈페이지 <b>구성원 갤러리</b>에서 '
         + '겹친 글을 손봐 주십시오.' });
  }

  /* ── 홈페이지에 남아 있는 것 ── */
  const toRemove = rowsWith(r => r.status === 'toRemove');
  if (toRemove.length) {
    add({ cls: '', t: '퇴사한 노무사가 홈페이지에 남아 있습니다', n: toRemove.length,
      who: someNames(toRemove),
      go: '<button class="btn sm" onclick="App.filt(\'toRemove\',\'members\')">'
          + '이 ' + toRemove.length + '명 보기</button>',
      whyTitle: '홈페이지에서 내리는 법',
      why: '홈페이지 관리자 로그인(<b>푸른노무법인.kr/admin</b>) → <b>구성원 갤러리</b>에서 그 글을 '
         + '찾아 <b>삭제하지 말고 「비공개」</b>로 바꾸십시오. 잘못 내렸어도 되살릴 수 있습니다. '
         + '그 뒤 <b>홈페이지 다시 확인</b>을 누르면 딱지가 「내려감」으로 바뀝니다.' });
  }
  const liveOnly = rowsWith(r => r.status === 'liveOnly');
  if (liveOnly.length) {
    add({ cls: 'warn', t: '홈페이지에만 있는 글', n: liveOnly.length, who: someNames(liveOnly),
      go: '<button class="btn sm" onclick="App.filt(\'liveOnly\',\'members\')">보기</button>',
      why: '통합시스템에 그 사람 자료가 없습니다. 홈페이지에서 내리거나(비공개), '
         + '<b>＋ 새 구성원</b>으로 넣고 <b>홈페이지 글 번호</b>를 적어 주십시오.' });
  }

  /* ── 명부만 보고 아는 것 (확인 전에도 붙는다) ── */
  const ms = statOf('members');
  if (ms.own.left) {
    /* 대조를 이미 눌러 「내릴 것」으로 잡힌 사람은 위에서 따로 적었다 — 여기서 또 세지 않는다 */
    const 남은 = ms.own.left - toRemove.length;
    if (남은 > 0) {
      add({ cls: 'warn', t: '명부상 퇴사한 사람', n: 남은,
        who: App.check ? '홈페이지에서는 이미 내려간 것으로 보입니다' : '홈페이지에 올라가 있는지는 «확인»을 눌러야 압니다',
        go: '<button class="btn sm" onclick="App.filt(\'own:left\',\'members\')">보기</button>',
        why: '홈페이지에서 이미 내렸다면 더 하실 일이 없습니다. 지사장처럼 고용관계가 아닌 분은 '
           + '<b>「홈페이지에 남기기」</b>로 사유를 남겨 두시면 다음부터 조용해집니다.' });
    }
  }
  if (ms.own.none) {
    add({ cls: 'info', t: '명부에 없는 사람', n: ms.own.none,
      go: '<button class="btn sm" onclick="App.filt(\'own:none\',\'members\')">보기</button>',
      why: '푸른ERP 직원 명부에서 이름을 찾지 못했습니다. 이름 철자가 다를 수 있고, 지사장처럼 '
         + '고용관계가 아닌 분일 수 있습니다. 후자라면 <b>「홈페이지에 남기기」</b>로 사유를 '
         + '남겨 두십시오.' });
  }
  if (ms.own.dup) {
    add({ cls: 'info', t: '명부에 같은 이름이 둘 이상', n: ms.own.dup,
      go: '<button class="btn sm" onclick="App.filt(\'own:dup\',\'members\')">보기</button>',
      why: '동명이인이라 입·퇴사 판단을 보류했습니다 — 어느 쪽인지 사람이 확인해야 합니다.' });
  }

  /* ── 올려야 할 것 ── */
  const pending = rowsWith(r => r.status === 'pending');
  if (pending.length) {
    add({ cls: '', t: '고쳤는데 아직 홈페이지에 안 올라간 것', n: pending.length,
      who: someNames(pending), go: seeBtns(pending, 'pending'),
      why: '구성원은 <b>붙여넣을 내용 복사</b> → 홈페이지 편집 화면에 붙여넣기. '
         + '쪽은 홈페이지 관리자 화면에서 직접 고치십시오. 그 뒤 <b>홈페이지 다시 확인</b>을 '
         + '누르면 딱지가 「같음」으로 바뀝니다.' });
  }
  const toAdd = rowsWith(r => r.status === 'toAdd');
  if (toAdd.length) {
    add({ cls: 'info', t: '홈페이지에 새로 올릴 사람', n: toAdd.length, who: someNames(toAdd),
      go: '<button class="btn sm" onclick="App.filt(\'toAdd\',\'members\')">보기</button>',
      why: '홈페이지 <b>구성원 갤러리</b>에 글을 새로 만든 뒤, 그 <b>글 번호</b>를 이 화면의 '
         + '「홈페이지 글 번호」 칸에 적어 주십시오. 그러면 다음 확인부터 짝지어집니다.' });
  }
  const noBase = rowsWith(r => r.status === 'noBase');
  if (noBase.length) {
    add({ cls: 'info', t: '대조 기준이 없는 쪽', n: noBase.length, who: someNames(noBase),
      go: noBase.map(x => '<button class="btn sm" onclick="App.jump(\'' + esc(x.g) + '\',\''
          + esc(x.key) + '\')">' + esc(x.name) + ' 열기</button>').join(''),
      why: '기준이 없으면 「같음/안 올라감」을 말할 수 없습니다. 그 쪽을 열어 '
         + '<b>홈페이지 줄 모양으로 나누기</b> → <b>대조 기준 저장</b>을 한 번 해 두십시오.' });
  }
  const unknown = rowsWith(r => r.status === 'unknown');
  if (unknown.length) {
    add({ cls: 'warn', t: '홈페이지에서 못 읽은 쪽', n: unknown.length, who: someNames(unknown),
      why: '그 쪽은 지난 결과를 그대로 두었습니다 — 자료가 바뀐 것이 아닙니다. '
         + '잠시 뒤 <b>홈페이지 다시 확인</b>을 다시 눌러 보십시오.' });
  }

  /* ── 알리기만 하는 것 ── */
  const left = (App.check && App.check.leftovers) || {};
  const leftNames = Object.keys(left);
  if (leftNames.length) {
    add({ cls: 'warn', t: '퇴사자 이름이 다른 쪽에 남아 있습니다', n: leftNames.length,
      who: leftNames.map(n => esc(n) + ' — '
             + left[n].map(x => esc(PAGE_LABEL[x.path] || x.path) + ' ' + x.count + '회').join(', ')).join(' / '),
      go: leftoverGoBtns(left),
      why: '동명이인일 수 있으니 «알려만» 드립니다. 자동으로 고치지 않습니다.' });
  }
  const ps = statOf('partner');
  if (ps.own.ended) {
    add({ cls: 'warn', t: '거래가 끝나 명단에서 뺐습니다 — 지금 홈페이지에는 아직 있습니다', n: ps.own.ended,
      go: '<button class="btn sm" onclick="App.filt(\'own:ended\',\'partner\')">보기</button>',
      /* ★ 2026-09-03 대표 지시 「업체 종료된 곳은 모두 자동으로 명단 빼라」로 뜻이 바뀌었다.
         전에는 «알리기만» 했다. 이제 우리 명단에서는 자동으로 빠지지만, 지금 홈페이지는
         우리가 못 고치므로 «거기서 내리는 일»만 사람 손에 남는다 — 그 한 가지를 말한다. */
      why: '우리 명단에서는 자동으로 뺐습니다. 다만 지금 홈페이지는 우리가 고칠 수 없어 '
         + '로고가 그대로 걸려 있습니다 — 홈페이지 관리자 화면에서 내려 주십시오.' });
  }

  /* ── 아직 대조를 안 눌렀다 ── */
  if (!App.check) {
    add({ cls: 'info', t: '홈페이지와 아직 대조하지 않았습니다',
      who: '대조 딱지는 「홈페이지 다시 확인」을 누를 때만 붙습니다',
      go: '<button class="btn pri sm" onclick="checkHomepage()"'
          + (App.checking ? ' disabled' : '') + '>' + (App.checking ? '확인 중…' : '홈페이지 다시 확인')
          + '</button>' });
  }
  return jobs;
}

function bannersHtml() { return jobsOf().map(jobCard).join(''); }

/* 퇴사자 이름이 남은 쪽으로 가는 단추. 쪽 이름(work1…)이 어느 갈래인지 여기서 되짚는다 —
   갈래를 잘못 짚으면 단추를 눌러도 그 줄이 없는 목록으로 간다. */
function leftoverGoBtns(left) {
  const seen = {}, out = [];
  Object.keys(left).forEach(n => (left[n] || []).forEach(x => {
    if (seen[x.path]) return;
    seen[x.path] = true;
    const g = (x.path === 'inquiry' || x.path === 'greeting') ? x.path : 'work';
    out.push('<button class="btn sm" onclick="App.jump(\'' + esc(g) + '\',\'' + esc(x.path) + '\')">'
      + esc(PAGE_LABEL[x.path] || x.path) + ' 열기</button>');
  }));
  return out.join('');
}

/* ══════ 대시보드 (4차 지시 · 목업 v6b · 규격표 docs/mockups/homepage-dash-spec.html) ══════
   ★ 다섯 갈래가 «같은 다섯 칸»을 채운다:
       ① 갈래 이름  ② 총수+단위  ③ 우리 자료 경고  ④ 대조 결과  ⑤ 빨간 점(=③+④)
   ★ ③과 ④를 한 숫자로 뭉치지 않는다. ③은 명부·기준 글자만 봐서 «화면을 열면 바로»
     아는 것이고, ④는 사람이 「홈페이지 다시 확인」을 눌러야 아는 것이다. 합치면
     「아직 안 봤다」와 「봤는데 깨끗하다」가 같은 모양이 된다. */

/* 이 줄에 손댈 것이 있는가 — «한 곳에서만» 판단한다.
   ★ 카드의 빨간 점·「손댈 것」 딱지·할 일 수가 모두 이 함수를 쓴다. 곳곳에서 따로
     세면 카드에는 점이 있는데 할 일은 0 인 식으로 서로 어긋난다.
   ★ 「남김」은 사람이 이미 판단한 것이라 뺀다.
   ★ 못 읽음(unknown)은 손댈 것이 아니다 — 홈페이지를 못 읽은 것이지 우리가 할 일이 아니다. */
function needsAttentionRow(r) {
  /* 대조 딱지가 있으면 그 말을 믿는다 — 「같음」·「내려감」이면 할 일이 없다.
     ★ 이 순서가 뒤집히면 퇴사 처리를 «끝낸» 사람(내려감)이 명부 딱지 때문에
       영영 손댈 것으로 남는다(3차 설계에서 이미 한 번 고친 자리다).
     ★ 「남김」보다도 앞이다 — 남기기 예외는 «퇴사 판정»만 면제한다. 내용 대조는 그대로
       한다(편집칸 안내도 「내용 대조만 합니다」라고 적혀 있다). 남김을 먼저 보면
       남긴 사람의 경력을 고쳐 「안 올라감」이 되어도 카드가 조용해, 안 올린 글을
       올린 줄 알게 된다. */
  if (r.status && !DONE_STATUS[r.status]) return true;
  /* ★ 「안 올림」은 사람이 이미 «안 올린다»고 정한 것이라 할 일이 아니다.
     안 빼면 직원을 여섯 명 넣는 순간 할 일이 여섯 개 늘어난다 (대표 결정 2026-09-03). */
  if (r.offSite) return false;
  /* 여기부터는 명부·원장만 보고 아는 것 — 「남김」이 면제하는 자리다 */
  if (r.kept) return false;
  /* 「홈페이지에만」 있는 줄은 위 대조 딱지에서 이미 판정됐다. 우리 명부에 없는 것이
     «당연»한 줄이라 여기서 또 세면 한 줄을 두 번 센다. */
  if (r.liveOnly) return false;
  /* 명부상 퇴사 — 대조 딱지가 «아직 없을» 때만 손댈 것이다(내려갔는지 모르니까) */
  if (r.roster && r.roster.kind === 'left') return !r.status;
  /* 명부에 없음 — 내용이 「같음」이어도 «남김으로 표시해 두라»는 할 일이 남는다.
     그래서 대조 전·후 판정이 같다. */
  return !!r.roster;
}

/* 한 갈래의 다섯 칸을 센다. 갈래가 달라도 이 함수 하나가 만든다 —
   갈래별로 따로 세면 카드끼리 숫자 뜻이 달라진다. */
function statOf(group) {
  const rows = rowsOf(group);
  const own = {};        // ③ 우리 자료 경고 — 종류별 수
  let kept = 0;          // 「남김」은 경고가 아니다. 사람이 이미 판단한 것이라 따로 센다
  rows.forEach(r => {
    if (r.kept) { kept++; return; }
    if (r.roster && !r.liveOnly) own[r.roster.kind] = (own[r.roster.kind] || 0) + 1;
    /* 쪽은 «기준 글자가 없는 것»이 우리 자료 쪽 경고다. 대조 딱지 noBase 는
       확인을 눌러 얻은 결과이지만, 원인은 우리 자료(기준 없음)에 있다. */
    if (r.status === 'noBase') own.nobase = (own.nobase || 0) + 1;
  });
  const hotOwn = Object.keys(own).reduce((s, k) => s + own[k], 0);
  /* ④ 대조로 아는 손댈 것 — 「같음」·「내려감」은 뺀다.
     기준 없음(noBase)은 ③에서 셌으므로 여기서는 빼서 두 번 말하지 않는다. */
  const hotChk = App.check ? rows.filter(r => !r.kept && r.status && !DONE_STATUS[r.status]
    && r.status !== 'noBase' && r.status !== 'unknown').length : 0;
  /* ⑤ 손댈 것 — «줄 수»다. ③+④ 를 더하지 않는다: 박성수처럼 명부 퇴사이면서
     홈페이지에도 남아 있는 사람은 한 사람인데 두 번 세어진다. */
  const hot = rows.filter(needsAttentionRow).length;
  return { rows: rows, own: own, kept: kept, hotOwn: hotOwn, hotChk: hotChk, hot: hot };
}

/* ③ 우리 자료 경고의 종류 — «부품이 실제로 돌려주는 이름»을 열쇠로 쓴다.
   ★ PuHomeDiff.rosterMark 는 left(퇴사) · none(명부에 없음) · dup(동명이인) 셋을 돌려준다.
     여기 이름을 잘못 적어 두면 화면에 열쇠 글자가 그대로 찍힌다 — 실제로 카드에
     「none 1」이 찍혀 있었고, 「명부에 없음」이 할 일 수에도 안 잡혔다(5차 지시로 고침).
     검사(pu-home-screen.test.js)가 rosterMark 가 돌려주는 모든 kind 에 이름이 있는지 본다.
   nobase — 쪽: 대조 기준 글자가 아직 없다.  ended — 자문사: 올림인데 거래가 끝났다. */
const OWN_LABEL = { left: '퇴사 (명부)', none: '명부에 없음', dup: '동명이인', nobase: '기준 없음', ended: '자문 종료' };

/* 딱지에 쓸 «짧은» 이름 — 뒤에 붙은 괄호말을 뗀다.
   ★ 왜 (대표 지적 2026-09-02): 딱지 여섯이 두 줄로 넘쳤고, 줄에서는 「퇴사」 딱지 옆에
     「내릴 것 (퇴사)」가 붙어 «퇴사»가 한 줄에 두 번 적혔다.
   ★ 안내 띠·물음 글은 «긴 이름 그대로» 쓴다 — 거기서는 까닭까지 알려 줘야 한다.
     그래서 STATUS_TEXT·OWN_LABEL 자체는 안 건드리고, 딱지에서만 이것을 지난다. */
function pillShort(s) { return String(s == null ? '' : s).replace(/\s*\([^)]*\)\s*$/, ''); }

/* 줄 설명 — 있는 것만, «같은 말은 한 번만» 이어 붙인다.
   ★ 같은 말이 두 번 나오는 일이 실제로 있다: 명부에서 아는 「퇴사일 2026-06-30」과
     대조 사유가 같은 문장일 수 있다. 그러면 한 줄에 똑같은 말이 두 번 적힌다.
   ★ 인라인으로 두었더니 없애도 걸리는 검사가 없었다 — 그래서 이름을 붙였다.
     이름이 있으면 규칙을 «직접» 시험할 수 있다. */
function joinOnce(parts) {
  return (parts || []).filter(Boolean)
    .filter(function (v, i, a) { return a.indexOf(v) === i; })
    .join(' · ');
}
const OWN_CLS = { left: 'rm', none: 'ask', dup: 'ask', nobase: 'ask', ended: 'rm' };
/* 카드에 적는 «상태 한 마디» (5차 지시).
   ★ 딱지를 갈래마다 넷씩 붙였더니 「정보가 섞여 판단이 어렵다」는 지시를 받았다.
     카드는 「어디에 할 일이 있나」 하나만 답한다. 세부(퇴사 몇·명부에 없음 몇·남김 몇)는
     그 갈래를 누르면 목록 위 «걸러 보기 딱지»에 그대로 있다 — 같은 것을 두 곳에 두면
     눈이 어디를 봐야 할지 모른다.
   ★ 지키던 것은 그대로다: 「대조 안 함」과 「이상 없음」은 다른 말이다. 확인을 안 눌렀는데
     깨끗한 것처럼 보이면 안 된다. 그래서 순서가 중요하다 —
     할 일 있음 → (자문사) 못 함 → 확인 안 함 → 이상 없음. */
function statusChip(group) {
  const s = statOf(group);
  if (group === 'partner' && App.companiesErr) {
    return '<span class="mini bad" title="푸른ERP 업체관리를 읽지 못했습니다">못 읽음</span>';
  }
  if (s.hot) return '<span class="mini bad">할 일 ' + s.hot + '</span>';
  /* 자문사현황은 «못 한다» — 확인을 눌러도 달라지지 않는다(홈페이지가 로고 그림이다).
     「대조 안 함」으로 적으면 누르면 될 것처럼 들린다. */
  if (group === 'partner') {
    return '<span class="mini dash" title="홈페이지가 로고 그림이라 글자 대조를 못 합니다">대조 못 함</span>';
  }
  if (!App.check) return '<span class="mini none">대조 안 함</span>';
  return '<span class="mini ok">이상 없음</span>';
}

const GROUP_UNIT = { members: '명', work: '쪽', inquiry: '쪽', greeting: '쪽', partner: '개사' };

/* 카드의 숫자.
   ★ 자문사현황은 «홈페이지에 올린 회사 수»다. 업체관리 전체(수백 개사)를 적으면
     홈페이지와 아무 상관 없는 숫자가 카드에 박힌다 — 고를 수 있는 업체 수는
     목록 머리에 「업체관리 371개사에서 고름」으로 적는다. */
function cardCount(group) {
  if (group === 'partner') return postedNames().length;
  return statOf(group).rows.length;
}

/* 카드 한 장 = 한 줄이다 (5차 지시): 갈래 이름 · 숫자 · 상태 한 마디. */
function dashHtml() {
  return GROUPS.map(function (g) {
    /* ★ 0 은 «안 그린다» (저장소 규칙: 빈 값은 자리만 차지한다).
       「자문사현황 0개사」가 한 칸을 먹으면서 아무것도 안 알려 주고 있었다.
       상태 한 마디(「대조 못 함」)가 그 자리에서 할 말을 다 한다. */
    const n = cardCount(g.key);
    return '<button class="dcard' + (App.group === g.key ? ' on' : '') + '"'
      + ' onclick="App.go(\'' + g.key + '\')">'
      + '<span class="t">' + esc(g.label) + '</span>'
      + '<span class="n">' + (n ? n + '<em>' + (GROUP_UNIT[g.key] || '개') + '</em>' : '') + '</span>'
      + '<span class="st">' + statusChip(g.key) + '</span>'
      + '</button>';
  }).join('');
}

/* 할 일 — 안내 띠를 모아 둔 칸. 몇 건인지 머리에 적는다.
   ★ 「할 일 0」과 「대조 안 함」은 다르다 — 대조를 안 했으면 띠가 그 사실부터 알린다. */
function todoHtml() {
  const bars = bannersHtml();
  const n = todoCount();
  return '<div class="todo">'
    + '<div class="th">지금 할 일 <span class="c' + (n ? '' : ' zero') + '">' + n + '</span>'
    + '<span style="flex:1"></span>'
    + '<span class="sub">' + (App.check ? '확인 ' + esc(stampShort(App.check.at)) : '아직 대조 안 함')
    + '</span></div>'
    + '<div class="sc">' + (bars || '<div class="empty">손댈 것이 없습니다.</div>') + '</div>'
    + '</div>';
}

/* 할 일 수 — 목록에 실제로 놓인 «할 일 줄 수»다.
   ★ 줄 수를 세지 않는다. 「퇴사 3명」은 할 일 하나(세 사람을 한 번에 내린다)이고,
     못 읽음 같은 사고도 한 건이다. 화면에 보이는 줄 수와 머리 숫자가 어긋나면
     사장님이 무엇을 세고 있는지 알 수 없다. */
function todoCount() { return jobsOf().length; }

/* 명부 딱지 (3차 설계 §3) — 대조 딱지와 «나란히, 따로» 보여준다.
   ★ 「남김」으로 둔 사람에게는 퇴사 딱지 대신 「남김」을 보여준다. 둘 다 붙이면
     왜 퇴사 경고가 없는지가 흐려진다 — 사유는 아래 줄에 그대로 적힌다. */
function rosterPillHtml(r) {
  if (r.kept) return '<span class="pill keep">남김</span>';
  const m = r.roster;
  if (!m) return '';                                   // 재직 중이거나 명부를 못 읽었다
  const cls = OWN_CLS[m.kind] || 'ask';
  return '<span class="pill ' + cls + '">' + esc(m.label) + '</span>';
}

/* 자문사 줄의 «사람이 표시한» 딱지. 표시 안 함은 색을 쓰지 않는다 —
   아직 안 본 것이지 잘못된 것이 아니다. */
function postedPillHtml(r) {
  if (!r || r.posted === undefined) return '';
  if (r.posted === 'yes') return '<span class="pill posted">올림</span>';
  if (r.posted === 'no') return '<span class="pill unposted">안 올림</span>';
  return '<span class="pill none">표시 안 함</span>';
}

/* ══════ 걸러 보기 (4차 지시 ④) ══════
   맨 아래 딱지 안내는 설명만 하고 아무것도 못 했다. 목록 위에 «누르면 걸러지는» 딱지를 둔다.
   ★ 번호는 «걸러도 그대로»다 — 걸러진 목록에서 다시 1,2,3 을 매기면 같은 사람이
     볼 때마다 다른 번호가 되어, 번호로 서로 부를 수 없다. */
function visibleRows(group) {
  let all = rowsOf(group).map((r, i) => Object.assign({ _no: i + 1 }, r));
  /* 이름으로 찾기 — 업체가 수백 개라 찾을 길이 없으면 «회사별로 고르기»를 할 수 없다.
     찾는 글자는 걸러 보기 딱지와 «함께» 걸린다(둘 중 하나만 걸리면 안 된다). */
  const q = String(App.q || '').trim();
  if (q && group === 'partner') {
    const want = q.toLowerCase();
    all = all.filter(r => String(r.name || '').toLowerCase().indexOf(want) >= 0);
  }
  /* ★ 업체 종류로 좁히기 (대표 지시 2026-09-06). 딱지와 «겹쳐» 걸린다 —
     「올림」이면서 「자문」인 곳처럼 둘을 함께 좁힐 수 있어야 한다. */
  if (group === 'partner' && App.coType) {
    all = all.filter(r => feeMatch(r, App.coType));
  }
  /* ★ 거래가 끝난 업체는 «명단에서 자동으로 뺀다»
       (대표 지시 2026-09-03 「업체 종료된 곳은 모두 자동으로 명단 빼라」).
     지우는 것이 아니다 — 「거래 종료」 딱지를 누르면 그대로 다 보인다.
     ⚠ 종료됐는데 「올림」으로 표시돼 있던 곳은 «지금 홈페이지에 그대로 걸려 있다».
       목록에서만 빠지고 조용해지면 손님 화면에서 영영 안 내려간다 —
       그래서 할 일(own:ended)에는 남기고, 그 딱지로는 볼 수 있게 열어 둔다. */
  if (group === 'partner' && App.filter !== 'closed' && App.filter !== 'own:ended') {
    all = all.filter(r => !r.closed);
    /* ★ 사무대행은 자문사가 아니다 (대표 지시 2026-09-06). 66곳이 섞여 있었다.
       ⚠ 감추지 않는다 — 「사무대행」 딱지로 볼 수 있다. */
    if (App.filter !== 'suboffice') all = all.filter(r => !r.subOffice);
    /* ★ 기본 목록은 «사람이 손댄 것»만 세운다 (대표 지시 2026-09-06
         「자료가 너무 길기 때문에 선택적으로 보고 넣기하려는 것이다」).
       왜 — 한 목록이 두 가지 일을 겸하고 있었다: 「업체관리 272곳 훑어보기」와
       「홈페이지에 뭐가 올라갔나 보기」. 앞엣것이 272줄이라 뒤엣것을 통째로 덮었다
       (실제로 272줄이 «전부» 표시 안 함이었고, 올림은 0곳이라 보이지도 않았다).
       훑어보기는 «자문사 고르기» 창이 맡는다 — 거기서는 세 칸으로 한 화면에 60곳이 보인다.
       ⚠ 감추는 것이 아니다. 「아직 안 고름」 딱지를 누르면 그대로 다 나온다.
       ⚠★ 이름을 «찾을 때»는 안 고른 곳도 찾아 준다. 안 그러면 「대성」을 쳤는데
         아무것도 안 나오고, 그 회사가 업체관리에 없는 줄 알게 된다 —
         찾기는 «있는 것을 찾는» 일이지 «고른 것만 찾는» 일이 아니다. */
    if (!App.filter && !q) all = all.filter(r => r.posted !== '');
  }
  const f = App.filter;
  if (!f) return all;
  if (f === 'closed') return all.filter(r => r.closed);
  if (f === 'suboffice') return all.filter(r => r.subOffice);
  if (f === 'kept') return all.filter(r => r.kept);
  if (f.indexOf('kind:') === 0) return all.filter(r => r.mkind === f.slice(5));
  /* 자문사 — 사람이 표시한 값으로 걸러 본다 */
  if (f.indexOf('posted:') === 0) {
    const want = f.slice(7) === 'none' ? '' : f.slice(7);
    return all.filter(r => r.posted === want);
  }
  /* 「손댈 것」은 카드의 빨간 점과 «같은 판단»이라야 한다 — 딱지에 3 이라 적혀 있는데
     눌러 보니 5줄이 나오면 어느 쪽이 맞는지 알 수 없다. */
  if (f === 'todo') return all.filter(needsAttentionRow);
  if (f.indexOf('own:') === 0) {
    const kind = f.slice(4);
    if (kind === 'nobase') return all.filter(r => r.status === 'noBase');
    return all.filter(r => !r.kept && r.roster && r.roster.kind === kind);
  }
  return all.filter(r => r.status === f);
}

/* 걸러 보기 딱지 줄 — «있는 것만» 내놓는다. 0건인 딱지를 늘어놓으면
   무엇을 눌러야 할지가 흐려진다. */
function chipsHtml() {
  const s = statOf(App.group);
  /* ★ 세는 곳과 보이는 곳(visibleRows)이 «같은 규칙»을 써야 한다.
       · 거래가 끝난 곳은 뺀다 (2026-09-03)
       · 자문사 기본은 «손댄 것»만이라, 첫 딱지는 「전체」가 아니라 「고른 것」이다 (2026-09-06)
       · 종류로 좁혀 놓았으면 그 «안에서» 센다 (2026-09-06)
     하나라도 어긋나면 「올림 24」라 적혀 있는데 눌러 보니 10줄이 나온다 —
     그때 사람은 목록이 고장 났다고 여긴다. */
  let all = rowsOf(App.group);
  if (App.group === 'partner' && App.coType) {
    all = all.filter(r => feeMatch(r, App.coType));
  }
  /* 살아있는 = 거래 중이고 «사무대행이 아닌» 곳 — 기본 목록이 세우는 것과 같다 */
  const 살아있는 = App.group === 'partner'
    ? all.filter(r => !r.closed && !r.subOffice) : all;
  const base = App.group === 'partner' ? 살아있는.filter(r => r.posted !== '') : all;
  const defs = [{ k: '', label: App.group === 'partner' ? '고른 것' : '전체', n: base.length }];
  if (s.hot) defs.push({ k: 'todo', label: '손댈 것', n: s.hot });
  Object.keys(s.own).forEach(k => {
    defs.push({ k: 'own:' + (k === 'nobase' ? 'nobase' : k), label: OWN_LABEL[k] || k, n: s.own[k] });
  });
  if (s.kept) defs.push({ k: 'kept', label: '남김', n: s.kept });
  /* 노무사 / 직원 — 홈페이지 구성원 쪽이 그 둘로 나뉘어 있다(대표 지시 2026-09-02).
     ⚠ 한쪽이 0명이면 딱지를 안 낸다 — 눌러 봐야 빈 화면인 딱지는 자리만 먹는다. */
  if (App.group === 'members') {
    MEMBER_KINDS.forEach(mk => {
      const n = all.filter(r => r.mkind === mk.key).length;
      if (n) defs.push({ k: 'kind:' + mk.key, label: mk.label, n: n });
    });
  }
  /* 자문사 — 「올림/안 올림/표시 안 함」으로 걸러 본다. 대조 딱지는 아예 없다(못 한다). */
  if (App.group === 'partner') {
    [['yes', '올림'], ['no', '안 올림']].forEach(([v, label]) => {
      const n = base.filter(r => r.posted === v).length;
      if (n) defs.push({ k: 'posted:' + v, label: label, n: n });
    });
    /* ★ 기본에서 뺀 것을 «볼 길»은 준다 — 빠졌는데 어디로 갔는지 알 수 없으면
       사람은 목록이 잘못됐다고 여긴다. 두 갈래 다 딱지 하나로 꺼내 본다.
       ⚠ 「표시 안 함」이 아니라 「아직 안 고름」이라 적는다 — 표시를 «안 한» 것이 아니라
         아직 «고를 차례가 안 온» 것이다. 272곳이 기본에서 빠진 까닭을 이름이 말해 준다. */
    const 안고름 = 살아있는.filter(r => r.posted === '').length;
    if (안고름) defs.push({ k: 'posted:none', label: '아직 안 고름', n: 안고름 });
    /* 기본에서 뺀 두 갈래를 «갈라» 낸다 — 「거래 종료」와 「사무대행」은 뜻이 다르다.
       한 딱지로 뭉치면 왜 안 보이는지가 흐려진다. */
    const 대행수 = all.filter(r => r.subOffice && !r.closed).length;
    if (대행수) defs.push({ k: 'suboffice', label: '사무대행', n: 대행수 });
    const 끝난수 = all.filter(r => r.closed).length;
    if (끝난수) defs.push({ k: 'closed', label: '거래 종료', n: 끝난수 });
  }
  if (App.check && App.group !== 'partner') {
    /* ★ 「같음」은 만들지 않는다 (대표 결정 2026-09-02 ㉯) — 딱지 여섯이 두 줄로 넘쳤다.
       손댈 것이 없는 줄은 「전체」에서 보시면 된다. 되살리려면 딱지를 더 줄일 길을
       함께 가져올 것 — 그냥 되살리면 두 줄로 돌아간다. */
    ['pending', 'toAdd', 'toRemove', 'liveOnly', 'done'].forEach(st => {
      const n = all.filter(r => r.status === st).length;
      if (n) defs.push({ k: st, label: STATUS_TEXT[st], n: n });
    });
  }
  return '<div class="chips">' + defs.map(d =>
    '<button class="chip' + (App.filter === d.k ? ' on' : '') + '"'
    + ' onclick="App.filt(\'' + esc(d.k) + '\')">' + esc(pillShort(d.label))
    + '<span class="c">' + d.n + '</span></button>').join('')
    + (App.group === 'partner'
        ? '<span class="sub">홈페이지는 로고 «그림»이라 대조를 못 합니다 — 올림 표시는 사람이 합니다</span>'
        : (App.check ? '' : '<span class="sub">확인을 누르면 대조 딱지로도 걸러집니다</span>'))
    + '</div>';
}

/* ★ 목록에는 «번호»를 붙인다(2차 설계 ①). 번호는 사장님이 화면에서 세는 용도다 —
   자료에도, 붙여넣을 글자에도 들어가지 않는다. 번호를 글자에 섞으면 홈페이지에 숫자가 찍힌다. */
/* 목록 머리에 적는 건수. 찾기 칸에 글자를 칠 때 이 조각만 갈아 끼운다. */
function listCountHtml() {
  const all = rowsOf(App.group), rows = visibleRows(App.group);
  if (App.group === 'members') {
    // 명부상 퇴사가 몇 명인지 — 「남김」으로 둔 사람도 명부상 퇴사자다
    const left = all.filter(r => r.roster && r.roster.kind === 'left').length;
    return '구성원 <b>' + all.length + '명</b>' + (left ? ' · <b class="hot">퇴사 ' + left + '</b>' : '')
      + (App.filter ? ' <span class="sub">· 걸러서 ' + rows.length + '건</span>' : '');
  }
  if (App.group === 'work') {
    return '관리 중인 쪽 <b>' + all.length + '개</b>'
      + (App.filter ? ' <span class="sub">· 걸러서 ' + rows.length + '건</span>' : '');
  }
  if (App.group === 'partner') {
    /* ★ 뺀 것을 «갈라» 적는다 (2026-09-03 거래 종료 · 2026-09-06 사무대행) —
       뺀 수는 있을 때만 적는다(0은 안 그린다, 저장소 규칙).
       ⚠ 둘을 한 숫자로 뭉치지 말 것 — 「끝난 곳」과 「사무대행」은 뜻이 다르다. */
    const 끝난수 = all.filter(r => r.closed).length;
    const 대행수 = all.filter(r => r.subOffice && !r.closed).length;
    return '홈페이지에 <b>' + postedNames().length + '개사</b>'
      + ' <span class="sub">· 업체관리 ' + (all.length - 끝난수 - 대행수) + '개사에서 고름'
      + (끝난수 ? ' · 거래 종료 ' + 끝난수 + '곳' : '')
      + (대행수 ? ' · 사무대행 ' + 대행수 + '곳' : '')
      + (끝난수 || 대행수 ? '은 뺐음' : '') + '</span>'
      + (App.filter || App.q ? ' <span class="sub">· 걸러서 ' + rows.length + '건</span>' : '');
  }
  return '';
}

function listHtml() {
  let h = '<div class="list">';
  h += '<div class="lh"><span id="listCount">' + listCountHtml() + '</span>'
    + '<span style="flex:1"></span>'
    + (App.group === 'members' ? '<button class="btn sm" onclick="addMember()">＋ 새 구성원</button>' : '')
    + (App.group === 'work' ? '<button class="btn sm" onclick="addPage()">＋ 쪽 추가</button>' : '')
    /* ★ 자문사는 여기서 회사를 «만들지 않는다». 이름·업종·거래 여부는 푸른ERP 업체관리에서
       고친다 — 두 곳에서 만들 수 있게 하면 어느 쪽이 진짜인지 알 수 없게 된다.
       ⚠ 그렇다고 「업체관리 열기」를 여기 두지 «않는다» (대표 지시 2026-09-06
         「업체관리 클릭하면 푸른이알피로 넘어간다. 그럴 필요 없이 데이터만 가지고 오면 된다」).
         업체 자료는 이 화면이 «이미 다 읽어 와» 272곳을 그리고 있다 — 가져올 것이 없는데
         딴 앱으로 넘어가는 단추만 있었다. 이름·업종을 고칠 일은 가끔이라 앱바로 간다.
       ★ 그 자리에는 «여기서 할 일»을 둔다 — 어느 회사를 올릴지 고르는 것이다. */
    /* ★ 자문사에 대한 것은 «모두 여기»에 모은다 (대표 지시 2026-09-06) —
       고르기도 로고도 자문사 화면 안에서 끝난다. 머리띠에 두지 않는다. */
    + (App.group === 'partner'
        ? '<button class="btn sm pri" onclick="openPartnerPick()">＋ 자문사 고르기</button>'
          + '<button class="btn sm" onclick="openPartnerLogos()"'
          + ' title="자문사 쪽에 보일 로고와 차례를 정합니다">로고 관리</button>' : '')
    + '</div>';
  /* 찾기 칸 — 업체가 수백 개다. 찾을 길이 없으면 «회사별로 고르기»가 안 된다. */
  if (App.group === 'partner') {
    h += '<div class="chips"><input class="find" placeholder="회사 이름으로 찾기"'
      + ' value="' + esc(App.q) + '" oninput="App.find(this.value)">'
      /* ★ 업체 종류로 좁히기 (대표 지시 2026-09-06 「업체관리에도 자문 급여 등이 있어
         이 부분도 필터링 할 수 있게 해야 된다」). 종류는 «업체관리에 있는 것»만 낸다 —
         없는 종류를 늘어놓으면 눌러 봐야 빈 화면이다. */
      + (function () {
          const 갈래 = pickTypes();
          if (!갈래.length) return '';
          return '<select onchange="App.setType(this.value)"'
            + ' title="업체관리의 «자문·급여» 딱지는 실제 거래를 안 따라갑니다 — 자문료로 거릅니다">'
            + '<option value=""' + (App.coType ? '' : ' selected') + '>전체</option>'
            + 갈래.map(t => '<option value="' + esc(t.k) + '"'
                + (App.coType === t.k ? ' selected' : '') + '>'
                + esc(t.label) + ' ' + t.n + '</option>').join('')
            + '</select>';
        })()
      + (App.q ? '<button class="chip" onclick="App.find(\'\')">찾기 지우기</button>' : '') + '</div>';
  }
  h += chipsHtml();
  h += '<div class="sc" id="rowsBox">' + rowsHtml() + '</div></div>';
  return h;
}

/* 줄 목록만. 찾기 칸에 글자를 칠 때 이 조각만 갈아 끼운다(커서가 튀지 않게). */
function rowsHtml() {
  const all = rowsOf(App.group);
  const rows = visibleRows(App.group);
  let h = '';
  if (!all.length) {
    return '<div class="empty">' + (App.group === 'partner'
      ? (App.companiesErr ? '업체관리를 읽지 못했습니다 — 왼쪽 「할 일」의 안내를 보십시오.'
                          : '푸른ERP 업체관리에 업체가 없습니다.')
      : '아직 자료가 없습니다.') + '</div>';
  }
  if (!rows.length) {
    /* ★ 자문사에서 «아직 아무 곳도 안 골랐을 때»는 빈 목록으로 두지 않는다
       (2026-09-06). 272곳을 기본에서 뺐으므로, 여기가 비면 사람은 「업체가 없나?」
       하고 만다 — 몇 곳에서 고를 수 있는지와 «어디서 고르는지»를 함께 말한다.
       ⚠ 「이 딱지에 해당하는 줄이 없습니다」로 끝내지 말 것. 그 말은 다음에 뭘 할지를
         안 알려 준다 — 이 화면이 올림 0곳으로 몇 달을 지낸 까닭이 그것이다. */
    /* ⚠ 종류로 좁혀서 0줄인 것은 «안 골라서» 0줄인 것과 다르다 —
       그때 「아직 아무 곳도 안 골랐습니다」라고 하면 거짓말이 된다. */
    if (App.group === 'partner' && !App.filter && !App.q && !App.coType) {
      const 고를수있는 = all.filter(r => !r.closed && !r.subOffice).length;
      return '<div class="empty">아직 <b>아무 곳도 안 골랐습니다.</b><br>'
        + '<span class="sub">업체관리에 ' + 고를수있는 + '곳이 있습니다 — 홈페이지에 올릴 곳을 고르십시오.</span>'
        + '<div style="margin-top:9px">'
        + '<button class="btn pri" onclick="openPartnerPick()">＋ 자문사 고르기</button></div></div>';
    }
    return '<div class="empty">' + (App.q ? '찾는 이름이 없습니다.' : '이 딱지에 해당하는 줄이 없습니다.')
      + '</div>';
  }
  h += rows.map(function (r, i) {
    /* ★ 설명·사유를 «한 줄»에 이어 붙인다. 줄을 늘리면 사유가 있는 줄만 키가 커져
       62px 고정이 뜻을 잃는다(그게 3차 지시가 고치라던 「줄이 밀린다」이다).
       「남김」 사유는 왜 퇴사 경고가 없는지 알려 주는 것이라 반드시 실린다. */
    /* ★ 명부에서 아는 것(퇴사일 등)도 «줄»에 싣는다.
       2026-09-02 딱지에서 날짜를 뗐는데, 대조 사유(r.reason)는 「홈페이지 다시 확인」을
       누른 뒤에만 붙는다 — 그래서 확인 전에는 날짜가 «아무 데도» 안 보이게 됐다.
       검사가 그것을 잡았다(「목록 줄에 퇴사일이 안 보입니다」). */
    const 명부말 = (r.roster && r.roster.detail) || '';
    const line = joinOnce([r.desc, r.kept ? (r.keptWhy || '(사유 없음)') : '', 명부말, r.reason]);
    return '<div class="r ' + (r.key === App.pick ? 'on' : '') + '" onclick="App.select(\'' + esc(r.key) + '\')">'
      + '<span class="num">' + (r._no || (i + 1)) + '</span>'
      + '<div class="who"><div class="nm">' + esc(r.name) + '</div>'
      + '<div class="po" title="' + esc(line) + '">' + esc(line) + '</div></div>'
      /* 딱지 둘 — 위가 명부 딱지(늘 붙는다), 아래가 대조 딱지(확인을 누를 때만 새로 붙는다).
         ★ 자문사 줄은 대조 딱지 자리에 «사람이 표시한 값»이 온다. 「확인 전」이라고 적으면
           언젠가 대조가 될 것처럼 들린다 — 그 갈래는 대조를 «못 한다». */
      + '<span class="tags">' + rosterPillHtml(r)
      /* ★ 「안 올림」이면 대조 딱지 자리에 그것을 적는다 — 안 올릴 사람에게
         「새로 올릴 것」이 붙어 있으면 할 일인 줄 읽는다. 딱지를 셋 두면 너무 넓다. */
      + (r.offSite ? '<span class="pill unposted">안 올림</span>'
         : (r.noStatusPill ? postedPillHtml(r)
         : '<span class="pill ' + (r.status || 'none') + '">'
           + esc(r.status ? pillShort(STATUS_TEXT[r.status] || r.status) : '확인 전') + '</span>'))
      + '</span></div>';
  }).join('');
  return h;
}

/* ══════════════════════════════════════════════════════════════════════════
   실시간 미리보기 (대표 요청 2026-09-02 「수정하는게 바로 보이면 편할 것 같다」)
   ══════════════════════════════════════════════════════════════════════════
   ★ 보여 주는 것은 «올릴 바로 그 HTML»이다. 화면과 올라가는 것이 같은 글자에서
     나오므로 어긋날 수가 없다.
     ⚠ 목업에서는 ①타이핑 중 DOM 갈아 끼우기 + ②올리기 전 최종 HTML, 두 겹을 그렸다.
       재 보니 최종 HTML 을 다시 그리는 데 85~99ms 라 «즉시»로 느껴진다.
       그래서 한 겹으로 줄였다 — 두 겹은 「화면과 올릴 것이 다르다」는 사고를
       만들 수 있고, 그 위험을 안고 갈 값이 없다.

   ★ 그림·스타일 바탕은 «우리 사본»(이 화면과 같은 곳)을 가리킨다.
     올릴 때 진짜 홈페이지와 사본에 둘 다 올리므로 그림이 같고,
     사본은 절대 딴 데로 넘겨지지 않아 도메인이 붙어도 안 깨진다.

   ★ 홈페이지에 «편집용 스크립트를 심지 않는다» — 그것이 방문자에게도 나간다.
   ★ 미리보기에서 «고치게 하지 않는다» — 어느 쪽이 진짜인지 흐려진다.
   ★ 미리보기를 열어도 «아무것도 올라가지 않는다». */

/* 미리보기 바탕(base) — «그 HTML 이 온 바로 그 주소»여야 한다.
   ★ 왜 이게 중요한가 (2026-09-03 고침):
     처음에 base 를 우리 사본으로 잡았다가 미리보기가 «민무늬»로 나왔다.
     「이 쪽 읽어오기」는 옛 홈페이지를 읽는데, 그 쪽은 주소를 «뿌리부터»(/files/…) 쓴다.
     뿌리부터 쓰는 주소는 base 를 어디로 잡든 «오리진»에 붙으므로
     nabaho.github.io/files/… 를 찾다가 스타일·그림이 통째로 404 가 났다.
     ⚠ base 의 «경로»는 상대 주소에만 듣는다 — 뿌리부터 쓰는 주소에는 안 듣는다.
   ★ 쪽(주요업무·인사말·오시는길)은 옛 홈페이지에서 온다 → 그 쪽 주소를 바탕으로.
   ★ 구성원 쪽은 새 홈페이지에서 온다(상대 주소를 쓴다) → 우리 사본을 바탕으로.
     사본은 이 화면과 같은 곳이라 도메인이 어떻게 되든 안 깨진다. */
function 쪽바탕(mid) {
  try { return PuHomeExport.ORIGIN + '/' + mid; } catch (e) { return ''; }
}
function 사본바탕(mid) {
  try { return new URL('site/' + mid + '/', location.href).href; } catch (e) { return ''; }
}

/* srcdoc 은 «주소가 없다» — 상대 주소로 된 그림·스타일이 다 깨진다.
   그래서 머리에 base 를 끼운다 (2026-09-02 확인: 이러면 깨진 그림 0개). */
function base끼우기(html, b) {
  if (!b) return html;
  const t = '<base href="' + b + '">';
  return /<head[^>]*>/i.test(html)
    ? html.replace(/<head([^>]*)>/i, '<head$1>' + t)
    : t + html;
}

/* 지금 고르신 것의 «올릴 HTML». 못 만들면 왜인지 함께 돌려준다.
   ★ 아무것도 올리지 않는다 — 글자를 만들어 보기만 한다. */
function 미리보기HTML() {
  const g = App.group;
  if (g === 'partner') {
    return { why: '자문사현황은 로고 «그림»이라 여기서 미리 볼 것이 없습니다.\n'
      + '위 「자문사 로고 관리」에서, 붙인 로고를 실제 배경 위에 보여 드립니다.' };
  }
  if (g === 'members') {
    if (!App.sitePeople) {
      return { why: '구성원 쪽을 아직 안 읽었습니다.', 읽기: true };
    }
    if (App.previewMode === 'now') return { mid: 'people', 바탕: 사본바탕('people'), html: App.sitePeople, 지금: true };
    try {
      /* ★ 「안 올림」은 빼고 그린다 — 올릴 것과 같은 것을 보여 줘야 한다 */
      const ours = Object.keys(App.members)
        .filter(function (k) { return !offSiteOf(App.members[k]); })
        .map(function (k) { return Object.assign({}, App.members[k], { key: k }); });
      const 고른것 = PuSitePeople.올릴사람(App.sitePeople, ours);
      return { mid: 'people', 바탕: 사본바탕('people'),
               html: PuSitePeople.쪽그리기(App.sitePeople, 고른것.갈것),
               몇: 고른것.갈것.length };
    } catch (e) { return { why: '구성원 쪽을 만들지 못했습니다 — ' + (e && e.message) }; }
  }
  /* 쪽 갈래 */
  const mid = App.pick;
  if (!mid) return { why: '왼쪽 목록에서 쪽을 하나 고르십시오.' };
  const 지금쪽 = App.pageHtml[mid];
  if (!지금쪽) return { mid: mid, why: '이 쪽을 아직 안 읽었습니다.\n'
    + '편집칸의 「이 쪽 읽어오기」(또는 머리띠의 「홈페이지 다시 확인」)를 누르십시오.' };
  if (App.previewMode === 'now') return { mid: mid, 바탕: 쪽바탕(mid), html: 지금쪽, 지금: true };
  /* ★ pageFixList 를 쓴다 — 여기가 «몇 번째»(n)와 «모두 몇 군데»(of)를
     실어 보내는 자리다. 지우개(PuSitePage.고칠줄)는 글자만 넘기므로
     똘잔은 줄을 못 짚았다 — 그러면 때 자물쇠가 다시 생긴다. */
  const 고칠것 = pageFixList(mid);
  if (!고칠것.length) return { mid: mid, 바탕: 쪽바탕(mid), html: 지금쪽, 안바꿈: true };
  try {
    const out = PuSitePage.쪽고치기(지금쪽, 고칠것, PuHomeFill.applyLineEdits);
    return { mid: mid, 바탕: 쪽바탕(mid), html: out.html,
             바뀐줄: out.done.map(function (x) { return x.after; }),
             건너뜀: out.skipped.length };
  } catch (e) { return { mid: mid, why: '고친 것을 그리지 못했습니다 — ' + (e && e.message) }; }
}

     바뀐 줄에 표시를 붙이는 일은 다 그린 «뒤»에 DOM 에서 한다
     (HTML 글자를 건드리면 올릴 것과 달라진다). */
  const 표시 = JSON.stringify(r.바뀐줄 || []).replace(/"/g, '&quot;');

}

/* 바뀐 자리에 «노란 표시»를 붙인다 — 미리보기에만 붙고 홈페이지에는 안 나간다 */
function markPreview(fr) {
  let 말들 = [];
  try { 말들 = JSON.parse(fr.getAttribute('data-marks') || '[]'); } catch (e) { 말들 = []; }
  if (!말들.length) return;
  let d = null;
  try { d = fr.contentDocument; } catch (e) { return; }
  if (!d || !d.body) return;
  const st = d.createElement('style');
  st.textContent = '.pu-mk{background:#fde68a;color:#854d0e;border-radius:2px;padding:0 2px}';
  (d.head || d.body).appendChild(st);
  말들.forEach(function (말) {
    const 찾을것 = String(말 || '').trim();
    if (찾을것.length < 2) return;
    const walk = d.createTreeWalker(d.body, 4 /* TEXT_NODE */);
    const 걸린것 = [];
    let n;
    while ((n = walk.nextNode())) {
      if (n.nodeValue && n.nodeValue.indexOf(찾을것) >= 0) 걸린것.push(n);
    }
    걸린것.forEach(function (t) {
      const i = t.nodeValue.indexOf(찾을것);
      if (i < 0) return;
      const 뒤 = t.splitText(i);
      뒤.splitText(찾을것.length);
      const sp = d.createElement('span');
      sp.className = 'pu-mk';
      뒤.parentNode.replaceChild(sp, 뒤);
      sp.appendChild(뒤);
    });
  });
}
window.markPreview = markPreview;

/* 새 창으로 — 모니터가 둘일 때. 같은 곳이라 창에 그대로 그려 준다. */
function openPreviewWindow() {
  const r = 미리보기HTML();
  if (!r.html) { say('미리 볼 것이 없습니다', r.why || ''); return; }
  const w = window.open('', 'puPreview');
  if (!w) { say('새 창이 막혔습니다', '브라우저가 새 창을 막았습니다 — 주소창 오른쪽의 막음 표시를 풀어 주십시오.'); return; }
  w.document.open();
  w.document.write(base끼우기(r.html, r.바탕));
  w.document.close();
  w.focus();
}
window.openPreviewWindow = openPreviewWindow;

/* 구성원 쪽을 읽어 둔다 — 미리보기가 그것을 바탕으로 다시 그린다 */
async function readPeoplePage() {
  if (App.previewReading) return;
  App.previewReading = true; App.render();
  try {
    const res = await fetch(SITE_BASE + '/people/index.html?t=' + Date.now());
    if (!res.ok) throw new Error('서버가 ' + res.status + ' 을 돌려줬습니다');
    App.sitePeople = await res.text();
  } catch (e) {
    console.warn('[미리보기 구성원 쪽]', e);
    await say('구성원 쪽을 읽지 못했습니다', (e && e.message) || String(e));
  } finally {
    App.previewReading = false; App.render();
  }
}

/* ══════ 자문사 편집칸 ══════
   다른 갈래와 «같은 틀»이다: 머리 고정 → 가운데 구름 → 발 고정.
   다만 고칠 «우리 글»이 없다 — 회사 자료는 업체관리 것이고, 여기서 더하는 것은
   「홈페이지에 올렸는지」와 그 사유뿐이다. */

    + (c.ceo ? ' · 대표 ' + esc(c.ceo) : '') + '</span></div>'
    + (c.industry ? '<div class="l"><span class="t">업종 ' + esc(c.industry) + '</span></div>' : '')

    + '<button class="' + (d.posted === 'no' ? 'on' : '') + '" onclick="markPosted(false)">안 올림</button>'

  h += '<div class="fld"><label>메모 (왜 올렸는지·왜 안 올렸는지) — 단추를 다시 누르면 함께 저장됩니다</label>'

/* 올린 회사 이름만 줄줄이 — 붙여넣을 내용은 여기까지다. 로고 그림은 사람이 올린다. */

/* 편집칸 머리 띠 (3차 설계 §3) — 명부만 보면 아는 것을 «확인 전에도» 알린다.
   ★ 명부 딱지는 «홈페이지에 올라가 있는지»를 모른다. 그건 대조 딱지가 할 말이다.
     확인 전에 「아직 올라가 있습니다」라고 단정하면 두 딱지를 섞는 것이 된다 —
     그래서 대조 결과(App.check)가 있을 때만 그 말을 한다.
   ★ 내리는 방법은 «삭제가 아니라 비공개»다. 잘못 내렸어도 되살릴 수 있어야 한다. */
/* 채우기 단추가 «못 채우는» 칸들. 대조가 견주는 칸은 넷(이름·직책1·직책2·경력사항)인데
   단추는 경력사항 하나만 채운다. 나머지가 다르면 눌러도 딱지가 안 바뀐다. */
function fillGapFields(st) {
  /* ★ 무엇을 채울 수 있는지는 «부품»이 정한다(PuHomeFill.MEMBER_FIELDS).
     화면이 따로 외워 두면, 채우는 칸이 늘었을 때 화면만 옛말을 한다. */
  const can = ((typeof PuHomeFill !== 'undefined' && PuHomeFill.MEMBER_FIELDS) || []).map(f => f.key);
  return (((st || {}).fields) || []).filter(f => can.indexOf(f) < 0);
}

/* 그 사실을 한 줄로 알린다 — 어디를 손으로 고쳐야 하는지까지 */
function fillGapNote(st, 어디) {
  const gap = fillGapFields(st);
  if (!gap.length) return '';
  return '<b>' + esc(gap.join('·')) + '</b>이(가) 홈페이지와 다릅니다. '
    + '이 칸은 채우기 단추가 <b>손대지 않으므로</b>, <b>홈페이지 편집 화면에서 손으로</b> '
    + '고쳐 주셔야 「같음」이 됩니다.'
    + (어디 ? '<br><span class="sm">' + 어디 + '</span>' : '');
}

/* ★ 홈페이지에서 «비공개»로 바꾸는 쪽지를 만든다 (대표 지시 2026-08-31 「비공개 버튼 만들어달라」).
   ★ «지우지» 않는다. 감추는 것이라 언제든 되살릴 수 있다 — 잘못 내려도 되돌아갈 길이 남는다.
   ★ 저장은 단추가 «물어본 뒤에» 누른다. 말없이 저장하면 되돌릴 틈이 없다. */
async function copyPrivate(key) {
  const d = App.draft && App.draft.key === key ? App.draft : null;
  const rec = App.members[key] || {};
  const name = (d && d.name) || rec.name || '';
  const srl = String((d && d.srl) || rec.srl || '').trim();
  if (!srl) {
    /* 글 번호가 없으면 어느 글을 내릴지 알 수 없다 — 엉뚱한 글을 내리지 않는다 */
    await say('홈페이지 글 번호가 없습니다',
      '이분의 «홈페이지 글 번호»가 비어 있어 어느 글을 내릴지 알 수 없습니다.\n'
      + '먼저 위 「홈페이지 글 번호」 칸을 채워 주십시오.');
    return;
  }
  copyText(PuHomeFill.packPrivate(srl, name));
  const url = PuHomeExport.editUrl('member', srl);
