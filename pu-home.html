<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홈페이지 관리 — 푸른노무법인</title>
<!--
  홈페이지 관리 — 회사 홈페이지(라이믹스)의 구성원 소개·주요업무·오시는길·인사말 글을
  통합시스템에서 관리하고, 홈페이지에 «붙여넣을 내용»을 만들어 준다.

  설계서: docs/superpowers/specs/2026-08-16-홈페이지-관리-design.md
  목업:   docs/mockups/homepage-manage.html

  ★ 이 화면은 홈페이지를 «직접 바꾸지 않는다». 마지막 붙여넣기 한 번은 사람이 한다.
    자동 전송은 관리자 비밀번호를 서버에 두어야 해서 설계에서 일부러 뺐다.
    "편해지니 자동으로 보내자"로 되돌리지 말 것.

  ★ 판단은 전부 js/pu-home-*.js 네 부품이 한다. 화면은 그 결과를 보여주기만 한다.
    같은 판단을 화면 안에서 다시 만들면 두 곳이 서로 다른 답을 낸다.
-->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="js/pu-version.js?v=1"></script>
<script src="js/pu-appbar.js?v=4"></script>
<script src="js/pu-home-parse.js?v=3"></script>
<script src="js/pu-home-career.js?v=1"></script>
<script src="js/pu-home-export.js?v=2"></script>
<script src="js/pu-home-diff.js?v=6"></script>
<style>
/* ★ 색값·간격은 승인된 목업(docs/mockups/homepage-manage-v4.html)에서 그대로 가져왔다.
   새로 만들지 말 것 — 목업이 배치·색·글귀의 기준이다. */
:root{
  --navy:#2E3A8C; --navy-soft:#EEF1FB;
  --ink:#1F2233; --sub:#6E7288; --faint:#9AA0B4;
  --line:#E6E8F0; --line-soft:#F1F3F8;
  --paper:#F7F8FB; --card:#FFF;
  --ok:#2E7D4F; --ok-bg:#EFF9F3;
  --warn:#B26A00; --warn-bg:#FFF8EC;
  --bad:#C43D3D; --bad-bg:#FDF2F2;
  --info:#1D4ED8; --info-bg:#EFF4FF;
}
*{box-sizing:border-box;margin:0}
html{height:100%}
/* ★ 페이지 자체는 굴리지 않는다 (3차 설계 §2 — 흔들림의 뿌리).
   오른쪽 편집칸 높이가 사람마다 달라(경력 7줄 / 18줄) 고르는 사람이 바뀔 때마다
   페이지 길이가 늘었다 줄었다 하며 스크롤이 튀었다. 틀을 창에 맞춰 붙박이로 두고,
   목록과 편집칸이 «각각 제 몸 안에서» 구른다. */
body{height:100%;overflow:hidden;display:flex;flex-direction:column;
  font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--paper);
  color:var(--ink);font-size:14px;line-height:1.7}
header{flex:none;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 18px}
header .brand{font-weight:800;font-size:16px;cursor:pointer}
header .who{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:10px}
header .out{background:#ffffff22;border:1px solid #ffffff66;color:#fff;border-radius:8px;padding:3px 10px;
  cursor:pointer;font-size:12px;font-family:inherit}
/* ★ 폭을 묶지 않는다 (4차 지시) — 1320px 로 묶어 두어 1900px 화면에서 양옆이 통째로
   남았다. 되찾은 폭으로 왼쪽에 기둥(대시보드+할 일)을 세우고 목록을 360→390px 로 넓혔다. */
main{flex:1;min-height:0;width:100%;padding:10px 12px;
  display:flex;flex-direction:column}
.gate{flex:none;padding:40px 18px;text-align:center;color:var(--sub)}
.btn{border:1px solid #D3D8E4;background:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;
  font-weight:700;cursor:pointer;font-family:inherit;color:#3A3F55;white-space:nowrap}
.btn:hover{background:#FAFBFD}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{padding:3px 9px;font-size:11.5px;border-radius:7px}
.btn.keep{border-color:#BCE5CD;background:var(--ok-bg);color:#166534}
.sub{color:var(--sub);font-size:12px}

/* ── 앱 틀: 상단 고정 → 안내 띠 → 몸통(목록·편집칸) → 딱지 안내 ── */
.app{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 1px 2px rgba(31,34,51,.04)}

/* ── 상단 고정 (머리띠 + 갈래 탭) ── */
.top{position:sticky;top:0;z-index:5;flex:none;background:#fff;border-bottom:1px solid var(--line)}
.appbar{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.appbar .ttl{font-weight:800;font-size:16px;letter-spacing:-.2px}
.appbar .when{font-size:12.5px;color:var(--faint)}
.appbar .sp{flex:1}
.appbar select{border:1px solid #D3D8E4;border-radius:8px;padding:4px 8px;font-size:12.5px;font-family:inherit}

/* ── 왼쪽 기둥: 대시보드 카드(위) + 할 일(아래) ──
   ★ 갈래를 «탭»에서 «카드»로 바꿨다 (4차 지시, 목업 v6b). 탭은 숫자 하나(항목 수)만
     보여 줘서, 확인을 안 눌렀는데도 손댈 것이 없는 것처럼 읽혔다.
   ★ 카드는 다섯 갈래가 «같은 규격»이다 — 이름 · 총수 · ③우리 자료 경고(바로 안다) ·
     ④대조 결과(확인 눌러야 안다) · 빨간 점. ③과 ④는 점선으로 갈라 둔다.
     뭉치면 「확인을 안 눌러 0건」과 「깨끗해서 0건」이 같은 모양이 된다.
   설계 근거: docs/mockups/homepage-dash-spec.html */
/* ★ 5차 지시 — 카드를 «두 줄»로 눌렀다. 네 줄(이름·큰 숫자·경고·대조)짜리 카드 다섯 장은
   기둥 높이를 넘겨서 스스로 굴렀고, 그래서 맨 위 「구성원 소개」가 잘려 안 보였다.
   굴려야 보이는 대시보드는 대시보드가 아니다 — 다섯 장이 «한눈에» 들어와야 한다.
   숫자는 이름 오른쪽으로, ③·④ 는 아래 한 줄에 세로 점선으로 갈라 둔다(뜻은 그대로). */
.rail{width:276px;flex:none;min-height:0;border-right:1px solid var(--line);background:#FCFCFE;
  display:flex;flex-direction:column}
.rail .rh{flex:none;padding:6px 12px;background:#fff;border-bottom:1px solid var(--line);
  font-size:11.5px;font-weight:800;color:var(--faint);letter-spacing:.2px}
.dash{flex:none;display:flex;flex-direction:column;gap:5px;padding:7px 8px;
  border-bottom:1px solid var(--line)}
.dcard{text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;
  padding:5px 9px 6px;cursor:pointer;font-family:inherit;color:inherit;
  display:flex;flex-direction:column;gap:1px}
.dcard:hover{border-color:#C6CCE0}
.dcard.on{border-color:var(--navy);background:var(--navy-soft);box-shadow:inset 0 0 0 1px var(--navy)}
.dcard.off{opacity:.55;cursor:default;background:#FAFBFD}
/* 첫 줄 — 갈래 이름 + (오른쪽) 숫자 */
.dcard .t{font-size:12.5px;font-weight:800;color:#4A4F66;display:flex;align-items:baseline;gap:6px}
.dcard.on .t{color:var(--navy)}
.dcard .dot{width:6px;height:6px;border-radius:50%;background:var(--bad);flex:none;
  align-self:center}
.dcard .n{margin-left:auto;font-size:15px;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
.dcard.on .n{color:var(--navy)}
.dcard .n em{font-size:11.5px;font-weight:700;color:var(--sub);font-style:normal;margin-left:1px}
/* 둘째 줄 — ③ 우리 자료 경고 │ ④ 대조 결과 */
.dcard .ln{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.dcard .own{display:flex;gap:4px;flex-wrap:wrap}
.dcard .chk{display:flex;gap:4px;flex-wrap:wrap}
.dcard .own:not(:empty) + .chk{border-left:1px dashed #D3D8E4;padding-left:6px;margin-left:2px}
.mini{font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;white-space:nowrap;
  border:1px solid transparent}
.mini.rm{background:var(--warn-bg);color:#9A3412;border-color:#F3DCA9}
.mini.ask{background:var(--info-bg);color:var(--info);border-color:#C8D8FB}
.mini.bad{background:var(--bad-bg);color:#B42318;border-color:#F3C8C8}
.mini.ok{background:var(--ok-bg);color:#166534;border-color:#BCE5CD}
.mini.flat{background:var(--line-soft);color:var(--sub)}
/* «아직 안 봤다» — 색을 쓰지 않는다. 이것을 초록(깨끗함)으로 두면 조용히 틀린다 */
.mini.none{background:#fff;color:var(--faint);border-color:var(--line)}

/* 할 일 — 안내 띠를 여기 모은다. 위에 쌓아 두면 몸통 높이를 최대 34% 까지 먹었다 */
.todo{flex:1;min-height:0;display:flex;flex-direction:column}
.todo .th{flex:none;display:flex;align-items:center;gap:7px;padding:7px 13px;background:#fff;
  border-bottom:1px solid var(--line);font-size:12.5px;font-weight:800}
.todo .th .c{background:var(--bad);color:#fff;border-radius:20px;padding:0 7px;font-size:11px}
.todo .th .c.zero{background:var(--line-soft);color:var(--sub);font-weight:800}
.todo .sc{flex:1;min-height:0;overflow-y:auto;padding:8px 9px 12px}
.todo .bar{font-size:12.5px;padding:8px 11px;line-height:1.65}
.todo .bar .go{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.todo .bar details{margin-top:5px}
.todo .bar summary{cursor:pointer;font-weight:800;font-size:12px}

/* 걸러 보기 딱지 — 설명만 하던 딱지가 «누르면 걸러지는» 단추가 된다 */
.chips{flex:none;display:flex;gap:5px;flex-wrap:wrap;padding:6px 13px 7px;
  border-bottom:1px solid var(--line);background:#fff}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:2px 9px;font-size:11px;
  font-weight:800;color:var(--sub);cursor:pointer;font-family:inherit}
.chip:hover{border-color:#C6CCE0}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .c{opacity:.65;margin-left:3px}
/* 이름으로 찾기 — 업체가 수백 개라 찾을 길이 없으면 회사별로 고를 수 없다 */
.chips .find{flex:1;min-width:120px;border:1px solid #D3D8E4;border-radius:8px;padding:4px 9px;
  font-size:12.5px;font-family:inherit;color:var(--ink)}
.chips .find:focus{border-color:var(--navy);outline:none}

/* 자문사 표시 — 사람이 손으로 남긴 값이다.
   「표시 안 함」은 색을 쓰지 않는다(.pill.none): 아직 안 본 것이지 잘못된 것이 아니다. */
.pill.posted{background:var(--ok-bg);color:#166534;border:1px solid #BCE5CD}
.pill.unposted{background:var(--line-soft);color:#475467;border:1px solid var(--line)}
/* 세 갈래 중 하나를 고르는 단추줄 (올림·안 올림·표시 안 함) */
.seg{display:flex;border:1px solid #D3D8E4;border-radius:8px;overflow:hidden;width:max-content}
.seg button{border:none;background:#fff;padding:6px 14px;font-size:12.5px;font-weight:700;
  font-family:inherit;color:var(--sub);cursor:pointer;border-right:1px solid #D3D8E4}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
.seg button:hover:not(.on){background:#FAFBFD}
.bar{border-radius:10px;padding:9px 13px;font-size:13px;margin-bottom:9px;line-height:1.7}
.bar.bad{background:var(--bad-bg);border:1px solid #F3C8C8;color:#8C2B2B}
.bar.warn{background:var(--warn-bg);border:1px solid #F3DCA9;color:#7C4A03}
.bar.ok{background:var(--ok-bg);border:1px solid #BCE5CD;color:#1E5631}
.bar.info{background:var(--info-bg);border:1px solid #C8D8FB;color:#1E3A8A}
.bar b{font-weight:800}

/* ── 몸통: 3단(기둥·목록·편집칸), 높이 붙박이 ── */
.body{flex:1;min-height:0;display:flex}

/* 목록 — 360 → 390px (대표 지시). 직책이 「…」로 잘리는 일이 줄어든다. */
.list{width:390px;flex:none;min-height:0;border-right:1px solid var(--line);background:#FCFCFE;
  display:flex;flex-direction:column}
.list .lh{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;
  border-bottom:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--sub)}
.list .lh b{color:var(--ink)}
.list .lh .hot{color:var(--bad)}
/* 목록만 구른다 — 목록을 굴려도 편집칸은 가만히 있다 */
.list .sc{flex:1;min-height:0;overflow-y:auto}
/* 줄 높이를 못 박는다 — 딱지가 둘이어도 줄이 안 밀린다 */
.list .r{display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--line-soft);min-height:62px;cursor:pointer}
.list .r:hover{background:#fff}
.list .r.on{background:#fff;box-shadow:inset 3px 0 0 var(--navy)}
.list .who{min-width:0;flex:1}
.list .nm{font-weight:700;font-size:14px}
/* ★ 한 줄로 잘라 «…» 로 끝낸다. 여러 줄로 흐르게 두면 사유가 긴 줄만 키가 커져
   62px 고정이 뜻을 잃는다 — 긴 글 전문은 마우스를 올리면(title) 보이고,
   편집칸 머리 띠에는 늘 통째로 적혀 있다. */
.list .po{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 딱지 둘(명부 딱지 · 대조 딱지)을 위아래로 쌓는다 — 나란히 두면 이름을 밀어낸다 */
.tags{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;margin-left:auto}

/* 목록 번호 — 화면에서 세는 용도. 붙여넣을 글자에는 들어가지 않는다 */
.num{width:20px;flex:none;text-align:right;color:var(--faint);font-size:12px;font-weight:800;
  font-variant-numeric:tabular-nums;user-select:none}

/* ── 편집칸: 머리·발 고정, 가운데만 구른다 ── */
.edit{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff}
.ehd{flex:none;padding:12px 18px 0}
.esc{flex:1;min-height:0;overflow-y:auto;padding:12px 18px 16px}
/* 경력이 길어도 「저장」·「복사」가 늘 같은 자리에 있다 */
.eft{flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 18px;
  border-top:1px solid var(--line);background:#FCFCFE}

/* 편집칸 머리 띠 — 퇴사·남김·명부없음을 알린다 */
.band{border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:8px;line-height:1.7}
.band.rm{background:var(--warn-bg);border:1px solid #F3DCA9;color:#7C2D12}
.band.keep{background:var(--ok-bg);border:1px solid #BCE5CD;color:#14532D}
.band.ask{background:var(--info-bg);border:1px solid #C8D8FB;color:#1E3A8A}
.band.bad{background:var(--bad-bg);border:1px solid #F3C8C8;color:#8C2B2B}
.band b{font-weight:800}
.band .sm{color:var(--sub);font-size:12px}

/* 홈페이지와 같은 줄 모양으로 보여주는 칸 (보기 전용) */
.rows{border:1px solid #D3D8E4;border-radius:9px;background:#fff;overflow:hidden;font-size:13.5px}
.rows .l{display:flex;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line-soft)}
.rows .l:last-child{border-bottom:0}
.rows .l:hover{background:#FCFCFE}
.rows .n{width:20px;flex:none;text-align:right;color:var(--faint);font-size:11.5px;font-weight:800;
  font-variant-numeric:tabular-nums}
.rows .t{flex:1;min-width:0;word-break:break-word}
.rows .l.head .t{font-weight:800;color:var(--navy)}
.rows .l.tag .t{font-weight:800;color:var(--warn);font-size:12.5px}

/* 딱지 — 배경·선을 한 톤 낮추고 «딱지만» 색을 남겼다.
   상태 없는 줄은 흰 딱지라 눈에 안 걸리고, 퇴사·남김·명부없음만 도드라진다. */
.pill{font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px;white-space:nowrap}
.pill.same{background:var(--line-soft);color:var(--sub)}
.pill.pending{background:var(--bad-bg);color:#B42318;border:1px solid #F3C8C8}
.pill.toAdd{background:var(--info-bg);color:var(--info);border:1px solid #C8D8FB}
.pill.toRemove{background:var(--warn-bg);color:#9A3412;border:1px solid #F3DCA9}
.pill.liveOnly{background:var(--warn-bg);color:#9A3412;border:1px solid #F3DCA9}
.pill.done{background:var(--ok-bg);color:#166534;border:1px solid #BCE5CD}
.pill.unknown{background:var(--line-soft);color:var(--faint)}
/* 기준 없음 — «오류(빨강)» 가 아니라 «해야 할 일(파랑)» 로 보이게 toAdd 와 같은 색을 쓴다 */
.pill.noBase{background:var(--info-bg);color:var(--info);border:1px solid #C8D8FB}
/* 아직 대조를 안 눌렀다 — 색을 안 쓴다. 상태가 없는 줄이 눈에 걸리면 안 된다. */
.pill.none{background:#fff;color:var(--faint);border:1px solid var(--line)}
/* 「홈페이지에 남기기」 예외 표시 — 왜 퇴사 경고가 없는지 목록에서 바로 보이게 한다 */
.pill.keep{background:var(--ok-bg);color:#166534;border:1px solid #BCE5CD}
/* 명부 딱지 (3차 설계 §3) — 대조 딱지와 «다른 것»이다. 화면을 열 때 바로 붙는다. */

function esc(s) {

     askYes(제목, 몸말, 단추이름)  — 예·아니오. 그만두면 false
     askText(제목, 몸말, 옵션)     — 여러 줄 입력. 그만두면 null, 빈칸이면 ''
   ★ askText 는 «그만두기(null)»와 «빈 값('')»을 갈라 돌려준다. 사유를 비운 것과
     스스로 그만둔 것은 할 말이 다르다 — 뭉개면 그만둔 사람에게 잔소리를 하게 된다. */
const Dlg = { done: null };

function dlgEnd(value) {
  const fn = Dlg.done;
  Dlg.done = null;
  const el = $('dlg');
  if (el) el.classList.remove('on');
  if (fn) fn(value);
}

function dlgShow(html, done) {
  /* 창이 겹치면 «앞선 물음»을 그만두기로 끝낸다 — 답을 기다리는 약속이 영원히 안
     끝나면, 부른 쪽이 멈춰 서서 또 「아무 일도 안 일어나는」 화면이 된다. */
  if (Dlg.done) dlgEnd(null);
  Dlg.done = done;
  $('dlgCard').innerHTML = html;
  $('dlg').classList.add('on');
  const t = $('dlgText');
  if (t && t.focus) t.focus();
}

function dlgOk() { dlgEnd(true); }
function dlgCancel() { dlgEnd(null); }
function dlgTextOk() {
  const t = $('dlgText');
  dlgEnd(t ? String(t.value) : '');
}
function dlgBackdrop(e) { if (e.target === $('dlg')) dlgCancel(); }
window.dlgOk = dlgOk; window.dlgCancel = dlgCancel;
window.dlgTextOk = dlgTextOk; window.dlgBackdrop = dlgBackdrop;

/* 몸말(body)은 «이미 이스케이프된» HTML 로 받는다. 사람 이름·사유처럼 바깥에서 온
   글자를 넣을 때는 부르는 쪽에서 esc() 를 씌운다. */
function say(title, body) {
  return new Promise(function (res) {
    dlgShow('<h2>' + esc(title) + '</h2>'
      + (body ? '<div class="why">' + body + '</div>' : '')
      + '<div class="dlgFoot"><span style="flex:1"></span>'
      + '<button class="btn pri" onclick="dlgOk()">확인</button></div>',
      function () { res(); });
  });
}

function askYes(title, body, okLabel) {
  return new Promise(function (res) {
    dlgShow('<h2>' + esc(title) + '</h2>'
      + (body ? '<div class="why">' + body + '</div>' : '')
      + '<div class="dlgFoot"><span style="flex:1"></span>'
      + '<button class="btn" onclick="dlgCancel()">그만두기</button>'
      + '<button class="btn pri" onclick="dlgOk()">' + esc(okLabel || '예') + '</button></div>',
      function (v) { res(v === true); });
  });
}

function askText(title, body, opt) {
  const o = opt || {};
  return new Promise(function (res) {
    dlgShow('<h2>' + esc(title) + '</h2>'
      + (body ? '<div class="why">' + body + '</div>' : '')
      + '<textarea id="dlgText" rows="' + (Number(o.rows) || 3) + '" placeholder="'
      + esc(o.hint || '') + '">' + esc(o.value || '') + '</textarea>'
      + '<div class="dlgFoot"><span style="flex:1"></span>'
      + '<button class="btn" onclick="dlgCancel()">그만두기</button>'
      + '<button class="btn pri" onclick="dlgTextOk()">' + esc(o.ok || '저장') + '</button></div>',
      function (v) { res(v === null || v === undefined ? null : String(v)); });
  });
}

/* ══════ 화면 상태 ══════ */
const App = {
  group: 'members', pick: '', me: null, myName: '', isAdmin: null,
  members: {}, pages: {}, staff: null, staffErr: '', lineFormat: 'plain',
  /* pageConfig — 관리 대상 쪽 목록(자료 homepage/config/pages 그대로).
     pageLines — 홈페이지에서 읽어온 «줄 목록». 보여주기 전용이고 저장하지 않는다.
     ★ 우리가 저장해 둔 대조 기준 글자는 줄을 뭉쳐 놓은 것이라 줄 모양을 «지어낼 수 없다».
       그래서 홈페이지를 읽기 전에는 비어 있고, 화면은 그 사실을 정직하게 알린다. */
  pageConfig: {}, pageLines: {},
  /* filter — 목록을 «누른 딱지»로 걸러 본다. 화면에서만 쓰는 상태로 저장하지 않는다.
     빈 글자면 전체다. 갈래를 옮기면 푼다(App.go). */
  filter: '',
  /* companies — 푸른ERP 업체관리(data/companies)를 «읽기만» 한 것. 여기서 고치지 않는다.
     partners  — 그 업체를 홈페이지에 올렸는지 «사람이» 표시한 값(homepage/partners).
     companiesErr — 업체관리를 «못 읽은» 것. 「업체가 없다」와 반드시 갈라 말한다.
     q — 자문사 목록에서 이름으로 찾는 글자. 업체가 수백 개라 찾을 길이 없으면 못 고른다. */
  companies: [], partners: {}, companiesErr: '', q: '',
  /* pageConfigUnread — 「쪽 목록(homepage/config/pages)」을 «못 읽었다»는 표시다.
     ★ syncPageConfig 는 못 읽어서 null 이 온 것과 자료가 «아직 비어 있어» null 인 것을
       가르지 않고 똑같이 기본 8쪽으로 채운다(화면이 갑자기 비면 안 되므로). 그런데
       그 상태에서 「＋ 쪽 추가」·「목록에서 분리」를 누르면 기본 8쪽으로 set() 해 버려
       사장님이 이미 저장해 둔 목록(분리·추가)을 통째로 덮어쓴다.
       그래서 못 읽은 사실은 여기 따로 남겨 두고, addPage/detachPage 가 저장 전에
       확인해서 거절한다 — 「자료가 없다」와 「못 읽었다」는 반드시 갈라야 한다. */
  pageConfigUnread: false,
  /* dataErr — homepage/* 를 «못 읽은» 것. 「아직 자료가 없습니다」와 반드시 갈라 보여준다.
     saveErr — 딱지 강등처럼 사람이 안 누른 저장이 실패한 것. 조용히 삼키지 않는다. */
  dataErr: '', saveErr: '',
  check: null, checking: false, checkMsg: '', checkBad: false,
  draft: null, dirty: false, loading: true,

  logout() { firebase.auth().signOut().then(() => location.reload()); },

  /* ★ 「버리고 옮길까요?」를 화면 안 창으로 묻게 되어 «기다려야» 한다.
     기다리지 않으면 묻는 창이 뜨기도 전에 화면이 옮겨가 저장 안 한 내용이 조용히 사라진다. */
  async go(group) {
    if (!(await leaveDraft())) return;
    App.group = group;
    App.filter = defaultFilterOf(group);  // 갈래를 옮기면 걸러 보기를 푼다(자문사는 「올림」부터)
    App.q = '';
    App.pick = firstPickOf(group);
    loadDraft();
    App.render();
  },

  /* 이름으로 찾기 — 글자를 칠 때마다 화면을 통째로 다시 그리면 «커서가 튄다»
     (찾기 칸 자체가 다시 만들어지기 때문이다). 줄 목록과 건수만 갈아 끼운다. */
  find(q) {
    App.q = String(q || '');
    const box = $('rowsBox'), cnt = $('listCount');
    if (!box) { App.render(); return; }
    box.innerHTML = rowsHtml();
    if (cnt) cnt.innerHTML = listCountHtml();
  },

  async select(key) {
    if (key === App.pick) return;
    if (!(await leaveDraft())) return;
    App.pick = key;
    loadDraft();
    App.render();
  },

  /* 갈래를 열 때 기본으로 걸러 둘 딱지.
     ★ 자문사현황만 다르다 — 업체관리에는 수백 개사가 있고 홈페이지에 올린 것은 그중
       몇십 개다. 전체를 보여 주면 정작 볼 것(올린 회사)이 묻힌다. 올린 회사가 하나도
       없을 때만 전체를 보여 준다(고를 것이 그것뿐이니까). */
  /* 걸러 보기 — 같은 딱지를 다시 누르면 풀린다.
     ★ 고르고 있던 줄이 걸러져 사라지면 편집칸이 빈 채 남는다. 남아 있는 첫 줄로 옮긴다. */
  async filt(key, group) {
    if (group && group !== App.group) {
      if (!(await leaveDraft())) return;
      App.group = group;
    }
    App.filter = (App.filter === key) ? '' : key;
    const rows = visibleRows(App.group);
    if (!rows.some(r => r.key === App.pick)) {
      if (!(await leaveDraft())) { App.filter = ''; App.render(); return; }
      App.pick = rows.length ? rows[0].key : '';
      loadDraft();
    }
    App.render();
  },

  /* 「할 일」 띠에서 그 줄로 바로 가기 — 갈래를 옮기고 그 줄을 고른다 */
  async jump(group, key) {
    if (!(await leaveDraft())) return;
    App.group = group;
    App.filter = '';
    App.pick = key;
    loadDraft();
    App.render();
  },

  render() { $('main').innerHTML = screen(); }
};
window.App = App;

function currentUserName() {
  return App.myName || (App.me && App.me.email) || '';
}

/* 갈래를 열 때 기본으로 걸러 둘 딱지 (위 App.go 의 주석 참고) */
function defaultFilterOf(group) {
  if (group !== 'partner') return '';
  return postedNames().length ? 'posted:yes' : '';
}

firebase.initializeApp(FIREBASE_CONFIG);
try { if (firebase.appCheck) firebase.appCheck().activate(new firebase.appCheck.ReCaptchaV3Provider(FB_APPCHECK_KEY), true); }
catch (e) { console.warn('[AppCheck]', e && e.message); }

db = firebase.database();

firebase.auth().onAuthStateChanged(function (user) {
  if (user) { App.me = user; afterLogin(); return; }
  /* 로그인은 통합 포털 한 곳에서만 한다 — 앱마다 두면 계정 문제를 앱 수만큼 겪는다. */
  if (!/[?&]login=1/.test(location.search) && location.protocol !== 'file:') {

  }

});

/* 총괄관리자만 연다. 홈페이지 문구는 밖에서 보이는 글이라 아무나 고치면 안 된다.
   권한을 «못 읽었을 때»도 열지 않는다 — 못 읽은 것을 권한 있음으로 치면 막는 뜻이 없다. */
function afterLogin() {
  $('whoami').textContent = App.me.email || '';
  db.ref('uid_roles/' + App.me.uid).once('value')
    .then(s => {
      const r = s.val() || {};
      App.isAdmin = r.isAdmin === true;
      if (!App.isAdmin) { showLocked('총괄관리자만 쓸 수 있습니다.'); return; }
      openApp();
    })
    .catch(e => {
      console.warn('[권한]', e && e.code);
      showLocked('권한을 확인하지 못했습니다. 총괄관리자만 쓸 수 있습니다.');
    });
}

function showLocked(msg) {
  $('main').style.display = 'none';
  $('gate').style.display = '';
  $('gate').innerHTML = '<div style="font-size:15px;font-weight:700;margin-bottom:6px">' + esc(msg) + '</div>'
    + '<div class="sub">홈페이지에 올라가는 글이라 총괄관리자에게만 열려 있습니다.</div>';
}

function openApp() {
  $('gate').style.display = 'none';
  $('main').style.display = '';
  App.render();
  loadAll();

}

/* 이름은 명부에서 찾는다 — 이력에 「누가 고쳤는지」가 이메일로만 남으면 알아보기 어렵다. */
function loadMyName() {
  readRoster().then(list => {
    const em = String((App.me && App.me.email) || '').toLowerCase();
    const hit = (list || []).filter(x => x && sidToEmail(x.sid) === em);
    if (hit.length === 1 && hit[0].name) {
      App.myName = hit[0].name;
      $('whoami').textContent = hit[0].name;
    }
  }).catch(() => {});
}
function sidToEmail(sid) { return String(sid || '').toLowerCase().replace(/-/g, '') + '@pureun.kr'; }

/* 명부 읽기 — enter.html 과 같은 방식({v:…} 래핑·객체 형태 모두 배열로) */
function readRosterAt(path) {
  return db.ref(path).once('value').then(snap => {
    const raw = snap.val();
    let list = (raw && raw.v !== undefined) ? raw.v : raw;
    if (list && !Array.isArray(list) && typeof list === 'object') {
      list = Object.keys(list).map(k => list[k]);
    }
    return Array.isArray(list) ? list : null;
  });
}
/* ★ «어느 명부를 읽었는지»까지 돌려준다.
   data/user_accounts 에는 퇴사일(retireDate)이 있지만 공개 명부 data/user_dir 에는 없다.
   폴백을 탄 것을 안 알리면 명부가 비지 않아 오류 표시도 안 뜨는데 퇴사일이 전부 빈 값이라
   「내릴 것」 딱지가 경고 한 줄 없이 영영 안 붙는다. 실패해도 거부하지 않고 source 로 알린다. */
function readRosterSource() {
  return readRosterAt('data/user_accounts').then(
    v => (v ? { list: v, source: 'accounts' } : null),
    e => { console.warn('[직원 명부·민감]', e && e.code); return null; }
  ).then(hit => hit || readRosterAt('data/user_dir').then(
    v => (v ? { list: v, source: 'dir' } : { list: null, source: 'none' }),
    e => { console.warn('[직원 명부·공개]', e && e.code); return { list: null, source: 'fail' }; }
  ));
}
function readRoster() { return readRosterSource().then(r => r.list); }

/* 명부 → 대조 부품이 받는 모양. 퇴사일이 있으면 날짜로, 없으면 status 로 본다.
   pu-erp 의 퇴사 처리는 status 를 'retired' 로 쓰고(pu-erp.html 퇴사 마법사), 공개 명부
   user_dir 에도 그 status 만 실려 온다(pu-erp.html _syncUserDir). 짐작이 아니라 확인한 값이다. */
function staffFromRoster(list, source) {
  const staff = (list || []).map(u => ({
    name: (u && u.name) || '',
    leftAt: (u && u.retireDate) || '',
    left: String((u && u.status) || '') === 'retired'
  }));
  const warn = (source === 'dir')
    ? '직원 명부(data/user_accounts)를 읽지 못해 공개 명부(data/user_dir)로 대신 봤습니다 — '
      + '공개 명부에는 «퇴사일»이 없어, 「내릴 것」은 명부의 「퇴사」 표시로만 판정합니다(날짜는 못 보여 드립니다).'
    : '';
  return { staff: staff, warn: warn };
}

/* ══════ 자료 읽기 ══════
   한쪽이 실패해도 화면은 뜬다 — 빈 화면에 「권한 거부」만 남으면 무엇을 해야 할지 알 수 없다. */
/* 못 읽은 자리를 「자료가 없다」로 뭉개지 않는다 — 어느 자리가 막혔는지 모아 둔다 */
function dataErrText(labels) {
  if (!labels || !labels.length) return '';
  return '홈페이지 자료를 읽지 못했습니다 — ' + labels.join(', ') + '. '
    + '파이어베이스 «보안규칙이 아직 없을 수 있습니다»(homepage 노드에 규칙이 없으면 기본이 거부입니다). '
    + '목록이 비어 보이는 것이 「자료가 없다」는 뜻은 아닙니다.';
}

function loadAll() {
  App.loading = true;
  const failed = [];
  /* 읽기 한 자리 — 못 읽으면 «어느 자리»인지 남긴다. console.warn 만 하면 화면에서는
     규칙이 없어서인지 자료를 안 넣어서인지 구분할 방법이 없다. */
  const read = (path, label, empty) => db.ref(path).once('value')
    .then(s => { const v = s.val(); return (v === null || v === undefined) ? empty : v; })
    .catch(e => { console.warn('[' + label + ']', e && e.code); failed.push(label); return empty; });

  // return 을 붙여도 유일한 호출부(줄 387)는 값을 안 본다 — 검사가 «다 읽고 나서»를
  // 기다릴 수 있게(await loadAll()) 열어 두는 것뿐이다.
  return Promise.all([
    read('homepage/members', '구성원', {}),
    read('homepage/pages', '쪽 본문', {}),
    read('homepage/config/lineFormat', '줄 모양 설정', 'plain'),
    read('homepage/check', '지난 대조 결과', null),
    readRosterSource(),
    read('homepage/config/pages', '쪽 목록', null),
    /* 자문사현황 — 업체관리는 «읽기만» 한다. 표시(올림/안 올림)만 우리 자리에 쓴다. */
    read('data/companies', '푸른ERP 업체관리', null),
    read(PARTNER_PATH, '자문사 표시', null)
  ]).then(([members, pages, lineFormat, check, roster, pageCfg, companies, partners]) => {
    App.members = members || {};
    App.pages = pages || {};
    // 「쪽 목록」 자리가 failed 에 있으면 «자료가 없음»이 아니라 «못 읽음»이다 — 갈라 남긴다.
    // (read() 의 catch 만 failed 에 쌓는다. null 값을 정상적으로 읽은 것은 안 쌓인다.)
    App.pageConfigUnread = failed.indexOf('쪽 목록') !== -1;
    syncPageConfig(pageCfg);   // 비어 있으면 기본 8쪽 — 화면이 갑자기 비지 않게
    App.lineFormat = (lineFormat === 'div') ? 'div' : 'plain';
    App.check = check;
    App.dataErr = dataErrText(failed);
    if (roster && roster.list) {
      /* memberStatus 는 이름과 퇴사 여부만 본다. 푸른ERP 명부의 퇴사일 칸이 retireDate 다. */
      const r = staffFromRoster(roster.list, roster.source);
      App.staff = r.staff;
      App.staffErr = r.warn;   // 폴백을 탔으면 그 사실을 띠로 알린다
    } else {
      App.staff = null;   // 못 읽었다 — 입·퇴사 딱지만 안 뜨고 나머지 대조는 그대로 돈다
      App.staffErr = '푸른ERP 직원 명부를 읽지 못해 입·퇴사 딱지는 표시하지 않습니다.';
    }
    /* 업체관리는 배열로 저장돼 있다(푸른ERP 가 localStorage 배열을 그대로 올린다).
       객체로 와도 값만 뽑아 배열로 본다 — 저장 방식이 바뀌어도 목록이 빈 채 뜨지 않게. */
    App.companies = companiesFrom(companies);
    App.companiesErr = (failed.indexOf('푸른ERP 업체관리') !== -1)
      ? '푸른ERP 업체관리(data/companies)를 읽지 못해 자문사 목록을 보여 드릴 수 없습니다 — '
        + '«업체가 없다»는 뜻이 아닙니다. 규칙이나 그물 문제일 수 있습니다.'
      : '';
    App.partners = partners || {};
    App.loading = false;
    App.pick = firstPickOf(App.group);
    loadDraft();
    App.render();
  });
}

/* ══════ 자문사현황 (4차 지시) ══════
   ★ 목록은 푸른ERP 업체관리(data/companies)가 «기준»이다. 여기서 회사를 만들지 않는다 —
     이름·업종·거래 여부는 업체관리에서 고치고, 이 화면은 읽기만 한다.
     이 화면이 더하는 것은 하나뿐이다: «홈페이지에 올렸는지»(사람이 표시).
   ★ 왜 사람이 표시하는가 — 홈페이지 자문사현황은 로고 «그림»이다. 회사명이 글자로 없어
     기계가 대조할 수 없다. 못 하는 것을 「같음」으로 뭉개면 올리지도 않은 회사가
     올라간 것처럼 보인다. 그래서 대조 딱지는 늘 「대조 못 함 (그림)」이다.
   ★ 어느 업체를 올릴지는 «회사별로 사람이» 고른다(대표 결정) — 업체 종류로 자동으로
     고르지 않는다. 종류가 「자문」이어도 홈페이지에 안 올리는 곳이 있다. */

/* 업체관리 자료 → 배열. 푸른ERP 가 localStorage 배열을 그대로 올려 배열로 오지만,
   객체로 와도 값만 뽑는다 — 저장 방식이 바뀌어도 목록이 빈 채로 뜨지 않게. */
function companiesFrom(raw) {
  let list = (raw && raw.v !== undefined) ? raw.v : raw;
  if (list && !Array.isArray(list) && typeof list === 'object') {
    list = Object.keys(list).map(k => list[k]);
  }
  if (!Array.isArray(list)) return [];
  return list.filter(c => c && c.id && c.name && !c._deleted);
}

/* 이 업체의 표시. 없으면 «아직 표시 안 함»이다 — 「안 올림」과 다르다.
   안 올림은 사람이 보고 «안 올린다»고 정한 것이고, 표시 안 함은 아직 안 본 것이다. */
function partnerMark(id) { return (App.partners || {})[id] || null; }
function postedOf(id) {
  const mk = partnerMark(id);
  if (!mk) return '';
  return mk.posted === true ? 'yes' : (mk.posted === false ? 'no' : '');
}
const POSTED_TEXT = { yes: '올림', no: '안 올림', '': '표시 안 함' };

function partnerRows() {
  /* App.companies 는 아직 안 읽었을 수 있다(화면은 자료를 기다리며 먼저 그려진다) */
  const rows = (App.companies || []).map(c => {
    const posted = postedOf(c.id);
    const mk = partnerMark(c.id) || {};
    const closed = String(c.status || '') === 'closed';
    const bits = [c.typeCode || '(종류 없음)'];
    if (closed) bits.push('업체관리 거래 종료' + (c.closedDate ? ' ' + c.closedDate : ''));
    bits.push(POSTED_TEXT[posted]);
    if (mk.why) bits.push(mk.why);
    /* ★ 「올림」으로 표시했는데 업체관리에서 거래가 끝난 곳 — 홈페이지에 그대로 걸려 있다.
       내릴지는 사람이 판단한다(끝난 뒤에도 실적으로 남겨 두는 곳이 있다). 알리기만 한다.
       표시를 안 한 회사는 홈페이지에 올라간 적이 없으니 알릴 것도 없다. */
    const warn = (posted === 'yes' && closed)
      ? { kind: 'ended', label: '자문 종료', detail: c.closedDate || '' } : null;
    return {
      key: c.id, name: c.name, desc: bits.join(' · '),
      /* 대조 딱지 자리는 비운다 — 「확인 전」이라고 적으면 언젠가 대조가 될 것처럼 들린다.
         못 하는 이유는 목록 머리와 편집칸이 글로 말한다. */
      status: '', reason: '', noStatusPill: true,
      roster: warn, posted: posted, closed: closed
    };
  });
  /* 올린 회사가 먼저, 그다음 이름 순 — 홈페이지에 올라간 것이 이 화면의 본론이다 */
  rows.sort((a, b) => {
    const pa = (a.posted === 'yes') ? 0 : 1, pb = (b.posted === 'yes') ? 0 : 1;
    return (pa - pb) || String(a.name).localeCompare(String(b.name), 'ko');
  });
  return rows;
}

/* 홈페이지에 올린 회사 이름만 — 붙여넣을 내용은 «회사명 목록»까지다. 로고는 사람이 올린다. */
function postedNames() {
  return partnerRows().filter(r => r.posted === 'yes').map(r => r.name);
}

/* 표시 저장. 한 업체 한 자리만 건드린다 — 통째로 set 하면 다른 사람이 방금 한 표시를 덮는다.
   ★ 조용히 실패하지 않는다. 규칙이 없으면 거부되는데, 그때 화면만 바뀌어 보이면
     올렸다고 표시한 줄 알고 홈페이지를 안 고친다. */
async function setPosted(id, value, why) {
  const rec = { posted: value, why: String(why || ''),
                by: currentUserName(), at: todayString(), updatedAt: Date.now() };
  App.saveErr = '';
  try {
    await db.ref(PARTNER_PATH + '/' + id).set(rec);
    App.partners[id] = rec;
    App.dirty = false;
    App.render();
    toast(value === true ? '「올림」으로 표시했습니다.'
      : (value === false ? '「안 올림」으로 표시했습니다.' : '표시를 지웠습니다.'));
  } catch (e) {
    console.warn('[자문사 표시]', e && e.code);
    App.saveErr = '자문사 표시를 저장하지 못했습니다' + (e && e.code ? '(' + e.code + ')' : '')
      + ' — 파이어베이스 규칙에 «' + PARTNER_PATH + '» 자리가 아직 없을 수 있습니다. '
      + '규칙을 넣기 전에는 표시가 남지 않습니다(화면에만 바뀌어 보이지 않도록 되돌렸습니다).';
    App.render();
  }
}
async function markPosted(v) {
  const d = App.draft;
  if (!d || d.kind !== 'partner') return;
  await setPosted(d.key, v, d.why);
}
window.markPosted = markPosted;

/* 메모만 저장 — «올림/안 올림 표시는 그대로 둔다».
   ★ 여기서 true 를 넣으면 「안 올림」으로 표시해 둔 회사가 메모를 적었을 뿐인데
     「올림」으로 뒤집힌다. 지금 표시를 그대로 다시 쓴다. */
async function savePartnerWhy() {
  const d = App.draft;
  if (!d || d.kind !== 'partner') return;
  const keep = d.posted === 'yes' ? true : (d.posted === 'no' ? false : null);
  await setPosted(d.key, keep, d.why);
}
window.savePartnerWhy = savePartnerWhy;

/* 표시를 지운다 — 「안 올림」과 다르다(아직 안 본 것으로 되돌린다) */
async function clearPosted() {
  const d = App.draft;
  if (!d || d.kind !== 'partner') return;
  App.saveErr = '';
  try {
    await db.ref(PARTNER_PATH + '/' + d.key).remove();
    delete App.partners[d.key];
    App.render();
    toast('표시를 지웠습니다.');
  } catch (e) {
    console.warn('[자문사 표시 지우기]', e && e.code);
    App.saveErr = '표시를 지우지 못했습니다' + (e && e.code ? '(' + e.code + ')' : '') + '.';
    App.render();
  }
}
window.clearPosted = clearPosted;

/* ══════ 관리 대상 쪽 목록 (2차 설계 §3) ══════
   목록이 코드에 박혀 있으면 홈페이지에 쪽을 새로 만들 때마다 코드를 고쳐 함수를 다시
   배포해야 했다. 목록을 자료로 옮긴다 — 안전(어느 주소를 읽어도 되는지)은 서버 함수의
   이름 규칙이 그대로 지킨다. 목록을 여는 것이지 아무 주소나 읽게 여는 것이 아니다. */

/* 쪽 이름 규칙 — functions/homepage-fetch.js 의 규칙과 «같아야» 한다.
   화면이 더 넉넉하면 추가는 되는데 영영 못 읽는 쪽이 생기고, 화면이 더 깐깐하면
   멀쩡한 쪽을 못 넣는다. 검사(pu-home-screen.test.js)가 두 규칙을 나란히 돌려 견준다. */
function isPageName(mid) { return /^[a-z0-9_]{1,30}$/.test(String(mid == null ? '' : mid)); }

/* 자료 → 화면이 쓰는 목록. 자료가 비어 있으면 기본 8쪽을 쓴다 —
   이미 자료(homepage/pages)가 들어 있는 쪽들이라 화면이 갑자기 비면 안 된다.
   order 로 줄세우고, order 가 같거나 없으면 쪽 이름으로 가른다 — 순서가 확인마다
   뒤집히면 목록 번호가 뜻을 잃는다. */
function syncPageConfig(cfg) {
  const ok = (cfg && typeof cfg === 'object' && !Array.isArray(cfg)
    && Object.keys(cfg).filter(isPageName).length > 0);
  const src = ok ? cfg : DEFAULT_PAGES;
  const ids = Object.keys(src).filter(isPageName).sort((a, b) => {
    const oa = Number((src[a] || {}).order), ob = Number((src[b] || {}).order);
    return ((isFinite(oa) ? oa : 9999) - (isFinite(ob) ? ob : 9999)) || String(a).localeCompare(String(b));
  });
  App.pageConfig = src;
  PAGE_IDS.length = 0;
  Object.keys(PAGE_LABEL).forEach(k => { delete PAGE_LABEL[k]; });
  ids.forEach(mid => {
    PAGE_IDS.push(mid);
    PAGE_LABEL[mid] = String((src[mid] || {}).label || mid);
  });
}

function savePageConfig(next) {
  return db.ref('homepage/config/pages').set(next).then(() => { syncPageConfig(next); });
}

/* 쪽 목록을 못 읽은 채로 저장하면(=set) 사장님이 이미 저장해 둔 분리·추가가 통째로
   지워진다(못 읽음 → syncPageConfig 가 기본 8쪽으로 채움 → 그 위에 한 줄 보태 덮어씀).
   「＋ 쪽 추가」・「목록에서 분리」 둘 다 저장이라 여기서 함께 막는다. */
function refuseIfPageConfigUnread() {
  if (!App.pageConfigUnread) return false;
  say('쪽 목록을 못 읽었습니다',
    '「홈페이지 다시 확인」이 아니라 화면을 <b>새로 고쳐(F5)</b> 목록을 먼저 읽어야 합니다 — '
    + '지금 저장하면 사장님이 저장해 두신 설정이 지워집니다.');
  return true;
}

/* 「＋ 쪽 추가」 — 홈페이지에 «먼저» 쪽이 있어야 한다. 없는 이름을 넣으면 대조에서
   「홈페이지를 읽지 못함」으로 뜰 뿐, 자료가 망가지지는 않는다. */
async function addPage() {
  if (refuseIfPageConfigUnread()) return;
  const asked = await askText('＋ 쪽 추가 — 홈페이지 쪽 이름',
    '주소 전체가 아니라 «쪽 이름»만 적습니다 — 예: <b>work6</b><br>'
    + '영문 소문자·숫자·밑줄만, 30자까지입니다.',
    { rows: 1, hint: 'work6', ok: '다음' });
  if (asked === null) return;                 // 스스로 그만두었다 — 조용히 닫는다
  const raw = String(asked).trim();
  if (!raw) { await say('쪽을 추가하지 않았습니다', '쪽 이름을 적지 않으셨습니다.'); return; }
  const mid = raw.replace(/^\/+/, '');
  if (!isPageName(mid)) {
    await say('받을 수 없는 쪽 이름입니다',
      '「' + esc(raw) + '」 은(는) 쓸 수 없습니다.<br>'
      + '쪽 이름은 <b>영문 소문자·숫자·밑줄</b>만 쓸 수 있고 30자까지입니다. '
      + '주소 전체(https://…)나 빗금·점·대문자·한글은 넣지 마십시오 — 예: work6');
    return;
  }
  if (App.pageConfig[mid]) {
    await say('이미 관리 목록에 있습니다', '「' + esc(mid) + '」 은(는) 이미 목록에 들어 있습니다.');
    return;
  }
  const askedLabel = await askText('화면에 보일 이름',
    '목록에서 알아볼 이름을 적습니다 — 예: <b>중대재해 대응</b>',
    { rows: 1, hint: '중대재해 대응', ok: '추가' });
  if (askedLabel === null) return;
  const label = String(askedLabel).trim();
  if (!label) {
    await say('쪽을 추가하지 않았습니다',
      '화면에 보일 이름이 없으면 목록에서 알아볼 수 없습니다.');
    return;
  }

  const orders = Object.keys(App.pageConfig).map(k => Number((App.pageConfig[k] || {}).order) || 0);
  const next = Object.assign({}, App.pageConfig);
  next[mid] = { label: label, order: (orders.length ? Math.max.apply(null, orders) : 0) + 1 };
  try {
    await savePageConfig(next);
    App.group = 'work'; App.pick = mid;
    loadDraft(); App.render();
    toast('「' + label + '」(/' + mid + ')을 목록에 넣었습니다. 「홈페이지 다시 확인」을 누르면 읽어 옵니다.');
  } catch (e) {
    await say('쪽 목록을 저장하지 못했습니다', esc((e && e.message) || e));
  }
}
window.addPage = addPage;

/* 오시는길·인사말은 왼쪽에서 «자기 갈래»를 하나씩 차지한다 — 분리하면 그 갈래가 통째로
   비어 버리고, 목록이 아예 비면 기본 8쪽이 되살아나 분리한 것이 없던 일이 된다. */
function canDetachPage(mid) { return mid !== 'inquiry' && mid !== 'greeting'; }

/* 「목록에서 분리」 — ★ 홈페이지 쪽을 «지우지 않는다». 통합시스템이 이 쪽을 더 이상
   대조·관리하지 않는다는 뜻일 뿐이다. 우리가 가진 대조 기준 글자(homepage/pages/{mid})도
   그대로 둔다 — 다시 붙일 때 쓴다. 지우는 일은 사람이 홈페이지 관리자 화면에서 한다. */
async function detachPage(mid) {
  if (refuseIfPageConfigUnread()) return;
  if (!canDetachPage(mid)) {
    await say('분리할 수 없습니다',
      '「' + esc(PAGE_LABEL[mid] || mid) + '」은 갈래 자체라, 분리하면 그 갈래가 통째로 비어 버립니다.');
    return;
  }
  if (!App.pageConfig[mid]) return;
  const yes = await askYes('「' + (PAGE_LABEL[mid] || mid) + '」(/' + mid + ')을 관리 목록에서 분리할까요?',
    '<b>홈페이지 쪽은 지우지 않습니다</b> — 통합시스템이 이 쪽을 더 이상 대조하지 않는다는 뜻입니다.<br>'
    + '홈페이지에서 실제로 없애려면 홈페이지 관리자 화면에서 지우거나 메뉴에서 빼야 합니다.',
    '목록에서 분리');
  if (!yes) return;

  const next = Object.assign({}, App.pageConfig);
  delete next[mid];
  try {
    await savePageConfig(next);
    App.pick = firstPickOf(App.group);
    loadDraft(); App.render();
    toast('목록에서 분리했습니다. 홈페이지 쪽은 그대로 있습니다.');
  } catch (e) {
    await say('쪽 목록을 저장하지 못했습니다', esc((e && e.message) || e));
  }
}
window.detachPage = detachPage;

/* ══════ 목록 만들기 ══════ */

/* 「홈페이지에 남기기」 예외를 자료에서 꺼낸다. 사유가 빈 예외는 «예외가 아니다» —
   그 기준은 부품(PuHomeDiff.keepOnSiteReason)이 가진다. 화면이 같은 판단을 다시 만들면
   목록에는 「남김」이 보이는데 딱지는 퇴사로 붙는 식으로 조용히 어긋난다. */
function keptOf(rec) {
  const r = rec || {};
  if (!PuHomeDiff.keepOnSiteReason(r)) return null;
  return r.keepOnSite;
}

/* 명부 딱지 (3차 설계 §3) — 푸른ERP 명부만 보고 붙인다.
   ★ 퇴사 여부는 홈페이지와 «상관없이» 명부만 보면 아는 것이라, 「홈페이지 다시 확인」을
     누르기 전에도 붙는다. 대조 딱지(App.check)와 섞지 말 것 — 판정은 부품이 한다. */
function rosterMarkOf(name) {
  return PuHomeDiff.rosterMark(name, App.staff, todayString());
}

/* 구성원 줄 — 우리 자료 + 대조에서 「홈페이지에만」으로 남은 것.
   ★ 줄에는 딱지가 «둘» 실린다. roster(명부 딱지, 늘 붙는다)와 status(대조 딱지,
     「홈페이지 다시 확인」을 누를 때만 새로 붙는다)는 서로 다른 것이다. */
function memberRows() {
  const st = (App.check && App.check.members) || {};
  const keys = Object.keys(App.members).sort((a, b) => {
    const na = Number(a), nb = Number(b);
    if (isFinite(na) && isFinite(nb)) return na - nb;
    return String(a).localeCompare(String(b), 'ko');
  });
  const rows = keys.map(k => {
    const m = App.members[k] || {};
    const s = st[k] || {};
    /* 「홈페이지에 남기기」 예외는 «우리 자료»에 있다 — 대조를 한 번도 안 눌러도 보여야 한다.
       숨기면 사장님이 왜 퇴사 경고가 없는지 알 수 없다(2차 설계 §4). */
    const keep = keptOf(m);
    return {
      key: k, name: m.name || '(이름 없음)',
      desc: [m.position1, m.position2].filter(Boolean).join(' · '),
      status: s.status || '', reason: s.reason || '',
      roster: rosterMarkOf(m.name || ''),
      kept: !!keep, keptWhy: keep ? String(keep.why || '') : ''
    };
  });
  Object.keys(st).forEach(k => {
    if (App.members[k]) return;
    const s = st[k];
    if (s.status !== 'liveOnly') return;   // 사라진 딱지가 유령 줄로 남지 않게
    rows.push({ key: k, name: s.name || '(홈페이지에만)', desc: '홈페이지 글 번호 ' + k,
                status: 'liveOnly', reason: s.reason || '',
                roster: rosterMarkOf(s.name || ''), liveOnly: true });
  });
  return rows;
}

/* 갈래마다 어느 쪽이 들어가는지. 오시는길·인사말은 자기 이름의 쪽 하나만 갖고,
   주요업무는 «그 둘을 뺀 나머지 전부»다 — 쪽을 추가하면 주요업무에 들어간다.
   목록 자체는 PAGE_IDS(=자료)에서 오므로 여기에 쪽 이름을 더 박아 두지 않는다. */
function pageIdsOf(group) {
  if (group === 'inquiry' || group === 'greeting') return PAGE_IDS.filter(m => m === group);
  if (group !== 'work') return [];
  return PAGE_IDS.filter(m => m !== 'inquiry' && m !== 'greeting');
}

function pageRows(group) {
  const st = (App.check && App.check.pages) || {};
  return pageIdsOf(group).map(mid => {
    const p = App.pages[mid] || {};
    const s = st[mid] || {};
    /* «못 읽음»·«기준 없음»·«아직 확인 전»을 가른다 — 셋은 원인이 다르다.
       ★ s.status === 'noBase' 는 「홈페이지 다시 확인」을 «방금 실행해서» 얻은 결과다.
         그런데 p.text(우리 대조 기준)만 보고 갈랐을 때는 확인을 방금 했어도 여전히
         비어 있어 「다시 확인 전」이라고 거꾸로 적었었다 — 그래서 status 를 먼저 본다. */
    const note = (s.status === 'unknown') ? ' · 홈페이지에서 못 읽음'
      : (s.status === 'noBase') ? ' · 기준 없음 — 홈페이지에서 읽어온 내용을 기준으로 삼으십시오'
      : (p.text ? '' : ' · 아직 내용 없음 (홈페이지 다시 확인 전)');
    return {
      key: mid, name: PAGE_LABEL[mid] || mid,
      desc: '/' + mid + note,
      status: s.status || '', reason: s.reason || ''
    };
  });
}

function rowsOf(group) {
  if (group === 'members') return memberRows();
  if (group === 'partner') return partnerRows();
  return pageRows(group);
}
function firstPickOf(group) {
  const r = rowsOf(group);
  return r.length ? r[0].key : '';
}

/* ★ 옛 needsWork(갈래 탭의 빨간 점)은 없앴다. 판단이 needsAttentionRow 로 옮겨 갔고,
   같은 뜻의 함수를 둘 두면 카드의 점과 「손댈 것」 딱지가 서로 다른 답을 낸다.
   「내려감(퇴사 완료)」을 빼는 규칙과 「대조 딱지가 있으면 그 말을 믿는」 순서는
   needsAttentionRow 가 그대로 물려받았다. */

/* ══════ 편집 초안 ══════
   화면 칸은 초안(draft)만 고친다. 「저장」을 눌러야 자료가 바뀐다. */
function loadDraft() {
  App.dirty = false;
  if (!App.pick) { App.draft = null; return; }
  if (App.group === 'members') {
    const m = App.members[App.pick];
    if (!m) { App.draft = null; return; }   // 「홈페이지에만」 줄은 고칠 우리 자료가 없다
    App.draft = {
      kind: 'member', key: App.pick,
      name: m.name || '', position1: m.position1 || '', position2: m.position2 || '',
      intro: m.intro || '', srl: m.srl || '', careers: (m.careers || []).slice()
    };
  } else if (App.group === 'partner') {
    /* 자문사는 고칠 «우리 글»이 없다 — 회사 자료는 업체관리 것이다.
       초안이 담는 것은 사람이 남길 메모뿐이다. 표시(올림/안 올림)는 단추가 바로 저장한다. */
    const c = App.companies.filter(x => x.id === App.pick)[0];
    if (!c) { App.draft = null; return; }
    const mk = partnerMark(App.pick) || {};
    App.draft = { kind: 'partner', key: App.pick, name: c.name || '',
                  why: String(mk.why || ''), posted: postedOf(App.pick), company: c };
  } else {
    const p = App.pages[App.pick] || {};
    App.draft = { kind: 'page', key: App.pick, text: p.text || '' };
  }
}

/* 저장 안 한 것이 있으면 물어본다 — 말없이 버리면 다시 쓸 수밖에 없다.
   ★ 화면 안 창으로 물으므로 «약속»을 돌려준다. 부르는 쪽은 기다려야 한다. */
function leaveDraft() {
  if (!App.dirty) return Promise.resolve(true);
  return askYes('저장하지 않은 내용이 있습니다',
    '지금 고친 내용은 사라집니다. 버리고 옮길까요?', '버리고 옮기기');
}

function fieldEdit(name, value) {
  if (!App.draft) return;
  App.draft[name] = value;
  App.dirty = true;
  markDirty();
}
window.fieldEdit = fieldEdit;

/* 「저장 안 됨」 표시만 살짝 바꾼다 — 글자 칠 때마다 통째로 다시 그리면 커서가 튄다 */
function markDirty() {
  const el = $('dirtyMark');
  if (el) el.textContent = App.dirty ? '● 저장 안 됨' : '';
}

function careerEdit(i, value) {
  if (!App.draft) return;
  App.draft.careers[i] = value;
  App.dirty = true;
  markDirty();
}
function careerAdd() {
  if (!App.draft) return;
  App.draft.careers.push('');
  App.dirty = true;
  App.render();
  const boxes = document.querySelectorAll('#careerBox input');
  if (boxes.length) boxes[boxes.length - 1].focus();
}
function careerDel(i) {
  if (!App.draft) return;
  App.draft.careers.splice(i, 1);
  App.dirty = true;
  App.render();
}
function careerMove(i, d) {
  if (!App.draft) return;
  const a = App.draft.careers, j = i + d;
  if (j < 0 || j >= a.length) return;
  const t = a[i]; a[i] = a[j]; a[j] = t;
  App.dirty = true;
  App.render();
}
window.careerEdit = careerEdit; window.careerAdd = careerAdd;
window.careerDel = careerDel; window.careerMove = careerMove;

/* ══════ 저장 ══════
   ★ 덮어쓰기 전에 «직전 값»을 반드시 남긴다. 되돌릴 근거가 없으면 실수를 못 되돌린다.
     되살리기도 이 함수를 그대로 쓴다 — 그래야 되살리기 직전 값도 이력에 남는다. */
/* 이력 열쇠 — 시각(13자리) + 짧은 임의 글자.
   ★ Date.now() 만 쓰면 같은 밀리초에 두 번 저장할 때 앞 이력이 조용히 덮어써진다
     (되살리기 → 곧바로 저장 같은 자리에서 실제로 겹칠 수 있다).
     앞이 시각이라 열쇠 정렬 순서는 그대로고, 숫자만 있던 «옛 이력»도 histTs 로 함께 읽힌다. */
function histStamp() {
  return String(Date.now()) + '-' + Math.random().toString(36).slice(2, 8);
}
function histTs(key) {
  const n = parseInt(String(key), 10);
  return isFinite(n) ? n : 0;
}

async function saveRecord(kind, key, next) {
  const base = (kind === 'member') ? 'homepage/members/' : 'homepage/pages/';
  const histKey = (kind === 'member') ? key : 'page:' + key;
  const ref = db.ref(base + key);
  const before = (await ref.once('value')).val();
  if (before) {
    await db.ref('homepage/history/' + histKey + '/' + histStamp())
      .set({ before: before, updatedBy: currentUserName() });
  }
  await ref.set(Object.assign({}, next, {
    updatedAt: Date.now(), updatedBy: currentUserName()
  }));
  return next;
}

async function saveDraft() {
  const d = App.draft;
  if (!d) return;
  App.saveErr = '';   // 다시 저장하니 지난 실패 띠는 지운다
  try {
    if (d.kind === 'member') {
      const careers = d.careers.map(s => String(s || '').trim()).filter(Boolean);
      const next = { name: d.name.trim(), position1: d.position1.trim(), position2: d.position2.trim(),
                     intro: d.intro, srl: d.srl, careers: careers };
      /* ★ 「홈페이지에 남기기」 예외는 편집 칸에 없는 칸이다. 그대로 두지 않고 덮어쓰면
         경력 한 줄 고칠 때마다 예외가 조용히 사라지고, 퇴사 경고가 다시 쏟아진다. */
      const kept = (App.members[d.key] || {}).keepOnSite;
      if (kept) next.keepOnSite = kept;
      await saveRecord('member', d.key, next);
      App.members[d.key] = Object.assign({}, next, { updatedAt: Date.now(), updatedBy: currentUserName() });
    } else {
      const next = { text: d.text };
      await saveRecord('page', d.key, next);
      App.pages[d.key] = Object.assign({}, next, { updatedAt: Date.now(), updatedBy: currentUserName() });
    }
    App.dirty = false;
    /* 고친 뒤에는 홈페이지와 달라졌다 — 「같음」 딱지를 그대로 두면 안 올린 것을 올린 줄 안다. */
    markChanged(d.kind, d.key);
    App.render();
    toast('저장했습니다. 홈페이지는 붙여넣어야 바뀝니다.');
  } catch (e) {
    console.warn('[저장]', e);
    await say('저장하지 못했습니다', esc((e && e.message) || e));
  }
}
window.saveDraft = saveDraft;

/* 우리 자료를 고쳤으니 딱지를 「안 올라감」으로 내린다. 확인은 사람이 눌러야 다시 돈다. */
function markChanged(kind, key) {
  if (!App.check) return;
  const box = (kind === 'member') ? App.check.members : App.check.pages;
  if (!box || !box[key]) return;
  if (box[key].status === 'same') {
    box[key].status = 'pending';
    box[key].reason = '통합시스템에서 고친 뒤 아직 확인 전';
    /* ★ 조용히 삼키지 않는다. 저장이 안 되면 «다른 사람 화면»에는 아직 「같음」으로 보이고,
       안 올린 글을 올린 줄 알게 된다. 화면에 띠로 남긴다. */
    db.ref('homepage/check').set(App.check).catch(e => {
      console.warn('[딱지 강등 저장]', e && e.code);
      App.saveErr = '딱지를 「안 올라감」으로 내린 것을 저장하지 못했습니다'
        + (e && e.code ? '(' + e.code + ')' : '')
        + ' — 이 화면에만 바뀌어 보이고, 다른 사람 화면에는 아직 「같음」으로 보입니다. '
        + '「홈페이지 다시 확인」을 눌러 다시 맞춰 주십시오.';
      App.render();
    });
  }
}

/* 새 구성원 — 푸른ERP 에 입사한 노무사를 여기 올리면 「새로 올릴 것」으로 뜬다.
   홈페이지 글 번호(srl)는 홈페이지에 글을 만든 뒤에 적는다. */
async function addMember() {
  const asked = await askText('＋ 새 구성원 — 이름',
    '푸른ERP 에 입사한 노무사를 여기 올리면 「새로 올릴 것」으로 뜹니다.<br>'
    + '홈페이지 글 번호는 홈페이지에 글을 만든 뒤에 적습니다.',
    { rows: 1, hint: '홍길동', ok: '추가' });
  if (asked === null) return;
  const name = String(asked).trim();
  if (!name) { await say('추가하지 않았습니다', '이름을 적지 않으셨습니다.'); return; }
  const key = 'new-' + Date.now();
  try {
    await saveRecord('member', key, { name: name, position1: '', position2: '공인노무사',
                                      intro: '', srl: '', careers: [] });
    App.members[key] = { name: name, position1: '', position2: '공인노무사', intro: '', srl: '', careers: [] };
    App.group = 'members'; App.pick = key;
    loadDraft(); App.render();
    toast('추가했습니다. 홈페이지에 글을 만든 뒤 글 번호를 적어 주세요.');
  } catch (e) {
    await say('추가하지 못했습니다', esc((e && e.message) || e));
  }
}
window.addMember = addMember;

/* ══════ 「홈페이지에 남기기」 예외 (2차 설계 §4) ══════
   지사장은 고용관계가 아니어서 급여 명부에 퇴사로 찍혀 있거나 아예 없다. 급여 명부에
   없다는 것이 지사장을 그만뒀다는 뜻은 아니고, 기계가 이걸 가릴 방법이 없다.
   그래서 사람이 «사유를 남기고» 예외로 둔다 — 판정은 부품(PuHomeDiff)이 하고,
   화면은 표시를 저장하고 보여주기만 한다. */

/* 표시를 자료에 적는다. 저장은 saveRecord 로 한다 — 이력에 직전 값이 남아야
   나중에 「누가 언제 예외를 걸었나」를 되짚을 수 있다.
   ★ 편집 중인 초안(draft)이 아니라 «저장된 자료»에 표시만 얹는다. 초안을 건드리면
     사장님이 고치던 내용이 이 단추 한 번에 저장돼 버린다. */
async function writeKeepOnSite(key, mark) {
  const rec = App.members[key] || {};
  const next = Object.assign({}, rec);
  delete next.updatedAt; delete next.updatedBy;   // saveRecord 가 새로 찍는다
  if (mark) next.keepOnSite = mark; else delete next.keepOnSite;
  try {
    await saveRecord('member', key, next);
    App.members[key] = Object.assign({}, next, { updatedAt: Date.now(), updatedBy: currentUserName() });
    App.render();
    toast(mark
      ? '홈페이지에 남기기로 표시했습니다. 「홈페이지 다시 확인」을 누르면 퇴사 딱지를 달지 않습니다.'
      : '예외를 풀었습니다. 「홈페이지 다시 확인」을 누르면 퇴사 판정을 다시 받습니다.');
  } catch (e) {
    await say('표시를 저장하지 못했습니다', esc((e && e.message) || e));
  }
}

/* ★ 사유를 «반드시» 적게 한다. 사유 없는 예외는 나중에 왜 남겼는지 알 수 없어 위험하다.
   비워 두면 저장하지 않고, 왜 안 했는지 화면에 말해 준다(2차 설계 §4 그대로).
   ★ «그만두기»와 «빈 사유»를 가른다 — 스스로 그만둔 사람에게 잔소리를 하지 않는다. */
async function keepOnSiteAsk() {
  const d = App.draft;
  if (!d || d.kind !== 'member') return;
  const asked = await askText('홈페이지에 남기는 이유',
    '푸른ERP 명부에는 퇴사로 찍혀 있는데 홈페이지에는 그대로 두려는 경우입니다.<br>'
    + '<b>사유를 적지 않으면 저장하지 않습니다.</b><br>'
    + '예: 세종지사장 — 고용관계가 아니어서 급여 명부에는 퇴사로 찍힙니다',
    { rows: 3, hint: '왜 홈페이지에 남기는지 적어 주십시오', ok: '남기기로 표시' });
  if (asked === null) return;
  const why = String(asked).trim();
  if (!why) {
    await say('「홈페이지에 남기기」로 두지 않았습니다',
      '사유를 적지 않아 저장하지 않았습니다. '
      + '사유가 없으면 나중에 왜 남겼는지 알 수 없어 위험합니다.');
    return;
  }
  await writeKeepOnSite(d.key, { at: todayString(), by: currentUserName(), why: why });
}
window.keepOnSiteAsk = keepOnSiteAsk;

/* 예외는 «풀 수» 있다. 풀면 다음 확인에서 다시 퇴사 판정을 받는다. */
async function keepOnSiteClear() {
  const d = App.draft;
  if (!d || d.kind !== 'member') return;
  const yes = await askYes('「홈페이지에 남기기」 예외를 풀까요?',
    '풀면 다음 「홈페이지 다시 확인」에서 명부대로 퇴사 판정을 다시 받습니다.', '예외 풀기');
  if (!yes) return;
  await writeKeepOnSite(d.key, null);
}
window.keepOnSiteClear = keepOnSiteClear;

/* ══════ 줄 모양 설정 ══════ */
function setLineFormat(v) {
  App.lineFormat = (v === 'div') ? 'div' : 'plain';
  db.ref('homepage/config/lineFormat').set(App.lineFormat).catch(e => {
    console.warn('[줄 모양]', e && e.code);
    toast('줄 모양을 저장하지 못했습니다');
  });
  App.render();
}
window.setLineFormat = setLineFormat;

/* ══════ 홈페이지 확인 ══════
   ★ 이 함수의 요점은 «읽기에 실패한 것을 「안 올라감」으로 몰지 않는 것»이다.
     실패를 안 올라감으로 몰면 사장님이 멀쩡한 쪽을 다시 붙여넣게 된다. */
async function checkHomepage() {
  if (App.checking) return;
  App.checking = true; App.checkMsg = ''; App.checkBad = false;
  App.render();
  try {
    const token = await firebase.auth().currentUser.getIdToken();
    const ask = async (path) => {
      try {
        const res = await fetch(READ_HOMEPAGE_URL, {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: path })
        });
        if (!res.ok) return null;            // 못 읽었으면 null. 「내용이 없다」와 구분한다.
        const data = await res.json();
        return (typeof data.html === 'string') ? data.html : null;
      } catch (e) {
        return null;                         // 그물이 끊긴 것도 못 읽은 것이다
      }
    };

    const peopleHtml = await ask('people');
    if (peopleHtml === null) {
      showCheckFailed('홈페이지를 읽지 못했습니다 — 지난 확인 결과를 그대로 둡니다');
      return;
    }

    const live = PuHomeParse.parseMembers(peopleHtml);
    if (!PuHomeDiff.isTrustworthy(live)) {
      // 구성원이 0명이면 사람이 사라진 게 아니라 화면 구조가 바뀐 것이다.
      showCheckFailed('홈페이지 구조가 바뀐 것 같습니다 — 지난 확인 결과를 그대로 둡니다');
      return;
    }

    const livePages = {};
    const failed = [];
    for (const mid of PAGE_IDS) {
      const html = await ask(mid);
      if (html === null) { failed.push(mid); continue; }   // 못 읽은 쪽은 손대지 않는다
      livePages[mid] = PuHomeParse.parsePageText(html);
      /* ★ «보는 글»과 «대조하는 글»을 나눈다(2차 설계 ②).
         대조는 위의 뭉친 글자로 하고, 화면에 보여줄 줄 목록은 따로 담는다.
         못 읽은 쪽은 손대지 않는다 — 지난 줄 목록이 그대로 남는다(빈 줄로 지어내지 않는다). */
      App.pageLines[mid] = PuHomeParse.parsePageLines(html);
    }

    await applyStatus(live, livePages, failed);
    App.checkBad = failed.length > 0;
    App.checkMsg = failed.length
      ? ('일부 쪽을 읽지 못했습니다(' + failed.map(m => PAGE_LABEL[m] || m).join(', ') + ') — 그 쪽은 지난 결과를 그대로 둡니다')
      : '';
    if (!failed.length) toast('홈페이지와 대조했습니다.');
  } catch (e) {
    /* ★ catch 가 없으면 로그인 토큰을 못 얻는 순간 예외가 밖으로 나가고 «아무 메시지도»
       안 뜬다. 단추만 원래대로 돌아와 「눌렀는데 안 눌린」 것으로 보인다. */
    console.warn('[홈페이지 확인]', e);
    showCheckFailed(checkFailText(e));
  } finally {
    App.checking = false;
    App.render();
  }
}
window.checkHomepage = checkHomepage;

/* 확인이 «중간에 엎어졌을 때» 사람에게 할 말. 무엇이 잘못됐는지 한국어로 적는다. */
function checkFailText(e) {
  const raw = (e && (e.code || e.message)) || String(e || '');
  if (/token|auth|permission|unauthenticated|토큰|로그인|권한/i.test(raw)) {
    return '로그인 확인을 못 해 홈페이지 확인을 못 했습니다 — 로그아웃했다가 다시 로그인해 주십시오 (' + raw + ')';
  }
  return '홈페이지 확인 중 문제가 생겨 멈췄습니다 — ' + raw;
}

function showCheckFailed(msg) {
  App.checkMsg = msg;
  App.checkBad = true;
  // 자료도 지난 대조 결과도 건드리지 않는다.
}

/* 딱지 붙이기 — 못 읽은 쪽은 지난 결과를 그대로 물려받는다 */
async function applyStatus(live, livePages, failed) {
  /* ★ srl(홈페이지 글 번호)을 «그대로 함께» 넘긴다. 짝짓기는 부품(PuHomeDiff)이
     글 번호로 하고, 돌려주는 열쇠는 우리 RTDB 열쇠 그대로다 — 편집·저장이 그 열쇠를 쓴다.
     key 를 뒤에 두는 것도 일부러다: 자료에 key 칸이 섞여 들어와도 우리 열쇠를 덮지 못한다. */
  const ours = Object.keys(App.members).map(k => Object.assign({}, App.members[k], { key: k }));
  const list = PuHomeDiff.memberStatus(ours, live, App.staff, todayString());

  const prev = App.check || {};
  const next = { at: Date.now(), members: {}, pages: {}, duplicates: [], leftovers: {} };

  list.forEach(r => { next.members[r.key] = { name: r.name, status: r.status, reason: r.reason || '' }; });

  const ourPages = {};
  PAGE_IDS.forEach(mid => { ourPages[mid] = { text: (App.pages[mid] || {}).text || '' }; });
  PuHomeDiff.pageStatus(ourPages, livePages).forEach(r => {
    if (r.status === 'unknown' && prev.pages && prev.pages[r.path]) {
      next.pages[r.path] = prev.pages[r.path];   // 못 읽은 쪽 — 지난 결과 그대로
      return;
    }
    /* 새로 추가한 쪽처럼 우리 대조 기준(App.pages[mid].text)이 «아직 비어 있을» 때,
       홈페이지에는 내용이 있어 pageStatus 가 'pending'(=우리 글이 안 올라감)을 돌려준다.
       그런데 진짜 뜻은 정반대다 — 우리 글이 안 올라간 게 아니라 «우리에게 대조 기준이
       아직 없다». 쪽에는 붙여넣기 기능이 없어 사장님이 「안 올라감」을 보고 시킬 방법도
       없다. 그래서 기준 없음을 따로 갈라 말한다. */
    if (r.status !== 'unknown' && !(ourPages[r.path].text || '').trim()) {
      next.pages[r.path] = { status: 'noBase', reason: '기준 없음 — 홈페이지에서 읽어온 내용을 기준으로 삼으십시오' };
      return;
    }
    next.pages[r.path] = { status: r.status, reason: r.status === 'unknown' ? '홈페이지를 읽지 못함' : '' };
  });

  // 홈페이지에 같은 글 번호가 두 번 있으면 사람이 홈페이지를 손봐야 한다.
  next.duplicates = PuHomeDiff.duplicateLiveKeys(live) || [];

  /* 퇴사자 이름이 다른 쪽 본문에 남아 있는지 훑는다. 알리기만 하고 고치지 않는다.
     ★ 설계가 잡은 상황은 «홈페이지에서 글을 내린 뒤»다 — 구성원 목록에서는 빠졌는데
     인사말·업무 소개글에 이름이 남는 일. 그게 바로 toRemove 가 아니라 done(퇴사 완료)이다.
     toRemove(아직 홈페이지에 있음)일 때도 다른 쪽에 이름이 남아 있으면 알아야 하므로
     둘 다 훑는다 — 어느 한쪽만 보면 정작 봐야 할 순간(글을 내린 뒤)을 놓친다. */
  const pageArr = Object.keys(livePages).map(p => ({ path: p, text: livePages[p] }));
  list.filter(r => r.status === 'toRemove' || r.status === 'done').forEach(r => {
    const hits = PuHomeDiff.nameLeftovers(r.name, pageArr) || [];
    if (hits.length) next.leftovers[r.name] = hits;
  });

  App.check = next;
  /* 대조 결과 저장 실패도 조용히 두지 않는다 — 이 화면에만 새 딱지가 보이고
     다른 사람 화면에는 지난 딱지가 그대로 남는다. */
  try { App.saveErr = ''; await db.ref('homepage/check').set(next); }
  catch (e) {
    console.warn('[대조 결과 저장]', e && e.code);
    App.saveErr = '대조 결과를 저장하지 못했습니다' + (e && e.code ? '(' + e.code + ')' : '')
      + ' — 이 화면에만 새 딱지가 보이고, 다른 사람 화면에는 지난 딱지가 그대로 남습니다.';
  }
}

/* ══════ 붙여넣을 내용 ══════ */

/* 「감싸기」와 겹치는 <div> 를 가리는 판단은 부품(PuHomeExport.riskReport)이 한다.
   화면 안에 두었더니 검사가 화면 안 helper 이름을 못 박았고, 파일만 옮겨도 검사가 깨져
   모든 앱 배포를 막게 된다. 같은 판단을 화면에서 다시 만들지 말 것. */
function riskReport(careers, format) {
  return PuHomeExport.riskReport(careers, format);
}

function copyText(text) {
  const done = () => toast('복사했습니다');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    return;
  }
  fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); }
  catch (e) { say('복사하지 못했습니다', '아래 「복사된 내용」 칸의 글을 직접 골라 복사해 주십시오.'); }
  document.body.removeChild(ta);
}

/* 우리 자료에서 «다른» 사람이 같은 글 번호를 쓰고 있으면 그 이름들을 돌려준다.
   ★ 초안(고치는 중인 글 번호)으로 견준다 — 저장 전에도 막아야 남의 글을 안 덮는다. */
function srlConflict(key, srl) {
  const want = String(srl == null ? '' : srl).trim();
  if (!want) return [];
  return Object.keys(App.members || {})
    .filter(k => k !== key && String((App.members[k] || {}).srl || '').trim() === want)
    .map(k => (App.members[k] || {}).name || '(이름 없음)');
}

function openPaste() {
  const d = App.draft;
  if (!d) return;

  /* ★ 쪽(주요업무·오시는길·인사말)은 «대조 전용»이다. 우리가 가진 쪽 글자는 태그를 걷고
     줄을 뭉친 대조용이라, 그것을 붙여넣으면 지도 위젯·지사 탭·표·구획이 통째로 사라진다.
     게다가 부서진 쪽을 다시 읽으면 같은 글자가 나와 「같음」이 떠서 조용히 틀린다.
     안전하게 만들 방법이 없어 «붙여넣기 기능 자체»를 두지 않는다. */
  if (d.kind !== 'member') {
    openModal('<h2>' + esc(PAGE_LABEL[d.key] || d.key) + ' — 붙여넣기를 드리지 않습니다</h2>'
      + '<div class="bar bad">' + pagePasteWhy() + '</div>' + modalFoot(''));
    return;
  }

  /* ★ 우리 자료에서 두 사람이 같은 글 번호를 쓰면 편집 주소가 «남의 글»을 가리킨다.
     시킨 대로 붙여넣으면 남의 경력이 통째로 덮인다 — 복사도 안내도 하지 않는다. */
  const clash = srlConflict(d.key, d.srl);
  if (clash.length) {
    openModal('<h2>' + esc(d.name) + ' — 붙여넣기를 막았습니다</h2>'
      + '<div class="bar bad"><b>홈페이지 글 번호 ' + esc(String(d.srl).trim()) + ' 을(를) '
      + esc(clash.join(', ')) + ' 님도 쓰고 있습니다.</b><br>'
      + '이대로 편집 화면을 열면 <b>' + esc(clash.join(', ')) + '</b> 님의 글이 열리고, '
      + '붙여넣으면 그분 경력이 <b>' + esc(d.name) + '</b> 님 것으로 덮입니다.<br>'
      + '두 사람 중 <b>어느 쪽 글 번호가 잘못 적혔는지</b> 먼저 고쳐 주십시오.</div>'
      + modalFoot(''));
    return;
  }

  const text = PuHomeExport.careersText(d.careers, App.lineFormat);
  const url = PuHomeExport.editUrl('member', d.srl);
  const rep = riskReport(d.careers, App.lineFormat);

  copyText(text);

  let h = '<h2>' + esc(d.name + ' — 붙여넣을 경력사항') + '</h2>';
  h += '<div class="bar ok">내용이 복사되었습니다. 아래 순서대로 홈페이지에 붙여넣으세요.</div>';

  if (rep.broken.length) {
    h += '<div class="bar bad"><b>⚠ 이 줄은 화면 구조를 통째로 깨뜨릴 수 있습니다 — '
      + rep.broken.length + '줄</b><br>'
      + '줄 모양을 「감싸기」로 고른 상태인데, 아래 줄에 이미 &lt;div&gt; 가 들어 있습니다. '
      + '감싸기가 한 번 더 씌워지면 짝이 안 맞는 HTML 이 되어 <b>그 뒤 화면이 통째로 어긋날 수</b> 있습니다.<br>'
      + '줄에서 &lt;div&gt; 를 지우거나, 줄 모양을 「줄바꿈만」으로 바꾸십시오.'
      + '<div class="pre" style="margin-top:7px">' + rep.broken.map(esc).join('\n') + '</div></div>';
  }
  if (rep.soft.length) {
    h += '<div class="bar warn"><b>이 줄은 홈페이지에서 안 보일 수 있습니다 — ' + rep.soft.length + '줄</b><br>'
      + '꺾쇠(&lt; &gt;)가 들어 있어 브라우저가 태그로 여길 수 있습니다. '
      + '사람이 일부러 쓴 표기일 수 있어 <b>지우지 않고 알리기만</b> 합니다.'
      + '<div class="pre" style="margin-top:7px">' + rep.soft.map(esc).join('\n') + '</div></div>';
  }

  h += '<div class="fld"><label>복사된 내용</label><div class="pre">' + esc(text || '(빈 내용)') + '</div></div>';
  h += '<div class="guide"><b>붙여넣는 자리</b><ol>'
    + '<li>홈페이지 관리자로 로그인 <span class="kbd">푸른노무법인.kr/admin</span></li>'
    + '<li><b>구성원 갤러리</b>에서 <b>' + esc(d.name) + '</b> 글을 찾아 <b>편집</b></li>'
    + '<li><b>경력사항</b> 칸을 <span class="kbd">Ctrl+A</span>로 전체 선택하고 <span class="kbd">Ctrl+V</span>로 덮어쓰기'
    + ' <span class="sub">(경력사항 «칸 하나»입니다. 글 전체가 아닙니다)</span></li>'
    + '<li><b>저장</b> → 통합시스템으로 돌아와 <b>홈페이지 다시 확인</b></li>'
    + '</ol><div class="sub" style="margin-top:5px">4번까지 하면 딱지가 「안 올라감」에서 「같음」으로 바뀝니다. '
    + '안 바뀌면 붙여넣기가 안 된 것입니다.</div></div>';

  if (url) {
    h += '<div style="margin-top:11px"><a class="btn pri" style="text-decoration:none;display:inline-block" '
      + 'href="' + esc(url) + '" target="_blank" rel="noopener">홈페이지 편집 화면 열기</a></div>';
  } else {
    h += '<div class="bar warn" style="margin-top:11px">이 구성원은 홈페이지 글 번호가 아직 없습니다. '
      + '홈페이지에서 글을 새로 만든 뒤 <b>글 번호</b> 칸에 번호를 적어 주세요.</div>';
  }
  h += modalFoot('복사한 내용을 다시 복사하려면 단추를 다시 누르세요.');
  openModal(h);
}
window.openPaste = openPaste;

/* ══════ 되돌리기 ══════ */
function openHistory() {
  const d = App.draft;
  if (!d) return;
  const histKey = (d.kind === 'member') ? d.key : 'page:' + d.key;
  openModal('<h2>되돌리기</h2><div class="sub">이력을 읽고 있습니다…</div>');
  db.ref('homepage/history/' + histKey).limitToLast(30).once('value').then(s => {
    const v = s.val() || {};
    /* 열쇠는 「시각-임의글자」다. 시각으로 먼저 견주고, 같은 밀리초면 열쇠 글자로 가른다 —
       Number() 로 견주면 NaN 이 되어 최신 순서가 조용히 뒤섞인다. */
    const ts = Object.keys(v).sort((a, b) => (histTs(b) - histTs(a)) || String(b).localeCompare(String(a)));
    let h = '<h2>되돌리기 — ' + esc(d.kind === 'member' ? d.name : (PAGE_LABEL[d.key] || d.key)) + '</h2>';
    h += '<div class="bar info">고른 시점의 내용을 <b>통합시스템 자료로만</b> 되살립니다. '
      + '홈페이지는 그대로입니다 — 되살린 뒤 <b>다시 붙여넣어야</b> 홈페이지가 바뀝니다.<br>'
      + '되살리기도 저장이라 <b>되살리기 직전 값도 이력에 남습니다.</b></div>';
    if (!ts.length) {
      h += '<div class="empty">남아 있는 이전 내용이 없습니다. 한 번도 덮어쓴 적이 없습니다.</div>';
    } else {
      h += '<div class="car">' + ts.map(t => {
        const r = v[t] || {};
        const b = r.before || {};
        const line = (d.kind === 'member')
          ? ((b.name || '') + ' · 경력 ' + ((b.careers || []).length) + '줄')
          : (String(b.text || '').slice(0, 60) + (String(b.text || '').length > 60 ? '…' : ''));
        return '<div class="pk"><div class="t"><b>' + esc(stamp(histTs(t))) + '</b>'
          + '<div class="d">' + esc(r.updatedBy || '') + ' · ' + esc(line) + '</div></div>'
          + '<button class="btn sm" onclick="restoreFrom(\'' + esc(histKey) + '\',\'' + esc(t) + '\')">이 시점으로</button></div>';
      }).join('') + '</div>';
    }
    h += modalFoot('');
    openModal(h);
  }).catch(e => {
    openModal('<h2>되돌리기</h2><div class="bar bad">이력을 읽지 못했습니다: ' + esc((e && e.message) || e) + '</div>' + modalFoot(''));
  });
}
window.openHistory = openHistory;

async function restoreFrom(histKey, ts) {
  const d = App.draft;
  if (!d) return;
  const yes = await askYes('이 시점의 내용으로 되살릴까요?',
    '지금 내용은 이력에 남습니다. 홈페이지는 그대로이며, 되살린 뒤 <b>다시 붙여넣어야</b> 바뀝니다.',
    '되살리기');
  if (!yes) return;
  try {
    const snap = await db.ref('homepage/history/' + histKey + '/' + ts + '/before').once('value');
    const before = snap.val();
    if (!before) { await say('되살릴 내용을 찾지 못했습니다', '이 시점의 이력이 비어 있습니다.'); return; }
    // 되살리기도 저장이다 — saveRecord 를 그대로 써서 되살리기 «직전» 값도 이력에 남긴다.
    if (d.kind === 'member') {
      const next = { name: before.name || '', position1: before.position1 || '', position2: before.position2 || '',
                     intro: before.intro || '', srl: before.srl || '', careers: (before.careers || []).slice() };
      /* 되돌리기는 «내용»을 되살리는 것이다. 「홈페이지에 남기기」는 내용이 아니라 사람이
         내린 판단이므로 «지금 것»을 그대로 둔다 — 되살리기 한 번에 예외가 사라지면
         퇴사 경고가 다시 쏟아지고, 왜 그런지 알 길이 없다. */
      const kept = (App.members[d.key] || {}).keepOnSite;
      if (kept) next.keepOnSite = kept;
      await saveRecord('member', d.key, next);
      App.members[d.key] = Object.assign({}, next);
    } else {
      const next = { text: before.text || '' };
      await saveRecord('page', d.key, next);
      App.pages[d.key] = Object.assign({}, next);
    }
    markChanged(d.kind, d.key);
    loadDraft();
    closeModal();
    App.render();
    toast('되살렸습니다. 홈페이지는 다시 붙여넣어야 바뀝니다.');
  } catch (e) {
    await say('되살리지 못했습니다', esc((e && e.message) || e));
  }
}
window.restoreFrom = restoreFrom;

/* ══════ 경력관리에서 당겨오기 ══════
   경력관리(kcareer)는 사람마다 «자기 계정»에 자료를 둔다. 그래서 남의 자료는
   규칙이 막을 수 있다 — 막히면 그 사람만 건너뛰고 화면에 알린다. */
const Pull = { open: false, kind: 'wiccok', items: {}, sel: {}, err: '', name: '' };

function careerKindOf(key) {
  const hit = CAREER_KINDS.filter(k => k.key === key);
  return hit.length ? hit[0] : null;
}

/* 이 갈래가 경력관리 표에 «기간» 칸을 실제로 가지고 있는지. 없는 갈래(자격증·수료증·강의)는
   기간을 몰라서가 아니라 애초에 기간이라는 개념이 없어 늘 unknown 이 뜬다 — 그 갈래에는
   「기간 모름」 꼬리표를 붙이지 않는다. */
function kindHasPeriod(key) {
  const k = careerKindOf(key);
  return !!(k && k.hasPeriod);
}

/* 읽어야 할 «저장통» 목록. 자격증과 수료증은 같은 통(cert)이라 한 번만 읽는다. */
function kcareerStores() {
  const seen = {};
  CAREER_KINDS.forEach(k => { seen[k.store] = true; });
  return Object.keys(seen);
}

/* 저장통 → 갈래. 한 통(cert)에서 자격증과 수료증이 제목으로 갈린다. */
function splitByKind(stores) {
  const out = {};
  CAREER_KINDS.forEach(k => {
    const rows = Array.isArray((stores || {})[k.store]) ? stores[k.store] : [];
    out[k.key] = k.keep ? rows.filter(k.keep) : rows.slice();
  });
  return out;
}

function kcareerFromLocal() {
  /* 같은 주소(origin)에서 도는 앱이라 «내» 경력관리 자료는 이 브라우저에 그대로 있다.
     서버 규칙이 남의 자료를 막아도 내 것은 이 길로 읽힌다.
     ★ 읽는 이름은 «갈래»가 아니라 «저장통»이다 — cm3_license 는 존재하지 않는다. */
  const stores = {};
  kcareerStores().forEach(name => {
    try { stores[name] = JSON.parse(localStorage.getItem(KCAREER_NS + name) || '[]') || []; }
    catch (e) { stores[name] = []; }
  });
  return splitByKind(stores);
}

function kcareerFromDb(uid) {
  /* 클라우드 사본(kcareer/{uid}/ls)도 «cm3_ 를 뗀 저장통 이름»으로 들어 있다
     (kcareer.html fbGatherLS 가 이름표만 떼서 올린다). 갈래 이름으로 찾으면 늘 빈손이다. */
  return db.ref('kcareer/' + uid + '/ls').once('value').then(s => {
    const ls = s.val() || {};
    const stores = {};
    kcareerStores().forEach(name => {
      try { stores[name] = JSON.parse(ls[name] || '[]') || []; }
      catch (e) { stores[name] = []; }
    });
    return splitByKind(stores);
  });
}

/* 이름 → 사번 → 계정(uid). 한 번도 로그인 안 한 사람은 uid 가 없다.
   ★ 「못 읽었다」와 「그런 사람이 없다」를 «갈라서» 돌려준다. 둘 다 null 로 삼켜 같은 말을
     하면, 규칙이 막은 것을 사람이 없는 것으로 알고 엉뚱한 데(이름 철자)를 고치게 된다. */
function uidOfName(name) {
  const want = String(name || '').trim();
  return readRosterSource().then(r => {
    if (!r || !r.list) return { uid: null, why: 'rosterFail' };
    const hits = r.list.filter(u => u && String(u.name || '').trim() === want);
    if (!hits.length) return { uid: null, why: 'noName' };
    if (hits.length > 1) return { uid: null, why: 'dupName' };
    const sid = hits[0].sid;
    return db.ref('uid_roles').once('value').then(s => {
      const v = s.val() || {};
      let best = null;
      Object.keys(v).forEach(uid => {
        const r2 = v[uid];
        if (!r2 || r2.sid !== sid) return;
        if (!best || (r2.updatedAt || 0) > best.t) best = { uid: uid, t: r2.updatedAt || 0 };
      });
      return best ? { uid: best.uid, why: 'ok' } : { uid: null, why: 'noAccount' };
    }, e => {
      console.warn('[계정 목록]', e && e.code);
      return { uid: null, why: 'rolesFail', code: (e && e.code) || '' };
    });
  });
}

/* 위 why 를 사람 말로. 못 읽은 것과 없는 것을 서로 다른 문장으로 적는다. */
function uidFailText(name, r) {
  const who = '「' + name + '」';
  switch (r && r.why) {
    case 'noName':
      return '푸른ERP 직원 명부에 ' + who + ' 이름이 없습니다 — 이름 철자가 다를 수 있습니다.';
    case 'dupName':
      return '푸른ERP 직원 명부에 ' + who + ' 이름이 둘 이상이라 누구 것인지 단정할 수 없습니다 (동명이인).';
    case 'noAccount':
      return who + ' 님은 아직 통합시스템에 로그인한 적이 없어 계정(uid)이 없습니다 — 자료를 당겨올 곳이 없습니다.';
    case 'rosterFail':
      return '직원 명부를 «읽지 못했습니다» — ' + who + ' 님이 없다는 뜻이 아닙니다. '
        + '권한이나 그물 문제일 수 있으니 잠시 뒤 다시 눌러 주십시오.';
    case 'rolesFail':
      return '계정 목록(uid_roles)을 «읽지 못했습니다»' + (r && r.code ? '(' + r.code + ')' : '')
        + ' — ' + who + ' 님이 없다는 뜻이 아닙니다.';
    default:
      return who + ' 님의 계정을 찾지 못했습니다.';
  }
}

/* 갈래를 통틀어 몇 건이나 읽혔는지 — 「0건」과 「못 읽음」을 가르는 데 쓴다 */
function careerCount(items) {
  return CAREER_KINDS.reduce((n, k) => n + (((items || {})[k.key]) || []).length, 0);
}

function openPull() {
  const d = App.draft;
  if (!d || d.kind !== 'member') return;
  Pull.open = true; Pull.kind = 'wiccok'; Pull.items = {}; Pull.sel = {}; Pull.err = ''; Pull.name = d.name;
  openModal('<h2>경력관리에서 당겨오기</h2><div class="sub">경력관리 자료를 읽고 있습니다…</div>');

  uidOfName(d.name).then(r => {
    const uid = r && r.uid;
    const myUid = (App.me && App.me.uid) || '';
    if (uid && uid === myUid) {
      /* ★ 내 것은 먼저 이 브라우저(localStorage)에서 본다. 다만 이 브라우저에서 경력관리를
         한 번도 안 열었으면 로컬이 «비어 있다» — 그걸 「없다」고 하면 거짓말이 된다.
         경력관리가 밀어 넣은 클라우드 사본(kcareer/{uid}/ls)을 한 번 더 보고 나서 말한다.
         (규칙상 kcareer/$uid 는 본인만 읽을 수 있으니 내 것은 이 길로 읽힌다.) */
      const local = kcareerFromLocal();
      if (careerCount(local) > 0) { Pull.items = local; renderPull(); return null; }
      return kcareerFromDb(uid).then(items => {
        Pull.items = items;
        if (careerCount(items) === 0) {
          Pull.err = '이 브라우저에도, 경력관리 클라우드 사본에도 자료가 없습니다 — '
            + '경력관리(kcareer.html)를 열어 «클라우드 저장»을 한 번 눌러 주십시오.';
        }
        renderPull();
      }).catch(e => {
        console.warn('[경력관리 클라우드]', e && e.code);
        Pull.items = local;
        Pull.err = '이 브라우저에 경력관리 자료가 없고, 클라우드 사본도 «읽지 못했습니다»'
          + (e && e.code ? '(' + e.code + ')' : '') + ' — 자료가 없다는 뜻이 아닙니다.';
        renderPull();
      });
    }
    if (!uid) {
      Pull.err = uidFailText(d.name, r);
      Pull.items = {};
      renderPull();
      return null;
    }
    return kcareerFromDb(uid).then(items => { Pull.items = items; renderPull(); }).catch(e => {
      Pull.err = '「' + d.name + '」 님의 경력관리 자료를 읽지 못했습니다. '
        + '경력관리 자료는 본인 계정에만 열려 있어, 본인이 직접 뽑아 주셔야 합니다.';
      Pull.items = {};
      renderPull();
    });
  }).catch(e => {
    /* 여기까지 새면 창이 「읽고 있습니다…」에 멈춰 버린다 — 조용히 멈추지 않는다 */
    console.warn('[당겨오기]', e);
    Pull.err = '경력관리 자료를 찾는 중 문제가 생겼습니다 — ' + ((e && (e.code || e.message)) || e);
    Pull.items = {};
    renderPull();
  });
}
window.openPull = openPull;

/* 경력관리 항목 → 문장 만들기 부품이 받는 모양.
   ★ 칸 이름은 갈래마다 «다르다». 아무거나 넉넉히 받아 주면 조용히 빈칸이 되므로
     갈래별 pick(CAREER_KINDS)으로만 옮긴다. 만든 문장은 손으로 고칠 수 있다. */
function toCareerItem(it, kind) {
  const o = it || {};
  const k = careerKindOf(kind);
  const p = (k && k.pick) ? (k.pick(o) || {}) : {};
  const s = v => String(v == null ? '' : v).trim();
  return { org: s(p.org), role: s(p.role), title: s(p.title), period: s(p.period), end: s(p.end) };
}
/* 화면에 「언제 것인지」를 보여 준다. 갈래마다 날짜 칸 이름이 다르다. */
function itemWhen(it, kind) {
  const k = careerKindOf(kind);
  const p = (k && k.pick) ? (k.pick(it || {}) || {}) : {};
  return String(p.when == null ? '' : p.when).trim();
}

function pullTab(kind) { Pull.kind = kind; renderPull(); }
function pullToggle(kind, i) {
  const id = kind + ':' + i;
  if (Pull.sel[id]) delete Pull.sel[id]; else Pull.sel[id] = true;
  renderPull();
}
window.pullTab = pullTab; window.pullToggle = pullToggle;

function renderPull() {
  const today = todayString();
  const items = Pull.items[Pull.kind] || [];
  let h = '<h2>' + esc(Pull.name) + ' — 경력관리에서 당겨오기</h2>';
  h += '<div class="sub">체크한 것만 경력사항에 들어갑니다. 넣은 뒤 <b>표현은 손으로 다듬을 수 있습니다.</b></div>';
  if (Pull.err) h += '<div class="bar warn" style="margin-top:9px">' + esc(Pull.err) + '</div>';

  h += '<div class="tabs">' + CAREER_KINDS.map(k => {
    const n = (Pull.items[k.key] || []).length;
    return '<button class="' + (k.key === Pull.kind ? 'on' : '') + '" onclick="pullTab(\'' + k.key + '\')">'
      + esc(k.label) + ' ' + n + '</button>';
  }).join('') + '</div>';

  // 홈페이지에 現 으로 올라가 있는데 기간이 끝난 것 — 밖에서 보기에 나쁘다
  const all = [];
  CAREER_KINDS.forEach(k => (Pull.items[k.key] || []).forEach(it => all.push(toCareerItem(it, k.key))));
  const expired = (App.draft && App.draft.careers)
    ? (PuHomeCareer.expiredInLive(App.draft.careers, all, today) || []) : [];
  if (expired.length) {
    h += '<div class="bar warn"><b>홈페이지에 만료된 직함이 걸려 있습니다 — ' + expired.length + '줄</b>'
      + '<div class="pre" style="margin-top:6px">' + expired.map(esc).join('\n') + '</div></div>';
  }

  if (!items.length) {
    h += '<div class="empty">이 갈래에 항목이 없습니다.</div>';
  } else {
    // ★ 자격증·수료증·강의는 기간 개념이 없는 갈래라 늘 unknown 이 뜬다 — 그 헛경고를
    //   보여 주지 않는다. kindHasPeriod 가 false 면 「現 으로 들어감」으로만 보여 준다.
    const hasPeriod = kindHasPeriod(Pull.kind);
    h += '<div class="car">' + items.map((it, i) => {
      const line = PuHomeCareer.toLine(toCareerItem(it, Pull.kind), today);
      const id = Pull.kind + ':' + i;
      const tag = (hasPeriod && line.ended)
        ? '<span class="pill toRemove">기간 끝남 → 前</span>'
        : ((hasPeriod && line.unknown) ? '<span class="pill unknown">기간 모름 · 現 으로 넣음</span>'
                        : '<span class="pill toAdd">現 으로 들어감</span>');
      /* 번호는 화면에서 세는 용도다 — 넣는 글자(line.text)에는 들어가지 않는다 */
      return '<label class="pk"><input type="checkbox" ' + (Pull.sel[id] ? 'checked' : '')
        + ' onchange="pullToggle(\'' + Pull.kind + '\',' + i + ')">'
        + '<span class="num">' + (i + 1) + '</span>'
        + '<div class="t"><b>' + esc(line.text) + '</b>'
        + '<div class="d">' + esc(itemWhen(it, Pull.kind) || '기간 정보 없음') + '</div></div>' + tag + '</label>';
    }).join('') + '</div>';
  }

  const n = Object.keys(Pull.sel).length;
  h += '<div class="guide"><b>문장으로 바뀌는 규칙</b><ol>'
    + '<li>기간이 <b>안 끝난 것</b> → <span class="kbd">現 …</span></li>'
    + '<li>기간이 <b>끝난 것</b> → <span class="kbd">前 …</span></li>'
    + '<li>기간을 <b>모르는 것</b>은 끝났다고 단정하지 않고 <b>現</b> 으로 두되 「기간 모름」 표시를 남깁니다</li>'
    + '</ol></div>';
  h += '<div class="foot"><button class="btn pri" onclick="pullApply()"' + (n ? '' : ' disabled') + '>'
    + '체크한 것 넣기' + (n ? ' (' + n + '건)' : '') + '</button>'
    + '<button class="btn" onclick="closeModal()">닫기</button></div>';
  openModal(h);
}

function pullApply() {
  const d = App.draft;
  if (!d || d.kind !== 'member') return;
  const today = todayString();
  const added = [];
  Object.keys(Pull.sel).forEach(id => {
    const at = id.lastIndexOf(':');
    const kind = id.slice(0, at), i = Number(id.slice(at + 1));
    const it = (Pull.items[kind] || [])[i];
    if (!it) return;
    const line = PuHomeCareer.toLine(toCareerItem(it, kind), today);
    let text = line.text;
    // ★ 기간 개념이 있는 갈래(위촉장·학력)에서만 「기간 모름」을 붙인다 — 자격증·수료증·
    //   강의는 애초에 기간이 없는 갈래라 이 표시가 늘 붙어 그대로 홈페이지 글로 나간다.
    if (line.unknown && kindHasPeriod(kind)) text += '  ※기간 모름';
    if (d.careers.indexOf(text) < 0) { d.careers.push(text); added.push(text); }
  });
  App.dirty = true;
  closeModal();
  App.render();
  toast(added.length ? (added.length + '줄을 넣었습니다. 확인 후 저장하세요.') : '넣을 새 줄이 없습니다.');
}
window.pullApply = pullApply;

/* ══════ 덧창 ══════ */
function openModal(html) {
  $('modalCard').innerHTML = html;
  $('modal').classList.add('on');
}
function closeModal() { $('modal').classList.remove('on'); Pull.open = false; }
function modalBackdrop(e) { if (e.target === $('modal')) closeModal(); }
function modalFoot(note) {
  return '<div class="foot">' + (note ? '<span class="sub">' + esc(note) + '</span>' : '')
    + '<span style="flex:1"></span><button class="btn" onclick="closeModal()">닫기</button></div>';
}
window.closeModal = closeModal; window.modalBackdrop = modalBackdrop;
/* Esc — 화면 안 창이 떠 있으면 그것부터 닫는다(덧창 위에 떠 있기 때문이다).
   그만두기와 같은 뜻이라 dlgCancel 을 쓴다 — 답을 안 준 채 닫으면 부른 쪽이 멈춘다. */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (Dlg.done) { dlgCancel(); return; }
  closeModal();
});

/* ══════ 화면 그리기 ══════ */
function pillHtml(status) {
  if (!status) return '<span class="pill none">확인 전</span>';
  return '<span class="pill ' + status + '">' + esc(STATUS_TEXT[status] || status) + '</span>';
}

/* ★ 틀은 붙박이다 (3차 설계 §2). 페이지 자체는 굴리지 않는다 — 고르는 사람이
     바뀌어도 길이가 안 바뀐다.
   ★ 4차 지시로 «세로 넷»에서 «가로 셋»으로 바꿨다(목업 v6b):
       머리띠(위 고정) → 몸통[ 기둥(대시보드+할 일) · 목록 · 편집칸 ] → 딱지 안내(아래).
     안내 띠를 기둥 아래쪽 「할 일」로 옮겼다 — 위에 쌓여 있을 때는 띠가 두세 개만 떠도
     몸통 높이를 최대 34% 까지 먹어 목록과 편집칸이 눌렸다. */
function screen() {
  if (App.loading) return '<div class="empty">자료를 읽고 있습니다…</div>';
  return '<div class="app">'
    + '<div class="top">' + appbarHtml() + '</div>'
    + '<div class="body">' + railHtml() + listHtml() + editHtml() + '</div>'
    + legendHtml()
    + '</div>';
}

/* 왼쪽 기둥 — «무엇을 볼까»(대시보드 카드)와 «무엇을 해야 하나»(할 일)를 한 기둥에 둔다.
   눈이 왼쪽에서 오른쪽으로만 움직인다: 갈래 고르기 → 줄 고르기 → 고치기. */
function railHtml() {
  return '<div class="rail">'
    + '<div class="rh">무엇을 볼까</div>'
    + '<div class="dash">' + dashHtml() + '</div>'
    + todoHtml()
    + '</div>';
}

function appbarHtml() {
  const at = App.check && App.check.at;
  return '<div class="appbar">'
    + '<div class="ttl">홈페이지 관리</div>'
    + '<span class="when">홈페이지 확인: ' + esc(at ? stamp(at) : '아직 안 함') + '</span>'
    + '<div class="sp"></div>'
    + '<label class="sub">줄 모양 '
    + '<select onchange="setLineFormat(this.value)">'
    + '<option value="plain"' + (App.lineFormat === 'plain' ? ' selected' : '') + '>줄바꿈만 (기본)</option>'
    + '<option value="div"' + (App.lineFormat === 'div' ? ' selected' : '') + '>줄마다 감싸기</option>'
    + '</select></label>'
    + '<button class="btn pri" onclick="checkHomepage()"' + (App.checking ? ' disabled' : '') + '>'
    + (App.checking ? '확인 중…' : '홈페이지 다시 확인') + '</button>'
    + '<a class="btn" style="text-decoration:none" href="' + esc(PuHomeExport.ORIGIN) + '" target="_blank" rel="noopener">홈페이지 열기</a>'
    + '</div>';
}

function bannersHtml() {
  let h = '';

  /* ★ 늘 떠 있던 안내 한 줄은 «맨 아래 딱지 안내»로 옮겼다 — 「할 일」 칸에 두면
     할 일이 없는 날에도 칸이 차 있어, 정작 할 일이 생겼을 때 눈에 안 걸린다. */

  /* 대조를 한 번도 안 눌렀으면 그 사실이 첫 줄이다 — 「할 일 0」으로 보이면 안 된다 */
  if (!App.check) {
    h += '<div class="bar info"><b>홈페이지와 아직 대조하지 않았습니다</b><br>'
      + '대조 딱지는 <b>「홈페이지 다시 확인」</b>을 누를 때만 붙습니다. 저절로 돌지 않습니다.'
      + '<div class="go"><button class="btn pri sm" onclick="checkHomepage()"'
      + (App.checking ? ' disabled' : '') + '>' + (App.checking ? '확인 중…' : '홈페이지 다시 확인')
      + '</button></div></div>';
  }

  /* 명부만 보고 아는 것 — 화면을 열면 바로 알 수 있어 대조 전에도 적는다.
     ★ 「남김」으로 둔 사람은 이 수에서 뺀다(카드도 따로 센다). 함께 세면
       카드에는 「퇴사 2」인데 여기는 3명이 되어 숫자가 어긋난다. */
  const ms = statOf('members');
  if (ms.own.left || ms.own.ask) {
    const bits = [];
    if (ms.own.left) bits.push('퇴사 <b>' + ms.own.left + '명</b>');
    if (ms.own.ask) bits.push('명부에 없음 <b>' + ms.own.ask + '명</b>');
    h += '<div class="bar warn"><b>푸른ERP 명부와 다른 사람</b> — ' + bits.join(' · ')
      + '<div class="sub" style="color:inherit">'
      + (App.check ? '홈페이지에 아직 올라가 있는 사람은 아래에 따로 적습니다.'
                   : '홈페이지에 올라가 있는지는 «확인»을 눌러야 압니다.') + '</div>'
      + '<div class="go">'
      + (ms.own.left ? '<button class="btn sm" onclick="App.filt(\'own:left\',\'members\')">퇴사한 사람만 보기</button>' : '')
      + (ms.own.ask ? '<button class="btn sm" onclick="App.filt(\'own:ask\',\'members\')">명부에 없는 사람만 보기</button>' : '')
      + '</div></div>';
  }
  if (ms.kept) {
    /* 할 일이 아니다 — «왜 퇴사 경고가 없는지»를 알려 주는 줄이다 */
    h += '<div class="bar ok"><b>홈페이지에 남기기로 한 사람 ' + ms.kept + '명</b>'
      + '<div class="sub" style="color:inherit">명부에 퇴사로 찍혀 있어도 「내릴 것(퇴사)」 딱지를 '
      + '달지 않고 내용 대조만 합니다. 예외를 풀면 다음 확인에서 퇴사 판정을 다시 받습니다.</div>'
      + '<div class="go"><button class="btn sm" onclick="App.filt(\'kept\',\'members\')">'
      + '남긴 사람 보기</button></div></div>';
  }

  /* ★ «우리 자료» 쪽 글 번호 겹침. 홈페이지 쪽 겹침(duplicates)과 다른 사고다 —
     이건 편집 주소가 남의 글을 가리키게 만들어 남의 경력을 덮어쓰게 한다.
     대조를 한 번도 안 눌러도 보여야 하므로 App.check 가 아니라 지금 자료로 바로 센다. */
  const ourDup = PuHomeDiff.duplicateOurKeys(
    Object.keys(App.members || {}).map(k => Object.assign({}, App.members[k], { key: k })));
  if (ourDup.length) {
    h += '<div class="bar bad"><b>통합시스템 자료에서 같은 홈페이지 글 번호를 두 사람이 쓰고 있습니다</b><br>'
      + ourDup.map(x => '글 번호 <b>' + esc(x.srl) + '</b> — ' + esc(x.names.join(', '))).join('<br>')
      + '<div class="sub" style="color:inherit">이대로 두면 붙여넣기가 «남의 글»을 덮습니다. '
      + '겹친 줄은 붙여넣기를 막아 두었습니다 — 어느 쪽 글 번호가 잘못 적혔는지 고쳐 주십시오.</div></div>';
  }

  if (App.checkMsg) {
    h += '<div class="bar ' + (App.checkBad ? 'bad' : 'warn') + '"><b>확인 실패</b> — ' + esc(App.checkMsg)
      + '<div class="sub" style="color:inherit">자료와 지난 딱지는 건드리지 않았습니다.</div></div>';
  }
  /* 못 읽은 것을 「아직 자료가 없습니다」로 뭉개면 규칙이 없어서인지 자료를 안 넣어서인지
     구분할 방법이 없다. 빨간 띠로 「보안규칙이 아직 없을 수 있습니다」까지 적어 준다. */
  if (App.dataErr) h += '<div class="bar bad">' + esc(App.dataErr) + '</div>';
  if (App.staffErr) h += '<div class="bar warn">' + esc(App.staffErr) + '</div>';
  if (App.saveErr) h += '<div class="bar warn">' + esc(App.saveErr) + '</div>';

  const dup = (App.check && App.check.duplicates) || [];
  if (dup.length) {
    h += '<div class="bar bad"><b>홈페이지에 같은 글 번호가 두 번 있습니다 — ' + esc(dup.join(', ')) + '</b><br>'
      + '통합시스템은 먼저 나온 글을 기준으로 대조합니다. '
      + '홈페이지 <b>구성원 갤러리</b>에서 겹친 글을 손봐 주십시오.</div>';
  }

  const st = (App.check && App.check.members) || {};
  const outs = Object.keys(st).filter(k => st[k].status === 'toRemove');
  const left = (App.check && App.check.leftovers) || {};
  if (outs.length) {
    h += '<div class="bar bad"><b>퇴사한 노무사가 홈페이지에 남아 있습니다 — ' + outs.length + '명</b><br>'
      + outs.map(k => esc(st[k].name) + ' (' + esc(st[k].reason || '') + ')').join(' · ')
      + '<div class="guide" style="background:#fff"><b>홈페이지에서 내리는 법</b><ol>'
      + '<li>홈페이지 관리자 로그인 <span class="kbd">푸른노무법인.kr/admin</span></li>'
      + '<li><b>구성원 갤러리</b>에서 해당 글을 찾습니다</li>'
      + '<li><b>삭제하지 말고 「비공개」로 바꾸십시오.</b> 잘못 내렸어도 되살릴 수 있습니다</li>'
      + '<li>통합시스템으로 돌아와 <b>홈페이지 다시 확인</b></li>'
      + '</ol></div>'
      + '<div class="go"><button class="btn sm" onclick="App.filt(\'toRemove\',\'members\')">'
      + '이 ' + outs.length + '명 보기</button></div></div>';
  }

  /* ★ 이름 잔존은 «퇴사했는데 아직 홈페이지에 있는»(toRemove) 사람만이 아니라
     «홈페이지에서 이미 내린»(done) 사람에게도 뜬다 — 오히려 글을 내린 바로 다음이
     정작 봐야 할 순간이다. outs(toRemove)가 0명이어도 이 띠는 따로 보여야 한다. */
  const leftNames = Object.keys(left);
  if (leftNames.length) {
