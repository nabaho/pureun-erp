    h += '<div class="bar warn"><b>퇴사자 이름이 다른 쪽에도 남아 있습니다</b><br>'
      + leftNames.map(n => esc(n) + ' — '
          + left[n].map(x => (PAGE_LABEL[x.path] || x.path) + ' ' + x.count + '회').join(', ')).join('<br>')
      + '<div class="sub" style="color:inherit">동명이인일 수 있으니 알려만 드립니다. 자동으로 고치지 않습니다.</div>'
      /* 이름이 남은 «그 쪽»으로 바로 가는 단추 — 어느 쪽인지 알아도 찾아 들어가야 했다 */
      + '<div class="go">' + leftoverGoBtns(left) + '</div></div>';
  }

  /* 자문사현황 — 업체관리를 «못 읽은» 것과 «업체가 없는» 것은 다르다 */
  if (App.companiesErr) {
    h += '<div class="bar bad"><b>자문사 목록을 읽지 못했습니다</b><br>' + esc(App.companiesErr)
      + '<div class="go"><button class="btn sm" onclick="location.reload()">다시 읽기</button></div></div>';
  }
  const ps = statOf('partner');
  if (ps.own.ended) {
    h += '<div class="bar warn"><b>자문이 끝났는데 홈페이지에 남은 곳 — ' + ps.own.ended + '개사</b><br>'
      + '<span class="sub" style="color:inherit">업체관리에서 거래가 끝났는데 「올림」으로 표시돼 있습니다. '
      + '끝난 뒤에도 실적으로 남겨 두는 곳이 있어 «알리기만» 합니다.</span>'
      + '<div class="go"><button class="btn sm" onclick="App.filt(\'own:ended\',\'partner\')">'
      + '이 ' + ps.own.ended + '개사 보기</button></div></div>';
  }

  /* 대조 기준이 없는 쪽 — 기준이 없으면 「같음/안 올라감」을 말할 수 없다.
     오류가 아니라 «해야 할 일»이라 파란 띠로 적는다. */
  const noBase = ['work', 'inquiry', 'greeting'].reduce((a, g) => a.concat(
    rowsOf(g).filter(r => r.status === 'noBase').map(r => ({ g: g, key: r.key, name: r.name }))), []);
  if (noBase.length) {
    h += '<div class="bar info"><b>대조 기준이 없는 쪽 — ' + noBase.length + '개</b><br>'
      + noBase.map(x => esc(x.name)).join(' · ')
      + '<div class="sub" style="color:inherit">홈페이지에서 읽어온 내용을 기준으로 한 번 저장해 두면 '
      + '다음 확인부터 「같음/안 올라감」을 말할 수 있습니다.</div>'
      + '<div class="go">' + noBase.map(x =>
          '<button class="btn sm" onclick="App.jump(\'' + esc(x.g) + '\',\'' + esc(x.key) + '\')">'
          + esc(x.name) + ' 열기</button>').join('') + '</div></div>';
  }
  return h;
}

/* 퇴사자 이름이 남은 쪽으로 가는 단추. 쪽 이름(work1…)이 어느 갈래인지 여기서 되짚는다 —
   갈래를 잘못 짚으면 단추를 눌러도 그 줄이 없는 목록으로 간다. */
function leftoverGoBtns(left) {
  const seen = {}, out = [];
  Object.keys(left).forEach(n => (left[n] || []).forEach(x => {
    if (seen[x.path]) return;
    seen[x.path] = true;
    const g = (x.path === 'inquiry' || x.path === 'greeting') ? x.path : 'work';
    out.push('<button class="btn sm" onclick="App.jump(\'' + esc(g) + '\',\'' + esc(x.path) + '\')">'
      + esc(PAGE_LABEL[x.path] || x.path) + ' 열기</button>');
  }));
  return out.join('');
}

/* ══════ 대시보드 (4차 지시 · 목업 v6b · 규격표 docs/mockups/homepage-dash-spec.html) ══════
   ★ 다섯 갈래가 «같은 다섯 칸»을 채운다:
       ① 갈래 이름  ② 총수+단위  ③ 우리 자료 경고  ④ 대조 결과  ⑤ 빨간 점(=③+④)
   ★ ③과 ④를 한 숫자로 뭉치지 않는다. ③은 명부·기준 글자만 봐서 «화면을 열면 바로»
     아는 것이고, ④는 사람이 「홈페이지 다시 확인」을 눌러야 아는 것이다. 합치면
     「아직 안 봤다」와 「봤는데 깨끗하다」가 같은 모양이 된다. */

/* 이 줄에 손댈 것이 있는가 — «한 곳에서만» 판단한다.
   ★ 카드의 빨간 점·「손댈 것」 딱지·할 일 수가 모두 이 함수를 쓴다. 곳곳에서 따로
     세면 카드에는 점이 있는데 할 일은 0 인 식으로 서로 어긋난다.
   ★ 「남김」은 사람이 이미 판단한 것이라 뺀다.
   ★ 못 읽음(unknown)은 손댈 것이 아니다 — 홈페이지를 못 읽은 것이지 우리가 할 일이 아니다. */
function needsAttentionRow(r) {
  if (r.kept) return false;
  /* 대조 딱지가 있으면 그 말을 믿는다 — 「같음」·「내려감」이면 할 일이 없다.
     ★ 이 순서가 뒤집히면 퇴사 처리를 «끝낸» 사람(내려감)이 명부 딱지 때문에
       영영 손댈 것으로 남는다(3차 설계에서 이미 한 번 고친 자리다). */
  if (r.status && !DONE_STATUS[r.status]) return true;
  /* 「홈페이지에만」 있는 줄은 위 대조 딱지에서 이미 판정됐다. 우리 명부에 없는 것이
     «당연»한 줄이라 여기서 또 세면 한 줄을 두 번 센다. */
  if (r.liveOnly) return false;
  /* 명부상 퇴사 — 대조 딱지가 «아직 없을» 때만 손댈 것이다(내려갔는지 모르니까) */
  if (r.roster && r.roster.kind === 'left') return !r.status;
  /* 명부에 없음 — 내용이 「같음」이어도 «남김으로 표시해 두라»는 할 일이 남는다.
     그래서 대조 전·후 판정이 같다. */
  return !!r.roster;
}

/* 한 갈래의 다섯 칸을 센다. 갈래가 달라도 이 함수 하나가 만든다 —
   갈래별로 따로 세면 카드끼리 숫자 뜻이 달라진다. */
function statOf(group) {
  const rows = rowsOf(group);
  const own = {};        // ③ 우리 자료 경고 — 종류별 수
  let kept = 0;          // 「남김」은 경고가 아니다. 사람이 이미 판단한 것이라 따로 센다
  rows.forEach(r => {
    if (r.kept) { kept++; return; }
    if (r.roster && !r.liveOnly) own[r.roster.kind] = (own[r.roster.kind] || 0) + 1;
    /* 쪽은 «기준 글자가 없는 것»이 우리 자료 쪽 경고다. 대조 딱지 noBase 는
       확인을 눌러 얻은 결과이지만, 원인은 우리 자료(기준 없음)에 있다. */
    if (r.status === 'noBase') own.nobase = (own.nobase || 0) + 1;
  });
  const hotOwn = Object.keys(own).reduce((s, k) => s + own[k], 0);
  /* ④ 대조로 아는 손댈 것 — 「같음」·「내려감」은 뺀다.
     기준 없음(noBase)은 ③에서 셌으므로 여기서는 빼서 두 번 말하지 않는다. */
  const hotChk = App.check ? rows.filter(r => !r.kept && r.status && !DONE_STATUS[r.status]
    && r.status !== 'noBase' && r.status !== 'unknown').length : 0;
  /* ⑤ 손댈 것 — «줄 수»다. ③+④ 를 더하지 않는다: 박성수처럼 명부 퇴사이면서
     홈페이지에도 남아 있는 사람은 한 사람인데 두 번 세어진다. */
  const hot = rows.filter(needsAttentionRow).length;
  return { rows: rows, own: own, kept: kept, hotOwn: hotOwn, hotChk: hotChk, hot: hot };
}

/* ③ 우리 자료 경고의 종류. 갈래마다 «이름»만 다르고 카드에서 차지하는 자리는 같다.
   ended — 자문사현황: 「올림」으로 표시했는데 업체관리에서 거래가 끝난 곳 */
const OWN_LABEL = { left: '퇴사 (명부)', ask: '명부에 없음', nobase: '기준 없음', ended: '자문 종료' };
const OWN_CLS = { left: 'rm', ask: 'ask', nobase: 'ask', ended: 'rm' };
/* 카드 안에서 쓰는 짧은 말. 카드 폭이 좁아 긴 말이 들어가면 딱지가 줄줄이 접혀
   두 줄 카드가 네 줄이 된다. 목록 딱지(OWN_LABEL)는 긴 말 그대로 둔다 —
   목록에는 자리가 있고, 거기서는 「퇴사」가 무엇 기준인지 밝혀야 한다. */
const OWN_SHORT = { left: '퇴사', ask: '명부 없음', nobase: '기준 없음', ended: '자문 종료' };

/* ③ 우리 자료 경고 */
function ownMinis(group) {
  const s = statOf(group), out = [];
  Object.keys(s.own).forEach(k => {
    out.push('<span class="mini ' + (OWN_CLS[k] || 'flat') + '" title="' + esc(OWN_LABEL[k] || k) + '">'
      + esc(OWN_SHORT[k] || OWN_LABEL[k] || k) + ' ' + s.own[k] + '</span>');
  });
  if (s.kept) out.push('<span class="mini ok">남김 ' + s.kept + '</span>');
  /* 자문사현황은 «업체관리를 못 읽었는지»가 먼저다 — 목록이 0개인 것과 못 읽은 것은 다르다 */
  if (group === 'partner') {
    if (App.companiesErr) return '<span class="mini bad">업체관리를 못 읽음</span>';
    /* 고를 수 있는 업체가 몇 개인지 — 카드의 큰 숫자는 «올린 회사 수»라서 따로 적는다 */
    out.unshift('<span class="mini flat">업체관리 ' + s.rows.length + '</span>');
  }
  /* ★ 손댈 것이 없으면 «회색»으로 적는다. 초록으로 두면 갈래 다섯 중 넷이 초록이라
     눈이 초록에 익어, 정작 초록이 뜻을 갖는 자리(④ 홈페이지와 같음)가 안 보인다. */
  if (!out.length) out.push('<span class="mini flat">이상 없음</span>');
  return out.join('');
}
/* ④ 대조 결과 — 확인을 안 눌렀으면 «안 함»이라고 적는다. 「이상 없음」이 아니다. */
function chkMinis(group) {
  /* ★ 자문사현황은 «못 한다». 확인을 눌러도 달라지지 않는다 — 홈페이지가 로고 그림이라
     회사명이 글자로 없다. 「대조 안 함」으로 적으면 누르면 될 것처럼 들린다. */
  if (group === 'partner') return '<span class="mini none">대조 못 함 (그림)</span>';
  if (!App.check) return '<span class="mini none">대조 안 함</span>';
  const s = statOf(group);
  return s.hotChk ? '<span class="mini bad">손댈 것 ' + s.hotChk + '</span>'
                  : '<span class="mini ok">홈페이지와 같음</span>';
}

const GROUP_UNIT = { members: '명', work: '쪽', inquiry: '쪽', greeting: '쪽', partner: '개사' };

/* ② 카드의 큰 숫자.
   ★ 자문사현황은 «홈페이지에 올린 회사 수»다. 업체관리 전체(수백 개사)를 적으면
     홈페이지와 아무 상관 없는 숫자가 제일 크게 박힌다 — 고를 수 있는 업체 수는
     아래 작은 딱지로 따로 적는다. */
function cardCount(group) {
  if (group === 'partner') return postedNames().length;
  return statOf(group).rows.length;
}

function dashHtml() {
  return GROUPS.map(g => {
    const s = statOf(g.key);
    /* 두 줄이다 — 첫 줄에 이름과 숫자, 둘째 줄에 ③│④.
       ★ ③과 ④를 갈라 두는 규칙은 그대로다(점선이 위에서 옆으로 바뀐 것뿐). */
    return '<button class="dcard' + (App.group === g.key ? ' on' : '') + '"'
      + ' onclick="App.go(\'' + g.key + '\')">'
      + '<div class="t">' + (s.hot ? '<span class="dot" title="손댈 것이 있습니다"></span>' : '')
      + esc(g.label)
      + '<span class="n">' + cardCount(g.key) + '<em>' + (GROUP_UNIT[g.key] || '개') + '</em></span>'
      + '</div>'
      + '<div class="ln"><span class="own">' + ownMinis(g.key) + '</span>'
      + '<span class="chk">' + chkMinis(g.key) + '</span></div>'
      + '</button>';
  }).join('');
}

/* 할 일 — 안내 띠를 모아 둔 칸. 몇 건인지 머리에 적는다.
   ★ 「할 일 0」과 「대조 안 함」은 다르다 — 대조를 안 했으면 띠가 그 사실부터 알린다. */
function todoHtml() {
  const bars = bannersHtml();
  const n = todoCount();
  return '<div class="todo">'
    + '<div class="th">지금 할 일 <span class="c' + (n ? '' : ' zero') + '">' + n + '</span>'
    + '<span style="flex:1"></span>'
    + '<span class="sub">' + (App.check ? '확인: ' + esc(stamp(App.check.at)) : '아직 대조 안 함')
    + '</span></div>'
    + '<div class="sc">' + (bars || '<div class="empty">손댈 것이 없습니다.</div>') + '</div>'
    + '</div>';
}

/* 할 일 수 — 갈래를 통틀어 ③+④ 를 더한다. 카드의 빨간 점과 같은 셈이라야
   카드에는 점이 있는데 할 일은 0 인 일이 없다. */
function todoCount() {
  return GROUPS.reduce((n, g) => n + statOf(g.key).hot, 0);
}

/* 명부 딱지 (3차 설계 §3) — 대조 딱지와 «나란히, 따로» 보여준다.
   ★ 「남김」으로 둔 사람에게는 퇴사 딱지 대신 「남김」을 보여준다. 둘 다 붙이면
     왜 퇴사 경고가 없는지가 흐려진다 — 사유는 아래 줄에 그대로 적힌다. */
function rosterPillHtml(r) {
  if (r.kept) return '<span class="pill keep">남김</span>';
  const m = r.roster;
  if (!m) return '';                                   // 재직 중이거나 명부를 못 읽었다
  const cls = OWN_CLS[m.kind] || 'ask';
  return '<span class="pill ' + cls + '">' + esc(m.label) + '</span>';
}

/* 자문사 줄의 «사람이 표시한» 딱지. 표시 안 함은 색을 쓰지 않는다 —
   아직 안 본 것이지 잘못된 것이 아니다. */
function postedPillHtml(r) {
  if (!r || r.posted === undefined) return '';
  if (r.posted === 'yes') return '<span class="pill posted">올림</span>';
  if (r.posted === 'no') return '<span class="pill unposted">안 올림</span>';
  return '<span class="pill none">표시 안 함</span>';
}

/* ══════ 걸러 보기 (4차 지시 ④) ══════
   맨 아래 딱지 안내는 설명만 하고 아무것도 못 했다. 목록 위에 «누르면 걸러지는» 딱지를 둔다.
   ★ 번호는 «걸러도 그대로»다 — 걸러진 목록에서 다시 1,2,3 을 매기면 같은 사람이
     볼 때마다 다른 번호가 되어, 번호로 서로 부를 수 없다. */
function visibleRows(group) {
  let all = rowsOf(group).map((r, i) => Object.assign({ _no: i + 1 }, r));
  /* 이름으로 찾기 — 업체가 수백 개라 찾을 길이 없으면 «회사별로 고르기»를 할 수 없다.
     찾는 글자는 걸러 보기 딱지와 «함께» 걸린다(둘 중 하나만 걸리면 안 된다). */
  const q = String(App.q || '').trim();
  if (q && group === 'partner') {
    const want = q.toLowerCase();
    all = all.filter(r => String(r.name || '').toLowerCase().indexOf(want) >= 0);
  }
  const f = App.filter;
  if (!f) return all;
  if (f === 'kept') return all.filter(r => r.kept);
  /* 자문사 — 사람이 표시한 값으로 걸러 본다 */
  if (f.indexOf('posted:') === 0) {
    const want = f.slice(7) === 'none' ? '' : f.slice(7);
    return all.filter(r => r.posted === want);
  }
  /* 「손댈 것」은 카드의 빨간 점과 «같은 판단»이라야 한다 — 딱지에 3 이라 적혀 있는데
     눌러 보니 5줄이 나오면 어느 쪽이 맞는지 알 수 없다. */
  if (f === 'todo') return all.filter(needsAttentionRow);
  if (f.indexOf('own:') === 0) {
    const kind = f.slice(4);
    if (kind === 'nobase') return all.filter(r => r.status === 'noBase');
    return all.filter(r => !r.kept && r.roster && r.roster.kind === kind);
  }
  return all.filter(r => r.status === f);
}

/* 걸러 보기 딱지 줄 — «있는 것만» 내놓는다. 0건인 딱지를 늘어놓으면
   무엇을 눌러야 할지가 흐려진다. */
function chipsHtml() {
  const s = statOf(App.group);
  const all = rowsOf(App.group);
  const defs = [{ k: '', label: '전체', n: all.length }];
  if (s.hot) defs.push({ k: 'todo', label: '손댈 것', n: s.hot });
  Object.keys(s.own).forEach(k => {
    defs.push({ k: 'own:' + (k === 'nobase' ? 'nobase' : k), label: OWN_LABEL[k] || k, n: s.own[k] });
  });
  if (s.kept) defs.push({ k: 'kept', label: '남김', n: s.kept });
  /* 자문사 — 「올림/안 올림/표시 안 함」으로 걸러 본다. 대조 딱지는 아예 없다(못 한다). */
  if (App.group === 'partner') {
    [['yes', '올림'], ['no', '안 올림'], ['none', '표시 안 함']].forEach(([v, label]) => {
      const want = v === 'none' ? '' : v;
      const n = all.filter(r => r.posted === want).length;
      if (n) defs.push({ k: 'posted:' + v, label: label, n: n });
    });
  }
  if (App.check && App.group !== 'partner') {
    ['pending', 'toAdd', 'toRemove', 'liveOnly', 'done', 'same'].forEach(st => {
      const n = all.filter(r => r.status === st).length;
      if (n) defs.push({ k: st, label: STATUS_TEXT[st], n: n });
    });
  }
  return '<div class="chips">' + defs.map(d =>
    '<button class="chip' + (App.filter === d.k ? ' on' : '') + '"'
    + ' onclick="App.filt(\'' + esc(d.k) + '\')">' + esc(d.label)
    + '<span class="c">' + d.n + '</span></button>').join('')
    + (App.group === 'partner'
        ? '<span class="sub">홈페이지는 로고 «그림»이라 대조를 못 합니다 — 올림 표시는 사람이 합니다</span>'
        : (App.check ? '' : '<span class="sub">확인을 누르면 대조 딱지로도 걸러집니다</span>'))
    + '</div>';
}

/* ★ 목록에는 «번호»를 붙인다(2차 설계 ①). 번호는 사장님이 화면에서 세는 용도다 —
   자료에도, 붙여넣을 글자에도 들어가지 않는다. 번호를 글자에 섞으면 홈페이지에 숫자가 찍힌다. */
/* 목록 머리에 적는 건수. 찾기 칸에 글자를 칠 때 이 조각만 갈아 끼운다. */
function listCountHtml() {
  const all = rowsOf(App.group), rows = visibleRows(App.group);
  if (App.group === 'members') {
    // 명부상 퇴사가 몇 명인지 — 「남김」으로 둔 사람도 명부상 퇴사자다
    const left = all.filter(r => r.roster && r.roster.kind === 'left').length;
    return '구성원 <b>' + all.length + '명</b>' + (left ? ' · <b class="hot">퇴사 ' + left + '</b>' : '')
      + (App.filter ? ' <span class="sub">· 걸러서 ' + rows.length + '건</span>' : '');
  }
  if (App.group === 'work') {
    return '관리 중인 쪽 <b>' + all.length + '개</b>'
      + (App.filter ? ' <span class="sub">· 걸러서 ' + rows.length + '건</span>' : '');
  }
  if (App.group === 'partner') {
    return '홈페이지에 <b>' + postedNames().length + '개사</b>'
      + ' <span class="sub">· 업체관리 ' + all.length + '개사에서 고름</span>'
      + (App.filter || App.q ? ' <span class="sub">· 걸러서 ' + rows.length + '건</span>' : '');
  }
  return '';
}

function listHtml() {
  let h = '<div class="list">';
  h += '<div class="lh"><span id="listCount">' + listCountHtml() + '</span>'
    + '<span style="flex:1"></span>'
    + (App.group === 'members' ? '<button class="btn sm" onclick="addMember()">＋ 새 구성원</button>' : '')
    + (App.group === 'work' ? '<button class="btn sm" onclick="addPage()">＋ 쪽 추가</button>' : '')
    /* ★ 자문사는 여기서 회사를 «만들지 않는다». 이름·업종·거래 여부는 푸른ERP 업체관리에서
       고친다 — 두 곳에서 만들 수 있게 하면 어느 쪽이 진짜인지 알 수 없게 된다. */
    + (App.group === 'partner'
        ? '<a class="btn sm" style="text-decoration:none" href="pu-erp.html" target="_blank"'
          + ' rel="noopener">업체관리 열기</a>' : '')
    + '</div>';
  /* 찾기 칸 — 업체가 수백 개다. 찾을 길이 없으면 «회사별로 고르기»가 안 된다. */
  if (App.group === 'partner') {
    h += '<div class="chips"><input class="find" placeholder="회사 이름으로 찾기"'
      + ' value="' + esc(App.q) + '" oninput="App.find(this.value)">'
      + (App.q ? '<button class="chip" onclick="App.find(\'\')">찾기 지우기</button>' : '') + '</div>';
  }
  h += chipsHtml();
  h += '<div class="sc" id="rowsBox">' + rowsHtml() + '</div></div>';
  return h;
}

/* 줄 목록만. 찾기 칸에 글자를 칠 때 이 조각만 갈아 끼운다(커서가 튀지 않게). */
function rowsHtml() {
  const all = rowsOf(App.group);
  const rows = visibleRows(App.group);
  let h = '';
  if (!all.length) {
    return '<div class="empty">' + (App.group === 'partner'
      ? (App.companiesErr ? '업체관리를 읽지 못했습니다 — 왼쪽 「할 일」의 안내를 보십시오.'
                          : '푸른ERP 업체관리에 업체가 없습니다.')
      : '아직 자료가 없습니다.') + '</div>';
  }
  if (!rows.length) {
    return '<div class="empty">' + (App.q ? '찾는 이름이 없습니다.' : '이 딱지에 해당하는 줄이 없습니다.')
      + '</div>';
  }
  h += rows.map(function (r, i) {
    /* ★ 설명·사유를 «한 줄»에 이어 붙인다. 줄을 늘리면 사유가 있는 줄만 키가 커져
       62px 고정이 뜻을 잃는다(그게 3차 지시가 고치라던 「줄이 밀린다」이다).
       「남김」 사유는 왜 퇴사 경고가 없는지 알려 주는 것이라 반드시 실린다. */
    const line = [r.desc, r.kept ? (r.keptWhy || '(사유 없음)') : '', r.reason]
      .filter(Boolean).join(' · ');
    return '<div class="r ' + (r.key === App.pick ? 'on' : '') + '" onclick="App.select(\'' + esc(r.key) + '\')">'
      + '<span class="num">' + (r._no || (i + 1)) + '</span>'
      + '<div class="who"><div class="nm">' + esc(r.name) + '</div>'
      + '<div class="po" title="' + esc(line) + '">' + esc(line) + '</div></div>'
      /* 딱지 둘 — 위가 명부 딱지(늘 붙는다), 아래가 대조 딱지(확인을 누를 때만 새로 붙는다).
         ★ 자문사 줄은 대조 딱지 자리에 «사람이 표시한 값»이 온다. 「확인 전」이라고 적으면
           언젠가 대조가 될 것처럼 들린다 — 그 갈래는 대조를 «못 한다». */
      + '<span class="tags">' + rosterPillHtml(r)
      + (r.noStatusPill ? postedPillHtml(r)
         : '<span class="pill ' + (r.status || 'none') + '">'
           + esc(r.status ? (STATUS_TEXT[r.status] || r.status) : '확인 전') + '</span>')
      + '</span></div>';
  }).join('');
  return h;
}

function editHtml() {
  const d = App.draft;
  if (!d) {
    const st = (App.check && App.check.members) || {};
    const s = st[App.pick];
    if (s && s.status === 'liveOnly') {
      return '<div class="edit"><div class="esc"><div class="bar warn"><b>홈페이지에만 있는 글입니다</b><br>'
        + '통합시스템에는 이 사람 자료가 없습니다. 홈페이지 글 번호는 <b>' + esc(App.pick) + '</b> 입니다.<br>'
        + '홈페이지에서 지우거나(비공개 권장), 통합시스템에 <b>＋ 새 구성원</b>으로 추가하고 '
        + '<b>홈페이지 글 번호</b> 칸에 <b>' + esc(App.pick) + '</b> 을(를) 적어 주십시오 — '
        + '글 번호를 적으면 다음 확인부터 이 글과 짝지어져 이 줄은 사라집니다.'
        + '</div></div></div>';
    }
    return '<div class="edit"><div class="esc"><div class="empty">왼쪽 목록에서 항목을 고르십시오.</div></div></div>';
  }
  if (d.kind === 'member') return memberEdit(d);
  if (d.kind === 'partner') return partnerEdit(d);
  return pageEdit(d);
}

/* ══════ 자문사 편집칸 ══════
   다른 갈래와 «같은 틀»이다: 머리 고정 → 가운데 구름 → 발 고정.
   다만 고칠 «우리 글»이 없다 — 회사 자료는 업체관리 것이고, 여기서 더하는 것은
   「홈페이지에 올렸는지」와 그 사유뿐이다. */
function partnerEdit(d) {
  const c = d.company || {};
  const closed = String(c.status || '') === 'closed';
  const mk = partnerMark(d.key) || {};
  let h = '<div class="edit">';
  h += '<div class="ehd">';
  h += '<div class="band ask"><b>홈페이지 자문사현황은 «로고 그림»입니다</b> — 회사명이 글자로 없어 '
    + '통합시스템이 <b>대조를 못 합니다</b>.<br><span class="sm">그래서 올렸는지는 «사람이» 표시합니다. '
    + '못 하는 것을 「같음」으로 뭉개지 않습니다 — 표시해 두면 나중에 무엇을 올렸는지 알 수 있습니다.</span></div>';
  if (d.posted === 'yes' && closed) {
    h += '<div class="band rm"><b>업체관리에서 거래가 끝난 업체입니다</b>'
      + (c.closedDate ? ' (' + esc(c.closedDate) + ')' : '')
      + ' — 홈페이지에는 <b>올림</b>으로 표시돼 있습니다.<br>'
      + '<span class="sm">내릴지는 사람이 판단합니다 — 자문이 끝난 뒤에도 실적으로 남겨 두는 곳이 있습니다. '
      + '알리기만 하고 자동으로 고치지 않습니다.</span></div>';
  }
  h += '</div><div class="esc">';
  /* 회사 자료는 «보여주기만» 한다. 고칠 수 있게 두면 두 곳에 서로 다른 이름이 남는다. */
  h += '<div class="fld"><label>회사 (푸른ERP 업체관리 자료 — 여기서는 고칠 수 없습니다)</label>'
    + '<div class="rows"><div class="l"><span class="t"><b>' + esc(c.name || '') + '</b></span></div>'
    + '<div class="l"><span class="t">업체 종류 ' + esc(c.typeCode || '(없음)')
    + ' · 상태 ' + esc(closed ? ('거래 종료' + (c.closedDate ? ' ' + c.closedDate : '')) : (c.status || ''))
    + (c.ceo ? ' · 대표 ' + esc(c.ceo) : '') + '</span></div>'
    + (c.industry ? '<div class="l"><span class="t">업종 ' + esc(c.industry) + '</span></div>' : '')
    + '</div></div>';

  h += '<div class="fld"><label>홈페이지에 올렸습니까? — 사람이 표시합니다 (그림이라 기계가 못 봅니다)</label>'
    + '<div class="seg">'
    + '<button class="' + (d.posted === 'yes' ? 'on' : '') + '" onclick="markPosted(true)">올림</button>'
    + '<button class="' + (d.posted === 'no' ? 'on' : '') + '" onclick="markPosted(false)">안 올림</button>'
    + '<button class="' + (d.posted === '' ? 'on' : '') + '" onclick="clearPosted()">표시 안 함</button>'
    + '</div>'
    + '<div class="sub" style="margin-top:5px">'
    + (mk.by || mk.at ? '표시: ' + esc(mk.by || '(누구인지 모름)') + ' · ' + esc(mk.at || '(날짜 모름)')
                      : '아직 아무도 표시하지 않았습니다') + '</div></div>';

  h += '<div class="fld"><label>메모 (왜 올렸는지·왜 안 올렸는지) — 단추를 다시 누르면 함께 저장됩니다</label>'
    + '<textarea rows="2" oninput="fieldEdit(\'why\',this.value)">' + esc(d.why) + '</textarea></div>';

  h += '<div class="guide"><b>자문사현황을 다루는 방식</b><ol>'
    + '<li>목록은 <b>푸른ERP 업체관리</b>에서 옵니다 — 여기서 회사를 새로 만들지 않습니다</li>'
    + '<li>어느 업체를 올릴지는 <b>회사별로 사람이</b> 고릅니다 (업체 종류로 자동으로 고르지 않습니다)</li>'
    + '<li>홈페이지는 로고 <b>그림</b>이라 대조를 못 합니다 — <b>올림/안 올림</b>만 표시해 둡니다</li>'
    + '<li>붙여넣을 내용은 <b>회사명 목록</b>까지 만들어 드립니다. 로고 그림은 사람이 올립니다</li>'
    + '</ol></div>';
  h += '</div>';

  h += '<div class="eft">'
    + '<button class="btn pri" onclick="copyPostedNames()">회사명 목록 복사 ('
    + postedNames().length + '개사)</button>'
    + '<button class="btn" onclick="savePartnerWhy()">메모 저장</button>'
    + '<span id="dirtyMark" style="color:var(--bad);font-size:12px;font-weight:700">'
    + (App.dirty ? '● 저장 안 됨' : '') + '</span>'
    + '<span style="flex:1"></span>'
    + '<a class="btn" style="text-decoration:none" href="' + esc(PuHomeExport.ORIGIN)
    + '" target="_blank" rel="noopener">홈페이지 열기</a>'
    + '<span class="sub">' + (mk.updatedAt ? '마지막 표시: ' + esc(stamp(mk.updatedAt)) : '표시 기록 없음')
    + '</span></div>';
  return h + '</div>';
}

/* 올린 회사 이름만 줄줄이 — 붙여넣을 내용은 여기까지다. 로고 그림은 사람이 올린다. */
function copyPostedNames() {
  const names = postedNames();
  if (!names.length) {
    say('올림으로 표시한 회사가 없습니다',
      '먼저 회사를 골라 「올림」으로 표시해 주십시오. 표시한 회사 이름만 목록으로 만들어 드립니다.');
    return;
  }
  copyText(names.join('\n'));
}
window.copyPostedNames = copyPostedNames;

/* 편집칸 머리 띠 (3차 설계 §3) — 명부만 보면 아는 것을 «확인 전에도» 알린다.
   ★ 명부 딱지는 «홈페이지에 올라가 있는지»를 모른다. 그건 대조 딱지가 할 말이다.
     확인 전에 「아직 올라가 있습니다」라고 단정하면 두 딱지를 섞는 것이 된다 —
     그래서 대조 결과(App.check)가 있을 때만 그 말을 한다.
   ★ 내리는 방법은 «삭제가 아니라 비공개»다. 잘못 내렸어도 되살릴 수 있어야 한다. */
function memberBandHtml(d, rec) {
  const kept = keptOf(rec);
  const mark = rosterMarkOf(d.name || '');
  const st = ((App.check && App.check.members) || {})[d.key] || {};
  let h = '';

  if (kept) {
    h += '<div class="band keep"><b>홈페이지에 남기기로 함</b> — '
      + esc(kept.why || '(사유 없음)') + '<br>'
      + '<span class="sm">' + esc(kept.by || '(표시한 사람 모름)') + ' · '
      + esc(kept.at || '(날짜 모름)')
      + ' · 명부에 퇴사로 찍혀 있어도 「내릴 것(퇴사)」 딱지를 달지 않고 내용 대조만 합니다. '
      + '예외를 풀면 다음 「홈페이지 다시 확인」에서 퇴사 판정을 다시 받습니다.</span></div>';
  }

  if (mark && mark.kind === 'left' && !kept) {
    const 내려감 = st.status === 'done';
    h += '<div class="band ' + (내려감 ? 'keep' : 'rm') + '">'
      + '<b>푸른ERP 명부: ' + esc(mark.label) + '</b> · '
      + (내려감 ? '홈페이지에서도 <b>내려간 것으로 확인</b>됐습니다.'
         : (st.status ? '홈페이지에는 <b>아직 올라가 있습니다</b>.'
            : '홈페이지에 올라가 있는지는 <b>「홈페이지 다시 확인」</b>을 눌러야 알 수 있습니다.'))
      + '<br><span class="sm">'
      + (내려감 ? '더 하실 일은 없습니다. 이름이 다른 쪽에 남아 있으면 위 안내 띠로 알려 드립니다.'
         : '내리시려면 아래 <b>「홈페이지에서 이 사람 글 열기」</b> → '
           + '<b>삭제가 아니라 「비공개」</b>로 바꾸십시오. 잘못 내렸어도 되살릴 수 있습니다.')
      + '</span></div>';
  }

  if (mark && mark.kind !== 'left') {
    h += '<div class="band ask"><b>' + esc(mark.label) + '</b> — ' + esc(mark.detail) + '<br>'
      + '<span class="sm">명부는 푸른ERP 것이라 여기서는 읽기만 합니다. '
      + '지사장처럼 고용관계가 아닌 분은 아래 <b>「홈페이지에 남기기」</b>로 사유를 남겨 두십시오.</span></div>';
  }
  return h;
}

function memberEdit(d) {
  const rec = App.members[d.key] || {};
  const rep = riskReport(d.careers, App.lineFormat);
  /* 머리는 고정, 가운데(.esc)만 구르고, 발(.eft)의 단추는 늘 같은 자리에 있다 */
  let h = '<div class="edit">';
  h += '<div class="ehd">' + memberBandHtml(d, rec) + '</div>';
  h += '<div class="esc">';
  h += '<div class="fld"><label>이름</label>'
    + '<input value="' + esc(d.name) + '" oninput="fieldEdit(\'name\',this.value)"></div>';
  h += '<div class="two"><div class="fld"><label>직책1</label>'
    + '<input value="' + esc(d.position1) + '" oninput="fieldEdit(\'position1\',this.value)"></div>'
    + '<div class="fld"><label>직책2</label>'
    + '<input value="' + esc(d.position2) + '" oninput="fieldEdit(\'position2\',this.value)"></div>'
    + '<div class="fld" style="flex:0 0 130px"><label>홈페이지 글 번호</label>'
    + '<input value="' + esc(d.srl) + '" oninput="fieldEdit(\'srl\',this.value)"></div></div>';
  h += '<div class="fld"><label>메인 설명 (홈페이지 공개 화면에 안 나와 읽어올 수 없습니다 — 편집 화면을 보고 채우십시오)</label>'
    + '<textarea rows="3" oninput="fieldEdit(\'intro\',this.value)">' + esc(d.intro) + '</textarea></div>';

  h += '<div class="fld"><label>경력사항 — ' + d.careers.length + '줄</label>'
    + '<div class="car" id="careerBox">'
    + d.careers.map((line, i) =>
        '<div class="l"><span class="no">' + (i + 1) + '</span>'
        + '<input value="' + esc(line) + '" oninput="careerEdit(' + i + ',this.value)">'
        + '<button class="x" title="위로" onclick="careerMove(' + i + ',-1)">▲</button>'
        + '<button class="x" title="아래로" onclick="careerMove(' + i + ',1)">▼</button>'
        + '<button class="x" title="줄 삭제" onclick="careerDel(' + i + ')">✕</button></div>').join('')
    + '<div class="add" onclick="careerAdd()">＋ 줄 추가</div></div></div>';

  if (rep.broken.length) {
    h += '<div class="bar bad"><b>⚠ 「감싸기」와 겹치는 줄이 ' + rep.broken.length + '줄 있습니다</b> — '
      + '이 상태로 내보내면 짝이 안 맞는 HTML 이 되어 <b>그 뒤 화면 구조가 통째로 깨질 수</b> 있습니다. '
      + '줄에서 &lt;div&gt; 를 지우거나 줄 모양을 「줄바꿈만」으로 바꾸십시오.</div>';
  }
  if (rep.soft.length) {
    h += '<div class="bar warn"><b>꺾쇠가 든 줄이 ' + rep.soft.length + '줄 있습니다</b> — '
      + '이 줄은 홈페이지에서 안 보일 수 있습니다. 일부러 쓴 표기일 수 있어 지우지 않습니다.</div>';
  }

  /* ★ 글 번호가 남과 겹치면 편집 주소가 남의 글이다 — 붙여넣기 단추부터 잠근다 */
  const clash = srlConflict(d.key, d.srl);
  if (clash.length) {
    h += '<div class="bar bad"><b>홈페이지 글 번호가 ' + esc(clash.join(', ')) + ' 님과 겹칩니다</b> — '
      + '이대로 붙여넣으면 그분 경력이 이 사람 것으로 덮입니다. '
      + '어느 쪽 글 번호가 잘못 적혔는지 고칠 때까지 붙여넣기를 막아 둡니다.</div>';
  }
  h += '</div>';   // .esc 끝 — 여기까지가 구르는 칸이다

  /* 「홈페이지에 남기기」 예외가 있으면 «푸는» 단추를, 없으면 «남기는» 단추를 준다.
     사유와 표시한 사람은 위 머리 띠(memberBandHtml)가 늘 보여준다 —
     숨기면 명부상 퇴사자인데 왜 「내릴 것」 경고가 없는지 알 길이 없다. */
  const kept = keptOf(rec);
  h += '<div class="eft">'
    + '<button class="btn pri" onclick="openPaste()"' + (clash.length ? ' disabled' : '')
    + '>붙여넣을 내용 복사</button>'
    + '<button class="btn" onclick="saveDraft()">저장</button>'
    + '<button class="btn" onclick="openPull()">경력관리에서 당겨오기</button>'
    + '<button class="btn" onclick="openHistory()">되돌리기</button>'
    + (kept ? '<button class="btn keep" onclick="keepOnSiteClear()">남기기 예외 풀기</button>'
            : '<button class="btn keep" onclick="keepOnSiteAsk()">홈페이지에 남기기</button>')
    + '<span id="dirtyMark" style="color:var(--bad);font-size:12px;font-weight:700">' + (App.dirty ? '● 저장 안 됨' : '') + '</span>'
    + '<span style="flex:1"></span>'
    + (d.srl ? '<a class="btn" style="text-decoration:none" href="'
               + esc(PuHomeExport.editUrl('member', d.srl))
               + '" target="_blank" rel="noopener">홈페이지에서 이 사람 글 열기</a>' : '')
    + '<span class="sub">' + (rec.updatedAt ? '마지막 수정: ' + esc(stamp(rec.updatedAt)) + ' · ' + esc(rec.updatedBy || '') : '수정 기록 없음') + '</span>'
    + '</div>';
  return h + '</div>';
}

/* 쪽에서 «왜» 붙여넣을 내용을 안 주는지. 덧창과 편집 화면이 같은 말을 쓴다 —
   두 곳에 따로 쓰면 한쪽만 고쳐져 서로 다른 말을 하게 된다. */
function pagePasteWhy() {
  return '<b>이 쪽의 글은 «대조용»으로만 씁니다.</b><br>'
    + '여기 보이는 글자는 홈페이지에서 태그를 걷고 줄을 뭉쳐 만든 것입니다. '
    + '이 글자를 홈페이지에 붙여넣으면 <b>지도·표·구획·지사 탭</b>이 통째로 사라집니다. '
    + '(오시는길은 한 줄 275자, 노동사건대리는 한 줄 2412자가 됩니다.)<br>'
    + '게다가 그렇게 부서진 쪽을 다시 읽으면 같은 글자가 나와 딱지가 <b>「같음」</b>으로 떠서, '
    + '부서진 줄도 모르게 됩니다.<br>'
    + '쪽 내용은 <b>홈페이지 관리자 화면에서 직접</b> 고치십시오. '
    + '통합시스템은 <b>올라갔는지 안 올라갔는지 대조만</b> 해 드립니다.';
}

/* ★ 홈페이지와 «같은 순서·같은 줄»로 보여준다 (2차 설계 ②).
   줄 목록은 부품(PuHomeParse.parsePageLines)이 만들고, 화면은 그대로 늘어놓기만 한다.
   ★ 대조는 여전히 «뭉친 글자»(parsePageText)로 한다 — 줄 모양대로 견주면 공백 하나로
     「다름」이 쏟아진다. 대조 규칙은 이 함수와 아무 상관이 없다.
   ★ 줄 목록은 «홈페이지에서 읽어온 것»이라야 만들 수 있다. 우리가 저장해 둔 대조 기준
     글자는 이미 뭉쳐 있어 줄을 되살릴 수 없다. 못 읽었으면 빈 줄로 지어내지 않고
     그 사실을 그대로 말한다. */
function pageLinesHtml(mid) {
  const lines = (App.pageLines || {})[mid];
  if (!Array.isArray(lines)) {
    return '<div class="fld"><label>홈페이지 화면 그대로 보기</label>'
      + '<div class="bar info">아직 홈페이지를 읽지 않았습니다 — 위 <b>홈페이지 다시 확인</b>을 '
      + '누르면 홈페이지와 «같은 순서·같은 줄»로 보입니다.<br>'
      + '아래 «대조 기준 글자»는 줄을 뭉쳐 둔 것이라 줄 모양을 되살릴 수 없습니다. '
      + '없는 줄을 빈 줄로 지어내 보여 드리지 않습니다.</div></div>';
  }
  if (!lines.length) {
    return '<div class="fld"><label>홈페이지 화면 그대로 보기</label>'
      + '<div class="bar warn">홈페이지는 읽었지만 이 쪽에서 «본문 줄»을 찾지 못했습니다. '
      + '게시판형 쪽이거나 홈페이지 화면 구조가 바뀐 것일 수 있습니다 — 아래 대조 기준 글자는 그대로 씁니다.</div></div>';
  }
  /* 소제목·구획번호(01 02)를 눈에 띄게 한다.
     ★ 꾸밈은 «CSS 이름»으로만 붙인다. 줄 글자에 표시를 덧붙이면 그 표시가 자료로 흘러
       홈페이지에 찍힌다. 줄 글자는 읽어온 그대로만 보여준다. */
  const kindOf = t => {
    if (/^\d{1,2}$/.test(t)) return ' tag';                    // 01 02 같은 구획번호
    if (t.length <= 16 && !/\s/.test(t)) return ' head';        // 자문서비스·법률자문·천안본사
    return '';
  };
  return '<div class="fld"><label>홈페이지 화면 그대로 보기 — ' + lines.length + '줄 '
    + '· 번호는 «화면에서 세는 용도»입니다 (홈페이지로 가지 않습니다)</label>'
    + '<div class="rows">' + lines.map((l, i) =>
        '<div class="l' + kindOf(String(l)) + '"><span class="n">' + (i + 1) + '</span>'
        + '<span class="t">' + esc(l) + '</span></div>').join('')
    + '</div></div>';
}

/* 기준 글자를 «홈페이지에서 읽어온 줄»로 나눈다 (5차 지시).
   ★ 나누는 자리를 지어내지 않는다 — 홈페이지 줄 그대로다. 읽지 않았으면 나누지 않고
     왜 못 하는지 말한다. 「T.」·「F.」 같은 표시로 끊으면 쪽마다 엉뚱한 데서 끊긴다.
   ★ 글자 자체가 달라질 수 있다(홈페이지 글로 채워지므로). 지금 글자와 «뜻이 다를 때만»
     물어본다 — 같은 글을 줄만 나누는 것은 물어볼 일이 아니다.
   ★ 초안만 고친다. 「대조 기준 저장」을 눌러야 자료에 남는다. */
async function splitByLive() {
  const d = App.draft;
  if (!d || d.kind !== 'page') return;
  const lines = (App.pageLines || {})[d.key];
  if (!Array.isArray(lines) || !lines.length) {
    await say('아직 홈페이지를 읽지 않았습니다',
      '위 「홈페이지 다시 확인」을 누르면 홈페이지에서 읽어온 «줄 모양»으로 나눠 드립니다. '
      + '없는 줄을 지어내 나누지는 않습니다 — 엉뚱한 데서 끊으면 확인이 더 어려워집니다.');
    return;
  }
  const next = lines.join('\n');
  const same = PuHomeParse.tidy(next) === PuHomeParse.tidy(d.text || '');
  if (!same && String(d.text || '').trim()) {
    const ok = await askYes('지금 기준 글자와 홈페이지 글이 다릅니다',
      '홈페이지에서 읽어온 줄로 채우면 지금 기준 글자는 «홈페이지 글»로 바뀝니다. '
      + '줄만 나누는 것이 아니라 내용도 홈페이지 것이 됩니다.\n'
      + '(「대조 기준 저장」을 눌러야 자료에 남고, 「되돌리기」로 되살릴 수 있습니다.)',
      '홈페이지 글로 채우기');
    if (!ok) return;
  }
  d.text = next;
  App.dirty = true;
  App.render();
  toast(lines.length + '줄로 나눴습니다. 확인하신 뒤 「대조 기준 저장」을 누르십시오.'
    + (same ? '' : ' 내용도 홈페이지 글로 바뀌었습니다.'));
}
window.splitByLive = splitByLive;

function pageEdit(d) {
  const rec = App.pages[d.key] || {};
  const url = PuHomeExport.editUrl('page', d.key);
  /* 쪽 갈래도 구성원과 «같은 틀»이다 — 머리 고정, 가운데만 구름, 발 고정.
     갈래를 옮겨도 단추가 같은 자리에 있어 틀이 안 흔들린다. */
  let h = '<div class="edit">';
  h += '<div class="ehd"><div class="band ask">' + pagePasteWhy() + '</div></div>';
  h += '<div class="esc">';
  h += pageLinesHtml(d.key);
  /* ★ 편집칸은 «읽기 전용으로 만들지 않았다». 이 글자는 대조 기준값이라, 홈페이지를 직접
     고친 뒤 기준값도 맞춰 주지 않으면 딱지가 영영 「안 올라감」에 묶인다. 고칠 길을 없애면
     그 묶인 상태를 풀 방법이 사라진다. 대신 «홈페이지로 가지 않는다»고 칸 이름에 못 박는다. */
  /* ★ 5차 지시 — 「한 줄로 이어져 있으면 확인이 어렵고 수정도 어렵다」.
     기준 글자는 홈페이지에서 태그를 걷고 줄을 뭉쳐 만든 것이라 한 줄 275자짜리 덩어리다.
     ★ 줄바꿈을 넣어도 «대조는 그대로»다 — 대조는 공백을 뭉쳐 견준다
       (PuHomeParse.tidy 가 \s+ 를 한 칸으로 바꾼 뒤 견준다. 우리 글자와 홈페이지 글자
       양쪽에 똑같이 걸린다). 그래서 읽기 좋게 나눠도 딱지가 「안 올라감」에 묶이지 않는다.
     ★ 나누는 자리는 «지어내지 않는다». 홈페이지에서 읽어온 줄 그대로만 쓴다 —
       엉뚱한 데서 끊으면 확인이 더 어려워진다. */
  const 줄있음 = Array.isArray((App.pageLines || {})[d.key]) && App.pageLines[d.key].length > 0;
  h += '<div class="fld"><label>' + esc(PAGE_LABEL[d.key] || d.key) + ' — 대조 기준 글자 (/' + esc(d.key) + ') '
    + '· 이 글자는 홈페이지로 «가지 않습니다». 대조 결과를 맞출 때만 고치십시오</label>'
    + '<div class="fldbar">'
    + '<button class="btn sm" onclick="splitByLive()"' + (줄있음 ? '' : ' disabled')
    + ' title="' + (줄있음 ? '홈페이지에서 읽어온 줄 그대로 나눕니다'
                          : '「홈페이지 다시 확인」을 먼저 눌러야 줄 모양을 알 수 있습니다')
    + '">홈페이지 줄 모양으로 나누기'
    + (줄있음 ? ' (' + App.pageLines[d.key].length + '줄)' : '') + '</button>'
    + '<span class="sub">줄바꿈은 <b>대조에 영향을 주지 않습니다</b> — 대조는 공백을 뭉쳐 견줍니다.</span>'
    + '</div>'
    + '<textarea rows="10" oninput="fieldEdit(\'text\',this.value)">' + esc(d.text) + '</textarea></div>';
  h += '<div class="guide"><b>이 쪽을 고치는 순서</b><ol>'
    + '<li>위 <b>홈페이지에서 이 쪽 열기</b> → 관리자 화면에서 직접 고치고 저장</li>'
    + '<li>통합시스템으로 돌아와 <b>홈페이지 다시 확인</b> → 딱지가 「안 올라감」으로 바뀝니다</li>'
    + '<li>바꾼 내용을 그대로 두려면, 위 <b>대조 기준 글자</b>를 홈페이지와 맞춘 뒤 <b>대조 기준 저장</b> — '
    + '<b>대조 기준 저장만으로는 딱지가 바뀌지 않습니다.</b> 그 뒤 <b>홈페이지 다시 확인</b>을 '
    + '한 번 더 눌러야 딱지가 「같음」으로 바뀝니다</li>'
    + '</ol></div>';

  /* 「목록에서 분리」 — ★ 홈페이지 쪽을 지우는 것이 아니라고 화면에 분명히 적는다.
     사장님이 「분리」를 «홈페이지에서 없애기»로 읽으면 지워진 줄 알고 확인을 안 하게 된다. */
  const 분리가능 = canDetachPage(d.key);
  if (분리가능) {
    h += '<div class="guide"><b>이 쪽을 통합시스템에서 그만 관리하려면</b><br>'
      + '<b>「목록에서 분리」는 홈페이지 쪽을 지우지 않습니다.</b> '
      + '통합시스템이 이 쪽을 더 이상 대조하지 않는다는 뜻일 뿐입니다. '
      + '홈페이지에서 실제로 없애려면 홈페이지 관리자 화면에서 지우거나 메뉴에서 빼야 합니다 — '
      + '그건 사람이 판단할 일입니다.</div>';
  }
  h += '</div>';   // .esc 끝

  h += '<div class="eft">'
    + '<button class="btn" onclick="saveDraft()">대조 기준 저장</button>'
    + '<button class="btn" onclick="openHistory()">되돌리기</button>'
    + (분리가능 ? '<button class="btn" onclick="detachPage(\'' + esc(d.key) + '\')">목록에서 분리</button>' : '')
    + '<span id="dirtyMark" style="color:var(--bad);font-size:12px;font-weight:700">' + (App.dirty ? '● 저장 안 됨' : '') + '</span>'
    + '<span style="flex:1"></span>'
    + (url ? '<a class="btn pri" style="text-decoration:none" href="' + esc(url) + '" target="_blank" rel="noopener">'
             + '홈페이지에서 이 쪽 열기</a>' : '')
    + '<span class="sub">' + (rec.updatedAt ? '마지막 수정: ' + esc(stamp(rec.updatedAt)) + ' · ' + esc(rec.updatedBy || '') : '수정 기록 없음') + '</span>'
    + '</div>';
  return h + '</div>';
}

/* 딱지 안내 — 앱 맨 아래 한 줄. 명부 딱지와 대조 딱지가 «다른 것»임을 여기서 밝힌다. */
function legendHtml() {
  return '<div class="legend">'
    + '<span class="pill rm">퇴사 (명부)</span><span class="pill ask">명부에 없음</span>'
    + '<span class="pill keep">남김</span>'
    + '<span class="sub">← 명부만 보고 붙습니다 (화면을 열면 바로) &nbsp;·&nbsp;</span>'
    + ['same', 'pending', 'toAdd', 'toRemove', 'liveOnly', 'done']
        .map(s => '<span class="pill ' + s + '">' + esc(STATUS_TEXT[s]) + '</span>').join('')
    + '<span class="sub">← 대조 딱지는 「홈페이지 다시 확인」을 누를 때만 새로 붙습니다. 저절로 돌지 않습니다.</span>'
    /* ★ 늘 하는 말은 여기 «한 번만» 적는다. 위 안내 띠에 두면 할 일이 없는 날에도
       칸이 차 있어, 정작 할 일이 생겼을 때 눈에 안 걸린다. */
    + '<span style="flex:1"></span>'
    + '<span class="sub">홈페이지는 자동으로 바뀌지 않습니다 — 붙여넣기 한 번은 사람이 합니다. '
    + '구성원은 붙여넣을 내용을 만들어 드리고, 쪽은 대조만 합니다.</span>'
    + '</div>';
}
</script>
</body>
</html>
