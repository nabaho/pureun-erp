<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홈페이지 관리</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🌐</text></svg>">
<!--
  홈페이지 관리 — 회사 홈페이지(라이믹스)의 구성원 소개·주요업무·오시는길·인사말 글을
  통합시스템에서 관리하고, 홈페이지에 «붙여넣을 내용»을 만들어 준다.

  설계서: docs/superpowers/specs/2026-08-16-홈페이지-관리-design.md
  목업:   docs/mockups/homepage-manage.html

  ★ 이 화면은 홈페이지를 «직접 바꾸지 않는다». 마지막 붙여넣기 한 번은 사람이 한다.
    자동 전송은 관리자 비밀번호를 서버에 두어야 해서 설계에서 일부러 뺐다.
    "편해지니 자동으로 보내자"로 되돌리지 말 것.

  ★ 판단은 전부 js/pu-home-*.js 네 부품이 한다. 화면은 그 결과를 보여주기만 한다.
    같은 판단을 화면 안에서 다시 만들면 두 곳이 서로 다른 답을 낸다.
-->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="js/pu-version.js?v=3"></script>
<script src="js/pu-gate.js?v=1"></script>
<!-- 앱바가 관리자 전용 줄(경력관리·홈페이지 관리)을 가리려면 신원을 알아야 한다 — 앱바보다 먼저 -->
<script src="js/pu-whoami.js?v=1"></script>
<script src="js/pu-appbar.js?v=9"></script>
<!-- 이 앱은 머리줄에 스스로 이름을 그린다 — 부품이 표를 또 띄우면 겹친다.
     (급여데이터함·급여관리·취업규칙 관리와 같은 짜임) -->
<script>
(function(){ function go(){ if(window.PuWhoami){ PuWhoami.mount(false); return true; } return false; }
  if(!go()) document.addEventListener('DOMContentLoaded', go); })();
</script>
<script src="js/pu-home-parse.js?v=4"></script>
<script src="js/pu-home-career.js?v=2"></script>
<script src="js/pu-home-export.js?v=3"></script>
<script src="js/pu-home-diff.js?v=9"></script>
<script src="js/pu-home-fill.js?v=10"></script>
<!-- 새 홈페이지를 «자료로» 그리는 부품. 명령줄(scripts/build-people.js)도 같은 것을 쓴다 -->
<script src="js/pu-site-people.js?v=1"></script>
<script src="js/pu-site-page.js?v=1"></script>
<script src="js/pu-site-partner.js?v=3"></script>
<style>
/* ★ 색값·간격은 승인된 목업(docs/mockups/homepage-manage-v4.html)에서 그대로 가져왔다.
   새로 만들지 말 것 — 목업이 배치·색·글귀의 기준이다. */
:root{
  --navy:#1e40af; --navy-soft:#f8fafc;
  --ink:#1e293b; --sub:#64748b; --faint:#94a3b8;
  --line:#e2e8f0; --line-soft:#f8fafc;
  --paper:#f8fafc; --card:#FFF;
  --ok:#166534; --ok-bg:#f8fafc;
  --warn:#d97706; --warn-bg:#f8fafc;
  --bad:#dc2626; --bad-bg:#f8fafc;
  --info:#1e40af; --info-bg:#f8fafc;
}
*{box-sizing:border-box;margin:0}
html{height:100%}
/* ★ 페이지 자체는 굴리지 않는다 (3차 설계 §2 — 흔들림의 뿌리).
   오른쪽 편집칸 높이가 사람마다 달라(경력 7줄 / 18줄) 고르는 사람이 바뀔 때마다
   페이지 길이가 늘었다 줄었다 하며 스크롤이 튀었다. 틀을 창에 맞춰 붙박이로 두고,
   목록과 편집칸이 «각각 제 몸 안에서» 구른다. */
body{height:100%;overflow:hidden;display:flex;flex-direction:column;
  font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--paper);
  color:var(--ink);font-size:14px;line-height:1.7}
header{flex:none;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 18px}
header .brand{font-weight:800;font-size:16px;cursor:pointer}
header .who{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:10px}
header .out{background:#ffffff22;border:1px solid #ffffff66;color:#fff;border-radius:8px;padding:3px 10px;
  cursor:pointer;font-size:12px;font-family:inherit}
/* ★ 폭을 묶지 않는다 (4차 지시) — 1320px 로 묶어 두어 1900px 화면에서 양옆이 통째로
   남았다. 되찾은 폭으로 왼쪽에 기둥(대시보드+할 일)을 세우고 목록을 360→390px 로 넓혔다. */
main{flex:1;min-height:0;width:100%;padding:10px 12px;
  display:flex;flex-direction:column}
.gate{flex:none;padding:40px 18px;text-align:center;color:var(--sub)}
.btn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;
  font-weight:700;cursor:pointer;font-family:inherit;color:#1e293b;white-space:nowrap}
.btn:hover{background:#f8fafc}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
/* 켜 둔 단추 — 미리보기처럼 «지금 켜져 있나»를 알려야 하는 것에 쓴다 */
.btn.on{background:#bfdbfe;border-color:var(--navy);color:var(--navy);font-weight:800}
.btn.sm{padding:3px 9px;font-size:11.5px;border-radius:7px}
.btn.keep{border-color:#cbd5e1;background:var(--ok-bg);color:#166534}
/* 내리는 단추 — 되돌릴 수 있는 일이지만 «홈페이지가 바뀌는» 일이라 결을 달리한다 */
.btn.rm{border-color:#fecaca;background:var(--bad-bg);color:var(--bad);font-weight:800}
.sub{color:var(--sub);font-size:12px}

/* ── 앱 틀: 상단 고정 → 안내 띠 → 몸통(목록·편집칸) → 딱지 안내 ── */
.app{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 1px 2px rgba(31,34,51,.04)}

/* ── 상단 고정 (머리띠 + 갈래 탭) ── */
.top{position:sticky;top:0;z-index:5;flex:none;background:#fff;border-bottom:1px solid var(--line)}
.appbar{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.appbar .ttl{font-weight:800;font-size:16px;letter-spacing:-.2px}
.appbar .when{font-size:12.5px;color:var(--faint)}
.appbar .sp{flex:1}
/* 이 띠가 «무엇에 대한 것인지» 적는 이름표 (대표 결정 2026-09-06 ㉯).
   위는 화면 전체, 아래(.eft)는 고른 사람 하나 — 그 갈림이 안 보여 헷갈렸다. */
.tag{font-size:11px;font-weight:800;color:var(--navy);border:1px solid var(--navy);
  border-radius:5px;padding:1px 6px;white-space:nowrap;letter-spacing:-.2px}
/* 하는 일이 다른 단추 무리를 가르는 선 — 「읽기」와 「올리기」 사이에 선다.
   선이 있어야 실수로 올리는 일이 준다. */
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
/* 한 해에 몇 번 쓰는 단추를 접어 두는 「⋯」 (대표 결정 2026-09-06 ㉯).
   ⚠ 띄우는 칸은 «위로» 편다 — 아래 띠에 있어 아래로 펴면 화면 밖으로 나간다. */
.more{position:relative}
.more > summary{list-style:none;cursor:pointer}
.more > summary::-webkit-details-marker{display:none}
.more[open] > summary{background:var(--line-soft);border-color:var(--navy);color:var(--navy)}
.morebox{position:absolute;right:0;bottom:calc(100% + 6px);z-index:20;
  display:flex;flex-direction:column;gap:6px;padding:8px;white-space:nowrap;
  background:var(--card);border:1px solid var(--line);border-radius:9px;
  box-shadow:0 8px 24px rgba(15,23,42,.14)}
.appbar select{border:1px solid #cbd5e1;border-radius:8px;padding:4px 8px;font-size:12.5px;font-family:inherit}

/* ── 왼쪽 기둥: 대시보드 카드(위) + 할 일(아래) ──
   ★ 갈래를 «탭»에서 «카드»로 바꿨다 (4차 지시, 목업 v6b). 탭은 숫자 하나(항목 수)만
     보여 줘서, 확인을 안 눌렀는데도 손댈 것이 없는 것처럼 읽혔다.
   ★ 카드는 다섯 갈래가 «같은 규격»이다 — 이름 · 총수 · ③우리 자료 경고(바로 안다) ·
     ④대조 결과(확인 눌러야 안다) · 빨간 점. ③과 ④는 점선으로 갈라 둔다.
     뭉치면 「확인을 안 눌러 0건」과 「깨끗해서 0건」이 같은 모양이 된다.
   설계 근거: docs/mockups/homepage-dash-spec.html */
/* ★ 카드는 «한 줄»이다: 갈래 이름 · 숫자 · 상태 한 마디.
   두 줄에 딱지 넷을 붙였더니 「정보가 섞여 판단이 어렵다」는 지시를 받았다(5차).
   카드는 «어디에 할 일이 있나»만 답하고, 세부는 그 갈래를 누르면 목록 위 걸러 보기
   딱지에 그대로 있다. 다섯 장이 한눈에 들어오고 기둥이 굴지 않는다. */
.rail{width:276px;flex:none;min-height:0;border-right:1px solid var(--line);background:#f8fafc;
  display:flex;flex-direction:column}
.rail .rh{flex:none;padding:6px 12px;background:#fff;border-bottom:1px solid var(--line);
  font-size:11.5px;font-weight:800;color:var(--faint);letter-spacing:.2px}
.dash{flex:none;display:flex;flex-direction:column;gap:4px;padding:6px 8px;
  border-bottom:1px solid var(--line)}
.dcard{text-align:left;border:1px solid var(--line);border-radius:9px;background:#fff;
  padding:6px 10px;cursor:pointer;font-family:inherit;color:inherit;
  display:flex;align-items:center;gap:8px}
.dcard:hover{border-color:#cbd5e1}
.dcard.on{border-color:var(--navy);background:var(--navy-soft);box-shadow:inset 0 0 0 1px var(--navy)}
.dcard.off{opacity:.55;cursor:default;background:#f8fafc}
.dcard .t{font-size:13px;font-weight:700;color:#1e293b;white-space:nowrap}
.dcard.on .t{color:var(--navy);font-weight:800}
.dcard .n{margin-left:auto;font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap}
.dcard.on .n{color:var(--navy)}
.dcard .n em{font-size:11px;font-weight:700;color:var(--faint);font-style:normal;margin-left:1px}
/* 상태 한 마디 — 자리를 못 박아 두어 카드마다 딱지 왼쪽 끝이 나란하다 */
.dcard .st{flex:none;width:74px;text-align:right}
.mini{font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;white-space:nowrap;
  border:1px solid transparent;display:inline-block}
.mini.bad{background:var(--bad-bg);color:#991b1b;border-color:#fecaca}
.mini.ok{background:var(--ok-bg);color:#166534;border-color:#cbd5e1}
/* «아직 안 봤다» — 색을 쓰지 않는다. 이것을 초록(깨끗함)으로 두면 조용히 틀린다 */
.mini.none{background:#fff;color:var(--faint);border-color:var(--line)}
/* «할 수 없다»(자문사현황) — 점선으로 «못 하는 것»임을 밝힌다 */
.mini.dash{background:#fff;color:var(--faint);border:1px dashed #cbd5e1}

/* 할 일 — 안내 띠를 여기 모은다. 위에 쌓아 두면 몸통 높이를 최대 34% 까지 먹었다 */
.todo{flex:1;min-height:0;display:flex;flex-direction:column}
.todo .th{flex:none;display:flex;align-items:center;gap:7px;padding:7px 13px;background:#fff;
  border-bottom:1px solid var(--line);font-size:12.5px;font-weight:800}
.todo .th .c{background:var(--bad);color:#fff;border-radius:20px;padding:0 7px;font-size:11px}
.todo .th .c.zero{background:var(--line-soft);color:var(--sub);font-weight:800}
.todo .sc{flex:1;min-height:0;overflow-y:auto;padding:7px 8px 12px}
/* ★ 할 일 하나 = 한 줄 (5차 지시). 칸을 통째로 색칠하지 않고 «왼쪽 선»으로만 급함을
   표시한다 — 칸 전체가 색이면 넷만 떠도 알록달록해져 무엇이 급한지 알 수 없다.
   방법(어떻게 하면 되나)은 접어 둔다. 펼쳐 두면 칸이 글로 찬다. */
.job{border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:8px;background:#fff;
  padding:6px 9px;margin-bottom:5px}
.job.warn{border-left-color:var(--warn)}
.job.info{border-left-color:var(--info)}
.job .h{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;line-height:1.5}
.job .h .cnt{margin-left:auto;color:var(--bad);flex:none}
.job.warn .h .cnt{color:var(--warn)}
.job.info .h .cnt{color:var(--info)}
.job .who{font-size:12px;color:var(--sub);margin-top:1px;line-height:1.55;word-break:break-word}
.job .go{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
.job details{margin-top:4px}
.job summary{cursor:pointer;font-size:11.5px;color:var(--sub);font-weight:700}
.job details p{font-size:12px;color:#475569;margin-top:4px;line-height:1.7}

/* 걸러 보기 딱지 — 설명만 하던 딱지가 «누르면 걸러지는» 단추가 된다 */
.chips{flex:none;display:flex;gap:5px;flex-wrap:wrap;padding:6px 13px 7px;
  border-bottom:1px solid var(--line);background:#fff}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:2px 9px;font-size:11px;
  font-weight:800;color:var(--sub);cursor:pointer;font-family:inherit}
.chip:hover{border-color:#cbd5e1}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .c{opacity:.65;margin-left:3px}
/* 이름으로 찾기 — 업체가 수백 개라 찾을 길이 없으면 회사별로 고를 수 없다 */
.chips .find{flex:1;min-width:120px;border:1px solid #cbd5e1;border-radius:8px;padding:4px 9px;
  font-size:12.5px;font-family:inherit;color:var(--ink)}
.chips .find:focus{border-color:var(--navy);outline:none}

/* 자문사 표시 — 사람이 손으로 남긴 값이다.
   「표시 안 함」은 색을 쓰지 않는다(.pill.none): 아직 안 본 것이지 잘못된 것이 아니다. */
.pill.posted{background:var(--ok-bg);color:#166534;border:1px solid #cbd5e1}
.pill.unposted{background:var(--line-soft);color:#475569;border:1px solid var(--line)}
/* 세 갈래 중 하나를 고르는 단추줄 (올림·안 올림·표시 안 함) */
.seg{display:flex;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden;width:max-content}
.seg button{border:none;background:#fff;padding:6px 14px;font-size:12.5px;font-weight:700;
  font-family:inherit;color:var(--sub);cursor:pointer;border-right:1px solid #cbd5e1}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
.seg button:hover:not(.on){background:#f8fafc}
.bar{border-radius:10px;padding:9px 13px;font-size:13px;margin-bottom:9px;line-height:1.7}
.bar.bad{background:var(--bad-bg);border:1px solid #fecaca;color:#991b1b}
.bar.warn{background:var(--warn-bg);border:1px solid #fde68a;color:#854d0e}
.bar.ok{background:var(--ok-bg);border:1px solid #cbd5e1;color:#166534}
.bar.info{background:var(--info-bg);border:1px solid #bfdbfe;color:#1e40af}
.bar b{font-weight:800}

/* ── 몸통: 3단(기둥·목록·편집칸), 높이 붙박이 ── */
.body{flex:1;min-height:0;display:flex}
/* 실시간 미리보기 — 편집칸 오른쪽에 붙는다 (대표 결정 2026-09-02 ㉮).
   ★ 기본은 «접힘»이다 — 안 쓸 때 자리를 먹지 않아 지금 화면과 똑같다. */
.pane2{flex:1;min-width:0;min-height:0;display:flex}
.pane2 > .edit{flex:1;min-width:0;border-right:1px solid var(--line)}
.prev{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:#f8fafc}
.prev .ph{flex:none;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  padding:7px 11px;border-bottom:1px solid var(--line);background:#fff;font-size:12px}
.prev .ph .t{font-weight:800}
.prev .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.prev .seg button{border:0;background:#fff;color:var(--sub);font:inherit;font-size:11.5px;
  font-weight:800;padding:2px 9px;cursor:pointer}
.prev .seg button.on{background:var(--navy);color:#fff}
.prev .same{display:inline-flex;align-items:center;gap:4px;color:#166534;font-weight:800;font-size:11.5px}
.prev .same::before{content:'';width:7px;height:7px;border-radius:50%;background:#166534}
.prev iframe{flex:1;min-height:0;width:100%;border:0;background:#fff}
.prev .why{padding:16px;color:var(--faint);font-size:12.5px;line-height:1.7}
/* 화면이 좁으면 아래로 내려간다 — 좌우로 쪼개면 둘 다 못 읽는다 */
@media (max-width:1300px){ .pane2{flex-direction:column}
  .pane2 > .edit{border-right:0;border-bottom:1px solid var(--line)}
  .prev{min-height:300px} }

/* 목록 — 360 → 390px (대표 지시). 직책이 「…」로 잘리는 일이 줄어든다. */
.list{width:390px;flex:none;min-height:0;border-right:1px solid var(--line);background:#f8fafc;
  display:flex;flex-direction:column}
.list .lh{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;
  border-bottom:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--sub)}
.list .lh b{color:var(--ink)}
.list .lh .hot{color:var(--bad)}
/* 목록만 구른다 — 목록을 굴려도 편집칸은 가만히 있다 */
.list .sc{flex:1;min-height:0;overflow-y:auto}
/* 줄 높이를 못 박는다 — 딱지가 둘이어도 줄이 안 밀린다 */
.list .r{display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--line-soft);min-height:62px;cursor:pointer}
.list .r:hover{background:#fff}
.list .r.on{background:#fff;box-shadow:inset 3px 0 0 var(--navy)}
.list .who{min-width:0;flex:1}
.list .nm{font-weight:700;font-size:14px}
/* ★ 한 줄로 잘라 «…» 로 끝낸다. 여러 줄로 흐르게 두면 사유가 긴 줄만 키가 커져
   62px 고정이 뜻을 잃는다 — 긴 글 전문은 마우스를 올리면(title) 보이고,
   편집칸 머리 띠에는 늘 통째로 적혀 있다. */
.list .po{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 딱지 둘(명부 딱지 · 대조 딱지)을 위아래로 쌓는다 — 나란히 두면 이름을 밀어낸다 */
/* ★ 딱지 둘을 «나란히» 놓는다 (대표 지적 2026-09-02 「2줄을 1줄로」).
   세로로 쌓으면 줄 키가 커지고, 그만큼 설명 자리를 빼앗아 지사장 설명이 잘렸다. */
.tags{display:flex;align-items:center;gap:3px;flex:none;margin-left:auto}

/* 목록 번호 — 화면에서 세는 용도. 붙여넣을 글자에는 들어가지 않는다 */
.num{width:20px;flex:none;text-align:right;color:var(--faint);font-size:12px;font-weight:800;
  font-variant-numeric:tabular-nums;user-select:none}

/* ── 편집칸: 머리·발 고정, 가운데만 구른다 ── */
.edit{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff}
.ehd{flex:none;padding:12px 18px 0}
/* ★ 위 여백은 여기가 «아니라» 첫 아이가 갖는다 (대표 지적 2026-09-03
     「틀고정위에 화면이 보인다」).
   왜: position:sticky 의 top:0 은 스크롤판의 «안쪽 여백 아래»에 붙는다.
     그래서 위 여백 12px + 테두리 1px = 13px 띠가 안 덮이고, 굴리면 그 틈으로
     경력 줄이 붙은 칸 «위»에 비쳐 보였다(실측 13px).
   ⚠ 안쪽 여백을 늘리거나 붙은 칸에 여백을 더하는 것으로는 안 고쳐진다 — 재어 봤다.
     여백을 «스크롤판에서 빼내는» 것만 듣는다(13px → 1px, 그 1px 은 테두리 선이다). */
.esc{flex:1;min-height:0;overflow-y:auto;padding:0 18px 16px}
.esc > :first-child{margin-top:12px}
/* ★ 붙은 칸은 «밖»에 숨(margin)을 두지 않는다 — 0 이다.
   왜: sticky 는 자기 «테두리»가 top:0 에 붙는다. 밖에 2px 숨이 있으면 쉴 때는
     2px 아래에 있다가 붙을 때 2px 올라가고, 그 틈으로 경력 줄이 비쳐 지나간다
     (2026-09-03 실측: 굴리기 전 64px → 붙은 뒤 62px).
   숨은 .stick 의 padding-top 이 «안»에서 갖는다 — 그래야 붙은 뒤에도 덮는다.
   ⚠ 2px 로 되돌리지 말 것. 앞서 12px 여백으로 같은 일을 겪어 13px 틈이 났다. */
.esc > .stick{margin-top:0}
/* 경력이 길어도 「저장」·「복사」가 늘 같은 자리에 있다 */
.eft{flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 18px;
  border-top:1px solid var(--line);background:#f8fafc}

/* 편집칸 머리 띠 — 퇴사·남김·명부없음을 알린다 */
.band{border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:8px;line-height:1.7}
.band.rm{background:var(--warn-bg);border:1px solid #fde68a;color:#991b1b}
.band.keep{background:var(--ok-bg);border:1px solid #cbd5e1;color:#166534}
.band.ask{background:var(--info-bg);border:1px solid #bfdbfe;color:#1e40af}
.band.bad{background:var(--bad-bg);border:1px solid #fecaca;color:#991b1b}
.band b{font-weight:800}
.band .sm{color:var(--sub);font-size:12px}

/* 홈페이지와 같은 줄 모양으로 보여주는 칸 (보기 전용) */
.rows{border:1px solid #cbd5e1;border-radius:9px;background:#fff;overflow:hidden;font-size:13.5px}
.rows .l{display:flex;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line-soft)}
.rows .l:last-child{border-bottom:0}
/* 업무 «항목»의 머리 — 「01 법률자문」 (대표 결정 2026-09-06 ㉰).
   어디서 어디까지가 한 업무인지 보이게 한다. 줄 자체는 그대로 하나씩 고친다. */
.rows .grp{display:flex;gap:8px;align-items:baseline;padding:7px 10px 4px;
  background:var(--line-soft);border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.rows .grp:first-child{border-top:0}
.rows .gn{color:var(--navy);font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}
.rows .gt{font-weight:700;font-size:12.5px;color:var(--ink)}
.rows .l:hover{background:#f8fafc}
.rows .n{width:20px;flex:none;text-align:right;color:var(--faint);font-size:11.5px;font-weight:800;
  font-variant-numeric:tabular-nums}
.rows .t{flex:1;min-width:0;word-break:break-word}
/* ★ 줄마다 생김새를 달리한다 (5차 지시 ③ — 「줄 변화 없이 너무 일률적이다」).
   홈페이지에서 제목인 줄과 본문인 줄이 같은 모양이면 무엇을 고치는지 짚을 수 없다.
   ★ 꾸밈은 CSS 로만 한다 — 줄 «글자»에 표시를 덧붙이면 그 표시가 홈페이지로 흘러간다. */
.rows .l.head{background:#f8fafc}
.rows .l.head .t{font-weight:800;color:var(--navy);font-size:14px}
.rows .l.sec .t{font-weight:800;color:var(--warn);font-size:12px;letter-spacing:.4px}
.rows .l.tel .t{color:var(--sub);font-size:12.5px}
/* 옛 이름(tag) — 아직 이 이름으로 그리는 곳이 있으면 구획번호와 같게 보이게 둔다 */
/* 줄을 «그 자리에서» 고친다 — 칸처럼 보이지 않게 두다가, 손을 대면 칸이 된다.
   ★ 고친 줄은 눈에 띄어야 한다. 무엇을 홈페이지로 보내는지 모르고 누르면 안 된다. */
.rows input.t{border:0;background:transparent;font:inherit;color:inherit;padding:0;
  width:100%;border-bottom:1px dashed transparent}
.rows input.t:hover{border-bottom-color:var(--line)}
.rows input.t:focus{outline:0;border-bottom-color:var(--navy);background:#fff}
.rows .l.ch{background:var(--ok-bg);box-shadow:inset 3px 0 0 var(--ok)}
.rows .l.ch input.t{color:var(--ok);font-weight:700}
.rows .l.lock .t{color:var(--faint)}
.lockmk{font-size:11px;opacity:.7}
/* ── 좌우 두 칸 (대표 지시 2026-09-03 「듀얼화면 붙여라」) ──
   왼쪽 홈페이지 화면 · 오른쪽 고치는 칸. 한 화면에서 보며 고친다.
   ★ 왼쪽은 «틀(iframe)»이다 — 홈페이지 꾸밈이 이 화면으로 새지 않게.
   ⚠ 좁은 화면에서는 위아래로 쌓는다. 좌우로 두면 둘 다 못 읽는 너비가 된다. */
.dual{display:flex;gap:10px;align-items:stretch}
.dual.off{display:block}
.dual > .dl{flex:1 1 46%;min-width:0;border:1px solid var(--line);border-radius:9px;
  overflow:hidden;background:#fff}
.dual > .dl iframe{display:block;width:100%;height:100%;min-height:340px;border:0}
.dual > .dr{flex:1 1 54%;min-width:0;display:flex;flex-direction:column}
.dual > .dr .rows{flex:1;min-height:0}
@media (max-width:1100px){
  .dual{display:block}
  .dual > .dl{margin-bottom:9px}
  .dual > .dl iframe{min-height:260px}
}
/* 똑같은 글이 여럿일 때 «몇 번째»인지 (대표 지시 2026-09-03 「자물쇄 같이 실물」).
   ★ 자물쇠를 대신하는 딱지다 — 막는 것이 아니라 «어느 자리인지» 알려 준다.
   ★ 좁게 만든다: 줄마다 붙으므로 넓으면 글 칸을 그만큼 먹는다. */
.nth{flex:0 0 auto;font:800 10.5px/1.5 inherit;color:var(--warn);background:var(--warn-bg);
  border:1px solid var(--warn);border-radius:20px;padding:0 6px;white-space:nowrap;cursor:help}
.rows .l.dup .nth{opacity:1}
.pfixbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:6px}
/* 자문사 로고 고르기 — 그림이 주인공이라 칸을 작게, 손잡이는 그림 위에 얹는다 */
.logos{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
/* 로고를 «여러 장 한꺼번에» 끌어다 놓는 칸 (대표 지시 2026-09-06 「여러장 한번에」) */
/* ⚠ 색은 :root 의 것만 쓴다 — 팔레트 검사가 새 색값을 그 자리에서 막는다 */
.lgdrop{border:2px dashed var(--line);border-radius:9px;padding:16px 12px;text-align:center;
  color:var(--sub);background:var(--paper);font-size:12.5px;margin-top:8px}
.lgdrop b{color:var(--ink)}
.lgdrop.over{border-color:var(--navy);color:var(--navy)}
/* 로고 붙여넣기 — Ctrl+V 로 받는 칸과, «실제 배경 위» 미리보기 */
.lpaste{border:2px dashed var(--navy);border-radius:9px;background:#f8fafc;
  padding:13px;text-align:center;margin:9px 0 0;cursor:text}
.lpaste:focus{outline:2px solid var(--navy);outline-offset:1px}
.lpaste b{color:var(--ink)}
.lpaste .k{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:5px;
  padding:1px 6px;font-family:ui-monospace,monospace;font-weight:800;font-size:11.5px;margin:0 1px}
.lpaste .sub{display:block;margin-top:5px}
.lpick{border:1px solid var(--line);border-radius:9px;padding:9px;margin:9px 0 0;background:#fff}
.lpick-h{font-size:12px;color:var(--sub);margin-bottom:6px}
/* ★ 미리보기 바탕은 홈페이지의 «회색 칸»을 흉내 낸다 — 흰 네모가 생기는지 눈에 보인다.
   ⚠ 홈페이지가 쓰는 그 회색은 팔레트 밖 색이고, 팔레트 예외 목록은
     일부러 잠가 둔 것이다(tests/color-palette-apps 「예외를 늘리지 말 것」).
     ⚠ 그 색값을 «주석에도 적지 말 것» — 팔레트 검사는 주석을 걷지 않아 그대로 걸린다.
     여기서 지킬 것은 «정확한 색»이 아니라 「흰 네모가 눈에 보이나」이므로
     팔레트 안의 밝은 회색으로 충분하다 — 흰색이 아니기만 하면 된다. */
.lpick-bg{background:#fff;border:1px solid var(--line);border-radius:7px;padding:11px;
  display:flex;justify-content:center}
.lpick-card{background:#e2e8f0;border-radius:11px;width:154px;height:62px;
  display:flex;align-items:center;justify-content:center}
.lpick-card img{max-width:88%;max-height:78%;object-fit:contain}
.logos .lg{position:relative;width:120px;height:64px;border:1px solid var(--line);
  border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logos .lg img{max-width:100%;max-height:100%;object-fit:contain}
.logos .lgb{position:absolute;right:2px;bottom:2px;display:flex;gap:2px;opacity:0;transition:opacity .12s}
.logos .lg:hover .lgb{opacity:1}
.logos .lgb .x{border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer;
  font-size:11px;line-height:1;padding:3px 5px}
.logos .lgb .x[disabled]{opacity:.35;cursor:default}
.logos.dim .lg{opacity:.45}
.logos.dim .lg .lgb{opacity:1}
.legend2{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px;font-size:11.5px;color:var(--faint)}
.legend2 b{font-weight:800}
.legend2 .k-head{color:var(--navy)}
.legend2 .k-sec{color:var(--warn)}
.legend2 .k-tel{color:var(--sub)}
/* 접기 없이 한 줄만 알리는 안내(펼칠 이유가 없을 때) */
.note1.plain > div{line-height:1.65}

/* 딱지 — 배경·선을 한 톤 낮추고 «딱지만» 색을 남겼다.
   상태 없는 줄은 흰 딱지라 눈에 안 걸리고, 퇴사·남김·명부없음만 도드라진다. */
.pill{font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px;white-space:nowrap}
.pill.same{background:var(--line-soft);color:var(--sub)}
.pill.pending{background:var(--bad-bg);color:#991b1b;border:1px solid #fecaca}
.pill.toAdd{background:var(--info-bg);color:var(--info);border:1px solid #bfdbfe}
.pill.toRemove{background:var(--warn-bg);color:#991b1b;border:1px solid #fde68a}
.pill.liveOnly{background:var(--warn-bg);color:#991b1b;border:1px solid #fde68a}
.pill.done{background:var(--ok-bg);color:#166534;border:1px solid #cbd5e1}
.pill.unknown{background:var(--line-soft);color:var(--faint)}
/* 기준 없음 — «오류(빨강)» 가 아니라 «해야 할 일(파랑)» 로 보이게 toAdd 와 같은 색을 쓴다 */
.pill.noBase{background:var(--info-bg);color:var(--info);border:1px solid #bfdbfe}
/* 아직 대조를 안 눌렀다 — 색을 안 쓴다. 상태가 없는 줄이 눈에 걸리면 안 된다. */
.pill.none{background:#fff;color:var(--faint);border:1px solid var(--line)}
/* 「홈페이지에 남기기」 예외 표시 — 왜 퇴사 경고가 없는지 목록에서 바로 보이게 한다 */
.pill.keep{background:var(--ok-bg);color:#166534;border:1px solid #cbd5e1}
/* 명부 딱지 (3차 설계 §3) — 대조 딱지와 «다른 것»이다. 화면을 열 때 바로 붙는다. */
.pill.rm{background:var(--warn-bg);color:#991b1b;border:1px solid #fde68a}
.pill.ask{background:var(--info-bg);color:var(--info);border:1px solid #bfdbfe}
.pill.tail{margin-left:auto}

/* ★ 늘 뜨는 안내는 «한 줄 + 접기»다 (5차 지시). 쪽마다 네 줄짜리 띠를 매번 읽지 않는다.
   이유를 없애지는 않는다 — 언제든 펼쳐 볼 수 있다. */
.note1{border:1px solid #bfdbfe;background:var(--info-bg);color:#1e40af;border-radius:8px;
  padding:6px 11px;font-size:12.5px;margin-bottom:9px}
.note1 > summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;
  line-height:1.6}
.note1 > summary::-webkit-details-marker{display:none}
.note1 .more{margin-left:auto;flex:none;font-size:11.5px;font-weight:800;color:#1E40AF;
  white-space:nowrap;border:1px solid #bfdbfe;border-radius:6px;padding:0 6px;background:#fff}
.note1 .w{margin-top:7px;line-height:1.75}
.note1.rm{border-color:#fde68a;background:var(--warn-bg);color:#991b1b}
.note1.rm .more{color:#991b1b;border-color:#fde68a}
/* 접어 두는 설명 덩어리 (예: 「이 쪽을 고치는 순서」) */
.why1{border:1px solid var(--line);background:#f8fafc;border-radius:9px;padding:8px 11px;
  font-size:12.5px;margin-top:11px}
.why1 > summary{cursor:pointer;font-weight:800;color:#1e293b}
.why1 .w{margin-top:6px;line-height:1.8;color:#475569}
.why1 ol{margin:4px 0 0;padding-left:18px}

/* 칸 이름 아래 놓이는 작은 단추줄 (예: 「홈페이지 줄 모양으로 나누기」) */
.fldbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 5px}
.fld{margin-bottom:13px}
/* 빈 칸은 라벨을 «옆에» 둔다 — 라벨이 위에 따로 있으면 빈 칸 하나가 두 줄을 쓴다
   (대표 지적 2026-09-02 「한줄 안되나」). 글이 들어오면 .oneline 이 떨어져 위로 올라간다. */
.fld.oneline{display:flex;align-items:center;gap:9px}
.fld.oneline > label{margin-bottom:0;flex:0 0 auto;white-space:nowrap}
.fld.oneline > textarea{flex:1;min-width:0;resize:none}
.fld > label{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:800;color:var(--sub);margin-bottom:5px}
.fld > label .tip{font-weight:700;color:var(--faint)}
.fld input,.fld textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px 11px;
  font-size:14px;font-family:inherit;color:var(--ink);background:#fff}
.fld textarea{resize:vertical;line-height:1.7;font-size:13.5px}
.two{display:flex;gap:12px}
.two>div{flex:1;min-width:0}
/* ★ 좁은 자리에서는 «접힌다» (대표 지시 2026-09-03 「더 줄여줄수 없나」로 네 칸을
   한 줄에 놓으면서 함께 넣었다). 접히지 않으면 폰에서 「권형하」가 두 글자 너비가 된다.
   ⚠ 이 한 줄을 빼면 이름 칸이 짜부라진다 — 실측 375px 에서 두 줄·칸 128px 이 된다. */
@media (max-width:560px){
  .two{flex-wrap:wrap}
  .two > div{flex:1 1 calc(50% - 6px) !important}
}

/* ── 라벨을 칸 «안 왼쪽»에 (대표 지시 2026-09-03 「이부분 더 줄여줄수 없나」) ──
   라벨 줄을 없애 편집칸 위쪽이 165px → 100px 이 된다(재어 본 값).
   ★ placeholder 로 밀어넣지 «않는다» — 값이 들어오면 라벨이 사라져
     「직책2 가 무엇이었는지」를 알 수 없게 된다. 이름표는 값 옆에 남는다.
   ★ 칸 전체가 하나의 테두리다. 안의 input 은 테두리를 없애고, 눌렀을 때
     («focus-within») 겉테두리가 파래진다 — 어디에 쓰고 있는지 그대로 보인다. */
.inl{display:flex;align-items:center;border:1px solid #cbd5e1;border-radius:8px;
  background:#fff;overflow:hidden}
.inl > b{flex:0 0 auto;display:flex;align-items:center;gap:5px;
  font-size:11.5px;font-weight:800;color:var(--faint);padding:0 2px 0 10px;white-space:nowrap}
.inl > b .tip{font-weight:700}
.inl > input,.inl > textarea{flex:1;min-width:0;border:0;background:transparent;outline:0;
  padding:8px 11px 8px 8px;font-size:14px;font-family:inherit;color:var(--ink)}
.inl > textarea{resize:none;line-height:1.7;font-size:13.5px}
/* ⚠ 색은 «팔레트에서만» 가져온다 — 낱색을 적으면 검사가 막는다
   (tests/color-palette-apps.test.js). 테두리 불빛은 그 색을 옅게 깔아 만든다. */
.inl:focus-within{border-color:var(--navy);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--navy) 16%, transparent)}
.inl.two-row{margin-bottom:13px}

/* ── 상단 틀고정 (대표 지시 2026-09-03 「상단은 틀고정하는게 맞다」) ──
   구르는 곳은 .esc 다. 경력 열여덟 줄을 고치다 보면 «누구 자료인지·올림인지»가
   위로 사라졌다.
   ★ .ehd(경고 띠 자리)로 «옮기지 않는다» — 거기에 칸까지 넣으면 폰에서 머리가
     화면 절반을 먹는다. sticky 는 구르기 전까지는 제자리라, 경력이 짧은 사람은
     지금과 똑같이 보인다.
   ★ 위 여백은 «붙은 칸 안»에 둔다(padding-top) — 스크롤판(.esc)에 두면 그 틈으로
     아래 글이 붙은 칸 위에 비쳐 보인다(위 .esc 설명 참조. 실측 13px → 1px).
     굴리기 전에는 위에 숨이 있고, 붙은 뒤에는 그 숨이 «흰 칸 안»에 있어 덮어 준다. */
/* 붙은 칸(틀고정). 2026-09-03 대표 지시로 경력 목록 «위 전부»가 여기 들어왔다.
   ★ 높이에 한도를 둔다 — 담당 업무가 열 줄이면 붙은 칸이 화면을 다 먹고
     경력 목록을 굴릴 자리가 없어진다. 한도를 넘으면 붙은 칸 안에서 구른다. */
.stick{position:sticky;top:0;z-index:5;background:#fff;padding-top:12px;
  max-height:56vh;overflow-y:auto}
.stick.shadow{border-bottom:1px solid var(--line);box-shadow:0 6px 10px -8px rgba(15,23,42,.35);
  padding-bottom:9px;margin-bottom:11px}
.car{border:1px solid #cbd5e1;border-radius:9px;background:#fff;padding:4px}
.car .l{display:flex;align-items:center;gap:5px;padding:3px 4px;border-bottom:1px solid var(--line-soft)}
.car .l:last-child{border-bottom:0}
.car .l input{flex:1;min-width:0;border:1px solid transparent;border-radius:6px;padding:5px 7px;
  font-size:13.5px;font-family:inherit;color:var(--ink)}
.car .l input:focus{border-color:var(--navy);outline:none}
.car .l .no{width:20px;flex:none;text-align:right;color:var(--faint);font-size:11.5px;font-weight:800}
.car .l .x{border:none;background:none;color:var(--sub);cursor:pointer;font-size:13px;padding:2px 5px}
.car .l .x:hover{color:var(--bad)}
.car .add{color:var(--navy);font-weight:700;font-size:12.5px;padding:6px 8px;cursor:pointer}
.foot{display:flex;align-items:center;gap:8px;margin-top:13px;padding-top:12px;
  border-top:1px solid var(--line);flex-wrap:wrap}
.empty{padding:40px 18px;text-align:center;color:var(--sub)}
.guide{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  margin-top:12px;font-size:12.5px;line-height:1.9}
.guide ol{margin:5px 0 0;padding-left:19px}
.kbd{background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11.5px;font-weight:700}
.legend{flex:none;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:7px 16px;
  border-top:1px solid var(--line);background:#fff;font-size:12px;color:#475569}

/* ── 덧창 (붙여넣기 안내·되돌리기·당겨오기) ── */
.modalWrap{display:none;position:fixed;inset:0;background:rgba(15,20,30,.45);z-index:40;
  align-items:center;justify-content:center;padding:16px}
.modalWrap.on{display:flex}
.modalCard{background:#fff;border-radius:14px;max-width:620px;width:100%;max-height:86vh;
  overflow-y:auto;padding:16px}
/* ★ 넓은 덧창 — 자문사처럼 «수백 줄에서 고르는» 창에만 쓴다 (대표 지시 2026-09-06).
   620px 에 한 칸으로 세우면 272곳을 열여덟 번 굴려야 한다.
   ⚠ 안쪽 여백을 «0» 으로 둔다 — 여백이 있으면 붙은 머리(top:0)가 그 여백 «아래»에 붙어,
     그 틈으로 회사 줄이 비쳐 지나간다(편집칸에서 13px·2px 로 두 번 겪은 자리다).
     여백은 머리와 몸통이 «저마다 안에서» 갖는다. */
.modalCard.wide{max-width:1000px;padding:0}
/* 고르는 창의 머리 — 굴려도 붙어 있다 (대표 지시 2026-09-06 「상단 틀고정과
   저장 기능과 닫기 기능도 상단에」). 206줄을 굴려 내려가도 저장을 누를 수 있어야 한다. */
.pickhd{position:sticky;top:0;z-index:3;background:#fff;
  padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.pickhd h2{margin:0}
.pickbody{padding:10px 16px 16px}
.modalCard h2{font-size:15px;margin:0 0 4px}

/* ── 여러 칸으로 펼쳐 고르기 (자문사) ──
   ★ 칸 수를 «자리에 맞춰» 정한다(auto-fill) — 숫자로 3 을 박으면 좁은 화면에서
     이름이 짜부라진다. 한 칸이 15rem 밑으로 안 내려간다. */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));
  border:1px solid var(--line-soft);border-radius:8px;overflow:hidden;margin-top:8px}
.pcel{display:flex;align-items:center;gap:7px;padding:4px 8px;font-size:12.5px;min-width:0;
  border-bottom:1px solid var(--line-soft);cursor:pointer}
.pcel .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcel .ty{color:var(--sub);font-size:11px;flex:none}
.pcel input{margin:0;flex:none}

/* ── 덧창 «머리 틀고정» (대표 지시 2026-09-05 「상단 틀고정 … 찾기 … 깔때기」) ──
   경력 당겨오기는 한 갈래가 103건이다. 구르면 갈래 탭·찾기·깔때기가 위로 사라져,
   무엇을 보고 있었는지 잃는다.
   ⚠ 위 여백을 «구르는 칸»에 두면 붙은 머리가 그 틈을 못 덮는다 — 그 틈으로 목록이
     비쳐 보인다(2026-09-03 편집칸에서 재어 확인했다: 여백 12px + 테두리 = 13px).
     그래서 이 덧창만 위 여백을 «첫 아이»에게 넘긴다. 다른 덧창은 그대로 둔다. */
.modalCard.stickhead{padding-top:0}
.modalCard.stickhead > :first-child{margin-top:16px}
.pullhead{position:sticky;top:0;z-index:5;background:#fff;padding-top:16px;
  border-bottom:1px solid var(--line);margin-bottom:9px;padding-bottom:8px}
.pullhead h2{margin-top:0}

/* 찾기 + 깔때기 — 한 줄에 둔다. 두 줄이 되면 그만큼 목록이 줄어든다. */
.pullbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:7px 0 0}
.pullbar .find{flex:1 1 180px;min-width:0;display:flex;align-items:center;gap:6px;
  border:1px solid #cbd5e1;border-radius:8px;padding:0 9px;background:#fff}
.pullbar .find:focus-within{border-color:var(--navy);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--navy) 14%, transparent)}
.pullbar .find > span{flex:0 0 auto;color:var(--faint);font-size:12px}
.pullbar .find > input{flex:1;min-width:0;border:0;outline:0;background:transparent;
  padding:7px 0;font:inherit;font-size:13px;color:var(--ink)}
.pullbar .find > button{flex:0 0 auto;border:0;background:transparent;color:var(--faint);
  cursor:pointer;font:700 13px inherit;padding:2px 4px}
/* 깔때기 — 눌러서 좁힌다 */
.funnel{display:inline-flex;flex:0 0 auto;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden}
.funnel > button{border:0;background:#fff;color:var(--sub);cursor:pointer;
  font:700 11.5px/1 inherit;padding:7px 9px;white-space:nowrap}
.funnel > button + button{border-left:1px solid #cbd5e1}
.funnel > button:hover{background:var(--line-soft)}
.funnel > button.on{background:var(--navy);color:#fff}
.pullnone{padding:18px 10px;text-align:center;color:var(--sub);font-size:13px}
.pullnone b{color:var(--ink)}

/* ── 前/現 고르개 (대표 지시 2026-09-03 「전현도 선택할 수 있게 해달라」) ──
   ★ 「現」·「前」은 자판으로 바로 안 나온다. 열여덟 줄을 고치려면 한자를 열여덟 번
     찾아 넣어야 했다 — 그래서 눌러서 고른다.
   ★ 세 자리다: 現 · 前 · 없음(켜진 것을 다시 누르면 없음). 학력·자격증에
     「現」을 억지로 붙이지 않으려면 «없음»이 있어야 한다.
   ⚠ 줄 높이를 늘리지 않는다 — 한 칸은 한 줄이다(2026-08-30 대표 지시). */
.era{display:inline-flex;flex:0 0 auto;border:1px solid #cbd5e1;border-radius:7px;overflow:hidden}
.era > button{border:0;background:#fff;color:var(--faint);cursor:pointer;
  font:800 11.5px/1 inherit;padding:6px 7px;white-space:nowrap}
.era > button + button{border-left:1px solid #cbd5e1}
.era > button:hover{background:var(--line-soft)}
.era > button.on{background:var(--navy);color:#fff}
.era > button.on.past{background:var(--warn)}
/* 전현이 있을 만한 줄인데 아무것도 안 골랐으면 눈에 띄게 한다 */
.car .l.needpick .era{box-shadow:0 0 0 2px color-mix(in srgb, var(--warn) 35%, transparent)}

/* ── 화면 안 창 (사유 입력·예아니오·알림) ──
   ★ 브라우저 기본 창을 대신한다. 덧창 위에도 떠야 하므로 z-index 를 더 높인다
     (되돌리기 덧창 안에서 「이 시점으로」를 누르면 그 위에 확인 창이 뜬다). */
.dlgWrap{display:none;position:fixed;inset:0;background:rgba(15,20,30,.5);z-index:60;
  align-items:center;justify-content:center;padding:16px}
.dlgWrap.on{display:flex}
.dlgCard{background:#fff;border-radius:14px;max-width:540px;width:100%;max-height:86vh;
  overflow-y:auto;padding:16px 18px;box-shadow:0 8px 30px rgba(31,34,51,.18)}
.dlgCard h2{font-size:15px;margin:0 0 6px}
.dlgCard .why{color:var(--sub);font-size:12.5px;margin-bottom:9px}
.dlgCard textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:9px 11px;
  font-size:13.5px;font-family:inherit;color:var(--ink);line-height:1.7;resize:vertical}
.dlgFoot{display:flex;gap:8px;align-items:center;margin-top:11px}

.pre{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:10px 12px;
  font-size:12.5px;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow-y:auto;line-height:1.8}
.pk{display:flex;align-items:flex-start;gap:8px;padding:7px 6px;border-bottom:1px solid var(--line-soft);font-size:13px}
.pk:last-child{border-bottom:0}
.pk input{margin:3px 0 0}
.pk .t{flex:1;min-width:0}
.pk .t .d{font-size:11.5px;color:var(--sub)}
/* 당겨오기 덧창의 갈래 단추 — 상단 갈래 탭(.gtabs)과 다른 것이다 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:9px;
  padding:6px 11px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer}
.tabs button.on{border-color:var(--navy);background:var(--navy);color:#fff}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1e293b;color:#fff;
  border-radius:10px;padding:9px 16px;font-size:13px;z-index:70;display:none}

/* 창이 좁아지면 기둥과 목록을 먼저 줄인다 — 편집칸을 줄이면 경력 줄이 잘린다 */
@media(max-width:1400px){ .list{width:340px} .rail{width:246px} }

/* 좁은 화면(폰)에서는 붙박이를 풀고 위아래로 세운다 — 창이 낮으면 붙박이가 더 답답하다 */
@media(max-width:900px){
  html,body{height:auto}
  body{overflow:auto;display:block}
  main{display:block;padding:10px 10px 40px}
  /* ⚠ overflow 를 반드시 풀어야 한다 — .app 이 hidden 이면 그 «안»의 sticky 는
     페이지 스크롤을 따라가지 못한다(붙은 것처럼 적어 두어도 그냥 흘러간다).
     실측 2026-09-02: 이것 하나 때문에 갈래 카드가 top:-28px 로 지나갔다. */
  .app{display:block;overflow:visible}
  .top{position:static}
  .body{display:block}
  /* 기둥이 위아래로 눕는다 — 카드는 두 장씩 나란히, 할 일은 그 아래로 */
  /* ── 갈래 카드를 «화면 위에 붙여» 둔다 (대표 지시 2026-09-02 「상단 탭 고정 필요하다」) ──
     자문사 373줄을 굴려 내려가면 갈래 카드가 사라져, 다른 갈래로 가려면 맨 위까지
     되올라가야 했다. 그것이 이 화면에서 «탭» 노릇을 하는 유일한 자리다.
     ⚠ .rail 을 display:contents 로 «푼다». sticky 는 부모가 끝나는 자리에서 함께
       떨어지는데, .rail 은 목록 «앞»에서 끝난다 — 그대로 두면 목록에 닿기도 전에
       카드가 떨어져 나간다. 풀어 두면 카드의 부모가 .body(화면 전체)가 된다.
     ⚠ 「무엇을 볼까」 라벨(.rh)은 안 붙인다 — 이름표일 뿐인데 22px 를 늘 먹는다.
     ⚠ .rail 의 바탕·테두리가 함께 사라지므로 그 둘을 아랫것들에게 물려준다. */
  .rail{display:contents}
  .dash{flex-direction:row;flex-wrap:wrap;max-height:none;
    position:sticky;top:0;z-index:6;background:#f8fafc;
    border-bottom:1px solid var(--line);box-shadow:0 2px 6px rgba(15,23,42,.06)}
  .dcard{flex:1 1 44%}
  .todo{display:block;background:#f8fafc;border-bottom:1px solid var(--line)}
  .todo .sc{max-height:none;overflow:visible}
  .list{width:auto;border-right:0;border-bottom:1px solid var(--line);display:block}
  .list .sc{max-height:50vh}
  .edit{display:block}
  .esc{overflow:visible}
  /* ⚠ 여기서는 .esc 가 «구르지 않는다» — 쪽 전체가 구른다.
     그러면 sticky 가 «창» 맨 위에 붙어, 앱 위 띠 아래로 파고들거나 엉뚱한 데 얹힌다.
     좁은 화면에서는 붙이지 않는다 — 어차피 쪽을 조금만 올리면 다시 보인다. */
  .stick{position:static}
  .stick.shadow{box-shadow:none;border-bottom:0;padding-bottom:0;margin-bottom:11px}
}
/* ── 폰에서 «컴팩트하게» (대표 지시 2026-09-02 「폰에서 좀 컴팩트하게 지금 정리 좀 해 줘」) ──
   위 900px 구간은 «기둥을 눕히는» 일만 한다 — 눕히기만 하고 숨은 그대로라
   한 화면에 들어오는 것이 얼마 없었다. 여기서는 «숨을 줄인다».

   실측(411px 폰, 실제 크로미움 · 대표 갈무리와 같은 구성):
     전체 1237 → 1022px (17% 짧아짐)
     윗칸 129 → 106 · 대시보드 120 → 102 · 할 일 136 → 118
     걸러보기 35 → 31 · 목록 한 줄 65 → 51(22%, 아홉 명이면 126px) ·
     편집 단추줄 163 → 124 · 머리 띠 44 → 35
     옆으로 삐져나가는 것 없음

   ⚠ 560px 아래에서만 듣는다 — PC·태블릿은 손대지 않는다.
   ⚠ 글자 크기는 «거의» 안 줄였다. 줄인 것은 여백과 줄 사이 숨이다 —
     글자를 줄이면 컴팩트해지는 대신 «안 읽힌다». */
@media(max-width:560px){
  /* 줄 사이 숨 1.7 은 글이 많은 화면을 반으로 만든다 */
  body{line-height:1.5}
  .appbar{gap:6px;padding:7px 10px}
  .appbar .ttl{font-size:14.5px}
  .appbar .when{font-size:11.5px}
  /* ⚠ 윗칸 단추는 «자기 폭»으로 둔다 — 50% 로 묶었더니 오히려 줄이 늘었다(129→147px).
     아래 편집 단추들과는 사정이 다르다: 여기는 셋이라 두 개씩이면 두 줄이 된다. */
  .appbar .btn{padding:5px 9px;font-size:12px}
  .appbar select{padding:3px 7px;font-size:12px}
  .rail .rh{padding:4px 10px}
  .dash{gap:3px;padding:4px 6px}
  .dcard{padding:4px 8px;gap:6px}
  .dcard .st{width:64px}
  .todo .th{padding:5px 10px}
  .todo .sc{padding:5px 6px 8px}
  .job{padding:6px 9px}

function stampShort(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  const 두자리 = function (n) { return String(n).padStart(2, '0'); };

    return d.getFullYear() + '-' + 두자리(d.getMonth() + 1) + '-' + 두자리(d.getDate()) + ' ' + 시각;

  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + 시각;
}

     askYes(제목, 몸말, 단추이름)  — 예·아니오. 그만두면 false
     askText(제목, 몸말, 옵션)     — 여러 줄 입력. 그만두면 null, 빈칸이면 ''
   ★ askText 는 «그만두기(null)»와 «빈 값('')»을 갈라 돌려준다. 사유를 비운 것과
     스스로 그만둔 것은 할 말이 다르다 — 뭉개면 그만둔 사람에게 잔소리를 하게 된다. */
const Dlg = { done: null };

function dlgEnd(value) {
  const fn = Dlg.done;
  Dlg.done = null;
  const el = $('dlg');
  if (el) el.classList.remove('on');
  if (fn) fn(value);
}

function dlgShow(html, done) {
  /* 창이 겹치면 «앞선 물음»을 그만두기로 끝낸다 — 답을 기다리는 약속이 영원히 안
     끝나면, 부른 쪽이 멈춰 서서 또 「아무 일도 안 일어나는」 화면이 된다. */
  if (Dlg.done) dlgEnd(null);
  Dlg.done = done;
  $('dlgCard').innerHTML = html;
  $('dlg').classList.add('on');
  const t = $('dlgText');
  if (t && t.focus) t.focus();
}

function dlgOk() { dlgEnd(true); }
function dlgCancel() { dlgEnd(null); }
function dlgTextOk() {
  const t = $('dlgText');
  dlgEnd(t ? String(t.value) : '');
}
function dlgBackdrop(e) { if (e.target === $('dlg')) dlgCancel(); }
window.dlgOk = dlgOk; window.dlgCancel = dlgCancel;
window.dlgTextOk = dlgTextOk; window.dlgBackdrop = dlgBackdrop;

/* 몸말(body)은 «이미 이스케이프된» HTML 로 받는다. 사람 이름·사유처럼 바깥에서 온
   글자를 넣을 때는 부르는 쪽에서 esc() 를 씌운다. */
function say(title, body) {
  return new Promise(function (res) {
    dlgShow('<h2>' + esc(title) + '</h2>'
      + (body ? '<div class="why">' + body + '</div>' : '')
      + '<div class="dlgFoot"><span style="flex:1"></span>'
      + '<button class="btn pri" onclick="dlgOk()">확인</button></div>',
      function () { res(); });
  });
}

function askYes(title, body, okLabel) {
  return new Promise(function (res) {
    dlgShow('<h2>' + esc(title) + '</h2>'
      + (body ? '<div class="why">' + body + '</div>' : '')
      + '<div class="dlgFoot"><span style="flex:1"></span>'
      + '<button class="btn" onclick="dlgCancel()">그만두기</button>'
      + '<button class="btn pri" onclick="dlgOk()">' + esc(okLabel || '예') + '</button></div>',
      function (v) { res(v === true); });
  });
}

function askText(title, body, opt) {
  const o = opt || {};
  return new Promise(function (res) {
    dlgShow('<h2>' + esc(title) + '</h2>'
      + (body ? '<div class="why">' + body + '</div>' : '')
      + '<textarea id="dlgText" rows="' + (Number(o.rows) || 3) + '" placeholder="'
      + esc(o.hint || '') + '">' + esc(o.value || '') + '</textarea>'
      + '<div class="dlgFoot"><span style="flex:1"></span>'
      + '<button class="btn" onclick="dlgCancel()">그만두기</button>'
      + '<button class="btn pri" onclick="dlgTextOk()">' + esc(o.ok || '저장') + '</button></div>',
      function (v) { res(v === null || v === undefined ? null : String(v)); });
  });
}

/* 명부 읽기 — enter.html 과 같은 방식({v:…} 래핑·객체 형태 모두 배열로) */
function readRosterAt(path) {
  return db.ref(path).once('value').then(snap => {
    const raw = snap.val();
    let list = (raw && raw.v !== undefined) ? raw.v : raw;
    if (list && !Array.isArray(list) && typeof list === 'object') {
      list = Object.keys(list).map(k => list[k]);
    }
    return Array.isArray(list) ? list : null;
  });
}
