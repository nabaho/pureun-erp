<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>근로복지기금 통합 운영시스템</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
  :root{
    --bg:#f4f6fa; --panel:#fff; --line:#e6e9f0; --ink:#1a2233; --sub:#667085;
    --acc:#2563eb; --acc-2:#1d4ed8; --acc-soft:#e9f0fd; --acc-ink:#1e50b3;
    --ok:#12805c; --ok-soft:#e7f6ef; --warn:#b25e09; --warn-soft:#fdf3e1;
    --danger:#c62f21; --danger-soft:#fdeceb;
    --side:#101828; --side2:#0b111e; --side-tx:#98a2b3;
    --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.6;
    font-family:"Pretendard Variable",Pretendard,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
  /* ── 좌측 사이드바 (라이트·미니멀) ── */
  #side{position:fixed;left:0;top:0;bottom:0;width:216px;z-index:60;
    background:#fff;border-right:1px solid var(--line);color:var(--sub);
    display:flex;flex-direction:column}
  #side .logo{display:flex;gap:10px;align-items:center;padding:18px 16px 14px;cursor:pointer}
  #side .logo-ico{font-size:20px}
  #side .logo b{color:var(--ink);font-size:14px;display:block;letter-spacing:-.01em}
  #side .logo small{font-size:10.5px;color:var(--sub)}
  .side-sec{padding:16px 16px 6px;font-size:10.5px;font-weight:700;letter-spacing:.1em;
    color:#98a2b3;text-transform:uppercase}
  .side-sec.fundname{color:var(--ink);font-size:12.5px;letter-spacing:0;text-transform:none;
    border-top:1px solid var(--line);margin-top:12px;padding-top:16px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #sidenav{flex:1;overflow-y:auto;padding-bottom:10px}
  .sitem{margin:2px 10px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;
    font-weight:600;color:#404a5c;display:flex;gap:8px;align-items:center;transition:all .12s}
  .sitem:hover{background:#f4f6fa}
  .sitem.on{background:var(--acc-soft);color:var(--acc)}
  .sitem.sub{padding:6px 12px 6px 22px;font-size:12.5px;font-weight:500}
  .sitem.sub .badge-mini{margin-left:auto;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px}
  .side-grp{padding:12px 16px 4px;font-size:10px;font-weight:700;letter-spacing:.08em;
    color:#a4adbd;text-transform:uppercase}
  .cyc{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin:2px 0 4px}
  .cyc .stp{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
    font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent}
  .cyc .stp.done{background:#e7f6ee;color:#1f7a4d}
  .cyc .stp.current{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
  .cyc .stp.todo{border-color:var(--line);color:#98a2b3}
  .cyc .sep{width:14px;border-top:1px solid #d6dae3;margin:0 2px}
  .evt-banner{margin-top:10px;padding:10px 14px;border-radius:10px;background:#fff7ed;
    border:1px solid #fed7aa;color:#b45309;font-size:12.5px;cursor:pointer}
  .evt-step{display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:13px}
  .evt-step.done{color:#98a2b3;text-decoration:line-through}
  .evt-go{font-size:11px;padding:2px 8px;border:1px solid var(--acc);color:var(--acc);
    background:#fff;border-radius:12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
  .evt-go:hover{background:var(--acc-soft)}
  .nf-card{flex:1;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;transition:all .12s}
  .nf-card:hover{border-color:#bcc4d2}
  .nf-card.on{border-color:var(--acc);background:var(--acc-soft)}
  .nf-card b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:4px}
  .nf-card span{font-size:11.5px;color:var(--sub);line-height:1.5}
  .newfund-wrap{padding:2px 14px 6px}
  #side .yearwrap{padding:2px 14px 4px}
  #side select{width:100%;padding:7px 10px;border-radius:8px;border:1px solid #d6dae3;
    background:#fff;color:var(--ink);font-weight:700;font-size:12.5px}
  .side-foot{padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
  .sbtn{width:100%;padding:8px;border-radius:8px;border:1px solid #d6dae3;
    background:#fff;color:#404a5c;font-weight:700;font-size:12.5px;cursor:pointer;transition:all .12s}
  .sbtn:hover{background:#f4f6fa}
  .sbtn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  .sbtn.primary:hover{background:var(--acc-2)}
  /* ── 본문 (전체 폭) ── */
  #maincol{margin-left:216px;min-height:100vh;display:flex;flex-direction:column}
  #topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:9px 24px;font-size:13px;
    display:flex;align-items:center;gap:14px}
  #topbar #crumb{color:var(--sub);font-weight:700;letter-spacing:-.01em}
  #topright{margin-left:auto;display:flex;align-items:center;gap:12px}
  #topuser{color:var(--ink);font-weight:700;font-size:12.5px}
  #topuser .role{color:var(--sub);font-weight:500;margin-left:4px}
  #topclock{font-variant-numeric:tabular-nums;color:var(--sub);font-size:12.5px;
    background:var(--bg,#f4f6fa);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
  #logoutbtn{font-size:12.5px;padding:5px 12px;border:1px solid #e6a19a;color:#c0392b;background:#fff;
    border-radius:8px;cursor:pointer;font-weight:700}
  #logoutbtn:hover{background:#fdeeec}
  main{flex:1;padding:18px 24px 70px;width:100%}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  h2{font-size:13.5px;margin:0;letter-spacing:-.01em}
  .muted{color:var(--sub);font-size:11.5px}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
  th,td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;white-space:nowrap}
  th{background:#f8f9fc;font-weight:700;color:var(--sub);cursor:pointer;user-select:none;
    position:sticky;top:0;z-index:5;font-size:11px}
  tr:hover td{background:#f8f9fc}
  .tblwrap{overflow:auto;max-height:calc(100vh - 215px);border:1px solid var(--line);border-radius:10px;background:#fff}
  .badge{display:inline-block;padding:1.5px 9px;border-radius:99px;font-weight:700;font-size:10.5px}
  .b-gongdong{background:#fdf3e1;color:#9a5b04}.b-sane{background:#e7ecff;color:#3947c4}
  .b-chungnam{background:#e7f6ef;color:#0f7a50}.b-gyeonggi{background:#f1e9ff;color:#6b34c9}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:2px}
  .d-done{background:#12b76a}.d-doing{background:#5c6cf0}.d-none{background:#d5dae3}.d-warn{background:#f59e0b}
  .tabs{display:flex;gap:6px;border:none;margin-bottom:12px;flex-wrap:wrap}
  .tab{padding:6px 14px;cursor:pointer;font-weight:700;color:var(--sub);font-size:12px;
    border-radius:8px;border:1px solid transparent;margin:0;transition:all .12s}
  .tab:hover{background:#f1f3f9}
  .tab.on{color:var(--acc);background:var(--acc-soft);border-color:#dcdffc}
  button{padding:6px 12px;border:1px solid #d6dae3;border-radius:8px;background:#fff;color:#404a5c;
    cursor:pointer;font-size:11.5px;font-weight:600;font-family:inherit;transition:all .12s}
  button:hover{border-color:#b9c0cf;background:#f6f7fa}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  button.primary:hover{background:var(--acc-2)}
  button.green{background:var(--ok-soft);border-color:#bfe6d4;color:var(--ok)}
  button.warn{background:var(--warn-soft);border-color:#f2d5a4;color:var(--warn)}
  input,select,textarea{font-family:inherit}
  .search{padding:6px 11px;border:1px solid #d6dae3;border-radius:8px;font-size:12px;width:200px;background:#fff}
  td.editable{cursor:pointer}
  td.editable:hover{outline:1.5px dashed #a5b4fc;outline-offset:-2px;border-radius:5px}
  td .cell-input{width:100%;padding:3px 5px;border:2px solid var(--acc);border-radius:6px;font-size:12px;font-family:inherit}
  .empty-cell{color:#98a2b3;border:1px dashed #d5dae3;border-radius:6px;padding:1px 7px;background:#f8f9fc;font-size:10.5px}
  tr.jump td{border-top:2px solid #f59e0b;border-bottom:2px solid #f59e0b}
  .num{text-align:right;font-variant-numeric:tabular-nums;font-family:inherit}
  .agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .acard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#f8f9fc}
  .acard b{font-size:11px;color:var(--sub);display:block;margin-bottom:4px}
  .acard .ag{margin-bottom:5px}
  .acard .ag .nm{font-weight:700;font-size:12.5px;color:var(--ink)}
  .acard .ct{color:var(--sub);font-size:11px}
  .role-tag{font-size:9.5px;padding:1.5px 7px;border-radius:99px;font-weight:700;margin-right:4px}
  .rt-1{background:#e7f6ef;color:#0f7a50}.rt-2{background:#fdf3e1;color:#9a5b04}
  .rt-3{background:#e7ecff;color:#3947c4}.rt-4{background:#f1e9ff;color:#6b34c9}
  /* ── 업무 보드 ── */
  .board{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px}
  .bcol{min-width:184px;flex:1;background:#f8f9fc;border:1px solid var(--line);border-radius:12px;padding:11px 10px}
  .bcol h4{margin:0 0 9px;font-size:11.5px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
  .bcol h4 .cnt{background:#fff;border:1px solid var(--line);border-radius:99px;padding:0 9px;font-size:10.5px}
  .fchip{background:#fff;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:9px;
    padding:7px 10px;margin-bottom:7px;font-size:12px;font-weight:700;cursor:pointer;
    box-shadow:var(--shadow);transition:all .13s}
  .fchip:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(16,24,40,.09);border-color:#c7cbe8;border-left-color:var(--acc)}
  .fchip small{display:block;font-weight:500;color:var(--sub);font-size:10.5px;margin-top:2px}
  .fchip.fwarn{border-left-color:var(--danger)}
  .fchip.fdone{border-left-color:#12b76a;opacity:.72}
  .bempty{color:#c3cad6;text-align:center;padding:16px 0;font-size:12px}
  /* 홈 목록: 상태칩·번호 */
  .st{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
  .st-norm{background:#eef1f5;color:#667085}
  .st-ok{background:var(--ok-soft);color:var(--ok)}
  .st-warn{background:var(--warn-soft);color:var(--warn)}
  .st-bad{background:var(--danger-soft);color:var(--danger)}
  .st-build{background:var(--acc-soft);color:var(--acc)}
  td.no{color:#98a2b3;font-weight:700;text-align:center;width:44px}
  /* 컴팩트 관계기관 바 (flex 미사용 — 단순 블록/인라인) */
  .agbar{font-size:12px}
  .agrow{padding:2px 0;line-height:1.7}
  .agrole{margin-right:8px}
  .aglink{cursor:pointer;font-weight:600;color:var(--ink);text-decoration:none;border-bottom:1px dotted transparent}
  .aglink:hover{color:var(--acc);border-bottom-color:var(--acc)}
  .agsep{color:#c0c6d0}
  .agok{color:var(--ok);font-size:10px}
  /* 기본정보 요약 카드 */
  .kvbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px 18px}
  .kv{display:flex;gap:8px;font-size:12px;padding:3px 0;border-bottom:1px dashed var(--line)}
  .kv .k{color:var(--sub);min-width:78px}.kv .v{font-weight:600}
  .kv .v.miss{color:#b0b7c3;font-weight:400}
  .todo-line{display:flex;align-items:center;gap:10px;padding:7px 11px;border-radius:9px;
    background:#f8f9fc;font-size:13px;transition:all .12s}
  .todo-line[onclick]:hover{background:#eef1f8;box-shadow:var(--shadow)}
  tr[onclick]{cursor:pointer}
  #toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;
    padding:10px 22px;border-radius:10px;font-size:12.5px;font-weight:600;display:none;z-index:200;
    box-shadow:0 10px 30px rgba(0,0,0,.28)}
  .modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.5);display:flex;align-items:center;
    justify-content:center;z-index:100;backdrop-filter:blur(2px)}
  .modal{background:#fff;border-radius:14px;padding:20px 22px;width:440px;max-height:82vh;overflow-y:auto;
    box-shadow:0 24px 60px rgba(16,24,40,.35)}
  .modal h3{margin:0 0 12px;font-size:13.5px}
  .fld{margin-bottom:10px}
  .fld label{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:4px}
  .fld input,.fld select,.fld textarea{width:100%;padding:7px 10px;border:1px solid #d6dae3;border-radius:8px;font-size:12.5px}
  .fld input:focus,.fld select:focus{outline:2px solid #c7cbf5;border-color:var(--acc)}
  .warnbox{background:var(--warn-soft);border:1px solid #f2d5a4;border-radius:10px;padding:9px 13px;
    font-size:11.5px;color:#7a4b06;margin-bottom:10px}
  .stat{display:inline-block;background:var(--acc-soft);color:var(--acc-ink);border-radius:8px;
    padding:3px 11px;font-weight:700;font-size:11.5px;margin-right:6px}
  @media(max-width:920px){#side{display:none}#maincol{margin-left:0}}
</style>
</head>
<body>
<aside id="side">
  <div class="logo" onclick="go('dash')"><span class="logo-ico">🏦</span>
    <div><b>기금 통합운영</b><small>푸른노무법인</small></div></div>
  <div class="newfund-wrap"><button class="sbtn primary" onclick="newFundModal()">＋ 새 기금 등록</button></div>
  <div class="side-sec">회계연도</div>
  <div class="yearwrap"><select id="yearSel" onchange="S.year=+this.value; refresh()"></select></div>
  <nav id="sidenav"></nav>
  <div class="side-foot">
    <button class="sbtn" onclick="document.getElementById('puerpx').click()">🔗 푸른이알피 연동</button>
    <input type="file" id="puerpx" accept=".json" style="display:none" onchange="importPuerp(this)">
  </div>
</aside>
<div id="maincol">
  <div id="topbar"><span id="crumb">기금 현황</span>
    <div id="topright">
      <span id="topuser"></span>
      <span id="topclock" title="현재 시각">—</span>
      <button id="logoutbtn" onclick="doLogout()" title="푸른 포털로 나가기">로그아웃</button>
    </div>
  </div>
  <main id="app"></main>
</div>
<div id="toast"></div>
<div id="modal-root"></div>

<script>
// ═══ 상태 ═══
var S = { view:'dash', job:'report', board:null, boardMgr:'', q0:'', showArch:false, showBoard:true, todo:null, homeTab:'board',
          year:new Date().getFullYear(), fund:null, dash:null,
          sites:[], counts:{active:0,closed:0}, statusTab:'active', q:'',
          sort:{key:'',dir:'asc'}, editing:null,
          fundTab:'sites', docs:null, docCounts:[], docKind:'',
          closing:null, accounts:[], journals:[], jAccounts:[],
          welfare:null, welfareCats:[], openProg:null, cases:[], annual:null,
          ops:null, meetings:[], revisions:[], roles:[], mgrFilter:'', est:null, staffList:[] };

// 연도 옵션 (내년~4년 전)
(function(){ var sel=document.getElementById('yearSel'), y=new Date().getFullYear();
  for(var i=y+1;i>=y-4;i--){ var o=document.createElement('option'); o.value=i; o.textContent=i+'년'; if(i===y)o.selected=true; sel.appendChild(o);} })();

function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(function(){t.style.display='none';},2600); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function api(url,opt){ return fetch(url,opt).then(function(r){
  if(!r.ok) return r.json().then(function(e){ throw new Error(e.detail||r.status); });
  return r.json(); }); }
function patch(url,field,value,year){ return api(url,{method:'PATCH',
  headers:{'Content-Type':'application/json'},body:JSON.stringify({field:field,value:value,year:year})}); }

function go(view,fundId){ S.view=view; S.editing=null;
  if(view==='fund'&&fundId){ S.fundId=fundId; S.fundTab='annual'; S.docs=null; S.closing=null; S.annual=null; S.est=null;
    S.cycle=null; S.events=null; S._evtOpen=null; S._loadingCycle=false; S._loadingEvents=false; }
  try{ history.replaceState(null,'',view==='fund'?'#fund='+encodeURIComponent(fundId||S.fundId):'#'); }catch(e){}
  refresh(); }

// 딥링크: 푸른이알피 등 외부에서 #fund=FUND-0001 또는 #fund=기금명 으로 바로 진입
function openFromHash(){
  var h=decodeURIComponent(location.hash||'');
  var m=h.match(/^#fund=(.+)$/);
  if(!m) return false;
  var key=m[1].trim();
  api('/api/dashboard?year='+S.year).then(function(d){
    var f=d.funds.find(function(x){return x.fund_id===key;})
      ||d.funds.find(function(x){return x.name===key||x.short_name===key;})
      ||d.funds.find(function(x){return (x.name||'').indexOf(key)>=0||key.indexOf(x.short_name||'§')>=0;});
    if(f){ S.dash=d; go('fund',f.fund_id); }
    else { S.dash=d; renderDash(); toast('⚠️ 기금을 찾지 못함: '+key); }
  });
  return true;
}

function refresh(){
  if(S.view==='board'){
    api('/api/board?job='+S.job+'&year='+S.year).then(function(d){ S.board=d; renderBoard(); });
  } else if(S.view==='forms'){
    Promise.all([api('/api/forms/catalog'), api('/api/dashboard?year='+S.year)])
      .then(function(rs){ S.formCat=rs[0]; S.dashFunds=rs[1].funds; renderForms(); });
  } else if(S.view==='billing'){
    api('/api/billings?year='+S.year).then(function(d){ S.billing=d; renderBilling(); });
  } else if(S.view==='ledger'){
    api('/api/dashboard?year='+S.year).then(function(d){ S.dash=d; renderLedger(); });
  } else if(S.view==='staff'){
    api('/api/staff?all=true').then(function(d){ S.staff=d; renderStaff(); });
  } else if(S.view==='dash'){
    Promise.all([api('/api/dashboard?year='+S.year),
                 api('/api/board?job='+S.job+'&year='+S.year),
                 api('/api/todo?year='+S.year)])
      .then(function(rs){ S.dash=rs[0]; S.board=rs[1]; S.todo=rs[2]; renderDash(); });
  } else {
    Promise.all([ api('/api/funds/'+S.fundId),
      api('/api/funds/'+S.fundId+'/sites?year='+S.year+'&status='+S.statusTab)
    ]).then(function(rs){ S.fund=rs[0]; S.sites=rs[1].sites; S.counts=rs[1].counts; renderFund(); });
  }
}

// ═══ 좌측 사이드바 내비게이션 ═══
function updateSide(){
  var nav=document.getElementById('sidenav'); if(!nav) return;
  function item(icon,label,on,click,cls){
    return '<div class="sitem'+(on?' on':'')+(cls?' '+cls:'')+'" onclick="'+click+'">'
      +(icon?icon+' ':'')+'<span>'+label+'</span></div>';
  }
  var h='<div class="side-sec">메뉴</div>';
  h+=item('🏛','기금 현황',S.view==='dash',"go('dash')");
  h+=item('📇','기금 대장',S.view==='ledger',"go('ledger')");
  h+=item('💰','청구 관리',S.view==='billing',"go('billing')");
  h+=item('👥','담당자 관리',S.view==='staff',"go('staff')");
  h+=item('📚','서식 자료실',S.view==='forms',"go('forms')");
  if(S.view==='fund'&&S.fund){

// ═══ 기금 대장 — 전 기금 기본정보(인가·등기·고유번호 등) 한 표 + 인라인 입력 ═══
var LEDGER_COLS=[
  ['inka_no','인가번호','text'],['inka_date','인가일','date'],
  ['corp_reg_no','법인등록번호','text'],['reg_date','설립등기일','date'],
  ['tax_id_no','고유번호','text'],['registry_office','관할등기소','text'],
  ['tax_office','관할세무서','text'],['chairman','대표자','text'],
  ['address','소재지','text']];
var LEDGER_KEYS=['inka_no','inka_date','corp_reg_no','reg_date','tax_id_no'];
function renderLedger(){
  document.getElementById('crumb').textContent='기금 대장 · '+S.year+'년';
  updateSide();
  var funds=(S.dash.funds||[]).filter(function(f){return ['기록보관','계약종료'].indexOf(f.mgmt_type)<0;});
  var q=(S.ledgerQ||'').trim();
  if(q) funds=funds.filter(function(f){return (f.name||'').indexOf(q)>=0;});
  function nDone(f){ return LEDGER_KEYS.filter(function(k){return f[k];}).length; }
  if(S.ledgerIncomplete) funds=funds.filter(function(f){return nDone(f)<5;});
  function grp(f){ return f.fund_type==='사내'?'사내':(f.region?'지역공동':'개별공동'); }
  var order={'지역공동':1,'개별공동':2,'사내':3}, rpri={'충남':1,'경기':2};
  funds.sort(function(a,b){ return (order[grp(a)]-order[grp(b)])
    || ((rpri[a.region]||9)-(rpri[b.region]||9))
    || (a.short_name||'').localeCompare(b.short_name||'','ko'); });
  var edit=!!S.ledgerEdit;
  function cell(v){ return v?esc(v):'<span style="color:#c0c6d0">—</span>'; }
  function inp(f,col){
    var k=col[0], v=f[k]||'';
    return '<input data-fid="'+f.fund_id+'" data-k="'+k+'" type="'+col[2]+'"'
      +' value="'+esc(v)+'" onchange="patchLedger(this)"'
      +' style="width:'+(k==='address'?'210':k==='inka_date'||k==='reg_date'?'128':'118')
      +'px;padding:3px 6px;border:1px solid '+(v?'#d6dae3':'#f0a8a8')+';border-radius:5px;font-size:12px">';
  }
  function comp(f){ var n=nDone(f); var c=n===5?'st-ok':n>=3?'st-warn':'st-bad';
    return '<span class="st '+c+'" id="comp-'+f.fund_id+'">'+n+'/5</span>'; }
  var rows=funds.map(function(f,i){
    var tds=LEDGER_COLS.map(function(col){
      if(edit) return '<td>'+inp(f,col)+'</td>';
      var cls=col[0]==='address'?' class="muted" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"':'';
      return '<td'+cls+'>'+cell(f[col[0]])+'</td>';
    }).join('');
    return '<tr'+(edit?'':' onclick="go(\'fund\',\''+f.fund_id+'\')" style="cursor:pointer"')+'>'
      +'<td class="no">'+(i+1)+'</td>'
      +'<td style="font-weight:700;position:sticky;left:0;background:var(--panel)">'+esc(f.name)+'</td>'
      +tds+'<td style="text-align:center">'+comp(f)+'</td></tr>';
  }).join('');
  var THEAD='<thead><tr><th style="width:38px">번호</th>'
    +'<th style="position:sticky;left:0;background:#f8f9fc">기금명</th>'
    +LEDGER_COLS.map(function(c){return '<th>'+c[1]+'</th>';}).join('')
    +'<th style="width:56px">완성도</th></tr></thead>';
  var incN=(S.dash.funds||[]).filter(function(f){return ['기록보관','계약종료'].indexOf(f.mgmt_type)<0 && nDone(f)<5;}).length;
  document.getElementById('app').innerHTML =
    '<div class="panel"><div class="row" style="margin-bottom:10px">'
    +'<h2>📇 기금 대장 <span class="muted">전 기금 기본정보 한눈 정리</span></h2>'
    +'<span class="stat">'+funds.length+'개</span>'
    +'<span class="stat" style="background:var(--warn-soft);color:var(--warn)">미완비 '+incN+'개</span>'
    +'<span style="flex:1"></span>'
    +'<label style="font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox"'+(S.ledgerIncomplete?' checked':'')+' onchange="S.ledgerIncomplete=this.checked;renderLedger()"> 미완비만</label>'
    +'<button class="'+(edit?'primary':'')+'" onclick="S.ledgerEdit=!S.ledgerEdit;renderLedger()">'+(edit?'✓ 입력 종료':'✏️ 입력 모드')+'</button>'
    +'<input class="search" placeholder="기금명 검색" value="'+esc(S.ledgerQ||'')+'" oninput="S.ledgerQ=this.value;renderLedger()">'
    +'<button onclick="location.href=\'/api/ledger/export?year='+S.year+'\'">📤 엑셀</button></div>'
    +'<p class="muted" style="margin:0 0 10px">'+(edit
      ?'<b>입력 모드</b> — 칸에 바로 입력하면 자동 저장됩니다. <span style="color:var(--danger)">빨간 테두리</span>는 빈 칸. 날짜는 YYYY-MM-DD. 끝나면 [입력 종료].'
      :'인가·등기·고유번호를 한 표로. <b>완성도</b>=핵심 5항목 입력 상태. 행 클릭 시 그 기금으로. 값을 채우려면 <b>[✏️ 입력 모드]</b>.')+'</p>'
    +'<div class="tblwrap" style="max-height:calc(100vh - 210px)"><table>'+THEAD
    +'<tbody>'+rows+'</tbody></table></div></div>';
}
function patchLedger(el){
  var fid=el.getAttribute('data-fid'), k=el.getAttribute('data-k'), v=el.value.trim();
  patch('/api/funds/'+fid, k, v).then(function(){
    var f=(S.dash.funds||[]).filter(function(x){return x.fund_id===fid;})[0];
    if(f){ f[k]=v;
      var n=LEDGER_KEYS.filter(function(kk){return f[kk];}).length;
      var badge=document.getElementById('comp-'+fid);
      if(badge){ badge.textContent=n+'/5'; badge.className='st '+(n===5?'st-ok':n>=3?'st-warn':'st-bad'); }
    }
    el.style.borderColor=v?'#d6dae3':'#f0a8a8';
    toast('저장');
  }).catch(function(e){ toast('⚠️ '+e.message); });
}

    +'<div class="row">'+fsel+setupBtn+'</div></div>'
    + groups;

function previewDoc(kind,name){
  var fid=S.formFund||(S.dashFunds&&S.dashFunds[0]&&S.dashFunds[0].fund_id);
  if(!fid){ toast('먼저 상단에서 기금을 선택하세요'); return; }
  S.previewKind=kind; S.previewName=name; S.previewFund=fid;
  fetch('/api/funds/'+fid+'/docgen/'+kind+'?year='+S.year)
    .then(function(r){return r.text();})
    .then(function(html){ openDocEditor(html); })
    .catch(function(e){ toast('⚠️ '+e.message); });
}
function openDocEditor(html){
  // 서류 본문만 추출 (body 안쪽)
  var m=html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
  var inner=m?m[1]:html;
  // toolbar/note 제거
  inner=inner.replace(/<div class=['"]toolbar['"][\s\S]*?<\/div>/i,'')
             .replace(/<p class=['"]note['"][\s\S]*?<\/p>/i,'');
  var fundName='';
  var ff=(S.dashFunds||[]).find(function(x){return x.fund_id===S.previewFund;});
  if(ff) fundName=ff.name;
  document.getElementById('modal-root').innerHTML=
    '<div class="modal-bg"><div class="modal" style="width:820px;max-width:94vw">'
    +'<div class="row" style="margin-bottom:8px"><h3 style="margin:0">👁 '+esc(S.previewName)+' <span class="muted" style="font-weight:500">'+esc(fundName)+' · '+S.year+'년</span></h3>'
    +'<span style="flex:1"></span><button onclick="closeM()">닫기</button></div>'
    +'<div class="warnbox" style="margin-bottom:8px">아래 내용을 <b>직접 클릭해 수정</b>할 수 있습니다. 값을 고친 뒤 [저장]하면 이 기금의 서식으로 보관됩니다. [원본으로] 누르면 데이터에서 다시 채웁니다.</div>'
    +'<div id="doc-edit" contenteditable="true" style="border:1px solid var(--line);border-radius:10px;'
    +'padding:22px 26px;max-height:56vh;overflow:auto;background:#fff;color:#111;font-family:Batang,serif;line-height:1.9">'
    +inner+'</div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:12px">'
    +'<button onclick="resetDoc()">↺ 원본으로</button>'
    +'<button class="btn" onclick="printDoc()">🖨 인쇄/PDF</button>'
    +'<button class="primary" onclick="saveDoc()">💾 저장</button></div>'
    +'</div></div>';
}
function saveDoc(){
  var html='<!DOCTYPE html><html><head><meta charset="utf-8"><style>'
    +'body{font-family:Batang,serif;max-width:760px;margin:24px auto;line-height:1.9;font-size:13.5px;padding:0 20px}'
    +'table{border-collapse:collapse;width:100%;margin:10px 0}td,th{border:1px solid #333;padding:6px 10px}'
    +'h1{text-align:center;font-size:22px;letter-spacing:6px}h2{font-size:15px;text-align:center}'
    +'.right{text-align:right}.center{text-align:center}.sign{margin-top:34px;text-align:right;line-height:2.4}'
    +'@media print{.toolbar{display:none}}</style>'
    +'<div class="toolbar" style="position:fixed;top:10px;right:10px"><button onclick="window.print()">🖨 인쇄/PDF</button></div></head>'
    +'<body>'+document.getElementById('doc-edit').innerHTML+'</body></html>';
  fetch('/api/funds/'+S.previewFund+'/docedit/'+S.previewKind+'?year='+S.year,
    {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({html:html})})
    .then(function(){ toast('💾 서식 저장됨 (이 기금 편집본으로 보관)'); closeM(); })
    .catch(function(e){ toast('⚠️ '+e.message); });
}
function resetDoc(){
  if(!confirm('편집을 버리고 기금 데이터에서 다시 채울까요?')) return;
  fetch('/api/funds/'+S.previewFund+'/docedit/'+S.previewKind+'?year='+S.year,{method:'DELETE'})
    .then(function(){ return fetch('/api/funds/'+S.previewFund+'/docgen/'+S.previewKind+'?year='+S.year+'&edited=0'); })
    .then(function(r){return r.text();})
    .then(function(html){ openDocEditor(html); toast('원본으로 되돌림'); });
}
function printDoc(){
  var w=window.open('','_blank');
  w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><style>'
    +'body{font-family:Batang,serif;max-width:760px;margin:20px auto;line-height:1.9;font-size:13.5px;padding:0 20px}'
    +'table{border-collapse:collapse;width:100%;margin:10px 0}td,th{border:1px solid #333;padding:6px 10px}'
    +'h1{text-align:center;font-size:22px;letter-spacing:6px}h2{font-size:15px;text-align:center}'
    +'.right{text-align:right}.center{text-align:center}.sign{margin-top:34px;text-align:right;line-height:2.4}</style></head>'
    +'<body>'+document.getElementById('doc-edit').innerHTML+'</body></html>');
  w.document.close(); setTimeout(function(){w.print();},300);
}

// ═══ 업무 보드 (B안 홈): 업무를 고르면 기금이 단계 칸에 놓임 ═══
var BOARD_JOBS=[['report','📄 운영상황보고'],['renewal','🔄 연간 갱신'],['subsidy','🏛 지원금']];
function renderBoard(){
  var b=S.board;
  document.getElementById('crumb').textContent='업무 보드 · '+b.title+' · '+S.year+'년';
  updateSide();
  var pills=BOARD_JOBS.map(function(j){
    return '<span class="tab'+(S.job===j[0]?' on':'')+'" onclick="S.job=\''+j[0]+'\';S.board=null;refresh()">'+j[1]+'</span>';
  }).join('');
  var mgrs={};
  b.stages.forEach(function(st){ st.funds.forEach(function(f){
    (f.manager||'').split(',').forEach(function(nm){ nm=nm.replace('(부)','').trim(); if(nm) mgrs[nm]=1; }); }); });
  var mgrOpts='<option value="">담당: 전체</option>'+Object.keys(mgrs).sort().map(function(nm){
    return '<option'+(S.boardMgr===nm?' selected':'')+'>'+esc(nm)+'</option>';}).join('');
  var cols=b.stages.map(function(st,idx){
    var list=S.boardMgr?st.funds.filter(function(f){return (f.manager||'').indexOf(S.boardMgr)>=0;}):st.funds;
    var last=idx===b.stages.length-1;
    var chips=list.map(function(f){
      return '<div class="fchip'+(f.warn?' fwarn':'')+(last?' fdone':'')+'" onclick="openChip(\''+f.fund_id+'\',\''+b.tab+'\')">'
        +esc(f.short_name)
        +'<small>'+esc(f.manager||'담당 미지정')+(f.detail?' · '+esc(f.detail):'')+'</small></div>';
    }).join('');
    return '<div class="bcol"><h4>'+esc(st.key)+' <span class="cnt">'+list.length+'</span></h4>'
      +(chips||'<div class="bempty">—</div>')+'</div>';
  }).join('');
  document.getElementById('app').innerHTML =
    '<div class="panel"><div class="row" style="margin-bottom:12px">'
    +'<div class="tabs" style="border:none;margin:0">'+pills+'</div>'
    +'<select onchange="S.boardMgr=this.value;renderBoard()" style="padding:5px 8px;border:1px solid #cbd5e1;border-radius:5px;font-size:11.5px">'+mgrOpts+'</select>'
    +'<span class="stat">완료 '+b.done+'/'+b.total+'</span>'
    +'<span style="flex:1"></span>'
    +'<button onclick="go(\'dash\')">📋 기금 목록</button>'
    +'<button class="primary" onclick="newFundModal()">+ 새 기금</button></div>'
    +'<div class="board">'+cols+'</div>'
    +'<div class="muted" style="margin-top:8px">칩 클릭 = 그 기금의 처리 화면으로 이동 · 처리 후 홈으로 돌아오면 칩이 다음 칸으로 이동합니다. '
    +'주황 테두리 = 확인 필요(미분류·누락).</div></div>';
}

  if(tab==='closing') S.closing=null; if(tab==='subsidy'){} }

// ═══ 대시보드 ═══
function stageDot(v){ var c={'완료':'d-done','진행':'d-doing','경고':'d-warn'}[v]||'d-none';
  return '<span class="dot '+c+'" title="'+esc(v)+'"></span>'; }

function renderDash(){
  document.getElementById('crumb').textContent='기금 현황 · '+S.year+'년';
  updateSide();
  var d=S.dash;
  var today=new Date().toISOString().slice(0,10);
  var q=(S.q0||'').trim(), mf=S.mgrFilter||'';
  function vis(f){ return (!q||(f.name||'').indexOf(q)>=0||(f.manager||'').indexOf(q)>=0)
    && (!mf||(f.manager||'').indexOf(mf)>=0); }
  var act=d.funds.filter(function(f){return ['기록보관','계약종료'].indexOf(f.mgmt_type)<0&&vis(f);});
  var arch=d.funds.filter(function(f){return ['기록보관','계약종료'].indexOf(f.mgmt_type)>=0&&vis(f);});
  var gongRegion=act.filter(function(f){return f.fund_type==='공동'&&f.region;});
  var gongIndiv=act.filter(function(f){return f.fund_type==='공동'&&!f.region;});
  var sane=act.filter(function(f){return f.fund_type==='사내';});

  function statusOf(f){
    if(f.mgmt_type==='계약종료')
      return '<span class="st st-norm">계약 종료'+(f.contract_end?' · '+esc(f.contract_end):'')+'</span>';
    if(f.mgmt_type==='기록보관')
      return '<span class="st st-norm">기록보관</span>';
    if(['설립준비','인가신청','등기진행'].indexOf(f.status)>=0)
      return '<span class="st st-build">설립 진행 중</span>';
    if(f.report_done) return '<span class="st st-ok">'+S.year+'년 보고 완료</span>';
    var p=[];
    if(f.report_due&&f.report_due<today) p.push('<span class="st st-bad">보고기한 지남</span>');
    if(f.warn_missing>0) p.push('<span class="st st-warn">사업장 누락 '+f.warn_missing+'</span>');
    if(f.role_expiring>0) p.push('<span class="st st-warn">임원 임기 '+f.role_expiring+'</span>');
    return p.length?p.join(' '):'<span class="st st-norm">정상</span>';
  }
  function rows(list){
    return list.map(function(f,i){
      return '<tr onclick="go(\'fund\',\''+f.fund_id+'\')">'
        +'<td class="no">'+(i+1)+'</td>'
        +'<td style="font-weight:700">'+esc(f.name)
        +(f.mgmt_type==='자문'?' <span class="muted" style="font-weight:500">(자문)</span>':'')+'</td>'
        +'<td>'+esc(f.manager||'—')+'</td>'
        +'<td class="num">'+(f.site_count||'—')+'</td>'
        +'<td>'+statusOf(f)+'</td></tr>';
    }).join('');
  }
  var THEAD='<thead><tr><th style="width:44px">번호</th><th>기금명</th>'
    +'<th style="width:140px">담당</th><th style="width:92px" class="num">참여사업장</th>'
    +'<th style="width:240px">상태</th></tr></thead>';
  function section(title,list){
    return '<div class="panel">'
      +'<h2 style="margin-bottom:12px">'+title+' <span class="muted" style="font-weight:500">'+list.length+'개</span></h2>'
      +(list.length
        ?'<div class="tblwrap" style="max-height:none;border:none"><table>'+THEAD
         +'<tbody>'+rows(list)+'</tbody></table></div>'
        :'<div class="muted">기금이 없습니다.</div>')
      +'</div>';
  }
  // 지역공동: 지역(충남/경기)별 소그룹, 각 지역 1번부터 넘버링(=호수 정렬)
  function regionSection(list){
    var by={};
    list.forEach(function(f){ (by[f.region]=by[f.region]||[]).push(f); });
    var pri={'충남':1,'경기':2};
    var order=Object.keys(by).sort(function(a,b){return (pri[a]||9)-(pri[b]||9)||a.localeCompare(b,'ko');});
    var inner=order.map(function(rg){
      return '<div style="margin-top:10px"><div class="muted" style="font-weight:700;margin-bottom:6px">'
        +esc(rg)+'지역 <span style="font-weight:500">'+by[rg].length+'개</span></div>'
        +'<div class="tblwrap" style="max-height:none;border:none"><table>'+THEAD
        +'<tbody>'+rows(by[rg])+'</tbody></table></div></div>';
    }).join('');
    return '<div class="panel">'
      +'<h2 style="margin-bottom:4px">지역공동근로복지기금 <span class="muted" style="font-weight:500">'+list.length+'개</span></h2>'
      +'<div class="muted" style="font-size:11.5px;margin-bottom:6px">지자체 출연·호수 관리 (충남·경기)</div>'
      +(list.length?inner:'<div class="muted">기금이 없습니다.</div>')+'</div>';
  }
  var rs=d.report_summary||{overdue:[],done:0,operating:0};
  var notice=(rs.overdue.length&&!q&&!mf)
    ?'<div class="warnbox" style="background:var(--danger-soft);border-color:#f3c1bc;color:var(--danger)">'
     +S.year+'년 운영상황보고 기한이 지난 기금이 <b>'+rs.overdue.length+'개</b> 있습니다. (기한: '+(S.year+1)+'-03-31)</div>'
    :'';
  var head='<div class="row" style="margin-bottom:14px">'
    +'<input class="search" placeholder="기금명·담당자 검색" value="'+esc(S.q0||'')+'" oninput="S.q0=this.value;renderDash()">'
    +'<select onchange="S.mgrFilter=this.value;renderDash()" style="padding:6px 10px;border:1px solid #d6dae3;border-radius:8px;font-size:12.5px">'
    +'<option value="">담당: 전체</option>'
    +(d.staff||[]).map(function(nm){return '<option'+(mf===nm?' selected':'')+'>'+esc(nm)+'</option>';}).join('')
    +'</select><span style="flex:1"></span>'
    +'<button onclick="seedAllAnnual()" title="운영 중 기금 전체에 올해 연간 일정 생성">📅 '+S.year+' 연간일정 생성</button></div>';
  var archHtml='';
  if(arch.length){
    archHtml='<div class="panel">'
      +'<h2 style="color:var(--sub);cursor:pointer;font-weight:600" onclick="S.showArch=!S.showArch;renderDash()">'
      +(S.showArch?'▾':'▸')+' 계약 종료 · 지난 기금 <span class="muted" style="font-weight:500">'+arch.length+'개</span></h2>'
      +(S.showArch?'<div class="tblwrap" style="max-height:none;border:none;margin-top:10px"><table><tbody>'+rows(arch)+'</tbody></table></div>':'')
      +'</div>';
  }
  // ── 업무 진행 패널 (B안 보드를 홈에 병합, 접기 가능) ──
  var bp='';
  if(S.board){
    var b=S.board;
    var pills=BOARD_JOBS.map(function(j){
      return '<span class="tab'+(S.job===j[0]?' on':'')+'" onclick="switchJob(\''+j[0]+'\')">'+j[1]+'</span>';
    }).join('');
    var cols=b.stages.map(function(st,idx){
      var list=mf?st.funds.filter(function(x){return (x.manager||'').indexOf(mf)>=0;}):st.funds;
      var last=idx===b.stages.length-1;
      var chips=list.map(function(x){
        return '<div class="fchip'+(x.warn?' fwarn':'')+(last?' fdone':'')
          +'" onclick="openChip(\''+x.fund_id+'\',\''+b.tab+'\')">'+esc(x.short_name)
          +'<small>'+esc(x.manager||'')+(x.detail?' · '+esc(x.detail):'')+'</small></div>';
      }).join('');
      return '<div class="bcol"><h4>'+esc(st.key)+' <span class="cnt">'+list.length+'</span></h4>'
        +(chips||'<div class="bempty">—</div>')+'</div>';
    }).join('');
    bp='<div class="panel">'
      +'<div class="row" style="cursor:pointer;user-select:none" onclick="S.showBoard=!S.showBoard;renderDash()">'
      +'<h2>'+(S.showBoard?'▾':'▸')+' 업무 진행 <span class="muted" style="font-weight:500">'
      +esc(b.title)+' · 완료 '+b.done+'/'+b.total+'</span></h2></div>'
      +(S.showBoard
        ?'<div class="row" style="margin:10px 0 6px"><div class="tabs" style="margin:0">'+pills+'</div></div>'
         +'<div class="board">'+cols+'</div>'
         +'<div class="muted" style="margin-top:6px">칩을 누르면 그 기금의 처리 화면으로 바로 이동합니다. 주황 = 확인 필요.</div>'
        :'');
  }
  // ── 오늘 할 일 요약 (3안, 최상단) ──
  var todoHtml='';
  if(S.todo){
    var lvl={bad:'st-bad',warn:'st-warn',norm:'st-norm',acc:'st-build',ok:'st-ok'};
    var its=(S.todo.items||[]);
    todoHtml='<div class="panel" style="border-left:3px solid var(--acc)">'
      +'<div class="row" style="margin-bottom:'+(its.length?'10px':'0')+'">'
      +'<h2>☀️ 오늘 할 일 <span class="muted" style="font-weight:500">'+esc(S.todo.date)+'</span></h2></div>'
      +(its.length
        ?'<div style="display:flex;flex-direction:column;gap:7px">'
         +its.map(function(t){
            var click=t.go? (t.go.indexOf('board:')===0
              ?'onclick="switchJob(\''+t.go.split(':')[1]+'\');S.showBoard=true;renderDash();document.querySelector(\'.board\')&&document.querySelector(\'.board\').scrollIntoView({behavior:\'smooth\',block:\'center\'})" style="cursor:pointer"'
              :'onclick="go(\''+t.go+'\')" style="cursor:pointer"') : '';
            return '<div class="todo-line" '+click+'>'
              +'<span style="font-size:15px">'+t.icon+'</span>'
              +'<span class="st '+(lvl[t.level]||'st-norm')+'">'+esc(t.text)+'</span>'
              +(t.go?'<span class="muted" style="margin-left:auto">→</span>':'')+'</div>';
          }).join('')
         +'</div>'
        :'<div class="muted">특이사항 없음 — 처리할 일이 없습니다 👍</div>')
      +'</div>';
  }
  // ── 하위 대시보드 탭 ──
  var ht=S.homeTab||'board';
  var htabs=[['board','🗂 업무 진행'],['region','🏛 지역공동 '+gongRegion.length],
             ['indiv','🤝 개별공동 '+gongIndiv.length],['sane','🏢 사내 '+sane.length]];
  var tabbar='<div class="tabs" style="margin-bottom:14px">'
    +htabs.map(function(t){return '<span class="tab'+(ht===t[0]?' on':'')
      +'" onclick="S.homeTab=\''+t[0]+'\';renderDash()">'+t[1]+'</span>';}).join('')+'</div>';
  var tabContent =
      ht==='board'   ? (bp||'<div class="panel muted">업무 진행 데이터를 불러오는 중…</div>')
    : ht==='region'  ? regionSection(gongRegion)
    : ht==='indiv'   ? section('개별공동근로복지기금', gongIndiv)
    : ht==='sane'    ? section('사내근로복지기금', sane)
    : '';
  // 업무 진행 탭에서는 보드가 항상 펼쳐지도록
  if(ht==='board') S.showBoard=true;
  document.getElementById('app').innerHTML =
    head + todoHtml + notice + tabbar + tabContent
    + (ht!=='board'?archHtml:'');
}
function switchJob(j){
  S.job=j;
  api('/api/board?job='+j+'&year='+S.year).then(function(d){ S.board=d; renderDash(); });
}

  api('/api/annual/seed-all?year='+S.year,{method:'POST'})
    .then(function(d){ toast('📅 '+d.seeded_funds+'개 기금 '+S.year+'년 연간일정 생성'); refresh(); });

// ═══ 기금 상세 ═══
var COLS = [
  {k:'seq_label', t:'연번', master:1, w:'52px'},
  {k:'name', t:'상호', master:1},
  {k:'biz_no', t:'사업자번호', master:1, mono:1},
  {k:'ceo', t:'대표자', master:1},
  {k:'address', t:'소재지', master:1},
  {k:'biz_type', t:'업종', master:1},
  {k:'employees', t:'근로자수', year:1, num:1},
  {k:'worker_rep', t:'근로자대표', year:1},
  {k:'contribution', t:'출연액(원)', year:1, num:1},
  {k:'contact', t:'담당자', virtual:1},
  {k:'note', t:'비고', master:1}
];

function roleTag(role){ var m={'출연지자체':'rt-1','지원기관':'rt-2','위탁기관':'rt-3','수탁기관':'rt-4'};
  return '<span class="role-tag '+(m[role]||'rt-3')+'">'+esc(role)+'</span>'; }

function fundInfoBar(f){
  function kv(k,v){ return '<div class="kv"><span class="k">'+k+'</span>'
    +'<span class="v'+(v?'':' miss')+'">'+esc(v||'미입력')+'</span></div>'; }
  return '<div class="kvbar">'
    +kv('인가번호',f.inka_no)+kv('인가일',f.inka_date)
    +kv('법인등록번호',f.corp_reg_no)+kv('설립등기일',f.reg_date)
    +kv('고유번호',f.tax_id_no)+kv('관할 세무서',f.tax_office)
    +kv('관할 등기소',f.registry_office)+kv('관할 노동청',f.labor_office)
    +kv('소재지',f.address)+kv('회계연도',(f.fy_start_md||'01-01')+' ~ '+(f.fy_end_md||'12-31'))
    +'</div>'
    +'<div class="muted" style="font-size:11px;margin-top:4px">※ 값은 <b>일괄수정</b> 탭에서 입력·수정합니다.</div>';
}
function agencyPanel(f){
  var groups={};
  (f.agencies||[]).forEach(function(a){ (groups[a.role]=groups[a.role]||[]).push(a); });
  var order=['출연지자체','지원기관','위탁기관','수탁기관','관할기관'];
  var lines=order.filter(function(r){return groups[r];}).map(function(r){
    var names=groups[r].map(function(a){
      var cur=(a.contacts||[]).filter(function(c){return c.is_current;})[0];
      var tip=cur?('담당 '+cur.name+(cur.phone?' '+cur.phone:'')):'담당자 미등록';
      return '<a class="aglink" title="'+esc(tip)+' (클릭: 담당자 편집)" '
        +'onclick="contactModal(\''+a.agency_id+'\',\''+esc(a.name)+'\')">'+esc(a.name)
        +(cur?' <span class="agok" title="담당 '+esc(cur.name)+'">✔</span>':'')+'</a>';
    }).join('<span class="agsep"> · </span>');
    return '<div class="agrow"><span class="agrole">'+roleTag(r)+'</span>'+names+'</div>';
  }).join('');
  return '<div class="agbar">'+(lines||'<span class="muted">등록된 관계기관 없음</span>')+'</div>';
}

function sortSites(arr){
  var k=S.sort.key; if(!k) return arr;
  var d=S.sort.dir==='asc'?1:-1;
  return arr.slice().sort(function(a,b){
    var x=a[k], y=b[k];
    if(typeof x==='number'||typeof y==='number'){ return ((x||0)-(y||0))*d; }
    return String(x||'').localeCompare(String(y||''),'ko')*d;
  });
}

function cellHtml(s,c){
  if(c.virtual){ var ct=(s.contacts||[])[0];
    var txt=ct?esc(ct.name)+(ct.mobile||ct.phone?' '+esc(ct.mobile||ct.phone):''):'';
    return '<td class="editable" onclick="contactsPrompt(\''+s.site_id+'\')" title="클릭하여 담당자 편집">'
      +(txt||'<span class="empty-cell">+ 지정</span>')+'</td>'; }
  var v=s[c.k];
  var disp=(v===null||v===undefined||v==='')?'<span class="empty-cell">+ 입력</span>'
    :(c.num?Number(v).toLocaleString():esc(v));
  var cls='editable'+(c.num?' num':'')+(c.mono?' num':'');
  var warn=(c.k==='employees'&&s.warn_jump)?' style="color:#b45309;font-weight:700" title="전년 '+s.prev_employees+'명 → 급변동 확인"':'';
  return '<td class="'+cls+'"'+warn+' onclick="startEdit(event,\''+s.site_id+'\',\''+c.k+'\')">'+disp+'</td>';
}

function fundTab(t){ S.fundTab=t; if(t==='docs') S.docs=null; if(t==='closing') S.closing=null;
  if(t==='welfare'){ S.welfare=null; S.openProg=null; } if(t==='annual') S.annual=null;
  if(t==='ops') S.ops=null; if(t==='est') S.est=null; renderFund(); }
function loadDocs(){
  Promise.all([
    api('/api/funds/'+S.fundId+'/documents'+(S.docKind?'?kind='+encodeURIComponent(S.docKind):'')),
    api('/api/funds/'+S.fundId+'/uploads')
  ]).then(function(rs){ S.docs=rs[0].docs; S.docCounts=rs[0].counts;
    S.uploads=rs[1].uploads; S.scanKinds=rs[1].kinds; renderFund(); });
}

function renderFund(){
  var f=S.fund;
  document.getElementById('crumb').textContent=(f.short_name||f.name)+' · '+S.year+'년';
  var estMode=['설립준비','인가신청','등기진행'].indexOf(f.status)>=0;
  if(estMode&&S.fundTab==='annual') S.fundTab='est';
  // 4영역 그룹: 기본 / 설립(1회) / 연간 운영 / 수시
  var G_BASE='기본', G_EST='설립 · 1회', G_YEAR='연간 운영 · '+S.year, G_ADHOC='수시';
  var tabs=[
    ['profile','기금 정보',G_BASE],
    ['docs','문서철',G_BASE],
    ['est',estMode?'🏗 설립 진행':'설립·등기 이력',G_EST,estMode?['진행','#dbeafe','#1e40af']:['완료','#e7f6ee','#1f7a4d']],
    ['annual','연간 일정',G_YEAR],
    ['sites','참여사업장',G_YEAR]
  ];
  if(f.fund_type==='공동') tabs.push(['subsidy','지원금',G_YEAR]);
  tabs.push(['closing','회계·결산',G_YEAR]);
  tabs.push(['welfare','목적사업·대부',G_YEAR]);
  tabs.push(['events','변경 이벤트',G_ADHOC,S._evtOpen?['진행 '+S._evtOpen,'#fff7ed','#b45309']:null]);
  tabs.push(['ops','운영 서류',G_ADHOC]);
  tabs.push(['gen','서류 생성',G_ADHOC]);
  S._fundTabs=tabs; updateSide();          // 탭은 좌측 사이드바에 표시
  var tabbar='';
  var content=S.fundTab==='sites'?buildSites():S.fundTab==='docs'?buildDocs()
    :S.fundTab==='profile'?buildProfile():S.fundTab==='subsidy'?buildSubsidy()
    :S.fundTab==='closing'?buildClosing():S.fundTab==='welfare'?buildWelfare()
    :S.fundTab==='annual'?buildAnnual():S.fundTab==='ops'?buildOps()
    :S.fundTab==='events'?buildEvents():S.fundTab==='est'?buildEst():buildGen();
  if(S.fundTab==='closing'&&S.closing===null) loadClosing();
  if(S.fundTab==='welfare'&&S.welfare===null) loadWelfare();
  if(S.fundTab==='annual'&&S.annual===null) loadAnnual();
  if(S.fundTab==='ops'&&S.ops===null) loadOps();
  if(S.fundTab==='est'&&S.est===null) loadEst();
  document.getElementById('app').innerHTML =
    '<div class="panel"><div class="row">'
    +'<button onclick="go(\'dash\')">← 기금 현황</button>'
    +'<h2>'+esc(f.name)+'</h2>'
    +'<span class="badge '+(f.fund_type==='공동'?'b-gongdong':'b-sane')+'">'+f.fund_type+'</span>'
    +(estMode?'<span class="badge" style="background:#dbeafe;color:#1e40af">🏗 '+esc(f.status)+'</span>':'')
    +'<span class="stat" style="cursor:pointer" onclick="staffModal()" title="클릭하여 담당 변경 (이력 보존)">👤 '+esc(f.manager||'담당 미지정')+'</span>'
    +(f.mgmt_type==='계약종료'
      ?'<span class="st st-norm">계약 종료'+(f.contract_end?' · '+esc(f.contract_end):'')+'</span>'
       +'<button onclick="doContract(\'resume\')">계약 재개</button>'
      :(f.mgmt_type!=='기록보관'?'<button onclick="contractModal()" title="계약·연락 종료 처리 (데이터 보존)">계약 종료</button>':''))
    +'</div>'
    +(estMode?'':'<div style="margin-top:12px">'+cycleStepper()+'</div>')
    +'<div style="margin-top:12px">'+fundInfoBar(f)+'</div>'
    +eventBanner()
    +'<div style="margin-top:10px">'+agencyPanel(f)+'</div></div>'
    +'<div class="panel">'+tabbar+content+'</div>';
  if(S.fundTab==='docs'&&S.docs===null) loadDocs();
  if(S.cycle===null&&!estMode&&!S._loadingCycle){ S._loadingCycle=true; loadCycle(); }
  if(S.events===null&&!S._loadingEvents){ S._loadingEvents=true; loadEvents(); }
}

// ── 연간 사이클 스테퍼 (상단) ──
function cycleStepper(){
  var c=S.cycle;
  if(!c) return '<div class="muted" style="font-size:12px">사이클 확인 중…</div>';
  var parts=c.steps.map(function(s,i){
    var t=(s.detail&&s.state!=='done')?' title="'+esc(s.detail)+'"':'';
    return (i?'<span class="sep"></span>':'')
      +'<span class="stp '+s.state+'"'+t+' onclick="fundTab(\''+s.tab+'\')">'
      +(s.state==='done'?'✓ ':'')+esc(s.label)+'</span>';
  }).join('');
  return '<div class="cyc">'+parts+'</div>';
}
function loadCycle(){
  api('/api/funds/'+S.fundId+'/cycle?year='+S.year).then(function(c){
    S.cycle=c; S._loadingCycle=false; updateHeaderOnly(); });
}
// 헤더 영역만 다시 그리면 탭 콘텐츠 재요청 없이 스테퍼/배너 갱신
function updateHeaderOnly(){ if(S.view==='fund'&&S.fund) renderFund(); }

// ── 진행 중 변경 이벤트 배너 ──
function eventBanner(){
  var ev=S.events;
  if(!ev) return '';
  var open=ev.filter(function(e){return e.status==='진행';});
  S._evtOpen=open.length||null;
  if(!open.length) return '';
  return open.map(function(e){
    var p=e.progress;
    return '<div class="evt-banner" onclick="fundTab(\'events\')">🔄 변경 이벤트 진행 중 — '
      +esc(e.kind_label)+' · '+esc(e.title)+' <b>('+p.done+'/'+p.total+' 단계)</b></div>';
  }).join('');
}
function loadEvents(){
  api('/api/funds/'+S.fundId+'/events').then(function(r){
    S.events=r.events; S.eventKinds=r.kinds; S._loadingEvents=false;
    S._evtOpen=r.events.filter(function(e){return e.status==='진행';}).length||null;
    renderFund(); });
}

// ── 탭: 변경 이벤트 (수시) ──
function buildEvents(){
  var f=S.fund, ev=S.events||[], kinds=S.eventKinds||[];
  var gong=f.fund_type==='공동';
  var opts=kinds.filter(function(k){return !k.gong||gong;})
    .map(function(k){return '<option value="'+k.key+'">'+esc(k.label)+'</option>';}).join('');
  var form='<div class="row" style="gap:8px;align-items:flex-end;margin-bottom:14px">'
    +'<div><div class="muted" style="font-size:11px;margin-bottom:3px">변경 유형</div>'
    +'<select id="evt-kind" class="sel" style="min-width:150px">'+opts+'</select></div>'
    +'<div style="flex:1"><div class="muted" style="font-size:11px;margin-bottom:3px">제목(선택)</div>'
    +'<input id="evt-title" placeholder="예: 정관 제5조 목적사업 추가" '
    +'style="width:100%;padding:7px 10px;border:1px solid #d6dae3;border-radius:8px;font-size:13px"></div>'
    +'<button class="primary" onclick="createEvent()">+ 변경 이벤트 시작</button></div>'
    +'<div class="muted" style="font-size:12px;margin-bottom:14px">유형을 고르면 처리 체크리스트가 자동으로 만들어집니다. '
    +'단계마다 관련 서식(인가·등기·스캔 보관)이 안내됩니다.</div>';
  if(!ev.length) return '<h3 style="margin:2px 0 12px">변경 이벤트</h3>'+form
    +'<div class="muted" style="padding:14px 0">아직 등록된 변경 이벤트가 없습니다. 정관변경·임원변경·사업장 탈퇴·주소 이전·해산 등을 여기서 관리하세요.</div>';
  var cards=ev.map(function(e){
    var p=e.progress, done=e.status==='완료';
    var steps=e.steps.map(function(s,i){
      var act=stepAction(s.label);
      var actBtn=act?'<button class="evt-go" onclick="'+act.onclick+'" title="'+esc(act.tip||act.text)+'">'+esc(act.text)+' →</button>':'';
      return '<div class="evt-step'+(s.done?' done':'')+'">'
        +'<input type="checkbox"'+(s.done?' checked':'')+(done?' disabled':'')
        +' onchange="toggleStep(\''+e.event_id+'\','+i+',this.checked)">'
        +'<span style="flex:1">'+esc(s.label)+'</span>'+actBtn+'</div>';
    }).join('');
    var st=done?'<span class="st st-ok">완료'+(e.done_date?' · '+esc(e.done_date):'')+'</span>'
      :'<span class="st st-warn">진행 중 '+p.done+'/'+p.total+'</span>';
    return '<div class="panel" style="border-left:3px solid '+(done?'#c8d0dc':'#f59e0b')+';margin-bottom:12px">'
      +'<div class="row"><b style="font-size:14px">'+esc(e.kind_label)+'</b>'
      +'<span class="muted">'+esc(e.title)+'</span>'+st
      +'<span class="muted" style="font-size:11px">시작 '+esc(e.started_date||'—')+'</span>'
      +'<span style="margin-left:auto"></span>'
      +(done?'<button onclick="setEventStatus(\''+e.event_id+'\',\'진행\')">되돌리기</button>'
        :'<button class="primary" onclick="setEventStatus(\''+e.event_id+'\',\'완료\')">완료 처리</button>')
      +'<button class="warn" onclick="delEvent(\''+e.event_id+'\')">삭제</button></div>'
      +'<div style="margin-top:10px">'+steps+'</div></div>';
  }).join('');
  return '<h3 style="margin:2px 0 12px">변경 이벤트</h3>'+form+cards;
}
// 변경 이벤트 단계 → 관련 화면 바로가기 (라벨 키워드 감지)
function stepAction(label){
  var L=label||'';
  if(L.indexOf('스캔 보관')>=0) return {onclick:"fundTab('docs')",text:'스캔 보관',tip:'문서철 탭에서 스캔 서류 업로드'};
  if(L.indexOf('참여사업장')>=0) return {onclick:"fundTab('sites')",text:'참여사업장',tip:'참여사업장 탭'};
  if(L.indexOf('일괄수정')>=0||L.indexOf('기본정보')>=0||L.indexOf('소재지 수정')>=0||L.indexOf('소재지 변경등기')>=0) return {onclick:"fundTab('profile')",text:'기금 정보',tip:'기금 정보(일괄수정) 탭'};
  if(L.indexOf('정관 버전')>=0||L.indexOf('임원 명부')>=0||L.indexOf('임원 명부 갱신')>=0||L.indexOf('회의록')>=0||L.indexOf('의결')>=0||L.indexOf('운영 서류')>=0) return {onclick:"fundTab('ops')",text:'운영 서류',tip:'운영 서류 탭(회의록·정관 버전·임원 명부)'};
  if(L.indexOf('취임승낙서')>=0||L.indexOf('등기서류')>=0||L.indexOf('등기 신청')>=0||L.indexOf('변경등기')>=0||L.indexOf('청산종결등기')>=0||L.indexOf('해산등기')>=0) return {onclick:"fundTab('gen')",text:'서류 생성',tip:'서류 생성 탭(등기 서식)'};
  if(L.indexOf('별지')>=0||L.indexOf('인가신청')>=0||L.indexOf('통지서')>=0) return {onclick:"go('forms')",text:'서식 자료실',tip:'서식 자료실(공식 법정서식 원본·미리보기)'};
  if(L.indexOf('기록 보관 전환')>=0) return {onclick:"contractModal&&contractModal()",text:'계약/보관',tip:'헤더의 계약 종료로 기록 보관 전환'};
  return null;
}
function createEvent(){
  var kind=document.getElementById('evt-kind').value;
  var title=document.getElementById('evt-title').value.trim();
  fetch('/api/funds/'+S.fundId+'/events',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:kind,title:title})})
    .then(function(r){return r.json();})
    .then(function(){ toast('✅ 변경 이벤트를 시작했습니다'); S.events=null; S.cycle=null; loadEvents(); });
}
function toggleStep(eid,i,done){
  fetch('/api/funds/'+S.fundId+'/events/'+eid,{method:'PATCH',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({step_index:i,step_done:done})})
    .then(function(){ S.events=null; loadEvents(); });
}
function setEventStatus(eid,status){
  fetch('/api/funds/'+S.fundId+'/events/'+eid,{method:'PATCH',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({status:status})})
    .then(function(){ toast(status==='완료'?'✅ 완료 처리':'되돌렸습니다'); S.events=null; loadEvents(); });
}
function delEvent(eid){
  if(!confirm('이 변경 이벤트를 삭제할까요?')) return;
  fetch('/api/funds/'+S.fundId+'/events/'+eid,{method:'DELETE'})
    .then(function(){ toast('삭제됨'); S.events=null; loadEvents(); });
}

// ── 탭 1: 참여사업장 ──
function buildSites(){
  var f=S.fund;
  var q=S.q.trim();
  var list=S.sites.filter(function(s){ if(!q) return true;
    return (s.name||'').indexOf(q)>=0||(s.biz_no||'').indexOf(q)>=0||(s.ceo||'').indexOf(q)>=0
      ||(s.address||'').indexOf(q)>=0; });
  list=sortSites(list);
  var locked=S.sites.some(function(s){return s.snap_locked;});
  var missing=S.sites.filter(function(s){return S.statusTab==='active'&&(s.employees==null||!(s.worker_rep||'').trim());}).length;
  var jumps=S.sites.filter(function(s){return s.warn_jump;}).length;

  var head=COLS.map(function(c){
    var ic=S.sort.key!==c.k?' ⇅':(S.sort.dir==='asc'?' ↑':' ↓');
    return '<th onclick="tsort(\''+c.k+'\')"'+(c.w?' style="min-width:'+c.w+'"':'')+'>'+c.t+ic+'</th>';
  }).join('');
  var closedCols='<th>탈퇴일</th><th>사유</th>';
  var body=list.map(function(s){
    var tds=COLS.map(function(c){return cellHtml(s,c);}).join('');
    var extra=S.statusTab==='closed'
      ?'<td>'+esc(s.leave_date)+'</td><td>'+esc(s.closed_reason)+(s.closed_detail?' — '+esc(s.closed_detail):'')+'</td>'
       +'<td><button onclick="reopenSite(\''+s.site_id+'\')">복구</button></td>'
      :'<td><button class="warn" style="padding:2px 8px" onclick="closeModal(\''+s.site_id+'\',\''+esc(s.name)+'\')">탈퇴</button></td>';
    return '<tr'+(s.warn_jump?' class="jump"':'')+'>'+tds+extra+'</tr>';
  }).join('');

  return ''
    +'<div class="row" style="margin-bottom:9px">'
    +'<button class="'+(S.statusTab==='active'?'primary':'')+'" onclick="S.statusTab=\'active\';refresh()">참여중 ('+S.counts.active+')</button>'
    +'<button class="'+(S.statusTab==='closed'?'primary':'')+'" onclick="S.statusTab=\'closed\';refresh()">탈퇴·폐업 ('+S.counts.closed+')</button>'
    +'</div>'
    +'<div class="row" style="margin-bottom:9px">'
    +'<input class="search" placeholder="상호·사업자번호·대표자 검색" value="'+esc(S.q)+'" oninput="S.q=this.value;renderFund()">'
    +(missing?'<span class="stat" style="background:#fffbeb;color:#b45309">누락 '+missing+'</span>':'')
    +(jumps?'<span class="stat" style="background:#fff7ed;color:#c2410c">급변동 '+jumps+'</span>':'')

    +(ups?'<div class="tblwrap" style="max-height:300px"><table><thead><tr><th>종류</th><th>파일명</th><th>서류일자</th><th>등록일</th><th></th></tr></thead><tbody>'+ups+'</tbody></table></div>'

        +esc(c.doc_kind)+' '+c.n+'</button>'; }).join('')+'</div>';

    var badge=d.status==='archive'?'<span class="badge" style="background:#e2e8f0;color:#64748b">과거자료</span>'

    return '<tr><td>'+esc(d.doc_kind)+'</td><td>'+esc(d.title)+'</td><td>'+badge+'</td>'
      +'<td class="muted" style="max-width:380px;overflow:hidden;text-overflow:ellipsis">'+esc(d.note)+'</td>'

    +chips

function uploadDoc(){
  var f=document.getElementById('up-file').files[0];
  if(!f){ toast('파일을 선택하세요'); return; }
  var kind=encodeURIComponent(document.getElementById('up-kind').value);
  var dt=encodeURIComponent(document.getElementById('up-date').value);
  var note=encodeURIComponent(document.getElementById('up-note').value);
  var fd=new FormData(); fd.append('file',f);
  toast('업로드 중…');
  fetch('/api/funds/'+S.fundId+'/documents/upload?doc_kind='+kind+'&doc_date='+dt+'&note='+note,
    {method:'POST',body:fd})
    .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});})
    .then(function(x){ if(!x.ok){ toast('⚠️ '+(x.d.detail||'실패')); return; }
      toast('⬆ 스캔 보관 완료'); S.docs=null; loadDocs(); })
    .catch(function(e){ toast('⚠️ '+e.message); });
}
function delUpload(id){
  if(!confirm('이 스캔본을 삭제할까요? (파일이 함께 삭제됩니다)')) return;
  api('/api/documents/'+id,{method:'DELETE'}).then(function(){ toast('삭제'); S.docs=null; loadDocs(); });
}

var REG_FF=['purpose','seal_person','card_count','tax_base','license_tax','edu_tax','agent_name','agent_addr'];
function saveProfileAll(){
  var f=S.fund, p=fundProfile();
  var patches=[];
  FUND_FF.concat([['address','주소'],['phone','전화'],['chairman','이사장']]).forEach(function(ff){
    var el=document.getElementById('ff-'+ff[0]); if(!el) return;
    var v=el.value.trim();
    if(v!==String(f[ff[0]]||'')) patches.push(patch('/api/funds/'+S.fundId, ff[0], v));
  });
  PROF_FF.forEach(function(pf){
    var el=document.getElementById('pf-'+pf[0]); if(!el) return;
    p[pf[0]]=el.value.trim();
  });
  p.officers=document.getElementById('pf-officers').value.split('\n')
    .map(function(l){ l=l.trim(); if(!l) return null;
      var i=l.indexOf(' '); return i<0?{role:l,name:''}:{role:l.slice(0,i),name:l.slice(i+1).trim()};})
    .filter(Boolean);
  var reg=p.reg||{};
  REG_FF.forEach(function(k){ var el=document.getElementById('rg-'+k); if(el) reg[k]=el.value.trim(); });
  p.reg=reg;
  // 연도별 예산 저장 (profile.years[연도])
  p.years=p.years||{}; var yd=p.years[String(S.year)]||{};
  YEAR_FF.forEach(function(k){ var el=document.getElementById('yf-'+k); if(el) yd[k]=el.value.trim(); });
  p.years[String(S.year)]=yd;
  Promise.all(patches)
    .then(function(){ return api('/api/funds/'+S.fundId+'/profile',{method:'PUT',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({profile:p})}); })
    .then(function(){ toast('💾 일괄 저장 완료 — 서류에 즉시 반영'); refresh(); })
    .catch(function(e){ toast('⚠️ '+e.message); });
}

function reconBox(sup){

  var rem=dec-sp;
  var col=rem>0?'#b45309':rem<0?'#b3402a':'#059669';
  return '<div class="warnbox" style="margin-top:12px;background:#f8fafc;border-color:#cbd5e1;color:#334155">'
    +'<b>정산 대사</b> — 결정액 '+dec.toLocaleString()+'원 · 집행액 '+sp.toLocaleString()+'원 · '
    +'<span style="color:'+col+';font-weight:700">'+(rem>0?'미집행(반환대상) '+rem.toLocaleString()+'원':rem<0?'과다집행 '+(-rem).toLocaleString()+'원':'정산 일치')+'</span></div>';

function saveSubsidy(){

  p.years=p.years||{}; var yd=p.years[String(S.year)]||{}; yd.subsidy=s; p.years[String(S.year)]=yd;

  api('/api/funds/'+S.fundId+'/accounts',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({bank:bank,purpose:purpose})})
    .then(function(){ toast('계좌 등록'); S.closing=null; refresh(); });
}
function importBank(inp){
  var file=inp.files&&inp.files[0]; if(!file) return;
  var acc=S.accounts[0];
  if(S.accounts.length>1){
    var names=S.accounts.map(function(a,i){return i+': '+(a.bank||'계좌')+'('+a.purpose+')';}).join('\n');
    var pick=prompt('어느 계좌의 통장인가요?\n'+names,'0');
    if(pick===null) { inp.value=''; return; }
    acc=S.accounts[parseInt(pick,10)]||S.accounts[0];
  }
  var fd=new FormData(); fd.append('file',file);
  fetch('/api/accounts/'+acc.account_id+'/import',{method:'POST',body:fd})
    .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});})
    .then(function(x){ if(!x.ok){ toast('⚠️ '+(x.d.detail||'실패')); return; }
      toast('📥 '+x.d.rows+'건 가져옴 (이체 '+x.d.transfer+'·취소 '+x.d.cancel+'·미분류 '+x.d.unclassified+')');
      S.closing=null; refresh(); })
    .catch(function(e){ toast('⚠️ '+e.message); });
  inp.value='';
}
function approveJournal(jid){
  var d=document.getElementById('jd-'+jid).value, c=document.getElementById('jc-'+jid).value;
  if(d==='?'||c==='?'){ toast('차변/대변 계정을 선택하세요'); return; }
  api('/api/journals/'+jid,{method:'PATCH',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({debit:d,credit:c,status:'approved'})})
    .then(function(){ S.closing=null; refresh(); }).catch(function(e){ toast('⚠️ '+e.message); });

function buildAnnual(){
  if(S.annual===null) return '<div class="muted" style="padding:20px">불러오는 중…</div>';
  var a=S.annual;
  var today=new Date().toISOString().slice(0,10);
  var rows=a.tasks.map(function(t){
    var done=t.status==='done';
    var overdue=!done&&t.due_date&&t.due_date<today.slice(0,t.due_date.length);
    var dueTxt=t.due_date?(t.due_date+(overdue?' ⚠ 지남':'')):'-';
    return '<tr style="'+(done?'opacity:.6':overdue?'background:#fef2f2':'')+'">'
      +'<td><input type="checkbox" '+(done?'checked':'')+' onchange="toggleTask(\''+t.task_id+'\',this.checked)"></td>'
      +'<td class="muted">'+esc(t.period)+'</td>'
      +'<td>'+esc(t.title)+'</td>'
      +'<td style="color:'+(overdue?'#b91c1c':'#64748b')+'">'+dueTxt+'</td>'
      +'<td>'+(done?'<span class="badge b-chungnam">완료 '+esc(t.done_date||'')+'</span>':'<span class="muted">대기</span>')+'</td>'
      +'</tr>';
  }).join('');
  var pct=a.total?Math.round(a.done/a.total*100):0;

    +'<div class="row" style="margin-bottom:9px"><b>'+S.year+'년 운영 진행</b>'

    +'<div style="flex:1;max-width:280px;background:#e2e8f0;border-radius:6px;height:10px;overflow:hidden">'
    +'<div style="width:'+pct+'%;height:100%;background:#1e40af"></div></div></div>'
    +'<div class="tblwrap"><table><thead><tr><th style="width:36px">완료</th><th>시기</th><th>업무</th><th>기한</th><th>상태</th></tr></thead>'

    +'<button class="primary" onclick="addProgram()">+ 사업 등록</button></div>'

}

function addCase(pid){

  if(!amt){ toast('금액 입력'); return; }

    body:JSON.stringify({site_id:document.getElementById('wc-site').value,

      beneficiaries:parseInt(document.getElementById('wc-ben').value,10)||1, status:'paid'})})

// ═══ 인라인 편집 (pu-erp 패턴: Enter=아래, Tab=옆, Esc=취소) ═══
var EDIT_ORDER = COLS.filter(function(c){return !c.virtual;}).map(function(c){return c.k;});
function startEdit(ev,siteId,field){
  var td=ev.currentTarget;
  var col=COLS.find(function(c){return c.k===field;});
  var s=S.sites.find(function(x){return x.site_id===siteId;});
  if(!s) return;
  var cur=s[field]; cur=(cur===null||cur===undefined)?'':String(cur);
  td.innerHTML='<input class="cell-input" value="'+esc(cur)+'">';
  var inp=td.querySelector('input'); inp.focus(); inp.select();
  function commit(next){
    var v=inp.value.trim();
    var isYear=!!col.year;
    patch('/api/sites/'+siteId, field, v===''?null:v, isYear?S.year:undefined)
      .then(function(){ s[field]=(col.num&&v!=='')?parseInt(v.replace(/[^0-9-]/g,''),10):v;
        renderFund(); if(next) next(); })
      .catch(function(e){ toast('⚠️ '+e.message); renderFund(); });
  }
  inp.onblur=function(){ commit(); };
  inp.onkeydown=function(e){
    if(e.key==='Enter'){ e.preventDefault(); inp.onblur=null;
      commit(function(){ // 같은 필드, 다음 행
        var vis=Array.prototype.slice.call(document.querySelectorAll('tbody tr'));
        var idx=S.sites.indexOf(s); var nxt=S.sites[idx+1];
        if(nxt) setTimeout(function(){ clickCell(nxt.site_id, field); },30); }); }
    else if(e.key==='Escape'){ inp.onblur=null; renderFund(); }
    else if(e.key==='Tab'){ e.preventDefault(); inp.onblur=null;
      var dir=e.shiftKey?-1:1; var fi=EDIT_ORDER.indexOf(field)+dir;
      commit(function(){ if(fi>=0&&fi<EDIT_ORDER.length)
        setTimeout(function(){ clickCell(siteId, EDIT_ORDER[fi]); },30); }); }
  };
}
function clickCell(siteId,field){
  var rows=document.querySelectorAll('tbody tr');
  var colIdx=COLS.findIndex(function(c){return c.k===field;});
  for(var i=0;i<rows.length;i++){
    var tds=rows[i].querySelectorAll('td');
    if(tds[colIdx] && tds[colIdx].onclick && rows[i].innerHTML.indexOf(siteId)<0){ }
  }
  // 단순 재탐색: 셀 onclick 문자열 매칭
  var all=document.querySelectorAll('td.editable');
  for(var j=0;j<all.length;j++){
    var oc=all[j].getAttribute('onclick')||'';
    if(oc.indexOf(siteId)>=0 && oc.indexOf("'"+field+"'")>=0){ all[j].click(); return; }
  }
}

// 엑셀 가져오기 + 검증 리포트
function importXlsx(inp){
  var f=inp.files&&inp.files[0]; if(!f) return;
  var fd=new FormData(); fd.append('file',f);
  fetch('/api/funds/'+S.fundId+'/sites/import?year='+S.year,{method:'POST',body:fd})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.ok){ toast('⚠️ '+(d.detail||'가져오기 실패')); return; }
      var html='<h3>📤 '+S.year+'년 갱신 결과</h3>'
        +'<div class="row" style="margin-bottom:8px"><span class="stat">매칭 '+d.matched+'</span>'
        +'<span class="stat">신규 '+d.created+'</span></div>';
      if(d.warn_jumps.length) html+='<div class="warnbox"><b>급변동 ±50% ('+d.warn_jumps.length+')</b><br>'+d.warn_jumps.map(esc).join('<br>')+'</div>';
      if(d.warn_missing.length) html+='<div class="warnbox"><b>근로자수/대표 누락 ('+d.warn_missing.length+')</b><br>'+d.warn_missing.slice(0,15).map(esc).join(', ')+(d.warn_missing.length>15?' …':'')+'</div>';
      if(d.new_names.length) html+='<div class="warnbox" style="background:#eff6ff;border-color:#93c5fd;color:#1e40af"><b>신규 추가 ('+d.new_names.length+')</b><br>'+d.new_names.slice(0,15).map(esc).join(', ')+'</div>';
      html+='<div class="row" style="justify-content:flex-end"><button class="primary" onclick="closeM();refresh()">확인</button></div>';
      showModal(html);
    })
    .catch(function(e){ toast('⚠️ '+e.message); });
  inp.value='';
}

var PORTAL_URL='https://nabaho.github.io/pureunall/enter.html';
(function initPortalBar(){
  try{
    var qs=new URLSearchParams(location.search);
    var user=qs.get('user')||qs.get('u')||'';
    var role=qs.get('role')||'';
    var el=document.getElementById('topuser');
    if(el) el.innerHTML = user
      ? esc(user)+(role?'<span class="role">'+esc(role)+'</span>':'')
      : '푸른노무법인<span class="role">기금 운영</span>';
  }catch(e){}
  var WD=['일','월','화','수','목','금','토'];
  function p(n){ return (n<10?'0':'')+n; }
  function tick(){
    var c=document.getElementById('topclock'); if(!c) return;
    var d=new Date();
    c.textContent=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())
      +' ('+WD[d.getDay()]+') '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  }
  tick(); setInterval(tick,1000);
})();
function doLogout(){
  if(!confirm('푸른 포털로 나가시겠어요?\n입력한 내용은 서버에 그대로 보관됩니다.')) return;
  location.href=PORTAL_URL;
}
