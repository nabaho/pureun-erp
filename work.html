      return '<span class="mgt sub'+(hi.indexOf(n)>=0?' hi':'')+'">'+esc(n)+'</span>'; }).join('')+'</div>';
  }
  // 「N일 전」 — 마지막 기록이 얼마나 묵었는지는 날짜보다 이 말이 빨리 읽힌다
  function agoTxt(d){
    var n=_dayDiff(today,d);
    if(n<=0) return '오늘'; if(n===1) return '어제';
    if(n<7) return n+'일 전';
    if(n<28) return Math.floor(n/7)+'주 전';
    return Math.floor(n/30)+'개월 전';
  }
  function rowsOf(arr,perGroup){
    return arr.map(function(it,i){
      var logs=wkLogsOf(it._id,wk);
      var ld=(it.last&&it.last.d)||'';
      var isStale=ld&&_dayDiff(today,ld)>=14;
      /* 기록 한 열 — 이 주에 쓴 게 있으면 그것을, 없으면 마지막 기록을 흐리게.
         「누가 이 주에 뭘 했나」와 「어떤 게 밀려 있나」가 한 열에서 갈린다. */
      var logHtml;
      if(logs.length){
        logHtml=logs.map(function(l){
          return '<div class="wklog cur"><span class="d">'+esc(md(l.d))+'</span>'+esc(l.t)
            +(l.ed_at?' <span class="ed">(수정)</span>':'')+logBtns(it._id,l)+'</div>'; }).join('');
      }else if(it.last){
        logHtml='<div class="wklog old'+(isStale?' stale':'')+'" title="이 주에는 기록이 없습니다 — 마지막 기록입니다">'
          +'<span class="d">'+esc(md(ld))+'</span>'+esc(it.last.t)
          +'<span class="ago"> · '+esc(agoTxt(ld))+'</span></div>';
      }else{
        logHtml='<span class="muted" style="font-size:12px">기록 없음</span>';
      }
      var nx=it.next&&it.next.text?ddayHTML(it.next.date,it.next.text):(it.due?ddayHTML(it.due,'기한'):'<span class="muted">—</span>');
      nx += sdueHTML(it);   // 단계 기한은 가리지 않고 아래에 나란히 붙인다
      return '<tr data-i="'+esc(it._id)+'">'+tdNo(i+1)+colTD('team','cat',catBadge(it.cat))
        // 한 건이 한 줄로 끝나게 — 의뢰인 담당자를 아래로 쌓지 않고 옆에 붙인다
        +'<td class="itc" onclick="openDrawer(\''+it._id+'\')"><span class="co">'+esc(it.company||it.client||'—')+'</span>'
        // 업무명 열을 접으면 진행률이 갈 곳이 없으므로 여기로 온다
        +(colHidden('team','pt')?' '+stepChip(it._id):'')
        +(it.officer?'<span class="ofc">'+esc(it.officer)+'</span>':'')+'</td>'
        // 주담당 열 — 평면일 때만. 걸러 보기로 고른 이름에는 테두리를 둘러 둔다.
        +(showMain?'<td>'+mgrCell((it.mgr_main&&it.mgr_main.name)||'',fSel('team','mgr'))+'</td>':'')
        +colTD('team','sub',subCell(it))
        +colTD('team','pt',nameCell(it)+stepChip(it._id)+peFlag(it),'class="tkc"')
        // 상태 — 남의 업무라 눌러서 바꾸지는 않는다(보기만)
        +colTD('team','st',stChip(it.status||'진행중')+peStChip(it))
        +colTD('team','log',logHtml)+colTD('team','due',nx)
        +'<td style="text-align:center"><button class="endbtn" onclick="event.stopPropagation();completeItem(\''+escJ(it._id)+'\')" '
        +'title="이 업무를 끝내고 종료 화면으로 옮깁니다'+(peLinked(it)?' (푸른이알피 종료 연동)':'')+'">종료'
        +(peLinked(it)?'<span class="lk">🔗</span>':'')+'</button></td></tr>';
    }).join('');
  }
  var shown=0;
  if(S.teamFlat){                                    // 평면 보기 — 한 표로 정렬
    var flat=open.filter(pass); flat=teamSortArr(flat,wk); shown=flat.length;
    h+=rowsOf(flat,false);
  }else{
    names.forEach(function(nm){
      var arr=groups[nm].filter(pass);       // 담당 조건도 깔때기가 본다 — 여기서 또 거르지 않는다
      if(!arr.length) return;
      shown+=arr.length;
      var rec=groups[nm].filter(function(it){return wkLogsOf(it._id,wk).length>0;}).length;
      var fold=!!(S.teamFold||{})[nm];
      h+='<tr class="grp-h" style="cursor:pointer" onclick="teamFold(\''+escJ(nm)+'\')" '
        +'title="'+(fold?'펼치기':'접기')+' — 이 줄을 누르세요"><td colspan="'+TCOLS+'">'
        +'<span class="fold">'+(fold?'▸':'▾')+'</span> 👤 '+esc(nm)+' — 진행 '+groups[nm].length+'건'
        +(arr.length!==groups[nm].length?' <span class="muted" style="font-weight:600">(조건 '+arr.length+'건)</span>':'')
        +' <span class="pct">이 주 기록 '+rec+'/'+groups[nm].length+'</span></td></tr>';
      if(!fold) h+=rowsOf(teamSortArr(arr,wk),true);
    });
  }
  if(!shown) h+='<tr><td colspan="'+TCOLS+'" class="moremark">조건에 맞는 업무가 없습니다. 열 이름을 눌러 조건을 바꿔 보세요.</td></tr>';
  h+='</tbody></table></div>';
  h+='<div class="muted" style="font-size:12px;margin-top:8px">'
    +(anyF?'조건에 맞는 업무 '+shown+' / 전체 '+open.length+'건'
        +' <span class="chipbtn" onclick="teamReset()" title="걸러 보기를 모두 해제합니다">✕ 조건 해제</span>'
       :'진행 중 '+open.length+'건')+'</div>';
  app.innerHTML=h+splitClose();
  if(S.fPop) fPopPos();
  if(S.colPop) colPopPos();
  calAfter();
  arFit();                      // 표를 창 아래까지 — 종료 화면과 같은 규칙
}
function teamSort(k){ if((S.teamSort||'due')===k) S.teamDesc=!S.teamDesc; else { S.teamSort=k; S.teamDesc=false; } renderTeam(); }
function teamSortArr(arr,wk){
  var k=S.teamSort||'due', dir=S.teamDesc?-1:1;
  function key(it){
    if(k==='cat') return it.cat||'';
    if(k==='co') return it.company||it.client||'';
    // 부담당 없는 건은 뒤로 — 이름 순으로 볼 때 빈 줄이 앞에 몰리면 읽기 나쁘다
    if(k==='sub'){ var ss=mgrSubNames(it); return ss.length?ss.slice().sort().join(','):'힣'; }
    if(k==='title') return it.title||'';
    /* 기록 열 정렬 — 이 주에 쓴 게 없는 것부터, 그중에서도 오래 묵은 것부터 위로.
       밀린 일을 찾는 게 이 열을 정렬하는 이유다. */
    if(k==='log') return (wkLogsOf(it._id,wk).length?'1':'0')+((it.last&&it.last.d)||'0000-00-00');
    return itemDue(it)||'9999-99-99';            // 기한 없는 건은 뒤로
  }
  return arr.slice().sort(function(a,b){
    var r=String(key(a)).localeCompare(String(key(b)),'ko');
    return (r||String(a.no||'').localeCompare(String(b.no||''),'en',{numeric:true}))*dir;
  });
}
function teamFold(nm){ S.teamFold=S.teamFold||{}; S.teamFold[nm]=!S.teamFold[nm]; renderTeam(); }
// 담당자 이름 목록 — 화면의 묶음과 [모두 접기]가 같은 목록을 써야 개수가 어긋나지 않는다
function teamNames(){
  var m={};
  openItems().forEach(function(it){ m[(it.mgr_main&&it.mgr_main.name)||'(담당 미지정)']=1; });
  return Object.keys(m).sort();
}
function teamFoldAll(on){
  S.teamFold={};
  if(on) teamNames().forEach(function(n){ S.teamFold[n]=1; });
  renderTeam();
}
function teamReset(){ fResetCols('team'); S.fPop=''; S.teamNolog=false; S.teamStale=false; S.q=''; S.calDay=''; renderTeam(); }

/* ── 업무량 (사람별 비교·관리) ── */
// 최근 n주 기록을 모두 로드
function loadWeeks(n){
  var arr=[]; for(var i=0;i<n;i++) arr.push(weekKeyOf(addDays(S.week,-7*i)));
  return Promise.all(arr.map(loadWeekOnce)).then(function(){ return arr; });
}
function _dayDiff(a,b){ return Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000); }
function setStW(n){ S.stW=n; renderStats(); }
function renderStats(){
  var app=$('app'); if(!app)return;
  var n=S.stW||4;
  app.innerHTML=loadingHTML('최근 '+n+'주 업무량 집계 중…');
  loadWeeks(n).then(function(wks){
    if(S.view!=='stats') return;
    var today=todayStr(), open=openItems();
    var from=ymd(addDays(S.week,-7*(n-1))), to=ymd(addDays(S.week,6));
    var rows={};
    function R(nm){ return rows[nm]=rows[nm]||{name:nm,open:0,cats:{},logged:{},lines:0,stale:0,due:0,over:0,done:0}; }
    var owner={};
    open.forEach(function(it){
      var nm=(it.mgr_main&&it.mgr_main.name)||'(담당 미지정)';
      owner[it._id]=nm;
      var r=R(nm); r.open++;
      var c=it.cat||'기타'; r.cats[c]=(r.cats[c]||0)+1;
      var d=dday(itemDue(it));
      if(d!==null&&d<0) r.over++; else if(d!==null&&d<=7) r.due++;
      var ld=(it.last&&it.last.d)||'';
      if(!ld||_dayDiff(today,ld)>=14) r.stale++;
    });
    wks.forEach(function(wk){ var w=wkCache[wk]||{};
      Object.keys(w).forEach(function(iid){
        var nm=owner[iid]; if(!nm) return;
        var r=R(nm), c=Object.keys(w[iid]||{}).length;
        r.lines+=c; if(c) r.logged[iid]=1;
      });
    });
    allItems().forEach(function(it){
      if(it.state!=='done'||!it.done_date) return;
      if(it.done_date<from||it.done_date>to) return;
      R((it.mgr_main&&it.mgr_main.name)||'(담당 미지정)').done++;
    });
    var list=Object.keys(rows).map(function(k){var r=rows[k];r.loggedN=Object.keys(r.logged).length;
      r.rate=r.open?Math.round(r.loggedN/r.open*100):0; return r;})
      .sort(function(a,b){return b.open-a.open;});
    var T={open:0,lines:0,stale:0,over:0,due:0,done:0,loggedN:0};
    list.forEach(function(r){ T.open+=r.open;T.lines+=r.lines;T.stale+=r.stale;T.over+=r.over;T.due+=r.due;T.done+=r.done;T.loggedN+=r.loggedN; });
    var Trate=T.open?Math.round(T.loggedN/T.open*100):0;

    function catBar(r){
      var ks=Object.keys(r.cats).sort(function(a,b){return r.cats[b]-r.cats[a];});
      return '<div style="display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--bg);min-width:90px">'
        +ks.map(function(c){var col=catColor(c)[1];
          return '<span title="'+esc(c)+' '+r.cats[c]+'건" style="width:'+(r.cats[c]/r.open*100)+'%;background:'+col+'"></span>';}).join('')
        +'</div><div style="font-size:10px;color:var(--faint);margin-top:2px">'
        +ks.slice(0,3).map(function(c){return esc(c)+' '+r.cats[c];}).join(' · ')+(ks.length>3?' …':'')+'</div>';
    }
    var h='<div class="row" style="flex-wrap:wrap"><h1>업무량</h1>'
      +'<span class="muted" style="font-size:12.5px">'+esc(from)+' ~ '+esc(to)+' 기준</span>'
      +'<span style="flex:1"></span>'
      +[[1,'이번 주'],[4,'최근 4주'],[12,'최근 12주']].map(function(p){
          return '<span class="chipbtn'+(n===p[0]?' on':'')+'" onclick="setStW('+p[0]+')">'+p[1]+'</span>';}).join('')
      +'</div>';
    h+='<div class="statbar">'
      +'진행 <b>'+T.open+'</b>건'
      +'<span class="sep">·</span>기록 <b>'+T.lines+'</b>줄'
      +'<span class="sep">·</span>기록률 <b'+(Trate<60?' style="color:var(--warn)"':'')+'>'+Trate+'</b>%'
      +'<span class="sep">·</span>완료 <b>'+T.done+'</b>건'
      +'<span class="sep">|</span>'
      +'<span class="muted">2주+ 방치 <b'+(T.stale?' style="color:var(--warn)"':'')+'>'+T.stale+'</b>'
      +' · 기한 지남 <b'+(T.over?' style="color:var(--danger)"':'')+'>'+T.over+'</b></span>'
      +'</div>';
    h+='<div class="panel tbl"><table><thead><tr>'
      +'<th class="rowno">#</th>'
      +'<th style="min-width:80px">담당</th><th style="width:58px;text-align:right">진행</th>'
      +'<th style="min-width:120px">구분 구성</th>'
      +'<th style="width:92px;text-align:right">기록률</th><th style="width:64px;text-align:right">기록 줄</th>'
      +'<th style="width:72px;text-align:right">2주+ 방치</th><th style="width:64px;text-align:right">임박</th>'
      +'<th style="width:64px;text-align:right">지남</th><th style="width:58px;text-align:right">완료</th></tr></thead><tbody>';
    if(!list.length) h+='<tr><td colspan="10" class="moremark">집계할 업무가 없습니다.</td></tr>';
    list.forEach(function(r,i){
      var rc=r.rate>=80?'var(--ok)':r.rate>=50?'var(--warn)':'var(--danger)';
      h+='<tr style="cursor:pointer" onclick="setView(\'\',\''+escJ(r.name)+'\');go(\'my\')" title="이 담당자의 업무 보기">'
        +tdNo(i+1)
        +'<td style="font-weight:700">'+esc(r.name)+'</td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums;font-weight:700">'+r.open+'</td>'
        +'<td>'+catBar(r)+'</td>'
        +'<td style="text-align:right"><b style="color:'+rc+'">'+r.rate+'%</b>'
          +'<div style="font-size:10px;color:var(--faint)">'+r.loggedN+'/'+r.open+'건</div></td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums">'+r.lines+'</td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums'+(r.stale?';color:var(--warn);font-weight:700':'')+'">'+(r.stale||'—')+'</td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums">'+(r.due||'—')+'</td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums'+(r.over?';color:var(--danger);font-weight:700':'')+'">'+(r.over||'—')+'</td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums">'+(r.done||'—')+'</td></tr>';
    });
    h+='</tbody></table></div>';
    h+='<div class="panel" style="font-size:12px;color:var(--sub);line-height:1.75">'
      +'<b>읽는 법</b> — <b>진행·구분 구성</b>은 <u>부하</u>(무엇을 얼마나 들고 있나), '
      +'<b>기록률·기록 줄</b>은 <u>활동</u>(얼마나 챙기고 있나)입니다. 성격이 다르니 섞어 보지 마세요.<br>'
      +'⚠️ <b>기록 줄 수를 성과 지표로 쓰지 마세요.</b> 줄 수로 평가하면 기록을 잘게 쪼개 부풀리게 되고, '
      +'그러면 이 화면의 숫자가 전부 못 쓰게 됩니다. 관리에 쓸 값은 <b>2주+ 방치</b>와 <b>기한 지남</b>입니다 — '
      +'이 둘은 실제 사고로 이어지는 신호입니다.<br>'
      +'행을 클릭하면 그 담당자의 업무 목록으로 이동합니다.</div>';
    app.innerHTML=h;
  }).catch(function(e){ if($('app'))$('app').innerHTML='<div class="panel">집계 실패: '+esc(e.message)+'</div>'; });
}

/* ── 보관함 — 종료된 업무를 담당자별로 관리 ── */
function _mgrOf(it){ return (it.mgr_main&&it.mgr_main.name)||'(담당 미지정)'; }
/* pesync 열쇠는 **푸른이알피가 만든다**(그쪽 wsSafeKey). 우리는 읽기만 하므로
   글자 하나까지 같은 규칙을 써야 한다. 다른 점은 하나 — 그쪽은 하이픈(-)도 _ 로
   바꾼다. 관리번호가 계약-2026-046 꼴이라 우리 safeKey 로 찾으면 거의 다 어긋나,
   푸른이알피가 실제로 종료했는데도 배지가 영원히 「반영 대기」였다.
   ⚠ safeKey 를 고치면 안 된다 — 그것은 우리 쪽 자료의 열쇠라 바꾸면 남의 자료를 잃는다. */
function peSyncKey(s){ return String(s==null?'':s).replace(/[.#$\/\[\]'"`\\\s\u0000-\u001F\u007F -]/g,'_'); }
function peSyncBadge(it){
  if(!peLinked(it)) return '';
  if(it.pe_nosync) return '<span class="pesync off" title="이 업무는 푸른이알피와 연동하지 않습니다">연동 안 함</span>';
  // 옛 열쇠로 적힌 기록이 남아 있을 수 있어 둘 다 본다
  var st=(pesync[it.ref.type+'-'+peSyncKey(it.ref.id)]
        ||pesync[it.ref.type+'-'+safeKey(it.ref.id)]||{});
  if(st.synced_at&&st.pe_closed===true) return '<span class="pesync done" title="푸른이알피도 종료됨 · '+esc((st.synced_at||'').slice(0,10))+'">🔗 반영됨</span>';
  return '<span class="pesync wait" title="푸른이알피 나의 업무를 열 때 반영됩니다">🔗 반영 대기</span>';
}
function arReset(){ S.arMgr=''; S.arCat=''; S.arPeriod=''; S.q=''; S.arWay=''; S.arRes=''; renderArchive(); }
/* 표 높이를 창 아래까지 채운다. 종전에는 100vh-250px 로 못 박아 두어, 머리를
   네 줄에서 한 줄로 줄인 뒤에도 250px 를 잡아먹어 아래가 잘렸다. 실제 자리를
   재서 남은 높이를 그대로 준다 — 머리가 또 바뀌어도 따라온다.
   ⚠ 아이디를 적어 둔 표만 손댄다. .panel.tbl 을 통째로 잡으면 아직 손보지 않은
     화면까지 함께 바뀐다. */
function arFit(){
  ['artbl','teamtbl','mytbl'].forEach(function(id){
    var t=$(id); if(!t) return;
    var top=t.getBoundingClientRect().top;
    t.style.maxHeight=Math.max(240,Math.round(window.innerHeight-top-26))+'px';
  });
}
window.addEventListener('resize',function(){ if($('artbl')||$('teamtbl')||$('mytbl')) arFit(); });
function arFold(nm){ S.arFold=S.arFold||{}; S.arFold[nm]=!S.arFold[nm]; renderArchive(); }
// 담당자가 여럿이면 하나씩 접는 것은 일이다. 화면의 묶음과 같은 목록을 써야 개수가 어긋나지 않는다.
function arFoldAll(on){
  S.arFold={};
  if(on) allItems().forEach(function(it){ if(it.state==='done') S.arFold[_mgrOf(it)]=1; });
  renderArchive();
}
function renderArchive(){
  var app=$('app'); if(!app)return;
  var all=allItems().filter(function(it){return it.state==='done';})
    .sort(function(a,b){return (b.done_date||'').localeCompare(a.done_date||'');});
  var today=todayStr();
  var mgrs={}; all.forEach(function(it){ mgrs[_mgrOf(it)]=1; });
  var names=Object.keys(mgrs).sort();
  // 기간 필터 경계
  var from='';
  if(S.arPeriod==='m1') from=ymd(addDays(new Date(),-30));
  else if(S.arPeriod==='m3') from=ymd(addDays(new Date(),-90));
  else if(S.arPeriod==='y') from=(new Date().getFullYear())+'-01-01';
  function pass(it){
    if(S.arWay&&endWay(it)!==S.arWay) return false;

  }
  var done=all.filter(pass);
  /* 머리를 네 줄에서 한 줄로. 방식·담당은 칩을 죽 늘어놓아 두 줄을 먹었는데,

  function arCnt(fn){ return all.filter(fn).length; }
  function arSel(cur,onch,opts,title){

    return '<select class="tool'+(cur?' on':'')+'" onchange="'+onch+'" title="'+esc(title)+'">'

     「잘못 종료한 것 재개」이고 둘 다 축이 날짜다. 사람별로 세는 일은 업무량 화면이
     이미 한다(담당별 표에 완료 열이 있다). 12건에 묶음 머리 5개는 배보다 배꼽이었다.
     담당은 열로 두고, 한 사람만 보려면 담당 드롭다운으로 좁힌다. */
  var flat=(S.arFlat===undefined)?true:!!S.arFlat;
  h+=qBox('renderArchive','🔍 기업·업무명·의뢰인')
    +'<span class="sepv"></span>'
    +arSel(S.arWay,'S.arWay=this.value;renderArchive()',wayOpts,'끝낸 방식으로 좁히기 — 종료·취소·이관')
    +arSel(S.arMgr,'S.arMgr=this.value;renderArchive()',mgrOpts,'담당자로 좁히기')
    +catSelect(S.arCat,'S.arCat=this.value;renderArchive()','tool'+(S.arCat?' on':''))
    +arSel(S.arPeriod,'S.arPeriod=this.value;renderArchive()',

    +(resOpts.length>1?arSel(S.arRes,'S.arRes=this.value;renderArchive()',resOpts,'사건 결과로 좁히기'):'')
    +'<span class="sepv"></span>'
    +'<span class="chipbtn'+(flat?'':' on')+'" onclick="S.arFlat=!'+(flat?'true':'false')+';renderArchive()" '
      +'title="'+(flat?'담당자별로 묶어 봅니다':'묶음을 풀고 한 표로 봅니다')+'">'+(flat?'👤 담당별 묶기':'▤ 한 표로')+'</span>'
    +(flat?''
      :'<span class="chipbtn'+(nFold>=names.length?' off':'')+'" onclick="arFoldAll(true)" title="담당자 '+names.length+'명을 모두 접습니다">▸ 모두 접기</span>'
       +(nFold?'<span class="chipbtn" onclick="arFoldAll(false)" title="접힌 '+nFold+'명을 모두 폅니다">▾ 펼치기 '+nFold+'</span>':''))
    +((S.arMgr||S.arCat||S.arPeriod||S.q||S.arWay||S.arRes)?'<span class="chipbtn on" onclick="arReset()" title="모든 조건 해제">✕ 조건</span>':'')
    +'<span style="flex:1"></span>'
    // 방식별 숫자는 고르지 않아도 늘 보이게 — 드롭다운 안에만 두면 한눈에 안 들어온다
    +'<span class="fnote">'+END_WAYS.map(function(w){
        var c=arCnt(function(it){ return endWay(it)===w[0]; });
        return c?w[1]+' <b>'+c+'</b>':'';
      }).filter(Boolean).join(' · ')+'</span>'
    +'</div>';
  /* 사업장·업무 종류·관리번호를 각각 제 열로. 한 칸에 이어 붙이면 기업명 길이에 따라
     뒤 글자가 들쭉날쭉해 세로로 훑을 수가 없다. 이관 대상도 결국 사건번호라
     관리번호 열에 → 로 이어 붙인다 — 어디서 어디로 갔는지가 한 줄에서 읽힌다. */
  var flatRows=flat||!!S.arMgr, showMgr=flatRows;
  h+='<div class="panel tbl" id="artbl"><table><thead><tr>'
    +'<th class="rowno">#</th><th style="width:52px">방식</th><th style="width:56px">구분</th>'
    +'<th style="width:186px">사업장</th><th style="width:196px">업무 종류</th><th style="width:236px">관리번호</th>'
    +(showMgr?'<th style="width:84px">담당</th>':'')
    +'<th style="width:88px">종료일</th><th style="width:96px">푸른이알피</th>'
    +'<th>마지막 기록</th><th style="width:66px"></th></tr></thead><tbody>';
  var COLS=10+(showMgr?1:0);
  // 이관 대상의 consulting:·case: 접두어는 구분 배지에 이미 있는 정보라 뗀다
  function shortRef(s){ return String(s||'').replace(/^[a-z]+:/,''); }
  function rowsOf(arr){
    return arr.map(function(it,i){
      var op='onclick="openDrawer(\''+escJ(it._id)+'\')"';
      return '<tr>'+tdNo(i+1)+'<td>'+endBadge(it)+resBadge(it)+'</td><td>'+catBadge(it.cat)+'</td>'
        +'<td class="itc" '+op+'><span class="cut co">'+esc(it.company||it.client||'—')+'</span></td>'
        +'<td class="itc" '+op+'><span class="cut kind">'+esc(itemName(it)||'—')+'</span></td>'
        +'<td><span class="cut no">'+esc(it.no||'—')
        +(endWay(it)==='transfer'&&it.end_to?' <span class="to">→ '+esc(shortRef(it.end_to))+'</span>':'')+'</span></td>'
        +(showMgr?'<td style="font-size:12.5px">'+esc(_mgrOf(it))+'</td>':'')
        +'<td style="font-size:12.5px;font-variant-numeric:tabular-nums">'+esc(it.done_date||'—')+'</td>'
        +'<td>'+(peSyncBadge(it)||'<span class="muted" style="font-size:11px">—</span>')+'</td>'
        +'<td>'+(it.last?'<span class="last">'+esc(it.last.t)+' <span class="ago">· '+esc(md(it.last.d))+'</span></span>':'<span class="muted" style="font-size:12px">기록 없음</span>')+'</td>'
        +'<td><button class="endbtn" onclick="event.stopPropagation();restoreItem(\''+escJ(it._id)+'\')" title="진행으로 되돌립니다'
        +(peLinked(it)&&!it.pe_nosync?' (푸른이알피도 종료 해제)':'')+'">↩ 재개</button></td></tr>';
    }).join('');
  }
  if(!done.length){ h+='<tr><td colspan="'+COLS+'" class="moremark">조건에 맞는 업무가 없습니다.</td></tr>'; }
  else if(flatRows){ h+=rowsOf(done); }
  else {
    names.forEach(function(nm){
      var arr=done.filter(function(it){return _mgrOf(it)===nm;});
      if(!arr.length) return;
      var fold=!!(S.arFold||{})[nm];
      h+='<tr class="grp-h" style="cursor:pointer" onclick="arFold(\''+escJ(nm)+'\')"><td colspan="'+COLS+'">'
        +(fold?'▸':'▾')+' 👤 '+esc(nm)+' — 종료 '+arr.length+'건'
        +'<span class="pct">최근 종료 '+esc(arr[0].done_date||'—')+'</span></td></tr>';
      if(!fold) h+=rowsOf(arr);
    });
  }
  h+='</tbody></table></div>';
  h+='<div class="muted" style="font-size:12px;margin-top:8px">조건에 맞는 종료 업무 '+done.length+' / 전체 '+all.length+'건</div>';
  app.innerHTML=h;
  arFit();
}

/* ── 푸른이알피 담당 업무 가져오기 (계약·사건·컨설팅·기금·기타) ── */
// pu-erp는 localStorage(pureun_v6_*)에 마스터를 캐시함 — 같은 출처라 그대로 읽는다.
function _ls(key){
  try{ var raw=localStorage.getItem('pureun_v6_'+key); if(!raw) return null;
    var v=JSON.parse(raw); if(v&&!Array.isArray(v)&&typeof v==='object') v=Object.keys(v).map(function(k){return v[k];});
    return Array.isArray(v)?v:null; }catch(e){ return null; }
}
// 종료 판정 — pu-erp isItemClosed와 동일 기준
function _peClosed(x){
  if(!x) return true;
  if(x.permanentArchived||x.archived) return true;
  if(x.closedDate||x.closedAt||x.closeDate) return true;
  var st=String(x.status||'');
  return st==='closed'||st==='cancelled'||st==='transferred';
}
/* 푸른이알피가 어떻게 끝냈는지 → 우리 끝낸 방식.
   status가 정본이고, 없으면 종료 사유 문구에서 읽는다(옛 자료 대비).
   끝나지 않은 건은 빈 문자열. */
function peEndWay(x){
  if(!x) return '';
  var st=String(x.status||'');
  if(END_BY_PE[st]) return END_BY_PE[st];
  var r=String(x.closedReason||x.closeReason||'');
  if(/취소/.test(r)) return 'cancel';
  if(/이관/.test(r)) return 'transfer';
  return _peClosed(x)?'done':'';
}
// 푸른이알피 사건 결과 — 값 이름이 같으므로 그대로 쓴다
function peResult(x){
  var v=String((x&&x.caseResult)||'').trim();
  return RES_BY_KEY[v]?v:'';
}
/* 유형 — 현장클리닉·기술보호·임금체불·직장내괴롭힘 대리 같은 실제 업무 종류.
   구분(cat)이 아니라 업무명 자리에 쓴다. 못 찾으면 빈 문자열을 돌려주고,
   화면에서 [✏️ 이름 적기]로 사람이 채운다 — 억지로 만들어 넣지 않는다. */
/* 업무명 자리에 쓸 유형. 푸른이알피 목록에 보이는 것과 같은 글자가 나와야 한다
   ("부당해고", "일터혁신 상생 컨설팅", "취업규칙"). 찾는 순서:
   ① 유형 코드 → 마스터의 이름 (업체 계약은 붙어 있는 종류를 모두 이어 준다)
   ② 이름이 그대로 들어 있던 예전 칸
   ③ 관리번호 접두어 (기타사업은 유형 칸이 비고 번호에만 사업명이 있다 — 기술보호-2026-006)
   ③에서 '계약'·'사건'처럼 구분과 같은 말이면 버린다 — 구분 배지와 같은 글자가
   업무명 자리에 또 나올 뿐 무슨 일인지는 알려 주지 않는다. */
var NO_PREFIX_SKIP={'계약':1,'사건':1,'컨설팅':1,'기금':1,'업체':1,'기타':1,'기타사업':1};
function peType(t,x,kind){
  var tc=x.typeCodes||{};
  if(t==='contract'){
    var kinds=Array.isArray(x.kinds)?x.kinds:(x.kind?[x.kind]:[]);
    var lbl=kinds.map(function(kv){ return String(peTypeName(kv,tc[kv])||_peRawType(x,kv)||'').trim(); })
      .filter(Boolean).filter(function(v,i,a){ return a.indexOf(v)===i; }).join(' · ');
    if(lbl) return lbl;
  }else{
    var nm=peTypeName(t,tc[t]||x.typeCode);
    if(nm) return nm;
  }
  var v=String(x.typeName||x.caseType||x.contractType||x.consultingType
    ||x.fundType||x.projectType||x.programName||kind||'').trim();
  if(v&&!/\d/.test(v)) return v;                 // 내부 ID가 섞인 값은 이름이 아니다
  var no=String(x.caseNo||x.contractNo||x.consultNo||x.fundNo||x.projectNo||x.no||'').replace(/\s/g,'');
  var m=/^([^\-\d]{2,})/.exec(no);
  return (m&&!NO_PREFIX_SKIP[m[1]])?m[1]:'';
}
// (엑셀 이관 초기에 쓰던 13종 정규화 — 지금은 쓰지 않는다. 과거 데이터 해석용으로 남겨 둔다)
function normCat(raw,title){
  var s=String((raw||'')+' '+(title||'')).replace(/\s/g,'');
  if(/산재/.test(s)) return '산재';
  if(/체불|체당/.test(s)) return '체불';
  if(/부당|부해/.test(s)) return '부해';
  if(/괴롭힘|직괴/.test(s)) return '조사';
  if(/행심|행정심판/.test(s)) return '행심';
  if(/기금|공동근로복지/.test(s)) return '기금';
  if(/노사|노조/.test(s)) return '노사';
  if(/급여/.test(s)) return '급여';
  if(/산안|안전/.test(s)) return '산안';
  if(/지원금/.test(s)) return '지원';
  if(/컨설팅|일터|구조혁신|비즈니스|현장클리닉|현클|기술보호|가족친화|상공회의소|자율점검|징계위원회|근로계약서|통상임금/.test(s)) return '컨설팅';
  if(/인사|규정|취업규칙/.test(s)) return '인사';
  if(/조사/.test(s)) return '조사';
  return '기타';
}
function _normCo(s){ return String(s||'').replace(/\(주\)|㈜|주식회사|\(유\)|유한회사|[\s·.,\-()]/g,'').toLowerCase(); }
function _peDue(x){
  var ds=(x.deadlines||[]).map(function(d){return d&&d.date;}).filter(Boolean).sort();
  if(ds.length){ var t=todayStr(); var up=ds.filter(function(d){return d>=t;}); return up[0]||ds[ds.length-1]; }
  return x.contractEndDate||'';
}
/* ── 푸른이알피 마스터 읽기 ─────────────────────────────────────────
   RTDB `data/{키}/v`를 직접 읽는다. 예전엔 localStorage(pureun_v6_*)만 봐서
   같은 브라우저에서 푸른이알피를 한 번 열지 않으면 후보가 0건이었다.

   ⚠ 읽기만 한다 — 마스터 쓰기는 pu-erp의 dbPatch만 담당한다. */
var PE_KEYS={contract:'contracts',case:'cases',consulting:'consultings',fund:'funds',other:'other_projects'};
// 라벨 = 푸른이알피 사무관리 메뉴 5종. 이것이 목록의 "구분"이 된다.
// (유형 — 현장클리닉·기술보호·임금체불 등 — 은 ptype에 따로 담아 업무명으로 쓴다)
var PE_DEF=[

  ['case','사건',function(x){return x.caseNo||'';},function(x){return x.title||x.caseName||'';},function(x){return x.typeName||x.caseType||'';}],
  ['consulting','컨설팅',function(x){return x.consultNo||x.no||'';},function(x){return x.title||x.programName||'';},function(x){return x.typeName||x.consultingType||x.programName||'';}],
  ['fund','기금',function(x){return x.fundNo||x.no||'';},function(x){return x.title||x.fundName||'';},function(x){return x.fundType||'기금';}],
  ['other','기타사업',function(x){return x.projectNo||x.no||'';},function(x){return x.title||x.projectName||'';},function(x){return x.programName||'';}]
];
var PE_MIRROR=['no','cat','ptype','company','client','officer','title','due','start','co_id',
  'jur_org','jur_ph','jur_em',    // 관할(상대기관) — 푸른이알피가 원본, 여기는 따라 읽기만
  'pe_st'];                       // 원본 상태(계약관리 등) — 우리 '상태'와 다른 축이라 덮지 않는다
/* 유형 마스터 — 푸른이알피는 유형을 "코드"로 저장하고(typeCodes) 사람이 읽는
   이름은 이 마스터에 따로 둔다. 코드만 보면 case-mpz7pd42ogb 같은 내부 ID가
   나오므로 반드시 이름으로 바꿔 줘야 "부당해고·임금체불·취업규칙"이 보인다.
   (푸른이알피 kindSubLabel과 같은 규칙 — 숨김 유형도 포함해야 옛 이름이 유지된다) */
var PE_TKEY={company:'biz_company_types',case:'biz_case_types',consulting:'biz_cons_types',
  fund:'biz_fund_types',other:'biz_other_types'};
var peTypes={};
function peTypeName(kv,code){
  code=String(code==null?'':code).trim(); if(!code) return '';

  for(var i=0;i<arr.length;i++){ if(arr[i]&&String(arr[i].code)===code) return String(arr[i].name||'').trim(); }
  return /\d/.test(code)?'':code;               // 숫자가 섞이면 내부 ID로 보고 버린다

// 마스터에 없을 때 쓰는 예전 칸 (푸른이알피 kindSubLabel의 뒷단과 같다)

function briefTrim(v){ return String(v==null?'':v).replace(/\s+/g,' ').trim().slice(0,BRIEF_MAX); }
/* 검색·지식카드·서랍 제목에 쓰는 "한 줄 이름". 가장 구체적인 것부터 고른다. */

/* 목록의 "업무" 칸 — 두 줄.

var peMaster={};                                   // {유형:[레코드]} — 읽기 실패한 유형은 키가 없다
var peState={since:null,at:null,n:0,err:''};
var _peU2N=null, _peT=null, _peBusy=false, _peWatching=false;

function _peArr(v){
  if(v&&!Array.isArray(v)&&typeof v==='object') v=Object.keys(v).map(function(k){return v[k];});

    }));

// 마스터 1건 → 업무시트 항목 후보
function _peCandOf(t,label,dNo,dTitle,dKind,x,sid2name){
  var co=x.companyName||x.fundName||x.targetName||'';
  var kind=dKind(x), title=dTitle(x);
  /* 관할(상대기관) — 노동청·노동위원회와 그쪽 담당자(감독관·조사관).
     ⚠ 푸른이알피는 지금 judgment에 담고 jurisdiction은 옛 이름으로만 남겨 두었다.
        예전에는 jurisdiction만 봐서 요즘 등록한 사건은 담당자가 늘 비어 있었다. */
  var J=x.judgment||x.jurisdiction||{};
  // 구분 = 사무관리 메뉴 5종, 업무명 자리에 쓸 유형은 ptype에 따로 담는다
  return { pid:'PE-'+t+'-'+safeKey(x.id), kindLabel:label, no:dNo(x)||'',
    cat:label, ptype:peType(t,x,kind), end_way:peEndWay(x),
    // ⚠ 회사명을 업무명으로 쓰지 않는다 — 기업 칸과 똑같이 보이고,
    //   기본정보 양방향이 그 값을 푸른이알피 title에 되돌려써 마스터가 더러워진다.
    //   비면 비운 채로 두고 화면에서 업무 요약·유형으로 대신 보여준다(itemName).
    //   유형도 넣지 않는다 — ptype이 따로 담으므로 업무명에까지 넣으면 같은 값이 두 번 나온다
    company:co, title:String(title||'').trim(),
    pe_st:peStatus(x),                            // 푸른이알피 원본 상태 (계약관리 상담접수 등)
    officer:String(J.officer||'').trim(),         // 상대기관 담당자 (감독관·조사관)
    jur_org:String(J.org||'').trim(),             // 관할기관 (○○지청·○○지방노동위원회)
    jur_ph:String(J.phone||'').trim(), jur_em:String(J.email||'').trim(),
    brief:briefTrim(x.brief),
    client:x.payee||'', mgr:sid2name[x.managerMain]||'', mgrSid:x.managerMain||'',
    co_id:x.companyId||'',                        // 업체 담당자 조회용 — 이름 매칭보다 정확하다
    subs:(x.managerSubs||[]).map(function(sd){return sid2name[sd]||'';}).filter(Boolean),
    due:_peDue(x), start:x.receiveDate||x.contractStartDate||'',
    ref:{type:t,id:String(x.id)} };
}
// 5종 마스터 → 미종료 후보 전체. null = 한 유형도 못 읽음
function puerpCandidates(){
  var sid2name=_peU2N||{}, out=[], any=false;
  PE_DEF.forEach(function(d){
    var arr=peMaster[d[0]]; if(!arr) return; any=true;
    arr.forEach(function(x){
      if(!x||!x.id||_peClosed(x)) return;
      out.push(_peCandOf(d[0],d[1],d[2],d[3],d[4],x,sid2name));

  return any?out:null;

// 마스터 + 사용자 준비
function peReady(){ return Promise.all([peLoadAll(),peUsers()]); }

/* ── 자동 연동 엔진 ─────────────────────────────────────────────────
   ① 기준일(config/pe_since)이 없으면 = 최초 실행. 현재 있는 모든 건을
      pe_seen에 "이미 본 것"으로만 적고 항목은 만들지 않는다.
      → 엑셀 이관 163건과 겹치는 백로그가 쏟아지는 것을 막는다.
      (pu-erp 레코드에 등록일 필드가 없어 날짜 비교가 불가능하므로 id 스냅샷을 쓴다)
   ② 기준일 이후 새로 등록된 건(pe_seen에 없는 건)만 자동 생성한다.
   ③ 푸른이알피 소유 필드는 pe_m 스냅샷과 비교해 "푸른이알피에서 실제로
      바뀐 경우에만" 갱신한다. → 여기서 사람이 고친 값이 조용히 안 덮인다.
   ④ 종료·재개는 pu-erp의 pesync 엔진 담당 — 여기서 손대지 않는다. */
function peWatch(){
  if(_peWatching) return; _peWatching=true;
  // data/{키}/u = 그 키의 변경 타임스탬프 1개. 본문 대신 이것만 구독해 트래픽을 줄인다.
  PE_DEF.forEach(function(d){
    fbDb.ref('data/'+PE_KEYS[d[0]]+'/u').on('value',function(){ peBump(); },function(){});
  });
  peBump();                                        // u 노드가 없는 경우에도 최초 1회는 돌린다
}
function peBump(){
  clearTimeout(_peT);
  _peT=setTimeout(function(){
    // 마스터를 읽은 뒤 한 번 다시 그린다 — "주담당 미연결 N건" 안내는
    // peMaster가 채워진 뒤에야 판단할 수 있고, 쓸 게 없으면 items 리스너가 안 울린다.
    peLoadAll().then(function(){ if(!appHasFocus()) route(); return peAutoSync(); });
  },1000);   // 5개 구독이 몰려 와도 1회만
}
function peAutoSync(){
  if(_peBusy) return Promise.resolve();
  if(!PE_DEF.some(function(d){return !!peMaster[d[0]];})) return Promise.resolve();
  _peBusy=true;
  return Promise.all([
    peUsers(), loadStaff(),
    fbDb.ref(NS+'/pe_seen').once('value').then(function(s){return s.val()||{};}).catch(function(){return null;}),
    fbDb.ref(NS+'/config/pe_since').once('value').then(function(s){return s.val()||'';}).catch(function(){return null;})
  ]).then(function(r){
    var sid2name=r[0], staff=r[1], seen=r[2], since=r[3];
    if(seen===null||since===null){ peState.err='연동 설정을 읽지 못했습니다'; return; }
    peState.err=''; peState.since=since||'';
    var name2sid={}; staff.forEach(function(u){ name2sid[u.name]=u.sid; });
    var ceo=staff.filter(function(u){return /대표/.test(u.title||'');})[0]||null;

    // 현재 마스터 상태: live=존재하는 전체 id, cand=미종료 후보
    var cand=[], live={};
    PE_DEF.forEach(function(d){
      var arr=peMaster[d[0]]; if(!arr) return;
      live[d[0]]={};
      arr.forEach(function(x){
        if(!x||!x.id) return;
        live[d[0]][safeKey(String(x.id))]=1;
        if(_peClosed(x)) return;
        cand.push(_peCandOf(d[0],d[1],d[2],d[3],d[4],x,sid2name));
      });
    });
    var up={};

    // ① 최초 실행 — 기준선만 기록하고 끝낸다
    if(!since){
      var t0=todayStr();
      Object.keys(live).forEach(function(t){
        Object.keys(live[t]).forEach(function(k){ up[NS+'/pe_seen/'+t+'/'+k]=true; });
      });
      up[NS+'/config/pe_since']=t0;
      return fbDb.ref().update(up).then(function(){
        peState.since=t0; peState.at=new Date().toISOString();
        toast('🔗 자동 연동 시작 — 오늘부터 푸른이알피에 등록되는 건이 자동으로 들어옵니다');
      });
    }

    // ② 기존 연동건: 원본 존재 여부 + 소유 필드 미러
    var byRef={}, candByRef={};
    allItems().forEach(function(it){ if(peLinked(it)) byRef[it.ref.type+'|'+safeKey(it.ref.id)]=it; });
    cand.forEach(function(c){ candByRef[c.ref.type+'|'+safeKey(c.ref.id)]=c; });
    Object.keys(byRef).forEach(function(k){
      var it=byRef[k], P=NS+'/items/'+it._id+'/';
      // 원본 삭제 감지 — 그 유형을 실제로 읽어냈을 때만 판단한다(읽기 실패로 전건 오표시 방지)
      if(live[it.ref.type]){
        var gone=!live[it.ref.type][safeKey(it.ref.id)];
        if(gone&&!it.pe_gone) up[P+'pe_gone']=true;
        if(!gone&&it.pe_gone) up[P+'pe_gone']=null;
      }
      // 이미 종료된 건의 "끝낸 방식"을 푸른이알피에서 한 번 당겨온다.
      // 종료 상태 자체는 pesync가 담당하고, 여기서는 방식(종료·취소·이관)만 채운다.
      // 이미 값이 있으면 건드리지 않는다 — 사람이 고른 것을 덮지 않기 위해서다.
      if(it.state==='done'&&(!it.end_way||!it.end_result)){
        var rec=peRec(it);
        if(rec){
          if(!it.end_way){
            var w=peEndWay(rec);
            if(w){
              up[P+'end_way']=w;
              if(w==='transfer'&&rec.transferredTo) up[P+'end_to']=String(rec.transferredTo);
              up[P+'status']=(END_BY_KEY[w]||END_WAYS[0])[1];
            }
          }
          if(!it.end_result){ var rr=peResult(rec); if(rr) up[P+'end_result']=rr; }
        }
      }
      var c=candByRef[k]; if(!c) return;            // 종료된 건 → 미러 안 함(종료는 pesync 담당)
      var m=it.pe_m||{}, nm={};
      PE_MIRROR.forEach(function(f){
        nm[f]=c[f]||'';
        if(String(m[f]||'')!==nm[f]) up[P+f]=nm[f];
      });
      var mSid=c.mgrSid||name2sid[c.mgr]||'', has=!!(mSid||c.mgr);
      nm.mgr=mSid+'/'+(c.mgr||''); nm.subs=(c.subs||[]).join('|');
      if(String(m.mgr||'')!==nm.mgr){
        up[P+'mgr_main']=has?{sid:mSid,name:c.mgr||''}:(ceo?{sid:ceo.sid,name:ceo.name}:{sid:'',name:''});
        up[P+'pe_nomgr']=has?null:true;             // 담당 미지정 → 대표에게 배치하고 표시
      }
      if(String(m.subs||'')!==nm.subs)
        up[P+'mgr_subs']=(c.subs||[]).map(function(n){return {sid:name2sid[n]||'',name:n};});
      if(JSON.stringify(m)!==JSON.stringify(nm)) up[P+'pe_m']=nm;
    });

    // ③ 신규 자동 생성 — pe_seen에 없는 건만 (사용자가 지운 건은 seen에 남아 되살아나지 않는다)
    var made=0;
    cand.forEach(function(c){
      var t=c.ref.type, rk=safeKey(c.ref.id);
      if(seen[t]&&seen[t][rk]) return;
      up[NS+'/pe_seen/'+t+'/'+rk]=true;
      if(byRef[t+'|'+rk]) return;                   // 이미 수동으로 가져온 건
      var mSid=c.mgrSid||name2sid[c.mgr]||'', has=!!(mSid||c.mgr);
      var m={}; PE_MIRROR.forEach(function(f){ m[f]=c[f]||''; });
      m.mgr=mSid+'/'+(c.mgr||''); m.subs=(c.subs||[]).join('|');
      var rec={ no:c.no||(S.year+'-'+c.cat+'-PE'), cat:c.cat, ptype:c.ptype||'', company:c.company||'', client:c.client||'',
        officer:c.officer||'', title:c.title||'', due:c.due||'', start:c.start||'', status:'진행중',
        brief:c.brief||'',                        // 업무 요약 씨앗 — 이후에는 pesync가 양방향으로 맞춘다
        co_id:c.co_id||'',                        // pe_m에만 있고 항목에 없으면 이후 미러가 건너뛴다
        mgr_main:has?{sid:mSid,name:c.mgr||''}:(ceo?{sid:ceo.sid,name:ceo.name}:{sid:'',name:''}),
        mgr_subs:(c.subs||[]).map(function(n){return {sid:name2sid[n]||'',name:n};}),
        src:'puerp', ref:c.ref, pe_auto:true, pe_m:m, created_at:new Date().toISOString() };
      if(!has) rec.pe_nomgr=true;
      up[NS+'/items/'+c.pid]=rec; made++;
    });

    if(!Object.keys(up).length){ peState.at=new Date().toISOString(); return; }
    return fbDb.ref().update(up).then(function(){
      peState.at=new Date().toISOString(); peState.n=made;
      if(made) toast('🔗 푸른이알피에서 '+made+'건 자동 연동');
    });
  }).catch(function(e){ peState.err=e&&e.message||'동기화 실패'; console.warn('[peAutoSync]',e); })
    .then(function(){ _peBusy=false; });
}
function puerpModal(){
  showModal('<h2 style="margin:0 0 10px">🔗 푸른이알피 연동</h2><p class="muted" style="font-size:12.5px">마스터를 불러오는 중…</p>');
  peReady().then(_puerpModal);
}
// 열람 대상이 푸른이알피에서 주담당인데 아직 업무시트에 없는 건.
// null = 마스터를 아직 못 읽음(안내를 띄우지 않는다)
function peMineUnlinked(){
  var cand=puerpCandidates(); if(!cand) return null;
  var who=viewer(); if(!who.sid&&!who.name) return [];
  var linked={};
  allItems().forEach(function(it){ if(peLinked(it)) linked[it.ref.type+'|'+safeKey(it.ref.id)]=1; });
  return cand.filter(function(c){
    if(linked[c.ref.type+'|'+safeKey(c.ref.id)]) return false;
    return (who.sid&&c.mgrSid===who.sid)||(who.name&&c.mgr&&c.mgr===who.name);
  });
}
// 전 직원의 주담당 미연결 건. 대표가 한 번에 붙일 때 쓴다
function peAllUnlinked(){
  var cand=puerpCandidates(); if(!cand) return null;
  var linked={};
  allItems().forEach(function(it){ if(peLinked(it)) linked[it.ref.type+'|'+safeKey(it.ref.id)]=1; });
  return cand.filter(function(c){
    if(linked[c.ref.type+'|'+safeKey(c.ref.id)]) return false;
    return !!(c.mgrSid||c.mgr);                 // 주담당이 지정된 건만
  });
}
/* ── 푸른이알피에서 한 건씩 당겨오기 ──────────────────────────────
   [한 번에 연결]은 "내가 주담당인 것 전부"를 가져온다. 그런데 "저 회사 그
   건 하나만" 또는 "남이 맡은 건에 나도 붙는다"는 길이 없었다. 사업장 이름으로
   찾아 한 건씩 가져온다. 내 담당을 언제나 위에 둔다.
   ⚠ 남의 건을 가져와도 주담당은 바꾸지 않는다 — 주담당의 원본은 푸른이알피라
     여기서 바꿔 봐야 다음 동기화에 되돌아온다. 나는 부담당으로 붙는다.
     그 참여는 pe_addsub로 푸른이알피에도 넘겨 양쪽이 어긋나지 않게 한다. */
function pullModal(q){
  if(q!==undefined) S._pullQ=q;
  showModal('<h2 style="margin:0 0 10px">🔗 푸른이알피에서 가져오기</h2>'
    +'<p class="muted" style="font-size:12.5px">마스터를 불러오는 중…</p>');
  peReady().then(_pullModal);
}
function pullFind(q){
  var cand=puerpCandidates();
  if(!cand) return null;
  var me=S.me||{}, have={};
  allItems().forEach(function(it){ if(peLinked(it)) have[it.ref.type+'|'+safeKey(it.ref.id)]=it; });
  q=String(q||'').trim().toLowerCase();
  var mine=[], other=[];
  cand.forEach(function(c){
    if(q){
      var hay=[c.company,c.title,c.ptype,c.no,c.client,c.mgr].concat(c.subs||[]).join(' ').toLowerCase();
      if(hay.indexOf(q)<0) return;
    }
    c._have=have[c.ref.type+'|'+safeKey(c.ref.id)]||null;
    c._main=!!((me.sid&&c.mgrSid===me.sid)||(me.name&&c.mgr===me.name));
    c._sub=!!(me.name&&(c.subs||[]).indexOf(me.name)>=0);
    (c._main||c._sub?mine:other).push(c);
  });
  function ord(a,b){
    return String(a.company||'').localeCompare(String(b.company||''),'ko')
      ||String(a.no||'').localeCompare(String(b.no||''),'en',{numeric:true});
  }
  return {mine:mine.sort(ord), other:other.sort(ord)};
}
function _pullRow(c){
  var me=S.me||{};
  var joined=!!(c._have&&isOf(c._have,{sid:me.sid,name:me.name}));
  var btn=joined
    ?'<button onclick="closeM();openDrawer(\''+escJ(c._have._id)+'\')" title="이미 내 업무에 있습니다">✓ 열기</button>'
    :(c._main||c._sub
      ?'<button class="primary" onclick="pullOne(\''+escJ(c.pid)+'\',false)" title="내 담당 건을 내 업무로 가져옵니다">가져오기</button>'
      :'<button class="primary" onclick="pullOne(\''+escJ(c.pid)+'\',true)" '
        +'title="주담당은 '+esc(c.mgr||'미지정')+' 그대로 두고, 나를 부담당(공동)으로 붙입니다 — 푸른이알피에도 반영됩니다">부담당으로</button>');
  return '<div class="prow">'
    +catBadge(c.cat)
    +'<div class="px"><b>'+esc(c.company||'—')+'</b>'
    +'<div class="sub">'+esc(c.ptype||c.title||'')+(c.no?' · '+esc(c.no):'')+'</div></div>'
    +'<div class="pm">'+(c._main?'<span class="mgt">나</span>'
        :'<span class="mgk">주</span><span class="mgt">'+esc(c.mgr||'미지정')+'</span>')
      +(c._sub?'<span class="mgt sub">부담당</span>':'')
      +(c._have&&!joined?'<span class="mgt" title="다른 사람 목록에 이미 있습니다">이미 있음</span>':'')+'</div>'
    +btn+'</div>';
}
function _pullModal(){
  var q=S._pullQ||'', r=pullFind(q);
  if(r===null){
    showModal('<h2 style="margin:0 0 10px">🔗 푸른이알피에서 가져오기</h2>'
      +'<p class="muted" style="font-size:12.5px">푸른이알피 마스터를 읽지 못했습니다. 같은 브라우저에서 <b>푸른이알피를 한 번 열고</b> 다시 시도해 주세요.</p>'

  }
  S._pullC={}; r.mine.concat(r.other).forEach(function(c){ S._pullC[c.pid]=c; });
  var LIM=40, more=r.other.length-LIM;

    +'<p class="muted" style="font-size:12px;margin:0 0 10px">사업장 이름·업무명·관리번호로 찾습니다. '
    +'<b>남이 맡은 건</b>은 주담당을 그대로 두고 <b>나를 부담당</b>으로 붙입니다.</p>'
    +'<input id="pull-q" value="'+esc(q)+'" placeholder="🔍 사업장 이름 (예: 나래)" '
    +'oninput="onPullQ(this.value)" style="width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px">'
    +'<div style="max-height:340px;overflow-y:auto;margin-top:10px">'
    +'<div class="phd">● 내 담당 '+r.mine.length+'건</div>'
    +(r.mine.length?r.mine.map(_pullRow).join('')
      :'<div class="muted" style="font-size:12px;padding:6px 2px">찾는 조건에 내 담당 건이 없습니다.</div>')
    +'<div class="phd">○ 다른 사람 담당 '+r.other.length+'건</div>'
    +(r.other.length?r.other.slice(0,LIM).map(_pullRow).join('')
      :'<div class="muted" style="font-size:12px;padding:6px 2px">없습니다.</div>')
    +(more>0?'<div class="muted" style="font-size:11.5px;padding:6px 2px">…외 '+more+'건. 사업장 이름을 적어 좁혀 보세요.</div>':'')
    +'</div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:12px"><button onclick="closeM()">닫기</button></div>');
  var el=$('pull-q'); if(el){ el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(e){} }
}
var _pullT=null;
function onPullQ(v){ S._pullQ=v; clearTimeout(_pullT); _pullT=setTimeout(_pullModal,220); }
function pullOne(pid,asSub){
  var c=(S._pullC||{})[pid];
  if(!c){ toast('건을 찾을 수 없습니다','warn'); return; }
  var me=S.me||{};
  if(asSub&&!me.sid&&!me.name){ toast('로그인 정보를 읽지 못했습니다','warn'); return; }
  loadStaff().then(function(st){
    var name2sid={}; st.forEach(function(u){ name2sid[u.name]=u.sid; });
    var up={}, now=new Date().toISOString(), meRec={sid:me.sid||'',name:me.name||''};
    function hasMe(arr){
      return (arr||[]).some(function(s){ return s&&((me.sid&&s.sid===me.sid)||(me.name&&s.name===me.name)); });
    }
    if(c._have){
      var it=c._have;
      if(hasMe(it.mgr_subs)||roleOf(it,meRec)==='main'){ closeM(); openDrawer(it._id); return; }
      up[NS+'/items/'+it._id+'/mgr_subs']=(it.mgr_subs||[]).concat([meRec]);
      up[NS+'/items/'+it._id+'/pe_addsub']=[me.sid||''];
      up[NS+'/items/'+it._id+'/up_at']=now;
    }else{
      var mSid=c.mgrSid||name2sid[c.mgr]||'';
      var subs=(c.subs||[]).map(function(n){ return {sid:name2sid[n]||'',name:n}; });
      if(asSub&&!hasMe(subs)) subs.push(meRec);
      // pe_m = 푸른이알피 소유 필드 스냅샷. 가져오는 시점에 함께 찍어 둔다.
      var m={}; PE_MIRROR.forEach(function(f){ m[f]=c[f]||''; });
      m.mgr=mSid+'/'+(c.mgr||''); m.subs=(c.subs||[]).join('|');
      var rec={ no:c.no||(S.year+'-'+c.cat+'-PE'), cat:c.cat, ptype:c.ptype||'',
        company:c.company||'', client:c.client||'', officer:c.officer||'',
        jur_org:c.jur_org||'', jur_ph:c.jur_ph||'', jur_em:c.jur_em||'',
        title:c.title||'', due:c.due||'', start:c.start||'', status:'진행중',
        brief:c.brief||'', co_id:c.co_id||'',
        mgr_main:{sid:mSid,name:c.mgr||''}, mgr_subs:subs,
        src:'puerp', ref:c.ref, pe_m:m, created_at:now };
      if(asSub) rec.pe_addsub=[me.sid||''];   // 푸른이알피 공동담당에도 나를 더해 달라는 요청
      up[NS+'/items/'+c.pid]=rec;
      up[NS+'/pe_seen/'+c.ref.type+'/'+safeKey(c.ref.id)]=true;
    }
    fbDb.ref().update(up).then(function(){
      toast(asSub?'부담당으로 붙였습니다 — 푸른이알피 공동담당에도 반영됩니다':'🔗 내 업무로 가져왔습니다');
      _pullModal(); route();
    }).catch(function(e){ toast('실패: '+e.message,'warn'); });
  });
}

/* ── 기존 업무 ↔ 푸른이알피 짝짓기 ───────────────────────────────────
   엑셀에서 옮겨 온 업무(src:'excel')는 ref가 없어 동기화 대상이 아니다.
   같은 사건이 푸른이알피에도 있으면 짝을 지어 연동시킨다 — 새로 만들지 않고
   기존 항목에 ref를 붙이므로, 그동안 쌓인 주간 기록과 노트가 그대로 살아 있다. */
function _mtScore(it,c){
  var a=_normCo(it.company), b=_normCo(c.company);
  if(!a||!b||a!==b) return 0;                     // 기업명이 다르면 후보 아님
  var s=50;
  var t1=String(it.title||'').replace(/\s/g,''), t2=String(c.title||'').replace(/\s/g,'');
  if(t1&&t2){
    if(t1===t2) s+=40;
    else if(t1.indexOf(t2)>=0||t2.indexOf(t1)>=0) s+=25;
    else {
      var n=0; for(var i=0;i<t1.length-1;i++){ if(t2.indexOf(t1.substr(i,2))>=0) n++; }
      s+=Math.min(20,Math.round(n/Math.max(1,t1.length-1)*20));
    }
  }
  if(it.cat&&c.cat&&it.cat===c.cat) s+=10;
  var c1=String(it.client||'').trim(), c2=String(c.client||'').trim();
  if(c1&&c2&&c1===c2) s+=10;
  return s;
}
// 연동 안 된 기존 업무 → 푸른이알피 후보 (점수순)
function matchPairs(){
  var cand=puerpCandidates(); if(!cand) return null;
  var used={};
  allItems().forEach(function(it){ if(peLinked(it)) used[it.ref.type+'|'+safeKey(it.ref.id)]=1; });
  var free=cand.filter(function(c){ return !used[c.ref.type+'|'+safeKey(c.ref.id)]; });
  var out=[];
  openItems().forEach(function(it){
    if(peLinked(it)) return;
    var hits=free.map(function(c){ return {c:c,s:_mtScore(it,c)}; })
      .filter(function(x){ return x.s>0; })
      .sort(function(a,b){ return b.s-a.s; }).slice(0,3);
    if(hits.length) out.push({it:it,hits:hits});
  });
  out.sort(function(a,b){ return b.hits[0].s-a.hits[0].s
    ||String(_mgrOf(a.it)).localeCompare(String(_mgrOf(b.it)),'ko'); });
  return out;
}

function runMatch(){
  var ids=Object.keys(S._mt||{}), up={}, n=0, msg=$('mt-msg'), taken={};
  ids.forEach(function(iid,i){
    var sel=$('mt-'+i); if(!sel||!sel.value) return;
    var p=S._mt[iid]; if(!p) return;
    var c=(p.hits.filter(function(x){return x.c.pid===sel.value;})[0]||{}).c;
    if(!c) return;
    var k=c.ref.type+'|'+safeKey(c.ref.id);
    if(taken[k]) return;                          // 한 푸른이알피 건에 두 업무를 붙이지 않는다
    taken[k]=1;
    var P=NS+'/items/'+iid+'/';
    var m={}; PE_MIRROR.forEach(function(f){ m[f]=c[f]||''; });
    m.mgr=(c.mgrSid||'')+'/'+(c.mgr||''); m.subs=(c.subs||[]).join('|');
    up[P+'src']='puerp'; up[P+'ref']=c.ref; up[P+'pe_m']=m;
    // 업무 요약은 비어 있을 때만 씨앗을 넣는다 — 업무관리에서 이미 쓴 요약을 덮지 않는다
    if(c.brief && !briefTrim((items[iid]||{}).brief)) up[P+'brief']=c.brief;
    up[P+'co_id']=c.co_id||''; up[P+'cat']=c.cat; up[P+'ptype']=c.ptype||''; up[P+'no']=c.no||'';
    up[P+'up_at']=new Date().toISOString();
    up[NS+'/pe_seen/'+c.ref.type+'/'+safeKey(c.ref.id)]=true;
    n++;
  });
  if(!n){ if(msg)msg.textContent='선택된 짝이 없습니다.'; return; }
  if(msg)msg.textContent='연결 중… ('+n+'건)';
  fbDb.ref().update(up).then(function(){
    closeM(); toast('🔗 '+n+'건 짝지어 연동 — 기록은 그대로 남았습니다'); route();
    // 짝짓기가 끝나면 남은 것을 정리할 차례 — 순서를 사람이 기억하지 않아도 되게 이어 준다
    setTimeout(function(){
      var left=kindFixList().length; if(!left) return;
      var P2=matchPairs();
      var more=P2?P2.length:0;
      showModal('<h2 style="margin:0 0 6px">🔗 '+n+'건 연결 완료</h2>'
        +'<p class="muted" style="font-size:12.5px;line-height:1.7">이제 구분과 유형이 푸른이알피에서 들어옵니다.<br>'
        +(more?'아직 <b>짝지을 수 있는 업무가 '+more+'건</b> 남아 있습니다. 이어서 짝지으시겠어요?'
              :'짝지을 수 있는 건은 다 끝났습니다. 푸른이알피에 짝이 없는 <b>'+left+'건</b>은 구분 정리로 마무리하세요.')
        +'</p>'
        +'<div class="row" style="justify-content:flex-end;margin-top:12px"><button onclick="closeM()">나중에</button>'
        +(more?'<button class="primary" onclick="closeM();matchModal()">이어서 짝짓기 →</button>'

/* ── 연결 안 된 엑셀 이관분 구분 정리 ─────────────────────────────────
   푸른이알피와 연결된 건은 미러가 알아서 구분=종류, 유형=ptype으로 맞춘다.
   연결되지 않은 엑셀 이관분은 구분 칸에 유형(체불·부해…)이 그대로 남아 있어

   '기타'로 둔다 — 종류를 알 수 없으므로 지어내지 않는다.
   ⚠ 가장 좋은 방법은 짝짓기로 푸른이알피와 연결하는 것이다. 이건 짝지을 수
     없는 나머지를 위한 보조 수단이다. */
function kindFixList(){
  return openItems().filter(function(it){
    return !peLinked(it)&&!isKind(it.cat)&&String(it.cat||'').trim()
      &&!String(it.ptype||'').trim();
  });

  // 전부 '기타'가 되어 정보가 뭉개진다.

    +'유형을 <b>업무명 자리로 옮기고</b> 구분은 <b>기타</b>로 둡니다. 기록·노트는 그대로입니다.</p>'

        +'<span style="flex:1;min-width:190px">⚠ 이 중 <b>'+still+'건</b>은 아직 푸른이알피와 <b>짝지을 수 있습니다</b>.<br>'

        +'<button class="primary" onclick="closeM();matchModal()">짝짓기 먼저 →</button></div>'
      :'<div style="background:var(--acc-soft);border:1px solid #c7d7fe;border-radius:9px;padding:9px 12px;font-size:12px;margin-bottom:10px">'
        +'짝지을 수 있는 건은 남아 있지 않습니다. 이 '+arr.length+'건은 푸른이알피에 짝이 없어 정리 대상입니다.</div>')
    +'<div style="max-height:38vh;overflow-y:auto;font-size:12.5px">'

    +'</div>'
    +'<div id="kf-msg" class="muted" style="font-size:12px;min-height:18px;margin-top:8px"></div>'

        officer:c.officer||'', title:c.title||'', due:c.due||'', start:c.start||'', status:'진행중',
        brief:c.brief||'',                        // 업무 요약 씨앗 — 이후에는 pesync가 양방향으로 맞춘다
        co_id:c.co_id||'', mgr_main:{sid:mSid,name:c.mgr||''},
        mgr_subs:(c.subs||[]).map(function(nm){return {sid:name2sid[nm]||'',name:nm};}),
        src:'puerp', ref:c.ref, pe_m:m, created_at:new Date().toISOString() };

// 엑셀 이관분 삭제 경로만 만들어 반환한다 — 커밋하지 않는다.
// 삭제와 새 데이터 등록을 한 번의 update()로 묶어야, 업로드가 실패해도 기존 데이터가 남는다.
// (예전엔 삭제를 먼저 커밋해서, 이후 실패 시 옛 데이터가 영구히 사라질 수 있었다.)
function excelWipePaths(msg){
  var ex=excelImported();
  if(!ex.length) return Promise.resolve({paths:{},ids:[],n:0});
  if(msg) msg.textContent='기존 이관분 '+ex.length+'건 확인 중…';
  // 삭제 직전 최신 상태를 서버에서 다시 읽는다(캐시된 목록이 오래되어 주별 기록이 남는 문제 방지)
  return Promise.all(ex.map(function(it){
      return fbDb.ref(NS+'/itemlogs/'+it._id).once('value')
        .then(function(s){ return {id:it._id,lg:s.val()||{}}; })
        .catch(function(){ return {id:it._id,lg:itemLogsCache[it._id]||{}}; });
    }))
    .then(function(arr){
      var paths={};
      arr.forEach(function(o){
        paths[NS+'/items/'+o.id]=null;
        paths[NS+'/itemlogs/'+o.id]=null;
        Object.keys(o.lg).forEach(function(lid){
          var w=o.lg[lid]&&o.lg[lid].w; if(w) paths[NS+'/logs/'+weekYear(w)+'/'+w+'/'+o.id+'/'+lid]=null;
        });
      });
      return {paths:paths,ids:arr.map(function(o){return o.id;}),n:ex.length};
    });
}
function runImport(){
  var f=$('imp-file').files[0]; var msg=$('imp-msg');
  if(!f){ msg.textContent='파일을 선택하세요.'; return; }
  var rd=new FileReader();
  rd.onload=function(){
    var data;
    try{ data=JSON.parse(rd.result); }catch(e){ msg.textContent='JSON 파싱 실패: '+e.message; return; }
    var arr=data.items||data;
    if(!Array.isArray(arr)){ msg.textContent='형식 오류: items 배열이 없습니다.'; return; }
    // 키 사전 검사 — 원본 xk가 아니라 "실제로 쓰일 Firebase 키"로 검사해야 한다.
    // safeKey가 금지문자를 '_'로 바꾸므로 a.b 와 a#b 는 같은 키가 되어 서로 덮어쓴다.
    var kseen={}, kdup=0, kbad=0, dupEx=[];
    arr.forEach(function(r){
      if(!r||!r.xk){ kbad++; return; }
      var k=safeKey(r.xk);
      if(!k||k.replace(/_/g,'')===''){ kbad++; return; }
      if(kseen[k]){ kdup++; if(dupEx.length<3) dupEx.push(r.xk); } else kseen[k]=1;
    });
    if(kdup||kbad){
      msg.innerHTML='<b style="color:var(--danger)">중단: 이관 키에 문제가 있습니다.</b>'
        +(kdup?' 변환 후 키 중복 '+kdup+'건'+(dupEx.length?' (예: '+esc(dupEx.join(', '))+')':''):'')
        +(kbad?' · 키 없음/사용불가 '+kbad+'건':'')
        +'<div class="muted" style="font-size:11.5px;margin-top:4px">그대로 넣으면 그만큼 서로 덮어써 사라집니다. 추출 스크립트를 다시 실행해 받은 파일을 쓰세요.</div>';
      return;
    }
    var wipe=$('imp-wipe')&&$('imp-wipe').checked;
    (wipe?excelWipePaths(msg):Promise.resolve({paths:{},ids:[],n:0})).then(function(w){
      return loadStaff().then(function(st){ return {w:w,st:st}; });
    }).then(function(ctx){
      var w=ctx.w, st=ctx.st;
      var byName={}; st.forEach(function(u){byName[u.name]=u;});
      // 삭제 경로를 먼저 담고, 아래에서 새 데이터를 같은 객체에 쌓아 한 번에 커밋한다
      var up={}, nItems=0, nLogs=0, skip=0;
      var wipedIds={}; w.ids.forEach(function(x){ wipedIds[x]=1; });
      Object.keys(w.paths).forEach(function(k){ up[k]=null; });
      var seqs={};   // 이관 관리번호 채번(구분별) — 기존 items 스캔(지울 것은 제외)
      allItems().forEach(function(it){ if(wipedIds[it._id]) return;
        var m=/^(\d{4})-(.+)-(\d+)$/.exec(it.no||'');
        if(m&&m[1]==String(S.year)){ var k2=m[2]; seqs[k2]=Math.max(seqs[k2]||0,+m[3]); } });
      arr.forEach(function(r){
        if(!r||!r.xk) return;
        var id='X-'+safeKey(r.xk);
        if(items[id]&&!wipedIds[id]){ skip++; return; }   // 지울 대상이면 새로 넣는다
        var cat=String(r.cat||'').trim()||'기타';   // 구분은 원본 표기를 그대로 살린다
        seqs[cat]=(seqs[cat]||0)+1;
        var mgr=byName[r.mgr]||{sid:'',name:r.mgr||''};
        var rec={ no:S.year+'-'+cat+'-'+('00'+seqs[cat]).slice(-3), cat:cat,
          company:r.company||'', client:r.client||'', officer:r.officer||'',
          title:r.title||'', due:r.due||'', start:r.start||'', status:'진행중',
          mgr_main:{sid:mgr.sid,name:mgr.name},
          mgr_subs:(r.subs||[]).map(function(n){ var u=byName[n]||{sid:'',name:n}; return {sid:u.sid,name:u.name}; }),
          src:'excel', created_at:new Date().toISOString() };
        var logs=r.logs||[];
        var last=null;
        logs.forEach(function(lg){
          if(!lg||!lg.d||!lg.t) return;
          var wk2=weekKeyOf(mondayOf(new Date(lg.d+'T00:00:00')));
          var lid=rid('L'); nLogs++;
          var log={d:lg.d,t:lg.t,by:mgr.sid||'',byName:mgr.name||'',at:new Date().toISOString(),imp:1};
          up[NS+'/logs/'+weekYear(wk2)+'/'+wk2+'/'+id+'/'+lid]=log;
          up[NS+'/itemlogs/'+id+'/'+lid]=Object.assign({w:wk2},log);
          if(!last||last.d<=lg.d) last={d:lg.d,t:lg.t};
        });
        if(last) rec.last=last;
        up[NS+'/items/'+id]=rec;
        nItems++;
      });
      if(!nItems){ msg.textContent='새로 가져올 건이 없습니다 (중복 '+skip+'건 건너뜀).'; return; }
      msg.textContent='등록 중… ('+(w.n?'기존 '+w.n+'건 교체, ':'')+nItems+'건, 기록 '+nLogs+'줄)';
      // 삭제(null)와 등록을 한 번의 update로 — 실패하면 아무것도 바뀌지 않는다
      fbDb.ref().update(up).then(function(){
        msg.textContent='';
        toast('✅ 이관 완료: 업무 '+nItems+'건, 기록 '+nLogs+'줄'
          +(w.n?' (기존 '+w.n+'건 교체)':'')+(skip?' (중복 '+skip+' 건너뜀)':''));
        wkCache={}; wkLoaded={}; itemLogsCache={}; _watchWkKey=null; watchWeek();
        closeM(); route();
      }).catch(function(e){ msg.textContent='업로드 실패: '+e.message; });
    }).catch(function(e){ msg.textContent='실패: '+e.message; });
  };
  rd.readAsText(f,'utf-8');
}

/* ── 폰 홈화면 앱 등록 (https 에서만 — file:// 나 http 에서는 조용히 넘긴다) ── */
if('serviceWorker' in navigator && location.protocol==='https:')
  /* 통합 워커 하나만 등록 — 앱마다 따로 등록하면 서로 밀어내 명함첩·사진첩 공유가 죽는다 */
  navigator.serviceWorker.register('pu-sw.js').catch(function(){});
</script>
