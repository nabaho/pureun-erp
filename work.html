    +'여기에 적으면 목록의 업무명이 되고 <b>푸른이알피에도 반영</b>됩니다. '
    +'빈 칸은 그냥 두면 됩니다.</p>'
    +'<div style="max-height:52vh;overflow-y:auto">';
  arr.forEach(function(it,i){
    h+='<div style="display:grid;grid-template-columns:1fr 1.3fr;gap:7px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)">'
      +'<div style="font-size:12px;min-width:0">'+catBadge(it.cat)
      +' <b>'+esc(it.company||'—')+'</b>'
      +'<div class="muted" style="font-size:10.5px">'+esc(it.no||'')+' · '+esc(_mgrOf(it))+'</div></div>'
      +'<input id="bf-'+i+'" maxlength="'+BRIEF_MAX+'" placeholder="'+esc(it.cat||'')+' 컨설팅" '
      +'style="padding:5px 9px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;min-width:0">'
      +'</div>';
  });
  h+='</div><div id="bf-msg" class="muted" style="font-size:12px;min-height:18px;margin-top:8px"></div>'
    +'<div class="row" style="justify-content:flex-end"><button onclick="closeM()">취소</button>'
    +'<button class="primary" onclick="briefFillSave()">적은 것 저장</button></div>';
  showModal(h);
  setTimeout(function(){ var e=$('bf-0'); if(e)e.focus(); },60);
}
function briefFillSave(){
  var ids=S._bf||[], up={}, n=0, msg=$('bf-msg'), now=new Date().toISOString();
  ids.forEach(function(id,i){
    var v=briefTrim((($('bf-'+i)||{}).value)||'');
    if(!v) return;
    up[NS+'/items/'+id+'/brief']=v;
    up[NS+'/items/'+id+'/up_at']=now;
    n++;
  });
  if(!n){ if(msg)msg.textContent='적은 것이 없습니다.'; return; }
  if(msg)msg.textContent='저장 중… ('+n+'건)';
  fbDb.ref().update(up).then(function(){
    closeM(); toast('✏️ 업무 이름 '+n+'건 저장 — 푸른이알피에도 반영됩니다'); route();
  }).catch(function(e){ if(msg)msg.textContent='실패: '+e.message; });
}
var peMaster={};                                   // {유형:[레코드]} — 읽기 실패한 유형은 키가 없다
var peState={since:null,at:null,n:0,err:''};
var _peU2N=null, _peT=null, _peBusy=false, _peWatching=false;

function _peArr(v){
  if(v&&!Array.isArray(v)&&typeof v==='object') v=Object.keys(v).map(function(k){return v[k];});
  return Array.isArray(v)?v.filter(Boolean):null;
}
// 이름 해석용 sid→이름 (퇴직자 포함 — loadStaff는 재직자만 주므로 따로 읽는다)
/* 사번 → 이름 표를 «정말로» 만들어 냈는가.
   ★ 2026-09-05 대표 보고: 사무장(A-001) 「내 업무」에 부담당 업무가 한 건도 안 나왔다.
     까닭 — data/user_accounts 는 «재무 권한자만» 읽는 자리다(규칙 finOnly).
     권한이 없으면 이 표가 통째로 비고, 부담당은 «이름으로만» 옮겨지므로
       subs = managerSubs.map(sid → 이름).filter(있는 것만)
     이 줄에서 전부 걸러져 «부담당이 통째로 사라진다».
     ⚠ 더 나쁜 것 — 그 빈 값이 그대로 저장되어, 권한 없는 사람이 앱을 한 번 열면
       모두의 부담당이 지워졌다. 그래서 아래 미러는 이 표를 못 읽었으면 «건드리지 않는다». */
var _peU2NKnown=false;
function peUsers(){
  if(_peU2N) return Promise.resolve(_peU2N);
  function fin(arr,known){
    var m={}, n=0;
    (arr||[]).forEach(function(u){ if(u&&u.sid){ m[u.sid]=u.name||u.sid; n++; } });
    if(known&&n) _peU2NKnown=true;
    _peU2N=m; return m;
  }
  var l=_ls('user_accounts'); if(l&&l.length) return Promise.resolve(fin(l,1));
  /* 재무 권한이 없으면 user_accounts 에서 막힌다 → 전 직원이 읽는 «공개 명부»로 되짚는다
     (loadStaff 가 쓰는 그 길과 같다 — 푸른이알피도 로그인할 때 이 자리를 본다). */
  return fbDb.ref('data/user_accounts/v').once('value')
    .then(function(s){ var a=_peArr(s.val()); return (a&&a.length)?a:null; }, function(){ return null; })
    .then(function(a){
      if(a) return fin(a,1);
      return fbDb.ref('data/user_dir/v').once('value')
        .then(function(s){ return fin(_peArr(s.val()),1); }, function(){ return fin([],0); });
    });
}
function peLoadAll(){
  // 유형 마스터를 먼저 읽는다 — 이것이 없으면 ptype이 코드로 남아 업무명이 비어 보인다
  var tload=Promise.all(Object.keys(PE_TKEY).map(function(kv){
    return fbDb.ref('data/'+PE_TKEY[kv]+'/v').once('value')
      .then(function(s){ return [kv,_peArr(s.val())]; })
      .catch(function(){ return [kv,_ls(PE_TKEY[kv])]; });
  })).then(function(rows){ rows.forEach(function(r){ if(r[1]) peTypes[r[0]]=r[1]; }); });
  return tload.then(function(){
    return Promise.all(PE_DEF.map(function(d){
      /* 업체 명단은 업체 잇기용으로 이미 읽어 두었다(coSrc) — 같은 자리를 두 번 읽지 않는다 */
      if(d[0]==='companies'&&coSrc&&coSrc.length) return Promise.resolve([d[0],coSrc]);
      return fbDb.ref('data/'+PE_KEYS[d[0]]+'/v').once('value')
        .then(function(s){ return [d[0],_peArr(s.val())]; })
        .catch(function(){ return [d[0],_ls(PE_KEYS[d[0]])]; });   // 권한/네트워크 실패 → 캐시 폴백
    }));
  }).then(function(rows){
    rows.forEach(function(r){ if(r[1]) peMaster[r[0]]=r[1]; });
    // 거꾸로도 나눠 쓴다 — 여기서 먼저 읽었으면 업체 잇기가 다시 안 읽는다
    if((!coSrc||!coSrc.length)&&peMaster.companies) coSrc=peMaster.companies;
    return peMaster;
  });
}
// 마스터 1건 → 업무시트 항목 후보
function _peCandOf(t,label,dNo,dTitle,dKind,x,sid2name,dCo){
  var co=dCo?dCo(x):(x.companyName||x.fundName||x.targetName||'');
  var kind=dKind(x), title=dTitle(x);
  /* 관할(상대기관) — 노동청·노동위원회와 그쪽 담당자(감독관·조사관).
     ⚠ 푸른이알피는 지금 judgment에 담고 jurisdiction은 옛 이름으로만 남겨 두었다.
        예전에는 jurisdiction만 봐서 요즘 등록한 사건은 담당자가 늘 비어 있었다. */
  var J=x.judgment||x.jurisdiction||{};
  // 구분 = 사무관리 메뉴 5종, 업무명 자리에 쓸 유형은 ptype에 따로 담는다
  return { pid:'PE-'+t+'-'+safeKey(x.id), kindLabel:label, no:dNo(x)||'',
    cat:label, ptype:peType(t,x,kind), end_way:peEndWay(x),
    // ⚠ 회사명을 업무명으로 쓰지 않는다 — 기업 칸과 똑같이 보이고,
    //   기본정보 양방향이 그 값을 푸른이알피 title에 되돌려써 마스터가 더러워진다.
    //   비면 비운 채로 두고 화면에서 업무 요약·유형으로 대신 보여준다(itemName).
    //   유형도 넣지 않는다 — ptype이 따로 담으므로 업무명에까지 넣으면 같은 값이 두 번 나온다
    company:co, title:String(title||'').trim(),
    pe_st:peStatus(x),                            // 푸른이알피 원본 상태 (계약관리 상담접수 등)
    officer:String(J.officer||'').trim(),         // 상대기관 담당자 (감독관·조사관)
    jur_org:String(J.org||'').trim(),             // 관할기관 (○○지청·○○지방노동위원회)
    jur_ph:String(J.phone||'').trim(), jur_em:String(J.email||'').trim(),
    brief:briefTrim(x.brief),
    client:x.payee||'', mgr:sid2name[x.managerMain]||'', mgrSid:x.managerMain||'',
    /* 업체 담당자 조회용 — 이름 매칭보다 정확하다.
       ⚠ 자문(업체관리)은 «그 업체 자신»이 원본이라 제 번호를 쓴다. 이것이 있어야
         사업장 담당자·오간 메일·보낸 자료가 자문 업무에도 그대로 붙는다. */
    co_id:x.companyId||(t==='companies'?String(x.id||''):''),
    subs:(x.managerSubs||[]).map(function(sd){return sid2name[sd]||'';}).filter(Boolean),
    due:_peDue(x), start:x.receiveDate||x.contractStartDate||'',
    ref:{type:t,id:String(x.id)} };
}
// 5종 마스터 → 미종료 후보 전체. null = 한 유형도 못 읽음
function puerpCandidates(){
  var sid2name=_peU2N||{}, out=[], any=false;
  PE_DEF.forEach(function(d){
    var arr=peMaster[d[0]]; if(!arr) return; any=true;
    arr.forEach(function(x){
      if(!x||!x.id||_peClosed(x,d[0])) return;
      out.push(_peCandOf(d[0],d[1],d[2],d[3],d[4],x,sid2name,d[5]));
    });
  });
  return any?out:null;
}
// 마스터 + 사용자 준비
function peReady(){ return Promise.all([peLoadAll(),peUsers()]); }

/* ── 자동 연동 엔진 ─────────────────────────────────────────────────
   ① 기준일(config/pe_since)이 없으면 = 최초 실행. 현재 있는 모든 건을
      pe_seen에 "이미 본 것"으로만 적고 항목은 만들지 않는다.
      → 엑셀 이관 163건과 겹치는 백로그가 쏟아지는 것을 막는다.
      (pu-erp 레코드에 등록일 필드가 없어 날짜 비교가 불가능하므로 id 스냅샷을 쓴다)
   ② 기준일 이후 새로 등록된 건(pe_seen에 없는 건)만 자동 생성한다.
   ③ 푸른이알피 소유 필드는 pe_m 스냅샷과 비교해 "푸른이알피에서 실제로
      바뀐 경우에만" 갱신한다. → 여기서 사람이 고친 값이 조용히 안 덮인다.
   ④ 종료·재개는 pu-erp의 pesync 엔진 담당 — 여기서 손대지 않는다. */
function peWatch(){
  if(_peWatching) return; _peWatching=true;
  // data/{키}/u = 그 키의 변경 타임스탬프 1개. 본문 대신 이것만 구독해 트래픽을 줄인다.
  PE_DEF.forEach(function(d){
    fbDb.ref('data/'+PE_KEYS[d[0]]+'/u').on('value',function(){ peBump(); },function(){});
  });
  peBump();                                        // u 노드가 없는 경우에도 최초 1회는 돌린다
}
function peBump(){
  clearTimeout(_peT);
  _peT=setTimeout(function(){
    // 마스터를 읽은 뒤 한 번 다시 그린다 — "주담당 미연결 N건" 안내는
    // peMaster가 채워진 뒤에야 판단할 수 있고, 쓸 게 없으면 items 리스너가 안 울린다.
    peLoadAll().then(function(){ if(!appHasFocus()) route(); return peAutoSync(); });
  },1000);   // 5개 구독이 몰려 와도 1회만
}
function peAutoSync(){
  if(_peBusy) return Promise.resolve();
  if(!PE_DEF.some(function(d){return !!peMaster[d[0]];})) return Promise.resolve();
  _peBusy=true;
  return Promise.all([
    peUsers(), loadStaff(),
    fbDb.ref(NS+'/pe_seen').once('value').then(function(s){return s.val()||{};}).catch(function(){return null;}),
    fbDb.ref(NS+'/config/pe_since').once('value').then(function(s){return s.val()||'';}).catch(function(){return null;})
  ]).then(function(r){
    var sid2name=r[0], staff=r[1], seen=r[2], since=r[3];
    if(seen===null||since===null){ peState.err='연동 설정을 읽지 못했습니다'; return; }
    peState.err=''; peState.since=since||'';
    var name2sid={}; staff.forEach(function(u){ name2sid[u.name]=u.sid; });
    var ceo=staff.filter(function(u){return /대표/.test(u.title||'');})[0]||null;

    // 현재 마스터 상태: live=존재하는 전체 id, cand=미종료 후보
    var cand=[], live={};
    /* 이관표를 여기서 한 번 만든다 — 계약 한 건마다 저장소를 훑으면 느리다 */
    var xmap={}; try{ xmap=peXferMap(); }catch(e){}
    var xrdy=xferReady();
    PE_DEF.forEach(function(d){
      var arr=peMaster[d[0]]; if(!arr) return;
      live[d[0]]={};
      arr.forEach(function(x){
        if(!x||!x.id) return;
        live[d[0]][safeKey(String(x.id))]=1;
        if(_peClosed(x,d[0])) return;
        var c0=_peCandOf(d[0],d[1],d[2],d[3],d[4],x,sid2name,d[5]);
        /* 업체관리 한 갈래 안에 자문과 급여대행이 섞여 있다 (대표 지시 2026-09-06
           「급여 자문등 전체를 모두 포함해서 … 양을 알려고」).
           업체 유형이 급여면 구분도 「급여」로 갈라 준다 — 그래야 업무량 막대에서
           「자문 몇, 급여 몇」이 갈려 보인다. 한 덩어리면 그 물음에 답할 수 없다.
         ⚠ 유형 이름을 그대로 구분으로 쓰지 않는다. 업체 유형은 여럿이라
           구분이 열 갈래로 흩어진다. 「급여」 하나만 갈라 낸다. */
        if(d[0]==='companies'&&/급여/.test(String(c0.ptype||''))) c0.cat='급여';
        /* ★ «이미 넘어간» 계약만 새로 만들지 않는다 (대표 지시 2026-09-06
           「계약관리부터 모든 사업들을 포함시켜라」).
           예전에는 «넘어갈 종류»면 무조건 안 만들었다. 그래서 상담접수·계약협의
           중인 건이 — 담당자가 붙어 실제로 일하고 있는데도 — 업무관리 어느 화면에도
           없었다. 넘어가는 것은 나중 일이고, 그때까지 한 일은 어딘가 적혀야 한다.
           ⚠ 넘어가면 그 계약 업무는 «종료(이관)»로 빠진다(아래 ② 이관 종료).
             그것이 없으면 계약과 사건이 둘 다 열려 있게 된다 —
             대표가 2026-08 에 「계약에 남아 있다」고 알려 준 바로 그 사고다.
           ⚠ 마스터를 다 못 읽었으면 예전 잣대(종류)로 돌아간다. 모르면 안 만든다.
           ⚠ 후보에서 통째로 빼지는 않는다 — 이미 연결된 계약 업무가
             담당자·업무명 미러까지 끊긴다. */
        if(d[0]==='contract'&&(xrdy?peXferredNow(x,xmap):peWillTransfer(x))) c0.xfer=1;
        cand.push(c0);
      });
    });
    var up={};

    // ① 최초 실행 — 기준선만 기록하고 끝낸다
    if(!since){
      var t0=todayStr();
      Object.keys(live).forEach(function(t){
        Object.keys(live[t]).forEach(function(k){ up[NS+'/pe_seen/'+t+'/'+k]=true; });
      });
      up[NS+'/config/pe_since']=t0;
      return fbDb.ref().update(up).then(function(){
        peState.since=t0; peState.at=new Date().toISOString();
        toast('🔗 자동 연동 시작 — 오늘부터 푸른이알피에 등록되는 건이 자동으로 들어옵니다');
      });
    }

    // ② 기존 연동건: 원본 존재 여부 + 소유 필드 미러 + 저쪽에서 끝난 건 닫기
    var closed=0;
    var byRef={}, candByRef={};
    allItems().forEach(function(it){ if(peLinked(it)) byRef[it.ref.type+'|'+safeKey(it.ref.id)]=it; });
    cand.forEach(function(c){ candByRef[c.ref.type+'|'+safeKey(c.ref.id)]=c; });
    Object.keys(byRef).forEach(function(k){
      var it=byRef[k], P=NS+'/items/'+it._id+'/';
      // 원본 삭제 감지 — 그 유형을 실제로 읽어냈을 때만 판단한다(읽기 실패로 전건 오표시 방지)
      if(live[it.ref.type]){
        var gone=!live[it.ref.type][safeKey(it.ref.id)];
        if(gone&&!it.pe_gone) up[P+'pe_gone']=true;
        if(!gone&&it.pe_gone) up[P+'pe_gone']=null;
      }
      /* ── 푸른이알피에서 끝난 건은 여기서도 닫는다 (대표 지시 2026-09-05) ──
         「계약관리에서 종료했는데 업무관리에 그대로 남아 있다」.
         까닭: 종료를 반영하는 엔진(pesync)은 «푸른이알피를 열어야만» 돈다.
           계약을 종료하고 푸른이알피를 안 열면 업무관리는 영영 모른다.
           그래서 담당 미지정 84건처럼 끝난 계약이 진행중으로 쌓였다.

         ⚠ «한 방향»으로만 닫는다 — 저기가 닫혔고 여기가 열렸을 때만.
           그 반대(여기서 닫고 저기가 열림)는 손대지 않는다. 그것은 pesync 가 할 일이고,
           여기서 건드리면 두 곳이 서로를 되돌리며 싸운다.
         ⚠ 사람이 «여기서 나중에» 손댄 흔적이 있으면 그대로 둔다.
           업무관리에서 재개했는데 푸른이알피가 아직 모를 수 있다 — 그때 닫으면
           방금 되살린 것을 도로 덮는다. pesync 의 충돌 규칙과 같은 잣대를 쓴다. */
      if(it.state!=='done'){
        var _rc=peRec(it);
        if(_rc&&_peClosed(_rc,it.ref&&it.ref.type)){
          var _peAt=String(_rc.closedAt||_rc.closedDate||_rc.updatedAt||'');
          var _wsAt=String(it.state_at||'');
          if(!(_wsAt&&_peAt&&_wsAt>_peAt)){
            var _w=peEndWay(_rc)||'done';
            up[P+'state']='done';
            up[P+'done_date']=String(_rc.closedDate||_rc.closedAt||todayStr()).slice(0,10);
            up[P+'end_way']=_w;
            up[P+'status']=(END_BY_KEY[_w]||END_WAYS[0])[1];
            if(_w==='transfer'&&_rc.transferredTo) up[P+'end_to']=String(_rc.transferredTo);
            var _rr=peResult(_rc); if(_rr) up[P+'end_result']=_rr;
            up[P+'state_at']=new Date().toISOString();
            closed++;
          }
        }
        /* ★ 넘어간 계약은 종료(이관)로 뺀다 (대표 지시 2026-09-06).
           푸른이알피는 원본 계약을 한 줄도 «안 건드린다» — 이관은 옮기기가 아니라
           복사다. 그래서 계약 쪽은 영영 「진행중」으로 남고, 넘어간 사건·컨설팅과
           나란히 두 건이 된다. 여기서 닫아 줘야 한 건이 된다.
         ⚠ 기록은 그대로 남는다 — 상담 단계에서 적은 것이 종료 화면에서 이어 보인다.
         ⚠ 사람이 이미 손수 종료했으면(state_at 이 더 나중) 건드리지 않는다.
         ⚠ 이관표를 못 믿을 때는 아무것도 안 한다 — 잘못 닫으면 일하던 건이 사라진다. */
        if(xrdy&&it.state!=='done'&&catNorm(it.cat)==='계약'){
          var _xg=xmap[String(it.no||'').trim()];
          if(_xg&&_xg.length){
            up[P+'state']='done';
            up[P+'done_date']=todayStr();
            up[P+'end_way']='transfer';
            up[P+'status']=(END_BY_KEY.transfer||END_WAYS[0])[1];
            up[P+'end_to']=_xg.join('·');
            up[P+'state_at']=new Date().toISOString();
            closed++;
          }
        }
      }
      // 이미 종료된 건의 "끝낸 방식"을 푸른이알피에서 한 번 당겨온다.
      // 종료 상태 자체는 pesync가 담당하고, 여기서는 방식(종료·취소·이관)만 채운다.
      // 이미 값이 있으면 건드리지 않는다 — 사람이 고른 것을 덮지 않기 위해서다.
      if(it.state==='done'&&(!it.end_way||!it.end_result)){
        var rec=peRec(it);
        if(rec){
          if(!it.end_way){
            var w=peEndWay(rec);
            if(w){
              up[P+'end_way']=w;
              if(w==='transfer'&&rec.transferredTo) up[P+'end_to']=String(rec.transferredTo);
              up[P+'status']=(END_BY_KEY[w]||END_WAYS[0])[1];
            }
          }
          if(!it.end_result){ var rr=peResult(rec); if(rr) up[P+'end_result']=rr; }
        }
      }
      var c=candByRef[k]; if(!c) return;            // 종료된 건 → 미러 안 함(종료는 pesync 담당)
      var m=it.pe_m||{}, nm={};
      PE_MIRROR.forEach(function(f){
        nm[f]=c[f]||'';
        if(String(m[f]||'')!==nm[f]) up[P+f]=nm[f];
      });
      var mSid=c.mgrSid||name2sid[c.mgr]||'', has=!!(mSid||c.mgr);
      nm.mgr=mSid+'/'+(c.mgr||''); nm.subs=(c.subs||[]).join('|');
      if(String(m.mgr||'')!==nm.mgr){
        up[P+'mgr_main']=has?{sid:mSid,name:c.mgr||''}:(ceo?{sid:ceo.sid,name:ceo.name}:{sid:'',name:''});
        up[P+'pe_nomgr']=has?null:true;             // 담당 미지정 → 대표에게 배치하고 표시
      }
      /* ⚠⚠ 사번→이름 표를 «못 읽었으면» 부담당을 건드리지 않는다.
         부담당은 이름으로만 옮겨진다(managerSubs → 이름). 표가 비면 그 이름이 다 걸러져
         빈 값이 되고, 그것을 그대로 저장하면 «모두의 부담당이 지워진다» —
         권한 없는 사람이 앱을 한 번 여는 것만으로. (2026-09-05 사무장 화면에서 「부 0」)
         모르면 아무것도 안 하는 것이 맞다. */
      if(_peU2NKnown && String(m.subs||'')!==nm.subs)
        up[P+'mgr_subs']=(c.subs||[]).map(function(n){return {sid:name2sid[n]||'',name:n};});
      // 부담당을 안 건드렸으면 그 칸의 스냅샷도 옛것 그대로 둔다 — 다음 판에 또 견줄 수 있게
      if(!_peU2NKnown) nm.subs=String(m.subs||'');
      if(JSON.stringify(m)!==JSON.stringify(nm)) up[P+'pe_m']=nm;
    });

    // ③ 신규 자동 생성 — pe_seen에 없는 건만 (사용자가 지운 건은 seen에 남아 되살아나지 않는다)
    var made=0;
    cand.forEach(function(c){
      var t=c.ref.type, rk=safeKey(c.ref.id);
      // 이관될 계약 — 이관되면 사건·컨설팅이 태어나고 그것이 업무가 된다. 여기서 미리 만들지 않는다.
      // ⚠ pe_seen 에도 적지 않는다. 나중에 종류가 상담사항으로 바뀌면 그때는 만들어야 한다.
      if(c.xfer) return;
      if(seen[t]&&seen[t][rk]) return;
      up[NS+'/pe_seen/'+t+'/'+rk]=true;
      if(byRef[t+'|'+rk]) return;                   // 이미 수동으로 가져온 건
      var mSid=c.mgrSid||name2sid[c.mgr]||'', has=!!(mSid||c.mgr);
      var m={}; PE_MIRROR.forEach(function(f){ m[f]=c[f]||''; });
      m.mgr=mSid+'/'+(c.mgr||''); m.subs=(c.subs||[]).join('|');
      var rec={ no:c.no||(S.year+'-'+c.cat+'-PE'), cat:c.cat, ptype:c.ptype||'', company:c.company||'', client:c.client||'',
        officer:c.officer||'', title:c.title||'', due:c.due||'', start:c.start||'', status:'진행중',
        brief:c.brief||'',                        // 업무 요약 씨앗 — 이후에는 pesync가 양방향으로 맞춘다
        co_id:c.co_id||'',                        // pe_m에만 있고 항목에 없으면 이후 미러가 건너뛴다
        mgr_main:has?{sid:mSid,name:c.mgr||''}:(ceo?{sid:ceo.sid,name:ceo.name}:{sid:'',name:''}),
        mgr_subs:(c.subs||[]).map(function(n){return {sid:name2sid[n]||'',name:n};}),
        src:'puerp', ref:c.ref, pe_auto:true, pe_m:m, created_at:new Date().toISOString() };
      if(!has) rec.pe_nomgr=true;
      up[NS+'/items/'+c.pid]=rec; made++;
    });

    if(!Object.keys(up).length){ peState.at=new Date().toISOString(); return; }
    return fbDb.ref().update(up).then(function(){
      peState.at=new Date().toISOString(); peState.n=made;
      if(made) toast('🔗 푸른이알피에서 '+made+'건 자동 연동');
      /* ⚠ 조용히 지우지 않는다. 목록에서 갑자기 여든 건이 사라지면
         「내 업무가 왜 줄었지」가 된다 — 무엇이 왜 빠졌는지 말해 준다. */
      if(closed) toast('✅ 푸른이알피에서 끝난 '+closed+'건을 종료로 옮겼습니다 — 종료 화면에서 볼 수 있습니다');
    });
  }).catch(function(e){ peState.err=e&&e.message||'동기화 실패'; console.warn('[peAutoSync]',e); })
    .then(function(){ _peBusy=false; });
}
function puerpModal(){
  showModal('<h2 style="margin:0 0 10px">🔗 푸른이알피 연동</h2><p class="muted" style="font-size:12.5px">마스터를 불러오는 중…</p>');
  peReady().then(_puerpModal);
}
// 열람 대상이 푸른이알피에서 주담당인데 아직 업무시트에 없는 건.
// null = 마스터를 아직 못 읽음(안내를 띄우지 않는다)
function peMineUnlinked(){
  var cand=puerpCandidates(); if(!cand) return null;
  var who=viewer(); if(!who.sid&&!who.name) return [];
  var linked={};
  allItems().forEach(function(it){ if(peLinked(it)) linked[it.ref.type+'|'+safeKey(it.ref.id)]=1; });
  return cand.filter(function(c){
    if(linked[c.ref.type+'|'+safeKey(c.ref.id)]) return false;
    return (who.sid&&c.mgrSid===who.sid)||(who.name&&c.mgr&&c.mgr===who.name);
  });
}
// 전 직원의 주담당 미연결 건. 대표가 한 번에 붙일 때 쓴다
function peAllUnlinked(){
  var cand=puerpCandidates(); if(!cand) return null;
  var linked={};
  allItems().forEach(function(it){ if(peLinked(it)) linked[it.ref.type+'|'+safeKey(it.ref.id)]=1; });
  return cand.filter(function(c){
    if(linked[c.ref.type+'|'+safeKey(c.ref.id)]) return false;
    return !!(c.mgrSid||c.mgr);                 // 주담당이 지정된 건만
  });
}
/* ── 푸른이알피에서 한 건씩 당겨오기 ──────────────────────────────
   [한 번에 연결]은 "내가 주담당인 것 전부"를 가져온다. 그런데 "저 회사 그
   건 하나만" 또는 "남이 맡은 건에 나도 붙는다"는 길이 없었다. 사업장 이름으로
   찾아 한 건씩 가져온다. 내 담당을 언제나 위에 둔다.
   ⚠ 남의 건을 가져와도 주담당은 바꾸지 않는다 — 주담당의 원본은 푸른이알피라
     여기서 바꿔 봐야 다음 동기화에 되돌아온다. 나는 부담당으로 붙는다.
     그 참여는 pe_addsub로 푸른이알피에도 넘겨 양쪽이 어긋나지 않게 한다. */
function pullModal(q){
  if(q!==undefined) S._pullQ=q;
  showModal('<h2 style="margin:0 0 10px">🔗 푸른이알피에서 가져오기</h2>'
    +'<p class="muted" style="font-size:12.5px">마스터를 불러오는 중…</p>');
  peReady().then(_pullModal);
}
function pullFind(q){
  var cand=puerpCandidates();
  if(!cand) return null;
  var me=S.me||{}, have={};
  allItems().forEach(function(it){ if(peLinked(it)) have[it.ref.type+'|'+safeKey(it.ref.id)]=it; });
  q=String(q||'').trim().toLowerCase();
  var mine=[], other=[];
  cand.forEach(function(c){
    if(q){
      var hay=[c.company,c.title,c.ptype,c.no,c.client,c.mgr].concat(c.subs||[]).join(' ').toLowerCase();
      if(hay.indexOf(q)<0) return;
    }
    c._have=have[c.ref.type+'|'+safeKey(c.ref.id)]||null;
    c._main=!!((me.sid&&c.mgrSid===me.sid)||(me.name&&c.mgr===me.name));
    c._sub=!!(me.name&&(c.subs||[]).indexOf(me.name)>=0);
    (c._main||c._sub?mine:other).push(c);
  });
  function ord(a,b){
    return String(a.company||'').localeCompare(String(b.company||''),'ko')
      ||String(a.no||'').localeCompare(String(b.no||''),'en',{numeric:true});
  }
  return {mine:mine.sort(ord), other:other.sort(ord)};
}
function _pullRow(c){
  var me=S.me||{};

      ?'<button class="primary" onclick="pullOne(\''+escJ(c.pid)+'\',false)" title="내 담당 건을 내 업무로 가져옵니다">가져오기</button>'
      :'<button class="primary" onclick="pullOne(\''+escJ(c.pid)+'\',true)" '
        +'title="주담당은 '+esc(c.mgr||'미지정')+' 그대로 두고, 나를 부담당(공동)으로 붙입니다 — 푸른이알피에도 반영됩니다">부담당으로</button>');

function pullOne(pid,asSub){
  var c=(S._pullC||{})[pid];
  if(!c){ toast('건을 찾을 수 없습니다','warn'); return; }
  var me=S.me||{};
  if(asSub&&!me.sid&&!me.name){ toast('로그인 정보를 읽지 못했습니다','warn'); return; }
  loadStaff().then(function(st){
    var name2sid={}; st.forEach(function(u){ name2sid[u.name]=u.sid; });
    var up={}, now=new Date().toISOString(), meRec={sid:me.sid||'',name:me.name||''};
    function hasMe(arr){
      return (arr||[]).some(function(s){ return s&&((me.sid&&s.sid===me.sid)||(me.name&&s.name===me.name)); });
    }
    if(c._have){
      var it=c._have;
      if(hasMe(it.mgr_subs)||roleOf(it,meRec)==='main'){ closeM(); openDrawer(it._id); return; }
      up[NS+'/items/'+it._id+'/mgr_subs']=(it.mgr_subs||[]).concat([meRec]);
      up[NS+'/items/'+it._id+'/pe_addsub']=[me.sid||''];
      up[NS+'/items/'+it._id+'/up_at']=now;
    }else{
      var mSid=c.mgrSid||name2sid[c.mgr]||'';
      var subs=(c.subs||[]).map(function(n){ return {sid:name2sid[n]||'',name:n}; });
      if(asSub&&!hasMe(subs)) subs.push(meRec);
      // pe_m = 푸른이알피 소유 필드 스냅샷. 가져오는 시점에 함께 찍어 둔다.
      var m={}; PE_MIRROR.forEach(function(f){ m[f]=c[f]||''; });
      m.mgr=mSid+'/'+(c.mgr||''); m.subs=(c.subs||[]).join('|');
      var rec={ no:c.no||(S.year+'-'+c.cat+'-PE'), cat:c.cat, ptype:c.ptype||'',
        company:c.company||'', client:c.client||'', officer:c.officer||'',
        jur_org:c.jur_org||'', jur_ph:c.jur_ph||'', jur_em:c.jur_em||'',
        title:c.title||'', due:c.due||'', start:c.start||'', status:'진행중',
        brief:c.brief||'', co_id:c.co_id||'',
        mgr_main:{sid:mSid,name:c.mgr||''}, mgr_subs:subs,
        src:'puerp', ref:c.ref, pe_m:m, created_at:now };
      if(asSub) rec.pe_addsub=[me.sid||''];   // 푸른이알피 공동담당에도 나를 더해 달라는 요청
      up[NS+'/items/'+c.pid]=rec;
      up[NS+'/pe_seen/'+c.ref.type+'/'+safeKey(c.ref.id)]=true;
    }
    fbDb.ref().update(up).then(function(){
      toast(asSub?'부담당으로 붙였습니다 — 푸른이알피 공동담당에도 반영됩니다':'🔗 내 업무로 가져왔습니다');
      _pullModal(); route();
    }).catch(function(e){ toast('실패: '+e.message,'warn'); });
  });
}

/* ── 기존 업무 ↔ 푸른이알피 짝짓기 ───────────────────────────────────
   엑셀에서 옮겨 온 업무(src:'excel')는 ref가 없어 동기화 대상이 아니다.
   같은 사건이 푸른이알피에도 있으면 짝을 지어 연동시킨다 — 새로 만들지 않고
   기존 항목에 ref를 붙이므로, 그동안 쌓인 주간 기록과 노트가 그대로 살아 있다. */
function _mtScore(it,c){
  var a=_normCo(it.company), b=_normCo(c.company);
  if(!a||!b||a!==b) return 0;                     // 기업명이 다르면 후보 아님
  var s=50;
  var t1=String(it.title||'').replace(/\s/g,''), t2=String(c.title||'').replace(/\s/g,'');
  if(t1&&t2){
    if(t1===t2) s+=40;
    else if(t1.indexOf(t2)>=0||t2.indexOf(t1)>=0) s+=25;
    else {
      var n=0; for(var i=0;i<t1.length-1;i++){ if(t2.indexOf(t1.substr(i,2))>=0) n++; }
      s+=Math.min(20,Math.round(n/Math.max(1,t1.length-1)*20));
    }
  }
  if(it.cat&&c.cat&&it.cat===c.cat) s+=10;
  var c1=String(it.client||'').trim(), c2=String(c.client||'').trim();
  if(c1&&c2&&c1===c2) s+=10;
  return s;
}
// 연동 안 된 기존 업무 → 푸른이알피 후보 (점수순)
function matchPairs(){
  var cand=puerpCandidates(); if(!cand) return null;
  var used={};
  allItems().forEach(function(it){ if(peLinked(it)) used[it.ref.type+'|'+safeKey(it.ref.id)]=1; });
  var free=cand.filter(function(c){ return !used[c.ref.type+'|'+safeKey(c.ref.id)]; });
  var out=[];
  openItems().forEach(function(it){
    if(peLinked(it)) return;
    var hits=free.map(function(c){ return {c:c,s:_mtScore(it,c)}; })
      .filter(function(x){ return x.s>0; })
      .sort(function(a,b){ return b.s-a.s; }).slice(0,3);
    if(hits.length) out.push({it:it,hits:hits});
  });
  out.sort(function(a,b){ return b.hits[0].s-a.hits[0].s
    ||String(_mgrOf(a.it)).localeCompare(String(_mgrOf(b.it)),'ko'); });
  return out;
}

    P.forEach(function(p,i){
      var top=p.hits[0], auto=top.s>=85;

        +'<option value="">— 짝짓지 않음 —</option>'
        +p.hits.map(function(x){
            return '<option value="'+esc(x.c.pid)+'"'+((auto&&x===top)?' selected':'')+'>'
              +esc(x.c.kindLabel)+' '+esc(x.c.no||'')+' · '+esc(x.c.title||'')
              +' ('+(x.s>=85?'거의 확실':x.s>=70?'비슷':'가능성 있음')+')</option>';
          }).join('')
        +'</select></div>';
    });
    h+='</div><div id="mt-msg" class="muted" style="font-size:12px;min-height:18px;margin-top:8px"></div>'
      +'<div class="row" style="justify-content:flex-end;margin-top:4px"><button onclick="closeM()">취소</button>'
      +'<button class="primary" onclick="runMatch()">선택한 짝 연결</button></div>';
    showModal(h);

function runMatch(){
  var ids=Object.keys(S._mt||{}), up={}, n=0, msg=$('mt-msg'), taken={};
  ids.forEach(function(iid,i){
    var sel=$('mt-'+i); if(!sel||!sel.value) return;
    var p=S._mt[iid]; if(!p) return;
    var c=(p.hits.filter(function(x){return x.c.pid===sel.value;})[0]||{}).c;
    if(!c) return;
    var k=c.ref.type+'|'+safeKey(c.ref.id);
    if(taken[k]) return;                          // 한 푸른이알피 건에 두 업무를 붙이지 않는다
    taken[k]=1;
    var P=NS+'/items/'+iid+'/';
    var m={}; PE_MIRROR.forEach(function(f){ m[f]=c[f]||''; });
    m.mgr=(c.mgrSid||'')+'/'+(c.mgr||''); m.subs=(c.subs||[]).join('|');
    up[P+'src']='puerp'; up[P+'ref']=c.ref; up[P+'pe_m']=m;
    // 업무 요약은 비어 있을 때만 씨앗을 넣는다 — 업무관리에서 이미 쓴 요약을 덮지 않는다
    if(c.brief && !briefTrim((items[iid]||{}).brief)) up[P+'brief']=c.brief;
    up[P+'co_id']=c.co_id||''; up[P+'cat']=c.cat; up[P+'ptype']=c.ptype||''; up[P+'no']=c.no||'';
    up[P+'up_at']=new Date().toISOString();
    up[NS+'/pe_seen/'+c.ref.type+'/'+safeKey(c.ref.id)]=true;
    n++;
  });
  if(!n){ if(msg)msg.textContent='선택된 짝이 없습니다.'; return; }
  if(msg)msg.textContent='연결 중… ('+n+'건)';
  fbDb.ref().update(up).then(function(){
    closeM(); toast('🔗 '+n+'건 짝지어 연동 — 기록은 그대로 남았습니다'); route();
    // 짝짓기가 끝나면 남은 것을 정리할 차례 — 순서를 사람이 기억하지 않아도 되게 이어 준다
    setTimeout(function(){
      var left=kindFixList().length; if(!left) return;
      var P2=matchPairs();
      var more=P2?P2.length:0;
      showModal('<h2 style="margin:0 0 6px">🔗 '+n+'건 연결 완료</h2>'
        +'<p class="muted" style="font-size:12.5px;line-height:1.7">이제 구분과 유형이 푸른이알피에서 들어옵니다.<br>'
        +(more?'아직 <b>짝지을 수 있는 업무가 '+more+'건</b> 남아 있습니다. 이어서 짝지으시겠어요?'
              :'짝지을 수 있는 건은 다 끝났습니다. 푸른이알피에 짝이 없는 <b>'+left+'건</b>은 구분 정리로 마무리하세요.')
        +'</p>'
        +'<div class="row" style="justify-content:flex-end;margin-top:12px"><button onclick="closeM()">나중에</button>'
        +(more?'<button class="primary" onclick="closeM();matchModal()">이어서 짝짓기 →</button>'
              :'<button class="primary" onclick="closeM();kindFixModal()">🧹 구분 정리 →</button>')
        +'</div>');
    },600);
  }).catch(function(e){ if(msg)msg.textContent='실패: '+e.message; });

/* ── 연결 안 된 엑셀 이관분 구분 정리 ─────────────────────────────────
   푸른이알피와 연결된 건은 미러가 알아서 구분=종류, 유형=ptype으로 맞춘다.

        +'<span style="font-size:12.5px;flex:1;min-width:180px"><b>구분 칸에 유형이 남은 '+kindFixList().length+'건</b><br>'
        +'<span class="muted" style="font-size:11.5px">연결되지 않은 엑셀 이관분입니다. 유형을 업무명 자리로 옮깁니다.</span></span>'
        +'<button onclick="kindFixModal()">🧹 구분 정리 →</button></div>':'')
    +'<p class="muted" style="font-size:12.5px;margin:0 0 12px">계약·사건·컨설팅·기금·기타에서 <b>진행 중</b>인 '+cand.length+'건을 찾았습니다. '
    +'관리번호는 푸른이알피 번호를 그대로 씁니다.</p>';
  if(dup.length){
    h+='<div style="background:var(--warn-bg);border:1px solid #fbbf24;border-radius:9px;padding:10px 12px;margin-bottom:10px">'
      +'<div style="font-size:12.5px;font-weight:800;color:var(--warn);margin-bottom:4px">⚠ 이미 있는 업무와 기업명이 겹치는 '+dup.length+'건 — 기본 제외</div>'
      +'<div class="muted" style="font-size:11.5px;margin-bottom:6px">같은 건이면 그대로 두세요(체크 안 함). 다른 건이면 체크해서 별도로 등록합니다.</div>'
      +'<div style="max-height:210px;overflow-y:auto">'
      +dup.map(function(c){
        return row(c,false,'<div style="font-size:11px;color:var(--warn);margin-top:2px">↔ 기존: '
          +c._match.slice(0,2).map(function(m){return esc((m.title||'')+(m.no?' ('+m.no+')':''));}).join(' / ')
          +(c._match.length>2?' 외 '+(c._match.length-2)+'건':'')+'</div>');
      }).join('')+'</div></div>';
  }
  h+='<div style="font-size:12.5px;font-weight:800;margin:10px 0 2px">✅ 새로 가져올 '+neu.length+'건</div>';
  h+=neu.length?('<div style="max-height:260px;overflow-y:auto">'+neu.map(function(c){return row(c,true);}).join('')+'</div>')
    :'<div class="muted" style="font-size:12px;padding:8px 2px">새로 가져올 건이 없습니다.</div>';
  if(done.length) h+='<div class="muted" style="font-size:11.5px;margin-top:10px">🔁 이미 가져온 '+done.length+'건은 목록에서 제외했습니다.</div>';
  h+='<div id="pe-msg" class="muted" style="font-size:12px;min-height:18px;margin-top:8px"></div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:6px"><button onclick="closeM()">취소</button>'
    +'<button class="primary" onclick="runPuerpImport()">선택한 건 가져오기</button></div>';
  showModal(h);
}
// 푸른이알피 나의 업무 → work.html#item=<건ID> 로 들어온 경우 해당 업무 열기
function openFromHash(){
  try{
    var m=/^#item=(.+)$/.exec(location.hash||''); if(!m) return;
    var id=decodeURIComponent(m[1]);
    if(!items[id]){ toast('해당 업무를 찾을 수 없습니다 (보관함에 있을 수 있습니다)','warn'); return; }
    openDrawer(id);
  }catch(e){}
}
// 푸른이알피 해당 메뉴로 이동 (pu-erp는 #menu= 딥링크를 지원)
function openPuerp(type){
  var MENU={contract:'biz/contract',case:'biz/case',consulting:'biz/consulting',fund:'biz/fund',other:'biz/other'};
  window.open('pu-erp.html?sso=1#menu='+encodeURIComponent(MENU[type]||'biz/case'),'_blank');
}
function runPuerpImport(){
  var sel=[].slice.call(document.querySelectorAll('.pechk')).filter(function(c){return c.checked;}).map(function(c){return c.value;});
  var msg=$('pe-msg');
  if(!sel.length){ if(msg)msg.textContent='선택된 건이 없습니다.'; return; }
  loadStaff().then(function(st){
    var name2sid={}; st.forEach(function(u){ name2sid[u.name]=u.sid; });
    var up={}, n=0;
    sel.forEach(function(pid){
      var c=(S._peCand||{})[pid]; if(!c) return;
      var mSid=c.mgrSid||name2sid[c.mgr]||'';
      // pe_m = 푸른이알피 소유 필드 스냅샷. 자동 연동이 이 값과 비교해
      // "푸른이알피에서 바뀐 필드만" 갱신하므로, 가져오는 시점에 함께 찍어 둔다.
      var m={}; PE_MIRROR.forEach(function(f){ m[f]=c[f]||''; });
      m.mgr=mSid+'/'+(c.mgr||''); m.subs=(c.subs||[]).join('|');
      var rec={ no:c.no||(S.year+'-'+c.cat+'-PE'), cat:c.cat, ptype:c.ptype||'', company:c.company||'', client:c.client||'',
        officer:c.officer||'', title:c.title||'', due:c.due||'', start:c.start||'', status:'진행중',
        brief:c.brief||'',                        // 업무 요약 씨앗 — 이후에는 pesync가 양방향으로 맞춘다
        co_id:c.co_id||'', mgr_main:{sid:mSid,name:c.mgr||''},
        mgr_subs:(c.subs||[]).map(function(nm){return {sid:name2sid[nm]||'',name:nm};}),
        src:'puerp', ref:c.ref, pe_m:m, created_at:new Date().toISOString() };
      up[NS+'/items/'+c.pid]=rec; n++;
      up[NS+'/pe_seen/'+c.ref.type+'/'+safeKey(c.ref.id)]=true;
    });
    if(!n){ if(msg)msg.textContent='가져올 건이 없습니다.'; return; }
    if(msg)msg.textContent='등록 중… ('+n+'건)';
    fbDb.ref().update(up).then(function(){
      closeM(); toast('🔗 푸른이알피에서 '+n+'건 가져옴'); route();
    }).catch(function(e){ if(msg)msg.textContent='실패: '+e.message; });
  });
}

/* ── 엑셀 이관 JSON 가져오기 ── */
function excelImported(){ return allItems().filter(function(it){return it.src==='excel';}); }
function importModal(){
  var ex=excelImported();
  showModal('<h2 style="margin:0 0 10px">📥 엑셀 이관 가져오기</h2>'
    +'<p class="muted" style="font-size:12.5px;line-height:1.7">업무시트 엑셀에서 추출한 이관 JSON 파일을 불러옵니다.<br>'
    +'같은 파일을 다시 불러와도 중복 등록되지 않습니다(이관 키 기준).</p>'
    +'<input type="file" id="imp-file" accept=".json" style="margin:10px 0">'
    +(ex.length?'<label style="display:flex;gap:8px;align-items:flex-start;background:var(--warn-bg);border:1px solid #fbbf24;border-radius:9px;padding:9px 12px;font-size:12.5px;cursor:pointer">'
      +'<input type="checkbox" id="imp-wipe" checked style="margin-top:3px">'
      +'<span>이미 들어간 <b>엑셀 이관분 '+ex.length+'건</b>을 지우고 새로 넣기'
      +'<div class="muted" style="font-size:11px;margin-top:2px">기록·인수인계 노트까지 함께 삭제됩니다. 직접 등록한 업무와 푸른이알피에서 가져온 건은 건드리지 않습니다.</div></span></label>':'')
    +'<div id="imp-msg" class="muted" style="font-size:12px;min-height:18px;margin-top:8px"></div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:12px"><button onclick="closeM()">닫기</button>'
    +'<button class="primary" onclick="runImport()">가져오기</button></div>');
}
// 엑셀 이관분 삭제 경로만 만들어 반환한다 — 커밋하지 않는다.
// 삭제와 새 데이터 등록을 한 번의 update()로 묶어야, 업로드가 실패해도 기존 데이터가 남는다.
// (예전엔 삭제를 먼저 커밋해서, 이후 실패 시 옛 데이터가 영구히 사라질 수 있었다.)
function excelWipePaths(msg){
  var ex=excelImported();
  if(!ex.length) return Promise.resolve({paths:{},ids:[],n:0});
  if(msg) msg.textContent='기존 이관분 '+ex.length+'건 확인 중…';
  // 삭제 직전 최신 상태를 서버에서 다시 읽는다(캐시된 목록이 오래되어 주별 기록이 남는 문제 방지)
  return Promise.all(ex.map(function(it){
      return fbDb.ref(NS+'/itemlogs/'+it._id).once('value')
        .then(function(s){ return {id:it._id,lg:s.val()||{}}; })
        .catch(function(){ return {id:it._id,lg:itemLogsCache[it._id]||{}}; });
    }))
    .then(function(arr){
      var paths={};
      arr.forEach(function(o){
        paths[NS+'/items/'+o.id]=null;
        paths[NS+'/itemlogs/'+o.id]=null;
        Object.keys(o.lg).forEach(function(lid){
          var w=o.lg[lid]&&o.lg[lid].w; if(w) paths[NS+'/logs/'+weekYear(w)+'/'+w+'/'+o.id+'/'+lid]=null;
        });
      });
      return {paths:paths,ids:arr.map(function(o){return o.id;}),n:ex.length};
    });
}
function runImport(){
  var f=$('imp-file').files[0]; var msg=$('imp-msg');
  if(!f){ msg.textContent='파일을 선택하세요.'; return; }
  var rd=new FileReader();
  rd.onload=function(){
    var data;
    try{ data=JSON.parse(rd.result); }catch(e){ msg.textContent='JSON 파싱 실패: '+e.message; return; }
    var arr=data.items||data;
    if(!Array.isArray(arr)){ msg.textContent='형식 오류: items 배열이 없습니다.'; return; }
    // 키 사전 검사 — 원본 xk가 아니라 "실제로 쓰일 Firebase 키"로 검사해야 한다.
    // safeKey가 금지문자를 '_'로 바꾸므로 a.b 와 a#b 는 같은 키가 되어 서로 덮어쓴다.
    var kseen={}, kdup=0, kbad=0, dupEx=[];
    arr.forEach(function(r){
      if(!r||!r.xk){ kbad++; return; }
      var k=safeKey(r.xk);
      if(!k||k.replace(/_/g,'')===''){ kbad++; return; }
      if(kseen[k]){ kdup++; if(dupEx.length<3) dupEx.push(r.xk); } else kseen[k]=1;
    });
    if(kdup||kbad){
      msg.innerHTML='<b style="color:var(--danger)">중단: 이관 키에 문제가 있습니다.</b>'
        +(kdup?' 변환 후 키 중복 '+kdup+'건'+(dupEx.length?' (예: '+esc(dupEx.join(', '))+')':''):'')
        +(kbad?' · 키 없음/사용불가 '+kbad+'건':'')
        +'<div class="muted" style="font-size:11.5px;margin-top:4px">그대로 넣으면 그만큼 서로 덮어써 사라집니다. 추출 스크립트를 다시 실행해 받은 파일을 쓰세요.</div>';
      return;
    }
    var wipe=$('imp-wipe')&&$('imp-wipe').checked;
    (wipe?excelWipePaths(msg):Promise.resolve({paths:{},ids:[],n:0})).then(function(w){
      return loadStaff().then(function(st){ return {w:w,st:st}; });
    }).then(function(ctx){
      var w=ctx.w, st=ctx.st;
      var byName={}; st.forEach(function(u){byName[u.name]=u;});
      // 삭제 경로를 먼저 담고, 아래에서 새 데이터를 같은 객체에 쌓아 한 번에 커밋한다
      var up={}, nItems=0, nLogs=0, skip=0;
      var wipedIds={}; w.ids.forEach(function(x){ wipedIds[x]=1; });
      Object.keys(w.paths).forEach(function(k){ up[k]=null; });
      var seqs={};   // 이관 관리번호 채번(구분별) — 기존 items 스캔(지울 것은 제외)
      allItems().forEach(function(it){ if(wipedIds[it._id]) return;
        var m=/^(\d{4})-(.+)-(\d+)$/.exec(it.no||'');
        if(m&&m[1]==String(S.year)){ var k2=m[2]; seqs[k2]=Math.max(seqs[k2]||0,+m[3]); } });
      arr.forEach(function(r){
        if(!r||!r.xk) return;
        var id='X-'+safeKey(r.xk);
        if(items[id]&&!wipedIds[id]){ skip++; return; }   // 지울 대상이면 새로 넣는다
        var cat=String(r.cat||'').trim()||'기타';   // 구분은 원본 표기를 그대로 살린다
        seqs[cat]=(seqs[cat]||0)+1;
        var mgr=byName[r.mgr]||{sid:'',name:r.mgr||''};
        var rec={ no:S.year+'-'+cat+'-'+('00'+seqs[cat]).slice(-3), cat:cat,
          company:r.company||'', client:r.client||'', officer:r.officer||'',
          title:r.title||'', due:r.due||'', start:r.start||'', status:'진행중',
          mgr_main:{sid:mgr.sid,name:mgr.name},
          mgr_subs:(r.subs||[]).map(function(n){ var u=byName[n]||{sid:'',name:n}; return {sid:u.sid,name:u.name}; }),
          src:'excel', created_at:new Date().toISOString() };
        var logs=r.logs||[];
        var last=null;
        logs.forEach(function(lg){
          if(!lg||!lg.d||!lg.t) return;
          var wk2=weekKeyOf(mondayOf(new Date(lg.d+'T00:00:00')));
          var lid=rid('L'); nLogs++;
          var log={d:lg.d,t:lg.t,by:mgr.sid||'',byName:mgr.name||'',at:new Date().toISOString(),imp:1};
          up[NS+'/logs/'+weekYear(wk2)+'/'+wk2+'/'+id+'/'+lid]=log;
          up[NS+'/itemlogs/'+id+'/'+lid]=Object.assign({w:wk2},log);
          if(!last||last.d<=lg.d) last={d:lg.d,t:lg.t};
        });
        if(last) rec.last=last;
        up[NS+'/items/'+id]=rec;
        nItems++;
      });
      if(!nItems){ msg.textContent='새로 가져올 건이 없습니다 (중복 '+skip+'건 건너뜀).'; return; }
      msg.textContent='등록 중… ('+(w.n?'기존 '+w.n+'건 교체, ':'')+nItems+'건, 기록 '+nLogs+'줄)';
      // 삭제(null)와 등록을 한 번의 update로 — 실패하면 아무것도 바뀌지 않는다
      fbDb.ref().update(up).then(function(){
        msg.textContent='';
        toast('✅ 이관 완료: 업무 '+nItems+'건, 기록 '+nLogs+'줄'
          +(w.n?' (기존 '+w.n+'건 교체)':'')+(skip?' (중복 '+skip+' 건너뜀)':''));
        wkCache={}; wkLoaded={}; itemLogsCache={}; _watchWkKey=null; watchWeek();
        closeM(); route();
      }).catch(function(e){ msg.textContent='업로드 실패: '+e.message; });
    }).catch(function(e){ msg.textContent='실패: '+e.message; });
  };
  rd.readAsText(f,'utf-8');
}
