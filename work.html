var _bdDrag=null;
function bdDragStart(ev,id){
  _bdDrag=id;
  try{ ev.dataTransfer.effectAllowed='move'; ev.dataTransfer.setData('text/plain',id); }catch(e){}
  var el=ev.currentTarget; if(el) el.classList.add('dragging');
}
function bdDragEnd(){
  _bdDrag=null;
  var n=document.querySelector('.bdcard.dragging'); if(n) n.classList.remove('dragging');
  Array.prototype.forEach.call(document.querySelectorAll('.bdcol.over'),function(c){ c.classList.remove('over'); });
}
function bdOver(ev,name){
  if(!_bdDrag) return;
  ev.preventDefault();
  try{ ev.dataTransfer.dropEffect='move'; }catch(e){}
  var n=$('bdc-'+name); if(n) n.classList.add('over');
}
function bdLeave(name){ var n=$('bdc-'+name); if(n) n.classList.remove('over'); }
function bdDrop(ev,name){
  ev.preventDefault();
  var id=_bdDrag; bdDragEnd();
  if(!id) return;
  if(name==='그 밖'){ toast('「그 밖」으로는 옮길 수 없습니다','warn'); return; }
  var it=items[id];
  if(it&&(it.status||'진행중')===name) return;      // 제자리 — 헛저장하지 않는다
  setStatus(id,name);                               // 표에서 쓰던 길 그대로 (실패하면 거기서 알린다)
}

/* ── 타임라인 ──────────────────────────────────────────────────
   막대 = 시작일 ~ 기한. ⚠ 기한이 없으면 막대를 그릴 수 없다 —
   없는 기한을 지어내면 「언제까지인지」를 거짓으로 보여주게 되므로 점만 찍는다.
   보이는 기간은 그 목록이 실제로 걸쳐 있는 날들로 정한다(빈 달을 그리지 않게). */
function tlDay(s){ var d=new Date(String(s)+'T00:00:00'); return isNaN(d.getTime())?null:d; }
function tlRange(list){
  var lo=null, hi=null, T=new Date(todayStr()+'T00:00:00');
  list.forEach(function(it){
    [tlDay(it.start), tlDay(itemDue(it))].forEach(function(d){
      if(!d) return;
      if(!lo||d<lo) lo=d;
      if(!hi||d>hi) hi=d;
    });
  });
  if(!lo){ lo=new Date(T); hi=new Date(T); }
  if(T<lo) lo=new Date(T);
  if(T>hi) hi=new Date(T);
  lo=new Date(lo); lo.setDate(lo.getDate()-3);        // 양옆으로 조금 여유
  hi=new Date(hi); hi.setDate(hi.getDate()+3);
  var days=Math.round((hi-lo)/86400000)+1;
  if(days>420){ hi=new Date(lo); hi.setDate(hi.getDate()+419); days=420; }   // 너무 길면 자른다
  return {lo:lo,hi:hi,days:days};
}
function myTimelineHTML(list){
  var R=tlRange(list), W=22;                          // 하루 22px
  var wide=R.days*W;
  var rows=list.slice().sort(function(a,b){
    var da=tlDay(a.start)||tlDay(itemDue(a)), db=tlDay(b.start)||tlDay(itemDue(b));
    return (da?da.getTime():9e15)-(db?db.getTime():9e15);
  });
  function x(d){ return Math.round((d-R.lo)/86400000)*W; }
  // 날짜 눈금 — 달이 바뀌는 곳과 월요일에만 선을 긋는다(매일 그으면 눈이 어지럽다)
  var marks='', mons={};
  for(var i=0;i<R.days;i++){
    var d0=new Date(R.lo); d0.setDate(d0.getDate()+i);
    if(d0.getDate()===1) mons[i]=1;
  }
  function nearMon(i){ for(var k=-2;k<=2;k++){ if(mons[i+k]) return true; } return false; }
  for(var i=0;i<R.days;i++){
    var d=new Date(R.lo); d.setDate(d.getDate()+i);
    var isMon=(d.getDay()===1), first=(d.getDate()===1);
    if(!isMon&&!first) continue;
    if(!first&&nearMon(i)) continue;                  // 달 이름 옆에 날짜가 겹쳐 붙는 것을 막는다
    marks+='<span class="tlmk'+(first?' mon':'')+'" style="left:'+(i*W)+'px">'
      +(first?'<b>'+(d.getMonth()+1)+'월</b>':'<b style="color:var(--faint);font-weight:400">'+d.getDate()+'</b>')
      +'</span>';
  }
  var T=tlDay(todayStr());
  var today='<span class="tltoday" style="left:'+x(T)+'px" title="오늘"></span>';
  var h='<div class="tlwrap"><div class="tlscroll"><div class="tlgrid" style="width:'+(210+wide)+'px">'
    +'<div class="tlhd"><div class="tlname">업무 ('+rows.length+')</div>'
      +'<div class="tlmon" style="width:'+wide+'px">'+marks+today+'</div></div>';
  rows.forEach(function(it){
    var c=catColor(catNorm(it.cat)), s=tlDay(it.start), e=tlDay(itemDue(it));
    var bar='';
    if(s&&e&&e>=s){
      var w=Math.max(W,(x(e)-x(s))+W);
      bar='<span class="tlbar" style="left:'+x(s)+'px;width:'+w+'px;background:'+c[0]+';color:'+c[1]+'"'
        +' onclick="openDrawer(\''+escJ(it.id)+'\')" title="'+esc((it.start||'')+' ~ '+(itemDue(it)||''))+'">'
        +esc(briefTrim(it.title)||it.company||'')+'</span>';
    } else {
      var p=s||e;
      if(p) bar='<span class="tldot" style="left:'+(x(p)+6)+'px;background:'+c[1]+'"'
        +' onclick="openDrawer(\''+escJ(it.id)+'\')" title="'+esc(s?'시작 '+it.start+' · 기한 없음':'기한 '+itemDue(it))+'"></span>';
    }
    h+='<div class="tlrow">'
      +'<div class="tlname" onclick="openDrawer(\''+escJ(it.id)+'\')">'
        +'<b>'+esc(it.company||it.client||'—')+'</b>'
        +'<span>'+esc(briefTrim(it.title)||'—')+'</span></div>'
      +'<div class="tllane" style="width:'+wide+'px">'+marks+today+bar+'</div></div>';
  });
  if(!rows.length) h+='<div style="padding:30px;text-align:center;color:var(--faint);font-size:12.5px">보여줄 업무가 없습니다.</div>';
  return h+'</div></div></div>';
}

     sourceContractNo 로 거꾸로 찾는다.
     ⚠ 조용히 지우지 않는다 — 몇 건을 감췄는지 칩으로 내고 눌러서 볼 수 있게 한다.

  else if(S.f==='recv')base=recv;

        :(self?'아직 등록된 업무가 없습니다.<br><br><button class="primary" onclick="itemModal()">＋ 첫 업무 등록</button> &nbsp; 또는 좌측 하단 <b>📥 엑셀 가져오기</b>로 이관 파일을 불러오세요.'
              :'진행 중인 업무가 없습니다.'))+'</div>';
    app.innerHTML=h+splitClose(); return;
  }
  // 머리행이 곧 걸러 보기 — 열 이름을 누르면 그 열의 값이 건수와 함께 뜬다(엑셀 자동필터).
  // 고른 날은 거르는 조건이 아니라 모아 보는 표시다 — 「조건」 수에 넣지 않는다
  var on=!!(S.q||S.f||S.myRole||fAny('my'));
  // 띠 안내가 없다. 거르지 않으므로 "모두 보기"가 필요 없고,
  // 고른 날은 표 안 소제목에서 바로 놓을 수 있다.
  // 선택지는 열려 있는 열만 센다 — 네 열을 매번 다 세면 헛일이다.
  // 접힌 열은 띠가 된다. 걸러 보기 단추는 펴져 있을 때만 만든다 — 안 그리면 헛일이다.
  function fh(k,w){
    if(colHidden('my',k)) return colTH('my',k,'');
    var vals=fOpen('my',k)?fVals('my',k,base.filter(function(it){ return fPass('my',it,k); })):[];
    return colTH('my',k,fBtn('my',k,vals),w);
  }
  /* ── 보드·타임라인은 여기서 갈라진다 ──────────────────────────
     ★ 위에서 만든 list 를 그대로 넘긴다. 세 보기가 «같은 목록»을 봐야 한다.
     ⚠ 열 머리 깔때기는 표에만 있다(머리행이 곧 걸러 보기다). 그래서 보드·타임라인에서는
       걸러 놓은 것이 있으면 그렇게 말해 주고, 표로 돌아가는 길을 준다 —
       안 그러면 「왜 몇 건만 보이지」가 된다. */
  if(myMode()!=='table'){
    if(on) h+='<div class="histbanner">🔎 걸러 보기가 걸려 있어 <b>'+list.length+'건</b>만 보입니다'
      +' (전체 '+total+'건).<span class="back" onclick="myReset()">조건 모두 풀기 →</span>'
      +'<span class="back" onclick="setMyMode(\'table\')" style="margin-left:6px">표에서 조건 고치기 →</span></div>';
    h+=(myMode()==='board'?myBoardHTML(list):myTimelineHTML(list));
    app.innerHTML=h+splitClose();
    calAfter();
    return;
  }
  h+='<div class="panel tbl" id="mytbl"><table><thead><tr class="fhead">'
    +'<th class="rowno">'+(on?'<span class="fx" onclick="myReset()" title="걸러 보기를 모두 해제합니다">✕</span>':'#')+'</th>'
    +fh('cat','width:64px')
    +'<th style="min-width:110px">'+qBox('renderMy','기업','fh')+'</th>'
    +fh('pt','min-width:140px')
    +fh('st','width:74px')
    +colTH('my','last','최근 기록','min-width:130px')
    +'<th class="wkhd" style="color:var(--acc2)">'
    +'<div class="row" style="gap:6px;margin-bottom:'+(wkSplitOn()?'4px':'0')+'">'
    +'<span>'+(isCurWeek()?'이번 주':'그 주')+'</span>'
    +'<span style="font-weight:400;text-transform:none;color:var(--faint)">'+esc(weekLabel(S.week).split('·')[1]||'')+'</span>'
    +'<span class="chipbtn'+(wkSplitOn()?' on':'')+'" onclick="wkSplitToggle()" '
    +'title="'+(wkSplitOn()?'요일을 합쳐 한 칸으로 봅니다':'요일별로 나눠 그 날짜 칸에 바로 적습니다')+'">'
    +(wkSplitOn()?'요일별':'한 칸')+'</span>'
    +'</div>'
    +(wkSplitOn()?wkHeadHTML():'<span style="font-weight:400;text-transform:none;color:var(--faint)">칸에 바로 입력, Enter 저장</span>')
    +'</th>'
    +fh('due','width:110px')
    +'<th style="width:58px;text-align:center">종료</th></tr></thead><tbody>';
  var NCOL=9;   // 접힌 열도 띠로 한 칸을 차지하므로 칸 수는 변하지 않는다
  // 아무것도 안 남았을 때는 무엇 때문인지와 푸는 길을 그 자리에 둔다 —
  // 41건이 통째로 사라진 화면에서 얇은 띠 안내만으로는 자료가 없어진 줄 안다
  if(!list.length) h+='<tr><td colspan="'+NCOL+'" class="moremark" style="padding:26px 14px">'
    +'조건에 맞는 업무가 없습니다.'
    +'<div style="margin-top:10px"><button class="primary" onclick="myReset()">조건 모두 풀기</button></div>'
    +'</td></tr>';
  /* 날을 골랐으면 그 날 묶음이 먼저다. 구분 묶음은 잠시 물러난다 —
     두 가지로 한꺼번에 묶으면 어느 기준으로 나뉜 것인지 알 수 없다.
     날을 풀면 구분 묶음이 그대로 돌아온다. */
  else if(S.calDay){
    var dn=0, hit=[], rest=[];
    list.forEach(function(it){ (calDayHas(it)?hit:rest).push(it); });
    h+=dayHeadHTML(S.calDay,hit.length,NCOL,true);
    hit.forEach(function(it){ dn++; h+=rowHTML(it,dn,dn-1); });
    if(rest.length){
      h+=dayHeadHTML('',rest.length,NCOL,false);
      rest.forEach(function(it){ dn++; h+=rowHTML(it,dn,dn-1); });
    }
  }
  else if(grpOn()){
    var gn=0;
    groupRows(list).forEach(function(g){
      h+=grpHeadHTML(g[0],g[1].length,NCOL);
      if(grpFolded(g[0])){ gn+=g[1].length; return; }   // 접힌 묶음은 줄을 그리지 않는다
      g[1].forEach(function(it){ gn++; h+=rowHTML(it,gn,gn-1); });
    });
  } else list.forEach(function(it,i){ h+=rowHTML(it,i+1,i); });
  h+='</tbody></table></div>';
  // 몇 건을 보고 있는지는 표 아래 한 줄로 (팀 전체와 같은 자리)
  h+='<div class="muted" style="font-size:12px;margin-top:8px">'
    +(on?'조건에 맞는 업무 '+list.length+' / 전체 '+total+'건'
        +' <span class="chipbtn" onclick="myReset()" title="걸러 보기를 모두 해제합니다">✕ 조건 해제</span>'
       :'진행 중 '+total+'건')+'</div>';
  app.innerHTML=h+splitClose();
  if(S.fPop) fPopPos();
  if(S.colPop) colPopPos();
  if(S.warnOpen) warnPopPos();
  // 캘린더에서 날을 골랐으면 그 칸으로 커서를 옮긴다 — 그리기가 끝난 뒤라야 잡힌다
  if(S._calFocus) setTimeout(calFocusDay,60);
  calAfter();
  arFit();                      // 표를 창 아래까지 — 팀 전체·종료와 같은 규칙
}
// 컴팩트 요약 칩 — 누르면 그 건만 보고, 다시 누르면 해제 (예전 .fcard와 같은 동작)
function sbHTML(key,label,val,cls){
  return '<span class="sb '+cls+(S.f===key?' on':'')+'" onclick="setFocus(\''+key+'\')" '
    +'title="클릭하면 이 건만 봅니다 (다시 누르면 해제)">'+label+' '+val+'</span>';
}
function setFocus(k){ S.f=(S.f===k)?null:k; renderMy(); }
function myRole(r){ S.myRole=(S.myRole===r)?'':r; renderMy(); }
function myReset(){ fResetCols('my'); S.fPop=''; S.q=''; S.f=null; S.myRole=''; S.calDay='';
  // 접힌 묶음도 편다 — "조건을 다 풀었는데 안 보인다"가 생기면 안 된다
  S.grpF={}; try{ localStorage.setItem(GRP_KEY,''); }catch(e){}
  renderMy(); }

/* ── 구분별 묶어 보기 ──────────────────────────────────────────────
   사건을 보다가 컨설팅이 튀어나오면 눈이 매번 다시 맞춰야 한다.
   순서는 푸른이알피와 같게 고정한다 — 건수순으로 하면 볼 때마다 자리가
   바뀌어 손이 기억하지 못한다. */
var GRP_KEY='work_my_grp', GRPON_KEY='work_my_group';
var GRP_ORDER=['계약','사건','컨설팅','기금','기타사업'];
function grpOn(){
  if(S.grpOn===undefined){
    var v=null; try{ v=localStorage.getItem(GRPON_KEY); }catch(e){}
    S.grpOn=(v!=='0');                            // 처음에는 묶어서 본다
  }
  return !!S.grpOn;
}
function grpToggle(){
  S.grpOn=!grpOn();
  try{ localStorage.setItem(GRPON_KEY,S.grpOn?'1':'0'); }catch(e){}
  renderMy();
}
function grpFold(){
  if(S.grpF===undefined){
    var v=''; try{ v=localStorage.getItem(GRP_KEY)||''; }catch(e){}
    S.grpF={}; v.split(',').forEach(function(c){ if(c) S.grpF[c]=1; });
  }
  return S.grpF;
}
function grpFolded(cat){ return !!grpFold()[cat]; }
function grpFoldToggle(cat){
  var f=grpFold();
  if(f[cat]) delete f[cat]; else f[cat]=1;
  try{ localStorage.setItem(GRP_KEY,Object.keys(f).join(',')); }catch(e){}
  renderMy();
}
// [구분, 그 구분의 업무들] — 넘겨받은 차례를 묶음 안에서 그대로 지킨다
function groupRows(list){
  var m={}, order=[];
  (list||[]).forEach(function(it){
    var c=catNorm(it.cat)||'기타';
    if(!(c in m)){ m[c]=[]; order.push(c); }
    m[c].push(it);
  });
  order.sort(function(a,b){
    var ia=GRP_ORDER.indexOf(a), ib=GRP_ORDER.indexOf(b);
    if(ia<0&&ib<0) return a.localeCompare(b,'ko');
    if(ia<0) return 1;
    if(ib<0) return -1;
    return ia-ib;
  });
  return order.map(function(c){ return [c,m[c]]; });
}
/* 고른 날 소제목. 첫 묶음은 그 날 것, 둘째는 나머지.
   거르는 것이 아니라 모아 놓는 것이므로 "풀기"가 아니라 "고른 날 놓기"다. */
function dayHeadHTML(d,n,cols,on){
  return '<tr class="grph'+(on?' day':' rest')+'">'
    +'<td colspan="'+cols+'">'
    +(on?'📅 <b>'+esc(md(d))+'</b> 에 있는 <b>'+n+'건</b>'
         +'<span class="gx" onclick="calDayOnly(\'\')" title="고른 날을 놓습니다 — 줄은 원래 차례로 돌아갑니다">✕ 고른 날 놓기</span>'
       :'<span class="gn2">나머지 '+n+'건</span>')
    +'</td></tr>';
}
function grpHeadHTML(cat,n,cols){
  var f=grpFolded(cat);
  return '<tr class="grph" onclick="grpFoldToggle(\''+escJ(cat)+'\')">'
    +'<td colspan="'+cols+'" title="'+(f?'펴기':'접기')+'">'
    +'<span class="gc">'+(f?'▸':'▾')+'</span>'+catBadge(cat)
    +'<span class="gn">'+n+'건</span></td></tr>';
}

/* ── 열별 걸러 보기 (엑셀 자동필터) ──────────────────────────────────
   열 이름을 누르면 그 열에 실제로 쓰인 값이 건수와 함께 뜬다. 값은 여러 개를
   동시에 고를 수 있다 — 드롭다운으로는 "사건과 컨설팅만"을 볼 수 없었다.
   고른 값은 S.F={my:{cat:[...],…}, team:{…}}에 화면별로 담는다.
   빈 배열 = 그 열에 조건 없음. 내 업무·팀 전체가 같은 코드를 쓴다. */
// 기한은 겹치지 않는 칸으로 나눈다 — 체크 목록은 한 건이 한 칸에만 들어가야 센 수가 맞다
var DUE_BUCKETS=[['over','기한 지남'],['d7','임박 D-7'],['d30','한 달 안'],['later','그 뒤'],['none','기한 없음']];
var DUE_LABEL={}, DUE_ORDER={};
DUE_BUCKETS.forEach(function(b,i){ DUE_LABEL[b[0]]=b[1]; DUE_ORDER[b[0]]=i; });
function dueBucket(it){
  var d=dday(itemDue(it));
  if(d===null) return 'none';
  if(d<0)  return 'over';
  if(d<=7) return 'd7';
  if(d<=30)return 'd30';
  return 'later';
}
/* 걸러 볼 수 있는 열. 화면(sc)마다 목록이 다르지만 동작은 하나로 쓴다.
   [키, 열 이름, 그 건의 값] — 값이 같은 것끼리 한 줄로 묶인다. */
var FCOLS={
  my:  [['cat','구분',      function(it){ return catNorm(it.cat)||'기타'; }],
        ['pt', '업무',      function(it){ return ptOf(it); }],
        ['st', '상태',      function(it){ return it.status||'진행중'; }],
        ['due','다음 할 일',dueBucket]],
  // 담당은 한 건에 여러 명(주 1 + 부 N)이라 값을 배열로 준다 — 그 사람이
  // 부담당으로 붙어 있는 건까지 함께 봐야 무슨 일을 하고 있는지 알 수 있다
  team:[['mgr','담당',mgrAll,'담당으로 걸러 봅니다 — 주담당·부담당 모두'],
        ['cat','구분',      function(it){ return catNorm(it.cat)||'기타'; }],
        // 부담당만 따로 — 「담당」은 주·부를 함께 보므로 부담당만 좁힐 수가 없었다
        ['sub','부담당',mgrSubVals,'부담당으로 걸러 봅니다 — 공동으로 함께 하는 사람'],
        ['pt', '업무명',    function(it){ return ptOf(it); }],
        ['st', '상태',      function(it){ return it.status||'진행중'; }],
        ['due','다음 할 일',dueBucket]]
};
function fCols(sc){ return FCOLS[sc]||FCOLS.my; }
function fCol(sc,k){
  var a=fCols(sc); for(var i=0;i<a.length;i++) if(a[i][0]===k) return a[i];
  return null;
}
function fRender(sc){ if(sc==='team') renderTeam(); else renderMy(); }
/* 그 열에 걸린 조건.
   없음(조건 없음) = 배열이 아님 → 거르지 않는다
   빈 배열        = 하나도 안 골랐다 → 아무것도 안 남는다
   두 가지는 다르다. 체크를 즉시 반영하게 되면서 "다 지웠다"와 "조건이 없다"가
   같은 값이 되면 다 지운 순간 전부 다시 보여 무엇을 한 것인지 알 수 없다. */
function fHas(sc,k){ return (S.F&&S.F[sc]&&S.F[sc][k]) instanceof Array; }
function fSel(sc,k){ var s=S.F&&S.F[sc]&&S.F[sc][k]; return (s instanceof Array)?s:[]; }
function fSet(sc,k,v){ S.F=S.F||{}; S.F[sc]=S.F[sc]||{}; S.F[sc][k]=v; }
function fClear(sc,k){ if(S.F&&S.F[sc]) delete S.F[sc][k]; }
function fAny(sc){ return fCols(sc).some(function(c){ return fHas(sc,c[0]); }); }
function fResetCols(sc){ S.F=S.F||{}; S.F[sc]={}; }
function fLabel(k,v){ return k==='due'?(DUE_LABEL[v]||v):(v||'(이름 없음)'); }
// 한 건이 값을 여럿 가질 수 있다(담당 = 주 1 + 부 N). 항상 배열로 다룬다.
function _fList(v){ return (v instanceof Array)?v:[v]; }
// 그 열에 실제로 쓰인 값과 건수. 건수는 "그 열만 빼고" 걸러 센다(엑셀과 같다) —
// 그래야 "사건을 고르면 컨설팅이 0건"이 되어 다시 넓힐 수가 없는 일이 없다.
function fVals(sc,k,arr){
  var f=fCol(sc,k); if(!f) return [];
  var m={}, out=[];
  (arr||[]).forEach(function(it){
    _fList(f[2](it)).forEach(function(v){ if(!(v in m)){ m[v]=0; out.push(v); } m[v]++; });
  });
  out.sort(k==='due'
    ?function(a,b){ return DUE_ORDER[a]-DUE_ORDER[b]; }
    :function(a,b){ return String(fLabel(k,a)).localeCompare(String(fLabel(k,b)),'ko'); });
  return out.map(function(v){ return [v,m[v]]; });
}
// 고른 값에 드는가. except를 주면 그 열 조건은 빼고 본다(선택지 건수를 셀 때).
function fPass(sc,it,except){
  var a=fCols(sc);
  for(var i=0;i<a.length;i++){
    if(a[i][0]===except) continue;
    if(!fHas(sc,a[i][0])) continue;                 // 조건 없음 — 거르지 않는다
    var sel=fSel(sc,a[i][0]);
    if(!sel.length) return false;                   // 하나도 안 골랐다 — 아무것도 안 남는다
    // 값이 여럿이면 하나라도 걸리면 남긴다 (담당: 주담당이거나 부담당이거나)
    var hit=_fList(a[i][2](it)).some(function(v){ return sel.indexOf(v)>=0; });
    if(!hit) return false;
  }
  return true;
}
// 열려 있는 열 하나 — 'my:cat' 꼴로 담는다(두 화면이 같은 자리를 쓰지 않게)
function fPopKey(sc,k){ return sc+':'+k; }
function fOpen(sc,k){ return S.fPop===fPopKey(sc,k); }
function fPop(sc,k){ var t=fPopKey(sc,k); S.fFind=''; S.fPop=(S.fPop===t)?'':t; fRender(sc); }
function fPopClose(sc){ if(S.fPop){ S.fPop=''; S.fFind=''; fRender(sc); } }
/* 체크를 누르는 즉시 반영한다 — [적용]을 한 번 더 누르게 하지 않는다.
   ⚠ 화면에 보이는 체크만 읽으면 안 된다. '값 찾기'로 목록을 좁힌 뒤 하나를
     체크하면 "보이는 것 전부 체크됨"이 되어 조건이 걸리는 대신 풀려 버렸다.
     그 열의 값 전체(S._fAll)를 기준으로 한 칸씩 더하고 뺀다.
   전부 골랐으면 조건 없음과 같게 지운다 — 걸린 표시가 쓸데없이 남지 않게. */
function fPick(sc,k,v,ck){
  var all=S._fAll||[];
  if(!all.length) return;
  // 조건이 없으면 '전부 골라 둔 것'에서 시작한다 — 화면도 그렇게 보인다
  var sel=fHas(sc,k)?fSel(sc,k).slice():all.slice();
  var i=sel.indexOf(v);

function wkKey(e,inp){
  if(_ime(e)) return;                  // 한글 조합 중 Enter — 글자를 확정하는 것이지 저장이 아니다
  var day=inp.getAttribute('data-d')||'';
  // ↑↓는 저장하지 않고 칸만 옮긴다 — 적다 만 줄을 두고 위아래를 훑을 수 있어야 한다
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); wkMove(inp,e.key==='ArrowDown'?1:-1); return; }
  // ←→는 요일을 옮긴다. 글자가 있을 때는 글자 안에서 커서를 옮겨야 하므로 빈 칸에서만.
  if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&!inp.value){
    e.preventDefault(); wkSide(inp,e.key==='ArrowRight'?1:-1); return; }
  if(e.key!=='Enter')return;
  e.preventDefault();
  var step=e.shiftKey?-1:1;                                     // Shift+Enter는 윗줄로
  var id=inp.getAttribute('data-id'); var txt=inp.value;
  if(!txt.trim()){ wkMove(inp,step); return; }                  // 빈 칸에서 Enter = 그냥 넘어가기
  // 요일 칸에 적었으면 그 날짜로. 한 칸 보기는 오늘(지난 주는 그 주 금요일)로.
  var dateStr=day||(isCurWeek()?todayStr():ymd(addDays(S.week,4)));
  var r=inp.getAttribute('data-r'), c=inp.getAttribute('data-c');
  inp.value='';
  wkSave(id,txt,dateStr).then(function(ok){ if(!ok){inp.value=txt;return;}
    var all=[].slice.call(document.querySelectorAll('.wkin'));
    var i=all.indexOf(inp);
    route();
    setTimeout(function(){
      // 그냥 Enter는 그 칸에 머문다 — 하루에 여러 건을 적는 것이 이 화면의 쓰임이다.
      // 아랫줄로 가려면 ↓, 윗줄은 Shift+Enter.
      if(!e.shiftKey){
        if(r===null||c===null){ wkFocus(i); return; }
        var same=[].slice.call(document.querySelectorAll('.wkin[data-c="'+c+'"]'));
        for(var k3=0;k3<same.length;k3++)
          if(same[k3].getAttribute('data-r')===r){ wkPut(same[k3]); return; }
        wkFocus(i); return;
      }
      // Shift+Enter — 윗줄 같은 요일로
      if(r===null||c===null){ wkFocus(i+step); return; }
      var col=[].slice.call(document.querySelectorAll('.wkin[data-c="'+c+'"]'));
      var j=-1;
      for(var k2=0;k2<col.length;k2++) if(col[k2].getAttribute('data-r')===r){ j=k2; break; }
      wkPut(col[Math.max(0,Math.min((j<0?0:j)+step,col.length-1))]);
    },50);
  });
}

   달력을 따로 두면 "달력에서 날짜 확인 → 표에서 그 줄 찾기"로 눈이 오간다.
   달력을 표 안으로 들여와, 그 업무 줄에서 기한·할 일이 어느 요일인지 보고

  if(S.wkSplit===undefined){

    /* ★ 처음에는 «요일별»이다 — 되돌렸다 (대표 보고 2026-09-06 「왜 사라졌나」).
       한때 한 칸으로 바꿨었다. 업무명 칸이 눌린 것이 요일 칸 탓인 줄 알았는데,
       그것은 업무명 열이 «접혀» 있어서였고 그쪽을 고치니 해결됐다.
       요일 칸은 없앨 것이 아니었다 —
         「원래 하루씩 체크하고 당일에 들어온 이메일 정보 등을 아주 간략하게
          확인하려고 하는 것인데」
       하루하루 무엇을 했는지 적는 자리가 이 화면의 뼈대다.
     ⚠ 한 칸으로 보고 싶으면 머리줄의 [요일별] 칩을 누르면 된다.
     ⚠ 손수 고른 사람의 뜻은 그대로 둔다 — 저장된 '0' 은 「한 칸으로 보겠다」다. */
    S.wkSplit=(v!=='0');
  }
  return !!S.wkSplit;

// 보여줄 요일 — 월~금. 토·일에 적힌 기록이 하나라도 있으면 그 두 칸도 함께
// 내보인다(안 그러면 주말에 적은 것이 사라진 것처럼 보인다).
function wkDays(){
  var d=[],i;
  for(i=0;i<5;i++) d.push(ymd(addDays(S.week,i)));
  var sat=ymd(addDays(S.week,5)), sun=ymd(addDays(S.week,6)), we=false;
  var c=wkCache[weekKeyOf(S.week)]||{};
  Object.keys(c).forEach(function(iid){
    var m=c[iid]||{};
    Object.keys(m).forEach(function(lid){ var dd=m[lid]&&m[lid].d; if(dd===sat||dd===sun) we=true; });
  });
  // 걸어 둔 할 일이 주말이면 그 칸도 열어야 한다 — 안 그러면 걸 수도, 볼 수도 없다
  if(!we) Object.keys(steps||{}).forEach(function(iid){
    var m=steps[iid]||{};
    Object.keys(m).forEach(function(sid){ var dd=m[sid]&&m[sid].d; if(dd===sat||dd===sun) we=true; });
  });
  if(we){ d.push(sat); d.push(sun); }
  return d;
}

function planAdd(id,text,d){

           by:(S.me&&S.me.sid)||'',byName:(S.me&&S.me.name)||''};

/* 체크 = 실적. 단계를 done 처리하고 그 날 기록도 만든다.
   기록을 안 만들면 팀 전체의 「✍ 미기록」·「최근 기록」·전체 검색이 그 일을

   기록에 k:'step' 을 달아 두고 칸에서는 그 기록을 다시 그리지 않는다. */
function planCheck(id,sid){
  var s=(steps[id]||{})[sid]; if(!s||s.done) return;
  addLog(id,s.t,s.d||todayStr(),'step').then(function(ok){
    if(!ok) return;
    var lid=_lastLogId;                       // addLog 가 방금 만든 기록
    var up={};
    up[NS+'/steps/'+id+'/'+sid+'/done']=1;
    up[NS+'/steps/'+id+'/'+sid+'/by']=(S.me&&S.me.name)||'';
    up[NS+'/steps/'+id+'/'+sid+'/at']=todayStr();
    up[NS+'/steps/'+id+'/'+sid+'/lid']=lid||null;   // 체크를 풀 때 이 기록을 지운다
    fbDb.ref().update(up).catch(function(e){ toast('실패: '+e.message,'err'); });
  });
}
function planUncheck(id,sid){
  var s=(steps[id]||{})[sid]; if(!s||!s.done) return;
  var up={};
  up[NS+'/steps/'+id+'/'+sid+'/done']=0;
  up[NS+'/steps/'+id+'/'+sid+'/by']=null;
  up[NS+'/steps/'+id+'/'+sid+'/at']=null;
  up[NS+'/steps/'+id+'/'+sid+'/lid']=null;
  fbDb.ref().update(up).then(function(){
    if(s.lid) _delLog(id,s.lid);              // 체크가 만든 기록은 체크가 거둔다
  }).catch(function(e){ toast('실패: '+e.message,'err'); });
}
// 할 일을 지운다. 이미 체크해 기록이 된 것은 남긴다 — 한 일을 지우지 않는다.
function planDel(id,sid){
  fbDb.ref(NS+'/steps/'+id+'/'+sid).remove()
    .catch(function(e){ toast('실패: '+e.message,'err'); });
}
/* 잘못 들어간 것을 옮긴다 — 지우고 다시 적지 않아도 되게.
   할 일 → 기록: 그 날 기록을 만들고 할 일을 없앤다(체크와 달리 흔적을 남기지
   않는다 — 체크한 것이 아니라 처음부터 기록이었어야 할 것이다). */
function planToLog(id,sid){
  var s=(steps[id]||{})[sid]; if(!s) return;
  addLog(id,s.t,s.d||todayStr()).then(function(ok){
    if(!ok) return;
    fbDb.ref(NS+'/steps/'+id+'/'+sid).remove()
      .then(function(){ toast('기록으로 옮겼습니다'); })
      .catch(function(e){ toast('실패: '+e.message,'err'); });
  });
}
// 기록 → 할 일: 그 날짜로 할 일을 걸고 기록을 지운다.
function logToPlan(id,lid){
  var l=(itemLogsCache[id]||{})[lid];
  if(!l){ loadItemLogs(id).then(function(){ logToPlan(id,lid); }); return; }
  if(!canLog(l)){ toast('본인이 쓴 기록만 옮길 수 있습니다','warn'); return; }
  planAdd(id,l.t,l.d).then(function(ok){ if(ok) _delLog(id,lid); });
}

    +(s.done?'✓':'☐')+'</span>'

    +(s.done?'':'<span class="px" onclick="planToLog(\''+escJ(it._id)+'\',\''+escJ(s._id)+'\')" '

/* ── 업무 종료 ── 푸른이알피에서 가져온 건이면 그쪽 사건도 함께 종료할지 묻는다 */

function endWayPick(v){

function _pickedWay(){

}
function resPick(el){

// 회고를 먼저 저장한 뒤 종료하고, AI가 붙어 있으면 지식 수확을 제안한다
function doCompleteWithRetro(id,linked){
  var r={}, any=false;
  RETRO_FIELDS.forEach(function(f){
    var el=$('rt-'+f[0]); var v=el?el.value.trim():'';
    r[f[0]]=v; if(v) any=true;
  });
  var alsoPe=linked?!!(($('cl-pe')||{}).checked):false;
  var way=_pickedWay(), to=(($('cl-to')||{}).value||'').trim(), res=_pickedRes();
  var pre=Promise.resolve(true);
  if(any){
    // 기존 노트에 병합 — AI 인터뷰 답변(qa) 등이 지워지지 않도록
    var note=Object.assign({},(items[id]&&items[id].ho_note)||{});
    note.retro=Object.assign({},note.retro||{},r,
      {by:(S.me&&S.me.sid)||'',byName:(S.me&&S.me.name)||'',at:todayStr()});
    pre=patchItem(id,{ho_note:note});
  }
  pre.then(function(ok){
    if(!ok) return;
    return doComplete(id,linked?alsoPe:undefined,way,to,res).then(function(){
      if(aiProxyUrl()&&(any||Object.keys(itemLogsCache[id]||{}).length||noteDone(items[id]||{})))
        setTimeout(function(){ kbHarvest(id); },500);
    });
  });
}
// 종료/재개는 양방향 동기화 대상. state_at 이 "이 쪽에서 마지막으로 바뀐 시각"이고,
// 푸른이알피가 나의 업무를 열 때 work_erp/pesync 스냅샷과 비교해 변한 쪽을 반대편에 반영한다.
function setState(id,done,alsoPe,msg,way,to,res){
  var it=items[id]||{}, now=new Date().toISOString();
  var w=END_BY_KEY[way]?way:'done';
  var patch={ state:done?'done':null, done_date:done?todayStr():null,
    status:done?(END_BY_KEY[w][1]):'진행중', state_at:now,
    // 끝낸 방식은 종료할 때만 찍고, 재개해도 지우지 않는다 —
    // 원래 취소였는지 이관이었는지를 잃으면 푸른이알피 상태를 되돌릴 수 없다
    end_way:done?w:(it.end_way||null),
    end_to:done?(w==='transfer'?(to||''):null):(it.end_to||null),
    // 사건 결과도 재개해서 지우지 않는다 — 다시 종료할 때 되돌릴 근거다
    end_result:done?(RES_BY_KEY[res]?res:null):(it.end_result||null) };
  if(peLinked(it)&&alsoPe!==undefined) patch.pe_nosync=alsoPe?null:true;
  var up={}; Object.keys(patch).forEach(function(k){ up[NS+'/items/'+id+'/'+k]=patch[k]; });
  return fbDb.ref().update(up).then(function(){
    Object.assign(items[id]||{},patch);
    var linked=peLinked(it)&&!patch.pe_nosync;
    /* 푸른이알피에 「볼 것이 생겼다」고 알린다. 그쪽은 이 자리만 지켜보다 바뀌면
       동기화 엔진을 돌린다 — 종전에는 「나의 업무」를 열어야만 돌아 한참 걸렸다.
       ⚠ items 가 아니라 따로 둔 까닭: 엔진이 items 에도 쓰기 때문에 items 를
         듣게 하면 제가 쓴 걸 제가 듣고 끝없이 돈다. 여기는 업무관리만 쓴다.
       ⚠ 종료 저장과 **한 묶음으로 보내지 않는다.** 한 묶음이면 이 자리 쓰기가
         규칙에 막히는 순간 묶음 전체가 실패해 종료 자체가 안 된다. 알림은
         곁다리이므로 따로 보내고, 실패해도 조용히 넘긴다(그때는 예전처럼
         푸른이알피를 열 때 반영된다). */
    if(linked){ try{ fbDb.ref(NS+'/sync_ping').set({at:Date.now(),itemId:id}).catch(function(){}); }catch(e){} }
    if(linked) addLog(id,(done?'업무 종료':'업무 재개')+' — 푸른이알피 '+(PE_KIND[it.ref.type]||'')+' 동기화 대상',todayStr(),'ho');
    closeM(); toast(msg+(linked?' · 푸른이알피에 곧 반영됩니다':''));
    if(done&&S.drawerId===id) closeDrawer();
    route();
  }).catch(function(e){ toast('실패: '+e.message,'err'); route(); });
}
function doComplete(id,alsoPe,way,to,res){
  var w=END_BY_KEY[way]?way:'done';
  var r=RES_BY_KEY[res];
  return setState(id,true,alsoPe,'✅ '+END_BY_KEY[w][1]+(r?' · '+r[1]:'')+' — 종료 화면으로 이동',w,to,res);
}

/* ── 빠른 기록 바 ── */
var _qbPick=0,_qbMatches=[];
function qbParse(){
  var v=$('qb').value; var sp=v.indexOf(' ');
  var key=sp<0?v:v.slice(0,sp); var rest=sp<0?'':v.slice(sp+1);
  return {key:key.trim(),rest:rest.trim()};
}
function qbSug(){
  var p=qbParse(); var box=$('qsug');
  if(!p.key){ box.style.display='none'; _qbMatches=[]; return; }
  var pool=myOpen();
  _qbMatches=pool.filter(function(it){
    return (it.company||'').indexOf(p.key)>=0||(it.title||'').indexOf(p.key)>=0||(it.client||'').indexOf(p.key)>=0;
  }).slice(0,5);
  _qbPick=0;
  if(!_qbMatches.length){ box.style.display='none'; return; }
  box.innerHTML=_qbMatches.map(function(it,i){
    return '<div class="qi'+(i===_qbPick?' pick':'')+'" onmousedown="qbGo('+i+')">'+catBadge(it.cat)
      +' <b>'+esc(it.company||it.client||'')+'</b> <span class="muted">'+esc(it.title||'')+'</span>'
      +'<small>'+(i===_qbPick?'Enter로 기록':'')+'</small></div>'; }).join('');
  /* ⚠ '' 를 주면 CSS 의 display:none 이 이겨서 «안 보인다» — 실제 값을 준다.
     이 한 글자 때문에 추천 목록이 그동안 한 번도 뜨지 않았다(2026-09-02 발견).
     Enter 로 기록하는 것은 _qbMatches 로 되고 있었으니 아무도 못 알아챘다. */
  box.style.display='block';
}
function qbKey(e){
  if(_ime(e)) return;                  // 한글 조합 중 Enter는 글자를 확정하는 것이다
  if(e.key==='ArrowDown'){ e.preventDefault(); if(_qbMatches.length){_qbPick=(_qbPick+1)%_qbMatches.length; qbRepaint();} return; }
  if(e.key==='ArrowUp'){ e.preventDefault(); if(_qbMatches.length){_qbPick=(_qbPick-1+_qbMatches.length)%_qbMatches.length; qbRepaint();} return; }
  if(e.key==='Escape'){ $('qb').blur(); $('qsug').style.display='none'; return; }
  if(e.key==='Enter'){ e.preventDefault(); qbGo(_qbPick); }
}
function qbRepaint(){ var els=$('qsug').children;
  for(var i=0;i<els.length;i++){ els[i].className='qi'+(i===_qbPick?' pick':''); els[i].querySelector('small').textContent=(i===_qbPick?'Enter로 기록':''); } }
function qbGo(i){
  var it=_qbMatches[i]; var p=qbParse();
  if(!it){ toast('일치하는 업무가 없습니다','warn'); return; }
  if(!p.rest){ $('qsug').style.display='none'; openDrawer(it._id); $('qb').value=''; return; }
  addLog(it._id,p.rest,todayStr()).then(function(ok){ if(!ok)return;
    $('qb').value=''; $('qsug').style.display='none'; route(); });
}

/* ── 주 피커 캘린더 ── */
function openCal(){
  if($('calpop')){ closeCal(); return; }
  S.calMon=new Date(S.week.getFullYear(),S.week.getMonth(),1);
  var pop=document.createElement('div'); pop.id='calpop';
  var pill=$('wkpill'); var r=pill.getBoundingClientRect();
  pop.style.top=(r.bottom+8+window.scrollY)+'px';
  pop.style.left=Math.max(10,Math.min(window.innerWidth-320,r.left-40))+'px';
  document.body.appendChild(pop);
  renderCal();
  setTimeout(function(){ document.addEventListener('mousedown',_calOut); },0);
}
function _calOut(e){ var p=$('calpop'); if(p&&!p.contains(e.target)&&e.target.id!=='wkpill'){ closeCal(); } }
function closeCal(){ var p=$('calpop'); if(p)p.remove(); document.removeEventListener('mousedown',_calOut); }
function calShift(n){ S.calMon=new Date(S.calMon.getFullYear(),S.calMon.getMonth()+n,1); renderCal(); }
function renderCal(){
  var pop=$('calpop'); if(!pop)return;
  var y=S.calMon.getFullYear(), m=S.calMon.getMonth();
  var first=mondayOf(new Date(y,m,1)); var mons=[];
  for(var d=new Date(first); d<=new Date(y,m+1,0); d=addDays(d,7)) mons.push(new Date(d));
  // 이 달 주들의 기록 로드(캐시) 후 도트 표시

function _handoverTo(id,sid,name,why){
  var it=items[id]; if(!it)return;
  if((it.mgr_main&&it.mgr_main.sid)===sid){ return; }
  var old={sid:(it.mgr_main&&it.mgr_main.sid)||'',name:(it.mgr_main&&it.mgr_main.name)||'—'};
  var subs=(it.mgr_subs||[]).filter(function(s){return s.sid!==sid;});   // 새 주담당은 부담당에서 제외
  var f={mgr_main:{sid:sid,name:name},mgr_subs:subs,
    ho:{from:old,to:{sid:sid,name:name},at:new Date().toISOString(),confirmed:false}};
  /* 푸른이알피 사무관리의 주담당도 함께 바꾼다.
     ⚠ 여기서 마스터에 바로 쓰면 안 된다 — 키마다 저장형태(배열/객체)가 달라
       그것을 아는 dbPatch 가 푸른이알피 «안에만» 있다.
       부담당을 넘길 때 쓰던 길(pe_addsub)과 같은 방식으로 «요청만» 적어 두고,
       푸른이알피 동기화 엔진이 읽어서 처리하고 지운다.
     ⚠ 안 넘기면 사무관리에는 퇴사자가 주담당으로 남아 두 곳이 어긋난다.
       (되돌아가지는 않는다 — 미러는 푸른이알피가 «실제로 바뀌었을 때만» 덮는다.
        그래도 어긋난 채로 두면 언젠가 푸른이알피를 손댄 순간 여기가 덮인다) */
  if(peLinked(it)) f.pe_setmain={sid:sid,name:name,from:old.sid||'',at:new Date().toISOString()};
  // ⚠ 약속을 돌려준다 — 여러 건을 한꺼번에 넘기고 「다 끝난 뒤」에 무엇을 하려면 필요하다
  return patchItem(id,f).then(function(ok){
    if(!ok)return;   // 담당 변경이 실패했으면 감사 로그를 남기지 않는다
    addLog(id,'담당 '+old.name+' → '+name+' (인수 확인 대기)'+(why?' · '+why:''),todayStr(),'ho');
    toast('🔄 담당 변경: '+name+' — 인수 확인 대기'); if(S.drawerId===id)renderDrawer(); route();
  });
}

function aiProxyUrl(){
  try{
    // 이 기기 설정 우선, 없으면 포털 ⚙설정의 공용값(data/app_config)
    var raw=localStorage.getItem('pureun_v6_setting_ai_proxy_url')||localStorage.getItem('pureun_v6_ai_proxy_url')
            ||(window.PU_CFG&&window.PU_CFG.aiProxyUrl)||'';
    if(!raw) return '';
    if(raw.charAt(0)==='"'){ try{ return JSON.parse(raw); }catch(e){ return raw.replace(/^"|"$/g,''); } }
    return raw;
  }catch(e){ return ''; }
}

/* 바깥으로 나가는 부름은 이것 하나뿐이다(AI 프록시). 시간 제한이 없으면
   답이 안 올 때 «영영» 기다린다 — 「기록·노트·회고를 읽고 있습니다…」 창은
   닫는 단추가 없어서 그대로 갇히고, 단추들은 눌린 채로 멈춘다.
   답만 오면(늦게라도 실패로) 부른 쪽들은 스스로 되돌아온다 — 이미 그렇게 짜여 있다. */
var AI_WAIT_MS=60000;
function aiFetch(url,opts){
  if(typeof AbortController==='undefined') return fetch(url,opts);   // 아주 옛 브라우저
  var ac=new AbortController();
  var timer=setTimeout(function(){ ac.abort(); }, AI_WAIT_MS);
  var o={}; for(var k in opts){ if(Object.prototype.hasOwnProperty.call(opts,k)) o[k]=opts[k]; }
  o.signal=ac.signal;                                  // 넘겨받은 것은 고치지 않는다
  return fetch(url,o).then(function(r){ clearTimeout(timer); return r; },
    function(e){
      clearTimeout(timer);
      if(e&&e.name==='AbortError'){
        var t=new Error(Math.round(AI_WAIT_MS/1000)+'초 안에 답이 오지 않았습니다 — 잠시 뒤 다시 해 주세요');
        t.timeout=true; throw t;
      }
      throw e;
    });
}
function aiCall(system,userText){
  var url=aiProxyUrl();
  /* ⚠ 넣는 자리는 «포털»의 ⚙ 설정 뿐이다(관리자만 보인다). 푸른이알피 환경설정에는
     그 칸이 없다 — 엉뚱한 곳을 가리키면 찾다가 못 찾고 포기한다. */
  if(!url) return Promise.reject(new Error('AI 프록시 주소가 없습니다 — 시작 화면(포털) 왼쪽 아래 [⚙ 설정] → 「AI 프록시 주소」에 등록하세요 (대표만 보입니다)'));
  var i=0;
  function attempt(){
    return aiFetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:AI_MODELS[i],max_tokens:8000,system:system,
        messages:[{role:'user',content:userText}]})})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d&&d.error) throw new Error(d.error.message||'AI 오류');
        var t=d.reply||d.text||((d.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join(''));
        if(!t) throw new Error('AI 응답이 비어 있습니다');
        return t;
      })
      .catch(function(e){
        // ⚠ 끊긴 것은 «모델 탓»이 아니다. 다음 모델로 다시 걸면 1분을 또 기다린다.
        if(e&&e.timeout) throw e;
        if(i<AI_MODELS.length-1){ i++; return attempt(); }   // 프록시가 모델을 제한하면 다음 모델로
        throw e;
      });
  }
  return attempt();
}
function aiJson(text){
  var s=String(text||''), a=s.indexOf('{'), b=s.lastIndexOf('}');
  if(a<0||b<a) throw new Error('AI 응답을 해석할 수 없습니다');
  return JSON.parse(s.slice(a,b+1));
}

  +'나쁜 질문: 기록에 이미 답이 있는 것, 일반론, 예/아니오로 끝나는 것.\n'
  +'규칙: 질문 3~5개, 각 한 문장, 기록의 구체적 사실(날짜·상대방·행위)을 인용해 맥락을 밝히세요.\n'
  +'다른 설명 없이 JSON만 출력: {"questions":["질문1","질문2","질문3"]}';
var AI_SYS_HARVEST='당신은 한국 노무법인의 지식관리 조수입니다. 종료된 업무의 진행 기록·인수인계 노트·마무리 회고를 읽고, '

  +'다음에 또 쓸 수 있는 것만 남깁니다. ③ kl은 반드시 자료에 등장한 이름이어야 합니다. 추측한 이름은 쓰지 마세요. '
  +'④ 사람 카드는 인물 평가가 아니라 행동 지침으로 쓰세요. "까다롭다"가 아니라 "서면만 보내면 보완 요구가 잦다 — 통화로 먼저 설명하면 빠르다"처럼 씁니다. '

  +'카드는 최대 6장, 제목은 한 줄, 내용은 두세 문장. '
  +'다른 설명 없이 JSON만 출력: {"cards":[{"kind":"person","kl":"대상 이름","t":"한 줄 제목","x":"내용"}]}';

function aiHarvestContext(id){
  var it=items[id]||{}, n=it.ho_note||{}, r=n.retro||{};
  var L=[aiContext(id)];
  var got=false;
  HO_FIELDS.forEach(function(f){
    if(String(n[f[0]]||'').trim()){ if(!got){ L.push('','[인수인계 노트]'); got=true; } L.push(f[1]+': '+n[f[0]]); }
  });
  (n.qa||[]).forEach(function(p){ if(p&&p.a) L.push('Q '+p.q+' → A '+p.a); });
  var rg=false;
  RETRO_FIELDS.forEach(function(f){
    if(String(r[f[0]]||'').trim()){ if(!rg){ L.push('','[마무리 회고]'); rg=true; } L.push(f[1]+': '+r[f[0]]); }
  });
  L.push('','[cat 값으로 쓸 구분]: '+(it.cat||''));
  return L.join('\n');
}

function kbHarvestSave(){
  var up={}, n=0, msg=$('hv-msg');
  (S._hv||[]).forEach(function(c,i){
    var chk=$('hv-'+i); if(!chk||!chk.checked) return;
    var kind=(($('hv-k'+i)||{}).value)||c.kind||'person';
    var kl=(($('hv-l'+i)||{}).value||'').trim();
    var t=(($('hv-t'+i)||{}).value||'').trim();
    var x=(($('hv-x'+i)||{}).value||'').trim();
    if(!kl||!t) return;
    var key=kbKey(kl); if(!key) return;
    up[NS+'/kb/'+kind+'/'+key+'/'+rid('K')]={t:t,x:x,kl:kl,
      by:(S.me&&S.me.sid)||'',byName:(S.me&&S.me.name)||'',
      at:new Date().toISOString(),src:S._kbSrc||null,ai:1};
    n++;
  });
  if(!n){ if(msg)msg.textContent='저장할 카드가 없습니다 (대상 이름과 제목은 비울 수 없습니다).'; return; }
  if(msg)msg.textContent='저장 중… ('+n+'건)';
  fbDb.ref().update(up).then(function(){
    closeM(); toast('📚 지식 '+n+'건 저장'); route();
  }).catch(function(e){ if(msg)msg.textContent='실패: '+e.message; });
}

/* ── 인수인계 걸러 보기 ──
   값이 몇 가지로 갈리는 칸(구분·노트·후임)만 단다. 기업·업무는 값이 제각각이라
   거르는 것보다 검색이 낫다. 카드마다 따로 걸리게 부재자 아이디로 나눠 담는다 —
   한 곳에 담으면 사람 A 에서 고른 조건이 사람 B 목록까지 좁힌다. */
var HO_FCOLS=[
  ['cat','구분',    function(it){ return catNorm(it.cat)||'기타'; }],
  ['note','노트',   function(it){ return noteDone(it)?'작성됨':'미작성'; }],
  ['suc','후임',    function(it){ return (it.mgr_main&&it.mgr_main.name)||'(미지정)'; }]
];
function hoFSel(sid,k){ var v=S.hoF&&S.hoF[sid]&&S.hoF[sid][k]; return (v instanceof Array)?v:null; }
function hoFPass(it,sid,except){
  for(var i=0;i<HO_FCOLS.length;i++){
    var c=HO_FCOLS[i]; if(c[0]===except) continue;
    var sel=hoFSel(sid,c[0]); if(!sel) continue;
    if(!sel.length) return false;                 // 하나도 안 골랐다 = 아무것도 안 남는다
    if(sel.indexOf(c[2](it))<0) return false;
  }
  return true;
}
function hoFVals(arr,sid,k){
  var c=HO_FCOLS.filter(function(x){return x[0]===k;})[0]; if(!c) return [];
  var m={}, out=[];
  arr.forEach(function(it){ if(!hoFPass(it,sid,k)) return;
    var v=c[2](it); if(!(v in m)){ m[v]=0; out.push(v); } m[v]++; });
  return out.sort(function(a,b){ return String(a).localeCompare(String(b),'ko'); })
    .map(function(v){ return [v,m[v]]; });
}
function hoFAny(sid){ return HO_FCOLS.some(function(c){ return !!hoFSel(sid,c[0]); }); }
function hoFPop(sid,k){ var t=sid+':'+k; S.hoPop=(S.hoPop===t)?'':t; renderHo(); }
function hoFToggle(sid,k,v,on){
  S.hoF=S.hoF||{}; S.hoF[sid]=S.hoF[sid]||{};
  var cur=hoFSel(sid,k);
  if(!cur){ // 처음 누르면 「그것만」 — 하나 고르려고 나머지를 다 끄게 하지 않는다
    S.hoF[sid][k]=[v];
  }else{
    var a=cur.filter(function(x){ return x!==v; });
    if(on) a.push(v);
    S.hoF[sid][k]=a;
  }
  renderHo();
}
function hoFClear(sid){ if(S.hoF) delete S.hoF[sid]; S.hoPop=''; renderHo(); }
function hoTh(sid,arr,k,label,w){
  var sel=hoFSel(sid,k), open=S.hoPop===(sid+':'+k);
  var h='<th'+(w?' style="'+w+'"':'')+'>'
    +'<span class="hofh'+(sel?' on':'')+'" onclick="event.stopPropagation();hoFPop(\''+escJ(sid)+'\',\''+k+'\')" '
    +'title="'+esc(label)+'로 걸러 봅니다">'+esc(label)+' ▽'+(sel?' '+sel.length:'')+'</span>';
  if(open){
    h+='<div class="fbk" onclick="hoFPop(\''+escJ(sid)+'\',\''+k+'\')"></div>'
      +'<div class="hofp" onclick="event.stopPropagation()"><div class="fpl">'
      +hoFVals(arr,sid,k).map(function(pair){
          var on=!sel||sel.indexOf(pair[0])>=0;
          return '<label><input type="checkbox"'+(on?' checked':'')
            +' onchange="hoFToggle(\''+escJ(sid)+'\',\''+k+'\',\''+escJ(String(pair[0]))+'\',this.checked)">'
            +'<span>'+esc(pair[0])+'</span><span class="c">'+pair[1]+'</span></label>';
        }).join('')
      +'</div><div class="fpa"><span class="lnk" onclick="hoFClear(\''+escJ(sid)+'\')">모두 풀기</span>'
      +'<span style="flex:1"></span>'
      +'<span class="lnk" onclick="hoFPop(\''+escJ(sid)+'\',\''+k+'\')">닫기</span></div></div>';
  }
  return h+'</th>';
}

/* ══════════════════════════════════════════════════════════════
   말로 기록 — 그날 진행을 말로 남기면 AI 가 정리한다
   ══════════════════════════════════════════════════════════════
   ⚠ 대표 승인 목업(2026-08-29)에서 정한 셋 —
     ① **소리는 남기지 않는다.** 정리된 글만 저장한다. 12MB 짜리를 실시간DB 에
        넣으면 안 된다(명함 원본 417장으로 이미 겪었다).
     ② **[정리하기] 를 누를 때만** AI 를 부른다 — 부르는 만큼 요금이다.
        녹음하는 동안에는 아무것도 안 보낸다.
     ③ **AI 가 바로 저장하지 않는다.** 초안을 보여주고 사람이 고쳐 저장한다 —
        사투리·전문용어는 틀린다.
   ⚠ 판독 서버(readDoc·Gemini)를 쓴다. 업무관리의 aiCall 은 **글자만** 보내는
     길이라 소리를 실을 수 없다. 시간 제한은 aiFetch 를 그대로 넘겨 쓴다
     (바깥 부름에 제한이 없으면 답이 안 올 때 영영 갇힌다 — work-ai-timeout).
   ⚠ 서버 한도가 12MB 이고 base64 가 4/3 으로 부푼다 — 소리는 8MB 까지만 받는다. */
var VO_MAX_BYTES=8*1024*1024;
var VO_MAX_SEC=45*60;                       // 그보다 길면 스스로 멈춘다
var VO={id:'',rec:null,chunks:[],sec:0,tick:null,blob:null,url:'',res:null,list:null,busy:false,err:''};

function voReset(){
  try{ if(VO.rec&&VO.rec.state==='recording') VO.rec.stop(); }catch(e){}
  try{ if(VO.rec&&VO.rec.stream) VO.rec.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
  clearInterval(VO.tick);
  if(VO.url){ try{ URL.revokeObjectURL(VO.url); }catch(e){} }
  VO={id:'',rec:null,chunks:[],sec:0,tick:null,blob:null,url:'',res:null,list:null,busy:false,err:''};
}
/* 지금 녹음을 쥔 쪽만 다시 그린다. 서랍과 바가 같은 엔진을 나눠 쓴다 —

function voStart(id){
  if(voBusyElsewhere(id)) return;
  voReset();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    VO.id=id; VO.err='이 브라우저에서는 녹음을 쓸 수 없습니다'; voPaint(); return;
  }
  if(typeof MediaRecorder==='undefined'){
    VO.id=id; VO.err='이 브라우저에서는 녹음을 쓸 수 없습니다'; voPaint(); return;
  }
  VO.id=id;
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var rec;
    /* 되는 꼴을 골라 쓴다 — 브라우저마다 다르다. 고르지 않으면 기본값이 되고,
       그 기본값이 판독 서버가 못 읽는 꼴일 수 있다. */
    var want=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
    var mime='';
    for(var i=0;i<want.length;i++){
      if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(want[i])){ mime=want[i]; break; }
    }
    try{ rec=mime?new MediaRecorder(stream,{mimeType:mime,audioBitsPerSecond:32000}):new MediaRecorder(stream); }
    catch(e){ rec=new MediaRecorder(stream); }
    VO.rec=rec; VO.chunks=[]; VO.sec=0; VO.err='';
    rec.ondataavailable=function(e){ if(e.data&&e.data.size) VO.chunks.push(e.data); };
    rec.onstop=function(){
      clearInterval(VO.tick);
      try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
      var type=(VO.chunks[0]&&VO.chunks[0].type)||mime||'audio/webm';
      VO.blob=new Blob(VO.chunks,{type:type});
      VO.rec=null;
      if(VO.blob.size>VO_MAX_BYTES){
        VO.err='녹음이 너무 깁니다('+voMB(VO.blob.size)+') — 나눠서 녹음해 주세요';
        VO.blob=null;
      }else{
        try{ VO.url=URL.createObjectURL(VO.blob); }catch(e){ VO.url=''; }
      }
      voPaint();
    };
    rec.start(1000);                                  // 1초마다 조각 — 멈출 때 통째로 모은다
    VO.tick=setInterval(function(){
      VO.sec++;
      if(VO.sec>=VO_MAX_SEC){ voStop(); return; }
      voPaint();
    },1000);
    voPaint();
  }).catch(function(e){
    VO.err=(e&&e.name==='NotAllowedError')
      ? '마이크를 쓸 수 없습니다 — 브라우저 주소창의 자물쇠에서 마이크를 허용해 주세요'
      : '마이크를 열지 못했습니다: '+((e&&e.message)||'');
    voPaint();
  });
}
function voStop(){ try{ if(VO.rec&&VO.rec.state!=='inactive') VO.rec.stop(); }catch(e){ VO.rec=null; voPaint(); } }
/* 서랍에서는 칸이 «그 자리에» 남아 다시 녹음할 수 있어야 하고,
   바에서는 판이 «아주» 사라져야 한다 — 빈 판이 바를 가리면 칠 곳이 안 보인다. */
function voDiscard(){
  var id=VO.id; voReset();
  if(id===VO_BAR){ qvPaint(); return; }
  if(S.drawerId===id) renderDrawer();
}

/* 소리를 판독 서버로 보낸다. 돌아온 JSON 을 사람이 고칠 수 있게 담아 둔다. */
function voTidy(id){
  if(!VO.blob||VO.busy) return;
  if(!window.PuAiCall){ VO.err='판독 호출기를 싣지 못했습니다'; voPaint(); return; }
  VO.busy=true; VO.err=''; voPaint();
  var it=items[id]||{};
  var sts=STATUSES.map(function(x){ return x[0]; }).join('|');
  var ask='업무 진행 상황을 말로 녹음한 것이다. 듣고 **JSON 하나만** 답하라. 다른 말은 붙이지 마라.\n'
    +'{"done":"오늘 한 일 한두 문장","next":{"text":"다음 할 일","date":"YYYY-MM-DD"},'
    +'"status":"'+sts+' 중 하나","heard":"받아쓴 글 전문"}\n'
    +'오늘은 '+todayStr()+' 이다. 「다음 주 목요일」처럼 말한 것은 날짜로 바꿔라.\n'
    +'말에 없는 것은 지어내지 말고 빈 문자열로 두어라. 상태는 말에서 분명히 바뀐 때만 적어라.\n'
    +'회사·업무 이름은 이미 알고 있다("'+String(it.company||it.client||'')+'") — done 에 넣지 말고 한 일만 적어라.';
  voB64(VO.blob).then(function(b64){
    return PuAiCall.ask(
      [{inline_data:{mime_type:(VO.blob.type||'audio/webm').split(';')[0],data:b64}},{text:ask}],
      {auth:(typeof firebase!=='undefined'&&firebase.auth)?firebase.auth():null,
       fetch:(typeof aiFetch==='function'?aiFetch:null),
       generationConfig:{maxOutputTokens:2000}});
  }).then(function(d){
    var t=PuAiCall.textOf?PuAiCall.textOf(d):'';
    var r=aiJson(t);
    VO.res={done:String(r.done||'').trim(),
      next:{text:String((r.next&&r.next.text)||'').trim(),date:String((r.next&&r.next.date)||'').trim()},
      status:String(r.status||'').trim(),
      heard:String(r.heard||'').trim()};
    // 소리는 여기서 버린다 — 정리가 끝나면 남길 까닭이 없다
    if(VO.url){ try{ URL.revokeObjectURL(VO.url); }catch(e){} VO.url=''; }
    VO.blob=null; VO.busy=false;
    if(S.drawerId===id) renderDrawer();
  }).catch(function(e){
    VO.busy=false;
    VO.err=(e&&e.message)||'정리하지 못했습니다';
    if(S.drawerId===id) renderDrawer();
  });
}
function voB64(blob){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){ var s=String(fr.result||''); var i=s.indexOf(','); res(i<0?s:s.slice(i+1)); };
    fr.onerror=function(){ rej(new Error('녹음을 읽지 못했습니다')); };
    fr.readAsDataURL(blob);
  });
}

/* 사람이 고친 값을 저장한다. 기록·다음 할 일·상태가 한 번에 간다. */
function voSave(id){
  if(VO.busy) return;
  var dn=$('vo-done'), nx=$('vo-next'), dt=$('vo-date'), st=$('vo-st');
  var done=dn?dn.value.trim():'';
  if(!done){ toast('오늘 한 일을 적어 주세요','warn'); return; }
  VO.busy=true; renderDrawer();
  var jobs=[addLog(id,done,todayStr(),'vo')];
  var f={};
  var nt=nx?nx.value.trim():'', nd=dt?dt.value:'';
  if(nt||nd) f.next={text:nt,date:nd};
  if(st&&st.checked&&VO.res&&VO.res.status) f.status=VO.res.status;
  if(Object.keys(f).length) jobs.push(patchItem(id,f));
  Promise.all(jobs).then(function(){
    voReset();
    toast('🎤 말로 기록 저장됨');
    if(S.drawerId===id) renderDrawer();
    route();
  }).catch(function(e){
    VO.busy=false; VO.err='저장 실패: '+((e&&e.message)||''); renderDrawer();
  });
}

/* ══════════════════════════════════════════════════════════════════════
   🎤 말로 기록 2단 — 한 번 녹음해 «여러 건»으로 가르기 (대표 승인 목업)
   ══════════════════════════════════════════════════════════════════════
   서랍의 말로 기록은 «그 한 건»에만 넣는다. 그런데 현장에서 돌아오는 길에는
   보통 세 곳을 다녀온다 — 한 건씩 서랍을 열어 세 번 녹음하지 않는다.
   그래서 빠른 기록 바에서 «이어서» 말하고, 갈라 담는 것은 기계가 한다.

   ⚠ 이름으로 맞추지 않는다 — **내 업무 목록의 번호**를 AI 에게 주고 번호로 받는다.
     이름을 되돌려 받아 글자로 맞추면 「가나다」와 「가나다산업」이 갈라지고,
     사투리·줄임말이 섞이면 조용히 엉뚱한 업무에 기록이 붙는다.
     번호는 물어본 그 순간의 목록에 대한 것이라 «그때 목록»을 붙들고 맞춘다
     (실시간DB 로 목록이 바뀌어도 어긋나지 않게).
   ⚠ **못 찾은 줄은 저장하지 않는다.** 노란 줄로 남겨 두고 「몇 건은 못 찾았다」를
     머리에 적는다 — 조용히 빠지면 「말했는데 안 들어갔다」가 된다.
   ⚠ 줄마다 «업무 고르는 칸»을 늘 보여준다. AI 가 맞춘 것도 그 칸에 골라 둔
     모습으로 보인다 — 「바꾸기」를 따로 만들면 바꿀 수 있다는 것을 아무도 모른다.
   ⚠ 다시 그리기 전에 **손으로 고친 값을 먼저 걷는다**(qvHarvest). 안 걷으면
     업무를 골라 주는 순간 옆 칸에 쳐 둔 글이 사라진다.
   ⚠ 서랍과 엔진을 나눠 쓴다 — 둘이 동시에 녹음하지 못하게 voBusyElsewhere 로 막는다. */
function qvStart(){ voStart(VO_BAR); }
function qvClose(){ voDiscard(); }

/* 갈라 놓은 줄들. 줄마다 업무·한 일·다음 할 일·상태를 사람이 고친다. */

  });
  h+='</div><div class="vrow" style="margin-top:10px;border-top:1px solid var(--line);padding-top:9px">'
    +'<span class="vomut">저장하면 각 업무의 주간 기록과 다음 할 일로 함께 들어갑니다.</span>'
    +'<span style="flex:1"></span>'
    +'<button onclick="qvClose()" style="font-size:11.5px">버리기</button>'
    +'<button class="primary" onclick="qvSave()"'+(VO.busy?' disabled':'')+'>'
    +(VO.busy?'저장 중…':'💾 '+got+'건 저장')+'</button></div>';
  return h;
}
/* 상태를 물어볼 만한 줄인가 — 업무가 걸려 있고, 아는 상태이고, 지금과 다를 때만 */
function qvStGap(r){
  if(!r._id||!items[r._id]||!r.status) return false;
  if(STATUSES.map(function(x){return x[0];}).indexOf(r.status)<0) return false;
  return r.status!==(items[r._id].status||'진행중');
}
/* 화면에 쳐 둔 것을 VO.list 로 걷는다. 다시 그리기 전에 반드시 먼저 부른다. */
function qvHarvest(){
  (VO.list||[]).forEach(function(r,i){
    var d=$('qv-done-'+i), t=$('qv-next-'+i), dt=$('qv-date-'+i), st=$('qv-st-'+i);
    if(d) r.done=d.value.trim();
    if(t||dt) r.next={text:t?t.value.trim():((r.next&&r.next.text)||''),
                      date:dt?dt.value:((r.next&&r.next.date)||'')};
    if(st) r.stOn=!!st.checked;
  });
}
function qvPick(i,id){
  qvHarvest();
  if(VO.list&&VO.list[i]){ VO.list[i]._id=id||''; if(!id) VO.list[i].stOn=false; }
  qvPaint();
}
/* 소리를 판독 서버로 보내 «업무 번호»로 갈라 받는다. */
function qvTidy(){
  if(!VO.blob||VO.busy) return;
  if(!window.PuAiCall){ VO.err='판독 호출기를 싣지 못했습니다'; qvPaint(); return; }
  var pool=myOpen().slice(0,80);            // 물어보는 «그 순간»의 목록을 붙든다
  if(!pool.length){ VO.err='내 업무가 없습니다 — 먼저 업무를 등록해 주세요'; qvPaint(); return; }
  VO.busy=true; VO.err=''; qvPaint();
  var lines=pool.map(function(p,i){
    return (i+1)+'. '+(p.company||p.client||'')+(itemName(p)?' — '+itemName(p):''); }).join('\n');
  var sts=STATUSES.map(function(x){ return x[0]; }).join('|');
  var ask='여러 업무를 이어서 말로 녹음한 것이다. 업무별로 갈라 **JSON 하나만** 답하라. 다른 말은 붙이지 마라.\n'
    +'{"list":[{"n":목록번호,"who":"들린 이름","done":"그 업무에서 한 일","next":{"text":"다음 할 일","date":"YYYY-MM-DD"},"status":"'+sts+' 중 하나"}]}\n'
    +'아래가 내가 맡은 업무 목록이다. 말한 것이 여기 있으면 **그 번호를 n 에 적어라**.\n'
    +'목록에 없으면 n 을 0 으로 두고 who 에 들린 이름을 적어라.\n'+lines+'\n'
    +'오늘은 '+todayStr()+' 이다. 「다음 주 목요일」처럼 말한 것은 날짜로 바꿔라.\n'
    +'말에 없는 것은 지어내지 말고 빈 문자열로 두어라. 상태는 말에서 분명히 바뀐 때만 적어라.\n'
    +'한 곳만 말했으면 list 에 하나만 담아라. 회사 이름은 done 에 넣지 말고 한 일만 적어라.';
  voB64(VO.blob).then(function(b64){
    return PuAiCall.ask(
      [{inline_data:{mime_type:(VO.blob.type||'audio/webm').split(';')[0],data:b64}},{text:ask}],
      {auth:(typeof firebase!=='undefined'&&firebase.auth)?firebase.auth():null,
       fetch:(typeof aiFetch==='function'?aiFetch:null),
       generationConfig:{maxOutputTokens:3000}});
  }).then(function(d){
    var r=aiJson(PuAiCall.textOf?PuAiCall.textOf(d):'');
    var arr=(r&&r.list)||[];
    if(!Array.isArray(arr)) arr=[];
    VO.list=arr.map(function(x){
      var k=Number(x&&x.n)||0;
      var hit=(k>=1&&k<=pool.length)?pool[k-1]:null;
      var st=String((x&&x.status)||'').trim();
      var row={_id:hit?hit._id:'', who:String((x&&x.who)||'').trim(),
        done:String((x&&x.done)||'').trim(),
        next:{text:String((x&&x.next&&x.next.text)||'').trim(),
              date:String((x&&x.next&&x.next.date)||'').trim()},
        status:st, stOn:false};
      row.stOn=qvStGap(row);            // 물어볼 만한 줄이면 켜 두고 보여준다
      return row;
    }).filter(function(x){ return x.done||x.next.text||x._id; });
    // 소리는 여기서 버린다 — 가르기가 끝나면 남길 까닭이 없다
    if(VO.url){ try{ URL.revokeObjectURL(VO.url); }catch(e){} VO.url=''; }
    VO.blob=null; VO.busy=false;
    if(!VO.list.length){ VO.list=null; VO.err='갈라낼 내용을 못 찾았습니다 — 다시 말해 주세요'; }
    qvPaint();
  }).catch(function(e){
    VO.busy=false; VO.err=(e&&e.message)||'가르지 못했습니다'; qvPaint();
  });
}
/* 사람이 고친 값을 저장한다. 업무를 못 고른 줄은 «건너뛴다». */
function qvSave(){
  if(VO.busy) return;
  qvHarvest();
  var rows=(VO.list||[]).filter(function(r){ return r._id&&items[r._id]&&r.done; });
  if(!rows.length){ toast('업무를 고르고 한 일을 적어 주세요','warn'); return; }
  var skip=(VO.list||[]).length-rows.length;
  VO.busy=true; qvPaint();
  Promise.all(rows.map(function(r){
    return addLog(r._id,r.done,todayStr(),'vo').then(function(ok){
      if(!ok) return false;
      var f={};
      if(r.next.text||r.next.date) f.next={text:r.next.text,date:r.next.date};
      if(r.stOn&&r.status&&STATUSES.map(function(x){return x[0];}).indexOf(r.status)>=0) f.status=r.status;
      if(!Object.keys(f).length) return true;
      return patchItem(r._id,f);
    });
  })).then(function(res){
    var done=res.filter(Boolean).length, bad=res.length-done;
    if(bad){ VO.busy=false; VO.err=done+'건 저장, '+bad+'건 실패 — 실패한 줄은 그대로 남겨 두었습니다'; qvPaint(); route(); return; }
    voReset(); qvPaint();
    toast('🎤 '+done+'건 저장됨'+(skip?' · '+skip+'건은 건너뜀':''));
    route();
  }).catch(function(e){
    VO.busy=false; VO.err='저장 실패: '+((e&&e.message)||''); qvPaint();
  });
}

/* ── 인수인계 화면 (부재 관리·체크아웃·문서철) ── */
/* ══════ 🚩 내 현장 방문 (대표 지시 2026-08-30) ══════
   「언제 사진 등록했는지 본인 업무관리에서 확인할 수 있게.」

   ⚠ 자료를 «새로 만들지 않는다». 컨설팅일정이 이미 갖고 있는 것을 읽기만 한다 —
     일정(scal_scheds)과 사진 이력(scal_photoLog). 여기에 사본을 두면 두 곳이
     어긋나고, 어긋나면 어느 쪽이 맞는지 아무도 모른다.
   ⚠ 사진 «그림»은 안 가져온다. 「몇 장·언제」만 센다. 그림까지 끌면 느리고
     창고 요금이 붙는다(요금은 «받은 양»에 붙는다).
   ⚠ 본인 것만 본다. 열람 대상을 바꾸면(총괄) 그 사람 것을 본다 — 업무관리의
     다른 화면과 같은 규칙이다.
   ⚠ 사람 맞추기는 «사번 먼저, 없으면 이름». 옛 사진 이력에는 사번이 없다
     (2026-08-30 부터 남긴다). 이름만으로도 맞도록 두 길을 다 둔다. */

var VIS = {
  ym: '', scheds: null, log: null, staff: null,
  mode: 'month',    // month | late  — 이 달 / 밀린 것 모두
  scope: 'me',      // me | all      — 나만 / 전 직원(관리자)
  pick: ''          // 전 직원에서 «한 사람»을 펼쳐 볼 때 그 사람 번호
};

function visYm() {
  if (VIS.ym) return VIS.ym;
  var d = new Date();
  VIS.ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  return VIS.ym;
}
function visShift(delta) {
  var a = visYm().split('-'), d = new Date(+a[0], +a[1] - 1 + delta, 1);
  VIS.ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  renderVisits();
}
/* 사진 이력을 몇 줄까지 붙들 것인가 — 한 해에 1,500줄 안팎이라 두 해치다.
   ⚠ 숫자를 늘리면 내려받는 양이 그만큼 는다. 줄이면 옛 방문이 「기록 없음」으로
     되돌아간다 — 「기록이 닿는 데까지만 말한다」는 규칙 그대로다. */
var LOG_KEEP = 3000;

function visToday() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')
    + '-' + String(d.getDate()).padStart(2, '0');
}
function visSetMode(m) { VIS.mode = (m === 'late') ? 'late' : 'month'; renderVisits(); }
function visSetScope(s) { VIS.scope = (s === 'all') ? 'all' : 'me'; VIS.pick = ''; renderVisits(); }
function visSetPick(gid) { VIS.pick = gid || ''; renderVisits(); }

/* 「전 직원」은 관리자만. 대표(직함)이거나, 서버가 아는 총괄·대행이면 보인다.
   ⚠ 서버 값이 아직 안 왔으면 «안 보이는 쪽»으로 틀린다 — 권한은 막는 쪽이 옳다. */
/* 전 직원 현장 방문을 볼 수 있는 사람 = «대표만».
   ★ 2026-09-05 — 여기에 재무 권한(S.perfFin)이 함께 들어 있었다. 그래서 사무장이
     「내 현장 방문」에 들어갔는데 「박한별 님 현장 방문」이 떴다(대표 보고).
     재무는 «돈을 보는» 권한이지 남의 현장 일정을 보는 권한이 아니다 — 떼어 낸다.
   ⚠ 대표가 전 직원을 보는 길은 그대로 둔다. 없애자는 것이 아니라 «누가» 를 좁힌 것이다. */
function visAdmin() {
  try { return typeof isAdmin === 'function' && isAdmin(); } catch (e) { return false; }
}

/* 줄을 누르면 정부사업일정의 그 일정이 열린다 (대표 지시 2026-08-30 ④).
   ⚠ 여기서 «고치지 않는다» — 업무관리는 읽기만 하고, 사진은 원래 자리에서 넣는다.
     같은 일을 두 곳에서 할 수 있으면 언젠가 한쪽이 어긋난다.
   ⚠ 새 창으로 연다 — 보던 업무 목록을 잃지 않게. */
function visGo(sid) {
  if (!sid) return;
  try { window.open('gov-consulting.html#sc=' + encodeURIComponent(sid), '_blank'); }
  catch (e) { location.href = 'gov-consulting.html#sc=' + encodeURIComponent(sid); }
}

/* 컨설팅일정 자료 — 한 번 읽고 캐시한다(달을 넘겨도 다시 안 읽는다). */
function visLoad() {
  if (VIS.scheds && VIS.log) return Promise.resolve();
  function one(node, fallback, keep) {
    /* keep 이 있으면 «마지막 몇 줄»만 — 사진 이력은 지우는 곳이 없어 해마다 쌓인다.
       통째로 읽으면 화면을 열 때마다 내려받는 양이 끝없이 늘어난다. */
    var r = fbDb.ref(node);
    if (keep) { try { r = r.limitToLast(keep); } catch (e) { } }
    return r.once('value')
      .then(function (s) { return s.val() || fallback; })
      .catch(function () { return null; });   // 권한이 없거나 못 읽음 — null 로 구분한다
  }
  /* 관리자인지도 함께 물어 둔다 — 나중에 물으면 단추가 «뒤늦게» 나타난다 */
  var amAdmin = (typeof pcAmFin === 'function')
    ? pcAmFin().catch(function () { return false; }) : Promise.resolve(false);
  return Promise.all([
    one('scal_scheds', {}), one('scal_cos', {}), one('scal_types', {}),
    one('scal_staff', {}), one('scal_photoLog', {}, LOG_KEEP), amAdmin
  ]).then(function (r) {
    VIS.scheds = r[0]; VIS.cos = r[1]; VIS.types = r[2]; VIS.gstaff = r[3]; VIS.log = r[4];
  });
}

/* 컨설팅일정은 목록을 «배열 그대로» 담기도 하고 번호를 붙여 담기도 한다.
   둘 다 배열로 편다 — 한쪽만 다루면 어느 날 갑자기 빈 화면이 된다. */
function visRows(v) {
  if (!v) return [];
  if (Array.isArray(v)) return v.filter(Boolean);
  return Object.keys(v).map(function (k) { return v[k]; }).filter(Boolean);
}
function visName(list, id) {
  var hit = visRows(list).filter(function (x) { return x && x.id === id; })[0];
  return hit ? (hit.name || '') : '';
}

/* 이 사진 이력이 «이 사람» 것인가 — 사번 먼저, 없으면 이름 */
function visMine(e, me) {
  if (!e) return false;
  if (e.whoSid && me.sid) return String(e.whoSid) === String(me.sid);
  return String(e.who || '') === String(me.name || '');
}

/* 컨설팅일정 쪽 직원 번호 — 이 사람의 사번·이름에 맞는 것 */
function visGovStaffId(me) {
  var hit = visRows(VIS.gstaff).filter(function (s) {
    return (s.erpSid && me.sid && String(s.erpSid) === String(me.sid)) || s.name === me.name;
  })[0];
  return hit ? hit.id : '';
}

/* ══════════════════════════════════════════════════════════════════
   「어디에 · 누구와 같이」 (대표 지시 2026-09-05)
   ══════════════════════════════════════════════════════════════════
   현장 방문 표에는 날짜·사업장·회차·사진만 있었다. 정작 «어디로 가는지»(주소)와
   «누구와 같이 가는지»는 안 보였다 — 그런데 그 둘 다 정부사업일정 자료에 이미 있다.
     s.attId            … 그 일정의 주담당
     s.coAttIds/defCoAtts … 그 일정에 함께 가는 사람
     co.coAttIds/defCoAtts … 그 사업장의 기본 동행
     co.addr/주소 칸      … 사업장 주소 (있을 때만)
   visForGid() 가 이미 그 셋을 보고 「내 일정인가」를 가린다 — 같은 자료로 이름을 뽑는다. */
function visCoOf(s) {
  if (!s) return null;
  return visRows(VIS.cos).filter(function (c) { return c && c.id === s.coId; })[0] || null;
}
/* 그 방문에 함께 가는 사람들의 «정부사업일정 직원번호» — 주담당을 맨 앞에 둔다 */
function visAttIds(s) {
  if (!s) return [];
  var co = visCoOf(s);
  var raw = [].concat(s.attId ? [s.attId] : [],
    s.coAttIds || s.defCoAtts || [],
    (co && (co.coAttIds || co.defCoAtts)) || []);
  /* ⚠ 배열에 덧붙이는 함수를 쓰지 않는다 — 이 화면이 «자료를 쓰지 않는지» 보는 검사가
     그 이름을 파이어베이스 쓰기로 읽는다. 거르기로 같은 일을 한다. */
  var seen = {};
  return raw.map(function (g) { return String(g || ''); })
    .filter(function (g) { if (!g || seen[g]) return false; seen[g] = 1; return true; });
}
/* 같이 가는 사람 이름 — «나는 뺀다». 내 이름을 나에게 알려 줄 까닭이 없다.
   ⚠ 이름을 못 찾은 번호는 버린다. 번호를 그대로 보여 주면 아무도 못 읽는다. */
function visWithNames(s, gid) {
  return visAttIds(s).filter(function (g) { return g !== gid; })
    .map(function (g) { return visName(VIS.gstaff, g); })
    .filter(Boolean);
}
/* 어디로 가는지 — 사업장 이름 옆에 붙일 주소. 없으면 빈 문자열(지어내지 않는다). */
function visWhere(s) {
  var co = visCoOf(s); if (!co) return '';
  var a = co.addr || co.address || co.주소 || co.loc || co.place || '';
  return String(a || '').trim();
}
/* 표 한 칸 — 사업장 · (주소) · 같이 가는 사람 */
function visWhereCell(s, gid) {
  var co = esc(visName(VIS.cos, s.coId) || '-');
  var addr = visWhere(s);
  var withs = visWithNames(s, gid);
  return '<b>' + co + '</b>'
    + (addr ? '<div class="vis-sub">📍 ' + esc(addr) + '</div>' : '')
    + (withs.length ? '<div class="vis-sub">👥 ' + esc(withs.join(' · ')) + ' 와 함께</div>' : '');
}
/* 이 일정이 «이 사람» 담당인가 — 주담당이거나 협업이거나 */
function visForGid(s, gid) {
  if (!s || !gid) return false;
  if (s.attId === gid) return true;
  var co = visRows(VIS.cos).filter(function (c) { return c && c.id === s.coId; })[0];
  var subs = [].concat(s.coAttIds || s.defCoAtts || [], (co && (co.coAttIds || co.defCoAtts)) || []);
  return subs.indexOf(gid) >= 0;
}

/* 끝난 컨설팅인가 — 밀린 목록에 담지 않는다.
   이미 제출이 끝난 건을 매일 보여 주면 목록 자체를 안 보게 된다. */
function visEnded(s) {
  var co = visRows(VIS.cos).filter(function (c) { return c && c.id === s.coId; })[0];
  if (!co) return false;
  if (co.active === false || co.deleted) return true;
  return !!(co.endedTypes && co.endedTypes[s.typeId]);
}

/* 사진 이력을 일정별로 모은다 — 「몇 장·언제·누가」
   ★ «내가 넣은 것»만 세지 않는다(2026-08-30 고침). 부담당이나 관리자가 대신
     넣어 주면 내 화면에만 「없음」으로 떠, 넣은 증빙을 안 넣은 것처럼 보였다.
     「내가 언제 넣었나」와 「이 방문에 증빙이 있나」는 «다른 물음»이다 —
     세는 것은 뒤엣것이고, 앞엣것은 「누가 넣었나」로 따로 적는다. */
function visPhotoMap(me) {
  var byS = {};
  visRows(VIS.log).forEach(function (e) {
    if (!e || !e.sid) return;
    if (e.action === 'delete') return;                  // 지운 것은 「넣은 적」으로 안 센다
    var b = byS[e.sid] || (byS[e.sid] = { n: 0, first: '', last: '', slots: {}, mine: false, who: '' });
    var isMine = visMine(e, me);
    if (isMine) b.mine = true; else if (!b.who) b.who = String(e.who || '');
    if (e.slot != null && b.slots[e.slot]) return;      // 같은 칸을 여러 번 바꿔도 한 장
    if (e.slot != null) b.slots[e.slot] = 1;
    b.n++;
    if (!b.first || e.t < b.first) b.first = e.t;
    if (!b.last || e.t > b.last) b.last = e.t;
  });
  return byS;
}

/* ★ 공용 기록이 «언제부터» 있는지 — 그 전 방문은 「없음」이 아니라 「기록 없음」.
   사진 이력을 공용 자리에 올리기 시작한 것은 2026-08-30 부터다. 그 전 것은
   각자 PC 안에만 있어, 여기서는 넣었는지 «알 수가 없다». 빨간 「없음」으로
   보이면 넣은 증빙을 안 넣은 것으로 읽게 된다 — 그것이 더 나쁘다.
   ⚠ 날짜를 박지 않는다. 직원이 옛 기록을 올리면 이 선이 «저절로» 뒤로 간다. */
function visSince() {
  var s = '';
  visRows(VIS.log).forEach(function (e) { if (e && e.t && (!s || e.t < s)) s = e.t; });
  return String(s).slice(0, 10);
}
function visDaysAgo(ds) {
  return Math.round((new Date(visToday()) - new Date(ds)) / 86400000);
}

/* 밀린 것 — 증빙이 빠진 «지난» 현장 방문을 오래된 순으로 (대표 지시 ⑥).
   달을 넘겨 가며 찾을 일이 없어진다. */
function visLateRows(gid, byS, sinceDay, wantUnknown) {
  var today = visToday();
  return visRows(VIS.scheds).filter(function (s) {
    if (!s || !s.date || s.isField === false) return false;
    if (s.date >= today) return false;                    // 오늘·미래는 아직 밀린 게 아니다
    if (!visForGid(s, gid)) return false;
    if (visEnded(s)) return false;
    var b = byS[s.id];
    if (b && b.n) return false;
    /* 「기록 없음」은 «안 넣은 것»이 아니라 «알 수 없는 것» — 따로 담는다.
       빨간 것과 섞으면 진짜 빠진 것이 묻힌다. */
    var unknown = !sinceDay || String(s.date) < sinceDay;
    return wantUnknown ? unknown : !unknown;
  }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
}

/* 전 직원 — 사람마다 한 줄. 처음부터 스무 줄을 늘어놓으면 누가 밀렸는지가 안 보인다.
   ⚠ 일 잘한다/못한다를 재는 표가 아니다. 「증빙이 빠진 곳」을 마감 전에 찾는 것이
     전부라, 방문 «건수»가 아니라 «밀린 날수»로 세운다.
   ⚠ 새로 읽어 오는 자료가 없다 — 이미 읽은 것을 사람별로 묶기만 한다(요금 그대로). */
function visStaffSummary(byS, sinceDay, ym) {
  return visRows(VIS.gstaff).map(function (g) {
    var nF = 0, nW = 0, nN = 0, nU = 0;
    visRows(VIS.scheds).forEach(function (s) {
      if (!s || !s.date || String(s.date).slice(0, 7) !== ym) return;
      if (!visForGid(s, g.id)) return;
      if (s.isField === false) return;
      nF++;
      var b = byS[s.id];
      if (b && b.n) nW++;
      else if (!sinceDay || String(s.date) < sinceDay) nU++;
      else nN++;
    });
    var late = visLateRows(g.id, byS, sinceDay, false);
    return { g: g, nF: nF, nW: nW, nN: nN, nU: nU, late: late[0] || null, lateN: late.length };
  }).filter(function (r) { return r.nF || r.lateN; })
    .sort(function (a, b) {
      var da = a.late ? visDaysAgo(a.late.date) : -1;
      var db = b.late ? visDaysAgo(b.late.date) : -1;
      return db - da;
    });
}

function renderVisits() {
  var app = $('app'); if (!app) return;
  app.innerHTML = loadingHTML();
  var me = viewer();                       // 보고 있는 사람(기본은 본인)

  /* ⚠ «끝났다»를 돌려준다. 안 돌려주면 부르는 쪽도 검사도 언제 끝나는지 알 수 없다. */
  return visLoad().then(function () {
    /* 컨설팅일정을 못 읽는 경우 — 조용히 빈 화면을 보이지 않는다 */
    if (VIS.scheds === null) {
      app.innerHTML = '<div class="panel"><h2>🚩 내 현장 방문</h2>'
        + '<p class="muted">컨설팅일정 자료를 읽지 못했습니다. 정부사업일정을 한 번 열어 로그인한 뒤 다시 와 주세요.</p></div>';
      return;
    }
    var ym = visYm();
    var admin = visAdmin();
    if (!admin) { VIS.scope = 'me'; VIS.pick = ''; }     // 권한 없이 전 직원으로 갈 수 없다
    var sinceDay = visSince();
    var myGid = visGovStaffId(me);
    /* 전 직원에서 한 사람을 펼쳐 보는 중이면 «그 사람 눈으로» 본다 —
       ⚠ 「누가 넣었나」까지 그 사람 기준으로 봐야 한다. 안 그러면 박재원 님 화면에
         「박재원 넣음」이 붙는다(본인이 넣은 것인데 남이 넣은 것처럼 읽힌다). */
    var pick = (VIS.scope === 'all' && VIS.pick)
      ? visRows(VIS.gstaff).filter(function (s) { return s && s.id === VIS.pick; })[0] : null;
    var eye = pick ? { sid: pick.erpSid || '', name: pick.name || '' } : me;
    var byS = visPhotoMap(eye);
    var gid = pick ? pick.id : myGid;
    var gName = pick ? (pick.name || '') : '';

    var title = (VIS.scope === 'all' && !VIS.pick) ? '현장 방문 — 전 직원'
      : gName ? esc(gName) + ' 님 현장 방문'
        : '내 현장 방문';

    var h = '<div class="panel"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">'
      + '<h2 style="margin:0">🚩 ' + title + '</h2>';
    if (VIS.mode === 'month') {
      h += '<span class="muted">' + ym.replace('-', '년 ') + '월</span>'
        + '<button class="ghost" onclick="visShift(-1)">◀</button>'
        + '<button class="ghost" onclick="visShift(1)">▶</button>';
    } else {
      h += '<span class="muted">밀린 것 모두</span>';
    }
    h += '<span style="flex:1"></span>'
      + visSeg([['이 달', VIS.mode === 'month', "visSetMode('month')"],
      ['밀린 것 모두', VIS.mode === 'late', "visSetMode('late')"]]);
    if (admin) {
      h += ' ' + visSeg([['나만', VIS.scope === 'me', "visSetScope('me')"],
      ['전 직원', VIS.scope === 'all', "visSetScope('all')"]]);
    }
    h += '</div>';
    if (VIS.pick) {
      h += '<div style="margin-bottom:9px"><button class="ghost" onclick="visSetPick(\'\')">← 전 직원으로</button></div>';
    }

    /* ── 전 직원 요약 ─────────────────────────────────────────── */
    if (VIS.scope === 'all' && !VIS.pick) {
      var sum = visStaffSummary(byS, sinceDay, ym);
      if (!sum.length) { app.innerHTML = h + '<p class="muted">이 달에 배정된 일정이 없습니다.</p></div>'; return; }
      var tF = 0, tW = 0, tN = 0, tU = 0;
      sum.forEach(function (r) { tF += r.nF; tW += r.nW; tN += r.nN; tU += r.nU; });
      h += '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px;font-size:12px">'
        + visPill('방문 ' + tF + '건', '#eff6ff', '#1e40af')
        + visPill('사진 넣음 ' + tW + '건', '#f8fafc', '#166534')
        + (tN ? visPill('사진 없음 ' + tN + '건', '#fef2f2', '#991b1b') : '')
        + (tU ? visPill('기록 없음 ' + tU + '건', '#e2e8f0', '#475569') : '')
        + '</div>';
      h += '<div class="vis-wrap"><table><tr><th>담당</th><th>방문</th><th>사진 넣음</th><th>사진 없음</th>'
        + '<th>가장 오래 밀린 것</th></tr>';
      sum.forEach(function (r) {
        var d = r.late ? visDaysAgo(r.late.date) : 0;
        h += '<tr style="cursor:pointer" onclick="visSetPick(\'' + esc(r.g.id) + '\')">'
          + '<td><b>' + esc(r.g.name || '?') + '</b></td>'
          + '<td>' + r.nF + '건</td><td>' + r.nW + '건</td>'
          + '<td>' + (r.nN ? visPill(r.nN + '건', '#fef2f2', '#991b1b') : '<span class="muted">0건</span>') + '</td>'
          + '<td>' + (r.late
            ? '<span style="color:' + (d >= 30 ? '#991b1b' : d >= 7 ? '#854d0e' : 'inherit') + ';'
            + (d >= 30 ? 'font-weight:800' : '') + '">'
            + esc(visName(VIS.cos, r.late.coId) || '-') + ' · ' + d + '일</span>'
            + (r.lateN > 1 ? ' <span class="muted">외 ' + (r.lateN - 1) + '건</span>' : '')
            : '<span class="muted">—</span>') + '</td></tr>';
      });
      h += '</table></div><p class="note muted" style="margin-top:9px;font-size:11.5px;line-height:1.7">'
        + '줄을 누르면 그 사람의 목록이 열립니다.<br>'
        + '<b>일을 잘하나 재는 표가 아닙니다</b> — 증빙이 빠진 곳을 마감 전에 찾는 것이 전부라, '
        + '방문 건수가 아니라 <b>밀린 날수</b>로 줄을 세웁니다.</p></div>';
      app.innerHTML = h; return;
    }

    if (!gid) {
      h += '<p class="muted">정부사업일정의 직원 목록에서 «사번»이 이어져 있지 않습니다. '
        + '정부사업일정 → 환경설정 → 직원 관리에서 이어 주세요.</p></div>';
      app.innerHTML = h; return;
    }

    /* ── 밀린 것 모두 ─────────────────────────────────────────── */
    if (VIS.mode === 'late') {
      var late = visLateRows(gid, byS, sinceDay, false);
      var unk = visLateRows(gid, byS, sinceDay, true);
      h += '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px;font-size:12px">'
        + (late.length ? visPill('사진 없음 ' + late.length + '건', '#fef2f2', '#991b1b') : '')
        + (unk.length ? visPill('기록 없음 ' + unk.length + '건', '#e2e8f0', '#475569') : '')
        + (!late.length && !unk.length ? visPill('밀린 것 없음', '#f8fafc', '#166534') : '')
        + '</div>';
      if (!late.length && !unk.length) {
        h += '<p class="muted">증빙이 빠진 지난 방문이 없습니다. 👍</p></div>';
        app.innerHTML = h; return;
      }
      if (late.length) h += visLateTable(late, false, gid);
      if (unk.length) {
        h += '<div class="muted" style="margin:16px 0 6px;font-size:12px;font-weight:800">🕘 기록 없음 — 넣었는지 알 수 없는 것</div>'
          + visLateTable(unk, true, gid);
      }
      h += '<p class="note muted" style="margin-top:9px;font-size:11.5px;line-height:1.7">'
        + '증빙이 빠진 <b>지난</b> 현장 방문만 오래된 순으로 모았습니다. 끝난 컨설팅은 담지 않습니다.<br>'
        + '줄을 누르면 정부사업일정의 그 일정이 열립니다 — 사진은 거기서 넣습니다.</p></div>';
      app.innerHTML = h; return;
    }

    /* ── 이 달 ────────────────────────────────────────────────── */
    var mine = visRows(VIS.scheds).filter(function (s) {
      if (!s || !s.date || String(s.date).slice(0, 7) !== ym) return false;
      return visForGid(s, gid);
    }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });

    var nField = 0, nOffice = 0, nWith = 0, nWithout = 0, nUnknown = 0;
    var rows = mine.map(function (s) {
      var b = byS[s.id];
      var isField = s.isField !== false;
      /* 기록이 아직 안 올라온 시절의 방문인가 — 선이 없으면(기록 0건) 전부 모른다 */
      var unknown = isField && !(b && b.n) && (!sinceDay || String(s.date) < sinceDay);
      if (isField) nField++; else nOffice++;
      if (isField) { if (b && b.n) nWith++; else if (unknown) nUnknown++; else nWithout++; }
      return { s: s, b: b, isField: isField, unknown: unknown };
    });

    h += '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px;font-size:12px">'
      + visPill('방문 ' + nField + '건', '#eff6ff', '#1e40af')
      + visPill('사진 넣음 ' + nWith + '건', '#f8fafc', '#166534')
      + (nWithout ? visPill('사진 없음 ' + nWithout + '건', '#fef2f2', '#991b1b') : '')
      + (nUnknown ? visPill('기록 없음 ' + nUnknown + '건', '#e2e8f0', '#475569') : '')
      + (nOffice ? visPill('사무실 ' + nOffice + '건', '#fffbeb', '#854d0e') : '')
      + '</div>';

    if (!rows.length) {
      h += '<p class="muted">이 달에 배정된 일정이 없습니다.</p></div>';
      app.innerHTML = h; return;
    }

    h += '<div class="vis-wrap"><table><tr><th>방문일</th><th>어디에 · 누구와</th><th>컨설팅 · 회차</th>'
      + '<th>구분</th><th>사진</th><th>사진 넣은 때</th></tr>';
    rows.forEach(function (r) {
      var s = r.s;
      var ty = visName(VIS.types, s.typeId) || '-';
      var late = '';
      var when = '<span class="muted">—</span>';
      if (r.b && r.b.last) {
        var d0 = new Date(s.date + 'T00:00:00'), d1 = new Date(r.b.last);
        var gap = Math.floor((d1 - d0) / 86400000);
        /* 미룬 날수를 적는다 — 증빙을 미뤄 두면 잊는다 */
        if (gap >= 1) late = ' <span class="muted">· ' + gap + '일 뒤</span>';
        when = visWhen(r.b.last) + late;
      }
      var noPhoto = r.isField && !(r.b && r.b.n) && !r.unknown;
      h += '<tr style="cursor:pointer"' + (noPhoto ? ' class="vis-no"' : '')
        + ' onclick="visGo(\'' + esc(s.id) + '\')">'
        + '<td>' + esc(visDay(s.date)) + '</td>'
        + '<td>' + visWhereCell(s, gid) + '</td>'
        + '<td>' + esc(ty) + ' ' + (s.round || 0) + '회</td>'
        + '<td>' + (r.isField ? visPill('현장', '#eff6ff', '#1e40af') : visPill('사무실', '#fffbeb', '#854d0e')) + '</td>'
        + '<td>' + (!r.isField ? '<span class="muted">필요 없음</span>'
          : r.b && r.b.n
            ? visPill(r.b.n + '장', '#f8fafc', '#166534')
            + (r.b.mine ? '' : '<span class="muted" style="font-size:11px"> · ' + esc(r.b.who || '다른 사람') + ' 넣음</span>')
            : r.unknown ? visPill('기록 없음', '#e2e8f0', '#475569')
              : visPill('없음', '#fef2f2', '#991b1b')) + '</td>'
        + '<td>' + when + '</td></tr>';
    });
    h += '</table></div>';
    h += '<p class="muted" style="margin-top:9px;font-size:11.5px;line-height:1.7">'
      + '정부사업일정에 담긴 것을 그대로 읽어 보여 줍니다 — <b>줄을 누르면 그 일정이 열립니다</b>(사진은 거기서 넣습니다).<br>'
      + '「사진 넣은 때」가 방문일보다 늦으면 며칠 뒤인지 함께 적습니다.'
      /* ⚠ 「기록 없음」 설명은 «그런 줄이 있을 때만» 적는다. 없는데 적어 두면
         읽는 사람이 없는 문제를 찾게 된다. */
      + (nUnknown ? '<br><b>기록 없음</b>은 «안 넣었다»가 아닙니다 — 사진 이력을 함께 보기 시작한 '
        + (sinceDay ? esc(sinceDay.replace(/-/g, '.')) : '그때') + ' 전 방문이라 여기서는 알 수 없습니다. '
        + '정부사업일정 → 환경설정 → 백업의 「이 PC 것 공용으로 올리기」를 누르면 그 전 것도 보입니다.' : '')
      + '</p></div>';
    app.innerHTML = h;
    visBadge();                     // 다 그린 뒤 옆줄 숫자도 맞춘다
  }).catch(function (e) {
    app.innerHTML = '<div class="panel"><h2>🚩 내 현장 방문</h2><p class="muted">불러오지 못했습니다: '
      + esc((e && e.message) || e) + '</p></div>';
  });
}

/* 옆줄 「내 현장 방문」 옆 숫자 — «밀린 건수»다.
   ⚠ 여기서 자료를 «읽지 않는다»(대표 결정 2026-08-30 ㉯). 이미 손에 든 것이 있을 때만
     센다 — 숫자 하나 때문에 로그인마다 컨설팅일정을 통째로 내려받지 않는다.
     그래서 그 화면을 «한 번 연 뒤»부터 붙는다. 아직 안 열었으면 빈칸이다.
   ⚠ 「기록 없음」은 안 센다 — 안 넣은 것이 아니라 알 수 없는 것이라,
     빨간 숫자로 띄우면 없는 일로 사람을 부른다. */
function visBadge(){
  var el = $('cnt-visits'); if(!el) return;
  if(!VIS.scheds || !VIS.log){ el.textContent=''; return; }   // 아직 안 읽었다 — 읽으러 가지 않는다
  var gid = visGovStaffId(viewer());
  if(!gid){ el.textContent=''; return; }
  var n = visLateRows(gid, visPhotoMap(viewer()), visSince(), false).length;
  el.textContent = n || '';
  el.style.background = n ? '#fef2f2' : '';
  el.style.color = n ? '#991b1b' : '';
  el.title = n ? ('증빙 사진이 빠진 지난 방문 ' + n + '건') : '';
}

/* 밀린 목록 한 벌 — 「사진 없음」과 「기록 없음」이 같은 모양을 쓴다 */
function visLateTable(list, unknown, gid) {
  var h = '<div class="vis-wrap"><table><tr><th>방문일</th><th>어디에 · 누구와</th><th>컨설팅 · 회차</th>'
    + '<th>얼마나</th><th>사진</th></tr>';
  list.forEach(function (s) {
    var d = visDaysAgo(s.date);
    h += '<tr style="cursor:pointer"' + (unknown ? '' : ' class="vis-no"')
      + ' onclick="visGo(\'' + esc(s.id) + '\')">'
      + '<td>' + esc(visDay(s.date)) + '</td>'
      + '<td>' + visWhereCell(s, gid) + '</td>'
      + '<td>' + esc(visName(VIS.types, s.typeId) || '-') + ' ' + (s.round || 0) + '회</td>'
      + '<td>' + (unknown ? '<span class="muted">' + d + '일 지남</span>'
        : '<b style="color:' + (d >= 30 ? '#991b1b' : '#854d0e') + '">' + d + '일 지남</b>') + '</td>'

  return h + '</table></div>';
}

/* 두 갈래 단추 한 벌 */
function visSeg(opts) {
  return '<span style="display:inline-flex;border:1.5px solid var(--border,#e2e8f0);border-radius:8px;overflow:hidden">'
    + opts.map(function (o) {
      return '<button onclick="' + o[2] + '" style="border:0;padding:5px 12px;font:inherit;font-size:11.5px;'
        + 'font-weight:800;cursor:pointer;'
        + (o[1] ? 'background:var(--accent,#2563eb);color:#fff' : 'background:transparent;color:var(--t2,#64748b)') + '">'
        + esc(o[0]) + '</button>';
    }).join('') + '</span>';
}

function visPill(txt, bg, fg) {
  return '<span style="display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;'
    + 'padding:1px 8px;background:' + bg + ';color:' + fg + '">' + esc(txt) + '</span>';
}
function visDay(ds) {
  var a = String(ds || '').split('-'); if (a.length < 3) return ds || '';
  var w = ['일', '월', '화', '수', '목', '금', '토'][new Date(ds + 'T00:00:00').getDay()];
  return (+a[1]) + '/' + (+a[2]) + ' (' + w + ')';
}
function visWhen(iso) {
  var d = new Date(iso); if (isNaN(d)) return esc(String(iso).slice(0, 16));
  return (d.getMonth() + 1) + '/' + d.getDate() + ' '
    + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
