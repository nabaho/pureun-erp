function allItems(){ return Object.keys(items).map(function(k){var it=items[k];it._id=k;return it;}); }

function isOf(it,who){ if(!who) return false;
  var m=it.mgr_main||{}; if(who.sid&&m.sid===who.sid) return true; if(who.name&&m.name===who.name) return true;
  return (it.mgr_subs||[]).some(function(s){return (who.sid&&s.sid===who.sid)||(who.name&&s.name===who.name);});
}
function isMine(it){ return isOf(it,S.me); }              // 로그인한 본인

function roleOf(it,who){
  if(!who) return '';
  var m=it.mgr_main||{};
  if((who.sid&&m.sid===who.sid)||(who.name&&m.name===who.name)) return 'main';

/* ── 담당 표시 ────────────────────────────────────────────────────
   주담당만 보이면 "누가 같이 하고 있는지"를 알 수 없어 부담당이 하는 일이
   묻힌다. 모든 목록에 주·부를 함께 세운다.
   mode: 'all' 주·부 모두 / 'sub' 부담당만 / 'other' 보고 있는 사람만 빼고 */
function mgrSubNames(it){
  return ((it&&it.mgr_subs)||[]).map(function(s){ return s&&s.name; }).filter(Boolean);
}
function mgrAll(it){                                  // 주 + 부 (중복 없이)
  var a=[(it&&it.mgr_main&&it.mgr_main.name)||'(담당 미지정)'];

/* 부담당 열의 걸러 보기 값. 빈 배열로 두면 부담당 없는 건이 어느 값에도
   안 들어가 목록에서 통째로 사라진다 — 「없음」도 고를 수 있는 값이다. */
function mgrSubVals(it){
  var a=mgrSubNames(it);
  return a.length?a:['(부담당 없음)'];
}
// inl = 기업명 옆에 한 줄로 붙인다(팀 전체). 안 주면 예전대로 아랫줄.
function mgrLine(it,mode,hi,inl){
  var main=(it.mgr_main&&it.mgr_main.name)||'', subs=mgrSubNames(it);
  var me=(mode==='other')?((viewer()||{}).name||''):'';

  function tag(n,sub){

  }
  var h='';
  if(mode!=='sub'&&main&&main!==me) h+='<span class="mgk">주</span>'+tag(main,false);
  var ss=(mode==='main')?[]:subs.filter(function(n){ return n!==me; });   // main = 주담당만
  if(ss.length) h+='<span class="mgk sub">부</span>'+ss.map(function(n){ return tag(n,true); }).join('');
  return h?'<div class="mgl'+(inl?' inl':'')+'" title="주담당 · 부담당(공동으로 함께 하는 사람)">'+h+'</div>':'';
}
function wkLogsOf(itemId,wk){ wk=wk||weekKeyOf(S.week); var w=wkCache[wk]||{}; var o=w[itemId]||{};
  return Object.keys(o).map(function(k){var l=o[k];l._id=k;return l;})
    .sort(function(a,b){return (b.d||'').localeCompare(a.d||'')||(b.at||'').localeCompare(a.at||'');}); }
/* ── 검색·필터 공통 ── */
function matchQ(it,q){
  if(!q) return true; q=String(q).toLowerCase();
  // 담당자는 여러 명일 수 있다. 첫 사람만 보면 2번째 담당자 이름으로는 안 찾힌다.
  // 전화는 적는 방식이 사람마다 달라(010-8284-7994 / 01082847994) 둘 다 넣는다.
  var ctKeys=[];
  itemContacts(it).forEach(function(c){
    if(!c) return;
    var ph=String(c.phone||'');
    ctKeys.push(c.name, contactRole(c), ph, ph.replace(/[^0-9]/g,''));
  });
  return [it.company,it.client,it.title,it.no,it.officer,it.cat,it.ptype,it.brief,
          (it.mgr_main&&it.mgr_main.name),(it.last&&it.last.t)]
    .concat(ctKeys)
    .concat((it.mgr_subs||[]).map(function(s){return s&&s.name;}))
    .some(function(s){ return String(s||'').toLowerCase().indexOf(q)>=0; });
}

// 푸른이알피 연동 이상만 표시한다 (정상 연동은 종료 버튼의 🔗로 이미 드러난다)

// 임박 판정·정렬이 보는 기한. 사건 단계 기한(pe_due)이 더 이르면 그것이 기준이 된다 —
// 법정 기한을 놓치면 되돌릴 수 없으므로, 사람이 적은 날짜에 가려지면 안 된다.
// 원래 순서(다음 할 일 → 기한)는 그대로 두고, 사건 단계 기한이 그보다 이를 때만 앞선다.
function itemDue(it){
  var base=(it.next&&it.next.date)||it.due||'';
  var sd=(it.pe_due&&it.pe_due.date)||'';
  if(sd && (!base || sd<base)) return sd;
  return base;
}
// 사건 단계 기한 배지 — pe_due 는 푸른이알피가 송달일·판정일에서 계산해 한 방향으로 내려보낸다.
// 여기서 고칠 수 없다. 아직 확인 안 된 법정 기한은 (확인) 을 붙여 그대로 믿지 않게 한다.
function sdueHTML(it){
  var pd=it&&it.pe_due; if(!pd||!pd.date) return '';
  var n=dday(pd.date); if(n===null) return '';
  var txt=n<0?('D+'+(-n)):n===0?'D-Day':('D-'+n);
  var unv=(pd.verified!==true);
  return '<span class="sdue'+(unv?' unv':'')+'" title="사건 ▸ 심급·단계에서 계산된 기한 ('+esc(pd.date)+')'
    +(unv?' · 법정 기한이 아직 확인되지 않았습니다 — 푸른이알피 환경설정 ▸ 업무유형에서 확인하세요':'')
    +' · 여기서는 바꿀 수 없습니다">'
    +'<span class="dd">'+txt+'</span>⚖ '+esc(pd.label||'단계 기한')+(unv?'(확인)':'')+'</span>';
}

/* ── 기록 쓰기 (일 단위 저장 + 주 묶음 + 건별 사본 + last 캐시) ── */
var _lastLogId='';   // 방금 만든 기록 ID — 체크가 만든 기록을 나중에 되찾기 위함
function addLog(itemId,text,dateStr,kind){
  text=(text||'').trim(); if(!text){ toast('내용을 입력하세요','warn'); return Promise.resolve(false); }
  dateStr=dateStr||todayStr();
  var wk=weekKeyOf(mondayOf(new Date(dateStr+'T00:00:00')));
  var y=weekYear(wk), lid=rid('L');
  _lastLogId=lid;
  var log={d:dateStr,t:text,by:(S.me&&S.me.sid)||'',byName:(S.me&&S.me.name)||'',at:new Date().toISOString()};
  if(kind) log.k=kind;
  var up={};
  up[NS+'/logs/'+y+'/'+wk+'/'+itemId+'/'+lid]=log;
  up[NS+'/itemlogs/'+itemId+'/'+lid]=Object.assign({w:wk},log);
  var it=items[itemId];
  if(it&&(!it.last||String(it.last.d||'')<=dateStr)) up[NS+'/items/'+itemId+'/last']={d:dateStr,t:text};
  return fbDb.ref().update(up).then(function(){
    if(!wkCache[wk])wkCache[wk]={}; if(!wkCache[wk][itemId])wkCache[wk][itemId]={};
    wkCache[wk][itemId][lid]=log;
    if(itemLogsCache[itemId]) itemLogsCache[itemId][lid]=Object.assign({w:wk},log);
    if(it&&(!it.last||String(it.last.d||'')<=dateStr)) it.last={d:dateStr,t:text};
    toast('기록 저장됨'); return true;
  }).catch(function(e){ toast('저장 실패: '+e.message,'err'); return false; });
}
// 기록을 고치거나 지울 수 있는 사람 — 쓴 본인과 대표
function canLog(l){
  if(!l) return false;
  return isAdmin()||l.by===(S.me&&S.me.sid)||l.byName===(S.me&&S.me.name);
}
// 기록 줄에 붙는 ✎ ✕ (표의 주간 칸·드로어 공통)
function logBtns(itemId,l){
  if(!canLog(l)) return '';
  var a=escJ(itemId), b=escJ(l._id||'');
  // 체크가 만든 기록은 체크를 풀면 되므로 여기서 또 옮길 필요가 없다
  return (l.k!=='step'?'<span class="lgx" onclick="event.stopPropagation();logToPlan(\''+a+'\',\''+b+'\')" '
      +'title="아직 안 한 일이었다면 — 할 일로 옮깁니다">↑</span>':'')
    +'<span class="lgx" onclick="event.stopPropagation();editLog(\''+a+'\',\''+b+'\')" title="이 기록 고치기">✎</span>'

/* 기록 수정 — 내용과 날짜를 고친다.
   날짜를 바꾸면 주차가 달라질 수 있으므로 옛 주차에서 지우고 새 주차에 다시 넣는다.
   기록은 주차별(logs)과 건별(itemlogs) 두 곳에 있어 한 번의 update로 함께 옮긴다. */
function editLog(itemId,lid){
  loadItemLogs(itemId).then(function(){
    var l=(itemLogsCache[itemId]||{})[lid];
    if(!l){ toast('기록을 찾을 수 없습니다','warn'); return; }
    if(!canLog(l)){ toast('본인이 쓴 기록만 고칠 수 있습니다','warn'); return; }
    showModal('<h2 style="margin:0 0 6px">✎ 기록 고치기</h2>'
      +'<p class="muted" style="font-size:12px;margin:0 0 11px">'
      +esc((items[itemId]&&(items[itemId].company||items[itemId].title))||'')
      +(l.byName?' · 작성 '+esc(l.byName):'')+(l.at?' '+esc(String(l.at).slice(0,10)):'')+'</p>'
      +'<div class="fld" style="margin-bottom:9px"><label>내용</label>'
      +'<textarea id="lg-t" rows="3" style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit">'
      +esc(l.t||'')+'</textarea></div>'
      +'<div class="fld" style="margin-bottom:4px"><label>날짜</label>'
      +'<input type="date" id="lg-d" value="'+esc(l.d||'')+'"></div>'
      +'<div class="muted" style="font-size:11px">날짜를 바꾸면 그 날이 속한 주의 기록으로 옮겨집니다.</div>'
      +'<div id="lg-msg" class="muted" style="font-size:12px;min-height:17px;margin-top:6px"></div>'
      +'<div class="row" style="justify-content:flex-end">'
      +'<button style="color:var(--danger);border-color:#e6a19a" onclick="closeM();delLog(\''+escJ(itemId)+'\',\''+escJ(lid)+'\')">🗑 삭제</button>'
      +'<span style="flex:1"></span><button onclick="closeM()">취소</button>'
      +'<button class="primary" onclick="saveLogEdit(\''+escJ(itemId)+'\',\''+escJ(lid)+'\')">저장</button></div>');
    setTimeout(function(){ var e=$('lg-t'); if(e){ e.focus(); e.setSelectionRange(e.value.length,e.value.length); } },60);
  });
}
function saveLogEdit(itemId,lid){
  var msg=$('lg-msg');
  var t=(($('lg-t')||{}).value||'').trim(), d=(($('lg-d')||{}).value||'').trim();
  if(!t){ if(msg)msg.textContent='내용을 비울 수 없습니다. 지우려면 삭제를 누르세요.'; return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ if(msg)msg.textContent='날짜를 확인해 주세요.'; return; }
  var l=(itemLogsCache[itemId]||{})[lid];
  if(!l){ if(msg)msg.textContent='기록을 찾을 수 없습니다.'; return; }
  var oldWk=l.w||weekKeyOf(mondayOf(new Date((l.d||d)+'T00:00:00')));
  var newWk=weekKeyOf(mondayOf(new Date(d+'T00:00:00')));
  var base={d:d,t:t,by:l.by||'',byName:l.byName||'',at:l.at||new Date().toISOString(),
    ed_at:new Date().toISOString(),ed_by:(S.me&&S.me.name)||''};
  if(l.k) base.k=l.k;
  var up={};
  up[NS+'/itemlogs/'+itemId+'/'+lid]=Object.assign({w:newWk},base);
  if(oldWk&&oldWk!==newWk) up[NS+'/logs/'+weekYear(oldWk)+'/'+oldWk+'/'+itemId+'/'+lid]=null;
  up[NS+'/logs/'+weekYear(newWk)+'/'+newWk+'/'+itemId+'/'+lid]=base;
  if(msg)msg.textContent='저장 중…';
  fbDb.ref().update(up).then(function(){
    if(itemLogsCache[itemId]) itemLogsCache[itemId][lid]=Object.assign({w:newWk},base);
    if(oldWk&&wkCache[oldWk]&&wkCache[oldWk][itemId]) delete wkCache[oldWk][itemId][lid];
    if(wkCache[newWk]){ if(!wkCache[newWk][itemId]) wkCache[newWk][itemId]={};
      wkCache[newWk][itemId][lid]=base; }
    return refreshLast(itemId);
  }).then(function(){
    closeM(); toast('✎ 기록 수정됨'); renderDrawer(); route();
  }).catch(function(e){ if(msg)msg.textContent='실패: '+e.message; });
}
// 마지막 기록 한 줄 다시 계산 — 인수인계 기록(k)은 제외
function refreshLast(itemId){
  var rest=Object.keys(itemLogsCache[itemId]||{}).map(function(k){ return itemLogsCache[itemId][k]; })
    .filter(function(x){ return x&&!x.k; })
    .sort(function(a,b){ return (b.d||'').localeCompare(a.d||''); });
  var nl=rest[0]?{d:rest[0].d,t:rest[0].t}:null;
  if(items[itemId]) items[itemId].last=nl;
  return fbDb.ref(NS+'/items/'+itemId+'/last').set(nl);
}
function delLog(itemId,lid){
  confirmM('이 기록을 삭제할까요?',{ok:'삭제',danger:true}).then(function(ok){ if(!ok)return;
    // 캐시가 없으면 주차를 몰라 옛 기록이 남고, last 재계산도 틀린다 — 먼저 읽는다
    loadItemLogs(itemId).then(function(){ _delLog(itemId,lid); });
  });
}
function _delLog(itemId,lid){
  var l=(itemLogsCache[itemId]||{})[lid]; var wk=l&&l.w;
  if(l&&!canLog(l)){ toast('본인이 쓴 기록만 지울 수 있습니다','warn'); return; }
  var up={};
  up[NS+'/itemlogs/'+itemId+'/'+lid]=null;
  if(wk) up[NS+'/logs/'+weekYear(wk)+'/'+wk+'/'+itemId+'/'+lid]=null;
  fbDb.ref().update(up).then(function(){
    if(itemLogsCache[itemId]) delete itemLogsCache[itemId][lid];
    if(wk&&wkCache[wk]&&wkCache[wk][itemId]) delete wkCache[wk][itemId][lid];
    return refreshLast(itemId);
  }).then(function(){
    toast('기록 삭제됨'); renderDrawer(); route();
  }).catch(function(e){ toast('삭제 실패: '+e.message,'err'); });
}
// 저장 성공 여부를 반환한다. 호출부는 반드시 if(!ok)return; 으로 가드할 것 —
// 예전엔 실패를 삼키고 resolve 해서 "저장 실패" 토스트와 "✅ 완료"가 같이 뜨는 문제가 있었다.
// up_at = 이쪽에서 마지막으로 손댄 시각. 푸른이알피와 진행 필드를 맞출 때
// "양쪽이 다르게 바뀌었으면 누가 더 최근인가"를 판정하는 근거가 된다.
function patchItem(id,obj){
  var o=Object.assign({},obj,{up_at:new Date().toISOString()});
  return fbDb.ref(NS+'/items/'+id).update(o)
    .then(function(){ Object.assign(items[id]||{},o); return true; })
    .catch(function(e){ toast('저장 실패: '+e.message,'err'); return false; });
}

  // 푸른이알피에 주담당인데 아직 업무시트에 없는 건 → 1차 연결 안내 (기준일 이전 백로그)
  var unl=peMineUnlinked();
  if(unl&&unl.length){

        :(self?'아직 등록된 업무가 없습니다.<br><br><button class="primary" onclick="itemModal()">＋ 첫 업무 등록</button> &nbsp; 또는 좌측 하단 <b>📥 엑셀 가져오기</b>로 이관 파일을 불러오세요.'

  }
  // 머리행이 곧 걸러 보기 — 열 이름을 누르면 그 열의 값이 건수와 함께 뜬다(엑셀 자동필터).
  // 고른 날은 거르는 조건이 아니라 모아 보는 표시다 — 「조건」 수에 넣지 않는다
  var on=!!(S.q||S.f||S.myRole||fAny('my'));
  // 띠 안내가 없다. 거르지 않으므로 "모두 보기"가 필요 없고,

  // 선택지는 열려 있는 열만 센다 — 네 열을 매번 다 세면 헛일이다.

  function fh(k,w){

    var vals=fOpen('my',k)?fVals('my',k,base.filter(function(it){ return fPass('my',it,k); })):[];

  h+='<div class="panel tbl" id="mytbl"><table><thead><tr class="fhead">'

    +fh('cat','width:64px')
    +'<th style="min-width:110px">'+qBox('renderMy','기업','fh')+'</th>'
    +fh('pt','min-width:140px')
    +fh('st','width:74px')
    +colTH('my','last','최근 기록','min-width:130px')
    +'<th class="wkhd" style="color:var(--acc2)">'
    +'<div class="row" style="gap:6px;margin-bottom:'+(wkSplitOn()?'4px':'0')+'">'
    +'<span>'+(isCurWeek()?'이번 주':'그 주')+'</span>'
    +'<span style="font-weight:400;text-transform:none;color:var(--faint)">'+esc(weekLabel(S.week).split('·')[1]||'')+'</span>'
    +'<span class="chipbtn'+(wkSplitOn()?' on':'')+'" onclick="wkSplitToggle()" '
    +'title="'+(wkSplitOn()?'요일을 합쳐 한 칸으로 봅니다':'요일별로 나눠 그 날짜 칸에 바로 적습니다')+'">'
    +(wkSplitOn()?'요일별':'한 칸')+'</span>'
    +'</div>'
    +(wkSplitOn()?wkHeadHTML():'<span style="font-weight:400;text-transform:none;color:var(--faint)">칸에 바로 입력, Enter 저장</span>')
    +'</th>'
    +fh('due','width:110px')
    +'<th style="width:58px;text-align:center">종료</th></tr></thead><tbody>';
  var NCOL=9;   // 접힌 열도 띠로 한 칸을 차지하므로 칸 수는 변하지 않는다

  /* 날을 골랐으면 그 날 묶음이 먼저다. 구분 묶음은 잠시 물러난다 —

  else if(S.calDay){

      if(grpFolded(g[0])){ gn+=g[1].length; return; }   // 접힌 묶음은 줄을 그리지 않는다

  } else list.forEach(function(it,i){ h+=rowHTML(it,i+1,i); });
  h+='</tbody></table></div>';
  // 몇 건을 보고 있는지는 표 아래 한 줄로 (팀 전체와 같은 자리)
  h+='<div class="muted" style="font-size:12px;margin-top:8px">'
    +(on?'조건에 맞는 업무 '+list.length+' / 전체 '+total+'건'
        +' <span class="chipbtn" onclick="myReset()" title="걸러 보기를 모두 해제합니다">✕ 조건 해제</span>'
       :'진행 중 '+total+'건')+'</div>';
  app.innerHTML=h+splitClose();
  if(S.fPop) fPopPos();
  if(S.colPop) colPopPos();
  // 캘린더에서 날을 골랐으면 그 칸으로 커서를 옮긴다 — 그리기가 끝난 뒤라야 잡힌다
  if(S._calFocus) setTimeout(calFocusDay,60);
  calAfter();
  arFit();                      // 표를 창 아래까지 — 팀 전체·종료와 같은 규칙
}
// 컴팩트 요약 칩 — 누르면 그 건만 보고, 다시 누르면 해제 (예전 .fcard와 같은 동작)
function sbHTML(key,label,val,cls){

function setFocus(k){ S.f=(S.f===k)?null:k; renderMy(); }
function myRole(r){ S.myRole=(S.myRole===r)?'':r; renderMy(); }
function myReset(){ fResetCols('my'); S.fPop=''; S.q=''; S.f=null; S.myRole=''; S.calDay='';
  // 접힌 묶음도 편다 — "조건을 다 풀었는데 안 보인다"가 생기면 안 된다
  S.grpF={}; try{ localStorage.setItem(GRP_KEY,''); }catch(e){}
  renderMy(); }

/* ── 구분별 묶어 보기 ──────────────────────────────────────────────
   사건을 보다가 컨설팅이 튀어나오면 눈이 매번 다시 맞춰야 한다.
   순서는 푸른이알피와 같게 고정한다 — 건수순으로 하면 볼 때마다 자리가
   바뀌어 손이 기억하지 못한다. */
var GRP_KEY='work_my_grp', GRPON_KEY='work_my_group';
var GRP_ORDER=['계약','사건','컨설팅','기금','기타사업'];
function grpOn(){
  if(S.grpOn===undefined){
    var v=null; try{ v=localStorage.getItem(GRPON_KEY); }catch(e){}
    S.grpOn=(v!=='0');                            // 처음에는 묶어서 본다
  }
  return !!S.grpOn;
}
function grpToggle(){
  S.grpOn=!grpOn();
  try{ localStorage.setItem(GRPON_KEY,S.grpOn?'1':'0'); }catch(e){}
  renderMy();
}
function grpFold(){
  if(S.grpF===undefined){
    var v=''; try{ v=localStorage.getItem(GRP_KEY)||''; }catch(e){}
    S.grpF={}; v.split(',').forEach(function(c){ if(c) S.grpF[c]=1; });
  }
  return S.grpF;
}
function grpFolded(cat){ return !!grpFold()[cat]; }
function grpFoldToggle(cat){
  var f=grpFold();
  if(f[cat]) delete f[cat]; else f[cat]=1;
  try{ localStorage.setItem(GRP_KEY,Object.keys(f).join(',')); }catch(e){}
  renderMy();
}
// [구분, 그 구분의 업무들] — 넘겨받은 차례를 묶음 안에서 그대로 지킨다
function groupRows(list){
  var m={}, order=[];
  (list||[]).forEach(function(it){
    var c=catNorm(it.cat)||'기타';
    if(!(c in m)){ m[c]=[]; order.push(c); }
    m[c].push(it);
  });
  order.sort(function(a,b){
    var ia=GRP_ORDER.indexOf(a), ib=GRP_ORDER.indexOf(b);
    if(ia<0&&ib<0) return a.localeCompare(b,'ko');
    if(ia<0) return 1;
    if(ib<0) return -1;
    return ia-ib;
  });
  return order.map(function(c){ return [c,m[c]]; });
}
/* 고른 날 소제목. 첫 묶음은 그 날 것, 둘째는 나머지.
   거르는 것이 아니라 모아 놓는 것이므로 "풀기"가 아니라 "고른 날 놓기"다. */
function dayHeadHTML(d,n,cols,on){

    +'<td colspan="'+cols+'">'
    +(on?'📅 <b>'+esc(md(d))+'</b> 에 있는 <b>'+n+'건</b>'
         +'<span class="gx" onclick="calDayOnly(\'\')" title="고른 날을 놓습니다 — 줄은 원래 차례로 돌아갑니다">✕ 고른 날 놓기</span>'
       :'<span class="gn2">나머지 '+n+'건</span>')
    +'</td></tr>';
}
function grpHeadHTML(cat,n,cols){
  var f=grpFolded(cat);
  return '<tr class="grph" onclick="grpFoldToggle(\''+escJ(cat)+'\')">'
    +'<td colspan="'+cols+'" title="'+(f?'펴기':'접기')+'">'
    +'<span class="gc">'+(f?'▸':'▾')+'</span>'+catBadge(cat)
    +'<span class="gn">'+n+'건</span></td></tr>';
}

/* ── 열별 걸러 보기 (엑셀 자동필터) ──────────────────────────────────
   열 이름을 누르면 그 열에 실제로 쓰인 값이 건수와 함께 뜬다. 값은 여러 개를
   동시에 고를 수 있다 — 드롭다운으로는 "사건과 컨설팅만"을 볼 수 없었다.
   고른 값은 S.F={my:{cat:[...],…}, team:{…}}에 화면별로 담는다.
   빈 배열 = 그 열에 조건 없음. 내 업무·팀 전체가 같은 코드를 쓴다. */
// 기한은 겹치지 않는 칸으로 나눈다 — 체크 목록은 한 건이 한 칸에만 들어가야 센 수가 맞다
var DUE_BUCKETS=[['over','기한 지남'],['d7','임박 D-7'],['d30','한 달 안'],['later','그 뒤'],['none','기한 없음']];
var DUE_LABEL={}, DUE_ORDER={};
DUE_BUCKETS.forEach(function(b,i){ DUE_LABEL[b[0]]=b[1]; DUE_ORDER[b[0]]=i; });
function dueBucket(it){
  var d=dday(itemDue(it));
  if(d===null) return 'none';
  if(d<0)  return 'over';
  if(d<=7) return 'd7';
  if(d<=30)return 'd30';
  return 'later';
}
/* 걸러 볼 수 있는 열. 화면(sc)마다 목록이 다르지만 동작은 하나로 쓴다.
   [키, 열 이름, 그 건의 값] — 값이 같은 것끼리 한 줄로 묶인다. */
var FCOLS={
  my:  [['cat','구분',      function(it){ return catNorm(it.cat)||'기타'; }],
        ['pt', '업무',      function(it){ return ptOf(it); }],
        ['st', '상태',      function(it){ return it.status||'진행중'; }],
        ['due','다음 할 일',dueBucket]],
  // 담당은 한 건에 여러 명(주 1 + 부 N)이라 값을 배열로 준다 — 그 사람이
  // 부담당으로 붙어 있는 건까지 함께 봐야 무슨 일을 하고 있는지 알 수 있다
  team:[['mgr','담당',mgrAll,'담당으로 걸러 봅니다 — 주담당·부담당 모두'],
        ['cat','구분',      function(it){ return catNorm(it.cat)||'기타'; }],
        // 부담당만 따로 — 「담당」은 주·부를 함께 보므로 부담당만 좁힐 수가 없었다
        ['sub','부담당',mgrSubVals,'부담당으로 걸러 봅니다 — 공동으로 함께 하는 사람'],
        ['pt', '업무명',    function(it){ return ptOf(it); }],
        ['st', '상태',      function(it){ return it.status||'진행중'; }],
        ['due','다음 할 일',dueBucket]]
};
function fCols(sc){ return FCOLS[sc]||FCOLS.my; }
function fCol(sc,k){
  var a=fCols(sc); for(var i=0;i<a.length;i++) if(a[i][0]===k) return a[i];
  return null;
}
function fRender(sc){ if(sc==='team') renderTeam(); else renderMy(); }
/* 그 열에 걸린 조건.
   없음(조건 없음) = 배열이 아님 → 거르지 않는다
   빈 배열        = 하나도 안 골랐다 → 아무것도 안 남는다
   두 가지는 다르다. 체크를 즉시 반영하게 되면서 "다 지웠다"와 "조건이 없다"가
   같은 값이 되면 다 지운 순간 전부 다시 보여 무엇을 한 것인지 알 수 없다. */
function fHas(sc,k){ return (S.F&&S.F[sc]&&S.F[sc][k]) instanceof Array; }
function fSel(sc,k){ var s=S.F&&S.F[sc]&&S.F[sc][k]; return (s instanceof Array)?s:[]; }
function fSet(sc,k,v){ S.F=S.F||{}; S.F[sc]=S.F[sc]||{}; S.F[sc][k]=v; }
function fClear(sc,k){ if(S.F&&S.F[sc]) delete S.F[sc][k]; }
function fAny(sc){ return fCols(sc).some(function(c){ return fHas(sc,c[0]); }); }
function fResetCols(sc){ S.F=S.F||{}; S.F[sc]={}; }
function fLabel(k,v){ return k==='due'?(DUE_LABEL[v]||v):(v||'(이름 없음)'); }
// 한 건이 값을 여럿 가질 수 있다(담당 = 주 1 + 부 N). 항상 배열로 다룬다.
function _fList(v){ return (v instanceof Array)?v:[v]; }
// 그 열에 실제로 쓰인 값과 건수. 건수는 "그 열만 빼고" 걸러 센다(엑셀과 같다) —
// 그래야 "사건을 고르면 컨설팅이 0건"이 되어 다시 넓힐 수가 없는 일이 없다.
function fVals(sc,k,arr){
  var f=fCol(sc,k); if(!f) return [];
  var m={}, out=[];
  (arr||[]).forEach(function(it){
    _fList(f[2](it)).forEach(function(v){ if(!(v in m)){ m[v]=0; out.push(v); } m[v]++; });
  });
  out.sort(k==='due'
    ?function(a,b){ return DUE_ORDER[a]-DUE_ORDER[b]; }
    :function(a,b){ return String(fLabel(k,a)).localeCompare(String(fLabel(k,b)),'ko'); });
  return out.map(function(v){ return [v,m[v]]; });
}
// 고른 값에 드는가. except를 주면 그 열 조건은 빼고 본다(선택지 건수를 셀 때).
function fPass(sc,it,except){
  var a=fCols(sc);
  for(var i=0;i<a.length;i++){
    if(a[i][0]===except) continue;
    if(!fHas(sc,a[i][0])) continue;                 // 조건 없음 — 거르지 않는다
    var sel=fSel(sc,a[i][0]);

  if(ck){ if(i<0) sel.push(v); } else if(i>=0) sel.splice(i,1);

function wkKey(e,inp){
  if(_ime(e)) return;                  // 한글 조합 중 Enter — 글자를 확정하는 것이지 저장이 아니다
  var day=inp.getAttribute('data-d')||'';
  // ↑↓는 저장하지 않고 칸만 옮긴다 — 적다 만 줄을 두고 위아래를 훑을 수 있어야 한다
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); wkMove(inp,e.key==='ArrowDown'?1:-1); return; }
  // ←→는 요일을 옮긴다. 글자가 있을 때는 글자 안에서 커서를 옮겨야 하므로 빈 칸에서만.
  if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&!inp.value){
    e.preventDefault(); wkSide(inp,e.key==='ArrowRight'?1:-1); return; }
  if(e.key!=='Enter')return;
  e.preventDefault();
  var step=e.shiftKey?-1:1;                                     // Shift+Enter는 윗줄로
  var id=inp.getAttribute('data-id'); var txt=inp.value;
  if(!txt.trim()){ wkMove(inp,step); return; }                  // 빈 칸에서 Enter = 그냥 넘어가기
  // 요일 칸에 적었으면 그 날짜로. 한 칸 보기는 오늘(지난 주는 그 주 금요일)로.
  var dateStr=day||(isCurWeek()?todayStr():ymd(addDays(S.week,4)));
  var r=inp.getAttribute('data-r'), c=inp.getAttribute('data-c');
  inp.value='';
  wkSave(id,txt,dateStr).then(function(ok){ if(!ok){inp.value=txt;return;}
    var all=[].slice.call(document.querySelectorAll('.wkin'));
    var i=all.indexOf(inp);
    route();
    setTimeout(function(){
      // 그냥 Enter는 그 칸에 머문다 — 하루에 여러 건을 적는 것이 이 화면의 쓰임이다.
      // 아랫줄로 가려면 ↓, 윗줄은 Shift+Enter.
      if(!e.shiftKey){
        if(r===null||c===null){ wkFocus(i); return; }
        var same=[].slice.call(document.querySelectorAll('.wkin[data-c="'+c+'"]'));
        for(var k3=0;k3<same.length;k3++)
          if(same[k3].getAttribute('data-r')===r){ wkPut(same[k3]); return; }
        wkFocus(i); return;
      }
      // Shift+Enter — 윗줄 같은 요일로
      if(r===null||c===null){ wkFocus(i+step); return; }
      var col=[].slice.call(document.querySelectorAll('.wkin[data-c="'+c+'"]'));
      var j=-1;
      for(var k2=0;k2<col.length;k2++) if(col[k2].getAttribute('data-r')===r){ j=k2; break; }
      wkPut(col[Math.max(0,Math.min((j<0?0:j)+step,col.length-1))]);
    },50);
  });
}

// 내보인다(안 그러면 주말에 적은 것이 사라진 것처럼 보인다).
function wkDays(){
  var d=[],i;
  for(i=0;i<5;i++) d.push(ymd(addDays(S.week,i)));
  var sat=ymd(addDays(S.week,5)), sun=ymd(addDays(S.week,6)), we=false;
  var c=wkCache[weekKeyOf(S.week)]||{};
  Object.keys(c).forEach(function(iid){
    var m=c[iid]||{};
    Object.keys(m).forEach(function(lid){ var dd=m[lid]&&m[lid].d; if(dd===sat||dd===sun) we=true; });
  });
  // 걸어 둔 할 일이 주말이면 그 칸도 열어야 한다 — 안 그러면 걸 수도, 볼 수도 없다
  if(!we) Object.keys(steps||{}).forEach(function(iid){
    var m=steps[iid]||{};
    Object.keys(m).forEach(function(sid){ var dd=m[sid]&&m[sid].d; if(dd===sat||dd===sun) we=true; });
  });
  if(we){ d.push(sat); d.push(sun); }
  return d;
}

function planAdd(id,text,d){

  var all=stepsOf(id), last=all.length?all[all.length-1].o:0;
  var rec={t:text,g:PLAN_GROUP,o:(last||0)+1,done:0,d:d,
           by:(S.me&&S.me.sid)||'',byName:(S.me&&S.me.name)||''};
  return fbDb.ref(NS+'/steps/'+id+'/'+rid('S')).set(rec)
    .then(function(){ toast('할 일 저장됨'); return true; })
    .catch(function(e){ toast('저장 실패: '+e.message,'err'); return false; });
}
/* 체크 = 실적. 단계를 done 처리하고 그 날 기록도 만든다.
   기록을 안 만들면 팀 전체의 「✍ 미기록」·「최근 기록」·전체 검색이 그 일을
   못 본다. 그렇다고 두 줄로 그리면 같은 일이 두 번 적힌 것처럼 보이므로,
   기록에 k:'step' 을 달아 두고 칸에서는 그 기록을 다시 그리지 않는다. */
function planCheck(id,sid){
  var s=(steps[id]||{})[sid]; if(!s||s.done) return;
  addLog(id,s.t,s.d||todayStr(),'step').then(function(ok){
    if(!ok) return;
    var lid=_lastLogId;                       // addLog 가 방금 만든 기록
    var up={};
    up[NS+'/steps/'+id+'/'+sid+'/done']=1;
    up[NS+'/steps/'+id+'/'+sid+'/by']=(S.me&&S.me.name)||'';
    up[NS+'/steps/'+id+'/'+sid+'/at']=todayStr();
    up[NS+'/steps/'+id+'/'+sid+'/lid']=lid||null;   // 체크를 풀 때 이 기록을 지운다
    fbDb.ref().update(up).catch(function(e){ toast('실패: '+e.message,'err'); });
  });
}
function planUncheck(id,sid){
  var s=(steps[id]||{})[sid]; if(!s||!s.done) return;
  var up={};
  up[NS+'/steps/'+id+'/'+sid+'/done']=0;
  up[NS+'/steps/'+id+'/'+sid+'/by']=null;
  up[NS+'/steps/'+id+'/'+sid+'/at']=null;
  up[NS+'/steps/'+id+'/'+sid+'/lid']=null;
  fbDb.ref().update(up).then(function(){
    if(s.lid) _delLog(id,s.lid);              // 체크가 만든 기록은 체크가 거둔다
  }).catch(function(e){ toast('실패: '+e.message,'err'); });
}
// 할 일을 지운다. 이미 체크해 기록이 된 것은 남긴다 — 한 일을 지우지 않는다.
function planDel(id,sid){
  fbDb.ref(NS+'/steps/'+id+'/'+sid).remove()
    .catch(function(e){ toast('실패: '+e.message,'err'); });
}
/* 잘못 들어간 것을 옮긴다 — 지우고 다시 적지 않아도 되게.
   할 일 → 기록: 그 날 기록을 만들고 할 일을 없앤다(체크와 달리 흔적을 남기지
   않는다 — 체크한 것이 아니라 처음부터 기록이었어야 할 것이다). */
function planToLog(id,sid){
  var s=(steps[id]||{})[sid]; if(!s) return;
  addLog(id,s.t,s.d||todayStr()).then(function(ok){
    if(!ok) return;
    fbDb.ref(NS+'/steps/'+id+'/'+sid).remove()
      .then(function(){ toast('기록으로 옮겼습니다'); })
      .catch(function(e){ toast('실패: '+e.message,'err'); });
  });
}
// 기록 → 할 일: 그 날짜로 할 일을 걸고 기록을 지운다.
function logToPlan(id,lid){
  var l=(itemLogsCache[id]||{})[lid];
  if(!l){ loadItemLogs(id).then(function(){ logToPlan(id,lid); }); return; }
  if(!canLog(l)){ toast('본인이 쓴 기록만 옮길 수 있습니다','warn'); return; }
  planAdd(id,l.t,l.d).then(function(ok){ if(ok) _delLog(id,lid); });
}
// 안 한 계획이 지나면 붉게 남는다. 자동으로 밀지 않는다 —
// 옮겨 놓으면 언제 하기로 했던 일인지 알 수 없게 된다.
function planRowHTML(it,s){
  var late=!s.done&&s.d<todayStr();
  return '<div class="wkpl'+(s.done?' on':'')+(late?' late':'')+'">'
    +'<span class="pk" onclick="'+(s.done?'planUncheck':'planCheck')

    +(s.done?'체크를 풉니다':'다 했으면 눌러 주세요 — 그 날 기록으로도 남습니다')+'">'
    +(s.done?'✓':'☐')+'</span>'
    +'<span class="tx">'+esc(s.t)+'</span>'
    +(s.byName&&s.byName!==(S.me&&S.me.name)?'<span class="by">'+esc(s.byName)+'</span>':'')
    +(s.done?'':'<span class="px" onclick="planToLog(\''+escJ(it._id)+'\',\''+escJ(s._id)+'\')" '
      +'title="이미 한 일이었다면 — 기록으로 옮깁니다">↓</span>')
    +'<span class="px" onclick="planDel(\''+escJ(it._id)+'\',\''+escJ(s._id)+'\')" title="이 할 일을 지웁니다">✕</span>'
    +'</div>';
}
/* ── 업무 종료 ── 푸른이알피에서 가져온 건이면 그쪽 사건도 함께 종료할지 묻는다 */
var PE_KIND={contract:'계약',case:'사건',consulting:'컨설팅',fund:'기금',other:'기타사업'};
function peLinked(it){ return !!(it&&it.src==='puerp'&&it.ref&&it.ref.type&&it.ref.id); }

   여기에 둔다(선택). 종료 후 AI가 기록·노트·회고를 읽어 지식 카드 후보를 뽑는다. */
var RETRO_FIELDS=[

];

function endWayPick(v){
  var e=$('cl-to'); if(e) e.style.display=(v==='transfer')?'':'none';
  if(v==='transfer') setTimeout(function(){ var e2=$('cl-to'); if(e2)e2.focus(); },40);
}
function _pickedWay(){
  var r=document.querySelector('input[name="endway"]:checked');
  return (r&&END_BY_KEY[r.value])?r.value:'done';
}
function resPick(el){
  var box=$('cl-res'); if(!box) return;
  [].slice.call(box.querySelectorAll('.chipbtn')).forEach(function(c){ c.classList.remove('on'); });
  el.classList.add('on');
}
function _pickedRes(){
  var box=$('cl-res'); if(!box) return '';
  var on=box.querySelector('.chipbtn.on');
  var v=on?on.getAttribute('data-r'):'';
  return RES_BY_KEY[v]?v:'';
}
// 회고를 먼저 저장한 뒤 종료하고, AI가 붙어 있으면 지식 수확을 제안한다
function doCompleteWithRetro(id,linked){
  var r={}, any=false;
  RETRO_FIELDS.forEach(function(f){
    var el=$('rt-'+f[0]); var v=el?el.value.trim():'';
    r[f[0]]=v; if(v) any=true;
  });
  var alsoPe=linked?!!(($('cl-pe')||{}).checked):false;
  var way=_pickedWay(), to=(($('cl-to')||{}).value||'').trim(), res=_pickedRes();
  var pre=Promise.resolve(true);
  if(any){
    // 기존 노트에 병합 — AI 인터뷰 답변(qa) 등이 지워지지 않도록
    var note=Object.assign({},(items[id]&&items[id].ho_note)||{});
    note.retro=Object.assign({},note.retro||{},r,
      {by:(S.me&&S.me.sid)||'',byName:(S.me&&S.me.name)||'',at:todayStr()});
    pre=patchItem(id,{ho_note:note});
  }
  pre.then(function(ok){
    if(!ok) return;
    return doComplete(id,linked?alsoPe:undefined,way,to,res).then(function(){
      if(aiProxyUrl()&&(any||Object.keys(itemLogsCache[id]||{}).length||noteDone(items[id]||{})))
        setTimeout(function(){ kbHarvest(id); },500);
    });
  });
}
// 종료/재개는 양방향 동기화 대상. state_at 이 "이 쪽에서 마지막으로 바뀐 시각"이고,
// 푸른이알피가 나의 업무를 열 때 work_erp/pesync 스냅샷과 비교해 변한 쪽을 반대편에 반영한다.
function setState(id,done,alsoPe,msg,way,to,res){
  var it=items[id]||{}, now=new Date().toISOString();
  var w=END_BY_KEY[way]?way:'done';
  var patch={ state:done?'done':null, done_date:done?todayStr():null,
    status:done?(END_BY_KEY[w][1]):'진행중', state_at:now,
    // 끝낸 방식은 종료할 때만 찍고, 재개해도 지우지 않는다 —
    // 원래 취소였는지 이관이었는지를 잃으면 푸른이알피 상태를 되돌릴 수 없다
    end_way:done?w:(it.end_way||null),
    end_to:done?(w==='transfer'?(to||''):null):(it.end_to||null),
    // 사건 결과도 재개해서 지우지 않는다 — 다시 종료할 때 되돌릴 근거다
    end_result:done?(RES_BY_KEY[res]?res:null):(it.end_result||null) };
  if(peLinked(it)&&alsoPe!==undefined) patch.pe_nosync=alsoPe?null:true;
  var up={}; Object.keys(patch).forEach(function(k){ up[NS+'/items/'+id+'/'+k]=patch[k]; });
  return fbDb.ref().update(up).then(function(){
    Object.assign(items[id]||{},patch);
    var linked=peLinked(it)&&!patch.pe_nosync;
    /* 푸른이알피에 「볼 것이 생겼다」고 알린다. 그쪽은 이 자리만 지켜보다 바뀌면
       동기화 엔진을 돌린다 — 종전에는 「나의 업무」를 열어야만 돌아 한참 걸렸다.
       ⚠ items 가 아니라 따로 둔 까닭: 엔진이 items 에도 쓰기 때문에 items 를
         듣게 하면 제가 쓴 걸 제가 듣고 끝없이 돈다. 여기는 업무관리만 쓴다.
       ⚠ 종료 저장과 **한 묶음으로 보내지 않는다.** 한 묶음이면 이 자리 쓰기가
         규칙에 막히는 순간 묶음 전체가 실패해 종료 자체가 안 된다. 알림은
         곁다리이므로 따로 보내고, 실패해도 조용히 넘긴다(그때는 예전처럼
         푸른이알피를 열 때 반영된다). */
    if(linked){ try{ fbDb.ref(NS+'/sync_ping').set(Date.now()).catch(function(){}); }catch(e){} }
    if(linked) addLog(id,(done?'업무 종료':'업무 재개')+' — 푸른이알피 '+(PE_KIND[it.ref.type]||'')+' 동기화 대상',todayStr(),'ho');
    closeM(); toast(msg+(linked?' · 푸른이알피에 곧 반영됩니다':''));
    if(done&&S.drawerId===id) closeDrawer();
    route();
  }).catch(function(e){ toast('실패: '+e.message,'err'); route(); });
}
function doComplete(id,alsoPe,way,to,res){
  var w=END_BY_KEY[way]?way:'done';
  var r=RES_BY_KEY[res];
  return setState(id,true,alsoPe,'✅ '+END_BY_KEY[w][1]+(r?' · '+r[1]:'')+' — 종료 화면으로 이동',w,to,res);
}

/* ── 빠른 기록 바 ── */
var _qbPick=0,_qbMatches=[];
function qbParse(){
  var v=$('qb').value; var sp=v.indexOf(' ');
  var key=sp<0?v:v.slice(0,sp); var rest=sp<0?'':v.slice(sp+1);
  return {key:key.trim(),rest:rest.trim()};
}
function qbSug(){
  var p=qbParse(); var box=$('qsug');
  if(!p.key){ box.style.display='none'; _qbMatches=[]; return; }
  var pool=myOpen();
  _qbMatches=pool.filter(function(it){
    return (it.company||'').indexOf(p.key)>=0||(it.title||'').indexOf(p.key)>=0||(it.client||'').indexOf(p.key)>=0;
  }).slice(0,5);
  _qbPick=0;
  if(!_qbMatches.length){ box.style.display='none'; return; }
  box.innerHTML=_qbMatches.map(function(it,i){
    return '<div class="qi'+(i===_qbPick?' pick':'')+'" onmousedown="qbGo('+i+')">'+catBadge(it.cat)
      +' <b>'+esc(it.company||it.client||'')+'</b> <span class="muted">'+esc(it.title||'')+'</span>'
      +'<small>'+(i===_qbPick?'Enter로 기록':'')+'</small></div>'; }).join('');
  box.style.display='';
}
function qbKey(e){
  if(_ime(e)) return;                  // 한글 조합 중 Enter는 글자를 확정하는 것이다
  if(e.key==='ArrowDown'){ e.preventDefault(); if(_qbMatches.length){_qbPick=(_qbPick+1)%_qbMatches.length; qbRepaint();} return; }
  if(e.key==='ArrowUp'){ e.preventDefault(); if(_qbMatches.length){_qbPick=(_qbPick-1+_qbMatches.length)%_qbMatches.length; qbRepaint();} return; }
  if(e.key==='Escape'){ $('qb').blur(); $('qsug').style.display='none'; return; }
  if(e.key==='Enter'){ e.preventDefault(); qbGo(_qbPick); }
}
function qbRepaint(){ var els=$('qsug').children;
  for(var i=0;i<els.length;i++){ els[i].className='qi'+(i===_qbPick?' pick':''); els[i].querySelector('small').textContent=(i===_qbPick?'Enter로 기록':''); } }
function qbGo(i){
  var it=_qbMatches[i]; var p=qbParse();
  if(!it){ toast('일치하는 업무가 없습니다','warn'); return; }
  if(!p.rest){ $('qsug').style.display='none'; openDrawer(it._id); $('qb').value=''; return; }
  addLog(it._id,p.rest,todayStr()).then(function(ok){ if(!ok)return;
    $('qb').value=''; $('qsug').style.display='none'; route(); });
}

/* ── 주 피커 캘린더 ── */
function openCal(){
  if($('calpop')){ closeCal(); return; }
  S.calMon=new Date(S.week.getFullYear(),S.week.getMonth(),1);
  var pop=document.createElement('div'); pop.id='calpop';
  var pill=$('wkpill'); var r=pill.getBoundingClientRect();
  pop.style.top=(r.bottom+8+window.scrollY)+'px';
  pop.style.left=Math.max(10,Math.min(window.innerWidth-320,r.left-40))+'px';
  document.body.appendChild(pop);
  renderCal();
  setTimeout(function(){ document.addEventListener('mousedown',_calOut); },0);
}
function _calOut(e){ var p=$('calpop'); if(p&&!p.contains(e.target)&&e.target.id!=='wkpill'){ closeCal(); } }
function closeCal(){ var p=$('calpop'); if(p)p.remove(); document.removeEventListener('mousedown',_calOut); }
function calShift(n){ S.calMon=new Date(S.calMon.getFullYear(),S.calMon.getMonth()+n,1); renderCal(); }
function renderCal(){
  var pop=$('calpop'); if(!pop)return;
  var y=S.calMon.getFullYear(), m=S.calMon.getMonth();
  var first=mondayOf(new Date(y,m,1)); var mons=[];
  for(var d=new Date(first); d<=new Date(y,m+1,0); d=addDays(d,7)) mons.push(new Date(d));
  // 이 달 주들의 기록 로드(캐시) 후 도트 표시
  Promise.all(mons.map(function(mo){ return loadWeekOnce(weekKeyOf(mo)); })).then(function(){
    var myIds={}; myOpen().forEach(function(it){myIds[it._id]=1;});
    var dots={};   // 'YYYY-MM-DD' -> count (내 업무 기록)
    mons.forEach(function(mo){ var w=wkCache[weekKeyOf(mo)]||{};
      Object.keys(w).forEach(function(iid){ if(!myIds[iid])return;
        Object.keys(w[iid]).forEach(function(lid){ var d2=w[iid][lid].d; if(d2)dots[d2]=(dots[d2]||0)+1; }); }); });
    var dues={}; myOpen().forEach(function(it){ var d3=itemDue(it); if(d3)dues[d3]=1; });
    var selMonYmd=ymd(S.week), today=todayStr();
    var WD=['월','화','수','목','금','토','일'];
    var h='<div class="ct"><span class="nv" onclick="calShift(-1)">‹</span>'+y+'년 '+(m+1)+'월<span class="nv" onclick="calShift(1)">›</span>'
      +'<span class="today" onclick="setWeek(null)">오늘로</span></div>';
    h+='<table><tr>'+WD.map(function(w2,i){return '<th'+(i>=5?' class="we"':'')+'>'+w2+'</th>';}).join('')+'</tr>';
    mons.forEach(function(mo){
      var sel=ymd(mo)===selMonYmd;
      h+='<tr class="wrow'+(sel?' selwk':'')+'" onclick="pickWeek(\''+ymd(mo)+'\')">';
      for(var i=0;i<7;i++){ var day=addDays(mo,i); var ds=ymd(day);
        var cls='d'+(day.getMonth()!==m?' out':'')+(i>=5?' we':'')+(ds===today?' today2':'')+(dues[ds]?' duemark':'');
        var cnt=dots[ds]||0;
        var dotH=cnt?'<span class="dt2">'+(cnt>2?'<i class="hot"></i><i></i>':cnt>1?'<i class="hot"></i>':'<i></i>')+'</span>':'';
        h+='<td><span class="'+cls+'">'+day.getDate()+dotH+'</span></td>'; }
      h+='</tr>';
    });
    h+='</table><div class="lg"><span><i></i> 기록 있는 날</span><span><i class="r"></i> 기한</span><span style="color:var(--acc);font-weight:700">행 클릭 = 그 주 보기</span></div>';
    pop.innerHTML=h;
  });
}

function drawerAdd(id,inp){

    setTimeout(function(){var d2=$('dlog');if(d2)d2.focus();},50); });
}
function saveNext(id){
  var t=$('dx-text'),d=$('dx-date'); if(!t)return;
  patchItem(id,{next:{text:t.value.trim(),date:d.value||''}}).then(function(ok){ if(!ok)return; toast('다음 할 일 저장'); route(); });

function restoreItem(id){
  var it=items[id]||{};
  if(!peLinked(it)||it.pe_nosync) return setState(id,false,undefined,'↩ 진행으로 재개');
  confirmM('「'+(it.company||it.client||'')+' — '+(it.title||'')+'」\n\n진행으로 재개합니다.\n'
    +'푸른이알피의 '+(PE_KIND[it.ref.type]||'')+'도 종료 해제됩니다.',{ok:'재개'})
    .then(function(ok){ if(!ok)return; setState(id,false,true,'↩ 진행으로 재개'); });
}
function deleteItem(id){
  var it=items[id]||{};
  confirmM('「'+(it.company||'')+' — '+(it.title||'')+'」\n업무와 모든 기록을 삭제합니다. 되돌릴 수 없습니다.',{ok:'삭제',danger:true}).then(function(ok){
    if(!ok)return;
    var up={};
    up[NS+'/items/'+id]=null;
    up[NS+'/itemlogs/'+id]=null;
    // 주별 기록도 제거 (itemlogs 캐시 기준)
    loadItemLogs(id).then(function(logs){
      Object.keys(logs||{}).forEach(function(lid){ var w=logs[lid].w;
        if(w) up[NS+'/logs/'+weekYear(w)+'/'+w+'/'+id+'/'+lid]=null; });
      fbDb.ref().update(up).then(function(){
        delete items[id]; delete itemLogsCache[id];
        Object.keys(wkCache).forEach(function(w2){ if(wkCache[w2][id])delete wkCache[w2][id]; });
        closeDrawer(); toast('🗑 삭제됨'); route();
      }).catch(function(e){ toast('삭제 실패: '+e.message,'err'); });
    });
  });
}

function doHandover(id){
  var sel=$('ho-sel'); if(!sel)return;
  var sid=sel.value, name=sel.options[sel.selectedIndex].getAttribute('data-name');
  closeM(); _handoverTo(id,sid,name);
}
function _handoverTo(id,sid,name){
  var it=items[id]; if(!it)return;
  if((it.mgr_main&&it.mgr_main.sid)===sid){ return; }
  var old={sid:(it.mgr_main&&it.mgr_main.sid)||'',name:(it.mgr_main&&it.mgr_main.name)||'—'};
  var subs=(it.mgr_subs||[]).filter(function(s){return s.sid!==sid;});   // 새 주담당은 부담당에서 제외
  patchItem(id,{mgr_main:{sid:sid,name:name},mgr_subs:subs,
    ho:{from:old,to:{sid:sid,name:name},at:new Date().toISOString(),confirmed:false}}).then(function(ok){
    if(!ok)return;   // 담당 변경이 실패했으면 감사 로그를 남기지 않는다
    addLog(id,'담당 '+old.name+' → '+name+' (인수 확인 대기)',todayStr(),'ho');
    toast('🔄 담당 변경: '+name+' — 인수 확인 대기'); if(S.drawerId===id)renderDrawer(); route();
  });
}
function confirmHo(id){
  var it=items[id]; if(!it||!it.ho)return;
  var ho=Object.assign({},it.ho,{confirmed:true,confirmed_at:new Date().toISOString()});
  patchItem(id,{ho:ho}).then(function(ok){ if(!ok)return;
    addLog(id,'인수 확인 — '+((S.me&&S.me.name)||''),todayStr(),'ho');
    toast('📥 인수 확인 완료'); renderDrawer(); route();
  });
}
function saveRetro(id){

  var note=Object.assign({},(items[id]&&items[id].ho_note)||{});
  var r=Object.assign({},note.retro||{});

function aiProxyUrl(){
  try{
    // 이 기기 설정 우선, 없으면 포털 ⚙설정의 공용값(data/app_config)
    var raw=localStorage.getItem('pureun_v6_setting_ai_proxy_url')||localStorage.getItem('pureun_v6_ai_proxy_url')
            ||(window.PU_CFG&&window.PU_CFG.aiProxyUrl)||'';
    if(!raw) return '';
    if(raw.charAt(0)==='"'){ try{ return JSON.parse(raw); }catch(e){ return raw.replace(/^"|"$/g,''); } }
    return raw;
  }catch(e){ return ''; }
}
function aiConsent(){

    .then(function(ok){ if(ok) localStorage.setItem('work_ai_ok','1'); return ok; });

/* 바깥으로 나가는 부름은 이것 하나뿐이다(AI 프록시). 시간 제한이 없으면
   답이 안 올 때 «영영» 기다린다 — 「기록·노트·회고를 읽고 있습니다…」 창은
   닫는 단추가 없어서 그대로 갇히고, 단추들은 눌린 채로 멈춘다.
   답만 오면(늦게라도 실패로) 부른 쪽들은 스스로 되돌아온다 — 이미 그렇게 짜여 있다. */
var AI_WAIT_MS=60000;
function aiFetch(url,opts){
  if(typeof AbortController==='undefined') return fetch(url,opts);   // 아주 옛 브라우저
  var ac=new AbortController();
  var timer=setTimeout(function(){ ac.abort(); }, AI_WAIT_MS);
  var o={}; for(var k in opts){ if(Object.prototype.hasOwnProperty.call(opts,k)) o[k]=opts[k]; }
  o.signal=ac.signal;                                  // 넘겨받은 것은 고치지 않는다
  return fetch(url,o).then(function(r){ clearTimeout(timer); return r; },
    function(e){
      clearTimeout(timer);
      if(e&&e.name==='AbortError'){
        var t=new Error(Math.round(AI_WAIT_MS/1000)+'초 안에 답이 오지 않았습니다 — 잠시 뒤 다시 해 주세요');
        t.timeout=true; throw t;
      }
      throw e;
    });
}
function aiCall(system,userText){
  var url=aiProxyUrl();
  /* ⚠ 넣는 자리는 «포털»의 ⚙ 설정 뿐이다(관리자만 보인다). 푸른이알피 환경설정에는
     그 칸이 없다 — 엉뚱한 곳을 가리키면 찾다가 못 찾고 포기한다. */
  if(!url) return Promise.reject(new Error('AI 프록시 주소가 없습니다 — 시작 화면(포털) 왼쪽 아래 [⚙ 설정] → 「AI 프록시 주소」에 등록하세요 (대표만 보입니다)'));
  var i=0;
  function attempt(){
    return aiFetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:AI_MODELS[i],max_tokens:8000,system:system,
        messages:[{role:'user',content:userText}]})})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d&&d.error) throw new Error(d.error.message||'AI 오류');
        var t=d.reply||d.text||((d.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join(''));
        if(!t) throw new Error('AI 응답이 비어 있습니다');
        return t;
      })
      .catch(function(e){
        // ⚠ 끊긴 것은 «모델 탓»이 아니다. 다음 모델로 다시 걸면 1분을 또 기다린다.
        if(e&&e.timeout) throw e;
        if(i<AI_MODELS.length-1){ i++; return attempt(); }   // 프록시가 모델을 제한하면 다음 모델로
        throw e;
      });
  }
  return attempt();
}
function aiJson(text){
  var s=String(text||''), a=s.indexOf('{'), b=s.lastIndexOf('}');
  if(a<0||b<a) throw new Error('AI 응답을 해석할 수 없습니다');
  return JSON.parse(s.slice(a,b+1));
}
function aiContext(id){
  var it=items[id]||{}, logs=itemLogsCache[id]||{};
  var arr=Object.keys(logs).map(function(k){return logs[k];})
    .sort(function(a,b){return (a.d||'').localeCompare(b.d||'');});
  var L=['[업무]','구분: '+(it.cat||''),'기업/대상: '+(it.company||it.client||''),
    '업무명: '+(it.title||''),'업무 요약: '+(briefTrim(it.brief)||'—'),
    '의뢰인: '+(it.client||'—'),'상대기관 담당: '+(it.officer||'—'),
    '관리번호: '+(it.no||''),'시작일: '+(it.start||'—'),'기한: '+(it.due||'—'),
    '상태: '+(it.status||''),'담당: '+((it.mgr_main&&it.mgr_main.name)||'—'),
    '다음 할 일: '+((it.next&&it.next.text)||'—')+' '+((it.next&&it.next.date)||''),
    // 사건 단계 기한 — 복사해서 옮길 때 이 줄이 빠지면 기한을 놓친다
    '단계 기한: '+(it.pe_due&&it.pe_due.date
      ? (it.pe_due.date+' '+(it.pe_due.label||'')+(it.pe_due.verified===true?'':'(확인 필요)'))
      : '—'),
    '','[진행 기록 — 오래된 순, 총 '+arr.length+'건]'];
  arr.forEach(function(l){ L.push((l.d||'')+' : '+(l.t||'')+(l.byName?' ('+l.byName+')':'')); });
  return L.join('\n');
}

function saveAiQa(id,n){

/* 틀고정 붙이기 — 위 막대·접힌 머리의 실제 높이를 재서 CSS 에 넘긴다.
   숫자로 박아 두면 위 막대가 한 줄 늘어나는 날 표 머리행이 어긋나 가려진다. */
function hoStick(){
  var el=$('hohead'); if(!el) return;
  var tb=$('topbar');
  var th=tb?Math.round(tb.getBoundingClientRect().height):38;
  var r=document.documentElement.style;
  r.setProperty('--topbarh',th+'px');
  // 위 영역이 제자리를 지나 붙는 순간부터 줄인다
  var slim=(window.scrollY||document.documentElement.scrollTop||0)>40;
  el.classList.toggle('slim',slim);
  r.setProperty('--hoheadh',Math.round(el.getBoundingClientRect().height)+'px');
  // 카드 머리 높이 — 표 머리행이 그 아래에 붙어야 한다. 이름이 길어 줄이 접히면
  // 높이가 달라지므로 숫자로 박지 않고 실제로 잰다.
  var hc=document.querySelector('#app .hocard .hct');
  r.setProperty('--hcth',(hc?Math.round(hc.getBoundingClientRect().height):34)+'px');
}
window.addEventListener('scroll',function(){ if($('hohead')) hoStick(); },{passive:true});
window.addEventListener('resize',function(){ if($('hohead')) hoStick(); });
function addLeaving(){

   주담당이 빠지는 것은 「후임 지정」이 맡는다. 부담당은 넘길 일이 없고
   이름만 떼면 되는데, 건별로 드로어를 열어 지우는 수밖에 없었다.
   [이름, 그 사람이 부담당인 진행 중 업무들] 을 이름순으로 준다. */
function orphanSubs(staff){
  var act={}; (staff||[]).forEach(function(u){ if(u&&u.name) act[u.name]=1; });
  var m={};

/* ── 진행 단계 = 하위 할 일 + 유형별 템플릿 ──────────────────────────
   업무 1건에 `다음 할 일` 하나만 적을 수 있어 "부당해고는 이 순서로"를 담을
   곳이 없었다. 사건을 열면 해야 할 일이 순서대로 깔려 있게 한다.
   `work_erp/steps/{업무ID}/{단계ID}` = {t제목, g묶음이름, o순서, done, d기한, by, at}
   items와 분리한 이유: 체크 한 번에 items 전체가 모든 화면으로 다시 밀려가는 것을
   막는다. 전체 용량이 작아(건당 8개 × 80B) live 구독해도 부담이 없고,
   목록의 진행률·캘린더 표시가 항상 최신이라 별도 집계 필드가 필요 없다.
   ⚠ 기본 템플릿은 박재원 노무사 노션 화면에 있는 부당해고 단계 그대로다.
     다른 유형은 만들어 넣지 않는다 — 절차를 지어내면 안 된다.
     실제 업무의 단계를 [템플릿으로 저장]해 늘려 간다. */
var TPL_BUILTIN=[
  {id:'_buhae', cat:'부해', name:'부당해고 구제신청', src:'기본 제공',
   g:[['1. 수임 및 노동위원회 접수',
       ['상담일지 작성','위임 및 서류 날인','자료수집','조사관 배정 확인 또는 초기 연락','초기 서면 및 대리인 서류 제출']],
      ['2. 서면 공방',
       ['입증 자료수집','상대방 서면 수령 및 검토','서면 작성 및 제출']]]}
];
var steps={}, tpls={};

function stepsOf(id){
  var o=steps[id]||{};
  return Object.keys(o).map(function(k){ var s=o[k]; if(!s||!s.t) return null; s._id=k; return s; })
    .filter(Boolean)
    .sort(function(a,b){ return (a.o||0)-(b.o||0)||String(a.t).localeCompare(String(b.t),'ko'); });
}
function stepProg(id){
  var a=stepsOf(id);
  return {d:a.filter(function(s){return s.done;}).length, t:a.length};
}
function stepChip(id){
  var p=stepProg(id); if(!p.t) return '';
  return ' <span class="stchip'+(p.d===p.t?' done':'')+'" title="진행 단계 '+p.d+'/'+p.t+'">'
    +(p.d===p.t?'✓ ':'')+p.d+'/'+p.t+'</span>';
}
// 내장 + 사용자 저장 템플릿
function tplAll(){
  var out=TPL_BUILTIN.slice();
  Object.keys(tpls||{}).forEach(function(k){
    var t=tpls[k]; if(t&&t.name&&t.g&&t.g.length){ t=Object.assign({},t); t.id=k; out.push(t); }
  });
  return out;
}
function tplFor(cat){
  var all=tplAll();
  var hit=all.filter(function(t){ return t.cat&&t.cat===cat; });
  return hit.concat(all.filter(function(t){ return hit.indexOf(t)<0; }));
}
function _stepPaths(id,groups){
  // groups = [[묶음이름,[제목,...]], ...] → 저장 경로
  var up={}, o=0;
  groups.forEach(function(g,gi){
    (g[1]||[]).forEach(function(t){
      o++;
      up[NS+'/steps/'+id+'/'+rid('S')]={t:t,g:g[0],o:(gi+1)*1000+o,done:0,d:''};
    });
  });
  return up;
}
function applyTpl(id,tplId){
  var t=tplAll().filter(function(x){return x.id===tplId;})[0];
  if(!t){ toast('템플릿을 찾을 수 없습니다','warn'); return; }
  var cur=stepsOf(id);
  var go=function(){
    var up=_stepPaths(id,t.g);
    var n=Object.keys(up).length;
    fbDb.ref().update(up).then(function(){
      closeM(); toast('✅ '+t.name+' — 단계 '+n+'개를 깔았습니다'); renderDrawer(); route();
    }).catch(function(e){ toast('실패: '+e.message,'err'); });
  };
  if(!cur.length){ go(); return; }
  confirmM('이미 단계 '+cur.length+'개가 있습니다.\n\n템플릿의 단계를 <b>뒤에 덧붙입니다</b>. 계속할까요?'
    .replace(/<[^>]+>/g,''),{ok:'덧붙이기'}).then(function(ok){ if(ok) go(); });
}
function stepToggle(id,sid){
  var s=(steps[id]||{})[sid]; if(!s) return;
  var done=s.done?0:1;
  var up={};
  up[NS+'/steps/'+id+'/'+sid+'/done']=done;
  up[NS+'/steps/'+id+'/'+sid+'/by']=done?((S.me&&S.me.name)||''):null;
  up[NS+'/steps/'+id+'/'+sid+'/at']=done?todayStr():null;
  fbDb.ref().update(up).catch(function(e){ toast('실패: '+e.message,'err'); });
}
function stepDate(id,sid,v){
  fbDb.ref(NS+'/steps/'+id+'/'+sid+'/d').set(v||null)
    .catch(function(e){ toast('실패: '+e.message,'err'); });
}
function stepAdd(id,group){
  var el=$('sa-'+safeKey(group)); var t=el?el.value.trim():'';
  if(!t) return;
  var same=stepsOf(id).filter(function(s){return s.g===group;});
  var last=same.length?same[same.length-1].o:0;
  var base=last||(stepsOf(id).length+1)*1000;
  fbDb.ref(NS+'/steps/'+id+'/'+rid('S')).set({t:t,g:group,o:base+1,done:0,d:''})
    .then(function(){ if(el)el.value=''; renderDrawer(); route();
      setTimeout(function(){ var e2=$('sa-'+safeKey(group)); if(e2)e2.focus(); },50); })
    .catch(function(e){ toast('실패: '+e.message,'err'); });
}
function stepDel(id,sid){
  fbDb.ref(NS+'/steps/'+id+'/'+sid).remove().catch(function(e){ toast('실패: '+e.message,'err'); });
}
function stepToNext(id,sid){
  var s=(steps[id]||{})[sid]; if(!s) return;
  patchItem(id,{next:{date:s.d||'',text:s.t}}).then(function(ok){
    if(!ok) return; toast('📌 다음 할 일로 — '+s.t); renderDrawer(); route();
  });
}
function stepClear(id){
  confirmM('이 업무의 진행 단계를 모두 지울까요?\n\n되돌릴 수 없습니다.',{ok:'모두 삭제',danger:true})
    .then(function(ok){ if(!ok)return;
      fbDb.ref(NS+'/steps/'+id).remove()
        .then(function(){ toast('단계를 모두 지웠습니다'); renderDrawer(); route(); })
        .catch(function(e){ toast('실패: '+e.message,'err'); });
    });
}
// 실제로 쓴 단계를 템플릿으로 만들어 다음 사건부터 재사용한다
function saveAsTpl(id){
  var it=items[id]||{}, arr=stepsOf(id);
  if(!arr.length){ toast('저장할 단계가 없습니다','warn'); return; }
  var gs=[], idx={};
  arr.forEach(function(s){
    var g=s.g||'단계';
    if(idx[g]===undefined){ idx[g]=gs.length; gs.push([g,[]]); }
    gs[idx[g]][1].push(s.t);
  });

/* ── 캘린더 (월·주·일 + 레이어 체크) ─────────────────────────────────

   저장되므로 사람마다 다르게 볼 수 있다(대표는 전원 겹쳐 보기, 담당자는 자기 것만).

     erp 는 읽기만 하는 것. 묶음 이름이 앞에 붙으므로 칩 이름에서 겹치는 말은 뺀다
     (「업무 기한」→「기한」). 긴 이름(CAL_NAME)은 달력 안 일정 글자에 그대로 쓴다. */

   읽기 전용이라는 설명은 화면에 깔지 않고 ⓘ 로 넣는다 (전에는 아래 한 줄을 더 썼다). */

// co_id(푸른이알피 companyId) 우선, 없으면 정규화한 업체명으로 찾는다
function coFind(it){
  if(!coSrc||!coSrc.length||!it) return null;
  if(it.co_id){
    var b=coSrc.filter(function(c){ return c&&c.id===it.co_id; })[0];
    if(b) return b;
  }
  var n=_normCo(it.company); if(!n) return null;
  return coSrc.filter(function(c){ return c&&_normCo(c.name||c.companyName)===n; })[0]||null;
}
// 연동된 푸른이알피 원본 레코드
function peRec(it){
  if(!it||!peLinked(it)) return null;
  var arr=peMaster[it.ref.type]; if(!arr) return null;
  for(var i=0;i<arr.length;i++){ if(arr[i]&&String(arr[i].id)===String(it.ref.id)) return arr[i]; }
  return null;
}
// 담당자는 두 곳에 있다.
//  ① 그 사업 레코드 안의 company.contacts — 푸른이알피 수정화면의 "회사정보" 상자
//  ② 업체관리(companies) 마스터
// ①이 그 건에 실제로 쓰는 연락처이므로 먼저 본다. 예전엔 ②만 봐서 담당자가
// 버젓이 있는데도 "업체관리에 등록 없음"으로 나왔다.
function _cList(o){
  if(!o) return [];
  if(o.contacts&&o.contacts.length) return o.contacts.filter(function(c){ return c&&(c.name||c.phone||c.email); });
  if(o.contactName||o.contactPhone)
    return [{name:o.contactName||'',role:'',phone:o.contactPhone||'',email:o.contactEmail||''}];
  return [];
}
/* 담당자의 '직책'이 저장된 칸이 세 가지다.
     position … 업체관리 담당자 편집칸 (앞으로의 공통 이름)
     role     … 계약모달 회사정보 담당자칸 (옛 이름, 실데이터가 많다)
     rank     … 이 화면의 건별 담당자칸 (옛 이름)
   ⚠ 이 함수와 똑같은 것이 pu-erp.html 에도 있다(같은 이름·같은 순서). 두 파일은
     코드를 나눠 쓸 수 없어 복사해 두었다 — 한쪽을 고치면 다른 쪽도 고쳐야 한다.
   ⚠ 쓸 때는 position 이 기준이다(rank 는 옛 데이터를 위해 함께 적는다). */
function contactRole(c){ return (c&&(c.position||c.role||c.rank))||''; }
function coContacts(it){
  var r=peRec(it);
  var a=_cList(r&&r.company);
  if(a.length){ a.forEach(function(c){ c._src='이 건'; }); return a; }
  // 이관본(사건·컨설팅·기금·기타)은 contacts 를 레코드 최상위에 둔다 — company 상자가 없다.
  // 그래서 여기서 한 번 더 잡아야 이관된 건의 담당자가 보인다(전에는 통째로 안 보였다).
  var a2=_cList(r);
  if(a2.length){ a2.forEach(function(c){ c._src='이 건'; }); return a2; }
  var b=_cList(coFind(it));
  b.forEach(function(c){ c._src='업체관리'; });
  return b;
}
/* 이 건 담당자 — 여러 명. 옛 데이터는 it.contact 한 명뿐이라 그것도 읽는다. */
function itemContacts(it){
  if(!it) return [];
  if(it.contacts&&it.contacts.length) return it.contacts.filter(function(c){ return !!c; });
  var c=it.contact;
  if(c&&(c.name||c.phone||contactRole(c))) return [c];
  return [];
}
// 같은 사람인가 — 이름(공백 제거) + 전화(숫자만). pu-erp 의 _normPersonKey 와 같은 규칙이다
function _ctKey(c){

    +'|'+String((c&&c.phone)||'').replace(/[^0-9]/g,'');

function telHref(p){ return String(p||'').replace(/[^0-9+]/g,''); }
// 드로어: 사업장 담당자 + 담당(주/부). 부담당은 여기서 여러 명 지정한다
// (등록 폼은 1명만 고를 수 있어 연동 건의 공동작업자를 늘릴 수단이 없었다)
/* 상대기관 — 노동청·노동위원회와 그쪽 담당자(감독관·조사관).

function _subOpts(it){

  if(it.mgr_main&&it.mgr_main.sid) used[it.mgr_main.sid]=1;
  (it.mgr_subs||[]).forEach(function(s){ if(s&&s.sid) used[s.sid]=1; });
  return (_staffCache||[]).filter(function(u){ return !used[u.sid]; })

/* 이 건 담당자 저장 — 화면에 그려진 줄을 모두 읽어 배열로 담는다.
   ⚠ 다시 그리지 않는다(renderDrawer 없음) — 적는 중에 다시 그리면 포커스가 날아간다.
   ⚠ contact(단수)는 contacts[0]과 늘 같게 둔다. 검색·푸른이알피 연동이 아직 그 칸을 본다. */
function _ctRows(){
  var out=[];
  for(var i=0;;i++){
    var e=$('ct-nm-'+i); if(!e) break;
    var g=function(k){ var x=$(k+'-'+i); return x?x.value.trim():''; };
    out.push({name:e.value.trim(), rank:g('ct-rk'), phone:g('ct-ph')});
  }
  return out;
}
// 화면에 그리는 줄 수 — 빈 줄 한 줄은 늘 있다. 그리는 쪽과 [＋ 추가]가 같은 셈을 봐야 어긋나지 않는다
function _ctRowCount(id){
  return Math.max(1, itemContacts(items[id]||{}).length+((S._ctAdd&&S._ctAdd[id])||0));
}
function _ctSave(id,arr,msg){
  // 줄이 화면에 없으면 아무것도 하지 않는다 — 빈 화면을 읽어 담당자를 지우는 사고를 막는다
  if(!$('ct-nm-0')) return Promise.resolve(false);
  // 직책은 rank(옛 칸)와 position(푸른이알피 공통 칸) 둘 다 적는다
  var clean=arr.filter(function(c){ return c&&(c.name||c.rank||c.phone); })
    .map(function(c){ return {name:c.name||'', rank:c.rank||'', position:c.rank||'', phone:c.phone||''}; });
  if(S._ctAdd) S._ctAdd[id]=0;
  if(!clean.length&&!itemContacts(items[id]||{}).length) return Promise.resolve(true);   // 원래 비었다 — 쓸 것이 없다
  return patchItem(id,{contacts:clean.length?clean:null, contact:clean[0]||null})
    .then(function(ok){ if(ok&&msg) toast(msg); return ok; });
}
function saveContactAt(id,i){ return _ctSave(id,_ctRows(),'👤 담당자 저장됨 ('+(i+1)+'번째 줄)'); }
function contactAdd(id){
  // 적던 줄을 먼저 저장한다 — 다시 그리면 저장 안 한 글자가 날아간다
  _ctSave(id,_ctRows()).then(function(){
    S._ctAdd=S._ctAdd||{};
    var shown=_ctRowCount(id);
    S._ctAdd[id]=(shown+1)-itemContacts(items[id]||{}).length;   // 한 줄 더
    renderDrawer();
    var e=$('ct-nm-'+shown); if(e) e.focus();
  });
}
function contactDelAt(id,i){
  var arr=_ctRows();
  var g=arr.splice(i,1)[0]||{};
  _ctSave(id,arr).then(function(ok){
    if(!ok) return; toast('담당자에서 뺐습니다 — '+(g.name||'빈 줄')); renderDrawer(); route();
  });
}
function saveContactClear(id){
  var n=itemContacts(items[id]||{}).length;
  // 여러 명이면 한 번 묻는다 — 한꺼번에 사라지는 것을 모르고 누를 수 있다
  var ask=(n>1)?confirmM('이 건 담당자 '+n+'명을 모두 비웁니다.',{ok:'모두 비우기',danger:true})
               :Promise.resolve(true);
  ask.then(function(yes){
    if(!yes) return;
    if(S._ctAdd) S._ctAdd[id]=0;
    patchItem(id,{contact:null,contacts:null}).then(function(ok){
      if(!ok) return; toast('담당자 칸을 비웠습니다'); renderDrawer(); route();
    });

}
/* ── 명함첩에서 담당자 찾아 넣기 ────────────────────────────────
   담당자 이름·연락처를 손으로 옮겨 적고 있었다. 명함첩(pu-cards)이
   이미 검색용 색인 pucards/idx를 따로 두고 있어 그것만 읽으면 된다.
   idx 한 건 = {n 이름, c 회사, m 휴대폰, t 전화, e 메일, ti 직급, d 부서,
                ct 회사전화, ad 주소, k 'card'|'biz'}
   ⚠ 읽기만 한다 — 명함은 명함첩에서 고친다. */
var cardIdx=null, _cardT=null;
// 명함 한 장 → 우리가 쓰는 모양. 색인(idx)과 본문(items)의 칸 이름이 달라 여기서 맞춘다.
function _cardRow(k,v,fromIdx){
  if(!v) return null;
  var r=fromIdx
    ?{_id:k,n:v.n,c:v.c,m:v.m,t:v.t,e:v.e,ti:v.ti,d:v.d,ct:v.ct,k:v.k,sc:''}
    :{_id:k,n:v.name,c:v.company,m:v.mobile,t:v.tel,e:v.email,ti:v.title,d:v.dept,
      ct:v.companyTel,k:(v.kind==='biz'?'biz':'card'),sc:v.scope||''};
  if(r.k==='biz') return null;                    // 사업자등록증은 사람이 아니다
  if(r.sc==='private') return null;               // 명함첩에서 '개인'으로 숨긴 사람
  if(!String(r.n||'').trim()&&!String(r.c||'').trim()) return null;
  return r;
}
function cardLoad(){
  if(cardIdx) return Promise.resolve(cardIdx);
  if(_cardT) return _cardT;
  function pack(v,fromIdx){
    var out=[];
    Object.keys(v||{}).forEach(function(k){ var r=_cardRow(k,v[k],fromIdx); if(r) out.push(r); });
    out.sort(function(a,b){ return String(a.n||'').localeCompare(String(b.n||''),'ko'); });
    return out;
  }
  // 본문을 읽는다. 색인(idx)은 명함을 저장할 때만 갱신돼 빠진 사람이 생긴다.
  _cardT=fbDb.ref('pucards/items').once('value').then(function(s){
    var a=pack(s.val(),false);
    if(a.length){ cardIdx=a; _cardT=null; return a; }
    // 본문이 비면(권한 등) 색인이라도 — 다만 '개인' 표시가 없어 숨김을 가릴 수 없다
    return fbDb.ref('pucards/idx').once('value').then(function(s2){
      cardIdx=pack(s2.val(),true); _cardT=null; return cardIdx;
    });
  }).catch(function(){
    return fbDb.ref('pucards/idx').once('value').then(function(s2){
      cardIdx=pack(s2.val(),true); _cardT=null; return cardIdx;
    }).catch(function(){ cardIdx=[]; _cardT=null; return cardIdx; });
  });
  return _cardT;
}
function cardPhone(r){ return r.m||r.t||r.ct||''; }
function cardMatch(r,q){
  if(!q) return true;
  var hay=[r.n,r.c,r.ti,r.d,r.e].join(' ').toLowerCase();
  if(hay.indexOf(q)>=0) return true;
  var digits=q.replace(/[^0-9]/g,'');
  if(digits.length<3) return false;               // 두 자리로는 아무거나 걸린다
  return [r.m,r.t,r.ct].join('').replace(/[^0-9]/g,'').indexOf(digits)>=0;
}
/* 담당 회사 사람을 앞줄에, 그 밖의 사람은 찾을 때만.
   ⚠ 전체를 쏟아 놓지 않는다. 명함첩에는 휴대폰에서 옮겨 온 개인 연락처가
     섞여 있어("♥사랑하는…", "ㄱ어머니") 사업장 담당자를 고르는 자리에는
     방해만 된다. 회사가 없는 명함은 기본으로 감추고, 원하면 펼쳐 본다. */
/* 누구나 쓰는 메일 — 이것으로는 같은 회사라고 볼 수 없다 */
var MAIL_COMMON={'naver.com':1,'gmail.com':1,'hanmail.net':1,'daum.net':1,'nate.com':1,
  'kakao.com':1,'outlook.com':1,'hotmail.com':1,'yahoo.com':1,'icloud.com':1,'korea.com':1};
function mailDom(e){
  var m=/@([^@\s]+)$/.exec(String(e||'').trim().toLowerCase());
  return (m&&!MAIL_COMMON[m[1]])?m[1]:'';
}
/* 이름이 비슷한 회사인가. 한쪽이 다른 쪽을 품으면 같은 무리로 본다
   (별표수세미 ↔ 별표수세미산업). 두 글자 미만은 아무 데나 걸려 뺀다. */
function coAkin(a,b){
  a=_normCo(a); b=_normCo(b);
  if(!a||!b||a===b) return false;
  var s=(a.length<b.length)?a:b, l=(a.length<b.length)?b:a;
  return s.length>=2&&l.indexOf(s)>=0;
}
/* ⚠ 비슷한 회사를 따로 두는 이유: 계열사·같은 무리 회사의 담당자가 이 회사도
     함께 맡는 일이 흔하다. 회사 이름이 딱 맞지 않는다고 감추면 그 사람을
     영영 못 찾는다. 이름이 비슷하거나, 그 회사 사람과 메일 도메인이 같으면
     같은 무리로 본다(naver·gmail 같은 공용 메일은 뺀다). */
function cardFind(q,co,limit,withNoCo){
  q=String(q||'').trim().toLowerCase();
  var key=_normCo(co||''), mine=[], akin=[], rest=[], noCo=0, doms={};
  var all=cardIdx||[];
  if(key) all.forEach(function(r){
    if(_normCo(r.c)===key){ var d=mailDom(r.e); if(d) doms[d]=1; }
  });
  all.forEach(function(r){
    if(!cardMatch(r,q)) return;
    if(key&&_normCo(r.c)===key){ mine.push(r); return; }
    if(key&&String(r.c||'').trim()&&(coAkin(co,r.c)||doms[mailDom(r.e)])){ akin.push(r); return; }
    if(!q) return;                                // 검색 전에는 남을 늘어놓지 않는다
    if(!String(r.c||'').trim()){ noCo++; if(!withNoCo) return; }
    rest.push(r);
  });
  function ord(a,b){
    // 검색했을 때는 사람 이름이 맞은 것을 앞에, 그다음 회사·이름 가나다순
    var sa=(q&&String(a.n||'').toLowerCase().indexOf(q)>=0)?0:1;
    var sb=(q&&String(b.n||'').toLowerCase().indexOf(q)>=0)?0:1;
    return sa-sb||String(a.c||'').localeCompare(String(b.c||''),'ko')
      ||String(a.n||'').localeCompare(String(b.n||''),'ko');
  }
  mine.sort(ord); akin.sort(ord); rest.sort(ord);
  return {mine:mine, akin:akin, rest:limit?rest.slice(0,limit):rest,
    restAll:rest.length, noCo:noCo};
}

  if(S._cardFor!==id) S._cardNoCo=false;
  S._cardFor=id;
  // 검색어는 비워 둔 채로 연다 — 회사 이름을 넣어 두면 명함첩의 회사 표기가
  // 조금만 달라도 "없습니다"가 됐다. 담당 회사 사람은 아래에서 따로 앞세운다.

  showModal('<h2 style="margin:0 0 4px">📇 명함첩에서 찾기</h2>'

    +'명함 자체는 <b>명함첩에서</b> 고칩니다.</p>'
    +'<input id="cd-q" value="'+esc(q2)+'" placeholder="🔍 이름·회사·전화번호 — 비워 두면 전체" '
    +'oninput="onCardQ(this.value)" style="width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px">'
    +'<div style="max-height:330px;overflow-y:auto;margin-top:10px">'
    +(cardIdx.length?'':'<div class="kbempty">명함첩을 읽지 못했습니다. 같은 브라우저에서 <b>명함첩을 한 번 열고</b> 다시 시도해 주세요.</div>')
    +(co?'<div class="phd">● '+esc(co)+' '+r.mine.length+'명</div>'
        +(r.mine.length?r.mine.map(row).join('')
          :'<div class="kbempty">이 회사로 등록된 명함이 없습니다. 아래에서 찾아보세요.</div>'):'')
    // 계열사·같은 무리 회사의 담당자가 이 회사도 함께 맡는 일이 흔하다
    +(r.akin.length?'<div class="phd" title="이름이 비슷하거나 메일 주소가 같은 회사 — 같은 담당자가 함께 맡는 일이 있습니다">'
        +'◐ 비슷한 회사 '+r.akin.length+'명</div>'+r.akin.map(row).join(''):'')
    // 검색 전에는 남의 명함을 늘어놓지 않는다 — 개인 연락처까지 섞여 방해만 된다
    +(!q2?'<div class="phd">○ 그 밖의 사람</div>'
        +'<div class="kbempty">이름·회사·전화번호를 적으면 명함첩 전체('

        +(more>0?'<div class="muted" style="font-size:11.5px;padding:6px 2px">…외 '+more+'명. 더 적어 좁혀 보세요.</div>':'')
        +(r.noCo?'<div style="padding:6px 2px"><span class="chipbtn'+(S._cardNoCo?' on':'')
          +'" onclick="S._cardNoCo=!S._cardNoCo;cardModal(\''+escJ(id)+'\')" '
          +'title="회사 이름이 없는 명함은 휴대폰에서 옮겨 온 개인 연락처인 경우가 많습니다">'

    +'<div class="row" style="justify-content:flex-end;margin-top:12px">'
    +'<button onclick="window.open(\'pu-cards.html?sso=1&q='+encodeURIComponent(q2)+'\',\'_blank\')" '
    +'title="명함첩을 열어 새 명함을 등록하거나 고칩니다">📇 명함첩 열기</button>'
    +'<button onclick="closeM()">닫기</button></div>');
  var el=$('cd-q'); if(el){ el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(e){} }

var _cardQT=null;
function onCardQ(v){ S._cardQ=v; clearTimeout(_cardQT);
  _cardQT=setTimeout(function(){ if(S._cardFor) cardModal(S._cardFor); },220); }
/* 명함첩에서 고른 사람은 '한 명 더'로 붙인다 — 담당자를 여러 명 둘 수 있게 됐으므로
   지금 적어 둔 사람을 덮어쓰지 않는다(안전쪽). 특정 줄만 바꾸려면 그 줄을 ×로 지우고 다시 고른다. */
function cardPick(cid){
  var id=S._cardFor, c=(cardIdx||[]).filter(function(x){ return x._id===cid; })[0];
  if(!id||!c){ toast('명함을 찾을 수 없습니다','warn'); return; }
  var _rk=[c.d,c.ti].filter(Boolean).join(' ').trim();
  var rec={name:String(c.n||'').trim(),
           rank:_rk, position:_rk,      // rank=옛 칸(그대로 둔다), position=푸른이알피가 읽는 칸
           phone:cardPhone(c)};
  if(!rec.name&&!rec.rank&&!rec.phone){ toast('이 명함에는 담을 내용이 없습니다','warn'); return; }
  var arr=itemContacts(items[id]||{}).slice();
  if(arr.some(function(x){ return _ctKey(x)===_ctKey(rec); })){
    closeM(); toast('이미 담당자로 들어 있습니다','warn'); return;
  }
  arr.push(rec);
  if(S._ctAdd) S._ctAdd[id]=0;                     // 저장 전 빈 줄은 정리한다
  patchItem(id,{contacts:arr,contact:arr[0]||null}).then(function(ok){
    if(!ok) return;
    closeM(); toast('📇 '+(rec.name||'담당자')+' — 담당자로 넣었습니다 (지금 '+arr.length+'명)');
    renderDrawer(); route();
  });
}
function subAdd(id,sel){
  var sid=sel.value; if(!sid) return;
  var nm=sel.options[sel.selectedIndex].getAttribute('data-n')||'';
  var arr=((items[id]||{}).mgr_subs||[]).slice();
  if(arr.some(function(s){ return s&&s.sid===sid; })){ sel.value=''; return; }
  arr.push({sid:sid,name:nm});
  patchItem(id,{mgr_subs:arr}).then(function(ok){
    if(!ok) return;
    toast('👥 부담당 추가 — '+nm+' 님의 내 업무에도 나타납니다');
    renderDrawer(); route();
  });
}
function subDel(id,i){
  var arr=((items[id]||{}).mgr_subs||[]).slice();
  var g=arr.splice(i,1)[0]||{};
  patchItem(id,{mgr_subs:arr}).then(function(ok){
    if(!ok) return; toast('부담당 제외 — '+(g.name||'')); renderDrawer(); route();
  });
}

/* ── 지식 카드 = 암묵지 저장소 ────────────────────────────────────────
   문제: 기록·노트가 전부 건(item)에 묶여 있어, 건이 종료되면 보관함에 묻힌다.
   같은 감독관·같은 업체·같은 유형을 다시 만나도 꺼내 쓸 수 없다.
   해결: 오래 사는 대상(사람·업체·유형·기관)에 카드를 붙인다.
   `work_erp/kb/{종류}/{키}/{카드ID}` = {t제목, x본문, kl키이름, by, byName, at,
     src{item,title}, flags[]}  — 어느 건에서 얻었는지 링크가 남는다.
   ⚠ 새로 쓰게 하지 않는다 — 기록·노트의 한 줄을 "승격"하는 것이 기본 입력 경로다.
   ⚠ 사람 카드는 실명 인물에 대한 서술이다. 인물 평가가 아니라 행동 지침으로
     쓰도록 입력 화면에서 안내한다("까다롭다" ✕ → "통화로 먼저 설명하면 빠르다" ○). */
var KB_KINDS=[
  ['person','사람','👤','감독관·조사관·업체 담당자 — 연락 방식, 무엇을 중요하게 보는지'],
  ['company','업체','🏢','그 사업장의 특성·과거 이력·자료 받는 경로'],
  ['cat','유형','📚','진행 순서·필수 서류·흔한 함정 (플레이북)'],
  ['office','기관','🏛','지청·공단 지사의 접수 관행·처리 기간·서식 선호']
];
var KB_KLBL={}; KB_KINDS.forEach(function(k){ KB_KLBL[k[0]]=k[1]; });
var KB_STALE_DAYS=730;                       // 2년 — 그때 맞던 관행이 지금 틀릴 수 있다
var kb={};

function kbKey(s){ return safeKey(String(s||'').trim()); }
function kbCoKey(it){ return it&&(it.co_id?kbKey(it.co_id):kbKey(_normCo(it.company))); }
function kbCards(kind,key){
  var o=((kb[kind]||{})[key])||{};
  return Object.keys(o).map(function(id){
      var c=o[id]; if(!c||typeof c!=='object') return null;
      c._id=id; c._kind=kind; c._key=key; return c;
    }).filter(function(c){ return c&&c.t; })
    .sort(function(a,b){ return String(b.at||'').localeCompare(String(a.at||'')); });
}
function kbAll(){
  var out=[];
  Object.keys(kb||{}).forEach(function(kind){
    Object.keys(kb[kind]||{}).forEach(function(key){ out=out.concat(kbCards(kind,key)); });
  });
  return out;
}
function kbStale(c){ return !!(c.at&&(Date.now()-new Date(c.at).getTime())>KB_STALE_DAYS*86400000); }
function kbBad(c){ return ((c.flags||[]).length>0); }
// 이 업무와 관련된 카드 — 찾으러 가지 않아도 붙어 나오게 하는 것이 핵심이다
function kbRelated(it){
  if(!it) return [];
  var out=[], seen={};
  function add(arr){ arr.forEach(function(c){
    var k=c._kind+'|'+c._key+'|'+c._id; if(seen[k]) return; seen[k]=1; out.push(c); }); }
  // 플레이북은 업무 유형(부당해고·임금체불…)에 붙는다. 구분(업체·사건…)은 너무 넓다
  var pk=String(it.ptype||'').trim()||String(it.cat||'').trim();
  if(pk) add(kbCards('cat',kbKey(pk)));
  var ck=kbCoKey(it); if(ck) add(kbCards('company',ck));
  [it.officer,it.client]
    .concat(itemContacts(it).map(function(c){ return c&&c.name; }))
    .concat(coContacts(it).map(function(c){ return c&&c.name; }))
    .filter(Boolean).forEach(function(n){ add(kbCards('person',kbKey(n))); });
  // 기관은 업무에 필드가 없으므로, 카드의 기관명이 업무 텍스트에 나타나면 붙인다
  var hay=[it.company,it.title,it.officer,it.no,it.client].join(' ');
  kbAll().filter(function(c){ return c._kind==='office'&&c.kl&&hay.indexOf(c.kl)>=0; })
    .forEach(function(c){ add([c]); });
  return out;
}

      +'title="관행이 바뀌었거나 사실과 다르면 표시합니다">지금은 다름</span>')
    +(bad?'<span class="act" onclick="kbUnflag(\''+escJ(c._kind)+'\',\''+escJ(c._key)+'\',\''+escJ(c._id)+'\')">정정 해제</span>':'')
    +(canDel?'<span class="act" style="color:var(--danger)" onclick="kbDel(\''+escJ(c._kind)+'\',\''+escJ(c._key)+'\',\''+escJ(c._id)+'\')">삭제</span>':'')
    +'</div></div>';
}

function calBase(){ return new Date((S.calDate||todayStr())+'T00:00:00'); }
function calRange(){
  var d=calBase(), days=[], i;
  if(S.calView==='day') return {days:[ymd(d)],month:d.getMonth()};
  if(S.calView==='week'){ var m=mondayOf(d);
    for(i=0;i<7;i++) days.push(ymd(addDays(m,i)));
    return {days:days,month:d.getMonth()}; }
  var start=mondayOf(new Date(d.getFullYear(),d.getMonth(),1));
  var lastMon=mondayOf(new Date(d.getFullYear(),d.getMonth()+1,0));
  var wks=Math.round((lastMon-start)/604800000)+1;
  for(i=0;i<wks*7;i++) days.push(ymd(addDays(start,i)));
  return {days:days,month:d.getMonth()};
}
function calWeekKeys(R){
  var ks={}, a=R.days[0], b=R.days[R.days.length-1], d=new Date(a+'T00:00:00'), end=new Date(b+'T00:00:00');
  while(d<=end){ ks[weekKeyOf(mondayOf(d))]=1; d=addDays(d,7); }
  ks[weekKeyOf(mondayOf(end))]=1;
  return Object.keys(ks);
}
// 날짜 → 이벤트 목록
function calBuild(R){
  var L=S.calLay||{}, map={}, teamWide=(S.view==='team'), who=viewer();
  R.days.forEach(function(d){ map[d]=[]; });
  function add(d,ev){ if(map[d]) map[d].push(ev); }
  function sidOK(sid){ return teamWide||!who.sid||sid===who.sid; }
  if(L.due||L.next) openItems().forEach(function(it){
    if(!teamWide&&!isOf(it,who)) return;
    var co=it.company||it.client||it.title||'';
    if(L.due&&it.due) add(it.due,{k:'due',t:'📅 '+co,s:it.title||'',c:'#dc2626',it:it._id,drag:1});
    if(L.next&&it.next&&it.next.date)
      add(it.next.date,{k:'next',t:'📌 '+(it.next.text||'할 일'),s:co,c:'#7c3aed',it:it._id,drag:1});
  });
  // 사건 단계 기한 — 푸른이알피가 송달일·판정일에서 계산해 내려보낸 값이다.
  // 여기서 옮기면 계산 결과와 어긋나므로 끌 수 없게 둔다(drag 없음).
  if(L.sdue) openItems().forEach(function(it){
    if(!teamWide&&!isOf(it,who)) return;
    var pd=it.pe_due; if(!pd||!pd.date||!map[pd.date]) return;
    add(pd.date,{k:'sdue',t:'⚖ '+(pd.label||'단계 기한')+(pd.verified?'':'(확인)'),
      s:(it.company||it.client||it.title||''),c:pd.verified?'#b91c1c':'#b45309',it:it._id});
  });
  // 진행 단계 — 기한을 넣은 미완료 단계만 (완료된 것까지 깔리면 달력이 지저분해진다)
  if(L.step) openItems().forEach(function(it){
    if(!teamWide&&!isOf(it,who)) return;
    stepsOf(it._id).forEach(function(s){
      if(s.done||!s.d||!map[s.d]) return;
      add(s.d,{k:'step',t:'☐ '+s.t,s:(it.company||it.title||'')+(s.g?' · '+s.g:''),c:'#0284c7',it:it._id});
    });
  });
  if(L.log) calWeekKeys(R).forEach(function(wk){
    Object.keys(wkCache[wk]||{}).forEach(function(iid){
      var it=items[iid]; if(!it) return;
      if(!teamWide&&!isOf(it,who)) return;
      wkLogsOf(iid,wk).forEach(function(l){
        if(!l||!l.d||!map[l.d]) return;
        add(l.d,{k:'log',t:'✍ '+(l.t||''),s:it.company||it.title||'',c:'#0f766e',it:iid});
      });
    });
  });
  if(L.sch&&calSrc.sch) calSrc.sch.forEach(function(s){
    if(!s||!s.date||!map[s.date]) return;
    if(s.externalId){ if(!teamWide) return; }         // 외부 협력자 일정은 팀 전체에서만
    else if(!sidOK(s.sid)) return;
    add(s.date,{k:'sch',tm:s.time||'',s:s.note||'',c:'#2563eb',
      t:(s.time?s.time+' ':'')+(s.title||'일정')+(teamWide&&!s.externalId?' · '+calName(s.sid):'')});
  });
  if(L.att&&calSrc.att) calSrc.att.forEach(function(r){
    if(!r||!r.date||!map[r.date]||!ATT_LBL[r.type]||!sidOK(r.sid)) return;
    add(r.date,{k:'att',t:ATT_LBL[r.type]+(teamWide?' '+calName(r.sid):''),s:r.note||'',c:'#0891b2'});
  });
  if(L.loa&&calSrc.loa) calSrc.loa.forEach(function(l){
    if(!l||!l.startDate||!sidOK(l.sid)) return;
    var lb='🏠 '+(l.typeLabel||l.loaType||'휴직')+(teamWide?' '+calName(l.sid):'');
    if(map[l.startDate]) add(l.startDate,{k:'loa',t:lb+' 시작',c:'#94a3b8'});
    if(l.endDate&&l.endDate!==l.startDate&&map[l.endDate]) add(l.endDate,{k:'loa',t:lb+' 종료',c:'#94a3b8'});
  });
  // 사건 마감 — 자동 연동이 이미 읽어 둔 마스터를 그대로 쓴다(추가 조회 없음)
  if(L.dl&&peMaster.case) peMaster.case.forEach(function(c){
    if(!c||_peClosed(c)||!sidOK(c.managerMain)) return;
    (c.deadlines||[]).forEach(function(d){
      if(!d||!d.date||!map[d.date]) return;
      add(d.date,{k:'dl',t:'⚖ '+(c.title||c.caseNo||'사건')+' 마감',s:c.companyName||'',c:'#b45309'});
    });
  });
  var ord={}; CAL_LAYERS.forEach(function(l,i){ ord[l[0]]=i; });
  // 시간이 있는 일정이 먼저(시간순), 그 다음 레이어 순.
  // localeCompare는 쓰지 않는다 — 물결표 같은 기호를 숫자보다 앞으로 정렬해 순서가 뒤집힌다.
  Object.keys(map).forEach(function(d){
    map[d].sort(function(a,b){
      var at=a.tm||'', bt=b.tm||'';
      if(at&&bt) return at<bt?-1:(at>bt?1:ord[a.k]-ord[b.k]);
      if(at) return -1;
      if(bt) return 1;
      return ord[a.k]-ord[b.k];
    });
  });
  return map;
}

  if(!r){
    // 걸러 보기나 접힌 묶음에 가려 있을 수 있다 — 한 번은 풀어 보고 다시 찾는다
    var team=(S.view==='team');

                   :(S.calDay||S.q||S.f||S.myRole||fAny('my'));
    if(hidden&&!_calGoTry){
      _calGoTry=1; toast('걸러 보기에 가려 있어 조건을 풀었습니다');
      if(team){ S.teamFold={}; teamReset(); } else myReset();
      setTimeout(function(){ calGo(id); _calGoTry=0; },80); return;
    }
    _calGoTry=0; toast('이 화면에 없는 업무입니다','warn'); return;

function calQuick(id,el){
  var box=el&&el.parentNode; if(!box) return;
  if(box.querySelector('.cqin')) return;
  var keep=box.innerHTML;
  box.innerHTML='<input class="cqin" placeholder="한 줄 기록… Enter 저장">';
  var inp=box.querySelector('.cqin');
  function back(){ box.innerHTML=keep; }
  inp.addEventListener('keydown',function(ev){
    ev.stopPropagation();
    if(_ime(ev)) return;               // 한글 조합 중 Enter는 글자를 확정하는 것이다
    if(ev.key==='Escape'){ back(); return; }
    if(ev.key!=='Enter') return;
    ev.preventDefault();
    var t=inp.value; if(!t.trim()){ back(); return; }
    inp.disabled=true;
    addLog(id,t).then(function(ok){ if(ok) route(); else back(); });
  });
  inp.addEventListener('blur',function(){ setTimeout(back,150); });
  inp.focus();
}
/* ── 캘린더를 오른쪽에 붙이기 ──────────────────────────────────────
   캘린더가 켜져 있고 화면이 넉넉하면 좌우로 나눈다. 좁으면 예전처럼
   위아래로 쌓는다 — 좁은 화면에서 반씩 나누면 둘 다 못 쓴다. */
var CALW_KEY='work_cal_w', CALW_MIN=280, CALW_MAX=720, SPLIT_MIN=1080;
function calWidth(){
  var v=0; try{ v=parseFloat(localStorage.getItem(CALW_KEY)||'')||0; }catch(e){}
  return Math.max(CALW_MIN,Math.min(v||400,CALW_MAX));
}
function splitOn(){ return !!S.calOn&&window.innerWidth>=SPLIT_MIN; }
function splitOpen(){
  if(!S.calOn) return '';
  if(!splitOn()) return calPanel();                 // 좁은 화면 — 예전처럼 위에
  return '<div class="split" id="split"><div class="spmain">';
}
function splitClose(){
  if(!splitOn()) return '';
  return '</div><div class="spgrip" id="spgrip" title="좌우로 끌어 폭을 바꿉니다"></div>'
    +'<div class="spside" style="width:'+calWidth()+'px">'+calPanel()+'</div></div>';
}
// 그린 뒤 — 가운데 손잡이를 살려 둔다
function calAfter(){
  var g=$('spgrip'); if(g&&!g._on){ g._on=1; g.addEventListener('pointerdown',calResize); }
}
function calResize(e){
  if(e.button!==undefined&&e.button!==0) return;
  var sp=$('split'), g=$('spgrip'); if(!sp||!g) return;
  e.preventDefault();
  var side=sp.querySelector('.spside'); if(!side) return;
  var right=sp.getBoundingClientRect().right;
  g.classList.add('on'); document.body.classList.add('colres');
  function mv(ev){
    var w=Math.max(CALW_MIN,Math.min(right-ev.clientX-11,CALW_MAX));
    side.style.width=w+'px';
  }
  function up(){
    document.removeEventListener('pointermove',mv);
    document.removeEventListener('pointerup',up);
    g.classList.remove('on'); document.body.classList.remove('colres');
    try{ localStorage.setItem(CALW_KEY,String(parseFloat(side.style.width)||400)); }catch(e2){}
  }
  document.addEventListener('pointermove',mv);
  document.addEventListener('pointerup',up);
}

function calBtn(){

function calToggle(){ S.calOn=!S.calOn; calSavePrefs(); route(); }
function calSetView(v){ S.calView=v; calSavePrefs(); route(); }
function calLay(k){ S.calLay=S.calLay||calDefLay(); S.calLay[k]=!S.calLay[k]; calSavePrefs(); route(); }
/* 묶음 통째로 — 하나라도 켜져 있으면 모두 끄고, 다 꺼져 있으면 모두 켠다.
   「푸른이알피 것은 잠깐 치우고 내 것만 보기」가 한 번에 된다. */
function calLayGroup(g){
  S.calLay=S.calLay||calDefLay();
  var ls=CAL_LAYERS.filter(function(l){ return l[5]===g; });
  var anyOn=ls.some(function(l){ return S.calLay[l[0]]; });
  ls.forEach(function(l){ S.calLay[l[0]]=!anyOn; });
  calSavePrefs(); route();
}
function calGoToday(){ S.calDate=todayStr(); route(); }
function calZoom(d){ S.calDate=d; S.calView='day'; calSavePrefs(); route(); }
function calNav(n){
  var d=calBase();
  if(S.calView==='month') d=new Date(d.getFullYear(),d.getMonth()+n,1);
  else d=addDays(d,(S.calView==='week'?7:1)*n);
  S.calDate=ymd(d); route();
}

function openPuerpCal(){
  window.open('pu-erp.html?sso=1#menu='+encodeURIComponent(isAdmin()?'dash/corp':'dash/my'),'_blank');
}
function calDrag(e,id,k){
  _calDrag={id:id,k:k};
  try{ e.dataTransfer.setData('text/plain',id); e.dataTransfer.effectAllowed='move'; }catch(x){}
}
function calOver(e,d){ if(!_calDrag) return; e.preventDefault(); var n=$('cd-'+d); if(n)n.classList.add('drop'); }
function calLeave(d){ var n=$('cd-'+d); if(n)n.classList.remove('drop'); }
function calDrop(e,d){
  var n=$('cd-'+d); if(n)n.classList.remove('drop');
  if(!_calDrag) return;
  e.preventDefault();
  var g=_calDrag; _calDrag=null;
  var it=items[g.id];
  if(!it){ toast('업무를 찾을 수 없습니다','warn'); return; }
  if(g.k==='due'){
    if(it.due===d) return;
    patchItem(g.id,{due:d}).then(function(ok){ if(!ok)return; toast('📅 기한 → '+md(d)); route(); });
  }else if(g.k==='next'){
    var nx=it.next||{};
    if(nx.date===d) return;
    patchItem(g.id,{next:{date:d,text:nx.text||''}}).then(function(ok){ if(!ok)return; toast('📌 할 일 → '+md(d)); route(); });
  }
}

    +splitOpen();                       // 캘린더가 켜져 있으면 여기서부터 좌우로 갈린다
  var nFold=names.filter(function(n){ return (S.teamFold||{})[n]; }).length;
  var anyF=!!(S.q||S.teamNolog||S.teamStale||S.calDay||fAny('team'));
  /* 숫자가 0이거나 진행 건수와 똑같은 칩은 눌러 봐야 한 건도 안 걸러진다.
     그런 칩이 경고색으로 있으면 245건이 전부 위험한 것처럼 읽힌다 — 회색으로 죽인다.
