       퇴사자 이름이 사라지지 않는다. */
    }
    // ⚠ 여기도 명부를 읽어냈을 때만 — 못 읽었으면 전원이 「명단에 없는 사람」이 된다
    var osub=_staffKnown?orphanSubs(st):[];
    if(osub.length){
      h+='<div class="hocard" style="border-color:#fbbf24"><div class="hct"><b style="color:var(--warn)">⚠ 명단에 없는 사람이 부담당으로 남은 건</b>'
        +'<span class="muted" style="font-size:11.5px">주담당은 다른 사람입니다. 넘길 것은 없고 이름만 떼면 됩니다.</span></div>';
      osub.forEach(function(o){
        h+='<div class="row" style="padding:7px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px">'
          +'<span style="font-weight:800;font-size:12.5px">👤 '+esc(o.name)+'</span>'
          +'<span class="muted" style="font-size:12px">진행 중 '+o.items.length+'건에 부담당으로 들어 있습니다</span>'
          +'<span style="flex:1"></span>'
          +'<button onclick="dropSubAll(\''+escJ(o.name)+'\')" '
          +'title="진행 중인 건에서만 뗍니다 — 종료된 건은 그대로 둡니다">'
          +o.items.length+'건에서 한 번에 떼기</button></div>';
      });
      h+='<div class="muted" style="font-size:11.5px;margin-top:8px">'
        +'종료된 건은 건드리지 않습니다 — 거기 남은 이름은 그때 함께 했다는 기록입니다.</div>'
        +'</div>';
    }
    // 문서철 — 보관된 인수인계서
    var dk=Object.keys(docs).sort().reverse();
    h+='<div class="panel"><h2 style="margin-bottom:8px">📁 문서철 — 보관된 인수인계서 '+(dk.length?dk.length+'건':'')+'</h2>';
    if(!dk.length) h+='<div class="muted" style="font-size:12px">아직 보관된 인수인계서가 없습니다. 부재 완료 처리 시 자동 보관됩니다.</div>';
    dk.forEach(function(k){ var d3=docs[k];
      h+='<div class="row" style="font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line)">'
        +'<b>'+esc(d3.name||'')+'</b><span class="lvtag">'+esc(d3.type||'')+'</span>'
        +'<span class="muted">'+esc(d3.date||'')+' · 업무 '+((d3.items||[]).length)+'건 · 보관 '+esc((d3.saved_at||'').slice(0,10))+'</span>'
        +'<span style="flex:1"></span><button style="font-size:11.5px" onclick="printHoDocArchived(\''+escJ(k)+'\')">🖨 보기·인쇄</button></div>';
    });
    h+='</div>';
    app.innerHTML=h;
    hoStick();
  });
}
/* 틀고정 붙이기 — 위 막대·접힌 머리의 실제 높이를 재서 CSS 에 넘긴다.
   숫자로 박아 두면 위 막대가 한 줄 늘어나는 날 표 머리행이 어긋나 가려진다. */
function hoStick(){
  var el=$('hohead'); if(!el) return;
  var tb=$('topbar');
  var th=tb?Math.round(tb.getBoundingClientRect().height):38;
  var r=document.documentElement.style;
  r.setProperty('--topbarh',th+'px');
  // 위 영역이 제자리를 지나 붙는 순간부터 줄인다
  var slim=(window.scrollY||document.documentElement.scrollTop||0)>40;
  el.classList.toggle('slim',slim);
  r.setProperty('--hoheadh',Math.round(el.getBoundingClientRect().height)+'px');
  // 카드 머리 높이 — 표 머리행이 그 아래에 붙어야 한다. 이름이 길어 줄이 접히면
  // 높이가 달라지므로 숫자로 박지 않고 실제로 잰다.
  var hc=document.querySelector('#app .hocard .hct');
  r.setProperty('--hcth',(hc?Math.round(hc.getBoundingClientRect().height):34)+'px');
}
window.addEventListener('scroll',function(){ if($('hohead')) hoStick(); },{passive:true});
window.addEventListener('resize',function(){ if($('hohead')) hoStick(); });
function addLeaving(){
  var sel=$('lv-sid'); if(!sel)return;
  var sid=sel.value, name=sel.options[sel.selectedIndex].getAttribute('data-name');
  var date=$('lv-date').value;
  if(!date){ toast('예정일을 선택하세요','warn'); return; }
  if(leaving[sid]&&!leaving[sid].done){ toast(name+'은(는) 이미 부재 진행 중입니다','warn'); return; }
  fbDb.ref(NS+'/leaving/'+sid).set({name:name,type:$('lv-type').value,date:date,
    note:$('lv-note').value.trim(),created_at:new Date().toISOString(),done:false})
    .then(function(){ toast('🚪 부재 예정 등록: '+name); })
    .catch(function(e){ toast('등록 실패: '+e.message,'err'); });
}
/* 이 부재 때문에 넘어간 건 — ho.from 이 그 사람이고 아직 되돌리지 않은 것.
   ⚠ 「지금 담당이 그 사람이 아니다」만으로는 안 된다. 원래부터 남의 건일 수 있다. */
function hoMovedBy(sid,name){
  return allItems().filter(function(it){
    var f=it.ho&&it.ho.from; if(!f) return false;
    if(!(f.sid===sid||(name&&f.name===name))) return false;
    return (it.mgr_main&&it.mgr_main.sid)!==sid;      // 아직 안 돌아온 것만
  });
}
function cancelLeaving(sid){
  var lv=leaving[sid]||{}, moved=hoMovedBy(sid,lv.name);
  var base='이 부재 예정을 취소(삭제)할까요?\n작성된 노트·인수 기록은 그대로 남습니다.';
  if(!moved.length){
    confirmM(base,{ok:'취소 처리',danger:true}).then(function(ok){
      if(!ok)return;
      fbDb.ref(NS+'/leaving/'+sid).remove().then(function(){ toast('부재 예정 취소됨'); });
    });
    return;
  }
  /* 이미 넘어간 것이 있으면 그냥 지우면 안 된다 — 부재는 없던 일이 되는데
     담당은 후임에게 남아 두 사실이 어긋난다. 되돌릴지 반드시 고르게 한다. */
  confirmM(base+'\n\n⚠ 이 부재로 이미 '+moved.length+'건이 후임에게 넘어갔습니다.\n'
    +'그냥 취소하면 담당은 돌아오지 않습니다.',
    {ok:'되돌리고 취소',alt:'그대로 두고 취소',danger:true}).then(function(ans){
    if(!ans)return;                         // 닫거나 [취소] — 아무것도 안 한다
    var undo=(ans===true);                  // true = 되돌리고 취소, 'alt' = 그대로 두고 취소
    var job=undo?Promise.all(moved.map(function(it){
        var back=(it.ho&&it.ho.from)||{};
        return _handoverTo(it._id,back.sid||sid,back.name||lv.name||'',"부재 예정 취소로 되돌림");
      })):Promise.resolve();
    job.then(function(){
      fbDb.ref(NS+'/leaving/'+sid).remove().then(function(){
        toast(undo?('↩ '+moved.length+'건을 되돌리고 부재 예정 취소됨'):'부재 예정 취소됨 — 담당은 그대로입니다');
      });
    });
  });
}
function assignSuccessor(id,selEl){
  if(!selEl||selEl.tagName!=='SELECT')return;
  var sid=selEl.value; if(!sid)return;
  var name=selEl.options[selEl.selectedIndex].getAttribute('data-name');
  _handoverTo(id,sid,name);
}

/* ══════════════════════════════════════════════════════════════════════════
   승계표로 «한 번에» 넘기기 (대표 지시 2026-08-26 「업무관리 연결」)
   ══════════════════════════════════════════════════════════════════════════
   ⚠ 되돌리기 어려운 일이라 «반드시 물어본 뒤»에 한다 — 몇 건인지, 누구에게 가는지,
     되돌리려면 건별로 다시 골라야 한다는 것까지 적는다.
   ⚠ 한 건씩 _handoverTo 로 돈다 — 그래야 «담당 A → B (인수 확인 대기)» 기록이
     건마다 남는다. 통째로 갈아 끼우면 누가 언제 넘겼는지 사라진다.
   ⚠ 이미 그 사람이 주담당인 건은 _handoverTo 가 알아서 건너뛴다. */
function succBulk(fromName,toSid,toName){
  var arr=openItems().filter(function(it){
    return ((it.mgr_main&&it.mgr_main.name)||'')===fromName;
  });
  if(!arr.length){ toast('넘길 건이 없습니다'); return; }
  if(!confirm('「'+fromName+'」 님의 진행 중인 '+arr.length+'건을\n'
    +'모두 「'+toName+'」 님께 넘깁니다.\n\n'
    +'· 건마다 「담당 '+fromName+' → '+toName+'」 기록이 남고 «인수 확인 대기»가 됩니다.\n'
    +'· 되돌리려면 건별로 다시 골라야 합니다.\n\n진행할까요?')) return;
  var n=0;
  arr.forEach(function(it){ _handoverTo(it._id,toSid,toName); n++; });
  toast('🔄 '+n+'건을 '+toName+' 님께 넘겼습니다 — 인수 확인 대기');
}
/* ══════════════════════════════════════════════════════════════════════════
   업체(사업장)별로 나눠 배분하기 (대표 지시 2026-08-27)
   ══════════════════════════════════════════════════════════════════════════
   퇴사자 몫을 한 사람에게 통째로 넘기는 길(succBulk)은 이미 있었다.
   없던 것은 «사업장별로 각각 다른 사람에게» 나눠 주는 길이다.
   ⚠ 가르는 단위를 «회사»로 잡는다. 한 회사를 두 사람이 나눠 맡으면
     그 사업장은 누구에게 연락해야 하는지 알 수 없게 된다.
   ⚠ 그래도 예외는 건별 [후임 선택]으로 여전히 할 수 있다 — 막지 않는다. */
function succCoGroups(fromName){
  var by={}, out=[];
  openItems().forEach(function(it){
    if(((it.mgr_main&&it.mgr_main.name)||'')!==fromName) return;
    var nm=String(it.company||it.client||'').trim()||'(회사 없음)';
    var k=_normCo(nm)||'_none';
    if(!by[k]){ by[k]={k:k,name:nm,items:[]}; out.push(by[k]); }
    by[k].items.push(it);
  });
  // 건수가 많은 회사부터 — 나눌 때 큰 덩어리를 먼저 정하게 된다
  out.sort(function(a,b){
    if(a.items.length!==b.items.length) return b.items.length-a.items.length;
    return String(a.name).localeCompare(String(b.name),'ko');
  });
  return out;
}
function succCoBulk(fromName,coKey,selEl){
  if(!selEl||!selEl.value){ toast('이어받을 사람을 먼저 고르세요','warn'); return; }
  var toSid=selEl.value;
  var toName=selEl.options[selEl.selectedIndex].getAttribute('data-name')||'';
  var g=succCoGroups(fromName).filter(function(x){return x.k===coKey;})[0];
  if(!g||!g.items.length){ toast('넘길 건이 없습니다'); return; }
  /* ⚠ 되돌리기 어려운 일이라 반드시 물어본 뒤에 한다 —
     몇 건인지, 어디로 가는지, 무엇이 함께 따라가는지까지 적는다. */
  confirmM('「'+g.name+'」의 진행 중인 '+g.items.length+'건을\n'
    +'「'+toName+'」 님께 넘깁니다.\n\n'
    +'함께 따라가는 것\n'
    +'· 주간 기록 · 인수인계 노트 · 지식 카드 (업무 번호가 그대로라 저절로)\n'
    +'· 푸른이알피 사무관리의 주담당\n\n'
    +'건마다 「담당 '+fromName+' → '+toName+'」 기록이 남고 «인수 확인 대기»가 됩니다.\n'
    +'되돌리려면 건별로 다시 골라야 합니다.',{ok:'넘기기'}).then(function(ok){
    if(!ok) return;
    g.items.forEach(function(it){ _handoverTo(it._id,toSid,toName,'업체 단위 배분'); });
    toast('🔄 '+g.name+' '+g.items.length+'건을 '+toName+' 님께 넘겼습니다 — 인수 확인 대기');
  });
}
/* 승계표에 한 줄 적기 — 메일함도 같은 표를 본다 */
function succDeclare(fromName){

    +'· 업무는 이 표만으로 넘어가지 않습니다 — 아래에서 넘기거나 [모두 넘기기]를 누르세요.\n\n진행할까요?')) return;

/* ── 명단에 없는 사람이 부담당으로만 남은 건 ─────────────────────────
   주담당이 빠지는 것은 「후임 지정」이 맡는다. 부담당은 넘길 일이 없고
   이름만 떼면 되는데, 건별로 드로어를 열어 지우는 수밖에 없었다.
   [이름, 그 사람이 부담당인 진행 중 업무들] 을 이름순으로 준다. */
function orphanSubs(staff){
  var act={}; (staff||[]).forEach(function(u){ if(u&&u.name) act[u.name]=1; });
  var m={};
  openItems().forEach(function(it){
    mgrSubNames(it).forEach(function(n){
      if(act[n]) return;                       // 재직자는 대상이 아니다
      (m[n]=m[n]||[]).push(it);
    });
  });
  return Object.keys(m).sort(function(a,b){ return a.localeCompare(b,'ko'); })
    .map(function(n){ return {name:n,items:m[n]}; });
}
/* 진행 중인 건에서만 뗀다. 종료된 건은 그대로 둔다 —
   거기 남은 이름은 "그때 이 사람이 함께 했다"는 기록이라 지우면 사실이 틀려진다. */
function dropSubAll(name){
  var arr=openItems().filter(function(it){ return mgrSubNames(it).indexOf(name)>=0; });
  if(!arr.length){ toast('뗄 건이 없습니다','warn'); return; }
  confirmM('「'+name+'」을(를) 진행 중인 업무 '+arr.length+'건의 부담당에서 뗍니다.\n\n'
    +'주담당은 그대로입니다. 종료된 건도 그대로 둡니다.',{ok:arr.length+'건에서 떼기'})
  .then(function(ok){
    if(!ok)return;
    var up={}, now=new Date().toISOString();
    arr.forEach(function(it){
      var left=(it.mgr_subs||[]).filter(function(s){ return !s||s.name!==name; });
      up[NS+'/items/'+it._id+'/mgr_subs']=left.length?left:null;
      up[NS+'/items/'+it._id+'/up_at']=now;
    });
    fbDb.ref().update(up).then(function(){
      toast('👤 '+name+' — '+arr.length+'건에서 뗐습니다'); route();
    }).catch(function(e){ toast('실패: '+e.message,'err'); });
  });
}

function saveItem(editId){

/* ── 진행 단계 = 하위 할 일 + 유형별 템플릿 ──────────────────────────
   업무 1건에 `다음 할 일` 하나만 적을 수 있어 "부당해고는 이 순서로"를 담을
   곳이 없었다. 사건을 열면 해야 할 일이 순서대로 깔려 있게 한다.
   `work_erp/steps/{업무ID}/{단계ID}` = {t제목, g묶음이름, o순서, done, d기한, by, at}
   items와 분리한 이유: 체크 한 번에 items 전체가 모든 화면으로 다시 밀려가는 것을
   막는다. 전체 용량이 작아(건당 8개 × 80B) live 구독해도 부담이 없고,
   목록의 진행률·캘린더 표시가 항상 최신이라 별도 집계 필드가 필요 없다.
   ⚠ 기본 템플릿은 박재원 노무사 노션 화면에 있는 부당해고 단계 그대로다.
     다른 유형은 만들어 넣지 않는다 — 절차를 지어내면 안 된다.
     실제 업무의 단계를 [템플릿으로 저장]해 늘려 간다. */
var TPL_BUILTIN=[
  {id:'_buhae', cat:'부해', name:'부당해고 구제신청', src:'기본 제공',
   g:[['1. 수임 및 노동위원회 접수',
       ['상담일지 작성','위임 및 서류 날인','자료수집','조사관 배정 확인 또는 초기 연락','초기 서면 및 대리인 서류 제출']],
      ['2. 서면 공방',
       ['입증 자료수집','상대방 서면 수령 및 검토','서면 작성 및 제출']]]}
];
var steps={}, tpls={};

function stepsOf(id){
  var o=steps[id]||{};
  return Object.keys(o).map(function(k){ var s=o[k]; if(!s||!s.t) return null; s._id=k; return s; })
    .filter(Boolean)
    .sort(function(a,b){ return (a.o||0)-(b.o||0)||String(a.t).localeCompare(String(b.t),'ko'); });
}
function stepProg(id){
  var a=stepsOf(id);
  return {d:a.filter(function(s){return s.done;}).length, t:a.length};
}
function stepChip(id){
  var p=stepProg(id); if(!p.t) return '';
  return ' <span class="stchip'+(p.d===p.t?' done':'')+'" title="진행 단계 '+p.d+'/'+p.t+'">'
    +(p.d===p.t?'✓ ':'')+p.d+'/'+p.t+'</span>';
}
// 내장 + 사용자 저장 템플릿
function tplAll(){
  var out=TPL_BUILTIN.slice();
  Object.keys(tpls||{}).forEach(function(k){
    var t=tpls[k]; if(t&&t.name&&t.g&&t.g.length){ t=Object.assign({},t); t.id=k; out.push(t); }
  });
  return out;
}
function tplFor(cat){
  var all=tplAll();
  var hit=all.filter(function(t){ return t.cat&&t.cat===cat; });
  return hit.concat(all.filter(function(t){ return hit.indexOf(t)<0; }));
}
function _stepPaths(id,groups){
  // groups = [[묶음이름,[제목,...]], ...] → 저장 경로
  var up={}, o=0;
  groups.forEach(function(g,gi){
    (g[1]||[]).forEach(function(t){
      o++;
      up[NS+'/steps/'+id+'/'+rid('S')]={t:t,g:g[0],o:(gi+1)*1000+o,done:0,d:''};
    });
  });
  return up;
}
function applyTpl(id,tplId){
  var t=tplAll().filter(function(x){return x.id===tplId;})[0];
  if(!t){ toast('템플릿을 찾을 수 없습니다','warn'); return; }
  var cur=stepsOf(id);
  var go=function(){
    var up=_stepPaths(id,t.g);
    var n=Object.keys(up).length;
    fbDb.ref().update(up).then(function(){
      closeM(); toast('✅ '+t.name+' — 단계 '+n+'개를 깔았습니다'); renderDrawer(); route();
    }).catch(function(e){ toast('실패: '+e.message,'err'); });
  };
  if(!cur.length){ go(); return; }
  confirmM('이미 단계 '+cur.length+'개가 있습니다.\n\n템플릿의 단계를 <b>뒤에 덧붙입니다</b>. 계속할까요?'
    .replace(/<[^>]+>/g,''),{ok:'덧붙이기'}).then(function(ok){ if(ok) go(); });
}
function stepToggle(id,sid){
  var s=(steps[id]||{})[sid]; if(!s) return;
  var done=s.done?0:1;
  var up={};
  up[NS+'/steps/'+id+'/'+sid+'/done']=done;
  up[NS+'/steps/'+id+'/'+sid+'/by']=done?((S.me&&S.me.name)||''):null;
  up[NS+'/steps/'+id+'/'+sid+'/at']=done?todayStr():null;
  fbDb.ref().update(up).catch(function(e){ toast('실패: '+e.message,'err'); });
}
function stepDate(id,sid,v){
  fbDb.ref(NS+'/steps/'+id+'/'+sid+'/d').set(v||null)
    .catch(function(e){ toast('실패: '+e.message,'err'); });
}
function stepAdd(id,group){
  var el=$('sa-'+safeKey(group)); var t=el?el.value.trim():'';
  if(!t) return;
  var same=stepsOf(id).filter(function(s){return s.g===group;});
  var last=same.length?same[same.length-1].o:0;
  var base=last||(stepsOf(id).length+1)*1000;
  fbDb.ref(NS+'/steps/'+id+'/'+rid('S')).set({t:t,g:group,o:base+1,done:0,d:''})
    .then(function(){ if(el)el.value=''; renderDrawer(); route();
      setTimeout(function(){ var e2=$('sa-'+safeKey(group)); if(e2)e2.focus(); },50); })
    .catch(function(e){ toast('실패: '+e.message,'err'); });
}
function stepDel(id,sid){
  fbDb.ref(NS+'/steps/'+id+'/'+sid).remove().catch(function(e){ toast('실패: '+e.message,'err'); });
}
function stepToNext(id,sid){
  var s=(steps[id]||{})[sid]; if(!s) return;
  patchItem(id,{next:{date:s.d||'',text:s.t}}).then(function(ok){
    if(!ok) return; toast('📌 다음 할 일로 — '+s.t); renderDrawer(); route();
  });
}
function stepClear(id){

    .then(function(ok){ if(!ok)return;

    });
}
// 실제로 쓴 단계를 템플릿으로 만들어 다음 사건부터 재사용한다

    +'<input id="tp-n" value="'+esc(it.title||it.cat||'')+'" placeholder="예: 부당해고 구제신청"></div>'

    +'<div style="background:var(--bg);border-radius:8px;padding:9px 11px;font-size:11.5px;color:var(--sub);max-height:180px;overflow:auto">'
    +gs.map(function(g){ return '<b>'+esc(g[0])+'</b><br>'+g[1].map(function(t){return '· '+esc(t);}).join('<br>'); }).join('<br><br>')

    +'<button class="primary" onclick="saveTplGo()">템플릿 저장</button></div>');
  S._tplG=gs;

function saveTplGo(){

function tplDel(tid){

function hlp(k){
  return '<span class="hlp" onclick="event.stopPropagation();hlpPop(this,\''+k+'\')" title="설명 보기">ⓘ</span>';
}
function hlpClose(){
  ['hlpop','hlbk'].forEach(function(i){ var e=$(i); if(e&&e.parentNode) e.parentNode.removeChild(e); });
}
function hlpPop(el,k){
  hlpClose();
  var t=HELP[k]; if(!t||!el) return;
  var b=document.createElement('div'); b.className='hlbk'; b.id='hlbk';
  b.onclick=hlpClose; document.body.appendChild(b);
  var d=document.createElement('div'); d.className='hlpop'; d.id='hlpop';
  d.innerHTML=t+'<span class="x" onclick="hlpClose()">✕</span>';
  document.body.appendChild(d);
  var r=el.getBoundingClientRect();
  d.style.left=Math.max(8,Math.min(r.left-10,window.innerWidth-d.offsetWidth-8))+'px';
  d.style.top=Math.max(8,Math.min(r.bottom+6,window.innerHeight-d.offsetHeight-8))+'px';
}
function dStepsHTML(id,it){
  var arr=stepsOf(id), p=stepProg(id);

  if(!arr.length){
    h+='<div class="row"><button class="primary" style="padding:4px 12px;font-size:12px" onclick="tplModal(\''+escJ(id)+'\')">✅ 단계 깔기</button>'
      +'<span class="stadd" onclick="stepAddGroup(\''+escJ(id)+'\')">＋ 직접 만들기</span></div>';
    return h+'</div></div>';
  }
  h+='<div class="prog"><i style="width:'+(p.t?Math.round(p.d/p.t*100):0)+'%"></i></div>';
  var gs=[], idx={};
  arr.forEach(function(s){
    var g=s.g||'단계';
    if(idx[g]===undefined){ idx[g]=gs.length; gs.push([g,[]]); }

  });
  gs.forEach(function(g){
    var dn=g[1].filter(function(s){return s.done;}).length;
    h+='<div class="sg">'+esc(g[0])+'<span class="gn">'+dn+'/'+g[1].length+'</span></div>';
    g[1].forEach(function(s){
      h+='<div class="st1'+(s.done?' on':'')+'">'
        +'<input type="checkbox"'+(s.done?' checked':'')+' onclick="stepToggle(\''+escJ(id)+'\',\''+escJ(s._id)+'\')">'
        +'<span class="tx" title="'+(s.done&&s.by?esc(s.by+' · '+(s.at||'')+' 완료'):'')+'">'+esc(s.t)+'</span>'

        +(s.done?'':'<span class="sa" onclick="stepToNext(\''+escJ(id)+'\',\''+escJ(s._id)+'\')" title="이 단계를 다음 할 일로">📌</span>')
        +'<span class="sx" onclick="stepDel(\''+escJ(id)+'\',\''+escJ(s._id)+'\')" title="삭제">✕</span>'
        +'</div>';
    });
    h+='<input class="wkin" id="sa-'+safeKey(g[0])+'" placeholder="＋ 이 묶음에 할 일 추가 (Enter)" '
      +'onkeydown="if(event.key===\'Enter\'&&!_ime(event)){event.preventDefault();stepAdd(\''+escJ(id)+'\',\''+escJ(g[0])+'\')}">';

function stepAddGroup(id){
  showModal('<h2 style="margin:0 0 6px">＋ 묶음 추가</h2>'
    +'<p class="muted" style="font-size:12px;margin:0 0 10px">여러 할 일을 담는 단계 이름입니다. 예: <b>1. 수임 및 노동위원회 접수</b></p>'
    +'<div class="fld"><label>묶음 이름</label><input id="sg-n" placeholder="예: 3. 심문회의 준비"></div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:12px"><button onclick="closeM()">취소</button>'
    +'<button class="primary" onclick="stepAddGroupGo(\''+escJ(id)+'\')">추가</button></div>');
  setTimeout(function(){ var e=$('sg-n'); if(e)e.focus(); },60);
}
function stepAddGroupGo(id){
  var n=(($('sg-n')||{}).value||'').trim();
  if(!n){ toast('묶음 이름을 적어 주세요','warn'); return; }
  var arr=stepsOf(id), base=arr.length?(arr[arr.length-1].o||0):0;
  fbDb.ref(NS+'/steps/'+id+'/'+rid('S')).set({t:'첫 할 일',g:n,o:base+1000,done:0,d:''})
    .then(function(){ closeM(); toast('묶음 추가 — '+n); renderDrawer(); route(); })
    .catch(function(e){ toast('실패: '+e.message,'err'); });
}

function calDefLay(){ var o={}; CAL_LAYERS.forEach(function(l){ o[l[0]]=!!l[3]; }); return o; }
function calPrefRef(){ var sid=(S.me&&S.me.sid)||''; return sid?fbDb.ref(NS+'/prefs/'+safeKey(sid)+'/cal'):null; }
function calLoadPrefs(){
  /* ── ㉮ 폰에서는 «주»로 연다 (대표 지시 2026-09-02 「폰에서 달력이 모든 화면 다 차지한다」) ──
     실측: 폰에서 달력 한 칸이 72px 이라 6주 격자만 432px, 머리·갈래 칩까지 600px 이 넘는다.
     860px 화면의 3/4 다. 게다가 대표 화면의 그 달은 일정이 «한 건도» 안 찍혀 있었다 —
     600px 를 빈 칸에 쓰고 있었다.
     ⚠ 「고른 적 없는 사람」에게만 그렇게 연다. 월로 보겠다고 고른 사람의 뜻을 뺏지 않는다
       (고르면 S.calView 가 저장되어 이 줄을 안 탄다).
     ⚠ PC 는 그대로 월이다 — 거기서는 옆에 붙어 있어 자리를 안 뺏는다. */
  if(S.calView===undefined){
    var _폰 = false;
    try{ _폰 = window.innerWidth <= 560; }catch(_){}
    S.calView = _폰 ? 'week' : 'month';
  }
  if(S.calLay===undefined) S.calLay=calDefLay();
  if(S.calDate===undefined) S.calDate=todayStr();
  if(S.calOn===undefined) S.calOn=false;              // 기본 접힘 — 켠 사람만 본다
  var r=calPrefRef(); if(!r) return Promise.resolve();
  return r.once('value').then(function(s){
    var v=s.val()||{};
    if(typeof v.on==='boolean') S.calOn=v.on;
    if(v.view) S.calView=v.view;
    if(v.lay){ var d=calDefLay();
      Object.keys(d).forEach(function(k){ if(typeof v.lay[k]==='boolean') d[k]=v.lay[k]; });
      S.calLay=d; }
  }).catch(function(){});
}
function calSavePrefs(){
  var r=calPrefRef(); if(!r) return;
  /* 실패를 삼키면, 켜고 끈 것이 다음에 안 남아 있는데 까닭을 알 수가 없다.
     저장이 급한 일은 아니므로 창을 띄우지는 않고 한 줄만 알린다. */
  r.set({on:!!S.calOn,view:S.calView||'month',lay:S.calLay||calDefLay()})

}
// 푸른이알피 일정·근태·휴직 원본 (읽기 전용, 1회)
function calLoadSrc(){
  if(_calLoaded) return Promise.resolve();
  if(_calLoading) return _calLoading;
  _calLoading=Promise.all(Object.keys(CAL_SRC).map(function(k){

      .then(function(s){ return [k,_peArr(s.val())]; })
      .catch(function(){ return [k,_ls(CAL_SRC[k])]; });
  })).then(function(rows){

}
function calName(sid){ return (_peU2N&&_peU2N[sid])||''; }

/* ── 사업장 담당자 (푸른이알피 업체관리 읽기 전용 + 건별 직접 입력) ──────
   pu-erp companies[].contacts[] = {name, role, phone, fax, email, isPrimary}
   (옛 contactName/contactPhone은 pu-erp가 contacts[0]으로 마이그레이션한다)
   업체 담당자와 이 건 담당자가 다를 수 있으므로(인사담당 ↔ 안전담당)
   item.contacts[{name,rank,position,phone}]에 건별로 여러 명 적을 수 있게 둔다.
   item.contact(단수)는 contacts[0]과 늘 같게 유지한다 — 검색·푸른이알피 연동이 그 칸을 본다. */
var coSrc=null, _coT=null;
function coLoad(){
  if(coSrc) return Promise.resolve(coSrc);
  if(_coT) return _coT;
  _coT=fbDb.ref('data/companies/v').once('value')
    .then(function(s){ coSrc=_peArr(s.val())||[]; _coT=null; return coSrc; })
    .catch(function(){ coSrc=_ls('companies')||[]; _coT=null; return coSrc; });
  return _coT;
}
// co_id(푸른이알피 companyId) 우선, 없으면 정규화한 업체명으로 찾는다
function coFind(it){
  if(!coSrc||!coSrc.length||!it) return null;
  if(it.co_id){
    var b=coSrc.filter(function(c){ return c&&c.id===it.co_id; })[0];
    if(b) return b;
  }
  var n=_normCo(it.company); if(!n) return null;
  return coSrc.filter(function(c){ return c&&_normCo(c.name||c.companyName)===n; })[0]||null;
}
// 연동된 푸른이알피 원본 레코드
function peRec(it){
  if(!it||!peLinked(it)) return null;
  var arr=peMaster[it.ref.type]; if(!arr) return null;
  for(var i=0;i<arr.length;i++){ if(arr[i]&&String(arr[i].id)===String(it.ref.id)) return arr[i]; }
  return null;
}
// 담당자는 두 곳에 있다.
//  ① 그 사업 레코드 안의 company.contacts — 푸른이알피 수정화면의 "회사정보" 상자
//  ② 업체관리(companies) 마스터
// ①이 그 건에 실제로 쓰는 연락처이므로 먼저 본다. 예전엔 ②만 봐서 담당자가
// 버젓이 있는데도 "업체관리에 등록 없음"으로 나왔다.
function _cList(o){
  if(!o) return [];
  if(o.contacts&&o.contacts.length) return o.contacts.filter(function(c){ return c&&(c.name||c.phone||c.email); });
  if(o.contactName||o.contactPhone)
    return [{name:o.contactName||'',role:'',phone:o.contactPhone||'',email:o.contactEmail||''}];
  return [];
}
/* 담당자의 '직책'이 저장된 칸이 세 가지다.
     position … 업체관리 담당자 편집칸 (앞으로의 공통 이름)
     role     … 계약모달 회사정보 담당자칸 (옛 이름, 실데이터가 많다)
     rank     … 이 화면의 건별 담당자칸 (옛 이름)
   ⚠ 이 함수와 똑같은 것이 pu-erp.html 에도 있다(같은 이름·같은 순서). 두 파일은
     코드를 나눠 쓸 수 없어 복사해 두었다 — 한쪽을 고치면 다른 쪽도 고쳐야 한다.
   ⚠ 쓸 때는 position 이 기준이다(rank 는 옛 데이터를 위해 함께 적는다). */
function contactRole(c){ return (c&&(c.position||c.role||c.rank))||''; }
function coContacts(it){
  var r=peRec(it);
  var a=_cList(r&&r.company);
  if(a.length){ a.forEach(function(c){ c._src='이 건'; }); return a; }
  // 이관본(사건·컨설팅·기금·기타)은 contacts 를 레코드 최상위에 둔다 — company 상자가 없다.
  // 그래서 여기서 한 번 더 잡아야 이관된 건의 담당자가 보인다(전에는 통째로 안 보였다).
  var a2=_cList(r);
  if(a2.length){ a2.forEach(function(c){ c._src='이 건'; }); return a2; }
  var b=_cList(coFind(it));
  b.forEach(function(c){ c._src='업체관리'; });
  return b;
}
/* 이 건 담당자 — 여러 명. 옛 데이터는 it.contact 한 명뿐이라 그것도 읽는다. */
function itemContacts(it){
  if(!it) return [];
  if(it.contacts&&it.contacts.length) return it.contacts.filter(function(c){ return !!c; });
  var c=it.contact;
  if(c&&(c.name||c.phone||contactRole(c))) return [c];
  return [];
}
// 같은 사람인가 — 이름(공백 제거) + 전화(숫자만). pu-erp 의 _normPersonKey 와 같은 규칙이다

// 드로어: 사업장 담당자 + 담당(주/부). 부담당은 여기서 여러 명 지정한다
// (등록 폼은 1명만 고를 수 있어 연동 건의 공동작업자를 늘릴 수단이 없었다)

/* 이 건 담당자 저장 — 화면에 그려진 줄을 모두 읽어 배열로 담는다.
   ⚠ 다시 그리지 않는다(renderDrawer 없음) — 적는 중에 다시 그리면 포커스가 날아간다.
   ⚠ contact(단수)는 contacts[0]과 늘 같게 둔다. 검색·푸른이알피 연동이 아직 그 칸을 본다. */
function _ctRows(){
  var out=[];
  for(var i=0;;i++){
    var e=$('ct-nm-'+i); if(!e) break;
    var g=function(k){ var x=$(k+'-'+i); return x?x.value.trim():''; };
    out.push({name:e.value.trim(), rank:g('ct-rk'), phone:g('ct-ph')});
  }
  return out;
}
// 화면에 그리는 줄 수 — 빈 줄 한 줄은 늘 있다. 그리는 쪽과 [＋ 추가]가 같은 셈을 봐야 어긋나지 않는다
/* 화면에 그릴 「이 건 담당자」 줄 수.
   ⚠ 없으면 «한 줄도» 안 그린다 (대표 지시 2026-09-05 「화면이 너무 정신없다」).
     예전에는 늘 빈 줄 하나를 깔아, 사업장 담당자가 이미 있는데도 그 밑에
     빈 칸 셋이 붙어 있었다. 적을 일이 있으면 [＋ 담당자 추가]로 늘린다.
   ⚠ 이미 적힌 것이 있으면 그 수만큼 그대로 그린다 — 있는 것을 감추지 않는다.
   ⚠ _ctSave 는 ct-nm-0 이 화면에 없으면 «아무것도 하지 않는다» — 줄이 0개일 때
     빈 화면을 읽어 담당자를 지우는 사고는 그쪽에서 이미 막혀 있다. */
function _ctRowCount(id){
  return itemContacts(items[id]||{}).length+((S._ctAdd&&S._ctAdd[id])||0);
}
function _ctSave(id,arr,msg){
  // 줄이 화면에 없으면 아무것도 하지 않는다 — 빈 화면을 읽어 담당자를 지우는 사고를 막는다
  if(!$('ct-nm-0')) return Promise.resolve(false);
  // 직책은 rank(옛 칸)와 position(푸른이알피 공통 칸) 둘 다 적는다
  var clean=arr.filter(function(c){ return c&&(c.name||c.rank||c.phone); })
    .map(function(c){ return {name:c.name||'', rank:c.rank||'', position:c.rank||'', phone:c.phone||''}; });
  if(S._ctAdd) S._ctAdd[id]=0;
  if(!clean.length&&!itemContacts(items[id]||{}).length) return Promise.resolve(true);   // 원래 비었다 — 쓸 것이 없다
  return patchItem(id,{contacts:clean.length?clean:null, contact:clean[0]||null})
    .then(function(ok){ if(ok&&msg) toast(msg); return ok; });
}
function saveContactAt(id,i){ return _ctSave(id,_ctRows(),'👤 담당자 저장됨 ('+(i+1)+'번째 줄)'); }
function contactAdd(id){
  // 적던 줄을 먼저 저장한다 — 다시 그리면 저장 안 한 글자가 날아간다
  _ctSave(id,_ctRows()).then(function(){
    S._ctAdd=S._ctAdd||{};
    var shown=_ctRowCount(id);
    S._ctAdd[id]=(shown+1)-itemContacts(items[id]||{}).length;   // 한 줄 더
    renderDrawer();
    var e=$('ct-nm-'+shown); if(e) e.focus();
  });
}
function contactDelAt(id,i){
  var arr=_ctRows();
  var g=arr.splice(i,1)[0]||{};
  _ctSave(id,arr).then(function(ok){
    if(!ok) return; toast('담당자에서 뺐습니다 — '+(g.name||'빈 줄')); renderDrawer(); route();
  });
}
function saveContactClear(id){
  var n=itemContacts(items[id]||{}).length;
  // 여러 명이면 한 번 묻는다 — 한꺼번에 사라지는 것을 모르고 누를 수 있다
  var ask=(n>1)?confirmM('이 건 담당자 '+n+'명을 모두 비웁니다.',{ok:'모두 비우기',danger:true})
               :Promise.resolve(true);
  ask.then(function(yes){
    if(!yes) return;
    if(S._ctAdd) S._ctAdd[id]=0;
    patchItem(id,{contact:null,contacts:null}).then(function(ok){
      if(!ok) return; toast('담당자 칸을 비웠습니다'); renderDrawer(); route();
    });
  });
}
/* ── 기업정보함에서 담당자 찾아 넣기 ────────────────────────────────
   담당자 이름·연락처를 손으로 옮겨 적고 있었다. 기업정보함(pu-cards)이
   이미 검색용 색인 pucards/idx를 따로 두고 있어 그것만 읽으면 된다.
   idx 한 건 = {n 이름, c 회사, m 휴대폰, t 전화, e 메일, ti 직급, d 부서,
                ct 회사전화, ad 주소, k 'card'|'biz'}
   ⚠ 읽기만 한다 — 명함은 기업정보함에서 고친다. */
var cardIdx=null, _cardT=null;
// 명함 한 장 → 우리가 쓰는 모양. 색인(idx)과 본문(items)의 칸 이름이 달라 여기서 맞춘다.
function _cardRow(k,v,fromIdx){
  if(!v) return null;
  var r=fromIdx
    ?{_id:k,n:v.n,c:v.c,m:v.m,t:v.t,e:v.e,ti:v.ti,d:v.d,ct:v.ct,k:v.k,sc:''}
    :{_id:k,n:v.name,c:v.company,m:v.mobile,t:v.tel,e:v.email,ti:v.title,d:v.dept,
      ct:v.companyTel,k:(v.kind==='biz'?'biz':'card'),sc:v.scope||''};

function cardMatch(r,q){

  if(digits.length<3) return false;               // 두 자리로는 아무거나 걸린다

/* 담당 회사 사람을 앞줄에, 그 밖의 사람은 찾을 때만.

var MAIL_COMMON={'naver.com':1,'gmail.com':1,'hanmail.net':1,'daum.net':1,'nate.com':1,
  'kakao.com':1,'outlook.com':1,'hotmail.com':1,'yahoo.com':1,'icloud.com':1,'korea.com':1};
function mailDom(e){

/* 이름이 비슷한 회사인가. 한쪽이 다른 쪽을 품으면 같은 무리로 본다

function coAkin(a,b){
  a=_normCo(a); b=_normCo(b);

/* ⚠ 비슷한 회사를 따로 두는 이유: 계열사·같은 무리 회사의 담당자가 이 회사도

     영영 못 찾는다. 이름이 비슷하거나, 그 회사 사람과 메일 도메인이 같으면
     같은 무리로 본다(naver·gmail 같은 공용 메일은 뺀다). */
function cardFind(q,co,limit,withNoCo){
  q=String(q||'').trim().toLowerCase();
  var key=_normCo(co||''), mine=[], akin=[], rest=[], noCo=0, doms={};
  var all=cardIdx||[];
  if(key) all.forEach(function(r){
    if(_normCo(r.c)===key){ var d=mailDom(r.e); if(d) doms[d]=1; }
  });
  all.forEach(function(r){
    if(!cardMatch(r,q)) return;
    if(key&&_normCo(r.c)===key){ mine.push(r); return; }
    if(key&&String(r.c||'').trim()&&(coAkin(co,r.c)||doms[mailDom(r.e)])){ akin.push(r); return; }
    if(!q) return;                                // 검색 전에는 남을 늘어놓지 않는다
    if(!String(r.c||'').trim()){ noCo++; if(!withNoCo) return; }

    var sa=(q&&String(a.n||'').toLowerCase().indexOf(q)>=0)?0:1;

var KB_KINDS=[

  ['cat','유형','📚','진행 순서·필수 서류·흔한 함정 (플레이북)'],

var KB_KLBL={}; KB_KINDS.forEach(function(k){ KB_KLBL[k[0]]=k[1]; });

function kbKey(s){ return safeKey(String(s||'').trim()); }

function kbCards(kind,key){

      var c=o[id]; if(!c||typeof c!=='object') return null;

function kbAll(){

function kbStale(c){ return !!(c.at&&(Date.now()-new Date(c.at).getTime())>KB_STALE_DAYS*86400000); }

// 이 업무와 관련된 카드 — 찾으러 가지 않아도 붙어 나오게 하는 것이 핵심이다
function kbRelated(it){
  if(!it) return [];
  var out=[], seen={};

    var k=c._kind+'|'+c._key+'|'+c._id; if(seen[k]) return; seen[k]=1; out.push(c); }); }
  // 플레이북은 업무 유형(부당해고·임금체불…)에 붙는다. 구분(업체·사건…)은 너무 넓다
  var pk=String(it.ptype||'').trim()||String(it.cat||'').trim();
  if(pk) add(kbCards('cat',kbKey(pk)));

    .filter(Boolean).forEach(function(n){ add(kbCards('person',kbKey(n))); });

function kbKindChanged(){
  var k=($('kb-kind')||{}).value||'person';
  var lab={person:'사람 이름 (감독관·담당자)',company:'업체명',cat:'유형 (구분)',office:'기관명 (지청·지사)'};
  var e=$('kb-klab'); if(e) e.textContent=lab[k]||'대상 이름';
  var i=$('kb-kl'); if(i) i.value=(S._kbPre||{})[k]||'';
}
function kbSave(){
  var kind=($('kb-kind')||{}).value||'person';
  var kl=(($('kb-kl')||{}).value||'').trim();
  var t=(($('kb-t')||{}).value||'').trim();
  var x=(($('kb-x')||{}).value||'').trim();
  var msg=$('kb-msg');
  if(!kl){ if(msg)msg.textContent='대상 이름을 적어 주세요.'; return; }
  if(!t){ if(msg)msg.textContent='한 줄 제목을 적어 주세요.'; return; }
  var key=kbKey(kl);
  if(!key){ if(msg)msg.textContent='대상 이름에 쓸 수 없는 문자만 있습니다.'; return; }
  var id=rid('K');
  fbDb.ref(NS+'/kb/'+kind+'/'+key+'/'+id).set({
    t:t, x:x, kl:kl, by:(S.me&&S.me.sid)||'', byName:(S.me&&S.me.name)||'',
    at:new Date().toISOString(), src:S._kbSrc||null
  }).then(function(){
    closeM(); toast('📚 지식 저장 — '+KB_KLBL[kind]+' · '+kl); renderDrawer(); route();
  }).catch(function(e){ if(msg)msg.textContent='실패: '+e.message; });
}
function kbFlag(kind,key,id){
  confirmM('이 카드가 지금은 사실과 다릅니까?\n\n표시해 두면 카드에 정정 요청이 붙고, 다른 사람이 그 내용을 신뢰하지 않게 됩니다.',
    {ok:'지금은 다름으로 표시'}).then(function(ok){ if(!ok)return;
    var p=NS+'/kb/'+kind+'/'+key+'/'+id+'/flags';
    /* ⚠ 전에는 읽어서 붙이고 다시 통째로 썼다. 읽기와 쓰기 사이가 벌어져 있어
       둘이 거의 같은 때 표시하면 나중 사람이 앞사람 표시를 «지웠다».
       트랜잭션은 서버가 그 사이 바뀌면 알아서 다시 해 준다 — 둘 다 남는다. */
    var me={by:(S.me&&S.me.sid)||'',byName:(S.me&&S.me.name)||'',at:new Date().toISOString()};
    fbDb.ref(p).transaction(function(cur){
      var arr=Array.isArray(cur)?cur.slice():[];
      arr.push(me);
      return arr;
    }, function(err,committed){
      if(err||!committed){ toast('실패: '+((err&&err.message)||'다시 눌러 주세요'),'err'); return; }
      toast('⚠ 정정 요청 표시됨'); renderDrawer(); route();
    });
  });
}
function kbUnflag(kind,key,id){
  fbDb.ref(NS+'/kb/'+kind+'/'+key+'/'+id+'/flags').remove()
    .then(function(){ toast('정정 요청 해제 — 내용을 고쳤다면 카드를 새로 올려 주세요'); renderDrawer(); route(); })
    .catch(function(e){ toast('실패: '+e.message,'err'); });
}
function kbDel(kind,key,id){
  confirmM('이 지식 카드를 삭제할까요?\n\n되돌릴 수 없습니다.',{ok:'삭제',danger:true}).then(function(ok){ if(!ok)return;
    fbDb.ref(NS+'/kb/'+kind+'/'+key+'/'+id).remove()
      .then(function(){ toast('카드 삭제됨'); renderDrawer(); route(); })
      .catch(function(e){ toast('실패: '+e.message,'err'); });
  });
}
function calBase(){ return new Date((S.calDate||todayStr())+'T00:00:00'); }
function calRange(){
  var d=calBase(), days=[], i;
  if(S.calView==='day') return {days:[ymd(d)],month:d.getMonth()};
  if(S.calView==='week'){ var m=mondayOf(d);
    for(i=0;i<7;i++) days.push(ymd(addDays(m,i)));
    return {days:days,month:d.getMonth()}; }
  var start=mondayOf(new Date(d.getFullYear(),d.getMonth(),1));
  var lastMon=mondayOf(new Date(d.getFullYear(),d.getMonth()+1,0));
  var wks=Math.round((lastMon-start)/604800000)+1;
  for(i=0;i<wks*7;i++) days.push(ymd(addDays(start,i)));
  return {days:days,month:d.getMonth()};
}
function calWeekKeys(R){
  var ks={}, a=R.days[0], b=R.days[R.days.length-1], d=new Date(a+'T00:00:00'), end=new Date(b+'T00:00:00');
  while(d<=end){ ks[weekKeyOf(mondayOf(d))]=1; d=addDays(d,7); }
  ks[weekKeyOf(mondayOf(end))]=1;
  return Object.keys(ks);
}
// 현장 방문 레이어를 켠 뒤 자료를 «한 번만» 읽으려는 표시
var _visCalT = 0;
// 날짜 → 이벤트 목록
function calBuild(R){
  var L=S.calLay||{}, map={}, teamWide=(S.view==='team'), who=viewer();
  R.days.forEach(function(d){ map[d]=[]; });
  function add(d,ev){ if(map[d]) map[d].push(ev); }
  function sidOK(sid){ return teamWide||!who.sid||sid===who.sid; }
  if(L.due||L.next) openItems().forEach(function(it){
    if(!teamWide&&!isOf(it,who)) return;
    var co=it.company||it.client||it.title||'';
    if(L.due&&it.due) add(it.due,{k:'due',t:'📅 '+co,s:it.title||'',c:'#dc2626',it:it._id,drag:1});
    if(L.next&&it.next&&it.next.date)
      add(it.next.date,{k:'next',t:'📌 '+(it.next.text||'할 일'),s:co,c:'#2563eb',it:it._id,drag:1});
  });
  // 사건 단계 기한 — 푸른이알피가 송달일·판정일에서 계산해 내려보낸 값이다.
  // 여기서 옮기면 계산 결과와 어긋나므로 끌 수 없게 둔다(drag 없음).
  if(L.sdue) openItems().forEach(function(it){
    if(!teamWide&&!isOf(it,who)) return;
    var pd=it.pe_due; if(!pd||!pd.date||!map[pd.date]) return;
    add(pd.date,{k:'sdue',t:'⚖ '+(pd.label||'단계 기한')+(pd.verified?'':'(확인)'),
      s:(it.company||it.client||it.title||''),c:pd.verified?'#991b1b':'#854d0e',it:it._id});
  });
  /* 현장 방문 — 「언제 · 어디에 · 누구와」를 달력에 얹는다 (대표 지시 2026-09-05).
     ⚠ 읽어 온 것이 있을 때만 그린다. 달력을 그리려고 컨설팅일정을 새로 내려받지 않는다
       (옆줄 숫자에서 이미 정한 규칙이다 — 숫자 하나 때문에 통째로 받지 않는다).
     ⚠ 현장(isField)만. 사무실 일정은 「현장 방문」이 아니다.
     ⚠ 끌어 옮길 수 없다(drag 없음) — 원본은 정부사업일정이고 여기는 보기만 한다. */
  if(L.vis && !VIS.scheds && !_visCalT){
    /* 켰는데 아직 안 읽었으면 «그때» 한 번 읽는다 — 켜는 것으로 본인이 뜻을 밝힌 것이다.
       ⚠ 한 번만. 못 읽어도 다시 안 부른다(빈 달력이 되더라도 계속 두드리지 않는다). */
    _visCalT = 1;
    try{ visLoad().then(function(){ route(); }, function(){}); }catch(e){}
  }
  if(L.vis && VIS.scheds) {
    var _vg = visGovStaffId(who);
    if(_vg) visRows(VIS.scheds).forEach(function(s){
      if(!s || !s.date || s.isField === false || !map[s.date]) return;
      if(!teamWide && !visForGid(s, _vg)) return;
      var _with = visWithNames(s, _vg);
      add(s.date, { k:'vis', t:'🚩 '+(visName(VIS.cos, s.coId)||'현장'),
        s:(_with.length ? _with.join(' · ')+' 와 함께' : (visWhere(s)||visName(VIS.types, s.typeId)||'')),
        c:'#166534', go:s.id });
    });
  }
  // 진행 단계 — 기한을 넣은 미완료 단계만 (완료된 것까지 깔리면 달력이 지저분해진다)
  if(L.step) openItems().forEach(function(it){
    if(!teamWide&&!isOf(it,who)) return;
    stepsOf(it._id).forEach(function(s){
      if(s.done||!s.d||!map[s.d]) return;
      add(s.d,{k:'step',t:'☐ '+s.t,s:(it.company||it.title||'')+(s.g?' · '+s.g:''),c:'#2563eb',it:it._id});
    });
  });
  if(L.log) calWeekKeys(R).forEach(function(wk){
    Object.keys(wkCache[wk]||{}).forEach(function(iid){
      var it=items[iid]; if(!it) return;
      if(!teamWide&&!isOf(it,who)) return;
      wkLogsOf(iid,wk).forEach(function(l){
        if(!l||!l.d||!map[l.d]) return;
        add(l.d,{k:'log',t:'✍ '+(l.t||''),s:it.company||it.title||'',c:'#2563eb',it:iid});
      });
    });
  });
  if(L.sch&&calSrc.sch) calSrc.sch.forEach(function(s){
    if(!s||!s.date||!map[s.date]) return;
    if(s.externalId){ if(!teamWide) return; }         // 외부 협력자 일정은 팀 전체에서만
    else if(!sidOK(s.sid)) return;
    add(s.date,{k:'sch',tm:s.time||'',s:s.note||'',c:'#2563eb',
      t:(s.time?s.time+' ':'')+(s.title||'일정')+(teamWide&&!s.externalId?' · '+calName(s.sid):'')});
  });
  if(L.att&&calSrc.att) calSrc.att.forEach(function(r){
    if(!r||!r.date||!map[r.date]||!ATT_LBL[r.type]||!sidOK(r.sid)) return;
    add(r.date,{k:'att',t:ATT_LBL[r.type]+(teamWide?' '+calName(r.sid):''),s:r.note||'',c:'#2563eb'});
  });
  if(L.loa&&calSrc.loa) calSrc.loa.forEach(function(l){
    if(!l||!l.startDate||!sidOK(l.sid)) return;
    var lb='🏠 '+(l.typeLabel||l.loaType||'휴직')+(teamWide?' '+calName(l.sid):'');
    if(map[l.startDate]) add(l.startDate,{k:'loa',t:lb+' 시작',c:'#94a3b8'});
    if(l.endDate&&l.endDate!==l.startDate&&map[l.endDate]) add(l.endDate,{k:'loa',t:lb+' 종료',c:'#94a3b8'});
  });
  // 사건 마감 — 자동 연동이 이미 읽어 둔 마스터를 그대로 쓴다(추가 조회 없음)
  if(L.dl&&peMaster.case) peMaster.case.forEach(function(c){
    if(!c||_peClosed(c)||!sidOK(c.managerMain)) return;
    (c.deadlines||[]).forEach(function(d){
      if(!d||!d.date||!map[d.date]) return;
      add(d.date,{k:'dl',t:'⚖ '+(c.title||c.caseNo||'사건')+' 마감',s:c.companyName||'',c:'#854d0e'});
    });
  });
  var ord={}; CAL_LAYERS.forEach(function(l,i){ ord[l[0]]=i; });
  // 시간이 있는 일정이 먼저(시간순), 그 다음 레이어 순.
  // localeCompare는 쓰지 않는다 — 물결표 같은 기호를 숫자보다 앞으로 정렬해 순서가 뒤집힌다.
  Object.keys(map).forEach(function(d){
    map[d].sort(function(a,b){
      var at=a.tm||'', bt=b.tm||'';
      if(at&&bt) return at<bt?-1:(at>bt?1:ord[a.k]-ord[b.k]);
      if(at) return -1;
      if(bt) return 1;
      return ord[a.k]-ord[b.k];
    });
  });
  return map;
}
// 색은 점으로만 알리고 글자는 진한 중성색으로 둔다 — 옅은 배경 위 색글씨는 잘 안 읽힌다
/* 캘린더 일정 한 칸. 누르는 자리마다 하는 일이 다르다 —
   ① 글자를 누르면 그 업무 줄로 데려가고 기록 칸에 커서를 둔다 (가장 잦은 일)
   ② ✏️은 그 자리에서 바로 한 줄 적기 (표로 갈 것도 없을 때)
   ③ ⤢는 그 업무 서랍 열기 (한 건을 깊게 볼 때)
   푸른이알피 자료(일정·근태 등)는 우리 업무가 아니라 ①②③이 없다. */
function calEvHTML(e){
  var mine=!!e.it, j=mine?escJ(e.it):'';
  return '<span class="cev'+(e.drag?' dg':'')+(mine?' own':'')+'" style="background:'+e.c+'12"'
    +(e.drag?' draggable="true" ondragstart="calDrag(event,\''+j+'\',\''+e.k+'\')"':'')
    +' title="'+esc(CAL_NAME[e.k]+' · '+e.t+(e.s?' — '+e.s:'')
        +(mine?'  (누르면 그 업무 줄로)':'')+(e.drag?'  (끌어서 날짜 변경)':''))+'">'
    +'<span class="cd" style="background:'+e.c+'"></span>'
    /* ⚠ 현장 방문은 푸른이알피 캘린더가 아니라 «정부사업일정»의 그 일정으로 간다.
       사진도 거기서 넣는다 — 목록에서 줄을 누르는 것과 같은 길(visGo). */
    +'<span class="cx"'+(mine?' onclick="event.stopPropagation();calGo(\''+j+'\')"'
                             :(e.go?' onclick="event.stopPropagation();visGo(\''+escJ(e.go)+'\')"'
                                   :' onclick="event.stopPropagation();openPuerpCal()"'))+'>'+esc(e.t)+'</span>'
    +(mine?'<span class="cvb" onclick="event.stopPropagation();calQuick(\''+j+'\',this)" title="여기서 바로 한 줄 적기">✏️</span>'

/* ── 캘린더 ↔ 표 ────────────────────────────────────────────────── */
// 그 날 캘린더에 뜬 우리 업무 id — 날짜 칸을 눌러 "그 날 것만" 볼 때 쓴다
function calDaySet(d){
  if(!d) return null;
  var R={days:[d],month:new Date(d+'T00:00:00').getMonth()};
  var map=calBuild(R), ids={};

}
/* 캘린더에서 그 날 것만 보기.
   ⚠ 고른 날이 지금 보고 있는 주가 아니면 그 주로 함께 옮긴다. 예전에는 걸러만
     놓고 주는 그대로 두어, 8/12 를 고르면 표는 8.3~8.7 을 보여 준 채 한 건도
     안 남았다 — 자료가 사라진 것처럼 보인다. 고른 날이 표에 보여야 한다. */
function calDayOnly(d){
  S.calDay=(S.calDay===d)?'':(d||'');
  _calDayFor=null;                             // 다음 그리기에서 다시 센다
  // 고른 날 칸으로 커서까지 옮긴다 — 날짜를 누르고 바로 적기 시작할 수 있게.
  // 그리기가 끝난 뒤에 잡아야 하므로 표시만 남기고 renderMy 끝에서 처리한다.
  // 팀 전체에는 요일 칸이 없다. 거기서 고른 표시가 남아 있다가 내 업무로
  // 돌아왔을 때 뜬금없이 커서가 잡히면 안 되므로 그 화면에서는 남기지 않는다.
  S._calFocus=(S.view==='team')?'':(S.calDay||'');

   줄이 그 날 것부터 오므로 첫 칸이 곧 가장 관련 있는 줄이다.
   요일별로 쪼개 보고 있을 때만 그 날 칸이 있다(한 칸 보기에는 날짜가 없다). */
function calFocusDay(){

function calGo(id){
  var r=document.querySelector('tr[data-i="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');
  if(!r){
    // 걸러 보기나 접힌 묶음에 가려 있을 수 있다 — 한 번은 풀어 보고 다시 찾는다
    var team=(S.view==='team');
    var hidden=team?(S.calDay||S.q||S.teamNolog||S.teamStale||fAny('team')||Object.keys(S.teamFold||{}).length)
                   :(S.calDay||S.q||S.f||S.myRole||fAny('my'));
    if(hidden&&!_calGoTry){
      _calGoTry=1; toast('걸러 보기에 가려 있어 조건을 풀었습니다');
      if(team){ S.teamFold={}; teamReset(); } else myReset();
      setTimeout(function(){ calGo(id); _calGoTry=0; },80); return;
    }
    _calGoTry=0; toast('이 화면에 없는 업무입니다','warn'); return;
  }
  _calGoTry=0;
  r.scrollIntoView({block:'center',behavior:'smooth'});
  r.classList.add('hit');
  setTimeout(function(){ r.classList.add('off'); },900);
  setTimeout(function(){ r.classList.remove('hit');r.classList.remove('off'); },1800);
  var inp=r.querySelector('.wkin');

}
// 캘린더 안에서 바로 한 줄 적기 — 일정 칸을 입력칸으로 잠깐 바꾼다
function calQuick(id,el){
  var box=el&&el.parentNode; if(!box) return;
  if(box.querySelector('.cqin')) return;
  var keep=box.innerHTML;
  box.innerHTML='<input class="cqin" placeholder="한 줄 기록… Enter 저장">';
  var inp=box.querySelector('.cqin');
  function back(){ box.innerHTML=keep; }
  inp.addEventListener('keydown',function(ev){
    ev.stopPropagation();
    if(_ime(ev)) return;               // 한글 조합 중 Enter는 글자를 확정하는 것이다
    if(ev.key==='Escape'){ back(); return; }
    if(ev.key!=='Enter') return;
    ev.preventDefault();
    var t=inp.value; if(!t.trim()){ back(); return; }
    inp.disabled=true;
    addLog(id,t).then(function(ok){ if(ok) route(); else back(); });
  });
  inp.addEventListener('blur',function(){ setTimeout(back,150); });
  inp.focus();
}

  }
  function up(){
    document.removeEventListener('pointermove',mv);
    document.removeEventListener('pointerup',up);

    try{ localStorage.setItem(CALW_KEY,String(parseFloat(side.style.width)||400)); }catch(e2){}
  }

  document.addEventListener('pointerup',up);
}

/* ── 팀 현황판 ──────────────────────────────────────────────────
   팀 전체는 진행 건이 이백 건을 넘는다. 한 표에 다 펼치면 스크롤이 유일한 길이 되고,

var TEAMVIEW_KEY='work_team_view';

function teamCardData(open,wk,today){
  var by={};
  function slot(nm){ return by[nm]||(by[nm]={nm:nm,main:0,sub:0,over:0,soon:0,stale:0,rec:0}); }
  /* ⚠ 칸은 «주담당인 사람» 에게만 만든다 — 아래 담당별 묶음(teamNames)과 같은 규칙이다.
     부담당 칸에는 사람 이름이 아닌 것이 섞여 있다. 엑셀 이관이 「공동작업자」 칸의
     글을 명부와 대조 없이 그대로 담았기 때문이다(「- 전화번호 : 042-…」, 「① 노동청」).
     그것들로도 칸을 만들었더니 열두 사람 자리에 마흔 칸이 깔려 화면을 못 읽었다.
     그래서 부담당 수는 «이미 자기 칸이 있는 사람» 에게만 더한다. */
  open.forEach(function(it){
    var nm=(it.mgr_main&&it.mgr_main.name)||'(담당 미지정)';
    var s=slot(nm); s.main++;
    /* ⚠ 넘겨받은 today 로 센다 — 아래 「방치」와 «같은 오늘»이어야 한다.
       예전에는 여기만 진짜 오늘을 봐서, 한 칸 안에 오늘이 둘이었다. */
    var d=dday(itemDue(it),today);
    if(d!==null&&d<0) s.over++;
    else if(d!==null&&d<=7) s.soon++;
    var ld=(it.last&&it.last.d)||'';
    if(countsLog(it)&&(!ld||_dayDiff(today,ld)>=14)) s.stale++;
    if(wkLogsOf(it._id,wk).length) s.rec++;
  });
  // 부담당은 두 번째 바퀴에서 — 그래야 주담당 칸이 다 만들어진 뒤에 견줄 수 있다
  open.forEach(function(it){
    var nm=(it.mgr_main&&it.mgr_main.name)||'(담당 미지정)';
    mgrSubNames(it).forEach(function(n){ if(n&&n!==nm&&by[n]) by[n].sub++; });
  });
  var out=Object.keys(by).map(function(k){ return by[k]; });
  /* 손봐야 할 것이 많은 사람이 위로. 기한이 지난 것이 가장 급하고 임박이 그다음이다.
     같으면 건수, 그래도 같으면 이름순 — 자리가 볼 때마다 뒤집히지 않게. */
  out.sort(function(a,b){
    var wa=a.over*4+a.soon*2+a.stale, wb=b.over*4+b.soon*2+b.stale;
    if(wa!==wb) return wb-wa;
    if(a.main!==b.main) return b.main-a.main;
    return String(a.nm).localeCompare(String(b.nm),'ko');
  });
  return out;
}

/* ── 부담당 칸 정리 ──────────────────────────────────────────────
   엑셀 이관이 「공동작업자」 칸의 글을 명부와 대조하지 않고 그대로 부담당에 담았다.
   그래서 「- 전화번호 : 042-520-8062」·「① 노동청」·「- 조사관 : 강두환 조사관」 같은 것이
   사람 자리에 앉아 있다. 표의 부담당 열과 깔때기 목록에 그대로 나온다.

   ⚠ 「사람인가」는 ownerOptions() 로 판정한다 — 이 화면이 이미 쓰는 정의다.
     = 재직 명부 + «주담당으로 등장하는 이름»(퇴직자가 여기 들어온다).
     이름 모양으로 짐작하지 않는다. 「① 노동청」은 걸러도 「박은비」는 못 걸러야 하는데,
     글자만 봐서는 「서경숙 팀장」이 사람인지 아닌지 가릴 수 없다.
   ⚠ 지우기 전에 반드시 목록을 보여 준다. 사람을 실수로 지우면 되돌릴 길이 없다. */
function subJunkList(){
  var ok={};
  ownerOptions().forEach(function(u){ if(u&&u.name) ok[u.name]=1; });
  if(!Object.keys(ok).length) return [];        // 명부를 아직 못 읽었다 — 아무것도 판정하지 않는다
  var m={};
  allItems().forEach(function(it){
    mgrSubNames(it).forEach(function(n){
      if(ok[n]) return;
      var e=m[n]||(m[n]={name:n,n:0,ex:''});
      e.n++;
      if(!e.ex) e.ex=(it.company||it.title||it.no||'').slice(0,24);
    });
  });
  return Object.keys(m).map(function(k){ return m[k]; })
    .sort(function(a,b){ return b.n-a.n||String(a.name).localeCompare(String(b.name),'ko'); });
}

function subJunkRun(){
  var L=S._sj||[], pick={}, nPick=0;
  [].slice.call(document.querySelectorAll('.sjv')).forEach(function(c){
    if(!c.checked) return;
    var x=L[+c.getAttribute('data-i')]; if(x){ pick[x.name]=1; nPick++; }
  });
  var msg=$('sjmsg');
  if(!nPick){ if(msg) msg.innerHTML='<b style="color:var(--danger)">고른 것이 없습니다.</b>'; return; }
  var up={}, nItem=0;
  allItems().forEach(function(it){
    var cur=it.mgr_subs||[];
    var left=cur.filter(function(s){ return !(s&&pick[s.name]); });
    if(left.length===cur.length) return;
    up[NS+'/items/'+it._id+'/mgr_subs']=left.length?left:null;
    nItem++;
  });
  if(!nItem){ if(msg) msg.innerHTML='지울 것이 없습니다.'; return; }
  if(msg) msg.textContent='지우는 중…';
  fbDb.ref().update(up).then(function(){
    closeM();
    toast('🧹 부담당 '+nPick+'가지를 '+nItem+'건에서 지웠습니다');
    renderTeam();
  }).catch(function(e){
    if(msg) msg.innerHTML='<b style="color:var(--danger)">지우지 못했습니다 — '+esc(e&&e.message||'')+'</b>';
  });
}

  function preF(it){

  function tf(k,w){    // 깔때기 + 정렬

  function ts(k,label,w){   // 정렬만 (걸러 볼 값이 마땅치 않은 열)

  /* 주담당은 묶음 머리에 있으니 묶어 볼 때는 열이 필요 없다. 평면일 때만 낸다 —

  var showMain=!!S.teamFlat, TCOLS=9+(showMain?1:0);
  h+='<div class="panel tbl" id="teamtbl"><table><thead><tr class="fhead">'

    // 부담당은 기업명 옆에 붙여 두니 이름 길이에 따라 줄이 들쭉날쭉했다 — 제 열로 뺀다
    +tf('sub','width:112px')

    +'<th style="width:58px;text-align:center">종료</th>'

  // 담당 이름 한 칸 — 주담당·부담당이 같은 모양을 쓰게 한다
  function mgrCell(nm,hi){

        +colTD('team','sub',subCell(it))

        // 상태 — 남의 업무라 눌러서 바꾸지는 않는다(보기만)

        +'<td style="text-align:center"><button class="endbtn" onclick="event.stopPropagation();completeItem(\''+escJ(it._id)+'\')" '
        +'title="이 업무를 끝내고 종료 화면으로 옮깁니다'+(peLinked(it)?' (푸른이알피 종료 연동)':'')+'">종료'
        +(peLinked(it)?'<span class="lk">🔗</span>':'')+'</button></td></tr>';
    }).join('');
  }
  var shown=0;
  if(S.teamFlat){                                    // 평면 보기 — 한 표로 정렬

    h+=rowsOf(flat,false);
  }else{
    names.forEach(function(nm){
      var arr=groups[nm].filter(pass);       // 담당 조건도 깔때기가 본다 — 여기서 또 거르지 않는다
      if(!arr.length) return;

      var rec=groups[nm].filter(function(it){return wkLogsOf(it._id,wk).length>0;}).length;
      var fold=!!(S.teamFold||{})[nm];
      h+='<tr class="grp-h" style="cursor:pointer" onclick="teamFold(\''+escJ(nm)+'\')" '
        +'title="'+(fold?'펼치기':'접기')+' — 이 줄을 누르세요"><td colspan="'+TCOLS+'">'
        +'<span class="fold">'+(fold?'▸':'▾')+'</span> 👤 '+esc(nm)+' — 진행 '+groups[nm].length+'건'
        +(arr.length!==groups[nm].length?' <span class="muted" style="font-weight:600">(조건 '+arr.length+'건)</span>':'')
        +' <span class="pct">이 주 기록 '+rec+'/'+groups[nm].length+'</span></td></tr>';
      if(!fold) h+=rowsOf(teamSortArr(arr,wk),true);
    });
  }
  if(!shown) h+='<tr><td colspan="'+TCOLS+'" class="moremark">조건에 맞는 업무가 없습니다. 열 이름을 눌러 조건을 바꿔 보세요.</td></tr>';
  h+='</tbody></table></div>';
  h+='<div class="muted" style="font-size:12px;margin-top:8px">'
    +(anyF?'조건에 맞는 업무 '+shown+' / 전체 '+open.length+'건'
        +' <span class="chipbtn" onclick="teamReset()" title="걸러 보기를 모두 해제합니다">✕ 조건 해제</span>'
       :'진행 중 '+open.length+'건')+'</div>';
  app.innerHTML=h+splitClose();
  if(S.fPop) fPopPos();
  if(S.colPop) colPopPos();
  calAfter();
  arFit();                      // 표를 창 아래까지 — 종료 화면과 같은 규칙
}
function teamSort(k){ if((S.teamSort||'due')===k) S.teamDesc=!S.teamDesc; else { S.teamSort=k; S.teamDesc=false; } renderTeam(); }
function teamSortArr(arr,wk){
  var k=S.teamSort||'due', dir=S.teamDesc?-1:1;
  function key(it){
    if(k==='cat') return it.cat||'';
    if(k==='co') return it.company||it.client||'';
    // 부담당 없는 건은 뒤로 — 이름 순으로 볼 때 빈 줄이 앞에 몰리면 읽기 나쁘다
    if(k==='sub'){ var ss=mgrSubNames(it); return ss.length?ss.slice().sort().join(','):'힣'; }
    if(k==='title') return it.title||'';
    /* 기록 열 정렬 — 이 주에 쓴 게 없는 것부터, 그중에서도 오래 묵은 것부터 위로.
       밀린 일을 찾는 게 이 열을 정렬하는 이유다. */
    if(k==='log') return (wkLogsOf(it._id,wk).length?'1':'0')+((it.last&&it.last.d)||'0000-00-00');
    return itemDue(it)||'9999-99-99';            // 기한 없는 건은 뒤로
  }
  return arr.slice().sort(function(a,b){
    var r=String(key(a)).localeCompare(String(key(b)),'ko');
    return (r||String(a.no||'').localeCompare(String(b.no||''),'en',{numeric:true}))*dir;
  });
}
function teamFold(nm){ S.teamFold=S.teamFold||{}; S.teamFold[nm]=!S.teamFold[nm]; renderTeam(); }
// 담당자 이름 목록 — 화면의 묶음과 [모두 접기]가 같은 목록을 써야 개수가 어긋나지 않는다
function teamNames(){
  var m={};
  openItems().forEach(function(it){ m[(it.mgr_main&&it.mgr_main.name)||'(담당 미지정)']=1; });
  return Object.keys(m).sort();
}
function teamFoldAll(on){
  S.teamFold={};
  if(on) teamNames().forEach(function(n){ S.teamFold[n]=1; });
  renderTeam();
}
function teamReset(){ fResetCols('team'); S.fPop=''; S.teamNolog=false; S.teamStale=false; S.q=''; S.calDay=''; renderTeam(); }

/* ── 업무량 (사람별 비교·관리) ── */
// 최근 n주 기록을 모두 로드
function _dayDiff(a,b){ return Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000); }

/* ══════ 업무량 기간 = «달» (대표 지시 2026-08-20) ══════════════════
   전에는 주였다(이번 주·최근 4주·최근 12주). 노무 일은 달로 끊어 보는 것이
   몸에 배어 있어(급여·성과급·마감이 모두 달) 달로 바꾼다.

   ⚠ 기록은 «주» 열쇠로 쌓인다(2026-W34). 달과 주는 서로 걸친다.
     그래서 겹치는 주를 모두 읽어 오되 **줄은 날짜로 다시 걸러** 센다 —
     안 그러면 8월 1일이 낀 7월 마지막 주의 기록이 7월에도 8월에도 잡힌다.
   ⚠ 날짜가 없는 옛 기록은 «그 주의 월요일» 것으로 본다. 늘 세면 이웃한 두 달에
     겹쳐 잡히고, 늘 빼면 옛 기록이 통째로 사라진다. */
var ST_PERIODS=[['m0','이번 달'],['m1','지난 달'],['m3','최근 3개월']];
function stRange(p){
  var n=new Date(), y=n.getFullYear(), m=n.getMonth();
  if(p==='m1') return {from:new Date(y,m-1,1), to:new Date(y,m,0)};
  if(p==='m3') return {from:new Date(y,m-2,1), to:new Date(y,m+1,0)};
  return {from:new Date(y,m,1), to:new Date(y,m+1,0)};
}
/* 그 기간에 «걸치는» 주를 모두 — 첫날이 낀 주부터 끝날이 낀 주까지 */
function stWeekKeys(from,to){
  var out=[], d=mondayOf(from), end=mondayOf(to);
  for(var g=0; d<=end && g<200; g++){ out.push(weekKeyOf(d)); d=addDays(d,7); }
  return out;
}
function loadWeekKeys(keys){
  return Promise.all(keys.map(loadWeekOnce)).then(function(){ return keys; });
}
function setStP(p){ S.stP=p; renderStats(); }
/* 「2026년 8월」 · 「2026년 6~8월」 — 날짜 두 개보다 이쪽이 한눈에 읽힌다.
   정확한 날짜는 말풍선에 남긴다(월말이 30일인지 31일인지 볼 일이 있다). */
function stRangeLabel(R){
  var a=R.from, b=R.to;
  var ay=a.getFullYear(), am=a.getMonth()+1, by=b.getFullYear(), bm=b.getMonth()+1;
  if(ay===by && am===bm) return ay+'년 '+am+'월';
  if(ay===by) return ay+'년 '+am+'~'+bm+'월';
  return ay+'년 '+am+'월 ~ '+by+'년 '+bm+'월';
}
function renderStats(){
  var app=$('app'); if(!app)return;
  var per=S.stP||'m0';
  var perName=(ST_PERIODS.filter(function(x){return x[0]===per;})[0]||ST_PERIODS[0])[1];
  var R0=stRange(per), from=ymd(R0.from), to=ymd(R0.to);
  app.innerHTML=loadingHTML(perName+' 업무량 집계 중…');
  loadWeekKeys(stWeekKeys(R0.from,R0.to)).then(function(wks){
    if(S.view!=='stats') return;
    var today=todayStr(), open=openItems();
    var rows={};
    function R(nm){ return rows[nm]=rows[nm]||{name:nm,open:0,den:0,cats:{},logged:{},lines:0,stale:0,due:0,over:0,done:0}; }
    var owner={};
    open.forEach(function(it){
      var nm=(it.mgr_main&&it.mgr_main.name)||'(담당 미지정)';
      owner[it._id]=nm;
      var r=R(nm); r.open++;
      var c=it.cat||'기타'; r.cats[c]=(r.cats[c]||0)+1;
      /* 기록률의 분모 — 자문은 뺀다. 매주 적을 일이 없는 것을 분모에 넣으면
         기록률이 사람의 활동이 아니라 «자문사를 몇 곳 맡았나»를 나타내게 된다. */
      if(countsLog(it)) r.den++;
      var d=dday(itemDue(it));
      if(d!==null&&d<0) r.over++; else if(d!==null&&d<=7) r.due++;
      var ld=(it.last&&it.last.d)||'';
      if(countsLog(it)&&(!ld||_dayDiff(today,ld)>=14)) r.stale++;
    });
    wks.forEach(function(wk){ var w=wkCache[wk]||{};
      /* 날짜가 없는 옛 기록은 그 주의 월요일 것으로 본다 (위 풀이글 참고) */
      var wmon=ymd(mondayOfKey(wk));
      Object.keys(w).forEach(function(iid){
        var nm=owner[iid]; if(!nm) return;
        var o=w[iid]||{}, c=0;
        Object.keys(o).forEach(function(k){
          var d=(o[k]&&o[k].d)||wmon;
          if(d>=from && d<=to) c++;               /* 걸친 주에서 이 달 것만 센다 */
        });
        if(!c) return;
        var r=R(nm); r.lines+=c; r.logged[iid]=1;
      });
    });
    allItems().forEach(function(it){
      if(it.state!=='done'||!it.done_date) return;
      if(it.done_date<from||it.done_date>to) return;
      R((it.mgr_main&&it.mgr_main.name)||'(담당 미지정)').done++;
    });
    var list=Object.keys(rows).map(function(k){var r=rows[k];r.loggedN=Object.keys(r.logged).length;
      r.rate=r.den?Math.round(r.loggedN/r.den*100):0; return r;})
      .sort(function(a,b){return b.open-a.open;});
    var T={open:0,den:0,lines:0,stale:0,over:0,due:0,done:0,loggedN:0};
    list.forEach(function(r){ T.open+=r.open;T.den+=r.den;T.lines+=r.lines;T.stale+=r.stale;T.over+=r.over;T.due+=r.due;T.done+=r.done;T.loggedN+=r.loggedN; });
    var Trate=T.den?Math.round(T.loggedN/T.den*100):0;

    /* 0/75건 — 넓은 화면에서는 아랫줄, 폰 카드에서는 옆에 붙는다(줄을 아끼려고) */
    function catBar(r){

    }
    var h='<div class="row" style="flex-wrap:wrap"><h1>업무량</h1>'
      +'<span class="muted" style="font-size:12.5px" title="'+esc(from)+' ~ '+esc(to)+'">'
        +esc(stRangeLabel(R0))+'</span>'
      +'<span style="flex:1"></span>'
      +ST_PERIODS.map(function(x){
          return '<span class="chipbtn'+(per===x[0]?' on':'')+'" onclick="setStP(\''+x[0]+'\')">'+x[1]+'</span>';}).join('')
      +'</div>';
    h+='<div class="statbar">'
      +'진행 <b>'+T.open+'</b>건'
      +'<span class="sep">·</span>기록 <b>'+T.lines+'</b>줄'
      +'<span class="sep">·</span>기록률 <b'+(Trate<60?' style="color:var(--warn)"':'')+'>'+Trate+'</b>%'
      +'<span class="sep">·</span>완료 <b>'+T.done+'</b>건'
      +'<span class="sep">|</span>'
      +'<span class="muted">2주+ 방치 <b'+(T.stale?' style="color:var(--warn)"':'')+'>'+T.stale+'</b>'
      +' · 기한 지남 <b'+(T.over?' style="color:var(--danger)"':'')+'>'+T.over+'</b></span>'
      +'</div>';
    /* ⚠ 아이디를 붙인다 — 폰에서 이 표만 카드로 세운다. .panel.tbl 을 통째로 잡으면
       아직 손보지 않은 화면까지 함께 바뀐다(arFit 의 같은 경고와 한뜻). */
    h+='<div class="panel tbl" id="stattbl"><table><thead><tr>'
      +'<th class="rowno">#</th>'
      +'<th style="min-width:80px">담당</th><th style="width:58px;text-align:right">진행</th>'
      +'<th style="min-width:120px">구분 구성</th>'
      +'<th style="width:92px;text-align:right">기록률</th><th style="width:64px;text-align:right">기록 줄</th>'
      +'<th style="width:72px;text-align:right">2주+ 방치</th><th style="width:64px;text-align:right">임박</th>'
      +'<th style="width:64px;text-align:right">지남</th><th style="width:58px;text-align:right">완료</th></tr></thead><tbody>';
    if(!list.length) h+='<tr><td colspan="10" class="moremark">집계할 업무가 없습니다.</td></tr>';
    list.forEach(function(r,i){
      var rc=r.rate>=80?'var(--ok)':r.rate>=50?'var(--warn)':'var(--danger)';
      /* data-k = 폰 카드에서 숫자 앞에 붙일 이름표. data-empty = 0 인 칸(폰에서는 접는다).
         ⚠ 표 머리(th)와 «같은 말»이어야 한다 — 다르면 넓은 화면과 폰이 딴소리를 한다. */
      function numTd(k,v,extra){
        return '<td data-k="'+k+'"'+(v?'':' data-empty')
          +' style="text-align:right;font-variant-numeric:tabular-nums'+(extra||'')+'">'
          +(v||'—')+'</td>';
      }
      /* ⚠ 예전에는 「내 업무」를 그 사람 것으로 바꿔 열었다. 이제는 «팀 전체»로 보낸다 —
         남의 업무는 거기서 읽기만 한다(2026-09-05 대표 지시). */
      h+='<tr style="cursor:pointer" onclick="teamOnly(\''+escJ(r.name)+'\');go(\'team\')" title="팀 전체에서 이 담당자의 업무 보기">'
        +tdNo(i+1)
        +'<td data-c="name" style="font-weight:700">'+esc(r.name)+'</td>'

        +'<td data-c="bar">'+catBar(r)+'</td>'
        +'<td data-k="기록률" style="text-align:right"><b style="color:'+rc+'">'+r.rate+'%</b>'
          +'<span class="sub2">'+r.loggedN+'/'+r.open+'건</span></td>'
        +numTd('기록 줄',r.lines)
        +numTd('2주+ 방치',r.stale,(r.stale?';color:var(--warn);font-weight:700':''))
        +numTd('임박',r.due)
        +numTd('지남',r.over,(r.over?';color:var(--danger);font-weight:700':''))
        +numTd('완료',r.done)+'</tr>';
    });
    h+='</tbody></table></div>';
    h+='<div class="panel" style="font-size:12px;color:var(--sub);line-height:1.75">'
      +'<b>읽는 법</b> — <b>진행·구분 구성</b>은 <u>부하</u>(무엇을 얼마나 들고 있나), '
      +'<b>기록률·기록 줄</b>은 <u>활동</u>(얼마나 챙기고 있나)입니다. 성격이 다르니 섞어 보지 마세요.<br>'
      +'⚠️ <b>기록 줄 수를 성과 지표로 쓰지 마세요.</b> 줄 수로 평가하면 기록을 잘게 쪼개 부풀리게 되고, '
      +'그러면 이 화면의 숫자가 전부 못 쓰게 됩니다. 관리에 쓸 값은 <b>2주+ 방치</b>와 <b>기한 지남</b>입니다 — '
      +'이 둘은 실제 사고로 이어지는 신호입니다.<br>'
      +'행을 클릭하면 그 담당자의 업무 목록으로 이동합니다.</div>';
    app.innerHTML=h;
  }).catch(function(e){ if($('app'))$('app').innerHTML='<div class="panel">집계 실패: '+esc(e.message)+'</div>'; });
}

/* ── 보관함 — 종료된 업무를 담당자별로 관리 ── */
function _mgrOf(it){ return (it.mgr_main&&it.mgr_main.name)||'(담당 미지정)'; }
/* pesync 열쇠는 **푸른이알피가 만든다**(그쪽 wsSafeKey). 우리는 읽기만 하므로
   글자 하나까지 같은 규칙을 써야 한다. 다른 점은 하나 — 그쪽은 하이픈(-)도 _ 로
   바꾼다. 관리번호가 계약-2026-046 꼴이라 우리 safeKey 로 찾으면 거의 다 어긋나,
   푸른이알피가 실제로 종료했는데도 배지가 영원히 「반영 대기」였다.
   ⚠ safeKey 를 고치면 안 된다 — 그것은 우리 쪽 자료의 열쇠라 바꾸면 남의 자료를 잃는다. */
function peSyncKey(s){ return String(s==null?'':s).replace(/[.#$\/\[\]'"`\\\s\u0000-\u001F\u007F -]/g,'_'); }
function peSyncBadge(it){
  if(!peLinked(it)) return '';
  if(it.pe_nosync) return '<span class="pesync off" title="이 업무는 푸른이알피와 연동하지 않습니다">연동 안 함</span>';
  // 옛 열쇠로 적힌 기록이 남아 있을 수 있어 둘 다 본다
  var st=(pesync[it.ref.type+'-'+peSyncKey(it.ref.id)]
        ||pesync[it.ref.type+'-'+safeKey(it.ref.id)]||{});
  if(st.synced_at&&st.pe_closed===true) return '<span class="pesync done" title="푸른이알피도 종료됨 · '+esc((st.synced_at||'').slice(0,10))+'">🔗 반영됨</span>';
  return '<span class="pesync wait" title="푸른이알피 나의 업무를 열 때 반영됩니다">🔗 반영 대기</span>';
}
function arReset(){ S.arMgr=''; S.arCat=''; S.arPeriod=''; S.q=''; S.arWay=''; S.arRes=''; renderArchive(); }
/* 표 높이를 창 아래까지 채운다. 종전에는 100vh-250px 로 못 박아 두어, 머리를
   네 줄에서 한 줄로 줄인 뒤에도 250px 를 잡아먹어 아래가 잘렸다. 실제 자리를
   재서 남은 높이를 그대로 준다 — 머리가 또 바뀌어도 따라온다.
   ⚠ 아이디를 적어 둔 표만 손댄다. .panel.tbl 을 통째로 잡으면 아직 손보지 않은
     화면까지 함께 바뀐다. */
function arFit(){
  ['artbl','teamtbl','mytbl'].forEach(function(id){
    var t=$(id); if(!t) return;
    var top=t.getBoundingClientRect().top;
    t.style.maxHeight=Math.max(240,Math.round(window.innerHeight-top-26))+'px';
  });
}
window.addEventListener('resize',function(){ if($('artbl')||$('teamtbl')||$('mytbl')) arFit(); });
function arFold(nm){ S.arFold=S.arFold||{}; S.arFold[nm]=!S.arFold[nm]; renderArchive(); }
// 담당자가 여럿이면 하나씩 접는 것은 일이다. 화면의 묶음과 같은 목록을 써야 개수가 어긋나지 않는다.
function arFoldAll(on){
  S.arFold={};
  if(on) allItems().forEach(function(it){ if(it.state==='done') S.arFold[_mgrOf(it)]=1; });
  renderArchive();
}
function renderArchive(){
  var app=$('app'); if(!app)return;
  var all=allItems().filter(function(it){return it.state==='done';})
    .sort(function(a,b){return (b.done_date||'').localeCompare(a.done_date||'');});
  var today=todayStr();
  var mgrs={}; all.forEach(function(it){ mgrs[_mgrOf(it)]=1; });
  var names=Object.keys(mgrs).sort();
  // 기간 필터 경계
  var from='';
  if(S.arPeriod==='m1') from=ymd(addDays(new Date(),-30));
  else if(S.arPeriod==='m3') from=ymd(addDays(new Date(),-90));
  else if(S.arPeriod==='y') from=(new Date().getFullYear())+'-01-01';
  function pass(it){
    if(S.arWay&&endWay(it)!==S.arWay) return false;
    if(S.arRes&&String(it.end_result||'')!==S.arRes) return false;
    if(S.arMgr&&_mgrOf(it)!==S.arMgr) return false;
    if(S.arCat&&(it.cat||'기타')!==S.arCat) return false;
    if(from&&(it.done_date||'')<from) return false;
    if(S.q&&!matchQ(it,S.q)) return false;
    return true;
  }
  var done=all.filter(pass);
  /* 머리를 네 줄에서 한 줄로. 방식·담당은 칩을 죽 늘어놓아 두 줄을 먹었는데,
     고르는 값이지 늘 보아야 할 숫자가 아니다 — 드롭다운으로 접고, 숫자는
     그 안에 넣는다. 구분·기간이 이미 드롭다운이라 생김새도 맞는다. */
  function arCnt(fn){ return all.filter(fn).length; }
  function arSel(cur,onch,opts,title){
    // 고른 값이 있으면 파랗게 — 무엇 때문에 목록이 좁아졌는지 도구줄만 봐도 알게
    return '<select class="tool'+(cur?' on':'')+'" onchange="'+onch+'" title="'+esc(title)+'">'
      +opts.map(function(o){
          return '<option value="'+esc(o[0])+'"'+(String(cur||'')===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>';
        }).join('')+'</select>';
  }
  var h='<div class="row" style="flex-wrap:wrap"><h1>종료</h1>'
    +'<span class="cntpill" title="끝난 업무 — 기록·인수인계 노트는 그대로 남고 통계에도 계속 포함됩니다">'+all.length+'건</span>';
  if(!all.length){ app.innerHTML=h+'</div><div class="panel" style="text-align:center;color:var(--sub);padding:40px">끝난 업무가 없습니다.</div>'; return; }
  var wayOpts=[['','방식 전체 '+all.length]];
  END_WAYS.forEach(function(w){
    var c=arCnt(function(it){ return endWay(it)===w[0]; });
    if(c||w[0]==='done') wayOpts.push([w[0],w[1]+' '+c]);
  });
  var mgrOpts=[['','담당 전체 '+all.length]];
  names.forEach(function(nm){ mgrOpts.push([nm,nm+' '+arCnt(function(it){ return _mgrOf(it)===nm; })]); });
  // 사건 결과는 끝낸 방식과 다른 축이다 — 결과가 붙은 건이 있을 때만 낸다
  var resOpts=[['','결과 전체']];
  CASE_RESULTS.forEach(function(r){
    var c=arCnt(function(it){ return it.end_result===r[0]; });
    if(c) resOpts.push([r[0],r[2]+' '+r[1]+' '+c]);
  });
  var nFold=names.filter(function(n){ return (S.arFold||{})[n]; }).length;
  /* 기본은 평면(종료일 내림차순). 종료 화면에서 하는 일은 「그 회사 건 어떻게 끝났더라」와
     「잘못 종료한 것 재개」이고 둘 다 축이 날짜다. 사람별로 세는 일은 업무량 화면이
     이미 한다(담당별 표에 완료 열이 있다). 12건에 묶음 머리 5개는 배보다 배꼽이었다.
     담당은 열로 두고, 한 사람만 보려면 담당 드롭다운으로 좁힌다. */
  var flat=(S.arFlat===undefined)?true:!!S.arFlat;
  h+=qBox('renderArchive','🔍 기업·업무명·의뢰인')
    +'<span class="sepv"></span>'
    +arSel(S.arWay,'S.arWay=this.value;renderArchive()',wayOpts,'끝낸 방식으로 좁히기 — 종료·취소·이관')
    +arSel(S.arMgr,'S.arMgr=this.value;renderArchive()',mgrOpts,'담당자로 좁히기')
    +catSelect(S.arCat,'S.arCat=this.value;renderArchive()','tool'+(S.arCat?' on':''))
    +arSel(S.arPeriod,'S.arPeriod=this.value;renderArchive()',
        [['','기간 전체'],['m1','최근 30일'],['m3','최근 90일'],['y','올해']],'종료일 기간으로 좁히기')
    +(resOpts.length>1?arSel(S.arRes,'S.arRes=this.value;renderArchive()',resOpts,'사건 결과로 좁히기'):'')
    +'<span class="sepv"></span>'
    +'<span class="chipbtn'+(flat?'':' on')+'" onclick="S.arFlat=!'+(flat?'true':'false')+';renderArchive()" '
      +'title="'+(flat?'담당자별로 묶어 봅니다':'묶음을 풀고 한 표로 봅니다')+'">'+(flat?'👤 담당별 묶기':'▤ 한 표로')+'</span>'
    +(flat?''
      :'<span class="chipbtn'+(nFold>=names.length?' off':'')+'" onclick="arFoldAll(true)" title="담당자 '+names.length+'명을 모두 접습니다">▸ 모두 접기</span>'
       +(nFold?'<span class="chipbtn" onclick="arFoldAll(false)" title="접힌 '+nFold+'명을 모두 폅니다">▾ 펼치기 '+nFold+'</span>':''))
    +((S.arMgr||S.arCat||S.arPeriod||S.q||S.arWay||S.arRes)?'<span class="chipbtn on" onclick="arReset()" title="모든 조건 해제">✕ 조건</span>':'')
    +'<span style="flex:1"></span>'
    // 방식별 숫자는 고르지 않아도 늘 보이게 — 드롭다운 안에만 두면 한눈에 안 들어온다
    +'<span class="fnote">'+END_WAYS.map(function(w){
        var c=arCnt(function(it){ return endWay(it)===w[0]; });
        return c?w[1]+' <b>'+c+'</b>':'';
      }).filter(Boolean).join(' · ')+'</span>'
    +'</div>';
  /* 사업장·업무 종류·관리번호를 각각 제 열로. 한 칸에 이어 붙이면 기업명 길이에 따라
     뒤 글자가 들쭉날쭉해 세로로 훑을 수가 없다. 이관 대상도 결국 사건번호라
     관리번호 열에 → 로 이어 붙인다 — 어디서 어디로 갔는지가 한 줄에서 읽힌다. */
  var flatRows=flat||!!S.arMgr, showMgr=flatRows;
  h+='<div class="panel tbl" id="artbl"><table><thead><tr>'
    +'<th class="rowno">#</th><th style="width:52px">방식</th><th style="width:56px">구분</th>'
    +'<th style="width:186px">사업장</th><th style="width:196px">업무 종류</th><th style="width:236px">관리번호</th>'
    +(showMgr?'<th style="width:84px">담당</th>':'')
    +'<th style="width:88px">종료일</th><th style="width:96px">푸른이알피</th>'
    +'<th>마지막 기록</th><th style="width:66px"></th></tr></thead><tbody>';
  var COLS=10+(showMgr?1:0);
  // 이관 대상의 consulting:·case: 접두어는 구분 배지에 이미 있는 정보라 뗀다
  function shortRef(s){ return String(s||'').replace(/^[a-z]+:/,''); }
  function rowsOf(arr){
    return arr.map(function(it,i){
      var op='onclick="openDrawer(\''+escJ(it._id)+'\')"';
      return '<tr>'+tdNo(i+1)+'<td>'+endBadge(it)+resBadge(it)+'</td><td>'+catBadge(it.cat)+'</td>'
        +'<td class="itc" '+op+'><span class="cut co">'+esc(it.company||it.client||'—')+'</span></td>'
        +'<td class="itc" '+op+'><span class="cut kind">'+esc(itemName(it)||'—')+'</span></td>'
        +'<td><span class="cut no">'+esc(it.no||'—')
        +(endWay(it)==='transfer'&&it.end_to?' <span class="to">→ '+esc(shortRef(it.end_to))+'</span>':'')+'</span></td>'
        +(showMgr?'<td style="font-size:12.5px">'+esc(_mgrOf(it))+'</td>':'')
        +'<td style="font-size:12.5px;font-variant-numeric:tabular-nums">'+esc(it.done_date||'—')+'</td>'
        +'<td>'+(peSyncBadge(it)||'<span class="muted" style="font-size:11px">—</span>')+'</td>'
        +'<td>'+(it.last?'<span class="last">'+esc(it.last.t)+' <span class="ago">· '+esc(md(it.last.d))+'</span></span>':'<span class="muted" style="font-size:12px">기록 없음</span>')+'</td>'
        +'<td><button class="endbtn" onclick="event.stopPropagation();restoreItem(\''+escJ(it._id)+'\')" title="진행으로 되돌립니다'
        +(peLinked(it)&&!it.pe_nosync?' (푸른이알피도 종료 해제)':'')+'">↩ 재개</button></td></tr>';
    }).join('');
  }
  if(!done.length){ h+='<tr><td colspan="'+COLS+'" class="moremark">조건에 맞는 업무가 없습니다.</td></tr>'; }
  else if(flatRows){ h+=rowsOf(done); }
  else {
    names.forEach(function(nm){
      var arr=done.filter(function(it){return _mgrOf(it)===nm;});
      if(!arr.length) return;
      var fold=!!(S.arFold||{})[nm];

   나오므로 반드시 이름으로 바꿔 줘야 "부당해고·임금체불·취업규칙"이 보인다.
   (푸른이알피 kindSubLabel과 같은 규칙 — 숨김 유형도 포함해야 옛 이름이 유지된다) */
var PE_TKEY={company:'biz_company_types',case:'biz_case_types',consulting:'biz_cons_types',
  fund:'biz_fund_types',other:'biz_other_types'};
var peTypes={};
function peTypeName(kv,code){
  code=String(code==null?'':code).trim(); if(!code) return '';
  var arr=peTypes[kv]||[];
  for(var i=0;i<arr.length;i++){ if(arr[i]&&String(arr[i].code)===code) return String(arr[i].name||'').trim(); }
  return /\d/.test(code)?'':code;               // 숫자가 섞이면 내부 ID로 보고 버린다
}
// 마스터에 없을 때 쓰는 예전 칸 (푸른이알피 kindSubLabel의 뒷단과 같다)
/* 푸른이알피 원본이 스스로 달고 있는 상태 — 계약관리의 상담접수·계약협의·
   계약확정 같은 것. 우리 '상태'(내가 손으로 바꾸는 진행 상태)와는 다른 축이라
   덮지 않고 따로 읽어 나란히 보여준다. 이름은 푸른이알피 나의 업무와 같게 쓴다. */
var PE_ST_LABEL={progress:'진행중',pending:'대기',review:'검토중',open:'진행중',
  closed:'완료',done:'완료',cancelled:'취소',hold:'보류',
  consult:'상담접수',negotiate:'협의중',confirmed:'계약확정',signed:'최종확정',active:'진행중'};
function peStatus(x){
  var v=String((x&&(x.status||x.progressStatus))||'').trim();
  if(!v) return '';
  return PE_ST_LABEL[v]||(/[가-힣]/.test(v)?v:'');   // 모르는 코드는 버린다
}
function _peRawType(x,kv){
  if(kv==='consulting') return x.consultingType||x.programName||'';
  if(kv==='case')       return x.caseType||x.programName||'';
  if(kv==='fund')       return x.fundType||x.programName||'';
  if(kv==='other')      return x.programName||x.projectType||'';
  if(kv==='company')    return x.programName||x.advisoryType||'';
  return '';
}
// 업무 요약 — 푸른이알피와 양방향이라 PE_MIRROR(푸른이알피가 일방적으로 덮는 필드)에 넣지 않는다.
// 처음 연결할 때만 씨앗으로 가져오고, 이후 변경은 pesync가 양쪽을 비교해 맞춘다.
var BRIEF_MAX=40;
function briefTrim(v){ return String(v==null?'':v).replace(/\s+/g,' ').trim().slice(0,BRIEF_MAX); }
/* 검색·지식카드·서랍 제목에 쓰는 "한 줄 이름". 가장 구체적인 것부터 고른다. */
function itemName(it){
  if(!it) return '';
  return briefTrim(it.brief)||String(it.title||'').trim()||String(it.ptype||'').trim()||'';
}
/* 업무명 = 유형. 목록의 업무명 필터가 묶는 기준이기도 하다.
   (구분은 업체·사건·컨설팅·기금·기타사업, 업무명은 부당해고·임금체불·취업규칙) */
function ptOf(it){
  if(!it) return '';
  var p=String(it.ptype||'').trim(), t=String(it.title||'').trim();
  return p||t;
}
function needBrief(it){
  return !!it&&!briefTrim(it.brief)&&!String(it.title||'').trim()&&!String(it.ptype||'').trim();
}
/* 목록의 "업무" 칸 — 두 줄.
   윗줄 = 업무명: 푸른이알피 유형을 앞에 두고, 따로 적힌 업무명이 있으면 ' · '로 잇는다.
          푸른이알피 내 프로젝트 목록과 같은 방식이라 양쪽 글자가 어긋나지 않는다.
   아랫줄 = 업무 요약: 이 건이 구체적으로 무슨 일인지. 푸른이알피와 서로 반영된다.
   윗줄이 비면 요약을 끌어올려 쓰고(같은 말을 두 번 쓰지 않는다), 둘 다 비면
   바로 적을 수 있는 버튼을 낸다. */
function nameCell(it,xfer){
  if(!it) return '';
  var p=String(it.ptype||'').trim(), t=String(it.title||'').trim(), b=briefTrim(it.brief);
  // 이관한 계약이면 어디로 넘어갔는지 붙인다 — 감춤을 풀고 볼 때 까닭이 보인다
  var xf=(xfer&&xfer.length)?'<span class="xfer" title="이 계약에서 넘어간 곳입니다">→ '+esc(xfer.join('·'))+'</span>':'';
  var head=(p&&t&&t!==p)?(p+' · '+t):(p||t||'');
  function pen(lbl,tip){ return '<span class="prm" onclick="event.stopPropagation();briefEdit(\''
    +escJ(it._id)+'\')" title="'+tip+'">'+lbl+'</span>'; }
  if(!head&&!b) return '<span class="muted" title="유형·업무명·업무 요약이 모두 비어 있습니다">—</span>'
    +pen('✏️ 이름 적기','이 업무의 이름을 적습니다 — 푸른이알피에도 반영됩니다');
  if(!head) return '<span title="업무 요약 — 푸른이알피와 서로 반영됩니다">'+esc(b)+'</span>';
  return '<span title="업무명 — 푸른이알피 유형'+(t?'·업무명':'')+'">'+esc(head)+'</span>'+xf
    +(b?'<div class="brf" title="업무 요약 — 푸른이알피와 서로 반영됩니다">'+esc(b)+'</div>'
       :pen('✏️','무슨 일인지 한 줄 적어 두면 목록에서 바로 보입니다 — 푸른이알피 업무 요약에도 반영됩니다'));
}
// 업무 요약 한 건 입력 (푸른이알피 업무 요약 칸과 같은 값)
function briefEdit(id){
  var it=items[id]; if(!it) return;
  showModal('<h2 style="margin:0 0 6px">✏️ 업무 이름</h2>'
    +'<p class="muted" style="font-size:12px;margin:0 0 10px">'+esc(it.company||'')
    +' · '+esc(it.no||'')+'<br>푸른이알피의 <b>업무 요약</b> 칸과 같은 값입니다 — 여기서 적으면 그쪽에도 반영됩니다.</p>'
    +'<div class="fld"><label>업무 이름 (최대 '+BRIEF_MAX+'자)</label>'
    +'<input id="bf-t" maxlength="'+BRIEF_MAX+'" value="'+esc(briefTrim(it.brief))+'" '
    +'placeholder="예: 기술보호 컨설팅 / 일터혁신 컨설팅 / 퇴직금 미지급 진정"></div>'
    +'<div id="bf-msg" class="muted" style="font-size:12px;min-height:17px;margin-top:6px"></div>'
    +'<div class="row" style="justify-content:flex-end"><button onclick="closeM()">취소</button>'
    +'<button class="primary" onclick="briefSave(\''+escJ(id)+'\')">저장</button></div>');
  setTimeout(function(){ var e=$('bf-t'); if(e){ e.focus(); e.setSelectionRange(e.value.length,e.value.length); } },60);
}
function briefSave(id){
  var v=briefTrim((($('bf-t')||{}).value)||'');
  patchItem(id,{brief:v||null}).then(function(ok){
    if(!ok) return;
    closeM(); toast(v?('✏️ '+v):'업무 이름 지움'); renderDrawer(); route();
  });
}
/* 이름 없는 건을 한 화면에서 몰아 적는다 — 41건을 하나씩 열 수는 없다 */
function briefFillModal(){
  var arr=openItems().filter(needBrief)
    .sort(function(a,b){ return String(_mgrOf(a)).localeCompare(String(_mgrOf(b)),'ko')
      ||String(a.company||'').localeCompare(String(b.company||''),'ko'); });
