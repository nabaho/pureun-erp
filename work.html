document.addEventListener('keydown',function(e){
  // 걸러 보기 목록이 열려 있으면 그쪽이 먼저다 — Enter로 적용, Esc로 닫기
  if(_ime(e)) return;                  // 한글 조합 중에는 화면 단축키를 잡지 않는다
  if(S.fPop&&(e.key==='Enter'||e.key==='Escape')){
    e.preventDefault(); var p=String(S.fPop).split(':');
    if(e.key==='Enter') fApply(p[0],p[1]); else fPopClose(p[0]);
    return;
  }
  if(e.key==='Escape'){
    if($('hlpop')){ hlpClose(); return; }        // 설명 팝업이 먼저 닫힌다
    if($('confirmbg'))return;
    if($('modalbg')){ closeM(); return; }
    if($('calpop')){ closeCal(); return; }
    if(S.drawerId){ closeDrawer(); return; }
    var t=document.activeElement;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')){ t.blur(); return; }
    if(S.view!=='my'){ goBack(); }
    return;
  }
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){ e.preventDefault(); searchModal(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;         // 브라우저 단축키는 건드리지 않는다
  if(_inTyping(e)) return;                            // 글자를 치는 중에는 아무 것도 가로채지 않는다
  // ?는 Shift+/라서 /보다 먼저 봐야 한다
  if(_k(e,'/',true)){ e.preventDefault(); keysModal(); return; }
  if(_k(e,'/')){ e.preventDefault(); var q=$('qb'); if(q)q.focus(); return; }
  if($('modalbg')||$('confirmbg')) return;
  if(_k(e,'N')){ e.preventDefault(); itemModal(); return; }
  if(e.key==='Backspace'){ e.preventDefault();
    if(S.drawerId){closeDrawer();return;} if(S.view!=='my')goBack(); return; }
  var n=_kNum(e);
  if(n>=1&&n<=NAV_KEYS.length){ e.preventDefault(); go(NAV_KEYS[n-1]); return; }
  // 주 이동·기록 칸은 주간 표가 있는 화면에서만
  if(S.view==='my'||S.view==='team'){
    if(_k(e,'[')){ e.preventDefault(); shiftWeek(-1); return; }
    if(_k(e,']')){ e.preventDefault(); shiftWeek(1);  return; }
    if(_k(e,'T')){ e.preventDefault(); setWeek(null); return; }
    if(_k(e,'E')){ e.preventDefault(); wkFocus(0); return; }
  }
});
/* 한글 입력 상태에서는 T가 'ㅅ'으로 온다. 글자(key)만 보면 단축키가 죽으므로
   물리 자판 자리(code)도 함께 본다 — 자판을 한영 어느 쪽에 두든 똑같이 듣는다. */
var _KCODE={'/':'Slash','[':'BracketLeft',']':'BracketRight'};
function _k(e,ch,shift){
  if(shift!==undefined&&!!e.shiftKey!==!!shift) return false;
  if(shift===undefined&&e.shiftKey&&ch.length===1&&!/[A-Z]/.test(ch)) return false;
  var code=_KCODE[ch]||('Key'+ch.toUpperCase());
  if(e.code===code) return true;
  return e.key===ch||e.key===ch.toLowerCase()||e.key===ch.toUpperCase();
}
function _kNum(e){
  if(/^Digit[0-9]$/.test(e.code||'')) return +e.code.slice(5);
  if(/^Numpad[0-9]$/.test(e.code||'')) return +e.code.slice(6);
  return /^[0-9]$/.test(e.key)?+e.key:-1;
}
function wkPut(el){
  if(!el) return false;
  el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(e){}
  return true;
}
// 주간 기록 칸 — n번째 칸으로 (없으면 아무것도 안 한다)
function wkFocus(n){
  var all=[].slice.call(document.querySelectorAll('.wkin'));
  if(!all.length) return false;
  return wkPut(all[Math.max(0,Math.min(n,all.length-1))]);
}
// 위아래 = 같은 요일로 줄 옮기기 (요일별로 쪼개져 있을 때)
function wkMove(inp,d){
  var c=inp.getAttribute('data-c');
  if(c===null){                                   // 한 칸 보기 — 예전처럼 차례대로
    var all=[].slice.call(document.querySelectorAll('.wkin'));
    var i=all.indexOf(inp); return i<0?false:wkFocus(i+d);
  }
  var col=[].slice.call(document.querySelectorAll('.wkin[data-c="'+c+'"]'));
  var j=col.indexOf(inp); if(j<0) return false;
  return wkPut(col[Math.max(0,Math.min(j+d,col.length-1))]);
}
// 좌우 = 같은 줄에서 요일 옮기기
function wkSide(inp,d){
  var r=inp.getAttribute('data-r'); if(r===null) return false;
  var row=[].slice.call(document.querySelectorAll('.wkin[data-r="'+r+'"]'));
  var j=row.indexOf(inp); if(j<0) return false;
  return wkPut(row[Math.max(0,Math.min(j+d,row.length-1))]);
}

/* ── 성과급 확인 ─────────────────────────────────────────────
   성과급 원본(finance_income)은 재무권한자만 읽는다. 직원 본인도 못 읽는다.
   그래서 대표가 달마다 사람별 '확인용 사본'을 내보내고, 여기서는 자기 것만 읽는다.
   금액은 못 고친다(서버 규칙). 남길 수 있는 건 확인·이의뿐이다.

   ★★ 반드시 로그인 본인(S.me.sid)이다. 열람 대상(S.vsid)을 따라가면 남의 성과급이 보인다.
       규칙이 uid 로 한 번 더 막지만, 코드에서도 절대 섞지 않는다. */
var PC_PATH='data/perf_confirm';
/* 몇 달치를 훑을까 — 내 것과 대표 전체 현황이 «같은 창»을 봐야 한다.
   전에는 내 것만 넉 달이라, 대표 현황엔 있는 달이 내 화면엔 아예 없었다. */
var PC_MONTHS=6;
function pcMySid(){ return (S.me&&S.me.sid)||''; }        /* ★ S.vsid 아님 */
function pcMonths(n){
  var out=[], d=new Date();
  for(var i=0;i<(n||4);i++){ out.push(d.getFullYear()+'-'+pad(d.getMonth()+1)); d.setMonth(d.getMonth()-1); }
  return out;
}
/* 총괄 관리자(admin) 또는 관리자대행(admin-delegate) 인지 — 서버가 아는 값을 그대로 쓴다.
   성과급은 이 두 사람이 같이 다룬다. 재무 메뉴 권한(fin)으로 열면 재무 담당자도
   전 직원 성과급을 보게 되므로 그보다 좁게 잡았다(서버 규칙도 isAdmin 으로 걸려 있다). */
function pcAmFin(){
  if(S.perfFin!==undefined) return Promise.resolve(S.perfFin);
  var u=(typeof firebase!=='undefined'&&firebase.auth)?firebase.auth().currentUser:null;
  if(!u||!u.uid||typeof fbDb==='undefined'||!fbDb){ S.perfFin=false; return Promise.resolve(false); }
  return fbDb.ref('uid_roles/'+u.uid+'/isAdmin').once('value')
    .then(function(s){ S.perfFin=(s.val()===true); return S.perfFin; })
    .catch(function(){ S.perfFin=false; return false; });
}
/* 전체 현황 — 총괄·대행만. 권한이 없으면 서버가 막으므로 조용히 빈 손으로 돌아온다. */
function pcLoadAll(){
  return pcAmFin().then(function(fin){
    if(!fin) return [];
    return Promise.all(pcMonths(PC_MONTHS).map(function(ym){
      return fbDb.ref(PC_PATH+'/'+ym+'/p').once('value')
        .then(function(s){ var v=s.val(); return (v&&Object.keys(v).length)?{ym:ym,all:v}:null; })
        .catch(function(){ return null; });
    })).then(function(r){ return r.filter(Boolean); });
  });
}
/* 며칠 지났나 — 이의가 며칠째 대기인지, 마감이 며칠 지났는지 */
function pcDaysAgo(iso){
  if(!iso) return 0;
  var t=new Date(iso).getTime(); if(isNaN(t)) return 0;
  var d=Math.floor((Date.now()-t)/86400000);
  return d>0?d:0;
}
/* 그 달 전체를 한 눈금으로 */
function pcMonthStat(all){
  var st={people:0,done:0,obj:0,todo:0,sum:0,left:0};
  Object.keys(all||{}).forEach(function(sid){
    var p=all[sid]||{}, w=pcWho(p);
    st.people++; st.sum+=(p.total||0);
    if(w.k==='done') st.done++; else if(w.k==='obj') st.obj++; else st.todo++;
  });
  st.left=st.obj+st.todo;
  return st;
}
/* 사람 차례 — 손봐야 할 사람이 앞으로 (이의 → 미확인 → 완료), 같은 무리면 금액 큰 쪽 */
function pcSortSids(all){
  var rank={obj:0, todo:1, done:2};
  return Object.keys(all||{}).sort(function(a,b){
    var ra=rank[pcWho(all[a]).k], rb=rank[pcWho(all[b]).k];
    if(ra!==rb) return ra-rb;
    return ((all[b]||{}).total||0)-((all[a]||{}).total||0);
  });
}
/* 사람 한 명의 상태를 한 낱말로 */
function pcWho(p){
  var by=(p.objection||{}).byItem||{};
  var open=Object.keys(by).filter(function(fid){
    var o=by[fid]||{}; if(o.withdrawnAt||!o.text) return false;
    var it=(p.items||{})[fid]||{};
    return !(it.reply&&it.reply.state==='done');
  });
  if(open.length) return { k:'obj', t:'이의 '+open.length+'건', c:'#854d0e', bg:'#fffbeb', open:open };
  if(p.done===true) return { k:'done', t:'확인 완료', c:'#166534', bg:'#f0fdf4', open:[] };
  return { k:'todo', t:'미확인', c:'#64748b', bg:'#f8fafc', open:[] };
}

/* 달 목록을 훑을 권한은 없다(남의 것까지 보이므로). 최근 넉 달을 하나씩 두드려 본다.
   발행 안 됐거나 내 것이 아니면 막히는데, 그게 정상이라 조용히 넘긴다. */
function pcLoad(){
  var sid=pcMySid();
  if(!sid || typeof fbDb==='undefined' || !fbDb){ S.perfNone=[]; return Promise.resolve([]); }
  return Promise.all(pcMonths(PC_MONTHS).map(function(ym){
    return fbDb.ref(PC_PATH+'/'+ym+'/p/'+sid).once('value')
      .then(function(s){ var v=s.val(); return {ym:ym, p:(v&&v.items)?v:null}; })
      .catch(function(){ return {ym:ym, p:null}; });   /* 막힌 달도 «없는 달»로 본다 */
  })).then(function(r){
    /* ⚠ 빈 달도 기억해 둔다. 있는 달만 쌓아 보이니 한 달만 뜨면
       「왜 저 달은 안 나오나」가 된다 — 화면에서 그 까닭을 말해 줘야 한다. */
    S.perfNone = r.filter(function(x){ return x && !x.p; }).map(function(x){ return x.ym; });
    return r.filter(function(x){ return x && x.p; }).map(function(x){ return {ym:x.ym, p:x.p}; });
  });
}
/* ── 성과급 줄 ↔ 푸른이알피 업무 잇기 ──────────────────────────
   성과급 사본에는 이미 어디서 온 돈인지가 담겨 있다(source=계약/사건/컨설팅/기금/기타,
   sourceId=그 원본 아이디). 그런데 화면에는 회사 이름과 「기타용역비 잔금」 만 나와,
   **무슨 일로 받은 돈이고 누구와 함께한 일인지**를 알 수가 없었다(대표 지시 2026-08-20
   "성과 당사자 이알피 내용 정리해서 가지고 오라").
   업무관리 항목도 같은 열쇠(ref.type|ref.id)로 이알피를 가리키므로 그대로 맞물린다.
   ⚠ 못 찾아도 아무 일 없어야 한다 — 업무관리에 아직 안 들여온 건도 있다. */
var _pcWorkIdx=null;
function pcWorkIndex(){
  if(_pcWorkIdx) return _pcWorkIdx;
  _pcWorkIdx={};
  try{
    allItems().forEach(function(it){
      if(it && it.src==='puerp' && it.ref && it.ref.type && it.ref.id)
        _pcWorkIdx[it.ref.type+'|'+String(it.ref.id)]=it;
    });
  }catch(e){ _pcWorkIdx={}; }
  return _pcWorkIdx;
}
function pcWorkOf(x){
  if(!x || !x.source || !x.sourceId) return null;
  return pcWorkIndex()[x.source+'|'+String(x.sourceId)]||null;
}
/* 성과 «당사자» — 이 일을 함께한 사람. 주담당 하나, 부담당 여럿. */
function pcPeople(it){
  if(!it) return [];
  var out=[];
  var m=it.mgr_main||{}; if(m.name) out.push({r:'주',n:m.name});
  (it.mgr_subs||[]).forEach(function(sb){ if(sb&&sb.name) out.push({r:'부',n:sb.name}); });
  return out;
}
function pcObjOf(p,fid){ return ((p.objection||{}).byItem||{})[fid]||null; }
function pcRowState(p,fid){
  var ob=pcObjOf(p,fid);
  if(ob && ob.text && !ob.withdrawnAt) return 'obj';
  return (((p.items||{})[fid]||{}).ok===true) ? 'ok' : 'todo';
}
function pcCounts(p){
  var ids=Object.keys(p.items||{});
  var todo=ids.filter(function(f){ return pcRowState(p,f)==='todo'; }).length;
  return { total:ids.length, todo:todo, handled:ids.length-todo };
}
function pcAllHandled(p){ var c=pcCounts(p); return c.total>0 && c.todo===0; }
function pcMoney(n){ return (Math.round(n||0)).toLocaleString('ko-KR'); }
function pcDay(d){ var s=String(d||''); return s.length>=10 ? (+s.slice(5,7))+'/'+(+s.slice(8,10)) : s; }
function pcDueLate(due){ if(!due) return false; return new Date().toISOString().slice(0,10) > due; }

/* ── 쓰기 — 규칙이 허용하는 칸만 건드린다 ── */
function pcSetOk(ym,fid,on){
  var sid=pcMySid(), now=new Date().toISOString();
  return fbDb.ref(PC_PATH+'/'+ym+'/p/'+sid+'/items/'+fid).update({
    ok:!!on, okAt:on?now:null, okBy:on?sid:null });
}
function pcSaveObj(ym,fid,text){
  var sid=pcMySid();
  return fbDb.ref(PC_PATH+'/'+ym+'/p/'+sid+'/objection/byItem/'+fid).update({
    text:String(text||'').slice(0,500), at:new Date().toISOString(), withdrawnAt:null })
    .then(function(){ return pcSetOk(ym,fid,false); });   /* 이의와 확인은 같이 설 수 없다 */
}
function pcWithdrawObj(ym,fid){
  var sid=pcMySid();
  /* text 는 지우지 않는다 — 대표가 "있었다가 물렸다"를 알아야 한다 */
  return fbDb.ref(PC_PATH+'/'+ym+'/p/'+sid+'/objection/byItem/'+fid+'/withdrawnAt')
    .set(new Date().toISOString());
}
function pcMarkDone(ym){
  var sid=pcMySid();
  return fbDb.ref(PC_PATH+'/'+ym+'/p/'+sid).update({
    done:true, doneAt:new Date().toISOString(), doneBy:sid,
    deviceHint: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?'폰':'PC' });
}

/* ── 화면 ── */
function pcRefresh(){
  return Promise.all([pcLoad(), pcLoadAll()]).then(function(r){
    S.perfData=r[0]; S.perfAll=r[1];
    if(S.view==='perf') renderPerf();
    pcBand();
    return r[0];
  });
}
function pcToggleShow(){ S.perfShow=!S.perfShow; renderPerf(); }
function pcToggleRow(k){ S.perfOpen=S.perfOpen||{}; S.perfOpen[k]=!S.perfOpen[k]; renderPerf(); }
function pcAct(fn){ fn().then(pcRefresh).catch(function(e){ toast('저장하지 못했습니다 — '+((e&&e.message)||'권한을 확인하세요'),'err'); }); }
function pcOk(ym,fid,on){ pcAct(function(){ return pcSetOk(ym,fid,on); }); }
function pcUndoObj(ym,fid){
  if(!confirm('이의를 물리시겠습니까?\n\n남긴 사유는 기록에 남고 대표님이 보실 수 있습니다.')) return;
  pcAct(function(){ return pcWithdrawObj(ym,fid); });
}
function pcObjSave(ym,fid){
  var el=$('pcobj-'+ym+'-'+fid); var t=el?String(el.value||'').trim():'';
  if(t.length<2){ toast('어디가 다른지 적어주세요','err'); return; }
  pcAct(function(){ return pcSaveObj(ym,fid,t); });
}
function pcDoneClick(ym){
  var e=(S.perfData||[]).filter(function(x){return x.ym===ym;})[0]; if(!e) return;
  if(!pcAllHandled(e.p)){ toast('모든 줄을 확인하거나 이의를 남겨주세요','err'); return; }
  if(!confirm(ym+' 성과급 확인을 마칩니다.\n\n확인한 날짜와 시각이 기록에 남고,\n한 번 마치면 스스로 되돌릴 수 없습니다.\n\n진행할까요?')) return;
  pcAct(function(){ return pcMarkDone(ym); });
}

function renderPerf(){
  var app=$('app'); if(!app) return;
  if(S.perfData===undefined){ app.innerHTML=loadingHTML(); pcRefresh(); return; }
  var list=S.perfData||[], adm=S.perfAll||[];
  /* 성과급은 읽는 화면이지 늘어놓는 화면이 아니다. 최대 너비를 두지 않으면
     넓은 모니터에서 「확인한 때」가 저 멀리 붙어 눈이 따라가지 못한다.
     (업무 목록처럼 칸이 많은 화면은 넓어야 하므로 #app 전체가 아니라 여기서만 좁힌다) */
  var h='<div style="max-width:860px">';
  if(!list.length){
    h+='<div class="card" style="text-align:center;padding:32px 20px;color:var(--faint);margin-bottom:14px">'
      +'<div style="font-size:30px;margin-bottom:10px">⭐</div>'
      +'<div style="font-size:14px;margin-bottom:6px">확인할 내 성과급이 없습니다</div>'
      +'<div style="font-size:12px;line-height:1.7">'
      /* 어느 달을 봤는지 적어 준다 — 「몇 달치를 봤나」를 모르면 없다는 말도 못 믿는다 */
      +'최근 '+PC_MONTHS+'개월('+esc((S.perfNone||[]).slice().sort().reverse().map(pcYmLabel).join(' · '))+')을 봤습니다.<br>'
      +'대표님이 그 달치를 내보내면 여기에 나타납니다.<br>'
      +'분명히 있어야 하는데 안 보이면 대표님께 계정 연결을 확인해 달라고 하세요.</div></div>';
  } else {
    h+=list.map(function(e,i){ e._first=(i===0); return pcMonthHTML(e); }).join('');
    h+=pcNoneHTML();                   /* 없는 달을 말해 준다 — 안 그러면 「왜 안 나오나」가 된다 */
  }
  h+=pcAdminHTML();                    /* 총괄·대행에게만 채워진다 */
  app.innerHTML=h+'</div>';
}

/* ── 내 것이 «없는» 달 ────────────────────────────────────────
   있는 달만 카드로 쌓으니, 한 달만 뜨면 나머지 달은 어디 갔는지 알 수가 없다.
   훑어본 달을 다 적고, 없는 달은 없다고 말한다.
   ⚠ 까닭은 둘인데 직원 화면에서는 갈라볼 수 없다 —
     ① 그 달에 내게 붙은 건이 없었다  ② 대표가 아직 그 달을 발행하지 않았다.
     둘 다 적어 준다. 하나만 적으면 절반은 거짓말이 된다. */
function pcYmLabel(ym){ return (+String(ym).slice(5,7))+'월'; }
function pcNoneHTML(){
  var none=(S.perfNone||[]).slice().sort().reverse();
  if(!none.length) return '';
  /* 석 줄을 한 줄로 묶었다 — 까닭 «둘» 은 그대로 남긴다(하나만 적으면 절반은 거짓말이다).
     더 이전 달 문의 안내는 말풍선으로 내렸다 — 한 번 읽으면 그만인 말이 줄을 먹고 있었다. */
  return '<div class="card" style="padding:8px 12px;margin-bottom:12px;font-size:11.5px;'
    +'color:var(--faint);line-height:1.6;background:#f8fafc" '
    +'title="최근 '+PC_MONTHS+'개월만 봅니다. 더 이전 달은 대표님께 문의하세요.">'
    +'<b style="color:var(--sub)">'+esc(none.map(pcYmLabel).join(' · '))+'</b> 은 내 성과급이 없습니다'
    +' — 그 달에 붙은 건이 없었거나 대표님이 아직 안 내보냈습니다. (최근 '+PC_MONTHS+'개월)'
    +'</div>';
}

/* ── 대표만 보는 전체 현황 (읽기 전용) ────────────────────────
   달력 줄로 달을 고르고, 그 아래 사람 탭으로 전체 ↔ 각자를 오간다.
   탭 줄만 훑어도 누구를 손봐야 하는지 알 수 있게 딱지를 붙인다. */
function pcAdmMonths(){ return (S.perfAll||[]).map(function(x){ return x.ym; }); }
function pcAdmYm(){
  if(S.perfAdmYm) return S.perfAdmYm;
  var list=S.perfAll||[]; if(!list.length) return '';
  /* 처음엔 아직 안 끝난 달 중 가장 최근. 다 끝났으면 가장 최근 달. */
  var pend=list.filter(function(x){ return pcMonthStat(x.all).left>0; });
  return (pend[0]||list[0]).ym;
}
function pcAdmSet(ym){ S.perfAdmYm=ym; S.perfAdmSid=''; renderPerf(); }
function pcAdmPick(sid){ S.perfAdmSid=sid||''; renderPerf(); }
function pcAdmMove(d){
  var ym=pcAdmYm(); if(!ym) return;
  var dt=new Date(+ym.slice(0,4), +ym.slice(5,7)-1+d, 1);
  pcAdmSet(dt.getFullYear()+'-'+pad(dt.getMonth()+1));
}
function pcAdmToday(){ var d=new Date(); pcAdmSet(d.getFullYear()+'-'+pad(d.getMonth()+1)); }

function pcAdminHTML(){
  var list=S.perfAll||[];
  if(!list.length) return '';
  var ym=pcAdmYm();
  var cur=list.filter(function(x){ return x.ym===ym; })[0];
  var all=(cur&&cur.all)||{};
  var st=pcMonthStat(all);
  var mask=!S.perfShow;
  var sids=pcSortSids(all);
  var sel=S.perfAdmSid||'';
  if(sel && !all[sel]) sel='';

  var h='<div class="card" style="margin-bottom:14px;border-color:#bfdbfe">';
  h+='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">'
    +'<b style="font-size:14px">👑 전체 현황</b>'
    +'<span style="font-size:11.5px;color:#2563eb;background:#f8fafc;border-radius:10px;padding:2px 9px">대표만 보임</span>'
    +'<button onclick="pcToggleShow()" style="margin-left:auto;padding:6px 12px;font-size:12px;'
    +'border:1px solid var(--bd);background:#fff;border-radius:6px;cursor:pointer">'
    +(S.perfShow?'금액 가리기':'금액 보기')+'</button></div>';

  /* 달력 줄 — 푸른이알피와 같은 모양 */
  var nav='padding:5px 11px;font-size:13px;border:1px solid var(--bd);background:#fff;border-radius:6px;cursor:pointer';
  h+='<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px">'
    +'<button onclick="pcAdmMove(-1)" style="'+nav+'">◀</button>'
    +'<span style="font-size:15px;font-weight:700;padding:0 6px">'+esc(ym)+'</span>'
    +'<button onclick="pcAdmMove(1)" style="'+nav+'">▶</button>'
    +'<button onclick="pcAdmToday()" style="'+nav+';font-size:12px">오늘</button>'
    +(st.people?'<span style="margin-left:8px;font-size:12px;color:var(--faint)">'
        +st.people+'명 · 합계 '+(mask?'●●●':pcMoney(st.sum)+'원')+'</span>':'')
    +'</div>';

  if(!st.people){
    h+='<div style="padding:26px 12px;text-align:center;color:var(--faint);font-size:12.5px;line-height:1.8">'
      +'이 달은 아직 발행되지 않았습니다.<br>'
      +'<span style="font-size:11.5px">발행한 달: '+(pcAdmMonths().join(' · ')||'없음')+'</span></div></div>';
    return h;
  }

  /* 사람 탭 — 전체부터, 손봐야 할 사람 순서로 */
  h+='<div style="display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--bd);margin-bottom:12px">';
  h+=pcTabHTML('', '전체 <span style="color:var(--faint);font-weight:400">'+st.people+'</span>', sel==='');
  sids.forEach(function(sid){
    var w=pcWho(all[sid]);
    var mark = w.k==='obj'
      ? ' <span style="background:#fbbf24;color:#fff;border-radius:9px;padding:0 6px;font-size:10.5px">이의</span>'
      : (w.k==='todo' ? ' <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#dc2626;vertical-align:1px"></span>' : '');
    h+=pcTabHTML(sid, esc((all[sid].name)||sid)+mark, sel===sid, w.k==='done');
  });
  h+='</div>';

  /* 사번을 따로 넘긴다 — 사본 안의 p.sid 를 믿지 않는다(답변을 엉뚱한 사람에게 쓸 수 없게) */
  h+= sel ? pcAdmOneHTML(ym, sel, all[sel], mask) : pcAdmAllHTML(ym, all, sids, st, mask);
  h+='</div>';
  return h;
}
function pcTabHTML(sid, label, on, dim){
  return '<span onclick="pcAdmPick(\''+esc(sid)+'\')" style="font-size:13px;padding:7px 14px;cursor:pointer;'
    +'margin-bottom:-1px;'+(on?'font-weight:700;border-bottom:2px solid var(--acc);color:var(--tx)':'color:'+(dim?'var(--faint)':'#475569'))+'">'
    +label+'</span>';
}

/* 전체 탭 — 그 달을 통째로 */
function pcAdmAllHTML(ym, all, sids, st, mask){
  var h='';
  /* 한 줄 막대 */
  function seg(n,c){ return n? '<div style="flex:'+n+';background:'+c+'"></div>' : ''; }
  h+='<div style="display:flex;height:8px;border-radius:4px;overflow:hidden;margin-bottom:8px;background:#f8fafc">'
    +seg(st.done,'#16a34a')+seg(st.obj,'#fbbf24')+seg(st.todo,'#cbd5e1')+'</div>'
    +'<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-bottom:12px">'
    +'<span style="color:#166534">확인 완료 '+st.done+'</span>'
    +'<span style="color:#854d0e">이의 '+st.obj+'</span>'
    +'<span style="color:#64748b">미확인 '+st.todo+'</span></div>';

  /* 다음 할 일 한 줄 */
  var todoTxt=[];
  if(st.obj) todoTxt.push('이의 '+st.obj+'명 처리');
  if(st.todo) todoTxt.push('미확인 '+st.todo+'명 확인');
  h+= st.left
    ? '<div style="background:#fffbeb;border-radius:8px;padding:10px 13px;margin-bottom:12px;font-size:12.5px;color:#854d0e;line-height:1.7">'
      +'→ '+todoTxt.join(', ')+' — 끝나면 이 달을 마감할 수 있습니다</div>'
    : '<div style="background:#f0fdf4;border-radius:8px;padding:10px 13px;margin-bottom:12px;font-size:12.5px;color:#166534;line-height:1.7">'
      +'✅ 모두 확인했습니다 — 푸른이알피 성과관리 → 확인 현황에서 마감하세요</div>';

  h+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px;min-width:380px">'
    +'<tr style="border-bottom:1px solid var(--bd)">'
    +'<td style="padding:6px 4px;color:var(--faint);font-size:11px">이름</td>'
    +'<td style="padding:6px 4px;color:var(--faint);font-size:11px;text-align:right">진행</td>'
    +'<td style="padding:6px 4px;color:var(--faint);font-size:11px;text-align:right">금액</td>'
    +'<td style="padding:6px 4px 6px 12px;color:var(--faint);font-size:11px">상태</td>'
    +'<td style="padding:6px 4px;color:var(--faint);font-size:11px">확인한 때</td></tr>';
  sids.forEach(function(sid){
    var p=all[sid], w=pcWho(p), c=pcCounts(p);
    var late=(w.k!=='done')&&pcDueLate(p.due);
    var extra='';
    if(w.k==='obj'){
      var oldest=0; w.open.forEach(function(fid){
        var d=pcDaysAgo((((p.objection||{}).byItem||{})[fid]||{}).at); if(d>oldest) oldest=d; });
      if(oldest) extra=' · '+oldest+'일째';
    } else if(late){
      extra=' · 마감 '+pcDaysAgo(p.due+'T00:00:00Z')+'일 지남';
    }
    h+='<tr onclick="pcAdmPick(\''+esc(sid)+'\')" style="cursor:pointer;border-bottom:1px solid #f8fafc;background:'+(w.k==='done'?'#fff':w.bg)+'">'
      +'<td style="padding:8px 4px">'+esc(p.name||sid)+'</td>'
      +'<td style="padding:8px 4px;text-align:right;color:'+(c.todo?'var(--tx)':'var(--faint)')+'">'+c.handled+' / '+c.total+'</td>'
      +'<td style="padding:8px 4px;text-align:right;font-weight:600">'+(mask?'●●●':pcMoney(p.total))+'</td>'
      +'<td style="padding:8px 4px 8px 12px;color:'+(late?'#991b1b':w.c)+';font-weight:'+(w.k==='done'?400:700)+'">'
        +esc(w.t)+extra+'</td>'
      +'<td style="padding:8px 4px;color:var(--faint);font-size:11.5px">'
        +(p.doneAt?esc(String(p.doneAt).slice(0,10))+(p.deviceHint?' · '+esc(p.deviceHint):''):'-')+'</td></tr>';
  });
  h+='</table></div>';
  return h;
}

/* 사람 탭 — 그 사람이 어느 줄에서 멈췄는지 */

    +'<span style="color:'+w.c+';font-weight:700">'+esc(w.t)+'</span>'
    +(p.doneAt?'<span>확인 '+esc(String(p.doneAt).slice(0,10))+(p.deviceHint?' · '+esc(p.deviceHint):'')+'</span>':'')

        +'<span style="font-size:15px;color:'+tone[2]+'">'+tone[3]+'</span>'
        +'<span style="font-size:13px;flex:1;min-width:0">'+esc(pcDay(it.date))+' '+esc(it.coName||'-')
          +'<span style="color:var(--faint);font-size:12px"> · '+esc(it.kind||it.source||'')+' · '+esc(it.role||'')+'</span></span>'
        +'<span style="font-size:13px;font-weight:600;white-space:nowrap">'+(mask?'●●●':pcMoney(it.amount)+'원')+'</span></div>';
    if(st==='obj' && ob){
      var d=pcDaysAgo(ob.at);
      h+='<div style="font-size:12.5px;color:#475569;margin-top:7px;line-height:1.6">“'+esc(ob.text||'')+'” '
        +'<span style="color:var(--faint)">'+esc(String(ob.at||'').slice(0,10))+' 접수'+(d?' · '+d+'일째':'')+'</span></div>';
    } else if(st==='ok'){

    if(it.reply && it.reply.text){

        +'<b>답변</b> '+esc(String(it.reply.at||'').slice(0,10))+'<br>'+esc(it.reply.text)+'</div>';
    }
    /* 아직 안 답한 이의에만 답변칸을 낸다 — 답하면 그 이의는 닫힌다 */

/* ── 이의 답변 — 대표가 여기서 바로 답한다 ──────────────────────
   전에는 보기만 되고 답변은 푸른이알피 「확인 현황」에서 해야 했다. 같은 자료를
   두 화면에서 보면서 손은 한 곳에서만 쓸 수 있으니 늘 오가야 했다.
   ⚠ 쓰는 자리는 items/<fid>/reply — 직원은 못 쓰는 자리다(규칙).
     data/perf_confirm 위쪽에 .write:isAdmin 이 걸려 있어 대표는 여기서도 쓸 수 있다.
   ⚠ 금액은 여기서 못 고친다. 고치는 것은 원본(입금관리 성과분배)의 일이다. */
function pcReplyRef(ym,sid,fid){ return fbDb.ref(PC_PATH+'/'+ym+'/p/'+sid+'/items/'+fid+'/reply'); }
function pcReply(ym,sid,fid){
  var el=$('rp-'+fid); if(!el) return;
  var t=String(el.value||'').trim();
  if(t.length<2){ toast('답변을 적어주세요','err'); return; }
  if(typeof fbDb==='undefined'||!fbDb){ toast('서버에 연결돼 있지 않습니다','err'); return; }
  var btn=$('rpb-'+fid); if(btn){ btn.disabled=true; btn.textContent='저장 중…'; }
  pcReplyRef(ym,sid,fid).set({ text:t.slice(0,500), at:new Date().toISOString(),
      by:pcMySid(), state:'done' })   /* state:'done' 이라야 그 이의가 닫힌다 */
    .then(function(){
      toast('답변했습니다 — 직원 화면에 그대로 보입니다');
      /* 다시 읽어야 화면·띠·배지가 함께 맞는다 (안 읽으면 방금 답한 이의가 그대로 열려 보인다) */
      return pcRefresh().then(route);
    })
    .catch(function(e){
      if(btn){ btn.disabled=false; btn.textContent='답변하고 닫기'; }
      toast('답변 저장 실패 — '+(e&&e.message||''),'err');
    });
}

/* 대표가 답해야 할 이의 — 몇 건인지, 가장 오래된 것이 며칠째인지.
   직원에게는 「확인이 남았습니다」 띠가 뜨는데 대표에게는 아무것도 없어서,
   이의가 올라와도 열어봐야 알았다. 같은 자리를 대표용으로도 쓴다. */
function pcAdmPending(){
  var n=0, people=0, oldest=0, months={};
  (S.perfAll||[]).forEach(function(m){
    Object.keys(m.all||{}).forEach(function(sid){
      var p=m.all[sid]||{}, w=pcWho(p);
      if(w.k!=='obj') return;
      people++; n+=w.open.length; months[(+m.ym.slice(5,7))+'월']=1;
      w.open.forEach(function(fid){
        var d=pcDaysAgo((((p.objection||{}).byItem||{})[fid]||{}).at);
        if(d>oldest) oldest=d;
      });
    });
  });
  return { n:n, people:people, oldest:oldest, months:Object.keys(months) };
}

/* ── 안내 띠 — 확인이 남아 있으면 화면 맨 위에 계속 남는다 ── */
function pcBand(){
  var el=$('perfband'); if(!el) return;
  var pend=(S.perfData||[]).filter(function(x){ return !x.p.done; });
  /* 내 확인이 다 끝났어도, 대표라면 답할 이의가 남았을 수 있다 —
     내 것을 먼저 보이고(내 일이 우선), 없을 때 대표 것을 보인다. */
  if(!pend.length && S.view!=='perf'){
    var a=pcAdmPending();
    if(a.n){
      var slow=a.oldest>=3;                      /* 사흘 넘게 답을 못 받으면 급한 것으로 본다 */
      el.style.display='';
      el.innerHTML='<div onclick="go(\'perf\')" style="cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;'
        +'background:'+(slow?'#fef2f2':'#fffbeb')+';border-bottom:2px solid '+(slow?'#fecaca':'#fbbf24')
        +';padding:9px 16px;font-size:13px;color:'+(slow?'#991b1b':'#854d0e')+'">'
        +'<b>'+(slow?'⏰':'⚠')+' 성과급 이의 '+a.n+'건이 답을 기다립니다</b>'
        +'<span style="font-size:12px">'+esc(a.months.join('·'))+' · '+a.people+'명'
        +(a.oldest?' · 가장 오래된 것 '+a.oldest+'일째':'')+'</span>'
        +'<span style="margin-left:auto;background:#fff;border:1px solid currentColor;border-radius:6px;'
        +'padding:4px 12px;font-size:12px;font-weight:700">답변하러 가기 →</span></div>';
      return;
    }
  }
  if(!pend.length || S.view==='perf'){ el.style.display='none'; el.innerHTML=''; return; }
  var n=pend.reduce(function(s,x){ return s+pcCounts(x.p).todo; },0);
  var late=pend.some(function(x){ return pcDueLate(x.p.due); });
  var ms=pend.map(function(x){ return (+x.ym.slice(5,7))+'월'; }).join('·');
  el.style.display='';
  el.innerHTML='<div onclick="go(\'perf\')" style="cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;'
    +'background:'+(late?'#fef2f2':'#fffbeb')+';border-bottom:2px solid '+(late?'#fecaca':'#fbbf24')+';padding:9px 16px;font-size:13px;color:'+(late?'#991b1b':'#854d0e')+'">'
    +'<b>'+(late?'⏰':'⭐')+' '+esc(ms)+' 성과급 확인이 남았습니다</b>'
    +'<span style="font-size:12px">'+(n?'처리할 줄 '+n+'개':'마무리만 하면 됩니다')+(late?' · 마감일이 지났습니다':'')+'</span>'
    +'<span style="margin-left:auto;background:#fff;border:1px solid currentColor;border-radius:6px;padding:4px 12px;font-size:12px;font-weight:700">확인하러 가기 →</span></div>';
}

/* ── 하루에 한 번만 뜨는 알림 ── */
function pcNag(){
  var pend=(S.perfData||[]).filter(function(x){ return !x.p.done; });

  var today=new Date().toISOString().slice(0,10);
  var key='perf_nag_'+pcMySid();

  var ms=pend.map(function(x){ return (+x.ym.slice(5,7))+'월'; }).join('·');
  var late=pend.some(function(x){ return pcDueLate(x.p.due); });
  showModal('<div style="text-align:center;padding:6px 4px">'
    +'<div style="font-size:34px;margin-bottom:8px">⭐</div>'
    +'<div style="font-size:16px;font-weight:700;margin-bottom:6px">'+esc(ms)+' 성과급 확인이 남았습니다</div>'
    +'<div style="font-size:13px;color:#475569;line-height:1.8;margin-bottom:4px">'
      +'내 성과급 내역을 한 건씩 보고 맞는지 확인해 주세요.<br>'
      +(n?'처리할 줄이 <b>'+n+'개</b> 있습니다.':'마무리만 하면 됩니다.')
      +(late?'<br><b style="color:#991b1b">마감일이 지났습니다.</b>':'')+'</div>'
    +'<div style="font-size:12px;color:var(--faint);margin-bottom:16px">다르면 그 자리에서 이의를 남길 수 있습니다.</div>'
    +'<div style="display:flex;gap:8px;justify-content:center">'
      +'<button onclick="closeM()" style="padding:9px 18px;font-size:13px;border:1px solid var(--bd);background:#fff;border-radius:8px;cursor:pointer">나중에</button>'

}

function pcMonthHTML(e){
  var ym=e.ym, p=e.p, c=pcCounts(p), items=p.items||{};
  var ids=Object.keys(items).sort(function(a,b){ return String(items[a].date||'')<String(items[b].date||'')?-1:1; });
  var total=ids.reduce(function(s,f){ return s+(items[f].amount||0); },0);

  var h='';

  h+='<div class="card" style="margin-bottom:14px">';
  h+='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px">'
    +'<b style="font-size:15px">'+esc(ym.slice(0,4))+'년 '+(+ym.slice(5,7))+'월 성과급</b>'
    +'<span style="font-size:12px;color:var(--faint)">'+c.handled+' / '+c.total+' 처리</span>'
    +'<button onclick="pcToggleShow()" style="margin-left:auto;padding:7px 13px;font-size:12px;border:1px solid var(--bd);'
    +'background:#fff;border-radius:6px;cursor:pointer">'+(S.perfShow?'금액 가리기':'금액 보기')+'</button></div>';

  if(p.done){
    h+='<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:9px 12px;font-size:12.5px;color:#166534;margin-bottom:10px">'

  } else {
    h+='<div style="background:'+(late?'#fef2f2':'#fffbeb')+';border:1px solid '+(late?'#fecaca':'#fde68a')
      +';border-radius:8px;padding:9px 12px;font-size:12.5px;color:'+(late?'#991b1b':'#854d0e')+';margin-bottom:10px">'

      +(p.due?' · 마감 '+esc(p.due):'')+'</div>';
  }

  /* 「줄을 누르면 펼쳐집니다」는 첫 달에만 — 달마다 되풀이하면 같은 말이 넉 줄이 된다.
     (▼ 표가 줄마다 붙어 있어 두 번째부터는 안 적어도 안다.) */
  h+='<div style="font-size:12.5px;color:var(--faint);margin-bottom:7px">'
    +'합계 <b style="color:var(--tx)">'+(S.perfShow?pcMoney(total)+'원':'●●●')+'</b>'
    +(e._first?' · 줄을 누르면 계산 근거가 펼쳐집니다':'')+'</div>';

      +'<button onclick="pcDoneClick(\''+ym+'\')" '+(can?'':'disabled')+' style="padding:9px 20px;font-size:13px;font-weight:700;'
      +'border:none;border-radius:8px;color:#fff;background:'+(can?'var(--acc)':'#cbd5e1')+';cursor:'+(can?'pointer':'default')+'">확인 완료</button>'
      +'<span style="font-size:12px;color:var(--faint)">'
      +(can?'누르면 확인한 날짜와 시각이 기록에 남습니다':'모든 줄을 확인하거나 이의를 남겨야 눌립니다')+'</span></div>';
  }
  h+='</div>';
  return h;
}

function pcRowHTML(ym,p,fid){

     펼친 자리로 내렸다. 폰에서 이 줄이 두 줄로 접히던 것이 정신없던 첫째 까닭이다. */

    +'<b style="font-size:13px;flex:0 0 auto">'+esc(pcDay(it.date))+'</b>'
    +'<span style="flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
      +esc(it.coName||'-')+'</span>'
    +(it.role?'<span style="flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--sub);'
      +'background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:1px 6px">'
      +esc(it.role)+'</span>':'')
    +'<span style="font-size:13px;font-weight:600;white-space:nowrap;flex:0 0 auto">'+(S.perfShow?pcMoney(it.amount)+'원':'●●●')+'</span>'
    +'<span style="color:var(--faint);font-size:11px;flex:0 0 auto">'+(open?'▲':'▼')+'</span></div>';

  if(open){
    /* ── 무슨 일로 받은 돈인가 (푸른이알피) ──
       업무관리에 들여온 건이면 업무명·유형·번호와 «함께한 사람»까지 붙여 준다.
       못 찾으면 사본에 담겨 온 갈래말(기타용역비 잔금 등)만이라도 보여준다. */

    var lab='<span style="flex:0 0 62px;color:var(--faint);font-size:11px;font-weight:700">';
    h+='<div style="background:#fff;border:1px solid var(--bd);border-radius:6px;padding:9px 11px;margin-top:8px;font-size:12.5px;color:#475569">';
    if(w){
      h+='<div style="display:flex;gap:6px;margin-bottom:3px"><span'+lab.slice(5)+'업무</span>'

/* ── 3단계: 본문 검색 ─────────────────────────────────────────────────
   기존 검색(matchQ)은 업무의 필드만 훑는다. 노트 본문·회고·기록·지식 카드는
   대상이 아니었다 — 암묵지를 쌓아도 찾을 수 없으면 죽은 자료가 된다.
   기록 전체는 work_erp/itemlogs를 한 번만 읽어 캐시한다(주차 캐시는 보고 있는
   주만 담고 있어 과거 기록을 못 찾는다). */
var _allLogs=null,_allLogsT=null;
function loadAllLogs(){
  if(_allLogs) return Promise.resolve(_allLogs);
  if(_allLogsT) return _allLogsT;
  _allLogsT=fbDb.ref(NS+'/itemlogs').once('value')
    .then(function(s){ _allLogs=s.val()||{}; _allLogsT=null; return _allLogs; })
    .catch(function(){ _allLogs={}; _allLogsT=null; return _allLogs; });
  return _allLogsT;
}
function _hit(s,q){ return String(s||'').toLowerCase().indexOf(q)>=0; }
function searchAll(q){
  q=String(q||'').toLowerCase().trim();
  var R={items:[],cards:[],logs:[]};
  if(q.length<2) return R;
  allItems().forEach(function(it){
    var n=it.ho_note||{}, r=n.retro||{};
    var where=[];
    if(matchQ(it,q)) where.push('업무 정보');
    HO_FIELDS.forEach(function(f){ if(_hit(n[f[0]],q)) where.push(f[1].replace(/^[①-⑤]\s*/,'')); });
    (n.qa||[]).forEach(function(p){ if(p&&(_hit(p.q,q)||_hit(p.a,q))) where.push('AI 인터뷰'); });
    RETRO_FIELDS.forEach(function(f){ if(_hit(r[f[0]],q)) where.push('회고'); });
    if(where.length) R.items.push({it:it,where:where.filter(function(v,i,a){return a.indexOf(v)===i;})});
  });
  kbAll().forEach(function(c){
    if([c.t,c.x,c.kl,c.byName].some(function(s){return _hit(s,q);})) R.cards.push(c);
  });
  Object.keys(_allLogs||{}).forEach(function(iid){
    var o=_allLogs[iid]||{};
    Object.keys(o).forEach(function(lid){
      var l=o[lid];
      if(l&&_hit(l.t,q)) R.logs.push({iid:iid,l:l});
    });
  });
  R.logs.sort(function(a,b){ return String(b.l.d||'').localeCompare(String(a.l.d||'')); });
  return R;
}

var AI_SYS_QA='당신은 한국 노무법인의 업무 지식 조수입니다. 아래에 주어진 자료(지식 카드·인수인계 노트·진행 기록)만 근거로 질문에 답하세요.\n'

var KO_PART=/(에서|으로|에게|한테|부터|까지|보다|께서|은|는|이|가|을|를|의|에|로|과|와|도|만)$/;
function _qToks(q){

  String(q||'').toLowerCase().split(/[\s,·?!.]+/).forEach(function(t){
    if(t.length<2) return;
    out.push(t);
    var b=t.replace(KO_PART,'');
    if(b.length>=2&&b!==t) out.push(b);
  });
  return out;
}
function kbAskCtx(q){

    }).sort(function(a,b){return b.s-a.s;});
  var pick=cards.filter(function(x){return x.s>0;});

      +(c.x?' — '+c.x:'')+' [작성 '+String(c.at||'').slice(0,10)+' '+(c.byName||'')+']'
      +(kbBad(c)?' ※ 정정 요청됨':'')+(kbStale(c)?' ※ 2년 경과':''));
  });
  var its=allItems().map(function(it){

  if(its.length){
    L.push('','[관련 업무의 노트·회고 '+its.length+'건]');
    its.forEach(function(x){
      L.push('· '+(x.it.company||'')+' '+(x.it.title||'')+(x.it.state==='done'?' (종료)':''));

/* ══════════════════════════════════════════════════════════════════════

   ⚠ 수신함은 하나뿐이다(급여데이터함 서버가 받은 것). 「본인 메일」이라는 구분이

   ⚠ 읽기만 한다. 본문·답장·삭제·읽음은 «푸른메일함»이 진짜다 — 그리로 건너간다(mbGo).
   ⚠ 규칙이 없으면 못 읽는다 — 그때는 조용히 아무것도 안 보여준다(고장이 아니다). */
var MAILLOG_PATH='paydata/maillog', MAIL_MAX=300;
var mailSrc=null, _mailT=null;
function mailLoad(){
  if(mailSrc) return Promise.resolve(mailSrc);
  if(_mailT) return _mailT;
  if(typeof fbDb==='undefined'||!fbDb){ mailSrc=[]; return Promise.resolve(mailSrc); }
  _mailT=fbDb.ref(MAILLOG_PATH).limitToLast(MAIL_MAX).once('value')
    .then(function(s){
      var v=s.val()||{};
      mailSrc=Object.keys(v).map(function(k){ var o=v[k]||{}; o._k=k; return o; })
        .filter(function(o){ return o.at; })
        .sort(function(a,b){ return Number(b.at||0)-Number(a.at||0); });
      _mailT=null; return mailSrc;
    })
    .catch(function(){ mailSrc=[]; _mailT=null; return mailSrc; });
  return _mailT;
}
function _mailAddr(s){
  // 「홍길동 <hong@gana.co.kr>」 처럼 이름이 붙어 오기도 한다
  var m=String(s||'').match(/[\w.+-]+@[\w.-]+\.\w+/);
  return m?m[0].toLowerCase():'';
}
/* 공용 메일 주소는 «업체를 가리키는 표식»이 못 된다.
   naver.com 하나로 묶으면 서로 다른 업체 메일이 한 업무에 다 붙는다. */
var MAIL_PUBLIC={'naver.com':1,'gmail.com':1,'daum.net':1,'hanmail.net':1,'nate.com':1,
  'kakao.com':1,'outlook.com':1,'hotmail.com':1,'yahoo.com':1,'icloud.com':1};
/* 그 업무의 업체를 가리키는 표식들 — 정확한 주소, 회사 도메인, 정규화한 회사 이름 */
function mailKeysOf(it){
  var mails={}, doms={}, co=null;
  try{ co=coFind(it); }catch(e){}
  var lists=[];
  try{ lists.push(_cList(co)); }catch(e){}
  try{ var r=peRec(it); if(r) lists.push(_cList(r.company||r)); }catch(e){}
  lists.push(it&&it.contacts||[]);
  lists.forEach(function(l){
    (l||[]).forEach(function(c){
      var a=_mailAddr(c&&c.email); if(!a) return;
      mails[a]=1;
      var d=a.slice(a.indexOf('@')+1);
      if(!MAIL_PUBLIC[d]) doms[d]=1;
    });
  });
  /* ★ 메일함이 이미 붙여 둔 이름표 (2026-09-06).
     ⚠ 이것이 없으면 「7월 급여 확정자료 송부의 건」처럼 제목에 회사가 안 나오는
       메일은 영영 못 찾는다 — 짐작으로는 걸릴 글자가 없다. */
  var coid=''; try{ coid=String((co&&co.id)||''); }catch(e){}
  /* 「이 주소는 앞으로도 이 사업장」으로 고정해 둔 것 — 사람이 정한 것이라 그대로 믿는다.
     ⚠ 고정할 때 「여러 사업장에 걸린 주소인가」를 이미 걸렀다(mlkAddrCos). */
  var nm=_normCo((it&&it.company)||'');
  Object.keys(mailaddr||{}).forEach(function(ak){
    var p=mailaddr[ak]; if(!p) return;
    var same=(coid&&String(p.coid||'')===coid)||(nm&&_normCo(String(p.co||''))===nm);
    if(!same) return;
    var a=_mailAddr(p.addr||ak.replace(/_at_/,'@'));
    if(a) mails[a]=1;
  });
  return { mails:mails, doms:doms, name:nm, coid:coid };
}
/* 메일 한 통이 이 업무에 붙는가 — «한 쌍»만 본다.
   ⚠ 이것을 따로 뗀 까닭: 「어느 업무에도 안 붙는 메일」을 찾으려면 업무마다
     mailFor 를 부를 수 없다(표식을 업무 수만큼 다시 만든다). 표식은 한 번 만들고
     이 함수로 메일마다 견준다. */
function mailHit(k,m){
  if(!k||!m) return false;
  if(k.coid&&String(m.companyId||'')===k.coid) return true;
  var byName=k.name&&k.name.length>=2;
  if(byName&&m.companyName&&_normCo(String(m.companyName))===k.name) return true;
  var a=_mailAddr(m.from);
  if(a&&k.mails[a]) return true;
  var d=a?a.slice(a.indexOf('@')+1):'';
  if(d&&k.doms[d]) return true;
  if(!byName) return false;
  return _normCo(String(m.subject||'')+' '+String(m.from||'')).indexOf(k.name)>=0;

/* 그 업무의 업체에서 온 메일.
   ⚠ 이름으로 맞추는 것은 «두 글자 이상»일 때만 한다. 한 글자 회사명은
     아무 제목에나 걸려 남의 메일이 붙는다. */
function mailFor(it){
  if(!mailSrc||!mailSrc.length||!it) return [];
  var k=mailKeysOf(it);
  var id=String(it._id||'');
  var byName=k.name&&k.name.length>=2;
  var any=byName||k.coid||Object.keys(k.mails).length||Object.keys(k.doms).length;
  return mailSrc.filter(function(m){
    /* ★★ 사람이 정한 것이 «가장 먼저»다 — 짐작을 바로잡는 길이 이것이다.
       ㉮ 이 업무로 이었다 → 짐작이 뭐라 하든 붙는다
       ㉯ 치웠다(사업장 메일 아님) → 안 붙는다
       ㉰ «다른» 업무로 이었다 → 안 붙는다. 이 한 줄이 「잘못 붙은 것을 떼는」 길이다. */
    var mk=mailKey(m), L=mk&&maillink&&maillink[mk];
    if(L){
      if(L.none) return false;
      if(L.item) return String(L.item)===id;
    }
    if(!any) return false;
    return mailHit(k,m);
  });
}
/* 한 줄에 들어갈 날짜 — 「8/26」. 시각은 펴 보았을 때 있다(_mailWhen). */
function _mlDay(at){
  var d=new Date(Number(at)||0);
  if(isNaN(d.getTime())) return '';
  return (d.getMonth()+1)+'/'+d.getDate();
}
function _mailWhen(at){
  var d=new Date(Number(at)||0);
  if(isNaN(d.getTime())) return '';
  var p=function(n){ return (n<10?'0':'')+n; };
  return (d.getMonth()+1)+'.'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
/* 드로어 블록 — 이 업체에서 온 메일.

/* ══════════════════════════════════════════════════════════════════════

/* 그 업무에 달린 진행 메모들 — 사람마다 한 줄씩 있을 수 있다.

function ppFor(it){

function ppLine(p){

/* 담은 표시의 자리 — «그 메모 줄»을 가리킨다.
   ⚠ 사번으로 가리키지 않는다. 사번은 «사람»이고, 사람으로 경로를 만들면

function ppKey(it,p){ return String((it&&it._id)||'')+'|'+String((p&&p.id)||''); }
/* 이미 담은 메모인지 — «그때 담은 글»과 견준다.

function ppTaken(it,p){

function ppTake(itemId,rowId){

/* ── 메일 한 통을 «한 줄»로 줄인다 ────────────────────────────────
   ⚠ 여기서 「요약」이라고 부를 수 있는 것은 제목뿐이다. 본문이 없다.
     제목은 대개 이미 요약이고, 모자라면 미리보기 앞머리를 조금 붙인다.
     ⚠ AI 로 지어내지 않는다 — 재료가 제목 한 줄뿐이라, 지어내면 그럴듯한
       거짓말이 기록에 남는다. 기록은 나중에 근거로 쓰이는 자료다.
   ⚠ 대괄호 안의 발송 표시([광고], [푸른노무법인] 같은 것)는 떼어 낸다 —
     한 줄에서 자리만 먹고 무슨 일인지는 안 알려 준다. */
function mailBrief(m){
  var t=String((m&&m.subject)||'').replace(/^\s*(\[[^\]]{1,20}\]\s*)+/,'').replace(/\s+/g,' ').trim();
  if(!t) t=String((m&&m.preview)||'').replace(/\s+/g,' ').trim();
  /* ⚠ 우리말 제목은 짧아도 알차다 — 「취업규칙 개정 문의」 열 자면 충분하다.
     여덟 자 밑일 때만 미리보기를 붙인다(「문의」·「회신」처럼 그것만으론 모를 때). */
  if(t.length<8 && m && m.preview){
    var p=String(m.preview).replace(/\s+/g,' ').trim();
    if(p && p.indexOf(t)!==0) t=(t?t+' — ':'')+p;
  }
  if(!t) return '(제목 없음)';
  return t.length>46?t.slice(0,46)+'…':t;
}
// 기록에 들어갈 한 줄 — 「언제 온 메일인지」를 앞에 세운다
function mailLogLine(m){ return '✉ '+_mailWhen(m.at).split(' ')[0]+' 메일 — '+mailBrief(m); }
function mailKey(m){ return String((m&&m._k)||''); }
function mailChk(m){ var k=mailKey(m); return (k&&mailchk&&mailchk[k])||null; }
/* 확인 표시 — 「이 메일은 봤다」.

// 아직 확인 안 한 메일 — 목록 표식과 정렬이 이것을 본다
function mailNew(it){ return mailFor(it).filter(function(m){ return !mailChk(m); }); }
/* ⚠ 업무 번호를 «받아서» 쓴다. it._id 는 allItems() 가 지나가며 붙여 주는 칸이라
   드로어가 items[id] 를 곧바로 집어 왔을 때는 비어 있을 수 있다. */
/* ══════════════════════════════════════════════════════════════════════
   이 업체에 «보낸 것»도 함께 (대표 지시 2026-09-05)
   ══════════════════════════════════════════════════════════════════════
   「각 사업장에 이메일이 있었던 기록도 모두 연결시고 뭐 했는지도 간략하게」

   받은 것은 이미 위에서 붙였다(paydata/maillog). 나머지 반쪽 — «우리가 보낸 것»은
   기업정보함이 벌써 쌓고 있다:
       pucards/sentDocs/{회사열쇠}/{번호}
       · 1:1 로 보낸 것   {at,by,kind,names[],set,card,who}
       · 묶음으로 보낸 것 {at,day,by,kind,name,batch}

   ⚠ 읽기만 한다. 여기서 메일을 보내지 않는다 — 보내는 곳은 기업정보함 그대로다.
   ⚠ 규칙은 안 고친다 — pucards 는 읽기가 MAIL(메일 있는 로그인 직원)이다.
     대표가 콘솔에 붙여넣을 것이 없다.
   ⚠ 업무를 열 때 «그 회사 것만» 읽는다. 회사가 사천 곳이라 통째로는 못 읽는다
     (기업정보함도 같은 까닭으로 회사를 열 때만 읽는다).
   ⚠⚠ 회사 열쇠 셈법은 기업정보함 것을 «글자 그대로» 옮겨 왔다(pu-cards.html coKeyOf).
     이 파일의 _normCo 와 «다르다» — 「(유)·하이픈·가운뎃점」을 떼는지가 갈린다.
     섞어 쓰면 화면에는 같은 회사인데 기록은 딴 회사에서 찾게 되어, 있는 것이
     조용히 안 나온다. 고칠 일이 있으면 기업정보함 쪽과 «함께» 고쳐야 한다. */
var SENT_ROOT='pucards/sentDocs', SENT_MAX=40;
function _coDigits(s){ return String(s||'').replace(/\D/g,''); }
function _coNorm(s){ return String(s||'').replace(/\s|\(주\)|주식회사|㈜/g,'').replace(/[.#$/[\]]/g,'').toLowerCase(); }
/* 열쇠가 둘일 수 있다 — 사업자등록증이 «나중에» 들어온 회사는 옛 기록이
   이름 열쇠(n…)에 남아 있다. 기업정보함도 읽을 때 두 열쇠를 합쳐 본다(coEffectiveExtra).
   ⚠ 사업자번호는 업체 목록에서 온다 — 아직 안 받았으면 이름 열쇠만 나오고,
     목록이 온 뒤 드로어가 다시 그려질 때 번호 열쇠도 읽는다. */
function coKeysOf(it){
  var co=null; try{ co=coFind(it); }catch(e){}
  var nm=String((it&&it.company)||(co&&(co.name||co.companyName))||'');
  var out=[];
  var d=_coDigits((co&&(co.bizNo||co.bizno))||'');
  if(d.length>=10) out.push(d);
  var nk='n'+_coNorm(nm);
  if(nk!=='n'&&out.indexOf(nk)<0) out.push(nk);
  return out;
}
var sentSrc={}, _sentT={};
/* 아직 안 읽었고 읽는 중도 아닌 열쇠 — 이것이 비면 다시 부르지 않는다.
   ⚠ 「읽는 중」을 안 빼면 드로어가 스스로를 끝없이 다시 그린다. */
function sentNeed(keys){
  return (keys||[]).filter(function(k){ return k && !sentSrc[k] && !_sentT[k]; });
}
function sentLoad(keys){
  if(typeof fbDb==='undefined'||!fbDb){
    (keys||[]).forEach(function(k){ if(k) sentSrc[k]=[]; });
    return Promise.resolve();
  }
  var need=sentNeed(keys);
  if(!need.length) return Promise.resolve();
  return Promise.all(need.map(function(k){
    _sentT[k]=1;
    return fbDb.ref(SENT_ROOT+'/'+k).limitToLast(SENT_MAX).once('value')
      .then(function(s){
        var v=s.val()||{};
        sentSrc[k]=Object.keys(v).map(function(id){
          var o=v[id]||{}; o._k=k; o._n=id; return o;
        }).filter(function(o){ return Number(o.at||0); });
        _sentT[k]=0;
      })
      /* 못 읽어도 조용히 없는 것으로 둔다 — 고장이 아니다(권한·빈 자리) */
      .catch(function(){ sentSrc[k]=[]; _sentT[k]=0; });
  }));
}
/* 두 열쇠에 같은 것이 있을 수 있다 — 같은 명함·같은 시각이면 한 번만 센다
   (기업정보함 coSentList 가 쓰는 그 잣대와 같다). */
function sentFor(it){
  var seen={}, out=[];
  coKeysOf(it).forEach(function(k){
    (sentSrc[k]||[]).forEach(function(r){
      var d=String(r.batch||r.card||'')+'@'+Number(r.at||0);
      if(seen[d]) return;
      seen[d]=1; out.push(r);
    });
  });
  return out.sort(function(a,b){ return Number(b.at||0)-Number(a.at||0); });
}
/* 한 줄로 — 「무엇을 보냈나」. 자료 이름이 곧 한 일이다.
   ⚠ 지어내지 않는다. 여기 적히는 것은 실제로 보낸 자료·묶음의 이름뿐이다. */
function sentBrief(r){
  var names=(r&&r.names)||[];
  var t=String((r&&r.name)||'').trim();
  if(!t&&names.length) t=names.slice(0,2).join(', ')+(names.length>2?' 외 '+(names.length-2)+'건':'');
  if(!t) t=String((r&&r.set)||'').trim();
  if(!t) t=String((r&&r.kind)||'자료');
  return t.length>46?t.slice(0,46)+'…':t;
}
function sentLogLine(r){ return '📤 '+_mailWhen(r.at).split(' ')[0]+' 보냄 — '+sentBrief(r); }
/* ── 푸른메일함의 「🏢 사업장별」로 건너간다 (대표 지시 2026-09-05) ──
   「다음메일에서 받지말고 푸른메일함에 들어가서 찾아라」

   여기 상자에 있는 것은 «표식»이다 — 급여데이터함 서버가 본 메일 몇백 통과
   기업정보함이 내보낸 자료뿐이다. 그 업체와 오간 «모든» 메일과 본문은
   푸른메일함이 이미 한자리에 모아 둔다(받은함 + 보낸함 + 업체 명단, openCoThread).

   ⚠ 같은 것을 여기서 다시 만들지 않는다. 메일 만 통을 업무관리가 또 내려받으면
     요금도 두 배, 잣대도 두 벌이 된다 — 화면마다 「이 업체 메일」이 달라진다.
   ⚠ 업체 번호(푸른이알피 companyId)가 있어야 건너간다. 없으면 단추를 «안 그린다» —
     눌렀는데 엉뚱한 곳이 열리면 고장으로 보인다. */
function mbCoId(it){
  if(it&&it.co_id) return String(it.co_id);

}
function mbGo(coId){

}
/* 담은 표시는 받은 메일과 «같은 자리»(mailchk)에 둔다 — 같은 일이라 두 곳으로 가르면
   되돌리기·표시가 두 벌이 된다. 메일 열쇠는 '-' 로 시작하는 푸시 번호라 겹치지 않는다. */
function sentKey(r){ return safeKey('s|'+String((r&&r._k)||'')+'|'+String((r&&r._n)||'')); }
function sentChk(r){ var k=sentKey(r); return (k&&mailchk&&mailchk[k])||null; }
function sentFind(ck){
  var hit=null;
  Object.keys(sentSrc||{}).forEach(function(k){
    (sentSrc[k]||[]).forEach(function(r){ if(sentKey(r)===ck) hit=r; });
  });
  return hit;
}
function sentTake(itemId,ck){

  addLog(itemId,sentLogLine(r),todayStr(),'mail').then(function(ok){

/* ══════════════════════════════════════════════════════════════════════
   사업장별 메일 요약 (대표 지시 2026-09-06)
   ══════════════════════════════════════════════════════════════════════
   "사업장의 담당자와 관련하여 푸른이알피와 기업정보함에 담당자의 이메일이 있다.
    이 이메일로 들어오는 메일 정보와 보낸메일 정보와 관련해서 간략하게 확인하고
    특정일에 간단하게 어떤메일을 주고 받았었는지 기록이 남아야 한다.
    … 사무관리 전체 사업장에 대하여 연결할 수 있게 해달라."

   여태 이 서랍에 붙던 메일은 «급여 서버가 본» 최근 300통(paydata/maillog)뿐이었다.
   그래서 사업장 대부분은 한 줄도 없었다 — 실제로는 오갔는데도.

   ★ 회사 메일함(만 통)을 여기서 읽지 «않는다». 그것을 읽는 곳은 푸른메일함 한 곳이고,
     거기서 사업장마다 「언제·받음/보냄·무엇을」 서른 줄로 간추려 남긴다:
         pucards/coMail/{사업장열쇠} = {n, at, inN, outN, rows:[{d,at,io,s,w,g}]}
     여기서는 그 «한 칸»만 읽는다. sentDocs 를 읽는 그 길 그대로다.
   ⚠ 그래야 「이 업체 메일」의 잣대가 한 벌로 남는다. 두 화면이 각자 만 통을 훑으면
     같은 업체인데 화면마다 목록이 달라진다.
   ⚠ 규칙을 안 고친다 — pucards 는 읽기가 MAIL(메일 있는 로그인 직원)이다.
   ⚠ 요약이 없으면 조용히 없는 것으로 둔다. 고장이 아니라 «아직 안 만든 것»이고,
     푸른메일함에서 [⇪ 업무관리에 연결]을 누르면 채워진다. */
var CO_MAIL_ROOT='pucards/coMail';
var cmSrc={}, _cmT={};
function cmNeed(keys){
  return (keys||[]).filter(function(k){ return k && !cmSrc[k] && !_cmT[k]; });
}
function cmLoad(keys){
  if(typeof fbDb==='undefined'||!fbDb){
    (keys||[]).forEach(function(k){ if(k) cmSrc[k]={rows:[]}; });
    return Promise.resolve();
  }
  var need=cmNeed(keys);
  if(!need.length) return Promise.resolve();
  return Promise.all(need.map(function(k){
    _cmT[k]=1;
    return fbDb.ref(CO_MAIL_ROOT+'/'+k).once('value')
      .then(function(s){ cmSrc[k]=s.val()||{rows:[]}; _cmT[k]=0; })
      .catch(function(){ cmSrc[k]={rows:[]}; _cmT[k]=0; });
  }));
}
/* 그 업무의 업체에 남아 있는 요약 줄.
   ⚠ 열쇠가 둘일 수 있다(사업자번호·이름) — 둘 다 보고, 같은 시각이면 한 번만 센다. */
function cmFor(it){
  var seen={}, out=[];
  coKeysOf(it).forEach(function(k){
    var box=cmSrc[k];
    ((box&&box.rows)||[]).forEach(function(r){
      if(!r||!Number(r.at)) return;
      var d=String(r.io||'in')+'@'+Number(r.at);
      if(seen[d]) return;
      seen[d]=1; out.push(r);
    });
  });
  return out.sort(function(a,b){ return Number(b.at||0)-Number(a.at||0); });
}
/* 요약이 있는지 — 있으면 「받은 메일」은 그쪽이 정본이다(같은 것을 두 번 안 보여 준다).
   ⚠ 요약이 없으면 예전대로 paydata/maillog 로 붙인다 — 되돌아갈 자리를 남겨 둔다. */
function cmHas(it){
  var yes=false;
  coKeysOf(it).forEach(function(k){ if(cmSrc[k]&&(cmSrc[k].rows||[]).length) yes=true; });
  return yes;
}
function cmWhen(at){
  var d=new Date(Number(at)||0);
  if(isNaN(d.getTime())) return '';
  var p=function(n){ return (n<10?'0':'')+n; };
  return (d.getMonth()+1)+'.'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function cmKey(r){ return safeKey('m|'+String((r&&r.io)||'in')+'|'+Number((r&&r.at)||0)); }
function cmChk(r){ var k=cmKey(r); return (k&&mailchk&&mailchk[k])||null; }
function cmLogLine(r){
  return (r.io==='out'?'📤 ':'✉ ')+String(r.d||'').slice(5)+' '
    +(r.io==='out'?'보냄':'받음')+' — '+String(r.s||'');
}
function cmFind(ck){
  var hit=null;
  Object.keys(cmSrc||{}).forEach(function(k){
    ((cmSrc[k]&&cmSrc[k].rows)||[]).forEach(function(r){ if(cmKey(r)===ck) hit=r; });
  });
  return hit;
}
function cmTake(itemId,ck){
  var r=cmFind(ck);
  if(!r){ toast('메일을 찾지 못했습니다','warn'); return; }
  /* ⚠ 기록이 먼저다. 기록이 안 됐는데 「담김」으로 표시하면 담긴 줄 알고 넘어간다. */
  addLog(itemId,cmLogLine(r),String(r.d||todayStr()).slice(0,10),'mail').then(function(ok){
    if(!ok) return;
    var rec={ by:(S.me&&S.me.sid)||'', byName:(S.me&&S.me.name)||'',
      at:new Date().toISOString(), item:String(itemId||''), log:1 };
    fbDb.ref(NS+'/mailchk/'+ck).set(rec).then(function(){
      if(!mailchk) mailchk={};
      mailchk[ck]=rec;
      if(S.drawerId) renderDrawer();
      route();
    }).catch(function(){ if(S.drawerId) renderDrawer(); });
  });
}
/* 요약 한 줄.
   ⚠ 짐작으로 붙은 줄(제목에 회사 이름이 있어 걸린 것)은 그렇게 적는다 —
     확실한 것과 섞어 보여 주면 남의 메일을 이 업체 것으로 믿게 된다. */
function dCmRowHTML(r,id,up){
  var ck=cmKey(r), c=cmChk(r), out=r.io==='out';
  var t=String(r.s||'');
  return mlRowHTML({ seen:true, out:out, up:up, date:_mlDay(r.at), text:t, full:t,
    guess:!!r.g, guessTip:'회사 이름으로 «짐작해» 이은 줄입니다 — 남의 메일일 수 있습니다',
    meta:cmWhen(r.at)+' '+(out?'보냄':'받음')+(r.w?' · '+String(r.w):'')
      +(r.g?' · 짐작으로 이은 것':''),
    /* 담은 뒤에는 네모가 «되돌리기»가 된다 — 담기 전에는 치울 것이 없어 안 눌린다 */
    ck:(c?'mailUnsee(\''+escJ(ck)+'\')':''),
    ckTip:(c?'담은 표시를 지웁니다 (기록은 그대로 남습니다)':'이미 지난 일입니다 — 치울 것이 없습니다'),
    take:(c?'<span class="took">✎ 담김</span>'
           :'<span class="take" onclick="cmTake(\''+escJ(id)+'\',\''+escJ(ck)+'\')" '
             +'title="'+esc('그날 기록에 한 줄로 남깁니다: '+cmLogLine(r))+'">✎ 기록에</span>'),
    foot:(c?'✎ 기록에 담김 · '+esc(c.byName||'')+' '+esc(String(c.at||'').slice(5,10))
            +' · 왼쪽 네모를 다시 누르면 되돌립니다(기록은 그대로 남습니다)'
          :'이 줄은 사업장별 요약입니다 — 본문은 푸른메일함에서 엽니다.') });
}
function dMailHTML(it,itemId){
  /* ★ 사업장별 요약이 있으면 그것이 «메일의 정본»이다 (대표 지시 2026-09-06).
     요약은 회사 메일함 전체를 보고 만든 것이라 훨씬 넓다. 그런데 그 안에는
     paydata/maillog 로 온 것도 들어 있어, 둘을 함께 그리면 같은 메일이 두 번 보인다.
     ⚠ 요약이 «아직 없는» 업체는 예전대로 붙인다 — 되돌아갈 자리를 남겨 둔다. */
  var cm=cmFor(it);
  var arr=(!cm.length&&mailSrc)?mailFor(it):[];   // 아직 안 읽었거나 못 읽었다 — 조용히 없다
  var snt=sentFor(it);
  /* ⚠ 아주 숨기지 않는다. 붙은 것이 없더라도 «손으로 붙이는 길»은 남아야 한다 —
     엠비프라텍이 바로 그 경우였다(상자가 통째로 안 보여 「연결이 안 된다」로 읽혔다).
     ⚠ 그래도 아직 «읽지 못했을 때»(mailSrc 가 null)는 숨긴다 — 「없다」고 거짓말하지 않는다. */
  if(!arr.length&&!snt.length&&!cm.length&&!mailSrc) return '';
  /* 받은 것과 보낸 것을 «한 줄로» 섞어 시간순으로 놓는다 —
     「이 업체와 무슨 일이 오갔나」는 받은 것만으로는 반쪽이다.
     ⚠ 그래도 «안 본 메일»은 맨 위다. 이 상자를 여는 까닭이 그것이라,
       석 달 전 안 본 메일이 어제 보낸 자료 밑으로 가라앉으면 안 된다.
     ⚠ 보낸 것은 «이미 한 일»이라 안 본 것으로 세지 않는다. 세면 숫자가 안 줄어
       무엇이 밀렸는지 못 찾는다(mailFlag 와 같은 까닭). */
  var rows=arr.map(function(m){ return { out:0, at:Number(m.at||0), m:m, seen:!!mailChk(m) }; })
    .concat(snt.map(function(r){ return { out:1, at:Number(r.at||0), r:r, seen:true }; }))
    /* 요약 줄은 «이미 지난 일»이라 안 본 것으로 세지 않는다 — mailFlag 와 같은 까닭 */
    .concat(cm.map(function(r){ return { cm:1, at:Number(r.at||0), r:r, seen:true }; }))
    .sort(function(a,b){
      var ca=a.seen?1:0, cb=b.seen?1:0;
      if(ca!==cb) return ca-cb;
      return b.at-a.at;
    });
  var nNew=rows.filter(function(x){ return !x.seen; }).length;
  var id=itemId||it._id;
  var cmIn=cm.filter(function(r){ return r.io!=='out'; }).length;
  var cnt=(nNew?'<b style="color:var(--danger)">안 본 '+nNew+'</b> · ':'')
    +'받음 '+(arr.length+cmIn)+' · 보냄 '+(snt.length+(cm.length-cmIn));
  var show=rows.slice(0,12);
  return '<div class="dbox mlbox"><div class="bh">✉️ 이 업체와 오간 것'+hlp('mail')
    +'<span class="r">'+cnt+'</span></div><div class="bb">'
    +show.map(function(x,i){
      /* 아래쪽 석 줄은 펴진 것을 «위로» 올린다 — 안 그러면 서랍 바닥에 잘린다 */
      var up=(show.length>3 && i>=show.length-3);
      if(x.cm) return dCmRowHTML(x.r,id,up);
      if(x.out) return dSentRowHTML(x.r,id,up);
      return dMailRowHTML(x.m,id,up);
    }).join('')
    +(rows.length>12?'<div class="kbempty">외 '+(rows.length-12)+'건</div>':'')
    +dMbGoHTML(it)
    +dMlkAddHTML(it,id)
    +'</div></div>';
}
/* ── 오간 것 한 줄 ────────────────────────────────────────────────
   세 갈래(사업장 요약 · 받은 메일 · 보낸 것)가 «한 곳에서» 그려진다.
   ⚠ 갈래마다 따로 그리면 한쪽만 고쳐져 줄 높이·차례가 어긋난다 —
     예전에 세 벌로 갈라져 있어서 하나를 고칠 때마다 셋을 찾아다녔다.
   받는 것:
     seen 본 것인가 · out 보낸 것인가 · up 위로 펴야 하는가
     date 날짜 · text 한 줄로 줄인 글 · att 첨부 수
     full 자르지 않은 글 · meta 언제·누가 · body 미리보기
     ck   네모를 눌렀을 때 (없으면 눌리지 않는 네모)
     take 마우스 올렸을 때 뜨는 단추 · foot 펴진 것 바닥 줄 */
function mlRowHTML(o){

    +(o.hand?'<span class="hd1" title="'+esc(o.handTip||'')+'">손으로 이음</span>':'')
    +(o.att?'<span class="att" title="'+esc(o.attTip||'')+'">📎 '+o.att+'</span>':'')
    +(o.take||'')
    +'<div class="mlpop">'
      +'<div class="pt">'+esc(o.full||o.text||'')+'</div>'
      +'<div class="pm">'+esc(o.meta||'')+'</div>'
      +(o.body?'<div class="pp">'+esc(o.body)+'</div>':'')
      +'<div class="pf">'+(o.foot||'')+'</div>'
    +'</div></div>';
}
/* 상자 바닥 — 「여기 있는 것이 전부가 아니다」를 한 줄로 말하고 길을 알려 준다.
   ⚠ 안내문을 깔지 않는다. 단추 하나와 그 설명(title)이면 된다. */
function dMbGoHTML(it){

    +'🔎 푸른메일함에서 모두 보기 ↗</button></div>';
}
/* 상자 바닥의 두 번째 길 — 안 붙은 메일을 이 업무에 손으로 붙인다 */
function dMlkAddHTML(it,id){
  if(!mailSrc) return '';
  return '<div class="mlgo"><button onclick="mlkAttachModal(\''+escJ(id)+'\')" '

    +'＋ 메일 이어 붙이기</button></div>';
}
// 받은 메일 한 줄
function dMailRowHTML(m,id,up){
  var k=mailKey(m), c=mailChk(m);
  /* 첨부 수가 대표가 말한 「자료 온 것」이다. 담긴 수(took)는 그중 실제로 들어간 것 —
     둘이 다르면(왜 안 담겼나) 펴 보았을 때 알 수 있어야 한다. */
  /* ⚠ 옛 메일에는 atts 가 없고 took 만 있다 — atts 만 보면 「자료가 왔다」가
     조용히 사라진다. 둘 다 보고, 큰 쪽을 셈으로 쓴다. */
  var na=Number(m.atts||0), nt=Number(m.took||0), nn=na||nt;

  /* 사람이 이은 줄에는 딱지를 붙인다 — 기계가 정한 것과 사람이 정한 것은

  var L=maillink&&maillink[k];

           :'<span class="take" onclick="mailSee(\''+escJ(id)+'\',\''+escJ(k)+'\',1)" '
             +'title="'+esc('주간 기록에 한 줄로 남깁니다: '+mailLogLine(m))+'">✎ 기록에</span>'),
    foot:(c?(c.log?'✎ 기록에 담김':'✓ 확인함')+' · '+esc(c.byName||'')+' '+esc(String(c.at||'').slice(5,10))

          :'여기 있는 것은 서버가 본 미리보기입니다 — 본문은 푸른메일함에서 엽니다.') });

/* 보낸 것 한 줄.

/* ══════════════════════════════════════════════════════════════════════
   📬 이어 줄 메일 — 손으로 이어 주는 칸 (대표 승인 2026-09-07)
   ══════════════════════════════════════════════════════════════════════
   2026-09-07 실측: 수집함 116통 중 91통은 저절로 붙었는데 25통이 안 붙었다.
   «이름표가 있는데 안 붙은 것은 0통» — 붙이는 쪽은 멀쩡하다. 안 붙는 25통의 정체는
       9통 세무·회계사무소  — 한 주소가 여러 사업장에 걸려 기계가 한 곳을 못 고른다
                             (정담회계법인 하나가 7곳)
       6통 개인 메일 주소    — 네이버·한메일. 어디에도 등록돼 있지 않다
       5통 되돌아온 것·알림  — Delivery failure·인증번호·교육안내. 사업장 메일이 아니다
       5통 그 밖
   앞의 둘은 «사람만» 정할 수 있고, 셋째는 «치워야» 한다.

   ⚠⚠ 제목 이름 맞추기를 느슨하게 풀어 자동으로 붙이지 않는다. 「해찬솔F3」과
     「해찬솔에프쓰리」를 기계가 같게 보게 하면, 이 저장소가 2026-08-28 에 한 번 겪은
     «남의 회사에 자료가 붙는» 사고로 돌아간다. 느슨한 맞추기는 사람에게 보여 줄
     «제안»에만 쓰고(mlkSuggest), 붙이는 것은 사람이 누른다.
     실제로 「늘봄반찬」은 배방점·모종점 둘, 「맛찬들왕소금구이」는 인덕원점·당진점 둘,
     「유원에프앤비」는 본점·롤링파스타 둘이다 — 기계는 못 고르고 담당자는 안다.
   ⚠ 치우는 길이 «반드시» 있어야 한다. 받은메일함을 열었으니 사업장 메일이 아닌 것도
     들어온다 — 치울 수 없으면 목록에 쌓여 정작 짚어야 할 것이 묻힌다.
   ⚠ 치운 것을 다시 볼 탭을 둔다. 잘못 치웠을 때 되돌릴 자리가 없으면 영영 못 찾는다. */
function _koOnly(s){ return String(s||'').replace(/[^가-힣]/g,''); }
function mlkAddrKey(a){ return safeKey(String(a||'').toLowerCase()); }

/* 수집함을 한 번 훑어 세 갈래로 가른다.
   ⚠ 업무 표식은 «업무마다 한 번»만 만든다 — 메일마다 다시 만들면 업무 455건 ×
     메일 116통이 되어 화면이 멈춘다. */
function mlkScan(){
  var out={orphan:[],none:[],linked:[]};
  if(!mailSrc||!mailSrc.length) return out;
  var keys=openItems().map(function(it){ return mailKeysOf(it); });
  mailSrc.forEach(function(m){
    var k=mailKey(m); if(!k) return;
    var L=maillink&&maillink[k];
    if(L&&L.none){ out.none.push(m); return; }
    if(L&&L.item){ out.linked.push(m); return; }
    for(var i=0;i<keys.length;i++){ if(mailHit(keys[i],m)) return; }
    out.orphan.push(m);
  });
  return out;
}
/* 이름이 몇 자나 겹쳐야 후보로 올릴까 — «한 곳»에만 적는다.
   두 자는 안 된다: 「가나」는 「가나다」·「가나전자」·「가나산업」에 다 걸린다.
   ⚠ 같은 숫자를 두 곳에 두지 않는다 — 한쪽만 고쳐지면 문턱이 조용히 달라진다. */
var MLK_MIN_MATCH=3;
/* 제목에서 회사 이름 «조각»을 찾아 후보를 뽑는다 — 사람에게 보여 줄 제안이다.
   ⚠ 겹친 «글자 수»를 함께 돌려준다. 왜 올라왔는지 화면에 적어야 사람도
     기계처럼 잘못 고르지 않는다. */
function mlkSuggest(m){
  var hay=_koOnly(String(m.subject||'')+' '+String(m.preview||'').slice(0,80));
  if(!hay) return [];
  var out=[];
  openItems().forEach(function(it){
    var co=_koOnly(it.company);
    for(var len=co.length;len>=MLK_MIN_MATCH;len--){
      if(hay.indexOf(co.slice(0,len))>=0){ out.push({it:it,n:len}); break; }
    }
  });
  out.sort(function(a,b){ return b.n-a.n||String(a.it.company||'').localeCompare(String(b.it.company||''),'ko'); });
  return out.slice(0,6);
}
/* 업체 레코드 «어디에 있든» 메일 주소를 긁는다.
   ⚠⚠ contacts 만 보면 안 된다. 세무사무소 주소는 업체 레코드의 taxEmail 칸에 들어 있고,
     실측(2026-09-07) 정담회계법인 cpabong@naver.com 은 그 칸으로 «7곳»에 걸려 있었다.
     contacts 만 보던 첫 판은 「0곳」이라 답해 고정을 허용했다 — 가드가 뚫린 것이다.
   ⚠ 칸 이름을 못 박지 않는다(앱마다·시기마다 다르다). 이름에 tax·세무·회계가 든 칸이면
     «대행 주소»로 본다 — 서버 쪽 collectEmails 가 칸 이름을 안 박는 것과 같은 까닭. */
function _coMailScan(node,acc,depth,key){
  if(node==null||depth>4) return acc;
  if(typeof node==='string'){
    var m=node.match(/[\w.+-]+@[\w.-]+\.\w+/);
    if(m){
      var a=m[0].toLowerCase();
      acc.all[a]=1;
      if(/tax|세무|회계/i.test(String(key||''))) acc.agent[a]=1;
    }
    return acc;
  }
  if(typeof node!=='object') return acc;
  Object.keys(node).forEach(function(k){ _coMailScan(node[k],acc,depth+1,k); });
  return acc;
}
/* 주소 → {걸린 사업장들, 대행 주소인가} 색인. 업체 목록이 바뀔 때만 다시 만든다 —
   줄마다 업체 373곳을 다시 훑으면 화면이 느려진다. */
var _mlkAIdx=null, _mlkAIdxSrc=null;
function mlkAddrIdx(){
  if(_mlkAIdx&&_mlkAIdxSrc===coSrc) return _mlkAIdx;
  var idx={};
  (coSrc||[]).forEach(function(c){
    if(!c) return;
    var acc=_coMailScan(c,{all:{},agent:{}},0,'');
    var nm=String(c.name||c.companyName||'').trim();
    Object.keys(acc.all).forEach(function(a){
      var e=idx[a]||(idx[a]={cos:{},agent:false});
      if(nm) e.cos[nm]=1;
      if(acc.agent[a]) e.agent=true;
    });
  });
  _mlkAIdx=idx; _mlkAIdxSrc=coSrc;
  return idx;
}
/* 이 주소가 «몇 사업장»에 걸려 있나 · «대행 주소»인가 — 둘 중 하나라도 걸리면 못 고정한다.
   ⚠ 잣대는 «공용 도메인이냐»가 아니다. 정담회계법인은 naver.com 이면서 7곳에 걸린다.
     반대로 회사 도메인 주소도 한 곳만 가리키면 고정해도 된다.
   ⚠ 대행 주소는 «지금 한 곳만» 걸려 있어도 고정하면 안 된다 — 세무·회계사무소는
     본디 여러 곳을 대행하므로, 다음 달에 두 번째 사업장이 붙는다. */
function mlkAddrCos(from){
  var a=_mailAddr(from); if(!a) return {cos:[],agent:false};
  var seen={};
  (mailSrc||[]).forEach(function(m){
    if(_mailAddr(m.from)!==a) return;
    var c=String(m.companyName||'').trim(); if(c) seen[c]=1;
  });
  var e=mlkAddrIdx()[a];
  if(e) Object.keys(e.cos).forEach(function(c){ seen[c]=1; });
  return { cos:Object.keys(seen), agent:!!(e&&e.agent) };
}
/* 고정해도 되는 주소인가 — 한 곳 이하이고 대행 주소가 아닐 때만 */
function mlkCanPin(from){
  if(!_mailAddr(from)) return false;
  var r=mlkAddrCos(from);
  return r.cos.length<=1&&!r.agent;
}
function _mlkWho(){ return { by:(S.me&&S.me.sid)||'', byName:(S.me&&S.me.name)||'', at:new Date().toISOString() }; }

/* 이 메일은 이 업무 것이다. pin 이면 주소까지 고정한다. */
function mlkLink(k,itemId,pin){
  var m=null; (mailSrc||[]).forEach(function(x){ if(mailKey(x)===k) m=x; });

        : '이 주소는 '+r.cos.length+'곳에 걸려 있어 고정할 수 없습니다','warn');

    }

/* 사업장 메일이 아니다 — 치운다. 여러 통을 한 번에 치운다(반송·알림이 몰려 온다). */
function mlkNone(keys){

function mlkBadge(){ return mlkScan().orphan.length; }

/* 업무를 고르는 창 — 제안을 위에 세우고, 그 아래에서 찾는다.
   ⚠ 진행 업무가 455건이다. 목록만 늘어놓으면 못 찾는다. */

  setTimeout(function(){ var e=$('mlk-q'); if(e){ e.focus(); e.setSelectionRange(e.value.length,e.value.length); } },40);

/* 한 줄 — 「오간 것」과 같은 모양이다(mlRowHTML 을 나눠 쓴다) */
function mlkRowHTML(m,tab,up){

  var many=sug.length>1;

  if(tab==='todo'){

/* 상태를 바꾸면 «기록 한 줄»이 저절로 남는다 (대표 지시 2026-08-27 「메모상자 빌 때?」)
   ═══════════════════════════════════════════════════════════════════════
   주간 기록이 이백오십칠 건 전부 0줄이었다. 그런데 아무 일도 없었던 것이 아니라,
   일어난 일을 아무도 «타자로 치지» 않았을 뿐이다.
   상태를 바꾸는 것은 그 자체가 일이다 — 검토로 넘겼고, 대기응답으로 돌렸다.
   그런데 그것이 기록에 한 줄도 안 남아, 주간표를 열면 여전히 빈칸이었다.

   ⚠ 왜 이것은 «저절로» 남기고, 메일·푸른이알피 메모는 사람이 담게 했나 —
     상태 바뀜은 «일어난 사건»이다. 날짜가 있고, 사람이 일부러 눌렀고, 두 번 생기지 않는다.
     메모는 «덮어쓰는 한 칸»이고 메일은 «바깥 자료»라, 저절로 옮기면 같은 줄이 쌓이거나
     안 한 일을 한 것처럼 남는다. 그 셋을 같이 다루면 안 된다.
   ⚠ 저장이 안 됐으면 기록도 안 남긴다. 안 바뀐 것을 바뀌었다고 적으면 안 된다.
   ⚠ 제자리는 아무것도 안 한다 — 표·보드에서 같은 값을 다시 고르는 일이 흔하다. */
function setStatus(id,v){
  if(!STATUSES.some(function(x){ return x[0]===v; })) return;   // 목록에 없는 값은 받지 않는다
  var was=((items[id]||{}).status)||'진행중';
  if(was===v) return;                                           // 제자리 — 헛저장·헛기록을 안 한다
  patchItem(id,{status:v}).then(function(ok){
    if(!ok) return;
    addLog(id,'상태 '+was+' → '+v,todayStr(),'st');
    /* ⚠ 저장이 끝난 «뒤에» 다시 그린다. 누른 자리에서 바로 그리면 옛 값이 그려진다. */
    if(S.drawerId===id) renderDrawer();
    route();
  });
}
/* 푸른이알피 원본 상태를 우리 상태 아래에 덧붙인다. 같은 말이면 그리지 않는다 —
   같은 글자가 두 번 서면 무엇이 다른지 알 수 없다. */
function peStChip(it){
  var v=String((it&&it.pe_st)||'').trim();
  if(!v||v===(it.status||'진행중')) return '';
  return '<div class="pest" title="푸른이알피 원본 상태 — '+esc(PE_KIND[(it.ref||{}).type]||'')
    +'관리에서 정합니다. 여기서는 바꿀 수 없습니다.">'+esc(v)+'</div>';
}
// 임박 판정·정렬이 보는 기한. 사건 단계 기한(pe_due)이 더 이르면 그것이 기준이 된다 —
// 법정 기한을 놓치면 되돌릴 수 없으므로, 사람이 적은 날짜에 가려지면 안 된다.
// 원래 순서(다음 할 일 → 기한)는 그대로 두고, 사건 단계 기한이 그보다 이를 때만 앞선다.
function itemDue(it){
  var base=(it.next&&it.next.date)||it.due||'';
  var sd=(it.pe_due&&it.pe_due.date)||'';
  if(sd && (!base || sd<base)) return sd;
  return base;
}
// 사건 단계 기한 배지 — pe_due 는 푸른이알피가 송달일·판정일에서 계산해 한 방향으로 내려보낸다.
// 여기서 고칠 수 없다. 아직 확인 안 된 법정 기한은 (확인) 을 붙여 그대로 믿지 않게 한다.
function sdueHTML(it){
  var pd=it&&it.pe_due; if(!pd||!pd.date) return '';
  var n=dday(pd.date); if(n===null) return '';
  var txt=n<0?('D+'+(-n)):n===0?'D-Day':('D-'+n);
  var unv=(pd.verified!==true);
  return '<span class="sdue'+(unv?' unv':'')+'" title="사건 ▸ 심급·단계에서 계산된 기한 ('+esc(pd.date)+')'
    +(unv?' · 법정 기한이 아직 확인되지 않았습니다 — 푸른이알피 환경설정 ▸ 업무유형에서 확인하세요':'')
    +' · 여기서는 바꿀 수 없습니다">'
    +'<span class="dd">'+txt+'</span>⚖ '+esc(pd.label||'단계 기한')+(unv?'(확인)':'')+'</span>';
}

/* ── 기록 쓰기 (일 단위 저장 + 주 묶음 + 건별 사본 + last 캐시) ── */
var _lastLogId='';   // 방금 만든 기록 ID — 체크가 만든 기록을 나중에 되찾기 위함
/* extra — 그 기록에만 붙는 여분 칸(급여 월 표시 pm 등).
   ⚠ 있을 때만 얹는다. 없는 칸을 undefined 로 넣으면 파이어베이스가 통째로 물린다. */
function addLog(itemId,text,dateStr,kind,extra){
  text=(text||'').trim(); if(!text){ toast('내용을 입력하세요','warn'); return Promise.resolve(false); }
  dateStr=dateStr||todayStr();
  var wk=weekKeyOf(mondayOf(new Date(dateStr+'T00:00:00')));
  var y=weekYear(wk), lid=rid('L');
  _lastLogId=lid;
  var log={d:dateStr,t:text,by:(S.me&&S.me.sid)||'',byName:(S.me&&S.me.name)||'',at:new Date().toISOString()};
  if(kind) log.k=kind;
  if(extra) for(var _e in extra){ if(Object.prototype.hasOwnProperty.call(extra,_e)&&extra[_e]!=null) log[_e]=extra[_e]; }
  var up={};
  up[NS+'/logs/'+y+'/'+wk+'/'+itemId+'/'+lid]=log;
  up[NS+'/itemlogs/'+itemId+'/'+lid]=Object.assign({w:wk},log);
  var it=items[itemId];
  if(it&&(!it.last||String(it.last.d||'')<=dateStr)) up[NS+'/items/'+itemId+'/last']={d:dateStr,t:text};
  return fbDb.ref().update(up).then(function(){
    if(!wkCache[wk])wkCache[wk]={}; if(!wkCache[wk][itemId])wkCache[wk][itemId]={};
    wkCache[wk][itemId][lid]=log;
    if(itemLogsCache[itemId]) itemLogsCache[itemId][lid]=Object.assign({w:wk},log);
    if(it&&(!it.last||String(it.last.d||'')<=dateStr)) it.last={d:dateStr,t:text};
    toast('기록 저장됨'); return true;
  }).catch(function(e){ toast('저장 실패: '+e.message,'err'); return false; });
}
/* ══════════════════════════════════════════════════════════════════════
   급여 처리를 «월 한 줄»로 (대표 지시 2026-09-05)
   ══════════════════════════════════════════════════════════════════════
   노무사 아닌 직원(사무장 등)이 급여관리에서 하는 일 — 자료 받고, 명세서 보내고 —
   이 업무관리에 한 줄도 안 남았다. 그래서 그 사업장을 열어도 이 달에 무엇을 했는지
   알 수가 없었다.

   ⚠ 급여 앱은 «한 글자도» 안 건드린다. 이미 남기고 있다:
       payroll_os/inbox      … 자료 수신 (사업장·월·종류·ts)
       payroll_os/slip_sent  … 명세서 발송 (열쇠 「사업장|월|성명」, at)
     여기서는 그것을 읽어 한 줄로 «비끄러맬» 뿐이다.

   ⚠ 왜 «월 한 줄»인가 (대표 결정)
     사업장 마흔 곳이면 일마다 적을 때 달마다 백 줄이 넘는다. 그러면 이제 겨우
     차기 시작한 사건·컨설팅 기록이 그 아래 묻힌다. 그래서 사업장×월로 묶어 한 줄만
     두고, 달이 가는 동안 그 줄을 «고쳐 쓴다».

   ⚠ payroll_os 는 재무·관리자만 읽는다. 권한이 없는 사람 화면에서는 이 일이
     그냥 안 돈다(고장이 아니다). 대신 만들어진 «기록»은 work_erp 에 있으므로
     전 직원이 그대로 본다 — 한 사람이 열면 모두가 본다. */
var PAY_ROOT='payroll_os';
var paySrc=null, _payT=null;
function payLoad(){
  if(paySrc) return Promise.resolve(paySrc);
  if(_payT) return _payT;
  if(typeof fbDb==='undefined'||!fbDb){ paySrc={inbox:{},sent:{}}; return Promise.resolve(paySrc); }
  var one=function(k){ return fbDb.ref(PAY_ROOT+'/'+k).once('value')
    .then(function(s){ var v=s.val(); return (v&&typeof v==='object'&&!Array.isArray(v))?v:{}; },
          function(){ return null; }); };
  _payT=Promise.all([one('inbox'),one('slip_sent')]).then(function(r){
    // 둘 다 못 읽었으면 «권한이 없다» — 빈손으로 두고 아무것도 안 한다
    paySrc=(r[0]===null&&r[1]===null)?null:{inbox:r[0]||{},sent:r[1]||{}};
    _payT=null; return paySrc;
  }, function(){ paySrc=null; _payT=null; return null; });
  return _payT;
}
// 급여관리가 쓰는 사업장 이름 다듬기와 «같은 규칙»으로 맞춘다 (payroll-os siteKey)
function _payKey(s){ return String(s||'').replace(/\(.*?\)|㈜|주식회사|\s/g,''); }
function _payMon(v){ var m=String(v||'').match(/(\d{1,2})\s*월/); if(m) return +m[1];
  var n=String(v||'').match(/^\d{4}-(\d{2})/); return n?+n[1]:null; }
function _payYm(ts,mon){
  var d=new Date(Number(ts)||Date.now());
  var y=d.getFullYear();
  /* 12월 자료를 1월에 만지면 해가 어긋난다 — 달이 훌쩍 앞서면 지난해로 본다 */
  if(mon && (d.getMonth()+1)-mon <= -6) y--;
  else if(mon && (d.getMonth()+1)-mon >= 6) y++;
  return y+'-'+(mon<10?'0':'')+mon;
}
/* 사업장×월로 묶는다 → { '사업장키|2026-09': {site, ym, got, sent, last} } */
function payRoll(){
  if(!paySrc) return {};
  var out={};
  function slot(site,ym){
    var k=_payKey(site)+'|'+ym;
    return out[k]||(out[k]={key:k,site:String(site||''),ym:ym,got:0,sent:0,last:0});
  }
  Object.keys(paySrc.inbox||{}).forEach(function(id){
    var a=paySrc.inbox[id]||{}; var site=a.사업장||''; var mon=_payMon(a.월);
    if(!site||!mon) return;                       // 사업장·월을 못 읽은 줄은 셈에 안 넣는다
    var s=slot(site,_payYm(a.ts,mon)); s.got++; if(Number(a.ts)>s.last) s.last=Number(a.ts);
  });
  Object.keys(paySrc.sent||{}).forEach(function(k){
    var p=String(k).split('|'); if(p.length<3) return;
    var site=p[0], mon=_payMon(p[1]); if(!site||!mon) return;
    var v=paySrc.sent[k]||{};
    var s=slot(site,_payYm(v.at,mon)); s.sent++; if(Number(v.at)>s.last) s.last=Number(v.at);
  });
  return out;
}
function payLine(r){
  var mon=+String(r.ym).slice(5);
  var bits=[];
  if(r.got) bits.push('자료 '+r.got+'건 받음');
  if(r.sent) bits.push('명세서 '+r.sent+'명 보냄');
  return '💰 '+mon+'월 급여 · '+(bits.length?bits.join(' · '):'처리 시작');
}
/* 그 사업장의 업무를 찾는다 — 이름을 다듬어 견준다(메일 붙이기와 같은 잣대) */
function payItemOf(site){
  var k=_normCo(site); if(!k) return null;
  var open=openItems().filter(function(it){ return _normCo(it.company||it.client)===k; });
  if(!open.length) return null;
  // 급여로 만든 것이 있으면 그것, 없으면 아무 진행 건에 붙인다
  return open.filter(function(it){ return it.pay_site; })[0]||open[0];
}
/* 짝이 없으면 «그때만» 만든다 (대표 결정 2026-09-05).
   ⚠ 미리 만들어 두지 않는다 — 급여만 받는 곳이 마흔이면 빈 업무 마흔이 깔린다. */
/* 그 사업장의 «담당»을 푸른이알피 업체관리에서 찾는다 (대표 지시 2026-09-05).
   ⚠ 예전에는 담당을 비워 두었다. 그래서 급여 업무가 «(담당 미지정)»에만 쌓이고,
     정작 그 급여를 처리한 사람의 「내 업무」에는 한 건도 안 나왔다 —
     「급여 대응도 업무에 포함」이 반쪽이었던 까닭이다.
   ⚠ 못 찾으면 예전처럼 비워 둔다. 아무나 넣으면 «남의 업무»가 된다.
   ⚠ 이름표(사번→이름)를 못 읽었으면 넣지 않는다 — 사번만 있으면 화면에서 못 알아본다.
     읽을 수 있는 사람이 한 번 열면 그때 채워진다(_peU2NKnown 과 같은 결). */
function payMgrOf(site){
  var n=_payKey(site);
  if(!n||!coSrc||!coSrc.length) return null;
  var hit=null;
  coSrc.forEach(function(c){
    if(!hit&&c&&_payKey(c.name||c.companyName)===n) hit=c;
  });
  if(!hit) return null;
  var sid=String(hit.managerMain||'');
  var nm=(sid&&_peU2N&&_peU2N[sid])||'';
  if(!nm) return null;
  return { sid:sid, name:nm, co_id:String(hit.id||'') };
}
function payMakeItem(site){
  var id='PAY-'+safeKey(_payKey(site));
  if(items[id]) return Promise.resolve(id);
  var mg=payMgrOf(site);
  var rec={ no:S.year+'-급여-'+safeKey(_payKey(site)).slice(0,12), cat:'급여',
    company:String(site||''), title:'급여 처리', status:'진행중',
    mgr_main:{sid:(mg&&mg.sid)||'',name:(mg&&mg.name)||''}, pe_nomgr:!mg,
    co_id:(mg&&mg.co_id)||'', pay_site:_payKey(site),
    src:'pay', created_at:new Date().toISOString() };
  return fbDb.ref(NS+'/items/'+id).set(rec).then(function(){ items[id]=rec; return id; })
    .catch(function(){ return null; });
}
/* 그 달 한 줄을 «고쳐 쓴다».
   ⚠ 달마다 한 줄이다. 새로 만들지 않고 있던 줄의 글만 바꾼다 —
     안 그러면 자료가 올 때마다 줄이 쌓여 「월 한 줄」이 무너진다. */
function payPutLine(itemId,r){
  return loadItemLogs(itemId).then(function(){
    var box=itemLogsCache[itemId]||{}, hit=null;
    Object.keys(box).forEach(function(lid){
      var l=box[lid]; if(l&&l.k==='pay'&&l.pm===r.ym) hit=Object.assign({_id:lid},l);
    });
    var txt=payLine(r);
    if(hit&&String(hit.t||'')===txt) return false;            // 달라진 것이 없다 — 쓰지 않는다
    var d=r.last?new Date(Number(r.last)):new Date();
    var ds=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    if(!hit) return addLog(itemId,txt,ds,'pay',{pm:r.ym}).then(function(ok){ return !!ok; });
    var wk=hit.w||weekKeyOf(mondayOf(new Date(ds+'T00:00:00'))), y=weekYear(wk), up={};
    up[NS+'/logs/'+y+'/'+wk+'/'+itemId+'/'+hit._id+'/t']=txt;
    up[NS+'/itemlogs/'+itemId+'/'+hit._id+'/t']=txt;
    return fbDb.ref().update(up).then(function(){
      box[hit._id].t=txt;
      if(wkCache[wk]&&wkCache[wk][itemId]&&wkCache[wk][itemId][hit._id]) wkCache[wk][itemId][hit._id].t=txt;
      return true;
    }).catch(function(){ return false; });
  });
}
/* 한 바퀴 — 읽고, 묶고, 붙인다. 조용히 돈다(토스트를 띄우지 않는다). */
var _payBusy=false;
function paySync(){
  if(_payBusy) return Promise.resolve(0);
  _payBusy=true;
  return payLoad().then(function(src){
    if(!src) return 0;                                        // 권한이 없다 — 아무것도 안 한다
    var roll=payRoll(), keys=Object.keys(roll), n=0;
    return keys.reduce(function(p,k){
      return p.then(function(){
        var r=roll[k];
        if(!r.got&&!r.sent) return;
        var it=payItemOf(r.site);
        var go=it?Promise.resolve(it._id):payMakeItem(r.site);
        return go.then(function(id){ if(!id) return;
          return payPutLine(id,r).then(function(ch){ if(ch) n++; }); });
      });
    },Promise.resolve()).then(function(){ return n; });
  }).then(function(n){
    _payBusy=false;
    if(n) route();
    return n;
  }, function(){ _payBusy=false; return 0; });
}
// 기록을 고치거나 지울 수 있는 사람 — 쓴 본인과 대표
function canLog(l){
  if(!l) return false;
  return isAdmin()||l.by===(S.me&&S.me.sid)||l.byName===(S.me&&S.me.name);
}
// 기록 줄에 붙는 ✎ ✕ (표의 주간 칸·드로어 공통)
function logBtns(itemId,l){
  if(!canLog(l)) return '';
  var a=escJ(itemId), b=escJ(l._id||'');
  // 체크가 만든 기록은 체크를 풀면 되므로 여기서 또 옮길 필요가 없다
  return (l.k!=='step'?'<span class="lgx" onclick="event.stopPropagation();logToPlan(\''+a+'\',\''+b+'\')" '
      +'title="아직 안 한 일이었다면 — 할 일로 옮깁니다">↑</span>':'')
    +'<span class="lgx" onclick="event.stopPropagation();editLog(\''+a+'\',\''+b+'\')" title="이 기록 고치기">✎</span>'
    +'<span class="lgx dl" onclick="event.stopPropagation();delLog(\''+a+'\',\''+b+'\')" title="이 기록 지우기">✕</span>';
}
/* 기록 수정 — 내용과 날짜를 고친다.
   날짜를 바꾸면 주차가 달라질 수 있으므로 옛 주차에서 지우고 새 주차에 다시 넣는다.
   기록은 주차별(logs)과 건별(itemlogs) 두 곳에 있어 한 번의 update로 함께 옮긴다. */
function editLog(itemId,lid){
  loadItemLogs(itemId).then(function(){
    var l=(itemLogsCache[itemId]||{})[lid];
    if(!l){ toast('기록을 찾을 수 없습니다','warn'); return; }
    if(!canLog(l)){ toast('본인이 쓴 기록만 고칠 수 있습니다','warn'); return; }
    showModal('<h2 style="margin:0 0 6px">✎ 기록 고치기</h2>'
      +'<p class="muted" style="font-size:12px;margin:0 0 11px">'
      +esc((items[itemId]&&(items[itemId].company||items[itemId].title))||'')
      +(l.byName?' · 작성 '+esc(l.byName):'')+(l.at?' '+esc(String(l.at).slice(0,10)):'')+'</p>'
      +'<div class="fld" style="margin-bottom:9px"><label>내용</label>'
      +'<textarea id="lg-t" rows="3" style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit">'
      +esc(l.t||'')+'</textarea></div>'
      +'<div class="fld" style="margin-bottom:4px"><label>날짜</label>'
      +'<input type="date" id="lg-d" value="'+esc(l.d||'')+'"></div>'
      +'<div class="muted" style="font-size:11px">날짜를 바꾸면 그 날이 속한 주의 기록으로 옮겨집니다.</div>'
      +'<div id="lg-msg" class="muted" style="font-size:12px;min-height:17px;margin-top:6px"></div>'
      +'<div class="row" style="justify-content:flex-end">'
      +'<button style="color:var(--danger);border-color:#f87171" onclick="closeM();delLog(\''+escJ(itemId)+'\',\''+escJ(lid)+'\')">🗑 삭제</button>'
      +'<span style="flex:1"></span><button onclick="closeM()">취소</button>'
      +'<button class="primary" onclick="saveLogEdit(\''+escJ(itemId)+'\',\''+escJ(lid)+'\')">저장</button></div>');
    setTimeout(function(){ var e=$('lg-t'); if(e){ e.focus(); e.setSelectionRange(e.value.length,e.value.length); } },60);
  });
}
function saveLogEdit(itemId,lid){
  var msg=$('lg-msg');
  var t=(($('lg-t')||{}).value||'').trim(), d=(($('lg-d')||{}).value||'').trim();
  if(!t){ if(msg)msg.textContent='내용을 비울 수 없습니다. 지우려면 삭제를 누르세요.'; return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ if(msg)msg.textContent='날짜를 확인해 주세요.'; return; }
  var l=(itemLogsCache[itemId]||{})[lid];
  if(!l){ if(msg)msg.textContent='기록을 찾을 수 없습니다.'; return; }
  var oldWk=l.w||weekKeyOf(mondayOf(new Date((l.d||d)+'T00:00:00')));
  var newWk=weekKeyOf(mondayOf(new Date(d+'T00:00:00')));
  var base={d:d,t:t,by:l.by||'',byName:l.byName||'',at:l.at||new Date().toISOString(),
    ed_at:new Date().toISOString(),ed_by:(S.me&&S.me.name)||''};
  if(l.k) base.k=l.k;
  var up={};
  up[NS+'/itemlogs/'+itemId+'/'+lid]=Object.assign({w:newWk},base);
  if(oldWk&&oldWk!==newWk) up[NS+'/logs/'+weekYear(oldWk)+'/'+oldWk+'/'+itemId+'/'+lid]=null;
  up[NS+'/logs/'+weekYear(newWk)+'/'+newWk+'/'+itemId+'/'+lid]=base;
  if(msg)msg.textContent='저장 중…';
  fbDb.ref().update(up).then(function(){
    if(itemLogsCache[itemId]) itemLogsCache[itemId][lid]=Object.assign({w:newWk},base);
    if(oldWk&&wkCache[oldWk]&&wkCache[oldWk][itemId]) delete wkCache[oldWk][itemId][lid];
    if(wkCache[newWk]){ if(!wkCache[newWk][itemId]) wkCache[newWk][itemId]={};
      wkCache[newWk][itemId][lid]=base; }
    return refreshLast(itemId);
  }).then(function(){
    closeM(); toast('✎ 기록 수정됨'); renderDrawer(); route();
  }).catch(function(e){ if(msg)msg.textContent='실패: '+e.message; });
}
// 마지막 기록 한 줄 다시 계산 — 인수인계 기록(k)은 제외
function refreshLast(itemId){
  var rest=Object.keys(itemLogsCache[itemId]||{}).map(function(k){ return itemLogsCache[itemId][k]; })
    .filter(function(x){ return x&&!x.k; })
    .sort(function(a,b){ return (b.d||'').localeCompare(a.d||''); });
  var nl=rest[0]?{d:rest[0].d,t:rest[0].t}:null;
  if(items[itemId]) items[itemId].last=nl;
  return fbDb.ref(NS+'/items/'+itemId+'/last').set(nl);
}
function delLog(itemId,lid){
  confirmM('이 기록을 삭제할까요?',{ok:'삭제',danger:true}).then(function(ok){ if(!ok)return;
    // 캐시가 없으면 주차를 몰라 옛 기록이 남고, last 재계산도 틀린다 — 먼저 읽는다
    loadItemLogs(itemId).then(function(){ _delLog(itemId,lid); });
  });
}
function _delLog(itemId,lid){
  var l=(itemLogsCache[itemId]||{})[lid]; var wk=l&&l.w;
  if(l&&!canLog(l)){ toast('본인이 쓴 기록만 지울 수 있습니다','warn'); return; }
  var up={};
  up[NS+'/itemlogs/'+itemId+'/'+lid]=null;
  if(wk) up[NS+'/logs/'+weekYear(wk)+'/'+wk+'/'+itemId+'/'+lid]=null;
  fbDb.ref().update(up).then(function(){
    if(itemLogsCache[itemId]) delete itemLogsCache[itemId][lid];
    if(wk&&wkCache[wk]&&wkCache[wk][itemId]) delete wkCache[wk][itemId][lid];
    return refreshLast(itemId);
  }).then(function(){
    toast('기록 삭제됨'); renderDrawer(); route();
  }).catch(function(e){ toast('삭제 실패: '+e.message,'err'); });
}
// 저장 성공 여부를 반환한다. 호출부는 반드시 if(!ok)return; 으로 가드할 것 —
// 예전엔 실패를 삼키고 resolve 해서 "저장 실패" 토스트와 "✅ 완료"가 같이 뜨는 문제가 있었다.
// up_at = 이쪽에서 마지막으로 손댄 시각. 푸른이알피와 진행 필드를 맞출 때
// "양쪽이 다르게 바뀌었으면 누가 더 최근인가"를 판정하는 근거가 된다.
function patchItem(id,obj){
  var o=Object.assign({},obj,{up_at:new Date().toISOString()});
  return fbDb.ref(NS+'/items/'+id).update(o)
    .then(function(){ Object.assign(items[id]||{},o); return true; })
    .catch(function(e){ toast('저장 실패: '+e.message,'err'); return false; });
}

/* ── 내 업무 화면 ── */
function focusCounts(){
  var v=viewer(), mine=viewOpen(), wk=weekKeyOf(S.week), today=todayStr();
  var due=mine.filter(function(it){var n=dday(itemDue(it));return n!==null&&n<=7;});
  var nolog=mine.filter(function(it){return countsLog(it)&&wkLogsOf(it._id,wk).length===0;});
  var next=mine.filter(function(it){return it.next&&it.next.date&&it.next.date<=today;});
  var done=allItems().filter(function(it){return it.state==='done'&&isOf(it,v)&&it.done_date&&inWeek(it.done_date,S.week);});
  return {due:due,nolog:nolog,next:next,done:done};
}
/* ══════ 보기 바꾸기 — 표 · 보드 · 타임라인 ══════════════════════
   같은 목록을 세 가지 모양으로 본다. ★ 거르는 일은 «한 번만» 한다 —
   renderMy 가 만든 list 를 그대로 받아 그리므로, 세 보기가 늘 같은 것을 보여준다.
   (보기마다 따로 거르면 표에서 보이던 건이 보드에선 안 보이는 일이 생긴다) */
var MYMODE_KEY='work_my_mode';
function myMode(){
  var v=''; try{ v=localStorage.getItem(MYMODE_KEY)||''; }catch(e){}
  return (v==='board'||v==='timeline')?v:'table';
}

/* ── 보드(칸반) ────────────────────────────────────────────────
   세로 칸 = 상태(STATUSES). 상태와 색은 이미 정해져 있는 것을 그대로 쓴다.
   ⚠ 목록에 없는 상태(옛 자료·푸른이알피에서 온 값)를 가진 건이 사라지면 안 되므로
     맨 뒤에 「그 밖」 칸을 두고 거기에 담는다. */
function bdCols(list){
  var cols=STATUSES.map(function(s){ return {name:s[0],bg:s[1],fg:s[2],items:[]}; });
  var known={}; cols.forEach(function(c){ known[c.name]=c; });
  var etc=null;
  list.forEach(function(it){
    var st=it.status||'진행중';
    if(known[st]){ known[st].items.push(it); return; }
    if(!etc){ etc={name:'그 밖',bg:'#f8fafc',fg:'#64748b',items:[]}; cols.push(etc); }
    etc.items.push(it);
  });
  return cols;
}
function bdCardHTML(it){
  var who=roleOf(it,viewer());
  var st=stepsOf(it.id)||[], dn=st.filter(function(x){return x.done;}).length;
  var dd=itemDue(it);
  return '<div class="bdcard" draggable="true" data-id="'+esc(it.id)+'"'
    +' ondragstart="bdDragStart(event,\''+escJ(it.id)+'\')" ondragend="bdDragEnd()"'
    +' onclick="openDrawer(\''+escJ(it.id)+'\')" title="'+esc((it.company||'')+' '+(it.title||''))+'">'
    +catBadge(it.cat)                      /* 표에서 쓰는 배지 그대로 — 색이 갈라지지 않게 */
    +'<b class="co">'+esc(it.company||it.client||'—')+'</b>'
    +'<span class="tt">'+esc(briefTrim(it.title)||briefTrim(it.brief)||'—')+'</span>'
    +'<span class="ft">'
      +(dd?ddayHTML(dd):'')
      +(st.length?'<span title="진행 단계">☑ '+dn+'/'+st.length+'</span>':'')
      +(who==='sub'?'<span title="부담당">부</span>':'')
      +(it.ref?'<span title="푸른이알피와 연결됨">🔗</span>':'')
    +'</span></div>';
}
function myBoardHTML(list){
  var cols=bdCols(list);
  return '<div class="bdwrap">'+cols.map(function(c){
    return '<div class="bdcol" id="bdc-'+esc(c.name)+'"'
