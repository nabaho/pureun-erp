<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무관리</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<style>
  :root{--acc:#2563eb;--acc2:#1b4bc0;--acc-soft:#e9f0fe;--ink:#182234;--sub:#59637a;--faint:#8b94a6;
    --line:#e4e9f1;--panel:#fff;--bg:#f4f6fa;--ok:#1f7a4d;--ok-bg:#e7f6ee;--warn:#b45309;--warn-bg:#fdf1e1;
    --danger:#c0392b;--danger-bg:#fdeceb;--radius:11px}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;color:var(--ink);background:#fbfcfe;font-size:14px;-webkit-font-smoothing:antialiased}
  #side{position:fixed;top:0;left:0;width:200px;height:100vh;background:#fff;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;z-index:20}
  .logo{display:flex;align-items:center;gap:9px;padding:2px 6px 12px}
  .logo .ic{font-size:22px}.logo b{font-size:14px}.logo .s{font-size:11px;color:var(--sub)}
  .sitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--sub);font-size:13px}
  .sitem:hover{background:var(--bg)}.sitem.on{background:var(--acc-soft);color:var(--acc2);font-weight:700}
  .sitem .cnt{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  .sitem.nw{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .side-sec{font-size:10.5px;letter-spacing:.1em;color:var(--faint);padding:12px 8px 4px;text-transform:uppercase}
  #main{margin-left:200px;min-height:100vh}
  #topbar{position:sticky;top:0;z-index:15;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:9px 22px;display:flex;align-items:center;gap:12px;font-size:13px}
  #crumb{font-weight:700;color:var(--sub)}
  #topright{margin-left:auto;display:flex;align-items:center;gap:11px}
  #conn{font-size:12px;color:var(--sub)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#cbd5e1;margin-right:5px}.dot.on{background:var(--ok)}
  #topuser{font-weight:700;font-size:12.5px}#topuser .role{color:var(--sub);font-weight:500;margin-left:4px}
  #topclock{font-variant-numeric:tabular-nums;color:var(--sub);font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
  #logoutbtn{font-size:12.5px;padding:5px 12px;border:1px solid #e6a19a;color:var(--danger);background:#fff;border-radius:8px;cursor:pointer;font-weight:700}
  #app{padding:18px 22px 90px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
  .row{display:flex;align-items:center;gap:10px}
  h1{font-size:20px;margin:0}h2{font-size:16px;margin:0}
  .muted{color:var(--sub)}
  input,select,textarea{font-family:inherit}
  button{font-family:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--ink)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}button.primary:hover{background:var(--acc2)}
  .gate{max-width:520px;margin:90px auto;text-align:center;color:var(--sub)}.gate a{color:var(--acc);font-weight:700}
  #toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:#1f2937;color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:400;max-width:80vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:#b91c1c}#toast.warn{background:#b45309}
  .loading{display:flex;align-items:center;gap:10px;padding:22px 16px;color:var(--sub);font-size:13px}
  .loading .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 주 내비 + 포커스 */
  .wkpill{font-size:12.5px;font-weight:700;color:var(--acc2);background:var(--acc-soft);border:1px solid #c7d7fe;border-radius:14px;padding:3px 13px;cursor:pointer;font-variant-numeric:tabular-nums;user-select:none}
  .wknav{color:var(--faint);cursor:pointer;padding:2px 7px;border-radius:6px;font-size:14px;user-select:none}
  .wknav:hover{background:var(--bg)}
  /* 캘린더 (월·주·일 + 레이어 체크) — 격자선은 옅게, 강조는 오늘·이벤트에만 */
  .calwrap{background:#fff;border:1px solid #e8eef7;border-radius:14px;margin:0 0 12px;overflow:hidden;
    box-shadow:0 1px 2px rgba(24,34,52,.03),0 10px 26px -18px rgba(24,34,52,.16)}
  .calhd{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 12px 8px}
  .calhd .ttl{font-size:14.5px;font-weight:800;letter-spacing:-.015em;min-width:112px;font-variant-numeric:tabular-nums}
  .cnav{width:25px;height:25px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
    color:#9aa6b8;cursor:pointer;font-size:16px;line-height:1;user-select:none;transition:background .12s,color .12s}
  .cnav:hover{background:#f1f5fb;color:var(--ink)}
  .cbtn{font-size:11.5px;font-weight:700;color:var(--sub);background:#f4f7fc;border:none;border-radius:8px;
    padding:4px 11px;cursor:pointer;user-select:none;transition:background .12s,color .12s}
  .cbtn:hover{background:#e8eef8;color:var(--ink)}
  .cbtn.gh{background:transparent;color:#a6b0c0}.cbtn.gh:hover{background:#f4f7fc;color:var(--sub)}
  .vseg{display:inline-flex;background:#f1f5fb;border-radius:9px;padding:2px;gap:2px}
  .vseg span{padding:3px 13px;font-size:11.5px;font-weight:700;color:#7a8698;cursor:pointer;border-radius:7px;
    user-select:none;transition:background .12s,color .12s}
  .vseg span:hover{color:var(--ink)}
  .vseg span.on{background:#fff;color:var(--acc2);box-shadow:0 1px 2px rgba(24,34,52,.13)}
  .lay{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:0 12px 10px}
  .lchk{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#8a94a6;
    border:1px solid #edf1f7;background:#fff;border-radius:999px;padding:3px 10px;cursor:pointer;user-select:none;
    transition:background .12s,border-color .12s,color .12s,opacity .12s;opacity:.62}
  .lchk:hover{opacity:1;border-color:#dde5f0}
  .lchk .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px #fff inset}
  .lchk.on{opacity:1;color:var(--ink);background:#f8fafd;border-color:#dde5f0}
  .lchk:not(.on) .dot{background:#c9d2df !important}
  .laynote{font-size:10.5px;color:#a6b0c0;margin-left:2px}
  .cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .cgrid.hd{border-top:1px solid #eef2f8;background:#fcfdff}
  .cdow{font-size:10px;font-weight:800;color:#a2adbe;text-align:center;padding:7px 0 6px;letter-spacing:.07em}
  .cdow.we{color:#d29a95}
  .cday{border-right:1px solid #f2f5fa;border-top:1px solid #f2f5fa;min-height:72px;padding:4px 5px 6px;
    overflow:hidden;transition:background .1s}
  .cday:nth-child(7n){border-right:none}
  .cday:hover{background:#fcfdff}
  .cday.out{background:#fbfcfe}.cday.out .dn{color:#ccd4e0}
  .cday.today{background:#f7faff}
  .cday.drop{background:var(--acc-soft);box-shadow:inset 0 0 0 2px var(--acc)}
  /* ⚠ inline-flex + 고정 크기 = 동그라미. block이면 배경이 셀 폭을 다 채워 막대처럼 보인다 */
  .cday .dn{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
    font-size:11px;font-weight:700;color:#6d7889;border-radius:50%;font-variant-numeric:tabular-nums}
  .cday .dn.we{color:#c98d88}
  .cday.today .dn,.cday.today .dn.we{background:var(--acc);color:#fff;font-weight:800}
  .cev{display:flex;align-items:center;gap:5px;font-size:10.5px;line-height:1.45;font-weight:600;
    padding:2px 6px;margin-top:2px;border-radius:6px;cursor:pointer;color:#3b465a;
    transition:filter .1s,box-shadow .1s}
  .cev:hover{filter:brightness(.975);box-shadow:0 1px 3px rgba(24,34,52,.09)}
  .cev.dg{cursor:grab}.cev.dg:active{cursor:grabbing}
  .cev .cd{width:5px;height:5px;border-radius:50%;flex-shrink:0}
  .cev .cx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmore{font-size:10px;font-weight:700;color:#98a3b4;padding:2px 6px;margin-top:1px;cursor:pointer;border-radius:5px}
  .cmore:hover{background:#f1f5fb;color:var(--acc2)}
  /* 주·일 보기 = 날짜별 목록 (일정은 시간순) */
  .cwcol{border-right:1px solid #f2f5fa;border-top:1px solid #f2f5fa;min-height:158px;padding:5px 6px 8px}
  .cwcol:nth-child(7n){border-right:none}
  .cwcol.today{background:#f7faff}
  .cwhd{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:#7a8698;
    padding:1px 0 6px;margin-bottom:4px;border-bottom:1px solid #f2f5fa}
  .cwhd .dn{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
    border-radius:50%;font-variant-numeric:tabular-nums}
  .cwhd.today .dn{background:var(--acc);color:#fff}
  .cwhd.we{color:#c98d88}
  .cdash{font-size:10.5px;color:#c4ccd8;padding:2px 2px}
  .cdayrow{display:flex;gap:12px;padding:8px 12px;border-top:1px solid #f2f5fa}
  .cdayrow:hover{background:#fcfdff}
  .cdayrow .dl{width:96px;flex-shrink:0;font-size:11px;font-weight:800;color:#9aa6b8;padding-top:2px;
    font-variant-numeric:tabular-nums}
  .cdayrow .dv{flex:1;min-width:0}
  .cdayrow .dv .cev{font-size:12px;padding:4px 9px;border-radius:7px}
  .cempty{font-size:12px;color:#a6b0c0;padding:26px 10px;text-align:center;border-top:1px solid #eef2f8}
  .histbanner{display:flex;align-items:center;gap:8px;background:#fffdf5;border:1px solid #fde68a;border-radius:9px;padding:7px 12px;font-size:12px;color:#854d0e;margin:0 0 10px}
  .histbanner .back{margin-left:auto;color:var(--acc2);font-weight:700;background:var(--acc-soft);border:1px solid #c7d7fe;border-radius:6px;padding:2px 10px;font-size:11.5px;cursor:pointer;white-space:nowrap}

  /* 표 */
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
  th{font-size:11px;color:var(--faint);letter-spacing:.03em;white-space:nowrap}
  .badge{display:inline-block;font-size:10.5px;font-weight:800;border-radius:4px;padding:1px 8px;white-space:nowrap}
  .status{display:inline-block;font-size:10.5px;font-weight:800;border-radius:10px;padding:1px 9px;white-space:nowrap;cursor:pointer}
  .due{font-size:11px;font-weight:800;color:#dc2626;font-variant-numeric:tabular-nums;white-space:nowrap}
  .due.ok{color:#16a34a}.due.soon{color:#ea580c}
  td.itc{cursor:pointer;min-width:150px}
  td.itc .co{font-weight:700}
  td.itc .sub{font-size:11px;color:var(--faint);font-weight:400}
  .last{font-size:12px;color:var(--sub)}
  .last .ago{font-size:10.5px;color:var(--faint)}
  td.wkcell{background:#f8fbff;min-width:220px}
  .wklog{font-size:12px;color:#334155;padding:1px 0}
  .wklog .d{color:var(--faint);font-size:10.5px;margin-right:4px;font-variant-numeric:tabular-nums}
  .wkin{width:100%;border:1px solid #c9d6f2;border-radius:6px;padding:5px 8px;font-size:12.5px;background:#fff;margin-top:2px}
  .wkin:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px rgba(37,99,235,.12)}
  /* 컴팩트 요약 스트립 + 한 줄 필터바 */
  .statbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 8px;font-size:12px;color:var(--sub)}
  .statbar b{font-size:14.5px;color:var(--ink);font-variant-numeric:tabular-nums}
  .statbar .sep{color:#d7dde8}
  .sb{border:1px solid var(--line);background:#fff;border-radius:13px;padding:2px 9px;cursor:pointer;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
  .sb:hover{border-color:#b9c4d4}
  .sb.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
  .sb.am{border-color:#fde68a;background:#fffdf5;color:var(--warn)}
  .sb.am.on{background:var(--warn);border-color:var(--warn);color:#fff}
  .sb.dg{border-color:#fecaca;background:#fff7f7;color:var(--danger)}
  .sb.dg.on{background:var(--danger);border-color:var(--danger);color:#fff}
  .fbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .fbar select{padding:4px 7px;border:1px solid var(--line);border-radius:7px;font-size:12px;color:var(--sub);background:#fff}
  .fbar .chipbtn{padding:3px 9px;font-size:11.5px}
  #qbox{padding:4px 9px;border:1px solid var(--line);border-radius:7px;font-size:12px;min-width:190px}
  .endbtn{font-size:11px;padding:3px 9px;border:1px solid #cbd5e1;background:#fff;color:var(--sub);border-radius:6px;cursor:pointer;white-space:nowrap}
  .endbtn:hover{background:var(--ok-bg);border-color:#9ccdb4;color:var(--ok)}
  .endbtn .lk{margin-left:2px;font-size:9.5px}
  .pesync{font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;white-space:nowrap}
  .pesync.done{background:var(--ok-bg);color:var(--ok)}
  .pesync.wait{background:var(--warn-bg);color:var(--warn)}
  .pesync.off{background:var(--bg);color:var(--faint)}
  td.rowno{color:var(--faint);width:34px;text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px;padding-right:8px}
  th.rowno{width:34px;text-align:right;padding-right:8px}
  .grp-h td{background:var(--bg);font-weight:800;font-size:12.5px;padding:6px 10px}
  .grp-h .pct{float:right;font-weight:600;color:var(--sub);font-size:11px;font-variant-numeric:tabular-nums}

  /* 빠른 기록 바 */
  #qwrap{position:fixed;left:216px;right:18px;bottom:14px;z-index:60;max-width:1100px}
  #qsug{background:#fff;border:1px solid #c7d7fe;border-bottom:0;border-radius:10px 10px 0 0;box-shadow:0 -8px 24px rgba(30,64,175,.10);overflow:hidden;display:none}
  #qsug .qi{padding:7px 13px;border-bottom:1px solid #eef1f5;display:flex;gap:8px;align-items:center;font-size:12.5px;cursor:pointer}
  #qsug .qi.pick{background:var(--acc-soft)}
  #qsug .qi small{color:var(--faint);margin-left:auto}
  #qbar{display:flex;align-items:center;gap:9px;background:#fff;border:1.6px solid var(--acc);border-radius:10px;padding:7px 13px;box-shadow:0 6px 18px rgba(15,23,42,.14)}
  #qbar .zap{color:var(--acc);font-weight:800}
  #qbar input{flex:1;border:none;outline:none;font-size:13px;background:transparent}
  #qbar .k{font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 6px;white-space:nowrap}

  /* 캘린더 팝오버 */
  #calpop{position:absolute;z-index:80;width:300px;background:#fff;border:1px solid #c7d7fe;border-radius:12px;box-shadow:0 14px 34px rgba(30,64,175,.16);padding:12px 14px;font-size:11.5px}
  #calpop .ct{display:flex;align-items:center;font-size:12.5px;font-weight:800;margin-bottom:6px}
  #calpop .ct .nv{color:var(--faint);padding:0 9px;cursor:pointer;font-weight:400}
  #calpop .ct .today{margin-left:auto;font-size:10.5px;color:var(--acc);font-weight:700;background:var(--acc-soft);border-radius:6px;padding:1px 8px;cursor:pointer}
  #calpop table{border-collapse:collapse;width:100%}
  #calpop th{color:var(--faint);font-weight:700;font-size:10px;padding:3px 0 5px;text-align:center;border:none}
  #calpop th.we{color:#c3cbd8}
  #calpop td{text-align:center;padding:0;border:none}
  #calpop .d{position:relative;display:block;padding:5px 0 11px;color:#334155;font-variant-numeric:tabular-nums;font-size:11px}
  #calpop .d.out{color:#d4dae3}#calpop .d.we{color:#94a3b8}
  #calpop .d.today2{font-weight:800;color:var(--acc2)}
  #calpop .d .dt2{position:absolute;left:50%;transform:translateX(-50%);bottom:4px;display:flex;gap:2px}
  #calpop .d .dt2 i{width:4px;height:4px;border-radius:50%;background:#a5c4fa;display:block}
  #calpop .d .dt2 i.hot{background:var(--acc)}
  #calpop .d.duemark::after{content:"";position:absolute;top:3px;right:5px;width:5px;height:5px;border-radius:50%;background:#dc2626}
  #calpop tr.wrow{cursor:pointer}
  #calpop tr.wrow:hover td .d{background:#f5f9ff}
  #calpop tr.selwk td .d{background:var(--acc-soft)}
  #calpop .lg{display:flex;gap:12px;font-size:10px;color:var(--faint);margin-top:8px;align-items:center}
  #calpop .lg i{width:5px;height:5px;border-radius:50%;background:var(--acc);display:inline-block;margin-right:3px}
  #calpop .lg i.r{background:#dc2626}

  /* 드로어 */
  #drawerbg{position:fixed;inset:0;background:rgba(20,30,50,.25);z-index:90}
  #drawer{position:fixed;top:0;right:0;width:430px;max-width:96vw;height:100vh;background:#fff;border-left:1px solid #dbe2ec;box-shadow:-14px 0 30px rgba(15,23,42,.12);z-index:95;display:flex;flex-direction:column}
  #drawer .dh{padding:14px 18px 11px;border-bottom:1px solid var(--line)}
  #drawer .dh .row1{display:flex;align-items:center;gap:8px}
  #drawer .dh .ttl{font-size:14px;font-weight:800;flex:1}
  #drawer .dh .x{color:var(--faint);cursor:pointer;font-size:17px;padding:0 3px}
  #drawer .dh .meta2{font-size:11.5px;color:var(--faint);margin-top:4px}
  #drawer .dh .chips{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
  .nextbox{margin:10px 18px 0;background:#fffdf5;border:1px solid #fde68a;border-radius:8px;padding:8px 11px;font-size:12px;color:#854d0e}
  .nextbox input[type=text]{border:none;background:transparent;font-size:12px;color:#854d0e;width:60%;outline:none}
  .nextbox input[type=date]{border:1px solid #fde68a;background:#fff;border-radius:5px;font-size:11px;padding:1px 4px;color:#854d0e}
  .dinput{margin:10px 18px;border:1.6px solid var(--acc);border-radius:8px;padding:8px 11px;font-size:12.5px;width:calc(100% - 36px)}
  .dinput:focus{outline:none;box-shadow:0 0 0 2px rgba(37,99,235,.12)}
  #feed{flex:1;overflow-y:auto;padding:2px 18px 16px}
  .wksep{font-size:10.5px;font-weight:800;color:var(--faint);letter-spacing:.06em;margin:13px 0 5px;display:flex;align-items:center;gap:8px}
  .wksep::after{content:"";flex:1;height:1px;background:#eef1f5}
  .fe{display:flex;gap:10px;padding:5px 0;font-size:12.5px;align-items:baseline}
  .fe .dt{width:58px;flex-shrink:0;color:var(--faint);font-size:10.5px;font-variant-numeric:tabular-nums}
  .fe .tx{flex:1;color:#334155;word-break:break-word}
  .fe .by{font-size:10px;color:var(--faint);margin-left:5px}
  .wklog .by{font-size:9.5px;font-weight:700;color:#7c5bb0;background:#f3f0fd;border-radius:3px;padding:0 4px}
  /* 드로어 블록: 사업장 담당자 · 담당(주/부) */

function _normStaff(v){
  if(!v) return []; if(!Array.isArray(v)) v=Object.keys(v).map(function(k){return v[k];});
  var seen={};
  return v.filter(function(u){return u&&u.sid;})
    .filter(function(u){return !u.status||u.status==='active'||(u.status==='leave'&&u.leaveLoginAllowed===true);})
    .filter(function(u){ if(seen[u.sid])return false; seen[u.sid]=1; return true; })
    .map(function(u){return {sid:u.sid,name:u.name||u.sid,title:u.title||u.role||''};})
    .sort(function(a,b){return String(a.sid||'').localeCompare(String(b.sid||''),'en',{numeric:true});});
}
function loadStaff(){
  if(_staffCache) return Promise.resolve(_staffCache);
  try{ var raw=localStorage.getItem('pureun_v6_user_accounts');
    if(raw){ var a=_normStaff(JSON.parse(raw)); if(a.length){ _staffCache=a; return Promise.resolve(a); } } }catch(e){}
  return fbDb.ref('data/user_accounts/v').once('value').then(function(s){ _staffCache=_normStaff(s.val()); return _staffCache; })
    .catch(function(){ _staffCache=[]; return _staffCache; });
}
function resolveMe(){

function confirmM(msg,opts){
  opts=opts||{};
  return new Promise(function(resolve){
    var m=document.createElement('div'); m.id='confirmbg';
    m.style.cssText='position:fixed;inset:0;background:rgba(20,30,50,.4);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
    var danger=opts.danger?'#b91c1c':'var(--acc)';
    m.innerHTML='<div style="background:#fff;border-radius:14px;padding:22px 24px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.28)">'
      +'<div style="font-size:14px;line-height:1.6;white-space:pre-line;margin-bottom:18px">'+esc(msg)+'</div>'
      +'<div class="row" style="justify-content:flex-end;gap:8px"><button id="cf-no">'+esc(opts.cancel||'취소')+'</button>'
      +'<button id="cf-yes" class="primary" style="background:'+danger+'">'+esc(opts.ok||'확인')+'</button></div></div>';
    document.body.appendChild(m);
    function done(v){ m.remove(); document.removeEventListener('keydown',key,true); resolve(v); }
    function key(e){ if(e.key==='Escape'){e.stopPropagation();done(false);} else if(e.key==='Enter'){e.stopPropagation();done(true);} }
    m.querySelector('#cf-yes').onclick=function(){done(true);};
    m.querySelector('#cf-no').onclick=function(){done(false);};
    m.onclick=function(e){ if(e.target===m) done(false); };
    document.addEventListener('keydown',key,true);
    var y=m.querySelector('#cf-yes'); if(y)y.focus();
  });
}

function _inTyping(e){ var t=e.target||document.activeElement;
  return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable); }
document.addEventListener('keydown',function(e){

    if(S.drawerId){ closeDrawer(); return; }

    if(S.view!=='my'){ goBack(); }
    return;
  }
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){ e.preventDefault(); searchModal(); return; }
  if(e.key==='/'&&!_inTyping(e)){ e.preventDefault(); var q=$('qb'); if(q)q.focus(); return; }
  if((e.key==='n'||e.key==='N')&&!_inTyping(e)&&!$('modalbg')&&!$('confirmbg')){ e.preventDefault(); itemModal(); return; }
  if(e.key==='Backspace'&&!_inTyping(e)){ e.preventDefault();
    if($('modalbg')||$('confirmbg'))return; if(S.drawerId){closeDrawer();return;} if(S.view!=='my')goBack(); return; }
});

/* ── 3단계: 본문 검색 ─────────────────────────────────────────────────
   기존 검색(matchQ)은 업무의 필드만 훑는다. 노트 본문·회고·기록·지식 카드는
   대상이 아니었다 — 암묵지를 쌓아도 찾을 수 없으면 죽은 자료가 된다.
   기록 전체는 work_erp/itemlogs를 한 번만 읽어 캐시한다(주차 캐시는 보고 있는
   주만 담고 있어 과거 기록을 못 찾는다). */
var _allLogs=null,_allLogsT=null;
function loadAllLogs(){
  if(_allLogs) return Promise.resolve(_allLogs);
  if(_allLogsT) return _allLogsT;
  _allLogsT=fbDb.ref(NS+'/itemlogs').once('value')
    .then(function(s){ _allLogs=s.val()||{}; _allLogsT=null; return _allLogs; })
    .catch(function(){ _allLogs={}; _allLogsT=null; return _allLogs; });
  return _allLogsT;
}
function _hit(s,q){ return String(s||'').toLowerCase().indexOf(q)>=0; }
function searchAll(q){
  q=String(q||'').toLowerCase().trim();
  var R={items:[],cards:[],logs:[]};
  if(q.length<2) return R;
  allItems().forEach(function(it){
    var n=it.ho_note||{}, r=n.retro||{};
    var where=[];
    if(matchQ(it,q)) where.push('업무 정보');
    HO_FIELDS.forEach(function(f){ if(_hit(n[f[0]],q)) where.push(f[1].replace(/^[①-⑤]\s*/,'')); });
    (n.qa||[]).forEach(function(p){ if(p&&(_hit(p.q,q)||_hit(p.a,q))) where.push('AI 인터뷰'); });
    RETRO_FIELDS.forEach(function(f){ if(_hit(r[f[0]],q)) where.push('회고'); });
    if(where.length) R.items.push({it:it,where:where.filter(function(v,i,a){return a.indexOf(v)===i;})});
  });
  kbAll().forEach(function(c){
    if([c.t,c.x,c.kl,c.byName].some(function(s){return _hit(s,q);})) R.cards.push(c);
  });
  Object.keys(_allLogs||{}).forEach(function(iid){
    var o=_allLogs[iid]||{};
    Object.keys(o).forEach(function(lid){
      var l=o[lid];
      if(l&&_hit(l.t,q)) R.logs.push({iid:iid,l:l});
    });

var AI_SYS_QA='당신은 한국 노무법인의 업무 지식 조수입니다. 아래에 주어진 자료(지식 카드·인수인계 노트·진행 기록)만 근거로 질문에 답하세요.\n'
  +'규칙: ① 자료에 없으면 반드시 "자료에 없습니다"라고 답하고 추측하지 마세요. ② 답의 근거가 된 자료를 그대로 인용해 밝히세요. '
  +'③ 여러 자료가 서로 다르면 둘 다 제시하고 날짜가 최신인 쪽을 표시하세요. ④ 간결한 한국어로 답하세요.\n'
  +'다른 설명 없이 JSON만 출력: {"answer":"답변","sources":["근거로 쓴 자료 제목이나 인용 한 줄","..."],"confident":true}';
// 한국어는 조사가 붙어 "김감독관은"이 "김감독관"과 맞지 않는다 → 조사를 벗긴 형태도 함께 본다
var KO_PART=/(에서|으로|에게|한테|부터|까지|보다|께서|은|는|이|가|을|를|의|에|로|과|와|도|만)$/;
function _qToks(q){
  var out=[];
  String(q||'').toLowerCase().split(/[\s,·?!.]+/).forEach(function(t){
    if(t.length<2) return;
    out.push(t);
    var b=t.replace(KO_PART,'');
    if(b.length>=2&&b!==t) out.push(b);
  });
  return out;
}
function kbAskCtx(q){
  var toks=_qToks(q);
  function score(s){ s=String(s||'').toLowerCase(); return toks.filter(function(t){return s.indexOf(t)>=0;}).length; }
  var cards=kbAll().map(function(c){
      return {c:c,s:score(c.t)*2+score(c.x)+score(c.kl)*2};
    }).sort(function(a,b){return b.s-a.s;});
  var pick=cards.filter(function(x){return x.s>0;});
  if(!pick.length) pick=cards.slice(0,25);
  pick=pick.slice(0,30);
  var L=['[지식 카드 '+pick.length+'장]'];
  pick.forEach(function(x){
    var c=x.c;
    L.push('- ('+(KB_KLBL[c._kind]||c._kind)+' · '+(c.kl||c._key)+') '+c.t
      +(c.x?' — '+c.x:'')+' [작성 '+String(c.at||'').slice(0,10)+' '+(c.byName||'')+']'
      +(kbBad(c)?' ※ 정정 요청됨':'')+(kbStale(c)?' ※ 2년 경과':''));
  });
  var its=allItems().map(function(it){
      var n=it.ho_note||{}, r=n.retro||{};
      var txt=[it.company,it.title,n.ppl,n.warn,n.sit,r.pass,r.diff,r.unexp].join(' ');
      return {it:it,n:n,r:r,s:score(txt)};
    }).filter(function(x){return x.s>0;}).sort(function(a,b){return b.s-a.s;}).slice(0,8);
  if(its.length){
    L.push('','[관련 업무의 노트·회고 '+its.length+'건]');
    its.forEach(function(x){
      L.push('· '+(x.it.company||'')+' '+(x.it.title||'')+(x.it.state==='done'?' (종료)':''));
      HO_FIELDS.forEach(function(f){ if(String(x.n[f[0]]||'').trim()) L.push('   '+f[1]+': '+x.n[f[0]]); });
      RETRO_FIELDS.forEach(function(f){ if(String(x.r[f[0]]||'').trim()) L.push('   회고·'+f[1]+': '+x.r[f[0]]); });
    });
  }
  return L.join('\n');
}

  if(!q){ toast('무엇을 물어볼지 적어 주세요','warn'); return; }

function addLog(itemId,text,dateStr,kind){
  text=(text||'').trim(); if(!text){ toast('내용을 입력하세요','warn'); return Promise.resolve(false); }
  dateStr=dateStr||todayStr();
  var wk=weekKeyOf(mondayOf(new Date(dateStr+'T00:00:00')));
  var y=weekYear(wk), lid=rid('L');
  var log={d:dateStr,t:text,by:(S.me&&S.me.sid)||'',byName:(S.me&&S.me.name)||'',at:new Date().toISOString()};
  if(kind) log.k=kind;
  var up={};
  up[NS+'/logs/'+y+'/'+wk+'/'+itemId+'/'+lid]=log;
  up[NS+'/itemlogs/'+itemId+'/'+lid]=Object.assign({w:wk},log);
  var it=items[itemId];
  if(it&&(!it.last||String(it.last.d||'')<=dateStr)) up[NS+'/items/'+itemId+'/last']={d:dateStr,t:text};
  return fbDb.ref().update(up).then(function(){
    if(!wkCache[wk])wkCache[wk]={}; if(!wkCache[wk][itemId])wkCache[wk][itemId]={};
    wkCache[wk][itemId][lid]=log;
    if(itemLogsCache[itemId]) itemLogsCache[itemId][lid]=Object.assign({w:wk},log);
    if(it&&(!it.last||String(it.last.d||'')<=dateStr)) it.last={d:dateStr,t:text};
    toast('기록 저장됨'); return true;
  }).catch(function(e){ toast('저장 실패: '+e.message,'err'); return false; });

    up[NS+'/itemlogs/'+itemId+'/'+lid]=null;
    if(wk) up[NS+'/logs/'+weekYear(wk)+'/'+wk+'/'+itemId+'/'+lid]=null;

      if(itemLogsCache[itemId]) delete itemLogsCache[itemId][lid];

      // last 재계산

        .filter(function(x){return !x.k;})

  var dateStr=isCurWeek()?todayStr():ymd(addDays(S.week,4));   // 과거 주 보완은 그 주 금요일 날짜로
  inp.value='';

    // 다음 행 입력으로 이동 (엑셀 Enter↓)

      var nx=all2[Math.min(i+1,all2.length-1)]; if(nx)nx.focus(); },50);

// 회고를 먼저 저장한 뒤 종료하고, AI가 붙어 있으면 지식 수확을 제안한다
function doCompleteWithRetro(id,linked){
  var r={}, any=false;
  RETRO_FIELDS.forEach(function(f){
    var el=$('rt-'+f[0]); var v=el?el.value.trim():'';
    r[f[0]]=v; if(v) any=true;
  });
  var alsoPe=linked?!!(($('cl-pe')||{}).checked):false;
  var pre=Promise.resolve(true);
  if(any){
    // 기존 노트에 병합 — AI 인터뷰 답변(qa) 등이 지워지지 않도록
    var note=Object.assign({},(items[id]&&items[id].ho_note)||{});
    note.retro=Object.assign({},note.retro||{},r,
      {by:(S.me&&S.me.sid)||'',byName:(S.me&&S.me.name)||'',at:todayStr()});
    pre=patchItem(id,{ho_note:note});
  }
  pre.then(function(ok){
    if(!ok) return;
    return doComplete(id,linked?alsoPe:undefined).then(function(){
      if(aiProxyUrl()&&(any||Object.keys(itemLogsCache[id]||{}).length||noteDone(items[id]||{})))
        setTimeout(function(){ kbHarvest(id); },500);
    });
  });

function setState(id,done,alsoPe,msg){
  var it=items[id]||{}, now=new Date().toISOString();
  var patch={ state:done?'done':null, done_date:done?todayStr():null,
    status:done?'완료':'진행중', state_at:now };
  if(peLinked(it)&&alsoPe!==undefined) patch.pe_nosync=alsoPe?null:true;
  var up={}; Object.keys(patch).forEach(function(k){ up[NS+'/items/'+id+'/'+k]=patch[k]; });

var _qbPick=0,_qbMatches=[];
function qbParse(){
  var v=$('qb').value; var sp=v.indexOf(' ');
  var key=sp<0?v:v.slice(0,sp); var rest=sp<0?'':v.slice(sp+1);
  return {key:key.trim(),rest:rest.trim()};
}
function qbSug(){
  var p=qbParse(); var box=$('qsug');
  if(!p.key){ box.style.display='none'; _qbMatches=[]; return; }
  var pool=myOpen();
  _qbMatches=pool.filter(function(it){
    return (it.company||'').indexOf(p.key)>=0||(it.title||'').indexOf(p.key)>=0||(it.client||'').indexOf(p.key)>=0;
  }).slice(0,5);
  _qbPick=0;
  if(!_qbMatches.length){ box.style.display='none'; return; }
  box.innerHTML=_qbMatches.map(function(it,i){
    return '<div class="qi'+(i===_qbPick?' pick':'')+'" onmousedown="qbGo('+i+')">'+catBadge(it.cat)
      +' <b>'+esc(it.company||it.client||'')+'</b> <span class="muted">'+esc(it.title||'')+'</span>'
      +'<small>'+(i===_qbPick?'Enter로 기록':'')+'</small></div>'; }).join('');
  box.style.display='';
}
function qbKey(e){
  if(e.key==='ArrowDown'){ e.preventDefault(); if(_qbMatches.length){_qbPick=(_qbPick+1)%_qbMatches.length; qbRepaint();} return; }
  if(e.key==='ArrowUp'){ e.preventDefault(); if(_qbMatches.length){_qbPick=(_qbPick-1+_qbMatches.length)%_qbMatches.length; qbRepaint();} return; }
  if(e.key==='Escape'){ $('qb').blur(); $('qsug').style.display='none'; return; }
  if(e.key==='Enter'){ e.preventDefault(); qbGo(_qbPick); }
}
function qbRepaint(){ var els=$('qsug').children;
  for(var i=0;i<els.length;i++){ els[i].className='qi'+(i===_qbPick?' pick':''); els[i].querySelector('small').textContent=(i===_qbPick?'Enter로 기록':''); } }
function qbGo(i){
  var it=_qbMatches[i]; var p=qbParse();
  if(!it){ toast('일치하는 업무가 없습니다','warn'); return; }
  if(!p.rest){ $('qsug').style.display='none'; openDrawer(it._id); $('qb').value=''; return; }
  addLog(it._id,p.rest,todayStr()).then(function(ok){ if(!ok)return;
    $('qb').value=''; $('qsug').style.display='none'; route(); });
}

  var pill=$('wkpill'); var r=pill.getBoundingClientRect();

    mons.forEach(function(mo){ var w=wkCache[weekKeyOf(mo)]||{};
      Object.keys(w).forEach(function(iid){ if(!myIds[iid])return;
        Object.keys(w[iid]).forEach(function(lid){ var d2=w[iid][lid].d; if(d2)dots[d2]=(dots[d2]||0)+1; }); }); });
    var dues={}; myOpen().forEach(function(it){ var d3=itemDue(it); if(d3)dues[d3]=1; });

    var h='<div class="ct"><span class="nv" onclick="calShift(-1)">‹</span>'+y+'년 '+(m+1)+'월<span class="nv" onclick="calShift(1)">›</span>'
      +'<span class="today" onclick="setWeek(null)">오늘로</span></div>';
    h+='<table><tr>'+WD.map(function(w2,i){return '<th'+(i>=5?' class="we"':'')+'>'+w2+'</th>';}).join('')+'</tr>';

      for(var i=0;i<7;i++){ var day=addDays(mo,i); var ds=ymd(day);
        var cls='d'+(day.getMonth()!==m?' out':'')+(i>=5?' we':'')+(ds===today?' today2':'')+(dues[ds]?' duemark':'');

    pop.innerHTML=h;
  });

/* ── AI 2단계: 노트 초안 + 인터뷰 (푸른이알피 프록시 재사용) ── */
function aiProxyUrl(){
  try{
    // 이 기기 설정 우선, 없으면 포털 ⚙설정의 공용값(data/app_config)
    var raw=localStorage.getItem('pureun_v6_setting_ai_proxy_url')||localStorage.getItem('pureun_v6_ai_proxy_url')
            ||(window.PU_CFG&&window.PU_CFG.aiProxyUrl)||'';
    if(!raw) return '';
    if(raw.charAt(0)==='"'){ try{ return JSON.parse(raw); }catch(e){ return raw.replace(/^"|"$/g,''); } }
    return raw;
  }catch(e){ return ''; }
}
function aiConsent(){
  if(localStorage.getItem('work_ai_ok')==='1') return Promise.resolve(true);
  return confirmM('AI 기능을 쓰면 이 업무의 진행 기록·기업명·의뢰인 정보가 회사에 설정된 AI 서비스로 전송됩니다.\n\n의뢰인 개인정보가 포함될 수 있으니 대표님이 승인한 경우에만 사용하세요.\n\n계속할까요? (이 브라우저에서 한 번만 묻습니다)',{ok:'동의하고 사용'})
    .then(function(ok){ if(ok) localStorage.setItem('work_ai_ok','1'); return ok; });
}
function aiCall(system,userText){
  var url=aiProxyUrl();
  if(!url) return Promise.reject(new Error('AI 프록시 주소가 없습니다 — 푸른이알피 설정에서 먼저 등록하세요'));
  var i=0;
  function attempt(){
    return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:AI_MODELS[i],max_tokens:8000,system:system,
        messages:[{role:'user',content:userText}]})})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d&&d.error) throw new Error(d.error.message||'AI 오류');
        var t=d.reply||d.text||((d.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join(''));
        if(!t) throw new Error('AI 응답이 비어 있습니다');
        return t;
      })
      .catch(function(e){
        if(i<AI_MODELS.length-1){ i++; return attempt(); }   // 프록시가 모델을 제한하면 다음 모델로
        throw e;
      });
  }
  return attempt();
}
function aiJson(text){
  var s=String(text||''), a=s.indexOf('{'), b=s.lastIndexOf('}');
  if(a<0||b<a) throw new Error('AI 응답을 해석할 수 없습니다');
  return JSON.parse(s.slice(a,b+1));
}
function aiContext(id){
  var it=items[id]||{}, logs=itemLogsCache[id]||{};
  var arr=Object.keys(logs).map(function(k){return logs[k];})
    .sort(function(a,b){return (a.d||'').localeCompare(b.d||'');});
  var L=['[업무]','구분: '+(it.cat||''),'기업/대상: '+(it.company||it.client||''),
    '업무명: '+(it.title||''),'업무 요약: '+(briefTrim(it.brief)||'—'),
    '의뢰인: '+(it.client||'—'),'상대기관 담당: '+(it.officer||'—'),
    '관리번호: '+(it.no||''),'시작일: '+(it.start||'—'),'기한: '+(it.due||'—'),
    '상태: '+(it.status||''),'담당: '+((it.mgr_main&&it.mgr_main.name)||'—'),
    '다음 할 일: '+((it.next&&it.next.text)||'—')+' '+((it.next&&it.next.date)||''),
    '','[진행 기록 — 오래된 순, 총 '+arr.length+'건]'];
  arr.forEach(function(l){ L.push((l.d||'')+' : '+(l.t||'')+(l.byName?' ('+l.byName+')':'')); });
  return L.join('\n');
}

function saveAiQa(id,n){

function addLeaving(){
  var sel=$('lv-sid'); if(!sel)return;
  var sid=sel.value, name=sel.options[sel.selectedIndex].getAttribute('data-name');
  var date=$('lv-date').value;
  if(!date){ toast('예정일을 선택하세요','warn'); return; }
  if(leaving[sid]&&!leaving[sid].done){ toast(name+'은(는) 이미 부재 진행 중입니다','warn'); return; }
  fbDb.ref(NS+'/leaving/'+sid).set({name:name,type:$('lv-type').value,date:date,
    note:$('lv-note').value.trim(),created_at:new Date().toISOString(),done:false})
    .then(function(){ toast('🚪 부재 예정 등록: '+name); })
    .catch(function(e){ toast('등록 실패: '+e.message,'err'); });

function saveItem(editId){

    rec.no=genNo(cat); rec.status='진행중'; rec.start=todayStr(); rec.created_at=new Date().toISOString();

      items[id]=rec; closeM(); toast('✅ 등록: '+rec.no); route();

}

/* ── 진행 단계 = 하위 할 일 + 유형별 템플릿 ──────────────────────────
   업무 1건에 `다음 할 일` 하나만 적을 수 있어 "부당해고는 이 순서로"를 담을
   곳이 없었다. 사건을 열면 해야 할 일이 순서대로 깔려 있게 한다.
   `work_erp/steps/{업무ID}/{단계ID}` = {t제목, g묶음이름, o순서, done, d기한, by, at}
   items와 분리한 이유: 체크 한 번에 items 전체가 모든 화면으로 다시 밀려가는 것을
   막는다. 전체 용량이 작아(건당 8개 × 80B) live 구독해도 부담이 없고,
   목록의 진행률·캘린더 표시가 항상 최신이라 별도 집계 필드가 필요 없다.
   ⚠ 기본 템플릿은 박재원 노무사 노션 화면에 있는 부당해고 단계 그대로다.
     다른 유형은 만들어 넣지 않는다 — 절차를 지어내면 안 된다.
     실제 업무의 단계를 [템플릿으로 저장]해 늘려 간다. */
var TPL_BUILTIN=[
  {id:'_buhae', cat:'부해', name:'부당해고 구제신청', src:'기본 제공',
   g:[['1. 수임 및 노동위원회 접수',
       ['상담일지 작성','위임 및 서류 날인','자료수집','조사관 배정 확인 또는 초기 연락','초기 서면 및 대리인 서류 제출']],
      ['2. 서면 공방',
       ['입증 자료수집','상대방 서면 수령 및 검토','서면 작성 및 제출']]]}
];
var steps={}, tpls={};

function stepsOf(id){
  var o=steps[id]||{};
  return Object.keys(o).map(function(k){ var s=o[k]; if(!s||!s.t) return null; s._id=k; return s; })
    .filter(Boolean)
    .sort(function(a,b){ return (a.o||0)-(b.o||0)||String(a.t).localeCompare(String(b.t),'ko'); });
}
function stepProg(id){
  var a=stepsOf(id);
  return {d:a.filter(function(s){return s.done;}).length, t:a.length};
}
function stepChip(id){
  var p=stepProg(id); if(!p.t) return '';
  return ' <span class="stchip'+(p.d===p.t?' done':'')+'" title="진행 단계 '+p.d+'/'+p.t+'">'
    +(p.d===p.t?'✓ ':'')+p.d+'/'+p.t+'</span>';
}
// 내장 + 사용자 저장 템플릿
function tplAll(){
  var out=TPL_BUILTIN.slice();
  Object.keys(tpls||{}).forEach(function(k){
    var t=tpls[k]; if(t&&t.name&&t.g&&t.g.length){ t=Object.assign({},t); t.id=k; out.push(t); }
  });
  return out;
}
function tplFor(cat){
  var all=tplAll();
  var hit=all.filter(function(t){ return t.cat&&t.cat===cat; });
  return hit.concat(all.filter(function(t){ return hit.indexOf(t)<0; }));
}
function _stepPaths(id,groups){
  // groups = [[묶음이름,[제목,...]], ...] → 저장 경로
  var up={}, o=0;
  groups.forEach(function(g,gi){
    (g[1]||[]).forEach(function(t){
      o++;
      up[NS+'/steps/'+id+'/'+rid('S')]={t:t,g:g[0],o:(gi+1)*1000+o,done:0,d:''};
    });
  });
  return up;
}
function applyTpl(id,tplId){
  var t=tplAll().filter(function(x){return x.id===tplId;})[0];
  if(!t){ toast('템플릿을 찾을 수 없습니다','warn'); return; }
  var cur=stepsOf(id);
  var go=function(){
    var up=_stepPaths(id,t.g);
    var n=Object.keys(up).length;
    fbDb.ref().update(up).then(function(){
      closeM(); toast('✅ '+t.name+' — 단계 '+n+'개를 깔았습니다'); renderDrawer(); route();
    }).catch(function(e){ toast('실패: '+e.message,'err'); });
  };
  if(!cur.length){ go(); return; }
  confirmM('이미 단계 '+cur.length+'개가 있습니다.\n\n템플릿의 단계를 <b>뒤에 덧붙입니다</b>. 계속할까요?'
    .replace(/<[^>]+>/g,''),{ok:'덧붙이기'}).then(function(ok){ if(ok) go(); });
}
function stepToggle(id,sid){
  var s=(steps[id]||{})[sid]; if(!s) return;
  var done=s.done?0:1;
  var up={};
  up[NS+'/steps/'+id+'/'+sid+'/done']=done;
  up[NS+'/steps/'+id+'/'+sid+'/by']=done?((S.me&&S.me.name)||''):null;
  up[NS+'/steps/'+id+'/'+sid+'/at']=done?todayStr():null;
  fbDb.ref().update(up).catch(function(e){ toast('실패: '+e.message,'err'); });
}
function stepDate(id,sid,v){
  fbDb.ref(NS+'/steps/'+id+'/'+sid+'/d').set(v||null)
    .catch(function(e){ toast('실패: '+e.message,'err'); });
}
function stepAdd(id,group){
  var el=$('sa-'+safeKey(group)); var t=el?el.value.trim():'';
  if(!t) return;
  var same=stepsOf(id).filter(function(s){return s.g===group;});
  var last=same.length?same[same.length-1].o:0;
  var base=last||(stepsOf(id).length+1)*1000;
  fbDb.ref(NS+'/steps/'+id+'/'+rid('S')).set({t:t,g:group,o:base+1,done:0,d:''})
    .then(function(){ if(el)el.value=''; renderDrawer(); route();
      setTimeout(function(){ var e2=$('sa-'+safeKey(group)); if(e2)e2.focus(); },50); })
    .catch(function(e){ toast('실패: '+e.message,'err'); });
}
function stepDel(id,sid){
  fbDb.ref(NS+'/steps/'+id+'/'+sid).remove().catch(function(e){ toast('실패: '+e.message,'err'); });
}
function stepToNext(id,sid){
  var s=(steps[id]||{})[sid]; if(!s) return;
  patchItem(id,{next:{date:s.d||'',text:s.t}}).then(function(ok){
    if(!ok) return; toast('📌 다음 할 일로 — '+s.t); renderDrawer(); route();
  });
}
function stepClear(id){
  confirmM('이 업무의 진행 단계를 모두 지울까요?\n\n되돌릴 수 없습니다.',{ok:'모두 삭제',danger:true})
    .then(function(ok){ if(!ok)return;
      fbDb.ref(NS+'/steps/'+id).remove()
        .then(function(){ toast('단계를 모두 지웠습니다'); renderDrawer(); route(); })
        .catch(function(e){ toast('실패: '+e.message,'err'); });
    });
}
// 실제로 쓴 단계를 템플릿으로 만들어 다음 사건부터 재사용한다
function saveAsTpl(id){

    +'<div class="fld" style="margin-bottom:9px"><label>템플릿 이름</label>'
    +'<input id="tp-n" value="'+esc(it.title||it.cat||'')+'" placeholder="예: 부당해고 구제신청"></div>'
    +'<div class="fld" style="margin-bottom:9px"><label>어느 구분에서 추천할까요</label>'
    +catSelect(it.cat||'','').replace('<select ','<select id="tp-c" ')+'</div>'
    +'<div style="background:var(--bg);border-radius:8px;padding:9px 11px;font-size:11.5px;color:var(--sub);max-height:180px;overflow:auto">'
    +gs.map(function(g){ return '<b>'+esc(g[0])+'</b><br>'+g[1].map(function(t){return '· '+esc(t);}).join('<br>'); }).join('<br><br>')
    +'</div>'
    +'<div id="tp-msg" class="muted" style="font-size:12px;min-height:17px;margin-top:6px"></div>'
    +'<div class="row" style="justify-content:flex-end"><button onclick="closeM()">취소</button>'
    +'<button class="primary" onclick="saveTplGo()">템플릿 저장</button></div>');
  S._tplG=gs;
}
function saveTplGo(){
  var n=(($('tp-n')||{}).value||'').trim(), c=(($('tp-c')||{}).value||'');
  var msg=$('tp-msg');
  if(!n){ if(msg)msg.textContent='템플릿 이름을 적어 주세요.'; return; }

    by:(S.me&&S.me.sid)||'',byName:(S.me&&S.me.name)||'',at:new Date().toISOString()})
    .then(function(){ closeM(); toast('📋 템플릿 저장 — '+n); })
    .catch(function(e){ if(msg)msg.textContent='실패: '+e.message; });
}
function tplDel(tid){
  confirmM('이 템플릿을 삭제할까요?\n\n이미 깔아 놓은 단계는 그대로 남습니다.',{ok:'삭제',danger:true})
    .then(function(ok){ if(!ok)return;
      fbDb.ref(NS+'/tpl/'+tid).remove().then(function(){ toast('템플릿 삭제됨'); }); });
}
function tplModal(id){

function dStepsHTML(id,it){

    h+='<div class="kbempty">이 사건에서 해야 할 일을 <b>순서대로</b> 깔아 두면, 다음에 뭘 할지 찾지 않아도 됩니다.</div>'
      +'<div class="row"><button class="primary" style="padding:4px 12px;font-size:12px" onclick="tplModal(\''+escJ(id)+'\')">✅ 단계 깔기</button>'

function stepAddGroup(id){

/* ── 사업장 담당자 (푸른이알피 업체관리 읽기 전용 + 건별 직접 입력) ──────

   업체 담당자와 이 건 담당자가 다를 수 있으므로(인사담당 ↔ 안전담당)
   item.contact{name,rank,phone}에 건별로 따로 적을 수 있게 둔다. */
var coSrc=null, _coT=null;
function coLoad(){
  if(coSrc) return Promise.resolve(coSrc);
  if(_coT) return _coT;
  _coT=fbDb.ref('data/companies/v').once('value')
    .then(function(s){ coSrc=_peArr(s.val())||[]; _coT=null; return coSrc; })
    .catch(function(){ coSrc=_ls('companies')||[]; _coT=null; return coSrc; });
  return _coT;
}
// co_id(푸른이알피 companyId) 우선, 없으면 정규화한 업체명으로 찾는다
function coFind(it){
  if(!coSrc||!coSrc.length||!it) return null;
  if(it.co_id){
    var b=coSrc.filter(function(c){ return c&&c.id===it.co_id; })[0];
    if(b) return b;
  }
  var n=_normCo(it.company); if(!n) return null;
  return coSrc.filter(function(c){ return c&&_normCo(c.name||c.companyName)===n; })[0]||null;
}
function coContacts(it){
  var c=coFind(it); if(!c) return [];
  if(c.contacts&&c.contacts.length) return c.contacts.filter(Boolean);
  if(c.contactName||c.contactPhone) return [{name:c.contactName||'',role:'',phone:c.contactPhone||''}];
  return [];
}

/* ── 지식 카드 = 암묵지 저장소 ────────────────────────────────────────
   문제: 기록·노트가 전부 건(item)에 묶여 있어, 건이 종료되면 보관함에 묻힌다.
   같은 감독관·같은 업체·같은 유형을 다시 만나도 꺼내 쓸 수 없다.
   해결: 오래 사는 대상(사람·업체·유형·기관)에 카드를 붙인다.
   `work_erp/kb/{종류}/{키}/{카드ID}` = {t제목, x본문, kl키이름, by, byName, at,
     src{item,title}, flags[]}  — 어느 건에서 얻었는지 링크가 남는다.
   ⚠ 새로 쓰게 하지 않는다 — 기록·노트의 한 줄을 "승격"하는 것이 기본 입력 경로다.
   ⚠ 사람 카드는 실명 인물에 대한 서술이다. 인물 평가가 아니라 행동 지침으로
     쓰도록 입력 화면에서 안내한다("까다롭다" ✕ → "통화로 먼저 설명하면 빠르다" ○). */
var KB_KINDS=[
  ['person','사람','👤','감독관·조사관·업체 담당자 — 연락 방식, 무엇을 중요하게 보는지'],
  ['company','업체','🏢','그 사업장의 특성·과거 이력·자료 받는 경로'],
  ['cat','유형','📚','진행 순서·필수 서류·흔한 함정 (플레이북)'],
  ['office','기관','🏛','지청·공단 지사의 접수 관행·처리 기간·서식 선호']
];
var KB_KLBL={}; KB_KINDS.forEach(function(k){ KB_KLBL[k[0]]=k[1]; });
var KB_STALE_DAYS=730;                       // 2년 — 그때 맞던 관행이 지금 틀릴 수 있다
var kb={};

function kbKey(s){ return safeKey(String(s||'').trim()); }
function kbCoKey(it){ return it&&(it.co_id?kbKey(it.co_id):kbKey(_normCo(it.company))); }
function kbCards(kind,key){
  var o=((kb[kind]||{})[key])||{};
  return Object.keys(o).map(function(id){
      var c=o[id]; if(!c||typeof c!=='object') return null;
      c._id=id; c._kind=kind; c._key=key; return c;
    }).filter(function(c){ return c&&c.t; })
    .sort(function(a,b){ return String(b.at||'').localeCompare(String(a.at||'')); });
}
function kbAll(){
  var out=[];
  Object.keys(kb||{}).forEach(function(kind){
    Object.keys(kb[kind]||{}).forEach(function(key){ out=out.concat(kbCards(kind,key)); });
  });
  return out;
}
function kbStale(c){ return !!(c.at&&(Date.now()-new Date(c.at).getTime())>KB_STALE_DAYS*86400000); }
function kbBad(c){ return ((c.flags||[]).length>0); }
// 이 업무와 관련된 카드 — 찾으러 가지 않아도 붙어 나오게 하는 것이 핵심이다
function kbRelated(it){
  if(!it) return [];
  var out=[], seen={};
  function add(arr){ arr.forEach(function(c){
    var k=c._kind+'|'+c._key+'|'+c._id; if(seen[k]) return; seen[k]=1; out.push(c); }); }
  if(it.cat) add(kbCards('cat',kbKey(it.cat)));
  var ck=kbCoKey(it); if(ck) add(kbCards('company',ck));
  [it.officer,it.client,(it.contact&&it.contact.name)]
    .concat(coContacts(it).map(function(c){ return c&&c.name; }))
    .filter(Boolean).forEach(function(n){ add(kbCards('person',kbKey(n))); });
  // 기관은 업무에 필드가 없으므로, 카드의 기관명이 업무 텍스트에 나타나면 붙인다
  var hay=[it.company,it.title,it.officer,it.no,it.client].join(' ');
  kbAll().filter(function(c){ return c._kind==='office'&&c.kl&&hay.indexOf(c.kl)>=0; })
    .forEach(function(c){ add([c]); });
  return out;
}

    +(bad?'<span class="kbad">⚠ 정정 요청</span>':(old?'<span class="kwarn">⚠ 2년 경과</span>':''))

    +'<div class="km"><span>'+esc(c.byName||'')+' · '+esc((c.at||'').slice(0,10))+'</span>'

      +'title="관행이 바뀌었거나 사실과 다르면 표시합니다">지금은 다름</span>')
    +(bad?'<span class="act" onclick="kbUnflag(\''+escJ(c._kind)+'\',\''+escJ(c._key)+'\',\''+escJ(c._id)+'\')">정정 해제</span>':'')
    +(canDel?'<span class="act" style="color:var(--danger)" onclick="kbDel(\''+escJ(c._kind)+'\',\''+escJ(c._key)+'\',\''+escJ(c._id)+'\')">삭제</span>':'')

/* 승격 — 기록·노트의 한 줄을 오래 사는 카드로 올린다 */

function calBase(){ return new Date((S.calDate||todayStr())+'T00:00:00'); }
function calRange(){
  var d=calBase(), days=[], i;
  if(S.calView==='day') return {days:[ymd(d)],month:d.getMonth()};
  if(S.calView==='week'){ var m=mondayOf(d);
    for(i=0;i<7;i++) days.push(ymd(addDays(m,i)));
    return {days:days,month:d.getMonth()}; }
  var start=mondayOf(new Date(d.getFullYear(),d.getMonth(),1));
  var lastMon=mondayOf(new Date(d.getFullYear(),d.getMonth()+1,0));
  var wks=Math.round((lastMon-start)/604800000)+1;
  for(i=0;i<wks*7;i++) days.push(ymd(addDays(start,i)));
  return {days:days,month:d.getMonth()};
}
function calWeekKeys(R){
  var ks={}, a=R.days[0], b=R.days[R.days.length-1], d=new Date(a+'T00:00:00'), end=new Date(b+'T00:00:00');
  while(d<=end){ ks[weekKeyOf(mondayOf(d))]=1; d=addDays(d,7); }
  ks[weekKeyOf(mondayOf(end))]=1;
  return Object.keys(ks);
}
// 날짜 → 이벤트 목록
function calBuild(R){
  var L=S.calLay||{}, map={}, teamWide=(S.view==='team'), who=viewer();
  R.days.forEach(function(d){ map[d]=[]; });
  function add(d,ev){ if(map[d]) map[d].push(ev); }
  function sidOK(sid){ return teamWide||!who.sid||sid===who.sid; }
  if(L.due||L.next) openItems().forEach(function(it){
    if(!teamWide&&!isOf(it,who)) return;
    var co=it.company||it.client||it.title||'';
    if(L.due&&it.due) add(it.due,{k:'due',t:'📅 '+co,s:it.title||'',c:'#dc2626',it:it._id,drag:1});
    if(L.next&&it.next&&it.next.date)
      add(it.next.date,{k:'next',t:'📌 '+(it.next.text||'할 일'),s:co,c:'#7c3aed',it:it._id,drag:1});
  });
  // 진행 단계 — 기한을 넣은 미완료 단계만 (완료된 것까지 깔리면 달력이 지저분해진다)
  if(L.step) openItems().forEach(function(it){
    if(!teamWide&&!isOf(it,who)) return;
    stepsOf(it._id).forEach(function(s){
      if(s.done||!s.d||!map[s.d]) return;
      add(s.d,{k:'step',t:'☐ '+s.t,s:(it.company||it.title||'')+(s.g?' · '+s.g:''),c:'#0284c7',it:it._id});
    });
  });
  if(L.log) calWeekKeys(R).forEach(function(wk){
    Object.keys(wkCache[wk]||{}).forEach(function(iid){
      var it=items[iid]; if(!it) return;
      if(!teamWide&&!isOf(it,who)) return;
      wkLogsOf(iid,wk).forEach(function(l){
        if(!l||!l.d||!map[l.d]) return;
        add(l.d,{k:'log',t:'✍ '+(l.t||''),s:it.company||it.title||'',c:'#0f766e',it:iid});
      });
    });
  });
  if(L.sch&&calSrc.sch) calSrc.sch.forEach(function(s){
    if(!s||!s.date||!map[s.date]) return;
    if(s.externalId){ if(!teamWide) return; }         // 외부 협력자 일정은 팀 전체에서만
    else if(!sidOK(s.sid)) return;
    add(s.date,{k:'sch',tm:s.time||'',s:s.note||'',c:'#2563eb',
      t:(s.time?s.time+' ':'')+(s.title||'일정')+(teamWide&&!s.externalId?' · '+calName(s.sid):'')});
  });
  if(L.att&&calSrc.att) calSrc.att.forEach(function(r){
    if(!r||!r.date||!map[r.date]||!ATT_LBL[r.type]||!sidOK(r.sid)) return;
    add(r.date,{k:'att',t:ATT_LBL[r.type]+(teamWide?' '+calName(r.sid):''),s:r.note||'',c:'#0891b2'});
  });
  if(L.loa&&calSrc.loa) calSrc.loa.forEach(function(l){
    if(!l||!l.startDate||!sidOK(l.sid)) return;
    var lb='🏠 '+(l.typeLabel||l.loaType||'휴직')+(teamWide?' '+calName(l.sid):'');
    if(map[l.startDate]) add(l.startDate,{k:'loa',t:lb+' 시작',c:'#94a3b8'});
    if(l.endDate&&l.endDate!==l.startDate&&map[l.endDate]) add(l.endDate,{k:'loa',t:lb+' 종료',c:'#94a3b8'});
  });
  // 사건 마감 — 자동 연동이 이미 읽어 둔 마스터를 그대로 쓴다(추가 조회 없음)
  if(L.dl&&peMaster.case) peMaster.case.forEach(function(c){
    if(!c||_peClosed(c)||!sidOK(c.managerMain)) return;
    (c.deadlines||[]).forEach(function(d){
      if(!d||!d.date||!map[d.date]) return;
      add(d.date,{k:'dl',t:'⚖ '+(c.title||c.caseNo||'사건')+' 마감',s:c.companyName||'',c:'#b45309'});
    });
  });
  var ord={}; CAL_LAYERS.forEach(function(l,i){ ord[l[0]]=i; });
  // 시간이 있는 일정이 먼저(시간순), 그 다음 레이어 순.
  // localeCompare는 쓰지 않는다 — 물결표 같은 기호를 숫자보다 앞으로 정렬해 순서가 뒤집힌다.
  Object.keys(map).forEach(function(d){
    map[d].sort(function(a,b){
      var at=a.tm||'', bt=b.tm||'';
      if(at&&bt) return at<bt?-1:(at>bt?1:ord[a.k]-ord[b.k]);
      if(at) return -1;
      if(bt) return 1;
      return ord[a.k]-ord[b.k];
    });
  });
  return map;
}

    (groups[nm]=groups[nm]||[]).push(it); });
  var names=Object.keys(groups).sort();

    +calBtn()
    +'<span class="wknav" onclick="shiftWeek(-1)">‹</span>'

    +calPanel();
  // 요약 1줄 — 숫자 칩 자체가 필터다(예전 카드 6개 + 같은 뜻의 칩 2개를 합쳤다)
  h+='<div class="statbar">'
    +'진행 <b>'+open.length+'</b>건'
    +'<span class="sep">·</span>이 주 기록 <b>'+totLogs+'</b>줄'
    +'<span class="sep">·</span>완료 <b>'+doneWk.length+'</b>건'
    +'<span class="sep">|</span>'
    +'<span class="sb am'+(S.teamNolog?' on':'')+'" onclick="S.teamNolog=!S.teamNolog;renderTeam()" title="선택한 주에 기록이 없는 건만 — 클릭하면 켜고 끕니다">미기록 '+nolog.length+'</span>'
    +'<span class="sb am'+(S.teamStale?' on':'')+'" onclick="S.teamStale=!S.teamStale;renderTeam()" title="마지막 기록이 2주 이상 지난 건만 — 방치 신호">2주+ 방치 '+stale.length+'</span>'
    +'<span class="sb dg'+(S.teamDue==='d7'?' on':'')+'" onclick="S.teamDue=(S.teamDue===\'d7\'?\'\':\'d7\');renderTeam()" title="기한이 7일 이내인 건만">임박 '+due7.length+'</span>'
    +'</div>';
  var folded=Object.keys(S.teamFold||{}).length>0;
  h+='<div class="fbar">'
    +qBox('renderTeam','🔍 기업·업무명·의뢰인')
    +'<select onchange="S.teamMgr=this.value;renderTeam()" title="담당자로 좁히기">'
    +'<option value="">담당 전체</option>'+names.map(function(n){return '<option'+(S.teamMgr===n?' selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select>'
    +catSelect(S.teamCat,'S.teamCat=this.value;renderTeam()')
    +'<select onchange="S.teamSt=this.value;renderTeam()" title="상태로 좁히기">'
    +'<option value="">상태 전체</option>'
    +STATUSES.map(function(s){return '<option'+(S.teamSt===s[0]?' selected':'')+'>'+s[0]+'</option>';}).join('')+'</select>'
    +'<select onchange="S.teamDue=this.value;renderTeam()" title="기한으로 좁히기">'
    +[['','기한 전체'],['over','기한 지남'],['d7','임박 D-7'],['none','기한 없음']].map(function(o){
        return '<option value="'+o[0]+'"'+(S.teamDue===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>'
    +'<span class="chipbtn'+(S.teamFlat?' on':'')+'" onclick="S.teamFlat=!S.teamFlat;renderTeam()" title="담당자 묶음을 풀고 한 표로 — 정렬에 유용">평면</span>'
    +(S.teamFlat?'':'<span class="chipbtn" onclick="teamFoldAll('+(folded?'false':'true')+')" title="담당자 묶음 접기·펼치기">'+(folded?'▾ 펼치기':'▸ 접기')+'</span>')
    +((S.teamMgr||S.teamCat||S.teamSt||S.teamDue||S.teamNolog||S.teamStale||S.q)
      ?'<span class="chipbtn on" onclick="teamReset()" title="모든 필터 해제">✕ 필터</span>':'')
    +'</div>';
  if(!isCurWeek()) h+='<div class="histbanner">🕘 <b>'+esc(weekLabel(S.week))+'</b> 열람 중<span class="back" onclick="setWeek(null)">이번 주로 →</span></div>';
  // 필터 적용
  function pass(it){
    if(S.teamCat&&it.cat!==S.teamCat) return false;
    if(S.teamSt&&(it.status||'진행중')!==S.teamSt) return false;
    if(S.teamNolog&&wkLogsOf(it._id,wk).length) return false;
    if(S.teamStale){ var ld=(it.last&&it.last.d)||''; if(ld&&_dayDiff(today,ld)<14) return false; }
    if(S.teamDue){
      var d=dday(itemDue(it));
      if(S.teamDue==='none'&&d!==null) return false;
      if(S.teamDue==='over'&&!(d!==null&&d<0)) return false;
      if(S.teamDue==='d7'&&!(d!==null&&d>=0&&d<=7)) return false;
    }
    if(S.q&&!matchQ(it,S.q)) return false;
    return true;
  }
  var TH=[['cat','구분','width:56px'],['co','기업 / 의뢰인','min-width:130px'],['title','업무명','min-width:130px'],
          ['log','이 주 실적','color:var(--acc2)'],['last','최근 기록','min-width:150px'],['due','다음 할 일','width:110px']];
  h+='<div class="panel" style="padding:0;overflow-x:auto"><table><thead><tr><th class="rowno">#</th>'
    +TH.map(function(c){
        var on=(S.teamSort||'due')===c[0];
        return '<th style="'+c[2]+';cursor:pointer'+(on?';color:var(--acc2)':'')+'" onclick="teamSort(\''+c[0]+'\')" title="클릭하면 이 열로 정렬">'
          +esc(c[1])+(on?(S.teamDesc?' ▼':' ▲'):'')+'</th>';
      }).join('')
    +'<th style="width:58px;text-align:center">종료</th>'
    +'</tr></thead><tbody>';
  function rowsOf(arr,perGroup){
    return arr.map(function(it,i){
      var logs=wkLogsOf(it._id,wk);
      var logHtml=logs.length?logs.map(function(l){return '<div class="wklog"><span class="d">'+esc(md(l.d))+'</span>'+esc(l.t)+'</div>';}).join('')
        :'<span class="muted" style="font-size:12px">—</span>';
      var ld=(it.last&&it.last.d)||'';
      var stale=ld&&_dayDiff(today,ld)>=14;
      var lastHtml=it.last?('<span class="last">'+esc(it.last.t)+' <span class="ago"'
          +(stale?' style="color:var(--warn);font-weight:700"':'')+'>· '+esc(md(ld))+'</span></span>')
        :'<span class="muted" style="font-size:12px">기록 없음</span>';
      var nx=it.next&&it.next.text?ddayHTML(it.next.date,it.next.text):(it.due?ddayHTML(it.due,'기한'):'<span class="muted">—</span>');
      return '<tr>'+tdNo(i+1)+'<td>'+catBadge(it.cat)+'</td>'
        +'<td class="itc" onclick="openDrawer(\''+it._id+'\')"><span class="co">'+esc(it.company||it.client||'—')+'</span>'
        +(perGroup?'':'<div class="sub">'+esc((it.mgr_main&&it.mgr_main.name)||'담당 미지정')+'</div>')
        +(it.officer?'<div class="sub">'+esc(it.officer)+'</div>':'')+'</td>'
        +'<td style="font-size:12.5px">'+esc(it.title||'')+stepChip(it._id)+peFlag(it)+'</td>'
        +'<td>'+logHtml+'</td><td>'+lastHtml+'</td><td>'+nx+'</td>'
        +'<td style="text-align:center"><button class="endbtn" onclick="event.stopPropagation();completeItem(\''+escJ(it._id)+'\')" '
        +'title="이 업무를 종료해 보관함으로 옮깁니다'+(peLinked(it)?' (푸른이알피 종료 연동)':'')+'">종료'
        +(peLinked(it)?'<span class="lk">🔗</span>':'')+'</button></td></tr>';
    }).join('');
  }
  var shown=0;
  if(S.teamFlat){                                    // 평면 보기 — 한 표로 정렬
    var flat=open.filter(pass); flat=teamSortArr(flat,wk); shown=flat.length;
    h+=rowsOf(flat,false);
  }else{
    names.forEach(function(nm){
      if(S.teamMgr&&S.teamMgr!==nm) return;
      var arr=groups[nm].filter(pass);
      if(!arr.length) return;
      shown+=arr.length;
      var rec=groups[nm].filter(function(it){return wkLogsOf(it._id,wk).length>0;}).length;
      var fold=!!(S.teamFold||{})[nm];
      h+='<tr class="grp-h" style="cursor:pointer" onclick="teamFold(\''+escJ(nm)+'\')"><td colspan="8">'
        +(fold?'▸':'▾')+' 👤 '+esc(nm)+' — 진행 '+groups[nm].length+'건'
        +(arr.length!==groups[nm].length?' <span class="muted" style="font-weight:600">(조건 '+arr.length+'건)</span>':'')
        +' <span class="pct">이 주 기록 '+rec+'/'+groups[nm].length+'</span></td></tr>';
      if(!fold) h+=rowsOf(teamSortArr(arr,wk),true);
    });
  }
  if(!shown) h+='<tr><td colspan="8" class="moremark">조건에 맞는 업무가 없습니다. 필터를 바꿔 보세요.</td></tr>';
  h+='</tbody></table></div>';
  h+='<div class="muted" style="font-size:12px;margin-top:8px">조건에 맞는 업무 '+shown+' / 전체 '+open.length+'건</div>';
  app.innerHTML=h;
}
function teamSort(k){ if((S.teamSort||'due')===k) S.teamDesc=!S.teamDesc; else { S.teamSort=k; S.teamDesc=false; } renderTeam(); }
function teamSortArr(arr,wk){
  var k=S.teamSort||'due', dir=S.teamDesc?-1:1;
  function key(it){
    if(k==='cat') return it.cat||'';
    if(k==='co') return it.company||it.client||'';
    if(k==='title') return it.title||'';
    if(k==='log') return String(wkLogsOf(it._id,wk).length).padStart(3,'0');
    if(k==='last') return (it.last&&it.last.d)||'0000-00-00';
    return itemDue(it)||'9999-99-99';            // 기한 없는 건은 뒤로
  }
  return arr.slice().sort(function(a,b){
    var r=String(key(a)).localeCompare(String(key(b)),'ko');
    return (r||String(a.no||'').localeCompare(String(b.no||''),'en',{numeric:true}))*dir;
  });
}
function teamFold(nm){ S.teamFold=S.teamFold||{}; S.teamFold[nm]=!S.teamFold[nm]; renderTeam(); }
function teamFoldAll(on){ S.teamFold={};
  if(on) openItems().forEach(function(it){ S.teamFold[(it.mgr_main&&it.mgr_main.name)||'(담당 미지정)']=1; });
  renderTeam(); }
function teamReset(){ S.teamMgr=''; S.teamCat=''; S.teamSt=''; S.teamDue=''; S.teamNolog=false; S.teamStale=false; S.q=''; renderTeam(); }

/* ── 업무량 (사람별 비교·관리) ── */
// 최근 n주 기록을 모두 로드
function loadWeeks(n){
  var arr=[]; for(var i=0;i<n;i++) arr.push(weekKeyOf(addDays(S.week,-7*i)));
  return Promise.all(arr.map(loadWeekOnce)).then(function(){ return arr; });
}
function _dayDiff(a,b){ return Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000); }
function setStW(n){ S.stW=n; renderStats(); }
function renderStats(){
  var app=$('app'); if(!app)return;
  var n=S.stW||4;
  app.innerHTML=loadingHTML('최근 '+n+'주 업무량 집계 중…');
  loadWeeks(n).then(function(wks){
    if(S.view!=='stats') return;
    var today=todayStr(), open=openItems();
    var from=ymd(addDays(S.week,-7*(n-1))), to=ymd(addDays(S.week,6));
    var rows={};
    function R(nm){ return rows[nm]=rows[nm]||{name:nm,open:0,cats:{},logged:{},lines:0,stale:0,due:0,over:0,done:0}; }
    var owner={};
    open.forEach(function(it){
      var nm=(it.mgr_main&&it.mgr_main.name)||'(담당 미지정)';
      owner[it._id]=nm;
      var r=R(nm); r.open++;
      var c=it.cat||'기타'; r.cats[c]=(r.cats[c]||0)+1;
      var d=dday(itemDue(it));
      if(d!==null&&d<0) r.over++; else if(d!==null&&d<=7) r.due++;
      var ld=(it.last&&it.last.d)||'';
      if(!ld||_dayDiff(today,ld)>=14) r.stale++;
    });
    wks.forEach(function(wk){ var w=wkCache[wk]||{};
      Object.keys(w).forEach(function(iid){
        var nm=owner[iid]; if(!nm) return;
        var r=R(nm), c=Object.keys(w[iid]||{}).length;
        r.lines+=c; if(c) r.logged[iid]=1;
      });
    });
    allItems().forEach(function(it){
      if(it.state!=='done'||!it.done_date) return;
      if(it.done_date<from||it.done_date>to) return;
      R((it.mgr_main&&it.mgr_main.name)||'(담당 미지정)').done++;
    });
    var list=Object.keys(rows).map(function(k){var r=rows[k];r.loggedN=Object.keys(r.logged).length;
      r.rate=r.open?Math.round(r.loggedN/r.open*100):0; return r;})
      .sort(function(a,b){return b.open-a.open;});
    var T={open:0,lines:0,stale:0,over:0,due:0,done:0,loggedN:0};
    list.forEach(function(r){ T.open+=r.open;T.lines+=r.lines;T.stale+=r.stale;T.over+=r.over;T.due+=r.due;T.done+=r.done;T.loggedN+=r.loggedN; });
    var Trate=T.open?Math.round(T.loggedN/T.open*100):0;

    function catBar(r){
      var ks=Object.keys(r.cats).sort(function(a,b){return r.cats[b]-r.cats[a];});
      return '<div style="display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--bg);min-width:90px">'
        +ks.map(function(c){var col=catColor(c)[1];
          return '<span title="'+esc(c)+' '+r.cats[c]+'건" style="width:'+(r.cats[c]/r.open*100)+'%;background:'+col+'"></span>';}).join('')
        +'</div><div style="font-size:10px;color:var(--faint);margin-top:2px">'
        +ks.slice(0,3).map(function(c){return esc(c)+' '+r.cats[c];}).join(' · ')+(ks.length>3?' …':'')+'</div>';
    }
    var h='<div class="row" style="flex-wrap:wrap"><h1>업무량</h1>'
      +'<span class="muted" style="font-size:12.5px">'+esc(from)+' ~ '+esc(to)+' 기준</span>'
      +'<span style="flex:1"></span>'
      +[[1,'이번 주'],[4,'최근 4주'],[12,'최근 12주']].map(function(p){
          return '<span class="chipbtn'+(n===p[0]?' on':'')+'" onclick="setStW('+p[0]+')">'+p[1]+'</span>';}).join('')
      +'</div>';
    h+='<div class="statbar">'
      +'진행 <b>'+T.open+'</b>건'
      +'<span class="sep">·</span>기록 <b>'+T.lines+'</b>줄'
      +'<span class="sep">·</span>기록률 <b'+(Trate<60?' style="color:var(--warn)"':'')+'>'+Trate+'</b>%'
      +'<span class="sep">·</span>완료 <b>'+T.done+'</b>건'
      +'<span class="sep">|</span>'
      +'<span class="muted">2주+ 방치 <b'+(T.stale?' style="color:var(--warn)"':'')+'>'+T.stale+'</b>'
      +' · 기한 지남 <b'+(T.over?' style="color:var(--danger)"':'')+'>'+T.over+'</b></span>'
      +'</div>';
    h+='<div class="panel" style="padding:0;overflow-x:auto"><table><thead><tr>'
      +'<th class="rowno">#</th>'
      +'<th style="min-width:80px">담당</th><th style="width:58px;text-align:right">진행</th>'
      +'<th style="min-width:120px">구분 구성</th>'
      +'<th style="width:92px;text-align:right">기록률</th><th style="width:64px;text-align:right">기록 줄</th>'
      +'<th style="width:72px;text-align:right">2주+ 방치</th><th style="width:64px;text-align:right">임박</th>'
      +'<th style="width:64px;text-align:right">지남</th><th style="width:58px;text-align:right">완료</th></tr></thead><tbody>';
    if(!list.length) h+='<tr><td colspan="10" class="moremark">집계할 업무가 없습니다.</td></tr>';
    list.forEach(function(r,i){
      var rc=r.rate>=80?'var(--ok)':r.rate>=50?'var(--warn)':'var(--danger)';
      h+='<tr style="cursor:pointer" onclick="setView(\'\',\''+escJ(r.name)+'\');go(\'my\')" title="이 담당자의 업무 보기">'
        +tdNo(i+1)
        +'<td style="font-weight:700">'+esc(r.name)+'</td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums;font-weight:700">'+r.open+'</td>'
        +'<td>'+catBar(r)+'</td>'
        +'<td style="text-align:right"><b style="color:'+rc+'">'+r.rate+'%</b>'
          +'<div style="font-size:10px;color:var(--faint)">'+r.loggedN+'/'+r.open+'건</div></td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums">'+r.lines+'</td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums'+(r.stale?';color:var(--warn);font-weight:700':'')+'">'+(r.stale||'—')+'</td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums">'+(r.due||'—')+'</td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums'+(r.over?';color:var(--danger);font-weight:700':'')+'">'+(r.over||'—')+'</td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums">'+(r.done||'—')+'</td></tr>';
    });
    h+='</tbody></table></div>';
    h+='<div class="panel" style="font-size:12px;color:var(--sub);line-height:1.75">'
      +'<b>읽는 법</b> — <b>진행·구분 구성</b>은 <u>부하</u>(무엇을 얼마나 들고 있나), '
      +'<b>기록률·기록 줄</b>은 <u>활동</u>(얼마나 챙기고 있나)입니다. 성격이 다르니 섞어 보지 마세요.<br>'
      +'⚠️ <b>기록 줄 수를 성과 지표로 쓰지 마세요.</b> 줄 수로 평가하면 기록을 잘게 쪼개 부풀리게 되고, '
      +'그러면 이 화면의 숫자가 전부 못 쓰게 됩니다. 관리에 쓸 값은 <b>2주+ 방치</b>와 <b>기한 지남</b>입니다 — '
      +'이 둘은 실제 사고로 이어지는 신호입니다.<br>'
      +'행을 클릭하면 그 담당자의 업무 목록으로 이동합니다.</div>';
    app.innerHTML=h;
  }).catch(function(e){ if($('app'))$('app').innerHTML='<div class="panel">집계 실패: '+esc(e.message)+'</div>'; });
}

/* ── 보관함 — 종료된 업무를 담당자별로 관리 ── */
function _mgrOf(it){ return (it.mgr_main&&it.mgr_main.name)||'(담당 미지정)'; }
function peSyncBadge(it){
  if(!peLinked(it)) return '';
  if(it.pe_nosync) return '<span class="pesync off" title="이 업무는 푸른이알피와 연동하지 않습니다">연동 안 함</span>';
  var st=(pesync[it.ref.type+'-'+safeKey(it.ref.id)]||{});
  if(st.synced_at&&st.pe_closed===true) return '<span class="pesync done" title="푸른이알피도 종료됨 · '+esc((st.synced_at||'').slice(0,10))+'">🔗 반영됨</span>';
  return '<span class="pesync wait" title="푸른이알피 나의 업무를 열 때 반영됩니다">🔗 반영 대기</span>';
}
function arReset(){ S.arMgr=''; S.arCat=''; S.arPeriod=''; S.q=''; renderArchive(); }
function arFold(nm){ S.arFold=S.arFold||{}; S.arFold[nm]=!S.arFold[nm]; renderArchive(); }
function renderArchive(){
  var app=$('app'); if(!app)return;
  var all=allItems().filter(function(it){return it.state==='done';})
    .sort(function(a,b){return (b.done_date||'').localeCompare(a.done_date||'');});
  var today=todayStr();
  var mgrs={}; all.forEach(function(it){ mgrs[_mgrOf(it)]=1; });
  var names=Object.keys(mgrs).sort();
  // 기간 필터 경계
  var from='';
  if(S.arPeriod==='m1') from=ymd(addDays(new Date(),-30));
  else if(S.arPeriod==='m3') from=ymd(addDays(new Date(),-90));
  else if(S.arPeriod==='y') from=(new Date().getFullYear())+'-01-01';
  function pass(it){
    if(S.arMgr&&_mgrOf(it)!==S.arMgr) return false;
    if(S.arCat&&(it.cat||'기타')!==S.arCat) return false;
    if(from&&(it.done_date||'')<from) return false;
    if(S.q&&!matchQ(it,S.q)) return false;
    return true;
  }
  var done=all.filter(pass);
  var h='<div class="row" style="flex-wrap:wrap"><h1>보관함</h1>'
    +'<span class="muted" style="font-size:12.5px">종료된 업무 — 기록·인수인계 노트는 그대로 남고 통계에도 계속 포함됩니다</span></div>';
  if(!all.length){ app.innerHTML=h+'<div class="panel" style="text-align:center;color:var(--sub);padding:40px">종료된 업무가 없습니다.</div>'; return; }
  // 담당자별 종료 건수 요약 1줄 (클릭 = 그 사람만)
  h+='<div class="statbar">'

/* ── 푸른이알피 담당 업무 가져오기 (계약·사건·컨설팅·기금·기타) ── */
// pu-erp는 localStorage(pureun_v6_*)에 마스터를 캐시함 — 같은 출처라 그대로 읽는다.
function _ls(key){
  try{ var raw=localStorage.getItem('pureun_v6_'+key); if(!raw) return null;
    var v=JSON.parse(raw); if(v&&!Array.isArray(v)&&typeof v==='object') v=Object.keys(v).map(function(k){return v[k];});
    return Array.isArray(v)?v:null; }catch(e){ return null; }
}
// 종료 판정 — pu-erp isItemClosed와 동일 기준
function _peClosed(x){
  if(!x) return true;
  if(x.permanentArchived||x.archived) return true;
  if(x.closedDate||x.closedAt||x.closeDate) return true;
  var st=String(x.status||'');
  return st==='closed'||st==='cancelled'||st==='transferred';
}
// pu-erp 유형명 → 업무시트 표준 구분 (엑셀 이관과 같은 규칙)
/* 구분 = 푸른이알피 유형 그대로.
   예전엔 normCat()으로 우리 13종에 억지로 끼워 맞춰서 대부분 '기타'로 뭉개졌다
   (기술보호·산일능률·인사서산·이음센터 같은 실제 유형이 전부 기타가 됐다).
   ① 유형 필드(typeName·contractType…) → ② 관리번호 접두어 → ③ 종류 이름 순으로 찾는다.
   ②를 쓰는 이유: 기타사업은 유형 필드가 비어 있고 관리번호에만 사업명이 들어 있다
   (예: 기술보호-2026-006). */
function peCat(t,x,label,kind){
  var v=String(x.typeName||x.caseType||x.contractType||x.consultingType
    ||x.fundType||x.projectType||x.programName||kind||'').trim();
  if(v) return v;
  var no=String(x.caseNo||x.contractNo||x.consultNo||x.fundNo||x.projectNo||x.no||'').replace(/\s/g,'');
  var m=/^([^\-\d]{2,})/.exec(no);
  if(m) return m[1];
  return label||'기타';
}
// (엑셀 이관 초기에 쓰던 13종 정규화 — 지금은 쓰지 않는다. 과거 데이터 해석용으로 남겨 둔다)
function normCat(raw,title){
  var s=String((raw||'')+' '+(title||'')).replace(/\s/g,'');
  if(/산재/.test(s)) return '산재';
  if(/체불|체당/.test(s)) return '체불';
  if(/부당|부해/.test(s)) return '부해';
  if(/괴롭힘|직괴/.test(s)) return '조사';
  if(/행심|행정심판/.test(s)) return '행심';
  if(/기금|공동근로복지/.test(s)) return '기금';
  if(/노사|노조/.test(s)) return '노사';
  if(/급여/.test(s)) return '급여';
  if(/산안|안전/.test(s)) return '산안';
  if(/지원금/.test(s)) return '지원';
  if(/컨설팅|일터|구조혁신|비즈니스|현장클리닉|현클|기술보호|가족친화|상공회의소|자율점검|징계위원회|근로계약서|통상임금/.test(s)) return '컨설팅';
  if(/인사|규정|취업규칙/.test(s)) return '인사';
  if(/조사/.test(s)) return '조사';
  return '기타';
}
function _normCo(s){ return String(s||'').replace(/\(주\)|㈜|주식회사|\(유\)|유한회사|[\s·.,\-()]/g,'').toLowerCase(); }
function _peDue(x){
  var ds=(x.deadlines||[]).map(function(d){return d&&d.date;}).filter(Boolean).sort();
  if(ds.length){ var t=todayStr(); var up=ds.filter(function(d){return d>=t;}); return up[0]||ds[ds.length-1]; }
  return x.contractEndDate||'';
}
/* ── 푸른이알피 마스터 읽기 ─────────────────────────────────────────
   RTDB `data/{키}/v`를 직접 읽는다. 예전엔 localStorage(pureun_v6_*)만 봐서
   같은 브라우저에서 푸른이알피를 한 번 열지 않으면 후보가 0건이었다.
   저장형태는 키마다 배열/객체로 다르므로 _peArr가 둘 다 받아 정규화한다.
   ⚠ 읽기만 한다 — 마스터 쓰기는 pu-erp의 dbPatch만 담당한다. */
var PE_KEYS={contract:'contracts',case:'cases',consulting:'consultings',fund:'funds',other:'other_projects'};
var PE_DEF=[
  ['contract','계약',function(x){return x.contractNo||'';},function(x){return x.title||x.contractType||'';},function(x){return x.contractType||x.consultingType||x.caseType||x.fundType||x.programName||'';}],
  ['case','사건',function(x){return x.caseNo||'';},function(x){return x.title||x.caseName||'';},function(x){return x.typeName||x.caseType||'';}],
  ['consulting','컨설팅',function(x){return x.consultNo||x.no||'';},function(x){return x.title||x.programName||'';},function(x){return x.typeName||x.consultingType||x.programName||'';}],
  ['fund','기금',function(x){return x.fundNo||x.no||'';},function(x){return x.title||x.fundName||'';},function(x){return x.fundType||'기금';}],
  ['other','기타',function(x){return x.projectNo||x.no||'';},function(x){return x.title||x.projectName||'';},function(x){return x.programName||'';}]
];
var PE_MIRROR=['no','cat','company','client','officer','title','due','start','co_id'];
// 업무 요약 — 푸른이알피와 양방향이라 PE_MIRROR(푸른이알피가 일방적으로 덮는 필드)에 넣지 않는다.
// 처음 연결할 때만 씨앗으로 가져오고, 이후 변경은 pesync가 양쪽을 비교해 맞춘다.
var BRIEF_MAX=40;
function briefTrim(v){ return String(v==null?'':v).replace(/\s+/g,' ').trim().slice(0,BRIEF_MAX); }
// 목록에서 업무명 아래 한 줄로 보이는 업무 요약. 비어 있으면 아무것도 그리지 않는다.
function briefLine(it){
  var b=briefTrim(it&&it.brief); if(!b) return '';
  return '<div class="sub" style="color:#1d4ed8" title="업무 요약 — 푸른이알피와 서로 반영됩니다">✏️ '+esc(b)+'</div>';
}
var peMaster={};                                   // {유형:[레코드]} — 읽기 실패한 유형은 키가 없다
var peState={since:null,at:null,n:0,err:''};
var _peU2N=null, _peT=null, _peBusy=false, _peWatching=false;

function _peArr(v){
  if(v&&!Array.isArray(v)&&typeof v==='object') v=Object.keys(v).map(function(k){return v[k];});
  return Array.isArray(v)?v.filter(Boolean):null;
}
// 이름 해석용 sid→이름 (퇴직자 포함 — loadStaff는 재직자만 주므로 따로 읽는다)
function peUsers(){
  if(_peU2N) return Promise.resolve(_peU2N);
  function fin(arr){ var m={}; (arr||[]).forEach(function(u){ if(u&&u.sid) m[u.sid]=u.name||u.sid; }); _peU2N=m; return m; }
  var l=_ls('user_accounts'); if(l) return Promise.resolve(fin(l));
  return fbDb.ref('data/user_accounts/v').once('value')
    .then(function(s){ return fin(_peArr(s.val())); }).catch(function(){ return fin([]); });
}
function peLoadAll(){
  return Promise.all(PE_DEF.map(function(d){
    return fbDb.ref('data/'+PE_KEYS[d[0]]+'/v').once('value')
      .then(function(s){ return [d[0],_peArr(s.val())]; })
      .catch(function(){ return [d[0],_ls(PE_KEYS[d[0]])]; });   // 권한/네트워크 실패 → 캐시 폴백
  })).then(function(rows){
    rows.forEach(function(r){ if(r[1]) peMaster[r[0]]=r[1]; });
    return peMaster;
  });
}
// 마스터 1건 → 업무시트 항목 후보
function _peCandOf(t,label,dNo,dTitle,dKind,x,sid2name){
  var co=x.companyName||x.fundName||x.targetName||'';
  var kind=dKind(x), title=dTitle(x);
  return { pid:'PE-'+t+'-'+safeKey(x.id), kindLabel:label, no:dNo(x)||'', cat:peCat(t,x,label,kind),
    company:co, title:(title||kind||co||'무제'), officer:(x.jurisdiction&&x.jurisdiction.officer)||'',
    brief:briefTrim(x.brief),
    client:x.payee||'', mgr:sid2name[x.managerMain]||'', mgrSid:x.managerMain||'',
    co_id:x.companyId||'',                        // 업체 담당자 조회용 — 이름 매칭보다 정확하다
    subs:(x.managerSubs||[]).map(function(sd){return sid2name[sd]||'';}).filter(Boolean),
    due:_peDue(x), start:x.receiveDate||x.contractStartDate||'',
    ref:{type:t,id:String(x.id)} };
}
// 5종 마스터 → 미종료 후보 전체. null = 한 유형도 못 읽음
function puerpCandidates(){
  var sid2name=_peU2N||{}, out=[], any=false;
  PE_DEF.forEach(function(d){
    var arr=peMaster[d[0]]; if(!arr) return; any=true;
    arr.forEach(function(x){
      if(!x||!x.id||_peClosed(x)) return;
      out.push(_peCandOf(d[0],d[1],d[2],d[3],d[4],x,sid2name));
    });
  });
  return any?out:null;
}
// 마스터 + 사용자 준비
function peReady(){ return Promise.all([peLoadAll(),peUsers()]); }

/* ── 자동 연동 엔진 ─────────────────────────────────────────────────
   ① 기준일(config/pe_since)이 없으면 = 최초 실행. 현재 있는 모든 건을
      pe_seen에 "이미 본 것"으로만 적고 항목은 만들지 않는다.
      → 엑셀 이관 163건과 겹치는 백로그가 쏟아지는 것을 막는다.
      (pu-erp 레코드에 등록일 필드가 없어 날짜 비교가 불가능하므로 id 스냅샷을 쓴다)
   ② 기준일 이후 새로 등록된 건(pe_seen에 없는 건)만 자동 생성한다.
   ③ 푸른이알피 소유 필드는 pe_m 스냅샷과 비교해 "푸른이알피에서 실제로
      바뀐 경우에만" 갱신한다. → 여기서 사람이 고친 값이 조용히 안 덮인다.
   ④ 종료·재개는 pu-erp의 pesync 엔진 담당 — 여기서 손대지 않는다. */
function peWatch(){
  if(_peWatching) return; _peWatching=true;
  // data/{키}/u = 그 키의 변경 타임스탬프 1개. 본문 대신 이것만 구독해 트래픽을 줄인다.
  PE_DEF.forEach(function(d){
    fbDb.ref('data/'+PE_KEYS[d[0]]+'/u').on('value',function(){ peBump(); },function(){});
  });
  peBump();                                        // u 노드가 없는 경우에도 최초 1회는 돌린다
}
function peBump(){
  clearTimeout(_peT);
  _peT=setTimeout(function(){
    // 마스터를 읽은 뒤 한 번 다시 그린다 — "주담당 미연결 N건" 안내는
    // peMaster가 채워진 뒤에야 판단할 수 있고, 쓸 게 없으면 items 리스너가 안 울린다.
    peLoadAll().then(function(){ if(!appHasFocus()) route(); return peAutoSync(); });
  },1000);   // 5개 구독이 몰려 와도 1회만
}
function peAutoSync(){
  if(_peBusy) return Promise.resolve();
  if(!PE_DEF.some(function(d){return !!peMaster[d[0]];})) return Promise.resolve();
  _peBusy=true;
  return Promise.all([
    peUsers(), loadStaff(),
    fbDb.ref(NS+'/pe_seen').once('value').then(function(s){return s.val()||{};}).catch(function(){return null;}),
    fbDb.ref(NS+'/config/pe_since').once('value').then(function(s){return s.val()||'';}).catch(function(){return null;})
  ]).then(function(r){
    var sid2name=r[0], staff=r[1], seen=r[2], since=r[3];
    if(seen===null||since===null){ peState.err='연동 설정을 읽지 못했습니다'; return; }
    peState.err=''; peState.since=since||'';
    var name2sid={}; staff.forEach(function(u){ name2sid[u.name]=u.sid; });
    var ceo=staff.filter(function(u){return /대표/.test(u.title||'');})[0]||null;

    // 현재 마스터 상태: live=존재하는 전체 id, cand=미종료 후보
    var cand=[], live={};
    PE_DEF.forEach(function(d){
      var arr=peMaster[d[0]]; if(!arr) return;
      live[d[0]]={};
      arr.forEach(function(x){
        if(!x||!x.id) return;
        live[d[0]][safeKey(String(x.id))]=1;
        if(_peClosed(x)) return;
        cand.push(_peCandOf(d[0],d[1],d[2],d[3],d[4],x,sid2name));
      });
    });
    var up={};

    // ① 최초 실행 — 기준선만 기록하고 끝낸다
    if(!since){
      var t0=todayStr();
      Object.keys(live).forEach(function(t){
        Object.keys(live[t]).forEach(function(k){ up[NS+'/pe_seen/'+t+'/'+k]=true; });
      });
      up[NS+'/config/pe_since']=t0;
      return fbDb.ref().update(up).then(function(){
        peState.since=t0; peState.at=new Date().toISOString();
        toast('🔗 자동 연동 시작 — 오늘부터 푸른이알피에 등록되는 건이 자동으로 들어옵니다');
      });
    }

    // ② 기존 연동건: 원본 존재 여부 + 소유 필드 미러
    var byRef={}, candByRef={};
    allItems().forEach(function(it){ if(peLinked(it)) byRef[it.ref.type+'|'+safeKey(it.ref.id)]=it; });
    cand.forEach(function(c){ candByRef[c.ref.type+'|'+safeKey(c.ref.id)]=c; });
    Object.keys(byRef).forEach(function(k){
      var it=byRef[k], P=NS+'/items/'+it._id+'/';
      // 원본 삭제 감지 — 그 유형을 실제로 읽어냈을 때만 판단한다(읽기 실패로 전건 오표시 방지)
      if(live[it.ref.type]){
        var gone=!live[it.ref.type][safeKey(it.ref.id)];
        if(gone&&!it.pe_gone) up[P+'pe_gone']=true;
        if(!gone&&it.pe_gone) up[P+'pe_gone']=null;
      }
      var c=candByRef[k]; if(!c) return;            // 종료된 건 → 미러 안 함(종료는 pesync 담당)
      var m=it.pe_m||{}, nm={};
      PE_MIRROR.forEach(function(f){
        nm[f]=c[f]||'';
        if(String(m[f]||'')!==nm[f]) up[P+f]=nm[f];
      });
      var mSid=c.mgrSid||name2sid[c.mgr]||'', has=!!(mSid||c.mgr);
      nm.mgr=mSid+'/'+(c.mgr||''); nm.subs=(c.subs||[]).join('|');
      if(String(m.mgr||'')!==nm.mgr){
        up[P+'mgr_main']=has?{sid:mSid,name:c.mgr||''}:(ceo?{sid:ceo.sid,name:ceo.name}:{sid:'',name:''});
        up[P+'pe_nomgr']=has?null:true;             // 담당 미지정 → 대표에게 배치하고 표시
      }
      if(String(m.subs||'')!==nm.subs)
        up[P+'mgr_subs']=(c.subs||[]).map(function(n){return {sid:name2sid[n]||'',name:n};});
      if(JSON.stringify(m)!==JSON.stringify(nm)) up[P+'pe_m']=nm;
    });

    // ③ 신규 자동 생성 — pe_seen에 없는 건만 (사용자가 지운 건은 seen에 남아 되살아나지 않는다)
    var made=0;
    cand.forEach(function(c){
      var t=c.ref.type, rk=safeKey(c.ref.id);
      if(seen[t]&&seen[t][rk]) return;
      up[NS+'/pe_seen/'+t+'/'+rk]=true;
      if(byRef[t+'|'+rk]) return;                   // 이미 수동으로 가져온 건
      var mSid=c.mgrSid||name2sid[c.mgr]||'', has=!!(mSid||c.mgr);
      var m={}; PE_MIRROR.forEach(function(f){ m[f]=c[f]||''; });
      m.mgr=mSid+'/'+(c.mgr||''); m.subs=(c.subs||[]).join('|');
      var rec={ no:c.no||(S.year+'-'+c.cat+'-PE'), cat:c.cat, company:c.company||'', client:c.client||'',
        officer:c.officer||'', title:c.title||'', due:c.due||'', start:c.start||'', status:'진행중',
        brief:c.brief||'',                        // 업무 요약 씨앗 — 이후에는 pesync가 양방향으로 맞춘다
        co_id:c.co_id||'',                        // pe_m에만 있고 항목에 없으면 이후 미러가 건너뛴다
        mgr_main:has?{sid:mSid,name:c.mgr||''}:(ceo?{sid:ceo.sid,name:ceo.name}:{sid:'',name:''}),
        mgr_subs:(c.subs||[]).map(function(n){return {sid:name2sid[n]||'',name:n};}),
        src:'puerp', ref:c.ref, pe_auto:true, pe_m:m, created_at:new Date().toISOString() };
      if(!has) rec.pe_nomgr=true;
      up[NS+'/items/'+c.pid]=rec; made++;
    });

    if(!Object.keys(up).length){ peState.at=new Date().toISOString(); return; }
    return fbDb.ref().update(up).then(function(){
      peState.at=new Date().toISOString(); peState.n=made;
      if(made) toast('🔗 푸른이알피에서 '+made+'건 자동 연동');
    });
  }).catch(function(e){ peState.err=e&&e.message||'동기화 실패'; console.warn('[peAutoSync]',e); })
    .then(function(){ _peBusy=false; });
}

/* ── 기존 업무 ↔ 푸른이알피 짝짓기 ───────────────────────────────────
   엑셀에서 옮겨 온 업무(src:'excel')는 ref가 없어 동기화 대상이 아니다.
   같은 사건이 푸른이알피에도 있으면 짝을 지어 연동시킨다 — 새로 만들지 않고
   기존 항목에 ref를 붙이므로, 그동안 쌓인 주간 기록과 노트가 그대로 살아 있다. */
function _mtScore(it,c){
  var a=_normCo(it.company), b=_normCo(c.company);
  if(!a||!b||a!==b) return 0;                     // 기업명이 다르면 후보 아님
  var s=50;
  var t1=String(it.title||'').replace(/\s/g,''), t2=String(c.title||'').replace(/\s/g,'');
  if(t1&&t2){
    if(t1===t2) s+=40;
    else if(t1.indexOf(t2)>=0||t2.indexOf(t1)>=0) s+=25;
    else {
      var n=0; for(var i=0;i<t1.length-1;i++){ if(t2.indexOf(t1.substr(i,2))>=0) n++; }
      s+=Math.min(20,Math.round(n/Math.max(1,t1.length-1)*20));
    }
  }
  if(it.cat&&c.cat&&it.cat===c.cat) s+=10;
  var c1=String(it.client||'').trim(), c2=String(c.client||'').trim();
  if(c1&&c2&&c1===c2) s+=10;
  return s;
}
// 연동 안 된 기존 업무 → 푸른이알피 후보 (점수순)
function matchPairs(){
  var cand=puerpCandidates(); if(!cand) return null;
  var used={};
  allItems().forEach(function(it){ if(peLinked(it)) used[it.ref.type+'|'+safeKey(it.ref.id)]=1; });
  var free=cand.filter(function(c){ return !used[c.ref.type+'|'+safeKey(c.ref.id)]; });
  var out=[];
  openItems().forEach(function(it){
    if(peLinked(it)) return;
    var hits=free.map(function(c){ return {c:c,s:_mtScore(it,c)}; })
      .filter(function(x){ return x.s>0; })
      .sort(function(a,b){ return b.s-a.s; }).slice(0,3);
    if(hits.length) out.push({it:it,hits:hits});
  });
  out.sort(function(a,b){ return b.hits[0].s-a.hits[0].s
    ||String(_mgrOf(a.it)).localeCompare(String(_mgrOf(b.it)),'ko'); });
  return out;
}
