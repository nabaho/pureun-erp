function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
// 인라인 핸들러의 JS 문자열 리터럴에 값을 넣을 때 — JS 이스케이프 후 HTML 이스케이프.
// esc()만 쓰면 작은따옴표가 안 막혀서 이름에 ' 이 있으면 핸들러가 깨진다.
function escJ(s){return esc(String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));}
// Firebase 키 금지문자 + 인라인 핸들러를 깨뜨리는 문자를 근원에서 제거
function safeKey(s){return String(s==null?'':s).replace(/[.#$/\[\]\u0000-\u001F\u007F'"`\\\s]/g,'_');}
function $(id){return document.getElementById(id);}
function qp(k){try{return new URLSearchParams(location.search).get(k)||'';}catch(e){return '';}}
function pad(n){return (n<10?'0':'')+n;}
function ymd(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function md(s){if(!s)return '';var p=String(s).split('-');return p.length===3?(+p[1])+'/'+(+p[2]):s;}
function todayStr(){return ymd(new Date());}
function rid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* ── 주(週) 계산 ── */
function mondayOf(d){d=new Date(d);d.setHours(0,0,0,0);var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return d;}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function weekKeyOf(mon){var thu=addDays(mon,3);var y=thu.getFullYear();var jan4=new Date(y,0,4);
  var wk=1+Math.round((mondayOf(thu)-mondayOf(jan4))/(7*86400000));return y+'-W'+pad(wk);}
function weekYear(wk){return wk.slice(0,4);}
function mondayOfKey(wk){var m=/^(\d{4})-W(\d{2})$/.exec(wk);if(!m)return mondayOf(new Date());
  return addDays(mondayOf(new Date(+m[1],0,4)),(+m[2]-1)*7);}
// 그 달 1일이 속한 주 = 1주차 (한국 통상 표기)
function weekLabel(mon){var fri=addDays(mon,4);
  var first=new Date(mon.getFullYear(),mon.getMonth(),1);
  var wno=Math.round((mon-mondayOf(first))/(7*86400000))+1;
  return (mon.getMonth()+1)+'월 '+wno+'주 · '+(mon.getMonth()+1)+'.'+mon.getDate()+' ~ '+(fri.getMonth()+1)+'.'+fri.getDate();}
function curMonday(){return mondayOf(new Date());}
function isCurWeek(){return ymd(S.week)===ymd(curMonday());}
function inWeek(dateStr,mon){var d=new Date(dateStr+'T00:00:00');return d>=mon&&d<addDays(mon,7);}
function dday(dateStr){if(!dateStr)return null;var t=new Date();t.setHours(0,0,0,0);
  return Math.round((new Date(dateStr+'T00:00:00')-t)/86400000);}
function ddayHTML(dateStr,label){var n=dday(dateStr);if(n===null)return '<span class="muted">—</span>';
  var cls=n<0?'':n<=3?'':n<=7?' soon':' ok';var txt=n<0?('D+'+(-n)):n===0?'D-Day':('D-'+n);
  return '<span class="due'+(n<=3?'':cls)+'">'+txt+(label?' · '+esc(label):'')+'</span>';}

try{
  firebase.initializeApp(FB_CONFIG);

}catch(e){ $('root').innerHTML='<div class="gate">초기화 실패: '+esc(e.message)+'</div>'; }
function gate(){ $('root').innerHTML='<div class="gate"><h2>로그인이 필요합니다</h2><p><a href="'+PORTAL_URL+'">푸른 포털에서 로그인</a> 후 다시 들어와 주세요.</p></div>'; }

function start(){
  S.week=curMonday();
  $('root').innerHTML=shell();
  initTop();
  try{ history.replaceState({view:'my'}, ''); }catch(e){}
  resolveMe().then(function(){
    fbDb.ref(NS+'/items').on('value',function(snap){ items=snap.val()||{};
      if(appHasFocus()){ S._pend=true; return; } route();
      if(!S._hashDone){ S._hashDone=1; openFromHash(); }   // 푸른이알피 → #item= 딥링크
    },function(err){ $('app').innerHTML='<div class="panel"><h2 style="color:var(--danger)">읽기 권한 오류</h2><p class="muted">'
      +esc(err.message)+'</p><p class="muted">Firebase 규칙에 work_erp 블록이 필요합니다 (관리자에게 문의).</p></div>'; });
    watchWeek();
    fbDb.ref(NS+'/leaving').on('value',function(snap){ leaving=snap.val()||{};
      if(appHasFocus()){ S._pend=true; return; } route(); });
    fbDb.ref(NS+'/pesync').on('value',function(snap){ pesync=snap.val()||{};
      if(appHasFocus()){ S._pend=true; return; }
      if(S.view==='archive') route(); },function(){ pesync={}; });
    peWatch();                                   // 푸른이알피 등록 → 자동 연동
  });
  document.addEventListener('focusout',function(){ setTimeout(function(){
    if(S._pend&&!appHasFocus()){ S._pend=false; route(); } },150); });
}
function appHasFocus(){ var ae=document.activeElement,app=$('app');
  return !!(ae&&app&&app.contains(ae)&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)); }

/* 현재 보는 주 live 구독 */
function watchWeek(){
  var wk=weekKeyOf(S.week);
  if(_watchWkKey===wk) return;
  if(_watchWkRef){ _watchWkRef.off(); }
  _watchWkKey=wk;
  _watchWkRef=fbDb.ref(NS+'/logs/'+weekYear(wk)+'/'+wk);
  _watchWkRef.on('value',function(snap){ wkCache[wk]=snap.val()||{}; wkLoaded[wk]=true;
    if(appHasFocus()){ S._pend=true; return; }
    if(S.view==='my'||S.view==='team') route();
  },function(){ wkCache[wk]=wkCache[wk]||{}; wkLoaded[wk]=true; });
}
function loadWeekOnce(wk){
  if(wkLoaded[wk]) return Promise.resolve(wkCache[wk]||{});
  return fbDb.ref(NS+'/logs/'+weekYear(wk)+'/'+wk).once('value').then(function(s){
    wkCache[wk]=s.val()||{}; wkLoaded[wk]=true; return wkCache[wk]; });
}

/* ── 내가 누구인지 (푸른이알피 재직자 연결) ── */
function _normStaff(v){
  if(!v) return []; if(!Array.isArray(v)) v=Object.keys(v).map(function(k){return v[k];});
  var seen={};
  return v.filter(function(u){return u&&u.sid;})
    .filter(function(u){return !u.status||u.status==='active'||(u.status==='leave'&&u.leaveLoginAllowed===true);})
    .filter(function(u){ if(seen[u.sid])return false; seen[u.sid]=1; return true; })
    .map(function(u){return {sid:u.sid,name:u.name||u.sid,title:u.title||u.role||''};})
    .sort(function(a,b){return String(a.sid||'').localeCompare(String(b.sid||''),'en',{numeric:true});});
}
function loadStaff(){
  if(_staffCache) return Promise.resolve(_staffCache);
  try{ var raw=localStorage.getItem('pureun_v6_user_accounts');
    if(raw){ var a=_normStaff(JSON.parse(raw)); if(a.length){ _staffCache=a; return Promise.resolve(a); } } }catch(e){}
  return fbDb.ref('data/user_accounts/v').once('value').then(function(s){ _staffCache=_normStaff(s.val()); return _staffCache; })
    .catch(function(){ _staffCache=[]; return _staffCache; });
}
function resolveMe(){
  return loadStaff().then(function(list){
    var uName=qp('user');
    var fu=firebase.auth().currentUser;
    var mail=(fu&&fu.email||'').toLowerCase(); var local=mail.split('@')[0].replace(/[^a-z0-9]/g,'');
    var me=null;
    var saved=localStorage.getItem('work_me_sid');
    if(saved) me=list.filter(function(x){return x.sid===saved;})[0]||null;
    if(!me&&local) me=list.filter(function(x){return String(x.sid||'').toLowerCase().replace(/[^a-z0-9]/g,'')===local;})[0]||null;
    if(!me&&uName) me=list.filter(function(x){return x.name===uName;})[0]||null;
    S.me=me||{sid:'',name:uName||'미지정',title:''};
    S.vsid=S.me.sid; S.vname=S.me.name;          // 열람 대상 기본값 = 본인
    _setTopUser(S.me.name,S.me.title||qp('role'));
  });
}
// ⚠ 열람 대상과 신분은 별개. 아래는 "누구 업무를 보는가"만 바꾼다 —
//    기록 작성자(by/byName)는 항상 로그인한 본인(S.me)으로 남는다.
function setView(sid,name){ S.vsid=sid||''; S.vname=name||''; S.f=null; route(); }
function viewer(){ return {sid:S.vsid,name:S.vname}; }
function viewingSelf(){ return (S.vsid||'')===(S.me&&S.me.sid||'')&&(S.vname||'')===(S.me&&S.me.name||''); }
// 담당자 선택 목록 = 재직자 + 실제 업무를 갖고 있는 사람(퇴직자 포함)
function ownerOptions(){
  var seen={}, out=[];
  (_staffCache||[]).forEach(function(u){ if(!seen[u.name]){ seen[u.name]=1; out.push({sid:u.sid,name:u.name,active:1}); } });
  openItems().forEach(function(it){
    var m=it.mgr_main||{}; if(!m.name||seen[m.name]) return;
    seen[m.name]=1; out.push({sid:m.sid||'',name:m.name,active:0});
  });
  return out;
}
function loadCompanies(){
  if(_coCache) return _coCache;
  var names=[];
  try{ var raw=localStorage.getItem('pureun_v6_companies');
    if(raw){ var v=JSON.parse(raw); var arr=Array.isArray(v)?v:Object.keys(v).map(function(k){return v[k];});
      names=arr.map(function(c){return c&&c.name;}).filter(Boolean); } }catch(e){}
  _coCache=names; return names;
}

/* ── 공통 편의 ── */
function toast(msg,type){
  var t=$('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.className='show'+(type==='err'?' err':(type==='warn'?' warn':''));
  clearTimeout(window._toastT); window._toastT=setTimeout(function(){ t.className=''; }, type==='err'?3200:1600);
}
function showModal(html){
  closeM();
  var m=document.createElement('div'); m.id='modalbg';
  m.style.cssText='position:fixed;inset:0;background:rgba(20,30,50,.35);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px';
  m.onclick=function(e){ if(e.target===m) closeM(); };
  m.innerHTML='<div style="background:#fff;border-radius:14px;padding:20px 22px;max-width:600px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)">'+html+'</div>';
  document.body.appendChild(m);
}
function closeM(){ var m=$('modalbg'); if(m) m.remove(); }
function confirmM(msg,opts){
  opts=opts||{};
  return new Promise(function(resolve){
    var m=document.createElement('div'); m.id='confirmbg';
    m.style.cssText='position:fixed;inset:0;background:rgba(20,30,50,.4);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
    var danger=opts.danger?'#b91c1c':'var(--acc)';
    m.innerHTML='<div style="background:#fff;border-radius:14px;padding:22px 24px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.28)">'
      +'<div style="font-size:14px;line-height:1.6;white-space:pre-line;margin-bottom:18px">'+esc(msg)+'</div>'
      +'<div class="row" style="justify-content:flex-end;gap:8px"><button id="cf-no">'+esc(opts.cancel||'취소')+'</button>'
      +'<button id="cf-yes" class="primary" style="background:'+danger+'">'+esc(opts.ok||'확인')+'</button></div></div>';
    document.body.appendChild(m);
    function done(v){ m.remove(); document.removeEventListener('keydown',key,true); resolve(v); }
    function key(e){ if(e.key==='Escape'){e.stopPropagation();done(false);} else if(e.key==='Enter'){e.stopPropagation();done(true);} }
    m.querySelector('#cf-yes').onclick=function(){done(true);};
    m.querySelector('#cf-no').onclick=function(){done(false);};
    m.onclick=function(e){ if(e.target===m) done(false); };
    document.addEventListener('keydown',key,true);
    var y=m.querySelector('#cf-yes'); if(y)y.focus();
  });
}
function loadingHTML(msg){ return '<div class="loading"><span class="spin"></span>'+esc(msg||'불러오는 중…')+'</div>'; }
function _inTyping(e){ var t=e.target||document.activeElement;
  return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable); }
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if($('confirmbg'))return;
    if($('modalbg')){ closeM(); return; }
    if($('calpop')){ closeCal(); return; }
    if(S.drawerId){ closeDrawer(); return; }
    var t=document.activeElement;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')){ t.blur(); return; }
    if(S.view!=='my'){ goBack(); }
    return;
  }
  if(e.key==='/'&&!_inTyping(e)){ e.preventDefault(); var q=$('qb'); if(q)q.focus(); return; }
  if((e.key==='n'||e.key==='N')&&!_inTyping(e)&&!$('modalbg')&&!$('confirmbg')){ e.preventDefault(); itemModal(); return; }
  if(e.key==='Backspace'&&!_inTyping(e)){ e.preventDefault();
    if($('modalbg')||$('confirmbg'))return; if(S.drawerId){closeDrawer();return;} if(S.view!=='my')goBack(); return; }
});

/* ── 라우팅 ── */
function go(v){ S.view=v; S.f=null; S.q=''; try{history.pushState({view:v},'');}catch(e){} route(); }
function goBack(){ if(history.length>1) history.back(); else { S.view='my'; route(); } }
window.addEventListener('popstate',function(ev){ var st=ev.state; S.view=(st&&st.view)||'my'; route(); });
function route(){
  ['my','team','stats','ho','archive'].forEach(function(v){var n=$('nav-'+v);if(n)n.className='sitem'+(S.view===v?' on':'');});
  var crumbs={my:'내 업무',team:'팀 전체',stats:'업무량',ho:'인수인계',archive:'보관함'};
  var c=$('crumb'); if(c)c.textContent=crumbs[S.view]||'업무시트';
  var qw=$('qwrap'); if(qw)qw.style.display=(S.view==='my'||S.view==='team')?'':'none';
  var cm=$('cnt-my'); if(cm)cm.textContent=viewOpen().length||'';
  var ca=$('cnt-ar'); if(ca)ca.textContent=allItems().filter(function(it){return it.state==='done';}).length||'';
  var ch=$('cnt-ho'); if(ch){ var n2=hoBadgeCount(); ch.textContent=n2||''; ch.style.color=n2?'#c0392b':''; ch.style.fontWeight=n2?'800':''; }
  if(S.view==='team') renderTeam();
  else if(S.view==='stats') renderStats();
  else if(S.view==='ho') renderHo();
  else if(S.view==='archive') renderArchive();
  else { S.view='my'; renderMy(); }
  if(S.drawerId) renderDrawer();
}
function isAdmin(){ return !!(S.me&&/대표/.test(S.me.title||''))||/대표/.test(qp('role')||''); }
function noteDone(it){ var n=it.ho_note||{};
  return !!String((n.sit||'')+(n.todo||'')+(n.ppl||'')+(n.warn||'')+(n.files||'')).trim(); }
function hoPendingToMe(){ return openItems().filter(function(it){ return it.ho&&!it.ho.confirmed&&it.ho.to&&
  ((S.me.sid&&it.ho.to.sid===S.me.sid)||it.ho.to.name===S.me.name); }); }
function hoOverdue(){ var lim=Date.now()-HO_OVERDUE_DAYS*86400000;
  return openItems().filter(function(it){ return it.ho&&!it.ho.confirmed&&it.ho.at&&new Date(it.ho.at).getTime()<lim; }); }
function activeLeavings(){ return Object.keys(leaving).map(function(k){var l=leaving[k];l._sid=k;return l;})
  .filter(function(l){return !l.done;}).sort(function(a,b){return (a.date||'').localeCompare(b.date||'');}); }
function hoBadgeCount(){
  var n=hoPendingToMe().length;                    // 내가 받을 인수 대기
  if(isAdmin()) n+=activeLeavings().length+hoOverdue().length;   // 대표: 부재 진행 + 확인 지연
  return n;
}
// 부재자 기준 인수인계 대상: 아직 내 담당이거나, 나에게서 넘어간 건
function leavingItems(sid,name){
  return openItems().filter(function(it){
    var m=it.mgr_main||{};
    if((sid&&m.sid===sid)||(name&&m.name===name)) return true;
    return !!(it.ho&&it.ho.from&&((sid&&it.ho.from.sid===sid)||(name&&it.ho.from.name===name)));
  });
}

/* ── 데이터 접근 ── */
function allItems(){ return Object.keys(items).map(function(k){var it=items[k];it._id=k;return it;}); }
function openItems(){ return allItems().filter(function(it){return it.state!=='done';}); }
function isOf(it,who){ if(!who) return false;
  var m=it.mgr_main||{}; if(who.sid&&m.sid===who.sid) return true; if(who.name&&m.name===who.name) return true;
  return (it.mgr_subs||[]).some(function(s){return (who.sid&&s.sid===who.sid)||(who.name&&s.name===who.name);});
}
function isMine(it){ return isOf(it,S.me); }              // 로그인한 본인
function myOpen(){ return openItems().filter(isMine); }
function viewOpen(){ return openItems().filter(function(it){return isOf(it,viewer());}); }   // 화면에서 보고 있는 사람
function wkLogsOf(itemId,wk){ wk=wk||weekKeyOf(S.week); var w=wkCache[wk]||{}; var o=w[itemId]||{};
  return Object.keys(o).map(function(k){var l=o[k];l._id=k;return l;})
    .sort(function(a,b){return (b.d||'').localeCompare(a.d||'')||(b.at||'').localeCompare(a.at||'');}); }
/* ── 검색·필터 공통 ── */
function matchQ(it,q){
  if(!q) return true; q=String(q).toLowerCase();
  return [it.company,it.client,it.title,it.no,it.officer,it.cat,
          (it.mgr_main&&it.mgr_main.name),(it.last&&it.last.t)]
    .some(function(s){ return String(s||'').toLowerCase().indexOf(q)>=0; });
}
// 검색창: 입력 중 재렌더로 포커스가 날아가지 않게 디바운스 후 커서 복원
var _qT=null;
function onQ(v,fn){
  S.q=v; clearTimeout(_qT);
  _qT=setTimeout(function(){
    fn();
    var el=$('qbox'); if(el){ el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(e){} }
  },260);
}
function qBox(fn,ph){
  return '<input id="qbox" value="'+esc(S.q||'')+'" placeholder="'+esc(ph||'🔍 검색')+'" '
    +'oninput="onQ(this.value,'+fn+')" title="기업명·업무명·의뢰인·관리번호로 검색">'
    +(S.q?'<span class="chipbtn" onclick="S.q=\'\';'+fn+'()" title="검색 해제">✕</span>':'');
}
function catSelect(cur,handler){
  return '<select onchange="'+handler+'">'
    +'<option value="">구분 전체</option>'
    +CAT_LIST.map(function(c){return '<option'+(cur===c?' selected':'')+'>'+c+'</option>';}).join('')+'</select>';
}
function tdNo(n){ return '<td class="rowno">'+n+'</td>'; }
function catBadge(cat){ var c=CATS[cat]||CATS['기타'];
  return '<span class="badge" style="background:'+c[0]+';color:'+c[1]+'">'+esc(cat||'기타')+'</span>'; }
// 푸른이알피 연동 이상만 표시한다 (정상 연동은 종료 버튼의 🔗로 이미 드러난다)
function peFlag(it){
  var h='';
  if(it.pe_gone) h+=' <span style="color:var(--danger);font-weight:800;font-size:10px" title="푸른이알피에서 원본이 삭제되었습니다. 이 업무와 기록은 그대로 보존됩니다.">⚠ 원본 없음</span>';
  if(it.pe_nomgr) h+=' <span style="color:var(--warn);font-weight:800;font-size:10px" title="푸른이알피에 주담당이 없어 대표에게 배치했습니다. 푸른이알피에서 담당을 지정하면 자동으로 옮겨집니다.">담당 미지정</span>';
  return h;
}
function stChip(st,id,active){ var s=STATUSES.filter(function(x){return x[0]===st;})[0]||STATUSES[0];
  var dim=active===false?'opacity:.35;':'';
  return '<span class="status" style="background:'+s[1]+';color:'+s[2]+';'+dim+'"'+(id?' onclick="cycleStatus(\''+id+'\');event.stopPropagation()"':'')+'>'+esc(s[0])+'</span>'; }
function itemDue(it){ return (it.next&&it.next.date)||it.due||''; }

/* ── 기록 쓰기 (일 단위 저장 + 주 묶음 + 건별 사본 + last 캐시) ── */
function addLog(itemId,text,dateStr,kind){
  text=(text||'').trim(); if(!text){ toast('내용을 입력하세요','warn'); return Promise.resolve(false); }
  dateStr=dateStr||todayStr();
  var wk=weekKeyOf(mondayOf(new Date(dateStr+'T00:00:00')));
  var y=weekYear(wk), lid=rid('L');
  var log={d:dateStr,t:text,by:(S.me&&S.me.sid)||'',byName:(S.me&&S.me.name)||'',at:new Date().toISOString()};
  if(kind) log.k=kind;
  var up={};
  up[NS+'/logs/'+y+'/'+wk+'/'+itemId+'/'+lid]=log;
  up[NS+'/itemlogs/'+itemId+'/'+lid]=Object.assign({w:wk},log);
  var it=items[itemId];
  if(it&&(!it.last||String(it.last.d||'')<=dateStr)) up[NS+'/items/'+itemId+'/last']={d:dateStr,t:text};
  return fbDb.ref().update(up).then(function(){
    if(!wkCache[wk])wkCache[wk]={}; if(!wkCache[wk][itemId])wkCache[wk][itemId]={};
    wkCache[wk][itemId][lid]=log;
    if(itemLogsCache[itemId]) itemLogsCache[itemId][lid]=Object.assign({w:wk},log);
    if(it&&(!it.last||String(it.last.d||'')<=dateStr)) it.last={d:dateStr,t:text};
    toast('기록 저장됨'); return true;
  }).catch(function(e){ toast('저장 실패: '+e.message,'err'); return false; });
}
function delLog(itemId,lid){
  confirmM('이 기록을 삭제할까요?',{ok:'삭제',danger:true}).then(function(ok){ if(!ok)return;
    var l=(itemLogsCache[itemId]||{})[lid]; var wk=l&&l.w;
    var up={};
    up[NS+'/itemlogs/'+itemId+'/'+lid]=null;
    if(wk) up[NS+'/logs/'+weekYear(wk)+'/'+wk+'/'+itemId+'/'+lid]=null;
    fbDb.ref().update(up).then(function(){
      if(itemLogsCache[itemId]) delete itemLogsCache[itemId][lid];
      if(wk&&wkCache[wk]&&wkCache[wk][itemId]) delete wkCache[wk][itemId][lid];
      // last 재계산
      var rest=Object.keys(itemLogsCache[itemId]||{}).map(function(k){return itemLogsCache[itemId][k];})
        .filter(function(x){return !x.k;})
        .sort(function(a,b){return (b.d||'').localeCompare(a.d||'');});
      var nl=rest[0]?{d:rest[0].d,t:rest[0].t}:null;
      fbDb.ref(NS+'/items/'+itemId+'/last').set(nl);
      if(items[itemId]) items[itemId].last=nl;
      toast('삭제됨'); renderDrawer(); route();
    }).catch(function(e){ toast('삭제 실패: '+e.message,'err'); });
  });
}
// 저장 성공 여부를 반환한다. 호출부는 반드시 if(!ok)return; 으로 가드할 것 —
// 예전엔 실패를 삼키고 resolve 해서 "저장 실패" 토스트와 "✅ 완료"가 같이 뜨는 문제가 있었다.
function patchItem(id,obj){ return fbDb.ref(NS+'/items/'+id).update(obj)
  .then(function(){ Object.assign(items[id]||{},obj); return true; })
  .catch(function(e){ toast('저장 실패: '+e.message,'err'); return false; }); }

/* ── 내 업무 화면 ── */
function focusCounts(){
  var v=viewer(), mine=viewOpen(), wk=weekKeyOf(S.week), today=todayStr();
  var due=mine.filter(function(it){var n=dday(itemDue(it));return n!==null&&n<=7;});
  var nolog=mine.filter(function(it){return wkLogsOf(it._id,wk).length===0;});
  var next=mine.filter(function(it){return it.next&&it.next.date&&it.next.date<=today;});
  var done=allItems().filter(function(it){return it.state==='done'&&isOf(it,v)&&it.done_date&&inWeek(it.done_date,S.week);});
  return {due:due,nolog:nolog,next:next,done:done};
}
function renderMy(){
  var app=$('app'); if(!app)return;

  var opts=ownerOptions();
  var h='<div class="row" style="flex-wrap:wrap">'

    +'title="담당자를 골라 그 사람의 업무를 봅니다" style="padding:4px 8px;border:1px solid var(--line);border-radius:7px;font-size:12px;color:var(--sub)">'
    +opts.map(function(u){
        return '<option value="'+esc(u.sid)+'" data-n="'+esc(u.name)+'"'+(u.name===S.vname?' selected':'')+'>'
          +esc(u.name)+(u.active?'':' (퇴직)')+'</option>';
      }).join('')
    +'</select>'
    +(self?'':'<span class="chipbtn" onclick="setView(S.me.sid,S.me.name)" title="내 업무로 돌아가기">↩ 내 업무</span>'
      +'<span class="lvtag">열람 중 · 기록하면 작성자는 '+esc((S.me&&S.me.name)||'')+'</span>')
    +'<span style="flex:1"></span>'
    +'<span class="wknav" onclick="shiftWeek(-1)">‹</span>'
    +'<span class="wkpill" id="wkpill" onclick="openCal()">📅 '+esc(weekLabel(S.week))+' ▾</span>'
    +'<span class="wknav" onclick="shiftWeek(1)">›</span>'
    +'</div>';
  // 요약 1줄 — 숫자 칩을 누르면 그 건만 본다 (예전 카드 5개)
  h+='<div class="statbar">'
    +'진행 <b>'+mine.length+'</b>건'

    +sbHTML('due','🔥 임박 D-7',fc.due.length,'dg')
    +sbHTML('nolog','✍ 이번 주 미기록',fc.nolog.length,'am')
    +sbHTML('next','📌 다음 할 일',fc.next.length,'')
    +(recv.length?sbHTML('recv','📥 인수 확인',recv.length,'am'):'')
    +'</div>';
  // 보고 있는 사람의 부재(퇴사·휴직·연차) 예정 → 인수인계 진행 배너
  var myLv=S.vsid&&(leaving[S.vsid]||null);
  if(myLv&&!myLv.done){
    var miss=mine.filter(function(it){return !noteDone(it);}).length;
    var dd2=dday(myLv.date);
    h+='<div class="histbanner">🚪 <b>'+esc(myLv.type||'부재')+' 예정 '+(dd2===null?'':(dd2>=0?'D-'+dd2:'지남'))+'</b>'
      +' — 인수인계 노트 미작성 <b>'+miss+'건</b> / 진행 '+mine.length+'건. 각 업무를 열어 📦 노트를 작성하세요.'
      +'<span class="back" onclick="go(\'ho\')">인수인계 현황 →</span></div>';
  }
  if(!isCurWeek()){
    h+='<div class="histbanner">🕘 <b>'+esc(weekLabel(S.week))+'</b> 열람 중 — 이 주에 기록하면 그 주 기록으로 저장됩니다 (실제 입력일 병기)'
      +'<span class="back" onclick="setWeek(null)">이번 주로 →</span></div>';

}
// 컴팩트 요약 칩 — 누르면 그 건만 보고, 다시 누르면 해제 (예전 .fcard와 같은 동작)
function sbHTML(key,label,val,cls){
  return '<span class="sb '+cls+(S.f===key?' on':'')+'" onclick="setFocus(\''+key+'\')" '
    +'title="클릭하면 이 건만 봅니다 (다시 누르면 해제)">'+label+' '+val+'</span>';

function setFocus(k){ S.f=(S.f===k)?null:k; renderMy(); }
function setWeek(mon){ S.week=mon||curMonday(); S.f=null; watchWeek(); closeCal(); route(); }
function shiftWeek(n){ setWeek(addDays(S.week,n*7)); }
function rowHTML(it,no){

}
function wkKey(e,inp){
  if(e.key!=='Enter')return;
  e.preventDefault();
  var id=inp.getAttribute('data-id'); var txt=inp.value;
  if(!txt.trim())return;
  var dateStr=isCurWeek()?todayStr():ymd(addDays(S.week,4));   // 과거 주 보완은 그 주 금요일 날짜로
  inp.value='';
  addLog(id,txt,dateStr).then(function(ok){ if(!ok){inp.value=txt;return;}
    // 다음 행 입력으로 이동 (엑셀 Enter↓)
    var all=[].slice.call(document.querySelectorAll('.wkin'));
    var i=all.indexOf(inp);
    route();
    setTimeout(function(){ var all2=[].slice.call(document.querySelectorAll('.wkin'));
      var nx=all2[Math.min(i+1,all2.length-1)]; if(nx)nx.focus(); },50);
  });
}
function cycleStatus(id){
  var it=items[id]; if(!it)return;
  var idx=STATUSES.findIndex(function(s){return s[0]===(it.status||'진행중');});
  var next=STATUSES[(idx+1)%STATUSES.length][0];
  patchItem(id,{status:next}).then(function(ok){ if(!ok)return; route(); });
}
/* ── 업무 종료 ── 푸른이알피에서 가져온 건이면 그쪽 사건도 함께 종료할지 묻는다 */

function setState(id,done,alsoPe,msg){
  var it=items[id]||{}, now=new Date().toISOString();
  var patch={ state:done?'done':null, done_date:done?todayStr():null,
    status:done?'완료':'진행중', state_at:now };
  if(peLinked(it)&&alsoPe!==undefined) patch.pe_nosync=alsoPe?null:true;
  var up={}; Object.keys(patch).forEach(function(k){ up[NS+'/items/'+id+'/'+k]=patch[k]; });
  return fbDb.ref().update(up).then(function(){
    Object.assign(items[id]||{},patch);
    var linked=peLinked(it)&&!patch.pe_nosync;
    if(linked) addLog(id,(done?'업무 종료':'업무 재개')+' — 푸른이알피 '+(PE_KIND[it.ref.type]||'')+' 동기화 대상',todayStr(),'ho');
    closeM(); toast(msg+(linked?' · 푸른이알피와 동기화 예정':''));
    if(done&&S.drawerId===id) closeDrawer();
    route();
  }).catch(function(e){ toast('실패: '+e.message,'err'); route(); });
}
function doComplete(id,alsoPe){ return setState(id,true,alsoPe,'✅ 종료 — 보관함으로 이동'); }

var _qbPick=0,_qbMatches=[];
function qbParse(){
  var v=$('qb').value; var sp=v.indexOf(' ');
  var key=sp<0?v:v.slice(0,sp); var rest=sp<0?'':v.slice(sp+1);
  return {key:key.trim(),rest:rest.trim()};
}
function qbSug(){
  var p=qbParse(); var box=$('qsug');
  if(!p.key){ box.style.display='none'; _qbMatches=[]; return; }
  var pool=myOpen();
  _qbMatches=pool.filter(function(it){
    return (it.company||'').indexOf(p.key)>=0||(it.title||'').indexOf(p.key)>=0||(it.client||'').indexOf(p.key)>=0;
  }).slice(0,5);
  _qbPick=0;
  if(!_qbMatches.length){ box.style.display='none'; return; }
  box.innerHTML=_qbMatches.map(function(it,i){
    return '<div class="qi'+(i===_qbPick?' pick':'')+'" onmousedown="qbGo('+i+')">'+catBadge(it.cat)
      +' <b>'+esc(it.company||it.client||'')+'</b> <span class="muted">'+esc(it.title||'')+'</span>'
      +'<small>'+(i===_qbPick?'Enter로 기록':'')+'</small></div>'; }).join('');
  box.style.display='';
}
function qbKey(e){
  if(e.key==='ArrowDown'){ e.preventDefault(); if(_qbMatches.length){_qbPick=(_qbPick+1)%_qbMatches.length; qbRepaint();} return; }
  if(e.key==='ArrowUp'){ e.preventDefault(); if(_qbMatches.length){_qbPick=(_qbPick-1+_qbMatches.length)%_qbMatches.length; qbRepaint();} return; }
  if(e.key==='Escape'){ $('qb').blur(); $('qsug').style.display='none'; return; }
  if(e.key==='Enter'){ e.preventDefault(); qbGo(_qbPick); }
}
function qbRepaint(){ var els=$('qsug').children;
  for(var i=0;i<els.length;i++){ els[i].className='qi'+(i===_qbPick?' pick':''); els[i].querySelector('small').textContent=(i===_qbPick?'Enter로 기록':''); } }
function qbGo(i){
  var it=_qbMatches[i]; var p=qbParse();
  if(!it){ toast('일치하는 업무가 없습니다','warn'); return; }
  if(!p.rest){ $('qsug').style.display='none'; openDrawer(it._id); $('qb').value=''; return; }
  addLog(it._id,p.rest,todayStr()).then(function(ok){ if(!ok)return;
    $('qb').value=''; $('qsug').style.display='none'; route(); });
}

function openCal(){

  S.calMon=new Date(S.week.getFullYear(),S.week.getMonth(),1);
  var pop=document.createElement('div'); pop.id='calpop';
  var pill=$('wkpill'); var r=pill.getBoundingClientRect();
  pop.style.top=(r.bottom+8+window.scrollY)+'px';
  pop.style.left=Math.max(10,Math.min(window.innerWidth-320,r.left-40))+'px';
  document.body.appendChild(pop);

}

    mons.forEach(function(mo){ var w=wkCache[weekKeyOf(mo)]||{};
      Object.keys(w).forEach(function(iid){ if(!myIds[iid])return;
        Object.keys(w[iid]).forEach(function(lid){ var d2=w[iid][lid].d; if(d2)dots[d2]=(dots[d2]||0)+1; }); }); });
    var dues={}; myOpen().forEach(function(it){ var d3=itemDue(it); if(d3)dues[d3]=1; });

      +'<span class="today" onclick="setWeek(null)">오늘로</span></div>';
    h+='<table><tr>'+WD.map(function(w2,i){return '<th'+(i>=5?' class="we"':'')+'>'+w2+'</th>';}).join('')+'</tr>';

      for(var i=0;i<7;i++){ var day=addDays(mo,i); var ds=ymd(day);

    pop.innerHTML=h;
  });

/* ── AI 2단계: 노트 초안 + 인터뷰 (푸른이알피 프록시 재사용) ── */
function aiProxyUrl(){
  try{
    var raw=localStorage.getItem('pureun_v6_setting_ai_proxy_url')||localStorage.getItem('pureun_v6_ai_proxy_url')||'';
    if(!raw) return '';
    if(raw.charAt(0)==='"'){ try{ return JSON.parse(raw); }catch(e){ return raw.replace(/^"|"$/g,''); } }
    return raw;
  }catch(e){ return ''; }
}
function aiConsent(){
  if(localStorage.getItem('work_ai_ok')==='1') return Promise.resolve(true);
  return confirmM('AI 기능을 쓰면 이 업무의 진행 기록·기업명·의뢰인 정보가 회사에 설정된 AI 서비스로 전송됩니다.\n\n의뢰인 개인정보가 포함될 수 있으니 대표님이 승인한 경우에만 사용하세요.\n\n계속할까요? (이 브라우저에서 한 번만 묻습니다)',{ok:'동의하고 사용'})
    .then(function(ok){ if(ok) localStorage.setItem('work_ai_ok','1'); return ok; });
}
function aiCall(system,userText){
  var url=aiProxyUrl();
  if(!url) return Promise.reject(new Error('AI 프록시 주소가 없습니다 — 푸른이알피 설정에서 먼저 등록하세요'));
  var i=0;
  function attempt(){
    return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:AI_MODELS[i],max_tokens:8000,system:system,
        messages:[{role:'user',content:userText}]})})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d&&d.error) throw new Error(d.error.message||'AI 오류');
        var t=d.reply||d.text||((d.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join(''));
        if(!t) throw new Error('AI 응답이 비어 있습니다');
        return t;
      })
      .catch(function(e){
        if(i<AI_MODELS.length-1){ i++; return attempt(); }   // 프록시가 모델을 제한하면 다음 모델로
        throw e;
      });
  }
  return attempt();
}
function aiJson(text){
  var s=String(text||''), a=s.indexOf('{'), b=s.lastIndexOf('}');
  if(a<0||b<a) throw new Error('AI 응답을 해석할 수 없습니다');
  return JSON.parse(s.slice(a,b+1));
}
function aiContext(id){
  var it=items[id]||{}, logs=itemLogsCache[id]||{};
  var arr=Object.keys(logs).map(function(k){return logs[k];})
    .sort(function(a,b){return (a.d||'').localeCompare(b.d||'');});
  var L=['[업무]','구분: '+(it.cat||''),'기업/대상: '+(it.company||it.client||''),
    '업무명: '+(it.title||''),'의뢰인: '+(it.client||'—'),'상대기관 담당: '+(it.officer||'—'),
    '관리번호: '+(it.no||''),'시작일: '+(it.start||'—'),'기한: '+(it.due||'—'),
    '상태: '+(it.status||''),'담당: '+((it.mgr_main&&it.mgr_main.name)||'—'),
    '다음 할 일: '+((it.next&&it.next.text)||'—')+' '+((it.next&&it.next.date)||''),
    '','[진행 기록 — 오래된 순, 총 '+arr.length+'건]'];
  arr.forEach(function(l){ L.push((l.d||'')+' : '+(l.t||'')+(l.byName?' ('+l.byName+')':'')); });
  return L.join('\n');
}

  allItems().forEach(function(it){ var m=new RegExp('^'+y+'-'+cat+'-(\\d+)$').exec(it.no||'');

  var open=openItems(), today=todayStr();

        :'<span class="muted" style="font-size:12px">—</span>';
      var ld=(it.last&&it.last.d)||'';
      var stale=ld&&_dayDiff(today,ld)>=14;
      var lastHtml=it.last?('<span class="last">'+esc(it.last.t)+' <span class="ago"'
          +(stale?' style="color:var(--warn);font-weight:700"':'')+'>· '+esc(md(ld))+'</span></span>')
        :'<span class="muted" style="font-size:12px">기록 없음</span>';
      var nx=it.next&&it.next.text?ddayHTML(it.next.date,it.next.text):(it.due?ddayHTML(it.due,'기한'):'<span class="muted">—</span>');
      return '<tr>'+tdNo(i+1)+'<td>'+catBadge(it.cat)+'</td>'
        +'<td class="itc" onclick="openDrawer(\''+it._id+'\')"><span class="co">'+esc(it.company||it.client||'—')+'</span>'
        +(perGroup?'':'<div class="sub">'+esc((it.mgr_main&&it.mgr_main.name)||'담당 미지정')+'</div>')
        +(it.officer?'<div class="sub">'+esc(it.officer)+'</div>':'')+'</td>'
        +'<td style="font-size:12.5px">'+esc(it.title||'')+peFlag(it)+'</td>'
        +'<td>'+logHtml+'</td><td>'+lastHtml+'</td><td>'+nx+'</td>'
        +'<td style="text-align:center"><button class="endbtn" onclick="event.stopPropagation();completeItem(\''+escJ(it._id)+'\')" '
        +'title="이 업무를 종료해 보관함으로 옮깁니다'+(peLinked(it)?' (푸른이알피 종료 연동)':'')+'">종료'
        +(peLinked(it)?'<span class="lk">🔗</span>':'')+'</button></td></tr>';
    }).join('');
  }
  var shown=0;
  if(S.teamFlat){                                    // 평면 보기 — 한 표로 정렬
    var flat=open.filter(pass); flat=teamSortArr(flat,wk); shown=flat.length;
    h+=rowsOf(flat,false);
  }else{
    names.forEach(function(nm){
      if(S.teamMgr&&S.teamMgr!==nm) return;
      var arr=groups[nm].filter(pass);
      if(!arr.length) return;
      shown+=arr.length;
      var rec=groups[nm].filter(function(it){return wkLogsOf(it._id,wk).length>0;}).length;
      var fold=!!(S.teamFold||{})[nm];
      h+='<tr class="grp-h" style="cursor:pointer" onclick="teamFold(\''+escJ(nm)+'\')"><td colspan="8">'
        +(fold?'▸':'▾')+' 👤 '+esc(nm)+' — 진행 '+groups[nm].length+'건'
        +(arr.length!==groups[nm].length?' <span class="muted" style="font-weight:600">(조건 '+arr.length+'건)</span>':'')
        +' <span class="pct">이 주 기록 '+rec+'/'+groups[nm].length+'</span></td></tr>';
      if(!fold) h+=rowsOf(teamSortArr(arr,wk),true);
    });
  }
  if(!shown) h+='<tr><td colspan="8" class="moremark">조건에 맞는 업무가 없습니다. 필터를 바꿔 보세요.</td></tr>';
  h+='</tbody></table></div>';
  h+='<div class="muted" style="font-size:12px;margin-top:8px">조건에 맞는 업무 '+shown+' / 전체 '+open.length+'건</div>';
  app.innerHTML=h;
}
function teamSort(k){ if((S.teamSort||'due')===k) S.teamDesc=!S.teamDesc; else { S.teamSort=k; S.teamDesc=false; } renderTeam(); }
function teamSortArr(arr,wk){
  var k=S.teamSort||'due', dir=S.teamDesc?-1:1;
  function key(it){
    if(k==='cat') return it.cat||'';
    if(k==='co') return it.company||it.client||'';
    if(k==='title') return it.title||'';
    if(k==='log') return String(wkLogsOf(it._id,wk).length).padStart(3,'0');
    if(k==='last') return (it.last&&it.last.d)||'0000-00-00';
    return itemDue(it)||'9999-99-99';            // 기한 없는 건은 뒤로
  }
  return arr.slice().sort(function(a,b){
    var r=String(key(a)).localeCompare(String(key(b)),'ko');
    return (r||String(a.no||'').localeCompare(String(b.no||''),'en',{numeric:true}))*dir;
  });
}
function teamFold(nm){ S.teamFold=S.teamFold||{}; S.teamFold[nm]=!S.teamFold[nm]; renderTeam(); }
function teamFoldAll(on){ S.teamFold={};
  if(on) openItems().forEach(function(it){ S.teamFold[(it.mgr_main&&it.mgr_main.name)||'(담당 미지정)']=1; });
  renderTeam(); }
function teamReset(){ S.teamMgr=''; S.teamCat=''; S.teamSt=''; S.teamDue=''; S.teamNolog=false; S.teamStale=false; S.q=''; renderTeam(); }

/* ── 업무량 (사람별 비교·관리) ── */
// 최근 n주 기록을 모두 로드
function loadWeeks(n){
  var arr=[]; for(var i=0;i<n;i++) arr.push(weekKeyOf(addDays(S.week,-7*i)));
  return Promise.all(arr.map(loadWeekOnce)).then(function(){ return arr; });
}
function _dayDiff(a,b){ return Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000); }
function setStW(n){ S.stW=n; renderStats(); }
function renderStats(){
  var app=$('app'); if(!app)return;
  var n=S.stW||4;
  app.innerHTML=loadingHTML('최근 '+n+'주 업무량 집계 중…');
  loadWeeks(n).then(function(wks){
    if(S.view!=='stats') return;
    var today=todayStr(), open=openItems();
    var from=ymd(addDays(S.week,-7*(n-1))), to=ymd(addDays(S.week,6));
    var rows={};
    function R(nm){ return rows[nm]=rows[nm]||{name:nm,open:0,cats:{},logged:{},lines:0,stale:0,due:0,over:0,done:0}; }
    var owner={};
    open.forEach(function(it){
      var nm=(it.mgr_main&&it.mgr_main.name)||'(담당 미지정)';
      owner[it._id]=nm;
      var r=R(nm); r.open++;
      var c=it.cat||'기타'; r.cats[c]=(r.cats[c]||0)+1;
      var d=dday(itemDue(it));
      if(d!==null&&d<0) r.over++; else if(d!==null&&d<=7) r.due++;
      var ld=(it.last&&it.last.d)||'';
      if(!ld||_dayDiff(today,ld)>=14) r.stale++;
    });
    wks.forEach(function(wk){ var w=wkCache[wk]||{};
      Object.keys(w).forEach(function(iid){
        var nm=owner[iid]; if(!nm) return;
        var r=R(nm), c=Object.keys(w[iid]||{}).length;
        r.lines+=c; if(c) r.logged[iid]=1;
      });
    });
    allItems().forEach(function(it){
      if(it.state!=='done'||!it.done_date) return;
      if(it.done_date<from||it.done_date>to) return;
      R((it.mgr_main&&it.mgr_main.name)||'(담당 미지정)').done++;
    });
    var list=Object.keys(rows).map(function(k){var r=rows[k];r.loggedN=Object.keys(r.logged).length;
      r.rate=r.open?Math.round(r.loggedN/r.open*100):0; return r;})
      .sort(function(a,b){return b.open-a.open;});
    var T={open:0,lines:0,stale:0,over:0,due:0,done:0,loggedN:0};
    list.forEach(function(r){ T.open+=r.open;T.lines+=r.lines;T.stale+=r.stale;T.over+=r.over;T.due+=r.due;T.done+=r.done;T.loggedN+=r.loggedN; });
    var Trate=T.open?Math.round(T.loggedN/T.open*100):0;

    function catBar(r){
      var ks=Object.keys(r.cats).sort(function(a,b){return r.cats[b]-r.cats[a];});
      return '<div style="display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--bg);min-width:90px">'
        +ks.map(function(c){var col=(CATS[c]||CATS['기타'])[1];
          return '<span title="'+esc(c)+' '+r.cats[c]+'건" style="width:'+(r.cats[c]/r.open*100)+'%;background:'+col+'"></span>';}).join('')
        +'</div><div style="font-size:10px;color:var(--faint);margin-top:2px">'
        +ks.slice(0,3).map(function(c){return esc(c)+' '+r.cats[c];}).join(' · ')+(ks.length>3?' …':'')+'</div>';
    }
    var h='<div class="row" style="flex-wrap:wrap"><h1>업무량</h1>'
      +'<span class="muted" style="font-size:12.5px">'+esc(from)+' ~ '+esc(to)+' 기준</span>'
      +'<span style="flex:1"></span>'
      +[[1,'이번 주'],[4,'최근 4주'],[12,'최근 12주']].map(function(p){
          return '<span class="chipbtn'+(n===p[0]?' on':'')+'" onclick="setStW('+p[0]+')">'+p[1]+'</span>';}).join('')
      +'</div>';
    h+='<div class="statbar">'
      +'진행 <b>'+T.open+'</b>건'
      +'<span class="sep">·</span>기록 <b>'+T.lines+'</b>줄'
      +'<span class="sep">·</span>기록률 <b'+(Trate<60?' style="color:var(--warn)"':'')+'>'+Trate+'</b>%'
      +'<span class="sep">·</span>완료 <b>'+T.done+'</b>건'
      +'<span class="sep">|</span>'
      +'<span class="muted">2주+ 방치 <b'+(T.stale?' style="color:var(--warn)"':'')+'>'+T.stale+'</b>'
      +' · 기한 지남 <b'+(T.over?' style="color:var(--danger)"':'')+'>'+T.over+'</b></span>'
      +'</div>';
    h+='<div class="panel" style="padding:0;overflow-x:auto"><table><thead><tr>'
      +'<th class="rowno">#</th>'
      +'<th style="min-width:80px">담당</th><th style="width:58px;text-align:right">진행</th>'
      +'<th style="min-width:120px">구분 구성</th>'
      +'<th style="width:92px;text-align:right">기록률</th><th style="width:64px;text-align:right">기록 줄</th>'
      +'<th style="width:72px;text-align:right">2주+ 방치</th><th style="width:64px;text-align:right">임박</th>'
      +'<th style="width:64px;text-align:right">지남</th><th style="width:58px;text-align:right">완료</th></tr></thead><tbody>';
    if(!list.length) h+='<tr><td colspan="10" class="moremark">집계할 업무가 없습니다.</td></tr>';
    list.forEach(function(r,i){
      var rc=r.rate>=80?'var(--ok)':r.rate>=50?'var(--warn)':'var(--danger)';
      h+='<tr style="cursor:pointer" onclick="setView(\'\',\''+escJ(r.name)+'\');go(\'my\')" title="이 담당자의 업무 보기">'
        +tdNo(i+1)
        +'<td style="font-weight:700">'+esc(r.name)+'</td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums;font-weight:700">'+r.open+'</td>'
        +'<td>'+catBar(r)+'</td>'
        +'<td style="text-align:right"><b style="color:'+rc+'">'+r.rate+'%</b>'
          +'<div style="font-size:10px;color:var(--faint)">'+r.loggedN+'/'+r.open+'건</div></td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums">'+r.lines+'</td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums'+(r.stale?';color:var(--warn);font-weight:700':'')+'">'+(r.stale||'—')+'</td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums">'+(r.due||'—')+'</td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums'+(r.over?';color:var(--danger);font-weight:700':'')+'">'+(r.over||'—')+'</td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums">'+(r.done||'—')+'</td></tr>';
    });
    h+='</tbody></table></div>';
    h+='<div class="panel" style="font-size:12px;color:var(--sub);line-height:1.75">'
      +'<b>읽는 법</b> — <b>진행·구분 구성</b>은 <u>부하</u>(무엇을 얼마나 들고 있나), '
      +'<b>기록률·기록 줄</b>은 <u>활동</u>(얼마나 챙기고 있나)입니다. 성격이 다르니 섞어 보지 마세요.<br>'
      +'⚠️ <b>기록 줄 수를 성과 지표로 쓰지 마세요.</b> 줄 수로 평가하면 기록을 잘게 쪼개 부풀리게 되고, '
      +'그러면 이 화면의 숫자가 전부 못 쓰게 됩니다. 관리에 쓸 값은 <b>2주+ 방치</b>와 <b>기한 지남</b>입니다 — '
      +'이 둘은 실제 사고로 이어지는 신호입니다.<br>'
      +'행을 클릭하면 그 담당자의 업무 목록으로 이동합니다.</div>';
    app.innerHTML=h;
  }).catch(function(e){ if($('app'))$('app').innerHTML='<div class="panel">집계 실패: '+esc(e.message)+'</div>'; });
}

/* ── 보관함 — 종료된 업무를 담당자별로 관리 ── */
function _mgrOf(it){ return (it.mgr_main&&it.mgr_main.name)||'(담당 미지정)'; }
function peSyncBadge(it){
  if(!peLinked(it)) return '';
  if(it.pe_nosync) return '<span class="pesync off" title="이 업무는 푸른이알피와 연동하지 않습니다">연동 안 함</span>';
  var st=(pesync[it.ref.type+'-'+safeKey(it.ref.id)]||{});
  if(st.synced_at&&st.pe_closed===true) return '<span class="pesync done" title="푸른이알피도 종료됨 · '+esc((st.synced_at||'').slice(0,10))+'">🔗 반영됨</span>';
  return '<span class="pesync wait" title="푸른이알피 나의 업무를 열 때 반영됩니다">🔗 반영 대기</span>';
}
function arReset(){ S.arMgr=''; S.arCat=''; S.arPeriod=''; S.q=''; renderArchive(); }
function arFold(nm){ S.arFold=S.arFold||{}; S.arFold[nm]=!S.arFold[nm]; renderArchive(); }
function renderArchive(){
  var app=$('app'); if(!app)return;
  var all=allItems().filter(function(it){return it.state==='done';})
    .sort(function(a,b){return (b.done_date||'').localeCompare(a.done_date||'');});
  var today=todayStr();
  var mgrs={}; all.forEach(function(it){ mgrs[_mgrOf(it)]=1; });
  var names=Object.keys(mgrs).sort();
  // 기간 필터 경계
  var from='';
  if(S.arPeriod==='m1') from=ymd(addDays(new Date(),-30));
  else if(S.arPeriod==='m3') from=ymd(addDays(new Date(),-90));
  else if(S.arPeriod==='y') from=(new Date().getFullYear())+'-01-01';
  function pass(it){
    if(S.arMgr&&_mgrOf(it)!==S.arMgr) return false;
    if(S.arCat&&(it.cat||'기타')!==S.arCat) return false;
    if(from&&(it.done_date||'')<from) return false;
    if(S.q&&!matchQ(it,S.q)) return false;
    return true;
  }
  var done=all.filter(pass);
  var h='<div class="row" style="flex-wrap:wrap"><h1>보관함</h1>'
    +'<span class="muted" style="font-size:12.5px">종료된 업무 — 기록·인수인계 노트는 그대로 남고 통계에도 계속 포함됩니다</span></div>';
  if(!all.length){ app.innerHTML=h+'<div class="panel" style="text-align:center;color:var(--sub);padding:40px">종료된 업무가 없습니다.</div>'; return; }
  // 담당자별 종료 건수 요약 1줄 (클릭 = 그 사람만)
  h+='<div class="statbar">'
    +'<span class="sb'+(S.arMgr?'':' on')+'" onclick="S.arMgr=\'\';renderArchive()" title="전체 보기">전체 '+all.length+'</span>'
    +names.map(function(nm){
        var c=all.filter(function(it){return _mgrOf(it)===nm;}).length;
        return '<span class="sb'+(S.arMgr===nm?' on':'')+'" onclick="S.arMgr='+(S.arMgr===nm?'\'\'':'\''+escJ(nm)+'\'')+';renderArchive()" '
          +'title="'+esc(nm)+' 님이 종료한 건만">'+esc(nm)+' '+c+'</span>';
      }).join('')
    +'</div>';
  h+='<div class="fbar">'
    +qBox('renderArchive','🔍 기업·업무명·의뢰인')
    +catSelect(S.arCat,'S.arCat=this.value;renderArchive()')
    +'<select onchange="S.arPeriod=this.value;renderArchive()" title="종료일 기간으로 좁히기">'
    +[['','기간 전체'],['m1','최근 30일'],['m3','최근 90일'],['y','올해']].map(function(o){
        return '<option value="'+o[0]+'"'+(S.arPeriod===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>'
    +'<span class="chipbtn'+(S.arFlat?' on':'')+'" onclick="S.arFlat=!S.arFlat;renderArchive()" title="담당자 묶음을 풀고 한 표로">평면</span>'
    +'<span class="muted" style="font-size:11.5px">'+(done.length!==all.length?done.length+' / '+all.length:all.length)+'건</span>'
    +((S.arMgr||S.arCat||S.arPeriod||S.q)?'<span class="chipbtn on" onclick="arReset()" title="모든 필터 해제">✕ 필터</span>':'')
    +'</div>';
  h+='<div class="panel" style="padding:0;overflow-x:auto"><table><thead><tr>'
    +'<th class="rowno">#</th><th style="width:56px">구분</th><th>기업 / 업무</th>'
    +(S.arFlat||S.arMgr?'<th style="width:90px">담당</th>':'')
    +'<th style="width:92px">종료일</th><th style="width:110px">푸른이알피</th>'
    +'<th style="width:160px">마지막 기록</th><th style="width:72px"></th></tr></thead><tbody>';
  var COLS=(S.arFlat||S.arMgr)?8:7;
  function rowsOf(arr){
    return arr.map(function(it,i){
      return '<tr>'+tdNo(i+1)+'<td>'+catBadge(it.cat)+'</td>'
        +'<td class="itc" onclick="openDrawer(\''+escJ(it._id)+'\')"><span class="co">'+esc(it.company||it.client||'—')+'</span>'
        +'<div class="sub">'+esc(it.title||'')+(it.no?' · '+esc(it.no):'')+'</div></td>'
        +((S.arFlat||S.arMgr)?'<td style="font-size:12.5px">'+esc(_mgrOf(it))+'</td>':'')
        +'<td style="font-size:12.5px;font-variant-numeric:tabular-nums">'+esc(it.done_date||'—')+'</td>'
        +'<td>'+(peSyncBadge(it)||'<span class="muted" style="font-size:11px">—</span>')+'</td>'
        +'<td>'+(it.last?'<span class="last">'+esc(it.last.t)+' <span class="ago">· '+esc(md(it.last.d))+'</span></span>':'<span class="muted" style="font-size:12px">기록 없음</span>')+'</td>'
        +'<td><button class="endbtn" onclick="event.stopPropagation();restoreItem(\''+escJ(it._id)+'\')" title="진행으로 되돌립니다'
        +(peLinked(it)&&!it.pe_nosync?' (푸른이알피도 종료 해제)':'')+'">↩ 재개</button></td></tr>';
    }).join('');
  }
  if(!done.length){ h+='<tr><td colspan="'+COLS+'" class="moremark">조건에 맞는 업무가 없습니다.</td></tr>'; }
  else if(S.arFlat||S.arMgr){ h+=rowsOf(done); }
  else {
    names.forEach(function(nm){
      var arr=done.filter(function(it){return _mgrOf(it)===nm;});
      if(!arr.length) return;
      var fold=!!(S.arFold||{})[nm];
      h+='<tr class="grp-h" style="cursor:pointer" onclick="arFold(\''+escJ(nm)+'\')"><td colspan="'+COLS+'">'
        +(fold?'▸':'▾')+' 👤 '+esc(nm)+' — 종료 '+arr.length+'건'
        +'<span class="pct">최근 종료 '+esc(arr[0].done_date||'—')+'</span></td></tr>';
      if(!fold) h+=rowsOf(arr);
    });
  }
  h+='</tbody></table></div>';
  h+='<div class="muted" style="font-size:12px;margin-top:8px">조건에 맞는 종료 업무 '+done.length+' / 전체 '+all.length+'건</div>';
  app.innerHTML=h;
}

/* ── 푸른이알피 담당 업무 가져오기 (계약·사건·컨설팅·기금·기타) ── */
// pu-erp는 localStorage(pureun_v6_*)에 마스터를 캐시함 — 같은 출처라 그대로 읽는다.
function _ls(key){
  try{ var raw=localStorage.getItem('pureun_v6_'+key); if(!raw) return null;
    var v=JSON.parse(raw); if(v&&!Array.isArray(v)&&typeof v==='object') v=Object.keys(v).map(function(k){return v[k];});
    return Array.isArray(v)?v:null; }catch(e){ return null; }
}
// 종료 판정 — pu-erp isItemClosed와 동일 기준
function _peClosed(x){
  if(!x) return true;
  if(x.permanentArchived||x.archived) return true;
  if(x.closedDate||x.closedAt||x.closeDate) return true;
  var st=String(x.status||'');
  return st==='closed'||st==='cancelled'||st==='transferred';
}
// pu-erp 유형명 → 업무시트 표준 구분 (엑셀 이관과 같은 규칙)
function normCat(raw,title){
  var s=String((raw||'')+' '+(title||'')).replace(/\s/g,'');
  if(/산재/.test(s)) return '산재';
  if(/체불|체당/.test(s)) return '체불';
  if(/부당|부해/.test(s)) return '부해';
  if(/괴롭힘|직괴/.test(s)) return '조사';
  if(/행심|행정심판/.test(s)) return '행심';
  if(/기금|공동근로복지/.test(s)) return '기금';
  if(/노사|노조/.test(s)) return '노사';
  if(/급여/.test(s)) return '급여';
  if(/산안|안전/.test(s)) return '산안';
  if(/지원금/.test(s)) return '지원';
  if(/컨설팅|일터|구조혁신|비즈니스|현장클리닉|현클|기술보호|가족친화|상공회의소|자율점검|징계위원회|근로계약서|통상임금/.test(s)) return '컨설팅';
  if(/인사|규정|취업규칙/.test(s)) return '인사';
  if(/조사/.test(s)) return '조사';
  return '기타';
}
function _normCo(s){ return String(s||'').replace(/\(주\)|㈜|주식회사|\(유\)|유한회사|[\s·.,\-()]/g,'').toLowerCase(); }
function _peDue(x){
  var ds=(x.deadlines||[]).map(function(d){return d&&d.date;}).filter(Boolean).sort();
  if(ds.length){ var t=todayStr(); var up=ds.filter(function(d){return d>=t;}); return up[0]||ds[ds.length-1]; }
  return x.contractEndDate||'';
}
/* ── 푸른이알피 마스터 읽기 ─────────────────────────────────────────
   RTDB `data/{키}/v`를 직접 읽는다. 예전엔 localStorage(pureun_v6_*)만 봐서
   같은 브라우저에서 푸른이알피를 한 번 열지 않으면 후보가 0건이었다.
   저장형태는 키마다 배열/객체로 다르므로 _peArr가 둘 다 받아 정규화한다.
   ⚠ 읽기만 한다 — 마스터 쓰기는 pu-erp의 dbPatch만 담당한다. */
var PE_KEYS={contract:'contracts',case:'cases',consulting:'consultings',fund:'funds',other:'other_projects'};
var PE_DEF=[
  ['contract','계약',function(x){return x.contractNo||'';},function(x){return x.title||x.contractType||'';},function(x){return x.contractType||x.consultingType||x.caseType||x.fundType||x.programName||'';}],
  ['case','사건',function(x){return x.caseNo||'';},function(x){return x.title||x.caseName||'';},function(x){return x.typeName||x.caseType||'';}],
  ['consulting','컨설팅',function(x){return x.consultNo||x.no||'';},function(x){return x.title||x.programName||'';},function(x){return x.typeName||x.consultingType||x.programName||'';}],
  ['fund','기금',function(x){return x.fundNo||x.no||'';},function(x){return x.title||x.fundName||'';},function(x){return x.fundType||'기금';}],
  ['other','기타',function(x){return x.projectNo||x.no||'';},function(x){return x.title||x.projectName||'';},function(x){return x.programName||'';}]
];
var PE_MIRROR=['no','cat','company','client','officer','title','due','start'];
var peMaster={};                                   // {유형:[레코드]} — 읽기 실패한 유형은 키가 없다
var peState={since:null,at:null,n:0,err:''};
var _peU2N=null, _peT=null, _peBusy=false, _peWatching=false;

function _peArr(v){
  if(v&&!Array.isArray(v)&&typeof v==='object') v=Object.keys(v).map(function(k){return v[k];});
  return Array.isArray(v)?v.filter(Boolean):null;
}
// 이름 해석용 sid→이름 (퇴직자 포함 — loadStaff는 재직자만 주므로 따로 읽는다)
function peUsers(){
  if(_peU2N) return Promise.resolve(_peU2N);
  function fin(arr){ var m={}; (arr||[]).forEach(function(u){ if(u&&u.sid) m[u.sid]=u.name||u.sid; }); _peU2N=m; return m; }
  var l=_ls('user_accounts'); if(l) return Promise.resolve(fin(l));
  return fbDb.ref('data/user_accounts/v').once('value')
    .then(function(s){ return fin(_peArr(s.val())); }).catch(function(){ return fin([]); });
}
function peLoadAll(){
  return Promise.all(PE_DEF.map(function(d){
    return fbDb.ref('data/'+PE_KEYS[d[0]]+'/v').once('value')
      .then(function(s){ return [d[0],_peArr(s.val())]; })
      .catch(function(){ return [d[0],_ls(PE_KEYS[d[0]])]; });   // 권한/네트워크 실패 → 캐시 폴백
  })).then(function(rows){
    rows.forEach(function(r){ if(r[1]) peMaster[r[0]]=r[1]; });
    return peMaster;
  });
}
// 마스터 1건 → 업무시트 항목 후보
function _peCandOf(t,label,dNo,dTitle,dKind,x,sid2name){
  var co=x.companyName||x.fundName||x.targetName||'';
  var kind=dKind(x), title=dTitle(x);
  return { pid:'PE-'+t+'-'+safeKey(x.id), kindLabel:label, no:dNo(x)||'', cat:normCat(kind,title),
    company:co, title:(title||kind||co||'무제'), officer:(x.jurisdiction&&x.jurisdiction.officer)||'',
    client:x.payee||'', mgr:sid2name[x.managerMain]||'', mgrSid:x.managerMain||'',
    subs:(x.managerSubs||[]).map(function(sd){return sid2name[sd]||'';}).filter(Boolean),
    due:_peDue(x), start:x.receiveDate||x.contractStartDate||'',
    ref:{type:t,id:String(x.id)} };
}
// 5종 마스터 → 미종료 후보 전체. null = 한 유형도 못 읽음
function puerpCandidates(){
  var sid2name=_peU2N||{}, out=[], any=false;
  PE_DEF.forEach(function(d){
    var arr=peMaster[d[0]]; if(!arr) return; any=true;
    arr.forEach(function(x){
      if(!x||!x.id||_peClosed(x)) return;
      out.push(_peCandOf(d[0],d[1],d[2],d[3],d[4],x,sid2name));
    });
  });
  return any?out:null;
}
// 마스터 + 사용자 준비
function peReady(){ return Promise.all([peLoadAll(),peUsers()]); }

/* ── 자동 연동 엔진 ─────────────────────────────────────────────────
   ① 기준일(config/pe_since)이 없으면 = 최초 실행. 현재 있는 모든 건을
      pe_seen에 "이미 본 것"으로만 적고 항목은 만들지 않는다.
      → 엑셀 이관 163건과 겹치는 백로그가 쏟아지는 것을 막는다.
      (pu-erp 레코드에 등록일 필드가 없어 날짜 비교가 불가능하므로 id 스냅샷을 쓴다)
   ② 기준일 이후 새로 등록된 건(pe_seen에 없는 건)만 자동 생성한다.
   ③ 푸른이알피 소유 필드는 pe_m 스냅샷과 비교해 "푸른이알피에서 실제로
      바뀐 경우에만" 갱신한다. → 여기서 사람이 고친 값이 조용히 안 덮인다.
   ④ 종료·재개는 pu-erp의 pesync 엔진 담당 — 여기서 손대지 않는다. */
function peWatch(){
  if(_peWatching) return; _peWatching=true;
  // data/{키}/u = 그 키의 변경 타임스탬프 1개. 본문 대신 이것만 구독해 트래픽을 줄인다.
  PE_DEF.forEach(function(d){
    fbDb.ref('data/'+PE_KEYS[d[0]]+'/u').on('value',function(){ peBump(); },function(){});
  });
  peBump();                                        // u 노드가 없는 경우에도 최초 1회는 돌린다
}
function peBump(){
  clearTimeout(_peT);
  _peT=setTimeout(function(){ peLoadAll().then(peAutoSync); },1000);   // 5개 구독이 몰려 와도 1회만
}
function peAutoSync(){
  if(_peBusy) return Promise.resolve();
  if(!PE_DEF.some(function(d){return !!peMaster[d[0]];})) return Promise.resolve();
  _peBusy=true;
  return Promise.all([
    peUsers(), loadStaff(),
    fbDb.ref(NS+'/pe_seen').once('value').then(function(s){return s.val()||{};}).catch(function(){return null;}),
    fbDb.ref(NS+'/config/pe_since').once('value').then(function(s){return s.val()||'';}).catch(function(){return null;})
  ]).then(function(r){
    var sid2name=r[0], staff=r[1], seen=r[2], since=r[3];
    if(seen===null||since===null){ peState.err='연동 설정을 읽지 못했습니다'; return; }
    peState.err=''; peState.since=since||'';
    var name2sid={}; staff.forEach(function(u){ name2sid[u.name]=u.sid; });
    var ceo=staff.filter(function(u){return /대표/.test(u.title||'');})[0]||null;

    // 현재 마스터 상태: live=존재하는 전체 id, cand=미종료 후보
    var cand=[], live={};
    PE_DEF.forEach(function(d){
      var arr=peMaster[d[0]]; if(!arr) return;
      live[d[0]]={};
      arr.forEach(function(x){
        if(!x||!x.id) return;
        live[d[0]][safeKey(String(x.id))]=1;
        if(_peClosed(x)) return;
        cand.push(_peCandOf(d[0],d[1],d[2],d[3],d[4],x,sid2name));
      });
    });
    var up={};

    // ① 최초 실행 — 기준선만 기록하고 끝낸다
    if(!since){
      var t0=todayStr();
      Object.keys(live).forEach(function(t){
        Object.keys(live[t]).forEach(function(k){ up[NS+'/pe_seen/'+t+'/'+k]=true; });
      });
      up[NS+'/config/pe_since']=t0;
      return fbDb.ref().update(up).then(function(){
        peState.since=t0; peState.at=new Date().toISOString();
        toast('🔗 자동 연동 시작 — 오늘부터 푸른이알피에 등록되는 건이 자동으로 들어옵니다');
      });
    }

    // ② 기존 연동건: 원본 존재 여부 + 소유 필드 미러
    var byRef={}, candByRef={};
    allItems().forEach(function(it){ if(peLinked(it)) byRef[it.ref.type+'|'+safeKey(it.ref.id)]=it; });
    cand.forEach(function(c){ candByRef[c.ref.type+'|'+safeKey(c.ref.id)]=c; });
    Object.keys(byRef).forEach(function(k){
      var it=byRef[k], P=NS+'/items/'+it._id+'/';
      // 원본 삭제 감지 — 그 유형을 실제로 읽어냈을 때만 판단한다(읽기 실패로 전건 오표시 방지)
      if(live[it.ref.type]){
        var gone=!live[it.ref.type][safeKey(it.ref.id)];
        if(gone&&!it.pe_gone) up[P+'pe_gone']=true;
        if(!gone&&it.pe_gone) up[P+'pe_gone']=null;
      }
      var c=candByRef[k]; if(!c) return;            // 종료된 건 → 미러 안 함(종료는 pesync 담당)
      var m=it.pe_m||{}, nm={};
      PE_MIRROR.forEach(function(f){
        nm[f]=c[f]||'';
        if(String(m[f]||'')!==nm[f]) up[P+f]=nm[f];
      });
      var mSid=c.mgrSid||name2sid[c.mgr]||'', has=!!(mSid||c.mgr);
      nm.mgr=mSid+'/'+(c.mgr||''); nm.subs=(c.subs||[]).join('|');
      if(String(m.mgr||'')!==nm.mgr){
        up[P+'mgr_main']=has?{sid:mSid,name:c.mgr||''}:(ceo?{sid:ceo.sid,name:ceo.name}:{sid:'',name:''});
        up[P+'pe_nomgr']=has?null:true;             // 담당 미지정 → 대표에게 배치하고 표시
      }
      if(String(m.subs||'')!==nm.subs)
        up[P+'mgr_subs']=(c.subs||[]).map(function(n){return {sid:name2sid[n]||'',name:n};});
      if(JSON.stringify(m)!==JSON.stringify(nm)) up[P+'pe_m']=nm;
    });

    // ③ 신규 자동 생성 — pe_seen에 없는 건만 (사용자가 지운 건은 seen에 남아 되살아나지 않는다)
    var made=0;
    cand.forEach(function(c){
      var t=c.ref.type, rk=safeKey(c.ref.id);
      if(seen[t]&&seen[t][rk]) return;
      up[NS+'/pe_seen/'+t+'/'+rk]=true;
      if(byRef[t+'|'+rk]) return;                   // 이미 수동으로 가져온 건
      var mSid=c.mgrSid||name2sid[c.mgr]||'', has=!!(mSid||c.mgr);
      var m={}; PE_MIRROR.forEach(function(f){ m[f]=c[f]||''; });
      m.mgr=mSid+'/'+(c.mgr||''); m.subs=(c.subs||[]).join('|');
      var rec={ no:c.no||(S.year+'-'+c.cat+'-PE'), cat:c.cat, company:c.company||'', client:c.client||'',
        officer:c.officer||'', title:c.title||'', due:c.due||'', start:c.start||'', status:'진행중',
        mgr_main:has?{sid:mSid,name:c.mgr||''}:(ceo?{sid:ceo.sid,name:ceo.name}:{sid:'',name:''}),
        mgr_subs:(c.subs||[]).map(function(n){return {sid:name2sid[n]||'',name:n};}),
        src:'puerp', ref:c.ref, pe_auto:true, pe_m:m, created_at:new Date().toISOString() };
      if(!has) rec.pe_nomgr=true;
      up[NS+'/items/'+c.pid]=rec; made++;
    });

    if(!Object.keys(up).length){ peState.at=new Date().toISOString(); return; }
    return fbDb.ref().update(up).then(function(){
      peState.at=new Date().toISOString(); peState.n=made;
      if(made) toast('🔗 푸른이알피에서 '+made+'건 자동 연동');
    });
  }).catch(function(e){ peState.err=e&&e.message||'동기화 실패'; console.warn('[peAutoSync]',e); })
    .then(function(){ _peBusy=false; });
}
function puerpModal(){

  var byRef={}, exByCo={};

  S._peCand={}; cand.forEach(function(c){ S._peCand[c.pid]=c; });
  function row(c,checked,extra){

        return row(c,false,'<div style="font-size:11px;color:var(--warn);margin-top:2px">↔ 기존: '
          +c._match.slice(0,2).map(function(m){return esc((m.title||'')+(m.no?' ('+m.no+')':''));}).join(' / ')
          +(c._match.length>2?' 외 '+(c._match.length-2)+'건':'')+'</div>');
      }).join('')+'</div></div>';
  }
  h+='<div style="font-size:12.5px;font-weight:800;margin:10px 0 2px">✅ 새로 가져올 '+neu.length+'건</div>';
  h+=neu.length?('<div style="max-height:260px;overflow-y:auto">'+neu.map(function(c){return row(c,true);}).join('')+'</div>')
    :'<div class="muted" style="font-size:12px;padding:8px 2px">새로 가져올 건이 없습니다.</div>';
  if(done.length) h+='<div class="muted" style="font-size:11.5px;margin-top:10px">🔁 이미 가져온 '+done.length+'건은 목록에서 제외했습니다.</div>';
  h+='<div id="pe-msg" class="muted" style="font-size:12px;min-height:18px;margin-top:8px"></div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:6px"><button onclick="closeM()">취소</button>'
    +'<button class="primary" onclick="runPuerpImport()">선택한 건 가져오기</button></div>';
  showModal(h);
}
// 푸른이알피 나의 업무 → work.html#item=<건ID> 로 들어온 경우 해당 업무 열기
function openFromHash(){
  try{
    var m=/^#item=(.+)$/.exec(location.hash||''); if(!m) return;
    var id=decodeURIComponent(m[1]);
    if(!items[id]){ toast('해당 업무를 찾을 수 없습니다 (보관함에 있을 수 있습니다)','warn'); return; }
    openDrawer(id);
  }catch(e){}
}
// 푸른이알피 해당 메뉴로 이동 (pu-erp는 #menu= 딥링크를 지원)
function openPuerp(type){
  var MENU={contract:'biz/contract',case:'biz/case',consulting:'biz/consulting',fund:'biz/fund',other:'biz/other'};
  window.open('pu-erp.html?sso=1#menu='+encodeURIComponent(MENU[type]||'biz/case'),'_blank');
}
function runPuerpImport(){
  var sel=[].slice.call(document.querySelectorAll('.pechk')).filter(function(c){return c.checked;}).map(function(c){return c.value;});
  var msg=$('pe-msg');
  if(!sel.length){ if(msg)msg.textContent='선택된 건이 없습니다.'; return; }
  loadStaff().then(function(st){
    var name2sid={}; st.forEach(function(u){ name2sid[u.name]=u.sid; });
    var up={}, n=0;
    sel.forEach(function(pid){
      var c=(S._peCand||{})[pid]; if(!c) return;
      var mSid=c.mgrSid||name2sid[c.mgr]||'';
      // pe_m = 푸른이알피 소유 필드 스냅샷. 자동 연동이 이 값과 비교해
      // "푸른이알피에서 바뀐 필드만" 갱신하므로, 가져오는 시점에 함께 찍어 둔다.
      var m={}; PE_MIRROR.forEach(function(f){ m[f]=c[f]||''; });
      m.mgr=mSid+'/'+(c.mgr||''); m.subs=(c.subs||[]).join('|');
      var rec={ no:c.no||(S.year+'-'+c.cat+'-PE'), cat:c.cat, company:c.company||'', client:c.client||'',
        officer:c.officer||'', title:c.title||'', due:c.due||'', start:c.start||'', status:'진행중',
        mgr_main:{sid:mSid,name:c.mgr||''},
        mgr_subs:(c.subs||[]).map(function(nm){return {sid:name2sid[nm]||'',name:nm};}),
        src:'puerp', ref:c.ref, pe_m:m, created_at:new Date().toISOString() };
      up[NS+'/items/'+c.pid]=rec; n++;
      up[NS+'/pe_seen/'+c.ref.type+'/'+safeKey(c.ref.id)]=true;
    });
    if(!n){ if(msg)msg.textContent='가져올 건이 없습니다.'; return; }
    if(msg)msg.textContent='등록 중… ('+n+'건)';
    fbDb.ref().update(up).then(function(){
      closeM(); toast('🔗 푸른이알피에서 '+n+'건 가져옴'); route();
    }).catch(function(e){ if(msg)msg.textContent='실패: '+e.message; });
  });
}

/* ── 엑셀 이관 JSON 가져오기 ── */
function excelImported(){ return allItems().filter(function(it){return it.src==='excel';}); }
function importModal(){
  var ex=excelImported();
  showModal('<h2 style="margin:0 0 10px">📥 엑셀 이관 가져오기</h2>'
    +'<p class="muted" style="font-size:12.5px;line-height:1.7">업무시트 엑셀에서 추출한 이관 JSON 파일을 불러옵니다.<br>'
    +'같은 파일을 다시 불러와도 중복 등록되지 않습니다(이관 키 기준).</p>'
    +'<input type="file" id="imp-file" accept=".json" style="margin:10px 0">'
    +(ex.length?'<label style="display:flex;gap:8px;align-items:flex-start;background:var(--warn-bg);border:1px solid #f0c68a;border-radius:9px;padding:9px 12px;font-size:12.5px;cursor:pointer">'
      +'<input type="checkbox" id="imp-wipe" checked style="margin-top:3px">'
      +'<span>이미 들어간 <b>엑셀 이관분 '+ex.length+'건</b>을 지우고 새로 넣기'
      +'<div class="muted" style="font-size:11px;margin-top:2px">기록·인수인계 노트까지 함께 삭제됩니다. 직접 등록한 업무와 푸른이알피에서 가져온 건은 건드리지 않습니다.</div></span></label>':'')
    +'<div id="imp-msg" class="muted" style="font-size:12px;min-height:18px;margin-top:8px"></div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:12px"><button onclick="closeM()">닫기</button>'
    +'<button class="primary" onclick="runImport()">가져오기</button></div>');
}
// 엑셀 이관분 삭제 경로만 만들어 반환한다 — 커밋하지 않는다.
// 삭제와 새 데이터 등록을 한 번의 update()로 묶어야, 업로드가 실패해도 기존 데이터가 남는다.
// (예전엔 삭제를 먼저 커밋해서, 이후 실패 시 옛 데이터가 영구히 사라질 수 있었다.)
function excelWipePaths(msg){
  var ex=excelImported();
  if(!ex.length) return Promise.resolve({paths:{},ids:[],n:0});
  if(msg) msg.textContent='기존 이관분 '+ex.length+'건 확인 중…';
  // 삭제 직전 최신 상태를 서버에서 다시 읽는다(캐시된 목록이 오래되어 주별 기록이 남는 문제 방지)
  return Promise.all(ex.map(function(it){
      return fbDb.ref(NS+'/itemlogs/'+it._id).once('value')
        .then(function(s){ return {id:it._id,lg:s.val()||{}}; })
        .catch(function(){ return {id:it._id,lg:itemLogsCache[it._id]||{}}; });
    }))
    .then(function(arr){
      var paths={};
      arr.forEach(function(o){
        paths[NS+'/items/'+o.id]=null;
        paths[NS+'/itemlogs/'+o.id]=null;
        Object.keys(o.lg).forEach(function(lid){
          var w=o.lg[lid]&&o.lg[lid].w; if(w) paths[NS+'/logs/'+weekYear(w)+'/'+w+'/'+o.id+'/'+lid]=null;
        });
      });
      return {paths:paths,ids:arr.map(function(o){return o.id;}),n:ex.length};
    });
}
function runImport(){
  var f=$('imp-file').files[0]; var msg=$('imp-msg');
  if(!f){ msg.textContent='파일을 선택하세요.'; return; }
  var rd=new FileReader();
  rd.onload=function(){
    var data;
    try{ data=JSON.parse(rd.result); }catch(e){ msg.textContent='JSON 파싱 실패: '+e.message; return; }
    var arr=data.items||data;
    if(!Array.isArray(arr)){ msg.textContent='형식 오류: items 배열이 없습니다.'; return; }
    // 키 사전 검사 — 원본 xk가 아니라 "실제로 쓰일 Firebase 키"로 검사해야 한다.
    // safeKey가 금지문자를 '_'로 바꾸므로 a.b 와 a#b 는 같은 키가 되어 서로 덮어쓴다.
    var kseen={}, kdup=0, kbad=0, dupEx=[];
    arr.forEach(function(r){
      if(!r||!r.xk){ kbad++; return; }
      var k=safeKey(r.xk);
      if(!k||k.replace(/_/g,'')===''){ kbad++; return; }
      if(kseen[k]){ kdup++; if(dupEx.length<3) dupEx.push(r.xk); } else kseen[k]=1;
    });
    if(kdup||kbad){
      msg.innerHTML='<b style="color:var(--danger)">중단: 이관 키에 문제가 있습니다.</b>'
        +(kdup?' 변환 후 키 중복 '+kdup+'건'+(dupEx.length?' (예: '+esc(dupEx.join(', '))+')':''):'')
        +(kbad?' · 키 없음/사용불가 '+kbad+'건':'')
        +'<div class="muted" style="font-size:11.5px;margin-top:4px">그대로 넣으면 그만큼 서로 덮어써 사라집니다. 추출 스크립트를 다시 실행해 받은 파일을 쓰세요.</div>';
      return;
    }
    var wipe=$('imp-wipe')&&$('imp-wipe').checked;
    (wipe?excelWipePaths(msg):Promise.resolve({paths:{},ids:[],n:0})).then(function(w){
      return loadStaff().then(function(st){ return {w:w,st:st}; });
    }).then(function(ctx){
      var w=ctx.w, st=ctx.st;
      var byName={}; st.forEach(function(u){byName[u.name]=u;});
      // 삭제 경로를 먼저 담고, 아래에서 새 데이터를 같은 객체에 쌓아 한 번에 커밋한다
      var up={}, nItems=0, nLogs=0, skip=0;
      var wipedIds={}; w.ids.forEach(function(x){ wipedIds[x]=1; });
      Object.keys(w.paths).forEach(function(k){ up[k]=null; });
      var seqs={};   // 이관 관리번호 채번(구분별) — 기존 items 스캔(지울 것은 제외)
      allItems().forEach(function(it){ if(wipedIds[it._id]) return;
        var m=/^(\d{4})-(.+)-(\d+)$/.exec(it.no||'');
        if(m&&m[1]==String(S.year)){ var k2=m[2]; seqs[k2]=Math.max(seqs[k2]||0,+m[3]); } });
      arr.forEach(function(r){
        if(!r||!r.xk) return;
        var id='X-'+safeKey(r.xk);
        if(items[id]&&!wipedIds[id]){ skip++; return; }   // 지울 대상이면 새로 넣는다
        var cat=CATS[r.cat]?r.cat:'기타';
        seqs[cat]=(seqs[cat]||0)+1;
        var mgr=byName[r.mgr]||{sid:'',name:r.mgr||''};
        var rec={ no:S.year+'-'+cat+'-'+('00'+seqs[cat]).slice(-3), cat:cat,
          company:r.company||'', client:r.client||'', officer:r.officer||'',
          title:r.title||'', due:r.due||'', start:r.start||'', status:'진행중',
          mgr_main:{sid:mgr.sid,name:mgr.name},
          mgr_subs:(r.subs||[]).map(function(n){ var u=byName[n]||{sid:'',name:n}; return {sid:u.sid,name:u.name}; }),
          src:'excel', created_at:new Date().toISOString() };
        var logs=r.logs||[];
        var last=null;
        logs.forEach(function(lg){
          if(!lg||!lg.d||!lg.t) return;
          var wk2=weekKeyOf(mondayOf(new Date(lg.d+'T00:00:00')));
          var lid=rid('L'); nLogs++;
          var log={d:lg.d,t:lg.t,by:mgr.sid||'',byName:mgr.name||'',at:new Date().toISOString(),imp:1};
          up[NS+'/logs/'+weekYear(wk2)+'/'+wk2+'/'+id+'/'+lid]=log;
          up[NS+'/itemlogs/'+id+'/'+lid]=Object.assign({w:wk2},log);
          if(!last||last.d<=lg.d) last={d:lg.d,t:lg.t};
        });
        if(last) rec.last=last;
        up[NS+'/items/'+id]=rec;
        nItems++;
      });
      if(!nItems){ msg.textContent='새로 가져올 건이 없습니다 (중복 '+skip+'건 건너뜀).'; return; }
      msg.textContent='등록 중… ('+(w.n?'기존 '+w.n+'건 교체, ':'')+nItems+'건, 기록 '+nLogs+'줄)';
      // 삭제(null)와 등록을 한 번의 update로 — 실패하면 아무것도 바뀌지 않는다
      fbDb.ref().update(up).then(function(){
        msg.textContent='';
        toast('✅ 이관 완료: 업무 '+nItems+'건, 기록 '+nLogs+'줄'
          +(w.n?' (기존 '+w.n+'건 교체)':'')+(skip?' (중복 '+skip+' 건너뜀)':''));
        wkCache={}; wkLoaded={}; itemLogsCache={}; _watchWkKey=null; watchWeek();
        closeM(); route();
      }).catch(function(e){ msg.textContent='업로드 실패: '+e.message; });
    }).catch(function(e){ msg.textContent='실패: '+e.message; });
  };
  rd.readAsText(f,'utf-8');
}
</script>
