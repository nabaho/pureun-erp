<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>업무관리</title>
<!-- 폰 홈화면 앱 (푸른카메라·기업정보함과 같은 방식) -->
<link rel="manifest" href="work-manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>📋</text></svg>">
<!-- 아이폰 홈화면 아이콘 — 탭 아이콘과 다른 것이다. 여기는 PNG 여야 한다(SVG 를 안 읽는다) -->
<link rel="apple-touch-icon" href="icon-work-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="업무관리">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="js/pu-resilience.js?v=2"></script>
<script src="js/pu-gate.js?v=1"></script>
<script src="js/pu-health.js?v=3"></script>
<script src="js/pu-version.js?v=3"></script>
<script src="js/pu-backup.js?v=1"></script>
<script src="js/pu-rules-history.js?v=3"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<style>
  :root{--acc:#2563eb;--acc2:#1e40af;--acc-soft:#e2e8f0;--ink:#1e293b;--sub:#475569;--faint:#94a3b8;
    --line:#e2e8f0;--panel:#fff;--bg:#f8fafc;--ok:#166534;--ok-bg:#f8fafc;--warn:#854d0e;--warn-bg:#fffbeb;
    --danger:#dc2626;--danger-bg:#e2e8f0;--radius:11px}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;color:var(--ink);background:#f8fafc;font-size:14px;-webkit-font-smoothing:antialiased}
  #side{position:fixed;top:0;left:0;width:200px;height:100vh;background:#fff;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;z-index:20}
  .logo{display:flex;align-items:center;gap:9px;padding:2px 6px 12px}
  .logo .ic{font-size:22px}.logo b{font-size:14px}.logo .s{font-size:11px;color:var(--sub)}
  .sitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--sub);font-size:13px}
  .sitem:hover{background:var(--bg)}.sitem.on{background:var(--acc-soft);color:var(--acc2);font-weight:700}
  .sitem .cnt{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  .sitem.nw{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .side-sec{font-size:10.5px;letter-spacing:.1em;color:var(--faint);padding:12px 8px 4px;text-transform:uppercase}
  #main{margin-left:200px;min-height:100vh}
  #topbar{position:sticky;top:0;z-index:15;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:9px 22px;display:flex;align-items:center;gap:12px;font-size:13px}
  #crumb{font-weight:700;color:var(--sub)}
  #topright{margin-left:auto;display:flex;align-items:center;gap:11px}
  #conn{font-size:12px;color:var(--sub)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#cbd5e1;margin-right:5px}.dot.on{background:var(--ok)}
  #topuser{font-weight:700;font-size:12.5px}#topuser .role{color:var(--sub);font-weight:500;margin-left:4px}
  #topclock{font-variant-numeric:tabular-nums;color:var(--sub);font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
  #logoutbtn{font-size:12.5px;padding:5px 12px;border:1px solid #f87171;color:var(--danger);background:#fff;border-radius:8px;cursor:pointer;font-weight:700}
  #app{padding:18px 22px 90px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
  .row{display:flex;align-items:center;gap:10px}
  h1{font-size:20px;margin:0}h2{font-size:16px;margin:0}
  .muted{color:var(--sub)}
  input,select,textarea{font-family:inherit}
  /* 예시 문구는 '따라 적으라'가 아니라 '이런 걸 적으면 된다'는 힌트 — 눈에 띄게 흐리게 */
  input::placeholder,textarea::placeholder{color:#94a3b8;opacity:1;font-weight:400}
  input:focus::placeholder,textarea:focus::placeholder{color:#cbd5e1}
  button{font-family:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--ink)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}button.primary:hover{background:var(--acc2)}
  .gate{max-width:520px;margin:90px auto;text-align:center;color:var(--sub)}.gate a{color:var(--acc);font-weight:700}
  #toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:400;max-width:80vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:#991b1b}#toast.warn{background:#854d0e}
  .loading{display:flex;align-items:center;gap:10px;padding:22px 16px;color:var(--sub);font-size:13px}
  .loading .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 주 내비 + 포커스 */
  .wkpill{font-size:12.5px;font-weight:700;color:var(--acc2);background:var(--acc-soft);border:1px solid #bfdbfe;border-radius:14px;padding:3px 13px;cursor:pointer;font-variant-numeric:tabular-nums;user-select:none}
  .wknav{color:var(--faint);cursor:pointer;padding:2px 7px;border-radius:6px;font-size:14px;user-select:none}
  .wknav:hover{background:var(--bg)}
  /* 캘린더 (월·주·일 + 레이어 체크) — 격자선은 옅게, 강조는 오늘·이벤트에만 */
  .calwrap{background:#fff;border:1px solid #e2e8f0;border-radius:14px;margin:0 0 12px;overflow:hidden;
    box-shadow:0 1px 2px rgba(24,34,52,.03),0 10px 26px -18px rgba(24,34,52,.16)}
  /* 캘린더를 오른쪽에 붙이고 표는 왼쪽 — 가운데를 끌어 폭을 나눈다.
     예전엔 캘린더가 표를 통째로 아래로 밀어내 둘을 함께 볼 수가 없었다. */
  .split{display:flex;align-items:flex-start;gap:0}
  .split>.spmain{flex:1 1 auto;min-width:0}
  .split>.spside{flex:0 0 auto;align-self:stretch}
  .split>.spside .calwrap{margin:0;position:sticky;top:8px;
    max-height:calc(100vh - 150px);display:flex;flex-direction:column}
  .split>.spside .calwrap .cgrid,.split>.spside .calwrap .cdayrow{overflow:auto}
  .spgrip{flex:0 0 11px;align-self:stretch;cursor:col-resize;position:relative;touch-action:none}
  .spgrip::after{content:'';position:absolute;left:5px;top:10px;bottom:10px;width:1px;background:var(--line)}
  .spgrip:hover::after,.spgrip.on::after{width:3px;left:4px;background:var(--acc);border-radius:2px}
  body.colres{cursor:col-resize;user-select:none}
  /* 캘린더가 옆에 붙으면 칸이 좁다 — 글자와 여백을 한 단계 줄인다 */
  .split>.spside .cday{min-height:56px;padding:3px 4px 5px}
  .split>.spside .cwcol{min-height:110px}
  .split>.spside .cev{font-size:10px;padding:1px 5px}
  /* 캘린더에서 고른 줄 — 잠깐 반짝여 어디로 왔는지 알려 준다 */
  tr.hit>td{background:var(--acc-soft)!important;transition:background .8s}
  tr.hit.off>td{background:transparent!important}
  .calhd{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 12px 8px}
  .calhd .ttl{font-size:14.5px;font-weight:800;letter-spacing:-.015em;min-width:112px;font-variant-numeric:tabular-nums}
  .cnav{width:25px;height:25px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
    color:#94a3b8;cursor:pointer;font-size:16px;line-height:1;user-select:none;transition:background .12s,color .12s}
  .cnav:hover{background:#f8fafc;color:var(--ink)}
  .cbtn{font-size:11.5px;font-weight:700;color:var(--sub);background:#f8fafc;border:none;border-radius:8px;
    padding:4px 11px;cursor:pointer;user-select:none;transition:background .12s,color .12s}
  .cbtn:hover{background:#e2e8f0;color:var(--ink)}
  .cbtn.gh{background:transparent;color:#94a3b8}.cbtn.gh:hover{background:#f8fafc;color:var(--sub)}
  .vseg{display:inline-flex;background:#f8fafc;border-radius:9px;padding:2px;gap:2px}
  .vseg span{padding:3px 13px;font-size:11.5px;font-weight:700;color:#64748b;cursor:pointer;border-radius:7px;
    user-select:none;transition:background .12s,color .12s}
  .vseg span:hover{color:var(--ink)}
  .vseg span.on{background:#fff;color:var(--acc2);box-shadow:0 1px 2px rgba(24,34,52,.13)}
  /* 거르개 — 묶음별 한 줄. 묶음 이름 너비를 못 박아 위아래 칩이 세로로 줄맞춤된다 */
  .lays{padding:0 12px 10px;display:flex;flex-direction:column;gap:5px}
  .lay{display:flex;align-items:flex-start;gap:5px;flex-wrap:wrap}
  .laygp{flex-shrink:0;width:62px;padding:4px 0;font-size:10px;font-weight:800;color:#94a3b8;
    letter-spacing:-.01em;white-space:nowrap;cursor:pointer;user-select:none;transition:color .12s}
  .laygp:hover{color:var(--ink)}
  .laygp.on{color:#64748b}
  .laygp .gi{margin-left:2px;font-size:9px;opacity:.75}
  .lchk{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#64748b;
    border:1px solid #e2e8f0;background:#fff;border-radius:999px;padding:3px 10px;cursor:pointer;user-select:none;
    transition:background .12s,border-color .12s,color .12s,opacity .12s;opacity:.62}
  .lchk:hover{opacity:1;border-color:#e2e8f0}
  .lchk .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px #fff inset}
  .lchk.on{opacity:1;color:var(--ink);background:#f8fafc;border-color:#e2e8f0}
  .lchk:not(.on) .dot{background:#cbd5e1 !important}
  /* ── 보드(칸반) ─────────────────────────────────────────────
     상태 다섯이 이미 색까지 정해져 있어(STATUSES) 그대로 세로 칸으로 세운다.
     카드를 끌어 옮기면 상태가 바뀐다 — 표에서 드롭다운으로 하던 것과 같은 길(setStatus). */
  .bdwrap{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;align-items:flex-start}
  .bdcol{flex:0 0 258px;background:var(--bg);border:1px solid var(--line);border-radius:12px;
    display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
  .bdcol.over{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft) inset}
  .bdhd{display:flex;align-items:center;gap:6px;padding:9px 11px 7px;font-size:12px;font-weight:800;flex-shrink:0}
  .bdhd .dot{width:8px;height:8px;border-radius:3px;flex-shrink:0}
  .bdhd .n{margin-left:auto;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
  .bdbody{overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:6px;min-height:44px}
  .bdcard{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;
    cursor:pointer;font-size:12.5px;line-height:1.5;transition:border-color .12s,box-shadow .12s}
  .bdcard:hover{border-color:var(--acc);box-shadow:0 1px 3px rgba(24,34,52,.08)}
  .bdcard.dragging{opacity:.45}
  .bdcard .co{font-weight:700;color:var(--ink);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bdcard .tt{color:var(--sub);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .bdcard .ft{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px;font-size:10.5px;color:var(--faint)}
  .bdempty{color:var(--faint);font-size:11.5px;text-align:center;padding:14px 4px}
  /* ── 타임라인 ──────────────────────────────────────────────
     왼쪽은 업무 이름(고정), 오른쪽은 날짜. 막대는 시작일~기한.
     기한이 없으면 막대를 그릴 수 없으니 시작일에 점만 찍는다 — 없는 기한을 지어내지 않는다. */
  .tlwrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
  .tlscroll{overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 210px)}
  .tlgrid{position:relative;min-width:max-content}
  .tlrow{display:flex;align-items:stretch;border-bottom:1px solid var(--bg)}
  .tlrow:hover{background:var(--bg)}
  .tlname{flex:0 0 210px;position:sticky;left:0;z-index:2;background:var(--panel);
    border-right:1px solid var(--line);padding:7px 10px;font-size:12px;line-height:1.4;cursor:pointer}
  .tlrow:hover .tlname{background:var(--bg)}
  .tlname b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tlname span{color:var(--faint);font-size:10.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tllane{position:relative;flex:1;min-height:38px}
  .tlhd{display:flex;position:sticky;top:0;z-index:3;background:var(--panel);border-bottom:1px solid var(--line)}
  .tlhd .tlname{border-bottom:none;font-weight:800;color:var(--sub);font-size:11px;cursor:default;z-index:4}
  .tlmon{position:relative;flex:1}
  .tlmk{position:absolute;top:0;bottom:0;border-left:1px solid var(--bg)}
  .tlmk.mon{border-left-color:var(--line)}
  .tlmk b{position:absolute;top:5px;left:4px;font-size:10.5px;color:var(--sub);white-space:nowrap;font-weight:700}
  .tllane .tlmk b{display:none}                    /* 날짜 글씨는 맨 위 한 줄에만 — 줄마다 찍으면 도배가 된다 */
  .tlbar{position:absolute;top:9px;height:19px;border-radius:6px;display:flex;align-items:center;
    padding:0 7px;font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;cursor:pointer}
  .tldot{position:absolute;top:14px;width:9px;height:9px;border-radius:50%;cursor:pointer}
  .tltoday{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);opacity:.55;z-index:1;pointer-events:none}
  /* ── 팀 현황판 ── 한 사람 = 한 칸. 표보다 먼저 오는 화면이다. */
  .tmwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:8px;padding:2px 0 10px}
  .tmc{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px 9px;
    cursor:pointer;transition:border-color .12s,box-shadow .12s}
  .tmc:hover{border-color:var(--acc);box-shadow:0 1px 3px rgba(24,34,52,.08)}
  .tmh{display:flex;align-items:baseline;gap:6px}
  .tmh b{font-size:13.5px;font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tmh .n{margin-left:auto;font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .tmh .n i{font-style:normal;font-size:11px;font-weight:700;color:var(--faint);margin-left:1px}
  .tmsub{font-size:10.5px;color:var(--faint);margin-top:1px}
  .tmsig{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
  .tmsig .s{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px}
  .tmsig .over{background:#fef2f2;color:#991b1b}
  .tmsig .soon{background:#f8fafc;color:#854d0e}
  .tmrec{font-size:10.5px;color:var(--faint);margin-top:7px}
  .tmrec b{color:var(--sub);font-weight:700}
  .tmnone{color:var(--faint);font-size:12.5px;padding:26px;text-align:center}
  /* ── 받은 메일 ── 목록의 작은 표식과 드로어의 몇 줄. 본문은 여기에 없다. */
  .mlf{font-size:10px;font-weight:800;color:#2563eb;background:#e2e8f0;
    border-radius:5px;padding:1px 5px;white-space:nowrap}
  .mlrow{border-bottom:1px solid var(--bg);padding:6px 0}
  .mlrow:last-child{border-bottom:none}
  .mlrow .t{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.4}
  .mlrow .s{font-size:10.5px;color:var(--faint);margin-top:1px}
  .mlrow .p{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.5}
  /* 확인한 줄은 흐리게 — 지우지는 않는다. 「무엇을 봤는지」도 자료다. */
  .mlrow.seen{opacity:.55}
  .mlrow .mlb{display:flex;align-items:center;gap:5px;margin-top:5px;flex-wrap:wrap}
  .mlrow .mlb button{font-size:11px;padding:2px 8px;border:1px solid var(--line);
    border-radius:6px;background:var(--panel);cursor:pointer;color:var(--sub);font-weight:700}
  .mlrow .mlb button:hover{border-color:var(--acc);color:var(--acc2)}
  .mlrow .mlb .ok{font-size:10.5px;font-weight:700;color:#2563eb}
  .mlrow .mlb .undo{font-size:10.5px;color:var(--faint);cursor:pointer;text-decoration:underline}
  /* 푸른메일함으로 건너가는 줄 — 본문·답장·모든 메일은 «거기»가 진짜다 */
  .mlgo{margin-top:7px;padding-top:7px;border-top:1px solid var(--bg)}
  .mlgo button{font-size:11px;padding:3px 9px;border:1px solid var(--line);
    border-radius:6px;background:var(--panel);cursor:pointer;color:var(--sub);font-weight:700}
  .mlgo button:hover{border-color:var(--acc);color:var(--acc2)}
  /* ── 오간 것 «한 줄» (대표 지시 2026-09-06) ────────────────────────
     한 통이 한 줄이다. 자리가 넓다고 두 줄로 만들지 않는다 —
     열두 통이면 표가 그만큼 길어지고, 기록 바로 아래라 기록이 밀려난다.
     넘치는 글은 자르고 «마우스 올렸을 때» 펴 보인다. */
  .dbox.mlbox{overflow:visible}                 /* ⚠ 안 풀면 펴진 것이 상자에 잘린다 */
  .dbox.mlbox .bh{border-radius:9px 9px 0 0}    /* overflow 를 풀면 모서리를 직접 줘야 한다 */
  .dbox.mlbox .bb{padding:3px 0;gap:0}
  .ml1{display:flex;align-items:center;gap:7px;padding:4px 11px;font-size:12.5px;
    position:relative;border-bottom:1px solid var(--bg);white-space:nowrap}
  .ml1:hover{background:var(--bg)}
  .ml1 .ck{flex:0 0 auto;width:13px;height:13px;border:1.5px solid var(--faint);
    border-radius:4px;cursor:pointer;position:relative}
  .ml1 .ck:hover{border-color:var(--acc)}
  .ml1.seen .ck{background:var(--acc);border-color:var(--acc)}
  .ml1.seen .ck::after{content:"✓";position:absolute;left:1px;top:-5px;color:#ffffff;
    font-size:11px;font-weight:800}
  /* 보낸 것·요약처럼 «치울 것이 없는» 줄 — 네모는 보이되 눌리지 않는다 */
  .ml1 .ck.off{cursor:default;background:var(--acc-soft);border-color:var(--line)}
  .ml1 .ck.off::after{color:var(--faint)}
  .ml1 .dt{flex:0 0 auto;min-width:30px;color:var(--faint);font-size:11.5px;
    font-variant-numeric:tabular-nums}
  .ml1 .ar{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--acc2)}
  .ml1 .ar.out{color:var(--faint)}
  .ml1 .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .ml1.seen .tx,.ml1.seen .dt{color:var(--faint)}
  .ml1 .att{flex:0 0 auto;font-size:10px;font-weight:800;color:var(--warn);
    background:var(--warn-bg);border-radius:4px;padding:0 5px}
  /* ⚠ 「짐작으로 이었다」는 줄 위에 보여야 한다 — 마우스를 올려야만 보이면
     올려 보지 않은 사람은 짐작을 사실로 읽는다 */
  .ml1 .gs{flex:0 0 auto;font-size:10px;font-weight:800;color:var(--warn);
    border:1px solid #fde68a;border-radius:4px;padding:0 4px}
  .ml1 .take{flex:0 0 auto;font-size:10.5px;color:var(--acc);cursor:pointer;font-weight:700;
    border:1px solid var(--acc-soft);border-radius:5px;padding:0 5px;visibility:hidden}
  .ml1:hover .take{visibility:visible}
  .ml1 .took{flex:0 0 auto;font-size:10px;color:var(--ok);font-weight:700}
  /* 마우스 올렸을 때 — 잘린 글이 어디로 갔는지 여기서 본다 */
  /* ⚠ 마우스가 «통과»하게 둔다. 안 그러면 펴진 것이 아래 줄을 덮어, 다음 줄로
       마우스를 옮길 수가 없다(실제로 그랬다). 그래서 여기엔 «누를 것»을 두지 않고,
       되돌리기는 줄 왼쪽 네모에 맡긴다 — 네모를 다시 누르면 되돌아간다. */
  .mlpop{pointer-events:none;position:absolute;left:30px;right:8px;top:calc(100% - 2px);z-index:9;white-space:normal;
    background:var(--panel);border:1px solid var(--acc);border-radius:9px;padding:8px 11px;
    box-shadow:0 12px 30px rgba(15,32,60,.18);display:none;text-align:left}
  .ml1:hover .mlpop{display:block}
  /* 아래쪽 줄은 «위로» 편다 — 서랍 바닥에 걸려 잘리면 펴 봐야 소용이 없다.
     ⚠ nth-last-of-type 으로 세지 않는다. 뒤에 붙는 「외 n건」·「모두 보기」도
       같은 div 라 셈에 끼어들어 엉뚱한 줄이 위로 펴진다. 그릴 때 정해 준다. */
  .ml1.up .mlpop{top:auto;bottom:calc(100% - 2px)}
  /* 사람이 이은 줄 — 기계가 정한 것과 구별한다 */
  .ml1 .hd1{flex:0 0 auto;font-size:10px;font-weight:800;color:var(--acc2);
    border:1px solid #bfdbfe;border-radius:4px;padding:0 4px}
  /* ── 📬 이어 줄 메일 ──────────────────────────────────────────── */
  .mlktabs{display:flex;gap:6px;align-items:center;margin:10px 0 9px;flex-wrap:wrap}
  .mlktab{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:2px 10px;
    cursor:pointer;background:var(--panel);color:var(--sub);white-space:nowrap}
  .mlktab.on{border-color:var(--acc);color:var(--acc2);font-weight:800;background:#eff6ff}
  .ml1 .mlkwho{flex:0 0 auto;max-width:112px;overflow:hidden;text-overflow:ellipsis;
    color:var(--sub);font-size:11.5px}
  /* 업무 고르는 칸 — 제안이 하나면 미리 골라져 보인다 */
  .ml1 .mlkpick{flex:0 0 auto;max-width:220px;display:flex;align-items:center;gap:4px;
    font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:0 7px;
    cursor:pointer;background:var(--panel);overflow:hidden}
  .ml1 .mlkpick:hover{border-color:var(--acc)}
  .ml1 .mlkpick .nm{overflow:hidden;text-overflow:ellipsis;font-weight:700;color:var(--acc2)}
  .ml1 .mlkpick .ar{color:var(--faint);font-size:9px}
  .ml1 .mlkpick.none .nm{color:var(--faint);font-weight:400}
  /* 후보가 여럿이면 노랗게 — 「골라 주세요」다 */
  .ml1 .mlkpick.many{border-color:#fde68a;background:var(--warn-bg)}
  .ml1 .mlkbt{flex:0 0 auto;font-size:11px;font-weight:700;border:1px solid var(--acc);
    border-radius:6px;padding:0 8px;cursor:pointer;color:#ffffff;background:var(--acc);white-space:nowrap}
  .ml1 .mlkbt.gh{background:var(--panel);color:var(--sub);border-color:var(--line);font-weight:400}
  .ml1 .mlkbt.gh:hover{border-color:var(--danger);color:var(--danger)}
  .ml1 .mlkbt.off{opacity:.4;cursor:default}
  .ml1 .mlkpin{flex:0 0 auto;font-size:10.5px;color:var(--sub);display:flex;align-items:center;
    gap:3px;cursor:pointer;white-space:nowrap}
  .ml1 .mlkno{flex:0 0 auto;font-size:10px;color:var(--faint);white-space:nowrap}
  .ml1 .mlkgone{flex:0 0 auto;font-size:10.5px;color:var(--faint);white-space:nowrap}
  .ml1 .mlkundo{flex:0 0 auto;font-size:10.5px;color:var(--acc);cursor:pointer;
    text-decoration:underline;white-space:nowrap}
  .ml1.gone{opacity:.6}
  .mlkfoot{display:flex;align-items:center;gap:8px;margin:10px 18px 0;padding-top:9px;
    border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);flex-wrap:wrap}
  .mlkgrp{font-size:10.5px;font-weight:800;color:var(--faint);margin:10px 0 4px}
  .mlkmodal{max-height:46vh;overflow:auto}
  .mlkit{display:flex;align-items:center;gap:7px;padding:5px 7px;font-size:12.5px;
    border-radius:7px;cursor:pointer}
  .mlkit:hover{background:var(--bg)}
  .mlkit .dt{color:var(--faint);font-size:11.5px;flex:0 0 auto}
  .mlkit .rs{font-size:10px;color:var(--acc2);background:#eff6ff;border-radius:4px;
    padding:0 5px;font-weight:700;flex:0 0 auto}
  .mlkit .sub2{margin-left:auto;font-size:11px;color:var(--faint);flex:0 0 auto}
  .cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}

  .cdow{font-size:10px;font-weight:800;color:#94a3b8;text-align:center;padding:7px 0 6px;letter-spacing:.07em}

  /* ⚠ inline-flex + 고정 크기 = 동그라미. block이면 배경이 셀 폭을 다 채워 막대처럼 보인다 */

  .cev .cqin{width:100%;min-width:0;border:1px solid var(--acc);border-radius:5px;padding:1px 5px;

  .cday,.cwcol{cursor:pointer}
  .cmore{font-size:10px;font-weight:700;color:#94a3b8;padding:2px 6px;margin-top:1px;cursor:pointer;border-radius:5px}
  .cmore:hover{background:#f8fafc;color:var(--acc2)}
  /* 주·일 보기 = 날짜별 목록 (일정은 시간순) */
  .cwcol{border-right:1px solid #f8fafc;border-top:1px solid #f8fafc;min-height:158px;padding:5px 6px 8px}

  .cwhd{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:#64748b;

  .cdash{font-size:10.5px;color:#cbd5e1;padding:2px 2px}
  .cdayrow{display:flex;gap:12px;padding:8px 12px;border-top:1px solid #f8fafc}

  .cdayrow .dl{width:96px;flex-shrink:0;font-size:11px;font-weight:800;color:#94a3b8;padding-top:2px;
    font-variant-numeric:tabular-nums}

  .histbanner .back{margin-left:auto;color:var(--acc2);font-weight:700;background:var(--acc-soft);border:1px solid #bfdbfe;border-radius:6px;padding:2px 10px;font-size:11.5px;cursor:pointer;white-space:nowrap}

  /* 표 */
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
  th{font-size:11px;color:var(--faint);letter-spacing:.03em;white-space:nowrap}
  /* 긴 목록 — 표만 스크롤하고 머리행은 붙어 있는다.
     42건·235건을 훑을 때 열 이름과 요일이 위로 사라지면 어느 칸인지 알 수 없다. */
  /* min-height는 두지 않는다 — 세 줄짜리 표(종료·업무량)가 빈 칸으로 길어진다 */
  .panel.tbl{padding:0;overflow:auto;max-height:calc(100vh - 250px)}
  /* 「내 현장 방문」 — 증빙이 빠진 줄은 옅은 빨강. 색만으로 알리지 않고
     칸 안에 「없음」 딱지를 함께 둔다(색을 못 가리는 분도 있다). */
  /* 폰에서 표만 옆으로 굴린다 — 쪽 전체가 옆으로 밀리면 읽을 수가 없다 */
  .vis-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* 「어디에 · 누구와」 — 사업장 아래에 주소와 동행자를 작게 붙인다 */
  .vis-sub{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.45}
  tr.vis-no > td{background:#f8fafc}
  tr.vis-no:hover > td{background:#f8fafc}
  /* 도구줄 드롭다운 — 브라우저 기본 네모가 둥근 칩들 사이에 섞여 어수선했다.
     칩과 같은 모양으로 맞추고 화살표는 삼각형 두 조각으로 얇게 그린다. */
  select.tool{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background-color:#fff;
    border-radius:13px;padding:4px 26px 4px 11px;font-size:12px;color:var(--sub);cursor:pointer;
    font-family:inherit;line-height:1.35;
    background-image:linear-gradient(45deg,transparent 50%,#94a3b8 50%),linear-gradient(135deg,#94a3b8 50%,transparent 50%);
    background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  select.tool:hover{border-color:#cbd5e1}
  /* 조건이 걸린 칸은 파랗게 — 무엇 때문에 목록이 좁아졌는지 도구줄만 봐도 알게 */
  select.tool.on{border-color:#bfdbfe;background-color:var(--acc-soft);color:var(--acc2);font-weight:700}
  .sepv{width:1px;height:16px;background:var(--line);margin:0 3px;display:inline-block;vertical-align:-3px}

  /* 기록률 밑줄(0/75건). 넓은 화면에서는 아랫줄, 폰 카드에서는 옆에 붙는다. */

  .badge{display:inline-block;font-size:10.5px;font-weight:800;border-radius:4px;padding:1px 8px;white-space:nowrap}

  /* 푸른이알피 원본 상태 — 우리 상태와 다른 축이라 아래에 옅게 덧붙인다 */
  .pest{font-size:10px;font-weight:700;color:var(--faint);margin-top:2px;white-space:nowrap}

  /* 사건 단계 기한 — 푸른이알피가 계산해 내려보낸 값. 다음 할 일과 나란히 두고 덮지 않는다 */
  .sdue{display:block;margin-top:2px;font-size:10.5px;font-weight:700;color:#991b1b;white-space:nowrap}

  .ofc{font-size:11px;color:var(--faint);margin-left:5px}
  /* 이관한 계약에 붙는 꼬리표 — 어디로 넘어갔는지. 감춤을 풀고 볼 때 까닭이 보인다. */
  /* 할 일 알림 칩 — 경고색으로 눈에 띄되 자리는 안 먹는다 */
  .chipbtn.warnchip{border-color:#fde68a;background:#ffffff;color:var(--warn);font-weight:800}
  .chipbtn.warnchip.on{background:var(--warn);border-color:var(--warn);color:#fff}
  .warnlist{max-height:340px;overflow:auto}
  .warnrow{padding:9px 2px;border-bottom:1px solid var(--line)}
  .warnrow:last-child{border-bottom:0}
  .warnrow .wt{font-size:12.5px;line-height:1.5}
  .warnrow .ws{font-size:11.5px;color:var(--sub);margin-top:2px}
  .warnrow .wa{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .xfer{font-size:10.5px;font-weight:700;color:#1e40af;background:#e2e8f0;border-radius:5px;padding:0 6px;margin-left:6px;white-space:nowrap}
  /* 푸른이알피에서 한 건씩 당겨오기 */
  .phd{font-size:11.5px;font-weight:800;color:var(--sub);margin:10px 0 4px;padding-top:6px;border-top:1px solid var(--line)}
  .prow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid #f8fafc}
  .prow .px{flex:1;min-width:0;font-size:12.5px}
  .prow .px .sub{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prow .pm{display:flex;align-items:center;gap:3px;flex-shrink:0}
  .prow button{font-size:11.5px;padding:4px 10px;flex-shrink:0;white-space:nowrap}
  /* 업무 칸 — 윗줄 업무명(유형), 아랫줄 업무 요약 */
  td.tkc{cursor:pointer;min-width:140px;font-size:12.5px}
  td.tkc .brf{font-size:11px;color:#1e40af;font-weight:400;margin-top:1px}
  .last{font-size:12px;color:var(--sub)}
  .last .ago{font-size:10.5px;color:var(--faint)}
  td.wkcell{background:#f8fafc;min-width:220px}
  /* 주간 칸을 요일로 쪼갠 모습 — 머리행과 본문이 같은 격자를 써야 줄이 맞는다 */
  th.wkhd{padding:6px 6px 4px}
  td.wkcell.sp{padding:3px 6px;min-width:340px}
  .wkg{display:grid;gap:4px}
  .wkh{font-size:10px;font-weight:800;color:var(--faint);text-align:center;padding:2px 0;
    border-bottom:1px solid var(--line);letter-spacing:.02em}
  .wkh.td{color:var(--acc);border-bottom-color:var(--acc)}
  .wkc{min-width:0;border-radius:6px;padding:1px}
  .wkc.td{background:#f8fafc}
  .wkc .wklog{font-size:11px;line-height:1.4;padding:1px 3px;word-break:break-all}
  .wkc .wkin{font-size:11.5px;padding:3px 5px;border-color:transparent;background:transparent;margin-top:1px}
  .wkc .wkin:hover{border-color:#bfdbfe;background:#fff}
  .wkc .wkin:focus{border-color:var(--acc);background:#fff;outline:none}
  /* 그 업무의 그 날 표시 — 달력에서 보던 것을 줄 안으로 옮겨 온 것 */
  .wkm{display:block;font-size:9.5px;font-weight:800;border-radius:4px;padding:0 4px;margin-bottom:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wkm.dg{background:#fef2f2;color:#991b1b}
  .wkm.pu{background:#e2e8f0;color:#1e40af}
  .wkm.tl{background:#bbf7d0;color:#2563eb}
  .wklog{font-size:12px;color:#1e293b;padding:1px 0}
  .wklog .d{color:var(--faint);font-size:10.5px;margin-right:4px;font-variant-numeric:tabular-nums}
  /* 팀 전체의 「기록」 한 열 — 이 주 것은 진하게, 지난 것은 흐리게, 2주 넘으면 주황.
     열을 둘로 나눠 두면 이 주 기록이 0인 주에 넓은 열 하나가 통째로 빈칸이 된다. */
  .wklog.cur .d{color:var(--acc2);font-weight:700}
  .wklog.old{color:var(--faint)}
  .wklog.old .d{color:var(--faint);font-weight:600}
  .wklog.stale{color:var(--warn)}
  .wklog.stale .d{color:var(--warn);font-weight:700}
  .wklog .ago{font-size:10.5px;color:inherit;opacity:.75}
  .wkin{width:100%;border:1px solid #bfdbfe;border-radius:6px;padding:5px 8px;font-size:12.5px;background:#fff;margin-top:2px}
  .wkin:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px rgba(37,99,235,.12)}
  /* 컴팩트 요약 스트립 + 한 줄 필터바 */
  .statbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 8px;font-size:12px;color:var(--sub)}
  .statbar b{font-size:14.5px;color:var(--ink);font-variant-numeric:tabular-nums}
  .statbar .sep{color:#cbd5e1}
  .sb{border:1px solid var(--line);background:#fff;border-radius:13px;padding:2px 9px;cursor:pointer;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
  .sb:hover{border-color:#cbd5e1}
  .sb.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
  .sb.am{border-color:#fde68a;background:#ffffff;color:var(--warn)}
  .sb.am.on{background:var(--warn);border-color:var(--warn);color:#fff}
  .sb.dg{border-color:#fecaca;background:#f8fafc;color:var(--danger)}
  .sb.dg.on{background:var(--danger);border-color:var(--danger);color:#fff}
  /* 숫자가 0이거나 전체 건수와 같은 칩은 눌러도 걸러지는 게 없다.
     그런데 경고색으로 있으면 위험 신호로 읽힌다 — 회색으로 죽인다. */
  /* .sb.dead 는 없앴다 — 「눌러도 안 걸러지는 칩」을 회색으로 죽여 두었는데,
     죽어도 자리는 그대로 먹고 큰 숫자가 눈에 걸렸다. 이제는 아예 그리지 않는다. */
  .fnote{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
  .fnote b{color:var(--ink);font-weight:800}
  .cntpill{font-size:12px;font-weight:700;color:var(--acc2);background:var(--acc-soft);
    border:1px solid #bfdbfe;border-radius:12px;padding:2px 10px;font-variant-numeric:tabular-nums}
  .fbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .fbar select{padding:4px 7px;border:1px solid var(--line);border-radius:7px;font-size:12px;color:var(--sub);background:#fff}
  .fbar .chipbtn{padding:3px 9px;font-size:11.5px}
  #qbox{padding:4px 9px;border:1px solid var(--line);border-radius:7px;font-size:12px;min-width:190px}
  /* 머리행이 곧 걸러 보기 (엑셀 자동필터) — 열 이름을 누르면 값 목록이 뜬다.
     평소에는 그냥 열 이름처럼 보이고, 조건이 걸리면 고른 값이 파랗게 남는다. */
  tr.fhead input.fh{width:100%;max-width:100%;min-width:0;border:1px solid transparent;background:transparent;
    font-family:inherit;font-size:11px;color:var(--ink);letter-spacing:.03em;font-weight:400;
    padding:2px 4px;border-radius:6px;cursor:text}
  tr.fhead input.fh:hover{border-color:var(--line);background:#fff}
  tr.fhead input.fh:focus{outline:none;border-color:var(--acc2);background:#fff}
  tr.fhead input.fh.on{border-color:#bfdbfe;background:#f8fafc;color:var(--acc2);font-weight:700}
  tr.fhead input.fh::placeholder{color:var(--faint);letter-spacing:.03em;font-weight:400}
  tr.fhead .chipbtn{display:none}                  /* 해제는 맨 왼쪽 ✕ 하나로 */
  /* 접힌 열 — 사라지지 않고 띠로 남는다. 띠 자체가 펴는 단추다. */
  th.cband,td.cband{width:14px;min-width:14px;max-width:14px;padding:0;
    background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line);
    cursor:pointer;position:relative;overflow:hidden}
  th.cband:hover{background:var(--acc-soft)}
  th.cband.lk{background:var(--acc-soft)}       /* 묶어 보기가 잡고 있는 띠 */
  /* 펴진 열을 접는 손잡이 — 평소엔 흐리게 있다가 그 열에 마우스를 올리면 진해진다 */
  /* 손잡이 색이 표 선 색이라 흰 바탕에서 보이지 않았다 — 열을 접을 수 있다는 것을
     아무도 몰랐다. 열 이름(--sub)보다는 옅게, 그러나 눈에는 들어오게. */
  tr.fhead .cfold{display:inline-block;width:11px;margin-right:1px;cursor:pointer;
    color:#cbd5e1;font-weight:800;font-size:12px;line-height:1;vertical-align:1px;
    text-transform:none;letter-spacing:0}
  tr.fhead th:hover .cfold{color:var(--acc2)}
  tr.fhead .cfold:hover{color:var(--danger)}
  /* ⚠ rotate(180deg) 를 걸지 않는다. 세로쓰기에서 영문은 글자가 눕지만 한글은
     똑바로 서므로, 영문 기준으로 180도를 더 돌리면 한글이 뒤집힌다.
     한글은 vertical-rl 만으로 위에서 아래로 바르게 읽힌다. */
  th.cband .cbl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    writing-mode:vertical-rl;text-orientation:upright;
    font-size:10px;font-weight:700;color:var(--faint);
    white-space:nowrap;letter-spacing:-1px}
  th.cband .cbd{position:absolute;top:3px;left:50%;transform:translateX(-50%);
    width:5px;height:5px;border-radius:50%;background:var(--acc)}
  /* 구분 소제목 — 누르면 그 묶음이 접힌다 */
  tr.grph td{background:var(--acc-soft);border-top:1.5px solid #bfdbfe;
    padding:5px 10px;cursor:pointer;user-select:none;font-size:12px}
  tr.grph:hover td{background:#eff6ff}
  tr.grph .gc{display:inline-block;width:14px;color:var(--acc);font-weight:800}
  tr.grph .gn{margin-left:7px;color:var(--sub);font-weight:700}
  /* 고른 날 묶음 — 거르는 것이 아니라 위로 모은 것이다 */
  tr.grph.day td{background:#f8fafc;border-top:1.5px solid #fbbf24;color:#854d0e}
  tr.grph.day:hover td{background:#fffbeb}
  tr.grph.rest td{background:var(--bg);border-top:1px solid var(--line);cursor:default}
  tr.grph.rest:hover td{background:var(--bg)}
  tr.grph .gn2{color:var(--faint);font-weight:700}
  tr.grph .gx{float:right;font-size:11.5px;font-weight:700;color:var(--acc2);cursor:pointer}
  tr.grph .gx:hover{color:var(--danger)}
  /* 고른 날의 요일 칸 — 밝혀서 어디에 적을지 눈에 들어오게 */
  .wkh.pick{background:#f8fafc;color:#854d0e;border-radius:5px}
  .wkc.pick{background:#ffffff;box-shadow:inset 1px 0 0 #fbbf24,inset -1px 0 0 #fbbf24}
  /* 상태 고르기 — 칩과 같은 색을 쓴다 */
  select.stsel{border:0;border-radius:6px;padding:2px 3px;font-size:11.5px;font-weight:800;
    cursor:pointer;max-width:70px;appearance:none;-webkit-appearance:none;text-align:center}
  select.stsel:hover{filter:brightness(.95)}
  /* 요일 칸의 할 일 — ☐ 를 누르면 ✓ 가 되고 그 날 기록으로도 남는다 */
  .wkpl{display:flex;gap:4px;align-items:flex-start;font-size:11.5px;line-height:1.45;
    padding:1px 0;color:var(--txt)}
  .wkpl .pk{cursor:pointer;color:var(--acc);font-weight:800;flex:none;width:12px}
  .wkpl .tx{flex:1;min-width:0;word-break:break-all}
  .wkpl .by{color:var(--faint);font-size:10.5px;flex:none}
  .wkpl .px{cursor:pointer;color:var(--faint);flex:none;visibility:hidden;font-weight:800}
  .wkpl:hover .px{visibility:visible}
  .wkpl .px:hover{color:var(--danger)}
  .wkpl.on .tx{color:var(--sub);text-decoration:line-through}
  .wkpl.late .pk,.wkpl.late .tx{color:var(--danger)}
  tr.fhead .fx{display:inline-block;font-size:12px;font-weight:800;color:var(--acc2);cursor:pointer}
  tr.fhead .fx:hover{color:var(--danger)}
  .fhb{display:inline-flex;align-items:center;gap:3px;max-width:100%;padding:2px 5px;border-radius:6px;
    border:1px solid transparent;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fhb:hover{border-color:var(--line);background:#fff}
  .fhb .fun{font-size:8.5px;opacity:.45;flex:0 0 auto}
  .fhb.on{color:var(--acc2);font-weight:800;border-color:#bfdbfe;background:#f8fafc}
  .fhb.on .fun,.fhb.pop .fun{opacity:1}
  .fhb.pop{border-color:var(--acc2);background:#fff}
  /* 정렬 화살표 — 걸러 보기와 한 칸을 나눠 쓰므로 따로 떼어 뒀다 */
  .sortb{margin-left:3px;font-size:9px;opacity:.35;cursor:pointer;user-select:none}
  .sortb:hover{opacity:.9}
  .sortb.on{opacity:1;color:var(--acc2);font-size:10px}
  .fbk{position:fixed;inset:0;z-index:60}
  .fpop{position:fixed;z-index:61;min-width:200px;max-width:290px;background:#fff;border:1px solid var(--line);
    border-radius:10px;box-shadow:0 12px 30px rgba(15,32,60,.18);padding:8px;text-align:left;
    font-weight:400;letter-spacing:0;color:var(--ink)}
  .fpop .fps{width:100%;padding:4px 8px;border:1px solid var(--line);border-radius:7px;font-size:12px;margin-bottom:6px}
  .fpl{max-height:250px;overflow:auto}
  .fpl label{display:flex;align-items:center;gap:7px;padding:3px 5px;font-size:12.5px;cursor:pointer;border-radius:6px}
  .fpl label:hover{background:#f8fafc}
  .fpl label .c{margin-left:auto;color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums}
  /* 묶어 보기가 잡고 있어 손댈 수 없는 줄 */
  .fpl label.off{opacity:.5;cursor:default}
  .fpl label.off:hover{background:none}
  .fpa{display:flex;gap:6px;margin-top:7px;align-items:center}
  .fpa button{flex:1;padding:5px 0;font-size:12px}
  .fpa .lnk{font-size:11.5px;color:var(--acc);cursor:pointer;font-weight:700}
  .fpa .lnk:hover{text-decoration:underline}
  /* 하나도 안 골랐을 때 — 조건이 없는 것과 다르다는 것을 밝힌다 */
  .fwarn{margin-top:6px;font-size:11.5px;font-weight:700;color:var(--warn);
    background:var(--warn-bg);border:1px solid #fbbf24;border-radius:6px;padding:4px 8px}
  .endbtn{font-size:11px;padding:3px 9px;border:1px solid #cbd5e1;background:#fff;color:var(--sub);border-radius:6px;cursor:pointer;white-space:nowrap}
  .endbtn:hover{background:var(--ok-bg);border-color:#4ade80;color:var(--ok)}
  .endbtn .lk{margin-left:2px;font-size:9.5px}
  .pesync{font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;white-space:nowrap}
  .pesync.done{background:var(--ok-bg);color:var(--ok)}
  .pesync.wait{background:var(--warn-bg);color:var(--warn)}
  .pesync.off{background:var(--bg);color:var(--faint)}
  td.rowno{color:var(--faint);width:34px;text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px;padding-right:8px}
  th.rowno{width:34px;text-align:right;padding-right:8px}
  .grp-h td{background:var(--bg);font-weight:800;font-size:12.5px;padding:6px 10px}
  .grp-h .pct{float:right;font-weight:600;color:var(--sub);font-size:11px;font-variant-numeric:tabular-nums}

  /* 빠른 기록 바 */
  #qwrap{position:fixed;left:216px;right:18px;bottom:14px;z-index:60;max-width:1100px}
  #qsug{background:#fff;border:1px solid #bfdbfe;border-bottom:0;border-radius:10px 10px 0 0;box-shadow:0 -8px 24px rgba(30,64,175,.10);overflow:hidden;display:none}
  #qsug .qi{padding:7px 13px;border-bottom:1px solid #e2e8f0;display:flex;gap:8px;align-items:center;font-size:12.5px;cursor:pointer}
  #qsug .qi.pick{background:var(--acc-soft)}
  #qsug .qi small{color:var(--faint);margin-left:auto}
  #qbar{display:flex;align-items:center;gap:9px;background:#fff;border:1.6px solid var(--acc);border-radius:10px;padding:7px 13px;box-shadow:0 6px 18px rgba(15,23,42,.14)}
  #qbar .zap{color:var(--acc);font-weight:800;cursor:grab;user-select:none;touch-action:none;
    border-radius:6px;padding:0 3px}
  #qbar .zap:hover{background:var(--acc-soft)}
  #qwrap.drag #qbar .zap{cursor:grabbing}
  #qwrap.drag #qbar{box-shadow:0 14px 34px rgba(15,23,42,.24)}
  #qwrap.moved{max-width:none}
  #qbar input{flex:1;border:none;outline:none;font-size:13px;background:transparent}
  #qbar .k{font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 6px;white-space:nowrap;cursor:pointer}
  #qbar .k:hover{border-color:var(--acc);color:var(--acc)}
  #qbar .home{display:none}
  #qwrap.moved #qbar .home{display:inline-block}
  /* 단축키 도움말의 자판 모양 */
  .kbd{flex:0 0 auto;min-width:74px;text-align:center;font-size:11px;font-weight:700;color:var(--ink);
    background:#f8fafc;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
    padding:1px 6px;white-space:nowrap}

  /* 캘린더 팝오버 */
  #calpop{position:absolute;z-index:80;width:300px;background:#fff;border:1px solid #bfdbfe;border-radius:12px;box-shadow:0 14px 34px rgba(30,64,175,.16);padding:12px 14px;font-size:11.5px}
  #calpop .ct{display:flex;align-items:center;font-size:12.5px;font-weight:800;margin-bottom:6px}
  #calpop .ct .nv{color:var(--faint);padding:0 9px;cursor:pointer;font-weight:400}
  #calpop .ct .today{margin-left:auto;font-size:10.5px;color:var(--acc);font-weight:700;background:var(--acc-soft);border-radius:6px;padding:1px 8px;cursor:pointer}
  #calpop table{border-collapse:collapse;width:100%}
  #calpop th{color:var(--faint);font-weight:700;font-size:10px;padding:3px 0 5px;text-align:center;border:none}
  #calpop th.we{color:#cbd5e1}
  #calpop td{text-align:center;padding:0;border:none}
  #calpop .d{position:relative;display:block;padding:5px 0 11px;color:#1e293b;font-variant-numeric:tabular-nums;font-size:11px}
  #calpop .d.out{color:#cbd5e1}#calpop .d.we{color:#94a3b8}
  #calpop .d.today2{font-weight:800;color:var(--acc2)}
  #calpop .d .dt2{position:absolute;left:50%;transform:translateX(-50%);bottom:4px;display:flex;gap:2px}
  #calpop .d .dt2 i{width:4px;height:4px;border-radius:50%;background:#bfdbfe;display:block}
  #calpop .d .dt2 i.hot{background:var(--acc)}
  #calpop .d.duemark::after{content:"";position:absolute;top:3px;right:5px;width:5px;height:5px;border-radius:50%;background:#dc2626}
  #calpop tr.wrow{cursor:pointer}
  #calpop tr.wrow:hover td .d{background:#f8fafc}
  #calpop tr.selwk td .d{background:var(--acc-soft)}
  #calpop .lg{display:flex;gap:12px;font-size:10px;color:var(--faint);margin-top:8px;align-items:center}
  #calpop .lg i{width:5px;height:5px;border-radius:50%;background:var(--acc);display:inline-block;margin-right:3px}
  #calpop .lg i.r{background:#dc2626}

  /* 드로어 */
  #drawerbg{position:fixed;inset:0;background:rgba(20,30,50,.25);z-index:90}
  #drawer{position:fixed;top:0;right:0;width:430px;max-width:96vw;height:100vh;background:#fff;border-left:1px solid #e2e8f0;box-shadow:-14px 0 30px rgba(15,23,42,.12);z-index:95;display:flex;flex-direction:column}
  #drawer .dh{padding:14px 18px 11px;border-bottom:1px solid var(--line)}
  #drawer .dh .row1{display:flex;align-items:center;gap:8px}
  #drawer .dh .ttl{font-size:14px;font-weight:800;flex:1}
  #drawer .dh .x{color:var(--faint);cursor:pointer;font-size:17px;padding:0 3px}
  #drawer .dh .meta2{font-size:11.5px;color:var(--sub);margin-top:4px}
  #drawer .dh .chips{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
  /* 다음 할 일 — 한 줄로. 예전엔 라벨·입력·날짜가 세 줄로 접혔다 */
  .nextbox{margin:9px 18px 0;background:#ffffff;border:1px solid #fde68a;border-radius:8px;padding:6px 10px;
    font-size:12px;color:#854d0e;display:flex;align-items:center;gap:7px;flex-wrap:nowrap}
  .nextbox .lb{flex-shrink:0;font-weight:800;white-space:nowrap}
  .nextbox input[type=text]{flex:1;min-width:0;border:none;background:transparent;font-size:12.5px;color:#854d0e;outline:none}
  .nextbox input[type=text]::placeholder{color:#d97706}
  .nextbox input[type=date]{flex-shrink:0;border:1px solid #fde68a;background:#fff;border-radius:5px;font-size:11px;padding:2px 4px;color:#854d0e}
  .dinput{margin:10px 18px;border:1.6px solid var(--acc);border-radius:8px;padding:8px 11px;font-size:12.5px;width:calc(100% - 36px)}
  .dinput:focus{outline:none;box-shadow:0 0 0 2px rgba(37,99,235,.12)}
  #feed{flex:1;overflow-y:auto;padding:2px 18px 16px}
  .wksep{font-size:10.5px;font-weight:800;color:var(--faint);letter-spacing:.06em;margin:13px 0 5px;display:flex;align-items:center;gap:8px}
  .wksep::after{content:"";flex:1;height:1px;background:#e2e8f0}
  .fe{display:flex;gap:10px;padding:5px 0;font-size:12.5px;align-items:baseline}
  .fe .dt{width:58px;flex-shrink:0;color:var(--faint);font-size:10.5px;font-variant-numeric:tabular-nums}
  .fe .tx{flex:1;color:#1e293b;word-break:break-word}
  .fe .by{font-size:10px;color:var(--faint);margin-left:5px}
  .wklog .by{font-size:9.5px;font-weight:700;color:#2563eb;background:#f8fafc;border-radius:3px;padding:0 4px}
  .wklog .ed{font-size:9px;color:var(--faint)}
  .wklog .lgx{font-size:10px;color:var(--faint);cursor:pointer;margin-left:5px;opacity:0;transition:opacity .1s}
  .wklog:hover .lgx{opacity:.65}
  .wklog .lgx:hover{opacity:1;color:var(--acc);text-decoration:none}
  .wklog .lgx.dl:hover{color:var(--danger)}
  /* 드로어 블록: 사업장 담당자 · 담당(주/부) */
  .dbox{margin:10px 18px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .dbox .bh{display:flex;align-items:center;gap:5px;padding:6px 11px;background:var(--bg);font-size:12px;
    font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden}
  .dbox .bh .r{margin-left:auto;font-size:11px;font-weight:600;color:var(--sub);
    overflow:hidden;text-overflow:ellipsis;min-width:0}
  .dbox .bb{padding:8px 11px;display:flex;flex-direction:column;gap:6px}
  /* 취업규칙 이력 — 규정관리가 쌓은 회차를 «읽기만» 한다 */
  .rhrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;
    background:var(--bg);border-radius:7px;padding:6px 9px}
  .rhrow .k{font-size:10px;font-weight:800;border-radius:5px;padding:2px 7px;white-space:nowrap;
    background:#f0fdf4;color:#166534}
  /* ⚠ min-width:0 이 없으면 격자 1fr 칸이 글자 길이만큼 벌어져 서랍 밖으로 밀린다 */
  .rhrow .x{font-size:11.5px;color:var(--ink);min-width:0}
  .rhrow .x .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 바뀐 조는 아랫줄로 접어 다 보이게 — 무엇이 바뀌었는지가 이 칸의 존재 이유다 */
  .rhrow .x .ar{display:block;color:var(--sub);font-size:10.5px;line-height:1.45;margin-top:2px;
    white-space:normal;word-break:keep-all}
  .rhrow .go{background:none;border:none;color:var(--acc);font-size:10.5px;font-weight:800;
    cursor:pointer;white-space:nowrap;padding:2px 3px;font-family:inherit}
  /* 설명은 제목 옆 ⓘ에 넣고 누를 때만 보여준다 — 안내문을 화면에 깔지 않는다 */
  .hlp{flex-shrink:0;font-size:11.5px;color:#94a3b8;cursor:pointer;font-weight:400;line-height:1}
  .hlp:hover{color:var(--acc)}
  .hlbk{position:fixed;inset:0;z-index:120}
  .hlpop{position:fixed;z-index:121;max-width:300px;background:#fff;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 12px 30px rgba(15,32,60,.2);padding:11px 32px 11px 13px;font-size:12.5px;line-height:1.7;color:var(--ink)}
  .hlpop b{font-weight:800}
  .hlpop .x{position:absolute;top:6px;right:9px;color:var(--faint);cursor:pointer;font-size:12px;font-weight:800}
  .hlpop .x:hover{color:var(--danger)}
  .pc{display:flex;align-items:center;gap:8px;font-size:12.5px;flex-wrap:wrap}
  .pc .nm{font-weight:700}
  .pc .rk{font-size:10.5px;font-weight:700;background:#f8fafc;color:var(--sub);border-radius:4px;padding:1px 6px}
  .pc a{color:var(--acc);font-weight:700;text-decoration:none;font-variant-numeric:tabular-nums}
  .pc a:hover{text-decoration:underline}
  .pc .src{margin-left:auto;font-size:10px;color:var(--faint)}
  .c3{display:grid;grid-template-columns:1.1fr .6fr 1.1fr;gap:6px}
  .c3 input{padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;min-width:0}
  .c3 input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px rgba(37,99,235,.1)}
  .c3.c4{grid-template-columns:1.1fr .6fr 1.1fr 24px}   /* 담당자 한 줄 + ✕ */
  .c3 .ctx{border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--faint);
    font-size:12px;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center}
  .c3 .ctx:hover{border-color:#fecaca;color:#991b1b}
  .subrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .subchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
    background:#f8fafc;color:#1e40af;border-radius:12px;padding:2px 9px}
  .subchip .x{cursor:pointer;opacity:.5;font-weight:800}.subchip .x:hover{opacity:1}
  /* 지식 카드 (암묵지) */
  .kbc{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:#fff}
  .kbc+.kbc{margin-top:6px}
  .kbc .kt{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;flex-wrap:wrap}
  .kbc .kx{font-size:12px;color:#475569;margin-top:4px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .kbc .km{margin-top:5px;font-size:10.5px;color:var(--faint);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .kbc .km .act{color:var(--acc);cursor:pointer;font-weight:700}
  .kbc .km .act:hover{text-decoration:underline}
  .kbc.old{background:#ffffff;border-color:#fde68a}
  .kbc.bad{background:#f8fafc;border-color:#fecaca}
  .ktag{font-size:10px;font-weight:800;border-radius:4px;padding:1px 7px;background:#f8fafc;color:var(--sub);white-space:nowrap}
  .kkey{font-size:10.5px;font-weight:700;color:var(--acc2);background:var(--acc-soft);border-radius:4px;padding:1px 7px}
  .kwarn{font-size:10px;font-weight:800;color:var(--warn)}
  .kbad{font-size:10px;font-weight:800;color:var(--danger)}
  .prm{font-size:10px;font-weight:700;color:var(--acc);cursor:pointer;opacity:.6;margin-left:5px;white-space:nowrap}
  .prm:hover{opacity:1;text-decoration:underline}
  .kbempty{font-size:12px;color:var(--sub);padding:4px 2px}
  /* 비어 있는 상자는 제목 한 줄로 접는다 (대표 지시 2026-09-05 「화면이 너무 정신없다」) */
  .dfold{cursor:pointer}
  .dfold:hover .bh{background:var(--line)}
  .dfold .fa{color:var(--faint);font-size:10px;width:9px;display:inline-block}
  .dfoldx{margin:0 18px;text-align:right;font-size:10.5px;color:var(--faint);
    cursor:pointer;padding:2px 2px 0}
  .dfoldx:hover{color:var(--acc2)}
  /* 진행 단계 (하위 할 일) */
  .prog{height:5px;background:#f8fafc;border-radius:3px;overflow:hidden;margin:1px 0 8px}
  .prog i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .2s}
  .sg{font-size:11px;font-weight:800;color:var(--sub);margin:9px 0 2px;display:flex;align-items:center;gap:6px}
  .sg:first-child{margin-top:0}
  .sg .gn{font-size:10px;font-weight:700;color:var(--faint)}
  .st1{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12.5px}
  .st1 input[type=checkbox]{cursor:pointer;flex-shrink:0;width:14px;height:14px}
  .st1 .tx{flex:1;min-width:0;word-break:break-word}
  .st1.on .tx{color:var(--faint);text-decoration:line-through}
  .st1 input[type=date]{border:1px solid var(--line);border-radius:5px;font-size:10.5px;padding:1px 4px;color:var(--sub);background:#fff}
  .st1 .sa{font-size:10px;font-weight:700;color:var(--acc);cursor:pointer;opacity:0;white-space:nowrap}
  .st1 .sx{font-size:11px;color:var(--danger);cursor:pointer;opacity:0}
  .st1:hover .sa,.st1:hover .sx{opacity:.65}
  .st1 .sa:hover,.st1 .sx:hover{opacity:1;text-decoration:underline}
  .stadd{font-size:11px;color:var(--acc);cursor:pointer;padding:3px 0;font-weight:700}
  .stadd:hover{text-decoration:underline}
  .stchip{font-size:10px;font-weight:800;border-radius:4px;padding:1px 6px;background:#eff6ff;color:#1e40af;white-space:nowrap}
  .stchip.done{background:var(--ok-bg);color:var(--ok)}
  /* 담당자 묶음 접기 화살표 — 누를 수 있다는 것이 보여야 한다 */
  .grp-h .fold{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
    border-radius:5px;background:#fff;border:1px solid var(--line);color:var(--sub);font-size:10px;
    margin-right:4px;vertical-align:middle}
  .grp-h:hover .fold{background:var(--acc-soft);border-color:#bfdbfe;color:var(--acc2)}
  .grp-h:hover{background:#f8fafc}
  .subrow select{padding:3px 8px;border:1px dashed #bfdbfe;background:#fff;border-radius:12px;font-size:11.5px;color:var(--sub);cursor:pointer}
  .fe .del{color:#fecaca;cursor:pointer;font-size:11px;visibility:hidden}
  .fe:hover .del{visibility:visible}
  .fe.hov .tx{background:#ffffff;border:1px dashed #fbbf24;border-radius:7px;padding:4px 9px;color:#854d0e;font-size:11.5px}
  #drawer .dfoot{border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:8px;flex-wrap:wrap}
  #drawer .dfoot button{font-size:12px;padding:6px 10px}

  /* 인수인계 */
  .honote{margin:0 18px 4px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .honote .hh{display:flex;align-items:center;gap:5px;padding:7px 11px;background:var(--bg);font-size:12px;font-weight:800;cursor:pointer;color:var(--ink)}
  .honote .hh .st2{margin-left:auto;font-size:11px;font-weight:700}
  .honote .hb{padding:9px 11px;display:flex;flex-direction:column;gap:8px}
  .honote label{font-size:11.5px;font-weight:800;color:var(--ink)}
  .honote textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12px;resize:vertical;min-height:34px}
  .honote textarea:focus{outline:none;border-color:var(--acc)}
  .recvbtn{display:block;margin:10px 18px 0;padding:9px;background:var(--ok);border:none;color:#fff;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;text-align:center}
  /* ⚠ 「미작성」이 열 폭(64px) 안에서 세 줄로 쪼개져 줄 높이를 51px 로 밀어 올렸다.
     한글은 아무 데서나 줄이 바뀌므로 짧은 말도 좁은 칸에서는 쪼개진다. 줄을 묶는다. */
  .ck{color:var(--ok);font-weight:800;white-space:nowrap}
  .ckno{color:#dc2626;font-weight:800;white-space:nowrap}
  /* 인수인계 틀고정 — 위 영역은 스크롤하면 제목 한 줄로 접히고, 표 머리행이 그 아래 붙는다.
     높이를 숫자로 박지 않고 실제로 재서 넣는다(--topbarh·--hoheadh). 위 막대가 바뀌어도 따라온다. */
  .hohead{position:sticky;top:var(--topbarh,38px);z-index:12;background:#f8fafc}
  .hohead .hoslim{display:none}
  .hohead.slim .hofull{display:none}
  .hohead.slim .hoslim{display:flex;align-items:center;gap:9px;padding:5px 0 6px;
    border-bottom:1px solid var(--line);margin-bottom:10px}
  .hohead.slim .hoslim h1{font-size:15px;margin:0}
  /* 표 머리행 — 위 영역이 접힌 높이만큼 내려서 붙인다.
     ⚠ 감싸는 칸에 overflow:auto 를 주면 sticky 가 그 칸 기준이 되어 화면에 안 붙는다.
        좁은 화면에서만 가로 스크롤을 준다. */
  .hotbl thead th{position:sticky;
    top:calc(var(--topbarh,38px) + var(--hoheadh,34px) + var(--hcth,34px));
    z-index:6;background:var(--panel);box-shadow:inset 0 -1px 0 var(--line)}
  @media (max-width:760px){ .hotbl{overflow-x:auto} .hotbl thead th{position:static;box-shadow:none}
    .hocard .hct{position:static;margin:-14px -16px 8px} }
  /* 회사 묶음 머리줄 — 그 회사 것을 한 번에 넘기는 자리.
     ⚠ sticky 로 만들지 않는다. 표 머리행이 이미 붙어 있어 둘이 겹친다. */
  .hotbl tr.hogrp td{background:var(--bg);border-top:1px solid var(--line);padding:6px 8px;font-size:12.5px}
  .hotbl tr.hogrp b{font-weight:800}
  .hotbl tr.hogrp .muted{font-size:11.5px;margin-left:4px}
  /* 후임 지정 — 고르는 칸과 [지정]을 한 줄에. 폭을 묶어 두지 않으면 이름이 긴 사람을
     고른 순간 [지정]이 아래로 밀려 줄 높이가 두 배가 된다. */
  .sucw{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;max-width:100%}
  .sucw select{padding:3px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;
    max-width:118px;min-width:0;font-family:inherit;background:#fff}
  .sucw button{font-size:10.5px;padding:2px 7px;flex:0 0 auto}
  /* 인수인계 표 머리 걸러 보기 */
  .hofh{cursor:pointer;user-select:none;white-space:nowrap}
  .hofh:hover{color:var(--acc2)}
  .hofh.on{color:var(--acc2);font-weight:800}
  .hofp{position:absolute;z-index:30;margin-top:4px;min-width:170px;max-width:260px;
    background:#fff;border:1px solid var(--acc2);border-radius:10px;box-shadow:0 8px 24px rgba(24,34,52,.14);
    padding:8px;font-weight:400;text-transform:none;letter-spacing:0}
  .hotbl thead th{position:sticky;overflow:visible}
  /* 인수인계 위 줄 — 제목과 등록칸을 한 줄에 */
  .horeg{gap:7px;flex-wrap:wrap;margin-bottom:10px}
  .horeg .rl{font-size:12.5px;font-weight:800;color:var(--sub);white-space:nowrap}
  .horeg .tin{padding:4px 10px;border:1px solid var(--line);border-radius:13px;font-size:12px;font-family:inherit}
  .horeg button.primary{padding:5px 14px;font-size:12.5px}
  .hocard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
  /* 카드 머리(부재자 이름·진행률)도 함께 고정한다 — 내리다 보면 누구 건을 넘기는
     중인지가 사라져 이름 없이 회사 목록만 보게 된다.
     ⚠ 음수 여백으로 카드 좌우 여백까지 덮는다. 안 그러면 줄이 그 틈으로 비쳐 지나간다.
     sticky 는 제 부모(.hocard) 안에서만 붙으므로 다음 사람 카드로 넘어가면 알아서 바뀐다. */
  .hocard .hct{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    position:sticky;top:calc(var(--topbarh,38px) + var(--hoheadh,34px));z-index:8;
    background:var(--panel);margin:-14px -16px 8px;padding:10px 16px 8px;
    border-bottom:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0}
  .hocard .hct b{font-size:14.5px}
  .lvtag{font-size:10.5px;font-weight:800;border-radius:9px;padding:1px 9px;background:var(--warn-bg);color:var(--warn)}
  .pbar{flex:1;min-width:120px;height:7px;background:var(--bg);border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--acc)}
  .fld{display:flex;flex-direction:column;gap:4px}.fld.full{grid-column:1/-1}
  .fld label{font-size:11.5px;color:var(--sub);font-weight:600}
  .fld input,.fld select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
  .chipbtn{font-size:12px;border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:14px;padding:3px 11px;cursor:pointer;user-select:none}
  .chipbtn.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
  /* 지금 눌러도 달라질 것이 없는 버튼 — 눌리지 않게 하고 옅게 둔다 */
  .chipbtn.off{opacity:.35;cursor:default;pointer-events:none}
  /* ── 화면 넓게 쓰기 ────────────────────────────────────────────
     빽빽하게(cmp): 줄 높이를 줄여 한 화면에 두 배쯤 담는다.
     메뉴 접기(nos): 왼쪽 200px을 표에 돌려준다. 둘 다 이 컴퓨터에 기억한다. */
  body.nos #side{transform:translateX(-100%)}
  body.nos #main{margin-left:0}
  #sideOn{position:fixed;left:0;top:52px;z-index:25;display:none;cursor:pointer;
    background:#fff;border:1px solid var(--line);border-left:none;border-radius:0 9px 9px 0;
    padding:9px 7px;font-size:13px;color:var(--sub);box-shadow:2px 2px 8px rgba(15,32,60,.08)}
  #sideOn:hover{color:var(--acc);border-color:var(--acc)}
  body.nos #sideOn{display:block}
  #side{transition:transform .16s}
  body.cmp th,body.cmp td{padding:4px 8px;font-size:12.5px}
  body.cmp #app{padding:10px 14px 84px}
  body.cmp h1{font-size:17px}
  body.cmp .panel{padding:10px 12px;margin-bottom:9px}
  body.cmp td.itc .sub,body.cmp .mgl{margin-top:0}
  body.cmp .wkc .wkin{padding:1px 4px}
  body.cmp .wklog{line-height:1.3}
  body.cmp .dbox{margin:7px 14px 0}
  /* ── 폰 : 왼쪽 메뉴는 «서랍» 이다 ──
     예전에는 display:none 이었다. 그래서 폰에서는 「팀 전체·업무량·지식·인수인계·
     종료·내 성과급·전체 검색」으로 갈 길이 **하나도 없었다** — 내 업무에 갇혔다
     (대표 지시 2026-08-20). PC 의 메뉴를 그대로 밀어 넣는다. */
  #menubtn{display:none}

/* 큰 목록은 value 로 지켜보지 않는다. value 는 항목 하나만 바뀌어도 목록 전체를
   모든 열린 화면으로 다시 내려보낸다. 최초에는 child_added 로 한 번 채우고,
   그 뒤에는 바뀐 항목 한 건만 받아 같은 화면 상태를 유지한다. */
function watchMapChildren(path, assign, settled, denied){
  var ref=fbDb.ref(path), map={}, timer=null;
  function publish(){
    assign(map);
    clearTimeout(timer);
    timer=setTimeout(function(){ if(settled) settled(); },140);
  }
  function put(snap){ map[snap.key]=snap.val(); publish(); }
  function drop(snap){ delete map[snap.key]; publish(); }
  ref.on('child_added',put,denied);
  ref.on('child_changed',put,denied);
  ref.on('child_removed',drop,denied);
  /* 빈 목록은 child_added가 오지 않으므로 첫 항목만 확인해 초기 화면을 연다. */
  ref.limitToFirst(1).once('value').then(function(s){ if(!s.exists()) publish(); }).catch(function(e){ if(denied) denied(e); });
  return function(){
    clearTimeout(timer);
    try{ ref.off('child_added',put); ref.off('child_changed',put); ref.off('child_removed',drop); }catch(e){}
  };
}

    /* 급여 처리 → 월 한 줄. 업무 목록이 온 «뒤에» 돌아야 붙일 자리를 찾는다.

  });
  document.addEventListener('focusout',function(){ setTimeout(function(){
    if(S._pend&&!appHasFocus()){ S._pend=false; route(); } },150); });

/* ── 빠른 기록 바 옮기기 ──────────────────────────────────────────────
   기본은 화면 아래에 붙어 있다. 그런데 표의 맨 아랫줄이 바에 가려 정작
   기록할 줄이 안 보이는 일이 있다. ⚡을 잡고 끌어 옮기고, 그 자리를 이
   컴퓨터에 기억해 둔다(사람마다 화면 크기가 다르므로 브라우저에 저장). */
var QBAR_POS='work_qbar_pos';
function qbarPut(l,t,wd){
  var w=$('qwrap'); if(!w) return;
  wd=Math.max(320,Math.min(wd||w.offsetWidth||520,window.innerWidth-16));
  var hh=w.offsetHeight||60;
  w.classList.add('moved');
  w.style.width=wd+'px'; w.style.right='auto'; w.style.bottom='auto';
  w.style.left=Math.max(8,Math.min(l,window.innerWidth-wd-8))+'px';
  w.style.top =Math.max(8,Math.min(t,window.innerHeight-hh-8))+'px';
}
function qbarSave(){
  var w=$('qwrap'); if(!w) return;
  var r=w.getBoundingClientRect();
  try{ localStorage.setItem(QBAR_POS,JSON.stringify({l:r.left,t:r.top,w:r.width})); }catch(e){}
}
function qbarLoad(){
  var p=null; try{ p=JSON.parse(localStorage.getItem(QBAR_POS)||'null'); }catch(e){}
  if(p&&typeof p.l==='number'&&typeof p.t==='number') qbarPut(p.l,p.t,p.w);
}
function qbarReset(){
  var w=$('qwrap'); if(!w) return;
  w.classList.remove('moved');
  w.style.left=''; w.style.top=''; w.style.right=''; w.style.bottom=''; w.style.width='';
  try{ localStorage.removeItem(QBAR_POS); }catch(e){}
  toast('빠른 기록을 제자리로 옮겼습니다');
}
function qbarDrag(e){
  var w=$('qwrap'); if(!w||(e.button!==undefined&&e.button!==0)) return;
  e.preventDefault();
  var r=w.getBoundingClientRect(), dx=e.clientX-r.left, dy=e.clientY-r.top, wd=r.width;
  w.classList.add('drag');
  function mv(ev){ qbarPut(ev.clientX-dx,ev.clientY-dy,wd); }
  function up(){
    document.removeEventListener('pointermove',mv);
    document.removeEventListener('pointerup',up);
    w.classList.remove('drag'); qbarSave();
  }
  document.addEventListener('pointermove',mv);
  document.addEventListener('pointerup',up);
}
// 창을 줄이면 바가 화면 밖으로 나가 다시 잡을 수가 없다 — 안쪽으로 되돌린다
window.addEventListener('resize',function(){
  var w=$('qwrap'); if(!w||!w.classList.contains('moved')) return;
  var r=w.getBoundingClientRect(); qbarPut(r.left,r.top,r.width);
});

/* ── 내가 누구인지 (푸른이알피 재직자 연결) ── */
function _normStaff(v){
  if(!v) return []; if(!Array.isArray(v)) v=Object.keys(v).map(function(k){return v[k];});
  var seen={};
  return v.filter(function(u){return u&&u.sid;})
    .filter(function(u){return !u.status||u.status==='active'||(u.status==='leave'&&u.leaveLoginAllowed===true);})
    .filter(function(u){ if(seen[u.sid])return false; seen[u.sid]=1; return true; })
    .map(function(u){return {sid:u.sid,name:u.name||u.sid,title:u.title||u.role||'',
      ord:(typeof u.sortOrder==='number')?u.sortOrder:9999};})
    // 푸른이알피가 정해 둔 차례(sortOrder)를 그대로 쓴다. 예전에는 사번순이라
    // A-00x(사무직)이 앞에, P-00x(노무사)가 뒤에 와서 그쪽 화면과 순서가 달랐다.
    .sort(function(a,b){ return (a.ord-b.ord)
      ||String(a.sid||'').localeCompare(String(b.sid||''),'en',{numeric:true}); });
}
/* ── 명부 «전부» (퇴사자 포함) ──
   ⚠ _staffCache 는 재직자만 걸러 둔 것이다. 퇴사자의 «사번»을 알아야 승계표와 이을 수
     있는데(업무의 mgr_main.sid 가 비어 있고 이름만 있다 — 실측 2026-08-27),
     그 사번은 걸러 낸 쪽에만 있다. 그래서 «거르지 않은» 벌을 따로 둔다.
   ⚠ 새로 읽어 오지 않는다 — 같은 자료(data/user_accounts/v)를 한 번 읽어 두 벌로 쓴다. */
var _allStaffCache=null;
function _normAll(v){
  if(!v) return []; if(!Array.isArray(v)) v=Object.keys(v).map(function(k){return v[k];});
  return v.filter(function(u){return u&&u.name;}).map(function(u){
    return {sid:String(u.sid||''),name:String(u.name),title:String(u.title||''),
            status:String(u.status||''),ord:(typeof u.sortOrder==='number')?u.sortOrder:9999};});
}
/* 명부를 «정말로» 읽어냈는가.
   ⚠ 이것이 거짓이면 아무도 「퇴직」이라고 부르지 않는다 — 모르는 것을 단정하면 안 된다.
     2026-09-05 대표 보고: 사무장으로 들어가니 재직자 여섯이 «전원 (퇴직)» 으로 떴다.
     까닭은 data/user_accounts 가 «재무 권한자만» 읽는 자리라서다(규칙 finOnly).
     재무 권한이 없는 사람은 명부가 통째로 비었고, 목록에 남은 이름은 전부
     「명부에 없는 사람 = 퇴직」으로 찍혔다. */
var _staffKnown=false;
function loadStaff(){
  if(_staffCache) return Promise.resolve(_staffCache);
  try{ var raw=localStorage.getItem('pureun_v6_user_accounts');
    if(raw){ var pv=JSON.parse(raw); var a=_normStaff(pv);
      if(a.length){ _staffCache=a; _allStaffCache=_normAll(pv); _staffKnown=true; return Promise.resolve(a); } } }catch(e){}
  function _take(v){
    var a=_normStaff(v);
    if(!a.length) return false;
    _staffCache=a; _allStaffCache=_normAll(v); _staffKnown=true; return true;
  }
  /* 재무 권한이 없으면 user_accounts 에서 막힌다 → «공개 명부»(user_dir)로 되짚는다.
     user_dir 은 로그인·권한용 칸만 담은 슬림 명부라 전 직원이 읽을 수 있다
     (푸른이알피도 로그인할 때 이 길을 쓴다). */
  return fbDb.ref('data/user_accounts/v').once('value')
    .then(function(s){ return _take(s.val()); }, function(){ return false; })
    .then(function(ok){
      if(ok) return _staffCache;
      return fbDb.ref('data/user_dir/v').once('value')
        .then(function(s){ _take(s.val()); }, function(){})
        .then(function(){
          if(!_staffCache){ _staffCache=[]; _allStaffCache=[]; }   // 못 읽었다 — _staffKnown 은 거짓 그대로
          return _staffCache;
        });
    });
}
function allStaff(){ return _allStaffCache||[]; }
function staffByName(n){
  var k=String(n||'').trim();
  return allStaff().filter(function(u){return u.name===k;})[0]||null;
}
function staffBySid(s){
  var k=String(s||'').trim(); if(!k) return null;
  return allStaff().filter(function(u){return u.sid===k;})[0]||null;
}

/* ══════════════════════════════════════════════════════════════════════════
   승계표 — 메일함과 «같은 표»를 본다 (대표 지시 2026-08-26 「업무관리 연결」)
   ══════════════════════════════════════════════════════════════════════════
   "과거 담당자의 정보나 메일 등 자료가 새로운사람에게 이관되고 쉽게 검토 찾을 수
    있도록 해야한다."

   ★ 표는 pucards/config/staffSucc 에 있다(사번 → 사번). 메일함(기업정보함)이 적고
     여기서 읽는다. 두 앱이 «각자» 후임을 정하면 메일은 A 에게, 업무는 B 에게 가서
     아무도 그 사람 몫 전부를 못 본다.
   ⚠ 여기서도 «적을 수 있다» — 업무관리에서 후임을 정하면 메일함도 따라간다.
     한쪽에서만 적으면 「연결」이 아니라 「복사」가 된다.
   ⚠ 표가 없다고 아무것도 막지 않는다. 지금처럼 건별로 후임을 고르면 된다.
   ⚠ 실측 2026-08-27 — 업무 271건 가운데 퇴사자가 주담당인 것은 임혜미 15건(안 끝난 것 13건)
     뿐이다. 다른 퇴사자는 업무관리에 없다. */
var _succCache=null;
var SUCC_PATH='pucards/config/staffSucc';
function loadSucc(){
  if(_succCache) return Promise.resolve(_succCache);
  if(typeof fbDb==='undefined'||!fbDb){ _succCache={}; return Promise.resolve(_succCache); }
  return fbDb.ref(SUCC_PATH).once('value')
    .then(function(s){ _succCache=s.val()||{}; return _succCache; })
    .catch(function(){ _succCache={}; return _succCache; });   /* 못 읽어도 화면은 돈다 */
}
function succMap(){ return _succCache||{}; }
/* 이 사람(이름)을 이어받은 «재직자» 이름. 없으면 빈 값.
   ⚠ 이어받은 사람도 퇴사했으면 그 다음까지 — «두 번»만 따라간다.
     한없이 따라가면 서로 가리키는 표에서 안 멈춘다(메일함 쪽과 같은 규칙). */
function succOfName(name){
  var u=staffByName(name); if(!u||!u.sid) return '';
  var to=staffBySid(succMap()[u.sid]); if(!to) return '';
  if(to.status==='retired'){
    var to2=staffBySid(succMap()[to.sid]);
    return (to2&&to2.status!=='retired')?to2.name:'';
  }
  return to.name;
}
/* ══════════════════════════════════════════════════════════════════════════
   승계표대로 «저절로» 넘긴다 (대표 지시 2026-08-27)
   ══════════════════════════════════════════════════════════════════════════
   "푸른이알피 또는 업무관리에서 승계정리를 하면 업무관리는 자동으로 승계되게 해달라"

   ★ 표 한 줄이 세 곳을 움직인다 — 메일함은 «보기»만 바꾸면 되지만(자리를 안 옮긴다),
     업무는 «주담당»을 실제로 바꿔야 그 사람 화면에 뜬다. 그래서 여기만 자동으로 쓴다.

   ⚠ 지키는 것 다섯
     ① 퇴사자만 — 재직자 몫을 표 하나로 옮기면 그 사람이 모르는 사이에 일이 사라진다
     ② 진행 중인 것만 — 끝난 건은 지난 기록이다
     ③ 한 건씩 _handoverTo 로 — 「담당 A → B (인수 확인 대기)」 기록이 건마다 남아야
        누가 언제 넘겼는지 남는다. 통째로 갈아 끼우면 그것이 사라진다
     ④ 멱등 — 이미 그 사람이 주담당이면 _handoverTo 가 건너뛴다. 두 사람이 같이 열어도
        두 번 넘어가지 않는다
     ⑤ 조용히 하지 않는다 — 몇 건이 왜 옮겨졌는지 알림으로 말해 준다.
        말 없이 열세 건이 옮겨지면 「내 업무가 왜 늘었지」가 된다

   ⚠ 자동이므로 «되돌리기»가 표 한 줄로는 안 된다(업무는 이미 넘어갔다). 그래서
     사람이 표를 적을 때 그렇게 적어 두었다(succDeclare 의 물음). */
var _succAutoDone=false;
function succAutoSoon(){
  /* 업무 목록이 아직 안 왔을 수 있다 — 조금 뒤에 한 번만 돈다 */
  setTimeout(succAuto, 2500);
}
function succAuto(){
  if(_succAutoDone) return;
  if(!items || !Object.keys(items).length) return;      /* 아직 목록이 없다 — 다음 기회에 */
  loadStaff().then(loadSucc).then(function(){
    if(_succAutoDone) return;
    var map=succMap(), keys=Object.keys(map);
    if(!keys.length){ _succAutoDone=true; return; }
    var moved=[];
    keys.forEach(function(fromSid){
      var from=staffBySid(fromSid);
      if(!from||from.status!=='retired') return;         /* ① 퇴사자만 */
      var toName=succOfName(from.name); if(!toName) return;
      var to=staffByName(toName); if(!to||!to.sid) return;
      var arr=openItems().filter(function(it){           /* ② 진행 중인 것만 */
        var m=it.mgr_main||{};
        return m.name===from.name && m.sid!==to.sid;     /* ④ 이미 넘어간 것은 뺀다 */
      });
      if(!arr.length) return;
      /* ③ 한 건씩 — 기록에 «승계표대로»라고 남긴다. 사람이 그때 고른 것이 아니다. */
      arr.forEach(function(it){ _handoverTo(it._id,to.sid,to.name,'승계표대로 자동'); });
      moved.push(from.name+' → '+to.name+' '+arr.length+'건');
    });
    _succAutoDone=true;
    if(moved.length){                                    /* ⑤ 조용히 하지 않는다 */
      toast('🔗 승계표대로 넘겼습니다 — '+moved.join(' · ')+' (인수 확인 대기)');
      setTimeout(route, 600);
    }
  }).catch(function(){ /* 못 읽어도 화면은 그대로 돈다 */ });
}

/* 승계표에 한 줄 적는다 — 메일함도 이 표를 본다 */
function succSet(fromName,toSid,toName){
  var from=staffByName(fromName);
  if(!from||!from.sid) return Promise.resolve(false);
  if(!toSid||toSid===from.sid) return Promise.resolve(false);

    toast('🔗 승계표: '+fromName+' → '+toName+' — 메일함도 함께 바뀝니다'); return true;
  }).catch(function(e){

/* 「나는 누구인가」는 «로그인 이메일» 로만 정한다 (2026-08-16 대표 지시).
   ⚠ 전에는 셋을 차례로 봤다: ①localStorage 의 work_me_sid ②이메일 ③주소의 user=.
     ①은 «이 기기에 남은 앞사람 사번» 이라 다음 사람이 앞사람으로 잡혔고,

/* 「내 업무」·「내 현장 방문」이 보는 사람 = «언제나 로그인 본인».
   ★ 2026-09-05 대표 지시로 «남을 골라 보는 길»을 없앴다.

// 담당자 선택 목록 = 재직자 + 실제 업무를 갖고 있는 사람(퇴직자 포함)
function ownerOptions(){
  var seen={}, out=[];
  (_staffCache||[]).forEach(function(u){ if(!seen[u.name]){ seen[u.name]=1; out.push({sid:u.sid,name:u.name,active:1}); } });
  /* ⚠ 명부에 없다고 곧바로 「퇴직」이라 부르지 않는다.

  openItems().forEach(function(it){

  t.textContent=msg; t.className='show'+(type==='err'?' err':(type==='warn'?' warn':''));
  clearTimeout(window._toastT); window._toastT=setTimeout(function(){ t.className=''; }, type==='err'?3200:1600);
}

function confirmM(msg,opts){
  opts=opts||{};
  return new Promise(function(resolve){
    var m=document.createElement('div'); m.id='confirmbg';
    m.style.cssText='position:fixed;inset:0;background:rgba(20,30,50,.4);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
    var danger=opts.danger?'#991b1b':'var(--acc)';
    m.innerHTML='<div style="background:#fff;border-radius:14px;padding:22px 24px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.28)">'
      +'<div style="font-size:14px;line-height:1.6;white-space:pre-line;margin-bottom:18px">'+esc(msg)+'</div>'
      +'<div class="row" style="justify-content:flex-end;gap:8px"><button id="cf-no">'+esc(opts.cancel||'취소')+'</button>'
      // 세 번째 길 — 안 주면 예전 그대로 둘이다. 「되돌릴까 말까」처럼 둘로는 못 묻는 것에 쓴다.
      +(opts.alt?'<button id="cf-alt">'+esc(opts.alt)+'</button>':'')
      +'<button id="cf-yes" class="primary" style="background:'+danger+'">'+esc(opts.ok||'확인')+'</button></div></div>';
    document.body.appendChild(m);
    function done(v){ m.remove(); document.removeEventListener('keydown',key,true); resolve(v); }
    function key(e){ if(e.key==='Escape'){e.stopPropagation();done(false);} else if(e.key==='Enter'){e.stopPropagation();done(true);} }
    m.querySelector('#cf-yes').onclick=function(){done(true);};
    m.querySelector('#cf-no').onclick=function(){done(false);};
    var al=m.querySelector('#cf-alt'); if(al) al.onclick=function(){done('alt');};
    m.onclick=function(e){ if(e.target===m) done(false); };
    document.addEventListener('keydown',key,true);
    var y=m.querySelector('#cf-yes'); if(y)y.focus();
  });
}

/* ── 열 접기 ────────────────────────────────────────────────────────
   안 쓰는 열을 없애지 않고 접는다 — 기록이 쌓이면 「최근 기록」이 다시
   필요해진다. 접힌 열은 사라지지 않고 폭 14px 띠로 남아 그 자리에서 편다.
   메뉴 안에 숨기면 접었다는 사실 자체를 잊는다.
   이 브라우저에만 저장한다 — 남의 화면에 영향이 없고, 남의 업무를
   열람할 때도 내 설정이 유지된다. */
/* 내 업무와 팀 전체가 같은 코드를 쓴다. 열 구성이 서로 달라(팀에는 「이 주
   실적」이 있고 「이번 주」 격자가 없다) 화면별(sc)로 나눠 담는다.
   걸러 보기(fCols/fHas)와 같은 방식이다. */
/* 팀 열쇠가 2인 까닭: 예전 기본값(pt,last)이 사람들 브라우저에 저장돼 있어,
   기본값만 바꾸면 이미 쓰던 사람은 업무명이 계속 접힌 채로 남는다. */
var COLS_KEY={my:'work_my_cols2',team:'work_team_cols2'};
/* [키, 이름, 띠 이름]
   띠는 폭 14px 세로줄이라 긴 이름은 머리칸 높이를 넘어 위아래가 잘린다.
   띠에만 두 글자로 줄여 쓰고, 목록·툴팁에는 본디 이름을 그대로 둔다 —
   줄인 이름만 보이면 무슨 열인지 알 수 없다. */
/* ⚠⚠ 업무명(pt)은 «접을 수 있는 열이 아니다» (대표 보고 2026-09-06 「어디에서 뭘하는가 안보인다」).
     이 목록이 답해야 하는 것은 「어디에서(기업) 뭘 하는가(업무명)」 딱 두 가지다.
     업무명을 접으면 그 칸이 통째로 빈 띠가 되어, 회사 이름과 관리번호만 남는다 —
     「계약 2026-048」이 무슨 계약인지 알 길이 없다. 화면이 뜻을 잃는다.

   ★ 예전에 기본값을 「펴 둠」으로 고쳤지만(아래 COLS_DEFAULT), 그 앞에 «한 번이라도»
     이 화면을 연 사람은 브라우저에 접힌 채로 저장돼 있어 기본값이 가 닿지 않았다.
     그래서 목록에서 아예 뺀다 — colHidden 이 「접을 수 있는 열」인지 먼저 보므로,
     이미 저장된 옛 값(pt)은 그냥 «없는 말»이 되어 저절로 펴진다.
   ⚠ 되돌릴 일이 있으면 열을 늘리지 말고 다른 열을 접으십시오. */
var COLSET={
  my:  [['cat','구분','구분'],['st','상태','상태'],
        ['last','최근 기록','기록'],['due','다음 할 일','할일']],
  // 「이 주 실적」과 「최근 기록」은 둘 다 기록 열이라 하나로 합쳤다(log).
  team:[['cat','구분','구분'],['sub','부담당','부담'],
        ['st','상태','상태'],['log','기록','기록'],['due','다음 할 일','할일']]
};
// 처음 여는 사람이 보는 상태. 팀은 열을 하나도 접지 않는다 —
// 남는 폭을 기업 열이 다 먹는다.
var COLS_DEFAULT={my:'last',team:''};
function colCols(sc){ return COLSET[sc]||COLSET.my; }
function colHas(sc,k){ return colCols(sc).some(function(c){ return c[0]===k; }); }
function colPref(sc){
  S.cols=S.cols||{};
  if(S.cols[sc]===undefined){
    var v=null; try{ v=localStorage.getItem(COLS_KEY[sc]); }catch(e){}
    if(v===null) v=COLS_DEFAULT[sc]||'';         // 저장된 적 없음 = 기본값
    S.cols[sc]={};                               // 빈 문자열이면 전부 펴진 상태다
    /* ⚠ 접을 수 없게 된 열은 여기서 걷어 낸다 — 업무명(pt)처럼 나중에 목록에서
       빠진 이름이 저장값에 남아 있으면, 화면은 멀쩡한데 «저장된 글»만 거짓이 된다.
       다음에 이 사람이 열 하나를 접을 때 그 거짓말이 그대로 다시 저장된다. */
    String(v).split(',').forEach(function(k){ if(k&&colHas(sc,k)) S.cols[sc][k]=1; });
  }
  return S.cols[sc];
}
/* 묶어 보기가 켜져 있으면 구분은 열이 아니다 — 소제목에 이미 쓰여 있다.
   이때는 사람이 접거나 펼 수 있는 대상이 아니므로 단추도 내주지 않는다.
   팀 전체는 담당(사람)으로 묶으므로 겹치는 열이 없다. */
function colForced(sc,k){ return sc==='my'&&k==='cat'&&grpOn(); }
function colHidden(sc,k){
  if(!colHas(sc,k)) return false;                // 접을 수 없는 열
  if(colForced(sc,k)) return true;
  return !!colPref(sc)[k];
}
function colToggle(sc,k){
  if(!colHas(sc,k)) return;
  // 묶어 보기가 잡고 있는 열은 눌러도 안 바뀐다. 저장까지 해 두면 나중에
  // 묶어 보기를 껐을 때 까닭 없이 접혀 있게 되므로 아무것도 하지 않는다.
  if(colForced(sc,k)) return;
  var p=colPref(sc);
  if(p[k]) delete p[k]; else p[k]=1;
  try{ localStorage.setItem(COLS_KEY[sc],Object.keys(p).join(',')); }catch(e){}
  fRender(sc);
}
// 접힌 열은 <th>/<td> 를 폭 14px 띠로 바꾼다. 띠 자체가 펴는 단추다.
function colTH(sc,k,inner,style){
  var c=colCols(sc).filter(function(x){ return x[0]===k; })[0];
  // 펴진 열에는 접는 손잡이를 단다. 이것이 없으면 한 번 편 뒤에는 팝업으로만
  // 다시 접을 수 있어, 접고 펴는 일이 한쪽으로만 된다.
  if(!c||!colHidden(sc,k))
    return '<th style="'+(style||'')+'">'
      +(c?'<span class="cfold" onclick="event.stopPropagation();colToggle(\''+sc+'\',\''+k+'\')" '
          +'title="'+esc(c[1])+' 열 접기">‹</span>':'')

function _inTyping(e){ var t=e.target||document.activeElement;

/* 한글을 치는 중에 누른 Enter인가.
   "정리" 를 치고 Enter를 누르면 마지막 글자를 확정하는 Enter가 먼저 온다.
   그것을 저장으로 받으면 "정" 만 저장되거나 같은 줄이 두 번 들어간다.
   조합이 끝난 뒤의 Enter만 받는다. keyCode 229는 옛 브라우저용. */
function _ime(e){ return !!(e&&(e.isComposing||e.keyCode===229)); }

/* ── 단축키 ────────────────────────────────────────────────────────
   매주 수십 건을 훑고 한 줄씩 적는 화면이라, 손이 자판을 떠나지 않는 것이
   가장 크다. 아래 한 목록이 도움말(?)과 실제 동작을 함께 만든다 —
   따로 적어 두면 언젠가 도움말만 남고 동작은 바뀐다. */
/* ⚠ 「지식」은 여기 없다 (대표 지시 2026-09-06 「내업무와 지식을 분리시킬 필요가 없다」).
   지식은 «업무 안»에서 태어나고(서랍 ↗·＋ 지식 적기) 업무 안에서 따라 나온다(관련 지식).

var NAV_KEYS=['my','team','stats','ho','archive'];
var KEYS=[
  ['기록하기',[
    ['/','빠른 기록 칸으로 (어느 화면에서든)'],

  ]],

function keysModal(){
  showModal('<h2 style="margin:0 0 4px">⌨ 단축키</h2>'
    +'<p class="muted" style="font-size:12px;margin:0 0 12px">글자를 입력하는 중에는 단축키가 듣지 않습니다 — 마음 놓고 치세요.</p>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 22px">'
    +KEYS.map(function(g){
        return '<div><div style="font-size:11.5px;font-weight:800;color:var(--acc2);margin-bottom:5px">'+esc(g[0])+'</div>'
          +g[1].map(function(k){
              return '<div style="display:flex;gap:9px;align-items:baseline;padding:2px 0;font-size:12.5px">'
                +'<span class="kbd">'+esc(k[0])+'</span>'
