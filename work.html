<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>업무관리</title>
<!-- 폰 홈화면 앱 (푸른카메라·명함첩과 같은 방식) -->
<link rel="manifest" href="work-manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="업무관리">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="js/pu-resilience.js"></script>
<script src="js/pu-health.js"></script>
<script src="js/pu-version.js"></script>
<script src="js/pu-backup.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<style>
  :root{--acc:#2563eb;--acc2:#1b4bc0;--acc-soft:#e9f0fe;--ink:#182234;--sub:#59637a;--faint:#8b94a6;
    --line:#e4e9f1;--panel:#fff;--bg:#f4f6fa;--ok:#1f7a4d;--ok-bg:#e7f6ee;--warn:#b45309;--warn-bg:#fdf1e1;
    --danger:#c0392b;--danger-bg:#fdeceb;--radius:11px}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;color:var(--ink);background:#fbfcfe;font-size:14px;-webkit-font-smoothing:antialiased}
  #side{position:fixed;top:0;left:0;width:200px;height:100vh;background:#fff;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;z-index:20}
  .logo{display:flex;align-items:center;gap:9px;padding:2px 6px 12px}
  .logo .ic{font-size:22px}.logo b{font-size:14px}.logo .s{font-size:11px;color:var(--sub)}
  .sitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--sub);font-size:13px}
  .sitem:hover{background:var(--bg)}.sitem.on{background:var(--acc-soft);color:var(--acc2);font-weight:700}
  .sitem .cnt{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  .sitem.nw{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .side-sec{font-size:10.5px;letter-spacing:.1em;color:var(--faint);padding:12px 8px 4px;text-transform:uppercase}
  #main{margin-left:200px;min-height:100vh}
  #topbar{position:sticky;top:0;z-index:15;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:9px 22px;display:flex;align-items:center;gap:12px;font-size:13px}
  #crumb{font-weight:700;color:var(--sub)}
  #topright{margin-left:auto;display:flex;align-items:center;gap:11px}
  #conn{font-size:12px;color:var(--sub)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#cbd5e1;margin-right:5px}.dot.on{background:var(--ok)}
  #topuser{font-weight:700;font-size:12.5px}#topuser .role{color:var(--sub);font-weight:500;margin-left:4px}
  #topclock{font-variant-numeric:tabular-nums;color:var(--sub);font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
  #logoutbtn{font-size:12.5px;padding:5px 12px;border:1px solid #e6a19a;color:var(--danger);background:#fff;border-radius:8px;cursor:pointer;font-weight:700}
  #app{padding:18px 22px 90px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
  .row{display:flex;align-items:center;gap:10px}
  h1{font-size:20px;margin:0}h2{font-size:16px;margin:0}
  .muted{color:var(--sub)}
  input,select,textarea{font-family:inherit}
  /* 예시 문구는 '따라 적으라'가 아니라 '이런 걸 적으면 된다'는 힌트 — 눈에 띄게 흐리게 */
  input::placeholder,textarea::placeholder{color:#b3bbc9;opacity:1;font-weight:400}
  input:focus::placeholder,textarea:focus::placeholder{color:#cdd3de}
  button{font-family:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--ink)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}button.primary:hover{background:var(--acc2)}
  .gate{max-width:520px;margin:90px auto;text-align:center;color:var(--sub)}.gate a{color:var(--acc);font-weight:700}
  #toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:#1f2937;color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:400;max-width:80vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:#b91c1c}#toast.warn{background:#b45309}
  .loading{display:flex;align-items:center;gap:10px;padding:22px 16px;color:var(--sub);font-size:13px}
  .loading .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 주 내비 + 포커스 */
  .wkpill{font-size:12.5px;font-weight:700;color:var(--acc2);background:var(--acc-soft);border:1px solid #c7d7fe;border-radius:14px;padding:3px 13px;cursor:pointer;font-variant-numeric:tabular-nums;user-select:none}
  .wknav{color:var(--faint);cursor:pointer;padding:2px 7px;border-radius:6px;font-size:14px;user-select:none}
  .wknav:hover{background:var(--bg)}
  /* 캘린더 (월·주·일 + 레이어 체크) — 격자선은 옅게, 강조는 오늘·이벤트에만 */
  .calwrap{background:#fff;border:1px solid #e8eef7;border-radius:14px;margin:0 0 12px;overflow:hidden;
    box-shadow:0 1px 2px rgba(24,34,52,.03),0 10px 26px -18px rgba(24,34,52,.16)}
  /* 캘린더를 오른쪽에 붙이고 표는 왼쪽 — 가운데를 끌어 폭을 나눈다.
     예전엔 캘린더가 표를 통째로 아래로 밀어내 둘을 함께 볼 수가 없었다. */
  .split{display:flex;align-items:flex-start;gap:0}
  .split>.spmain{flex:1 1 auto;min-width:0}
  .split>.spside{flex:0 0 auto;align-self:stretch}
  .split>.spside .calwrap{margin:0;position:sticky;top:8px;
    max-height:calc(100vh - 150px);display:flex;flex-direction:column}
  .split>.spside .calwrap .cgrid,.split>.spside .calwrap .cdayrow{overflow:auto}
  .spgrip{flex:0 0 11px;align-self:stretch;cursor:col-resize;position:relative;touch-action:none}
  .spgrip::after{content:'';position:absolute;left:5px;top:10px;bottom:10px;width:1px;background:var(--line)}
  .spgrip:hover::after,.spgrip.on::after{width:3px;left:4px;background:var(--acc);border-radius:2px}
  body.colres{cursor:col-resize;user-select:none}
  /* 캘린더가 옆에 붙으면 칸이 좁다 — 글자와 여백을 한 단계 줄인다 */
  .split>.spside .cday{min-height:56px;padding:3px 4px 5px}
  .split>.spside .cwcol{min-height:110px}
  .split>.spside .cev{font-size:10px;padding:1px 5px}
  /* 캘린더에서 고른 줄 — 잠깐 반짝여 어디로 왔는지 알려 준다 */
  tr.hit>td{background:var(--acc-soft)!important;transition:background .8s}
  tr.hit.off>td{background:transparent!important}
  .calhd{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 12px 8px}
  .calhd .ttl{font-size:14.5px;font-weight:800;letter-spacing:-.015em;min-width:112px;font-variant-numeric:tabular-nums}
  .cnav{width:25px;height:25px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
    color:#9aa6b8;cursor:pointer;font-size:16px;line-height:1;user-select:none;transition:background .12s,color .12s}
  .cnav:hover{background:#f1f5fb;color:var(--ink)}
  .cbtn{font-size:11.5px;font-weight:700;color:var(--sub);background:#f4f7fc;border:none;border-radius:8px;
    padding:4px 11px;cursor:pointer;user-select:none;transition:background .12s,color .12s}
  .cbtn:hover{background:#e8eef8;color:var(--ink)}
  .cbtn.gh{background:transparent;color:#a6b0c0}.cbtn.gh:hover{background:#f4f7fc;color:var(--sub)}
  .vseg{display:inline-flex;background:#f1f5fb;border-radius:9px;padding:2px;gap:2px}
  .vseg span{padding:3px 13px;font-size:11.5px;font-weight:700;color:#7a8698;cursor:pointer;border-radius:7px;
    user-select:none;transition:background .12s,color .12s}
  .vseg span:hover{color:var(--ink)}
  .vseg span.on{background:#fff;color:var(--acc2);box-shadow:0 1px 2px rgba(24,34,52,.13)}
  /* 거르개 — 묶음별 한 줄. 묶음 이름 너비를 못 박아 위아래 칩이 세로로 줄맞춤된다 */
  .lays{padding:0 12px 10px;display:flex;flex-direction:column;gap:5px}
  .lay{display:flex;align-items:flex-start;gap:5px;flex-wrap:wrap}
  .laygp{flex-shrink:0;width:62px;padding:4px 0;font-size:10px;font-weight:800;color:#b3bccb;
    letter-spacing:-.01em;white-space:nowrap;cursor:pointer;user-select:none;transition:color .12s}
  .laygp:hover{color:var(--ink)}
  .laygp.on{color:#7d8899}
  .laygp .gi{margin-left:2px;font-size:9px;opacity:.75}
  .lchk{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#8a94a6;
    border:1px solid #edf1f7;background:#fff;border-radius:999px;padding:3px 10px;cursor:pointer;user-select:none;
    transition:background .12s,border-color .12s,color .12s,opacity .12s;opacity:.62}
  .lchk:hover{opacity:1;border-color:#dde5f0}
  .lchk .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px #fff inset}
  .lchk.on{opacity:1;color:var(--ink);background:#f8fafd;border-color:#dde5f0}
  .lchk:not(.on) .dot{background:#c9d2df !important}
  .cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .cgrid.hd{border-top:1px solid #eef2f8;background:#fcfdff}
  .cdow{font-size:10px;font-weight:800;color:#a2adbe;text-align:center;padding:7px 0 6px;letter-spacing:.07em}
  .cdow.we{color:#d29a95}
  .cday{border-right:1px solid #f2f5fa;border-top:1px solid #f2f5fa;min-height:72px;padding:4px 5px 6px;
    overflow:hidden;transition:background .1s}
  .cday:nth-child(7n){border-right:none}
  .cday:hover{background:#fcfdff}
  .cday.out{background:#fbfcfe}.cday.out .dn{color:#ccd4e0}
  .cday.today{background:#f7faff}
  .cday.drop{background:var(--acc-soft);box-shadow:inset 0 0 0 2px var(--acc)}
  /* ⚠ inline-flex + 고정 크기 = 동그라미. block이면 배경이 셀 폭을 다 채워 막대처럼 보인다 */
  .cday .dn{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
    font-size:11px;font-weight:700;color:#6d7889;border-radius:50%;font-variant-numeric:tabular-nums}
  .cday .dn.we{color:#c98d88}
  .cday.today .dn,.cday.today .dn.we{background:var(--acc);color:#fff;font-weight:800}
  .cev{display:flex;align-items:center;gap:5px;font-size:10.5px;line-height:1.45;font-weight:600;
    padding:2px 6px;margin-top:2px;border-radius:6px;cursor:pointer;color:#3b465a;
    transition:filter .1s,box-shadow .1s}
  .cev:hover{filter:brightness(.975);box-shadow:0 1px 3px rgba(24,34,52,.09)}
  .cev.dg{cursor:grab}.cev.dg:active{cursor:grabbing}
  .cev .cd{width:5px;height:5px;border-radius:50%;flex-shrink:0}
  .cev .cx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  /* 일정 위의 작은 버튼 — 평소엔 숨어 있다가 마우스를 올리면 나온다 */
  .cev .cvb{display:none;flex:0 0 auto;font-size:9.5px;opacity:.75;padding:0 1px}
  .cev:hover .cvb{display:inline-block}
  .cev .cvb:hover{opacity:1}
  .cev .cqin{width:100%;min-width:0;border:1px solid var(--acc);border-radius:5px;padding:1px 5px;
    font-family:inherit;font-size:10.5px;outline:none}
  .cday.sel,.cwcol.sel{box-shadow:inset 0 0 0 2px var(--acc);background:var(--acc-soft)}
  .cday,.cwcol{cursor:pointer}
  .cmore{font-size:10px;font-weight:700;color:#98a3b4;padding:2px 6px;margin-top:1px;cursor:pointer;border-radius:5px}
  .cmore:hover{background:#f1f5fb;color:var(--acc2)}
  /* 주·일 보기 = 날짜별 목록 (일정은 시간순) */
  .cwcol{border-right:1px solid #f2f5fa;border-top:1px solid #f2f5fa;min-height:158px;padding:5px 6px 8px}
  .cwcol:nth-child(7n){border-right:none}
  .cwcol.today{background:#f7faff}
  .cwhd{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:#7a8698;
    padding:1px 0 6px;margin-bottom:4px;border-bottom:1px solid #f2f5fa}
  .cwhd .dn{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
    border-radius:50%;font-variant-numeric:tabular-nums}
  .cwhd.today .dn{background:var(--acc);color:#fff}
  .cwhd.we{color:#c98d88}
  .cdash{font-size:10.5px;color:#c4ccd8;padding:2px 2px}
  .cdayrow{display:flex;gap:12px;padding:8px 12px;border-top:1px solid #f2f5fa}
  .cdayrow:hover{background:#fcfdff}
  .cdayrow .dl{width:96px;flex-shrink:0;font-size:11px;font-weight:800;color:#9aa6b8;padding-top:2px;
    font-variant-numeric:tabular-nums}
  .cdayrow .dv{flex:1;min-width:0}
  .cdayrow .dv .cev{font-size:12px;padding:4px 9px;border-radius:7px}
  .cempty{font-size:12px;color:#a6b0c0;padding:26px 10px;text-align:center;border-top:1px solid #eef2f8}
  .histbanner{display:flex;align-items:center;gap:8px;background:#fffdf5;border:1px solid #fde68a;border-radius:9px;padding:7px 12px;font-size:12px;color:#854d0e;margin:0 0 10px}
  .histbanner .back{margin-left:auto;color:var(--acc2);font-weight:700;background:var(--acc-soft);border:1px solid #c7d7fe;border-radius:6px;padding:2px 10px;font-size:11.5px;cursor:pointer;white-space:nowrap}

  /* 표 */
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
  th{font-size:11px;color:var(--faint);letter-spacing:.03em;white-space:nowrap}
  /* 긴 목록 — 표만 스크롤하고 머리행은 붙어 있는다.
     42건·235건을 훑을 때 열 이름과 요일이 위로 사라지면 어느 칸인지 알 수 없다. */
  /* min-height는 두지 않는다 — 세 줄짜리 표(종료·업무량)가 빈 칸으로 길어진다 */
  .panel.tbl{padding:0;overflow:auto;max-height:calc(100vh - 250px)}
  /* 도구줄 드롭다운 — 브라우저 기본 네모가 둥근 칩들 사이에 섞여 어수선했다.
     칩과 같은 모양으로 맞추고 화살표는 삼각형 두 조각으로 얇게 그린다. */
  select.tool{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background-color:#fff;
    border-radius:13px;padding:4px 26px 4px 11px;font-size:12px;color:var(--sub);cursor:pointer;
    font-family:inherit;line-height:1.35;
    background-image:linear-gradient(45deg,transparent 50%,#9aa5b6 50%),linear-gradient(135deg,#9aa5b6 50%,transparent 50%);
    background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  select.tool:hover{border-color:#b9c4d4}
  /* 조건이 걸린 칸은 파랗게 — 무엇 때문에 목록이 좁아졌는지 도구줄만 봐도 알게 */
  select.tool.on{border-color:#cfe0ff;background-color:var(--acc-soft);color:var(--acc2);font-weight:700}
  .sepv{width:1px;height:16px;background:var(--line);margin:0 3px;display:inline-block;vertical-align:-3px}
  .cut{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  td .kind{font-size:12.5px}
  td .no{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
  td .no .to{color:#5b21b6}
  .panel.tbl thead th{position:sticky;top:0;z-index:6;background:var(--panel);
    box-shadow:inset 0 -1px 0 var(--line)}
  .panel.tbl tbody tr:hover>td{background:#fbfcff}
  .panel.tbl .grp-h td{position:sticky;top:31px;z-index:5}   /* 담당자 묶음 머리도 붙는다 */
  .badge{display:inline-block;font-size:10.5px;font-weight:800;border-radius:4px;padding:1px 8px;white-space:nowrap}
  .status{display:inline-block;font-size:10.5px;font-weight:800;border-radius:10px;padding:1px 9px;white-space:nowrap;cursor:pointer}
  /* 푸른이알피 원본 상태 — 우리 상태와 다른 축이라 아래에 옅게 덧붙인다 */
  .pest{font-size:10px;font-weight:700;color:var(--faint);margin-top:2px;white-space:nowrap}
  .pest::before{content:'🔗 ';font-size:8px}
  .due{font-size:11px;font-weight:800;color:#dc2626;font-variant-numeric:tabular-nums;white-space:nowrap}
  .due.ok{color:#16a34a}.due.soon{color:#ea580c}
  /* 사건 단계 기한 — 푸른이알피가 계산해 내려보낸 값. 다음 할 일과 나란히 두고 덮지 않는다 */
  .sdue{display:block;margin-top:2px;font-size:10.5px;font-weight:700;color:#b91c1c;white-space:nowrap}
  .sdue.unv{color:#b45309}
  .sdue .dd{font-variant-numeric:tabular-nums;margin-right:3px}
  td.itc{cursor:pointer;min-width:110px}
  td.itc .co{font-weight:700}
  td.itc .sub{font-size:11px;color:var(--faint);font-weight:400}
  td.itc span.sub{margin-left:6px}          /* 종료 화면 — 한 건을 한 줄로 */
  /* 담당 한 줄 — 주담당과 함께 하는 부담당(공동)을 나란히 */
  .mgl{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin-top:2px;font-weight:400}
  .mgk{font-size:9px;font-weight:800;color:var(--faint);letter-spacing:.04em}
  .mgk.sub{color:#7c5cd6}
  .mgt{font-size:10.5px;font-weight:700;color:var(--sub);background:#f1f5fb;border-radius:4px;padding:0 6px;white-space:nowrap}
  .mgt.sub{background:#ede9fe;color:#5b21b6}
  .mgt.hi{outline:1.5px solid var(--acc);outline-offset:-1.5px}
  /* 팀 전체는 한 건이 한 줄이라 담당·의뢰인 담당자를 기업명 옆으로 붙인다 */
  .mgl.inl{display:inline-flex;margin-top:0;margin-left:5px;vertical-align:1px}
  .ofc{font-size:11px;color:var(--faint);margin-left:5px}
  /* 푸른이알피에서 한 건씩 당겨오기 */
  .phd{font-size:11.5px;font-weight:800;color:var(--sub);margin:10px 0 4px;padding-top:6px;border-top:1px solid var(--line)}
  .prow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid #f1f4f9}
  .prow .px{flex:1;min-width:0;font-size:12.5px}
  .prow .px .sub{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prow .pm{display:flex;align-items:center;gap:3px;flex-shrink:0}
  .prow button{font-size:11.5px;padding:4px 10px;flex-shrink:0;white-space:nowrap}
  /* 업무 칸 — 윗줄 업무명(유형), 아랫줄 업무 요약 */
  td.tkc{cursor:pointer;min-width:140px;font-size:12.5px}
  td.tkc .brf{font-size:11px;color:#1d4ed8;font-weight:400;margin-top:1px}
  .last{font-size:12px;color:var(--sub)}
  .last .ago{font-size:10.5px;color:var(--faint)}
  td.wkcell{background:#f8fbff;min-width:220px}
  /* 주간 칸을 요일로 쪼갠 모습 — 머리행과 본문이 같은 격자를 써야 줄이 맞는다 */
  th.wkhd{padding:6px 6px 4px}
  td.wkcell.sp{padding:3px 6px;min-width:340px}
  .wkg{display:grid;gap:4px}
  .wkh{font-size:10px;font-weight:800;color:var(--faint);text-align:center;padding:2px 0;
    border-bottom:1px solid var(--line);letter-spacing:.02em}
  .wkh.td{color:var(--acc);border-bottom-color:var(--acc)}
  .wkc{min-width:0;border-radius:6px;padding:1px}
  .wkc.td{background:#eef5ff}
  .wkc .wklog{font-size:11px;line-height:1.4;padding:1px 3px;word-break:break-all}
  .wkc .wkin{font-size:11.5px;padding:3px 5px;border-color:transparent;background:transparent;margin-top:1px}
  .wkc .wkin:hover{border-color:#dbe4f3;background:#fff}
  .wkc .wkin:focus{border-color:var(--acc);background:#fff;outline:none}
  /* 그 업무의 그 날 표시 — 달력에서 보던 것을 줄 안으로 옮겨 온 것 */
  .wkm{display:block;font-size:9.5px;font-weight:800;border-radius:4px;padding:0 4px;margin-bottom:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wkm.dg{background:#fee2e2;color:#b91c1c}
  .wkm.pu{background:#ede9fe;color:#5b21b6}
  .wkm.tl{background:#ccfbf1;color:#0f766e}
  .wklog{font-size:12px;color:#334155;padding:1px 0}
  .wklog .d{color:var(--faint);font-size:10.5px;margin-right:4px;font-variant-numeric:tabular-nums}
  /* 팀 전체의 「기록」 한 열 — 이 주 것은 진하게, 지난 것은 흐리게, 2주 넘으면 주황.
     열을 둘로 나눠 두면 이 주 기록이 0인 주에 넓은 열 하나가 통째로 빈칸이 된다. */
  .wklog.cur .d{color:var(--acc2);font-weight:700}
  .wklog.old{color:var(--faint)}
  .wklog.old .d{color:var(--faint);font-weight:600}
  .wklog.stale{color:var(--warn)}
  .wklog.stale .d{color:var(--warn);font-weight:700}
  .wklog .ago{font-size:10.5px;color:inherit;opacity:.75}
  .wkin{width:100%;border:1px solid #c9d6f2;border-radius:6px;padding:5px 8px;font-size:12.5px;background:#fff;margin-top:2px}
  .wkin:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px rgba(37,99,235,.12)}
  /* 컴팩트 요약 스트립 + 한 줄 필터바 */
  .statbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 8px;font-size:12px;color:var(--sub)}
  .statbar b{font-size:14.5px;color:var(--ink);font-variant-numeric:tabular-nums}
  .statbar .sep{color:#d7dde8}
  .sb{border:1px solid var(--line);background:#fff;border-radius:13px;padding:2px 9px;cursor:pointer;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
  .sb:hover{border-color:#b9c4d4}
  .sb.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
  .sb.am{border-color:#fde68a;background:#fffdf5;color:var(--warn)}
  .sb.am.on{background:var(--warn);border-color:var(--warn);color:#fff}
  .sb.dg{border-color:#fecaca;background:#fff7f7;color:var(--danger)}
  .sb.dg.on{background:var(--danger);border-color:var(--danger);color:#fff}
  /* 숫자가 0이거나 전체 건수와 같은 칩은 눌러도 걸러지는 게 없다.
     그런데 경고색으로 있으면 위험 신호로 읽힌다 — 회색으로 죽인다. */
  .sb.dead{border-color:var(--line);background:var(--bg);color:var(--faint);font-weight:500}
  .fnote{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
  .fnote b{color:var(--ink);font-weight:800}
  .cntpill{font-size:12px;font-weight:700;color:var(--acc2);background:var(--acc-soft);
    border:1px solid #c7d7fe;border-radius:12px;padding:2px 10px;font-variant-numeric:tabular-nums}
  .fbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .fbar select{padding:4px 7px;border:1px solid var(--line);border-radius:7px;font-size:12px;color:var(--sub);background:#fff}
  .fbar .chipbtn{padding:3px 9px;font-size:11.5px}
  #qbox{padding:4px 9px;border:1px solid var(--line);border-radius:7px;font-size:12px;min-width:190px}
  /* 머리행이 곧 걸러 보기 (엑셀 자동필터) — 열 이름을 누르면 값 목록이 뜬다.
     평소에는 그냥 열 이름처럼 보이고, 조건이 걸리면 고른 값이 파랗게 남는다. */
  tr.fhead input.fh{width:100%;max-width:100%;min-width:0;border:1px solid transparent;background:transparent;
    font-family:inherit;font-size:11px;color:var(--ink);letter-spacing:.03em;font-weight:400;
    padding:2px 4px;border-radius:6px;cursor:text}
  tr.fhead input.fh:hover{border-color:var(--line);background:#fff}
  tr.fhead input.fh:focus{outline:none;border-color:var(--acc2);background:#fff}
  tr.fhead input.fh.on{border-color:#cfe0ff;background:#f5f9ff;color:var(--acc2);font-weight:700}
  tr.fhead input.fh::placeholder{color:var(--faint);letter-spacing:.03em;font-weight:400}
  tr.fhead .chipbtn{display:none}                  /* 해제는 맨 왼쪽 ✕ 하나로 */
  /* 접힌 열 — 사라지지 않고 띠로 남는다. 띠 자체가 펴는 단추다. */
  th.cband,td.cband{width:14px;min-width:14px;max-width:14px;padding:0;
    background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line);
    cursor:pointer;position:relative;overflow:hidden}
  th.cband:hover{background:var(--acc-soft)}
  th.cband.lk{background:var(--acc-soft)}       /* 묶어 보기가 잡고 있는 띠 */
  /* 펴진 열을 접는 손잡이 — 평소엔 흐리게 있다가 그 열에 마우스를 올리면 진해진다 */
  /* 손잡이 색이 표 선 색이라 흰 바탕에서 보이지 않았다 — 열을 접을 수 있다는 것을
     아무도 몰랐다. 열 이름(--sub)보다는 옅게, 그러나 눈에는 들어오게. */
  tr.fhead .cfold{display:inline-block;width:11px;margin-right:1px;cursor:pointer;
    color:#b4bfd0;font-weight:800;font-size:12px;line-height:1;vertical-align:1px;
    text-transform:none;letter-spacing:0}
  tr.fhead th:hover .cfold{color:var(--acc2)}
  tr.fhead .cfold:hover{color:var(--danger)}
  /* ⚠ rotate(180deg) 를 걸지 않는다. 세로쓰기에서 영문은 글자가 눕지만 한글은
     똑바로 서므로, 영문 기준으로 180도를 더 돌리면 한글이 뒤집힌다.
     한글은 vertical-rl 만으로 위에서 아래로 바르게 읽힌다. */
  th.cband .cbl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    writing-mode:vertical-rl;text-orientation:upright;
    font-size:10px;font-weight:700;color:var(--faint);
    white-space:nowrap;letter-spacing:-1px}
  th.cband .cbd{position:absolute;top:3px;left:50%;transform:translateX(-50%);
    width:5px;height:5px;border-radius:50%;background:var(--acc)}
  /* 구분 소제목 — 누르면 그 묶음이 접힌다 */
  tr.grph td{background:var(--acc-soft);border-top:1.5px solid #c7d7fe;
    padding:5px 10px;cursor:pointer;user-select:none;font-size:12px}
  tr.grph:hover td{background:#e6edff}
  tr.grph .gc{display:inline-block;width:14px;color:var(--acc);font-weight:800}
  tr.grph .gn{margin-left:7px;color:var(--sub);font-weight:700}
  /* 고른 날 묶음 — 거르는 것이 아니라 위로 모은 것이다 */
  tr.grph.day td{background:#fff7e6;border-top:1.5px solid #f0c68a;color:#854d0e}
  tr.grph.day:hover td{background:#fff2d6}
  tr.grph.rest td{background:var(--bg);border-top:1px solid var(--line);cursor:default}
  tr.grph.rest:hover td{background:var(--bg)}
  tr.grph .gn2{color:var(--faint);font-weight:700}
  tr.grph .gx{float:right;font-size:11.5px;font-weight:700;color:var(--acc2);cursor:pointer}
  tr.grph .gx:hover{color:var(--danger)}
  /* 고른 날의 요일 칸 — 밝혀서 어디에 적을지 눈에 들어오게 */
  .wkh.pick{background:#fff7e6;color:#854d0e;border-radius:5px}
  .wkc.pick{background:#fffdf6;box-shadow:inset 1px 0 0 #f0c68a,inset -1px 0 0 #f0c68a}
  /* 상태 고르기 — 칩과 같은 색을 쓴다 */
  select.stsel{border:0;border-radius:6px;padding:2px 3px;font-size:11.5px;font-weight:800;
    cursor:pointer;max-width:70px;appearance:none;-webkit-appearance:none;text-align:center}
  select.stsel:hover{filter:brightness(.95)}
  /* 요일 칸의 할 일 — ☐ 를 누르면 ✓ 가 되고 그 날 기록으로도 남는다 */
  .wkpl{display:flex;gap:4px;align-items:flex-start;font-size:11.5px;line-height:1.45;
    padding:1px 0;color:var(--txt)}
  .wkpl .pk{cursor:pointer;color:var(--acc);font-weight:800;flex:none;width:12px}
  .wkpl .tx{flex:1;min-width:0;word-break:break-all}
  .wkpl .by{color:var(--faint);font-size:10.5px;flex:none}
  .wkpl .px{cursor:pointer;color:var(--faint);flex:none;visibility:hidden;font-weight:800}
  .wkpl:hover .px{visibility:visible}
  .wkpl .px:hover{color:var(--danger)}
  .wkpl.on .tx{color:var(--sub);text-decoration:line-through}
  .wkpl.late .pk,.wkpl.late .tx{color:var(--danger)}
  tr.fhead .fx{display:inline-block;font-size:12px;font-weight:800;color:var(--acc2);cursor:pointer}
  tr.fhead .fx:hover{color:var(--danger)}
  .fhb{display:inline-flex;align-items:center;gap:3px;max-width:100%;padding:2px 5px;border-radius:6px;
    border:1px solid transparent;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fhb:hover{border-color:var(--line);background:#fff}
  .fhb .fun{font-size:8.5px;opacity:.45;flex:0 0 auto}
  .fhb.on{color:var(--acc2);font-weight:800;border-color:#cfe0ff;background:#f5f9ff}
  .fhb.on .fun,.fhb.pop .fun{opacity:1}
  .fhb.pop{border-color:var(--acc2);background:#fff}
  /* 정렬 화살표 — 걸러 보기와 한 칸을 나눠 쓰므로 따로 떼어 뒀다 */
  .sortb{margin-left:3px;font-size:9px;opacity:.35;cursor:pointer;user-select:none}
  .sortb:hover{opacity:.9}
  .sortb.on{opacity:1;color:var(--acc2);font-size:10px}
  .fbk{position:fixed;inset:0;z-index:60}
  .fpop{position:fixed;z-index:61;min-width:200px;max-width:290px;background:#fff;border:1px solid var(--line);
    border-radius:10px;box-shadow:0 12px 30px rgba(15,32,60,.18);padding:8px;text-align:left;
    font-weight:400;letter-spacing:0;color:var(--ink)}
  .fpop .fps{width:100%;padding:4px 8px;border:1px solid var(--line);border-radius:7px;font-size:12px;margin-bottom:6px}
  .fpl{max-height:250px;overflow:auto}
  .fpl label{display:flex;align-items:center;gap:7px;padding:3px 5px;font-size:12.5px;cursor:pointer;border-radius:6px}
  .fpl label:hover{background:#f3f7ff}
  .fpl label .c{margin-left:auto;color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums}
  /* 묶어 보기가 잡고 있어 손댈 수 없는 줄 */
  .fpl label.off{opacity:.5;cursor:default}
  .fpl label.off:hover{background:none}
  .fpa{display:flex;gap:6px;margin-top:7px;align-items:center}
  .fpa button{flex:1;padding:5px 0;font-size:12px}
  .fpa .lnk{font-size:11.5px;color:var(--acc);cursor:pointer;font-weight:700}
  .fpa .lnk:hover{text-decoration:underline}
  /* 하나도 안 골랐을 때 — 조건이 없는 것과 다르다는 것을 밝힌다 */
  .fwarn{margin-top:6px;font-size:11.5px;font-weight:700;color:var(--warn);
    background:var(--warn-bg);border:1px solid #f0c68a;border-radius:6px;padding:4px 8px}
  .endbtn{font-size:11px;padding:3px 9px;border:1px solid #cbd5e1;background:#fff;color:var(--sub);border-radius:6px;cursor:pointer;white-space:nowrap}
  .endbtn:hover{background:var(--ok-bg);border-color:#9ccdb4;color:var(--ok)}
  .endbtn .lk{margin-left:2px;font-size:9.5px}
  .pesync{font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;white-space:nowrap}
  .pesync.done{background:var(--ok-bg);color:var(--ok)}
  .pesync.wait{background:var(--warn-bg);color:var(--warn)}
  .pesync.off{background:var(--bg);color:var(--faint)}
  td.rowno{color:var(--faint);width:34px;text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px;padding-right:8px}
  th.rowno{width:34px;text-align:right;padding-right:8px}
  .grp-h td{background:var(--bg);font-weight:800;font-size:12.5px;padding:6px 10px}
  .grp-h .pct{float:right;font-weight:600;color:var(--sub);font-size:11px;font-variant-numeric:tabular-nums}

  /* 빠른 기록 바 */
  #qwrap{position:fixed;left:216px;right:18px;bottom:14px;z-index:60;max-width:1100px}
  #qsug{background:#fff;border:1px solid #c7d7fe;border-bottom:0;border-radius:10px 10px 0 0;box-shadow:0 -8px 24px rgba(30,64,175,.10);overflow:hidden;display:none}
  #qsug .qi{padding:7px 13px;border-bottom:1px solid #eef1f5;display:flex;gap:8px;align-items:center;font-size:12.5px;cursor:pointer}
  #qsug .qi.pick{background:var(--acc-soft)}
  #qsug .qi small{color:var(--faint);margin-left:auto}
  #qbar{display:flex;align-items:center;gap:9px;background:#fff;border:1.6px solid var(--acc);border-radius:10px;padding:7px 13px;box-shadow:0 6px 18px rgba(15,23,42,.14)}
  #qbar .zap{color:var(--acc);font-weight:800;cursor:grab;user-select:none;touch-action:none;
    border-radius:6px;padding:0 3px}
  #qbar .zap:hover{background:var(--acc-soft)}
  #qwrap.drag #qbar .zap{cursor:grabbing}
  #qwrap.drag #qbar{box-shadow:0 14px 34px rgba(15,23,42,.24)}
  #qwrap.moved{max-width:none}
  #qbar input{flex:1;border:none;outline:none;font-size:13px;background:transparent}
  #qbar .k{font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 6px;white-space:nowrap;cursor:pointer}
  #qbar .k:hover{border-color:var(--acc);color:var(--acc)}
  #qbar .home{display:none}
  #qwrap.moved #qbar .home{display:inline-block}
  /* 단축키 도움말의 자판 모양 */
  .kbd{flex:0 0 auto;min-width:74px;text-align:center;font-size:11px;font-weight:700;color:var(--ink);
    background:#f7f9fc;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
    padding:1px 6px;white-space:nowrap}

  /* 캘린더 팝오버 */
  #calpop{position:absolute;z-index:80;width:300px;background:#fff;border:1px solid #c7d7fe;border-radius:12px;box-shadow:0 14px 34px rgba(30,64,175,.16);padding:12px 14px;font-size:11.5px}
  #calpop .ct{display:flex;align-items:center;font-size:12.5px;font-weight:800;margin-bottom:6px}
  #calpop .ct .nv{color:var(--faint);padding:0 9px;cursor:pointer;font-weight:400}
  #calpop .ct .today{margin-left:auto;font-size:10.5px;color:var(--acc);font-weight:700;background:var(--acc-soft);border-radius:6px;padding:1px 8px;cursor:pointer}
  #calpop table{border-collapse:collapse;width:100%}
  #calpop th{color:var(--faint);font-weight:700;font-size:10px;padding:3px 0 5px;text-align:center;border:none}
  #calpop th.we{color:#c3cbd8}
  #calpop td{text-align:center;padding:0;border:none}
  #calpop .d{position:relative;display:block;padding:5px 0 11px;color:#334155;font-variant-numeric:tabular-nums;font-size:11px}
  #calpop .d.out{color:#d4dae3}#calpop .d.we{color:#94a3b8}
  #calpop .d.today2{font-weight:800;color:var(--acc2)}
  #calpop .d .dt2{position:absolute;left:50%;transform:translateX(-50%);bottom:4px;display:flex;gap:2px}
  #calpop .d .dt2 i{width:4px;height:4px;border-radius:50%;background:#a5c4fa;display:block}
  #calpop .d .dt2 i.hot{background:var(--acc)}
  #calpop .d.duemark::after{content:"";position:absolute;top:3px;right:5px;width:5px;height:5px;border-radius:50%;background:#dc2626}
  #calpop tr.wrow{cursor:pointer}
  #calpop tr.wrow:hover td .d{background:#f5f9ff}
  #calpop tr.selwk td .d{background:var(--acc-soft)}
  #calpop .lg{display:flex;gap:12px;font-size:10px;color:var(--faint);margin-top:8px;align-items:center}
  #calpop .lg i{width:5px;height:5px;border-radius:50%;background:var(--acc);display:inline-block;margin-right:3px}
  #calpop .lg i.r{background:#dc2626}

  /* 드로어 */
  #drawerbg{position:fixed;inset:0;background:rgba(20,30,50,.25);z-index:90}
  #drawer{position:fixed;top:0;right:0;width:430px;max-width:96vw;height:100vh;background:#fff;border-left:1px solid #dbe2ec;box-shadow:-14px 0 30px rgba(15,23,42,.12);z-index:95;display:flex;flex-direction:column}
  #drawer .dh{padding:14px 18px 11px;border-bottom:1px solid var(--line)}
  #drawer .dh .row1{display:flex;align-items:center;gap:8px}
  #drawer .dh .ttl{font-size:14px;font-weight:800;flex:1}
  #drawer .dh .x{color:var(--faint);cursor:pointer;font-size:17px;padding:0 3px}
  #drawer .dh .meta2{font-size:11.5px;color:var(--sub);margin-top:4px}
  #drawer .dh .chips{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
  /* 다음 할 일 — 한 줄로. 예전엔 라벨·입력·날짜가 세 줄로 접혔다 */
  .nextbox{margin:9px 18px 0;background:#fffdf5;border:1px solid #fde68a;border-radius:8px;padding:6px 10px;
    font-size:12px;color:#854d0e;display:flex;align-items:center;gap:7px;flex-wrap:nowrap}
  .nextbox .lb{flex-shrink:0;font-weight:800;white-space:nowrap}
  .nextbox input[type=text]{flex:1;min-width:0;border:none;background:transparent;font-size:12.5px;color:#854d0e;outline:none}

/* ── 주(週) 계산 ── */
function mondayOf(d){d=new Date(d);d.setHours(0,0,0,0);var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return d;}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function weekKeyOf(mon){var thu=addDays(mon,3);var y=thu.getFullYear();var jan4=new Date(y,0,4);
  var wk=1+Math.round((mondayOf(thu)-mondayOf(jan4))/(7*86400000));return y+'-W'+pad(wk);}
function weekYear(wk){return wk.slice(0,4);}
function mondayOfKey(wk){var m=/^(\d{4})-W(\d{2})$/.exec(wk);if(!m)return mondayOf(new Date());
  return addDays(mondayOf(new Date(+m[1],0,4)),(+m[2]-1)*7);}
// 그 달 1일이 속한 주 = 1주차 (한국 통상 표기)
function weekLabel(mon){var fri=addDays(mon,4);
  var first=new Date(mon.getFullYear(),mon.getMonth(),1);
  var wno=Math.round((mon-mondayOf(first))/(7*86400000))+1;
  return (mon.getMonth()+1)+'월 '+wno+'주 · '+(mon.getMonth()+1)+'.'+mon.getDate()+' ~ '+(fri.getMonth()+1)+'.'+fri.getDate();}
function curMonday(){return mondayOf(new Date());}
function isCurWeek(){return ymd(S.week)===ymd(curMonday());}
function inWeek(dateStr,mon){var d=new Date(dateStr+'T00:00:00');return d>=mon&&d<addDays(mon,7);}
function dday(dateStr){if(!dateStr)return null;var t=new Date();t.setHours(0,0,0,0);
  return Math.round((new Date(dateStr+'T00:00:00')-t)/86400000);}
function ddayHTML(dateStr,label){var n=dday(dateStr);if(n===null)return '<span class="muted">—</span>';
  var cls=n<0?'':n<=3?'':n<=7?' soon':' ok';var txt=n<0?('D+'+(-n)):n===0?'D-Day':('D-'+n);
  return '<span class="due'+(n<=3?'':cls)+'">'+txt+(label?' · '+esc(label):'')+'</span>';}

/* ── 빠른 기록 바 옮기기 ──────────────────────────────────────────────
   기본은 화면 아래에 붙어 있다. 그런데 표의 맨 아랫줄이 바에 가려 정작
   기록할 줄이 안 보이는 일이 있다. ⚡을 잡고 끌어 옮기고, 그 자리를 이
   컴퓨터에 기억해 둔다(사람마다 화면 크기가 다르므로 브라우저에 저장). */
var QBAR_POS='work_qbar_pos';
function qbarPut(l,t,wd){
  var w=$('qwrap'); if(!w) return;
  wd=Math.max(320,Math.min(wd||w.offsetWidth||520,window.innerWidth-16));
  var hh=w.offsetHeight||60;
  w.classList.add('moved');
  w.style.width=wd+'px'; w.style.right='auto'; w.style.bottom='auto';
  w.style.left=Math.max(8,Math.min(l,window.innerWidth-wd-8))+'px';
  w.style.top =Math.max(8,Math.min(t,window.innerHeight-hh-8))+'px';
}
function qbarSave(){
  var w=$('qwrap'); if(!w) return;
  var r=w.getBoundingClientRect();
  try{ localStorage.setItem(QBAR_POS,JSON.stringify({l:r.left,t:r.top,w:r.width})); }catch(e){}
}
function qbarLoad(){
  var p=null; try{ p=JSON.parse(localStorage.getItem(QBAR_POS)||'null'); }catch(e){}
  if(p&&typeof p.l==='number'&&typeof p.t==='number') qbarPut(p.l,p.t,p.w);
}
function qbarReset(){
  var w=$('qwrap'); if(!w) return;
  w.classList.remove('moved');
  w.style.left=''; w.style.top=''; w.style.right=''; w.style.bottom=''; w.style.width='';
  try{ localStorage.removeItem(QBAR_POS); }catch(e){}
  toast('빠른 기록을 제자리로 옮겼습니다');
}
function qbarDrag(e){
  var w=$('qwrap'); if(!w||(e.button!==undefined&&e.button!==0)) return;
  e.preventDefault();
  var r=w.getBoundingClientRect(), dx=e.clientX-r.left, dy=e.clientY-r.top, wd=r.width;
  w.classList.add('drag');
  function mv(ev){ qbarPut(ev.clientX-dx,ev.clientY-dy,wd); }
  function up(){
    document.removeEventListener('pointermove',mv);

  }
  document.addEventListener('pointermove',mv);
  document.addEventListener('pointerup',up);
}

/* ── 내가 누구인지 (푸른이알피 재직자 연결) ── */
function _normStaff(v){
  if(!v) return []; if(!Array.isArray(v)) v=Object.keys(v).map(function(k){return v[k];});
  var seen={};
  return v.filter(function(u){return u&&u.sid;})
    .filter(function(u){return !u.status||u.status==='active'||(u.status==='leave'&&u.leaveLoginAllowed===true);})
    .filter(function(u){ if(seen[u.sid])return false; seen[u.sid]=1; return true; })
    .map(function(u){return {sid:u.sid,name:u.name||u.sid,title:u.title||u.role||'',
      ord:(typeof u.sortOrder==='number')?u.sortOrder:9999};})
    // 푸른이알피가 정해 둔 차례(sortOrder)를 그대로 쓴다. 예전에는 사번순이라
    // A-00x(사무직)이 앞에, P-00x(노무사)가 뒤에 와서 그쪽 화면과 순서가 달랐다.
    .sort(function(a,b){ return (a.ord-b.ord)
      ||String(a.sid||'').localeCompare(String(b.sid||''),'en',{numeric:true}); });
}
function loadStaff(){
  if(_staffCache) return Promise.resolve(_staffCache);
  try{ var raw=localStorage.getItem('pureun_v6_user_accounts');
    if(raw){ var a=_normStaff(JSON.parse(raw)); if(a.length){ _staffCache=a; return Promise.resolve(a); } } }catch(e){}
  return fbDb.ref('data/user_accounts/v').once('value').then(function(s){ _staffCache=_normStaff(s.val()); return _staffCache; })
    .catch(function(){ _staffCache=[]; return _staffCache; });
}
/* 「나는 누구인가」는 «로그인 이메일» 로만 정한다 (2026-08-16 대표 지시).
   ⚠ 전에는 셋을 차례로 봤다: ①localStorage 의 work_me_sid ②이메일 ③주소의 user=.

function confirmM(msg,opts){
  opts=opts||{};
  return new Promise(function(resolve){
    var m=document.createElement('div'); m.id='confirmbg';
    m.style.cssText='position:fixed;inset:0;background:rgba(20,30,50,.4);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
    var danger=opts.danger?'#b91c1c':'var(--acc)';
    m.innerHTML='<div style="background:#fff;border-radius:14px;padding:22px 24px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.28)">'
      +'<div style="font-size:14px;line-height:1.6;white-space:pre-line;margin-bottom:18px">'+esc(msg)+'</div>'
      +'<div class="row" style="justify-content:flex-end;gap:8px"><button id="cf-no">'+esc(opts.cancel||'취소')+'</button>'
      +'<button id="cf-yes" class="primary" style="background:'+danger+'">'+esc(opts.ok||'확인')+'</button></div></div>';
    document.body.appendChild(m);
    function done(v){ m.remove(); document.removeEventListener('keydown',key,true); resolve(v); }
    function key(e){ if(e.key==='Escape'){e.stopPropagation();done(false);} else if(e.key==='Enter'){e.stopPropagation();done(true);} }
    m.querySelector('#cf-yes').onclick=function(){done(true);};
    m.querySelector('#cf-no').onclick=function(){done(false);};
    m.onclick=function(e){ if(e.target===m) done(false); };
    document.addEventListener('keydown',key,true);
    var y=m.querySelector('#cf-yes'); if(y)y.focus();
  });
}

/* ── 열 접기 ────────────────────────────────────────────────────────
   안 쓰는 열을 없애지 않고 접는다 — 기록이 쌓이면 「최근 기록」이 다시
   필요해진다. 접힌 열은 사라지지 않고 폭 14px 띠로 남아 그 자리에서 편다.
   메뉴 안에 숨기면 접었다는 사실 자체를 잊는다.
   이 브라우저에만 저장한다 — 남의 화면에 영향이 없고, 남의 업무를
   열람할 때도 내 설정이 유지된다. */
/* 내 업무와 팀 전체가 같은 코드를 쓴다. 열 구성이 서로 달라(팀에는 「이 주
   실적」이 있고 「이번 주」 격자가 없다) 화면별(sc)로 나눠 담는다.
   걸러 보기(fCols/fHas)와 같은 방식이다. */
/* 팀 열쇠가 2인 까닭: 예전 기본값(pt,last)이 사람들 브라우저에 저장돼 있어,
   기본값만 바꾸면 이미 쓰던 사람은 업무명이 계속 접힌 채로 남는다. */
var COLS_KEY={my:'work_my_cols',team:'work_team_cols2'};
/* [키, 이름, 띠 이름]
   띠는 폭 14px 세로줄이라 긴 이름은 머리칸 높이를 넘어 위아래가 잘린다.
   띠에만 두 글자로 줄여 쓰고, 목록·툴팁에는 본디 이름을 그대로 둔다 —
   줄인 이름만 보이면 무슨 열인지 알 수 없다. */
var COLSET={
  my:  [['cat','구분','구분'],['pt','업무','업무'],['st','상태','상태'],
        ['last','최근 기록','기록'],['due','다음 할 일','할일']],
  // 「이 주 실적」과 「최근 기록」은 둘 다 기록 열이라 하나로 합쳤다(log).
  team:[['cat','구분','구분'],['sub','부담당','부담'],['pt','업무명','업무'],
        ['st','상태','상태'],['log','기록','기록'],['due','다음 할 일','할일']]
};
// 처음 여는 사람이 보는 상태. 팀은 열을 하나도 접지 않는다 —
// 업무명을 접어 두면 무슨 일인지가 안 보이고, 남는 폭을 기업 열이 다 먹는다.
var COLS_DEFAULT={my:'pt,last',team:''};
function colCols(sc){ return COLSET[sc]||COLSET.my; }
function colHas(sc,k){ return colCols(sc).some(function(c){ return c[0]===k; }); }
function colPref(sc){
  S.cols=S.cols||{};
  if(S.cols[sc]===undefined){
    var v=null; try{ v=localStorage.getItem(COLS_KEY[sc]); }catch(e){}
    if(v===null) v=COLS_DEFAULT[sc]||'';         // 저장된 적 없음 = 기본값
    S.cols[sc]={};                               // 빈 문자열이면 전부 펴진 상태다
    String(v).split(',').forEach(function(k){ if(k) S.cols[sc][k]=1; });
  }
  return S.cols[sc];
}
/* 묶어 보기가 켜져 있으면 구분은 열이 아니다 — 소제목에 이미 쓰여 있다.
   이때는 사람이 접거나 펼 수 있는 대상이 아니므로 단추도 내주지 않는다.
   팀 전체는 담당(사람)으로 묶으므로 겹치는 열이 없다. */
function colForced(sc,k){ return sc==='my'&&k==='cat'&&grpOn(); }
function colHidden(sc,k){
  if(!colHas(sc,k)) return false;                // 접을 수 없는 열
  if(colForced(sc,k)) return true;
  return !!colPref(sc)[k];
}
function colToggle(sc,k){
  if(!colHas(sc,k)) return;
  // 묶어 보기가 잡고 있는 열은 눌러도 안 바뀐다. 저장까지 해 두면 나중에
  // 묶어 보기를 껐을 때 까닭 없이 접혀 있게 되므로 아무것도 하지 않는다.
  if(colForced(sc,k)) return;
  var p=colPref(sc);
  if(p[k]) delete p[k]; else p[k]=1;
  try{ localStorage.setItem(COLS_KEY[sc],Object.keys(p).join(',')); }catch(e){}
  fRender(sc);
}
// 접힌 열은 <th>/<td> 를 폭 14px 띠로 바꾼다. 띠 자체가 펴는 단추다.
function colTH(sc,k,inner,style){
  var c=colCols(sc).filter(function(x){ return x[0]===k; })[0];
  // 펴진 열에는 접는 손잡이를 단다. 이것이 없으면 한 번 편 뒤에는 팝업으로만
  // 다시 접을 수 있어, 접고 펴는 일이 한쪽으로만 된다.
  if(!c||!colHidden(sc,k))
    return '<th style="'+(style||'')+'">'
      +(c?'<span class="cfold" onclick="event.stopPropagation();colToggle(\''+sc+'\',\''+k+'\')" '
          +'title="'+esc(c[1])+' 열 접기">‹</span>':'')
      +inner+'</th>';
  // 띠에는 줄인 이름, 툴팁에는 본디 이름 — 줄인 것만 보이면 무슨 열인지 모른다
  var sh=c[2]||c[1];
  // 묶어 보기가 잡고 있는 띠는 "펴기"가 아니라 그 까닭과 실제로 되돌리는 길을 준다
  if(colForced(sc,k))
    return '<th class="cband lk" onclick="grpToggle()" '
      +'title="'+esc(c[1])+' — 구분별로 묶어 보는 중이라 소제목에 있습니다. 눌러서 묶음을 풀면 열로 돌아옵니다">'
      +'<span class="cbl">'+esc(sh)+'</span></th>';
  var dot=fHas(sc,k)?'<span class="cbd"></span>':'';    // 조건이 걸린 채 접힌 열
  return '<th class="cband" onclick="colToggle(\''+sc+'\',\''+k+'\')" '
    +'title="'+esc(c[1])+' — 눌러서 폅니다'+(dot?' (걸러 보기 조건이 걸려 있습니다)':'')+'">'
    +'<span class="cbl">'+esc(sh)+'</span>'+dot+'</th>';
}
function colTD(sc,k,inner,attr){
  if(colHidden(sc,k)) return '<td class="cband"></td>';
  return '<td'+(attr?' '+attr:'')+'>'+inner+'</td>';
}
/* 열 켜고 끄기는 칩 하나로 모아 팝업에서 고른다.
   ⚠ 처음에는 열마다 칩을 하나씩 놓았는데, 머리줄에 칩이 여덟 개가 되어
     "화면을 편하게" 와 정반대가 됐다. 자주 누르는 것이 아니므로 안으로 넣는다. */
/* 창을 띄우지 않고 칩 바로 아래에 붙는 체크 목록으로 고른다.
   걸러 보기 깔때기와 같은 구조(.fbk 뒤판 + .fpop)를 그대로 써서
   생김새도 여닫는 법도 같게 한다 — 두 가지를 새로 익히지 않아도 된다. */
/* 「접힘 n」만 적으니 다 펴 놓은 사람에게는 숫자가 아예 안 붙어, 접고 펼 수
   있다는 것 자체가 안 보였다. 늘 「몇 개 중 몇 개」를 적는다. */
function colBtn(sc){
  var cols=colCols(sc);
  // 사람이 접은 것만 파랗게 — 묶어 보기가 잡고 있는 열은 사람이 접은 게 아니다
  var hand=cols.filter(function(c){ return colHidden(sc,c[0])&&!colForced(sc,c[0]); }).length;
  var shown=cols.filter(function(c){ return !colHidden(sc,c[0]); }).length;
  return '<span class="chipbtn'+(hand?' on':'')+'" id="colchip" '
    +'onclick="event.stopPropagation();colPop(\''+sc+'\')" '
    +'title="접을 수 있는 열 '+cols.length+'개 가운데 '+shown+'개를 보고 있습니다 — 눌러서 고릅니다. '
    +'열 이름 왼쪽의 ‹ 를 눌러도 접힙니다">▦ 열 '+shown+'/'+cols.length+'</span>'
    +(S.colPop===sc?colPopHTML(sc):'');
}
// S.colPop 에는 어느 화면의 목록이 열려 있는지를 담는다('' 면 닫힘)
function colPop(sc){ S.colPop=(S.colPop===sc)?'':sc; fRender(sc); }
function colPopClose(){ var sc=S.colPop; if(sc){ S.colPop=''; fRender(sc); } }
function colPopHTML(sc){
  return '<div class="fbk" onclick="colPopClose()"></div>'
    +'<div class="fpop" id="colpop" onclick="event.stopPropagation()">'
    +'<div class="fpl">'
    +colCols(sc).map(function(c){
        var forced=colForced(sc,c[0]), on=!colHidden(sc,c[0]);
        return '<label'+(forced?' class="off" title="구분별로 묶어 보는 중이라 소제목에 있습니다"':'')+'>'
          +'<input type="checkbox"'+(on?' checked':'')+(forced?' disabled':'')
          +' onchange="colToggle(\''+sc+'\',\''+c[0]+'\')">'
          +'<span>'+esc(c[1])+'</span>'
          +(forced?'<span class="c">묶음</span>':'')
          +'</label>';
      }).join('')
    +'</div>'
    +'<div class="fpa"><span class="muted" style="font-size:11px;flex:1">끈 열은 얇은 띠로 남습니다</span>'
    +'<span class="lnk" onclick="colPopClose()">닫기</span></div>'
    +'</div>';
}
// 표 바깥으로 띄운다(표에 가로 스크롤이 있어 안에 두면 잘린다) — 깔때기와 같다
function colPopPos(){
  var b=$('colchip'), p=$('colpop'); if(!b||!p) return;
  var r=b.getBoundingClientRect();
  p.style.left=Math.max(8,Math.min(r.left,window.innerWidth-p.offsetWidth-8))+'px';
  p.style.top=Math.min(r.bottom+4,window.innerHeight-p.offsetHeight-8)+'px';
}
function _inTyping(e){ var t=e.target||document.activeElement;
  return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable); }
/* 한글을 치는 중에 누른 Enter인가.
   "정리" 를 치고 Enter를 누르면 마지막 글자를 확정하는 Enter가 먼저 온다.
   그것을 저장으로 받으면 "정" 만 저장되거나 같은 줄이 두 번 들어간다.
   조합이 끝난 뒤의 Enter만 받는다. keyCode 229는 옛 브라우저용. */
function _ime(e){ return !!(e&&(e.isComposing||e.keyCode===229)); }

/* ── 단축키 ────────────────────────────────────────────────────────
   매주 수십 건을 훑고 한 줄씩 적는 화면이라, 손이 자판을 떠나지 않는 것이
   가장 크다. 아래 한 목록이 도움말(?)과 실제 동작을 함께 만든다 —
   따로 적어 두면 언젠가 도움말만 남고 동작은 바뀐다. */
var NAV_KEYS=['my','team','stats','kb','ho','archive'];
var KEYS=[
  ['기록하기',[
    ['/','빠른 기록 칸으로 (어느 화면에서든)'],
    ['E','이번 주 기록 칸 첫 줄로'],
    ['Enter','기록 저장하고 아랫줄로'],
    ['Shift+Enter','기록 저장하고 윗줄로'],
    ['↑ ↓','같은 요일을 지키며 윗줄·아랫줄로 (저장 안 함)'],
    ['← →','요일 옮기기 (빈 칸에서만)']
  ]],
  ['찾기·만들기',[
    ['Ctrl+K','전체 검색 (기록·지식까지)'],
    ['N','새 업무 만들기']
  ]],
  ['화면 옮기기',[
    ['1 … 6','내 업무·팀 전체·업무량·지식·인수인계·종료'],
    ['[  ]','지난 주 · 다음 주'],
    ['T','이번 주로']
  ]],
  ['걸러 보기',[
    ['Enter','열어 둔 조건 적용'],
    ['Esc','조건 목록 닫기']
  ]],
  ['닫기·되돌리기',[
    ['Esc','팝업·서랍·모달 닫기 (없으면 뒤로)'],
    ['Backspace','뒤로'],
    ['?','이 도움말']
  ]]
];
function keysModal(){
  showModal('<h2 style="margin:0 0 4px">⌨ 단축키</h2>'
    +'<p class="muted" style="font-size:12px;margin:0 0 12px">글자를 입력하는 중에는 단축키가 듣지 않습니다 — 마음 놓고 치세요.</p>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 22px">'
    +KEYS.map(function(g){
        return '<div><div style="font-size:11.5px;font-weight:800;color:var(--acc2);margin-bottom:5px">'+esc(g[0])+'</div>'
          +g[1].map(function(k){
              return '<div style="display:flex;gap:9px;align-items:baseline;padding:2px 0;font-size:12.5px">'
                +'<span class="kbd">'+esc(k[0])+'</span>'
                +'<span style="color:var(--sub)">'+esc(k[1])+'</span></div>';
            }).join('')
          +'</div>';
      }).join('')
    +'</div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:16px"><button onclick="closeM()">닫기</button></div>');
}
document.addEventListener('keydown',function(e){
  // 걸러 보기 목록이 열려 있으면 그쪽이 먼저다 — Enter로 적용, Esc로 닫기
  if(_ime(e)) return;                  // 한글 조합 중에는 화면 단축키를 잡지 않는다
  if(S.fPop&&(e.key==='Enter'||e.key==='Escape')){
    e.preventDefault(); var p=String(S.fPop).split(':');
    if(e.key==='Enter') fApply(p[0],p[1]); else fPopClose(p[0]);
    return;
  }
  if(e.key==='Escape'){
    if($('hlpop')){ hlpClose(); return; }        // 설명 팝업이 먼저 닫힌다
    if($('confirmbg'))return;
    if($('modalbg')){ closeM(); return; }
    if($('calpop')){ closeCal(); return; }
    if(S.drawerId){ closeDrawer(); return; }
    var t=document.activeElement;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')){ t.blur(); return; }
    if(S.view!=='my'){ goBack(); }
    return;
  }
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){ e.preventDefault(); searchModal(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;         // 브라우저 단축키는 건드리지 않는다
  if(_inTyping(e)) return;                            // 글자를 치는 중에는 아무 것도 가로채지 않는다
  // ?는 Shift+/라서 /보다 먼저 봐야 한다
  if(_k(e,'/',true)){ e.preventDefault(); keysModal(); return; }
  if(_k(e,'/')){ e.preventDefault(); var q=$('qb'); if(q)q.focus(); return; }
  if($('modalbg')||$('confirmbg')) return;
  if(_k(e,'N')){ e.preventDefault(); itemModal(); return; }
  if(e.key==='Backspace'){ e.preventDefault();
    if(S.drawerId){closeDrawer();return;} if(S.view!=='my')goBack(); return; }
  var n=_kNum(e);
  if(n>=1&&n<=NAV_KEYS.length){ e.preventDefault(); go(NAV_KEYS[n-1]); return; }
  // 주 이동·기록 칸은 주간 표가 있는 화면에서만
  if(S.view==='my'||S.view==='team'){
    if(_k(e,'[')){ e.preventDefault(); shiftWeek(-1); return; }
    if(_k(e,']')){ e.preventDefault(); shiftWeek(1);  return; }
    if(_k(e,'T')){ e.preventDefault(); setWeek(null); return; }
    if(_k(e,'E')){ e.preventDefault(); wkFocus(0); return; }
  }
});
/* 한글 입력 상태에서는 T가 'ㅅ'으로 온다. 글자(key)만 보면 단축키가 죽으므로
   물리 자판 자리(code)도 함께 본다 — 자판을 한영 어느 쪽에 두든 똑같이 듣는다. */
var _KCODE={'/':'Slash','[':'BracketLeft',']':'BracketRight'};
function _k(e,ch,shift){
  if(shift!==undefined&&!!e.shiftKey!==!!shift) return false;
  if(shift===undefined&&e.shiftKey&&ch.length===1&&!/[A-Z]/.test(ch)) return false;
  var code=_KCODE[ch]||('Key'+ch.toUpperCase());
  if(e.code===code) return true;
  return e.key===ch||e.key===ch.toLowerCase()||e.key===ch.toUpperCase();
}
function _kNum(e){
  if(/^Digit[0-9]$/.test(e.code||'')) return +e.code.slice(5);
  if(/^Numpad[0-9]$/.test(e.code||'')) return +e.code.slice(6);
  return /^[0-9]$/.test(e.key)?+e.key:-1;
}
function wkPut(el){
  if(!el) return false;
  el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(e){}
  return true;
}
// 주간 기록 칸 — n번째 칸으로 (없으면 아무것도 안 한다)
function wkFocus(n){
  var all=[].slice.call(document.querySelectorAll('.wkin'));
  if(!all.length) return false;
  return wkPut(all[Math.max(0,Math.min(n,all.length-1))]);
}
// 위아래 = 같은 요일로 줄 옮기기 (요일별로 쪼개져 있을 때)
function wkMove(inp,d){
  var c=inp.getAttribute('data-c');
  if(c===null){                                   // 한 칸 보기 — 예전처럼 차례대로
    var all=[].slice.call(document.querySelectorAll('.wkin'));
    var i=all.indexOf(inp); return i<0?false:wkFocus(i+d);
  }
  var col=[].slice.call(document.querySelectorAll('.wkin[data-c="'+c+'"]'));
  var j=col.indexOf(inp); if(j<0) return false;
  return wkPut(col[Math.max(0,Math.min(j+d,col.length-1))]);
}
// 좌우 = 같은 줄에서 요일 옮기기
function wkSide(inp,d){
  var r=inp.getAttribute('data-r'); if(r===null) return false;
  var row=[].slice.call(document.querySelectorAll('.wkin[data-r="'+r+'"]'));
  var j=row.indexOf(inp); if(j<0) return false;
  return wkPut(row[Math.max(0,Math.min(j+d,row.length-1))]);
}

/* ── 성과급 확인 ─────────────────────────────────────────────
   성과급 원본(finance_income)은 재무권한자만 읽는다. 직원 본인도 못 읽는다.
   그래서 대표가 달마다 사람별 '확인용 사본'을 내보내고, 여기서는 자기 것만 읽는다.
   금액은 못 고친다(서버 규칙). 남길 수 있는 건 확인·이의뿐이다.

   ★★ 반드시 로그인 본인(S.me.sid)이다. 열람 대상(S.vsid)을 따라가면 남의 성과급이 보인다.
       규칙이 uid 로 한 번 더 막지만, 코드에서도 절대 섞지 않는다. */
var PC_PATH='data/perf_confirm';
/* 몇 달치를 훑을까 — 내 것과 대표 전체 현황이 «같은 창»을 봐야 한다.
   전에는 내 것만 넉 달이라, 대표 현황엔 있는 달이 내 화면엔 아예 없었다. */
var PC_MONTHS=6;
function pcMySid(){ return (S.me&&S.me.sid)||''; }        /* ★ S.vsid 아님 */
function pcMonths(n){
  var out=[], d=new Date();
  for(var i=0;i<(n||4);i++){ out.push(d.getFullYear()+'-'+pad(d.getMonth()+1)); d.setMonth(d.getMonth()-1); }
  return out;
}
/* 총괄 관리자(admin) 또는 관리자대행(admin-delegate) 인지 — 서버가 아는 값을 그대로 쓴다.
   성과급은 이 두 사람이 같이 다룬다. 재무 메뉴 권한(fin)으로 열면 재무 담당자도
   전 직원 성과급을 보게 되므로 그보다 좁게 잡았다(서버 규칙도 isAdmin 으로 걸려 있다). */
function pcAmFin(){
  if(S.perfFin!==undefined) return Promise.resolve(S.perfFin);
  var u=(typeof firebase!=='undefined'&&firebase.auth)?firebase.auth().currentUser:null;
  if(!u||!u.uid||typeof fbDb==='undefined'||!fbDb){ S.perfFin=false; return Promise.resolve(false); }
  return fbDb.ref('uid_roles/'+u.uid+'/isAdmin').once('value')
    .then(function(s){ S.perfFin=(s.val()===true); return S.perfFin; })
    .catch(function(){ S.perfFin=false; return false; });
}
/* 전체 현황 — 총괄·대행만. 권한이 없으면 서버가 막으므로 조용히 빈 손으로 돌아온다. */
function pcLoadAll(){
  return pcAmFin().then(function(fin){
    if(!fin) return [];
    return Promise.all(pcMonths(PC_MONTHS).map(function(ym){
      return fbDb.ref(PC_PATH+'/'+ym+'/p').once('value')
        .then(function(s){ var v=s.val(); return (v&&Object.keys(v).length)?{ym:ym,all:v}:null; })
        .catch(function(){ return null; });
    })).then(function(r){ return r.filter(Boolean); });
  });
}
/* 며칠 지났나 — 이의가 며칠째 대기인지, 마감이 며칠 지났는지 */
function pcDaysAgo(iso){
  if(!iso) return 0;
  var t=new Date(iso).getTime(); if(isNaN(t)) return 0;
  var d=Math.floor((Date.now()-t)/86400000);
  return d>0?d:0;
}
/* 그 달 전체를 한 눈금으로 */
function pcMonthStat(all){
  var st={people:0,done:0,obj:0,todo:0,sum:0,left:0};
  Object.keys(all||{}).forEach(function(sid){
    var p=all[sid]||{}, w=pcWho(p);
    st.people++; st.sum+=(p.total||0);
    if(w.k==='done') st.done++; else if(w.k==='obj') st.obj++; else st.todo++;
  });
  st.left=st.obj+st.todo;
  return st;
}
/* 사람 차례 — 손봐야 할 사람이 앞으로 (이의 → 미확인 → 완료), 같은 무리면 금액 큰 쪽 */
function pcSortSids(all){
  var rank={obj:0, todo:1, done:2};
  return Object.keys(all||{}).sort(function(a,b){
    var ra=rank[pcWho(all[a]).k], rb=rank[pcWho(all[b]).k];
    if(ra!==rb) return ra-rb;
    return ((all[b]||{}).total||0)-((all[a]||{}).total||0);
  });
}
/* 사람 한 명의 상태를 한 낱말로 */
function pcWho(p){
  var by=(p.objection||{}).byItem||{};
  var open=Object.keys(by).filter(function(fid){
    var o=by[fid]||{}; if(o.withdrawnAt||!o.text) return false;
    var it=(p.items||{})[fid]||{};
    return !(it.reply&&it.reply.state==='done');
  });
  if(open.length) return { k:'obj', t:'이의 '+open.length+'건', c:'#b45309', bg:'#fffbeb', open:open };
  if(p.done===true) return { k:'done', t:'확인 완료', c:'#166534', bg:'#f0fdf4', open:[] };
  return { k:'todo', t:'미확인', c:'#64748b', bg:'#f8fafc', open:[] };
}

/* 달 목록을 훑을 권한은 없다(남의 것까지 보이므로). 최근 넉 달을 하나씩 두드려 본다.
   발행 안 됐거나 내 것이 아니면 막히는데, 그게 정상이라 조용히 넘긴다. */
function pcLoad(){
  var sid=pcMySid();
  if(!sid || typeof fbDb==='undefined' || !fbDb){ S.perfNone=[]; return Promise.resolve([]); }
  return Promise.all(pcMonths(PC_MONTHS).map(function(ym){
    return fbDb.ref(PC_PATH+'/'+ym+'/p/'+sid).once('value')
      .then(function(s){ var v=s.val(); return {ym:ym, p:(v&&v.items)?v:null}; })
      .catch(function(){ return {ym:ym, p:null}; });   /* 막힌 달도 «없는 달»로 본다 */
  })).then(function(r){
    /* ⚠ 빈 달도 기억해 둔다. 있는 달만 쌓아 보이니 한 달만 뜨면
       「왜 저 달은 안 나오나」가 된다 — 화면에서 그 까닭을 말해 줘야 한다. */
    S.perfNone = r.filter(function(x){ return x && !x.p; }).map(function(x){ return x.ym; });
    return r.filter(function(x){ return x && x.p; }).map(function(x){ return {ym:x.ym, p:x.p}; });
  });
}
function pcObjOf(p,fid){ return ((p.objection||{}).byItem||{})[fid]||null; }
function pcRowState(p,fid){
  var ob=pcObjOf(p,fid);
  if(ob && ob.text && !ob.withdrawnAt) return 'obj';
  return (((p.items||{})[fid]||{}).ok===true) ? 'ok' : 'todo';
}
function pcCounts(p){
  var ids=Object.keys(p.items||{});
  var todo=ids.filter(function(f){ return pcRowState(p,f)==='todo'; }).length;
  return { total:ids.length, todo:todo, handled:ids.length-todo };
}
function pcAllHandled(p){ var c=pcCounts(p); return c.total>0 && c.todo===0; }
function pcMoney(n){ return (Math.round(n||0)).toLocaleString('ko-KR'); }
function pcDay(d){ var s=String(d||''); return s.length>=10 ? (+s.slice(5,7))+'/'+(+s.slice(8,10)) : s; }
function pcDueLate(due){ if(!due) return false; return new Date().toISOString().slice(0,10) > due; }

/* ── 쓰기 — 규칙이 허용하는 칸만 건드린다 ── */
function pcSetOk(ym,fid,on){
  var sid=pcMySid(), now=new Date().toISOString();
  return fbDb.ref(PC_PATH+'/'+ym+'/p/'+sid+'/items/'+fid).update({
    ok:!!on, okAt:on?now:null, okBy:on?sid:null });
}
function pcSaveObj(ym,fid,text){
  var sid=pcMySid();
  return fbDb.ref(PC_PATH+'/'+ym+'/p/'+sid+'/objection/byItem/'+fid).update({
    text:String(text||'').slice(0,500), at:new Date().toISOString(), withdrawnAt:null })
    .then(function(){ return pcSetOk(ym,fid,false); });   /* 이의와 확인은 같이 설 수 없다 */
}
function pcWithdrawObj(ym,fid){
  var sid=pcMySid();
  /* text 는 지우지 않는다 — 대표가 "있었다가 물렸다"를 알아야 한다 */
  return fbDb.ref(PC_PATH+'/'+ym+'/p/'+sid+'/objection/byItem/'+fid+'/withdrawnAt')
    .set(new Date().toISOString());
}
function pcMarkDone(ym){
  var sid=pcMySid();
  return fbDb.ref(PC_PATH+'/'+ym+'/p/'+sid).update({
    done:true, doneAt:new Date().toISOString(), doneBy:sid,
    deviceHint: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?'폰':'PC' });
}

/* ── 화면 ── */
function pcRefresh(){
  return Promise.all([pcLoad(), pcLoadAll()]).then(function(r){
    S.perfData=r[0]; S.perfAll=r[1];
    if(S.view==='perf') renderPerf();
    pcBand();
    return r[0];
  });
}
function pcToggleShow(){ S.perfShow=!S.perfShow; renderPerf(); }
function pcToggleRow(k){ S.perfOpen=S.perfOpen||{}; S.perfOpen[k]=!S.perfOpen[k]; renderPerf(); }
function pcAct(fn){ fn().then(pcRefresh).catch(function(e){ toast('저장하지 못했습니다 — '+((e&&e.message)||'권한을 확인하세요'),'err'); }); }
function pcOk(ym,fid,on){ pcAct(function(){ return pcSetOk(ym,fid,on); }); }
function pcUndoObj(ym,fid){
  if(!confirm('이의를 물리시겠습니까?\n\n남긴 사유는 기록에 남고 대표님이 보실 수 있습니다.')) return;
  pcAct(function(){ return pcWithdrawObj(ym,fid); });
}
function pcObjSave(ym,fid){
  var el=$('pcobj-'+ym+'-'+fid); var t=el?String(el.value||'').trim():'';
  if(t.length<2){ toast('어디가 다른지 적어주세요','err'); return; }
  pcAct(function(){ return pcSaveObj(ym,fid,t); });
}
function pcDoneClick(ym){
  var e=(S.perfData||[]).filter(function(x){return x.ym===ym;})[0]; if(!e) return;
  if(!pcAllHandled(e.p)){ toast('모든 줄을 확인하거나 이의를 남겨주세요','err'); return; }
  if(!confirm(ym+' 성과급 확인을 마칩니다.\n\n확인한 날짜와 시각이 기록에 남고,\n한 번 마치면 스스로 되돌릴 수 없습니다.\n\n진행할까요?')) return;
  pcAct(function(){ return pcMarkDone(ym); });
}

function renderPerf(){
  var app=$('app'); if(!app) return;
  if(S.perfData===undefined){ app.innerHTML=loadingHTML(); pcRefresh(); return; }
  var list=S.perfData||[], adm=S.perfAll||[];
  /* 성과급은 읽는 화면이지 늘어놓는 화면이 아니다. 최대 너비를 두지 않으면
     넓은 모니터에서 「확인한 때」가 저 멀리 붙어 눈이 따라가지 못한다.
     (업무 목록처럼 칸이 많은 화면은 넓어야 하므로 #app 전체가 아니라 여기서만 좁힌다) */
  var h='<div style="max-width:860px">';
  if(!list.length){
    h+='<div class="card" style="text-align:center;padding:32px 20px;color:var(--faint);margin-bottom:14px">'
      +'<div style="font-size:30px;margin-bottom:10px">⭐</div>'
      +'<div style="font-size:14px;margin-bottom:6px">확인할 내 성과급이 없습니다</div>'
      +'<div style="font-size:12px;line-height:1.7">'
      /* 어느 달을 봤는지 적어 준다 — 「몇 달치를 봤나」를 모르면 없다는 말도 못 믿는다 */
      +'최근 '+PC_MONTHS+'개월('+esc((S.perfNone||[]).slice().sort().reverse().map(pcYmLabel).join(' · '))+')을 봤습니다.<br>'
      +'대표님이 그 달치를 내보내면 여기에 나타납니다.<br>'
      +'분명히 있어야 하는데 안 보이면 대표님께 계정 연결을 확인해 달라고 하세요.</div></div>';
  } else {
    h+=list.map(pcMonthHTML).join('');
    h+=pcNoneHTML();                   /* 없는 달을 말해 준다 — 안 그러면 「왜 안 나오나」가 된다 */
  }
  h+=pcAdminHTML();                    /* 총괄·대행에게만 채워진다 */
  app.innerHTML=h+'</div>';
}

/* ── 내 것이 «없는» 달 ────────────────────────────────────────
   있는 달만 카드로 쌓으니, 한 달만 뜨면 나머지 달은 어디 갔는지 알 수가 없다.
   훑어본 달을 다 적고, 없는 달은 없다고 말한다.
   ⚠ 까닭은 둘인데 직원 화면에서는 갈라볼 수 없다 —
     ① 그 달에 내게 붙은 건이 없었다  ② 대표가 아직 그 달을 발행하지 않았다.
     둘 다 적어 준다. 하나만 적으면 절반은 거짓말이 된다. */
function pcYmLabel(ym){ return (+String(ym).slice(5,7))+'월'; }
function pcNoneHTML(){
  var none=(S.perfNone||[]).slice().sort().reverse();
  if(!none.length) return '';
  return '<div class="card" style="padding:11px 14px;margin-bottom:14px;font-size:12px;'
    +'color:var(--faint);line-height:1.8;background:#fbfcfe">'
    +'<b style="color:var(--sub)">'+esc(none.map(pcYmLabel).join(' · '))+'</b> 은 내 성과급이 없습니다.'
    +'<br>그 달에 나에게 붙은 건이 없었거나, 대표님이 아직 그 달을 내보내지 않았습니다.'
    +'<br><span style="font-size:11.5px">최근 '+PC_MONTHS+'개월만 봅니다. 더 이전 달은 대표님께 문의하세요.</span>'
    +'</div>';
}

/* ── 대표만 보는 전체 현황 (읽기 전용) ────────────────────────
   달력 줄로 달을 고르고, 그 아래 사람 탭으로 전체 ↔ 각자를 오간다.
   탭 줄만 훑어도 누구를 손봐야 하는지 알 수 있게 딱지를 붙인다. */
function pcAdmMonths(){ return (S.perfAll||[]).map(function(x){ return x.ym; }); }
function pcAdmYm(){
  if(S.perfAdmYm) return S.perfAdmYm;
  var list=S.perfAll||[]; if(!list.length) return '';
  /* 처음엔 아직 안 끝난 달 중 가장 최근. 다 끝났으면 가장 최근 달. */
  var pend=list.filter(function(x){ return pcMonthStat(x.all).left>0; });
  return (pend[0]||list[0]).ym;
}
function pcAdmSet(ym){ S.perfAdmYm=ym; S.perfAdmSid=''; renderPerf(); }
function pcAdmPick(sid){ S.perfAdmSid=sid||''; renderPerf(); }
function pcAdmMove(d){
  var ym=pcAdmYm(); if(!ym) return;
  var dt=new Date(+ym.slice(0,4), +ym.slice(5,7)-1+d, 1);
  pcAdmSet(dt.getFullYear()+'-'+pad(dt.getMonth()+1));
}
function pcAdmToday(){ var d=new Date(); pcAdmSet(d.getFullYear()+'-'+pad(d.getMonth()+1)); }

function pcAdminHTML(){
  var list=S.perfAll||[];
  if(!list.length) return '';
  var ym=pcAdmYm();
  var cur=list.filter(function(x){ return x.ym===ym; })[0];
  var all=(cur&&cur.all)||{};
  var st=pcMonthStat(all);
  var mask=!S.perfShow;
  var sids=pcSortSids(all);
  var sel=S.perfAdmSid||'';
  if(sel && !all[sel]) sel='';

  var h='<div class="card" style="margin-bottom:14px;border-color:#c7d2fe">';
  h+='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">'
    +'<b style="font-size:14px">👑 전체 현황</b>'
    +'<span style="font-size:11.5px;color:#4f46e5;background:#eef2ff;border-radius:10px;padding:2px 9px">대표만 보임</span>'
    +'<button onclick="pcToggleShow()" style="margin-left:auto;padding:6px 12px;font-size:12px;'
    +'border:1px solid var(--bd);background:#fff;border-radius:6px;cursor:pointer">'
    +(S.perfShow?'금액 가리기':'금액 보기')+'</button></div>';

  /* 달력 줄 — 푸른이알피와 같은 모양 */
  var nav='padding:5px 11px;font-size:13px;border:1px solid var(--bd);background:#fff;border-radius:6px;cursor:pointer';
  h+='<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px">'
    +'<button onclick="pcAdmMove(-1)" style="'+nav+'">◀</button>'
    +'<span style="font-size:15px;font-weight:700;padding:0 6px">'+esc(ym)+'</span>'
    +'<button onclick="pcAdmMove(1)" style="'+nav+'">▶</button>'
    +'<button onclick="pcAdmToday()" style="'+nav+';font-size:12px">오늘</button>'
    +(st.people?'<span style="margin-left:8px;font-size:12px;color:var(--faint)">'
        +st.people+'명 · 합계 '+(mask?'●●●':pcMoney(st.sum)+'원')+'</span>':'')
    +'</div>';

  if(!st.people){
    h+='<div style="padding:26px 12px;text-align:center;color:var(--faint);font-size:12.5px;line-height:1.8">'
      +'이 달은 아직 발행되지 않았습니다.<br>'
      +'<span style="font-size:11.5px">발행한 달: '+(pcAdmMonths().join(' · ')||'없음')+'</span></div></div>';
    return h;
  }

  /* 사람 탭 — 전체부터, 손봐야 할 사람 순서로 */
  h+='<div style="display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--bd);margin-bottom:12px">';
  h+=pcTabHTML('', '전체 <span style="color:var(--faint);font-weight:400">'+st.people+'</span>', sel==='');
  sids.forEach(function(sid){
    var w=pcWho(all[sid]);
    var mark = w.k==='obj'
      ? ' <span style="background:#f59e0b;color:#fff;border-radius:9px;padding:0 6px;font-size:10.5px">이의</span>'
      : (w.k==='todo' ? ' <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#dc2626;vertical-align:1px"></span>' : '');
    h+=pcTabHTML(sid, esc((all[sid].name)||sid)+mark, sel===sid, w.k==='done');
  });
  h+='</div>';

  /* 사번을 따로 넘긴다 — 사본 안의 p.sid 를 믿지 않는다(답변을 엉뚱한 사람에게 쓸 수 없게) */
  h+= sel ? pcAdmOneHTML(ym, sel, all[sel], mask) : pcAdmAllHTML(ym, all, sids, st, mask);
  h+='</div>';
  return h;
}
function pcTabHTML(sid, label, on, dim){
  return '<span onclick="pcAdmPick(\''+esc(sid)+'\')" style="font-size:13px;padding:7px 14px;cursor:pointer;'
    +'margin-bottom:-1px;'+(on?'font-weight:700;border-bottom:2px solid var(--acc);color:var(--tx)':'color:'+(dim?'var(--faint)':'#475569'))+'">'
    +label+'</span>';
}

/* 전체 탭 — 그 달을 통째로 */
function pcAdmAllHTML(ym, all, sids, st, mask){
  var h='';
  /* 한 줄 막대 */
  function seg(n,c){ return n? '<div style="flex:'+n+';background:'+c+'"></div>' : ''; }
  h+='<div style="display:flex;height:8px;border-radius:4px;overflow:hidden;margin-bottom:8px;background:#f1f5f9">'
    +seg(st.done,'#16a34a')+seg(st.obj,'#f59e0b')+seg(st.todo,'#cbd5e1')+'</div>'
    +'<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-bottom:12px">'
    +'<span style="color:#166534">확인 완료 '+st.done+'</span>'
    +'<span style="color:#854d0e">이의 '+st.obj+'</span>'
    +'<span style="color:#64748b">미확인 '+st.todo+'</span></div>';

  /* 다음 할 일 한 줄 */
  var todoTxt=[];
  if(st.obj) todoTxt.push('이의 '+st.obj+'명 처리');
  if(st.todo) todoTxt.push('미확인 '+st.todo+'명 확인');
  h+= st.left
    ? '<div style="background:#fffbeb;border-radius:8px;padding:10px 13px;margin-bottom:12px;font-size:12.5px;color:#854d0e;line-height:1.7">'
      +'→ '+todoTxt.join(', ')+' — 끝나면 이 달을 마감할 수 있습니다</div>'
    : '<div style="background:#f0fdf4;border-radius:8px;padding:10px 13px;margin-bottom:12px;font-size:12.5px;color:#166534;line-height:1.7">'
      +'✅ 모두 확인했습니다 — 푸른이알피 성과관리 → 확인 현황에서 마감하세요</div>';

  h+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px;min-width:380px">'
    +'<tr style="border-bottom:1px solid var(--bd)">'
    +'<td style="padding:6px 4px;color:var(--faint);font-size:11px">이름</td>'
    +'<td style="padding:6px 4px;color:var(--faint);font-size:11px;text-align:right">진행</td>'
    +'<td style="padding:6px 4px;color:var(--faint);font-size:11px;text-align:right">금액</td>'
    +'<td style="padding:6px 4px 6px 12px;color:var(--faint);font-size:11px">상태</td>'
    +'<td style="padding:6px 4px;color:var(--faint);font-size:11px">확인한 때</td></tr>';
  sids.forEach(function(sid){
    var p=all[sid], w=pcWho(p), c=pcCounts(p);
    var late=(w.k!=='done')&&pcDueLate(p.due);
    var extra='';
    if(w.k==='obj'){
      var oldest=0; w.open.forEach(function(fid){
        var d=pcDaysAgo((((p.objection||{}).byItem||{})[fid]||{}).at); if(d>oldest) oldest=d; });
      if(oldest) extra=' · '+oldest+'일째';
    } else if(late){
      extra=' · 마감 '+pcDaysAgo(p.due+'T00:00:00Z')+'일 지남';
    }
    h+='<tr onclick="pcAdmPick(\''+esc(sid)+'\')" style="cursor:pointer;border-bottom:1px solid #f1f5f9;background:'+(w.k==='done'?'#fff':w.bg)+'">'
      +'<td style="padding:8px 4px">'+esc(p.name||sid)+'</td>'
      +'<td style="padding:8px 4px;text-align:right;color:'+(c.todo?'var(--tx)':'var(--faint)')+'">'+c.handled+' / '+c.total+'</td>'
      +'<td style="padding:8px 4px;text-align:right;font-weight:600">'+(mask?'●●●':pcMoney(p.total))+'</td>'
      +'<td style="padding:8px 4px 8px 12px;color:'+(late?'#b91c1c':w.c)+';font-weight:'+(w.k==='done'?400:700)+'">'
        +esc(w.t)+extra+'</td>'
      +'<td style="padding:8px 4px;color:var(--faint);font-size:11.5px">'
        +(p.doneAt?esc(String(p.doneAt).slice(0,10))+(p.deviceHint?' · '+esc(p.deviceHint):''):'-')+'</td></tr>';
  });
  h+='</table></div>';
  return h;
}

/* 사람 탭 — 그 사람이 어느 줄에서 멈췄는지 */
function pcAdmOneHTML(ym, sid, p, mask){
  var items=p.items||{}, c=pcCounts(p), w=pcWho(p);
  var ids=Object.keys(items).sort(function(a,b){ return String(items[a].date||'')<String(items[b].date||'')?-1:1; });
  var h='<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--faint);margin-bottom:12px">'
    +'<span>'+(p.itemCount||ids.length)+'건 · 합계 <b style="color:var(--tx)">'+(mask?'●●●':pcMoney(p.total)+'원')+'</b></span>'
    +'<span>'+c.handled+' / '+c.total+' 처리</span>'
    +'<span style="color:'+w.c+';font-weight:700">'+esc(w.t)+'</span>'
    +(p.doneAt?'<span>확인 '+esc(String(p.doneAt).slice(0,10))+(p.deviceHint?' · '+esc(p.deviceHint):'')+'</span>':'')
    +(!p.uid?'<span style="color:#854d0e;font-weight:700">계정 없음 — 확인 화면을 못 엽니다</span>':'')
    +'</div>';

  ids.forEach(function(fid){
    var it=items[fid]||{}, ob=pcObjOf(p,fid), st=pcRowState(p,fid);
    var tone={ ok:['#f0fdf4','#bbf7d0','#166534','☑'], obj:['#fffbeb','#fde68a','#854d0e','⚠'], todo:['#fff','var(--bd)','#94a3b8','☐'] }[st];
    h+='<div style="border:1px solid '+tone[1]+';background:'+tone[0]+';border-radius:8px;padding:10px 12px;margin-bottom:7px">'
      +'<div style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap">'
        +'<span style="font-size:15px;color:'+tone[2]+'">'+tone[3]+'</span>'
        +'<span style="font-size:13px;flex:1;min-width:0">'+esc(pcDay(it.date))+' '+esc(it.coName||'-')
          +'<span style="color:var(--faint);font-size:12px"> · '+esc(it.kind||it.source||'')+' · '+esc(it.role||'')+'</span></span>'
        +'<span style="font-size:13px;font-weight:600;white-space:nowrap">'+(mask?'●●●':pcMoney(it.amount)+'원')+'</span></div>';
    if(st==='obj' && ob){
      var d=pcDaysAgo(ob.at);
      h+='<div style="font-size:12.5px;color:#475569;margin-top:7px;line-height:1.6">“'+esc(ob.text||'')+'” '
        +'<span style="color:var(--faint)">'+esc(String(ob.at||'').slice(0,10))+' 접수'+(d?' · '+d+'일째':'')+'</span></div>';
    } else if(st==='ok'){
      h+='<div style="font-size:11.5px;color:var(--faint);margin-top:6px">'
        +esc(String(it.okAt||'').slice(0,10))+' 확인</div>';
    }
    if(it.reply && it.reply.text){
      h+='<div style="background:#eff6ff;border-radius:6px;padding:8px 11px;margin-top:7px;font-size:12.5px;color:#1e40af;line-height:1.7">'
        +'<b>답변</b> '+esc(String(it.reply.at||'').slice(0,10))+'<br>'+esc(it.reply.text)+'</div>';
    }
    /* 아직 안 답한 이의에만 답변칸을 낸다 — 답하면 그 이의는 닫힌다 */
    if(st==='obj' && ob && !(it.reply && it.reply.state==='done')){
      h+='<div style="margin-top:8px">'
        +'<textarea id="rp-'+esc(fid)+'" rows="2" placeholder="답변을 적어주세요 — 직원 화면에 그대로 보입니다" '
        +'style="width:100%;box-sizing:border-box;padding:7px 10px;font-size:12.5px;line-height:1.6;'
        +'border:1px solid var(--bd);border-radius:6px;resize:vertical;font-family:inherit"></textarea>'
        +'<div style="display:flex;justify-content:flex-end;margin-top:6px">'
        +'<button id="rpb-'+esc(fid)+'" onclick="pcReply(\''+escJ(ym)+'\',\''+escJ(sid)+'\',\''+escJ(fid)+'\')" '
        +'style="padding:6px 14px;font-size:12px;font-weight:700;border:none;border-radius:6px;'
        +'background:#1e40af;color:#fff;cursor:pointer">답변하고 닫기</button></div></div>';
    }
    h+='</div>';
  });

  if(w.k==='obj') h+='<div style="margin-top:10px;font-size:11.5px;color:var(--faint);line-height:1.7">'
    +'답변하면 그 자리에서 직원 화면에 그대로 보이고, 그 이의는 닫힙니다.<br>'
    +'금액을 고쳐야 하면 푸른이알피 <b>입금관리 → 성과분배</b>에서 고친 뒤 다시 발행하세요.</div>';
  return h;
}

/* ── 이의 답변 — 대표가 여기서 바로 답한다 ──────────────────────
   전에는 보기만 되고 답변은 푸른이알피 「확인 현황」에서 해야 했다. 같은 자료를
   두 화면에서 보면서 손은 한 곳에서만 쓸 수 있으니 늘 오가야 했다.
   ⚠ 쓰는 자리는 items/<fid>/reply — 직원은 못 쓰는 자리다(규칙).
     data/perf_confirm 위쪽에 .write:isAdmin 이 걸려 있어 대표는 여기서도 쓸 수 있다.
   ⚠ 금액은 여기서 못 고친다. 고치는 것은 원본(입금관리 성과분배)의 일이다. */
function pcReplyRef(ym,sid,fid){ return fbDb.ref(PC_PATH+'/'+ym+'/p/'+sid+'/items/'+fid+'/reply'); }
function pcReply(ym,sid,fid){
  var el=$('rp-'+fid); if(!el) return;
  var t=String(el.value||'').trim();
  if(t.length<2){ toast('답변을 적어주세요','err'); return; }
  if(typeof fbDb==='undefined'||!fbDb){ toast('서버에 연결돼 있지 않습니다','err'); return; }
  var btn=$('rpb-'+fid); if(btn){ btn.disabled=true; btn.textContent='저장 중…'; }
  pcReplyRef(ym,sid,fid).set({ text:t.slice(0,500), at:new Date().toISOString(),
      by:pcMySid(), state:'done' })   /* state:'done' 이라야 그 이의가 닫힌다 */
    .then(function(){
      toast('답변했습니다 — 직원 화면에 그대로 보입니다');
      /* 다시 읽어야 화면·띠·배지가 함께 맞는다 (안 읽으면 방금 답한 이의가 그대로 열려 보인다) */
      return pcRefresh().then(route);
    })
    .catch(function(e){
      if(btn){ btn.disabled=false; btn.textContent='답변하고 닫기'; }
      toast('답변 저장 실패 — '+(e&&e.message||''),'err');
    });
}

/* 대표가 답해야 할 이의 — 몇 건인지, 가장 오래된 것이 며칠째인지.
   직원에게는 「확인이 남았습니다」 띠가 뜨는데 대표에게는 아무것도 없어서,
   이의가 올라와도 열어봐야 알았다. 같은 자리를 대표용으로도 쓴다. */
function pcAdmPending(){
  var n=0, people=0, oldest=0, months={};
  (S.perfAll||[]).forEach(function(m){
    Object.keys(m.all||{}).forEach(function(sid){
      var p=m.all[sid]||{}, w=pcWho(p);
      if(w.k!=='obj') return;
      people++; n+=w.open.length; months[(+m.ym.slice(5,7))+'월']=1;
      w.open.forEach(function(fid){
        var d=pcDaysAgo((((p.objection||{}).byItem||{})[fid]||{}).at);
        if(d>oldest) oldest=d;
      });
    });
  });
  return { n:n, people:people, oldest:oldest, months:Object.keys(months) };
}

/* ── 안내 띠 — 확인이 남아 있으면 화면 맨 위에 계속 남는다 ── */
function pcBand(){
  var el=$('perfband'); if(!el) return;
  var pend=(S.perfData||[]).filter(function(x){ return !x.p.done; });
  /* 내 확인이 다 끝났어도, 대표라면 답할 이의가 남았을 수 있다 —
     내 것을 먼저 보이고(내 일이 우선), 없을 때 대표 것을 보인다. */
  if(!pend.length && S.view!=='perf'){
    var a=pcAdmPending();
    if(a.n){
      var slow=a.oldest>=3;                      /* 사흘 넘게 답을 못 받으면 급한 것으로 본다 */
      el.style.display='';
      el.innerHTML='<div onclick="go(\'perf\')" style="cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;'

function go(v){ S.view=v; S.f=null; S.q=''; try{history.pushState({view:v},'');}catch(e){} route(); }
function goBack(){ if(history.length>1) history.back(); else { S.view='my'; route(); } }

function route(){
  ['my','team','stats','kb','ho','archive','perf'].forEach(function(v){var n=$('nav-'+v);if(n)n.className='sitem'+(S.view===v?' on':'');});
  var crumbs={my:'내 업무',team:'팀 전체',stats:'업무량',kb:'지식',ho:'인수인계',archive:'종료',perf:'내 성과급'};

  var ca=$('cnt-ar'); if(ca)ca.textContent=allItems().filter(function(it){return it.state==='done';}).length||'';
  var ck=$('cnt-kb'); if(ck)ck.textContent=kbAll().length||'';
  var ch=$('cnt-ho'); if(ch){ var n2=hoBadgeCount(); ch.textContent=n2||''; ch.style.color=n2?'#c0392b':''; ch.style.fontWeight=n2?'800':''; }
  /* 내가 확인할 달 + (대표라면) 답할 이의 건수를 함께 센다 — 둘 다 「내 성과급」에서 하는 일이다 */
  var cp=$('cnt-perf'); if(cp){
    var n3=(S.perfData||[]).filter(function(x){return !x.p.done;}).length + pcAdmPending().n;
    cp.textContent=n3||''; cp.style.color=n3?'#c0392b':''; cp.style.fontWeight=n3?'800':''; }
  pcBand();   /* 화면을 옮길 때마다 띠를 다시 판단한다 (성과급 화면에서는 숨긴다) */
  if(S.view==='team') renderTeam();
  else if(S.view==='stats') renderStats();
  else if(S.view==='kb') renderKb();
  else if(S.view==='ho') renderHo();
  else if(S.view==='archive') renderArchive();
  else if(S.view==='perf') renderPerf();
  else { S.view='my'; renderMy(); }
  if(S.drawerId) renderDrawer();
}
/* 지식 화면 — 종류별로 모아 보고, 본문까지 검색한다 */

    +'<span class="muted" style="font-size:12.5px">업무에서 얻은 암묵지 — 사람·업체·유형·기관에 붙여 두고 다음에 꺼내 씁니다</span></div>';
  h+='<div class="statbar">전체 <b>'+all.length+'</b>장'
    +'<span class="sep">|</span>'
    +KB_KINDS.map(function(k){

        return '<span class="sb'+(S.kbKind===k[0]?' on':'')+'" onclick="kbFilt(\'kind\',\''+k[0]+'\')" '

      }).join('')
    +'<span class="sep">|</span>'
    +'<span class="sb dg'+(S.kbBad?' on':'')+'" onclick="kbFilt(\'bad\',1)" title="사실과 다르다고 표시된 카드">정정 요청 '
    +all.filter(kbBad).length+'</span>'
    +'<span class="sb am'+(S.kbOld?' on':'')+'" onclick="kbFilt(\'old\',1)" title="2년이 지나 관행이 바뀌었을 수 있는 카드">2년 경과 '

      +'</div>';
  }
  h+='<div class="fbar">'
    +'<input id="qbox" value="'+esc(S.kbQ||'')+'" placeholder="🔍 제목·내용·대상·작성자" oninput="kbOnQ(this.value)">'
    +(S.kbQ?'<span class="chipbtn" onclick="S.kbQ=\'\';renderKb()">✕</span>':'')
    +'<span class="muted" style="font-size:11.5px">'+(list.length!==all.length?list.length+' / '+all.length:all.length)+'장</span>'
    +((S.kbKind||S.kbBad||S.kbOld||S.kbQ)
      ?'<span class="chipbtn on" onclick="S.kbKind=\'\';S.kbBad=0;S.kbOld=0;S.kbQ=\'\';renderKb()">✕ 필터</span>':'')

      +'<b>↗ 지식으로</b>를 누르면 여기에 쌓입니다. 새로 쓸 필요가 없습니다.</span></div>';

    h+='<div class="panel" style="text-align:center;color:var(--sub);padding:30px">조건에 맞는 카드가 없습니다.</div>';

  // 대상(키)별로 묶어 보여준다 — 같은 감독관 카드가 흩어지지 않게

    h+=arr.map(function(c){ return kbCardHTML(c); }).join('');

  h+='</div>';
  app.innerHTML=h;

/* ── 3단계: 본문 검색 ─────────────────────────────────────────────────
   기존 검색(matchQ)은 업무의 필드만 훑는다. 노트 본문·회고·기록·지식 카드는
   대상이 아니었다 — 암묵지를 쌓아도 찾을 수 없으면 죽은 자료가 된다.
   기록 전체는 work_erp/itemlogs를 한 번만 읽어 캐시한다(주차 캐시는 보고 있는
   주만 담고 있어 과거 기록을 못 찾는다). */
var _allLogs=null,_allLogsT=null;
function loadAllLogs(){
  if(_allLogs) return Promise.resolve(_allLogs);
  if(_allLogsT) return _allLogsT;
  _allLogsT=fbDb.ref(NS+'/itemlogs').once('value')
    .then(function(s){ _allLogs=s.val()||{}; _allLogsT=null; return _allLogs; })
    .catch(function(){ _allLogs={}; _allLogsT=null; return _allLogs; });
  return _allLogsT;
}
function _hit(s,q){ return String(s||'').toLowerCase().indexOf(q)>=0; }
function searchAll(q){
  q=String(q||'').toLowerCase().trim();
  var R={items:[],cards:[],logs:[]};
  if(q.length<2) return R;
  allItems().forEach(function(it){
    var n=it.ho_note||{}, r=n.retro||{};
    var where=[];
    if(matchQ(it,q)) where.push('업무 정보');
    HO_FIELDS.forEach(function(f){ if(_hit(n[f[0]],q)) where.push(f[1].replace(/^[①-⑤]\s*/,'')); });
    (n.qa||[]).forEach(function(p){ if(p&&(_hit(p.q,q)||_hit(p.a,q))) where.push('AI 인터뷰'); });
    RETRO_FIELDS.forEach(function(f){ if(_hit(r[f[0]],q)) where.push('회고'); });
    if(where.length) R.items.push({it:it,where:where.filter(function(v,i,a){return a.indexOf(v)===i;})});
  });
  kbAll().forEach(function(c){
    if([c.t,c.x,c.kl,c.byName].some(function(s){return _hit(s,q);})) R.cards.push(c);
  });
  Object.keys(_allLogs||{}).forEach(function(iid){
    var o=_allLogs[iid]||{};
    Object.keys(o).forEach(function(lid){
      var l=o[lid];
      if(l&&_hit(l.t,q)) R.logs.push({iid:iid,l:l});
    });
  });
  R.logs.sort(function(a,b){ return String(b.l.d||'').localeCompare(String(a.l.d||'')); });
  return R;
}

/* ── 3단계: AI 질의응답 — 쌓인 지식을 말로 물어본다 ── */
var AI_SYS_QA='당신은 한국 노무법인의 업무 지식 조수입니다. 아래에 주어진 자료(지식 카드·인수인계 노트·진행 기록)만 근거로 질문에 답하세요.\n'
  +'규칙: ① 자료에 없으면 반드시 "자료에 없습니다"라고 답하고 추측하지 마세요. ② 답의 근거가 된 자료를 그대로 인용해 밝히세요. '
  +'③ 여러 자료가 서로 다르면 둘 다 제시하고 날짜가 최신인 쪽을 표시하세요. ④ 간결한 한국어로 답하세요.\n'
  +'다른 설명 없이 JSON만 출력: {"answer":"답변","sources":["근거로 쓴 자료 제목이나 인용 한 줄","..."],"confident":true}';
// 한국어는 조사가 붙어 "김감독관은"이 "김감독관"과 맞지 않는다 → 조사를 벗긴 형태도 함께 본다
var KO_PART=/(에서|으로|에게|한테|부터|까지|보다|께서|은|는|이|가|을|를|의|에|로|과|와|도|만)$/;
function _qToks(q){
  var out=[];
  String(q||'').toLowerCase().split(/[\s,·?!.]+/).forEach(function(t){
    if(t.length<2) return;
    out.push(t);
    var b=t.replace(KO_PART,'');
    if(b.length>=2&&b!==t) out.push(b);
  });
  return out;
}
function kbAskCtx(q){
  var toks=_qToks(q);
  function score(s){ s=String(s||'').toLowerCase(); return toks.filter(function(t){return s.indexOf(t)>=0;}).length; }
  var cards=kbAll().map(function(c){
      return {c:c,s:score(c.t)*2+score(c.x)+score(c.kl)*2};
    }).sort(function(a,b){return b.s-a.s;});
  var pick=cards.filter(function(x){return x.s>0;});
  if(!pick.length) pick=cards.slice(0,25);
  pick=pick.slice(0,30);
  var L=['[지식 카드 '+pick.length+'장]'];
  pick.forEach(function(x){
    var c=x.c;
    L.push('- ('+(KB_KLBL[c._kind]||c._kind)+' · '+(c.kl||c._key)+') '+c.t
      +(c.x?' — '+c.x:'')+' [작성 '+String(c.at||'').slice(0,10)+' '+(c.byName||'')+']'
      +(kbBad(c)?' ※ 정정 요청됨':'')+(kbStale(c)?' ※ 2년 경과':''));
  });
  var its=allItems().map(function(it){
      var n=it.ho_note||{}, r=n.retro||{};
      var txt=[it.company,it.title,n.ppl,n.warn,n.sit,r.pass,r.diff,r.unexp].join(' ');
      return {it:it,n:n,r:r,s:score(txt)};
    }).filter(function(x){return x.s>0;}).sort(function(a,b){return b.s-a.s;}).slice(0,8);
  if(its.length){
    L.push('','[관련 업무의 노트·회고 '+its.length+'건]');
    its.forEach(function(x){
      L.push('· '+(x.it.company||'')+' '+(x.it.title||'')+(x.it.state==='done'?' (종료)':''));
      HO_FIELDS.forEach(function(f){ if(String(x.n[f[0]]||'').trim()) L.push('   '+f[1]+': '+x.n[f[0]]); });
      RETRO_FIELDS.forEach(function(f){ if(String(x.r[f[0]]||'').trim()) L.push('   회고·'+f[1]+': '+x.r[f[0]]); });
    });
  }
  return L.join('\n');
}

  if(!q){ toast('무엇을 물어볼지 적어 주세요','warn'); return; }

/* ⚠ 전에는 «주소» 도 봤다: /대표/.test(qp('role')) —
   즉 주소 끝에 &role=대표 를 붙이면 누구든 관리자가 됐다.

function isAdmin(){ return !!(S.me&&/대표/.test(S.me.title||'')); }
