<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>급여 대시보드 목업 — 푸른노무법인 (가상 데이터)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --navy:#2E3A8C; --navy-deep:#1F2963; --violet:#7C6CE0;
  --ok:#2E7D4F; --ok-bg:#E8F3EC; --warn:#B26A00; --warn-bg:#FBF1DE; --bad:#C43D3D; --bad-bg:#FBE9E9;
  --ink:#23263B; --sub:#6B6F87; --line:#E3E5EF; --paper:#F5F6FA; --card:#FFFFFF;
}
*{box-sizing:border-box;margin:0}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 120px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.hello{font-size:20px;font-weight:700;letter-spacing:-.01em}
.date{font-size:13px;color:var(--sub);margin-top:2px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.demo-tag{display:inline-block;font-size:11px;color:var(--violet);border:1px solid var(--violet);border-radius:99px;padding:2px 10px;margin-bottom:14px;letter-spacing:.02em}
.signals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.sig{border-radius:14px;padding:14px 14px 12px;text-align:left;border:2px solid transparent;transition:transform .12s ease,border-color .12s ease}
.sig:active{transform:scale(.97)}
.sig.on{border-color:currentColor}
.sig .n{font-size:26px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sig .l{font-size:12.5px;font-weight:600;margin-top:1px}
.sig .hint{font-size:11px;opacity:.75;margin-top:1px}
.sig-ok{background:var(--ok-bg);color:var(--ok)}
.sig-warn{background:var(--warn-bg);color:var(--warn)}
.sig-bad{background:var(--bad-bg);color:var(--bad)}
.sec-title{font-size:14px;font-weight:700;color:var(--sub);margin:0 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec-title .clear{font-size:12px;color:var(--violet);font-weight:600}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;border-bottom:1px solid var(--line);transition:background .1s}
.row:last-child{border-bottom:none}
.row:hover{background:#FAFAFE}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
@media (prefers-reduced-motion: no-preference){
  .dot.urgent{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(196,61,61,.35)}50%{box-shadow:0 0 0 6px rgba(196,61,61,0)}}
}
.row .biz{font-weight:650;font-size:15px}
.row .msg{font-size:12.5px;color:var(--sub);margin-top:1px}
.row .due{margin-left:auto;font-size:12px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.row .due.hot{color:var(--bad);font-weight:700}
.empty{padding:28px 16px;text-align:center;color:var(--sub);font-size:13.5px}
.fab{position:fixed;right:max(16px,calc(50vw - 344px));bottom:20px;background:var(--navy);color:#fff;font-size:15.5px;font-weight:700;padding:15px 24px;border-radius:14px;box-shadow:0 6px 18px rgba(46,58,140,.35);transition:transform .12s,background .12s}
.fab:hover{background:var(--navy-deep)} .fab:active{transform:scale(.97)}
.fab:disabled{background:#B9BDD4;box-shadow:none;cursor:default}
/* 검토 화면 */
.back{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:13.5px;font-weight:600;margin-bottom:12px}
.head-biz{font-size:20px;font-weight:750;letter-spacing:-.01em}
.head-sub{font-size:13px;color:var(--sub);margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.panel h3{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:10px}
.done-line{font-size:13.5px;padding:4px 0;display:flex;gap:8px;align-items:baseline}
.done-line .ic{font-weight:800}
.issue{border:1.5px solid var(--warn);background:#FFFDF7;border-radius:14px;padding:14px 16px;margin-top:12px;transition:opacity .3s,border-color .3s,background .3s}
.issue.cleared{border-color:var(--ok);background:var(--ok-bg);opacity:.75}
.issue .who{font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.issue .why{font-size:12.5px;color:var(--warn);font-weight:650}
.issue.cleared .why{color:var(--ok)}
.issue .detail{font-size:13px;color:var(--sub);margin:6px 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.chip.primary{background:var(--violet);border-color:var(--violet);color:#fff}
.undo-note{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:#fff;font-size:13.5px;padding:12px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{color:var(--violet);font-weight:700;filter:brightness(1.5)}
@media (max-width:480px){.signals{gap:8px}.sig{padding:12px 10px}.sig .n{font-size:22px}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { h, render } from 'https://esm.sh/preact@10';
import { useState } from 'https://esm.sh/preact@10/hooks';
import htm from 'https://esm.sh/htm@3';
const html = htm.bind(h);

/* ── 가상 데이터 (목업용) ───────────────────────── */
const SEED = [
  { id:1, name:'천성',           st:'warn', msg:'2명 금액이 지난달과 많이 달라요',            due:3,
    issues:[
      {who:'김민수', why:'연장수당이 3배로 뛰었어요', detail:'지난달 210,000원 → 이번달 630,000원 · 근무표에는 연장 42시간', acts:['근무표 원본 보기']},
      {who:'이서연', why:'이번달 새로 들어온 분이에요', detail:'7월 7일 입사 · 첫 달이라 일할 계산 · 보험은 이번 달만 계산 방식', acts:['계산 근거 보기']},
    ]},
  { id:2, name:'선우기술(주)',   st:'warn', msg:'사진에서 읽은 값 1건, 눈으로 확인해 주세요', due:3,
    issues:[
      {who:'박정호', why:'사진 근무표에서 읽은 숫자예요', detail:'토요일 근무 6시간으로 읽었어요 · 원본 사진과 대조해 주세요', acts:['원본 사진 보기']},
    ]},
  { id:3, name:'운화헬스케어',   st:'bad',  msg:'근무표가 아직 안 왔어요 · 오늘 아침 독촉 나감', due:2, issues:[] },
  { id:4, name:'(주)씨에스바이오', st:'ok', msg:'모두 확인 끝 · 사업주 회신 기다리는 중',       due:1, issues:[] },
  { id:5, name:'서독',           st:'warn', msg:'퇴사자 1명 · 마지막 달 정산 확인해 주세요',    due:4,
    issues:[
      {who:'최유진', why:'7월 20일 퇴사 예정이에요', detail:'마지막 달 급여 + 세금 정산 + 퇴직금을 함께 계산했어요', acts:['정산 내역 보기']},
    ]},
  { id:6, name:'아이데코',       st:'ok',  msg:'끝났어요 · 명세서까지 나감',                   due:0, issues:[] },
  { id:7, name:'프랫',           st:'bad',  msg:'보낸 파일이 열리지 않아요 · 다시 요청했어요',  due:2, issues:[] },
  { id:8, name:'운암물류',       st:'ok',  msg:'끝났어요',                                     due:0, issues:[] },
];
const LBL = { ok:['끝났어요','손댈 것 없음'], warn:['확인이 필요해요','눌러서 보기'], bad:['자료가 안 왔어요','독촉 나감'] };

function App(){
  const [bizs, setBizs] = useState(SEED);
  const [filter, setFilter] = useState(null);      // null | ok | warn | bad
  const [openId, setOpenId] = useState(null);      // 검토 화면
  const [cleared, setCleared] = useState({});      // {bizId: Set(issueIdx)}
  const [toast, setToast] = useState(null);        // {bizId}

  const count = s => bizs.filter(b=>b.st===s).length;
  const shown = bizs
    .filter(b => filter ? b.st===filter : b.st!=='ok')
    .sort((a,b)=> (a.st==='bad'?-1:1)-(b.st==='bad'?-1:1) || a.due-b.due);

  const open = bizs.find(b=>b.id===openId);
  const clearedSet = cleared[openId] || new Set();
  const allClear = open && open.issues.length>0 && clearedSet.size===open.issues.length;

  const pass = idx => setCleared(c => ({...c, [openId]: new Set([...(c[openId]||[]), idx])}));
  const confirm = () => {
    setBizs(bs => bs.map(b => b.id===openId ? {...b, st:'ok', msg:'확정했어요 · 사업주 전달 준비 중'} : b));
    setToast({bizId: openId}); setOpenId(null);
    setTimeout(()=>setToast(t => t && t.bizId===openId ? null : t), 6000);
  };
  const undo = id => {
    setBizs(bs => bs.map(b => b.id===id ? SEED.find(s=>s.id===id) : b));
    setCleared(c => ({...c,[id]:new Set()})); setToast(null);
  };
  const startReview = () => { const f = shown.find(b=>b.issues.length); if(f) setOpenId(f.id); };

  /* ── 검토 화면 ── */
  if(open) return html`
    <div class="wrap">
      <button class="back" onClick=${()=>setOpenId(null)}>← 돌아가기</button>
      <div class="head-biz">${open.name} · 2026년 7월 급여</div>
      <div class="head-sub">직원 14명 · 지급 총액 52,340,000원 · 마감 D-${open.due}</div>

      <div class="panel">
        <h3>시스템이 먼저 해뒀어요</h3>
        <div class="done-line" style="color:var(--ok)"><span class="ic">✓</span>근무표 도착 · 모두 읽음 (7월 10일)</div>
        <div class="done-line" style="color:var(--ok)"><span class="ic">✓</span>급여 계산 완료 · 지난달 방식 그대로</div>
        <div class="done-line" style="color:var(--ok)"><span class="ic">✓</span>연금·건강보험은 공단 고지액 그대로</div>
        <div class="done-line" style="color:var(--warn)"><span class="ic">!</span>${open.issues.length}건은 사람 눈이 필요해요 — 아래에서 확인</div>
      </div>

      ${open.issues.map((it,idx)=>{
        const ok = clearedSet.has(idx);
        return html`<div class=${'issue'+(ok?' cleared':'')}>
          <div class="who"><span>${it.who}</span><span class="why">${ok?'확인 완료':it.why}</span></div>
          <div class="detail">${it.detail}</div>
          ${!ok && html`<div class="chips">
            ${it.acts.map(a=>html`<button class="chip">${a}</button>`)}
            <button class="chip primary" onClick=${()=>pass(idx)}>맞아요, 통과</button>
            <button class="chip">수정할게요</button>
          </div>`}
        </div>`;
      })}

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px">
        <span class="undo-note">↺ 확정 후에도 되돌릴 수 있어요</span>
      </div>
      <button class="fab" disabled=${!allClear} onClick=${confirm}>
        ${allClear ? '이대로 확정하기' : `${open.issues.length - clearedSet.size}건 확인하면 확정할 수 있어요`}
      </button>
    </div>`;

  /* ── 대시보드 ── */
  return html`
    <div class="wrap">
      <div class="demo-tag">동작 목업 · 가상 데이터</div>
      <div class="topbar">
        <div>
          <div class="hello">좋은 아침이에요, 박은비님</div>
          <div class="date">2026년 7월 15일 (수) · 7월 급여 진행 중</div>
        </div>
        <div class="avatar">박</div>
      </div>

      <div class="signals">
        ${['ok','warn','bad'].map(s=>html`
          <button class=${`sig sig-${s}`+(filter===s?' on':'')} onClick=${()=>setFilter(f=>f===s?null:s)}>
            <div class="n">${count(s)}곳</div>
            <div class="l">${LBL[s][0]}</div>
            <div class="hint">${LBL[s][1]}</div>
          </button>`)}
      </div>

      <div class="sec-title">
        <span>${filter ? LBL[filter][0] : '지금 봐야 할 곳'}</span>
        ${filter && html`<button class="clear" onClick=${()=>setFilter(null)}>전체 보기</button>`}
      </div>
      <div class="list">
        ${shown.length===0 && html`<div class="empty">여기는 비었어요. 다른 신호를 눌러 보세요.</div>`}
        ${shown.map(b=>html`
          <button class="row" onClick=${()=> b.issues.length ? setOpenId(b.id) : null}>
            <span class=${`dot ${b.st}`+(b.st==='bad'&&b.due<=2?' urgent':'')}></span>
            <span style="min-width:0">
              <div class="biz">${b.name}</div>
              <div class="msg">${b.msg}</div>
            </span>
            <span class=${'due'+(b.due<=2&&b.st!=='ok'?' hot':'')}>${b.st==='ok'?'완료':`마감 D-${b.due}`}</span>
          </button>`)}
      </div>

      <button class="fab" onClick=${startReview}>확인 시작 (${bizs.filter(b=>b.st==='warn').length}곳) →</button>

      ${toast && html`<div class="toast">
        <span>${bizs.find(b=>b.id===toast.bizId)?.name} 확정했어요</span>
        <button onClick=${()=>undo(toast.bizId)}>되돌리기</button>
      </div>`}
    </div>`;
}
render(html`<${App}/>`, document.getElementById('app'));
</script>
</body>
</html>
