<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>푸른 급여 아웃소싱 · MVP</title>
<style>
  :root{
    --ink:#16202e; --sub:#647084; --line:#dde3ec; --line2:#eef2f7;
    --brand:#1f6b46; --brand-d:#16523594; --brand-soft:#e7f1eb;
    --calc:#f5f7fa; --warn:#b23b32; --warn-soft:#fbeae8; --ok:#1f6b46;
    --paper:#fff; --bg:#eef1f5; --amber:#9a6a17; --amber-soft:#fbf3e2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:'Pretendard','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  /* layout */
  .app{display:flex;min-height:100vh;}
  .side{width:210px;background:var(--ink);color:#c7d0de;flex-shrink:0;display:flex;flex-direction:column;}
  .side .logo{padding:18px 20px;font-size:15px;font-weight:800;color:#fff;letter-spacing:-.4px;border-bottom:1px solid #2a3647;}
  .side .logo small{display:block;font-size:10px;font-weight:500;margin-top:3px;color:#8794a8;}
  .nav{flex:1;padding:10px 0;}
  .nav a{display:flex;align-items:center;gap:10px;padding:11px 20px;font-size:13px;color:#aeb8c8;text-decoration:none;border-left:3px solid transparent;}
  .nav a .ic{width:18px;text-align:center;opacity:.8;}
  .nav a.on{background:#1b2737;color:#fff;border-color:var(--brand);font-weight:700;}
  .nav a:hover:not(.on){background:#1a2533;color:#e3e9f1;}
  .side .who{padding:14px 20px;border-top:1px solid #2a3647;font-size:11px;color:#8794a8;}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .top{background:#fff;border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:14px;}
  .top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.3px;}
  .top .crumb{font-size:12px;color:var(--sub);}
  .top .ctx{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .pill{font-size:11px;background:var(--brand-soft);color:var(--brand);padding:4px 10px;border-radius:20px;font-weight:600;}
  .pill.gray{background:#eef1f5;color:var(--sub);}
  .content{flex:1;padding:24px 26px;overflow:auto;max-width:1340px;width:100%;}
  .screen{display:none;}
  .screen.on{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;}}
  /* card */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px;}
  .card h2{font-size:14px;margin:0 0 3px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .card .desc{font-size:12px;color:var(--sub);margin:0 0 16px;line-height:1.55;}
  .badge{font-size:10px;padding:2px 8px;border-radius:5px;background:var(--brand-soft);color:var(--brand);font-weight:700;}
  .badge.amber{background:var(--amber-soft);color:var(--amber);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
  .fld{display:flex;flex-direction:column;gap:5px;}
  .fld label{font-size:11px;color:var(--sub);font-weight:600;}
  .fld input,.fld select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff;}
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
  .fld .hint{font-size:10px;color:#9aa6b6;}
  .row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .btn{padding:9px 15px;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;font-size:12.5px;font-weight:600;}
  .btn:hover{background:var(--brand-d);}
  .btn.ghost{background:#fff;color:var(--brand);}
  .btn.ghost:hover{background:var(--brand-soft);}
  .btn.sub{border-color:var(--line);background:#fff;color:var(--sub);}
  .btn.sub:hover{background:#f6f8fb;}
  .btn.warn{border-color:var(--warn);background:var(--warn);color:#fff;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .legend{margin-left:auto;font-size:11px;color:var(--sub);display:flex;gap:14px;}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line);}
  /* table */
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:9px;}
  table{border-collapse:collapse;width:100%;font-size:12px;}
  th,td{border:1px solid var(--line2);padding:0;text-align:center;white-space:nowrap;}
  thead th{background:#f3f6fa;color:var(--sub);font-weight:700;padding:7px 8px;font-size:11px;}
  thead .grp{background:#e9eef4;color:var(--ink);}
  tbody td{padding:7px 9px;font-variant-numeric:tabular-nums;}
  tbody td.num{text-align:right;}
  td.seq{background:#f8fafc;color:#8a94a4;font-weight:600;width:34px;}
  td input{width:100%;border:none;padding:7px 8px;text-align:right;font-size:12px;background:transparent;}
  td input:focus{outline:2px solid var(--brand);outline-offset:-2px;background:#fff;border-radius:3px;}
  td.tx input{text-align:left;}
  td.calc{background:var(--calc);color:#2c3a4c;}
  td.total{background:var(--brand-soft);font-weight:700;color:var(--brand);text-align:right;}
  tr.warn-row td.calc,tr.warn-row td.total{background:var(--warn-soft);}
  tr.unchk-row td{background:#fff8e6;}
  .note{font-size:11px;color:var(--sub);margin-top:11px;line-height:1.6;}
  .note b{color:var(--ink);}
  .box{border-radius:9px;padding:13px 16px;font-size:12px;line-height:1.6;margin-bottom:12px;}
  .box.warn{background:var(--warn-soft);border:1px solid #f0c9c4;color:var(--warn);}
  .box.ok{background:var(--brand-soft);border:1px solid #bfdccb;color:var(--brand);}
  .empty{padding:40px;text-align:center;color:#9aa6b6;font-size:13px;}
  .stat{background:#f3f6fa;border-radius:10px;padding:14px 16px;text-align:center;}
  .stat-n{font-size:22px;font-weight:800;color:var(--ink);}
  .stat-l{font-size:11px;color:var(--sub);margin-top:3px;}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(16,24,38,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:24px 26px;}
  .modal h3{margin:0 0 4px;font-size:15px;}
  .modal .x{float:right;border:none;background:none;font-size:20px;color:var(--sub);cursor:pointer;}
  /* payslip */
  .slip{max-width:560px;margin:0 auto;border:1px solid var(--line);border-radius:10px;padding:26px 30px;background:#fff;}
  .slip h3{text-align:center;font-size:17px;margin:0 0 16px;letter-spacing:5px;}
  .slip .m{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:13px;}
  .pc{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  .pc h4{font-size:12px;margin:0 0 8px;padding-bottom:5px;border-bottom:1.5px solid var(--ink);}
  .pr{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px dashed var(--line2);}
  .pr.sum{font-weight:700;border-bottom:none;border-top:1.5px solid var(--ink);margin-top:2px;padding-top:6px;}
  .pnet{margin-top:15px;background:var(--brand-soft);border-radius:7px;padding:13px 17px;display:flex;justify-content:space-between;font-size:15px;font-weight:800;color:var(--brand);}
  .basis{font-size:10px;color:#9aa6b6;margin-top:13px;line-height:1.5;border-top:1px dashed var(--line);padding-top:9px;}
  .slip-sel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .slip-sel button{padding:7px 13px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:12px;color:var(--sub);}
  .slip-sel button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:700;}
  @media print{.side,.top,.row-btns,.slip-sel,.nav{display:none!important;} .content{padding:0;} .card{border:none;}}
  /* ===== 모바일 반응형 (폰: 조회·확인용) ===== */
  @media (max-width:760px){
    .app{flex-direction:column;}
    .side{width:100%;flex-direction:row;align-items:center;overflow-x:auto;}
    .side .logo{padding:12px 14px;font-size:14px;border-bottom:none;border-right:1px solid #2a3647;white-space:nowrap;flex-shrink:0;}
    .side .logo small{display:none;}
    .nav{display:flex;padding:0;flex:1;overflow-x:auto;}
    .nav a{padding:12px 14px;border-left:none;border-bottom:3px solid transparent;white-space:nowrap;font-size:12.5px;}
    .nav a.on{border-left:none;border-bottom-color:var(--brand);background:#1b2737;}
    .nav a .ic{display:none;}
    .side .who{display:none;}
    .top{padding:11px 14px;flex-wrap:wrap;gap:6px;}
    .top h1{font-size:15px;}
    .top .crumb{display:none;}
    .top .ctx{margin-left:auto;}
    .content{padding:14px;}
    .card{padding:15px 14px;border-radius:10px;}
    .grid{grid-template-columns:1fr 1fr;gap:10px;}
    .row-btns{gap:6px;}
    .btn,.btn.ghost,.btn.sub{padding:8px 11px;font-size:12px;}
    .legend{display:none;}
    table{font-size:11px;}
    thead th{padding:6px 5px;font-size:10px;}
    tbody td{padding:6px 6px;}
    td input{padding:6px 5px;font-size:11px;}
    .pc{grid-template-columns:1fr;gap:14px;}
    .slip{padding:18px 16px;}
    .fb{display:none;}
  }
  /* 가로쓰기 강제(세로 글자 깨짐 방지) */
  th,td,.pill,.badge,.btn{writing-mode:horizontal-tb;}
  .fb{position:fixed;bottom:14px;right:16px;font-size:11px;color:#fff;background:#16523b;padding:6px 12px;border-radius:20px;opacity:.85;}
</style>

<script>

const { h, render } = preact;
const { useState, useMemo, useEffect } = preactHooks;
const html = htm.bind(h);

/* =========================================================
   데이터 계층 (MVP: 메모리 상태 + Firebase 연결 자리)
   실제 배포 시 payroll_* 노드와 동기화. 지금은 시드 데이터.
   ========================================================= */
const won = n => Math.round(n||0).toLocaleString('ko-KR');
const roundup10 = n => Math.ceil((n||0)/10)*10;
const rounddown = n => Math.floor(n||0);
const mask = rrn => rrn ? rrn.slice(0,8)+'******' : '';

/* 산출물 CSV 다운로드 (브라우저 내장, 외부 의존 0). 엑셀에서 열림 */
function downloadCSV(filename, rows){
  const csv = rows.map(r=> r.map(c=>{
    const s=String(c==null?'':c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'}); // BOM=한글깨짐방지
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  URL.revokeObjectURL(a.href);
}

// 담당자(사용자) — 권한 뷰용. admin=대표(전체), 나머지=본인 담당만
const USERS = [
  {sid:'admin', name:'권형하', role:'admin'},
  {sid:'P05',   name:'김보람', role:'staff'},
  {sid:'P06',   name:'박은비', role:'staff'},

/* =========================================================

   ========================================================= */
const RATES_BY_YEAR = {
  '2026':{
    effectiveFrom:'2026-01-01', note:'2026년 최저임금 고시 / 4대보험 요율',

    pensionMin:390000, pensionMax:6170000,   // 국민연금 기준소득월액 상·하한
    healthMax:127056982,                      // 건강보험 보수월액 상한(연)
    taxFreeMeal:200000,                       // 식대 비과세 한도
    taxTable:null,                            // 국세청 간이세액표(추후 적재). null이면 근사식
  },

    taxFreeMeal:200000, taxTable:null,
  },

function getRateAt(ym){
  const y = (ym||'2026').slice(0,4);
  return RATES_BY_YEAR[y] || RATES_BY_YEAR['2026'];
}
// 해당 월의 일수, 입·퇴사 반영 근무일 비율(역일 기준 일할)
function prorateRatio(emp, ym){
  if(!ym) return 1;
  const [y,m] = ym.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const first = new Date(y, m-1, 1), last = new Date(y, m-1, daysInMonth);
  let s = first, e = last;
  if(emp.join){ const j=new Date(emp.join); if(j>s && j<=last) s=j; }
  if(emp.leave){ const l=new Date(emp.leave); if(l>=first && l<last) e=l; }
  if(s>last || e<first) return 0;
  const workedDays = Math.round((e-s)/86400000)+1;
  return Math.min(1, workedDays/daysInMonth);
}

/* 연차휴가 발생일수 (근로기준법 제60조)
   mode: 'join'(입사일 기준) | 'fiscal'(회계연도 1.1 기준, 첫해 일할)
   1년 미만: 월 개근 1일(최대 11일) / 1년 이상: 15일 / 3년 이상 2년마다 +1일(최대 25일)
   단시간: 통상근로자 일수 × (주소정÷40), 시간단위 부여 */
function calcAnnual(emp, baseDate, mode){
  if(!emp.join) return {days:0, hours:0, note:'입사일 없음'};
  const join=new Date(emp.join), base=baseDate?new Date(baseDate):new Date();
  const ms=base-join; if(ms<0) return {days:0,hours:0,note:'입사 전'};
  const months=Math.floor(ms/(30.4*86400000));
  const years=Math.floor(ms/(365*86400000));
  let days, note;
  if(mode==='fiscal'){
    // 회계연도(1.1) 기준
    const joinYear=join.getFullYear(), baseYear=base.getFullYear();
    if(baseYear===joinYear){
      // 입사 첫해: 다음해 1.1에 (재직일수/365)×15 일할 부여 (+ 1년미만 월차)
      const daysWorked=Math.floor((new Date(joinYear+1,0,1)-join)/86400000);
      const prop=+(15*daysWorked/365).toFixed(1);
      days=prop; note=`첫해 일할 ${daysWorked}일분`;
    } else {
      const fy=baseYear-joinYear;  // 회계연도 차수
      days = fy>=2 ? Math.min(25, 15+Math.floor((fy-2)/2)) : 15;
      note=`회계 ${fy}년차`;
    }
  } else {
    // 입사일 기준 (기본)
    if(years<1){ days=Math.min(11, months); note=`입사 ${months}개월(월1일)`; }
    else { days = Math.min(25, 15 + Math.floor((years-1)/2)); note=`${years}년차`; }
  }
  if(emp.empType==='단시간'){
    const ratio=Math.min(1,(+emp.weekHours||40)/40);
    return {days:+(days*ratio).toFixed(1), hours:Math.round(days*8*ratio), prorated:true, note:`통상 ${days}일 × ${Math.round(ratio*100)}%`};
  }
  return {days, hours:days*8, note};
}

/* 간이세액표 (세액표 적재 시 조회, 없으면 근사식) */
function incomeTax(taxable, fam, R){
  const t = Math.max(0, taxable);
  // 세액표가 적재돼 있으면 조회 (실제 국세청 표). 지금은 null → 근사식
  if(R && R.taxTable){
    const row = R.taxTable.find(x=> t>=x.min && t<x.max);
    if(row) return row['f'+Math.min(fam,11)] || 0;
  }
  let base = t>6000000?t*0.072 : t>5000000?t*0.055 : t>4000000?t*0.04 : t>3000000?t*0.025 : t>2000000?t*0.012 : t*0.004;
  base -= (fam-1)*9000;
  return roundup10(Math.max(0, base));
}

/* 일용직 소득세 — 일 15만원 공제 후 6%, 세액공제 45% (실제 법령 방식) */
function dailyTax(dailyPay, days){
  const perDay = Math.max(0, dailyPay - 150000);  // 일 15만원 근로소득공제
  const taxPerDay = perDay * 0.06 * 0.45;          // 6% × (1-0.55 세액공제)
  const total = roundup10(taxPerDay * days);
  return total < 1000*days ? 0 : total;            // 소액부징수(일 1천원 미만)
}

/* 단시간 근로자 전용 계산 — 주휴 비례 + 소정초과 가산수당
   입력(work): weekWork(주 실근로시간), extra(주 소정초과시간/월합산)
   emp: hourlyWage(시급), weekHours(주 소정근로시간), over5(가산 적용) */
function calcPartTime(emp, work, wp, ym){
  const R=getRateAt(ym);
  const w=work||{};
  const hourly=+emp.hourlyWage||0;
  const weekH=+emp.weekHours||0;              // 주 소정근로시간
  const M=4.345;                               // 월평균 주수
  // 기본급 = 시급 × 주소정 × 4.345
  const basic=roundup10(hourly*weekH*M);
  // 주휴수당: 주15h 이상 → (주소정÷40)×8×시급×4.345 (비례)
  const weekly = weekH>=15 ? roundup10((Math.min(weekH,40)/40)*8*hourly*M) : 0;
  // 소정초과 가산수당: 단시간은 소정 초과시 가산(5인이상 1.5배, 미만 1.0배). 월 초과시간 입력
  const otHours=+w.extra||0;
  const otMult=wp.over5?1.5:1.0;
  const otPay=roundup10(hourly*otHours*otMult);
  const taxableBase=basic+weekly+otPay;
  const tax=incomeTax(taxableBase, emp.fam||1, R);
  const localTax=roundup10(tax*0.1);
  const pensionBase=Math.min(Math.max(taxableBase,R.pensionMin),R.pensionMax);
  const pension=emp.ins.p?roundup10(pensionBase*R.pension):0;
  const healthBase=emp.ins.h?roundup10(taxableBase*R.health):0;
  const care=emp.ins.h?roundup10(healthBase*R.care):0;
  const employ=emp.ins.e?roundup10(taxableBase*R.employ):0;
  const ins=pension+healthBase+care+employ;
  const deduct=tax+localTax+ins;
  const lines=[
    {kind:'pay', label:'기본급', amt:basic},
    {kind:'pay', label:'주휴수당', amt:weekly},
    {kind:'pay', label:'초과근로가산', amt:otPay},
    {kind:'deduct', label:'소득세', amt:tax},
    {kind:'deduct', label:'지방소득세', amt:localTax},
    {kind:'deduct', label:'국민연금', amt:pension},
    {kind:'deduct', label:'건강보험', amt:healthBase},
    {kind:'deduct', label:'장기요양', amt:care},
    {kind:'deduct', label:'고용보험', amt:employ},
  ];
  return { isPart:true, hourly, weekH, basic, weekly, otHours, otMult, otPay, grossPay:taxableBase, lines,
           taxableBase, tax, localTax, pension, healthBase, care, employ, ins, deduct, net:taxableBase-deduct };
}

/* 동적 계산 엔진 — 항목 정의(items)를 따라 계산. 항목을 늘리면 자동 반영 */
function calcDyn(emp, work, wp, items, ym){
  const w = work||{};
  const R = getRateAt(ym);                 // 연도별 요율·상하한
  const ratio = prorateRatio(emp, ym);     // 입·퇴사 일할 비율(1=전월근무)
  // ===== 일용직 분기: 일당 × 근무일수 (상용과 완전 별도 계산) =====
  if(emp.empType==='일용'){
    const daily = +emp.daily||0;            // 일당
    const days = +w.days||0;                // 근무일수
    const grossPay = daily*days;
    const tax = dailyTax(daily, days);      // 일용 소득세
    const localTax = roundup10(tax*0.1);
    const employ = emp.ins.e ? roundup10(grossPay*R.employ):0;
    const ins = employ;
    const lines = [{id:'dailyPay',name:`일당(${won(daily)}×${days}일)`,kind:'pay',taxable:true,amt:grossPay}];
    const deduct = tax+localTax+ins;
    return { isDaily:true, daily, days, hourly:daily, ratio:1, lines, payTaxable:grossPay, payNontax:0, grossPay,
             taxableBase:grossPay, tax, localTax, pension:0, healthBase:0, care:0, employ, ins, deduct, net:grossPay-deduct, deductItems:0 };
  }
  // ===== 상용직 =====
  const isHourly = emp.payType==='시급';
  // 통상임금 포함(ord) 고정수당 월액 합계 — 통상시급에 가산 (2024.12 대법 판결 대응)
  // 고정금액 항목(inputAmt)만 가산. 시간비례 수당(연장 등)은 순환 방지 위해 제외.
  const ordFixed = items.filter(it=> it.ord && it.kind==='pay' && it.calc==='inputAmt')
                        .reduce((s,it)=> s + (+w[it.id]||0), 0);
  const baseMonthly = isHourly ? 0 : (+emp.base||0) + ordFixed;
  const hourly = isHourly
    ? roundup10(((+emp.hourlyWage||0)*(+emp.weekHours||40)*4.345 + ordFixed) / ((+emp.weekHours||40)*4.345) )  // 시급제: 시급+ord환산
    : roundup10(baseMonthly / wp.monthlyHours);
  // 시급제 주휴수당: 주15h 이상이면 (주소정÷40)×8×시급 × 월평균주수(4.345)
  const weekH = +emp.weekHours||40;
  const weeklyHoliday = (isHourly && weekH>=15)
    ? roundup10((Math.min(weekH,40)/40)*8*hourly*4.345) : 0;
  // 각 항목 금액 산출 (기본급·식대는 일할 비율 적용)
  const lines = items.map(it=>{
    let amt=0;
    if(it.calc==='auto' && it.id==='basic'){
      amt = isHourly ? roundup10(hourly * (weekH*4.345) * ratio)   // 시급제 기본급=시급×월환산시간
                     : roundup10(hourly * wp.monthlyHours * ratio); // 월급제
    }
    else if(it.id==='weekly')                     amt = weeklyHoliday*ratio; // 주휴수당(시급제만)
    else if(it.calc==='hourlyX')                  amt = roundup10(hourly * (+w[it.id]||0) * it.mult);
    else if(it.calc==='fixedEmp')                 amt = it.field==='meal' ? Math.min(emp.meal||0, R.taxFreeMeal)*ratio : 0;
    else if(it.calc==='inputAmt')                 amt = +w[it.id]||0;
    return {...it, amt: roundup10(amt)};
  });
  let payTaxable=0, payNontax=0, deductItems=0;
  lines.forEach(l=>{
    if(l.kind==='pay'){ if(l.taxable) payTaxable+=l.amt; else payNontax+=l.amt; }
    else { deductItems += l.amt; }
  });
  const grossPay = payTaxable + payNontax;
  const taxableBase = payTaxable - deductItems;
  const tax = incomeTax(taxableBase, emp.fam, R);
  const localTax = roundup10(tax*0.1);
  // 4대보험: 상·하한 적용한 보수월액 기준
  const pensionBase = Math.min(Math.max(taxableBase, R.pensionMin), R.pensionMax);
  const pension = emp.ins.p ? roundup10(pensionBase*R.pension):0;
  const healthBase = emp.ins.h ? roundup10(taxableBase*R.health):0;
  const care = emp.ins.h ? roundup10(healthBase*R.care):0;
  const employ = emp.ins.e ? roundup10(taxableBase*R.employ):0;
  const ins = pension+healthBase+care+employ;
  const deduct = tax+localTax+ins + deductItems;
  const net = grossPay - (tax+localTax+ins) - deductItems;
  return { hourly, ratio, lines, payTaxable, payNontax, grossPay, taxableBase, tax, localTax, pension, healthBase, care, employ, ins, deduct, net, deductItems };
}

const MIN_WAGE_2026 = 10320;
function validate(emp, work, wp, calc, prevNet, ym){
  const w=[];
  const minw = getRateAt(ym).minWage;
  if(!calc.isDaily && calc.hourly < minw) w.push({lv:'warn', msg:`${emp.name} 통상시급 ${won(calc.hourly)}원 — 최저임금(${won(minw)}) 미달`});
  if((work&&work.ot||0)>=30) w.push({lv:'warn', msg:`${emp.name} 연장 ${work.ot}시간 — 과다, 확인 요망`});
  if(prevNet && prevNet>0 && Math.abs(calc.net-prevNet)/prevNet > 0.15)
    w.push({lv:'warn', msg:`${emp.name} 실수령액 지난달 대비 ${calc.net>prevNet?'+':''}${Math.round((calc.net-prevNet)/prevNet*100)}% 변동 — 확인 요망`});
  return w;
}

/* =========================================================
   저장 계층 (persist 어댑터)
   Firebase 연결되면 RTDB 사용(payroll_* 노드), 아니면 localStorage 폴백.
   save: 양쪽 동시 기록 / load: 초기값(로컬) / subscribe: Firebase 실시간 수신
   ========================================================= */
const store = {
  fb(){ return window.__FB_DB; },
  save(key, val){
    try{ localStorage.setItem('payroll_'+key, JSON.stringify(val)); }catch(e){}
    try{ if(this.fb()) this.fb().ref('payroll_'+key).set(val); }catch(e){}
  },
  load(key, fallback){
    try{ const v=localStorage.getItem('payroll_'+key); return v?JSON.parse(v):fallback; }
    catch(e){ return fallback; }
  },
  // Firebase 실시간 구독 — 값이 바뀌면 cb 호출 (없으면 무동작)
  subscribe(key, cb){
    try{
      if(this.fb()) this.fb().ref('payroll_'+key).on('value', s=>{ const v=s.val(); if(v!=null) cb(v); });
    }catch(e){}
  },
  connected(){ return !!this.fb(); },
};

/* 화면11 — AI 급여 비서 (자연어 질의) */
function ScreenAssistant({results,wp,ym,emps,work}){
  const [q,setQ]=useState('');
  const [chat,setChat]=useState([]); // {role, text}
  const [busy,setBusy]=useState(false);
  const samples=['이번 달 총 인건비 얼마야?','주 52시간 넘은 사람 있어?','실수령액 가장 높은 사람은?','4대보험 합계 알려줘'];
  async function ask(question){
    const Q=(question||q).trim(); if(!Q||busy) return;
    setChat(c=>[...c,{role:'user',text:Q}]); setQ(''); setBusy(true);
    try{
      const ctx=results.map(r=>{const c=r.calc;return {성명:r.emp.name,유형:r.emp.empType,통상시급:c.hourly,총지급:c.grossPay,과세임금:c.taxableBase,소득세:c.tax,'4대보험':c.ins,실수령:c.net,연장시간:(work[r.emp.empId]||{}).ot||0};});
      const prompt=`당신은 ${wp.name} ${ym}월 급여 데이터를 답하는 한국 노무법인 비서입니다. 아래 데이터만 근거로 한국어로 간결히 답하세요. 계산이 필요하면 정확히 합산하세요. 데이터에 없으면 모른다고 하세요. 추측 금지.\n\n데이터:\n${JSON.stringify(ctx)}\n\n질문: ${Q}`;
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,messages:[{role:'user',content:prompt}]})});
      const data=await res.json();
      const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('')||'(응답 없음)';
      setChat(c=>[...c,{role:'ai',text}]);
    }catch(err){ setChat(c=>[...c,{role:'ai',text:'✗ 응답 실패: '+err.message+' (네트워크 확인)'}]); }
    setBusy(false);
  }
  return html`
  <div class="card">
    <h2>AI 급여 비서 <span class="badge">${wp.name} · ${(ym||'').replace('-','년 ')}월</span></h2>
    <p class="desc">현재 사업장·월의 급여 데이터에 대해 자연어로 물어보세요. AI가 데이터를 근거로 답합니다(추측하지 않음). 민감정보는 전송 전 마스킹됩니다.</p>
    <div class="slip-sel" style="flex-wrap:wrap;margin-bottom:10px">
      ${samples.map(s=>html`<button onClick=${()=>ask(s)} disabled=${busy}>${s}</button>`)}
    </div>
    <div style="border:1px solid var(--line);border-radius:10px;padding:12px;min-height:160px;max-height:340px;overflow:auto;background:#fafbfc">
      ${chat.length===0 && html`<div class="empty" style="padding:24px">질문을 입력하거나 위 예시를 눌러보세요.</div>`}
      ${chat.map(m=>html`<div style="margin-bottom:10px;text-align:${m.role==='user'?'right':'left'}">
        <span style="display:inline-block;max-width:80%;padding:8px 12px;border-radius:10px;font-size:13px;white-space:pre-wrap;text-align:left;${m.role==='user'?'background:var(--brand);color:#fff':'background:#fff;border:1px solid var(--line)'}">${m.text}</span>
      </div>`)}
      ${busy && html`<div style="font-size:12px;color:var(--sub)">🤖 답변 생성 중…</div>`}
    </div>
    <div class="row-btns" style="margin-top:10px">
      <input style="flex:1;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px" placeholder="예: 윤씨 실수령액이 왜 줄었어?" value=${q} onInput=${e=>setQ(e.target.value)} onKeyDown=${e=>{if(e.key==='Enter')ask();}}/>
      <button class="btn" disabled=${busy||!q.trim()} onClick=${()=>ask()}>질문</button>
    </div>
    <p class="note">AI 답변은 참고용입니다. 신고·지급 등 중요한 수치는 급여대장·검증 화면에서 확인하세요.</p>
  </div>`;
}

/* 화면2 — 근로자 관리 */
/* 주민번호 안전처리: 앞7자리 평문, 뒷6자리 암호화(데모는 표식), 화면 마스킹 */
function splitRRN(full){
  const m=(full||'').replace(/[^0-9]/g,'');
  if(m.length<7) return {front:m, encBack:'', display:m};
  const front=m.slice(0,7);                 // 생년월일+성별자리 = 평문
  const back=m.slice(7,13);                 // 뒷자리 = 암호화 대상
  const encBack = back ? 'enc('+btoa(back).slice(0,8)+')' : ''; // 데모용 암호화 표식(실제는 AES)
  return {front, encBack, display:front+'-'+(back?'******':'')};
}

        ${cert.purpose && html`<p style="font-size:12px;text-align:center;color:var(--sub)">용도: ${cert.purpose}</p>`}
        <p style="text-align:center;font-size:13px;margin-top:24px">${new Date().getFullYear()}년 ${new Date().getMonth()+1}월 ${new Date().getDate()}일</p>
        <div style="text-align:center;margin-top:18px;font-size:13px">
          <div style="font-weight:600">${wp.name}</div>
          <div style="color:var(--sub);font-size:11px;margin-top:3px">사업자등록번호 ${wp.bizNo}</div>
          <div style="margin-top:10px">대표 <span style="display:inline-block;width:48px;height:48px;border:1px dashed var(--line);border-radius:50%;margin-left:6px;text-align:center;line-height:48px;color:#cbd2dd">(인)</span></div>
        </div>
      </div>
      <p class="note" style="text-align:center">기존 근로자 정보로 자동 작성됩니다. 발급 이력은 감사로그에 기록됩니다(Firebase 연결 후).</p>
    </div>
  </div>`}

  ${edit && html`<div class="ov" onClick=${e=>{if(e.target.className==='ov')setEdit(null);}}>
    <div class="modal">
      <button class="x" onClick=${()=>setEdit(null)}>×</button>
      <h3>근로자 정보 수정 — ${edit.name}</h3>
      <p class="desc">급여 계산에 쓰이는 값입니다. 기본급·부양가족·식대를 바꾸면 급여대장이 즉시 다시 계산됩니다.</p>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <div class="fld"><label>성명</label><input value=${edit.name} onInput=${e=>ef('name',e.target.value)}/></div>
        <div class="fld"><label>고용형태</label>
          <select onChange=${e=>{const v=e.target.value;
            if(v==='상용월급') setEdit(o=>({...o,empType:'상용',payType:'월급'}));
            else if(v==='상용시급') setEdit(o=>({...o,empType:'상용',payType:'시급'}));
            else if(v==='단시간') setEdit(o=>({...o,empType:'단시간',payType:'시급'}));
            else setEdit(o=>({...o,empType:'일용',payType:'일급'}));
          }}>
            <option value="상용월급" selected=${edit.empType==='상용'&&edit.payType!=='시급'}>상용 · 월급제</option>
            <option value="상용시급" selected=${edit.empType==='상용'&&edit.payType==='시급'}>상용 · 시급제 (주휴 자동)</option>
            <option value="단시간" selected=${edit.empType==='단시간'}>단시간 (주40h 미만·주휴 비례)</option>
            <option value="일용" selected=${edit.empType==='일용'}>일용 (일당·별도신고)</option>
          </select>
        </div>
        ${edit.empType==='일용'
          ? html`<div class="fld"><label>일당</label><input type="number" value=${edit.daily||0} onInput=${e=>ef('daily',+e.target.value)}/></div>`
          : edit.payType==='시급'
            ? html`<div class="fld"><label>시급</label><input type="number" value=${edit.hourlyWage||0} onInput=${e=>ef('hourlyWage',+e.target.value)}/></div>`
            : html`<div class="fld"><label>기본급(월)</label><input type="number" value=${edit.base||0} onInput=${e=>ef('base',+e.target.value)}/></div>`}
        ${(edit.empType==='단시간' || (edit.empType==='상용'&&edit.payType==='시급'))
          ? html`<div class="fld"><label>주 소정근로시간</label><input type="number" value=${edit.weekHours||40} onInput=${e=>ef('weekHours',+e.target.value)}/><span class="hint">15h↑ 주휴 발생${edit.empType==='단시간'?' · 40h 미만=단시간':''}</span></div>`
          : ''}
        <div class="fld"><label>식대(비과세)</label><input type="number" value=${edit.meal||0} onInput=${e=>ef('meal',+e.target.value)}/></div>
        <div class="fld"><label>부양가족수</label><input type="number" value=${edit.fam||1} onInput=${e=>ef('fam',+e.target.value)}/></div>
        <div class="fld"><label>입사일</label><input value=${edit.join||''} onInput=${e=>ef('join',e.target.value)}/></div>
        <div class="fld"><label>은행</label><input value=${edit.bank||''} onInput=${e=>ef('bank',e.target.value)}/></div>
        <div class="fld"><label>계좌번호</label><input value=${edit.acct||''} onInput=${e=>ef('acct',e.target.value)}/></div>
        <div class="fld"><label>부서</label><input value=${edit.dept||''} onInput=${e=>ef('dept',e.target.value)}/></div>
        <div class="fld"><label>직위</label><input value=${edit.position||''} onInput=${e=>ef('position',e.target.value)}/></div>
        <div class="fld"><label>연락처</label><input value=${edit.phone||''} onInput=${e=>ef('phone',e.target.value)}/></div>
      </div>
      <div class="fld" style="margin-top:12px"><label>4대보험 가입</label>
        <div class="toggles">
          ${[['p','국민연금'],['h','건강보험'],['e','고용보험'],['s','산재보험']].map(([k,nm])=>html`<label><input type="checkbox" checked=${!!edit.ins[k]} onChange=${e=>efIns(k,e.target.checked)}/> ${nm}</label>`)}
        </div>
      </div>
      <div class="row-btns" style="margin-top:16px;margin-bottom:0">
        <button class="btn" onClick=${saveEdit}>✓ 저장</button>
        <button class="btn sub" onClick=${()=>setEdit(null)}>취소</button>
      </div>
    </div>
  </div>`}

  ${ocr && html`<div class="ov" onClick=${e=>{if(e.target.className==='ov')setOcr(null);}}>
    <div class="modal">
      <button class="x" onClick=${()=>setOcr(null)}>×</button>
      <h3>신분증 OCR로 근로자 등록</h3>
      <p class="desc">신분증·운전면허증·근로계약서 등을 올리면 정보를 자동 추출합니다. 담당자가 확인·보정 후 저장하세요.</p>

      <div class="fld" style="margin-bottom:14px">
        <label>서류 종류</label>
        <select value=${ocr.docType} onChange=${e=>setOcr(o=>({...o,docType:e.target.value}))}>
          <option>주민등록증</option><option>운전면허증</option><option>외국인등록증</option><option>통장 사본</option><option>근로계약서</option>
        </select>
      </div>

      ${ocr.step==='upload' && html`
        <div style="border:2px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--sub)">
          <input type="file" accept="image/*" id="ocrf" style="display:none" onChange=${onFile}/>
          <label for="ocrf" class="btn ghost" style="cursor:pointer">📷 이미지 선택 / 촬영</label>
          <p class="note" style="margin-top:10px">⚠ 실제 글자 인식(Google Vision / Tesseract)은 환경설정에서 API 키 연결 후 동작합니다. 지금은 등록 흐름 시연 단계입니다.</p>
        </div>`}

      ${ocr.step==='confirm' && html`
        <div class="box ok" style="margin-bottom:14px">✓ 추출 완료 — 아래 값을 확인·보정하세요. <b>주민번호 뒷자리는 저장 시 자동 암호화·마스킹</b>됩니다.</div>
        <div class="grid" style="grid-template-columns:1fr 1fr">
          <div class="fld"><label>성명</label><input value=${ocr.parsed.name} onInput=${e=>setOcr(o=>({...o,parsed:{...o.parsed,name:e.target.value}}))}/></div>
          <div class="fld"><label>주민번호 (확인 필수)</label><input value=${ocr.parsed.rrnFull} onInput=${e=>setOcr(o=>({...o,parsed:{...o.parsed,rrnFull:e.target.value}}))}/><span class="hint">OCR 숫자 오류 잦음 — 반드시 확인</span></div>
          <div class="fld" style="grid-column:1/3"><label>주소</label><input value=${ocr.parsed.addr} onInput=${e=>setOcr(o=>({...o,parsed:{...o.parsed,addr:e.target.value}}))}/></div>
        </div>
        ${ocr.img && html`<div style="margin-top:12px"><label class="fld" style="font-size:11px;color:var(--sub)">첨부 이미지(대조용·암호화 저장)</label><img src=${ocr.img} style="max-width:200px;border:1px solid var(--line);border-radius:7px;margin-top:5px"/></div>`}
        <div class="row-btns" style="margin-top:16px;margin-bottom:0">
          <button class="btn" onClick=${saveEmp}>✓ 확인 후 저장 (뒷자리 암호화)</button>
          <button class="btn sub" onClick=${()=>setOcr(o=>({...o,step:'upload',parsed:null,img:null}))}>다시 촬영</button>
        </div>`}
    </div>
  </div>`}`;
}

/* 화면3 — 급여대장 (동적 항목, 엑셀처럼 열·행 자유) */
function ScreenLedger({results,work,setW,locked,items,addItem,delItem,addEmp,delEmp,copyPrev,prevYm,toggleOrd}){
  const [showAdd,setShowAdd]=useState(false);
  const avail = ITEM_CATALOG.filter(c=>!items.find(i=>i.id===c.id));
  return html`
  <div class="card">
    <h2>급여대장 — 엑셀형 입력 <span class="badge">동적 항목 · 열·행 자유</span></h2>
    <p class="desc">흰 칸만 입력하면 회색 칸이 자동 계산됩니다. <b>[열 추가]</b>로 항목을 늘리면 명세서에도 자동 반영됩니다. 첫 열은 자동 연번.</p>
    <div class="row-btns">
      <button class="btn ghost" disabled=${locked} onClick=${copyPrev} title=${'지난달('+(prevYm||'-')+') 근태 불러오기'}>📋 지난달 복사</button>
      <button class="btn ghost" disabled=${locked} onClick=${addEmp}>＋ 근로자(행) 추가</button>
      <div style="position:relative">
        <button class="btn" disabled=${locked||avail.length===0} onClick=${()=>setShowAdd(s=>!s)}>＋ 열(항목) 추가 ▾</button>
        ${showAdd && html`<div style="position:absolute;top:38px;left:0;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:10;min-width:160px;padding:6px">
          ${avail.map(c=>html`<div style="padding:8px 10px;cursor:pointer;border-radius:6px;font-size:12.5px" onMouseover=${e=>e.target.style.background='var(--brand-soft)'} onMouseout=${e=>e.target.style.background='#fff'} onClick=${()=>{addItem(c);setShowAdd(false);}}>＋ ${c.name} <span style="color:#9aa6b6;font-size:10px">${c.kind==='deduct'?'공제':c.taxable?'과세':'비과세'}</span></div>`)}
          ${avail.length===0 && html`<div style="padding:8px;color:#9aa6b6;font-size:12px">추가할 항목 없음</div>`}
        </div>`}
      </div>
      <div class="legend"><span><i style="background:#fff"></i>입력</span><span><i style="background:var(--calc)"></i>자동</span><span><i style="background:var(--brand-soft)"></i>실수령</span></div>
    </div>
    <div class="tw">
      <table>
        <thead>
          <tr>
            <th>#</th><th>성명</th><th>통상시급</th>
            ${items.map(it=>html`<th>
              ${it.name}
              ${it.taxable===false?html`<br/><span style="font-size:9px;color:#9aa6b6">비과세</span>`:''}
              ${it.kind==='pay' && it.id!=='basic' && html`<br/><span style="font-size:9px;cursor:pointer;padding:1px 4px;border-radius:3px;${it.ord?'background:#e7f1eb;color:#1f6b46':'background:#eef1f5;color:#9aa6b6'}" title="통상임금 포함 토글 (노무사 판단)" onClick=${()=>toggleOrd(it.id)}>통${it.ord?'O':'X'}</span>`}
              ${!it.locked && html` <span style="cursor:pointer;color:#c0392b" title="열 삭제" onClick=${()=>delItem(it.id)}>×</span>`}
            </th>`)}
            <th>과세임금</th><th>소득세</th><th>4대보험</th><th>실수령액</th><th></th>
          </tr>
        </thead>
        <tbody>
          ${results.map((r,i)=>{
            const c=r.calc; const w=work[r.emp.empId]||{};
            const warn=c.hourly<MIN_WAGE_2026 || (w.ot||0)>=30;
            return html`<tr class=${warn?'warn-row':''}>
              <td class="seq">${i+1}</td>
              <td class="tx" style="font-weight:600">${r.emp.name}</td>
              <td class="calc num">${won(c.hourly)}</td>
              ${c.lines.map(l=>{
                // 입력 항목이면 입력칸 + 계산결과, 자동/고정이면 계산값만
                if(l.input==='time') return html`<td style="padding:0">
                  <div style="display:flex"><input style="width:42px;border-right:1px solid var(--line2)" type="number" value=${w[l.id]||0} disabled=${locked} onInput=${e=>setW(r.emp.empId,l.id,e.target.value)} title="시간"/><span class="calc num" style="flex:1;padding:7px 6px">${l.minus&&l.amt?'-':''}${won(l.amt)}</span></div></td>`;
                if(l.input==='amount') return html`<td><input type="number" value=${w[l.id]||0} disabled=${locked} onInput=${e=>setW(r.emp.empId,l.id,e.target.value)}/></td>`;
                return html`<td class="calc num">${won(l.amt)}</td>`;
              })}
              <td class="calc num">${won(c.taxableBase)}</td>
              <td class="calc num">${won(c.tax+c.localTax)}</td>
              <td class="calc num">${won(c.ins)}</td>
              <td class="total">${won(c.net)}</td>
              <td>${!locked && results.length>1 && html`<span style="cursor:pointer;color:#c0392b" title="행 삭제" onClick=${()=>delEmp(r.emp.empId)}>×</span>`}</td>
            </tr>`;
          })}
        </tbody>
      </table>
    </div>
    <p class="note"><b>계산식(실측 그대로):</b> 기본급=ROUNDUP(통상시급×소정시간,-1) · 시간항목=통상시급×시간×배율(연장1.5·야간0.5·휴일1.5) · 과세임금=과세지급−항목공제 · 소득세=간이세액표 · 4대보험=과세임금×요율. <b>항목(열)을 추가·삭제하면 계산과 명세서가 함께 따라 움직입니다.</b></p>
  </div>`;
}

/* 화면7 — 일용직 전용 (상용직과 분리) */
function ScreenDaily({results,work,setW,locked,addEmpDaily,delEmp}){
  const totalNet = results.reduce((s,r)=>s+r.calc.net,0);
  const totalDays = results.reduce((s,r)=>s+(r.calc.days||0),0);
  return html`
  <div class="card">
    <h2>일용직 급여 <span class="badge amber">일용근로 · 별도 신고</span></h2>
    <p class="desc">일용직은 일당×근무일수로 계산하고, 일용근로소득으로 별도 신고합니다(상용직과 분리). 일용 소득세는 일 15만원 공제 후 적용됩니다.</p>
    <div class="row-btns">
      <button class="btn ghost" disabled=${locked} onClick=${addEmpDaily}>＋ 일용직 추가</button>
    </div>
    ${results.length===0
      ? html`<div class="empty">등록된 일용직이 없습니다. [＋ 일용직 추가] 또는 근로자 관리에서 고용형태를 '일용'으로 등록하세요.</div>`
      : html`<div class="tw">
        <table>
          <thead><tr><th>#</th><th>성명</th><th>일당</th><th>근무일수</th><th>총지급액</th><th>소득세</th><th>지방세</th><th>고용보험</th><th>실지급액</th><th></th></tr></thead>
          <tbody>
            ${results.map((r,i)=>{const c=r.calc; const w=work[r.emp.empId]||{};
              return html`<tr style="background:#fffdf5">
                <td class="seq">${i+1}</td>
                <td class="tx" style="font-weight:600">${r.emp.name}</td>
                <td class="num">${won(c.daily)}</td>
                <td style="padding:0"><input type="number" value=${w.days||0} disabled=${locked} onInput=${e=>setW(r.emp.empId,'days',e.target.value)} title="근무일수"/></td>
                <td class="calc num">${won(c.grossPay)}</td>
                <td class="calc num">${won(c.tax)}</td>
                <td class="calc num">${won(c.localTax)}</td>
                <td class="calc num">${won(c.employ)}</td>
                <td class="total">${won(c.net)}</td>
                <td>${!locked && html`<span style="cursor:pointer;color:#c0392b" title="삭제" onClick=${()=>delEmp(r.emp.empId)}>×</span>`}</td>
              </tr>`;})}
          </tbody>
          <tfoot><tr style="background:#f3f6fa;font-weight:700">
            <td colspan="3" style="text-align:right;padding:8px">합계</td>
            <td class="num">${totalDays}일</td>
            <td class="num" colspan="4"></td>
            <td class="total">${won(totalNet)}</td><td></td>
          </tr></tfoot>
        </table>
      </div>`}
    <p class="note"><b>일용 소득세</b> = (일당−15만원) × 6% × 45% × 일수, 일 1천원 미만 소액부징수. 4대보험은 보통 고용·산재만(월 8일·60시간 미만 시 국민·건강 제외). <b>일용근로소득 지급명세서</b>는 검증·확정 화면의 산출물 ⑤에서 받습니다.</p>
  </div>`;
}

/* 화면8 — 단시간 근로자 전용 (주휴 비례 + 가산수당) */
function ScreenPart({results,work,setW,locked,addEmpPart,delEmp,wp}){
  const totalNet=results.reduce((s,r)=>s+r.calc.net,0);
  return html`

    </div>
    ${results.length===0
      ? html`<div class="empty">등록된 단시간 근로자가 없습니다. [＋ 단시간 추가] 또는 근로자 관리에서 고용형태를 '단시간'으로 등록하세요.</div>`
      : html`<div class="tw">
        <table>
          <thead><tr><th>#</th><th>성명</th><th>시급</th><th>주소정<br/>시간</th><th>기본급</th><th>주휴수당<br/>(비례)</th><th>초과<br/>시간</th><th>가산수당</th><th>과세임금</th><th>소득세</th><th>4대보험</th><th>실수령액</th><th></th></tr></thead>
          <tbody>
            ${results.map((r,i)=>{const c=r.calc; const w=work[r.emp.empId]||{};
              const warn=c.hourly<getRateAt('2026').minWage;
              return html`<tr class=${warn?'warn-row':''}>
                <td class="seq">${i+1}</td>
                <td class="tx" style="font-weight:600">${r.emp.name}</td>
                <td class="num">${won(c.hourly)}</td>

                <td class="calc num">${won(c.otPay)}</td>
                <td class="calc num">${won(c.taxableBase)}</td>
                <td class="calc num">${won(c.tax+c.localTax)}</td>
                <td class="calc num">${won(c.ins)}</td>
                <td class="total">${won(c.net)}</td>
                <td>${!locked && html`<span style="cursor:pointer;color:#c0392b" title="삭제" onClick=${()=>delEmp(r.emp.empId)}>×</span>`}</td>
              </tr>`;})}
          </tbody>
          <tfoot><tr style="background:#f3f6fa;font-weight:700">
            <td colspan="11" style="text-align:right;padding:8px">실수령액 합계</td>
            <td class="total">${won(totalNet)}</td><td></td>
          </tr></tfoot>
        </table>
      </div>`}
    <p class="note"><b>주휴수당</b> = (주소정÷40)×8×시급×4.345 (주15h 이상). <b>가산수당</b> = 시급×초과시간×${wp.over5?'1.5':'1.0'} (소정근로 초과분). 연차휴가(시간비례)는 다음 단계에서 추가됩니다.</p>
  </div>`;
}

/* 화면9 — 연차휴가 관리 (발생·사용·잔여·미사용수당) */
function ScreenAnnual({emps,results,annualUsed,setUsed,ym,payTab}){
  const [mode,setMode]=useState('join'); // join=입사일, fiscal=회계연도
  // 일용직 제외 (payTab이 일용이면 대상 없음 안내)
  const list=emps.filter(e=>e.empType!=='일용');
  const baseDate=ym?ym+'-01':null;
  if(payTab==='일용') return html`<div class="card"><h2>연차휴가 관리 <span class="badge">일용직</span></h2><div class="empty">일용직은 연차휴가 대상이 아닙니다. 상용직·단시간 탭에서 관리하세요.</div></div>`;
  return html`
  <div class="card">
    <h2>연차휴가 관리 <span class="badge">근로기준법 제60조</span></h2>
    <p class="desc">연차 발생일수를 자동 계산하고, 사용일수를 입력하면 잔여·미사용수당이 산출됩니다. 사업장 운영 방식에 따라 산정 기준을 선택하세요.</p>
    <div class="slip-sel" style="margin-bottom:14px">
      <button class=${mode==='join'?'on':''} onClick=${()=>setMode('join')}>입사일 기준</button>
      <button class=${mode==='fiscal'?'on':''} onClick=${()=>setMode('fiscal')}>회계연도 기준 (1.1)</button>
      <span style="font-size:11px;color:var(--sub);padding:7px 0;margin-left:6px">${mode==='join'?'각자 입사일마다 1년 단위 발생':'전 직원 1.1 기준 통일 · 입사 첫해는 일할 부여'}</span>
    </div>
    <div class="tw">
      <table>
        <thead><tr><th>#</th><th>성명</th><th>입사일</th><th>구분</th><th>발생<br/>일수</th><th>사용<br/>일수</th><th>잔여<br/>일수</th><th>1일 통상임금</th><th>미사용수당</th></tr></thead>
        <tbody>
          ${list.map((e,i)=>{
            const a=calcAnnual(e, baseDate, mode);
            const r=results.find(x=>x.emp.empId===e.empId);
            const hourly=r?r.calc.hourly:0;
            const dayWage=roundup10(hourly*8);     // 1일 통상임금=통상시급×8
            const used=annualUsed[e.empId]||0;
            const remain=Math.max(0, a.days-used);
            const allowance=roundup10(remain*dayWage);
            return html`<tr>
              <td class="seq">${i+1}</td>
              <td class="tx" style="font-weight:600">${e.name}</td>
              <td>${e.join||'-'}</td>
              <td style="font-size:11px;color:var(--sub)">${a.note}</td>
              <td class="calc num">${a.days}일${a.prorated?html`<br/><span style="font-size:9px">(${a.hours}h)</span>`:''}</td>
              <td style="padding:0"><input type="number" step="0.5" value=${used} onInput=${ev=>setUsed(e.empId,ev.target.value)} title="사용 연차"/></td>
              <td class="calc num" style="font-weight:700;color:${remain>0?'var(--brand)':'var(--sub)'}">${remain}일</td>
              <td class="num">${won(dayWage)}</td>
              <td class="total">${won(allowance)}</td>
            </tr>`;
          })}
        </tbody>
      </table>
    </div>
    <p class="note"><b>발생</b>: 1년 미만 월 개근 1일(최대 11일) · 1년 이상 15일 · 3년 이상 2년마다 +1일(최대 25일). <b>단시간</b>은 (주소정÷40) 비례·시간단위. <b>미사용수당</b>은 회계연도/입사일 기준 잔여분에 통상임금을 곱해 산정합니다. 실제 부여일수는 출근율(80%)·약정에 따라 조정될 수 있어 담당자 확인이 필요합니다.</p>
  </div>`;
}

/* 화면10 — 근태관리 (일자·항목별 입력 + 카톡 텍스트 파싱 + 업로드) */
function ScreenAttend({emps,payTab,work,setW,setWork,locked,ym,prevWork,prevYm,wp,addAttachRecord,attachRecords,disputes,addDispute,updateDispute}){
  const [paste,setPaste]=useState('');
  const [parsed,setParsed]=useState(null);
  const [upMsg,setUpMsg]=useState('');
  const [viewDoc,setViewDoc]=useState(null); // 원본 보기 모달
  const [dispEmp,setDispEmp]=useState(null);  // 이의제기 모달 대상 근로자
  const [newIssue,setNewIssue]=useState('');
  const [personEmpId,setPersonEmpId]=useState(emps[0]?emps[0].empId:''); // 개인 OCR 대상
  const [personBusy,setPersonBusy]=useState(false);
  const [personMsg,setPersonMsg]=useState('');
  const [summaryEmp,setSummaryEmp]=useState(null); // 개인 근태 요약 팝업
  const [cardOrder,setCardOrder]=useState(['kakao','file','person']); // 입력 카드 순서(드래그)
  const [dragCard,setDragCard]=useState(null);
  const [collapsed,setCollapsed]=useState({}); // {cid:true} 접힘
  const [pinned,setPinned]=useState(null);      // 고정된 카드 cid (맨 위 고정)
  const onCardDrop=(target)=>{ if(!dragCard||dragCard===target){setDragCard(null);return;}
    setCardOrder(o=>{const a=[...o]; const from=a.indexOf(dragCard), to=a.indexOf(target);
      a.splice(from,1); a.splice(to,0,dragCard); return a;}); setDragCard(null); };
  const toggleCollapse=(cid)=> setCollapsed(c=>({...c,[cid]:!c[cid]}));
  const togglePin=(cid)=> setPinned(p=> p===cid?null:cid);
  // 렌더 순서: 고정 카드를 맨 앞으로
  const orderedCards=()=>{ const base=[...cardOrder]; if(pinned){const i=base.indexOf(pinned); if(i>=0){base.splice(i,1); base.unshift(pinned);}} return base; };
  const [dropHot,setDropHot]=useState(null); // 드래그 오버 중인 dropzone id
  // 근태 컬럼 정의 (상용직 입력 항목). for: 적용 고용형태
  const ATTEND_COLS=[
    {k:'ot',     label:'연장(h)'},
    {k:'night',  label:'야간(h)'},
    {k:'holiday',label:'휴일(h)'},
    {k:'weekly', label:'주휴(h)'},
    {k:'absent', label:'결근(h)'},
    {k:'late',   label:'지각(h)'},
    {k:'early',  label:'조퇴(h)'},
  ];
  const [colOrder,setColOrder]=useState(()=>{
    const all=ATTEND_COLS.map(c=>c.k);
    let saved=null; try{ saved=JSON.parse(localStorage.getItem('payroll_attcol_'+wp.wpId)||'null'); }catch(e){}
    if(!Array.isArray(saved)) return all;
    // 정의에 있는데 저장본에 빠진 컬럼은 뒤에 보충, 정의에 없는 건 제거
    const merged=saved.filter(k=>all.includes(k));
    all.forEach(k=>{ if(!merged.includes(k)) merged.push(k); });
    return merged;
  });
  const [colHide,setColHide]=useState(()=>{ try{const h=JSON.parse(localStorage.getItem('payroll_atthide_'+wp.wpId)||'{}'); if(h&&h.ot) delete h.ot; return h||{};}catch(e){return {};} });
  const [colPin,setColPin]=useState(()=>{ try{return JSON.parse(localStorage.getItem('payroll_attpin_'+wp.wpId)||'[]');}catch(e){return [];} });
  useEffect(()=>{ try{localStorage.setItem('payroll_attcol_'+wp.wpId, JSON.stringify(colOrder));}catch(e){} }, [colOrder,wp.wpId]);
  useEffect(()=>{ try{localStorage.setItem('payroll_atthide_'+wp.wpId, JSON.stringify(colHide));}catch(e){} }, [colHide,wp.wpId]);
  useEffect(()=>{ try{localStorage.setItem('payroll_attpin_'+wp.wpId, JSON.stringify(colPin));}catch(e){} }, [colPin,wp.wpId]);
  const [dragCol,setDragCol]=useState(null);
  const [overCol,setOverCol]=useState(null); // 드롭 예정 위치 표시
  const colLabel=(k)=>(ATTEND_COLS.find(c=>c.k===k)||{}).label||k;
  const toggleColHide=(k)=>setColHide(h=>({...h,[k]:!h[k]}));
  const toggleColPin=(k)=>setColPin(p=> p.includes(k)?p.filter(x=>x!==k):[...p,k]);
  // 표시 순서: 고정된 열을 앞으로(고정 순서 유지), 나머지는 colOrder 순서
  const shownCols=()=>{ const vis=colOrder.filter(k=>!colHide[k]); const pinned=colPin.filter(k=>vis.includes(k)); const rest=vis.filter(k=>!colPin.includes(k)); return [...pinned,...rest]; };
  const onColDrop=(target)=>{ if(!dragCol||dragCol===target){setDragCol(null);return;}
    setColOrder(o=>{const a=[...o];a.splice(a.indexOf(dragCol),1);a.splice(a.indexOf(target),0,dragCol);return a;}); setDragCol(null); };
  // 공통 드롭존: label로 클릭 업로드 + 드래그&드롭. accept, aiImg 지정
  const dropZone=(zid, accept, aiImg, label, hint)=>html`
    <label
      onDragOver=${e=>{e.preventDefault();setDropHot(zid);}}
      onDragLeave=${()=>setDropHot(null)}
      onDrop=${e=>{e.preventDefault();setDropHot(null); if(!locked) handleFiles(e.dataTransfer.files, aiImg);}}
      style=${'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed '+(dropHot===zid?'var(--brand)':'var(--line)')+';border-radius:10px;padding:18px;cursor:pointer;background:'+(dropHot===zid?'var(--brand-soft)':'#fafbfc')+';transition:.15s'}>
      <div style="font-size:22px">⬆️</div>
      <div style="font-size:13px;font-weight:600;color:var(--ink)">${label}</div>
      <div style="font-size:11px;color:var(--sub)">${hint}</div>
      <input type="file" accept=${accept} multiple style="display:none" disabled=${locked} onChange=${e=>{handleFiles(e.target.files, aiImg); e.target.value='';}}/>
    </label>`;
  const list=emps;
  const cleanNm=s=>(s||'').replace(/[○ㅇ\(\)일용시급단시간\s]/g,'');
  const findEmp=nc=> emps.find(e=>{const ec=cleanNm(e.name); return ec.includes(nc)||nc.includes(ec)||(nc[0]&&ec[0]===nc[0]&&nc.length>=2&&ec.length>=2);});

  // 지난달 근태 복사
  function copyPrevAttend(){
    if(!prevYm || !prevWork || Object.keys(prevWork).length===0){ setUpMsg('✗ 복사할 지난달('+(prevYm||'-')+') 근태가 없습니다.'); return; }
    setWork(()=>JSON.parse(JSON.stringify(prevWork)));
    setUpMsg('✓ 지난달('+prevYm+') 근태를 복사했습니다.');
  }
  // 근태 엑셀 양식 다운로드 (현재 명단 + 빈 칸)
  function downloadTemplate(){
    if(typeof XLSX==='undefined'){ setUpMsg('✗ 엑셀 모듈 로드 실패(네트워크 확인).'); return; }
    const rows=list.map(e=>({성명:e.name, 유형:e.empType, 연장:'', 야간:'', 휴일:'', 결근:'', 일수:'', 초과:''}));
    const ws=XLSX.utils.json_to_sheet(rows);
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'근태');
    XLSX.writeFile(wb, `${wp?wp.name:'사업장'}_${ym}_근태양식.xlsx`);
  }
  // 일괄 입력/초기화
  function bulkAll(field,val){
    setWork(m=>{const n={...m}; list.forEach(e=>{n[e.empId]={...(n[e.empId]||{}),[field]:val};}); return n;});
    setUpMsg(val===0?'✓ 전원 초기화했습니다.':`✓ 전원 ${field} ${val} 적용.`);
  }

  // 엑셀 업로드 (SheetJS)
  // 엑셀 1개 처리 (ArrayBuffer 또는 File)
  function processExcel(buf, fname){
    if(typeof XLSX==='undefined'){ setUpMsg('✗ 엑셀 모듈을 불러오지 못했습니다(네트워크 확인).'); return; }
    try{
      const wb=XLSX.read(buf,{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      let cnt=0;
      const srcId = addAttachRecord ? addAttachRecord({via:'엑셀 업로드', text:'', fname:fname, count:0}) : null;
      rows.forEach(r=>{
        const nm=r['성명']||r['이름']||r['name']; if(!nm) return;
        const emp=findEmp(cleanNm(String(nm))); if(!emp) return;
        const g=(...ks)=>{for(const k of ks){if(r[k]!=null&&r[k]!=='')return +r[k];}return null;};
        setWork(m=>{const cur={...(m[emp.empId]||{})};
          const ot=g('연장','연장근로','ot'); if(ot!=null)cur.ot=ot;
          const ni=g('야간','night'); if(ni!=null)cur.night=ni;
          const ho=g('휴일','holiday'); if(ho!=null)cur.holiday=ho;
          const ab=g('결근','absent'); if(ab!=null)cur.absent=ab;
          const dy=g('일수','근무일수','days'); if(dy!=null)cur.days=dy;
          if(srcId) cur._src=srcId;
          return {...m,[emp.empId]:cur};});
        cnt++;
      });
      setUpMsg(cnt>0?`✓ ${fname}에서 ${cnt}명 근태를 반영했습니다.`:`✗ ${fname}: 매칭되는 근로자가 없습니다. 성명 열을 확인하세요.`);
    }catch(err){ setUpMsg('✗ 엑셀 읽기 실패: '+err.message); }
  }
  // 파일 1개를 종류별로 처리 (엑셀/이미지). aiImg=true면 이미지를 AI 판독
  async function processFile(file, aiImg){
    const name=(file.name||'').toLowerCase();
    if(/\.(xlsx|xls|csv)$/.test(name)){
      const buf=await file.arrayBuffer(); processExcel(buf, file.name);
    } else if(/\.(png|jpe?g|gif|webp|bmp)$/.test(name) || (file.type||'').startsWith('image/')){
      if(aiImg) await processPhotoAI(file); else setUpMsg('📷 '+file.name+' 사진을 받았습니다. AI 판독 버튼 또는 개인 OCR로 인식하세요.');
    } else { setUpMsg('✗ 지원하지 않는 형식: '+file.name+' (엑셀·이미지·zip만)'); }
  }
  // 여러 파일·압축(zip) 처리
  async function handleFiles(fileList, aiImg){
    const files=[...fileList]; if(!files.length) return;
    for(const f of files){
      const nm=(f.name||'').toLowerCase();
      if(nm.endsWith('.zip')){
        if(typeof JSZip==='undefined'){ setUpMsg('✗ 압축 모듈을 불러오지 못했습니다(네트워크 확인).'); continue; }
        setUpMsg('🗜 '+f.name+' 압축을 푸는 중…');
        try{
          const zip=await JSZip.loadAsync(await f.arrayBuffer());
          const entries=Object.values(zip.files).filter(e=>!e.dir && !e.name.startsWith('__MACOSX'));
          for(const e of entries){
            const en=e.name.toLowerCase();
            if(/\.(xlsx|xls|csv)$/.test(en)){ processExcel(await e.async('arraybuffer'), e.name); }
            else if(/\.(png|jpe?g|gif|webp|bmp)$/.test(en) && aiImg){
              const blob=await e.async('blob'); await processPhotoAI(new File([blob], e.name, {type:'image/jpeg'}));
            }
          }
          setUpMsg('✓ '+f.name+' 압축 내 파일 처리 완료('+entries.length+'개).');
        }catch(err){ setUpMsg('✗ 압축 해제 실패: '+err.message); }
      } else {
        await processFile(f, aiImg);
      }
    }
  }
  function onExcel(e){ handleFiles(e.target.files, false); e.target.value=''; }
  // 사진 OCR (자리 — Vision/Tesseract 연결)
  function onPhoto(e){
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    setUpMsg('📷 사진을 받았습니다. OCR 엔진(Google Vision/Tesseract) 연결 시 자동 인식됩니다. 현재는 표에서 직접 입력해 주세요.');
  }

  const [aiBusy,setAiBusy]=useState(false);
  // 명단 문자열(AI에게 매칭 기준 제공)
  const roster=()=>emps.map(e=>e.name).join(', ');
  // Claude API 호출 → 근태 JSON
  async function callAI(messages){
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514', max_tokens:1000, messages})
    });
    const data=await res.json();
    const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const clean=text.replace(/```json|```/g,'').trim();
    return JSON.parse(clean);
  }
  // JSON 배열 → parsed 미리보기 형태로
  function aiToParsed(arr){
    const out=arr.map(r=>{
      const emp=findEmp(cleanNm(String(r.name||'')));
      return {raw:r.name, name:r.name, empId:emp?emp.empId:null, matched:emp?emp.name:null,
              ot:r.ot??null, night:r.night??null, holiday:r.holiday??null, absent:r.absent??null, days:r.days??null,
              conf:(r.conf!=null?+r.conf:null), low:Array.isArray(r.low)?r.low:[], reason:r.reason||''};
    });
    setParsed(out);
  }
  const [pendingSrc,setPendingSrc]=useState(null); // 반영 대기 중인 원본 {via, text, img}
  // ① 카톡 자연어 AI 파싱
  async function parseAI(){
    if(!paste.trim()){ setUpMsg('✗ 붙여넣은 내용이 없습니다.'); return; }
    setAiBusy(true); setUpMsg('🤖 AI가 근태를 분석 중입니다…');
    try{
      const prompt=`다음은 사업장이 보낸 근태 메시지입니다. 근로자 명단: [${roster()}].\n메시지에서 각 근로자의 근태를 추출해 JSON 배열로만 답하세요. 형식: [{"name":"이름","ot":연장시간,"night":야간시간,"holiday":휴일시간,"absent":결근시간,"days":근무일수}]. 해당 없는 항목은 생략. 설명·마크다운 없이 JSON만.\n\n메시지:\n${paste}`;
      const arr=await callAI([{role:'user',content:prompt}]);
      aiToParsed(Array.isArray(arr)?arr:[]); setPendingSrc({via:'카톡·AI', text:paste}); setUpMsg('🤖 AI 분석 완료 — 아래에서 확인 후 반영하세요.');

  async function onPersonFile(f){

      const b64=dataUrl.split(',')[1]; const media=f.type||'image/jpeg';
      const prompt=`이것은 '${emp.name}' 한 사람의 ${ym} 출퇴근 기록표입니다. 월 합계를 추출해 JSON 객체로만 답하세요: {"ot":연장근로시간,"night":야간시간,"holiday":휴일근로시간,"absent":결근시간,"days":근무일수,"conf":0~100 확신도,"low":["불확실한 항목명들"],"reason":"불확실 이유"}. 일자별 출퇴근에서 1일 8시간 초과분을 연장으로 합산. 손글씨가 흐리거나 모호하면 conf를 낮추고 low에 항목을 넣으세요. 추측 단정 금지. 해당 없으면 0. 설명 없이 JSON만.`;
      const obj=await callAI([{role:'user',content:[{type:'image',source:{type:'base64',media_type:media,data:b64}},{type:'text',text:prompt}]}]);

  function parseText(){
    const lines=paste.split(/[\n;]+/).map(s=>s.trim()).filter(Boolean);
    const out=[];
    lines.forEach(ln=>{
      // 이름 추출: 맨 앞 한글(○ 포함 가능) 2~5자
      const nm=(ln.match(/[가-힣○ㅇ]{2,5}/)||[])[0];
      if(!nm) return;
      const nc=cleanNm(nm);
      const emp=findEmp(nc);
      // 숫자 항목 추출
      const num=(re)=>{const m=ln.match(re); return m?+m[1]:null;};
      const days=num(/(\d+)\s*일/) ?? num(/근무\s*(\d+)/);
      const ot=num(/연장\s*(\d+)/);
      const night=num(/야간\s*(\d+)/);
      const hol=num(/휴일\s*(\d+)/);
      const absent=num(/결근\s*(\d+)/);
      out.push({raw:ln, name:nm, empId:emp?emp.empId:null, matched:!!emp, days, ot, night, holiday:hol, absent});
    });
    setParsed(out); setPendingSrc({via:'카톡·규칙', text:paste});
  }
  function applyParsed(){
    const cnt=parsed.filter(p=>p.empId).length;

    let srcId=null;
    if(addAttachRecord && pendingSrc){
      srcId=addAttachRecord({via:pendingSrc.via, text:pendingSrc.text||'', img:pendingSrc.img||'', fname:pendingSrc.fname||'', count:cnt});
    }
    parsed.forEach(p=>{
      if(!p.empId) return;
      setWork(m=>{
        const cur={...(m[p.empId]||{})};
        if(p.days!=null) cur.days=p.days;
        if(p.ot!=null) cur.ot=p.ot;
        if(p.night!=null) cur.night=p.night;
        if(p.holiday!=null) cur.holiday=p.holiday;
        if(p.absent!=null) cur.absent=p.absent;
        if(srcId) cur._src=srcId;   // 입력 원본 연결
        cur._low=(p.low&&p.low.length)?p.low:null; // 불확실(저확신) 항목
        return {...m,[p.empId]:cur};
      });
    });
    setParsed(null); setPaste(''); setPendingSrc(null);
  }

             :src.text?html`<pre style="white-space:pre-wrap;font-size:12px;background:#f7f9fb;border-radius:8px;padding:10px;max-height:200px;overflow:auto">${src.text}</pre>`
             :html`<div style="font-size:12px;color:var(--sub)">${src.via} · ${src.fname||''}</div>`)
          : html`<p class="note">연결된 원본이 없습니다(수기 입력).</p>`}
      </div>
    </div>
  </div>`;})()}`;
}
function ScreenVerify({warnings,locked,setLocked,go,results,wp,ym}){
  const [aiReport,setAiReport]=useState(null);
  const [aiBusy,setAiBusy]=useState(false);
  // AI 마감 감사관: 전 직원 계산결과를 Claude에 보내 이상 징후 점검
  async function runAudit(){
    setAiBusy(true); setAiReport(null);
    try{
      const rows=results.map(r=>{const c=r.calc; return {
        성명:r.emp.name, 유형:r.emp.empType, 통상시급:c.hourly, 총지급:c.grossPay,
        과세임금:c.taxableBase, 소득세:c.tax, '4대보험':c.ins, 실수령:c.net,
        연장:(c.lines||[]).find(l=>l.id==='ot')?.amt||0,
      };});
      const prompt=`당신은 한국 노무법인의 급여 검토 보조원입니다. 아래는 ${wp.name} ${ym}월 급여 계산 결과입니다. 임금체불·법위반·계산오류로 이어질 수 있는 의심 항목만 간결히 지적하세요. 최저임금 미달, 통상시급 대비 연장수당 불일치, 4대보험 누락 의심, 실수령 이상치, 유형(상용/일용/단시간)에 안 맞는 값 등을 봅니다. 확실하지 않으면 단정하지 말고 "확인 권장"으로 표현하세요. 판단은 노무사가 합니다. 항목별로 "• 이름: 내용" 형식 5개 이내. 문제 없으면 "특이사항 없음". 데이터:\n${JSON.stringify(rows)}`;
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
      const data=await res.json();
      const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
      setAiReport(text||'(응답 없음)');
    }catch(err){ setAiReport('✗ AI 점검 실패: '+err.message+' (네트워크 확인)'); }
    setAiBusy(false);
  }
  // 산출물 생성
  const genLedger=()=>{ // ① 사업장 급여대장
    const head=['연번','성명','통상시급','총지급','과세임금','소득세','지방세','국민연금','건강','장기요양','고용','공제계','실수령액'];
    const rows=results.map((r,i)=>{const c=r.calc;return [i+1,r.emp.name,c.hourly,c.grossPay,c.taxableBase,c.tax,c.localTax,c.pension,c.healthBase,c.care,c.employ,c.deduct,c.net];});
    downloadCSV(`${wp.name}_${ym}_급여대장.csv`,[head,...rows]);
  };
  const genBank=()=>{ // ② 은행 이체파일
    const head=['연번','성명','입금액(실수령)','비고'];
    const rows=results.map((r,i)=>[i+1,r.emp.name,r.calc.net,wp.name]);
    const total=results.reduce((s,r)=>s+r.calc.net,0);
    downloadCSV(`${wp.name}_${ym}_은행이체.csv`,[head,...rows,['','합계',total,'']]);
  };
  const genTax=()=>{ // ③ 원천세 신고자료 (상용직만 — 일용은 별도)
    const sang=results.filter(r=>!r.calc.isDaily);
    const head=['연번','성명','과세소득','소득세','지방소득세'];
    const rows=sang.map((r,i)=>[i+1,r.emp.name,r.calc.taxableBase,r.calc.tax,r.calc.localTax]);
    const t1=sang.reduce((s,r)=>s+r.calc.tax,0), t2=sang.reduce((s,r)=>s+r.calc.localTax,0);
    downloadCSV(`${wp.name}_${ym}_원천세신고(상용).csv`,[head,...rows,['','합계','',t1,t2]]);
  };
  const genDaily=()=>{ // ⑤ 일용근로소득 지급명세서 (일용직만 — 법정 별도서식)
    const daily=results.filter(r=>r.calc.isDaily);
    if(daily.length===0){ alert('이 사업장에 일용직이 없습니다.'); return; }
    const head=['연번','성명','주민번호','귀속월','근무일수','일당','총지급액','소득세','지방소득세','차인지급액'];
    const rows=daily.map((r,i)=>{const c=r.calc;return [i+1,r.emp.name,mask(r.emp.rrn),ym,c.days,c.daily,c.grossPay,c.tax,c.localTax,c.net];});
    downloadCSV(`${wp.name}_${ym}_일용근로소득_지급명세서.csv`,[head,...rows]);
  };
  const total=results.reduce((s,r)=>s+r.calc.net,0);
  return html`
  <div class="card">
    <h2>검증 · 확정</h2>
    <p class="desc">확정 전 자동 점검 3종(최저임금·급변동·4대보험 이상치). 담당자가 확인 후 확정합니다.</p>
    ${warnings.length>0
      ? html`<div class="box warn">⚠ <b>확인 필요 ${warnings.length}건</b><br/>${warnings.map(w=>html`· ${w.msg}<br/>`)}</div>`
      : html`<div class="box ok">✓ 경고 없음 — 전원 최저임금 이상, 4대보험·한도 정상</div>`}
    <div class="box ok">✓ 인원 ${results.length}명 · 실수령 합계 <b>${won(total)}원</b> · 한도 정상</div>
    <div class="row-btns" style="margin-top:8px">
      <button class="btn ghost" disabled=${aiBusy} onClick=${runAudit}>${aiBusy?'🤖 점검 중…':'🤖 AI 정밀 점검'}</button>
    </div>
    ${aiReport && html`<div class="box" style="background:#f0f6ff;border:1px solid #cfe0f5;margin-top:8px">
      <b style="color:#1f4e8c">🤖 AI 마감 점검 결과</b>
      <pre style="white-space:pre-wrap;font-size:13px;margin:8px 0 0;font-family:inherit">${aiReport}</pre>
      <div style="font-size:11px;color:#6b7a90;margin-top:6px">AI 보조 점검입니다. 최종 판단·확정은 노무사가 합니다.</div>
    </div>`}
    <div class="row-btns" style="margin-top:8px">
      ${!locked
        ? html`<button class="btn" onClick=${()=>{setLocked(true);}}>🔒 이 달 급여 확정</button>`
        : html`<button class="btn warn" onClick=${()=>setLocked(false)}>🔓 확정 해제 (사유 입력)</button>`}
      ${locked && html`<button class="btn ghost" onClick=${go}>📄 명세서 발급으로 →</button>`}
    </div>
    <p class="note">확정하면 그달 데이터가 <b>잠기고(locked)</b> 모든 변경은 감사로그에 기록됩니다. 담당자가 본인 담당 사업장만 확정.</p>
  </div>
  <div class="card">
    <h2>산출물 <span class="badge">${locked?'발급 가능':'확정 후 발급'}</span></h2>
    <p class="desc">확정된 급여를 사업장 제출·은행 이체·세무 신고용으로 내려받습니다(CSV·엑셀에서 열림). 상용직과 일용직은 신고 서식이 다릅니다.</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">
      <button class="btn sub" disabled=${!locked} onClick=${genLedger}>📊 ① 사업장 급여대장</button>
      <button class="btn sub" disabled=${!locked} onClick=${genBank}>🏦 ② 은행 이체파일</button>
      <button class="btn sub" disabled=${!locked} onClick=${genTax}>🧾 ③ 원천세 신고(상용)</button>
      <button class="btn sub" disabled=${!locked} onClick=${go}>📄 ④ 급여명세서 일괄</button>
      <button class="btn sub" disabled=${!locked} onClick=${genDaily}>👷 ⑤ 일용 지급명세서</button>
    </div>
    <p class="note">② 은행 이체파일은 <b>검증 끝난 입금액만</b> 제공(실제 이체는 사업주). ③ 원천세는 상용직, ⑤ 일용근로소득 지급명세서는 일용직 전용(법정 별도서식). 신고자료는 파일 생성까지 — 제출은 담당자 업로드.</p>
  </div>`;
}

/* 화면5 — 급여명세서 (동적 항목 자동 반영) */
/* 명세서 한 장 (개별·일괄 공용) */
function SlipPaper({r,wp,ym}){
  const c=r.calc;
  const payLines = c.lines.filter(l=>l.kind==='pay' && l.amt!==0);
  const dedLines = c.lines.filter(l=>l.kind==='deduct' && l.amt!==0);
  const totalPay = payLines.reduce((s,l)=>s+l.amt,0);
  return html`<div class="slip" style="page-break-after:always;margin-bottom:18px">
    <h3>급 여 명 세 서</h3>
    <div class="m"><span>${wp.name}</span><span>${(ym||'').replace('-','년 ')}월 (지급일 ${wp.payday})</span></div>
    <div style="font-size:12px;margin-bottom:13px"><b>${r.emp.name}</b> 님 · ${r.emp.dept||''} ${r.emp.position||''} · 입사 ${r.emp.join}</div>
    <div class="pc">
      <div>
        <h4>지급 항목</h4>
        ${payLines.map(l=>html`<div class="pr"><span>${l.name}${l.taxable===false?'(비과세)':''}</span><b>${won(l.amt)}</b></div>`)}
        ${dedLines.map(l=>html`<div class="pr"><span>${l.name}</span><b>-${won(l.amt)}</b></div>`)}
        <div class="pr sum"><span>지급 합계</span><b>${won(totalPay - c.deductItems)}</b></div>
      </div>
      <div>
        <h4>공제 항목</h4>
        <div class="pr"><span>소득세</span><b>${won(c.tax)}</b></div>
        <div class="pr"><span>지방소득세</span><b>${won(c.localTax)}</b></div>
        <div class="pr"><span>국민연금</span><b>${won(c.pension)}</b></div>
        <div class="pr"><span>건강·장기요양</span><b>${won(c.healthBase+c.care)}</b></div>
        <div class="pr"><span>고용보험</span><b>${won(c.employ)}</b></div>
        <div class="pr sum"><span>공제 합계</span><b>${won(c.tax+c.localTax+c.ins)}</b></div>
      </div>
    </div>
    <div class="pnet"><span>실 수령액</span><span>${won(c.net)} 원</span></div>
    <div class="basis">계산 근거: 시간항목 = 통상시급 ${won(c.hourly)}원 × 시간 × 배율(근로기준법 제56조) · 소득세 = 근로소득 간이세액표 적용 · 비과세 한도 적용${c.ratio<1?` · 일할 ${Math.round(c.ratio*100)}%`:''}</div>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px;font-size:11px;color:var(--sub)">
      <span>${(ym||'').replace('-','년 ')}월 ${new Date().getDate()}일</span>
      <span style="text-align:center">${wp.name} 대표 <span style="display:inline-block;width:46px;height:46px;border:1px dashed var(--line);border-radius:50%;margin-left:6px;text-align:center;line-height:46px;color:#cbd2dd">(인)</span></span>
    </div>
  </div>`;
}

function ScreenSlip({results,wp,slipId,setSlipId,items,ym,payTab}){
  const [mode,setMode]=useState('one'); // one=개별, all=일괄
  if(!results || results.length===0) return html`<div class="card"><h2>급여명세서 <span class="badge">${payTab||''}</span></h2><div class="empty">${payTab||''} 대상 근로자가 없습니다. 다른 탭을 선택하세요.</div></div>`;
  const r = results.find(x=>x.emp.empId===slipId) || results[0];
  return html`
  <div class="card">
    <h2>급여명세서 <span class="badge">근로기준법 법정서식</span></h2>
    <p class="desc">확정된 급여대장에서 자동 생성. 추가한 항목·일할도 자동 반영. HTML 인쇄(print)로 PDF화 — 한 장씩 또는 전체 일괄.</p>
    <div class="slip-sel">
      ${mode==='one' && results.map(x=>html`<button class=${x.emp.empId===slipId?'on':''} onClick=${()=>setSlipId(x.emp.empId)}>${x.emp.name}</button>`)}
      ${mode==='all' && html`<span style="font-size:12px;color:var(--sub);padding:7px 0">전체 ${results.length}명 연속 출력 모드</span>`}
      <button onClick=${()=>setMode(m=>m==='one'?'all':'one')} style="margin-left:auto;border-color:var(--line);color:var(--sub)">${mode==='one'?'📑 전체 일괄 보기':'📄 개별 보기'}</button>
      <button onClick=${()=>window.print()} style="border-color:var(--brand);color:var(--brand)">🖨 인쇄 / PDF</button>
    </div>
    ${mode==='one'
      ? html`<${SlipPaper} r=${r} wp=${wp} ym=${ym}/>`
      : results.map(x=>html`<${SlipPaper} r=${x} wp=${wp} ym=${ym}/>`)}
    <p class="note" style="text-align:center"><b>계산 근거 표시</b>가 노무법인의 차별점 — 근로자 이의 차단 + 지도점검 증빙. 일괄 출력은 1인 1페이지로 연속 인쇄됩니다.</p>
  </div>`;
}

render(html`<${App}/>`, document.getElementById('app'));
</script>
