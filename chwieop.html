<style>
:root{--navy:#1B2A4A;--teal:#0E7C66;--orange:#e67e22;--line:#e2e8f0;--bg:#eef1f7;--card:#fff;--mute:#64748b;--txt:#1e293b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif;color:var(--txt);background:var(--bg)}
button{font-family:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;height:100dvh}
/* 상단 바 */
.top{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--navy);color:#fff;flex-shrink:0}
.top .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#1e40af,#7c6ce0);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.3px}
.top .sp{flex:1}
.top button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:7px 11px;font-size:12.5px;font-weight:600}
.top button.pri{background:var(--teal);border-color:var(--teal)}
.top button.warn{background:var(--orange);border-color:var(--orange)}
/* 본문: 좌 설정 / 우 미리보기 */
.body{flex:1;display:flex;min-height:0}
.panel{width:400px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:14px}
.preview{flex:1;overflow-y:auto;padding:26px 20px;background:#f1f5f9;display:flex;justify-content:center}
.paper{background:#fff;width:100%;max-width:820px;min-height:100%;padding:44px 52px;box-shadow:0 2px 18px rgba(0,0,0,.10);line-height:1.75;font-size:14px}
/* 설정 패널 */
.sec{font-size:12px;font-weight:800;color:var(--teal);margin:16px 0 8px;letter-spacing:.3px}
.sec:first-child{margin-top:0}
.fld{margin-bottom:9px}
.fld label{display:block;font-size:11.5px;color:var(--mute);font-weight:600;margin-bottom:3px}
.fld input,.fld select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;font-family:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chap{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;overflow:hidden}
.chaphd{display:flex;align-items:center;gap:8px;padding:9px 11px;background:#f8fafc;font-weight:700;font-size:13px}
.chaphd .cx{flex:1;cursor:pointer}
.chaphd .tog{font-size:11px;color:var(--mute)}
.arts{padding:2px 0}
.art{display:flex;align-items:flex-start;gap:8px;padding:7px 11px;border-top:1px solid #f1f5f9;font-size:12.5px}
.art input[type=checkbox]{margin-top:2px;width:15px;height:15px;flex-shrink:0}
.art .at{flex:1;min-width:0}
.art .an{font-weight:600;color:var(--txt)}
.art .req{font-size:10px;color:#b91c1c;font-weight:700;margin-left:4px}
.art .edit{font-size:11px;color:var(--teal);background:none;border:none;padding:2px 4px;font-weight:700;flex-shrink:0}
.art.off{opacity:.42}
/* 미리보기 문서 */
.paper .doc-title{text-align:center;font-size:24px;font-weight:800;letter-spacing:8px;margin:6px 0 4px}
.paper .doc-sub{text-align:center;font-size:14px;color:#334155;margin-bottom:30px}
.paper .ch{font-size:16px;font-weight:800;margin:26px 0 10px;padding-bottom:5px;border-bottom:2px solid var(--navy)}
.paper .ar{margin:0 0 13px}
.paper .ar .h{font-weight:700;margin-bottom:2px}
.paper .ar .b{white-space:pre-wrap;color:#1f2937}
.paper .mf{background:#fff7ed;border-bottom:1px dashed var(--orange);padding:0 2px;font-weight:700;color:#b45309}
.paper .foot{margin-top:40px;text-align:center;font-size:14px;line-height:2.2}
.paper .stamp{margin-top:26px;text-align:right;font-size:14px;line-height:2}
.empty{color:var(--mute);text-align:center;padding:60px 20px;font-size:13px;line-height:1.9}
.hint{font-size:11px;color:var(--mute);line-height:1.6;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:12px}
/* 조문 편집 모달 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:13px;width:640px;max-width:96vw;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.mhd{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.mhd b{flex:1;font-size:15px;color:var(--navy)}
.mhd button{background:none;border:none;font-size:19px;color:var(--mute)}
.mbd{padding:16px;overflow-y:auto}
.mbd input.ti{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-weight:600;margin-bottom:10px;font-family:inherit}
.mbd textarea{width:100%;min-height:230px;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;line-height:1.7;font-family:inherit;resize:vertical}
.mbd .mf-help{font-size:11.5px;color:var(--mute);margin-top:8px;line-height:1.7}
.mbd .mf-help code{background:#fff7ed;color:#b45309;padding:1px 5px;border-radius:4px;font-weight:700}
.mft{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.mft button{flex:1;padding:11px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:700}
.mft button.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
.mft button.rst{flex:0 0 auto;background:#fff;color:var(--mute)}
/* 불러오기 목록 */
#loadList .li{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px}
#loadList .li .nm{flex:1;font-weight:600;font-size:14px}
#loadList .li .dt{font-size:11px;color:var(--mute)}
#loadList .li button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600}
#loadList .li button.del{color:#b91c1c;border-color:#fecaca}
/* 토스트 */
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 18px;border-radius:9px;font-size:13.5px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 6px 22px rgba(0,0,0,.3)}
#toast.on{opacity:.96}
/* 모바일 */
.mtoggle{display:none}
@media(max-width:820px){
  .panel{width:100%;position:absolute;inset:44px 0 0;z-index:20}
  .body{position:relative}
  .preview{padding:12px 8px}
  .paper{padding:24px 20px;font-size:13px}
  .paper .doc-title{font-size:20px;letter-spacing:5px}
  .mtoggle{display:inline-block}
  body.showprev .panel{display:none}
  body:not(.showprev) .preview{display:none}
  .top h1{font-size:15px;white-space:nowrap}
  .top button{padding:7px 9px;font-size:15px}
  .top .lbl{display:none}
}
@media print{
  .top,.panel,.mtoggle,#homeBtn,#toast{display:none!important}
  .body,.app,.preview{display:block;height:auto;overflow:visible}
  .preview{padding:0;background:#fff}
  .paper{box-shadow:none;max-width:none;padding:0;font-size:12pt}
  .paper .mf{background:none;border:none;color:#000}
}
</style>
</head>
<body>
<div id="pu-boot-splash" style="position:fixed;inset:0;z-index:2147483000;background:#eef1f7;display:flex;align-items:center;justify-content:center">
  <div style="width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,#1e40af,#7c6ce0);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:21px">푸</div>

<div class="app">

    <div class="logo">규</div>
    <h1>취업규칙 작성기</h1>
    <div class="sp"></div>
    <button class="mtoggle" onclick="toggleView()">👁<span class="lbl"> 미리보기</span></button>
    <button onclick="newDoc()">＋<span class="lbl"> 새 문서</span></button>
    <button onclick="openLoad()">📂<span class="lbl"> 불러오기</span></button>
    <button class="pri" onclick="saveDoc()">💾<span class="lbl"> 저장</span></button>
    <button class="pri" onclick="exportHwpx()" title="한글 파일(.hwpx)로 저장 — A4 세로">📕<span class="lbl"> 한글</span></button>
    <button onclick="exportWord()">📄<span class="lbl"> 워드</span></button>
    <button class="warn" onclick="window.print()">🖨<span class="lbl"> 인쇄·PDF</span></button>
    <button onclick="sendToReview()" title="작성한 취업규칙을 규정관리로 넘겨 92항목 자동 검토">🔍<span class="lbl"> 검토로</span></button>
  </div>
  <div class="body">
    <div class="panel" id="panel"></div>
    <div class="preview"><div class="paper" id="paper"></div></div>
  </div>
</div>

<!-- 조문 편집 모달 -->
<div class="modal" id="editModal">
  <div class="mbox">
    <div class="mhd"><b id="emTitle">조문 편집</b><button onclick="closeEdit()">✕</button></div>
    <div class="mbd">
      <input class="ti" id="emArtTitle" placeholder="조 제목">
      <textarea id="emBody" placeholder="조문 내용"></textarea>
      <div class="mf-help">치환 항목(회사정보 입력 시 자동 반영):
        <code>{회사명}</code> <code>{대표자}</code> <code>{소재지}</code> <code>{업종}</code> <code>{상시근로자수}</code> <code>{시행일}</code> <code>{근로자대표}</code></div>
    </div>
    <div class="mft">
      <button class="rst" onclick="resetArt()">↺ 표준문구로</button>
      <button onclick="closeEdit()">취소</button>
      <button class="pri" onclick="saveEdit()">적용</button>
    </div>
  </div>
</div>

<!-- 불러오기 모달 -->
<div class="modal" id="loadModal">
  <div class="mbox">
    <div class="mhd"><b>저장된 취업규칙</b><button onclick="closeLoad()">✕</button></div>
    <div class="mbd"><div id="loadList"></div></div>
  </div>
</div>

<div id="toast"></div>

/* ── 현재 문서 상태 ── */
var doc = blankDoc();
function blankDoc(){
  return {
    id:'', info:{ company:'', ceo:'', addr:'', biz:'', workers:'', effDate:'', rep:'' },
    off:{},        /* {장id 또는 조id : true} = 제외 */
    over:{},       /* {조id : {t,b}} = 표준문구 수정 */
    updatedAt:0, by:''
  };
}

/* ── 유틸 ── */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('on'); },2000); }
function artOf(id){ for(var i=0;i<STD.length;i++){ var a=STD[i].arts.find(function(x){return x.id===id;}); if(a) return a; } return null; }
function chapOn(ch){ return !doc.off[ch.id]; }
function artOn(ch,a){ return !doc.off[ch.id] && !doc.off[a.id]; }
function curTitle(a){ return (doc.over[a.id]&&doc.over[a.id].t!=null)?doc.over[a.id].t:a.t; }
function curBody(a){ return (doc.over[a.id]&&doc.over[a.id].b!=null)?doc.over[a.id].b:a.b; }

/* ── 병합필드 치환 ── */
function mergeFields(){
  var i=doc.info;
  return {
    '{회사명}':i.company, '{대표자}':i.ceo, '{소재지}':i.addr, '{업종}':i.biz,
    '{상시근로자수}':i.workers, '{시행일}':fmtDate(i.effDate), '{근로자대표}':i.rep
  };
}
function fmtDate(v){ if(!v) return ''; var d=(''+v).split('-'); return d.length===3? (d[0]+'년 '+Number(d[1])+'월 '+Number(d[2])+'일') : v; }
/* 미리보기용: 빈 값은 노란 표시로, 채워진 값은 그대로 */
function applyMergeHtml(text){
  var mf=mergeFields(); var out=esc(text);
  Object.keys(mf).forEach(function(k){
    var v=mf[k];
    var rep = v ? esc(v) : '<span class="mf">'+esc(k)+'</span>';
    out = out.split(esc(k)).join(rep);
  });
  return out;
}
/* 내보내기용: 빈 값도 표시(괄호), 실제 텍스트 */
function applyMergeText(text){
  var mf=mergeFields(); var out=text;
  Object.keys(mf).forEach(function(k){ out=out.split(k).join(mf[k]|| k); });
  return out;
}

    h+='<div class="chaphd"><input type="checkbox" '+(con?'checked':'')+' onchange="toggleChap(\''+ch.id+'\',this.checked)" style="width:16px;height:16px">';
    h+='<span class="cx" onclick="toggleChap(\''+ch.id+'\','+(!con)+')">'+esc(ch.c)+'</span>';
    h+='<span class="tog">'+ch.arts.filter(function(a){return artOn(ch,a);}).length+'/'+ch.arts.length+'</span></div>';
    h+='<div class="arts">';
    ch.arts.forEach(function(a){
      var on=artOn(ch,a); var edited=!!doc.over[a.id];
      h+='<div class="art'+(on?'':' off')+'">';
      h+='<input type="checkbox" '+(on?'checked':'')+(con?'':' disabled')+' onchange="toggleArt(\''+a.id+'\',this.checked)">';
      h+='<div class="at"><div class="an">'+esc(curTitle(a))+(a.req?'<span class="req">필수</span>':'')+(edited?' <span style="font-size:10px;color:#0E7C66;font-weight:700">✎수정됨</span>':'')+'</div></div>';
      h+='<button class="edit" onclick="openEdit(\''+a.id+'\')">✎ 편집</button>';
      h+='</div>';
    });
    h+='</div></div>';
  });
  $('panel').innerHTML=h;
}
function fld(label,key,val,ph){ return '<div class="fld"><label>'+label+'</label><input value="'+esc(val)+'" placeholder="'+esc(ph||'')+'" oninput="setInfo(\''+key+'\',this.value)"></div>'; }
function fldDate(label,key,val){ return '<div class="fld"><label>'+label+'</label><input type="date" value="'+esc(val)+'" oninput="setInfo(\''+key+'\',this.value)"></div>'; }
function countOn(){ var n=0; STD.forEach(function(ch){ ch.arts.forEach(function(a){ if(artOn(ch,a)) n++; }); }); return n; }

function setInfo(k,v){ doc.info[k]=v; renderPaper(); }
function toggleChap(id,on){ if(on) delete doc.off[id]; else doc.off[id]=true; renderAll(); }
function toggleArt(id,on){ if(on) delete doc.off[id]; else doc.off[id]=true; renderAll(); }
function renderAll(){ renderPanel(); renderPaper(); }

/* ══════ 미리보기(문서) 렌더 ══════ */
function renderPaper(){
  var p=$('paper');
  if(countOn()===0){ p.innerHTML='<div class="empty">포함할 조항이 없습니다.<br>왼쪽에서 장·조를 선택하세요.</div>'; return; }
  var h='';
  h+='<div class="doc-title">취 업 규 칙</div>';
  h+='<div class="doc-sub">'+(doc.info.company?applyMergeHtml('{회사명}'):'<span class="mf">{회사명}</span>')+'</div>';
  var artNo=0;
  STD.forEach(function(ch){
    if(!chapOn(ch)) return;
    var onArts=ch.arts.filter(function(a){return artOn(ch,a);});
    if(!onArts.length) return;
    if(ch.c==='부칙'){ h+='<div class="ch" style="border-bottom-color:#64748b">부      칙</div>'; }
    else h+='<div class="ch">'+esc(ch.c)+'</div>';
    onArts.forEach(function(a){
      artNo++;
      h+='<div class="ar"><div class="h">제'+artNo+'조 ('+applyMergeHtml(curTitle(a))+')</div>';
      h+='<div class="b">'+applyMergeHtml(curBody(a))+'</div></div>';
    });
  });
  /* 제정/시행 서명부 */
  h+='<div class="stamp">'+(doc.info.effDate?applyMergeHtml('{시행일} 제정'):'<span class="mf">{시행일}</span> 제정')+'<br>';
  h+=(doc.info.company?applyMergeHtml('{회사명}'):'<span class="mf">{회사명}</span>')+'  대표 '+(doc.info.ceo?applyMergeHtml('{대표자}'):'<span class="mf">{대표자}</span>')+' (인)</div>';
  p.innerHTML=h;
}

/* ══════ 조문 편집 모달 ══════ */
var editingId=null;
function openEdit(id){ editingId=id; var a=artOf(id); if(!a) return;
  $('emTitle').textContent='조문 편집 — '+a.t;
  $('emArtTitle').value=curTitle(a);
  $('emBody').value=curBody(a);
  $('editModal').classList.add('on');
}
function closeEdit(){ $('editModal').classList.remove('on'); editingId=null; }
function saveEdit(){ if(!editingId) return; var a=artOf(editingId);
  var t=$('emArtTitle').value, b=$('emBody').value;
  if(t===a.t && b===a.b) delete doc.over[editingId];
  else doc.over[editingId]={t:t,b:b};
  closeEdit(); renderAll(); toast('조문을 적용했습니다');
}
function resetArt(){ if(!editingId) return; var a=artOf(editingId); $('emArtTitle').value=a.t; $('emBody').value=a.b; }

/* ══════ 뷰 토글(모바일) ══════ */
function toggleView(){ document.body.classList.toggle('showprev');
  var b=document.querySelector('.mtoggle'); if(!b) return;
  b.innerHTML=document.body.classList.contains('showprev')?'✎<span class="lbl"> 편집</span>':'👁<span class="lbl"> 미리보기</span>';
}

/* ══════ 새 문서 ══════ */
function newDoc(){ if(doc.info.company && !confirm('현재 작성 중인 내용을 지우고 새 문서를 시작할까요?')) return;
  doc=blankDoc(); renderAll(); document.body.classList.remove('showprev'); toast('새 문서를 시작합니다');
}

/* ══════ 저장 / 불러오기 (Firebase, 로컬 폴백) ══════ */
function docStore(){ return fbDb ? 'fb' : 'local'; }
function saveDoc(){
  if(!doc.info.company){ toast('회사명을 먼저 입력하세요'); return; }
  doc.updatedAt=Date.now(); doc.by=(fbUser&&fbUser.email)||'';
  if(!doc.id) doc.id='r'+doc.updatedAt+Math.floor(Math.random()*1000);
  if(fbDb){
    fbDb.ref(DB_ROOT+'/docs/'+doc.id).set(doc).then(function(){ toast('💾 클라우드에 저장했습니다'); })
      .catch(function(e){ toast('저장 실패: '+((e&&e.message)||e)); });
  } else {
    var all=lsDocs(); all[doc.id]=doc; localStorage.setItem('chwieop_docs',JSON.stringify(all)); toast('💾 이 기기에 저장했습니다');
  }
}
function lsDocs(){ try{ return JSON.parse(localStorage.getItem('chwieop_docs')||'{}'); }catch(e){ return {}; } }
function openLoad(){
  $('loadModal').classList.add('on'); var box=$('loadList'); box.innerHTML='<div class="empty">불러오는 중…</div>';
  function draw(map){
    var arr=Object.keys(map).map(function(k){return map[k];}).filter(Boolean).sort(function(a,b){return (b.updatedAt||0)-(a.updatedAt||0);});
    if(!arr.length){ box.innerHTML='<div class="empty">저장된 취업규칙이 없습니다.</div>'; return; }
    box.innerHTML=arr.map(function(d){
      return '<div class="li"><div style="flex:1"><div class="nm">'+esc((d.info&&d.info.company)||'(회사명 없음)')+'</div>'
        +'<div class="dt">'+(d.updatedAt?new Date(d.updatedAt).toLocaleString('ko-KR'):'')+(d.by?' · '+esc(d.by):'')+'</div></div>'
        +'<button onclick="loadDoc(\''+d.id+'\')">열기</button>'
        +'<button class="del" onclick="delDoc(\''+d.id+'\')">삭제</button></div>';
    }).join('');
  }
  if(fbDb){ fbDb.ref(DB_ROOT+'/docs').once('value').then(function(s){ draw(s.val()||{}); }).catch(function(){ draw({}); }); }
  else draw(lsDocs());
}
function closeLoad(){ $('loadModal').classList.remove('on'); }
function loadDoc(id){
  function apply(d){ if(!d){ toast('문서를 찾을 수 없습니다'); return; }
    doc=Object.assign(blankDoc(),d); doc.info=Object.assign(blankDoc().info,d.info||{}); doc.off=d.off||{}; doc.over=d.over||{};
    closeLoad(); renderAll(); toast('문서를 불러왔습니다'); }
  if(fbDb) fbDb.ref(DB_ROOT+'/docs/'+id).once('value').then(function(s){ apply(s.val()); });
  else apply(lsDocs()[id]);
}
function delDoc(id){ if(!confirm('이 취업규칙을 삭제할까요?')) return;
  if(fbDb) fbDb.ref(DB_ROOT+'/docs/'+id).remove().then(function(){ openLoad(); toast('삭제했습니다'); });
  else { var all=lsDocs(); delete all[id]; localStorage.setItem('chwieop_docs',JSON.stringify(all)); openLoad(); toast('삭제했습니다'); }
}

/* ══════ 한글(.hwpx) 내보내기 — A4 세로 기준. 규정관리(rules.html)와 같은 생성기 사용 ══════ */
function exportHwpx(){
  if(countOn()===0){ toast('포함할 조항이 없습니다'); return; }
  if(!window.HWPX){ toast('한글 생성기를 불러오지 못했습니다 — 워드로 저장하세요'); return; }
  try{
    var H=window.HWPX; H.setPage({landscape:false});           // 취업규칙 전문은 A4 세로
    var co=doc.info.company||'';
    var body=H.para('취 업 규 칙',H.BOLD)+H.para(co)+H.para('');
    var artNo=0;
    STD.forEach(function(ch){ if(!chapOn(ch))return;
      var onArts=ch.arts.filter(function(a){return artOn(ch,a);}); if(!onArts.length)return;
      body+=H.para(ch.c==='부칙'?'부      칙':ch.c,H.BOLD)+H.para('');
      onArts.forEach(function(a){ artNo++;
        body+=H.para('제'+artNo+'조 ('+applyMergeText(curTitle(a))+') '+applyMergeText(curBody(a)))+H.para('');
      });
    });
    body+=H.para('')+H.para(applyMergeText('{시행일}')+' 제정')+H.para(co+'  대표 '+(doc.info.ceo||'')+' (인)');
    var safe=String(co||'회사').replace(/[()\s—📄🏢\/\\:*?"<>|]/gu,'');
    H.download(body,'취업규칙_'+safe+'.hwpx');
    toast('📕 한글 파일을 내려받았습니다 (A4 세로)');
  }catch(e){ console.warn('hwpx 생성 실패:',e); toast('한글 생성 실패 — 워드로 저장하세요'); }
}
/* ══════ 규정관리(검토)로 넘기기 — 작성한 취업규칙을 92항목 자동 검토에 태운다 ══════ */
function sendToReview(){
  if(countOn()===0){ toast('포함할 조항이 없습니다'); return; }
  var co=doc.info.company||'';
  var txt='취 업 규 칙\n'+co+'\n\n';
  var artNo=0;
  STD.forEach(function(ch){ if(!chapOn(ch))return;
    var onArts=ch.arts.filter(function(a){return artOn(ch,a);}); if(!onArts.length)return;
    txt+=(ch.c==='부칙'?'부      칙':ch.c)+'\n';
    onArts.forEach(function(a){ artNo++;
      txt+='제'+artNo+'조('+applyMergeText(curTitle(a))+') '+applyMergeText(curBody(a))+'\n';
    });
    txt+='\n';
  });
  try{
    localStorage.setItem('pureun_rules_handoff_v1',JSON.stringify({
      name:'취업규칙_'+(co||'작성본')+'.txt', site:co, text:txt, at:new Date().toISOString()
    }));
    toast('규정관리로 넘깁니다 — 자동 검토가 실행됩니다');
    setTimeout(function(){ location.href='rules.html'; },600);
  }catch(e){ toast('넘기기 실패: '+(e.message||e)); }
}
/* ══════ 워드(.doc) 내보내기 ══════ */
function exportWord(){
  if(countOn()===0){ toast('포함할 조항이 없습니다'); return; }
  var body='';
  body+='<h1 style="text-align:center;letter-spacing:8px">취 업 규 칙</h1>';
  body+='<p style="text-align:center;font-size:14pt">'+esc(doc.info.company||'')+'</p><br>';
  var artNo=0;
  STD.forEach(function(ch){ if(!chapOn(ch)) return;
    var onArts=ch.arts.filter(function(a){return artOn(ch,a);}); if(!onArts.length) return;
    body+='<h2 style="border-bottom:2px solid #1B2A4A;padding-bottom:4px">'+esc(ch.c==='부칙'?'부      칙':ch.c)+'</h2>';
    onArts.forEach(function(a){ artNo++;
      body+='<p style="margin:8px 0"><b>제'+artNo+'조 ('+esc(applyMergeText(curTitle(a)))+')</b><br>'
        + esc(applyMergeText(curBody(a))).replace(/\n/g,'<br>')+'</p>';
    });
  });
  body+='<br><p style="text-align:right">'+esc(applyMergeText('{시행일}'))+' 제정<br>'+esc(doc.info.company||'')+'  대표 '+esc(doc.info.ceo||'')+' (인)</p>';
  var html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:"Malgun Gothic";font-size:11pt;line-height:1.7}h1{font-size:20pt}h2{font-size:13pt;margin-top:18pt}</style></head><body>'+body+'</body></html>';
  var blob=new Blob([html],{type:'application/msword'});   /* BOM 제거 — 붙이면 워드가 서식을 인식하지 못함 */
  var url=URL.createObjectURL(blob); var a=document.createElement('a');
  a.href=url; a.download='취업규칙_'+(doc.info.company||'회사')+'.doc'; document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },500);
  toast('📄 워드 파일을 내려받았습니다');
}

/* ══════ 통합 로그인(공유 SSO) ══════ */
function _rmSplash(){ var b=$('pu-boot-splash'); if(b) b.remove(); }
function authGate(){
  _rmSplash();
  var g=$('authGate'); if(!g){ g=document.createElement('div'); g.id='authGate';
    g.style.cssText='position:fixed;inset:0;z-index:99999;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px';
    g.innerHTML='<div><div style="font-size:52px;margin-bottom:14px">🔒</div><div style="font-size:18px;font-weight:700;color:#1B2A4A;margin-bottom:8px">통합시스템 로그인이 필요합니다</div><div style="font-size:13px;color:#667;line-height:1.7;margin-bottom:20px">푸른 통합시스템에서 로그인한 뒤 이용하세요.</div><a href="enter.html" style="display:inline-block;text-decoration:none;background:#0E7C66;color:#fff;padding:11px 24px;border-radius:8px;font-size:14px;font-weight:600">🏠 통합시스템으로 이동</a></div>';
    document.body.appendChild(g);
  } g.style.display='flex';
}
function authOk(){ _rmSplash(); var g=$('authGate'); if(g) g.style.display='none'; }
function fbInit(){
  if(location.protocol==='file:'){ _rmSplash(); return; }  /* 로컬 파일: 오프라인 편집 허용 */
  if(typeof firebase==='undefined'||!firebase.initializeApp){ _rmSplash(); return; }
  try{
    if(!firebase.apps||!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    if(FB_APPCHECK_KEY && firebase.appCheck){ try{ firebase.appCheck().activate(new firebase.appCheck.ReCaptchaV3Provider(FB_APPCHECK_KEY),true); }catch(e){} }
    try{ if(firebase.auth().setPersistence) firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
    firebase.auth().onAuthStateChanged(function(u){
      if(u && u.email){ fbUser=u; fbDb=firebase.database(); authOk(); }
      else authGate();
    });
  }catch(e){ _rmSplash(); }
}

/* ── 초기화 ── */
renderAll();
fbInit();
</script>
