<!DOCTYPE html>
<html lang="ko">

<style>
:root{ --blue:#1e40af; --ink:#101828; --sub:#5a6885; --line:#e4e8f0; --bg:#f4f6fb; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%}

/* 상단바 */
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:#101010;color:#fff}
#top .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
#top .mark{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:var(--blue);font-size:13px}
#top .who{margin-left:auto;font-size:12px;opacity:.8}
/* ⚙️ 초기값은 반드시 숨김이다. 로그아웃 상태에서 점검을 누르면 권한 거부가 나고
   화면이 "규칙이 없다"고 오보고한다 — 규칙이 정상인데 규칙을 고치게 만든다.
   보임을 초기값으로 두면 앱이 뜨는 순간 잠깐 눌릴 수 있으니, 스크립트가
   로그인을 확인한 뒤에만 켠다. */
#top .ico{display:none;background:none;border:none;color:#fff;font-size:18px;padding:4px}

/* 로그인 안내 */
#login{display:none;flex:1;align-items:center;justify-content:center;padding:24px}
#login .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 22px;text-align:center;max-width:340px}
#login .m{width:52px;height:52px;margin:0 auto 14px;border-radius:14px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
#login h1{font-size:19px;margin:0 0 8px}
#login p{font-size:13.5px;color:var(--sub);line-height:1.6;margin:0 0 18px}
#login a{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;border-radius:10px;padding:11px 18px;font-weight:700;font-size:14px}

/* 홈 — 올리기 버튼 + 올리는 중 목록 + 날짜별 격자 */
#home{display:none;flex:1;flex-direction:column;padding:14px;overflow-y:auto;max-width:560px;width:100%;margin:0 auto}
#home .pri{width:100%;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;background:var(--blue);color:#fff}
#home .sec{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;font-weight:600;background:#fff;color:var(--ink);margin-top:8px}
#home .sec.doc{border-color:#b6c6ee}
#home .sec .hq{font-size:12px;font-weight:600;color:var(--sub)}
#home .dochint{margin:5px 2px 0;font-size:11.5px;line-height:1.5;color:#8a94a6}
.tag{font-size:10.5px;font-weight:700;background:#e8eefc;color:#1e40af;padding:1px 6px;border-radius:5px;margin-left:5px}
#grid .cell .tag{position:absolute;left:4px;top:4px;margin:0;background:var(--blue);color:#fff}
#grid .cell{position:relative}

#upWrap{margin-top:16px}
#upWrap .cap{font-size:12px;color:var(--sub);margin-bottom:6px}
#upList{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.uprow{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:12.5px;border-bottom:1px solid var(--line)}
.uprow:last-child{border-bottom:none}
.uprow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uprow .st{flex-shrink:0;font-weight:600}
.uprow.s-wait .st{color:var(--sub)}
.uprow.s-up .st{color:var(--blue)}
.uprow.s-retry .st{color:#b45309}
.uprow.s-fail .st{color:#b91c1c}
.uprow.s-done .st{color:#15803d}
.uprow{flex-wrap:wrap}
.uprow .er{width:100%;font-size:11px;color:#8a94a6;margin-top:2px;word-break:break-all}
.uprow .rd{width:100%;font-size:11.5px;margin-top:3px;color:var(--sub)}
.uprow .rd.ok{color:#15803d}
.uprow .rd.warn{color:#b45309}

#grid{margin-top:4px}
#grid .day{display:flex;align-items:baseline;gap:8px;margin:16px 0 8px}
#grid .day b{font-size:13px}
#grid .day span{font-size:12px;color:var(--sub)}
#grid .cells{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#grid .cell{aspect-ratio:1;border-radius:8px;background:#e7ebf3;overflow:hidden}
#grid .cell img{width:100%;height:100%;object-fit:cover;display:block}

#empty{display:none;flex:1;align-items:center;justify-content:center;padding:40px 0}
#empty .in{text-align:center;color:var(--sub)}
#empty .ic{font-size:44px;margin-bottom:10px}
#empty p{font-size:14px;margin:0}

/* 크게 보기 */
#viewer{display:none;position:fixed;inset:0;background:rgba(8,10,16,.96);z-index:30;flex-direction:column}
#viewer .bar{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;color:#fff}
#viewer .bar span{font-size:12.5px;opacity:.85}
#viewer .bar button{background:none;border:none;color:#fff;font-size:14px;font-weight:700;padding:6px}
#viewer img{flex:1;min-height:0;width:100%;object-fit:contain;cursor:zoom-out}
#viewer .hint{text-align:center;color:#fff;font-size:12px;opacity:.6;padding:10px 0 calc(env(safe-area-inset-bottom) + 12px)}

/* 크게 보기 안 — 서류 판독 결과 */
#readPanel{margin:10px 12px 0;max-width:520px;align-self:center;width:100%}
#readPanel:empty{display:none}
#readPanel .box{background:#141a26;border:1px solid #232c3d;border-radius:10px;padding:12px}
#readPanel .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
#readPanel .kd{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;background:#123524;color:#5dcaa5}
#readPanel .kd.warn{background:#3a2a10;color:#f0b95b}
#readPanel .msg{font-size:11.5px;color:#5dcaa5}
#readPanel .msg.warn{color:#f0b95b}
#readPanel table{width:100%;font-size:12px;color:#c8cfdc;border-collapse:collapse}
#readPanel td{padding:2px 0;vertical-align:top}
#readPanel td.k{color:#7d879b;width:88px}
#readPanel .note{margin:8px 0 0;font-size:11px;color:#7d879b;line-height:1.5}
#readPanel .cause{margin:0;font-size:11.5px;color:#f0b95b;line-height:1.6;white-space:pre-wrap;word-break:break-word;font-family:inherit;user-select:text}
#readPanel .again{width:100%;margin-top:8px;background:transparent;color:#c8cfdc;border:1px solid #2c374b;border-radius:9px;padding:9px;font-size:12.5px;font-weight:600}
#readPanel .again.send{background:#1e40af;color:#fff;border-color:#1e40af}
#readPanel .sent{margin:8px 0 0;font-size:12px;color:#5dcaa5;line-height:1.5}

/* 설정 시트 */
#settings{display:none;position:fixed;inset:0;background:rgba(16,24,40,.45);align-items:flex-end;justify-content:center;z-index:20}
#settings .sheet{background:#fff;width:100%;max-width:460px;border-radius:16px 16px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px)}
#settings h2{font-size:16px;margin:0 0 14px}
#settings .row{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--line)}
#settings button{width:100%;margin-top:12px;border:none;border-radius:10px;padding:12px;font-weight:700;font-size:14px;background:var(--blue);color:#fff}
#settings button.close{background:#eef1f6;color:var(--ink)}
#probeOut{margin:12px 0 0;font-size:12.5px;line-height:1.6;white-space:pre-wrap;background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:12px;min-height:20px}
#probeOut:empty{display:none}
</style>
</head>
<body>

<div id="app">
  <div id="top">
    <div class="brand"><span class="mark">푸</span> 푸른사진첩</div>
    <span class="who" id="who"></span>
    <button class="ico" id="gear" title="설정" onclick="openSettings()">⚙️</button>
  </div>

  <!-- 로그인 안내 -->
  <div id="login">
    <div class="card">
      <div class="m">푸</div>
      <h1>푸른사진첩</h1>
      <p>푸른노무법인 앱은 통합 포털에서 로그인합니다.<br>로그인하면 사진첩으로 연결됩니다.</p>
      <a href="enter.html">포털에서 로그인 →</a>
    </div>
  </div>

  <!-- 홈 -->
  <div id="home">
    <button class="pri" id="pickBtn">📷 사진 고르기</button>
    <button class="sec doc" id="docBtn">📄 서류 고르기 <span class="hq">고화질</span></button>
    <p class="dochint">명함 · 사업자등록증 · 중소기업확인서처럼 글씨를 읽어야 하는 것</p>
    <button class="sec" id="camBtn">카메라로 바로 찍기</button>
    <input type="file" id="pickInput" accept="image/*" multiple hidden>
    <input type="file" id="docInput" accept="image/*" multiple hidden>
    <input type="file" id="camInput" accept="image/*" capture="environment" hidden>

    <div id="upWrap" style="display:none">
      <div class="cap">올리는 중</div>
      <div id="upList"></div>
    </div>

    <div id="grid"></div>

    <div id="empty">
      <div class="in">
        <div class="ic">🖼️</div>
        <p>아직 올린 사진이 없습니다.</p>
      </div>
    </div>
  </div>

  <!-- 크게 보기 — 격자를 누르면 저장된 축소본(1600px) 원판을 보여준다 -->
  <div id="viewer">
    <div class="bar"><span id="viewerInfo"></span><button onclick="closeViewer()">닫기 ✕</button></div>
    <img id="viewerImg" alt="" onclick="closeViewer()">
    <div id="readPanel"></div>
    <div class="hint" id="viewerHint"></div>
  </div>

  <!-- 설정 -->
  <div id="settings">
    <div class="sheet">
      <h2>설정</h2>
      <div class="row"><span>저장 방식</span><b id="modeText">-</b></div>
      <button onclick="runProbe()">파일 창고 점검</button>
      <pre id="probeOut"></pre>
      <button class="close" onclick="closeSettings()">닫기</button>
    </div>
  </div>
</div>

<script>
/* ══════ 설정 (다른 앱과 같은 파이어베이스 프로젝트) ══════ */
const FB_APPCHECK_KEY = '6Ldu1hEtAAAAABB9lH9EMEyd7uBLEy9H5HxJoua_';
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyDkZz5QlKSoqMOYByp5YGeMNLNDrIghliA',
  databaseURL: 'https://pureun-erp-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'pureun-erp',
  storageBucket: 'pureun-erp.firebasestorage.app',
  appId: '1:936817166182:web:9bd31f70d0afdf5fca2aa7',
  messagingSenderId: '936817166182'
};

const $ = id => document.getElementById(id);

/* 바깥에서 온 문자열(파일 이름 등)을 화면에 넣기 전에 이스케이프한다. */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* DB에서 온 미리보기를 img src 에 꽂기 전 검사 — 사진 데이터만 통과시킨다. */
function safeSrc(t) {
  return typeof t === 'string' && /^data:image\//.test(t) ? t : null;
}

let db = null, store = null;

/* ══════ 시작 ══════ */
firebase.initializeApp(FIREBASE_CONFIG);
try { if (firebase.appCheck) firebase.appCheck().activate(new firebase.appCheck.ReCaptchaV3Provider(FB_APPCHECK_KEY), true); }
catch (e) { console.warn('[AppCheck]', e && e.message); }

db = firebase.database();
/* 파일 창고는 요금제 문제로 못 쓴다(2026-08-02 점검). 점검 화면을 위해서만 연결한다. */
try { store = firebase.storage(); } catch (e) { store = null; }

/* 저장 방식은 저장 층이 정한다. 앱은 어디에 담기는지 모른다. */
PuPhotoStore.init({ db: db, storage: store });

/* 서류 판독 — AI 키가 어디 있는지도 판독 층이 안다(앱마다 복사하면 갈린다). */
PuDocRead.init(Object.assign(
  { fetch: window.fetch.bind(window) },
  PuDocRead.keysFrom(db)
));
/* 명함첩으로 보내는 일은 등록 층이 안다 — 이 화면은 명함첩 구조를 모른다. */
PuDocFile.init({ db: db });

firebase.auth().onAuthStateChanged(u => {
  const signedIn = !!(u && u.email);
  $('who').textContent = signedIn ? (u.displayName || u.email) : '';
  $('login').style.display = signedIn ? 'none' : 'flex';
  $('home').style.display = signedIn ? 'flex' : 'none';
  /* ⚙️(설정·창고 점검)는 로그인한 뒤에만 보인다.
     로그아웃 상태로 점검하면 권한 거부가 나서 "규칙 문제"로 잘못 보고된다. */
  $('gear').style.display = signedIn ? 'inline-flex' : 'none';
  if (signedIn) { initQueue(); loadGrid(); }
});

/* ══════ 업로드 대기열 ══════
   사진은 먼저 이 기기(IndexedDB)에 담고, 클라우드에 올라간 뒤에만 지운다.
   그래서 신호가 약한 현장에서 올려도 사진을 잃지 않는다. */
let queue = null;
let queueStarted = false;

function openQueueIdb() {
  return new Promise(function (res, rej) {
    const rq = indexedDB.open('puPhotosQueue', 1);
    rq.onupgradeneeded = function () { rq.result.createObjectStore('jobs', { keyPath: 'id' }); };
    rq.onsuccess = function () { res(rq.result); };
    rq.onerror = function () { rej(rq.error); };
  });
}

function idbAdapter(dbi) {
  function tx(mode, fn) {
    return new Promise(function (res, rej) {
      const t = dbi.transaction('jobs', mode);
      const out = fn(t.objectStore('jobs'));
      t.oncomplete = function () { res(out && out.result); };
      t.onerror = function () { rej(t.error); };
      t.onabort = function () { rej(t.error); };
    });
  }
  return {
    all: function () { return tx('readonly', function (st) { return st.getAll(); }); },
    put: function (j) { return tx('readwrite', function (st) { st.put(j); }); },
    del: function (id) { return tx('readwrite', function (st) { st.delete(id); }); }
  };
}

function initQueue() {
  if (queueStarted) return;
  queueStarted = true;
  openQueueIdb().then(function (dbi) {
    queue = PuPhotoQueue.create({
      save: PuPhotoStore.savePhoto,   // 쓰기는 저장 층으로만 나간다
      idb: idbAdapter(dbi),
      onChange: onQueueChange,
      /* 권한 거절은 재시도해도 소용없다 — "신호 약함"으로 오보고하지 않는다. */
      isFatal: function (e) { return /permission[ _-]?denied/i.test((e && (e.message || e.code)) || ''); }
    });
    return queue.resume();            // 지난번에 못 올라간 사진을 이어서
  }).catch(function (e) {
    console.warn('[대기열]', e);
    queueStarted = false;
  });
}

/* 신호가 돌아오면 기다리는 시간 없이 바로 다시 시도한다. */
window.addEventListener('online', function () { if (queue) queue.retryNow(); });

/* ══════ 사진 고르기 → 축소 → 대기열 ══════ */
$('pickBtn').onclick = function () { $('pickInput').click(); };
$('docBtn').onclick = function () { $('docInput').click(); };
$('camBtn').onclick = function () { $('camInput').click(); };
$('pickInput').onchange = function () { addFiles(this.files, false); this.value = ''; };
$('docInput').onchange = function () { addFiles(this.files, true); this.value = ''; };
$('camInput').onchange = function () { addFiles(this.files, false); this.value = ''; };

/* isDoc: 「서류 고르기」로 넣은 것 — 글씨를 읽어야 하므로 더 크고 좋은 화질로 담는다. */
async function addFiles(fileList, isDoc) {
  const files = Array.from(fileList || []);
  const u = firebase.auth().currentUser;
  if (!files.length || !u || !queue) return;
  const spec = PuPhotoStore.uploadSpec(isDoc); // 크기 기준은 저장 층이 정한다
  for (const f of files) {
    try {
      /* 촬영 시각: EXIF → 파일 날짜 → 지금. 판단은 저장 층의 함수가 한다.
         EXIF를 못 읽는 상황(오래된 브라우저 등)이어도 올리기는 계속돼야 하므로
         읽기 실패는 null 로 넘긴다 — 그러면 파일 날짜로 정해진다. */
      const buf = await readFileBytes(f).catch(() => null);
      const takenAt = PuPhotoStore.pickTakenAt(buf ? PuPhotoStore.exifTakenAt(buf) : null, f.lastModified, Date.now());
      /* 축소본(서류 2560px·사진 1600px)과 격자용 미리보기 —
         카메라 원본은 클라우드에 안 올라간다. */
      const full = await shrink(f, spec.maxEdge, spec.quality);
      const thumb = await shrink(f, spec.thumbEdge, 0.85);
      await queue.enqueue({
        id: PuPhotoStore.newId(),
        name: f.name || '사진',
        takenAt: takenAt,
        kind: isDoc ? 'doc' : 'photo',
        full: full.dataUrl,
        thumb: thumb.dataUrl,
        meta: {
          takenAt: takenAt,
          upAt: Date.now(),
          by: u.uid,
          byName: u.displayName || u.email || '',
          kind: isDoc ? 'doc' : 'photo',
          w: full.w, h: full.h,
          size: full.dataUrl.length
        }
      });
    } catch (e) {
      console.warn('[사진 준비]', e);
      alert('사진 하나를 읽지 못했습니다: ' + (f.name || '') + '\n' + ((e && e.message) || e));
    }
  }
}

/* 파일 내용을 바이트로 읽는다. 최신 방법(arrayBuffer)이 없는 브라우저는
   FileReader 로 돌아간다 — 폰의 앱 내장 브라우저가 종종 그렇다. */
function readFileBytes(f) {
  if (f.arrayBuffer) return f.arrayBuffer();
  return new Promise(function (res, rej) {
    const r = new FileReader();
    r.onload = function () { res(r.result); };
    r.onerror = function () { rej(r.error || new Error('파일을 읽지 못했습니다')); };
    r.readAsArrayBuffer(f);
  });
}

/* 사진을 그림 객체로 연다. 빠른 길(createImageBitmap)이 안 되는 브라우저는
   <img> 로 여는 예비 통로로 돌아간다 — 어느 쪽이든 canvas 에 그릴 수 있다. */
function decodeImage(file) {
  if (window.createImageBitmap) {
    return createImageBitmap(file, { imageOrientation: 'from-image' })
      .catch(function () { return createImageBitmap(file); }) // 옵션을 모르는 브라우저
      .catch(function () { return decodeViaImg(file); });     // 함수는 있는데 파일을 거부
  }
  return decodeViaImg(file);
}

function decodeViaImg(file) {
  return new Promise(function (res, rej) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function () { URL.revokeObjectURL(url); res(img); };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      rej(new Error('이 형식의 사진은 열 수 없습니다 (지원: JPG·PNG 등 일반 사진)'));
    };
    img.src = url;
  });
}

/* 사진을 긴 변 maxEdge 로 줄여 JPEG dataURL 로 만든다.
   회전 정보(EXIF orientation)는 브라우저가 그림을 읽을 때 반영한다.
   quality: 서류는 글씨를 읽어야 해서 사진보다 높다(저장 층의 uploadSpec 참고). */
function shrink(file, maxEdge, quality) {
  return decodeImage(file).then(function (im) {
    const iw = im.naturalWidth || im.width;
    const ih = im.naturalHeight || im.height;
    const scale = Math.min(1, maxEdge / Math.max(iw, ih));
    const w = Math.max(1, Math.round(iw * scale));
    const h = Math.max(1, Math.round(ih * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(im, 0, 0, w, h);
    if (im.close) im.close();
    return { dataUrl: c.toDataURL('image/jpeg', quality || 0.85), w: w, h: h };
  });
}

/* ══════ 올리는 중 목록 ══════ */
const UP_HIDE_MS = 3000; // 완료된 줄이 목록에서 내려가기까지
const UP_STATE = { wait: '대기', up: '올리는 중', retry: '신호 약함 — 자동 재시도', fail: '막힘 — 권한이 없습니다', done: '완료 ✓' };
let upJobs = [];

function onQueueChange(list) {
  upJobs = list;
  let scheduled = false;
  list.forEach(function (j) {
    if (j.state === 'done' && !j._hideAt) {
      j._hideAt = Date.now() + UP_HIDE_MS;
      addToGrid(j);               // 방금 올라간 사진을 격자 맨 앞에 (다시 받지 않고)
      if (j.kind === 'doc') startRead(j);   // 서류만 판독한다(현장사진은 읽을 것이 없다)
      scheduled = true;
    }
  });
  renderUp();
  if (scheduled) setTimeout(renderUp, UP_HIDE_MS + 100);
}

/* ══════ 서류 판독 ══════
   올라간 서류를 AI로 읽어 종류·항목을 알아내고, 사업자등록번호는 기계로 검증한다.
   결과는 사진 정보 아래 'read' 칸에만 적는다 — 아직 각 앱에 등록하지는 않는다.
   판독이 실패해도 사진은 이미 안전하게 올라가 있다(판독은 덧붙이는 일이다). */
const READ_LABEL = { card: '명함', bizreg: '사업자등록증', sme: '중소기업확인서', other: '서류로 보이지 않음' };

/* 딱지 문구. **판독 실패와 "정말 서류가 아닌 것"은 다른 일이다.**
   실사용 보고(2026-08-03): 사업자등록증이 맞는데 AI가 답을 못 준 것을
   '서류로 보이지 않음'이라고 표시했다 — 사실이 아닌 안내였다.
   실패했으면 실패라고 말해야 사용자가 다시 시도할 생각을 한다. */
function readLabel(read) {
  if (!read) return '';
  if (read.error) return '판독 실패';
  return READ_LABEL[read.kind] || '알 수 없음';
}

function startRead(job) {
  const year = PuPhotoStore.yearOf(job.takenAt);
  job._reading = true;
  renderUp();
  PuDocRead.read(job.full).then(function (r) {
    const v = PuDocRead.autoOk(r);
    const read = {
      kind: r.kind, fields: r.fields, bizNoOk: r.bizNoOk,
      ntsChecked: r.ntsChecked, ntsState: r.ntsState,
      auto: v.auto, why: v.why, error: r.error, at: Date.now()
    };
    job._reading = false;
    job._read = read;
    /* 격자·크게 보기가 같은 결과를 보게 메모리에도 얹는다(다시 받지 않는다). */
    const it = gridItems.find(function (x) { return x.id === job.id; });
    if (it) it.meta = Object.assign({}, it.meta, { read: read });
    renderUp();
    return PuPhotoStore.saveRead(year, job.id, read).then(function () {
      /* 검증을 통과한 명함·사업자등록증은 곧바로 명함첩으로 보낸다.
         걸린 것은 보내지 않고 사람이 「명함첩으로 보내기」를 누를 때 보낸다. */
      if (read.auto && canSend(read)) return sendCards(job.id, year, job);
    });
  }).catch(function (e) {
    console.warn('[판독]', e);
    job._reading = false;
    job._read = { kind: 'other', error: (e && e.message) || String(e), auto: false, why: '판독하지 못했습니다' };
    renderUp();
  });
}

/* ══════ 명함첩으로 보내기 ══════
   명함첩이 어떻게 생겼는지는 등록 층(PuDocFile)만 안다 — 이 화면은 모른다.
   같은 사진을 두 번 보내지 않도록 보낸 표시(filed)를 사진 정보에 남긴다. */
const CARD_KINDS = { card: 1, bizreg: 1 };

function canSend(read) {
  return !!(read && !read.error && CARD_KINDS[read.kind] && !(read.filed && read.filed.id));
}

function sendCards(id, year, job) {
  const it = gridItems.find(function (x) { return x.id === id; });
  const read = (it && it.meta.read) || (job && job._read);
  if (!read || !canSend(read)) return Promise.resolve();
  const u = firebase.auth().currentUser;

  /* 명함첩은 사진 사본을 갖는다 — 사진첩을 정리해도 명함첩 기록이 온전하게.
     그래서 원판(본문)을 받아 함께 보낸다. */
  return PuPhotoStore.loadFull(year, id).then(function (full) {
    return PuDocFile.sendToCards({
      kind: read.kind,
      fields: read.fields,
      full: safeSrc(full) || '',
      thumb: (it && safeSrc(it.thumb)) || '',
      photoId: id,
      takenAt: (it && it.meta.takenAt) || Date.now(),
      byName: (u && (u.displayName || u.email)) || ''
    });
  }).then(function (res) {
    read.filed = { id: res.id, at: Date.now(), created: res.created, message: res.message };
    if (it) it.meta = Object.assign({}, it.meta, { read: read });
    if (job) job._read = read;
    if (viewerId === id) renderReadPanel(it);
    renderUp();
    return PuPhotoStore.saveRead(year, id, read);
  }).catch(function (e) {
    console.warn('[명함첩 보내기]', e);
    read.filedError = (e && e.message) || String(e);
    if (viewerId === id) renderReadPanel(it);
    renderUp();
  });
}

/* 크게 보기의 「명함첩으로 보내기」 단추가 부른다. */
function sendCardsNow() {
  const id = viewerId;
  if (!id) return;
  const it = gridItems.find(function (x) { return x.id === id; });
  if (!it) return;
  const box = $('readPanel').querySelector('.send');
  if (box) { box.disabled = true; box.textContent = '보내는 중…'; }
  sendCards(id, gridYear, null);
}

/* 판독 결과를 한 줄 한국어로. 화면 두 곳(올리는 중 목록·크게 보기)이 같은 문구를 쓴다. */
function readLine(read) {
  if (!read) return '';
  const label = readLabel(read);
  if (read.error) return label + ' · ' + read.error;
  if (read.kind === 'other') return label;
  const who = (read.fields && (read.fields.company || read.fields.name)) || '';
  let tail;
  if (!read.auto) tail = read.why;
  else if (read.kind === 'card') tail = '읽었습니다';   // 명함에는 검증할 번호가 없다
  else if (read.ntsChecked && read.ntsState) tail = '번호 확인됨 · 국세청 ' + read.ntsState;
  else tail = '번호 확인됨';
  return label + (who ? ' · ' + who : '') + ' · ' + tail;
}

function renderUp() {
  const now = Date.now();
  const rows = upJobs.filter(j => j.state !== 'done' || !j._hideAt || j._hideAt > now);
  $('upWrap').style.display = rows.length ? 'block' : 'none';
  $('upList').innerHTML = rows.map(j => {
    /* 원인(클라우드가 준 오류문)은 진단에 필요하니 재시도·막힘 줄에 함께 보여준다.
       이것이 없으면 "왜 안 되나"를 아무도 알 수 없다(2026-08-03 실사용 보고). */
    const cause = (j.state === 'retry' || j.state === 'fail') && j.error
      ? '<span class="er">원인: ' + esc(j.error) + '</span>' : '';
    const tag = j.kind === 'doc' ? '<span class="tag">서류</span>' : '';
    /* 서류는 올라간 뒤 스스로 판독한다 — 그 진행과 결과를 같은 줄 아래에 붙인다. */
    let rd = '';
    if (j._reading) rd = '<span class="rd">판독 중…</span>';
    else if (j._read) {
      const filed = j._read.filed && j._read.filed.id ? ' → 명함첩' : '';
      rd = '<span class="rd ' + (j._read.auto ? 'ok' : 'warn') + '">' +
        (j._read.auto ? '✓ ' : '⚠ ') + esc(readLine(j._read)) + filed + '</span>';
    }
    return '<div class="uprow s-' + esc(j.state) + '">' +
      '<span class="nm">' + esc(j.name || '사진') + tag + '</span>' +
      '<span class="st">' + (UP_STATE[j.state] || esc(j.state)) + '</span>' + cause + rd + '</div>';
  }).join('');
}

/* ══════ 날짜별 격자 ══════
   올해 것만 불러온다(연도별 보관의 이유). 목록(정보)만 먼저 받고,
   미리보기는 한 장씩 따로 받는다 — 본문(1600px)은 격자에서 절대 받지 않는다. */
const gridYear = String(new Date().getFullYear());
let gridItems = []; // { id, meta, thumb? } — 촬영 시각 내림차순

function loadGrid() {
  PuPhotoStore.listYear(gridYear).then(function (items) {
    gridItems = Object.keys(items).map(id => ({ id: id, meta: items[id] || {} }));
    gridItems.sort((a, b) => (b.meta.takenAt || 0) - (a.meta.takenAt || 0));
    renderGrid();
    fillThumbs();
  }).catch(function (e) { console.warn('[목록]', e); });
}

function addToGrid(job) {
  if (PuPhotoStore.yearOf(job.takenAt) !== gridYear) return; // 지난 연도는 다음 방문 때
  if (gridItems.some(it => it.id === job.id)) return;
  gridItems.unshift({ id: job.id, meta: job.meta, thumb: job.thumb });
  gridItems.sort((a, b) => (b.meta.takenAt || 0) - (a.meta.takenAt || 0));
  renderGrid();
}

function dayKey(ts) {
  const d = new Date(ts);
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function dayLabel(ts) {
  const d = new Date(ts);
  let label = (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
  if (d.toDateString() === new Date().toDateString()) label += ' (오늘)';
  return label;
}

function renderGrid() {
  const el = $('grid');
  $('empty').style.display = gridItems.length ? 'none' : 'flex';
  if (!gridItems.length) { el.innerHTML = ''; return; }

  const counts = {};
  gridItems.forEach(it => {
    const k = dayKey(it.meta.takenAt || it.meta.upAt || 0);
    counts[k] = (counts[k] || 0) + 1;
  });

  let html = '', lastDay = '';
  gridItems.forEach(it => {
    const ts = it.meta.takenAt || it.meta.upAt || 0;
    const k = dayKey(ts);
    if (k !== lastDay) {
      if (lastDay) html += '</div>';
      html += '<div class="day"><b>' + esc(dayLabel(ts)) + '</b><span>' + counts[k] + '장</span></div><div class="cells">';
      lastDay = k;
    }
    const t = safeSrc(it.thumb);
    const tag = it.meta.kind === 'doc' ? '<span class="tag">서류</span>' : '';
    html += '<div class="cell" data-id="' + esc(it.id) + '">' +
      (t ? '<img src="' + t + '" alt="">' : '') + tag + '</div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

/* 미리보기를 위에서부터 한 장씩 받아 채운다 — 한꺼번에 요청하지 않는다. */
function fillThumbs() {
  let chain = Promise.resolve();
  gridItems.forEach(function (it) {
    if (it.thumb) return;
    chain = chain.then(function () {
      return PuPhotoStore.loadThumb(gridYear, it.id).then(function (t) {
        it.thumb = t;
        const src = safeSrc(t);
        if (!src) return;
        const cell = document.querySelector('.cell[data-id="' + it.id + '"]');
        if (!cell) return;
        /* 칸 내용을 통째로 바꾸면 '서류' 딱지가 지워진다 — 그림만 끼워 넣는다. */
        const img = document.createElement('img');
        img.src = src;
        img.alt = '';
        cell.insertBefore(img, cell.firstChild);
      }).catch(function () { /* 한 장 실패해도 다음 장으로 */ });
    });
  });
}

/* ══════ 크게 보기 ══════
   격자의 흐릿함은 목록용 초소형 미리보기(240px)라서다. 실제 화질 판단은
   여기서 한다 — 저장된 축소본(1600px) 원판을 받아 보여준다. */
$('grid').addEventListener('click', function (ev) {
  const cell = ev.target.closest ? ev.target.closest('.cell') : null;
  if (cell) openViewer(cell.getAttribute('data-id'));
});

let viewerId = null;

function openViewer(id) {
  const it = gridItems.find(x => x.id === id);
  const v = $('viewer');
  viewerId = id;
  v.style.display = 'flex';
  $('viewerInfo').textContent = it
    ? (it.meta.kind === 'doc' ? '서류 · ' : '') +
      (it.meta.takenAt ? dayLabel(it.meta.takenAt) + ' · ' : '') + (it.meta.byName || '')
    : '';
  renderReadPanel(it);
  $('viewerHint').textContent = '불러오는 중…';
  const img = $('viewerImg');
  img.src = safeSrc(it && it.thumb) || ''; // 우선 미리보기를 깔고
  PuPhotoStore.loadFull(gridYear, id).then(function (full) { // 원판으로 바꾼다
    const src = safeSrc(full);
    if (src && v.style.display !== 'none') {
      img.src = src;
      $('viewerHint').textContent = (it && it.meta.w ? '저장본 ' + it.meta.w + '×' + it.meta.h + ' · ' : '') + '누르면 닫힘';
    } else if (!src) {
      $('viewerHint').textContent = '사진 본문을 불러오지 못했습니다';
    }
  }).catch(function () { $('viewerHint').textContent = '사진 본문을 불러오지 못했습니다'; });
}

function closeViewer() {
  $('viewer').style.display = 'none';
  $('viewerImg').src = '';
  $('readPanel').innerHTML = '';
  viewerId = null;
}

/* 판독 결과 패널 — 서류에만 나온다. 읽은 항목을 그대로 보여줘서
   "AI가 무엇을 어떻게 읽었는지"를 대표님이 눈으로 확인할 수 있게 한다. */
const READ_ROWS = [
  ['company', '상호'], ['name', '이름'], ['ceo', '대표자'], ['bizno', '사업자번호'],
  ['corpno', '법인번호'], ['openDate', '개업일'], ['bizType', '업태'], ['bizItem', '종목'],
  ['smeType', '기업규모'], ['expiry', '유효기간'], ['issueNo', '발급번호'],
  ['dept', '부서'], ['title', '직책'], ['mobile', '휴대폰'], ['tel', '전화'],
  ['companyTel', '대표번호'], ['email', '이메일'], ['address', '소재지'], ['companyAddr', '회사주소']
];

function renderReadPanel(it) {
  const el = $('readPanel');
  if (!it) { el.innerHTML = ''; return; }
  const read = it.meta.read;
  if (!read) {
    /* 서류 버튼으로 올렸는지 여부는 화질을 정할 때만 쓰는 값이다.
       나중에 "이거 명함이네" 하고 읽고 싶은 것은 사진 종류와 무관하므로
       **어떤 사진에서도 판독을 시작할 수 있어야 한다**(실사용 보고 2026-08-03:
       명함을 사진으로 올렸더니 판독할 방법이 아예 없었다). */
    const isDoc = it.meta.kind === 'doc';
    el.innerHTML = '<div class="box"><p class="note" style="margin:0">' +
      (isDoc ? '아직 판독하지 않은 서류입니다.' : '명함·사업자등록증이면 글자를 읽어 정보를 뽑아냅니다.') +
      '</p><button class="again" onclick="readAgain()">글자 판독하기</button></div>';
    return;
  }
  const warn = read.auto ? '' : ' warn';
  const rows = READ_ROWS
    .filter(function (p) { return read.fields && read.fields[p[0]]; })
    .map(function (p) { return '<tr><td class="k">' + p[1] + '</td><td>' + esc(read.fields[p[0]]) + '</td></tr>'; })
    .join('');
  /* 실패했으면 AI가 준 설명까지 통째로 보여준다 — 줄바꿈도 살린다.
     이것을 우리 문구로 덮었다가 원인을 잘못 짚은 적이 있다(모델 종료 사고). */
  const cause = read.error ? '<pre class="cause">' + esc(read.error) + '</pre>' : '';
  /* 명함첩으로 보낸 결과 / 보내는 단추 */
  let box = '';
  if (read.filed && read.filed.id) {
    box = '<p class="sent">✓ ' + esc(read.filed.message || '명함첩에 보냈습니다') + '</p>';
  } else if (read.filedError) {
    box = '<p class="cause">명함첩에 보내지 못했습니다\n' + esc(read.filedError) + '</p>' +
      '<button class="again send" onclick="sendCardsNow()">명함첩으로 다시 보내기</button>';
  } else if (CARD_KINDS[read.kind] && !read.error) {
    box = (read.auto ? '' : '<p class="note">확인이 필요해 자동으로 보내지 않았습니다. 위 내용이 맞으면 보내 주세요.</p>') +
      '<button class="again send" onclick="sendCardsNow()">명함첩으로 보내기</button>';
  }

  el.innerHTML = '<div class="box">' +
    '<div class="top"><span class="kd' + warn + '">' + esc(readLabel(read)) + '</span>' +
    (read.error ? '' : '<span class="msg' + warn + '">' + esc(readTail(read)) + '</span>') + '</div>' +
    cause +
    (rows ? '<table>' + rows + '</table>' : '') +
    box +
    '<button class="again" onclick="readAgain()">다시 판독</button></div>';
}

/* readLine 의 뒷부분(상태)만 — 패널은 종류를 딱지로 따로 보여주므로 겹치지 않게. */
function readTail(read) {
  const line = readLine(read);
  const label = readLabel(read);
  return line.indexOf(label + ' · ') === 0 ? line.slice(label.length + 3) : line;
}

/* 다시 판독 — 이미 올라간 서류를 다시 읽는다.
   본문(원판)을 받아 판독하므로 격자에 있는 미리보기로 읽지 않는다(글씨가 안 보인다). */
function readAgain() {
  const id = viewerId;
  const it = gridItems.find(function (x) { return x.id === id; });
  if (!it) return;
  $('readPanel').innerHTML = '<div class="box"><p class="note" style="margin:0">판독 중…</p></div>';
  PuPhotoStore.loadFull(gridYear, id).then(function (full) {
    if (!safeSrc(full)) throw new Error('사진 본문을 불러오지 못했습니다');
    return PuDocRead.read(full);
  }).then(function (r) {
    const v = PuDocRead.autoOk(r);
    const read = {
      kind: r.kind, fields: r.fields, bizNoOk: r.bizNoOk,
      ntsChecked: r.ntsChecked, ntsState: r.ntsState,
      auto: v.auto, why: v.why, error: r.error, at: Date.now()
    };
    it.meta = Object.assign({}, it.meta, { read: read });
    if (viewerId === id) renderReadPanel(it);
    return PuPhotoStore.saveRead(gridYear, id, read);
  }).catch(function (e) {
    console.warn('[다시 판독]', e);
    if (viewerId === id) {
      $('readPanel').innerHTML = '<div class="box"><p class="note" style="margin:0">판독하지 못했습니다 — ' +
        esc((e && e.message) || e) + '</p><button class="again" onclick="readAgain()">다시 시도</button></div>';
    }
  });
}

/* ══════ 설정 ══════ */
function modeLabel(m) { return m === 'storage' ? '파일 창고' : '실시간DB'; }

function openSettings() {
  $('modeText').textContent = modeLabel(PuPhotoStore.getMode());
  $('settings').style.display = 'flex';
}
function closeSettings() { $('settings').style.display = 'none'; }

/* 파일 창고 점검 — 작은 파일을 올리고 주소를 받아본 뒤 지운다.
   실사진 경로가 아니라 전용 점검 경로만 쓴다. */
function runProbe() {
  const out = $('probeOut');
  out.textContent = '점검 중…';
  PuPhotoStore.probe(String(Date.now())).then(r => {
    out.textContent = PuPhotoStore.probeMessage(r);
  }).catch(e => {
    /* .catch 가 없으면 저장 층 로드가 실패했을 때 화면이 "점검 중…"에서 영원히 멈춘다. */
    console.warn('[probe]', e);
    out.textContent = '점검을 실행하지 못했습니다.\n잠시 뒤 다시 시도해 주세요. 계속 같은 화면이면 개발자에게 알려 주세요.';
  });
}
</script>
