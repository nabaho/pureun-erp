<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1e3a8a">
<title>설치 · 푸른 통합 포털</title>
<!-- ⚠ 이 줄이 없으면 안드로이드에서 beforeinstallprompt 가 «영영 안 온다» —
     브라우저가 「무엇을 설치할지」를 모르기 때문이다. 그래서 「홈화면에 설치하기」
     단추가 뜨지도 않았다(2026-08-26 확인). 설치 화면에도 manifest 는 필수다. -->
<link rel="manifest" href="/pureunall/manifest.json">
<link rel="apple-touch-icon" href="/pureunall/icon-portal-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>⬇️</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Apple SD Gothic Neo','맑은 고딕',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.card{background:#1e293b;border-radius:20px;padding:32px 24px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.icon{width:88px;height:88px;border-radius:20px;background:linear-gradient(135deg,#1e3a8a,#3b82f6);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 8px 24px rgba(37,99,235,.4);}
h1{font-size:20px;font-weight:800;margin-bottom:6px;}
.sub{font-size:13px;color:#94a3b8;margin-bottom:28px;line-height:1.5;}

/* 설치 버튼 */
.btn-install{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;background:#2563eb;color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;margin-bottom:12px;box-shadow:0 4px 16px rgba(37,99,235,.4);transition:transform .1s,background .1s;}
.btn-install:active{transform:scale(.97);background:#1d4ed8;}
.btn-open{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;background:transparent;color:#94a3b8;border:1px solid #334155;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;}

/* iOS 안내 */
.ios-guide{display:none;margin-top:20px;text-align:left;}
.step{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid #1e293b;}
.step:last-child{border-bottom:none;}
.step-num{min-width:28px;height:28px;background:#2563eb;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}
.step-txt{font-size:13px;line-height:1.6;color:#cbd5e1;}
.step-txt b{color:#fff;}
.step-img{font-size:22px;}

.badge{display:inline-block;background:#1e3a8a;color:#93c5fd;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:16px;}
.arrow-down{font-size:24px;margin:8px 0;display:block;animation:bob .8s ease-in-out infinite alternate;}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(6px)}}
.hidden{display:none;}
.success{background:#064e3b;border:1px solid #10b981;border-radius:12px;padding:14px;font-size:13px;color:#6ee7b7;margin-top:16px;display:none;}
</style>
</head>
<body>
<div class="card">
  <div class="icon">푸</div>
  <div class="badge" id="device-badge">로딩 중...</div>
  <h1>푸른 통합 포털</h1>
  <p class="sub">홈 화면에 깔면 앱처럼 열립니다.<br>주소창·탭 없이 한 번에 —
    푸른이알피 · 기업정보함 · 메일이 모두 이 하나에 들어 있습니다.</p>

  <!-- Android / Desktop: 버튼 한 번 -->
  <button class="btn-install hidden" id="btn-android" onclick="installPWA()">
    <span style="font-size:22px;">📲</span> 홈화면에 설치하기
  </button>

  <!-- iOS: 안내 -->
  <button class="btn-install hidden" id="btn-ios-show" onclick="showIosGuide()">
    <span style="font-size:22px;">📲</span> 설치 방법 보기
  </button>

  <!-- 이미 설치됐거나 PWA 내부일 때 -->
  <div class="success" id="already">✅ 이미 설치되어 있습니다!</div>

  <!-- 그냥 브라우저로 열기 -->
  <a class="btn-open" href="/pureunall/enter.html" id="btn-open">
    🌐 브라우저로 바로 열기
  </a>

  <!-- iOS 단계 안내 -->
  <div class="ios-guide" id="ios-guide">
    <span class="arrow-down">↓</span>
    <div style="font-size:12px;color:#94a3b8;margin-bottom:8px;text-align:center;">아래 순서대로 따라하세요 (3단계)</div>
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-txt"><b>이 페이지에서</b> 화면 아래<br><b>공유 버튼</b> 탭 <span class="step-img">⬆️</span></div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-txt">스크롤 내려서<br><b>"홈 화면에 추가"</b> 탭 <span class="step-img">＋</span></div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-txt">오른쪽 위 <b>"추가"</b> 탭 →<br>홈 화면에 <b>푸른 포털</b> 아이콘 생성 ✅</div>
    </div>
    <div style="margin-top:12px;background:#1e3a8a22;border:1px solid #1e3a8a;border-radius:8px;padding:10px;font-size:11px;color:#93c5fd;">
      💡 반드시 <b>Safari</b>로 열어야 합니다.<br>카카오·크롬 링크는 Safari로 복사해서 여세요.
    </div>
  </div>
</div>

<script>
var deferredPrompt = null;

// beforeinstallprompt 캐치 (Android Chrome)
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  showAndroid();
});

window.addEventListener('appinstalled', function(){
  document.getElementById('already').style.display='block';
  document.getElementById('btn-android').classList.add('hidden');
  deferredPrompt = null;
});

function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
}
function isAndroidChrome(){
  return /android/i.test(navigator.userAgent) && /chrome/i.test(navigator.userAgent);
}

function showAndroid(){
  document.getElementById('btn-android').classList.remove('hidden');
  document.getElementById('btn-ios-show').classList.add('hidden');
  document.getElementById('device-badge').textContent = '📱 Android';
}

function showIosGuide(){
  var g = document.getElementById('ios-guide');
  g.style.display = g.style.display==='block' ? 'none' : 'block';
  document.getElementById('btn-ios-show').textContent = '📲 접기';
}

function installPWA(){
  if(!deferredPrompt){ 
    // 이미 설치됐거나 지원 안 함 → 통합 포털로 이동
    location.href='/pureunall/enter.html';
    return; 
  }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(r){
    if(r.outcome==='accepted'){
      document.getElementById('already').style.display='block';
      document.getElementById('btn-android').classList.add('hidden');
    }
    deferredPrompt=null;
  });
}

// 초기 판별
(function(){
  var badge = document.getElementById('device-badge');
  if(isStandalone()){
    badge.textContent='✅ 이미 설치됨';
    document.getElementById('already').style.display='block';
    return;
  }
  if(isIOS()){
    badge.textContent='🍎 iPhone / iPad';
    document.getElementById('btn-ios-show').classList.remove('hidden');
    return;
  }
  if(isAndroidChrome()){
    badge.textContent='📱 Android';
    // beforeinstallprompt 대기 중 — 잠시 후 자동으로 showAndroid() 호출
    // 혹시 이미 설치된 경우 대비 타임아웃
    setTimeout(function(){
      if(!deferredPrompt && !isStandalone()){
        // 설치 불가 상태 (이미 설치됐거나 조건 미충족)
        document.getElementById('btn-android').innerHTML='<span style="font-size:22px;">🚀</span> 포털 바로 열기';
        document.getElementById('btn-android').onclick=function(){ location.href='/pureunall/enter.html'; };
        document.getElementById('btn-android').classList.remove('hidden');
      }
    }, 1500);
    return;
  }
  // 기타 (PC 등)
  badge.textContent='💻 PC / 기타';
  document.getElementById('btn-android').innerHTML='<span style="font-size:22px;">🚀</span> 포털 바로 열기';
  document.getElementById('btn-android').onclick=function(){ location.href='/pureunall/enter.html'; };
  document.getElementById('btn-android').classList.remove('hidden');
})();
</script>
</body>
</html>
