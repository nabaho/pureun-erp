<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>📰</text></svg>">
<!--
  뉴스레터 관리 — 매주 한 통을 «짓고 · 보고 · 보낸다».
  ═══════════════════════════════════════════════════════════════════════════
  대표 지시 2026-09-02: 「푸른내외관리에 뉴스레터관리를 넣고 매주 관리하고 싶다.
  우선 매주 공인노무사회에서 받아서 전달하는 구조이다 이부분을 똑같은 디자인으로
  새로만들고 매주 푸른노무법인에서 직접 메일로 보내고 싶다. … 직접만드는 방식과
  전달방식 그리고 직접만드는것도 전달된것을 똑같이 만드는 방식등 여러가지 검토해서 완성해달라」

  목업: docs/mockups/newsletter-letter.html (편지) · newsletter-screen.html (화면)

  ★ 판단은 전부 js/pu-news-core.js 가, 편지 짓기는 js/pu-news-tpl.js 가 한다.
    화면은 그 답을 보여주고 손잡이만 단다. 같은 판단을 화면 안에서 다시 만들면
    두 곳이 서로 다른 답을 낸다(홈페이지 관리와 같은 짜임).

  ★ 보내는 것은 «새 발송기를 만들지 않는다» — 이미 도는 sendBulkMail 에 건다.
    한 곳마다 예약 한 건씩 걸리고 sendScheduledMail 이 15분마다 빼 간다.
    한꺼번에 쏟으면 다음메일 계정이 막히고, 막히면 평소 자료 발송까지 멈춘다.

  ★ 총괄관리자 전용이다 — 경력관리·홈페이지 관리와 «같은 줄, 같은 잣대».
    한때 「짓는 것은 직원도」로 두려 했으나, 자동으로 담을 밑감(homepage/newsBrief)이
    관리자만 읽는 자리라 직원에게 열려면 홈페이지 관리의 문까지 함께 열어야 했다.
    권한을 «못 읽었을 때»도 열지 않는다 — 못 읽은 것을 권한 있음으로 치면 막는 뜻이 없다.
-->

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

<style>
:root{
  --navy:#1e40af; --ink:#1e293b; --sub:#64748b; --faint:#94a3b8;
  --line:#e2e8f0; --paper:#f8fafc; --card:#fff;
  --brown:#6f5a48; --brown-soft:#f5f1ec;
  --ok:#166534; --warn:#d97706; --bad:#dc2626;
}
*{box-sizing:border-box;margin:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--paper);color:var(--ink);font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}

#bar{display:flex;align-items:center;gap:10px;padding:13px 16px;background:#fff;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
#bar .logo{font-size:19px;font-weight:800;letter-spacing:-.4px}
#bar .sp{flex:1}
#whoami{font-size:11.5px;font-weight:700;color:var(--sub)}

/* ── 탭을 화면 위에 붙여 둔다 (대표 지시 2026-09-02 「상단 틀 고정필요하다 피시도 같다」) ──
   기사 서른한 건·받는 명단 수백 줄을 굴려 내려가면 탭이 사라져, 다른 회차로 가려면
   맨 위까지 되올라가야 했다.
   ⚠ 폰·PC 를 «같이» 붙인다 — 대표 지시가 그렇고, 굴러야 하는 길이는 PC 도 같다.
   ⚠ 머리줄(#bar)은 안 붙인다. 로고와 계정뿐이라 늘 볼 까닭이 없고, 둘 다 붙이면
     화면 위 95px 가 통째로 사라진다. 탭만 붙이면 45px 다.
   ⚠ 위에 얹히는 것들(모달·토스트)보다 낮게 둔다. */
#tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);background:#fff;
  padding:0 10px;overflow-x:auto;
  position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(15,23,42,.05)}
#tabs button{padding:11px 15px;font-size:15px;font-weight:700;color:var(--sub);
  border:0;background:none;border-bottom:3px solid transparent;white-space:nowrap}
#tabs button.on{color:var(--ink);border-bottom-color:var(--brown)}

/* ← 1180px 에서 넓혔다(2026-09-02). 좌우를 5:5 로 «나누기만» 하면 각 칸이 570px 밖에
     안 되어 예전 오른쪽 칸(420px)보다 조금 나은 정도가 된다. 넓히지 않으면 5:5 가 손해다. */
/* ★ 온 화면을 다 쓴다 (대표 지시 2026-09-03 「좌우 여백 필요없다」).
   ⚠ max-width 를 되살리지 말 것 — 꼭지 넷을 2×2 로 놓을 폭이 여기서 나온다. */
.wrap{max-width:none;margin:0;padding:0 10px 60px}
#gate{max-width:520px;margin:60px auto;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:26px;text-align:center}
#gate .sub{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.7}

.hdbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:14px}
.hdbar .no{font-size:18px;font-weight:800}
.hdbar .sp{flex:1}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px}
.b-draft{background:#f1f5f9;color:var(--sub)}
.b-test{background:#fef3c7;color:var(--warn)}
.b-sent{background:#dcfce7;color:var(--ok)}
.btn{font-weight:700;font-size:13px;padding:8px 14px;border-radius:9px;
  border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--brown);border-color:var(--brown);color:#fff}
.btn.warn{border-color:#fcd34d;color:var(--warn)}
.mini{font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;
  border:1px solid var(--line);background:#fff;color:var(--sub)}
.mini.on{background:var(--brown);border-color:var(--brown);color:#fff}

.ways{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:12px}
.way{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left}
.way.on{border-color:var(--brown);box-shadow:0 0 0 2px var(--brown-soft)}
.way b{display:block;font-size:14px;margin-bottom:4px}
.way p{font-size:12px;color:var(--sub);line-height:1.65}
.way .law{display:inline-block;margin-top:7px;font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px}
.law-ok{background:#dcfce7;color:var(--ok)}
.law-mid{background:#fef3c7;color:var(--warn)}
.law-bad{background:#fee2e2;color:var(--bad)}

/* 대표 지시 2026-09-02: 「좌측에 채울것과 우측에 나갈 모습 크게 5:5로」 */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;align-items:start}
/* ★ 꼭지 넷을 2×2 로 (대표 지시 2026-09-03 「고용·노동정책 등 아래 내용이 전혀 안 보인다」).
   ⚠ 까닭은 폭이 아니라 «쌓임»이었다 — 주간노동뉴스 8건이 끝나야 둘째 꼭지가 나와,
     첫 화면에서는 둘째부터 아예 안 보였다. 넓히기만 해서는 안 풀린다.
   ⚠ 좁아지면 한 열로 돌아간다. 2열을 폰에 밀면 제목이 다 잘린다. */
.jars{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
@media(max-width:1100px){.jars{grid-template-columns:1fr}}
@media(max-width:980px){.cols{grid-template-columns:1fr}}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.box>h3{font-size:14px;font-weight:800;padding:12px 15px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.box>h3 .cnt{font-size:11px;font-weight:800;color:var(--sub);background:var(--paper);
  padding:2px 8px;border-radius:99px}
.box>h3 .sp{flex:1}
/* ⚠ 2026-09-03 대표 지시 「화면 잘린다 이부분 어떻게 해야하나」 —
     여기가 그 자리였다. .item .t 에 white-space:nowrap 이 걸려 제목을 한 줄로 강제하고
     넘치면 잘랐다. 거기에 꼭지를 2×2 로 놓아 칸이 또 반이 되었다.
     실제로 재 보면 1400px 창에서 제목에 남는 폭이 «165px — 한글 열 자쯤»이었다.
   ★ 제목은 «빼고 말고를 정하려고» 읽는 것이다. 자르면 그 일을 못 한다. 줄을 넘긴다.
     줄이 늘어 길어지는 것은 왼쪽 칸이 구르니 괜찮다 — 못 읽는 것이 더 나쁘다.
   ⚠ align-items 를 flex-start 로 — 가운데 정렬이면 두 줄 제목 옆에서 ▲▼✕ 가
     가운데로 내려가 줄이 안 맞는다.
   ⚠ word-break:keep-all — 한글은 낱말째로 넘겨야 한다. 글자 가운데서 끊기면 읽기 어렵다. */
.item{display:flex;align-items:flex-start;gap:9px;padding:9px 15px;border-bottom:1px solid #f1f5f9}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0;font-size:13.5px;line-height:1.5;word-break:keep-all;
  overflow-wrap:anywhere}
.item .src{font-size:11px;color:var(--faint);flex:0 0 auto;padding-top:2px}
.item .x,.item .mv{border:0;background:none;color:var(--faint);font-size:13px;padding:2px 5px}
.item .x:hover{color:var(--bad)}
.empty{padding:16px 15px;font-size:13px;color:var(--faint)}
.pad{padding:12px 15px}
textarea,input[type=text],input[type=url],select{width:100%;border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;line-height:1.7}
textarea{resize:vertical}
label.f{display:block;font-size:12px;font-weight:800;color:var(--sub);margin:12px 0 5px}
label.f:first-child{margin-top:0}
/* 설정 — 짧은 칸은 두 줄로 나란히. 대표 지시 2026-09-03 「좀더 컴팩트하게 … 추가로 더
   넣을 내용이 있을 수 있으니 그부분도 반영해서 공간 정리」. 칸을 더해도 자리가 남는다. */
/* 체크칸 — 넘버링 왼쪽. 대표 지시 2026-09-03 「넘버링 왼쪽 표시 체크가능하게」 */
table.list th.ck,table.list td.ck{width:34px;text-align:center;padding-left:10px;padding-right:0}
/* 연락처 열 — 대표 지시 2026-09-03 「연락처를 아래에 두지말고 옆에두고 열을 일치시켜라」.
   ⚠ 숫자 폭을 고정한다(tabular-nums) — 010-1234-5678 처럼 자릿수가 같아도 글꼴에 따라
     0 과 1 의 폭이 달라 세로로 어긋난다. 열을 갈라도 그것까지 맞춰야 훑기 편하다. */
table.list th.tel,table.list td.tel{white-space:nowrap;font-variant-numeric:tabular-nums;
  font-feature-settings:'tnum';color:var(--sub);font-size:12.5px;width:118px}
table.list .chk,table.list #chkAll{width:15px;height:15px;cursor:pointer;accent-color:var(--brown)}
/* 고른 것이 있을 때만 뜨는 띠 — 얼린 머리 바로 밑에 붙어 «몇 곳 골랐는지»를 늘 보여 준다 */
.picked{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;
  background:var(--brown-soft);border:1px solid var(--brown);border-radius:10px;
  padding:8px 13px;font-size:13px;color:var(--ink)}
.picked .sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid2 .wide{grid-column:1 / -1}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.sect{font-size:12px;font-weight:800;color:var(--brown);background:var(--brown-soft);
  padding:6px 15px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.hint{font-size:11.5px;color:var(--faint);margin-top:6px;line-height:1.65}

.pv{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:12px}
.pv .pvhd{font-size:13px;font-weight:800;padding:11px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px}
.pv .pvhd .sp{flex:1}
.pv .paper{background:#e9e7e3;padding:12px;max-height:70vh;overflow:auto}
.pv iframe{width:100%;border:0;background:#fff;display:block}

table.list{width:100%;border-collapse:collapse;font-size:13px}
/* ── 설정 3열 격자 (대표 결정 2026-09-03 「가」) ──
   ⚠ 좁은 화면에서는 두 열 → 한 열로 접힌다. 3열을 그대로 밀어붙이면
     노트북·폰에서 칸이 짜부라져 주소가 안 보인다. */
.pad.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 12px}
.pad.g3 .w2{grid-column:span 2}
.pad.g3 .w3{grid-column:span 3}
@media(max-width:900px){ .pad.g3{grid-template-columns:1fr 1fr}
  .pad.g3 .w2,.pad.g3 .w3{grid-column:span 2} }
@media(max-width:560px){ .pad.g3{grid-template-columns:1fr}
  .pad.g3 .w2,.pad.g3 .w3{grid-column:span 1} }
/* ── ⓘ 말풍선 — 사용액 창(enter.html .btip)과 «같은 결» ──
   ★ 안내를 지우는 것이 아니라 «접는» 것이다. 칸 9개에 안내가 617자였다.
   ⚠ 폰에는 마우스 올리기가 없다 — 눌러서(focus-within) 도 펴지게 둔다.
     hover 만 두면 폰에서는 안내를 «영영 못 본다». */
.tipwrap{position:relative;display:inline-block}
.tipwrap .ib{display:inline-flex;align-items:center;justify-content:center;
  width:17px;height:17px;border-radius:50%;background:#e2e8f0;color:#475569;
  font-size:11px;font-weight:800;border:0;cursor:help;vertical-align:middle;margin-left:4px}
.tipwrap .tip{display:none;position:absolute;left:0;top:22px;width:min(330px,72vw);
  z-index:9;background:#1e293b;color:#e2e8f0;border-radius:8px;padding:10px 12px;
  font-size:11.5px;line-height:1.75;box-shadow:0 12px 30px rgba(15,23,42,.35);
  font-weight:400;white-space:normal}
.tipwrap .tip b{color:#fff}
.tipwrap:hover .tip,.tipwrap:focus-within .tip{display:block}

table.list th,table.list td{padding:8px 14px;text-align:left;border-bottom:1px solid #f1f5f9}
/* 번호 칸 — 숫자를 오른쪽에 맞춰 자릿수가 흔들려도 줄이 안 어긋나게 */
table.list th.n,table.list td.n{width:44px;text-align:right;padding-right:6px;
  color:var(--faint);font-variant-numeric:tabular-nums}
/* 유형 딱지 — 빛깔은 업체관리와 같다(Core.유형들). 자문·노조가 같은 파랑이라
   빛깔만으로 가르지 않고 표시(아이콘)와 이름을 늘 함께 둔다. */
/* 작은 딱지 — 「담당자/대표자」·「반송/자동회신」에 함께 쓴다 */
.pill{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:99px;white-space:nowrap}
.ty{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;white-space:nowrap}
/* 유형 칩 줄 — 업체관리 도구줄과 같은 결 */
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0 10px}
.chips .chip{padding:5px 11px;border-radius:20px;font-size:11.5px;font-weight:700;
  background:#fff;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.chips .chip.on{background:var(--brown);border-color:var(--brown);color:#fff}
table.list th{background:var(--paper);font-size:11.5px;font-weight:800;color:var(--sub);white-space:nowrap}
table.list tr:hover td{background:#fcfcfd}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0f172a;color:#fff;
  padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:600;max-width:88vw;
  line-height:1.6;opacity:0;pointer-events:none;transition:opacity .18s;z-index:90;white-space:pre-line}
#toast.on{opacity:1}
#big{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;z-index:80;padding:22px}
#big.on{display:flex;align-items:center;justify-content:center}
#big .in{background:#fff;border-radius:14px;width:min(680px,96vw);max-height:92vh;
  display:flex;flex-direction:column;overflow:hidden}
#big .in h4{font-size:15px;font-weight:800;padding:13px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px}
#big .in h4 .sp{flex:1}
#big .bd{overflow:auto;background:#e9e7e3;padding:14px;flex:1}
.note{margin-top:14px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--brown);
  border-radius:10px;padding:12px 15px;font-size:13px;line-height:1.8;color:#334155}
.note.bad{border-left-color:var(--bad)}
.note b{color:var(--brown)}
.note.bad b{color:var(--bad)}

/* ══════════════════════════════════════════════════════════════════════════
   넓은 화면 껍데기 — 위를 «얼리고» 두 칸을 따로 굴린다
   ══════════════════════════════════════════════════════════════════════════
   대표 지시 2026-09-02: 「상단은 틀고정해주고 좌측에 채울것과 우측에 나갈 모습
   크게 5:5로 화면 나눠서 정리할 수 있나」

   ★ 자리를 «재는 JS 가 없다» — flex 로만 짠다. 머리 높이를 px 로 재서 박으면
     글자 크기·창 폭·줄바꿈이 바뀔 때마다 어긋나고, 그때 얼린 머리가 본문을 덮는다.
     그래서 쪽 자체를 안 구르게 하고, 구르는 것을 «안쪽»으로 옮긴다.

   ⚠ 얼리기를 이 미디어쿼리 «밖»에 두면 휴대폰에서 쪽이 아예 안 구른다 — 아무것도
     못 본다. tests/newsletter-app.test.js 가 밖으로 새어 나갔는지 본다.

   ⚠ 5:5 규칙은 «.now»(이번 회차)로 좁힌다. 지난 회차·받는 명단·설정에는 .cols 가
     없어서, 껍데기를 그 탭에도 걸면 flex:1 을 받을 자식이 없어 «스크롤을 잃는다».
     그래서 탭 공통으로는 .wrap 자체가 구르게 해 둔다. */
@media(min-width:981px){
  html,body{height:100%;overflow:hidden}
  #shell{height:100%;display:flex;flex-direction:column}
  #shell>#top{flex:0 0 auto}                 /* 얼린 머리 ① 앱바 + 탭 */
  #shell>.wrap{flex:1;min-height:0;overflow-y:auto;padding-bottom:14px}
  /* 이번 회차만 — 회차 머리줄까지 얼리고 아래를 두 칸으로 */
  #shell>.wrap.now{overflow:hidden;display:flex;flex-direction:column}
  .wrap.now>.cols{flex:1;min-height:0}
  .colL{overflow-y:auto;padding-right:4px}   /* 왼쪽만 구른다 */
  .wrap.now .pv{position:static;height:100%;display:flex;flex-direction:column}
  .wrap.now .pv .paper{flex:1;min-height:0;max-height:none}  /* 화면 높이를 채운다 */

  /* 받는 명단 — 머리줄과 유형 칩을 얼리고 «표만» 구른다.
     대표 지시 2026-09-03 「캡쳐1 틀고정」. 110줄을 훑을 때 위가 사라지면
     지금 무슨 유형을 보고 있는지 · 몇 곳인지를 잃는다.
     ⚠ .whorest 가 없으면 표가 잘린다 — render() 가 who 표를 붙일 때 함께 봐야 한다. */
  #shell>.wrap.who{overflow:hidden;display:flex;flex-direction:column}
  .wrap.who>.hdbar,.wrap.who>.chips,.wrap.who>.picked{flex:0 0 auto}
  .wrap.who>.whorest{flex:1;min-height:0;overflow-y:auto;padding-right:4px}
}

/* ⚠ 안전판 — 넓지만 «낮은» 창(노트북에서 브라우저 도구를 열면 이렇게 된다)에서는
     얼린 머리가 화면을 거의 다 먹고 두 칸이 0 으로 짜부라진다. 그때는 얼리기를 끄고
     예전처럼 쪽이 구른다. 안 예쁜 것보다 «못 쓰는 것»이 나쁘다. */
@media(min-width:981px) and (max-height:620px){
  html,body{height:auto;overflow:auto}
  #shell{height:auto;display:block}
  #shell>.wrap,#shell>.wrap.now,#shell>.wrap.who{overflow:visible;display:block;flex:none}
  .wrap.who>.whorest{overflow:visible;padding-right:0}
  .colL{overflow:visible;padding-right:0}
  .wrap.now .pv{position:sticky;top:12px;height:auto;display:block}
  .wrap.now .pv .paper{max-height:70vh}
}

function 오늘(){ return new Date().toISOString().slice(0,10); }

/* 지금 회차 한 벌(없으면 빈 것을 만들어 준다 — 자리에 쓰지는 않는다) */
function 지금회차(){
  const 열쇠 = App.지금열쇠;
  const 있는것 = App.회차들[열쇠];
  const 회 = Core.회차(오늘());
  const 회차한벌 = (있는것 && 있는것.회차) || (열쇠 === 회.열쇠 ? 회 : 회차로부터(열쇠));
  return Object.assign({
    열쇠: 열쇠, 회차: 회차한벌, 상태: '초안',
    안: { news:[], policy:[], case:[], hr:[] }, 우리글: ''
  }, 있는것 || {});
}
/* 열쇠(2026-08-w5)에서 회차 한 벌을 되살린다 — 지난 회차를 열 때 쓴다 */
function 회차로부터(열쇠){
  const m = /^(\d{4})-(\d{2})-w(\d+)$/.exec(String(열쇠||''));
  if(!m) return Core.회차(오늘());
  /* 그 달 1일부터 훑어 같은 열쇠가 나오는 날을 찾는다 — 규칙을 여기서 다시 만들지 않는다 */
  for(let d=1; d<=31; d++){
    const 날 = m[1] + '-' + m[2] + '-' + (d<10?'0':'') + d;
    const r = Core.회차(날);
    if(r && r.열쇠 === 열쇠) return r;
  }
  return Core.회차(오늘());
}

function 회차저장(자료){
  App.회차들[자료.열쇠] = 자료;
  return db.ref('newsletter/issues/' + 자료.열쇠).update({
    회차: 자료.회차, 상태: 자료.상태 || '초안', 안: 자료.안 || {},
    우리글: 자료.우리글 || '', 범위: 자료.범위 || App.설정.범위 || '자문중',
    고친이: (App.me && App.me.email) || '', 고친때: Date.now()
  });
}

function render(){

       바뀌어 «전체가 27 인 줄로» 보인다(실제로는 114). 탭은 늘 같은 것을 말해야 한다.
       대표 지시 2026-09-03 「버튼을 누르면 받는명단의 숫자도 바뀐다 이부분 수정해라」 */
  $('cWho').textContent  = ((명단셈().전체 || []).length) || '';
  const m = $('main');
  /* 5:5 껍데기는 «이번 회차»에만 — 다른 탭엔 .cols 가 없어 걸면 스크롤을 잃는다 */
  m.classList.toggle('now', App.tab==='now');
  /* 받는 명단도 위(머리+유형 칩)를 얼린다 — 대표 지시 2026-09-03 「캡쳐1 틀고정」.
     ⚠ 얼릴 자리 아래에 «구르는 칸»(.whorest)이 반드시 있어야 한다. 없으면 표가 잘린다. */
  m.classList.toggle('who', App.tab==='who');
  if(App.tab==='now')  m.innerHTML = 이번회차화면();
  if(App.tab==='past') m.innerHTML = 지난회차화면();
  if(App.tab==='who')  m.innerHTML = 명단화면();
  if(App.tab==='cfg')  m.innerHTML = 설정화면();
  if(App.tab==='now') 미리보기그리기();
  if(App.tab==='past') 지난미리보기그리기();
}

function 명단셈(){
  /* 기업정보함에서 «그때그때» 만든다. 범위(설정)가 어디까지 볼지 정한다 —
     자문중=살아 있는 곳만 · 자문끝=끝난 곳까지 · 명함전부=지점까지.
     퇴사한 담당자(contacts[].left)는 Core 가 뺀다.

     ★ 유형(자문·급여·노조·기금) 거르기가 «여기» 있다 (대표 지시 2026-09-03).
       화면도 보내기도 CSV도 엑셀도 «이 함수 하나»를 쓴다 —
       거르는 자리를 두 곳에 두면 화면엔 38곳인데 110곳에 나간다. */
  /* 대표 결정 2026-09-03: 「담당자와 같이」 — 대표자에게도 함께 보낸다.
     ⚠ 실측으로는 4명만 늘어난다(110→114). 기업정보함에 «대표자 이메일» 칸이
       없어서다 — ceo 는 이름이고, 쓸 수 있는 것은 회사 메일 10곳뿐이다.
       칸을 만들어 채우면 그때 크게 늘어난다. */
  const g = Core.사업장에서명단(App.사업장들, App.설정.범위,
    { 대표자도: App.설정.대표자도 !== false });
  const d = Core.명단다듬기(g.줄들, App.막은주소);
  /* 거른 «뒤»가 아니라 다듬은 «뒤»에 센다 — 수신거부·겹침을 뺀 실제 보낼 곳으로 세어야
     칩의 숫자와 표의 줄 수가 맞는다. */
  d.유형셈 = Core.유형별셈(d.ok);
  d.전체 = d.ok;
  if(App.유형){
    d.ok = Core.유형으로거르기(d.ok, App.유형);
    d.셈 = Object.assign({}, d.셈, { 보낼곳: d.ok.length });
  }
  d.주소없는곳 = g.주소없는곳;
  d.본곳 = g.본곳;
  return d;
}

function 꼭지칸들(d){
  return Core.꼭지들.map(function(g){
    if(g.갈래==='우리글'){
      return `<div class="box"><h3>${esc(g.이름)} <span class="cnt">우리 글</span></h3>
        <div class="pad">
         <textarea id="myWrite" rows="4" oninput="우리글바뀜(this.value)"
           placeholder="이번 주 한마디 — 이 칸만 우리가 씁니다.">${esc(d.우리글||'')}</textarea>
         <div class="hint">나머지 세 꼭지는 <b>제목과 원문 링크</b>만 싣습니다.
           기사 본문은 남의 글이라 옮기지 않습니다.</div>
        </div></div>`;
    }
    const 것 = d.안[g.키] || [];
    const 줄 = 것.length ? 것.map(function(x,i){
      return `<div class="item">
        <button class="mv" title="위로" onclick="옮기기('${g.키}',${i},-1)">▲</button>
        <button class="mv" title="아래로" onclick="옮기기('${g.키}',${i},1)">▼</button>
        <span class="t" title="${esc(x.제목||'')}">${esc(x.제목||'')}</span>
        <span class="src">${esc(x.갈래==='법령' ? (x.부처||'법령') : (x.언론사||''))}</span>
        <button class="x" title="빼기" onclick="빼기('${g.키}',${i})">✕</button>
      </div>`;
    }).join('') : '<div class="empty">아직 담긴 것이 없습니다 — 빈 꼭지는 편지에 안 나옵니다.</div>';
    return `<div class="box"><h3>${esc(g.이름)}
      <span class="cnt">${것.length}건</span><span class="sp"></span>
      <button class="mini" onclick="손으로담기('${g.키}')">＋ 손으로 담기</button></h3>${줄}</div>`;
  }).join('');
}

/* ══════ 손잡이 — 꼭지 고치기 ══════ */
function 길바꾸기(v){ App.길 = v; render(); }

function 우리글바뀜(v){
  const d = 지금회차(); d.우리글 = v;
  App.회차들[d.열쇠] = d;
  clearTimeout(우리글바뀜._t);
  우리글바뀜._t = setTimeout(()=>{ 회차저장(d); 미리보기그리기(); }, 700);
}
function 옮기기(칸, i, 어디){
  const d = 지금회차(); const a = d.안[칸] || [];
  const j = i + 어디; if(j<0 || j>=a.length) return;
  const t = a[i]; a[i] = a[j]; a[j] = t;
  회차저장(d).then(render);
}
function 빼기(칸, i){
  const d = 지금회차(); (d.안[칸]||[]).splice(i,1);
  회차저장(d).then(render);
}
function 손으로담기(칸){
  const 제목 = prompt('제목을 적어 주세요'); if(!제목) return;
  const 링크 = prompt('원문 링크 (없으면 비워 두세요)') || '';
  const d = 지금회차();
  (d.안[칸] = d.안[칸] || []).push({ 갈래:'기사', 제목:제목.slice(0,200), 링크:링크, 언론사:'' });
  회차저장(d).then(render);
}

   ⚠ 예전에는 「지금 모아 둔 기사 43건」이라 크게 적어 놓고 채우면 0건이 담겼다.

/* 연습용 샘플로 채운다 — 「연습으로 보내봐야 한다」(대표 지시 2026-09-03).
   ⚠ 모든 줄에 [연습] 이 붙어 있다. 실수로 진짜 발송에 섞이면 곧 눈에 보인다.
   ⚠ 연습은 «나에게 시험 발송»으로 하셔야 한다 — 「N곳에 보내기」는 진짜 자문사로 나간다. */
function 연습채우기(){
  const d = 지금회차();
  if(!confirm('연습용 샘플로 채웁니다.\n\n이미 담긴 것은 지워집니다.\n'
    + '모든 줄에 [연습] 이 붙어 나옵니다.\n\n'
    + '⚠ 연습은 「나에게 시험 발송」으로만 하세요 —\n'
    + '「N곳에 보내기」는 진짜 자문사로 나갑니다.\n\n채울까요?')) return;
  d.안 = Core.연습샘플();
  d.우리글 = '[연습] 이번 주 한마디 — 이 칸만 우리가 씁니다.';
  회차저장(d).then(function(){
    render();
    const n = Core.꼭지들.reduce((a,g)=>a+((d.안[g.키]||[]).length),0);
    toast('🧪 연습용 샘플 ' + n + '건을 담았습니다 — 「나에게 시험 발송」으로 보내 보세요', 12000);
  }).catch(e=>toast('담지 못했습니다: ' + ((e&&e.message)||''), 8000));
}

function 자동담기(){
  const d = 지금회차();
  /* 법령은 서버가 모아 둔 자리가 따로 없다 — 지금은 뉴스만 자동이고,
     법령은 주간 브리핑이 만들어 둔 것이 있으면 그것을 쓴다. */
  db.ref('homepage/newsBrief/법령').once('value').catch(()=>({val:()=>null}))
    .then(function(s){
      const 법령 = s.val() || [];
      d.안 = Core.자동으로담기(App.브리핑, Array.isArray(법령)?법령:[], d.회차);
      d.안.hr = [];
      return 회차저장(d);
    })
    .then(function(){
      render();
      const n = Core.꼭지들.reduce((a,g)=>a+((d.안[g.키]||[]).length),0);
      toast(n ? `⟳ ${n}건을 담았습니다 — 필요 없는 것은 ✕ 로 빼세요`
              : '이 주치에 모아 둔 기사가 없습니다 — 붙여넣어 담거나 손으로 담아 주세요', 7000);
    })
    .catch(e=>toast('담지 못했습니다: ' + ((e&&e.message)||''), 7000));
}

/* ══════ 길 ② 붙여넣어 옮겨 담기 ══════ */
function 붙여넣기옮기기(더하기){
  const box = $('pasteBox'); if(!box) return;
  const r = Core.붙여넣기읽기(box.value);
  if(!r.찾은수) return toast('뽑을 것을 못 찾았습니다 — 본문을 통째로 골라 복사해 보세요', 7000);
  const d = 지금회차();
  Core.꼭지들.forEach(function(g){
    if(g.갈래==='우리글') return;
    const 새것 = r.안[g.키] || [];
    d.안[g.키] = 더하기 ? (d.안[g.키]||[]).concat(새것) : 새것;
  });
  회차저장(d).then(function(){
    render();
    toast(`↧ ${r.찾은수}건을 옮겨 담았습니다`
      + (r.꼭지로갈랐나 ? ' — 꼭지 이름을 찾아 갈랐습니다' : ' — 꼭지 이름을 못 찾아 말로 갈랐습니다'), 8000);
  });
}

/* ══════ 미리보기 ══════ */
function 지금편지(){
  const d = 지금회차();
  return Tpl.편지짓기(Object.assign({}, d, { 범위: App.설정.범위 }), App.설정);

function 미리보기그리기(){
  const f = $('pvFrame'); if(!f) return;
  const 편 = 지금편지();
  const html = 편 ? 편.서식
    : '<div style="padding:26px;font-family:sans-serif;color:#94a3b8;font-size:13px">'
      + '실을 것이 없습니다 — 위에서 담아 주세요.</div>';
  f.srcdoc = '<!doctype html><meta charset="utf-8"><body style="margin:0">' + html;
  /* 속 높이에 맞춰 늘린다 — 안 하면 미리보기가 잘려서 아무도 안 본다 */
  f.onload = function(){
    try{ f.style.height = (f.contentDocument.body.scrollHeight + 8) + 'px'; }catch(_){}
  };

function 크게보기(){
  const 편 = 지금편지();
  if(!편) return toast('실을 것이 없습니다');
  $('bigT').textContent = 편.제목;
  $('bigB').innerHTML = '<iframe id="bigF" style="width:100%;border:0;background:#fff" title="미리보기"></iframe>';
  const f = $('bigF');
  f.srcdoc = '<!doctype html><meta charset="utf-8"><body style="margin:0">' + 편.서식;
  f.onload = function(){ try{ f.style.height = (f.contentDocument.body.scrollHeight + 8) + 'px'; }catch(_){} };

}

async function 걸기(payload){
  const u = firebase.auth().currentUser;
  if(!u) throw new Error('로그인이 풀렸습니다');
  const token = await u.getIdToken();
  /* ★ 보내는 주소를 «여기 한 곳»에서 붙인다. 발송 길이 넷(시험·본발송·전달시험·전달)이라
       각자 붙이면 한 곳을 빠뜨려 다른 주소로 나간다. */
  const body = Object.assign({ from: 보내는주소() }, payload);
  const res = await fetch(BULK_FN_URL, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + token },
    body: JSON.stringify(body)
  });
  let j=null; try{ j = await res.json(); }catch(_){}
  if(!res.ok || !j || !j.ok) throw new Error((j&&j.error) || ('서버 응답 ' + res.status));
  return j;
}

async function 진짜보내기(){
  if(App.보내는중) return toast('보내는 중입니다 — 잠시만 기다려 주세요');
  if(!App.isAdmin) return toast('보내기는 총괄관리자만 누를 수 있습니다');
  const d = 지금회차();
  const r = 명단셈();
  const 갈수있나 = Core.보낼수있나(d, r.셈);
  if(!갈수있나.ok) return toast(갈수있나.까닭, 8000);
  const 편 = 지금편지(); if(!편) return toast('실을 것이 없습니다');

  /* ⚠ 여기서 제 셈을 하지 않는다 — Core 한 자리에서만 (서버 etaText 와 맞춰 둔 자리).
       예전에는 `곳수 × 15초` 로 셈해 300곳이면 「약 75분」이라 해 놓고 3시간 45분이
       걸렸다. 대표께서 이 숫자를 보고 되돌릴 수 없는 단추를 누르신다. */
  const 걸림 = Core.보낼시간(r.ok.length, BULK_GAP_SEC);
  /* 추적 밑주소를 설정에 넣지 않으면 편지에 추적이 «안 들어간다» — 예전처럼 나간다.
     그러면 열람·미열람이 영영 빈칸이니, 보내기 전에 한 번 알려 드린다. */
  if(!(App.설정.추적밑주소||'').trim()
     && !confirm('⚠ 열람 추적이 꺼져 있습니다 (설정 → 추적 밑주소가 비어 있습니다).\n\n'
       + '이대로 보내면 누가 열었는지 «알 수 없습니다» —\n'
       + '미열람 셈도 쌓이지 않습니다.\n\n그래도 보낼까요?')) return;
  if(!confirm(
    `「${편.제목}」\n\n`
    /* ⚠ 「어느 유형에 나가나」를 «맨 앞»에 말한다. 되돌릴 수 없는 단추 앞이다.
       ★ 경고(⚠)는 «넓힌 쪽»에 붙는다 — 기본이 「자문」이므로(대표 지시 2026-09-03),
         자문만 나가는 것은 정한 대로이고, 전체로 넓히는 것이 알아야 할 일이다.
       ⚠ 「골라 두셨습니다」라고 적지 않는다 — 자문은 «첫 값»이라 고른 것이 아니다.
         고르지 않은 것을 골랐다고 하면 그 말을 다음부터 안 믿는다. */
    + (App.유형
        ? `· 유형 — 「${App.유형}」에만 나갑니다 (`
          + Core.유형들.map(t=>t.키).filter(k=>k!==App.유형).join('·') + ` 에는 안 나갑니다)\n`
        : `· ⚠ 유형 — 전체 (${Core.유형들.map(t=>t.키).join('·')} 모두 나갑니다)\n`)
    + `· 받는 곳 — ${r.ok.length.toLocaleString()}곳 (한 곳에 한 통씩, 서로 주소가 안 보입니다)\n`
    + `· 뺀 곳 — 수신거부 ${r.셈.수신거부} · 주소없음 ${r.셈.주소없음} · 겹침 ${r.셈.겹침}\n`
    + `· 다 나가는 데 ${걸림}\n\n`
    + `천천히 나가는 까닭 — 한꺼번에 보내면 다음메일이 막습니다.\n`
    + `창을 닫아도 서버가 계속 보냅니다.\n\n보낼까요?`)) return;

  App.보내는중 = true; render();
  try{
    const j = await 걸기({ to:r.ok, subject:편.제목, body:편.본문, html:편.서식,
                           spacingSec: BULK_GAP_SEC });
    d.상태 = '발송'; d.보낸때 = Date.now(); d.받는수 = r.ok.length; d.batchId = j.batchId || '';
    d.보낸이 = (App.me && App.me.email) || '';
    /* ★ 링크 목록을 회차에 «함께» 적는다 — 서버(newsClick)가 번호로 이것을 찾는다.
         ⚠ 안 적으면 클릭이 우리 홈페이지로 튕긴다(목록에 없는 번호는 안 보내는 규칙).
       ★ 「보냄」 표를 통마다 적는다 — 미열람 셈이 «보낸 회차»만 세기 때문이다.
         ⚠ 안 적으면 이 회차가 셈에서 아예 빠져 미열람이 영영 안 쌓인다.
         한 번의 update 로 담는다 — 110번 나눠 쓰면 중간에 끊겨 절반만 남는다. */
    const 보냄표 = {};
    r.ok.forEach(function(x){
      const 열 = String(x.email||'').trim().toLowerCase().replace(/[.#$/[\]]/g,'_');
      if(열) 보냄표[열 + '/보냄'] = true;
    });
    await db.ref('newsletter/issues/' + d.열쇠).update({
      상태:'발송', 보낸때:d.보낸때, 받는수:d.받는수, batchId:d.batchId, 보낸이:d.보낸이,
      링크들: 편.링크들 || []
    });
    if(Object.keys(보냄표).length){
      try{ await db.ref('newsletter/opens/' + d.열쇠).update(보냄표); }
      catch(e){ toast('보냄 표를 못 적었습니다 — 열람 셈이 이 회차를 빠뜨립니다: '
                      + ((e&&e.message)||''), 12000); }
    }
    App.회차들[d.열쇠] = d;
    /* 보냈으니 «다음 회차»로 넘어간다 — 같은 회차를 두 번 보내지 않는다 */
    const 보냄 = {}; Object.keys(App.회차들).forEach(k=>{ if((App.회차들[k]||{}).상태==='발송') 보냄[k]=1; });
    App.지금열쇠 = Core.이번회차(오늘(), 보냄).열쇠;
    toast(`📨 ${(j.n||r.ok.length).toLocaleString()}곳에 걸었습니다 (${j.eta||걸림})`, 12000);
  }catch(e){
    toast('걸지 못했습니다: ' + ((e&&e.message)||''), 12000);
  }finally{ App.보내는중 = false; render(); }
}

   지난 회차

function 지난회차화면(){
  /* ★ 두 칸이다 (대표 지시 2026-09-03 「지난회차를 클릭하면 오른쪽에 지난회차 보이게 하고
       왼쪽에는 차수별 내용이 순서대로 정리되게 해라. 넘버링 해라」).
     ⚠ 번호는 «최근이 1번»이다 — 회차가 늘면 옛 번호가 밀린다.
       그래서 번호는 «이름표가 아니라 세는 수»다. 회차 이름(2026년 08월 5주차)이 이름표다.
     ⚠ 고른 회차는 App.본회차 에 남는다 — 다른 칸에 갔다 와도 그대로 보인다. */
  const 열쇠들 = Object.keys(App.회차들).sort().reverse();
  if(!열쇠들.length) return '<div class="note">아직 만든 회차가 없습니다.</div>';
  /* 아무것도 안 고르셨으면 «맨 위(가장 최근)»를 보여 준다 — 빈 칸을 두지 않는다 */
  const 고른것 = (App.본회차 && App.회차들[App.본회차]) ? App.본회차 : 열쇠들[0];

  const 줄 = 열쇠들.map(function(k,i){
    const d = App.회차들[k] || {};
    const 회 = d.회차 || 회차로부터(k);
    const 수 = Core.꼭지들.reduce((a,g)=>a+(((d.안||{})[g.키]||[]).length),0)
             + (String(d.우리글||'').trim() ? 1 : 0);
    const 딱지 = { 초안:'b-draft', 시험:'b-test', 발송:'b-sent' }[d.상태] || 'b-draft';
    return '<tr class="pick' + (k===고른것 ? ' on' : '') + '" onclick="회차보기(\'' + k + '\')">'
      + '<td class="n">' + (i+1) + '</td>'
      + '<td><b>' + esc(회.이름||k) + '</b>'
        + '<div style="font-size:10.5px;color:var(--faint)">' + esc(회.기간||'') + '</div></td>'
      + '<td><span class="badge ' + 딱지 + '">' + esc(d.상태||'초안') + '</span></td>'
      + '<td>' + 수 + '건</td>'
      + '<td>' + (d.받는수 ? d.받는수.toLocaleString()+'곳' : '<span style="color:var(--faint)">—</span>') + '</td>'
      + '<td>' + (d.보낸때 ? new Date(d.보낸때).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '<span style="color:var(--faint)">—</span>') + '</td>'
      + '</tr>';
  }).join('');

  const 본것 = App.회차들[고른것] || {};
  const 본회 = 본것.회차 || 회차로부터(고른것);
  const 몇번 = 열쇠들.indexOf(고른것) + 1;

  return `
  <div class="cols" style="margin-top:12px">
   <div>
    <div class="box" style="margin:0">
     <h3>지난 회차 <span class="cnt">${열쇠들.length}</span><span class="sp"></span>
      <span style="font-size:11px;color:var(--faint)">줄을 누르면 오른쪽에 보입니다</span></h3>
     <table class="list"><tr><th class="n">#</th><th>회차</th><th>상태</th><th>실린 것</th>
       <th>받는 곳</th><th>보낸 때</th></tr>${줄}</table>
    </div>
    <div class="note"><b>이미 보낸 회차는 다시 못 보냅니다</b> —
     같은 뉴스레터를 두 번 받는 일이 없게 막아 두었습니다.
     고쳐서 보시려면 「이번 회차로 열기」로 열어 «보기만» 하십시오.<br>
     ⚠ 번호는 <b>최근이 1번</b>입니다. 회차가 늘면 밀리므로 «이름표»로 쓰지 마십시오 —
     이름표는 회차 이름(${esc(본회.이름||'')})입니다.</div>
   </div>

   <div class="pv">
    <div class="pvhd">👁 <b>${몇번}. ${esc(본회.이름||고른것)}</b><span class="sp"></span>
     <button class="mini" onclick="회차열기('${고른것}')">이번 회차로 열기</button>
     <button class="mini" onclick="회차크게('${고른것}')">크게</button></div>
    <div class="paper"><iframe id="pastFrame" title="지난 회차 미리보기"></iframe></div>
   </div>
  </div>`;
}

/* 지난 회차 미리보기를 그린다 — 「이번 회차」의 미리보기와 «같은 짓는 층»을 쓴다.
   ⚠ 여기서 편지를 다시 짜지 않는다. 두 벌이면 지난 회차가 실제로 나간 것과 달라 보인다. */
function 지난미리보기그리기(){
  const f = $('pastFrame'); if(!f) return;
  const 열쇠들 = Object.keys(App.회차들).sort().reverse();
  const k = (App.본회차 && App.회차들[App.본회차]) ? App.본회차 : 열쇠들[0];
  const d = App.회차들[k]; if(!d) return;
  const 편 = Tpl.편지짓기(Object.assign({}, d, { 범위: d.범위 || App.설정.범위 }), App.설정);

    try{ f.style.height = (f.contentDocument.body.scrollHeight + 8) + 'px'; }catch(_){}
  };

function 회차크게(k){

  const 편 = Tpl.편지짓기(Object.assign({}, d, { 범위: d.범위 || App.설정.범위 }), App.설정);

function 명단화면(){
  /* ★ 사본이 없다. 화면을 열 때마다 기업정보함(data/companies/v)에서 만든다.
       대표 지시 2026-09-03: 「매주 실시간으로 확인하고 싶다」
     ★ 계약종료·퇴사에 «여기서 할 일이 없다» — 기업정보함에서 상태를 바꾸거나
       담당자에 퇴사를 켜면 저절로 빠진다. 두 곳을 맞추려 하면 반드시 어긋난다. */
  const r = 명단셈();
  const 광고 = Core.광고표기필요한가(App.설정.범위);
  const 골랐수 = Object.keys(App.고른것 || {}).length;

  /* ★ 번호는 «보이는 차례»로 1번부터 붙인다 (대표 지시 2026-09-03 「넘버링해달라」).
       유형 → 회사 이름 차례로 늘어놓아, 같은 유형이 붙어 보인다.
     ⚠ 번호는 «이름표가 아니라 세는 수»다 — 거르면 다시 1번부터다.
       업체 번호처럼 고정된 것으로 여기면 「3번이 어제와 다르다」가 된다. */
  const 차례 = Core.유형들.reduce(function(m,t,i){ m[t.키]=i; return m; }, {});
  const 정렬 = r.ok.slice().sort(function(a,b){
    const d = (차례[a.유형]||0) - (차례[b.유형]||0);
    return d !== 0 ? d : String(a.company||'').localeCompare(String(b.company||''), 'ko');
  });
  /* 사람 칸을 «셋으로 갈랐다» — 이름 · 직책 · 연락처.
     대표 지시 2026-09-03: 「연락처를 아래에 두지말고 옆에두고 열을 일치시켜라」
     ⚠ 예전에는 연락처를 이름 «아래»에 작게 붙였다. 그러면 줄마다 높이가 달라지고
       연락처가 세로로 안 맞아 훑기 어렵다. 열로 가르면 저절로 맞는다.
     ⚠ 빈 칸은 흐린 「—」로 둔다 — 아예 비우면 어느 열이 무엇인지 헷갈린다. */
  const 빈칸 = '<span style="color:var(--faint)">—</span>';
  const 글칸 = function(v){ const t = String(v == null ? '' : v).trim(); return t ? esc(t) : 빈칸; };
  const 전화칸 = function(v){
    const t = String(v == null ? '' : v).trim();
    return t ? '<span class="tel">' + esc(t) + '</span>' : 빈칸;
  };
  const 줄 = 정렬.map(function(x,i){
    const t = Core.유형들.find(function(v){ return v.키 === x.유형; }) || Core.유형들[0];
    /* 「누구에게 가나」를 딱지로 — 담당자가 없어 대표자에게 가는 곳이 있다 */
    const 누구딱지 = x.누구 === '대표자'
      ? ' <span class="pill" style="background:#eff6ff;color:#1e40af">대표자</span>'
      : ' <span class="pill" style="background:#f1f5f9;color:var(--sub)">담당자</span>';
    return '<tr>'
      /* ★ 체크칸 — 넘버링 «왼쪽»에 (대표 지시 2026-09-03 「넘버링 왼쪽 표시 체크가능하게」).
           주소를 값으로 지닌다 — 골라 놓고 표를 다시 그려도 무엇을 골랐는지 잃지 않는다. */
      + '<td class="ck"><input type="checkbox" class="chk" value="' + esc(x.email) + '"'
        + (App.고른것[String(x.email).toLowerCase()] ? ' checked' : '')
        + ' onchange="고름바뀜(this)"></td>'
      + '<td class="n">' + (i+1) + '</td>'
      + '<td><span class="ty" style="background:' + t.연한빛 + ';color:' + t.진한빛 + '">'
        + t.표시 + ' ' + esc(t.키) + '</span></td>'
      + '<td><b>' + esc(x.company||'') + '</b></td>'
      + '<td>' + 글칸(x.대표자) + '</td>'
      + '<td class="tel">' + 전화칸(x.대표전화) + '</td>'
      + '<td>' + (x.누구 === '대표자' ? 빈칸 : 글칸(x.name)) + '</td>'
      + '<td>' + (x.누구 === '대표자' ? 빈칸 : 글칸(x.title)) + '</td>'
      + '<td class="tel">' + (x.누구 === '대표자' ? 빈칸 : 전화칸(x.전화)) + '</td>'
      + '<td>' + esc(x.email||'') + 누구딱지 + '</td>'
      + '<td style="text-align:right"><button class="mini" onclick="수신거부넣기(\'' + esc(x.email) + '\')">수신거부</button></td>'
      + '</tr>';
  }).join('');

  /* 유형 칩 — 업체관리 도구줄과 «같은 결»이다. 눌린 것을 다시 누르면 전체로 돌아온다. */
  const 칩 = '<div class="chips">'
    + '<button class="chip' + (App.유형 ? '' : ' on') + '" onclick="유형칩누르기(\'\')">📊 전체 '
      + (r.전체||[]).length.toLocaleString() + '</button>'
    + Core.유형들.map(function(t){
        const n = (r.유형셈||{})[t.키] || 0;
        const 켜짐 = App.유형 === t.키;
        return '<button class="chip' + (켜짐 ? ' on' : '') + '"'
          + (켜짐 ? ' style="background:' + t.빛 + ';border-color:' + t.빛 + '"'
                  : (n ? ' style="color:' + t.빛 + '"' : ''))
          + ' onclick="유형칩누르기(\'' + t.키 + '\')" title="' + esc(t.키) + ' 업체만 봅니다">'
          + t.표시 + ' ' + esc(t.키) + ' ' + n + '</button>';
      }).join('')
    + '</div>';

  const 빈곳 = (r.주소없는곳||[]).map(function(c){
    return '<tr><td><b>' + esc(c.name||'') + '</b></td>'
      + '<td style="color:var(--faint)">' + esc(c.id||'') + '</td>'
      + '<td style="text-align:right"><span class="badge b-draft">주소 없음</span></td></tr>';
  }).join('');

  return `
  <div class="hdbar">
    <span class="no">받는 곳 ${r.셈.보낼곳.toLocaleString()}곳${App.유형 ? ' <span style="font-size:13px;color:var(--brown)">('+esc(App.유형)+')</span>' : ''}</span>
    <span style="font-size:12px;color:var(--sub)">
      ${App.유형 ? '전체 '+(r.전체||[]).length.toLocaleString()+'곳 중 · ' : ''}기업정보함 ${(r.본곳||0).toLocaleString()}곳에서 ·
      수신거부 ${r.셈.수신거부} · 겹침 ${r.셈.겹침} · 형식틀림 ${r.셈.주소없음}</span>
    <span class="sp"></span>
    <button class="btn pri" onclick="노무사회엑셀()">↧ 공인노무사회 엑셀</button>
    <button class="mini" onclick="명단내보내기()">↧ CSV</button>
    <button class="mini" onclick="다시읽기()">⟳ 다시 읽기</button>
    <span class="badge ${광고?'b-test':'b-sent'}">
      ${esc(App.설정.범위||'자문중')}${광고?' · (광고) 켜짐':''}</span>
  </div>

  ${칩}

  ${골랐수 ? `<div class="picked">
    <b>${골랐수}곳</b> 골랐습니다
    <span class="sp"></span>
    <button class="mini" onclick="고른것엑셀()">↧ 고른 것만 엑셀</button>
    <button class="mini" onclick="고른것수신거부()">🚫 고른 것만 수신거부</button>
    <button class="mini" onclick="고름지우기()">✕ 선택 풀기</button>
   </div>` : ''}

  <div class="whorest">
  ${r.ok.length ? `<div class="box">
    <h3>보낼 곳 <span class="cnt">${r.ok.length}</span>
      ${App.유형 ? `<span style="font-size:11.5px;color:var(--sub)">${esc(App.유형)}만 봅니다 —
        「전체」를 누르면 다 보입니다</span>` : ''}</h3>
    <table class="list"><tr>
      <th class="ck"><input type="checkbox" id="chkAll" onchange="전체선택(this)"
        title="이 표에 보이는 것 모두"></th>
      <th class="n">#</th><th>유형</th><th>회사</th>
      <th>대표자</th><th class="tel">연락처</th>
      <th>담당자</th><th>직책</th><th class="tel">연락처</th>
      <th>보낼 주소</th><th></th></tr>${줄}</table></div>`
   : (App.유형
      ? `<div class="note"><b>${esc(App.유형)} 업체 가운데 보낼 곳이 없습니다.</b>
         「전체」를 누르면 다시 다 보입니다.</div>`
      : '<div class="note bad">보낼 곳이 없습니다 — 기업정보함에 담당자 이메일이 있어야 합니다.</div>')}

  ${빈곳 ? `<div class="box">
    <h3>⚠ 주소가 없어 못 보내는 곳 <span class="cnt">${r.주소없는곳.length}</span></h3>
    <div class="pad hint" style="padding-bottom:0">기업정보함에서 이 곳들의 <b>담당자 이메일</b>을
     채우시면 다음부터 저절로 들어옵니다. 여기서 지울 일은 없습니다.</div>
    <table class="list"><tr><th>회사</th><th>사업장 번호</th><th></th></tr>${빈곳}</table></div>` : ''}

  ${App.유형 === '자문' ? '' : `<div class="note"><b>지금 기본값은 「자문」입니다</b>
   (대표 결정 2026-09-03). 지금은 <b>${App.유형 ? esc(App.유형) : '전체'}</b>를 보고 계십니다 —
   <b>📋 자문</b> 칩을 누르시면 정해 둔 자리로 돌아옵니다.</div>`}

  <div class="note bad"><b>명단 범위가 곧 법 판단입니다 (정보통신망법 50조).</b><br>
   <b>자문 계약이 살아 있는 곳</b>에만 보내면 거래관계 안이라 대체로 수월합니다.
   그래서 기본값을 <b>「자문」</b>으로 두었습니다 — 급여·노조·기금도 거래관계라
   보내도 되지만, <b>대표께서 자문에만 보내기로 정하셨습니다.</b><br>
   <b>명함 전부</b>로 넓히면 사전 동의 · 제목 (광고) 표기 · 수신거부 방법 ·
   2년마다 동의 확인이 필요해집니다.<br>
   설정에서 범위를 넓히시면 <b>(광고) 표기와 안내가 저절로 켜집니다</b> — 잊고 넓히는 일이 없게.
   다만 <b>사전 동의를 받는 일은 사람이 해야 합니다.</b></div>
  </div>`;
}

/* CSV 든 이메일 목록이든 한 길로 받는다 — 두 길로 두면 「어느 쪽이었지」가 된다 */
/* 명단을 CSV 로 — 지금 화면에 보이는 «그대로»(기업정보함에서 방금 만든 것) */
function 명단내보내기(){
  const r = 명단셈();
  const 머리 = '회사,담당자,이메일,직책';
  const 몸 = r.ok.map(function(x){
    return [x.company,x.name,x.email,x.title]
      .map(v=>{ const s=String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; })
      .join(',');
  }).join('\r\n');
  /* 첫머리 BOM — 없으면 엑셀이 한글을 깨뜨린다 (기업정보함 toCsv 와 같은 규칙) */
  const blob = new Blob(['\ufeff' + 머리 + '\r\n' + 몸 + '\r\n'], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '뉴스레터-명단-' + 오늘() + '.csv';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}

/* 공인노무사회(mng.nomu.kr) 「엑셀일괄 등록」에 올릴 엑셀을 만든다.
   대표께서 2026-09-03 그 화면을 보여 주셨다 — 뉴스레터를 그쪽 시스템이 보내고,
   푸른노무법인은 거기에 엑셀로 명단을 올린다. 올린 결과 칸이 대상자·메일주소·비고 였다.
   ⚠ 그쪽 「대상자」는 회사 이름이다(사람 이름이 아니다). 담당자는 비고로 보낸다.
   ⚠ 번호를 붙인다 — 그쪽 명단이 113줄인데 우리 셈이 110곳이라, 어느 줄이 다른지
     눈으로 맞춰 보려면 번호가 있어야 한다. */
function 노무사회엑셀(){
  const r = 명단셈();
  if(!r.ok.length) return toast('보낼 곳이 없습니다');
  const f = Core.노무사회양식(r.ok);
  if(!window.XLSXGEN) return toast('엑셀 도구를 못 읽었습니다 — 새로 고쳐 보세요', 8000);
  const 이름 = '뉴스레터-발송대상자-' + 오늘() + '.xlsx';
  try{
    XLSXGEN.download({
      sheet: '발송대상자',
      title: '푸른노무법인 뉴스레터 발송대상자',
      sub: '기업정보함에서 뽑음 · ' + 오늘() + ' · 범위 ' + (App.설정.범위||'자문중')
         + ' · ' + f.줄들.length + '곳',
      headers: f.머리, rows: f.줄들,
      colRatios: [1, 6, 6, 4], landscape: false
    }, 이름);
    toast('📗 ' + f.줄들.length + '곳을 엑셀로 받았습니다 — 공인노무사회 「엑셀일괄 등록」에 올리세요', 12000);
  }catch(e){ toast('엑셀을 만들지 못했습니다: ' + ((e&&e.message)||''), 8000); }
}

/* 유형 칩 — 눌린 것을 다시 누르면 전체로 돌아온다(업체관리 칩과 같은 결).
   ⚠ 이 값은 «보내는 곳»까지 바꾼다. 그래서 고른 채로 다른 칸에 갔다 와도
     칩이 그대로 켜져 있어야 한다 — 조용히 풀리면 골라 둔 줄 알고 전부에 보낸다. */
function 유형칩누르기(v){
  App.유형 = (App.유형 === v) ? '' : String(v || '');
  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   고르기 — 체크칸 · 전체 선택 · 고른 것만 처리
   ══════════════════════════════════════════════════════════════════════════
   대표 지시 2026-09-03: 「넘버링 왼쪽 표시 체크가능하게 일괄 선택등 가능하게」

   ★ 고른 것을 «주소»로 지닌다(App.고른것). 표를 다시 그려도 무엇을 골랐는지 잃지 않는다 —
     번호나 줄 위치로 지니면 유형 칩을 누르는 순간 엉뚱한 곳이 골라진다.
   ⚠ 고른 것이 없으면 «묻지도 않고» 멈춘다. 빈 선택으로 110곳을 건드리면 사고다. */
function 고름바뀜(el){
  const e = String(el && el.value || '').trim().toLowerCase();
  if(!e) return;
  if(el.checked) App.고른것[e] = 1; else delete App.고른것[e];
  고름띠고치기();
}

/* 이 표에 «보이는 것» 모두 — 유형 칩으로 걸러진 것만이다. 안 보이는 것을 몰래 고르지 않는다. */
function 전체선택(el){
  document.querySelectorAll('.chk').forEach(function(c){
    c.checked = !!el.checked;
    const e = String(c.value||'').trim().toLowerCase();
    if(!e) return;
    if(el.checked) App.고른것[e] = 1; else delete App.고른것[e];
  });
  고름띠고치기();
}

/* 지금 화면에 보이는 것 가운데 골라진 줄들 */
function 고른것(){
  const r = 명단셈();
  return r.ok.filter(x => App.고른것[String(x.email||'').toLowerCase()]);
}

function 고름지우기(){ App.고른것 = {}; render(); }

/* 띠만 고쳐 그린다 — render() 를 부르면 체크칸이 다시 만들어져 깜빡인다 */
function 고름띠고치기(){
  const n = Object.keys(App.고른것).length;
  const 띠 = document.querySelector('.picked');
  if(!띠 && n) { render(); return; }          /* 없던 띠를 띄울 때만 다시 그린다 */
  if(띠 && !n) { render(); return; }
  if(띠) { const b = 띠.querySelector('b'); if(b) b.textContent = n + '곳'; }
}

/* 고른 것만 엑셀 — 공인노무사회 양식 그대로(번호·대상자·메일주소·비고) */
function 고른것엑셀(){
  const 골 = 고른것();
  if(!골.length) return toast('고른 곳이 없습니다');
  if(!window.XLSXGEN) return toast('엑셀 도구를 못 읽었습니다 — 새로 고쳐 보세요', 8000);
  const f = Core.노무사회양식(골);
  try{
    XLSXGEN.download({
      sheet:'발송대상자', title:'푸른노무법인 뉴스레터 발송대상자 (고른 것)',
      sub:'고른 ' + f.줄들.length + '곳 · ' + 오늘(),
      headers:f.머리, rows:f.줄들, colRatios:[1,6,6,4], landscape:false
    }, '뉴스레터-발송대상자-고른것-' + 오늘() + '.xlsx');
    toast('📗 고른 ' + f.줄들.length + '곳을 엑셀로 받았습니다', 9000);
  }catch(e){ toast('엑셀을 만들지 못했습니다: ' + ((e&&e.message)||''), 8000); }
}

/* 고른 것만 수신거부 — 뉴스레터만 막는다(자료 발송은 그대로 간다) */
async function 고른것수신거부(){
  const 골 = 고른것();
  if(!골.length) return toast('고른 곳이 없습니다');
  if(!confirm('고른 ' + 골.length + '곳에 뉴스레터를 보내지 않습니다.\n'
    + '(자료 발송은 그대로 갑니다)\n\n'
    + 골.slice(0,5).map(x=>' · ' + (x.company||'') + ' — ' + x.email).join('\n')
    + (골.length>5 ? '\n … 그 밖 ' + (골.length-5) + '곳' : '')
    + '\n\n넣을까요?')) return;
  const upd = {};
  골.forEach(function(x){
    const e = String(x.email||'').trim().toLowerCase();
    if(!e) return;
    upd[e.replace(/[.#$/[\]]/g,'_')] = { email:e, at:Date.now(), by:(App.me&&App.me.email)||'' };
  });
  try{
    await db.ref('newsletter/blocked').update(upd);
    Object.keys(upd).forEach(function(k){ App.막은주소[k] = 1; });
    골.forEach(function(x){ App.막은주소[String(x.email||'').toLowerCase()] = 1; });
    App.고른것 = {};
    render();
    toast('🚫 ' + 골.length + '곳을 수신거부에 넣었습니다', 9000);
  }catch(e){ toast('넣지 못했습니다: ' + ((e&&e.message)||''), 8000); }
}

/* 기업정보함을 «다시» 읽는다 — 방금 고친 것이 바로 보이게.
   ⚠ 사본이 없으니 「담기」가 없다. 새로 고치면 그때의 기업정보함이 그대로 명단이다. */
async function 다시읽기(){
  try{
    const v = await db.ref('data/companies/v').once('value');
    App.사업장들 = v.val() || {};
    render();
    toast('기업정보함을 다시 읽었습니다 — 받는 곳 ' + 명단셈().셈.보낼곳.toLocaleString() + '곳');
  }catch(e){ toast('다시 읽지 못했습니다: ' + ((e&&e.message)||''), 7000); }
}

/* 이 주소로는 뉴스레터를 안 보낸다.
   ⚠ 기업정보함을 «건드리지 않는다» — 거래처가 「뉴스레터는 그만」이라 해도
     자료 발송은 계속 받아야 한다. 그래서 뉴스레터만의 막은 명단에 담는다.
   ⚠ 공용 수신거부(config/mailBlock)에 담으면 그 곳에 «아무 메일도» 못 간다. */
async function 수신거부넣기(주소){
  const e = String(주소||'').trim().toLowerCase();
  if(!e) return;
  if(!confirm(e + '\n\n이 주소로 뉴스레터를 보내지 않습니다.\n(자료 발송은 그대로 갑니다)\n\n넣을까요?')) return;
  const 열 = e.replace(/[.#$/[\]]/g, '_');
  try{
    await db.ref('newsletter/blocked/' + 열).set({ email: e, at: Date.now(),
      by: (App.me && App.me.email) || '' });
    App.막은주소[e] = 1; App.막은주소[열] = 1;
    render();
    toast('수신거부에 넣었습니다 — ' + e);
  }catch(err){ toast('넣지 못했습니다: ' + ((err&&err.message)||''), 7000); }
}

/* 서버에 「가져와라」고 시킨다.
   ⚠ 결과를 «화면에 그대로» 보여 준다 — 실패하면 까닭까지. 조용히 넘기면
     아무것도 안 왔는데 왜인지 아무도 모른다. */
const ILABOR_FN_URL = 'https://asia-northeast3-pureun-erp.cloudfunctions.net/ilaborPull';
var _노무사회중 = false;
async function 노무사회가져오기(방식){
  if(_노무사회중) return toast('가져오는 중입니다 — 잠시만');
  const 바쁨 = $('ilaborBusy'), 칸 = $('ilaborOut');
  _노무사회중 = true;
  if(바쁨) 바쁨.textContent = '⏳ 가져오는 중… (상세+첨부는 1분 넘을 수 있습니다)';
  if(칸) 칸.textContent = '';
  try{
    const u = firebase.auth().currentUser;
    if(!u) throw new Error('로그인이 풀렸습니다');
    const token = await u.getIdToken();
    const res = await fetch(ILABOR_FN_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + token },
      body: JSON.stringify({ mode: 방식, limit: 10 })
    });
    let j=null; try{ j = await res.json(); }catch(_){}
    if(!res.ok || !j || !j.ok){
      /* ⚠ 서버가 준 답을 «오류에 실어» 보낸다 — 걸음·막힌 주소·까닭이 거기 있다.
           메시지 한 줄만 던지면 화면이 그것밖에 못 보여 준다. */
      const err = new Error((j&&j.error) || ('서버 응답 ' + res.status));
      err.답 = j || null;
      throw err;
    }
    if(칸) 칸.textContent = JSON.stringify(j, null, 2).slice(0, 4000);
    toast(방식==='peek' ? '🔍 엿보기 끝 — 아래에 결과가 있습니다'
        : ('✅ ' + (j.목록수||0) + '건 훑고 ' + ((j.가져온것||[]).length || j.새것 || 0) + '건 담았습니다'), 9000);
  }catch(e){
    const 말 = (e&&e.message) || String(e);
    /* ⚠ 한 줄만 보여 주면 고칠 수가 없다 — 서버가 준 «걸음·막힌 주소·까닭»을 다 펼친다.
         2026-09-04 에 「fetch failed」 한 줄만 보고 어디서 막혔는지 몰라 헤맸다. */
    if(칸){
      const 속 = (e && e.답) || null;
      칸.textContent = '✗ ' + 말 + (속 ? '\n\n' + JSON.stringify(속, null, 2).slice(0, 4000) : '');
    }
    toast('가져오지 못했습니다: ' + 말, 12000);
  }finally{
    _노무사회중 = false;
    if(바쁨) 바쁨.textContent = '';
  }
}
function 설정저장(){
  const g = id => { const el=$(id); return el ? el.value : ''; };
  App.설정 = Object.assign({}, App.설정, {
    범위: g('cfgScope') || '자문중',
    회사이름: g('cfgName') || '푸른노무법인',
    회신주소: g('cfgReply'),
    꼬리한줄: g('cfgFoot'),
    주소: g('cfgAddr'),
    전화: g('cfgTel'),
    보내는주소: g('cfgFrom'),
    대표자도: g('cfgCeo') !== 'n',
    추적밑주소: g('cfgTrack'),
    배너그림: g('cfgBanner'),
    로고그림: g('cfgLogo')
  });
  db.ref('newsletter/config').update(App.설정)
    .then(()=>toast('저장했습니다'))
    .catch(e=>toast('저장 실패: ' + ((e&&e.message)||''), 7000));
}
