<!--
  뉴스레터 관리 — 매주 한 통을 «짓고 · 보고 · 보낸다».
  ═══════════════════════════════════════════════════════════════════════════
  대표 지시 2026-09-02: 「푸른내외관리에 뉴스레터관리를 넣고 매주 관리하고 싶다.
  우선 매주 공인노무사회에서 받아서 전달하는 구조이다 이부분을 똑같은 디자인으로
  새로만들고 매주 푸른노무법인에서 직접 메일로 보내고 싶다. … 직접만드는 방식과
  전달방식 그리고 직접만드는것도 전달된것을 똑같이 만드는 방식등 여러가지 검토해서 완성해달라」

  목업: docs/mockups/newsletter-letter.html (편지) · newsletter-screen.html (화면)

  ★ 판단은 전부 js/pu-news-core.js 가, 편지 짓기는 js/pu-news-tpl.js 가 한다.
    화면은 그 답을 보여주고 손잡이만 단다. 같은 판단을 화면 안에서 다시 만들면
    두 곳이 서로 다른 답을 낸다(홈페이지 관리와 같은 짜임).

  ★ 보내는 것은 «새 발송기를 만들지 않는다» — 이미 도는 sendBulkMail 에 건다.
    한 곳마다 예약 한 건씩 걸리고 sendScheduledMail 이 15분마다 빼 간다.
    한꺼번에 쏟으면 다음메일 계정이 막히고, 막히면 평소 자료 발송까지 멈춘다.

  ★ 총괄관리자 전용이다 — 경력관리·홈페이지 관리와 «같은 줄, 같은 잣대».
    한때 「짓는 것은 직원도」로 두려 했으나, 자동으로 담을 밑감(homepage/newsBrief)이
    관리자만 읽는 자리라 직원에게 열려면 홈페이지 관리의 문까지 함께 열어야 했다.
    권한을 «못 읽었을 때»도 열지 않는다 — 못 읽은 것을 권한 있음으로 치면 막는 뜻이 없다.
-->

<style>
:root{
  --navy:#1e40af; --ink:#1e293b; --sub:#64748b; --faint:#94a3b8;
  --line:#e2e8f0; --paper:#f8fafc; --card:#fff;
  --brown:#6f5a48; --brown-soft:#f5f1ec;
  --ok:#166534; --warn:#d97706; --bad:#dc2626;
}
*{box-sizing:border-box;margin:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--paper);color:var(--ink);font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}

#bar{display:flex;align-items:center;gap:10px;padding:13px 16px;background:#fff;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
#bar .logo{font-size:19px;font-weight:800;letter-spacing:-.4px}
#bar .sp{flex:1}
#whoami{font-size:11.5px;font-weight:700;color:var(--sub)}

/* ── 탭을 화면 위에 붙여 둔다 (대표 지시 2026-09-02 「상단 틀 고정필요하다 피시도 같다」) ──
   기사 서른한 건·받는 명단 수백 줄을 굴려 내려가면 탭이 사라져, 다른 회차로 가려면
   맨 위까지 되올라가야 했다.
   ⚠ 폰·PC 를 «같이» 붙인다 — 대표 지시가 그렇고, 굴러야 하는 길이는 PC 도 같다.
   ⚠ 머리줄(#bar)은 안 붙인다. 로고와 계정뿐이라 늘 볼 까닭이 없고, 둘 다 붙이면
     화면 위 95px 가 통째로 사라진다. 탭만 붙이면 45px 다.
   ⚠ 위에 얹히는 것들(모달·토스트)보다 낮게 둔다. */
#tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);background:#fff;
  padding:0 10px;overflow-x:auto;
  position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(15,23,42,.05)}
#tabs button{padding:11px 15px;font-size:15px;font-weight:700;color:var(--sub);
  border:0;background:none;border-bottom:3px solid transparent;white-space:nowrap}
#tabs button.on{color:var(--ink);border-bottom-color:var(--brown)}

/* ← 1180px 에서 넓혔다(2026-09-02). 좌우를 5:5 로 «나누기만» 하면 각 칸이 570px 밖에
     안 되어 예전 오른쪽 칸(420px)보다 조금 나은 정도가 된다. 넓히지 않으면 5:5 가 손해다. */
/* ★ 온 화면을 다 쓴다 (대표 지시 2026-09-03 「좌우 여백 필요없다」).
   ⚠ max-width 를 되살리지 말 것 — 꼭지 넷을 2×2 로 놓을 폭이 여기서 나온다. */
.wrap{max-width:none;margin:0;padding:0 10px 60px}
#gate{max-width:520px;margin:60px auto;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:26px;text-align:center}
#gate .sub{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.7}

.hdbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:14px}
.hdbar .no{font-size:18px;font-weight:800}
.hdbar .sp{flex:1}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px}
.b-draft{background:#f1f5f9;color:var(--sub)}
.b-test{background:#fef3c7;color:var(--warn)}
.b-sent{background:#dcfce7;color:var(--ok)}
.btn{font-weight:700;font-size:13px;padding:8px 14px;border-radius:9px;
  border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--brown);border-color:var(--brown);color:#fff}
.btn.warn{border-color:#fcd34d;color:var(--warn)}
.mini{font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;
  border:1px solid var(--line);background:#fff;color:var(--sub)}
.mini.on{background:var(--brown);border-color:var(--brown);color:#fff}

/* ★ 담는 법 — 카드 셋을 «한 줄 띠»로 (대표 지시 2026-09-05 「크기 좀 줄여라,
   불필요한 내용 줄이고」). 카드 셋이 세로로 200px 쯤 잡아먹어, 정작 짓는 곳인
   꼭지가 그만큼 아래로 밀려 있었다. */
.ways{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 13px}
.ways .lab{font-size:11.5px;font-weight:800;color:var(--sub);white-space:nowrap}
.ways .sep{width:1px;height:16px;background:var(--line)}
.ways .tail{margin-left:auto;font-size:11px;color:var(--faint)}
.ways .tail a{color:var(--sub);cursor:pointer;text-decoration:underline}
.way.on{box-shadow:0 0 0 2px var(--brown-soft)}
.law-ok{background:#dcfce7;color:var(--ok)}
.law-mid{background:#fef3c7;color:var(--warn)}
.law-bad{background:#fee2e2;color:var(--bad)}

/* 대표 지시 2026-09-02: 「좌측에 채울것과 우측에 나갈 모습 크게 5:5로」 */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px;
  align-items:start}
/* 회차 줄이 왼쪽 칸의 «첫 줄»이 되었다 — .cols 가 이미 위 여백을 주므로 겹치지 않게 */
.colL>.hdbar{margin-top:0;margin-bottom:10px}
/* ★★★ 꼭지를 «탭»으로 (대표 지시 2026-09-08)
   ═══════════════════════════════════════════════════════════════════════════
   「주간, 고용, 판례 인사 등 각각의 화면으로 각각의 내용을 선택할 수 있게
    탭을 다시 정렬해라」

   ■ 여기까지 온 길 — 같은 탈을 세 번 고쳤다
     ① 한 줄로 쌓기      → 주간노동뉴스 8건이 끝나야 둘째 꼭지가 나왔다
     ② 2×2 로 나란히     → 넷이 다 보이지만 «한 꼭지에 넷쯤»만 보였다
     ③ 탭 (지금)         → 한 번에 한 꼭지, 그 대신 «그 꼭지를 다 보여 준다»
   ★ 실측(2026-09-08): 2×2 에서는 판례 칸에 한 건이 겨우 들어갔다 — 요지가 길어
     한 건이 칸을 다 먹었다. 탭으로 나누니 같은 자리에 네 건이 다 들어온다.
   ★ 탭 숫자는 «실릴 것 / 담긴 것»이다. 다른 꼭지를 보고 있어도 어디가 비었는지 안다 —
     이것이 없으면 탭은 «안 보이는 것을 늘리는» 셈이 된다.
   ⚠ 탭줄은 높이가 일정하다. 칸 하나가 남은 자리를 다 쓰고, 넘치는 것은 그 «안»에서
     구른다 — 그래서 무엇을 더 담아도 아래가 잘리지 않는다. */
.jartabs{display:flex;gap:4px;padding:8px 8px 0;background:#fff;flex-wrap:wrap;
  border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0}
.jartabs button{background:none;border:1px solid transparent;border-bottom:0;font-family:inherit;
  padding:8px 12px 9px;font-size:12.5px;font-weight:800;color:var(--sub);cursor:pointer;
  border-radius:9px 9px 0 0;display:flex;align-items:center;gap:6px}
.jartabs button:hover{background:var(--paper)}
.jartabs button.on{background:var(--brown-soft);border-color:var(--line);color:#4a3c2e}
.jartabs .n{font-size:11px;font-weight:700;color:var(--faint)}
.jartabs button.on .n{color:var(--brown)}
.jartabs .n b{color:var(--ok)}
.jarpanel{background:#fff;border:1px solid var(--line);border-radius:0 0 12px 12px;
  display:flex;flex-direction:column;min-height:0;min-width:0}
.jarhead{display:flex;align-items:center;gap:8px;padding:9px 13px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);background:var(--paper);flex:0 0 auto}
.jarhead .ttl{font-size:13px;font-weight:800}
.jarhead .sp{flex:1}
.jarpanel>.jarbody{overflow-y:auto;min-height:0;flex:1}

/* ★★ ㅁ — 「이번 편지에 실을까」 (대표 지시 2026-09-08
     「골라서 빼거나 넣을 수 있게 하려면 ㅁ 로 체크하게 해달라」)
   ⚠ ✕ 와 «뜻이 다르다» — ✕ 는 목록에서 아예 없애고, ㅁ 는 목록에 두고 편지에서만 뺀다.
   ⚠ 꺼진 줄을 «감추지 않는다». 목록에서 사라지면 왜 안 나가는지 알 수 없고,
     다시 켤 길도 없어진다. 흐리게 + 취소선 + 딱지로 «보이게» 둔다. */
.item>.ck{flex:0 0 auto;width:17px;height:17px;margin:1px 0 0;cursor:pointer;
  accent-color:var(--brown)}
.item.off{background:#fcfcfd}
.item.off .t,.item.off .src{color:var(--faint)}
.item.off .t{text-decoration:line-through;text-decoration-color:#cbd5e1}
/* ⚠ inline-block 이라야 «취소선이 이 딱지까지 그어지지 않는다» — 취소선은
     자식에게 물려 내려가고, 자식이 no 로 끌 수가 없다. 새 칸을 만들어 끊는다. */
.offtag{display:inline-block;font-size:10.5px;font-weight:800;color:var(--warn);
  background:#fffbeb;border:1px solid #fde68a;border-radius:20px;padding:1px 7px;
  margin-left:5px;white-space:nowrap;vertical-align:1px}

/* ★ 노무사회 서랍의 한 줄 — 2026-09-05 에 제목이 «한 글자씩 세로로» 쌓였다.
   ⚠ 까닭: 꼭지 고르개(select)에 「판례·재결례·행정해석」 같은 긴 글이 들어 있어
     제 속내 너비가 크게 잡혔다. 줄이 넘치자 min-width:0 인 제목 칸이 «0 까지»
     짜부라져 한 글자 폭이 됐다. 제목은 멀쩡한데 볼 수가 없었다.
   → 고르개에 너비 한도를 두고 «줄어들 수 있게» 한다. 제목에는 바닥을 준다. */
.ilrow{align-items:center}
.ilrow .t{flex:1 1 auto;min-width:120px;word-break:break-all}
.ilrow .src{flex:0 0 auto}
.ilrow>select{flex:0 1 auto;max-width:150px;min-width:74px;font-size:11px;
  padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--sub)}
.ilrow>input[type=checkbox]{flex:0 0 auto;margin:0}
@media(max-width:980px){.cols{grid-template-columns:1fr}}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.box>h3{font-size:14px;font-weight:800;padding:12px 15px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.box>h3 .cnt{font-size:11px;font-weight:800;color:var(--sub);background:var(--paper);
  padding:2px 8px;border-radius:99px}
.box>h3 .sp{flex:1}
/* ⚠ 2026-09-03 대표 지시 「화면 잘린다 이부분 어떻게 해야하나」 —
     여기가 그 자리였다. .item .t 에 white-space:nowrap 이 걸려 제목을 한 줄로 강제하고
     넘치면 잘랐다. 거기에 꼭지를 2×2 로 놓아 칸이 또 반이 되었다.
     실제로 재 보면 1400px 창에서 제목에 남는 폭이 «165px — 한글 열 자쯤»이었다.
   ★ 제목은 «빼고 말고를 정하려고» 읽는 것이다. 자르면 그 일을 못 한다. 줄을 넘긴다.
     줄이 늘어 길어지는 것은 왼쪽 칸이 구르니 괜찮다 — 못 읽는 것이 더 나쁘다.
   ⚠ align-items 를 flex-start 로 — 가운데 정렬이면 두 줄 제목 옆에서 ▲▼✕ 가
     가운데로 내려가 줄이 안 맞는다.
   ⚠ word-break:keep-all — 한글은 낱말째로 넘겨야 한다. 글자 가운데서 끊기면 읽기 어렵다. */
.item{display:flex;align-items:flex-start;gap:9px;padding:9px 15px;border-bottom:1px solid #f1f5f9}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0;font-size:13.5px;line-height:1.5;word-break:keep-all;
  overflow-wrap:anywhere}
.item .src{font-size:11px;color:var(--faint);flex:0 0 auto;padding-top:2px}
/* 자료·판례의 «곁줄» — 목차·내려받을 파일·인용.
   ★ 제목 한 줄로는 「이대로 나가도 되나」를 정할 수 없다. 대표 지시 2026-09-05
     「데이터를 다운받아서 확인할 수 있게」가 이 줄이다. */
.item .곁{margin-top:4px;font-size:11.5px;line-height:1.65;color:var(--faint);
  word-break:keep-all;overflow-wrap:anywhere}
.item .곁 a{color:var(--navy);text-decoration:none}
.item .곁 a:hover{text-decoration:underline}
.item .곁 .mini{font-size:11px;padding:1px 6px}
.item .x,.item .mv{border:0;background:none;color:var(--faint);font-size:13px;padding:2px 5px}
.item .x:hover{color:var(--bad)}
.empty{padding:16px 15px;font-size:13px;color:var(--faint)}
.pad{padding:12px 15px}
textarea,input[type=text],input[type=url],select{width:100%;border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;line-height:1.7}
textarea{resize:vertical}
label.f{display:block;font-size:12px;font-weight:800;color:var(--sub);margin:12px 0 5px}
label.f:first-child{margin-top:0}
/* 설정 — 짧은 칸은 두 줄로 나란히. 대표 지시 2026-09-03 「좀더 컴팩트하게 … 추가로 더
   넣을 내용이 있을 수 있으니 그부분도 반영해서 공간 정리」. 칸을 더해도 자리가 남는다. */
/* 체크칸 — 넘버링 왼쪽. 대표 지시 2026-09-03 「넘버링 왼쪽 표시 체크가능하게」 */
table.list th.ck,table.list td.ck{width:34px;text-align:center;padding-left:10px;padding-right:0}
/* 연락처 열 — 대표 지시 2026-09-03 「연락처를 아래에 두지말고 옆에두고 열을 일치시켜라」.
   ⚠ 숫자 폭을 고정한다(tabular-nums) — 010-1234-5678 처럼 자릿수가 같아도 글꼴에 따라
     0 과 1 의 폭이 달라 세로로 어긋난다. 열을 갈라도 그것까지 맞춰야 훑기 편하다. */
table.list th.tel,table.list td.tel{white-space:nowrap;font-variant-numeric:tabular-nums;
  font-feature-settings:'tnum';color:var(--sub);font-size:12.5px;width:118px}
table.list .chk,table.list #chkAll{width:15px;height:15px;cursor:pointer;accent-color:var(--brown)}
/* 고른 것이 있을 때만 뜨는 띠 — 얼린 머리 바로 밑에 붙어 «몇 곳 골랐는지»를 늘 보여 준다 */
.picked{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;

  padding:8px 13px;font-size:13px;color:var(--ink)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid2 .wide{grid-column:1 / -1}

.sect{font-size:12px;font-weight:800;color:var(--brown);background:var(--brown-soft);
  padding:6px 15px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.hint{font-size:11.5px;color:var(--faint);margin-top:6px;line-height:1.65}

.pv{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:12px}
/* ⚠ 머리띠와 여백을 얇게 (대표 지시 2026-09-06 「뉴스레터 화면 더 위로 올려라」).
     11px+13px+11px 짜리 띠와 12px 여백이 편지를 40px 넘게 눌러 내리고 있었다.
     편지를 보시는 자리라 «편지가 차지하는 높이»가 값이다. */
/* ★★ 오른쪽 칸 — 「이번 편지, 핵심만」 (대표 지시 2026-09-08)
     「화면 내용이 너무 길고 아래로 계속 내려야 한다 — 간략히 핵심만 설명하고
      내용은 팝업창으로 안 되나?」
   ★ 여기에는 편지 «전문»이 들어 있었다. 굴려도 끝이 없어, 정작 「무엇이 빠졌나」는
     끝까지 굴려야 알았다. 이제 굴릴 것이 없다 — 전문은 「크게 보기」 팝업이다.
   ⚠ 값(px)을 박지 않는다. 줄이 몇이든 제 키만 쓴다 — 굴릴 것이 없으므로 한도가 필요없다. */
.sum .ttl{font-size:15px;font-weight:800;line-height:1.5;padding:13px 14px;

table.list{width:100%;border-collapse:collapse;font-size:13px}
/* ── 설정 3열 격자 (대표 결정 2026-09-03 「가」) ──
   ⚠ 좁은 화면에서는 두 열 → 한 열로 접힌다. 3열을 그대로 밀어붙이면
     노트북·폰에서 칸이 짜부라져 주소가 안 보인다. */
.pad.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 12px}
/* ★ 설정이 «반 폭»으로 들어갔다 (대표 지시 2026-09-07)
     「뉴스레터 설정 화면은 정리해서 왼쪽절반에 넣고 자료 가지고 오는것은 오른쪽절반으로」
   ⚠ 그 폭에 3열을 밀면 칸이 짜부라진다 — 반 폭에서는 «2열»이다.
   ⚠ 폰에서는 .cols 가 위아래로 접고, 더 좁아지면 이 격자도 한 열이 된다
     (대표 확인 2026-09-07 「폰에서는 목업대로 그러나 피시에서는 좌우 화면으로」). */
.pad.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 12px}
.pad.g2 .w2{grid-column:span 2}
@media(max-width:560px){ .pad.g2{grid-template-columns:1fr}
  .pad.g2 .w2{grid-column:span 1} }
/* 묶음 가르기 — 머리 «줄»을 새로 만들지 않는다.
   2026-09-03 에 「① ② ③」 세 줄을 없앴는데, 다시 만들면 그 세 줄이 되돌아온다.
   얇은 금 하나면 어디서 갈리는지 알 수 있다. */
.pad.g2 .sep{grid-column:1/-1;margin:13px 0 0;border-top:1px dashed var(--line);
  padding-top:9px;font-size:11.5px;font-weight:800;color:var(--faint)}
/* 접는 칸 — «한 번 넣으면 안 건드리는» 것들(그림·열람 추적)을 여기 둔다.
   ⚠ 지운 것이 아니다. 접기만 한다 — 지우면 나중에 왜 안 되는지 아무도 모른다.

   ★★ 접는 줄은 «단추처럼» 보여야 한다 (대표 2026-09-08 「설정 어디에 있는지 모르겠다」)
     ═══════════════════════════════════════════════════════════════════════
     처음에는 회색 글씨에 작은 삼각형뿐이었다. 그러니 «안내문»으로 읽혀,
     대표께서 옆 사진 주소를 넣으려고 한참 찾으셨다 —
     내가 접어 놓고 「설정에서 넣으시면」이라 말씀드린 탓이다.
   ⚠ 접기는 자리를 아끼는 일이고, «못 찾게 하는 일»이 아니다.
     감춘 것이 있으면 「여기 열 것이 있다」를 눈에 보이게 말해야 한다. */
details.fold{grid-column:1/-1;margin-top:12px;border:1px solid var(--brown-soft);
  border-radius:9px;background:var(--brown-soft);overflow:hidden}
details.fold[open]{background:var(--paper);border-color:var(--line)}
details.fold>summary{cursor:pointer;padding:11px 13px;font-size:12.5px;font-weight:800;
  color:#4a3c2e;list-style:none;display:flex;align-items:center;gap:7px}
details.fold>summary:hover{background:#efe7dd}
details.fold>summary::-webkit-details-marker{display:none}
/* 삼각형을 «칸에 담아» 단추로 보이게 — 글자 앞의 점 하나로는 눌러지는 줄 모른다 */
details.fold>summary:before{content:'▸';display:inline-flex;align-items:center;
  justify-content:center;width:19px;height:19px;border-radius:6px;flex:0 0 auto;
  background:var(--brown);color:#fff;font-size:10px}
details.fold[open]>summary:before{content:'▾'}
details.fold>summary .sp{flex:1}
/* 오른쪽에 «무엇을 하는 줄인지»를 글자로 — 삼각형만으로는 여전히 모를 수 있다 */
details.fold>summary .act{font-size:11px;font-weight:800;color:var(--brown);
  background:#fff;border:1px solid var(--line);border-radius:20px;padding:2px 9px;
  white-space:nowrap}
details.fold[open]>summary .act:after{content:'접기'}
details.fold:not([open])>summary .act:after{content:'펼치기'}
/* 안에 «넣을 것이 남았는지»를 접힌 채로도 알려 준다 — 열어 보지 않고도 안다 */
details.fold>summary .num{font-size:11px;font-weight:700;color:var(--sub);
  white-space:nowrap}
details.fold>summary .lt{font-weight:400;color:var(--faint)}
details.fold .in{padding:0 12px 12px;display:grid;gap:10px 12px;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
details.fold .in .w2{grid-column:span 2}
@media(max-width:560px){ details.fold .in{grid-template-columns:1fr}
  details.fold .in .w2{grid-column:span 1} }
.pad.g3 .w2{grid-column:span 2}
.pad.g3 .w3{grid-column:span 3}
@media(max-width:900px){ .pad.g3{grid-template-columns:1fr 1fr}
  .pad.g3 .w2,.pad.g3 .w3{grid-column:span 2} }
@media(max-width:560px){ .pad.g3{grid-template-columns:1fr}
  .pad.g3 .w2,.pad.g3 .w3{grid-column:span 1} }
/* ── ⓘ 말풍선 — 사용액 창(enter.html .btip)과 «같은 결» ──
   ★ 안내를 지우는 것이 아니라 «접는» 것이다. 칸 9개에 안내가 617자였다.
   ⚠ 폰에는 마우스 올리기가 없다 — 눌러서(focus-within) 도 펴지게 둔다.
     hover 만 두면 폰에서는 안내를 «영영 못 본다». */

/* ══════════════════════════════════════════════════════════════════════════
   넓은 화면 껍데기 — 위를 «얼리고» 두 칸을 따로 굴린다
   ══════════════════════════════════════════════════════════════════════════
   대표 지시 2026-09-02: 「상단은 틀고정해주고 좌측에 채울것과 우측에 나갈 모습
   크게 5:5로 화면 나눠서 정리할 수 있나」

   ★ 자리를 «재는 JS 가 없다» — flex 로만 짠다. 머리 높이를 px 로 재서 박으면
     글자 크기·창 폭·줄바꿈이 바뀔 때마다 어긋나고, 그때 얼린 머리가 본문을 덮는다.
     그래서 쪽 자체를 안 구르게 하고, 구르는 것을 «안쪽»으로 옮긴다.

   ⚠ 얼리기를 이 미디어쿼리 «밖»에 두면 휴대폰에서 쪽이 아예 안 구른다 — 아무것도
     못 본다. tests/newsletter-app.test.js 가 밖으로 새어 나갔는지 본다.

   ⚠ 5:5 규칙은 «.now»(이번 회차)로 좁힌다. 지난 회차·받는 명단·설정에는 .cols 가
     없어서, 껍데기를 그 탭에도 걸면 flex:1 을 받을 자식이 없어 «스크롤을 잃는다».
     그래서 탭 공통으로는 .wrap 자체가 구르게 해 둔다. */
@media(min-width:981px){
  html,body{height:100%;overflow:hidden}
  #shell{height:100%;display:flex;flex-direction:column}
  #shell>#top{flex:0 0 auto}                 /* 얼린 머리 ① 앱바 + 탭 */
  #shell>.wrap{flex:1;min-height:0;overflow-y:auto;padding-bottom:14px}
  /* 이번 회차만 — 회차 머리줄까지 얼리고 아래를 두 칸으로 */
  #shell>.wrap.now{overflow:hidden;display:flex;flex-direction:column}
  /* ★ 회차 머리줄을 얇게 (대표 지시 2026-09-05 「캡쳐4의 부분 캡쳐3으로 모두 넣어라」).
     제 한 줄을 통째로 먹고 있어서, 그만큼 아래 꼭지가 밀렸다. */
  /* ⚠ 「>」 하나를 뺀다 — 2026-09-06 부터 회차 줄은 «왼쪽 칸 안»에 있다(손자다).
       바로자식(>)으로 두면 이 규칙이 통째로 안 걸려 줄이 도로 두꺼워진다. */
  .wrap.now .hdbar{padding-top:7px;padding-bottom:7px;margin-top:0;margin-bottom:10px}
  .wrap.now .hdbar .no{font-size:16px}
  /* ★★ 얼린 화면에서는 두 칸이 «줄에 맞춰 늘어나야» 한다 (대표 화면 2026-09-06
       「화면아래 잘렸는데 내려가서 확인할 방법도 없다」)
     ═══════════════════════════════════════════════════════════════════════
     .cols 의 기본은 align-items:start 다 — 칸이 «제 내용만큼» 커진다.
     그래서 왼쪽 칸이 1195px 로 부풀었는데 담는 그릇은 901px 이었고,
     넘친 308px 이 overflow:hidden 안에 «갇혔다». 아래 두 꼭지를 못 보고,
     왼쪽 칸은 제 키를 다 쓴 줄 알아 구름막대도 안 내주었다 — 내려갈 길이 없었다.
     ⚠ 재 보고서야 알았다. 눈으로는 「그냥 잘린 것」으로만 보인다.
   ★ stretch 로 두면 두 칸이 줄 높이에 맞춰지고, .colL 의 구름이 그때 살아난다. */
  .wrap.now>.cols{flex:1;min-height:0;align-items:stretch;
    grid-template-rows:minmax(0,1fr)}
  /* ★ 왼쪽 칸을 flex 로 짠다 — 담는 법 띠는 제 키만 쓰고,
     꼭지 넷이 «남은 자리를 다 나눠» 갖는다(구르는 것은 꼭지 안으로). */
  .colL{overflow-y:auto;padding-right:4px;display:flex;flex-direction:column;min-height:0}
  .colL>.ways,.colL>.note,.colL>.box,.colL>.hdbar{flex:0 0 auto}
  /* ★★ minmax(0,1fr) 이라야 «줄어든다» (대표 화면 2026-09-06 「화면아래 잘렸는데
       내려가서 확인할 방법도 없다」)
     ═══════════════════════════════════════════════════════════════════════
     격자에서 1fr 은 minmax(auto,1fr) 이다 — «내용보다 작아지지 않는다».
     그래서 아랫줄(판례·인사노무)이 제 내용만큼 부풀어 창 밖으로 밀려났고,
     .colL 은 제 키를 다 썼다고 여겨 구름막대도 안 내주었다. 못 보고 못 내려갔다.
     ⚠ 1fr 로 되돌리지 말 것. 「반씩 나눠 갖기」는 minmax(0,…) 이라야 성립한다.
   ★ 그래도 못 보는 일이 없게 .jars 에 구름을 하나 더 둔다 — 마지막 그물이다. */

function 도움(글){

/* 지금 회차 한 벌(없으면 빈 것을 만들어 준다 — 자리에 쓰지는 않는다) */
function 지금회차(){
  const 열쇠 = App.지금열쇠;
  const 있는것 = App.회차들[열쇠];
  const 회 = Core.회차(오늘());
  const 회차한벌 = (있는것 && 있는것.회차) || (열쇠 === 회.열쇠 ? 회 : 회차로부터(열쇠));
  return Object.assign({
    열쇠: 열쇠, 회차: 회차한벌, 상태: '초안',
    안: { news:[], policy:[], case:[], hr:[] }, 우리글: ''
  }, 있는것 || {});
}
/* 열쇠(2026-08-w5)에서 회차 한 벌을 되살린다 — 지난 회차를 열 때 쓴다 */
function 회차로부터(열쇠){
  const m = /^(\d{4})-(\d{2})-w(\d+)$/.exec(String(열쇠||''));
  if(!m) return Core.회차(오늘());
  /* 그 달 1일부터 훑어 같은 열쇠가 나오는 날을 찾는다 — 규칙을 여기서 다시 만들지 않는다 */
  for(let d=1; d<=31; d++){
    const 날 = m[1] + '-' + m[2] + '-' + (d<10?'0':'') + d;
    const r = Core.회차(날);
    if(r && r.열쇠 === 열쇠) return r;
  }
  return Core.회차(오늘());
}

function 회차저장(자료){

  return db.ref('newsletter/issues/' + 자료.열쇠).update({
    회차: 자료.회차, 상태: 자료.상태 || '초안', 안: 자료.안 || {},
    우리글: 자료.우리글 || '', 범위: 자료.범위 || App.설정.범위 || '자문중',
    고친이: (App.me && App.me.email) || '', 고친때: Date.now()
  });
}

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===App.tab));
  $('cPast').textContent = Object.keys(App.회차들).length || '';
  /* ⚠ 탭 숫자는 «거르기 전» 전체다. 걸러낸 수를 쓰면 자문 칩을 눌렀을 때 탭이 27 로
       바뀌어 «전체가 27 인 줄로» 보인다(실제로는 114). 탭은 늘 같은 것을 말해야 한다.
       대표 지시 2026-09-03 「버튼을 누르면 받는명단의 숫자도 바뀐다 이부분 수정해라」 */
  $('cWho').textContent  = ((명단셈().전체 || []).length) || '';
  /* 보낸 회차가 없으면 숫자를 안 붙인다 — 0 을 띄우면 「뭔가 잘못됐나」로 읽힌다 */
  { const n = Object.keys(App.회차들).filter(k=>(App.회차들[k]||{}).상태==='발송').length;
    const el = $('cRes'); if(el) el.textContent = n || ''; }
  const m = $('main');
  /* 5:5 껍데기는 «이번 회차»에만 — 다른 탭엔 .cols 가 없어 걸면 스크롤을 잃는다 */
  m.classList.toggle('now', App.tab==='now');
  /* 받는 명단도 위(머리+유형 칩)를 얼린다 — 대표 지시 2026-09-03 「캡쳐1 틀고정」.
     ⚠ 얼릴 자리 아래에 «구르는 칸»(.whorest)이 반드시 있어야 한다. 없으면 표가 잘린다. */
  m.classList.toggle('who', App.tab==='who');
  if(App.tab==='now')  m.innerHTML = 이번회차화면();
  if(App.tab==='past') m.innerHTML = 지난회차화면();
  if(App.tab==='who')  m.innerHTML = 명단화면();
  if(App.tab==='res')  m.innerHTML = 결과화면();
  if(App.tab==='cfg')  m.innerHTML = 설정화면();
  /* ⚠ 미리보기는 이제 팝업(크게보기)뿐이다 — 여기서 그릴 것이 없다 */
  /* ★ 노무사회 서랍은 «떠 있는 창»이다 (대표 지시 2026-09-06
       「검토 내용이 아래로 내려가서 더이상 볼 수가 없다 … 근본적으로 해결」).
     ⚠ 예전에는 꼭지 «위»에 끼워 넣었다. 그것이 제 키를 다 먹고 꼭지 넷을
       아래로 밀어, 판례·인사노무가 화면 밖으로 나갔다. 칸 안에 넣는 한
       무엇을 더해도 같은 일이 되풀이된다 — 그래서 칸에서 «떼어» 냈다. */
  서랍그리기();
  if(App.tab==='past') 지난미리보기그리기();
}

function 명단셈(){
  /* 기업정보함에서 «그때그때» 만든다. 범위(설정)가 어디까지 볼지 정한다 —
     자문중=살아 있는 곳만 · 자문끝=끝난 곳까지 · 명함전부=지점까지.
     퇴사한 담당자(contacts[].left)는 Core 가 뺀다.

     ★ 유형(자문·급여·노조·기금) 거르기가 «여기» 있다 (대표 지시 2026-09-03).
       화면도 보내기도 CSV도 엑셀도 «이 함수 하나»를 쓴다 —
       거르는 자리를 두 곳에 두면 화면엔 38곳인데 110곳에 나간다. */
  /* 대표 결정 2026-09-03: 「담당자와 같이」 — 대표자에게도 함께 보낸다.
     ⚠ 실측으로는 4명만 늘어난다(110→114). 기업정보함에 «대표자 이메일» 칸이
       없어서다 — ceo 는 이름이고, 쓸 수 있는 것은 회사 메일 10곳뿐이다.
       칸을 만들어 채우면 그때 크게 늘어난다. */
  const g = Core.사업장에서명단(App.사업장들, App.설정.범위,
    { 대표자도: App.설정.대표자도 !== false });
  const d = Core.명단다듬기(g.줄들, App.막은주소);
  /* 거른 «뒤»가 아니라 다듬은 «뒤»에 센다 — 수신거부·겹침을 뺀 실제 보낼 곳으로 세어야
     칩의 숫자와 표의 줄 수가 맞는다. */
  d.유형셈 = Core.유형별셈(d.ok);
  d.전체 = d.ok;
  if(App.유형){
    d.ok = Core.유형으로거르기(d.ok, App.유형);
    d.셈 = Object.assign({}, d.셈, { 보낼곳: d.ok.length });
  }
  d.주소없는곳 = g.주소없는곳;
  d.본곳 = g.본곳;
  return d;
}

         예전에는 <span class="sp"> 로 오른쪽 끝까지 밀어 두었다. 1900px 화면에서는
         회차 이름과 단추 사이가 한 뼘이나 벌어져, 눈이 왼쪽 끝에서 오른쪽 끝까지 건너뛰었다. -->

  <!-- ★ 담는 법 — 카드 셋을 한 줄로 (대표 지시 2026-09-05 「크기 좀 줄여라」).
       ⚠ 「그대로 전달」을 «없애지는» 않았다. 지금 그 길로 다니시던 일이라,

         그런데 이 단추가 «누를 때마다» 담으므로(길바꾸기) 그 줄은 할 일이 없었다 —

    ${도움('<b>누르면 담습니다.</b> 이미 담긴 것은 <b>그대로 두고</b> 빈 자리만 채웁니다.<br>'

    <span class="sep"></span>

      ↧ 받은 것 붙여넣기</button>
    <span class="sep"></span>
    <button class="btn ${App.길==='ilabor'?'pri':''}" onclick="길바꾸기('ilabor')"

      📥 노무사회 자료 <b>${(App.노무사회||[]).length||''}</b>건</button>
    <span class="sep"></span>
    <button class="btn" onclick="연습채우기()">🧪 연습용 샘플</button>
    <span class="tail">ⓘ 제목·원문 링크만 싣습니다 ·
      <a onclick="길바꾸기('fwd')">받은 것 그대로 전달</a></span>
  </div>

  <!-- ★★ 셋째 줄을 없앴다 (대표 지시 2026-09-08 「최대한 내용 간략하게 2줄로」)
       ═══════════════════════════════════════════════════════════════════════
       여기에 「⟳ 다시 채우기」 + 두 줄 안내가 들어 있었다. 그런데 「채우기」 단추가
       «둘»이었다 — 위 띠의 「이 주치로 채우기」가 이미 누를 때마다 담는다(길바꾸기).
       같은 일을 하는 단추가 둘이면 어느 것을 눌러야 하나 헷갈리고, 줄만 먹는다.
     ⚠ 안내를 «지운» 것이 아니다 — 위 띠의 ⓘ 안으로 옮겼다.
     ⚠ 「이 회차에 드는 기사가 없다」는 «그때그때의 상태»라 ⓘ(늘 같은 글)에 안 맞는다 —
       오른쪽 요약의 경고 줄로 옮겼다. 거기가 「무엇이 이상한가」를 모아 두는 자리다. -->

  ${App.길==='paste' ? `
   <div class="box" style="margin-top:12px">

     <div style="display:flex;gap:9px;margin-top:9px;flex-wrap:wrap">

      씻어 내므로 받는 쪽에서 조금 달라 보일 수 있습니다.<br>

   <!-- ★ 꼭지 넷을 2×2 로 (대표 지시 2026-09-03 「고용·노동정책 등 아래 내용이

   ${꼭지탭줄(d)}${꼭지칸하나(d)}</div>

}

/* ══════════════════════════════════════════════════════════════════════════
   오른쪽 칸 — 「이번 편지, 핵심만」 (대표 지시 2026-09-08)
   ══════════════════════════════════════════════════════════════════════════
   「화면 내용이 너무 길고 아래로 계속 내려야 한다. 이 부분 간략히 핵심만 설명하고
    내용은 팝업창으로 안 되나?」

   ★ 예전에는 여기에 편지 «전문»이 들어 있었다(3,000px 넘는다). 굴려도 끝이 없고,
     정작 「우리 글이 비었다」·「행정해석이 밀렸다」는 끝까지 굴려야 알 수 있었다.
   ★ 이제 «빠진 것»을 맨 위에서 먼저 말한다. 전문은 「크게 보기」 팝업이다 —
     미리보기를 «없앤» 것이 아니라 «옮긴» 것이다. 한 번 누르면 나갈 모습 그대로 뜬다.
   ⚠ 여기에 편지를 다시 그리지 말 것. 그러면 굴려야 하는 자리가 도로 생긴다. */
function 편지요약(d, r, 갈수있나){
  const 편 = 지금편지(true);
  const 셈 = Core.실림셈(d.안, d.우리글);
  const 첨 = Core.첨부모으기(d.안);
  const 모 = 모음셈();
  const 밀림 = Core.밀린해석수(d.안, App.판례거리 || []);
  const 추적 = String((App.설정||{}).추적밑주소||'').trim();

  /* 경고 — 조건에 맞는 것만. 없으면 줄 자체를 안 그린다(빈 상자를 그리지 않는다) */
  const 경고 = [];
  if(!갈수있나.ok) 경고.push(`<b>아직 못 보냅니다</b> — ${esc(갈수있나.까닭)}`);
  if(!String(d.우리글||'').trim())
    경고.push('<b>인사·노무관리에 「우리 글」이 비어 있습니다.</b> 이 칸만 우리가 씁니다 — '
      + '비우면 연구자료만 나갑니다.');
  if(밀림)
    경고.push(`<b>행정해석 ${밀림}건이 «자리가 없어» 못 들어갔습니다</b> — `
      + '판례 한 건을 ✕ 로 빼시면 들어갑니다.');
  if(!모.이회차)
    경고.push('<b>이 회차에 드는 기사가 없어</b> 가장 최근 것으로 채웠습니다.');
  if(첨.넘친것.length)
    경고.push(`<b>한 통 한도(${Core.크기글(첨.한도)})를 넘어 «못 붙는» 첨부 ${첨.넘친것.length}개</b> — `
      + '편지의 「내려받기」 단추로는 그대로 갑니다.');

  const 꼭지칩 = Core.꼭지들.map(function(g){
    const c = 셈.표[g.키] || { 실림:0, 담김:0 };
    const 글 = g.갈래==='우리글' && String(d.우리글||'').trim() ? 1 : 0;
    if(g.갈래==='우리글' && !글 && !c.담김)
      return `<span class="chip zero">${esc(g.이름)} 비었음</span>`;
    return `<span class="chip">${esc(g.이름)} <b>${c.실림+글}</b>/${c.담김+글}</span>`;
  }).join('');

  return `<div class="box sum">
   <h3>📋 이번 편지 — 핵심만<span class="sp"></span>
     <button class="mini" onclick="크게보기()">👁 전문</button></h3>
   <div class="ttl">${편 ? esc(편.제목) : '<span style="color:var(--faint)">실을 것이 없습니다 — 왼쪽에서 담아 주세요</span>'}</div>
   ${경고.length ? `<div class="warns"><span>⚠</span>
     <div>${경고.length===1 ? 경고[0] : '<ul>' + 경고.map(x=>'<li>'+x+'</li>').join('') + '</ul>'}</div></div>` : ''}
   <div class="row"><span class="k">꼭지</span><span class="v jarline">${꼭지칩}</span></div>
   <div class="row"><span class="k">첨부</span><span class="v">${
     첨.파일들.length
       ? `<b>${첨.파일들.length}개 · ${Core.크기글(첨.합계)}</b>
          <span class="hint">/ 한 통 한도 ${Core.크기글(첨.한도)}${
            첨.넘친것.length ? ' · 못 붙는 것 ' + 첨.넘친것.length + '개' : ' · 넘친 것 없음'}</span>`
       : '<span class="hint">붙는 첨부 없음 — 편지의 「내려받기」 단추로만 갑니다</span>'
   }</span></div>
   <div class="row"><span class="k">받는 곳</span><span class="v">
     <b>${r.ok.length.toLocaleString()}곳</b>
     <span class="hint">${App.유형 ? esc(App.유형) + '만 · ' : ''}겹친 주소 ${r.셈.겹침} 걸러짐 ·
       주소 없는 곳 ${(r.주소없는곳||[]).length}</span></span></div>
   <div class="row"><span class="k">보내는 데</span><span class="v">
     <b>${esc(Core.보낼시간(r.ok.length, BULK_GAP_SEC))}</b>
     <span class="hint">한 통마다 ${BULK_GAP_SEC}초 — 한꺼번에 보내면 다음메일이 막습니다</span></span></div>
   <div class="row"><span class="k">보내는 주소</span><span class="v">${esc(보내는주소())}
     <span class="hint">회신 ${esc((App.설정||{}).회신주소 || '(없음)')}</span></span></div>
   ${추적 ? '<div class="oks"><span>✓</span><div>열람 추적이 켜져 있습니다 — '
       + '누가 열고 눌렀는지 「보낸 결과」에 쌓입니다.</div></div>'
     : '<div class="warns"><span>⚠</span><div><b>열람 추적이 꺼져 있습니다</b> — '
       + '누가 열었는지 알 수 없습니다(설정 → 그림과 열람 추적).</div></div>'}
   <div class="bigwrap">
    <button class="btn pri" onclick="크게보기()">👁 편지 전문 크게 보기</button>
    <div class="hint" style="margin-top:7px;text-align:center">나갈 모습 그대로 — 여기서 굴려 보시지 않아도 됩니다</div>
   </div>
  </div>`;
}

/* 비었을 때 «왜 비었는지» 그 자리에서 말한다 (대표 지시 2026-09-05).
   ★ 그냥 「담긴 것이 없습니다」만 하면 고장인지 원래 그런지 모른다.
     판례 꼭지는 «채울 길이 없어서» 비는 것이고, 인사·노무관리는 «일부러» 빈다. */
/* ★ 빈 꼭지 안내는 «한 줄»이다 (대표 지시 2026-09-06).
   ⚠ 예전에는 80자짜리 설명을 그대로 폈다. 반쪽 폭에서 서너 줄이 되고,
     빈 꼭지가 둘이면 여덟 줄이 자리를 먹어 아래가 화면 밖으로 밀렸다.
     까닭은 «물어볼 때» 보면 된다 — ⓘ 에 넣는다. */
function 빈꼭지알림(꼭지키){
  const w = Core.빈꼭지까닭(꼭지키);
  const 단추 = w.노무사회로
    ? ` <button class="mini" onclick="서랍열기()">📥 자료에서</button>`
    : '';
  return `<div class="empty" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
    <b>비어 있습니다</b>
    <span class="tipwrap"><span class="ib">ⓘ</span><span class="tip">${esc(w.말)}</span></span>
    ${단추}</div>`;
}

/* ══════════════════════════════════════════════════════════════════════════
   공인노무사회 자료 서랍 — 이 화면에서 바로 당겨 담는다
   ══════════════════════════════════════════════════════════════════════════
   대표 지시 2026-09-05: 「공인노무사 자료 이번회차에서도 당겨와서 붙여 넣을 수
                          있게 정리 다시 해라」
   예전에는 설정 칸에서 «받아 놓기»만 했다. 받아만 놓고 꼭지에 넣을 길이 없어
   10건이 창고에서 잠자고 있었다(2026-09-05 확인).

   ⚠ 첨부 PDF 는 «메일에 안 붙인다»(대표 승인 2026-09-05). 우리 창고에 두고
     편지에는 제목·출처·원문 링크만 싣는다 — 고용노동부·통계는 공공저작물이라
     괜찮지만 노무사회가 엮은 것은 다르다. 링크만 실으면 어느 쪽이든 안전하다. */
async function 노무사회읽기(){
  try{
    const v = (await db.ref('ilabor/items').once('value')).val() || {};
    App.노무사회 = Object.keys(v).map(k => v[k]||{})
      .filter(x => x && x.제목)
      .sort((a,b) => String(b.날짜||'').localeCompare(String(a.날짜||'')));
    App.노무사회탈 = '';
  }catch(e){ App.노무사회 = []; App.노무사회탈 = (e&&e.message)||String(e); }
  await 노무사회칸올림();
  await 창고자리채움();
  render();
}

/* 이미 담긴 줄에 «창고 자리»를 되짚어 채운다 (2026-09-07 대표 화면).
   ⚠ 「채우기」를 눌러도 첨부가 0개였다 — 회차에 든 것은 담을 때 모양 그대로 굳어서,
     뒤늦게 사본이 생겨도 이미 담긴 줄은 저절로 안 바뀐다.
   ★ 판단은 Core 가 한다(칸자리채우기). 여기서는 창고를 읽어 넘기고 저장·알림만.
   ⚠ 못 채워도 조용히 넘어간다 — 되짚기가 실패해서 화면이 안 뜨면 안 된다. */
async function 창고자리채움(){
  try{
    const d = 지금회차(); if(!d || !d.안) return;
    const 자료 = await db.ref('homepage/newsDocs/모음').once('value')
      .then(s => Object.values(s.val() || {})).catch(()=>[]);
    const r = Core.칸자리채우기(d.안, [App.노무사회 || [], 자료]);
    if(!r.채운수) return;
    d.안 = r.안;
    await 회차저장(d);
    toast(`📎 이미 담긴 ${r.채운수}건에 «창고 자리»를 채웠습니다 — 이제 첨부로 붙습니다`, 10000);
  }catch(e){ /* 조용히 — 되짚기가 화면을 막으면 안 된다 */ }
}

/* 판례·해석 후보를 한 번 읽어 둔다 — 요약이 「행정해석 N건이 밀렸다」를
   «채우기를 누르기 전»에도 말할 수 있어야 한다.
   ⚠ 못 읽어도 조용히 넘어간다 — 이것 때문에 화면이 안 뜨면 안 된다. */
async function 판례거리읽기(){
  try{
    const v = await db.ref('homepage/newsPrec/모음').once('value');
    App.판례거리 = 최근것(v.val(), 6);
    render();
  }catch(e){ /* 조용히 */ }
}

/* 이미 담아 둔 노무사회 칸을 «자료»로 올린다 — 표지·발행처·내려받기가 붙는다.
   ⚠ 회차에 든 것은 담을 때 «모양 그대로» 굳는다. 노무사회줄() 을 고쳐도
     그 전에 담긴 것은 저절로 안 바뀐다 — 2026-09-06 대표 화면이 그랬다.
   ★ 판단은 Core 가 한다. 여기서는 저장과 알림만.
   ⚠ 못 올려도 조용히 넘어간다 — 올리기가 실패해서 화면이 안 뜨면 안 된다. */
async function 노무사회칸올림(){
  try{
    const d = 지금회차(); if(!d || !d.안) return;
    const r = Core.노무사회칸올리기(d.안, App.노무사회 || []);
    if(!r.올린수) return;
    d.안 = r.안;
    await 회차저장(d);
    toast(`↑ 노무사회 자료 ${r.올린수}건을 «자료 칸»으로 올렸습니다 — 표지와 내려받기가 붙습니다`, 10000);
  }catch(e){ /* 조용히 — 올리기가 화면을 막으면 안 된다 */ }
}

function 노무사회고름(sid, 켬){
  App.노무사회고른것 = App.노무사회고른것 || {};
  if(켬) App.노무사회고른것[sid] = App.노무사회고른것[sid] || '';
  else delete App.노무사회고른것[sid];
  render();
}
function 노무사회꼭지바꿈(sid, 키){
  App.노무사회고른것 = App.노무사회고른것 || {};
  App.노무사회고른것[sid] = 키;
  render();
}

async function 노무사회담기(){
  const 고른 = App.노무사회고른것 || {};
  const sids = Object.keys(고른);
  if(!sids.length) return toast('담을 것을 골라 주세요');
  const d = 지금회차();
  let 담음 = 0, 이미 = 0;
  sids.forEach(function(sid){
    const 자료 = (App.노무사회||[]).find(x => String(x.sid) === String(sid));
    const 줄 = Core.노무사회줄(자료);
    if(!줄) return;
    /* ⚠ 같은 자료를 두 번 싣지 않는다 — 대표가 손으로 빼게 만들면 안 된다 */
    if(Core.이미담겼나(d.안, 줄)){ 이미++; return; }
    const 키 = 고른[sid] || Core.노무사회꼭지추천(자료);
    d.안[키] = (d.안[키]||[]).concat([줄]);
    담음++;
  });
  if(!담음) return toast(이미 ? `이미 담긴 것뿐입니다 (${이미}건)` : '담을 것이 없습니다', 7000);
  App.노무사회고른것 = {};
  await 회차저장(d);
  render();
  toast(`↧ ${담음}건을 꼭지에 담았습니다` + (이미 ? ` (이미 담긴 ${이미}건은 건너뜀)` : ''), 9000);
}

function 노무사회서랍(d){
  /* 처음 열면 그때 한 번만 읽는다 — 켜 두고 계속 받지 않는다(요금) */
  if(App.노무사회 == null){ setTimeout(노무사회읽기, 0);
    return `<div class="box" style="margin-top:12px"><div class="pad hint">받아 둔 자료를 읽는 중…</div></div>`; }
  if(App.노무사회탈){
    return `<div class="box" style="margin-top:12px"><div class="pad note bad">
      자료를 읽지 못했습니다 — ${esc(App.노무사회탈)}</div></div>`;
  }
  const 고른 = App.노무사회고른것 || {};
  const 고른수 = Object.keys(고른).length;
  if(!App.노무사회.length){
    return `<div class="box" style="margin-top:12px"><div class="pad note">
      받아 둔 노무사회 자료가 없습니다 — <b>설정</b> 칸에서 「📥 상세+첨부」를 눌러 받아 주세요.</div></div>`;
  }
  const 줄 = App.노무사회.map(function(x){
    const sid = String(x.sid||'');
    const 줄값 = Core.노무사회줄(x);
    const 이미 = 줄값 ? Core.이미담겼나(d.안, 줄값) : false;
    const 켬 = Object.prototype.hasOwnProperty.call(고른, sid);
    const 키 = 고른[sid] || Core.노무사회꼭지추천(x);
    const 고르개 = Core.꼭지들.filter(g=>g.갈래!=='우리글').map(function(g){
      return `<option value="${g.키}"${g.키===키?' selected':''}>${esc(g.이름)}</option>`;
    }).join('');
    /* ⚠ 한 칸은 한 줄이다 — 기관·날짜는 오른쪽에 붙이고 제목이 길면 … 로 줄인다 */
    return `<div class="item ilrow">
      <input type="checkbox" ${켬?'checked':''} ${이미?'disabled':''}
        onchange="노무사회고름('${sid}',this.checked)">
      <span class="t" title="${esc(x.제목||'')}">${esc(x.제목||'')}
        ${x.첨부 ? '<span class="pill" style="background:#fffbeb;color:#854d0e">📎</span>' : ''}
        ${이미 ? '<span class="pill" style="background:#f1f5f9;color:#64748b">담김</span>' : ''}</span>
      <span class="src">${esc(x.기관||'')} · ${esc(String(x.날짜||'').slice(5))}</span>
      <select class="mini" ${이미?'disabled':''} onchange="노무사회꼭지바꿈('${sid}',this.value)">${고르개}</select>
    </div>`;
  }).join('');
  return `<div class="box" style="margin-top:12px;border-color:#d9cec1">
    <h3 style="background:var(--brown-soft);color:#4a3c2e">📥 공인노무사회 자료
      <span class="cnt">${App.노무사회.length}건</span><span class="sp"></span>
      <button class="mini" onclick="노무사회읽기()">⟳ 다시 읽기</button></h3>
    <div class="jarbody" style="max-height:min(38vh,340px);overflow-y:auto">${줄}</div>
    <div class="pad" style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--paper)">
      <span class="hint" style="margin:0;flex:1">고른 것 <b>${고른수}</b>건 —
        제목과 <b>원문 링크</b>만 실립니다. 첨부(📎)는 우리 창고에 두고 메일에는 안 붙입니다.</span>
      <button class="btn pri" onclick="노무사회담기()" ${고른수?'':'disabled'}>↧ 고른 것 꼭지에 담기</button>
    </div></div>`;
}

/* 오른쪽 끝에 붙는 작은 글자 — 무엇으로 담긴 칸인지 한눈에 */
function 꼬리표(x){
  if(!x) return '';
  if(x.갈래==='자료') return x.발행처 || '자료';
  if(x.갈래==='판례') return x.법원 || '판례';
  if(x.갈래==='법령') return x.부처 || '법령';
  return x.언론사 || '';
}

/* 자료·판례는 «제목 한 줄»로는 판단이 안 된다.
   ★ 자료  — 목차와 «내려받을 파일»이 보여야 「이대로 나가도 되나」를 정하실 수 있다.
     대표 지시 2026-09-05 「데이터를 다운받아서 확인할 수 있게 만들어라」가 이 줄이다.
   ★ 판례  — 인용(대법원 …)이 보여야 어느 판결인지 안다.
   ⚠ 목차가 비면 «비었다고 말한다». 조용히 빈 채로 두면 편지에서야 알게 된다. */
function 곁줄(칸, x, i){
  if(!x) return '';
  if(x.갈래==='자료'){
    const 목 = (x.목차||[]).filter(Boolean);
    const 목글 = 목.length
      ? 목.map((t,n)=>`${n+1}. ${esc(t)}`).join(' · ')
      : '<span style="color:var(--bad)">목차 없음</span>';
    const 파일 = x.파일 || x.사본주소 || '';
    const 크기 = x.파일크기 ? ` (${Core.크기글 ? Core.크기글(x.파일크기) : Math.round(x.파일크기/1024)+'KB'})` : '';
    const 받기 = 파일
      ? `<a href="${esc(파일)}" target="_blank" rel="noopener">⬇ 파일 열어 보기${esc(크기)}</a>`
      : '<span style="color:var(--bad)">첨부 없음</span>';
    const 사본 = x.사본주소 && x.사본주소 !== 파일
      ? ` · <a href="${esc(x.사본주소)}" target="_blank" rel="noopener">우리 사본</a>` : '';
    return `<div class="곁">${목글}<br>${받기}${사본}
      · <button class="mini" onclick="목차고치기('${칸}',${i})">✎ 목차 고치기</button></div>`;
  }
  if(x.갈래==='판례'){
    return `<div class="곁">${esc(x.인용||'')}${x.참조조문?' · '+esc(x.참조조문):''}</div>`;
  }
  return '';
}

/* 목차는 «사람이» 채운다 — 기계가 지어내면 책에 없는 차례가 나간다.
   ⚠ 파일을 열어 보시고 그 차례를 그대로 옮기시는 자리다. */
function 목차고치기(칸, i){
  const d = 지금회차(); const x = (d.안[칸]||[])[i]; if(!x) return;
  const 이제 = (x.목차||[]).join('\n');
  const 새것 = prompt('목차를 «한 줄에 하나씩» 적어 주세요 (최대 4줄).\n'
    + '번호는 편지에서 저절로 붙습니다.\n\n'
    + '⚠ 파일을 열어 보시고 «그 책에 있는 차례»만 옮겨 주세요.\n\n'
    + (x.제목||''), 이제);
  if(새것 === null) return;
  x.목차 = String(새것).split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,4);
  회차저장(d).then(()=>{ render(); toast('목차를 고쳤습니다', 4000); })
    .catch(e=>toast('못 고쳤습니다: ' + ((e&&e.message)||''), 7000));
}

/* ══════ 꼭지 탭 ══════ (대표 지시 2026-09-08 「탭을 다시 정렬해라」)
   ★ 숫자는 «실릴 것 / 담긴 것»이다 — 다른 꼭지를 보고 있어도 어디가 비었는지 안다.
     이 숫자가 없으면 탭은 «안 보이는 것을 늘리는» 셈이 된다. */
function 꼭지탭줄(d){
  const 셈 = Core.실림셈(d.안, d.우리글);
  return `<div class="jartabs">` + Core.꼭지들.map(function(g){
    const c = 셈.표[g.키] || { 실림:0, 담김:0 };
    /* 우리 글 꼭지는 «글 한 칸»이 더 있어 담긴 수만으로는 빈지 아닌지 알 수 없다 */
    const 글 = g.갈래==='우리글' && String(d.우리글||'').trim() ? 1 : 0;
    return `<button class="${App.보는꼭지===g.키?'on':''}" onclick="꼭지보기('${g.키}')"
      title="${esc(g.이름)} — 실릴 것 ${c.실림+글}건 · 담긴 것 ${c.담김+글}건">${esc(g.이름)}
      <span class="n"><b>${c.실림+글}</b>/${c.담김+글}</span></button>`;
  }).join('') + `</div>`;
}

/* ══════ 보고 있는 꼭지 하나 ══════
   ⚠ 빈 꼭지에는 «왜 비는지»를 그린다(빈꼭지알림) — 탭이 0 인데 칸이 그냥 비어 있으면
     담는 길을 못 찾는다. */
function 꼭지칸하나(d){
  const g = Core.꼭지찾기(App.보는꼭지) || Core.꼭지들[0];
  const 것 = d.안[g.키] || [];
  const 셈 = Core.실림셈(d.안, d.우리글).표[g.키] || { 실림:0, 담김:0 };
  const 글칸 = g.갈래==='우리글' ? `<div class="pad" style="border-bottom:1px solid var(--line)">
     <textarea id="myWrite" rows="4" oninput="우리글바뀜(this.value)"
       placeholder="이번 주 한마디 — 이 칸만 우리가 씁니다.">${esc(d.우리글||'')}</textarea>
     <div class="hint" style="margin-top:6px">나머지 세 꼭지는 <b>제목과 원문 링크</b>만 싣습니다.
       기사 본문은 남의 글이라 옮기지 않습니다.</div></div>` : '';
  const 줄 = 것.length ? 것.map(function(x,i){
    const 실 = Core.실릴까(x);
    /* ⚠ 꺼진 줄을 «감추지 않는다» — 사라지면 왜 안 나가는지도, 다시 켤 길도 없다 */
    return `<div class="item${실?'':' off'}">
      <input type="checkbox" class="ck" ${실?'checked':''}
        onchange="실음바꾸기('${g.키}',${i})"
        title="${실?'이번 편지에 싣습니다 — 끄면 목록에는 남고 편지에서만 빠집니다'
                  :'이번 편지에서 뺐습니다 — 켜면 그대로 돌아옵니다'}">
      <button class="mv" title="위로" onclick="옮기기('${g.키}',${i},-1)">▲</button>
      <button class="mv" title="아래로" onclick="옮기기('${g.키}',${i},1)">▼</button>
      <span class="t" title="${esc(x.제목||'')}">${esc(x.제목||'')}${
        실?'':'<span class="offtag">안 실림</span>'}${곁줄(g.키,x,i)}</span>
      <span class="src">${esc(꼬리표(x))}</span>
      <button class="x" title="목록에서 아예 빼기" onclick="빼기('${g.키}',${i})">✕</button>
    </div>`;
  }).join('') : 빈꼭지알림(g.키);
  return `<div class="jarpanel">
    <div class="jarhead">
     <span class="ttl">${esc(g.이름)}</span>
     <span class="cnt">실릴 것 ${셈.실림} / 담긴 것 ${셈.담김}</span>
     <span class="sp"></span>
     ${것.length ? `<button class="mini" onclick="꼭지모두('${g.키}',true)">☑ 모두 싣기</button>
     <button class="mini" onclick="꼭지모두('${g.키}',false)">☐ 모두 빼기</button>` : ''}
     <button class="mini" onclick="손으로담기('${g.키}')">＋ 손으로 담기</button>
    </div>
    <div class="jarbody">${글칸}${줄}</div></div>`;
}

/* ══════ 손잡이 — 탭과 ㅁ ══════
   ⚠ 저장까지 해야 한다. 화면만 바꾸면 새로 고치는 순간 되돌아가고,
     그 사이에 보내면 «화면에서 뺀 줄이 편지에 실려» 나간다. */
function 꼭지보기(키){ App.보는꼭지 = 키; render(); }

function 실음바꾸기(키, i){
  const d = 지금회차();
  const 것 = (d.안[키] || [])[i];
  if(!것) return;
  if(Core.실릴까(것)) 것.안실음 = true; else delete 것.안실음;
  회차저장(d).then(render).catch(e=>toast('바꾸지 못했습니다: ' + ((e&&e.message)||''), 7000));
}

function 꼭지모두(키, 켬){
  const d = 지금회차();
  const 것들 = d.안[키] || [];
  if(!것들.length) return;
  것들.forEach(function(x){ if(켬) delete x.안실음; else x.안실음 = true; });
  회차저장(d)
    .then(function(){ render();
      toast(켬 ? `☑ ${것들.length}건을 모두 싣습니다`
               : `☐ ${것들.length}건을 이번 편지에서 뺐습니다 — 목록에는 그대로 있습니다`, 8000); })
    .catch(e=>toast('바꾸지 못했습니다: ' + ((e&&e.message)||''), 7000));
}

/* ══════ 손잡이 — 꼭지 고치기 ══════ */
/* ★★ 「채우기」라고 적힌 단추는 «누르면 채워야» 한다 (대표 화면 2026-09-06)
   ═══════════════════════════════════════════════════════════════════════════
   예전에는 이 단추가 «칸만 열고», 안쪽의 「지금 채우기」를 한 번 더 눌러야 담겼다.
   대표께서 「⟳ 이 주치로 채우기 60건」을 누르고 담긴 줄 아셨고,
   주간노동뉴스가 0건인 채로 하루가 갔다 — 서버에도 news 0 으로 남아 있었다.
   ⚠ 이제 «합쳐 담기»라 눌러도 담긴 것이 사라지지 않는다. 그래서 바로 담아도 된다.
     지우던 시절이었으면 이렇게 못 한다.
   ★ 이미 그 칸에 있을 때는 다시 안 담는다 — 칸을 오가는 것만으로 자꾸 담기면 성가시다. */
function 길바꾸기(v){
  /* ★ 노무사회 자료는 이제 «떠 있는 창»이다 — 칸을 밀지 않는다(2026-09-06).
       예전 이름으로 부르던 자리(빈 꼭지 안내 등)가 있어 여기서 갈라 준다. */
  if(v === 'ilabor'){ 서랍열기(); return; }
  App.길 = v;
  render();
  /* ⚠⚠ 「이미 그 칸이면 건너뛴다」를 두지 말 것 — 2026-09-06 에 그것 때문에
       단추가 «한 번도» 안 먹었다.
     App.길 의 첫 값이 'auto' 다. 그래서 이 단추는 화면을 열자마자 이미 눌린 꼴이고,
     「처음일 때만 담기」로 두었더니 눌러도 늘 건너뛰었다. 그런데 칸에는
     「담았습니다」라고 적혀 있어, 대표께서 담긴 줄 아시고 시험 발송까지 하셨다 —
     주간노동뉴스와 판례가 빈 채로 나갔다.
   ★ 누를 때마다 담는다. «합쳐 담기»라 두 번 눌러도 늘지 않고 지워지지도 않는다. */
  if(v === 'auto') 자동담기();
}

function 우리글바뀜(v){
  const d = 지금회차(); d.우리글 = v;
  App.회차들[d.열쇠] = d;
  clearTimeout(우리글바뀜._t);
  /* ⚠ 저장만 하고 다시 그린다 — 요약의 「우리 글이 비었다」 경고가 함께 사라져야 한다 */
  우리글바뀜._t = setTimeout(()=>{ 회차저장(d).then(render).catch(()=>{}); }, 700);
}
function 옮기기(칸, i, 어디){
  const d = 지금회차(); const a = d.안[칸] || [];
  const j = i + 어디; if(j<0 || j>=a.length) return;
  const t = a[i]; a[i] = a[j]; a[j] = t;
  회차저장(d).then(render);
}
function 빼기(칸, i){
  const d = 지금회차(); (d.안[칸]||[]).splice(i,1);
  회차저장(d).then(render);
}
function 손으로담기(칸){
  const 제목 = prompt('제목을 적어 주세요'); if(!제목) return;
  const 링크 = prompt('원문 링크 (없으면 비워 두세요)') || '';
  const d = 지금회차();
  (d.안[칸] = d.안[칸] || []).push({ 갈래:'기사', 제목:제목.slice(0,200), 링크:링크, 언론사:'' });
  회차저장(d).then(render);
}

/* ══════ 길 ① 자동으로 담기 ══════ */
/* 이 회차에 드는 기사가 몇 건인지 — 화면이 «왜 그만큼 담기는지» 말할 수 있게.
   ⚠ 예전에는 「지금 모아 둔 기사 43건」이라 크게 적어 놓고 채우면 0건이 담겼다.
     왜 아무 일도 안 일어나는지 화면이 말해 주지 않았다. */
function 모음셈(){
  return Core.모음셈(App.브리핑, 지금회차().회차);
}

/* 연습용 샘플로 채운다 — 「연습으로 보내봐야 한다」(대표 지시 2026-09-03).
   ⚠ 모든 줄에 [연습] 이 붙어 있다. 실수로 진짜 발송에 섞이면 곧 눈에 보인다.
   ⚠ 연습은 «나에게 시험 발송»으로 하셔야 한다 — 「N곳에 보내기」는 진짜 자문사로 나간다. */
function 연습채우기(){
  const d = 지금회차();
  if(!confirm('연습용 샘플로 채웁니다.\n\n이미 담긴 것은 지워집니다.\n'
    + '모든 줄에 [연습] 이 붙어 나옵니다.\n\n'
    + '⚠ 연습은 「나에게 시험 발송」으로만 하세요 —\n'
    + '「N곳에 보내기」는 진짜 자문사로 나갑니다.\n\n채울까요?')) return;
  d.안 = Core.연습샘플();
  d.우리글 = '[연습] 이번 주 한마디 — 이 칸만 우리가 씁니다.';
  회차저장(d).then(function(){
    render();
    const n = Core.꼭지들.reduce((a,g)=>a+((d.안[g.키]||[]).length),0);
    toast('🧪 연습용 샘플 ' + n + '건을 담았습니다 — 「나에게 시험 발송」으로 보내 보세요', 12000);
  }).catch(e=>toast('담지 못했습니다: ' + ((e&&e.message)||''), 8000));
}

/* 모아 둔 것(열쇠→칸)에서 «최근 모은 것»부터 몇 개.
   ⚠ Object.keys 차례를 믿지 않는다 — 파이어베이스가 주는 차례는 열쇠 순이지 날짜 순이 아니다. */
function 최근것(모아둔것, 몇개){
  return Object.keys(모아둔것 || {})
    .map(k => (모아둔것||{})[k])
    .filter(Boolean)
    .sort((a,b) => String(b.모은날||'').localeCompare(String(a.모은날||'')))
    .slice(0, 몇개 || 8);
}

function 자동담기(){
  const d = 지금회차();
  /* 세 곳에서 «저마다» 온다 (대표 지시 2026-09-05):
       · 자료 — 고용노동부 정책자료실   (homepage/newsDocs/모음, 아침 7:10 이 담는다)
       · 판례 — 법제처 판례            (homepage/newsPrec/모음)
       · 법령 — 주간 브리핑이 만들어 둔 것. ⚠ «자료가 없을 때만» 쓴다.
                「법제처에서 보기」는 손님이 눌러도 법전으로 갈 뿐이라 자료 구실을 못 한다. */
  Promise.all([
    db.ref('homepage/newsBrief/법령').once('value').catch(()=>({val:()=>null})),
    db.ref('homepage/newsDocs/모음').once('value').catch(()=>({val:()=>({})})),
    db.ref('homepage/newsPrec/모음').once('value').catch(()=>({val:()=>({})}))
  ])
    .then(function(v){
      const 법령 = v[0].val() || [];
      const 자료 = 최근것(v[1].val(), 8);
      const 판례 = 최근것(v[2].val(), 6);
      App.판례거리 = 판례;                       /* 무엇이 밀렸는지 알림·요약에서 쓴다 */
      const 새것 = Core.자동으로담기(App.브리핑, {
        법령: Array.isArray(법령) ? 법령 : [], 자료: 자료, 판례: 판례
      }, d.회차);
      /* ★ 이미 담긴 것을 «지우지 않는다» (2026-09-06 대표 화면).
         노무사회 자료를 골라 담으신 뒤 이것을 누르면 그 넷이 말없이 사라졌다 —
         묻지도 않고 통째로 갈아 끼우고 있었다. 손으로 고른 것이 위, 자동이 아래. */
      const 앞수 = Core.꼭지들.reduce((a,g)=>a+((d.안[g.키]||[]).length), 0);
      const 앞칸 = {}; Core.꼭지들.forEach(g => { 앞칸[g.키] = (d.안[g.키]||[]).length; });
      자동담기._앞칸 = 앞칸;
      d.안 = Core.합쳐담기(d.안, 새것);
      d.안.hr = (d.안.hr && d.안.hr.length) ? d.안.hr : [];
      자동담기._앞수 = 앞수;
      return 회차저장(d);
    })
    .then(function(){
      render();
      const n = Core.꼭지들.reduce((a,g)=>a+((d.안[g.키]||[]).length),0);
      /* ⚠ 「몇 건을 담았다」만 말하면, 이미 있던 것까지 센 숫자라 «새로 온 것이 없어도»
           담긴 것처럼 들린다. 지킨 것과 더한 것을 갈라 말한다. */
      const 앞 = 자동담기._앞수 || 0, 더 = n - 앞;
      /* ★ «찬 꼭지»를 이름으로 말한다 (2026-09-06 대표 물음 「왜 안나오나」).
           고용·노동정책이 이미 4건으로 차 있으면 새 자료가 들어갈 자리가 없다.
           숫자만 말하면 「안 담겼다」로만 보이고, 무엇을 하면 되는지 알 수 없다. */
      const 찬것 = Core.꼭지들.filter(g => g.갈래 !== '우리글'
        && (d.안[g.키]||[]).length >= (g.몇개||0)
        && ((자동담기._앞칸 || {})[g.키] || 0) >= (g.몇개||0)).map(g => g.이름);
      const 찬말 = 찬것.length
        ? ` · ${찬것.join('·')}는 이미 차 있어 그대로 둡니다 (바꾸시려면 ✕ 로 빼고 다시 누르세요)` : '';
      /* ★ 무엇이 «밀렸는지»를 이름으로 말한다 (2026-09-07 대표 화면).
           꼭지 이름이 「판례·재결례·행정해석」인데 판례 셋으로 차 있으면 해석은
           한 자리도 못 얻는다. 「차 있다」만 말하면 왜 안 나오는지 알 길이 없다. */
      const 밀림 = Core.밀린해석수(d.안, App.판례거리 || []);
      const 밀린말 = 밀림
        ? ` · ⚠ 행정해석 ${밀림}건이 «자리가 없어» 못 들어갔습니다 — 판례 한 건을 ✕ 로 빼시면 들어갑니다` : '';
      toast(!n ? '이 주치에 모아 둔 것이 없습니다 — 붙여넣어 담거나 손으로 담아 주세요'
           : (앞 ? `⟳ 이미 담긴 ${앞}건은 그대로 두고 ${더}건을 더했습니다 (모두 ${n}건)${찬말}${밀린말}`
                 : `⟳ ${n}건을 담았습니다 — 필요 없는 것은 ✕ 로 빼세요${밀린말}`), 15000);
    })
    .catch(e=>toast('담지 못했습니다: ' + ((e&&e.message)||''), 7000));
}

/* ══════════════════════════════════════════════════════════════════════════

/* 보내는 주소 — 원본 뉴스레터가 나갔던 그 주소다(보낸메일함 실측 2026-09-02).
   대표 지시 2026-09-03: 「뉴스레터 발송시에는 370-6@hanmail.net 주소로 송부되어야 한다」
   ⚠ 자료 발송이 쓰는 공용 주소(pucards/config/matMail/from = 370-6@daum.net)를
     «건드리지 않는다». 거기를 바꾸면 평소 자료 발송까지 흔들린다.
   ⚠ 조이는 것은 서버가 한다 — 사서함 이름이 계정과 같고 도메인이 daum.net/hanmail.net
     인 것만 통과한다. 아니면 조용히 계정 주소로 나간다. */
const 기본보내는주소 = '370-6@hanmail.net';
function 보내는주소(){ return String((App.설정 && App.설정.보내는주소) || 기본보내는주소).trim(); }

async function 걸기(payload){
  const u = firebase.auth().currentUser;
  if(!u) throw new Error('로그인이 풀렸습니다');
  const token = await u.getIdToken();
  /* ★ 보내는 주소를 «여기 한 곳»에서 붙인다. 발송 길이 넷(시험·본발송·전달시험·전달)이라
       각자 붙이면 한 곳을 빠뜨려 다른 주소로 나간다. */
  const body = Object.assign({ from: 보내는주소() }, payload);
  const res = await fetch(BULK_FN_URL, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + token },
    body: JSON.stringify(body)
  });
  let j=null; try{ j = await res.json(); }catch(_){}
  if(!res.ok || !j || !j.ok) throw new Error((j&&j.error) || ('서버 응답 ' + res.status));
  return j;
}

/* ══════════════════════════════════════════════════════════════════════════
   이 회차에 «진짜로 붙을» 첨부 — 대표 결정 2026-09-06 「첨부도 붙인다」
   ══════════════════════════════════════════════════════════════════════════
   그때까지는 편지에 「내려받기」 단추만 있었다. 대표께서 파일을 «붙여서» 보내라고
   정하셨다 — 받는 분이 눌러 들어가지 않고 메일함에서 바로 열 수 있게.

   ⚠ 실제 크기를 재 보니 만만치 않다(2026-09-06, 받아 둔 11개 합계 38.8MB —
     13.6MB 짜리 하나, 10.1MB 짜리 하나). 한 통 한도는 18MB 다.
   ⚠ 그리고 이 편지는 «114곳»에 간다 — 8MB 를 붙이면 900MB 가 나간다.
     그래서 «몇 MB 가 몇 곳에» 가는지를 보내기 전에 반드시 보여 준다.
   ★ 못 붙는 것은 조용히 자르지 않는다. 무엇이 안 붙는지 말하고,
     그것도 편지의 «내려받기» 단추로는 그대로 간다 — 자료를 잃지 않는다. */
function 첨부셈(곳수){
  const d = 지금회차();
  const r = Core.첨부모으기(d.안);
  const n = Number(곳수) || 0;
  let 말 = '';
  if(r.파일들.length){
    말 = '\n\n📎 붙는 첨부 ' + r.파일들.length + '개 · ' + Core.크기글(r.합계);
    if(n) 말 += '  (한 통마다 · ' + n.toLocaleString() + '곳이면 모두 '
      + Core.크기글(r.합계 * n) + ')';
  } else {
    말 = '\n\n📎 붙는 첨부 없음';
  }
  if(r.넘친것.length){
    말 += '\n⚠ 한 통 한도(' + Core.크기글(r.한도) + ')를 넘어 «못 붙는» 것 '
      + r.넘친것.length + '개:\n'
      + r.넘친것.slice(0,3).map(x=>'   · ' + x.이름 + ' ' + Core.크기글(x.크기)).join('\n')
      + (r.넘친것.length>3 ? '\n   · 외 ' + (r.넘친것.length-3) + '개' : '')
      + '\n   → 편지의 «내려받기» 단추로는 그대로 갑니다.';
  }
  return { 파일들: r.파일들, 말: 말, 셈: r };
}

/* ══════════════════════════════════════════════════════════════════════════
   시험 발송 — 2026-09-06 에 «두 가지» 때문에 안 됐다
   ══════════════════════════════════════════════════════════════════════════
   ① 받는 곳이 «죽은 주소»였다.
      로그인 아이디(p001@pureun.kr)로 보내고 있었는데, 그것은 파이어베이스

      그래서 「1분 안에 확인하세요」라고 해 놓고 실제로는 최대 15분을 기다렸고,
      그 뒤에 실패해도 아무 말이 없었다. 시험이 시험 구실을 못 했다.

   ★ 그래서 시험은 «즉시 보내는 길»로 간다(sendMaterialMail).

     안 적으면 「시험은 daum 인데 왜?」가 된다. */
const 시험즉시URL = 'https://asia-northeast3-pureun-erp.cloudfunctions.net/sendMaterialMail';

/* 시험을 받을 주소 — 설정에 넣으신 것이 먼저, 없으면 «보내는 주소»(살아 있는 사서함).
   ⚠ 로그인 아이디로 되돌아가지 말 것. 그것 때문에 안 됐다. */
function 시험받을주소(){

async function 시험발송(){
  const 편 = 지금편지(); if(!편) return toast('실을 것이 없습니다');
  const 받을곳 = 시험받을주소();
  if(!받을곳) return toast('시험 받을 주소가 없습니다 — 설정에서 넣어 주세요', 9000);
  /* ★ 시험에도 «첨부를 그대로» 붙인다 — 진짜와 다른 것을 보면 시험이 아니다 */
  const 첨 = 첨부셈();
  if(!confirm(`「${편.제목}」을\n${받을곳} 로 한 통만 «바로» 보냅니다.`
    + 첨.말 + `\n\n거래처에는 나가지 않습니다.`)) return;
  App.보내는중 = true; render();
  try{
    const u = firebase.auth().currentUser;
    if(!u) throw new Error('로그인이 풀렸습니다');
    const token = await u.getIdToken();

    /* ★★ 시험도 «진짜와 똑같이» 나가야 시험이다 (대표 화면 2026-09-06)
       ═══════════════════════════════════════════════════════════════════════
       ⚠ ① {추적열쇠} — 대량 발송기(mail-bulk)가 통마다 바꿔 넣는 자리다.
            시험은 그 길을 안 지나 «글자 그대로» 나갔다. 받은 편지의 내려받기 주소가
            newsClick?i=…&e={추적열쇠}&n=1 이었다(대표께서 상태줄에서 보셨다).
       ⚠ ② 링크들 — newsClick 은 «회차에 적어 둔 목록»에서 번호로 목적지를 찾는다.
            진짜 발송은 적는데 시험은 안 적어, 모든 링크가 「모르는 번호」가 되어
            대문으로 튕겼다. 내려받기를 눌러도 포털 첫 화면이 떴다.
       ★ 시험 주소는 우리 것이라 명단에 없고, 미열람 셈은 «보냄» 표가 있는 회차만
         세므로(Core.미열람판단) 이 열쇠가 자문사 셈을 더럽히지 않는다. */
    /* ⚠ 감싸지 않는다(encodeURIComponent) — 대량 발송기는 «날것 그대로» 끼워 넣는다.
         여기서만 감싸면 시험과 진짜가 서로 다른 주소로 나가, 시험이 시험이 아니게 된다. */
    const 열쇠 = Core.주소열쇠(받을곳);
    const 서식 = String(편.서식 || '').split('{추적열쇠}').join(열쇠);
    const d0 = 지금회차();
    try{
      await db.ref('newsletter/issues/' + d0.열쇠).update({ 링크들: 편.링크들 || [] });
    }catch(e){
      toast('⚠ 링크 목록을 못 적었습니다 — 시험 편지의 링크가 대문으로 튕깁니다: '
            + ((e&&e.message)||''), 12000);
    }

    const res = await fetch(시험즉시URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + token },
      body: JSON.stringify({ to: 받을곳, toName: '시험',
        subject: '[시험] ' + 편.제목, body: 편.본문, html: 서식,
        files: 첨.파일들 })
    });
    let j=null; try{ j = await res.json(); }catch(_){}
    /* ⚠ 실패를 «삼키지 않는다». 예전에는 15분 뒤 대기열에서 조용히 죽었다. */
    if(!res.ok || !j || !j.ok) throw new Error((j&&j.error) || ('서버 응답 ' + res.status));
    const d = 지금회차(); if(d.상태==='초안'){ d.상태='시험'; await 회차저장(d); }
    toast(`✅ 시험 메일이 나갔습니다 → ${받을곳}`
      + (첨.파일들.length ? ` (첨부 ${첨.파일들.length}개)` : '')
      + (j.from ? ` · 보낸 곳 ${j.from}` : ''), 12000);
  }catch(e){
    toast('✗ 시험 발송 실패 — ' + ((e&&e.message)||''), 20000);
  }finally{ App.보내는중 = false; render(); }
}

async function 진짜보내기(){
  if(App.보내는중) return toast('보내는 중입니다 — 잠시만 기다려 주세요');
  if(!App.isAdmin) return toast('보내기는 총괄관리자만 누를 수 있습니다');
  const d = 지금회차();
  const r = 명단셈();
  const 갈수있나 = Core.보낼수있나(d, r.셈);
  if(!갈수있나.ok) return toast(갈수있나.까닭, 8000);
  const 편 = 지금편지(); if(!편) return toast('실을 것이 없습니다');

  /* ⚠ 여기서 제 셈을 하지 않는다 — Core 한 자리에서만 (서버 etaText 와 맞춰 둔 자리).
       예전에는 `곳수 × 15초` 로 셈해 300곳이면 「약 75분」이라 해 놓고 3시간 45분이
       걸렸다. 대표께서 이 숫자를 보고 되돌릴 수 없는 단추를 누르신다. */
  const 걸림 = Core.보낼시간(r.ok.length, BULK_GAP_SEC);
  const 첨 = 첨부셈(r.ok.length);
  /* 추적 밑주소를 설정에 넣지 않으면 편지에 추적이 «안 들어간다» — 예전처럼 나간다.
     그러면 열람·미열람이 영영 빈칸이니, 보내기 전에 한 번 알려 드린다. */
  if(!(App.설정.추적밑주소||'').trim()
     && !confirm('⚠ 열람 추적이 꺼져 있습니다 (설정 → 추적 밑주소가 비어 있습니다).\n\n'
       + '이대로 보내면 누가 열었는지 «알 수 없습니다» —\n'
       + '미열람 셈도 쌓이지 않습니다.\n\n그래도 보낼까요?')) return;
  if(!confirm(
    `「${편.제목}」\n\n`
    /* ⚠ 「어느 유형에 나가나」를 «맨 앞»에 말한다. 되돌릴 수 없는 단추 앞이다.
       ★★ 경고(⚠)는 «좁힌 쪽»에 붙는다 — 기본이 「전체」가 되었으므로
         (대표 결정 2026-09-07 「116곳 전부」). 2026-09-03 에는 반대였다.
         전체로 나가는 것이 정한 대로이고, 한 유형만 나가는 것이 알아야 할 일이다 —
         칩을 켜 둔 채 누르면 나머지 곳은 그 주를 빈다.
       ⚠ 늘 뜨는 경고는 곧 아무도 안 읽는다. 그래서 «드문 쪽»에만 붙인다.
       ⚠ 「골라 두셨습니다」라고 적지 않는다 — 칩은 보려고 누른 것일 수 있다.
         고르지 않은 것을 골랐다고 하면 그 말을 다음부터 안 믿는다. */
    + (App.유형
        ? `· ⚠ 유형 — 「${App.유형}」에만 나갑니다 (`
          + Core.유형들.map(t=>t.키).filter(k=>k!==App.유형).join('·') + ` 에는 안 나갑니다)\n`
        : `· 유형 — 전체 (${Core.유형들.map(t=>t.키).join('·')} 모두 나갑니다)\n`)
    + `· 받는 곳 — ${r.ok.length.toLocaleString()}곳 (한 곳에 한 통씩, 서로 주소가 안 보입니다)\n`
    + `· 뺀 곳 — 수신거부 ${r.셈.수신거부} · 주소없음 ${r.셈.주소없음} · 겹침 ${r.셈.겹침}\n`
    + `· 다 나가는 데 ${걸림}`
    /* ★ 첨부가 붙으면 «몇 MB 가 몇 곳에» 가는지 여기서 말한다 —
         되돌릴 수 없는 단추 앞이고, 다음메일이 중간에 막으면 절반만 나간다. */
    + 첨.말 + `\n\n`
    + `천천히 나가는 까닭 — 한꺼번에 보내면 다음메일이 막습니다.\n`
    + `창을 닫아도 서버가 계속 보냅니다.\n\n보낼까요?`)) return;

  App.보내는중 = true; render();
  try{
    /* ★ 「번호 → 주소」 대장을 «걸기 전에» 만들어 적는다
         (대표 지시 2026-09-03 「고쳐라」 — 추적 주소에 메일 주소를 싣지 않는다).
         편지에는 뜻 없는 번호만 실리고, 서버(newsOpen·newsClick)가 이 대장으로
         누구인지 알아본다. 번호는 뜻이 없어 새어도 그 자체로는 누구인지 모른다.
       ⚠ «걸기 전»이어야 한다. 걸고 나서 적으면 그 사이 열어 본 사람의 표가
         「모르는 번호」로 버려진다 — 열람이 조용히 빠진다.
       ⚠ 대장 쓰기가 실패하면 «걸지 않는다» — 번호만 실린 편지가 나가고 대장이 없으면
         그 회차의 열람은 한 건도 안 잡힌다. 보내기 전에 멈추는 쪽이 낫다.
       ⚠ 한 번의 update 로 담는다 — 110번 나눠 쓰면 중간에 끊겨 절반만 남는다. */
    const 대장 = {};
    r.ok.forEach(function(x){
      const 열 = String(x.email||'').trim().toLowerCase().replace(/[.#$/[\]]/g,'_');
      if(!열) return;
      x.track = 새추적번호();
      대장[x.track] = 열;
    });
    if(Object.keys(대장).length){
      await db.ref('newsletter/issues/' + d.열쇠 + '/받는이').update(대장);
    }

    const j = await 걸기({ to:r.ok, subject:편.제목, body:편.본문, html:편.서식,
                           spacingSec: BULK_GAP_SEC, files: 첨.파일들 });
    d.상태 = '발송'; d.보낸때 = Date.now(); d.받는수 = r.ok.length; d.batchId = j.batchId || '';
    d.보낸이 = (App.me && App.me.email) || '';
    /* ★ 링크 목록을 회차에 «함께» 적는다 — 서버(newsClick)가 번호로 이것을 찾는다.
         ⚠ 안 적으면 클릭이 우리 홈페이지로 튕긴다(목록에 없는 번호는 안 보내는 규칙).
       ★ 「보냄」 표를 통마다 적는다 — 미열람 셈이 «보낸 회차»만 세기 때문이다.
         ⚠ 안 적으면 이 회차가 셈에서 아예 빠져 미열람이 영영 안 쌓인다.
         한 번의 update 로 담는다 — 110번 나눠 쓰면 중간에 끊겨 절반만 남는다. */
    const 보냄표 = {};
    r.ok.forEach(function(x){
      const 열 = String(x.email||'').trim().toLowerCase().replace(/[.#$/[\]]/g,'_');
      if(열) 보냄표[열 + '/보냄'] = true;
    });
    await db.ref('newsletter/issues/' + d.열쇠).update({
      상태:'발송', 보낸때:d.보낸때, 받는수:d.받는수, batchId:d.batchId, 보낸이:d.보낸이,
      링크들: 편.링크들 || []
    });
    if(Object.keys(보냄표).length){
      try{ await db.ref('newsletter/opens/' + d.열쇠).update(보냄표); }
      catch(e){ toast('보냄 표를 못 적었습니다 — 열람 셈이 이 회차를 빠뜨립니다: '
                      + ((e&&e.message)||''), 12000); }
    }
    App.회차들[d.열쇠] = d;
    /* 보냈으니 «다음 회차»로 넘어간다 — 같은 회차를 두 번 보내지 않는다 */
    const 보냄 = {}; Object.keys(App.회차들).forEach(k=>{ if((App.회차들[k]||{}).상태==='발송') 보냄[k]=1; });
    App.지금열쇠 = Core.이번회차(오늘(), 보냄).열쇠;
    toast(`📨 ${(j.n||r.ok.length).toLocaleString()}곳에 걸었습니다 (${j.eta||걸림})`, 12000);
  }catch(e){
    toast('걸지 못했습니다: ' + ((e&&e.message)||''), 12000);
  }finally{ App.보내는중 = false; render(); }
}

/* ══════════════════════════════════════════════════════════════════════════
   보낸 결과 — 나갔나 · 열람 · 반송/자동회신
   ══════════════════════════════════════════════════════════════════════════
   대표 지시 2026-09-03: 「수신확인과 안읽음등을 모두 확인해야한다.
                          푸른메일함에 연결해서 모두 찾아서 확인할 수 있어야한다」

   ★★ 왜 이제야 만드나 — 셋 다 «이미 쌓이고 있었는데 아무 데도 안 보였다».
     ㉠ 열람  — 편지 속 숨은 그림이 서버(newsOpen)에 찍히고 newsletter/opens 에
                열람·열람수·열람첫때가 꼬박꼬박 적히고 있었다.
     ㉡ 나갔나 — 예약 대기열(pucards/scheduled)이 어디까지 갔는지 들고 있었다.
     ㉢ 반송·자동회신 — 푸른메일함(mailbox/msgs/inbox)에 그대로 들어와 있었다.
     읽는 화면이 한 곳도 없어서 모으기만 하고 아무도 못 봤다(2026-09-05 전수 확인).

   ⚠ «수신확인»은 못 한다 — 진짜로 읽었는지는 아무도 알 수 없다.
     그림을 막아 둔 메일 프로그램이 많아서, 읽고도 열람이 안 찍힌다.
     그래서 「안 읽음」이라 적지 않고 「열람 표시 없음」이라 적는다.
     없는 것을 아는 척하면 그 숫자로 명단을 자르게 된다.

   ⚠ 자료는 «이 칸에 들어올 때만» 읽는다. 늘 붙어 있으면 요금이 는다.
     (RTDB 는 켜 둔 만큼 돈이 나간다 — once 로 한 번씩만 읽는다.) */

/* 때를 사람 말로 — 「2026-09-05 16:40」. 0 이면 빈 글자(모르는 것을 지어내지 않는다) */
function 때글(ms){
  const n = Number(ms||0); if(!n) return '';
  const d = new Date(n), p = x => String(x).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())
       + ' ' + p(d.getHours())+':'+p(d.getMinutes());
}

/* 이 회차의 결과 자료를 모아 온다 — 한 번만 읽고 App.결과 에 담아 둔다 */
async function 결과읽기(열쇠){
  const d = App.회차들[열쇠]; if(!d) return null;
  const 보낸때 = Number(d.보낸때||0);
  const 나온것 = { 열람표:{}, 예약줄:{}, 메일:[], 읽은때:Date.now(), 탈:'' };
  try{
    /* ㉠ 열람 표 — 이 회차 것만이라 작다 */
    나온것.열람표 = (await db.ref('newsletter/opens/' + 열쇠).once('value')).val() || {};
    /* ㉡ 아직 대기열에 남은 것 — 나간 것은 서버가 지운다.
       ⚠ 대기열에는 자료 발송도 섞여 있다. 이 회차 것(bulk=batchId)만 고른다. */
    if(d.batchId){
      const v = (await db.ref('pucards/scheduled').once('value')).val() || {};
      const 내것 = {};
      Object.keys(v).forEach(function(k){
        const r = v[k]||{}; if(String(r.bulk||'') === String(d.batchId)) 내것[k] = r;
      });
      나온것.예약줄 = 내것;
    }
    /* ㉢ 푸른메일함 — 보낸 뒤에 들어온 것만 본다.
       ⚠ 통째로 읽지 않는다. 뒤에서 400통만 가져와 보낸 때로 다시 거른다. */
    if(보낸때){
      const v = (await db.ref('mailbox/msgs/inbox').limitToLast(400).once('value')).val() || {};
      나온것.메일 = Object.keys(v).map(function(k){ return v[k]||{}; });
    }
  }catch(e){ 나온것.탈 = (e&&e.message)||String(e); }
  App.결과 = App.결과 || {}; App.결과[열쇠] = 나온것;
  return 나온것;
}

/* 「다시 읽기」 단추 — 방금 보낸 회차는 계속 달라진다 */
async function 결과다시읽기(){
  const 열쇠 = App.본결과; if(!열쇠) return;
  toast('결과를 다시 읽는 중…');
  await 결과읽기(열쇠); render();
}

function 결과회차고르기(k){ App.본결과 = k; render(); 결과채우기(); }

/* 화면을 먼저 그리고, 자료가 없으면 뒤이어 읽는다 — 빈 화면을 오래 두지 않는다 */
async function 결과채우기(){
  const 열쇠 = App.본결과; if(!열쇠) return;
  if(App.결과 && App.결과[열쇠]) return;
  await 결과읽기(열쇠); render();
}

function 결과줄들(열쇠){
  const 자 = (App.결과||{})[열쇠];
  const d = App.회차들[열쇠] || {};
  const 명단 = 명단셈().전체 || [];
  if(!자) return { 줄들:[], 셈:null, 자료:null };
  const 찾음 = Core.메일함에서찾기(명단, 자.메일, Number(d.보낸때||0));
  const 합침 = Core.보낸결과(명단, 자.예약줄, 찾음);
  const 줄들 = Core.열람붙이기(합침, 자.열람표);
  return { 줄들:줄들, 셈:Core.결과셈(줄들), 자료:자, 못붙임:찾음.못붙임||[] };
}

function 결과화면(){
  const 보낸것 = Object.keys(App.회차들)
    .filter(k => (App.회차들[k]||{}).상태 === '발송').sort().reverse();
  if(!보낸것.length){
    return '<div class="note">아직 보낸 회차가 없습니다 — 한 번 보내고 나면 여기에 '
      + '나갔는지 · 열어 봤는지 · 반송이 왔는지가 쌓입니다.</div>';
  }
  const 고른것 = (App.본결과 && App.회차들[App.본결과] && 보낸것.indexOf(App.본결과)>=0)
    ? App.본결과 : 보낸것[0];
  if(App.본결과 !== 고른것){ App.본결과 = 고른것; setTimeout(결과채우기, 0); }
  else setTimeout(결과채우기, 0);

  const d = App.회차들[고른것] || {};
  const r = 결과줄들(고른것);

  const 고르개 = '<select onchange="결과회차고르기(this.value)" style="padding:7px 10px;'

    + 보낸것.map(function(k,i){
        const x = App.회차들[k]||{};
        return '<option value="'+esc(k)+'"'+(k===고른것?' selected':'')+'>'
          + (i+1) + '. ' + esc(x.이름||k) + ' · ' + (x.받는수||0) + '곳</option>';
      }).join('')

  if(!r.셈){
    return '<div class="pad">' + 고르개

  }
  if(r.자료 && r.자료.탈){
    return '<div class="pad">' + 고르개
      + '<div class="note" style="margin-top:12px;color:#b91c1c">결과를 읽지 못했습니다 — '
      + esc(r.자료.탈) + '</div></div>';
  }

  const c = r.셈;
  const 칸 = function(이름, 수, 빛){
    return '<div style="flex:1;min-width:88px;background:#fff;border:1px solid var(--line);'
      + 'border-radius:10px;padding:9px 12px">'
      + '<div style="font-size:11px;color:var(--sub);font-weight:700">'+이름+'</div>'
      + '<div style="font-size:19px;font-weight:800;color:'+빛+'">'+수.toLocaleString()+'</div></div>';
  };
  const 띠 = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 6px">'
    + 칸('보낸 곳', c.전체, '#1e293b')
    + 칸('나감', c.나감, '#166534')
    + (c.대기 ? 칸('대기', c.대기, '#854d0e') : '')
    + (c.실패 ? 칸('실패', c.실패, '#b91c1c') : '')
    + (c.안걺 ? 칸('안 걸림', c.안걺, '#b91c1c') : '')
    + 칸('열람', c.열람, '#2563eb')
    + (c.클릭 ? 칸('링크 누름', c.클릭, '#2563eb') : '')
    + 칸('반송', c.반송, '#b91c1c')
    + 칸('자동회신', c.자동회신, '#854d0e')
    + '</div>';

  /* ⚠ 「열람 없음」을 「안 읽음」이라 적지 않는다 — 그림을 막아 둔 사람은
       읽고도 안 찍힌다. 아는 것만 말한다. */
  const 안내 = '<div class="note" style="margin:2px 0 10px">'
    + '📌 <b>열람</b>은 편지 속 그림이 열린 것을 센 수입니다 — '
    + '그림을 막아 둔 메일 프로그램이 많아 <b>읽고도 안 찍힐 수 있습니다</b>. '
    + '그래서 「안 읽음」이 아니라 「표시 없음」이라 적습니다.<br>'
    + '📌 <b>반송·자동회신</b>은 푸른메일함(받은편지함)에서 찾은 것입니다 — '
    + '보낸 때(' + esc(때글(Number(d.보낸때||0))) + ') 뒤에 온 것만 봅니다.'
    + (r.못붙임 && r.못붙임.length
        ? '<br>⚠ 반송·자동회신처럼 보이는데 <b>어느 곳인지 못 맞춘 것 '
          + r.못붙임.length + '통</b>이 있습니다 (아래 맨 끝에 적었습니다).'
        : '')

  const 딱 = function(글, 바탕, 글빛){
    return '<span class="pill" style="background:'+바탕+';color:'+글빛+'">'+글+'</span>';

  const 상태딱 = function(x){

    if(s==='나감')   return 딱('✓ 나감', '#f0fdf4', '#166534');

    if(s==='실패')   return 딱('⚠ 실패', '#fef2f2', '#b91c1c');

  const 몸 = r.줄들.map(function(x,i){
    const 상 = Core.보낸상태(x);
    const 열람칸 = x.열람
      ? 딱('👁 ' + (x.열람수>1 ? x.열람수+'번' : '봄'), '#eff6ff', '#1e40af')
      : (상==='나감' ? '<span style="color:var(--faint);font-size:11px">표시 없음</span>' : '—');
    const 함 = x.메일함;
    const 함칸 = !함 ? '—'
      : (함.갈래==='반송' ? 딱('↩ 반송', '#fef2f2', '#b91c1c')
                        : 딱('🤖 자동회신', '#fffbeb', '#854d0e'));
    /* ⚠ 한 칸은 한 줄이다 — 자세한 것은 title 로 미룬다 */
    const 도움 = [
      x.오류 ? '탈: ' + x.오류 : '',
      x.열람첫때 ? '처음 본 때 ' + 때글(x.열람첫때) : '',
      함 ? '메일함: ' + (함.제목||'') : ''
    ].filter(Boolean).join('\n');
    return '<tr'+(도움?' title="'+esc(도움)+'"':'')+'>'
      + '<td style="color:var(--faint);text-align:right">'+(i+1)+'</td>'
      + '<td style="font-weight:700">'+esc(x.company||x.name||'')+'</td>'
      + '<td>'+esc(x.name||'')+(x.직급?' <span style="color:var(--faint)">'+esc(x.직급)+'</span>':'')+'</td>'
      + '<td style="font-size:11.5px;color:var(--sub)">'+esc(x.email||'')+'</td>'
      + '<td>'+상태딱(x)+'</td>'
      + '<td>'+열람칸+'</td>'
      + '<td>'+함칸+'</td>'
      + '</tr>';
  }).join('');

  const 못붙인칸 = (r.못붙임 && r.못붙임.length)
    ? '<div class="note" style="margin-top:14px"><b>어느 곳인지 못 맞춘 '
      + r.못붙임.length + '통</b> — 사람이 눈으로 봐야 합니다<br>'
      + r.못붙임.slice(0,10).map(function(m){
          return '· ' + esc(m.갈래) + ' · ' + esc(m.보낸이||'') + ' · ' + esc(m.제목||'');
        }).join('<br>')
      + (r.못붙임.length>10 ? '<br>· 외 ' + (r.못붙임.length-10) + '통' : '')
      + '</div>'
    : '';

  return '<div class="pad">'
    + '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
    + 고르개
    + '<button class="btn" onclick="결과다시읽기()">⟳ 다시 읽기</button>'
    + '<span style="color:var(--faint);font-size:11.5px">'
    + (r.자료 && r.자료.읽은때 ? esc(때글(r.자료.읽은때)) + ' 기준' : '') + '</span>'
    + '</div>'
    + 띠 + 안내
    + '<table class="list" style="width:100%"><thead><tr>'
    + '<th style="width:44px;text-align:right">#</th><th>업체</th><th>담당자</th>'
    + '<th>주소</th><th style="width:92px">나갔나</th>'
    + '<th style="width:96px">열람</th><th style="width:104px">메일함</th>'
    + '</tr></thead><tbody>' + 몸 + '</tbody></table>'
    + 못붙인칸
    + '</div>';
}

/* ══════════════════════════════════════════════════════════════════════════
   지난 회차
   ══════════════════════════════════════════════════════════════════════════ */
function 지난회차화면(){
  /* ★ 두 칸이다 (대표 지시 2026-09-03 「지난회차를 클릭하면 오른쪽에 지난회차 보이게 하고
       왼쪽에는 차수별 내용이 순서대로 정리되게 해라. 넘버링 해라」).
     ⚠ 번호는 «최근이 1번»이다 — 회차가 늘면 옛 번호가 밀린다.
       그래서 번호는 «이름표가 아니라 세는 수»다. 회차 이름(2026년 08월 5주차)이 이름표다.
     ⚠ 고른 회차는 App.본회차 에 남는다 — 다른 칸에 갔다 와도 그대로 보인다. */
  const 열쇠들 = Object.keys(App.회차들).sort().reverse();
  if(!열쇠들.length) return '<div class="note">아직 만든 회차가 없습니다.</div>';
  /* 아무것도 안 고르셨으면 «맨 위(가장 최근)»를 보여 준다 — 빈 칸을 두지 않는다 */
  const 고른것 = (App.본회차 && App.회차들[App.본회차]) ? App.본회차 : 열쇠들[0];

  const 줄 = 열쇠들.map(function(k,i){
    const d = App.회차들[k] || {};
    const 회 = d.회차 || 회차로부터(k);
    const 수 = Core.꼭지들.reduce((a,g)=>a+(((d.안||{})[g.키]||[]).length),0)
             + (String(d.우리글||'').trim() ? 1 : 0);
    const 딱지 = { 초안:'b-draft', 시험:'b-test', 발송:'b-sent' }[d.상태] || 'b-draft';
    return '<tr class="pick' + (k===고른것 ? ' on' : '') + '" onclick="회차보기(\'' + k + '\')">'
      + '<td class="n">' + (i+1) + '</td>'
      + '<td><b>' + esc(회.이름||k) + '</b>'
        + '<div style="font-size:10.5px;color:var(--faint)">' + esc(회.기간||'') + '</div></td>'
      + '<td><span class="badge ' + 딱지 + '">' + esc(d.상태||'초안') + '</span></td>'
      + '<td>' + 수 + '건</td>'
      + '<td>' + (d.받는수 ? d.받는수.toLocaleString()+'곳' : '<span style="color:var(--faint)">—</span>') + '</td>'
      + '<td>' + (d.보낸때 ? new Date(d.보낸때).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '<span style="color:var(--faint)">—</span>') + '</td>'
      + '</tr>';
  }).join('');

  const 본것 = App.회차들[고른것] || {};
  const 본회 = 본것.회차 || 회차로부터(고른것);
  const 몇번 = 열쇠들.indexOf(고른것) + 1;

  return `
  <div class="cols" style="margin-top:12px">
   <div>
    <div class="box" style="margin:0">
     <h3>지난 회차 <span class="cnt">${열쇠들.length}</span><span class="sp"></span>
      <span style="font-size:11px;color:var(--faint)">줄을 누르면 오른쪽에 보입니다</span></h3>
     <table class="list"><tr><th class="n">#</th><th>회차</th><th>상태</th><th>실린 것</th>
       <th>받는 곳</th><th>보낸 때</th></tr>${줄}</table>
    </div>
    <div class="note"><b>이미 보낸 회차는 다시 못 보냅니다</b> —
     같은 뉴스레터를 두 번 받는 일이 없게 막아 두었습니다.
     고쳐서 보시려면 「이번 회차로 열기」로 열어 «보기만» 하십시오.<br>
     ⚠ 번호는 <b>최근이 1번</b>입니다. 회차가 늘면 밀리므로 «이름표»로 쓰지 마십시오 —
     이름표는 회차 이름(${esc(본회.이름||'')})입니다.</div>
   </div>

   <div class="pv">
    <div class="pvhd">👁 <b>${몇번}. ${esc(본회.이름||고른것)}</b><span class="sp"></span>
     <button class="mini" onclick="회차열기('${고른것}')">이번 회차로 열기</button>
     <button class="mini" onclick="회차크게('${고른것}')">크게</button></div>
    <div class="paper"><iframe id="pastFrame" title="지난 회차 미리보기"></iframe></div>
   </div>
  </div>`;
}

/* 왼쪽 줄을 누르면 오른쪽만 바뀐다 */
function 회차보기(k){
  App.본회차 = k;
  render();
}

/* 지난 회차 미리보기를 그린다 — 「이번 회차」의 미리보기와 «같은 짓는 층»을 쓴다.
   ⚠ 여기서 편지를 다시 짜지 않는다. 두 벌이면 지난 회차가 실제로 나간 것과 달라 보인다. */
function 지난미리보기그리기(){
  const f = $('pastFrame'); if(!f) return;
  const 열쇠들 = Object.keys(App.회차들).sort().reverse();
  const k = (App.본회차 && App.회차들[App.본회차]) ? App.본회차 : 열쇠들[0];
  const d = App.회차들[k]; if(!d) return;
  /* ⚠⚠ «미리보기로» 짓는다 (2026-09-08 에 검사를 넓히다 드러났다)
       여기는 추적 옵션 없이 짓고 있었다. 그러면 지난 회차를 열어 링크를 누를 때마다
       «우리» 클릭이 그 회차 셈에 찍힌다 — 이미 보낸 회차의 열람·클릭이 더럽혀진다.
       대표께서 그 숫자를 보고 「3회 미열람 제외」를 판단하시므로 조용히 틀리면 안 된다. */
  const 편 = Tpl.편지짓기(Object.assign({}, d, { 범위: d.범위 || App.설정.범위 }),
    App.설정, { 미리보기: true });
  const html = 편 ? 편.서식
    : '<div style="padding:24px;font-family:sans-serif;color:#94a3b8;font-size:13px">'
      + '이 회차에는 실린 것이 없습니다.</div>';
  f.srcdoc = '<!doctype html><meta charset="utf-8"><base target="_blank"><body style="margin:0">' + html;
  f.onload = function(){
    try{ f.style.height = (f.contentDocument.body.scrollHeight + 8) + 'px'; }catch(_){}
  };
}

/* 지난 회차를 큰 창으로 */
function 회차크게(k){
  const d = App.회차들[k]; if(!d) return toast('그 회차를 못 찾았습니다');
  /* ⚠ 위(지난미리보기그리기)와 «같은 까닭»으로 미리보기로 짓는다 — 지난 회차의
       열람·클릭 셈을 우리가 보는 것으로 더럽히지 않는다. */
  const 편 = Tpl.편지짓기(Object.assign({}, d, { 범위: d.범위 || App.설정.범위 }),
    App.설정, { 미리보기: true });
  if(!편) return toast('이 회차에는 실린 것이 없습니다');
  $('bigT').textContent = 편.제목;
  $('bigB').innerHTML = '<iframe id="bigF" style="width:100%;border:0;background:#fff" title="미리보기"></iframe>';
  const f = $('bigF');
  f.srcdoc = '<!doctype html><meta charset="utf-8"><base target="_blank"><body style="margin:0">' + 편.서식;
  f.onload = function(){ try{ f.style.height = (f.contentDocument.body.scrollHeight + 8) + 'px'; }catch(_){} };
  $('big').classList.add('on');
}
function 회차열기(k){ App.지금열쇠 = k; App.tab='now'; render(); }

function 명단화면(){
  /* ★ 사본이 없다. 화면을 열 때마다 기업정보함(data/companies/v)에서 만든다.
       대표 지시 2026-09-03: 「매주 실시간으로 확인하고 싶다」
     ★ 계약종료·퇴사에 «여기서 할 일이 없다» — 기업정보함에서 상태를 바꾸거나
       담당자에 퇴사를 켜면 저절로 빠진다. 두 곳을 맞추려 하면 반드시 어긋난다. */
  const r = 명단셈();
  const 광고 = Core.광고표기필요한가(App.설정.범위);
  const 골랐수 = Object.keys(App.고른것 || {}).length;

  /* ★ 번호는 «보이는 차례»로 1번부터 붙인다 (대표 지시 2026-09-03 「넘버링해달라」).
       유형 → 회사 이름 차례로 늘어놓아, 같은 유형이 붙어 보인다.
     ⚠ 번호는 «이름표가 아니라 세는 수»다 — 거르면 다시 1번부터다.
       업체 번호처럼 고정된 것으로 여기면 「3번이 어제와 다르다」가 된다. */
  const 차례 = Core.유형들.reduce(function(m,t,i){ m[t.키]=i; return m; }, {});
  const 정렬 = r.ok.slice().sort(function(a,b){
    const d = (차례[a.유형]||0) - (차례[b.유형]||0);
    return d !== 0 ? d : String(a.company||'').localeCompare(String(b.company||''), 'ko');
  });
  /* 사람 칸을 «셋으로 갈랐다» — 이름 · 직책 · 연락처.
     대표 지시 2026-09-03: 「연락처를 아래에 두지말고 옆에두고 열을 일치시켜라」
     ⚠ 예전에는 연락처를 이름 «아래»에 작게 붙였다. 그러면 줄마다 높이가 달라지고
       연락처가 세로로 안 맞아 훑기 어렵다. 열로 가르면 저절로 맞는다.
     ⚠ 빈 칸은 흐린 「—」로 둔다 — 아예 비우면 어느 열이 무엇인지 헷갈린다. */
  const 빈칸 = '<span style="color:var(--faint)">—</span>';
  const 글칸 = function(v){ const t = String(v == null ? '' : v).trim(); return t ? esc(t) : 빈칸; };
  const 전화칸 = function(v){
    const t = String(v == null ? '' : v).trim();
    return t ? '<span class="tel">' + esc(t) + '</span>' : 빈칸;
  };
  const 줄 = 정렬.map(function(x,i){
    const t = Core.유형들.find(function(v){ return v.키 === x.유형; }) || Core.유형들[0];
    /* 「누구에게 가나」를 딱지로 — 담당자가 없어 대표자에게 가는 곳이 있다 */
    const 누구딱지 = x.누구 === '대표자'
      ? ' <span class="pill" style="background:#eff6ff;color:#1e40af">대표자</span>'
      : ' <span class="pill" style="background:#f1f5f9;color:var(--sub)">담당자</span>';
    return '<tr>'
      /* ★ 체크칸 — 넘버링 «왼쪽»에 (대표 지시 2026-09-03 「넘버링 왼쪽 표시 체크가능하게」).
           주소를 값으로 지닌다 — 골라 놓고 표를 다시 그려도 무엇을 골랐는지 잃지 않는다. */
      + '<td class="ck"><input type="checkbox" class="chk" value="' + esc(x.email) + '"'
        + (App.고른것[String(x.email).toLowerCase()] ? ' checked' : '')
        + ' onchange="고름바뀜(this)"></td>'
      + '<td class="n">' + (i+1) + '</td>'
      + '<td><span class="ty" style="background:' + t.연한빛 + ';color:' + t.진한빛 + '">'
        + t.표시 + ' ' + esc(t.키) + '</span></td>'
      + '<td><b>' + esc(x.company||'') + '</b></td>'
      + '<td>' + 글칸(x.대표자) + '</td>'
      + '<td class="tel">' + 전화칸(x.대표전화) + '</td>'
      + '<td>' + (x.누구 === '대표자' ? 빈칸 : 글칸(x.name)) + '</td>'
      + '<td>' + (x.누구 === '대표자' ? 빈칸 : 글칸(x.title)) + '</td>'
      + '<td class="tel">' + (x.누구 === '대표자' ? 빈칸 : 전화칸(x.전화)) + '</td>'
      + '<td>' + esc(x.email||'') + 누구딱지 + '</td>'
      + '<td style="text-align:right"><button class="mini" onclick="수신거부넣기(\'' + esc(x.email) + '\')">수신거부</button></td>'
      + '</tr>';
  }).join('');

  /* 유형 칩 — 업체관리 도구줄과 «같은 결»이다. 눌린 것을 다시 누르면 전체로 돌아온다. */
  const 칩 = '<div class="chips">'
    + '<button class="chip' + (App.유형 ? '' : ' on') + '" onclick="유형칩누르기(\'\')">📊 전체 '
      + (r.전체||[]).length.toLocaleString() + '</button>'
    + Core.유형들.map(function(t){
        const n = (r.유형셈||{})[t.키] || 0;
        const 켜짐 = App.유형 === t.키;
        return '<button class="chip' + (켜짐 ? ' on' : '') + '"'
          + (켜짐 ? ' style="background:' + t.빛 + ';border-color:' + t.빛 + '"'
                  : (n ? ' style="color:' + t.빛 + '"' : ''))
          + ' onclick="유형칩누르기(\'' + t.키 + '\')" title="' + esc(t.키) + ' 업체만 봅니다">'
          + t.표시 + ' ' + esc(t.키) + ' ' + n + '</button>';
      }).join('')
    + '</div>';

  const 빈곳 = (r.주소없는곳||[]).map(function(c){
    return '<tr><td><b>' + esc(c.name||'') + '</b></td>'
      + '<td style="color:var(--faint)">' + esc(c.id||'') + '</td>'
      + '<td style="text-align:right"><span class="badge b-draft">주소 없음</span></td></tr>';
  }).join('');

  return `
  <div class="hdbar">
    <span class="no">받는 곳 ${r.셈.보낼곳.toLocaleString()}곳${App.유형 ? ' <span style="font-size:13px;color:var(--brown)">('+esc(App.유형)+')</span>' : ''}</span>
    <span style="font-size:12px;color:var(--sub)">
      ${App.유형 ? '전체 '+(r.전체||[]).length.toLocaleString()+'곳 중 · ' : ''}기업정보함 ${(r.본곳||0).toLocaleString()}곳에서 ·
      수신거부 ${r.셈.수신거부} · 겹침 ${r.셈.겹침} · 형식틀림 ${r.셈.주소없음}</span>
    <span class="sp"></span>
    <button class="btn pri" onclick="노무사회엑셀()">↧ 공인노무사회 엑셀</button>
    <button class="mini" onclick="명단내보내기()">↧ CSV</button>
    <button class="mini" onclick="다시읽기()">⟳ 다시 읽기</button>
    <span class="badge ${광고?'b-test':'b-sent'}">
      ${esc(App.설정.범위||'자문중')}${광고?' · (광고) 켜짐':''}</span>
  </div>

  ${칩}

  ${골랐수 ? `<div class="picked">
    <b>${골랐수}곳</b> 골랐습니다
    <span class="sp"></span>

/* CSV 든 이메일 목록이든 한 길로 받는다 — 두 길로 두면 「어느 쪽이었지」가 된다 */
/* 명단을 CSV 로 — 지금 화면에 보이는 «그대로»(기업정보함에서 방금 만든 것) */
function 명단내보내기(){
  const r = 명단셈();
  const 머리 = '회사,담당자,이메일,직책';
  const 몸 = r.ok.map(function(x){
    return [x.company,x.name,x.email,x.title]
      .map(v=>{ const s=String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; })
      .join(',');
  }).join('\r\n');
  /* 첫머리 BOM — 없으면 엑셀이 한글을 깨뜨린다 (기업정보함 toCsv 와 같은 규칙) */
  const blob = new Blob(['\ufeff' + 머리 + '\r\n' + 몸 + '\r\n'], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '뉴스레터-명단-' + 오늘() + '.csv';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}

/* 공인노무사회(mng.nomu.kr) 「엑셀일괄 등록」에 올릴 엑셀을 만든다.
   대표께서 2026-09-03 그 화면을 보여 주셨다 — 뉴스레터를 그쪽 시스템이 보내고,
   푸른노무법인은 거기에 엑셀로 명단을 올린다. 올린 결과 칸이 대상자·메일주소·비고 였다.
   ⚠ 그쪽 「대상자」는 회사 이름이다(사람 이름이 아니다). 담당자는 비고로 보낸다.
   ⚠ 번호를 붙인다 — 그쪽 명단이 113줄인데 우리 셈이 110곳이라, 어느 줄이 다른지
     눈으로 맞춰 보려면 번호가 있어야 한다. */
function 노무사회엑셀(){
  const r = 명단셈();
  if(!r.ok.length) return toast('보낼 곳이 없습니다');

  if(!window.XLSXGEN) return toast('엑셀 도구를 못 읽었습니다 — 새로 고쳐 보세요', 8000);
  const 이름 = '뉴스레터-발송대상자-' + 오늘() + '.xlsx';
  try{
    XLSXGEN.download({
      sheet: '발송대상자',
      title: '푸른노무법인 뉴스레터 발송대상자',
      sub: '기업정보함에서 뽑음 · ' + 오늘() + ' · 범위 ' + (App.설정.범위||'자문중')
         + ' · ' + f.줄들.length + '곳',
      headers: f.머리, rows: f.줄들,
      colRatios: [1, 6, 6, 4], landscape: false
    }, 이름);
    toast('📗 ' + f.줄들.length + '곳을 엑셀로 받았습니다 — 공인노무사회 「엑셀일괄 등록」에 올리세요', 12000);
  }catch(e){ toast('엑셀을 만들지 못했습니다: ' + ((e&&e.message)||''), 8000); }
}

/* 유형 칩 — 눌린 것을 다시 누르면 전체로 돌아온다(업체관리 칩과 같은 결).
   ⚠ 이 값은 «보내는 곳»까지 바꾼다. 그래서 고른 채로 다른 칸에 갔다 와도
     칩이 그대로 켜져 있어야 한다 — 조용히 풀리면 골라 둔 줄 알고 전부에 보낸다. */
function 유형칩누르기(v){
  App.유형 = (App.유형 === v) ? '' : String(v || '');
  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   고르기 — 체크칸 · 전체 선택 · 고른 것만 처리
   ══════════════════════════════════════════════════════════════════════════
   대표 지시 2026-09-03: 「넘버링 왼쪽 표시 체크가능하게 일괄 선택등 가능하게」

   ★ 고른 것을 «주소»로 지닌다(App.고른것). 표를 다시 그려도 무엇을 골랐는지 잃지 않는다 —
     번호나 줄 위치로 지니면 유형 칩을 누르는 순간 엉뚱한 곳이 골라진다.
   ⚠ 고른 것이 없으면 «묻지도 않고» 멈춘다. 빈 선택으로 110곳을 건드리면 사고다. */
function 고름바뀜(el){
  const e = String(el && el.value || '').trim().toLowerCase();
  if(!e) return;
  if(el.checked) App.고른것[e] = 1; else delete App.고른것[e];
  고름띠고치기();
}

/* 이 표에 «보이는 것» 모두 — 유형 칩으로 걸러진 것만이다. 안 보이는 것을 몰래 고르지 않는다. */
function 전체선택(el){
  document.querySelectorAll('.chk').forEach(function(c){
    c.checked = !!el.checked;
    const e = String(c.value||'').trim().toLowerCase();
    if(!e) return;
    if(el.checked) App.고른것[e] = 1; else delete App.고른것[e];
  });
  고름띠고치기();
}

/* 지금 화면에 보이는 것 가운데 골라진 줄들 */
function 고른것(){
  const r = 명단셈();
  return r.ok.filter(x => App.고른것[String(x.email||'').toLowerCase()]);
}

function 고름지우기(){ App.고른것 = {}; render(); }

/* 띠만 고쳐 그린다 — render() 를 부르면 체크칸이 다시 만들어져 깜빡인다 */
function 고름띠고치기(){
  const n = Object.keys(App.고른것).length;
  const 띠 = document.querySelector('.picked');
  if(!띠 && n) { render(); return; }          /* 없던 띠를 띄울 때만 다시 그린다 */
  if(띠 && !n) { render(); return; }
  if(띠) { const b = 띠.querySelector('b'); if(b) b.textContent = n + '곳'; }
}

/* 고른 것만 엑셀 — 공인노무사회 양식 그대로(번호·대상자·메일주소·비고) */

  const f = Core.노무사회양식(골);

      sub:'고른 ' + f.줄들.length + '곳 · ' + 오늘(),
      headers:f.머리, rows:f.줄들, colRatios:[1,6,6,4], landscape:false
    }, '뉴스레터-발송대상자-고른것-' + 오늘() + '.xlsx');

/* 고른 것만 수신거부 — 뉴스레터만 막는다(자료 발송은 그대로 간다) */
async function 고른것수신거부(){
  const 골 = 고른것();
  if(!골.length) return toast('고른 곳이 없습니다');
  if(!confirm('고른 ' + 골.length + '곳에 뉴스레터를 보내지 않습니다.\n'
    + '(자료 발송은 그대로 갑니다)\n\n'
    + 골.slice(0,5).map(x=>' · ' + (x.company||'') + ' — ' + x.email).join('\n')
    + (골.length>5 ? '\n … 그 밖 ' + (골.length-5) + '곳' : '')
    + '\n\n넣을까요?')) return;
  const upd = {};
  골.forEach(function(x){
    const e = String(x.email||'').trim().toLowerCase();
    if(!e) return;
    upd[e.replace(/[.#$/[\]]/g,'_')] = { email:e, at:Date.now(), by:(App.me&&App.me.email)||'' };
  });
  try{
    await db.ref('newsletter/blocked').update(upd);
    Object.keys(upd).forEach(function(k){ App.막은주소[k] = 1; });
    골.forEach(function(x){ App.막은주소[String(x.email||'').toLowerCase()] = 1; });
    App.고른것 = {};
    render();
    toast('🚫 ' + 골.length + '곳을 수신거부에 넣었습니다', 9000);
  }catch(e){ toast('넣지 못했습니다: ' + ((e&&e.message)||''), 8000); }
}

/* 기업정보함을 «다시» 읽는다 — 방금 고친 것이 바로 보이게.
   ⚠ 사본이 없으니 「담기」가 없다. 새로 고치면 그때의 기업정보함이 그대로 명단이다. */
async function 다시읽기(){
  try{
    const v = await db.ref('data/companies/v').once('value');
    App.사업장들 = v.val() || {};
    render();
    toast('기업정보함을 다시 읽었습니다 — 받는 곳 ' + 명단셈().셈.보낼곳.toLocaleString() + '곳');
  }catch(e){ toast('다시 읽지 못했습니다: ' + ((e&&e.message)||''), 7000); }
}

/* 이 주소로는 뉴스레터를 안 보낸다.
   ⚠ 기업정보함을 «건드리지 않는다» — 거래처가 「뉴스레터는 그만」이라 해도
     자료 발송은 계속 받아야 한다. 그래서 뉴스레터만의 막은 명단에 담는다.
   ⚠ 공용 수신거부(config/mailBlock)에 담으면 그 곳에 «아무 메일도» 못 간다. */
async function 수신거부넣기(주소){
  const e = String(주소||'').trim().toLowerCase();
  if(!e) return;
  if(!confirm(e + '\n\n이 주소로 뉴스레터를 보내지 않습니다.\n(자료 발송은 그대로 갑니다)\n\n넣을까요?')) return;
  const 열 = e.replace(/[.#$/[\]]/g, '_');
  try{
    await db.ref('newsletter/blocked/' + 열).set({ email: e, at: Date.now(),
      by: (App.me && App.me.email) || '' });
    App.막은주소[e] = 1; App.막은주소[열] = 1;
    render();
    toast('수신거부에 넣었습니다 — ' + e);
  }catch(err){ toast('넣지 못했습니다: ' + ((err&&err.message)||''), 7000); }
}

/* ══════════════════════════════════════════════════════════════════════════
   설정

/* 접힌 칸 안에 «넣을 것이 남았는지» — 열어 보지 않고도 알게 (2026-09-08)
   대표께서 옆 사진 주소를 넣으려고 접힌 줄을 못 찾아 한참 헤매셨다.
   ⚠ 「4칸 중 2칸」처럼 세어 보이면, 접혀 있어도 «안에 할 일이 있나»를 안다.
   ⚠ 로고는 «일부러» 비워 두는 값이다(글자 방패가 그림보다 낫다 — 메일이 그림을
     막아도 보인다). 그래서 다 채우는 것이 목표가 아니다 — 세어 보이기만 한다. */
function 그림칸셈(s){
  const 칸 = ['로고그림','배너그림','뉴스그림','추적밑주소'];
  const n = 칸.filter(k => String((s||{})[k] || '').trim()).length;
  return `${칸.length}칸 중 ${n}칸 넣음`;
}

function 설정화면(){
  const s = App.설정;
  const 옵 = Core.범위들.map(v=>`<option value="${v}" ${s.범위===v?'selected':''}>${v}</option>`).join('');
  /* ★★ 좌우 반반 — 왼쪽 «설정», 오른쪽 «가져오기» (대표 지시 2026-09-07)
       「뉴스레터 설정 화면은 정리해서 왼쪽절반에 넣고 자료 가지고 오는것은 오른쪽절반으로」
     ★ 세 상자가 위아래로 쌓여 설정 한 화면이 두 번 굴러야 다 보였다.
       가로로 나누면 굴리지 않고 한눈에 들어온다 — 오른쪽 둘은 «누르는 것»뿐이라 짧다.
     ⚠ 폰에서는 위아래 한 줄이 된다 (대표 확인 2026-09-07
       「폰에서는 목업대로 그러나 피시에서는 좌우 화면으로」).
       그 규칙은 .cols 가 이미 갖고 있다 — 여기서 따로 짜지 않는다.

     ■ 정리한 곳 셋 (대표 지시 「정리해서」)
       ① 그림·열람 추적 네 칸을 «접었다» — 한 번 넣으면 안 건드리는 것들이다.
          ⚠ 지운 것이 아니다. 안내도 그대로 안에 있다.
       ② 「보내는 때는 손으로」 안내를 «보내기 칸 아래»로 옮겼다 —
          자료 가져오기와 상관없는 말인데 그 상자 아래에 붙어 있었다.
       ③ 묶음은 얇은 금 하나로만 갈랐다 — 머리 줄을 새로 만들면
          2026-09-03 에 없앤 세 줄이 되돌아온다.
     ⚠ 긴 안내는 여전히 «지우지 않는다» — ⓘ 로 접을 뿐이다. */
  return `
  <div class="cols">

   <!-- ══ 왼쪽 — 설정 ══ -->
   <div>
    <div class="box">
     <h3>뉴스레터 설정</h3>
     <div class="pad g2">
      <div>
       <label class="f">받는 명단의 범위 ${도움(
         '<b>이 값이 (광고) 표기를 켜고 끕니다.</b><br>'
         + '<b>자문중</b> — 거래관계 안이라 (광고) 표기 없음<br>'
         + '<b>자문끝·명함전부</b> — 제목에 (광고) 가 붙고 꼬리에 안내가 들어갑니다. '
         + '사전 동의는 <b>사람이 받아 두셔야</b> 합니다.')}</label>
       <select id="cfgScope" onchange="설정저장()">${옵}</select>

/* 서버에 「가져와라」고 시킨다.
   ⚠ 결과를 «화면에 그대로» 보여 준다 — 실패하면 까닭까지. 조용히 넘기면
     아무것도 안 왔는데 왜인지 아무도 모른다. */
/* 발간자료·판례를 «지금» 받아 오라고 서버에 시킨다 (대표 지시 2026-09-05).
   ⚠ 남의 서버를 여러 번 두드리는 일이라 오래 걸린다 — 첨부까지면 1~2분.
     기다리는 동안 무슨 일이 되고 있는지 화면이 말해야 한다. */
const DOCS_FN_URL = 'https://asia-northeast3-pureun-erp.cloudfunctions.net/newsDocsPull';
var _자료중 = false;
async function 자료가져오기(첨부까지){
  if(_자료중) return toast('가져오는 중입니다 — 잠시만');
  const 바쁨 = $('docsBusy'), 칸 = $('docsOut');
  _자료중 = true;
  if(바쁨) 바쁨.textContent = 첨부까지
    ? '⏳ 받는 중… 첨부까지 받으니 1~2분 걸립니다'
    : '⏳ 목록을 훑는 중…';
  if(칸) 칸.textContent = '';
  try{
    const u = firebase.auth().currentUser;
    if(!u) throw new Error('로그인이 풀렸습니다');
    const token = await u.getIdToken();
    const res = await fetch(DOCS_FN_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + token },
      body: JSON.stringify({ 내려받기: !!첨부까지, 자료몇: 6, 판례몇: 4 })
    });
    let j=null; try{ j = await res.json(); }catch(_){}
    if(!res.ok || !j || !j.ok){
      const err = new Error((j&&j.error) || ('서버 응답 ' + res.status));
      err.답 = j || null; throw err;
    }
    if(칸) 칸.textContent = JSON.stringify(j, null, 2).slice(0, 3000);
    toast(`📥 자료 ${j.자료새로||0}건(첨부 받은 것 ${j.받은것||0}) · 판례 ${j.판례새로||0}건 새로 담았습니다`
      + ' — 「이 주차로 채우기」를 누르시면 회차에 들어갑니다', 12000);
  }catch(e){
    const 말 = (e&&e.message) || String(e);
    if(칸){
      const 속 = (e && e.답) || null;
      칸.textContent = '✗ ' + 말 + (속 ? '\n\n' + JSON.stringify(속, null, 2).slice(0, 3000) : '');
    }
    toast('가져오지 못했습니다: ' + 말, 12000);
  }finally{
    _자료중 = false;
    if(바쁨) 바쁨.textContent = '';
  }
}

const ILABOR_FN_URL = 'https://asia-northeast3-pureun-erp.cloudfunctions.net/ilaborPull';
var _노무사회중 = false;
async function 노무사회가져오기(방식){
  if(_노무사회중) return toast('가져오는 중입니다 — 잠시만');
  const 바쁨 = $('ilaborBusy'), 칸 = $('ilaborOut');
  _노무사회중 = true;
  if(바쁨) 바쁨.textContent = '⏳ 가져오는 중… (상세+첨부는 1분 넘을 수 있습니다)';
  if(칸) 칸.textContent = '';
  try{
    const u = firebase.auth().currentUser;
    if(!u) throw new Error('로그인이 풀렸습니다');
    const token = await u.getIdToken();
    const res = await fetch(ILABOR_FN_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + token },
      body: JSON.stringify({ mode: 방식, limit: 10 })
    });
    let j=null; try{ j = await res.json(); }catch(_){}
    if(!res.ok || !j || !j.ok){
      /* ⚠ 서버가 준 답을 «오류에 실어» 보낸다 — 걸음·막힌 주소·까닭이 거기 있다.
           메시지 한 줄만 던지면 화면이 그것밖에 못 보여 준다. */
      const err = new Error((j&&j.error) || ('서버 응답 ' + res.status));
      err.답 = j || null;
      throw err;
    }
    if(칸) 칸.textContent = JSON.stringify(j, null, 2).slice(0, 4000);
    toast(방식==='peek' ? '🔍 엿보기 끝 — 아래에 결과가 있습니다'
        : ('✅ ' + (j.목록수||0) + '건 훑고 ' + ((j.가져온것||[]).length || j.새것 || 0) + '건 담았습니다'), 9000);
  }catch(e){
    const 말 = (e&&e.message) || String(e);
    /* ⚠ 한 줄만 보여 주면 고칠 수가 없다 — 서버가 준 «걸음·막힌 주소·까닭»을 다 펼친다.
         2026-09-04 에 「fetch failed」 한 줄만 보고 어디서 막혔는지 몰라 헤맸다. */
    if(칸){
      const 속 = (e && e.답) || null;
      칸.textContent = '✗ ' + 말 + (속 ? '\n\n' + JSON.stringify(속, null, 2).slice(0, 4000) : '');
    }
    toast('가져오지 못했습니다: ' + 말, 12000);
  }finally{
    _노무사회중 = false;
    if(바쁨) 바쁨.textContent = '';
  }
}
function 설정저장(){
  const g = id => { const el=$(id); return el ? el.value : ''; };
  App.설정 = Object.assign({}, App.설정, {
    범위: g('cfgScope') || '자문중',
    회사이름: g('cfgName') || '푸른노무법인',
    회신주소: g('cfgReply'),
    시험주소: g('cfgTestTo'),
    꼬리한줄: g('cfgFoot'),
    주소: g('cfgAddr'),
    전화: g('cfgTel'),
    보내는주소: g('cfgFrom'),
    대표자도: g('cfgCeo') !== 'n',
    추적밑주소: g('cfgTrack'),
    뉴스그림: g('cfgNews'),
    배너그림: g('cfgBanner'),
    로고그림: g('cfgLogo')
  });
  db.ref('newsletter/config').update(App.설정)
    .then(()=>toast('저장했습니다'))
    .catch(e=>toast('저장 실패: ' + ((e&&e.message)||''), 7000));
}
