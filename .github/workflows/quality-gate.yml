name: Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full system tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run all automated checks
        # ⚠ functions/ 검사도 함께 돈다 (2026-08-29).
        #   여태 tests/ 만 돌아서 functions/hana-message.test.js 가 빨강인 채로
        #   남아 있었다 — 2026-08-26 에 규칙이 뒤집혔는데 아무도 못 봤다.
        #   ★ 폰 거르개 검사가 «이 파일의 표본을 읽어» 쓴다. 여기가 썩으면
        #     폰 쪽 그물도 같이 헐거워진다.
        run: node --test tests/*.test.js functions/*.test.js

