name: Test and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-package:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run all automated checks
        run: node --test tests/*.test.js
      - name: Create deployed version metadata
        run: node scripts/write-version.js
        env:
          PU_RELEASE_SHA: ${{ github.sha }}
          PU_RELEASE_RUN: ${{ github.run_id }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    name: Deploy verified version
    needs: verify-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
