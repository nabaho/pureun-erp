name: Test and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-package:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run all automated checks
        run: node --test tests/*.test.js
      - name: Create deployed version metadata
        run: node scripts/write-version.js
        env:
          PU_RELEASE_SHA: ${{ github.sha }}
          PU_RELEASE_RUN: ${{ github.run_id }}
      # ── 개발용 파일은 인터넷에 올리지 않는다 ──
      # Pages 는 저장소를 통째로 올리므로, 검사·도구·문서까지 주소만 알면 열렸다.
      # (2026-08-15 확인: fund-erp/tools/check_closing.js 가 실제 기금명·결산 금액을 담은 채 공개돼 있었다)
      #
      # 여기서 지우는 것은 **러너에 받아둔 사본**이다 — 저장소 파일은 그대로 남는다.
      # 남기는 폴더: js·css·vendor (앱이 실행 중에 불러 쓴다) + 최상위 html/js/png/manifest
      # 지우기 전에 앱이 그 폴더를 부르지 않는지 확인했다(HTML src/href 전수 조사, fetch·서비스워커 포함).
      # ⚠ 새 폴더를 여기 추가할 때는 앱이 실행 중에 부르지 않는지 반드시 먼저 확인할 것.
      - name: Strip developer-only files from the site
        run: |
          set -eu
          for d in tests fund-erp docs harness scripts engine app tools reference functions _scan_out \
                   .github .claude .githooks .superpowers .codex-worktrees; do
            if [ -e "$d" ]; then rm -rf "$d"; echo "제외: $d"; fi
          done
          # ── 최상위 개발용 파일도 지운다 ──
          # 폴더만 지우면 이것들이 열린 채 그대로 남는다. 실제로 payroll-STATUS.md
          # (급여 시스템 내부 작업 로그 8.5KB)가 주소만 알면 읽히고 있었다.
          # 앱이 .md·.bat·firebase.json·.firebaserc·.mcp.json 을 부르는 곳은 없다(전수 확인).
          # .mcp.json 은 개발자 도구(한글 서식·법령·인사 MCP) 연결 설정이다 —
          # 앱과 무관하고, 어떤 도구를 붙여 쓰는지까지 인터넷에 알릴 까닭이 없다.
          # ⚠ 최상위 .js 는 건드리지 않는다 — fund_forms·hwp_extract·hwpx_gen·
          #   rules_std·std_2026·xlsx_gen 과 서비스워커들을 HTML 이 실제로 부른다.
          rm -f -- *.md *.bat firebase.json .firebaserc .mcp.json
          echo "제외: 최상위 *.md *.bat firebase.json .firebaserc .mcp.json"
          # 앱이 실제로 쓰는 것이 실수로 사라졌으면 여기서 배포를 멈춘다
          # ⚠ install.html·아이콘도 «앱으로 깔기» 의 길이다 — 사라지면 폰에 못 깐다
          # ⚠ hana-bridge.apk 는 휴대폰 하나문자 앱이다 (2026-08-29).
          #   사라지면 대표가 다시 GitHub Actions → Artifacts 를 뒤져야 한다 —
          #   「받아서 폰으로 옮기는 게 귀찮다」가 이것을 만든 까닭이다.
          for keep in js css vendor enter.html fund.html work.html pu-erp.html \
                      manifest.json hwpx_gen.js pu-sw.js hana-bridge.apk \
                      install.html icon-portal-192.png icon-portal-512.png; do
            test -e "$keep" || { echo "::error::배포에 필요한 $keep 이 없습니다"; exit 1; }
          done
          # 개발용이 하나라도 남았으면 멈춘다 — 지우는 목록이 낡아도 여기서 걸린다
          for gone in payroll-STATUS.md work-STATUS.md CLAUDE.md README.md \
                      firebase.json .mcp.json .claude tests docs fund-erp functions; do
            test ! -e "$gone" || { echo "::error::개발용 $gone 이 아직 남아 있습니다"; exit 1; }
          done
          echo "남은 최상위 항목:"; ls -1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    name: Deploy verified version
    needs: verify-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
