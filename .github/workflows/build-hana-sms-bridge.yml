name: 권형하 휴대폰 하나문자 앱 만들기

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/hana-sms-bridge/**'
      - '.github/workflows/build-hana-sms-bridge.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/hana-sms-bridge/**'
      - '.github/workflows/build-hana-sms-bridge.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/hana-sms-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: APK 만들기
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pureun-hana-message-android
          path: android/hana-sms-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
