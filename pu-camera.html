<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>푸른카메라</title>
<link rel="manifest" href="pu-camera-manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="푸른카메라">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check-compat.js"></script>
<style>
:root{ --blue:#1e40af; --ink:#101828; --sub:#5a6885; --line:#e4e8f0; --bg:#f4f6fb; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
img{max-width:100%}
#app{display:flex;flex-direction:column;height:100%}

/* 상단바 */
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:#101010;color:#fff}
#top .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
#top .mark{width:26px;height:26px;border-radius:8px;background:#2a6bf2;display:flex;align-items:center;justify-content:center;font-size:14px}
#top .who{margin-left:auto;font-size:12px;color:#c7d0e0;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top .ico{background:none;border:none;color:#fff;font-size:18px;padding:6px}

/* 로그인 안내 */
#login{flex:1;display:none;align-items:center;justify-content:center;padding:24px}
#login .card{max-width:340px;width:100%;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 22px;text-align:center;box-shadow:0 10px 30px rgba(20,40,90,.08)}
#login .m{width:52px;height:52px;border-radius:14px;background:#2a6bf2;color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
#login h1{font-size:18px;margin:0 0 6px}
#login p{font-size:13.5px;color:var(--sub);line-height:1.65;margin:0 0 20px}
#login a{display:block;background:var(--blue);color:#fff;text-decoration:none;padding:14px;border-radius:12px;font-weight:700}

/* 촬영 홈 */
#home{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#home .hint{color:var(--sub);font-size:14px;line-height:1.6;max-width:300px}
#home .big{width:150px;height:150px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-size:20px;font-weight:800;box-shadow:0 12px 30px rgba(30,64,175,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#home .big .ic{font-size:40px}
#home .sub{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#home .sub button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;color:var(--ink)}
#home .stat{font-size:12.5px;color:var(--sub)}

/* 카메라 */
#cam{position:fixed;inset:0;z-index:40;background:#000;display:none;flex-direction:column}
#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camframe{position:absolute;left:6%;right:6%;top:50%;transform:translateY(-50%);aspect-ratio:1.6/1;border:2px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
#camtip{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:0;right:0;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#cambar{position:absolute;left:0;right:0;bottom:0;padding:18px 24px calc(env(safe-area-inset-bottom) + 22px);display:flex;align-items:center;justify-content:space-between}
#cambar .side{background:rgba(255,255,255,.15);border:none;color:#fff;font-size:12px;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px}
#cambar .side b{font-size:20px;font-weight:400}
#shutter{width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.5)}
#camclose{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:12px;background:rgba(0,0,0,.35);border:none;color:#fff;font-size:20px;width:40px;height:40px;border-radius:50%}

/* 확인 화면 */
#confirm{position:fixed;inset:0;z-index:45;background:var(--bg);display:none;flex-direction:column}
#confirm .ctop{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:#fff;border-bottom:1px solid var(--line)}
#confirm .ctop b{font-size:16px}
#confirm .ctop .x{margin-left:auto;background:none;border:none;font-size:20px;color:var(--sub)}
#confirm .body{flex:1;overflow:auto;padding:14px 14px 120px}
#confirm .shot{display:flex;gap:10px;margin-bottom:14px}
#confirm .shot img{height:104px;border-radius:12px;border:1px solid var(--line);object-fit:cover;background:#fff}
#confirm .shot .addback{height:104px;flex:0 0 96px;border:1.5px dashed #c3d0e6;border-radius:12px;background:#fff;color:var(--blue);font-size:12.5px;font-weight:600}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--sub);margin:0 2px 4px;font-weight:600}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;background:#fff}
.field textarea{min-height:56px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#confirm .foot{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);background:#fff;border-top:1px solid var(--line)}
#confirm .foot button{flex:1;border:none;border-radius:12px;padding:15px;font-size:15.5px;font-weight:800}
#confirm .foot .cancel{flex:0 0 90px;background:#eef1f6;color:var(--sub)}
#confirm .foot .save{background:var(--blue);color:#fff}

/* 설정 시트 */
#setBg{position:fixed;inset:0;z-index:60;background:rgba(10,20,40,.45);display:none;align-items:flex-end;justify-content:center}
#setSheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px)}
#setSheet h2{font-size:16px;margin:0 0 4px}
#setSheet p{font-size:12.5px;color:var(--sub);margin:0 0 14px;line-height:1.6}
#setSheet input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;margin-bottom:10px}
#setSheet label.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);margin-bottom:14px}
#setSheet .row{display:flex;gap:10px}
#setSheet .row button{flex:1;border:none;border-radius:12px;padding:13px;font-weight:700;font-size:14.5px}
#setSheet .ok{background:var(--blue);color:#fff}
#setSheet .close{background:#eef1f6;color:var(--sub)}

/* 토스트 */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);transform:translateX(-50%);background:#101828;color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;z-index:80;display:none;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#badge{font-size:11px;color:#7c8aa5}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="app">
  <div id="top">
    <div class="brand"><span class="mark">푸</span> 푸른카메라</div>
    <span class="who" id="who"></span>
    <button class="ico" title="설정" onclick="openSettings()">⚙️</button>
  </div>

  <!-- 로그인 안내 -->
  <div id="login">
    <div class="card">
      <div class="m">푸</div>
      <h1>푸른카메라</h1>
      <p>푸른노무법인 앱은 통합 포털에서 로그인합니다.<br>로그인하면 카메라로 자동 연결됩니다.</p>
      <a href="enter.html">포털에서 로그인 →</a>
    </div>
  </div>

  <!-- 촬영 홈 -->
  <div id="home">
    <div class="hint">명함을 카메라 틀에 맞추고 찍으면<br>글자가 자동으로 입력됩니다.</div>
    <button class="big" onclick="openCamera()"><span class="ic">📷</span>명함 찍기</button>
    <div class="sub">
      <button onclick="galleryInput.click()">🖼️ 사진첩에서 고르기</button>
    </div>
    <div class="stat" id="badge"></div>
  </div>
</div>

<!-- 카메라 -->
<div id="cam">
  <video id="camvid" autoplay playsinline muted></video>
  <div id="camframe"></div>
  <div id="camtip">명함을 틀 안에 맞춰 주세요</div>
  <button id="camclose" onclick="closeCamera()">✕</button>
  <div id="cambar">
    <button class="side" onclick="closeCamera();galleryInput.click()"><b>🖼️</b>사진첩</button>
    <button id="shutter" onclick="shoot()"></button>
    <button class="side" onclick="closeCamera()"><b>✕</b>닫기</button>
  </div>
</div>

<!-- 확인 -->
<div id="confirm">
  <div class="ctop"><b>명함 확인</b><button class="x" onclick="cancelConfirm()">✕</button></div>
  <div class="body">
    <div class="shot" id="shotRow"></div>
    <div id="fields"></div>
  </div>
  <div class="foot">
    <button class="cancel" onclick="cancelConfirm()">취소</button>
    <button class="save" onclick="saveCard()">💾 저장</button>
  </div>
</div>

<!-- 설정 -->
<div id="setBg" onclick="if(event.target===this)closeSettings()">
  <div id="setSheet">
    <h2>AI 글자인식 설정</h2>
    <p>명함 글자를 자동으로 읽으려면 Gemini API 키가 필요합니다. 사무실에서 한 번 "모든 기기에 공유"해두면 직원 폰은 키 입력 없이 바로 인식됩니다. 키가 없어도 직접 입력은 항상 됩니다.</p>
    <input id="keyInput" type="password" placeholder="Gemini API 키 붙여넣기" autocomplete="off">
    <label class="chk"><input type="checkbox" id="shareKey"> 이 키를 모든 기기에 공유(사무실에서 1회)</label>
    <div class="row">
      <button class="close" onclick="closeSettings()">닫기</button>
      <button class="ok" onclick="saveSettings()">저장</button>
    </div>
  </div>
</div>

<input type="file" id="galleryInput" accept="image/*" hidden>
<input type="file" id="camfallback" accept="image/*" capture="environment" hidden>
<input type="file" id="backInput" accept="image/*" hidden>
<div id="toast"></div>

<script>
/* ══════ 설정 (명함첩과 동일 창고 공유) ══════ */
const FB_APPCHECK_KEY = '6Ldu1hEtAAAAABB9lH9EMEyd7uBLEy9H5HxJoua_';
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyDkZz5QlKSoqMOYByp5YGeMNLNDrIghliA',
  databaseURL: 'https://pureun-erp-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'pureun-erp',
  storageBucket: 'pureun-erp.firebasestorage.app',
  appId: '1:936817166182:web:9bd31f70d0afdf5fca2aa7',
  messagingSenderId: '936817166182'
};
const DB_ROOT = 'pucards';
const GEMINI_KEY_LS = 'pucards_gemini_key';

const $ = id => document.getElementById(id);
let db=null, me=null, sharedKey='';

/* ══════ 시작 / 로그인 ══════ */
firebase.initializeApp(FIREBASE_CONFIG);
try{ if(firebase.appCheck) firebase.appCheck().activate(new firebase.appCheck.ReCaptchaV3Provider(FB_APPCHECK_KEY), true); }
catch(e){ console.warn('[AppCheck]', e&&e.message); }
db = firebase.database();

firebase.auth().onAuthStateChanged(u=>{
  if (u && u.email){
    me = u;
    $('who').textContent = u.displayName || u.email;
    $('login').style.display='none';
    $('home').style.display='flex';
    loadSharedKey();
  } else {
    me = null;
    $('login').style.display='flex';
    $('home').style.display='none';
  }
});

function loadSharedKey(){
  db.ref(DB_ROOT+'/config/geminiKey').once('value')
    .then(s=>{ sharedKey = s.val()||''; updateBadge(); })
    .catch(()=>updateBadge());
}
function currentKey(){ return localStorage.getItem(GEMINI_KEY_LS) || sharedKey || ''; }
function updateBadge(){
  $('badge').textContent = currentKey()
    ? '🤖 자동 글자인식 켜짐 · 실시간 공유'
    : '✍️ 직접 입력 모드 (설정에서 AI 키 등록 시 자동인식)';
}

/* ══════ 유틸 ══════ */
const uid = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits = s => String(s||'').replace(/\D/g,'');
function toast(msg, ms=2600){ const t=$('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.style.display='none', ms); }

function shrink(img){
  const M=1400, r=Math.min(1, M/Math.max(img.width,img.height));
  const c=document.createElement('canvas');
  c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.8);
}
function makeThumb(dataUrl){
  return new Promise(res=>{ const i=new Image();
    i.onload=()=>{ const M=320, r=Math.min(1, M/Math.max(i.width,i.height));
      const c=document.createElement('canvas');
      c.width=Math.round(i.width*r); c.height=Math.round(i.height*r);
      c.getContext('2d').drawImage(i,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',.65)); };
    i.onerror=()=>res(''); i.src=dataUrl; });
}
async function fileToDataUrl(f){
  const url=URL.createObjectURL(f);
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  URL.revokeObjectURL(url);
  return shrink(img);
}

/* ══════ 카메라 ══════ */
let camStream=null;
async function openCamera(){
  try{
    camStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'environment', width:{ideal:2560}, height:{ideal:1440} }, audio:false });
  }catch(e){ $('camfallback').click(); return; }   /* 권한거부·미지원 → 폰 기본 카메라 */
  $('camvid').srcObject=camStream;
  $('cam').style.display='flex';
}
function closeCamera(){
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  $('cam').style.display='none';
}
function shoot(){
  const v=$('camvid'); if(!v.videoWidth) return;
  const vw=v.videoWidth, vh=v.videoHeight;
  const e=v.getBoundingClientRect(), f=$('camframe').getBoundingClientRect();
  const scale=Math.max(e.width/vw, e.height/vh);
  const visW=e.width/scale, visH=e.height/scale;
  const offX=(vw-visW)/2, offY=(vh-visH)/2;
  const fx=offX+(f.left-e.left)/scale, fy=offY+(f.top-e.top)/scale;
  const fw=f.width/scale, fh=f.height/scale;
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(fw)); c.height=Math.max(1,Math.round(fh));
  c.getContext('2d').drawImage(v, fx,fy,fw,fh, 0,0,c.width,c.height);
  const img=new Image();
  img.onload=()=>{ closeCamera(); startConfirm(shrink(img)); };
  img.src=c.toDataURL('image/jpeg',.92);
}

/* 사진첩 / 폰기본카메라 파일 선택 */
$('galleryInput').addEventListener('change', async function(){
  const f=this.files&&this.files[0]; this.value='';
  if(!f) return;
  toast('이미지 처리 중…',9000);
  try{ startConfirm(await fileToDataUrl(f)); }
  catch(e){ toast('사진을 읽지 못했습니다'); }
});
$('camfallback').addEventListener('change', async function(){
  const f=this.files&&this.files[0]; this.value='';
  if(!f) return;
  toast('이미지 처리 중…',9000);
  try{ startConfirm(await fileToDataUrl(f)); }
  catch(e){ toast('사진을 읽지 못했습니다'); }
});

/* ══════ AI 자동 추출 (Gemini) ══════ */
async function aiExtract(dataUrl){
  const key=currentKey(); if(!key) return null;
  const prompt = `이 명함 이미지에서 정보를 추출해 JSON으로만 답하세요. 키: name(이름), company(회사명), dept(부서), title(직책), mobile(휴대폰), tel(직통전화), fax(개인팩스), email(이메일), companyTel(회사 대표번호), companyFax(회사 팩스), companyAddr(회사 주소), website(홈페이지), address(개인 주소), memo(기타 정보). 없는 값은 빈 문자열. 전화번호는 010-1234-5678 형식. JSON 외 텍스트 금지.`;
  const body={contents:[{parts:[
    {inline_data:{mime_type:'image/jpeg',data:dataUrl.split(',')[1]}},
    {text:prompt}]}]};
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(key)}`,
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('Gemini '+r.status);
  const j=await r.json();
  const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
  return JSON.parse(t.replace(/```json|```/g,'').trim());
}

/* ══════ 확인 화면 ══════ */
const FIELDS=[['name','이름'],['company','회사'],['dept','부서'],['title','직책'],
  ['mobile','휴대폰'],['tel','직통전화'],['email','이메일'],
  ['companyTel','회사 대표번호'],['companyFax','회사 팩스'],['companyAddr','회사 주소'],
  ['website','홈페이지'],['address','개인 주소'],['memo','메모']];
const WIDE=['email','companyAddr','address','memo'];
let draft=null;   /* {photo, thumb, photo2, thumb2} */

async function startConfirm(dataUrl){
  draft={ photo:dataUrl, thumb:'', photo2:'', thumb2:'' };
  draft.thumb = await makeThumb(dataUrl);
  let pre={};
  if(currentKey()){
    toast('🤖 AI가 명함을 읽고 있습니다…',15000);
    try{ pre = await aiExtract(dataUrl) || {}; toast('읽기 완료 — 확인 후 저장하세요',2200); }
    catch(e){ console.error(e); toast('자동인식 실패 — 직접 입력해 주세요',3000); }
  }
  renderConfirm(pre);
  $('confirm').style.display='flex';
}
function renderConfirm(pre){
  /* 좁은 필드는 2열, 넓은 필드(이메일·주소·메모)는 전체폭 */
  $('fields').innerHTML = buildGrid(pre);
  $('shotRow').innerHTML =
    `<img src="${draft.thumb}" alt="명함">` +
    (draft.thumb2 ? `<img src="${draft.thumb2}" alt="뒷면">` :
      `<button class="addback" onclick="backInput.click()">＋ 뒷면<br>사진</button>`);
}
function buildGrid(pre){
  let out='';
  const narrow=[];
  const flush=()=>{ if(!narrow.length) return; out+=`<div class="grid2">${narrow.join('')}</div>`; narrow.length=0; };
  FIELDS.forEach(([k,label])=>{
    const tag = k==='memo'
      ? `<textarea id="f_${k}">${esc(pre[k]||'')}</textarea>`
      : `<input id="f_${k}" value="${esc(pre[k]||'')}">`;
    const cell = `<div class="field"><label>${label}</label>${tag}</div>`;
    if(WIDE.includes(k)){ flush(); out+=cell; }
    else narrow.push(cell);
  });
  flush();
  return out;
}
$('backInput').addEventListener('change', async function(){
  const f=this.files&&this.files[0]; this.value='';
  if(!f||!draft) return;
  try{ draft.photo2=await fileToDataUrl(f); draft.thumb2=await makeThumb(draft.photo2);
    $('shotRow').innerHTML = `<img src="${draft.thumb}"><img src="${draft.thumb2}">`;
  }catch(e){ toast('뒷면 사진을 읽지 못했습니다'); }
});
function cancelConfirm(){ $('confirm').style.display='none'; draft=null; }

/* ══════ 저장 (명함첩과 동일 스키마) ══════ */
async function saveCard(){
  if(!draft) return;
  if(!me){ toast('로그인이 필요합니다'); return; }
  const it={ id:uid(), kind:'card', group:'', fav:false,
    thumb:draft.thumb||'', thumb2:draft.thumb2||'',
    source:'pu-camera', capturedBy: me.displayName || me.email || '',
    createdAt:Date.now(), updatedAt:Date.now() };
  FIELDS.forEach(([k])=>{ const el=$('f_'+k); it[k]= el ? el.value.trim() : ''; });
  if(!it.name && !it.company){ toast('이름 또는 회사를 입력해 주세요'); return; }
  try{
    await db.ref(`${DB_ROOT}/items/${it.id}`).set(it);
    if(draft.photo) db.ref(`${DB_ROOT}/photos/${it.id}`).set(draft.photo);
    if(draft.photo2) db.ref(`${DB_ROOT}/photos/${it.id}_b`).set(draft.photo2);
    $('confirm').style.display='none'; draft=null;
    toast('✅ 저장 완료 — 명함첩에 등록되었습니다');
  }catch(e){ console.error(e); toast('저장 실패: '+((e&&e.message)||'')); }
}

/* ══════ 설정 ══════ */
function openSettings(){
  $('keyInput').value = localStorage.getItem(GEMINI_KEY_LS) || '';
  $('shareKey').checked = false;
  $('setBg').style.display='flex';
}
function closeSettings(){ $('setBg').style.display='none'; }
async function saveSettings(){
  const v=$('keyInput').value.trim();
  if(v) localStorage.setItem(GEMINI_KEY_LS, v); else localStorage.removeItem(GEMINI_KEY_LS);
  if(v && $('shareKey').checked){
    try{ await db.ref(DB_ROOT+'/config/geminiKey').set(v); sharedKey=v; toast('키를 모든 기기에 공유했습니다'); }
    catch(e){ toast('공유 저장 실패: '+((e&&e.message)||'')); }
  } else { toast('설정을 저장했습니다'); }
  updateBadge();
  closeSettings();
}

/* ══════ PWA 설치 ══════ */
if('serviceWorker' in navigator && location.protocol==='https:')
  navigator.serviceWorker.register('pu-camera-sw.js').catch(()=>{});
</script>
