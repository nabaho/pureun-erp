<!-- ══════════════════════════════════════════════════════════════════
     푸른카메라 — 이제 **문패만 남은 껍데기**다 (대표 지시 2026-08-08)

     "카메라는 하나로 하고 알아서 자동으로 위치로 보내는 기능"

     왜 이렇게 했나
     ─────────────
     촬영 코드가 두 벌이었다. 이 파일(525줄)과 사진첩 안 카메라가 각각
     같은 일을 했고, 이 파일의 주석에도 "푸른카메라에서 검증된 순서를 그대로
     가져왔다"고 적혀 있었다 — 복사본이라는 뜻이다. 한쪽만 고치는 사고가 난다.

     더 큰 문제는 **가는 곳이 달랐다**는 것이다.
       옛 푸른카메라 → 명함첩으로 **직행** (자동 분류를 안 탐)
       사진첩 카메라 → 사진첩에 담고 **자동 배송**
                       (명함→명함첩 / 사업자등록증→명함첩+업체관리 / 나머지는 보관)
     같은 명함인데 어느 카메라로 찍었느냐에 따라 결과가 달랐다.

     그래서 촬영 코드는 사진첩 것 하나만 남기고, 이 파일은 곧바로 넘긴다.

     ⚠ 이 파일을 **지우지 않는다.** 폰에 앱으로 설치한 분의 아이콘과
       바로가기가 이 주소를 가리킨다. 지우면 그 아이콘이 깨진다.
       설명 파일(pu-camera-manifest.json)도 그대로 둔다 — 앱 이름·아이콘이
       바뀌면 홈 화면에서 못 찾는다.

     ⚠ Firebase 를 싣지 않는다. 넘기기만 하는 문패라 실을 이유가 없다.
       (tests/resilience-runtime.test.js 의 「Firebase 앱」 목록에서 뺐다)
     ══════════════════════════════════════════════════════════════════ -->
<script>
  /* 이 파일은 모든 카메라 진입이 지나는 관문이다.
     주소의 cam 값은 로그인·자동 업데이트 중 사라질 수 있으므로 sessionStorage에도
     먼저 기록한다. 사진첩은 실제 촬영 화면을 연 뒤에만 이 기록을 지운다. */
  (function () {
    var params = new URLSearchParams(location.search || '');
    var mode = params.get('mode') === 'card' ? 'card'
      : (params.get('mode') === 'document' ? 'document' : 'photo');
    var request = {
      mode: mode,
      quick: params.get('quick') === '1',
      from: params.get('from') || '',
      at: Date.now()
    };
    try { sessionStorage.setItem('pu_open_camera', JSON.stringify(request)); } catch (_) { }
    params.set('cam', '1');
    params.set('mode', mode);
    location.replace('pu-photos.html?' + params.toString());
  })();
</script>

    <a href="pu-photos.html?cam=1&mode=photo">카메라 열기 →</a>
  </div>
</body>
