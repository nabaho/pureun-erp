<style>
:root{--navy:#1e40af;--violet:#2563eb;--ok:#166534;--warn:#d97706;--bad:#dc2626;
--ink:#1e293b;--sub:#64748b;--line:#e2e8f0;--paper:#f8fafc;--card:#FFF;}
*{box-sizing:border-box;margin:0}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--paper);color:var(--ink);font-size:14px}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 18px}
header .logo{font-weight:800;font-size:16px}
header .env{font-size:11px;background:#ffffff22;border:1px solid #ffffff55;border-radius:99px;padding:2px 9px}
header .who{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:10px}
header .out{background:#ffffff22;border:1px solid #ffffff66;color:#fff;border-radius:8px;padding:3px 10px;cursor:pointer;font-size:12px}
.save-state{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;border:1px solid #ffffff55;border-radius:99px;padding:3px 8px;font-size:11px;font-weight:700;background:#ffffff18}
.save-state::before{content:'';width:7px;height:7px;border-radius:50%;background:#cbd5e1}
.save-state.saving::before{background:#fbbf24;animation:savePulse .8s infinite alternate}
.save-state.saved::before{background:#4ade80}.save-state.failed::before{background:#f87171}
@keyframes savePulse{from{opacity:.4}to{opacity:1}}
.layout{display:flex;min-height:calc(100vh - 46px)}
nav{width:180px;background:#fff;border-right:1px solid var(--line);padding:14px 10px;flex-shrink:0}
nav button{display:block;width:100%;text-align:left;border:none;background:none;border-radius:10px;padding:10px 12px;font-size:13.5px;cursor:pointer;color:var(--ink);font-family:inherit}
nav button.on{background:var(--navy);color:#fff;font-weight:700}
main{flex:1;padding:22px 24px;overflow:auto}
h1{font-size:20px;margin-bottom:4px}.sub{color:var(--sub);font-size:13px;margin-bottom:16px}
.btn{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:9px 16px;cursor:pointer;font-size:13px;font-family:inherit}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.c{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.c .t{font-weight:700;color:var(--navy)}.c .m{font-size:12px;color:var(--sub);margin:3px 0 8px}
.c .kv{font-size:12.5px;margin:3px 0}.c .kv b{color:var(--sub);font-weight:600;display:inline-block;width:64px;flex-shrink:0}
.badge{font-size:11px;border-radius:99px;padding:2px 8px}.badge.warn{background:#fffbeb;color:var(--warn)}.badge.ok{background:#e2e8f0;color:var(--ok)}
/* ── 설정 카드 채우기 (2026-09-03) ── */
.c .kv{display:flex;align-items:center;gap:6px}
/* 빈 칸은 «비었다고» 보인다 — 점선이 「여기 채워 주세요」다 */
.fill{border:1px dashed #cbd5e1;border-radius:7px;padding:3px 9px;background:#fff;
      color:var(--sub);cursor:pointer;font-family:inherit;font-size:12.5px}
.fill:hover{border-color:var(--navy);color:var(--navy)}
.val{padding:3px 0}.val.mine{color:var(--navy);font-weight:600}
/* 파란 점 = 사람이 정한 값(기계가 뽑은 값과 눈으로 구별된다) */
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--navy);
     margin-right:3px;vertical-align:1px}
.pen{font-size:11px;color:#cbd5e1;cursor:pointer;background:none;border:none;padding:0;font-family:inherit}
.c:hover .pen{color:var(--sub)}
/* 어둡게 덮는 색·그림자는 새 색을 만들지 않고 --ink(#1e293b)를 흐리게 쓴다 */
.mask{position:fixed;inset:0;background:rgba(30,41,59,.42);display:flex;align-items:center;
      justify-content:center;padding:20px;z-index:900}
.modal{background:#fff;border-radius:14px;padding:20px;width:380px;max-width:100%;
       box-shadow:0 20px 50px -12px rgba(30,41,59,.35)}
.modal h3{margin:0 0 2px;font-size:16px;color:var(--navy)}
.modal .who{font-size:12px;color:var(--sub);margin-bottom:16px}
.modal label{display:block;font-size:12px;color:var(--sub);margin:12px 0 5px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;
      font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.modal input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;
      padding:8px 10px;font-family:inherit;font-size:13px}
.why{background:var(--paper);border-radius:8px;padding:9px 11px;font-size:11.5px;
     color:var(--sub);line-height:1.6;margin-top:14px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:36px;text-align:center;color:var(--sub)}
#gate{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:9}
#gate .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px 36px;width:360px;text-align:center}
#gate h2{color:var(--navy);font-size:20px;margin-bottom:4px}#gate p{color:var(--sub);font-size:12.5px;margin:6px 0 16px}
#gate input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;margin-bottom:10px;font-family:inherit}
#gate .err{color:var(--bad);font-size:12.5px;margin-top:8px;white-space:pre-wrap;text-align:left}
/* ── 임금명세서 ── */
.slip{position:relative;background:#fff;border:1px solid var(--line);border-radius:8px;max-width:840px;margin:0 0 18px;padding:30px 36px;page-break-after:always;overflow:hidden}
.slip .shead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--navy);padding-bottom:9px}
.slip .co{font-weight:800;font-size:15px;color:var(--navy)}
.slip .ttl{font-size:18px;font-weight:800;letter-spacing:6px}
.slip .meta{width:100%;border-collapse:collapse;margin:11px 0 14px;font-size:13px}
.slip .meta td{padding:3px 0}.slip .meta b{color:var(--sub);font-weight:600;margin-right:6px}
.slip .cols{display:flex;gap:20px}.slip .cols>div{flex:1}
.slip .sec{font-weight:700;font-size:13px;color:var(--navy);margin-bottom:6px}
.slip .tb{width:100%;border-collapse:collapse;font-size:13px}
.slip .tb td{border:1px solid var(--line);padding:6px 10px}.slip .tb .n{text-align:right;font-variant-numeric:tabular-nums}
.slip .tb .tot td{font-weight:800;background:var(--paper)}
.slip .net{margin-top:14px;text-align:right;font-size:14px}.slip .net b{font-size:19px;color:var(--navy)}
.slip .calc{margin-top:9px;font-size:12.5px;color:var(--sub)}
.slip .snote{margin-top:11px;font-size:12px;background:#fffbeb;border-radius:8px;padding:9px 12px;color:#854d0e;white-space:pre-wrap}
.slip .foot{margin-top:15px;border-top:1px solid var(--line);padding-top:7px;font-size:11px;color:#94a3b8}
.slip.draft::after{content:'미확정 · 검토용';position:absolute;top:45%;left:50%;transform:translate(-50%,-50%) rotate(-24deg);font-size:52px;font-weight:800;color:rgba(196,61,61,.13);white-space:nowrap;pointer-events:none}
@media (max-width:760px){
  /* 머리줄은 한 줄로 — 「푸른통합시스템」 딱지는 접고, 이름은 …으로 줄인다.
     저장 알림은 점만 남기되 «실패»일 때는 글씨까지 되살린다(놓치면 안 되는 알림이다). */
  header{padding:8px 10px;gap:8px;flex-wrap:nowrap;overflow:hidden}
  header>*{min-width:0}
  header .env{display:none}
  header .logo{font-size:15px;white-space:nowrap;flex:0 0 auto}
  header #backbtn{flex:0 0 auto;white-space:nowrap}
  header .who{margin-left:auto;min-width:0;flex:0 1 auto;gap:7px}
  header .who #whoami{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .who .save-state{font-size:0;gap:0;padding:4px 5px;flex:0 0 auto}
  header .who .save-state.failed{font-size:11px;gap:5px;padding:3px 8px}
  header .out{white-space:nowrap;flex:0 0 auto}
  .layout{display:block;min-height:calc(100vh - 82px)}
  nav{position:sticky;top:0;z-index:5;width:100%;display:flex;gap:6px;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
  nav button{display:inline-block;width:auto;flex:0 0 auto;padding:8px 11px;white-space:nowrap}
  main{padding:15px 12px;overflow:visible}
  .cards{grid-template-columns:minmax(0,1fr)}
  .c,.empty{min-width:0}.empty{padding:24px 14px}
  #gate{padding:14px}#gate .box{width:100%;max-width:360px;padding:26px 20px}
  .slip{padding:20px 14px;overflow-x:auto}
  .slip .shead{gap:10px}.slip .ttl{font-size:16px;letter-spacing:3px;white-space:nowrap}
  .slip .cols{display:block}.slip .cols>div+div{margin-top:14px}
  .sub.noprint .btn{display:block;width:100%;margin:8px 0 0!important;min-height:44px}
  .report-hwp-action{width:100%;min-height:44px;margin:0 0 10px!important}
}
@media print{header,nav,.noprint{display:none !important}body{background:#fff}main{padding:0}.layout{min-height:0}.slip{border:none;border-radius:0;max-width:none;margin:0}}
</style>
<!-- 프로그램 사이 이동 (공용 앱바) — 문서관리와 함께 이 앱에만 빠져 있었다(2026-08-13) -->
<script src="js/pu-appbar.js?v=10"></script>
<!-- 로그아웃·사람 바뀜을 모든 프로그램에 퍼뜨린다 (2026-08-16) — 로그인 화면·공개 화면에는 넣지 않는다 -->
<script src="js/pu-authsync.js?v=1"></script>
<!-- 상단 우측에 「지금 로그인한 사람」 (2026-08-16) — 로그인 화면·공개 화면에는 넣지 않는다 -->
<script src="js/pu-whoami.js?v=1"></script>
<!-- ⚠ mount(false) = 「우리가 이미 그린다」 (대표 지적 2026-08-24 「화면 겹쳐지게 하지 마라」)
     자리를 안 알려 주면 이 부품이 화면 오른쪽 위에 **떠서** 붙는다(position:fixed).
     이 앱은 머리줄 #whoami 에 스스로 이름을 그리므로 뜬 표가 그 위에 겹친다. -->
<script>
(function(){ function go(){ if(window.PuWhoami){ PuWhoami.mount(false); return true; } return false; }
  if(!go()) document.addEventListener('DOMContentLoaded', go); })();
</script>

<body>
<div id="pu-boot-splash" style="position:fixed;inset:0;z-index:2147483000;background:#f8fafc;display:flex;align-items:center;justify-content:center">
  <div style="width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:21px;font-family:sans-serif">푸</div>
</div>
<div id="gate"><div class="box">
  <h2>급여관리</h2>
  <p id="gatep">로그인 확인 중…</p>
  <div id="loginform" style="display:none">
    <input id="email" type="email" placeholder="이메일" autocomplete="username">
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button class="btn" style="width:100%" onclick="doLogin()">로그인</button>
  </div>
  <div class="err" id="err"></div>
</div></div>

<header>
  <button id="backbtn" class="out" style="display:none;margin-right:2px" onclick="goBack()">← 뒤로</button>
  <span class="logo">급여관리</span><span class="env">푸른통합시스템 · payroll_os</span>
  <div class="who"><span id="whoami"></span><span id="saveState" class="save-state saved" role="status" aria-live="polite">저장 완료</span><button class="out" onclick="doLogout()">로그아웃</button></div>
</header>
<div class="layout"><nav id="nav"></nav><main id="main"></main></div>
<!-- 설정값 채우기 창. main 밖에 두어야 render() 가 다시 그려도 안 닫힌다. -->
<div id="cardEditBox"></div>

<script>
var FB_CONFIG = {
  apiKey: "AIzaSyDkZz5QlKSoqMOYByp5YGeMNLNDrIghliA",
  authDomain: "pureun-erp.firebaseapp.com",
  databaseURL: "https://pureun-erp-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "pureun-erp",
  storageBucket: "pureun-erp.appspot.com",
  messagingSenderId: "936817166182",
  appId: "1:936817166182:web:9bd31f70d0afdf5fca2aa7"
};
var FB_APPCHECK_KEY = "6Ldu1hEtAAAAABB9lH9EMEyd7uBLEy9H5HxJoua_";
/* ⚠ App Check 를 끈 채로 둔다 (대표 지시 2026-08-28 「걷어냄」)
   전체를 훑어 보니 직원용 16화면 중 11곳만 켜고 5곳(포털 포함)은 안 켜고 있었다.
   그런데 안 켠 화면도 멀쩡히 돌아간다 — 콘솔에서 App Check «강제»가 꺼져 있다는 뜻이다.
   즉 켜 둔 11곳도 지키는 것 없이 reCAPTCHA 실패만 만들고 있었다
   (푸른이알피는 2026-08-08 에 「20~30초짜리 실패만 두 번」이라며 이미 껐다).
   자료는 Rules 의 auth != null 이 계속 지킨다.

   ★ 콘솔에서 강제를 켤 때는 아래를 true 로 되돌려야 한다.
     되돌리지 않으면 모든 읽기·쓰기가 막힌다. */
var FB_APPCHECK_ON = false;
var ROOT = "payroll_os";
var cache = {}, fbDb = null, me = null, ready = false;

firebase.initializeApp(FB_CONFIG);
try { if(firebase.appCheck) FB_APPCHECK_ON && firebase.appCheck().activate(new firebase.appCheck.ReCaptchaV3Provider(FB_APPCHECK_KEY), true); } catch(e){}
fbDb = firebase.database();

firebase.auth().onAuthStateChanged(function(user){
  if(user){ me = user; afterLogin(); return; }
  // [포털 시작화면] 로그인은 통합 포털(enter.html) 한 곳에서만 — ?login=1 이면 여기서 직접 로그인
  if(!/[?&]login=1/.test(location.search) && location.protocol !== 'file:'){
    location.replace('enter.html?v=' + Math.floor(Date.now()/600000));
    return;
  }
  document.getElementById('gatep').textContent='pu-erp와 같은 계정으로 로그인하세요';
  document.getElementById('loginform').style.display='';
});
function doLogin(){
  var em=document.getElementById('email').value.trim(), pw=document.getElementById('pw').value;
  document.getElementById('err').textContent='';
  firebase.auth().signInWithEmailAndPassword(em,pw).catch(function(e){
    document.getElementById('err').textContent=(e.code==='auth/wrong-password'||e.code==='auth/user-not-found')?'이메일 또는 비밀번호가 맞지 않습니다.':('오류: '+e.code); });
}
function doLogout(){ firebase.auth().signOut().then(function(){ location.reload(); }); }

function afterLogin(){
  document.getElementById('gate').style.display='none';
  fbDb.ref('uid_roles/'+me.uid).once('value').then(function(s){
    var r=s.val()||{}; var role=r.isAdmin?'관리자':(r.fin?'재무/급여':'일반');
    document.getElementById('whoami').textContent=(me.email||'')+' · '+role;
  }).catch(function(){ document.getElementById('whoami').textContent=me.email||''; });
  /* ⚠ 예전에는 payroll_os **전체**를 한 번에 읽고, 같은 자리에 구독까지 걸었다.
     파일럿 3곳(342KB)일 때는 티가 안 났지만 70곳이면 7MB다 — **열 때마다 14MB**
     (한 번 읽고 구독 첫 값으로 또 한 번), 그리고 누가 확정을 한 번 누를 때마다
     **열려 있는 모든 사람에게 7MB**가 다시 간다.
     이제 얇은 것만 읽는다: 설정카드 · 확정잠금 · 급여 **목록**(직원 표는 뺀 것).
     직원 표는 그 달을 열 때 그 줄만 받는다(ensureEmps).
     ⚠ 구독은 **확정잠금에만** 건다 — 여럿이 동시에 확정할 때 서로 보이려면
     그것 하나면 되고, 그 칸은 아주 얇다. */
  Promise.all([
    fbDb.ref(ROOT+'/site_cards').once('value'),
    fbDb.ref(ROOT+'/payroll_locked').once('value'),
    fbDb.ref(ROOT+'/payroll/index').once('value'),
    fbDb.ref(ROOT+'/payslip_notice').once('value'),
    /* 옛 모양(직원 표가 안에 든 것) — 아직 새 모양으로 안 올렸을 때를 위해 함께 본다.
       ⚠ 이것이 있으면 그대로 쓴다. 안 그러면 새 앱을 올린 순간부터 데이터를 다시
       올리기 전까지 화면이 통째로 빈다. */
    fbDb.ref(ROOT+'/payroll/sites').once('value'),
    /* 사람이 채운 설정값 — 카드 위에 겹쳐 본다. 아주 얇다(사업장당 두 칸). */
    fbDb.ref(ROOT+'/site_card_edit').once('value')
  ]).then(function(r){
    cache.site_cards=r[0].val()||[];
    cache.payroll_locked=r[1].val()||{};
    cache.payslip_notice=r[3].val()||'';
    cache.site_card_edit=r[5].val()||{};
    payIdx=r[2].val()||null;
    payOld=r[4].val()||null;
    ready=true; navSeed(); render();
    fbDb.ref(ROOT+'/payroll_locked').on('value',function(ss){
      if(ready){ cache.payroll_locked=ss.val()||{}; render(); }
    });
  }).catch(function(e){
    document.getElementById('main').innerHTML='<div class="empty">DB 접근 거부: '+e.code+'<br>규칙에 payroll_os 블록이 있는지, 재무/관리자 권한이 있는지 확인하세요.</div>'; });
}
function dbGet(k,fb){ return (cache[k]!=null)?cache[k]:fb; }

/* ══════ 급여 목록·직원 표 (2026-08-17 나눠 읽기) ══════
   payIdx = 얇은 목록(사업장→줄들, 직원 표 없음). payOld = 옛 모양(직원 표가 안에 든 것).
   empBox = 그 달을 열 때 받아 둔 직원 표(줄 번호 → 직원들).
   ⚠ 어느 모양이든 화면은 payRecs(site) 하나만 보면 되게 감싼다 — 화면 곳곳에서
     모양을 가리기 시작하면 한 군데를 빠뜨려 그 화면만 빈다. */
var payIdx=null, payOld=null, empBox={}, empLoading={};

function payHas(){ return !!(payIdx||payOld); }

/* ── 신고 화면 전용 (2026-08-17) ──
   신고는 여러 사업장·여러 달의 직원 표를 **한꺼번에** 본다(취득·상실·퇴직정산·연차).
   그래서 이 화면에 들어갈 때만 직원 표를 통째로 받는다. 급여 처리는 그대로 가볍다 —
   신고는 가끔 쓰고 급여 처리는 늘 쓰기 때문이다.
   ⚠ 받은 뒤에는 **옛 모양으로 감싸** 돌려준다. 그래야 신고 계산 코드를 한 글자도
     안 건드린다 — 거기를 손대면 취득·상실·퇴직금 셈이 조용히 달라질 수 있다. */
var allEmpsState='';      // '' 아직 · 'loading' 받는 중 · 'done' 다 받음 · 'err' 실패

function ensureAllEmps(){
  if(payOld) { allEmpsState='done'; return; }   // 옛 모양은 이미 다 들어 있다
  if(allEmpsState) return;
  allEmpsState='loading';
  fbDb.ref(ROOT+'/payroll/emp').once('value').then(function(s){
    var v=s.val()||{}; for(var k in v) empBox[k]=v[k];
    allEmpsState='done'; render();
  }).catch(function(e){ allEmpsState='err'; console.warn('[직원 표 전체]',e&&e.code); render(); });
}

function payForReport(){
  var sites={};
  paySites().forEach(function(st){
    sites[st]=payRecs(st).map(function(r){
      var o={}; for(var k in r) o[k]=r[k];
      o.직원=empsOf(r)||[];
      return o;
    });
  });
  return {sites:sites};
}
function paySites(){ return payIdx?Object.keys(payIdx):(payOld?Object.keys(payOld):[]); }
function payRecs(site){ return (payIdx&&payIdx[site])||(payOld&&payOld[site])||[]; }

/* 그 줄의 직원 표 — 이미 손에 있으면 그것, 없으면 null(부르는 쪽이 받아 온다). */
function empsOf(rec){
  if(!rec) return null;
  if(rec.직원) return rec.직원;              // 옛 모양은 줄 안에 들어 있다
  return (rec.id&&empBox[rec.id])||null;
}

/* 그 달을 열 때 그 줄만 받는다. 두 번 부르지 않는다 — 다시 그릴 때마다 또 받으면
   화면이 깜빡이고 요금만 는다. */
function ensureEmps(rec){
  if(!rec||!rec.id||rec.직원||empBox[rec.id]||empLoading[rec.id]) return;
  empLoading[rec.id]=1;
  fbDb.ref(ROOT+'/payroll/emp/'+rec.id).once('value').then(function(s){
    empBox[rec.id]=s.val()||[]; delete empLoading[rec.id]; render();
  }).catch(function(e){
    /* 못 받으면 **빈 표로 두지 않는다** — 빈 표는 「직원이 없다」로 읽혀
       명세서가 0명으로 나간다. 다시 눌러 볼 수 있게 표시만 지운다. */
    delete empLoading[rec.id]; console.warn('[직원 표]',e&&e.code); render();
  });
}
var savePending=0, saveFailed=false;
function setSaveState(kind,text){ var el=document.getElementById('saveState'); if(!el)return; el.className='save-state '+kind; el.textContent=text; }
function dbSet(k,v){
  cache[k]=v; render();
  if(savePending===0) saveFailed=false;
  savePending++; setSaveState('saving','저장 중…');
  return fbDb.ref(ROOT+'/'+k).set(v).then(function(){
    savePending=Math.max(0,savePending-1);
    if(savePending===0) setSaveState(saveFailed?'failed':'saved',saveFailed?'저장 실패':'저장 완료');
    return true;
  }).catch(function(e){
    saveFailed=true; savePending=Math.max(0,savePending-1); setSaveState('failed','저장 실패');
    alert('저장 실패: '+e.code+'\n인터넷 연결을 확인한 뒤 다시 저장하세요.'); return false;
  });
}

var App={screen:'cards',site:null,month:null,emp:null,day:null};
/* ── 화면 이동 기록(직전 화면으로 되돌아가는 백 키) ──
   헤더 ← 버튼과 폰 물리 백키가 같은 History API를 공유. file://에선 pushState가
   막혀도(try/catch) 화면 전환은 정상, 폰 백키만 비활성(라이브 https에선 전부 동작). */
var navDepth=0;
function navSnap(){ return {screen:App.screen,site:App.site,month:App.month,emp:App.emp,day:App.day}; }
function navSame(a,b){ return a.screen===b.screen&&a.site===b.site&&a.month===b.month&&a.emp===b.emp&&a.day===b.day; }
function navApply(s){ App.screen=s.screen; App.site=s.site; App.month=s.month; App.emp=s.emp||null; App.day=s.day||null; }
function navSeed(){ navDepth=0; try{ history.replaceState({pnav:navSnap(),depth:0},''); }catch(e){} }
function navTo(patch){
  var next=Object.assign(navSnap(),patch);
  if(navSame(next,navSnap())) return;      // 같은 화면이면 기록 안 함
  navApply(next); navDepth++;
  try{ history.pushState({pnav:next,depth:navDepth},''); }catch(e){}
  render();
}
function goBack(){ if(navDepth>0) history.back(); }   // 버튼·폰키 공용 진입점
window.addEventListener('popstate',function(ev){
  var st=ev.state;
  if(st&&st.pnav){ try{ window.__puBackNav = true; }catch(e){}  /* 이 걸음은 우리가 썼다 — 공통 뒤로가기는 비켜선다 */ navApply(st.pnav); navDepth=st.depth||0; render(); }
  // 시작점보다 더 뒤로 = 브라우저 기본(앱 이탈/포털) 허용
});
App.go=function(s){ navTo({screen:s,site:null,month:null,emp:null,day:null}); };  // 기존 호출부 호환(탭 이동)
var NAV=[{id:'cards',label:'⚙️ 설정 카드'},{id:'inbox',label:'📥 수신함'},{id:'payroll',label:'💰 급여 처리'},{id:'attend',label:'🕒 근태'},{id:'leave',label:'🌴 연차·휴가'},{id:'sever',label:'🎓 퇴직'},{id:'slip',label:'📄 명세서'},{id:'report',label:'📑 신고'}];
var SIG={green:'#166534',orange:'#d97706',red:'#dc2626',gray:'#94a3b8'};
function won(n){ return (n==null)?'-':Number(n).toLocaleString(); }
/* ── 표시용 중복 정리 ──
   같은 성명이 여러 줄(신고/실지급 시나리오·중복 추출 등)일 때 한 사람당 한 줄만 남김.
   남길 기준 = 항목이 많고 '임금총액−공제=실수령'이 맞아떨어지는 행(가장 신뢰). */
var DED_KEYS_=['기본급','과세총액','소득세','지방세','국민연금','건강보험','장기요양','고용보험','공제총액','실수령'];
function empScore(e){
  var s=0; DED_KEYS_.forEach(function(k){ if(e[k]!=null) s++; });
  var g=e.지급총액||e.과세총액||e.기본급, d=e.공제총액, n=e.실수령;
  if(g!=null&&d!=null&&n!=null&&Math.abs(g-d-n)<=1) s+=5;  // tie-out 우대
  return s;
}
function dedupeEmps(list){
  var by={}, order=[];
  (list||[]).forEach(function(e){
    var k=(e.성명||'').trim(); if(!k) return;
    if(!(k in by)){ order.push(k); by[k]=e; }
    else if(empScore(e)>empScore(by[k])) by[k]=e;
  });
  return order.map(function(k){ return by[k]; });
}
function empCount(r){ var e=empsOf(r); return (e&&e.length)?dedupeEmps(e).length:(r.직원수||0); }
function lockKey(site,month){ return site+'|'+month; }
function isLocked(site,month){ var L=dbGet('payroll_locked',{})||{}; return !!L[lockKey(site,month)]; }
function toggleLock(site,month){ var L=dbGet('payroll_locked',{})||{}; var k=lockKey(site,month);
  if(L[k]){ if(!confirm('확정을 되돌릴까요?')) return; delete L[k]; } else { if(!confirm(site+' '+month+' 급여를 확정할까요? (되돌리기 가능)')) return; L[k]=Date.now(); }
  dbSet('payroll_locked', L); }

/* ── 예외 중심 검토: 데이터 완전성 반영 신호 + 초록 일괄확정 + 필터 ──
   원본 신호(r.신호)는 엔진 계산 결과. 여기서 표시용으로 보정:
   핵심값(총지급·공제·실수령)이 절반 이상 채워지지 않으면 초록 대신 회색(데이터부족=확인필요).
   → 초록불이 진짜로 믿을 수 있어야 [초록 전부 확정]이 안전하다. */
var CORE_GROSS_=['과세총액','지급총액','기본급'];
function recComplete(r){
  var emps=dedupeEmps(empsOf(r)||[]); if(!emps.length) return false;
  var ok=0; emps.forEach(function(e){
    var net=e.실수령!=null, ded=e.공제총액!=null,
        gross=CORE_GROSS_.some(function(k){return e[k]!=null;});
    if(net&&ded&&gross) ok++;
  });
  return ok>=Math.ceil(emps.length*0.5);
}
function effSig(r){
  if(r.신호==='red') return 'red';
  /* ⚠ 직원 표를 아직 안 받았으면 **미리 세어 둔 값**을 쓴다(생성기의 표시신호).
     안 그러면 목록의 모든 줄이 「데이터부족」 회색으로 보여, 멀쩡한 달까지
     확인이 필요한 것처럼 뜬다. 표를 받은 뒤에는 아래처럼 다시 센다. */
  if(!empsOf(r)) return r.표시신호||r.신호||'green';
  if(!recComplete(r)) return 'gray';
  return r.신호||'green';
}
function sigLabel(s){ return {green:'이상없음',orange:'확인필요',red:'막힘',gray:'데이터부족'}[s]||s; }
function lockAllGreen(site){
  if(!payHas()) return;
  var recs=payRecs(site);
  var t=recs.filter(function(r){return effSig(r)==='green'&&!isLocked(site,r.월);});
  if(!t.length){ alert('일괄 확정할 초록(이상없음) 항목이 없습니다. 남은 건 확인이 필요합니다.'); return; }
  if(!confirm(site+' — 초록(이상없음) '+t.length+'건을 한 번에 확정할까요?\n(주황·빨강·데이터부족은 제외됩니다. 되돌리기 가능)')) return;
  var L=dbGet('payroll_locked',{})||{};
  t.forEach(function(r){ L[lockKey(site,r.월)]=Date.now(); });
  dbSet('payroll_locked', L);
}
function toggleOnlyReview(){ App.onlyReview=!App.onlyReview; render(); }

function screenPayroll(){
  var h='<h1>급여 처리</h1>';
  if(!payHas()){ h+='<div class="sub">파일럿 급여 데이터를 서버에 올리세요</div>'+
    '<button class="btn sec" onclick="importPayroll()">파일럿 급여(JSON) 가져와 서버 저장</button>'+
    '<div class="empty" style="margin-top:14px">_harness_out\\pilot_payroll.json 을 올리면 화담원·제이앤드씨·늘봄 급여가 표시됩니다.</div>'; return h; }
  // 3단계 드릴다운
  if(!App.site){
    h+='<div class="sub">사업장 선택 · 계산 결과를 3색 신호로 확인 → 확정 '+
       '<button class="btn sec noprint" style="margin-left:10px;padding:4px 10px;font-size:12px" onclick="importPayroll()">데이터 다시 올리기</button></div>';
    h+='<div class="cards">';
    paySites().forEach(function(site){
      var recs=payRecs(site); var cnt={green:0,orange:0,red:0,gray:0}; var locked=0, review=0;
      recs.forEach(function(r){ var s=effSig(r); cnt[s]=(cnt[s]||0)+1;
        if(isLocked(site,r.월)) locked++; else if(s!=='green') review++; });
      var badge = review>0 ? '<span style="color:#d97706;font-weight:700">검토 '+review+'건</span>'
                           : '<span style="color:#166534">검토할 것 없음 ✓</span>';
      h+='<div class="c" style="cursor:pointer" onclick="navTo({site:\''+site.replace(/'/g,"")+'\'})">'+
        '<div class="t">'+site+'</div>'+
        '<div class="m">'+recs.length+'개월 · 확정 '+locked+'/'+recs.length+' · '+badge+'</div>'+
        '<div style="display:flex;gap:8px;margin-top:6px;font-size:12px;flex-wrap:wrap">'+
        ['green','orange','red','gray'].map(function(k){return cnt[k]?'<span style="color:'+SIG[k]+'">●'+cnt[k]+' '+sigLabel(k)+'</span>':'';}).join('')+
        '</div></div>';
    });
    h+='</div><div class="note">● 이상없음 ● 확인필요 ● 막힘(확정 전 해결) ● 데이터부족. '+
       '<b>「검토 N건」 숫자만</b> 신경 쓰면 됩니다. 사업장을 눌러 → [초록 전부 확정]으로 안전한 건 한 번에 끝내고, 나머지만 눈으로 보세요.</div>';
    return h;
  }
  var recs=payRecs(App.site);
  if(!App.month){
    var sEsc=App.site.replace(/'/g,"");
    var greenN=recs.filter(function(r){return effSig(r)==='green'&&!isLocked(App.site,r.월);}).length;
    var reviewN=recs.filter(function(r){return effSig(r)!=='green'&&!isLocked(App.site,r.월);}).length;
    h+='<div class="sub"><a href="#" onclick="goBack();return false">← 사업장</a> · <b>'+App.site+'</b> 월별</div>';
    h+='<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap">'+
       '<button class="btn" '+(greenN?'':'disabled style="background:#cbd5e1"')+' onclick="lockAllGreen(\''+sEsc+'\')">● 초록(이상없음) '+greenN+'건 전부 확정</button>'+
       '<button class="btn sec" onclick="toggleOnlyReview()">'+(App.onlyReview?'전체 보기':'검토 필요만 보기 ('+reviewN+')')+'</button>'+
       '<span style="font-size:12px;color:var(--sub)">초록은 버튼으로 한 번에 · 나머지만 눈으로 확인</span>'+
       '</div>';
    h+='<div style="background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden">';
    var shown=0;
    recs.forEach(function(r){ var lk=isLocked(App.site,r.월); var s=effSig(r);
      if(App.onlyReview && (lk || s==='green')) return;   // 검토 필요만: 확정·초록 숨김
      shown++;
      var extra=(s==='gray')?' · <span style="color:'+SIG.gray+'">데이터부족(확인)</span>':'';
      h+='<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)">'+
        '<span title="'+sigLabel(s)+'" style="width:11px;height:11px;border-radius:50%;background:'+SIG[s]+';flex-shrink:0"></span>'+
        '<div style="flex:1;cursor:pointer" onclick="navTo({month:\''+r.월.replace(/'/g,"")+'\'})"><b>'+r.월+'</b> <span style="font-size:12px;color:var(--sub)">직원 '+empCount(r)+'명'+(r.파일?' · '+r.파일:'')+extra+(r.이슈?' · '+r.이슈:'')+'</span></div>'+
        (lk?'<span class="badge ok">확정됨</span> <button class="btn sec" onclick="toggleLock(\''+sEsc+'\',\''+r.월.replace(/'/g,"")+'\')">되돌리기</button>'
           :'<button class="btn" '+(s==='red'?'disabled style="background:#cbd5e1" title="빨강 해결 후 확정"':'onclick="toggleLock(\''+sEsc+'\',\''+r.월.replace(/'/g,"")+'\')"')+'>확정</button>')+
        '</div>';
    });
    if(!shown) h+='<div class="empty" style="padding:20px">'+(App.onlyReview?'검토할 항목이 없습니다. 모두 확정했거나 이상없음입니다. 👍':'표시할 월이 없습니다.')+'</div>';
    h+='</div>'; return h;
  }
  // 직원별 상세
  var rec=recs.filter(function(r){return r.월===App.month;})[0]||{직원:[]};
  /* ⚠ 직원 표는 **그 달을 열 때** 받는다(2026-08-17). 아직 안 왔으면 「받는 중」이라
     말하고 끝낸다 — 빈 표를 그리면 「직원이 없다」로 읽혀 명세서가 0명으로 나간다. */
  ensureEmps(rec);
  var loaded=empsOf(rec);
  if(!loaded){
    h+='<div class="sub"><a href="#" onclick="goBack();return false">\u2190 '+App.site+'</a> \u00b7 <b>'+App.month+'</b></div>';
    h+='<div class="empty" style="padding:24px">'+(empLoading[rec.id]?'\uc9c1\uc6d0 \ud45c\ub97c \ubc1b\ub294 \uc911\u2026':'\uc9c1\uc6d0 \ud45c\ub97c \ubd88\ub7ec\uc624\uc9c0 \ubabb\ud588\uc2b5\ub2c8\ub2e4. \ub2e4\uc2dc \ub4e4\uc5b4\uc624\uc138\uc694.')+'</div>';
    return h;
  }
  var raw=loaded, emps=dedupeEmps(raw);
  var dupNote=(raw.length>emps.length)?' <span style="color:var(--warn)">(중복 '+(raw.length-emps.length)+'건 정리)</span>':'';
  h+='<div class="sub"><a href="#" onclick="goBack();return false">← '+App.site+'</a> · <b>'+App.month+'</b> 직원별 ('+emps.length+'명)'+dupNote+'</div>';
  h+='<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px;background:#fff">'+
     '<tr style="background:var(--paper);text-align:right">'+['순번','성명','기본급','과세총액','소득세','지방세','국민연금','건강보험','고용보험','공제총액','실수령'].map(function(c,i){return '<th style="padding:8px 10px;'+(i<2?'text-align:left':'')+'">'+c+'</th>';}).join('')+'</tr>';
  emps.forEach(function(e,i){
    h+='<tr style="border-top:1px solid var(--line);text-align:right">'+
      '<td style="padding:7px 10px;text-align:left;color:var(--sub)">'+(i+1)+'</td>'+
      '<td style="padding:7px 10px;text-align:left;font-weight:600">'+(e.성명||'')+'</td>'+
      ['기본급','과세총액','소득세','지방세','국민연금','건강보험','고용보험','공제총액','실수령'].map(function(k){return '<td style="padding:7px 10px">'+won(e[k])+'</td>';}).join('')+'</tr>';
  });
  h+='</table></div><div class="note">엔진 계산 규칙: 지방세=소득세×10% 10원절사 · 고용보험=과세×연도요율 · 연금/건보=고지액. 값은 골든(대장) 추출본.</div>';
  return h;
}
/* ── 가져오기 (2026-08-17 나눠 올리기) ──
   새 모양은 {index, emp} 다. 목록과 직원 표를 **따로** 올린다 —
   ⚠ 통째로 한 번에 쓰면 7MB 한 방이라 느리고, 끊기면 어디까지 갔는지 모른다.
     직원 표는 사업장 묶음으로 나눠 올리고, **목록은 맨 마지막에** 올린다.
     그래야 중간에 끊겨도 화면은 옛 목록 그대로 — 반쯤 들어간 것을 보여 주지 않는다.
   ⚠ 확정 잠금(payroll_locked) 열쇠는 「사업장|시트」다. 사업장 이름이 바뀌면
     확정이 조용히 풀린다. 그래서 **올리기 전에 갈 곳을 찾아 함께 옮긴다.**
   옛 모양({sites})도 그대로 받는다 — 되돌릴 일이 있을 때 쓴다. */
function relockFor(index, locked){
  var out={}, moved=0, lost=[];
  Object.keys(locked||{}).forEach(function(k){
    var at=k.lastIndexOf('|'); if(at<0){ out[k]=locked[k]; return; }
    var site=k.slice(0,at), sheet=k.slice(at+1);
    if(index[site]&&index[site].some(function(r){return r.월===sheet;})){ out[k]=locked[k]; return; }
    var hit=Object.keys(index).filter(function(s){
      return index[s].some(function(r){return r.월===sheet;});
    });
    /* 이름이 갈렸을 때만 옮긴다 — 옛 이름으로 시작하거나, 옛 이름이 새 이름으로
       시작하는 곳(화담원 → 화담원 서산점, 늘봄 → 늘봄반찬 3곳). */
    var near=hit.filter(function(s){ return s.indexOf(site)===0||site.indexOf(s.split(' ')[0])===0; });
    if(near.length===1){ out[near[0]+'|'+sheet]=locked[k]; moved++; }
    else { out[k]=locked[k]; lost.push(k); }   // 못 찾으면 **버리지 않고** 그대로 둔다
  });
  return {locked:out, moved:moved, lost:lost};
}

function importPayroll(){var i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
   r.onload=function(){
    var raw; try{ raw=JSON.parse(r.result); }catch(err){ alert('JSON 오류: '+err.message); return; }
    if(raw.sites&&!raw.index){                       // 옛 모양 — 예전처럼 통째로
      dbSet('payroll',raw); alert('옛 모양으로 저장했습니다: '+Object.keys(raw.sites).length+'곳'); return;
    }
    if(!raw.index||!raw.emp){ alert('모양을 알 수 없습니다 — index 와 emp 가 있어야 합니다.'); return; }
    var sites=Object.keys(raw.index);
    var rl=relockFor(raw.index, dbGet('payroll_locked',{})||{});
    if(!confirm('사업장 '+sites.length+'곳을 올릴까요?\n\n확정 표시 '+rl.moved+'건은 새 이름으로 옮깁니다.'
      +(rl.lost.length?'\n갈 곳을 못 찾은 '+rl.lost.length+'건은 그대로 둡니다: '+rl.lost.join(', '):''))) return;

    /* 직원 표를 사업장 묶음으로 나눠 올린다 — 한 묶음이 실패하면 거기서 멈춘다. */
    var byId={}, order=[];
    sites.forEach(function(st){ raw.index[st].forEach(function(rec){
      if(rec.id&&raw.emp[rec.id]){ byId[rec.id]=raw.emp[rec.id]; order.push(rec.id); } }); });
    var CH=200, done=0;
    function step(i){
      if(i>=order.length) return Promise.resolve();
      var part={}; order.slice(i,i+CH).forEach(function(id){ part[id]=byId[id]; });
      return fbDb.ref(ROOT+'/payroll/emp').update(part).then(function(){
        done+=Object.keys(part).length;
        setSaveState('saving','직원 표 올리는 중… '+done+'/'+order.length);
        return step(i+CH);
      });
    }
    setSaveState('saving','올리는 중…');
    step(0).then(function(){
      return fbDb.ref(ROOT+'/payroll_locked').set(rl.locked);
    }).then(function(){
      /* 목록은 **맨 마지막**이다 — 여기까지 와야 화면이 새 것으로 바뀐다. */
      return fbDb.ref(ROOT+'/payroll/index').set(raw.index);
    }).then(function(){
      payIdx=raw.index; payOld=null; cache.payroll_locked=rl.locked;
      empBox={}; allEmpsState='';
      setSaveState('saved','저장 완료'); render();
      alert('사업장 '+sites.length+'곳 저장 완료.\n직원 표 '+order.length+'줄 · 확정 '+rl.moved+'건 옮김.');
    }).catch(function(err){
      setSaveState('failed','저장 실패');
      alert('올리다 멈췄습니다 — '+(err&&(err.code||err.message))+'\n\n목록은 아직 안 바뀌었으니 화면은 그대로입니다. 다시 시도해 주세요.');
    });
   };r.readAsText(f);};i.click();}

/* ── 명세서(임금명세서) — 확정 급여 → 화이트라벨 인쇄/PDF ──
   렌더 규칙 원본: harness engine/payslip_html.py (동일 로직 유지할 것) */
function slipRows(e){
  var DED=[['소득세','소득세'],['지방세','지방소득세'],['국민연금','국민연금'],['건강보험','건강보험'],
           ['장기요양','장기요양보험'],['고용보험','고용보험'],
           ['연말정산','연말정산 정산액'],  // 부호 그대로(음수=환급) — 공제란에 표시
           ['기타공제','기타 공제']];
  var dedRows=[],dedSum=0;
  DED.forEach(function(p){ if(e[p[0]]!=null){ dedRows.push([p[1],e[p[0]]]); dedSum+=e[p[0]]; } });
  var dedTotal=(e.공제총액!=null)?e.공제총액:(dedRows.length?dedSum:null);
  if(dedTotal!=null&&dedTotal>dedSum) dedRows.push(['기타 공제(차액)',dedTotal-dedSum]);
  var net=(e.실수령!=null)?e.실수령:null;
  // 임금총액 = 반드시 (실수령 + 공제총액) → 명세서가 항상 '임금총액 − 공제 = 실수령'으로 맞음.
  // 기본급/과세엔 비과세(식대 등)가 빠져 그대로 쓰면 숫자가 안 맞는 사고가 생김.
  var gross;
  if(net!=null&&dedTotal!=null) gross=net+dedTotal;
  else if(e.지급총액!=null) gross=e.지급총액;
  else gross=(e.과세총액!=null)?e.과세총액:((e.기본급!=null)?e.기본급:null);
  if(net==null&&gross!=null&&dedTotal!=null) net=gross-dedTotal;
  if(dedTotal==null&&gross!=null&&net!=null&&gross>=net) dedTotal=gross-net;
  var payRows=[],calc=null;
  if(e.일당&&e.근무일수){
    payRows.push(['노무비(일당제)',(gross!=null)?gross:e.일당*e.근무일수]);
    calc='일당 '+won(e.일당)+'원 × '+e.근무일수+'일';
  }else{
    if(e.기본급!=null) payRows.push(['기본급',e.기본급]);
    if(gross!=null&&e.기본급!=null&&gross>e.기본급) payRows.push(['그 외 지급(수당·비과세 등)',gross-e.기본급]);
    else if(gross!=null&&e.기본급==null) payRows.push(['지급액',gross]);
  }
  return {pay:payRows,ded:dedRows,gross:gross,dedTotal:dedTotal,net:net,calc:calc};
}
/* 설정카드의 급여일이 «진짜 급여일인가».
   ⚠ 생성기(engine/build_site_cards.py)는 못 찾은 곳에 「미확인(사람 지정 필요)」이라는
     **글자**를 넣는다. 사람 보라고 넣은 표시지 급여일이 아니다. 그런데 글자라서
     `if(c.급여일)` 을 그냥 통과한다 — 그대로 두면 명세서 지급일 자리에 그 문구가
     찍혀 근로자에게 나간다(근로기준법 제48조제2항 필수 기재란이다).
     46곳 중 26곳이 이 상태다. 빈칸으로 본다 — 모르면 «모른다고» 비워 두는 편이
     틀린 글자를 찍는 것보다 낫다. */
function realPayday(v){
  var s=String(v==null?'':v).trim();
  return (!s||s.indexOf('미확인')>=0)?'':s;
}

/* ══════ 사람이 채운 설정값 (2026-09-03) ══════
   ⚠ 왜 site_cards 에 안 적나 — 그 자리는 기계가 다시 만들어 **통째로 덮어쓴다**
     (설정 카드 화면의 「JSON 가져와 서버 저장」이 배열을 그대로 set 한다).
     거기에 적으면 다음에 카드를 올릴 때 사람이 채운 값이 **조용히 사라진다.**
     그래서 사람 값만 따로 담고, 읽을 때 겹쳐 본다.
   담는 꼴: site_card_edit[사업장] = {급여일, 산정기간, by, at}
   ⚠ 단수처리는 담지 않는다 — 계산(policyFor)에 닿는 값이라 대표 판단이 먼저다. */
function cardEdits(){ return lmap('site_card_edit'); }

/* 카드 한 장을 «화면이 볼 모양»으로 겹친다 — 사람 값이 이긴다.
   빈 글자('')도 사람의 답이다(「모른다」를 뜻한다) — 있으면 그대로 쓴다. */
function cardView(c){
  var e=cardEdits()[String((c&&c.사업장)||'')]||{};
  var pick=function(f){ return (e[f]!=null)?realPayday(e[f]):realPayday(c&&c[f]); };
  return {
    사업장: (c&&c.사업장)||'',
    담당자: (c&&c.담당자)||'',
    급여일: pick('급여일'),
    산정기간: pick('산정기간'),
    급여일_사람: e.급여일!=null,
    산정기간_사람: e.산정기간!=null,
    고친이: e.by||'', 고친때: e.at||0,
    원본: c||{}
  };
}
/* 겹쳐 본 카드들. 사람이 채웠지만 카드에는 없는 사업장은 만들지 않는다 —
   카드가 진짜 목록이고, 편집은 그 위에 얹는 것뿐이다. */
function cardsView(){ return (dbGet('site_cards',[])||[]).map(cardView); }

function paydayOf(site){
  var set={};
  cardsView().forEach(function(v){ var nm=String(v.사업장||'');
    if(nm.indexOf(site)>=0||site.indexOf(nm)>=0){
      if(v.급여일) set[v.급여일]=1; } });
  var ks=Object.keys(set);
  return ks.length===1?ks[0]:'';
}
function slipHTML(site,month,e,payday,notice,draft){
  var r=slipRows(e);
  function rows(rs){ return rs.map(function(p){return '<tr><td>'+p[0]+'</td><td class="n">'+won(p[1])+'</td></tr>';}).join(''); }
  return '<div class="slip'+(draft?' draft':'')+'">'+
    '<div class="shead"><div class="co">'+site+'</div><div class="ttl">임 금 명 세 서</div></div>'+
    '<table class="meta"><tr><td><b>성명</b> '+(e.성명||'')+'</td><td><b>귀속</b> '+month+'</td><td><b>지급일</b> '+(payday||'-')+'</td></tr></table>'+
    '<div class="cols"><div><div class="sec">지급 내역</div><table class="tb">'+rows(r.pay)+
    '<tr class="tot"><td>임금총액</td><td class="n">'+won(r.gross)+'</td></tr></table></div>'+
    '<div><div class="sec">공제 내역</div><table class="tb">'+rows(r.ded)+
    '<tr class="tot"><td>공제총액</td><td class="n">'+won(r.dedTotal)+'</td></tr></table></div></div>'+
    '<div class="net">실수령액 <b>'+won(r.net)+'</b> 원</div>'+
    (r.calc?'<div class="calc">계산방법: '+r.calc+' = '+won(r.gross)+'원</div>':'')+
    (notice?'<div class="snote">'+notice+'</div>':'')+
    '<div class="foot">본 명세서는 근로기준법 제48조제2항에 따라 교부됩니다.</div></div>';
}

function payrollHwpxText(el){

/* 명세서 한글 저장 — 화면을 긁지 않고 «화면이 쓰는 그 자료»로 바로 만든다.
   slipRows() 가 지급·공제·실수령을 셈하는 한 곳이므로, 화면과 문서가 어긋날 수 없다.
   예전엔 .slip 을 긁어 지급·공제를 열폭 같은 두 칸 표로 뭉개고 금액을 왼쪽에 붙였다. */
function exportPayrollSlipsHwpx(){
  try{
    if(!window.HWPX||!window.HWPXDOC||!window.PureunHwp) throw new Error('한글 문서 기능을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.');
    var recs=payRecs(App.site);
    var rec=recs.filter(function(r){return r.월===App.month;})[0];
    if(!rec) throw new Error('저장할 급여명세서가 없습니다.');
    var emps=dedupeEmps(empsOf(rec)||[]);
    if(!emps.length) throw new Error('저장할 급여명세서가 없습니다.');
    var draft=!isLocked(App.site,App.month);
    var notice=dbGet('payslip_notice','');
    var payday=paydayOf(App.site);
    var doc=HWPXDOC.begin('plain');
    var body='';
    emps.forEach(function(e,i){
      var r=slipRows(e);
      body+=HWPXDOC.title('임 금 명 세 서', App.site+(draft?' · 미확정 검토용':''), {pageBreak:i>0})
        +HWPX.spacer()
        +HWPXDOC.infoTable([['성명', e.성명||'', '귀속', App.month], ['지급일', payday||'-']], doc)
        +HWPX.spacer()
        +HWPXDOC.moneyTable(['지급 내역','금액(원)'], r.pay, ['지급총액', r.gross], doc)
        +HWPX.spacer()
        +HWPXDOC.moneyTable(['공제 내역','금액(원)'], r.ded, ['공제총액', r.dedTotal], doc)
        +HWPX.spacer()
        +HWPXDOC.moneyTable(null, [['실수령액', r.net]], null, doc, {strong:true});
      if(r.calc) body+=HWPXDOC.note('※ 계산방법: '+r.calc+' = '+won(r.gross)+'원');
      if(notice) body+=HWPXDOC.note('※ '+String(notice).replace(/\s*\n\s*/g,' '));
      body+=HWPXDOC.note('본 명세서는 근로기준법 제48조제2항에 따라 교부됩니다.');
    });
    var safe=function(v){return String(v||'').replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,'_');};
    var fileName=safe(App.site)+'_'+safe(App.month)+'_급여명세서.hwpx';
    var bytes=HWPX.build([{body:body, landscape:false, margin:doc.margin}]);
    PureunHwp.validate(bytes,fileName);
    PureunHwp.download(bytes,fileName,'hwpx');
  }catch(err){ alert(err&&err.message?err.message:String(err)); }
}

function screenSlip(){

/* ── 수신함: 사업장별 자료 준비 현황(정상/도착/미도착/지연/오류) ──

   메일 도메인 연결 시 실제 메일 도착으로 자동 태깅 대체. 지금은 급여데이터 유무로 자동 판정. */
/* 귀속월을 숫자(1~12)로. 여러 꼴을 다 받는다 —
   「8월」(사람이 적는 꼴) · 「2026-08」(급여데이터함이 넘길 때 적는 꼴) ·
   「2026.08」 · 「26-08」 · 「8」.
   ⚠ 2026-08 에서 앞 네 자리를 월로 읽으면 20월·26월이 된다 — 그래서
   연-월 꼴을 **먼저** 가려낸다. 이걸 안 해서 급여데이터함에서 값을 넘겨도
   수신함이 영영 「미도착」이었다(2026-08-17에 찾음). */
function monthNum(s){
  var t=String(s==null?'':s).trim();
  var m=t.match(/(\d{1,2})\s*월/);                        // 「8월」이 가장 흔하다
  if(!m) m=t.match(/^\d{2,4}\s*[.\-\/]\s*(\d{1,2})$/);      // 「2026-08」·「26.8」
  if(!m) m=t.match(/^(\d{1,2})$/);                         // 숫자만

  var n=parseInt(m[1],10);
  return (n>=1&&n<=12)?n:null;
}
function dueDayOf(card){

/* ── 신고(파생신고 1호): 일용직 근로내용확인신고 초안 ──

function dailyReportRows(emps){
  var rows=[];
  (emps||[]).forEach(function(e){
    var days=e.근무일수; if(!days) return;
    var daily=e.일당, hourly=e.시급; if(!daily&&!hourly) return;
    var pay=(e.과세총액!=null)?e.과세총액:e.지급총액;
    var expect,unit,kind;
    if(daily){ expect=daily*days; unit=daily; kind='일당'; }
    else { var hrs=e.근무시간; expect=hrs?hourly*hrs:null; unit=hourly; kind='시급'; }
    if(pay==null) pay=expect;
    var chk;
    if(expect==null) chk='확인(시간 미상)';
    else if(Math.abs(expect-pay)<=1) chk='일치';
    else if(pay>expect) chk='확인(+'+won(pay-expect)+' 주휴·야간?)';
    else chk='확인('+kind+'×근무='+won(expect)+')';
    var cal=e.근로일자||[];
    if(cal.length&&cal.length!==days){
      chk=(chk==='일치')?('확인(달력'+cal.length+'≠일수'+days+')'):(chk+' · 달력'+cal.length+'≠일수'+days);
    }
    rows.push({성명:e.성명||'',근로일수:days,기초일수:days,근로일자:cal,단가구분:kind,단가:unit,
      일평균시간:(e.평균시간!=null)?Math.round(e.평균시간*100)/100:null,
      보수총액:pay,임금총액:(e.지급총액!=null)?e.지급총액:pay,
      소득세:e.소득세,지방소득세:e.지방세,검산:chk});
  });
  return rows;
}
/* 취득·상실: 입사일/퇴사일의 월이 신고월과 같은 직원 추출(연도는 표기해 사람이 확인) */
function hireLossRows(emps, mLabel){
  var mn=monthNum(mLabel), out=[];
  (emps||[]).forEach(function(e){
    var pay=(e.과세총액!=null)?e.과세총액:((e.지급총액!=null)?e.지급총액:e.기본급);
    var h=e.입사일, l=e.퇴사일;
    if(h&&parseInt(h.slice(5,7),10)===mn)
      out.push({구분:'취득',성명:e.성명||'',일자:h,보수월액:pay,비고:isDailyEmp(e)?'일용':'상용'});
    if(l&&parseInt(l.slice(5,7),10)===mn)
      out.push({구분:'상실',성명:e.성명||'',일자:l,보수월액:pay,비고:isDailyEmp(e)?'일용':'상용'});
  });
  out.sort(function(a,b){ return a.구분===b.구분?(a.일자<b.일자?-1:1):(a.구분==='취득'?-1:1); });

}
/* 명단 비교(추정): 전월 명단 대비 사라짐=상실추정 / 새로 나타남(입사일 없음)=취득추정.
   상용만 비교(일용은 매달 들고남이 정상 → 근로내용확인신고 영역). 연도는 파일명에서. */
function isDailyEmp(e){
  // 일용 판별: 일당제 or (시급제이면서 기본급 없음) or 시급값이 사실상 일급(5만원 이상).
  // 상용 대장에도 통상시급 열이 있어 '시급 보유'만으로 일용 취급하면 상용이 명단에서 빠지고,
  // 반대로 상용/일용 블록이 쌓인 명세서는 일용의 '일급'이 시급 열로 흡수됨(예: 100,000원).
  return !!(e.일당||(e.시급&&(e.기본급==null||e.시급>=50000)));

function ymOf(rec){
  var mn=monthNum(rec.월);
  if(mn==null) mn=monthNum(guessMonth(rec.파일)||'');   // 시트명이 '급여대장' 등일 때 파일명에서
  if(mn==null) return null;
  var f=String(rec.파일||''), y=null, m;
  m=f.match(/(20\d{2})\s*년?/); if(m) y=parseInt(m[1],10);
  if(y==null){ m=f.match(/(?:^|[^\d])(\d{2})\s*년/); if(m) y=2000+parseInt(m[1],10); }
  if(y==null){ m=f.match(/(?:^|[^\d])(\d{2})[.\-](\d{1,2})(?![\d])/);
    if(m&&parseInt(m[2],10)===mn) y=2000+parseInt(m[1],10); }
  return (y==null||y<2015||y>2035)?null:{y:y,m:mn};
}
function rosterMaps(pay, site){
  var byYM={};
  (((pay||{}).sites||{})[site]||[]).forEach(function(r){
    var ym=ymOf(r); if(!ym) return;
    var k=ym.y+'-'+ym.m, g=byYM[k]=byYM[k]||{names:{},emp:{}};
    dedupeEmps(r.직원||[]).forEach(function(e){
      if(isDailyEmp(e)) return;                       // 상용만
      var nm=(e.성명||'').trim(); if(!nm) return;
      g.names[nm]=1; if(!g.emp[nm]) g.emp[nm]=e;
    });
  });
  // 상용이 한 명도 없는 달(일용 파일만 온 달)은 명단 아님 → 제거(전원 상실추정 오탐 방지)
  Object.keys(byYM).forEach(function(k){ if(!Object.keys(byYM[k].names).length) delete byYM[k]; });
  return byYM;

function rosterDiffRows(pay, site, mLabel){

    if(m!==mn) return;

    var pmLabel=(m===1)?((y-1)+'년 12월'):(y+'년 '+(m-1)+'월');

        비고:pmLabel+' 명단까지 근무 · 이번 달 명단에 없음'});
    });

      if(prev.names[nm]) return;

      if(e.입사일) return;                             // 입사일 있으면 정식 취득으로 이미 표시

  return out;
}
function hireAllRows(pay, site, month){

/* ── 연차 관리(파생 4호): 재직자 법정 연차 발생일수 초안 ──
   근로기준법 60조: 1년미만 월개근 1일(최대11) / 1년이상 15일+2년마다 1일 가산(최대25).
   입사일 기준 산정(회계연도 방식 사업장은 설정 필요 — 화면 명시). 사용·잔여는 근태 영역. */
function annualLeaveOf(hire, base){
  var h=new Date(hire); if(isNaN(h.getTime())) return null;
  var years=base.getFullYear()-h.getFullYear();
  var anniv=new Date(base.getFullYear(), h.getMonth(), h.getDate());
  if(anniv>base) years--;
  var months=(base.getFullYear()-h.getFullYear())*12+(base.getMonth()-h.getMonth());
  if(base.getDate()<h.getDate()) months--;
  var days, note='';
  if(years<1){ days=Math.min(Math.max(months,0),11); note='1년 미만: 월 개근 시 1일(개근 가정 최대치)'; }
  else { days=Math.min(15+Math.floor((years-1)/2),25); }
  var next=new Date(base.getFullYear(), h.getMonth(), h.getDate());
  if(next<=base) next=new Date(base.getFullYear()+1, h.getMonth(), h.getDate());
  function iso(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  return {근속년:Math.max(years,0), 발생일수:days, 다음발생일:iso(next), 비고:note};

function leaveRows(pay, site, base){

/* ── 퇴직정산(파생 3호): 퇴사자(정식+추정)의 퇴직금 추정 초안 ──
   평균임금 = 마지막 3개월 임금총액 ÷ 그 3개월 역일수, 퇴직금 = 평균임금×30×(재직일수÷365).
   초안 수준: 상여·연차수당 가산 등 정밀 규칙은 노무사 확인(화면 명시). 상용만. */
function grossOf(e){ var r=slipRows(e); return r.gross; }
function empIndex(pay, site){
  // 상용 직원의 (연-월)별 기록: {성명: {ym: emp}}, ymList
  var ix={}, yms={};
  (((pay||{}).sites||{})[site]||[]).forEach(function(r){
    var ym=ymOf(r); if(!ym) return;
    var k=ym.y*100+ym.m;
    dedupeEmps(r.직원||[]).forEach(function(e){
      if(isDailyEmp(e)) return;
      var nm=(e.성명||'').trim(); if(!nm) return;
      yms[k]=1;                                        // 상용이 실재하는 달만 명단으로 인정
      ix[nm]=ix[nm]||{}; if(!ix[nm][k]) ix[nm][k]=e;
    });
  });
  return {ix:ix, yms:Object.keys(yms).map(Number).sort(function(a,b){return a-b;})};
}
function daysInYM(k){ var y=Math.floor(k/100), m=k%100; return new Date(y,m,0).getDate(); }
function ymAdd(k,delta){ var y=Math.floor(k/100), m=k%100-1+delta; return (y+Math.floor(m/12))*100+(m%12+12)%12+1; }
function severRows(pay, site, mLabel){
  var mn=monthNum(mLabel); if(mn==null) return [];
  var E=empIndex(pay,site), out=[];
  E.yms.forEach(function(k){
    if(k%100!==mn) return;
    var pk=ymAdd(k,-1); if(E.yms.indexOf(pk)<0) return;
    Object.keys(E.ix).forEach(function(nm){
      var rec=E.ix[nm], leave=null, kindTxt=null;
      var e=rec[k]||rec[pk]||{};
      if(e.퇴사일&&parseInt(e.퇴사일.slice(5,7),10)===mn){ leave=e.퇴사일; kindTxt='정식(퇴사일)'; }
      else if(rec[pk]&&!rec[k]&&!rec[pk].퇴사일){ var pd=daysInYM(pk);   // 퇴사일 기재자는 그 달에 정식 처리(중복 방지)
        leave=Math.floor(pk/100)+'-'+('0'+(pk%100)).slice(-2)+'-'+('0'+pd).slice(-2); kindTxt='추정(명단 사라짐)'; }
      if(!leave) return;
      var hire=null; Object.keys(rec).forEach(function(kk){ if(!hire&&rec[kk].입사일) hire=rec[kk].입사일; });
      var flags=[];
      // 마지막 근무월(임금 있는 최근 달)부터 3개월 수집
      var lastK=rec[k]?k:pk, months=[], sum=0, days=0, kk=lastK;
      for(var i=0;i<3;i++){ var em=rec[kk];
        if(em){ var g=grossOf(em); if(g!=null){ months.push(kk); sum+=g; days+=daysInYM(kk); } }
        kk=ymAdd(kk,-1); }
      if(months.length<3) flags.push('임금자료 '+months.length+'개월뿐');
      var avg=(days>0)?sum/days:null;
      var tenure=null, sever=null, target='';
      if(hire){
        var d1=new Date(hire), d2=new Date(leave);
        tenure=Math.round((d2-d1)/86400000)+1;
        if(tenure<365){ target='대상 아님(1년 미만)'; }
        else if(avg!=null){ sever=Math.round(avg*30*tenure/365); target='대상'; }
        else { target='계산불가(임금자료 없음)'; }
      } else { flags.push('입사일 미상 — 근속 계산 불가'); target='계산불가'; }
      out.push({성명:nm,입사일:hire||'-',마지막근무:leave,근거:kindTxt,
        재직일수:tenure,개월수:months.length,임금3개월:sum||null,평균임금:(avg!=null)?Math.round(avg):null,
        퇴직금추정:sever,대상:target,플래그:flags.join(' · ')});
    });
  });
  out.sort(function(a,b){return a.성명<b.성명?-1:1;});
  return out;
}
function severMonths(pay, site){

    '<div class="kv"><b>고용보험</b><span class="val">'+((c.고용보험||{}).단수처리||'')+'</span></div>'+
    '</div>';}).join('')+'</div>';
  return h;
}
/* 한 칸 — 비었으면 「채우기」 단추, 차 있으면 값과 연필.
   ⚠ 손잡이에 사업장 «이름»을 심지 않는다. esc() 가 따옴표를 떼어 내므로
     「오'브라이언」 같은 이름이면 떨어져 나간 이름으로 저장돼 엉뚱한 자리에 들어간다.
     번호로 가리키면 이름에 무엇이 들었든 안 깨진다. */
function cardField(v,i,f){
  var val=v[f], mine=v[f+'_사람'];
  var open='openCardEdit('+i+',\''+f+'\')';
  return '<div class="kv"><b>'+f+'</b>'+(val
    ? '<span class="val'+(mine?' mine':'')+'">'+(mine?'<span class="dot"></span>':'')+val+'</span>'
      +'<button class="pen" title="고치기" onclick="'+open+'">✎</button>'
    : '<button class="fill" onclick="'+open+'">＋ '+f+' 채우기</button>')+'</div>';
}

/* ══════ 설정값 채우기 창 ══════
   ⚠ 「비우기」가 반드시 있어야 한다 — 잘못 넣었을 때 되돌릴 길이 없으면
     틀린 급여일이 명세서에 계속 찍힌다. */
/* 누가 정했는지 남기려고 쓴다 — 나중에 「이 급여일 누가 넣었지」를 물을 수 있게.
   ⚠ 로그인 정보를 못 읽어도 저장은 막지 않는다(누가 넣었는지만 비고 값은 들어간다). */
function meEmail(){
  try{ var u=(window.firebase&&firebase.auth&&firebase.auth().currentUser)||null;
       return (u&&u.email)||''; }catch(e){ return ''; }
}
var cardEditOn=null;                        // {site, field} 또는 null
var PAYDAY_CHIPS=['5일','10일','15일','20일','25일','말일'];
var PERIOD_CHIPS=['1일~말일','11일~말일','21일~20일','25일~24일'];

/* 번호로 받아 이름을 여기서 찾는다 — 화면 손잡이에는 번호만 있다. */
function openCardEdit(i,field){
  var v=cardsView()[i]; if(!v) return;
  cardEditOn={site:v.사업장,field:field}; drawCardEdit();
}
function closeCardEdit(){ cardEditOn=null; drawCardEdit(); }
window.openCardEdit=openCardEdit; window.closeCardEdit=closeCardEdit;

function cardEditPick(v){
  var el=document.getElementById('cardEditInput'); if(!el) return;
  el.value=v; drawCardEditChips();
}
window.cardEditPick=cardEditPick;
window.drawCardEditChips=function(){ drawCardEditChips(); };

function drawCardEditChips(){
  var el=document.getElementById('cardEditInput'); if(!el||!cardEditOn) return;
  var now=String(el.value||'').trim();
  var chips=(cardEditOn.field==='급여일'?PAYDAY_CHIPS:PERIOD_CHIPS);
  var box=document.getElementById('cardEditChips'); if(!box) return;
  box.innerHTML=chips.map(function(t){
    return '<button class="chip'+(now===t?' on':'')+'" onclick="cardEditPick(\''+t+'\')">'+t+'</button>';
  }).join('');
}

function saveCardEdit(clear){
  if(!cardEditOn) return;
  var el=document.getElementById('cardEditInput');
  var val=clear?'':String((el&&el.value)||'').trim();
  /* ⚠ 「미확인…」을 손으로 다시 적는 것을 막는다 — 그러면 명세서에 그 글자가 찍힌다. */
  if(val&&val.indexOf('미확인')>=0){
    alert('「미확인」이라고 적으면 임금명세서 지급일 자리에 그 글자가 그대로 찍힙니다.\n모르시면 「비우기」를 누르세요 — 비면 「-」로 나갑니다.');
    return;
  }
  var m=cardEdits(), row=m[cardEditOn.site]||{};
  row[cardEditOn.field]=val;                       // 빈 글자도 사람의 답이다(「모른다」)
  row.by=meEmail();
  row.at=Date.now();
  m[cardEditOn.site]=row;
  cardEditOn=null;
  dbSet('site_card_edit',m);                       // render() 안에서 창도 다시 그린다
  drawCardEdit();
}
window.saveCardEdit=saveCardEdit;

function drawCardEdit(){
  var box=document.getElementById('cardEditBox'); if(!box) return;
  if(!cardEditOn){ box.innerHTML=''; return; }
  var f=cardEditOn.field;
  var v=cardsView().filter(function(x){return x.사업장===cardEditOn.site;})[0]||{};
  var was=v[f]||'';
  var who=(v.고친이&&v[f+'_사람'])?('마지막으로 '+v.고친이+'님이 정함'):'';
  box.innerHTML='<div class="mask" onclick="if(event.target===this)closeCardEdit()"><div class="modal">'
    +'<h3>'+f+'</h3>'
    +'<div class="who">'+esc(cardEditOn.site)+(v.담당자?(' · 담당 '+esc(v.담당자)):'')+(who?(' · '+who):'')+'</div>'
    +'<label>자주 쓰는 것</label><div class="chips" id="cardEditChips"></div>'
    +'<label>직접 적기</label>'
    +'<input type="text" id="cardEditInput" value="'+esc(was)+'" oninput="drawCardEditChips()">'
    +'<div class="why">'
    +(f==='급여일'
      ? '이 값은 <b>임금명세서 지급일</b>에 그대로 찍힙니다.<br>모르면 <b>비워 두십시오</b> — 빈칸은 「-」로 나가지만, 틀린 날짜가 찍히는 것보다 낫습니다.'
      : '자료를 언제부터 언제까지로 묶는지입니다. 독촉 마감을 셀 때 씁니다.')
    +'</div>'
    +'<div class="acts">'
    +'<button class="btn sec" onclick="saveCardEdit(true)">비우기</button>'
    +'<button class="btn sec" onclick="closeCardEdit()">그만두기</button>'
    +'<button class="btn" onclick="saveCardEdit(false)">저장</button>'
    +'</div></div></div>';
  drawCardEditChips();
}
/* ══════════════════════════════════════════════════════════════════════
   노동법 화면 3장 — 근태 · 연차·휴가 · 퇴직
   계산은 한 줄도 여기서 하지 않는다. 전부 js/pu-labor-core.js(PuLaborCore)를
   부른다 — 규칙이 화면에 흩어지면 사업장 110곳에서 서로 달라진다.
   저장은 기존 방식 그대로 납작한 지도(payroll_locked 와 같은 꼴):
     labor_policy[사업장] · emp_meta[사업장|성명]
     attend[사업장|월|성명] · leave[사업장|연도|성명] · sever[사업장|성명]
   ══════════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════════
   명세서 발송 · 회계프로그램용 엑셀 내보내기
   ──────────────────────────────────────────────────────────────────────
   발송은 **되돌릴 수 없는 밖으로 나가는 행위**다. 그래서 규칙을 못 박는다:
     ① 확정된 월만 보낸다(미확정은 검토용 워터마크본 — 나가면 사고다)
     ② 보내기 전에 사람에게 확인받는다(누구에게·몇 명·어느 달)
     ③ 보낸 사실을 남긴다(slip_sent) — 두 번 보내는 것을 막고, 물으면 답한다
   메일 함수는 이미 있는 sendPayslip 을 쓴다(pu-erp 와 같은 자리·같은 방식).
   ══════════════════════════════════════════════════════════════════════ */
var PAYSLIP_FN_URL = 'https://us-central1-pureun-erp.cloudfunctions.net/sendPayslip';

/* 보낸 기록 — 사업장|월|성명 */
function sentMap() { return lmap('slip_sent'); }
function sentOf(site, month, name) { return sentMap()[site + '|' + month + '|' + name] || null; }

/* 로그인 증표를 붙여 함수를 부른다(pu-erp 의 postMail 과 같은 방식).
   ⚠ 증표가 없으면 서버가 401 로 되돌린다 — 우리 도메인이 공개 발송기가 되지 않게. */
function postPayslip(payload) {
  var u = null;
  try { u = (window.firebase && firebase.auth && firebase.auth().currentUser) || null; } catch (e) {}
  if (!u) return Promise.reject(new Error('로그인 후 이용해 주세요.'));
  return u.getIdToken().then(function (tok) {
    return fetch(PAYSLIP_FN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); });
  });
}

/* 메일 본문 — 명세서 표를 그대로 담는다. 메일 클라이언트는 CSS 를 많이 지우므로
   표는 style 속성으로만 꾸민다(class 는 메일에서 사라진다). */
function payslipMailHtml(site, month, e) {
  var rows = slipRows(e) || [];
  var tr = rows.map(function (r) {
    return '<tr><td style="padding:5px 8px;border-bottom:1px solid #e2e8f0">' + (r[0] == null ? '' : r[0]) + '</td>' +
      '<td style="padding:5px 8px;border-bottom:1px solid #e2e8f0;text-align:right">' + (r[1] == null ? '' : r[1]) + '</td></tr>';
  }).join('');
  return '<div style="font-family:sans-serif;font-size:14px;line-height:1.7;color:#1e293b">' +
    '<p>' + (e.성명 || '') + ' 님 안녕하세요.</p>' +
    '<p>' + site + ' ' + month + ' 임금명세서를 보내 드립니다. (근로기준법 48조 2항)</p>' +
    '<table style="border-collapse:collapse;font-size:13px;min-width:280px">' + tr + '</table>' +
    '<p style="font-size:12px;color:#64748b">문의는 담당자에게 회신해 주세요. 이 메일은 푸른노무법인이 사업장을 대행해 보냅니다.</p>' +
    '</div>';
}

/* 한 사람에게 보내기 — 확인 → 발송 → 기록 */
function sendSlipOne(site, month, name) {
  if (!isLocked(site, month)) {
    alert('확정되지 않은 달입니다. 급여 처리 화면에서 확정한 뒤 보내세요.\n(미확정본은 「검토용」 워터마크가 찍힙니다)');
    return;
  }
  var meta = empMeta(site, name);
  var to = (meta.이메일 || '').trim();
  if (!to || to.indexOf('@') < 0) { alert(name + ' 님의 이메일이 없습니다. 이메일 칸에 넣어 주세요.'); return; }
  var rec = payRecs(site).filter(function (r) { return r.월 === month; })[0];
  var emps = rec ? (empsOf(rec) || []) : [];
  var e = dedupeEmps(emps).filter(function (x) { return x.성명 === name; })[0];
  if (!e) { alert('직원 표를 아직 받지 못했습니다. 잠시 뒤 다시 눌러 주세요.'); return; }
  var prev = sentOf(site, month, name);
  var msg = name + ' 님에게\n' + to + ' (으)로\n' + site + ' ' + month + ' 임금명세서를 보낼까요?';
  if (prev) msg = '이미 ' + new Date(prev.at).toLocaleString() + ' 에 보냈습니다.\n\n' + msg + '\n\n(다시 보내면 두 번 받게 됩니다)';
  if (!confirm(msg)) return;
  postPayslip({
    to: to, name: name, ym: month,
    subject: '[푸른노무법인] ' + month + ' 임금명세서 — ' + name,
    html: payslipMailHtml(site, month, e)
  }).then(function (d) {
    if (d && d.ok) {
      lput('slip_sent', site + '|' + month + '|' + name, { at: Date.now(), to: to, by: (d.by || '') });
      alert('발송 완료 → ' + to);
    } else {
      alert('발송 실패: ' + JSON.stringify((d && d.error) || d));
    }
  }).catch(function (err) { alert('호출 실패: ' + ((err && err.message) || err)); });
}

/* 여럿에게 — 한 번 확인하고 차례로 보낸다.
   ⚠ 한꺼번에 던지지 않는다(메일 서비스가 막고, 어디까지 갔는지도 모르게 된다).
     하나씩 보내고 결과를 세어 마지막에 알린다. */
function sendSlipAll(site, month) {
  if (!isLocked(site, month)) { alert('확정되지 않은 달입니다. 확정 후 보내세요.'); return; }
  var rec = payRecs(site).filter(function (r) { return r.월 === month; })[0];
  var emps = rec ? dedupeEmps(empsOf(rec) || []) : [];
  var todo = emps.filter(function (e) {
    var m = empMeta(site, e.성명);
    return m.이메일 && m.이메일.indexOf('@') > -1 && !sentOf(site, month, e.성명);
  });
  var noMail = emps.length - emps.filter(function (e) {
    var m = empMeta(site, e.성명); return m.이메일 && m.이메일.indexOf('@') > -1;
  }).length;
  if (!todo.length) {
    alert('보낼 대상이 없습니다.' + (noMail ? '\n이메일이 없는 사람 ' + noMail + '명 — 이메일 칸을 채우세요.' : '\n(이미 모두 보냈습니다)'));
    return;
  }
  if (!confirm(site + ' ' + month + ' 임금명세서를 ' + todo.length + '명에게 보낼까요?' +
    (noMail ? '\n(이메일 없는 ' + noMail + '명은 건너뜁니다)' : '') +
    '\n(이미 보낸 사람은 제외했습니다)')) return;
  var okN = 0, failN = 0, i = 0;
  function next() {
    if (i >= todo.length) {
      alert('발송 끝 — 성공 ' + okN + '명' + (failN ? ' · 실패 ' + failN + '명' : ''));
      render();
      return;
    }
    var e = todo[i++];
    var to = empMeta(site, e.성명).이메일;
    postPayslip({
      to: to, name: e.성명, ym: month,
      subject: '[푸른노무법인] ' + month + ' 임금명세서 — ' + e.성명,
      html: payslipMailHtml(site, month, e)
    }).then(function (d) {
      if (d && d.ok) { okN++; lput('slip_sent', site + '|' + month + '|' + e.성명, { at: Date.now(), to: to, by: (d.by || '') }); }
      else failN++;
      next();
    }).catch(function () { failN++; next(); });
  }
  next();
}

/* ── 회계프로그램용 급여대장 엑셀 ──
   ⚠ 더존 등 프로그램마다 가져오기 열 순서가 다르다. 그래서 「더존 전용 서식」이라고
     하지 않고 **표준 급여대장**을 낸다 — 첫 사용 시 프로그램의 가져오기 매핑을
     한 번 맞추면 그다음부터는 그대로 쓸 수 있다. 주민번호는 넣지 않는다. */
var LEDGER_COLS = ['순번', '성명', '기본급', '과세총액', '비과세', '지급총액',
  '국민연금', '건강보험', '장기요양', '고용보험', '소득세', '지방소득세', '공제총액', '실지급액'];
function ledgerRows(site, month) {
  var rec = payRecs(site).filter(function (r) { return r.월 === month; })[0];
  var emps = rec ? dedupeEmps(empsOf(rec) || []) : [];
  var out = [], i = 0;
  emps.forEach(function (e) {
    i++;
    var 지급 = (e.지급총액 != null) ? e.지급총액
      : ((e.실수령 != null && e.공제총액 != null) ? (Number(e.실수령) + Number(e.공제총액)) : null);
    out.push([i, e.성명 || '', e.기본급, e.과세총액, e.비과세, 지급,
      e.국민연금, e.건강보험, e.장기요양, e.고용보험, e.소득세, e.지방세, e.공제총액, e.실수령]
      .map(function (v, ix) { return ix <= 1 ? v : (v == null ? '' : v); }));
  });
  return out;
}
function exportLedgerXlsx(site, month) {
  var rows = ledgerRows(site, month);
  if (!rows.length) { alert('내보낼 직원 표가 없습니다. 잠시 뒤 다시 눌러 주세요.'); return; }
  if (!window.XLSXGEN) { alert('엑셀 만들기 도구를 불러오지 못했습니다.'); return; }
  XLSXGEN.download({
    sheet: '급여대장',
    title: site + ' ' + month + ' 급여대장',
    sub: '푸른노무법인 · 주민번호 미포함 · 회계프로그램 가져오기용',
    headers: LEDGER_COLS,
    rows: rows,
    landscape: true
  }, '급여대장_' + site + '_' + month + '.xlsx');
}
/* CSV — 엑셀이 막히거나 다른 프로그램에 넣을 때. 한글이 깨지지 않게 BOM 을 붙인다. */
function exportLedgerCsv(site, month) {
  var rows = ledgerRows(site, month);
  if (!rows.length) { alert('내보낼 직원 표가 없습니다.'); return; }
  var esc2 = function (v) {
    var s2 = (v == null ? '' : String(v));
    return (s2.indexOf(',') > -1 || s2.indexOf('"') > -1) ? '"' + s2.replace(/"/g, '""') + '"' : s2;
  };
  var lines = [LEDGER_COLS.join(',')].concat(rows.map(function (r) { return r.map(esc2).join(','); }));
  var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '급여대장_' + site + '_' + month + '.csv';
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
}
window.sendSlipOne = sendSlipOne; window.sendSlipAll = sendSlipAll;
window.exportLedgerXlsx = exportLedgerXlsx; window.exportLedgerCsv = exportLedgerCsv;

var LC = (typeof PuLaborCore !== 'undefined') ? PuLaborCore : null;

/* 연도별 기준값 — engine/rates.json 과 같은 값(마스터는 rates.json) */
var LABOR_RATES = {
  minWageHourly: { '2023': 9620, '2024': 9860, '2025': 10030, '2026': 10320 },
  pensionEE: { 'default': 0.045 },
  healthEE: { 'default': 0.03545 },
  longtermRate: { '2025': 0.1295, '2026': 0.1281, 'default': 0.1281 },
  empInsEE: { 'default': 0.009 }
};
function laborYear() { return String(new Date().getFullYear()); }
function minWageOf(y) { return LABOR_RATES.minWageHourly[String(y)] || LABOR_RATES.minWageHourly['2026']; }

/* ── 저장 지도 도우미 ── */
function lmap(key) { var v = dbGet(key, {}); return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {}; }
function lput(key, k, patch) {
  var m = lmap(key); var cur = m[k] || {};
  for (var p in patch) if (Object.prototype.hasOwnProperty.call(patch, p)) cur[p] = patch[p];
  m[k] = cur; dbSet(key, m);
}
function policyFor(site) {
  var p = lmap('labor_policy')[site] || {};
  var card = (dbGet('site_cards', []) || []).filter(function (c) { return c && (c.사업장 === site || c.name === site); })[0] || {};
  return {
    fiveOrMore: (p.fiveOrMore == null) ? true : !!p.fiveOrMore,
    weeklyContractHours: Number(p.weeklyContractHours || 40),
    dailyContractHours: Number(p.dailyContractHours || 8),
    monthlyStdHours: Number(p.monthlyStdHours || 209),
    rounding: p.rounding || card.단수처리 || 'floor',
    annualBase: 15, annualCap: 25,
    annualBasis: p.annualBasis || 'hire',
    pensionType: p.pensionType || 'NONE'
  };
}
function empMeta(site, name) { return lmap('emp_meta')[site + '|' + name] || {}; }
function attendOf(site, month, name) { return lmap('attend')[site + '|' + month + '|' + name] || {}; }
function leaveOf(site, year, name) { return lmap('leave')[site + '|' + year + '|' + name] || {}; }
function severOf(site, name) { return lmap('sever')[site + '|' + name] || {}; }

function esc(s) { return String(s == null ? '' : s).replace(/'/g, '').replace(/"/g, ''); }
function nInput(val, oninput, w) {
  return '<input type="number" step="0.01" value="' + (val == null ? '' : val) + '" oninput="' + oninput +
    '" style="width:' + (w || 62) + 'px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;text-align:right;font-size:12px">';
}
function dInput(val, oninput) {
  return '<input type="date" value="' + (val || '') + '" onchange="' + oninput +
    '" style="padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px">';
}
/* ── 직원 명단 — 반드시 「그 달 한 줄만」 받는다 ──
   payroll 전체는 수 MB다. 통째로 꺼내 쓰면 그 화면만 빈 채로 뜬다(급여 처리
   화면이 이미 겪은 고장). 그래서 급여 처리와 **같은 접근자**를 쓴다:
     payRecs(사업장) = 얇은 목록(월·직원수·신호)  ·  empsOf(줄) = 손에 있으면 표
     ensureEmps(줄)  = 없으면 그 줄만 받아 오고 다시 그린다
   연차·퇴직은 「어느 달 대장의 명단인가」를 정해야 하므로 선택한 달, 없으면
   가장 최근 달 한 줄만 받는다. */
function laborRec(site, month) {
  var recs = payRecs(site) || [];
  if (!recs.length) return null;
  if (month) return recs.filter(function (r) { return r.월 === month; })[0] || null;
  return recs[0];
}
function siteEmployees(site, month) {
  var rec = laborRec(site, month);
  if (!rec) return [];
  ensureEmps(rec);                       // 아직 없으면 그 줄만 받아 온다
  var emps = empsOf(rec);
  return emps ? dedupeEmps(emps) : [];
}
function laborEmpsReady(site, month) {
  var rec = laborRec(site, month);
  return !!(rec && empsOf(rec));
}
function siteCardsList() { return paySites() || []; }
function pickSiteHtml(title, sub) {
  var sites = siteCardsList();
  var h = '<h1>' + title + '</h1><div class="sub">' + sub + '</div>';
  if (!sites.length) return h + '<div class="empty">급여 데이터가 없습니다. 급여 처리 화면에서 먼저 자료를 올리세요.</div>';
  h += '<div class="cards">';
  sites.forEach(function (s) {
    /* 카드에서도 직원 표를 받지 않는다 — 얇은 목록(월 수·최근 달)만 보여 준다.
       110곳 카드를 그리면서 표를 받으면 화면이 열리지 않는다. */
    var rs = payRecs(s) || [];
    h += '<div class="c" style="cursor:pointer" onclick="navTo({site:\'' + esc(s) + '\'})">' +
      '<div class="t">' + s + '</div><div class="m">' + rs.length + '개월' +
      (rs[0] ? ' · 최근 ' + rs[0].월 : '') + '</div></div>';
  });
  return h + '</div>';
}

/* 정책(사업장 설정) 편집 줄 — 5인 이상 여부가 가산수당·연차를 가른다 */
function policyBar(site) {

    '<option value="1"' + (P.fiveOrMore ? ' selected' : '') + '>5인 이상</option>' +

    '<label>월 소정 ' + nInput(P.monthlyStdHours, 'lput(\'labor_policy\',\'' + s + '\',{monthlyStdHours:+this.value})', 62) + 'h</label>' +
    '<label>단수 <select onchange="lput(\'labor_policy\',\'' + s + '\',{rounding:this.value})" style="padding:3px 6px;border:1px solid var(--line);border-radius:6px">' +
    ['floor', 'ceil', 'round'].map(function (r) {
      return '<option value="' + r + '"' + (P.rounding === r ? ' selected' : '') + '>' + ({ floor: '절사', ceil: '올림', round: '반올림' }[r]) + '</option>';
    }).join('') + '</select></label>' +
    '<label>퇴직연금 <select onchange="lput(\'labor_policy\',\'' + s + '\',{pensionType:this.value})" style="padding:3px 6px;border:1px solid var(--line);border-radius:6px">' +
    ['NONE', 'DC', 'DB'].map(function (r) {
      return '<option value="' + r + '"' + (P.pensionType === r ? ' selected' : '') + '>' + ({ NONE: '미가입', DC: 'DC형', DB: 'DB형' }[r]) + '</option>';
    }).join('') + '</select></label>' +
    (!P.fiveOrMore ? '<span style="color:var(--warn)">※ 5인 미만 — 가산수당·연차 미적용(근기법 56·60조)</span>' : '') +
    '</div>';
}

/* ══════════════════════════════════════════════════════════════════════
   일별 출퇴근 달력 — 하루씩 찍고, 법이 세는 시간은 코어가 센다
   ──────────────────────────────────────────────────────────────────────
   왜 달력이 필요한가: 월 합계(연장 10h)만 받으면 **주 12시간 한도**(근기법
   53조)를 볼 수 없고, 야간 겹침(22~06시)·철야·주휴 개근도 판정할 수 없다.
   하루 단위로 있어야 법 판단이 된다.

   저장: attend[사업장|월|성명].일별 = [{date,in,out,breakMin,type}]
   ⚠ 일별 기록이 있으면 **그것이 이긴다**(월 합계 손입력을 덮는다). 두 값이
     다를 때 무엇이 진실인지 화면에 밝힌다 — 조용히 하나를 고르면 안 된다.
   ══════════════════════════════════════════════════════════════════════ */

/* 공휴일 — 휴일근로 판정에 쓴다. 연도별로 담는다(사업장 약정휴일도 여기).
   ⚠ 넣지 않으면 주휴일(기본 일요일)만 휴일로 본다 — 설날·추석 근로가
     평일 연장으로 계산되어 수당이 적게 나온다. 그래서 화면에서 알린다. */
function holidayMap() { return lmap('holidays'); }
function holidaysOf(year) {
  var m = holidayMap()[String(year)];
  return (m && m.list) ? m.list : [];
}
function setHolidays(year, text) {
  var list = String(text || '').split(/[,\s]+/)
    .map(function (x) { return x.trim(); })
    .filter(function (x) { return /^\d{4}-\d{1,2}-\d{1,2}$/.test(x); })
    .map(function (x) {
      var p = x.split('-');
      return p[0] + '-' + ('0' + p[1]).slice(-2) + '-' + ('0' + p[2]).slice(-2);
    });
  lput('holidays', String(year), { list: list });
}

/* 그 달의 일별 기록 (배열) */
function dayRecords(site, month, name) {
  var a = attendOf(site, month, name);
  return (a && a.일별 && a.일별.length) ? a.일별 : [];
}
/* 일별 기록으로 낸 집계 — 없으면 null(부르는 쪽이 손입력을 쓴다) */
function derivedAttend(site, month, name, P) {
  var recs = dayRecords(site, month, name);
  if (!recs.length) return null;
  var y = laborYearOfMonth(month);
  return LC.summarizeAttendance(recs, { policy: P, holidays: holidaysOf(y), weeklyOffDow: 0 });
}
/* 월 이름에서 연도 뽑기 — '2026-03'·'3월'·'23년 7월' 모두 온다.
   ⚠ 연도를 못 찾으면 올해로 본다(최저임금·공휴일 연도가 어긋나면 값이 틀린다). */
function laborYearOfMonth(month) {
  var m = String(month || '').match(/(20\d{2})/);
  if (m) return m[1];
  var m2 = String(month || '').match(/^(\d{2})년/);
  if (m2) return '20' + m2[1];
  /* '25.05 늘봄반찬' 처럼 **두 자리 연도.월** 로 오는 시트가 실제로 있다.
     이걸 놓치면 최저임금·공휴일 연도가 올해로 잡혀 과거 달 계산이 틀린다. */
  var m3 = String(month || '').match(/(?:^|[^\d])(\d{2})[.\-\/](\d{1,2})(?!\d)/);
  if (m3 && Number(m3[2]) >= 1 && Number(m3[2]) <= 12) return '20' + m3[1];
  return laborYear();
}
/* 월 이름에서 '몇 월'인지 — 달력 격자를 그리려면 필요하다.
   ⚠ 실제 시트 이름은 '3월'·'2026-03'·'23년 7월'·'25.05 늘봄반찬' 로 섞여 온다. */
function laborMonthNum(month) {
  var s = String(month || '');
  var m = s.match(/(20\d{2})[-.\/]?(\d{1,2})/);
  if (m && Number(m[2]) >= 1 && Number(m[2]) <= 12) return Number(m[2]);
  var m2 = s.match(/(\d{1,2})\s*월/);
  if (m2 && Number(m2[1]) >= 1 && Number(m2[1]) <= 12) return Number(m2[1]);
  var m3 = s.match(/(?:^|[^\d])(\d{2})[.\-\/](\d{1,2})(?!\d)/);
  if (m3 && Number(m3[2]) >= 1 && Number(m3[2]) <= 12) return Number(m3[2]);
  return null;
}

var DAY_TYPES = [
  { key: 'work', label: '근무' }, { key: 'holiday', label: '휴일근로' },
  { key: 'annual', label: '연차' }, { key: 'half', label: '반차' },
  { key: 'absent', label: '결근' }, { key: 'paid', label: '유급휴가' },
  { key: 'unpaid', label: '무급휴가·휴직' }
];
function dayTypeLabel(t) {
  for (var i = 0; i < DAY_TYPES.length; i++) if (DAY_TYPES[i].key === t) return DAY_TYPES[i].label;
  return '근무';
}

/* 하루 기록 저장·삭제 — 같은 날짜는 덮어쓴다(두 줄이 되면 시간이 두 배로 센다) */
function saveDay(site, month, name) {
  var d = document.getElementById('dayDate'), i = document.getElementById('dayIn'),
      o = document.getElementById('dayOut'), b = document.getElementById('dayBreak'),
      t = document.getElementById('dayType'), nt = document.getElementById('dayNote');
  if (!d || !d.value) { alert('날짜를 확인하세요.'); return; }
  var type = t ? t.value : 'work';
  var rec = { date: d.value, type: type };
  if (type === 'work' || type === 'holiday') {
    if (!i.value || !o.value) { alert('출근·퇴근 시각을 넣으세요. (휴가·결근이면 유형을 바꾸세요)'); return; }
    rec.in = i.value; rec.out = o.value; rec.breakMin = Number(b.value || 0);
  }
  if (nt && nt.value) rec.note = nt.value;
  var list = dayRecords(site, month, name).filter(function (r) { return r.date !== rec.date; });
  list.push(rec);
  list.sort(function (a, c) { return String(a.date) < String(c.date) ? -1 : 1; });
  lput('attend', site + '|' + month + '|' + name, { 일별: list });
  App.day = null;
}
function delDay(site, month, name, date) {
  if (!confirm(date + ' 기록을 지울까요?')) return;
  var list = dayRecords(site, month, name).filter(function (r) { return r.date !== date; });
  lput('attend', site + '|' + month + '|' + name, { 일별: list });
  App.day = null;
}
function clearDays(site, month, name) {
  if (!confirm(name + ' 의 이 달 일별 기록을 모두 지울까요? (월 합계 손입력으로 돌아갑니다)')) return;
  lput('attend', site + '|' + month + '|' + name, { 일별: [] });
}

/* ── 달력 화면 ── */
function screenDayCalendar() {
  var site = App.site, month = App.month, name = App.emp;
  var P = policyFor(site), s = esc(site), m = esc(month), nm = esc(name);
  var year = laborYearOfMonth(month), mon = laborMonthNum(month);
  var h = '<h1>근태 달력</h1><div class="sub"><a href="#" onclick="navTo({emp:null,day:null});return false">← ' +
    month + ' 직원표</a> · <b>' + name + '</b> · ' + year + '년 ' + (mon || '?') + '월</div>';

  if (!mon) {
    return h + '<div class="empty">이 시트 이름(' + month + ')에서 「몇 월」인지 읽지 못해 달력을 그릴 수 없습니다. ' +
      '월 합계 입력을 쓰세요.</div>';
  }

  var recs = dayRecords(site, month, name);
  var byDate = {};
  recs.forEach(function (r) { byDate[r.date] = r; });
  var holi = {};
  holidaysOf(year).forEach(function (d) { holi[d] = 1; });

  /* 달력 격자 — 일요일 시작. UTC 로 계산해 시간대로 하루 밀리는 일을 막는다. */
  var first = new Date(Date.UTC(Number(year), mon - 1, 1));
  var lead = first.getUTCDay();
  var last = new Date(Date.UTC(Number(year), mon, 0)).getUTCDate();
  var pad2s = function (n) { return (n < 10 ? '0' : '') + n; };

  h += '<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;background:#fff;table-layout:fixed">' +
    '<tr style="background:var(--paper)">' +
    ['일', '월', '화', '수', '목', '금', '토'].map(function (d, i) {
      return '<th style="padding:6px;font-size:12px;color:' + (i === 0 ? 'var(--bad)' : (i === 6 ? '#2563eb' : 'inherit')) + '">' + d + '</th>';
    }).join('') + '</tr><tr>';
  var col = 0, i2;
  for (i2 = 0; i2 < lead; i2++) { h += '<td style="border:1px solid var(--line);height:64px;background:#f8fafc"></td>'; col++; }
  for (var d2 = 1; d2 <= last; d2++) {
    if (col === 7) { h += '</tr><tr>'; col = 0; }
    var ds = year + '-' + pad2s(mon) + '-' + pad2s(d2);
    var r = byDate[ds];
    var isSun = (new Date(Date.UTC(Number(year), mon - 1, d2)).getUTCDay() === 0);
    var isHoli = isSun || holi[ds];
    var bg = r ? (r.type === 'absent' ? '#e2e8f0' : (r.type === 'holiday' ? '#fffbeb' :
      (r.type === 'annual' || r.type === 'half' ? '#f8fafc' : (r.type === 'unpaid' ? '#f8fafc' : '#f8fafc')))) : '#fff';
    var body = '';
    if (r) {
      if (r.type === 'work' || r.type === 'holiday') {
        body = '<div style="font-size:10.5px;color:var(--sub)">' + (r.in || '') + '~' + (r.out || '') + '</div>' +
          '<div style="font-size:11.5px;font-weight:700">' + (Math.round(LC.dayWorkedHours(r) * 100) / 100) + 'h</div>';
      } else {
        body = '<div style="font-size:11px;font-weight:600">' + dayTypeLabel(r.type) + '</div>';
      }
    }
    h += '<td onclick="navTo({day:\'' + ds + '\'})" style="border:1px solid var(--line);height:64px;vertical-align:top;padding:4px;cursor:pointer;background:' + bg + '">' +
      '<div style="font-size:11px;color:' + (isHoli ? 'var(--bad)' : 'var(--sub)') + '">' + d2 + (holi[ds] ? ' 공휴' : '') + '</div>' + body + '</td>';
    col++;
  }
  while (col < 7) { h += '<td style="border:1px solid var(--line);height:64px;background:#f8fafc"></td>'; col++; }
  h += '</tr></table></div>';

  /* 하루 편집 — 칸을 누르면 아래에 열린다 */
  var sel = App.day;
  if (sel) {
    var cur = byDate[sel] || {};
    h += '<div style="margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px">' +
      '<b style="font-size:13px">' + sel + '</b>' +
      '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px">' +
      '<input type="hidden" id="dayDate" value="' + sel + '">' +
      '<label>유형 <select id="dayType" style="padding:5px 8px;border:1px solid var(--line);border-radius:6px">' +
      DAY_TYPES.map(function (t) {
        return '<option value="' + t.key + '"' + ((cur.type || 'work') === t.key ? ' selected' : '') + '>' + t.label + '</option>';
      }).join('') + '</select></label>' +
      '<label>출근 <input type="time" id="dayIn" value="' + (cur.in || '09:00') + '" style="padding:5px 6px;border:1px solid var(--line);border-radius:6px"></label>' +
      '<label>퇴근 <input type="time" id="dayOut" value="' + (cur.out || '18:00') + '" style="padding:5px 6px;border:1px solid var(--line);border-radius:6px"></label>' +
      '<label>휴게(분) <input type="number" id="dayBreak" value="' + (cur.breakMin == null ? 60 : cur.breakMin) + '" style="width:64px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;text-align:right"></label>' +
      '<input type="text" id="dayNote" placeholder="비고" value="' + esc(cur.note || '') + '" style="padding:5px 8px;border:1px solid var(--line);border-radius:6px;width:140px">' +
      '<button class="btn" onclick="saveDay(\'' + s + '\',\'' + m + '\',\'' + nm + '\')">저장</button>' +
      (byDate[sel] ? '<button class="btn sec" onclick="delDay(\'' + s + '\',\'' + m + '\',\'' + nm + '\',\'' + sel + '\')">지우기</button>' : '') +
      '<button class="btn sec" onclick="navTo({day:null})">닫기</button>' +
      '</div><div class="note" style="margin-top:8px">퇴근이 출근보다 이르면 <b>철야</b>로 봅니다(다음날 퇴근). ' +
      '야간(22~06시) 겹침·연장·주휴는 저장하면 코어가 자동으로 셉니다.</div></div>';
  } else {
    h += '<div class="note">날짜 칸을 누르면 그 하루를 입력합니다.</div>';
  }

  /* 이 달 집계 — 코어가 센 값 */
  var att = derivedAttend(site, month, name, P);
  if (att) {
    var A = att.합계;
    var meta = empMeta(site, name);
    var 시급 = LC.hourlyOrdinary(Number(meta.통상임금월액 || 0), P);
    var al = LC.statutoryAllowances(att, 시급, { policy: P, payType: meta.급여형태 || 'monthly' });
    h += '<h2 style="margin:18px 0 8px;font-size:15px">이 달 집계 (달력으로 계산)</h2>';

  h2 += '<div class="note">가산율 — 연장 ×1.5 · 야간 ×0.5(가산분) · 휴일 8h이내 ×1.5 / 8h초과 ×2.0 (근기법 56조). ' +

  // DC 부담금 점검
  if (P.pensionType === 'DC') {

      '<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:12px;background:#fff">' +
      '<tr style="background:var(--paper)"><th style="padding:7px;text-align:left">성명</th><th style="padding:7px;text-align:right">연간 임금총액</th><th style="padding:7px;text-align:right">최소 부담금(1/12)</th><th style="padding:7px;text-align:right">실제 납입</th><th style="padding:7px;text-align:right">부족액</th></tr>';
    emps.forEach(function (e) {
      var nm = esc(e.성명), sv = severOf(App.site, e.성명), mk = "'" + s + '|' + nm + "'";
      var dc = LC.dcContribution({ 연간임금총액: Number(sv.연간임금총액 || 0), 실제납입액: Number(sv.DC납입 || 0), policy: P });
      h += '<tr style="border-top:1px solid var(--line);text-align:right">' +
        '<td style="padding:6px 7px;text-align:left;font-weight:600">' + (e.성명 || '') + '</td>' +
        '<td style="padding:6px 7px">' + nInput(sv.연간임금총액, 'lput(\'sever\',' + mk + ',{연간임금총액:+this.value})', 100) + '</td>' +

        '<td style="padding:6px 7px;font-weight:700;color:' + (dc.부족액 > 0 ? 'var(--bad)' : 'var(--ok)') + '">' + won(dc.부족액) + '</td></tr>';
    });
    h += '</table></div><div class="note">DC형 부담금은 <b>연간 임금총액의 1/12 이상</b>이어야 합니다(퇴직급여법 20조). 부족하면 추가 납입 대상입니다.</div>';
  }
  h += '<div class="note">평균임금 = 퇴직 전 3개월 임금총액 ÷ 총일수 (상여·연차수당은 3/12 산입). ' +
    '<b>평균임금이 통상임금보다 적으면 통상임금을 씁니다</b>(근기법 2조 2항 — 실무에서 가장 자주 놓치는 지점). ' +
    '퇴직금 = 1일 평균임금 × 30일 × 재직일수/365, 계속근로 1년 미만·주 15시간 미만은 대상 아님. ' +

  return h;
}

/* 간이세액표 올리기 — 모양을 먼저 본다. 잘못된 파일이 들어가면 세금이
   조용히 0 이 되거나 엉뚱해진다(가장 찾기 어려운 종류의 고장). */
function importTaxTable(){var i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
   r.onload=function(){try{
     var t=JSON.parse(r.result);
     if(!t||!t.rows||!t.rows.length) throw new Error('rows 가 없습니다 — 간이세액표 JSON이 맞는지 확인하세요');
     var bad=t.rows.filter(function(x){return x.min==null||!x.tax||!x.tax.length;}).length;
     if(bad) throw new Error(bad+'개 구간에 min 또는 tax 가 없습니다');
     if(t.rows[t.rows.length-1].max!=null) throw new Error('마지막 구간에 상한이 있습니다 — 높은 급여가 「표없음」이 됩니다');
     dbSet('tax_table',t);
     alert('간이세액표 저장 완료 — '+(t.연도||'')+'년 · 구간 '+t.rows.length+'개 · 가족 칸 '+t.rows[0].tax.length+'개');
   }catch(err){alert('간이세액표 오류: '+err.message);}};r.readAsText(f);};i.click();}
window.importTaxTable=importTaxTable;
function importCards(){var i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
   r.onload=function(){try{var raw=JSON.parse(r.result);var a=Array.isArray(raw)?raw:Object.values(raw);dbSet('site_cards',a);alert('카드 '+a.length+'개 서버 저장 완료');}catch(err){alert('JSON 오류: '+err.message);}};r.readAsText(f);};i.click();}
window.importCards=importCards;window.doLogin=doLogin;window.doLogout=doLogout;window.goBack=goBack;
