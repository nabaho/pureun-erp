<style>

*{box-sizing:border-box;margin:0}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--paper);color:var(--ink);font-size:14px}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 18px}

main{padding:16px;max-width:1100px;margin:0 auto}
.gate{padding:40px 18px;text-align:center;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.empty{padding:28px 18px;text-align:center;color:var(--sub)}
h1{font-size:18px;margin-bottom:4px}
.sub{font-size:12px;color:var(--sub);margin-bottom:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.warnbar{background:#FBF1DE;border:1px solid #F0D9A8;color:#7C4A03;border-radius:12px;padding:10px 14px;font-size:13px;display:flex;align-items:center;gap:12px;margin-bottom:14px;cursor:pointer}

.row.pkon{background:#F5F7FF}
.chip{width:58px;flex:0 0 58px;font-size:11.5px;color:#fff;border-radius:99px;padding:3px 0;text-align:center}
.pkno{width:22px;flex:0 0 22px;text-align:right;color:var(--sub);font-size:12px}

.pkbar .pkn{color:var(--navy);font-weight:700}
.pkbar .pkx{margin-left:auto;padding:3px 9px}

/* ── 분류 탭 · 찾기 줄 틀고정 (사진첩과 같은 방식, 대표 지시 2026-08-13) ──
   자료가 쌓이면 아래로 내려간 뒤 탭을 누르려고 다시 맨 위로 올라와야 한다.
   배경색을 반드시 준다 — 투명하면 목록이 그 밑으로 비쳐 글씨를 덮는다. */
#tabsBar{position:sticky;top:0;z-index:6;background:var(--paper);
  display:flex;gap:6px;padding:8px 0 9px;flex-wrap:wrap}
#tabsBar button{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:9px;
  padding:7px 13px;font-size:12.5px;font-weight:700;font-family:inherit;white-space:nowrap}
#tabsBar button.on{border-color:var(--navy);background:var(--navy);color:#fff}
#tabsBar button .n{font-weight:800;opacity:.75;margin-left:5px;font-size:11px}
/* 찾기 줄도 탭 바로 아래 붙는다(탭 높이만큼 내려서 겹치지 않게 한다) */
#findBar{position:sticky;top:44px;z-index:5;background:var(--paper);padding:0 0 10px}
#findBar input{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);

#findBar input:focus{outline:none;border-color:var(--navy)}

.expbadge{font-size:11.5px;color:var(--warn);font-weight:700;white-space:nowrap}

/* ── 내 폴더 (사진첩과 같은 방식) ── 분류 탭과 다른 축 — 탭은 「무엇인가」,
   폴더는 「어느 일인가」. 점선 테두리로 "직접 만든 것"임을 가른다. */
.foldbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
.foldbar button{border:1px dashed #93c5fd;background:#fff;color:var(--navy);border-radius:9px;
  padding:6px 11px;font-size:12.5px;font-weight:700;font-family:inherit;display:flex;align-items:center;gap:5px}
.foldbar button.on{background:var(--navy);border-style:solid;color:#fff}
.foldbar button.sub{margin-left:14px}
.foldbar .n{font-weight:800;opacity:.75;font-size:11px}
.foldbar .dots{border-radius:5px;padding:0 4px;opacity:.75}
.foldbar .dots:hover{background:rgba(0,0,0,.08)}
.foldbar button.add{color:var(--sub);border-color:var(--line)}
.foldedit{display:inline-flex;gap:5px;align-items:center}
.foldedit.sub{margin-left:14px}
.foldedit input{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;
  font-family:inherit;width:140px}
.foldedit button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;
  font-size:12px;font-family:inherit;cursor:pointer}
.foldmenu{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:5px;min-width:150px;box-shadow:0 8px 22px rgba(20,30,80,.18)}
.foldmenu div{padding:8px 10px;font-size:12.5px;border-radius:7px;cursor:pointer}
.foldmenu div:hover{background:#f1f5fb}
.foldmenu .del{color:var(--bad)}

/* ── 확대 보기 (사진첩과 같은 방식) ──
   클릭하면 전체화면으로 보이고, 사진은 다시 눌러 원본 크기로 확대한다(서류 글씨를
   읽어야 한다). 엑셀·PDF 는 사진이 아니라 새 창에서 여는 안내만 보여준다. */
#viewer{display:none;position:fixed;inset:0;background:rgba(8,10,16,.96);z-index:30;flex-direction:column}
#viewer.on{display:flex}
#viewer .bar{display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;color:#fff}
#viewer .bar span{font-size:12.5px;opacity:.85}
#viewer .back{background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:9px;
  padding:8px 14px;font-size:13px;font-family:inherit}
#viewerBody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  overflow:auto;padding:0 12px 16px}
#viewerBody img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
#viewerBody.zoom{align-items:flex-start;justify-content:flex-start}
#viewerBody.zoom img{max-width:none;max-height:none;cursor:zoom-out}
#viewerBody .doc{color:#fff;text-align:center;padding:20px}
#viewerBody .doc a{color:#fff;font-weight:700}

@media(max-width:520px){main{padding:12px}}
</style>

  <div class="brand" onclick="App.go('sites')">푸 급여데이터함</div>

  <div id="viewerBody" onclick="toggleViewerZoom(event)"></div>
</div>

<script>
/* ══════ 설정 (다른 앱과 같은 파이어베이스 프로젝트) ══════ */
const FB_APPCHECK_KEY = '6Ldu1hEtAAAAABB9lH9EMEyd7uBLEy9H5HxJoua_';
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyDkZz5QlKSoqMOYByp5YGeMNLNDrIghliA',
  databaseURL: 'https://pureun-erp-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'pureun-erp',
  storageBucket: 'pureun-erp.firebasestorage.app',
  appId: '1:936817166182:web:9bd31f70d0afdf5fca2aa7',
  messagingSenderId: '936817166182'
};

const $ = id => document.getElementById(id);

/* 바깥에서 온 글자(파일 이름·업체명 등)를 화면에 넣기 전에 이스케이프한다.
   사람이 지은 이름이라 <script> 가 들어올 수 있다. */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

let db = null, store = null;
const S = window.PuPaydataStore;

/* 이번 달을 'YYYY-MM' 으로 — 사람이 손으로 고칠 수 있는 칸의 첫 값. */
function thisMonth() {
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth() + 1 < 10 ? '0' : '') + (d.getMonth() + 1);
}

/* ══════ 목록 골라 한 번에 — 순수 로직 ══════
   대표 지시(2026-08-10 명함첩, 2026-08-13 급여데이터함에도 적용) — "넘버링 넣고 ㅁ 로
   체크해서 골라 처리할 수 있게 항상 해 달라." 명함첩(pu-cards.html)이 쓰는 것과
   같은 설계를 따른다 — 목록마다 방식이 다르면 매번 새로 배워야 한다.
   이 함에 목록이 늘어날 때(대기 칸·서랍)도 이 함수들을 그대로 쓴다.

   ⚠ 골라 둔 것에서 **지금 목록에 없는 것을 반드시 걸러낸다**(pickPrune). 고른 뒤
   기준 월을 바꾸거나 자료가 사라지면, 안 보이는 것이 조용히 딸려 와 함께 처리된다. */
function pickOn(sel, id) { return !!(sel && sel[id]); }
function pickToggle(sel, id) {
  const s = Object.assign({}, sel || {});
  if (s[id]) delete s[id]; else s[id] = true;
  return s;
}
/* 지금 보이는 것 전부 켜기·끄기 — 걸러 놓은 것만 걸린다 */
function pickSetAll(sel, ids, on) {
  const s = Object.assign({}, sel || {});
  (ids || []).forEach(id => { if (on) s[id] = true; else delete s[id]; });
  return s;
}
/* 실제로 손댈 번호들 — **지금 목록에 있는 것만** */
function pickList(sel, ids) { return (ids || []).filter(id => pickOn(sel, id)); }
/* 보이는 것이 다 켜져 있나 (「모두 고르기」 단추의 상태) */
function pickAllOn(sel, ids) { return !!(ids && ids.length) && ids.every(id => pickOn(sel, id)); }
/* 목록에서 사라진 번호는 버린다 — 안 버리면 개수가 틀린다 */
function pickPrune(sel, ids) {
  const live = new Set(ids || []);
  const s = {};
  Object.keys(sel || {}).forEach(id => { if (live.has(id)) s[id] = true; });
  return s;
}

/* 화면(kind)별로 따로 기억한다 — 사업장 목록에서 고른 것이 다른 목록에 딸려가면 안 된다 */
function pickOf(kind) { App.pick = App.pick || {}; return App.pick[kind] || {}; }
function pickPut(kind, sel) { App.pick = App.pick || {}; App.pick[kind] = sel; }

/* 지금 화면에 보이는 번호들 — 목록마다 실제로 그리는 것과 **같은 식으로** 뽑는다.
   화면에서 값을 미리 받아 두면 안 그린 채 눌렸을 때 낡은 값으로 처리하게 된다. */
function pickVisible(kind) {
  if (kind === 'sites') return sitesModel(App.companies, App.pending, App.arrivals, App.month, Date.now()).rows.map(r => r.id);
  if (kind === 'pending') return Object.keys(App.pending || {});
  if (kind === 'drawer') {
    const rows = drawerModel(App.itemsKeep, App.itemsMonth, App.companyId, App.kind, Date.now()).rows;
    return searchRows(rows, App.query).map(r => r.id);
  }
  return [];
}
function pickHit(kind, id) { pickPut(kind, pickToggle(pickOf(kind), id)); App.render(); }
function pickToggleAll(kind) {
  const ids = pickVisible(kind);
  pickPut(kind, pickSetAll(pickOf(kind), ids, !pickAllOn(pickOf(kind), ids)));
  App.render();
}
function pickCancel(kind) { pickPut(kind, {}); App.render(); }
window.pickHit = pickHit; window.pickToggleAll = pickToggleAll; window.pickCancel = pickCancel;

/* 골라 둔 개수와 단추를 그리는 띠 — 목록이 늘어도 같은 모양이어야 한다.
   acts 는 골랐을 때 보일 단추들(HTML) — 지금은 사업장 목록에 일괄 처리가 없어 빈 문자열. */
function pickBar(kind, ids, acts) {
  const sel = pickPrune(pickOf(kind), ids); pickPut(kind, sel);
  const on = pickList(sel, ids);
  const allOn = pickAllOn(sel, ids);
  return '<div class="pkbar">'
    + '<label><input type="checkbox" ' + (allOn ? 'checked' : '')
    + ' onchange="pickToggleAll(\'' + kind + '\')"> 모두 고르기'
    + (ids.length ? ' (' + ids.length + ')' : '') + '</label>'
    + (on.length
      ? '<span class="pkn">' + on.length + '개 골랐습니다</span>' + (acts || '')
        + '<button class="btn pkx" onclick="pickCancel(\'' + kind + '\')">고르기 취소</button>'
      : '<span class="sub" style="margin:0">☐ 를 눌러 여러 곳을 골라 둘 수 있습니다</span>')
    + '</div>';
}

/* ══════ 화면 상태 ══════
   어느 화면인가 · 어느 사업장인가 · 어느 달인가. 자료는 여기 모아 두고 화면이 읽는다. */
const App = {
  screen: 'sites', companyId: '', companyName: '', month: '', kind: 'attend', query: '',
  companies: [], pending: {}, arrivals: {}, trash: null, me: null, pick: {},
  itemsKeep: null, itemsMonth: null, itemsMonthSlot: '',
  viewerId: '', viewerUrl: '', viewerZoom: false, viewerErr: '',
  folders: {}, foldersCompanyId: '', folderPick: 'all', folderEdit: { mode: '', fid: '', value: '' },

  go(screen, o) {
    // 사업장을 바꿔 들어가면 남의 폴더가 골라진 채로 남지 않게 되돌린다 —
    // 폴더 번호는 사업장마다 따로다(다른 사업장 폴더 번호와 우연히 같을 수 있다).
    if (o && o.companyId && o.companyId !== App.companyId) o = Object.assign({ folderPick: 'all' }, o);
    Object.assign(App, o || {});
    App.screen = screen;
    if (screen === 'drawer') { ensureDrawerData(); ensureFolders(); }
    App.render();
  },

  logout() { firebase.auth().signOut().then(() => location.reload()); },

  render() {
    const m = $('main');
    if (App.screen === 'sites') { m.innerHTML = screenSites(); renderViewer(); return; }
    if (App.screen === 'pending') { m.innerHTML = screenPending(); renderViewer(); return; }
    if (App.screen === 'drawer') { m.innerHTML = screenDrawer(); renderViewer(); return; }
    m.innerHTML = '<div class="card"><div class="empty">아직 만들지 않은 화면입니다.</div></div>';
    renderViewer();
  }
};
window.App = App;

/* ══════ 시작 ══════ */
firebase.initializeApp(FIREBASE_CONFIG);
try { if (firebase.appCheck) firebase.appCheck().activate(new firebase.appCheck.ReCaptchaV3Provider(FB_APPCHECK_KEY), true); }
catch (e) { console.warn('[AppCheck]', e && e.message); }

db = firebase.database();
try { store = firebase.storage(); } catch (e) { store = null; }

firebase.auth().onAuthStateChanged(function (user) {
  if (user) { App.me = user; afterLogin(); return; }
  /* 로그인은 통합 포털 한 곳에서만 한다 — 앱마다 두면 계정 문제를 앱 수만큼 겪는다. */
  if (!/[?&]login=1/.test(location.search) && location.protocol !== 'file:') {
    location.replace('enter.html?v=' + Math.floor(Date.now() / 600000));
    return;
  }
  $('gate').textContent = '포털(enter.html)에서 로그인해 주세요.';
});

function afterLogin() {
  /* 저장 층에 계정을 알려 준다 — 자리 계산이 이걸로 된다. */
  S.init({ db: db, storage: store, uid: App.me.uid, name: App.me.email || '' });
  $('whoami').textContent = App.me.email || '';

  /* 권한은 나중에 알려 줘도 된다 — 못 읽어도 화면은 떠야 한다. */
  db.ref('uid_roles/' + App.me.uid).once('value')
    .then(s => { const r = s.val() || {}; S.init({ isAdmin: !!r.isAdmin }); })
    .catch(e => console.warn('[권한]', e && e.code));

  $('gate').style.display = 'none';
  $('main').style.display = '';
  loadSites();
}

/* 첫 화면 자료를 읽어 온다. 한쪽이 실패해도 화면은 뜬다 —
   빈 화면에 「권한 거부」만 남으면 무엇을 해야 할지 알 수 없다. */
function loadSites() {
  Promise.all([
    S.listCompanies().catch(e => { console.warn('[업체관리]', e && e.code); return []; }),
    S.listMyPending().catch(e => { console.warn('[대기 칸]', e && e.code); return {}; }),
    S.listArrivals().catch(e => { console.warn('[도착 칸]', e && e.code); return {}; })
  ]).then(([companies, pending, arrivals]) => {
    App.companies = companies;
    App.pending = pending;
    App.arrivals = arrivals;
    App.render();
  });
}

/* ── 첫 화면 계산 ──
   화면 그리기와 갈라 둔다 — 계산만 따로 검사할 수 있어야 한다.

   ⚠ 장수는 **도착 칸**에서 센다(그 업체·그 달에 몇 장 왔나). 내 자리 목록을 세지
   않는 까닭은 두 가지다. ① 첫 화면에서 사람마다 자리를 다 열면 느리다.
   ② 남이 담은 장수까지 세면 권한 경계가 첫 화면에서 새어 나간다.
   도착 칸에는 업체·귀속월·종류·장수만 있고 누가 담았는지는 없다.

   근로계약서는 월과 무관한 keep 칸에 있으므로 **그 칸도 함께** 센다 —
   안 세면 계약서만 있는 업체가 「0장」으로 보인다. */
function sitesModel(companies, pending, arrivals, month, now) {
  const slot = S.monthKey(month);
  const pend = pending || {};
  const arr = arrivals || {};
  const pendIds = Object.keys(pend);
  const rows = (companies || []).map(c => {
    const node = arr[c.id] || {};
    let count = 0;
    S.KINDS.forEach(k => {
      count += S.arrivalCount(node[S.KEEP], k.key);
      if (slot) count += S.arrivalCount(node[slot], k.key);
    });
    return { id: c.id, name: c.name, arrived: count > 0, count: count };
  });
  const known = {};
  (companies || []).forEach(c => { known[c.id] = true; });
  const unlisted = Object.keys(arr).filter(id => !known[id]).map(id => {
    let n = 0;
    Object.keys(arr[id] || {}).forEach(sl => {
      S.KINDS.forEach(k => { n += S.arrivalCount(arr[id][sl], k.key); });
    });
    return { id: id, name: id, count: n };
  });
  return {
    pendingCount: pendIds.length,
    staleCount: pendIds.filter(id => S.isStalePending(pend[id], now)).length,
    rows: rows,
    unlisted: unlisted
  };
}

/* 파일 이름에서 이름표를 짐작한다. 빈칸으로 두면 아무도 안 채운다. 그렇다고
   아무거나 골라 넣으면 틀린 서랍에 들어가고 아무도 모른다 — 못 알아본 것은 빈칸으로 남긴다. */
function guessTag(rec, companies) {
  const text = String((rec && rec.filename) || '') + ' ' + String((rec && rec.note) || '');
  const hit = S.matchCompanyName(text, companies || []);

  let month = '';
  let m = text.match(/(20\d{2})\D{0,3}(\d{1,2})\s*월/);          // '2026년 8월'
  if (!m) m = text.match(/(20\d{2})[.\-_](\d{1,2})(?!\d)/);      // '2026-08'
  if (!m) {
    const yy = text.match(/(?:^|\D)(\d{2})\s*년\s*(\d{1,2})\s*월/); // '25년 07월'
    if (yy) m = [yy[0], '20' + yy[1], yy[2]];
  }
  if (m) {
    const mo = parseInt(m[2], 10);
    if (mo >= 1 && mo <= 12) month = m[1] + '-' + (mo < 10 ? '0' : '') + mo;
  }

  let kind = 'etc';
  if (/근로계약|계약서/.test(text)) kind = 'contract';
  else if (/명세서|이체|신고|취득|상실/.test(text)) kind = 'output';
  else if (/급여대장|노임|임금대장|대장/.test(text)) kind = 'ledger';
  else if (/근태|출근|출역|근무|시간/.test(text)) kind = 'attend';

  return { companyId: hit ? hit.id : '', companyName: hit ? hit.name : '', month: month, kind: kind };
}

/* 대기 칸에서 서랍으로. 저장 층이 한 묶음으로 쓴다 —
   자료 생기기·대기 칸 지우기·도착 표시가 함께 들어간다. */
function fileToDrawer(id) {
  const rec = App.pending[id];
  if (!rec) return;
  const coId = $('co_' + id).value;
  const co = App.companies.filter(c => c.id === coId)[0];
  const tag = { companyId: coId, companyName: co ? co.name : '', month: $('mo_' + id).value,
    kind: $('kd_' + id).value, at: Date.now() };
  let up;
  try { up = S.drawerUpdate(id, rec, tag); }
  catch (e) { alert(e.message); return; }     // 무엇이 비었는지 사람에게 알린다
  S.moveToDrawer(id, tag, rec)
    .then(() => { delete App.pending[id]; App.render(); })
    .catch(e => alert('저장 실패: ' + (e.code || e.message) + '\n다시 시도해 주세요.'));
}
window.fileToDrawer = fileToDrawer;

/* ══════ 사업장 서랍 (Task 9) — 사진첩과 같은 틀고정 탭·찾기 줄·확대 보기 ══════ */

/* 근로계약서(keep)는 귀속월과 무관한 다른 칸에 있다 — 그 칸의 자료까지 세어야
   「근로계약서 3」처럼 탭에 정확한 장수가 뜬다. 두 칸(keep·이 달)을 함께 받는다. */
function drawerCounts(itemsKeep, itemsMonth, companyId) {
  const counts = {};
  S.KINDS.forEach(k => {
    const box = k.keep ? (itemsKeep || {}) : (itemsMonth || {});
    counts[k.key] = Object.keys(box).filter(id => {
      const r = box[id];
      return r && r.companyId === companyId && r.kind === k.key;
    }).length;
  });
  return counts;
}

/* 지금 고른 탭(kind)에 맞는 칸만 본다 — keep 탭이면 keep 칸, 아니면 이 달 칸. */
function drawerModel(itemsKeep, itemsMonth, companyId, kind, now) {
  const box = S.isKeepKind(kind) ? (itemsKeep || {}) : (itemsMonth || {});
  const rows = Object.keys(box).map(id => {
    const r = box[id];
    return Object.assign({ id: id, expired: S.isExpired(r, now) }, r);
  }).filter(r => r.companyId === companyId && r.kind === kind)
    .sort((a, b) => (Number(b.filedAt || 0) - Number(a.filedAt || 0)));
  return { rows: rows };
}

/* 파일 이름으로 좁힌다 — 사진첩의 찾기 줄과 같은 자리(탭 바로 아래)에 둔다. */
function searchRows(rows, query) {
  const q = String(query || '').trim().toLowerCase();
  if (!q) return rows || [];
  return (rows || []).filter(r => String(r.filename || '').toLowerCase().indexOf(q) >= 0);
}

/* ══════ 내 폴더 (사진첩과 같은 방식) ══════
   탭이 「무엇인가」라면 폴더는 「어느 일인가」다. 지금 고른 탭의 자료(rows)
   안에서만 센다 — 탭을 넘나들면 세는 대상도 달라진다(사진첩과 같은 방식). */
function folderCounts(rows) {
  const counts = { all: (rows || []).length };
  (rows || []).forEach(r => { if (r && r.folder) counts[r.folder] = (counts[r.folder] || 0) + 1; });
  return counts;
}

/* 'all' 이면 다 보여준다. 폴더를 고르면 그 폴더로 이름표가 붙은 것만. */
function folderRows(rows, folderPick) {
  if (!folderPick || folderPick === 'all') return rows || [];
  return (rows || []).filter(r => r && r.folder === folderPick);
}

/* keep 칸은 한 번만, 이 달 칸은 달이 바뀔 때만 다시 읽는다 — 매번 두 칸을
   전부 새로 읽으면 탭만 눌러도 실시간DB를 불필요하게 두드린다. */
function ensureDrawerData() {
  if (!App.month) App.month = thisMonth();
  const monthSlot = S.monthKey(App.month) || S.KEEP;
  const jobs = [];
  if (!App.itemsKeep) {
    jobs.push(S.listSlot(S.KEEP).then(v => { App.itemsKeep = v; })
      .catch(e => { console.warn('[서랍·keep]', e && e.code); App.itemsKeep = {}; }));
  }
  if (App.itemsMonthSlot !== monthSlot) {
    jobs.push(S.listSlot(monthSlot).then(v => { App.itemsMonth = v; App.itemsMonthSlot = monthSlot; })
      .catch(e => { console.warn('[서랍·' + monthSlot + ']', e && e.code); App.itemsMonth = {}; App.itemsMonthSlot = monthSlot; }));
  }
  if (jobs.length) Promise.all(jobs).then(() => App.render());
}

/* 사업장이 바뀌면 폴더 목록도 다시 읽는다 — 폴더는 사업장마다 따로 관리된다. */
function ensureFolders(force) {
  if (!force && App.foldersCompanyId === App.companyId) return Promise.resolve();
  return S.listFolders(App.companyId).then(v => {
    App.folders = v; App.foldersCompanyId = App.companyId; App.render();
  }).catch(e => {
    console.warn('[폴더]', e && e.code);
    App.folders = {}; App.foldersCompanyId = App.companyId;
  });
}

/* 폴더 칸 — 전체 + 내가 만든 폴더들(한 단계 하위폴더까지). 점선 테두리로
   "직접 만든 것"임을 가른다(사진첩과 같은 방식). */
function folderBar(folders, folderPick, counts) {
  const f = folders || {};
  const byAge = (a, b) => (f[a].createdAt || 0) - (f[b].createdAt || 0);
  const tops = Object.keys(f).filter(id => !f[id].parent).sort(byAge);
  const kidsOf = pid => Object.keys(f).filter(id => f[id].parent === pid).sort(byAge);
  const chip = (fid, label, n, sub) =>
    '<button class="' + (folderPick === fid ? 'on' : '') + (sub ? ' sub' : '') + '" onclick="pickFolder(\''
    + esc(fid) + '\')">' + esc(label) + '<span class="n">' + (n || 0) + '</span>'
    + (fid !== 'all' ? '<span class="dots" title="이름 바꾸기·하위폴더·지우기"'
      + ' onclick="event.stopPropagation();folderMenu(event,\'' + esc(fid) + '\')">⋯</span>' : '') + '</button>';

  let h = '<div class="foldbar">';
  h += chip('all', '📁 전체', counts.all, false);
  if (App.folderEdit.mode === 'new') h += folderEditorHtml(false);
  tops.forEach(fid => {
    if (App.folderEdit.mode === 'rename' && App.folderEdit.fid === fid) h += folderEditorHtml(false);
    else h += chip(fid, '📁 ' + (f[fid].name || ''), counts[fid], false);
    kidsOf(fid).forEach(kid => {
      if (App.folderEdit.mode === 'rename' && App.folderEdit.fid === kid) h += folderEditorHtml(true);
      else h += chip(kid, '↳ ' + (f[kid].name || ''), counts[kid], true);
    });
    if (App.folderEdit.mode === 'sub' && App.folderEdit.fid === fid) h += folderEditorHtml(true);
  });
  if (App.folderEdit.mode !== 'new') h += '<button class="add" onclick="openFolderEditor(\'new\')">＋ 폴더</button>';
  h += '</div>';
  return h;
}

/* 이름 적는 칸을 그 자리에 연다(사진첩과 같은 방식, 브라우저 prompt 대신) —
   누른 자리와 적는 자리가 멀면 헷갈린다. */
function folderEditorHtml(sub) {
  return '<span class="foldedit' + (sub ? ' sub' : '') + '">'
    + '<input id="foldInput" type="text" maxlength="30" placeholder="폴더 이름"'
    + ' value="' + esc(App.folderEdit.value || '') + '" onkeydown="foldKeyDown(event)">'
    + '<button onclick="submitFolderEditor()">✓</button>'
    + '<button onclick="cancelFolderEditor()">✕</button></span>';
}

function openFolderEditor(mode, fid, value) {
  App.folderEdit = { mode: mode, fid: fid || '', value: value || '' };
  App.render();
  setTimeout(() => { const el = $('foldInput'); if (el) { el.focus(); el.select(); } }, 0);
}
function cancelFolderEditor() { App.folderEdit = { mode: '', fid: '', value: '' }; App.render(); }
function foldKeyDown(e) {
  if (e.key === 'Enter') { e.preventDefault(); submitFolderEditor(); }
  else if (e.key === 'Escape') { e.preventDefault(); cancelFolderEditor(); }
}
function submitFolderEditor() {
  const inp = $('foldInput');
  const name = inp ? String(inp.value || '').trim() : '';
  const mode = App.folderEdit.mode, fid = App.folderEdit.fid;
  // 빈 이름은 그냥 접는다 — 지우기가 아니다(지우기는 ⋯ 차림표에 따로 있다).
  if (!name) { cancelFolderEditor(); return; }
  App.folderEdit = { mode: '', fid: '', value: '' };
  if (mode === 'rename') {
    S.renameFolder(App.companyId, fid, name).then(() => ensureFolders(true))
      .catch(e => { alert('이름을 바꾸지 못했습니다 — ' + (e.message || e)); App.render(); });
    return;
  }
  S.addFolder(App.companyId, name, mode === 'sub' ? fid : null).then(r =>
    ensureFolders(true).then(() => { App.folderPick = r.id; App.render(); })
  ).catch(e => { alert('폴더를 만들지 못했습니다 — ' + (e.message || e)); App.render(); });
}

/* ⋯ 차림표 — 이름 바꾸기·하위폴더 만들기·지우기를 한자리에. */
function folderMenu(ev, fid) {
  closeFolderMenu();
  const f = (App.folders || {})[fid] || {};
  const m = document.createElement('div');
  m.className = 'foldmenu'; m.id = 'foldMenu';
  m.innerHTML = '<div onclick="renameFolderAsk(\'' + esc(fid) + '\')">✏ 이름 바꾸기</div>'
    + (f.parent ? '' : '<div onclick="openFolderEditor(\'sub\',\'' + esc(fid) + '\')">📁 하위폴더 만들기</div>')
    + '<div class="del" onclick="removeFolderAsk(\'' + esc(fid) + '\')">🗑 폴더 지우기</div>';
  document.body.appendChild(m);
  const r = ev.target.getBoundingClientRect();
  m.style.left = Math.min(r.left, window.innerWidth - 170) + 'px';
  m.style.top = (r.bottom + 4) + 'px';
  setTimeout(() => document.addEventListener('click', closeFolderMenu, { once: true }), 0);
}
function closeFolderMenu() { const m = $('foldMenu'); if (m && m.parentNode) m.parentNode.removeChild(m); }
function renameFolderAsk(fid) { closeFolderMenu(); openFolderEditor('rename', fid, ((App.folders || {})[fid] || {}).name || ''); }
function removeFolderAsk(fid) {
  closeFolderMenu();
  if (!confirm('이 폴더를 지울까요?\n담긴 자료는 지워지지 않고 「전체」에 그대로 남습니다.')) return;
  S.deleteFolder(App.companyId, fid).then(() => {
    if (App.folderPick === fid) App.folderPick = 'all';
    return ensureFolders(true);
  }).catch(e => { alert('지우지 못했습니다 — ' + (e.message || e)); App.render(); });
}
function pickFolder(fid) { App.folderPick = fid; App.render(); }

/* 자료 한 건을 폴더에 넣거나(folderId) 뺀다('' 로 부르면 뺀다).
   서버에 쓰는 동안 화면이 멈추지 않게, 저장이 끝나면 우리가 들고 있는 자료에도
   바로 반영해 다시 읽지 않고 새로고침한다. */
function assignFolder(id, folderId) {
  const slot = S.isKeepKind(App.kind) ? S.KEEP : (S.monthKey(App.month) || S.KEEP);
  S.setFolder(slot, id, folderId).then(() => {
    const box = S.isKeepKind(App.kind) ? App.itemsKeep : App.itemsMonth;
    if (box && box[id]) box[id].folder = folderId || null;
    App.render();
  }).catch(e => alert('저장 실패: ' + (e.code || e.message) + '\n다시 시도해 주세요.'));
}
window.pickFolder = pickFolder; window.folderMenu = folderMenu; window.closeFolderMenu = closeFolderMenu;
window.renameFolderAsk = renameFolderAsk; window.removeFolderAsk = removeFolderAsk;
window.openFolderEditor = openFolderEditor; window.cancelFolderEditor = cancelFolderEditor;
window.submitFolderEditor = submitFolderEditor; window.foldKeyDown = foldKeyDown;
window.assignFolder = assignFolder;

function screenDrawer() {
  if (!App.month) App.month = thisMonth();
  const counts = drawerCounts(App.itemsKeep, App.itemsMonth, App.companyId);
  const model = drawerModel(App.itemsKeep, App.itemsMonth, App.companyId, App.kind, Date.now());
  const foldCounts = folderCounts(model.rows);
  const foldered = folderRows(model.rows, App.folderPick);
  const rows = searchRows(foldered, App.query);
  const ids = rows.map(r => r.id);
  const sel = pickPrune(pickOf('drawer'), ids); pickPut('drawer', sel);

  let h = '<div style="margin-bottom:10px"><button class="btn" onclick="App.go(\'sites\')">← 사업장</button></div>'
    + '<h1>' + esc(App.companyName || App.companyId) + '</h1>'
    + '<div class="sub">' + model.rows.length + '건'
    + (App.folderPick !== 'all' ? ' 중 이 폴더 ' + foldered.length + '건' : '')
    + (App.query ? ' · 찾은 것 ' + rows.length + '건' : '') + '</div>';

  if (!S.isKeepKind(App.kind)) {
    h += '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">기준 월'
      + ' <input class="btn" style="width:110px" value="' + esc(App.month) + '"'
      + ' onchange="App.month=this.value;ensureDrawerData();App.render()"></div>';
  } else {
    h += '<div class="sub">근로계약서는 월과 상관없이 모두 보입니다.</div>';
  }

  h += '<div id="tabsBar">' + S.KINDS.map(k =>
    '<button class="' + (App.kind === k.key ? 'on' : '') + '" onclick="App.kind=\'' + k.key
    + '\';App.query=\'\';ensureDrawerData();App.render()">' + esc(k.label)
    + '<span class="n">' + counts[k.key] + '</span></button>').join('') + '</div>';

  /* 내 폴더 — 분류 탭과 다른 축이다(사진첩과 같은 방식). 탭은 「무엇인가」,
     폴더는 「어느 일인가」다. 그래서 탭을 넘나들어도 고른 폴더는 그대로 둔다. */
  h += folderBar(App.folders, App.folderPick, foldCounts);

  h += '<div id="findBar"><input placeholder="파일 이름으로 찾기" value="' + esc(App.query) + '"'
    + ' oninput="App.query=this.value;App.render()"></div>';

  const folderOpts = folderOptionsHtml(App.folders);

  h += '<div class="card">' + (rows.length ? pickBar('drawer', ids, '') + rows.map((r, i) =>
    '<div class="row' + (pickOn(sel, r.id) ? ' pkon' : '') + '">'
    + '<label onclick="event.stopPropagation()"><input type="checkbox" ' + (pickOn(sel, r.id) ? 'checked' : '')
    + ' onchange="pickHit(\'drawer\',\'' + esc(r.id) + '\')"></label>'
    + '<span class="pkno">' + (i + 1) + '</span>'
    + '<b style="flex:1;cursor:pointer" onclick="openViewer(\'' + esc(r.id) + '\')">'
    + esc(r.filename || '(이름 없음)') + '</b>'
    + (r.expired ? '<span class="expbadge">지난 것</span>' : '')
    + '<span class="sub" style="margin:0">' + (r.filedAt ? new Date(r.filedAt).toLocaleDateString() : '') + '</span>'
    + '<select class="btn" style="font-size:11.5px;padding:4px 6px" onclick="event.stopPropagation()"'
    + ' onchange="assignFolder(\'' + esc(r.id) + '\',this.value)">'
    + folderOpts.replace('value="' + esc(r.folder || '') + '"', 'value="' + esc(r.folder || '') + '" selected')
    + '</select>'
    + '</div>').join('')
    : '<div class="empty">' + (App.query ? '찾는 자료가 없습니다.'
      : (App.folderPick !== 'all' ? '이 폴더에 담긴 자료가 없습니다.'
        : '이 칸에 담긴 자료가 없습니다. 다른 월이나 다른 종류를 보세요.')) + '</div>')
    + '</div>';
  return h;
}

/* 자료 한 줄의 「폴더 지정」 골라잡기 — 있는 폴더만 나온다. 새 폴더는 폴더 칸의
   「+ 폴더」로 만든다(그 자리에서 이름을 적는 방식 하나로 통일한다). */
function folderOptionsHtml(folders) {
  const f = folders || {};
  const tops = Object.keys(f).filter(id => !f[id].parent)
    .sort((a, b) => (f[a].createdAt || 0) - (f[b].createdAt || 0));
  let h = '<option value="">폴더 없음</option>';
  tops.forEach(fid => {
    h += '<option value="' + esc(fid) + '">' + esc(f[fid].name || '') + '</option>';
    Object.keys(f).filter(id => f[id].parent === fid)
      .sort((a, b) => (f[a].createdAt || 0) - (f[b].createdAt || 0))
      .forEach(kid => { h += '<option value="' + esc(kid) + '">↳ ' + esc(f[kid].name || '') + '</option>'; });
  });
  return h;
}

/* ── 확대 보기 (사진첩과 같은 방식) ──
   사진은 눌러서 원본 크기로 확대한다(서류 글씨를 읽어야 한다). 엑셀·PDF 는
   미리 볼 수 없으니 새 창에서 여는 안내만 보여준다. */
function findRow(id) {
  const boxes = [App.itemsKeep, App.itemsMonth];
  for (let i = 0; i < boxes.length; i++) { if (boxes[i] && boxes[i][id]) return boxes[i][id]; }
  return null;
}
function openViewer(id) {
  App.viewerId = id; App.viewerUrl = ''; App.viewerZoom = false; App.viewerErr = '';
  App.render();
  const rec = findRow(id);
  if (!rec) { App.viewerErr = '자료를 찾을 수 없습니다.'; App.render(); return; }
  S.fileDownloadUrl(rec.file).then(url => { App.viewerUrl = url; App.render(); })
    .catch(e => { App.viewerErr = e.message; App.render(); });
}
function closeViewer() { App.viewerId = ''; App.render(); }
function toggleViewerZoom(ev) {
  if (ev && ev.target && ev.target.tagName !== 'IMG') return;   // 바깥을 눌러도 확대되지 않는다
  App.viewerZoom = !App.viewerZoom; App.render();
}
window.openViewer = openViewer; window.closeViewer = closeViewer; window.toggleViewerZoom = toggleViewerZoom;

/* App.render() 가 화면을 바꿀 때마다 함께 그린다 — 뷰어는 어느 화면 위에도 뜰 수 있다. */
function renderViewer() {
  const v = $('viewer');
  if (!v) return;
  const rec = App.viewerId ? findRow(App.viewerId) : null;
  v.classList.toggle('on', !!App.viewerId);
  if (!App.viewerId) return;
  $('viewerName').textContent = rec ? (rec.filename || '') : '';
  const body = $('viewerBody');
  body.classList.toggle('zoom', App.viewerZoom);
  const isImage = rec && /^image\//.test(rec.mime || '');
  if (App.viewerErr) {
    body.innerHTML = '<div class="doc">불러오지 못했습니다 — ' + esc(App.viewerErr) + '</div>';
  } else if (!App.viewerUrl) {
    body.innerHTML = '<div class="doc">불러오는 중…</div>';
  } else if (isImage) {
    body.innerHTML = '<img src="' + esc(App.viewerUrl) + '" alt="">';
  } else {
    body.innerHTML = '<div class="doc">이 파일은 미리 볼 수 없습니다.<br>'
      + '<a href="' + esc(App.viewerUrl) + '" target="_blank" rel="noopener">새 창에서 열기</a></div>';
  }
}
</script>
</body>
</html>
