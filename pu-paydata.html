<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>급여데이터함 — 푸른노무법인</title>
<link rel="manifest" href="pu-paydata-manifest.json">
<!--
  급여데이터함 — 급여 아웃소싱에 쓰는 근로자·임금 자료를 사업장별로 담는 앱.
  설계서: docs/superpowers/specs/2026-08-13-급여데이터함-design.md
  계획서: docs/superpowers/plans/2026-08-13-급여데이터함-1차.md

  사진첩과 부품은 공유하고 함은 분리한다 — 보관 기간(3년)·볼 수 있는 사람·파일
  종류가 셋 다 달라서, 같은 함에 두면 한쪽 기준이 다른 쪽을 망친다.

  ⚠ 이 파일에는 실시간DB·창고 경로를 적지 않는다.
    경로를 아는 곳은 js/pu-paydata-store.js 한 군데뿐이다(검사가 지킨다).
-->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
<script src="js/pu-resilience.js"></script>
<script src="js/pu-health.js"></script>
<script src="js/pu-version.js"></script>
<script src="js/pu-paydata-store.js"></script>
<!-- ?v= 는 판독기 판 번호(READ_VERSION)와 **같이 올린다**(2026-08-15).
     ⚠ 사진첩만 올리고 여기를 빠뜨리면, 같은 브라우저 안에서 사진첩은 새 판독기·
       급여데이터함은 캐시에 묵은 옛 판독기로 갈린다 — 같은 서류를 두 앱이 다르게
       읽고, 판독 결과에 적히는 판 번호(rv)도 어긋나 「다시 읽어야 하나」 판정이
       서로 달라진다. tests/photos-doc-title.test.js 가 두 파일을 함께 지킨다. -->
<script src="js/pu-doc-read.js?v=10"></script>
<script src="js/pu-rrn-mask.js?v=1"></script>
<script src="js/pu-appbar.js"></script>
<!-- 로그아웃·사람 바뀜을 모든 프로그램에 퍼뜨린다 (2026-08-16) — 로그인 화면·공개 화면에는 넣지 않는다 -->
<script src="js/pu-authsync.js?v=1"></script>
<!-- 상단 우측에 「지금 로그인한 사람」 (2026-08-16) — 로그인 화면·공개 화면에는 넣지 않는다 -->
<script src="js/pu-whoami.js?v=1"></script>
<style>
:root{--navy:#2E3A8C;--violet:#7C6CE0;--ok:#2E7D4F;--warn:#B26A00;--bad:#C43D3D;
--ink:#23263B;--sub:#6B6F87;--line:#E3E5EF;--paper:#F5F6FA;--card:#FFF;}
*{box-sizing:border-box;margin:0}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--paper);color:var(--ink);font-size:14px}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 18px}
header .brand{font-weight:800;font-size:16px;cursor:pointer}
header .who{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:10px}
header .out{background:#ffffff22;border:1px solid #ffffff66;color:#fff;border-radius:8px;padding:3px 10px;cursor:pointer;font-size:12px;font-family:inherit}
/* ⚠ 가운데 정렬(margin:0 auto)로 두면 **왼쪽 목록 칸과 본문 사이에 빈 자리**가
   뜬다 — 목록에서 고른 사업장이 본문에 나오는데 둘이 멀찍이 떨어져 있어 같은
   화면으로 안 읽힌다(대표 지적 2026-08-17 「좌우가 균형있게」, 그리고 앞선
   「분리된 느낌이다」와 같은 뿌리). 그래서 목록 칸에 **붙인다**.
   최대 폭은 남겨 둔다 — 표가 화면 끝까지 늘어지면 눈이 줄을 놓친다. */
main{flex:1;min-width:0;padding:16px 20px;max-width:1240px;margin:0}
.gate{padding:40px 18px;text-align:center;color:var(--sub)}

/* ── 2중 대시보드 (대표 결정 2026-08-17, 목업 4안+2안) ──
   ① 보기·담당자 칸 ② 사업장 목록 칸 ③ 본문. 사업장이 전용 칸을 가져야
   화면 높이를 통째로 써서 30곳이든 112곳이든 메일함처럼 굴러간다. ── */
#shell{display:flex;align-items:flex-start}
/* 132px 이던 것을 넓혔다 — 「전체 사업장 112」가 겨우 들어가 잘렸고, 담당자
   이름 앞에 번호까지 붙으면 이름이 통째로 사라진다(대표 지시 2026-08-17). */
.viewbar{width:170px;flex:0 0 170px;background:var(--card);border-right:1px solid var(--line);
  min-height:calc(100vh - 49px);position:sticky;top:49px;align-self:flex-start;overflow-y:auto}
#shell.fold .viewbar{display:none}
.colfold{width:15px;flex:0 0 15px;background:var(--card);border-right:1px solid var(--line);
  min-height:calc(100vh - 49px);position:sticky;top:49px;align-self:flex-start;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub);font-size:11px}
.colfold:hover{background:#F5F7FF;color:var(--navy)}
.ctitle{padding:11px 10px 4px;font-size:10.5px;color:var(--sub);font-weight:700}
.vrow{display:flex;align-items:center;gap:5px;padding:7px 10px;font-size:12.5px;cursor:pointer}
.vrow:hover{background:#F5F7FF}
.vrow.sel{background:#E7EBFB}
.vrow.sel b{color:var(--navy)}
.vrow b{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow .n{font-size:10.5px;color:var(--sub);background:var(--paper);border-radius:99px;padding:1px 6px;white-space:nowrap}
.vrow.warn .n{background:#FFF6E6;color:var(--warn)}
.vrow.bad b{color:var(--bad)}
.vrow.bad .n{background:#FDECEC;color:var(--bad)}
/* ── 담당자 줄 (대표 지적 2026-08-17 「맨왼쪽 너무 이상하다」) ──
   예전에는 한 사람이 **세 줄**이었다 — 이름줄 · 진행률 막대 · 「아직 안 들어옴 ·
   아직 N곳」. 아홉 명이면 27줄이라 끝까지 훑으려면 계속 굴려야 했다. 게다가 세 줄이
   같은 말을 되풀이했다 — 0/28 이면 28곳 남은 것이 당연한데 「아직 28곳」을 또 적었고,
   「아직 안 들어옴」은 **전원에게 똑같이** 붙어 알려 주는 것이 없는데 눈만 끌었다.

   그래서 한 사람 = 한 줄로 줄이고, 진행률은 줄 **바탕**에 옅게 깐다 — 0% 면
   아무것도 안 보여 조용하고, 자료가 들어올수록 초록이 길어져 오히려 눈에 띈다.
   안 들어온 사람은 이름을 연하게 두고 그 뜻은 목록 맨 위에 **한 번만** 적는다. */
/* ⚠ 안내는 **한 줄**로 접는다(대표 지시 2026-08-17). 여섯 줄로 펼쳐져 있으면
   담당자 목록이 그만큼 아래로 밀려, 정작 봐야 할 이름이 화면 밖으로 나간다.
   자세한 말은 지우지 않고 title 로 옮긴다 — 마우스를 얹으면 그대로 나온다. */
.pnote{padding:3px 10px 6px;font-size:10.5px;color:var(--sub);line-height:1.5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:help}
.vrow.prow{position:relative}
.vrow.prow .fill{position:absolute;left:0;top:0;bottom:0;background:#EAF6EE;pointer-events:none}
.vrow.prow>b,.vrow.prow>.n,.vrow.prow>.pno{position:relative}
/* 사번 순서대로 붙인 번호(대표 지시 2026-08-17) — 사업장 목록의 .cno 와 같은
   방식이라 「아홉 중 몇 번째」를 눈으로 센다. 사번이 아닌 줄은 「–」다. */
.vrow.prow .pno{flex:0 0 15px;text-align:right;font-size:10px;color:var(--sub);
  font-variant-numeric:tabular-nums}
.vrow.prow.sel .pno{color:var(--navy)}
.vrow.prow.off b{color:#9AA0B4;font-weight:600}
/* 업체관리 담당자 칸이 사번이 아닌 것 — 기다려도 안 풀리므로 「안 들어옴」과
   눈으로 갈라 준다(대표 지시 2026-08-17). */
.vrow.prow.badsid b{color:var(--bad)}
.vrow.prow.badsid .n{background:#FDECEC;color:var(--bad)}
.pnote.badnote{color:#8A1C1C;background:#FDECEC;border-radius:8px;margin:0 8px 6px;padding:5px 7px}

/* ── 서랍 머리·월 줄·폴더찾기 (대표 지시 2026-08-17 「간략하게 정렬」) ──
   여덟 줄이던 것을 네 줄로 줄인다. 자료가 화면 위쪽에서 보여야 한다. */
.btn.sm{padding:4px 9px;font-size:12px}
/* ── 틀고정 (대표 지시 2026-08-17 「KPI와 대시보드 1줄로 정리하고 틀고정」) ──
   머리 줄들을 **한 덩어리**로 묶어 통째로 붙여 둔다. 예전에는 탭·찾기만 따로
   붙어 있어(각자 top 을 손으로 맞춰 둠) 그 위 줄들은 다 따라 올라갔다 —
   마흔 번째 자료를 볼 때 지금 무슨 달·누구 자리인지 알 수가 없었다.
   ⚠ 배경색을 반드시 준다 — 투명하면 목록이 그 밑으로 비쳐 글씨를 덮는다. */
.stickhead{position:sticky;top:49px;z-index:6;background:var(--paper);
  padding-top:2px;border-bottom:1px solid var(--line);margin-bottom:10px}
.dhead{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;margin-bottom:6px}
.dtitle{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  min-width:80px}
.dmeta{font-size:11.5px;color:var(--sub);white-space:nowrap;flex:0 0 auto}
.dacts{margin-left:auto;display:flex;gap:6px;flex-wrap:nowrap;flex:0 0 auto}
/* KPI 상자 셋을 한 줄 숫자로 접은 것 — 「20곳 · 온 0 · 안 온 20」 */
.dkpi{font-size:12px;color:var(--sub);white-space:nowrap;flex:0 0 auto;
  font-variant-numeric:tabular-nums}
.dkpi b{color:var(--ink)}
.dkpi .ok{color:var(--ok);font-weight:800}
.dkpi .wa{color:var(--warn);font-weight:800}
.mstrip{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.mstrip .btn.sm:disabled{opacity:.35;cursor:default}
.mo{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 9px;
  font-size:12px;color:var(--sub);font-family:inherit;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.mo .c{font-size:10.5px;background:var(--paper);border-radius:99px;padding:0 5px;
  font-variant-numeric:tabular-nums}
.mo.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.mo.on .c{background:rgba(255,255,255,.22);color:#fff}
.mo.has .c{background:#EAF6EE;color:var(--ok);font-weight:700}
.mo.zero{color:#A6AAB8}
.foldfind{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.foldfind .foldbar{margin-bottom:0}
.dfind{flex:1;min-width:160px;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:7px 11px;font-size:12.5px;font-family:inherit}
.dfind:focus{outline:none;border-color:var(--navy)}

/* ── 끌어다 놓기 (대표 지시 2026-08-17) ──
   놓는 자리가 곧 이름표다 — 서랍 위면 그 사업장·그 달·그 종류로 바로 담긴다. */
#dropOv{position:fixed;inset:0;z-index:35;display:none;align-items:center;justify-content:center;
  background:rgba(46,58,140,.10);padding:24px}
#dropOv.on{display:flex}
#dropOv .box{background:#fff;border:2px dashed var(--navy);border-radius:16px;padding:26px 32px;
  text-align:center;color:var(--navy);box-shadow:0 14px 40px rgba(20,30,80,.18);max-width:520px}
#dropOv .box b{font-size:16px;display:block;margin-bottom:6px}
#dropOv .box span{font-size:12.5px;line-height:1.75;color:var(--ink);opacity:.8}

/* ② 사업장 목록 칸 — 화면 높이를 통째로 쓴다 */
.colist{width:238px;flex:0 0 238px;background:var(--card);border-right:1px solid var(--line);
  height:calc(100vh - 49px);position:sticky;top:49px;align-self:flex-start;
  display:flex;flex-direction:column;overflow:hidden}
.colist .chead{padding:9px 10px 7px;border-bottom:1px solid var(--line);flex:0 0 auto}
.colist .ct{font-size:12px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.colist .ct .n{font-size:10.5px;font-weight:700;color:var(--sub);background:var(--paper);border-radius:99px;padding:1px 6px}
.colist input{width:100%;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:11.5px;font-family:inherit}
.cochips{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.cochip{font-size:10.5px;border:1px solid var(--line);border-radius:99px;padding:2px 8px;cursor:pointer;
  background:#fff;font-family:inherit;color:var(--sub)}
.cochip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.clist{flex:1;min-height:0;overflow-y:auto}
.crow{display:flex;align-items:center;gap:5px;padding:7px 9px;font-size:12.5px;cursor:pointer;
  border-bottom:1px solid #F2F3F8;color:var(--ink)}
.crow:hover{background:#F5F7FF}
/* 번호 — 대표 요청 2026-08-17 「사업장 번호가 있어야 검토·확인이 쉽다」.
   본문 목록과 같은 번호라 「28곳 중 몇 번째」를 눈으로 셀 수 있다. */
.crow .cno{flex:0 0 20px;text-align:right;font-size:10.5px;color:var(--sub);
  font-variant-numeric:tabular-nums}
/* 지금 열어 놓은 사업장 — 이 표시가 없어서 본문과 목록이 서로 딴 말을 했다 */
.crow.sel{background:#E7EBFB}
.crow.sel .nm{color:var(--navy);font-weight:700}
.crow.sel .cno{color:var(--navy)}
.crow .handle{cursor:grab;color:var(--sub);font-size:11px;flex:0 0 11px;user-select:none}
.crow .dot{width:6px;height:6px;border-radius:99px;background:var(--line);flex:0 0 6px}
.crow .dot.arr{background:var(--ok)}
.crow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .own{font-size:9.5px;color:var(--sub);background:var(--paper);border-radius:99px;padding:1px 5px;
  max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .cnt{font-size:10.5px;color:var(--sub)}
.crow .share{opacity:0;font-size:11px;color:var(--navy);padding:1px 3px;border-radius:5px}
.crow:hover .share{opacity:1}
.crow .share:hover{background:#E7EBFB}
.crow.away .nm{color:var(--sub)}
.crow .tags{font-size:9.5px;color:var(--ok);background:#EAF6EE;border-radius:99px;padding:1px 5px;
  max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cempty{padding:14px 10px;font-size:11.5px;color:var(--sub);line-height:1.6}

/* 고르개(사람 찾기)가 아직 쓰는 빈 목록 안내 */
.pempty{padding:6px 12px 10px 30px;font-size:12px;color:var(--sub)}
.seatbar.shared{background:#EAF6EE;border:1px solid #B7E4C7;color:#1E5631}
.picklist{max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.pickrow{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line)}
.pickrow:last-child{border-bottom:none}
.pickrow:hover{background:#F5F7FF}
.pickrow.on{background:#E7EBFB;font-weight:700;color:var(--navy)}
.taglist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.tagopt{display:flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;cursor:pointer}
.tagopt input{margin:0}
.tagopt.on{border-color:var(--navy);background:#F5F7FF}
.sharedTo{font-size:12px;color:var(--sub);margin-bottom:10px}
@media(max-width:760px){.peoplebar,.viewbar,.colist,.colfold{display:none}}
/* ── 판독 패널 — 원본 옆 절반 (대표 지시 2026-08-13: "화면의 나머지 절반에
   인식된 내용을 정리해서 보여줄 수 있게, 그렇게 해야 정밀하게 찾을 수 있다") ── */
#viewerBody.split{align-items:stretch;justify-content:stretch;padding:0}
#viewerShot{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:0 12px 16px}
#readPanel{flex:0 0 50%;background:#fff;display:flex;flex-direction:column;border-left:1px solid var(--line);color:var(--ink)}
#readPanel .ph{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
#readPanel .ph b{flex:1;font-size:14px}
#readPanel .pbody{flex:1;min-height:0;overflow-y:auto;padding:12px 14px}
#readPanel .pfoot{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center}
#readPanel .pfoot .sub{flex:1;margin:0}
.pre{text-align:center;padding:36px 18px;color:var(--sub)}
.pre .big{font-size:32px;margin-bottom:10px}
.pre p{font-size:12.5px;line-height:1.7;margin-bottom:16px}
/* ── 좁은 화면(폰) — 좌우로 가르지 않고 위아래로 쌓는다 ──
   ⚠ 예전에는 여기서 #viewerShot 을 통째로 감췄다. 그런데 #viewerShot 은 원본
   사진뿐 아니라 「불러오는 중…」·불러오기 실패 안내·PDF·엑셀의 「새 창에서 열기」
   까지 담는 **유일한** 칸이다. 게다가 규칙이 .split 밖에 있어 판독 패널이 아예

function esc(s) {

function jsq(s) {

  const live = new Set(ids || []);
  const s = {};
  Object.keys(sel || {}).forEach(id => { if (live.has(id)) s[id] = true; });
  return s;
}

/* 화면(kind)별로 따로 기억한다 — 사업장 목록에서 고른 것이 다른 목록에 딸려가면 안 된다 */
function pickOf(kind) { App.pick = App.pick || {}; return App.pick[kind] || {}; }
function pickPut(kind, sel) { App.pick = App.pick || {}; App.pick[kind] = sel; }

/* 지금 화면에 보이는 번호들 — 목록마다 실제로 그리는 것과 **같은 식으로** 뽑는다.
   화면에서 값을 미리 받아 두면 안 그린 채 눌렸을 때 낡은 값으로 처리하게 된다. */
function pickVisible(kind) {
  /* ⚠ 본문 목록은 **왼쪽에서 고른 보기**를 따른다(screenSites 머리말) — 여기서도
     같은 모델을 써야 「모두 고르기」가 화면에 안 보이는 것까지 고르지 않는다. */
  if (kind === 'sites') {
    return sideListModel(App.sideView, sideCtx(), {
      q: App.colQuery, filter: App.colFilter, order: App.myOrder
    }).rows.map(r => r.id);
  }
  if (kind === 'pending') return Object.keys(App.pending || {});
  if (kind === 'drawer') {
    const rows = drawerModel(App.itemsKeep, App.itemsMonth, App.companyId, App.kind, Date.now()).rows;
    /* ⚠ 폴더로 거른 것까지 **똑같이** 걸러야 한다. 예전에는 찾기 줄만 걸러서,
       폴더를 골라 세 건만 보고 있는데 「모두 고르기」가 안 보이는 것까지 골랐다.
       한꺼번에 처리하는 단추가 생긴 지금은 안 보이는 자료가 함께 휴지통으로 간다. */
    return searchRows(folderRows(rows, App.folderPick), App.query).map(r => r.id);
  }
  return [];
}
function pickHit(kind, id) { pickPut(kind, pickToggle(pickOf(kind), id)); App.render(); }
function pickToggleAll(kind) {
  const ids = pickVisible(kind);
  pickPut(kind, pickSetAll(pickOf(kind), ids, !pickAllOn(pickOf(kind), ids)));
  App.render();
}
function pickCancel(kind) { pickPut(kind, {}); App.render(); }
window.pickHit = pickHit; window.pickToggleAll = pickToggleAll; window.pickCancel = pickCancel;

/* 골라 둔 개수와 단추를 그리는 띠 — 목록이 늘어도 같은 모양이어야 한다.
   acts 는 **골랐을 때만** 보이는 단추들(HTML)이다. 아무것도 안 골랐으면
   「☐ 를 눌러…」 안내만 뜬다 — 쓸 수 없는 단추를 미리 보여 주지 않는다. */
function pickBar(kind, ids, acts) {
  const sel = pickPrune(pickOf(kind), ids); pickPut(kind, sel);
  const on = pickList(sel, ids);
  const allOn = pickAllOn(sel, ids);
  return '<div class="pkbar">'
    + '<label><input type="checkbox" ' + (allOn ? 'checked' : '')
    + ' onchange="pickToggleAll(\'' + kind + '\')"> 모두 고르기'
    + (ids.length ? ' (' + ids.length + ')' : '') + '</label>'
    + (on.length
      ? '<span class="pkn">' + on.length + '개 골랐습니다</span>' + (acts || '')
        + '<button class="btn pkx" onclick="pickCancel(\'' + kind + '\')">고르기 취소</button>'
      : '<span class="sub" style="margin:0">☐ 를 눌러 여러 곳을 골라 둘 수 있습니다</span>')
    + '</div>';
}

/* ══════ 화면 상태 ══════
   어느 화면인가 · 어느 사업장인가 · 어느 달인가. 자료는 여기 모아 두고 화면이 읽는다. */
const App = {
  screen: 'sites', companyId: '', companyName: '', month: '', kind: 'attend', query: '',
  /* values 는 **null 로 시작한다** — {} 는 「읽었는데 비었다」이고 null 은
     「아직 안 읽었다」다. 둘을 같은 값으로 두면 안 읽은 것을 「값이 없습니다」로
     단정하게 된다(값 표 화면·급여관리 알리기가 이 둘을 갈라 본다). */
  /* companies 는 급여 업체만 걸러 둔 것, allCompanies 는 업체관리 전체다
     (대표 지시 2026-08-17). 화면·고르기는 companies 를, 이름 찾기만 allCompanies 를 쓴다. */
  companies: [], allCompanies: [], pending: {}, arrivals: {}, trash: null, values: null, me: null, pick: {}, myName: '',
  itemsKeep: null, itemsMonth: null, itemsMonthSlot: '',
  viewerId: '', viewerUrl: '', viewerZoom: false, viewerErr: '',
  readState: { status: 'idle', rows: [], err: '' },
  /* 가릴 곳 고르기 — 판독기로 보내기 **전** 단계다(설계서 3장).
     url 은 창고에서 받아 온 원본 data URL 이고, boxes 는 가릴 사각형이다.
     by:'ai' 는 기계가 찾아 미리 칠한 것, by:'me' 는 사람이 그은 것. */
  maskState: { status: 'idle', url: '', boxes: [], err: '', autoNote: '' },
  folders: {}, foldersCompanyId: '', folderPick: 'all', folderEdit: { mode: '', fid: '', value: '' },
  /* 먼 달로 갈 때만 손으로 적는다 — 월 줄(monthStripHtml)이 평소에는 여섯 달을
     눌러서 옮기게 해 준다. 늘 띄워 두면 줄만 먹는다. */
  monthEdit: false,
  /* 남의 자리 보기 — viewingUid 가 비어 있으면 내 자리다.
     viewingDeputy 는 그 자리를 대리로 맡고 있는지(수정 가능한지)다. */
  viewingUid: '', viewingName: '', viewingDeputy: false, viewingAdmin: false,
  staffOpen: false, staffQuery: '', staffList: [], reasonPrompt: null,
  deputies: {},
  /* 대기 칸에서 **사람이 직접 고친** 이름표만 담는다(pendTagOf 머리말).
     짐작값은 여기 안 들어온다 — 안 그러면 파일 이름을 못 알아본 것과
     사람이 일부러 비운 것을 가릴 수 없다. */
  pendTag: {},

  /* ── 2중 대시보드(대표 결정 2026-08-17, 목업 4안+2안) ──
     owners·shares·myOrder·dir 는 로그인 뒤 loadSites()가 채운다.
     dir 는 공개 명부(data/user_dir) — 사번을 사람 이름으로 바꾸는 데만 쓴다.
     sideView 는 지금 고른 보기('mine'|'late'|'today'|'shared'|'all'|'alllate'|
     'noman'|'p:<사번>'), colFilter 는 상태 칩, colQuery 는 사업장 찾기,
     sideFold 는 첫 칸 접기다.
     sideReason 은 다른 담당자의 업체를 실제로 열 때만 뜨는 사유 프롬프트,
     shareCtx 는 공유하기(사람 고르기 → 공유사항 체크) 진행 상태,
     sharedBanner 는 "공유받음" 항목을 열었을 때 뜨는 초록 띠다. */
  owners: {}, shares: {}, myOrder: [], dir: null,
  sideView: 'mine', colFilter: 'all', colQuery: '', sideFold: false,
  sideReason: null, shareCtx: null, sharedBanner: null,

  go(screen, o) {
    // 사업장을 바꿔 들어가면 남의 폴더가 골라진 채로 남지 않게 되돌린다 —
    // 폴더 번호는 사업장마다 따로다(다른 사업장 폴더 번호와 우연히 같을 수 있다).
    if (o && o.companyId && o.companyId !== App.companyId) o = Object.assign({ folderPick: 'all' }, o);
    /* 사업장이나 기준 월이 바뀌면 들고 있던 값을 **버린다**(다시 읽게 한다).
       값은 「이 사업장 이 달」 것이라 업체·월이 바뀌면 통째로 남의 것이 된다.
       안 버리면 앞 업체 근로자 이름이 이 업체 제목 밑에 그대로 뜨고, 그 화면에서
       엑셀로 내려받으면 이 업체 이름을 단 파일에 남의 이름이 담긴다. */
    if (o && ((o.companyId && o.companyId !== App.companyId)
      || (o.month && o.month !== App.month))) App.values = null;
    Object.assign(App, o || {});
    App.screen = screen;
    if (screen === 'drawer') { ensureDrawerData(); ensureFolders(); }
    if (screen === 'trash') ensureTrash();
    if (screen === 'values') ensureValues();
    if (screen === 'deputy') { ensureDeputies(); loadDeputyScreen(); }
    App.render();
  },

  logout() { firebase.auth().signOut().then(() => location.reload()); },

  render() {
    const m = $('main');
    const sh = $('shell');
    const keep = focusSnapshot();
    /* ⚠ 사업장 목록과 서랍은 자리 띠를 **스스로** 붙어 있는 머리 안에 넣는다
       (대표 지시 2026-08-17 「틀고정」) — 여기서 또 붙이면 띠가 두 번 나온다. */
    const banner = bannerHtml();
    if (App.screen === 'sites') { m.innerHTML = screenSites(); }
    else if (App.screen === 'pending') { m.innerHTML = banner + screenPending(); }
    else if (App.screen === 'drawer') { m.innerHTML = screenDrawer(); }
    else if (App.screen === 'values') { m.innerHTML = banner + screenValues(); }
    else if (App.screen === 'trash') { m.innerHTML = banner + screenTrash(); }
    else if (App.screen === 'deputy') { m.innerHTML = screenDeputy(); }
    else { m.innerHTML = '<div class="card"><div class="empty">아직 만들지 않은 화면입니다.</div></div>'; }
    m.innerHTML += staffPickerHtml() + sideReasonHtml() + shareModalHtml();
    /* 2중 대시보드 — 첫 칸(보기·담당자)과 둘째 칸(사업장 목록).
       접었으면 첫 칸은 CSS 로 숨기고 단추 방향만 뒤집는다. */
    const vb = $('viewbar'); if (vb) vb.innerHTML = App.sideFold ? '' : viewBarHtml();
    const cl = $('colist'); if (cl) cl.innerHTML = colListHtml();
    const fb = $('colfold'); if (fb) fb.textContent = App.sideFold ? '›' : '‹';
    if (sh) sh.classList.toggle('fold', !!App.sideFold);
    renderViewer();
    restoreFocus(keep);
  }
};

/* ── 다시 그려도 치던 자리를 잃지 않게 ──
   이 화면은 무엇이 바뀌면 화면을 통째로 다시 그린다(innerHTML). 그러면 지금
   글자를 치고 있던 칸이 **새로 만들어져** 커서가 빠진다 — 찾기 줄에 한 글자를
   치면 두 글자째가 아무 데도 안 들어갔다(파일 이름 찾기·왼쪽 사람 찾기·담당자
   고르기·공유할 사람 찾기 네 곳 모두).
   그래서 다시 그리기 **전에** 어느 칸에 커서가 어디까지 가 있었는지 적어 두고,
   다 그린 **뒤에** 같은 칸이 다시 있으면 그 자리로 돌려놓는다.
   ⚠ 칸에 id 가 있어야 되찾을 수 있다 — 찾기 줄들에 id 를 붙여 둔 까닭이다.
   ⚠ 이미 그 칸에 커서가 있으면 손대지 않는다 — 괜히 건드리면 폰에서 자판이
     다시 올라오거나 고르고 있던 글자가 풀린다. */
function focusSnapshot() {
  const el = document.activeElement;
  if (!el || !el.id) return null;
  if (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA') return null;
  let start = null, end = null;
  try { start = el.selectionStart; end = el.selectionEnd; } catch (_) { /* 날짜 칸 등은 못 읽는다 */ }
  return { id: el.id, start: start, end: end };
}

function restoreFocus(snap) {
  if (!snap) return;
  const el = $(snap.id);
  if (!el || el === document.activeElement) return;
  el.focus();
  if (snap.start == null) return;
  try { el.setSelectionRange(snap.start, snap.end); } catch (_) { /* 커서 자리를 못 옮기는 칸도 있다 */ }
}
window.App = App;

/* ══════ 시작 ══════ */
firebase.initializeApp(FIREBASE_CONFIG);
try { if (firebase.appCheck) firebase.appCheck().activate(new firebase.appCheck.ReCaptchaV3Provider(FB_APPCHECK_KEY), true); }
catch (e) { console.warn('[AppCheck]', e && e.message); }

db = firebase.database();
try { store = firebase.storage(); } catch (e) { store = null; }

firebase.auth().onAuthStateChanged(function (user) {
  if (user) { App.me = user; afterLogin(); return; }
  /* 로그인은 통합 포털 한 곳에서만 한다 — 앱마다 두면 계정 문제를 앱 수만큼 겪는다. */
  if (!/[?&]login=1/.test(location.search) && location.protocol !== 'file:') {
    location.replace('enter.html?v=' + Math.floor(Date.now() / 600000));
    return;
  }
  $('gate').textContent = '포털(enter.html)에서 로그인해 주세요.';
});

function afterLogin() {
  /* 저장 층에 계정을 알려 준다 — 자리 계산이 이걸로 된다. */
  S.init({ db: db, storage: store, uid: App.me.uid, name: App.me.email || '' });
  $('whoami').textContent = App.me.email || '';

  /* 권한은 나중에 알려 줘도 된다 — 못 읽어도 화면은 떠야 한다.
     fin(재무권한)도 함께 읽는다 — 급여관리로 "이 달 값 넘기기" 단추가
     이 값으로 갈린다(canHandoffPayroll, 4차). */
  db.ref('uid_roles/' + App.me.uid).once('value')
    .then(s => { const r = s.val() || {}; S.init({ isAdmin: !!r.isAdmin, isFin: !!r.fin }); App.render(); })
    .catch(e => console.warn('[권한]', e && e.code));

  /* 서류 판독 — **열쇠는 서버가 든다**(2026-08-17). 브라우저는 사진만 보내고 결과만 받는다.
     ⚠ auth 를 넘겨야 서버가 「누가 부르는지」를 확인한다. 안 넘기면 옛 길
       (브라우저가 열쇠를 들고 직접 부르기)로 조용히 돌아가 고침이 무용지물이 된다. */
  PuDocRead.init(Object.assign(
    { fetch: window.fetch.bind(window) },
    PuDocRead.keysFrom(db, { auth: firebase.auth() })
  ));

  /* 이름을 찾아 화면·명단에 반영한다 — 남이 나를 「이름으로」 고르려면
     내가 먼저 한 번 로그인해야 한다(명단에 내가 적힌다). */
  S.signIn(App.me.email || '', App.me.email || '').then(name => {
    if (name) { App.myName = name; $('whoami').textContent = name; App.render(); }
  }).catch(e => console.warn('[이름 찾기]', e && e.message));

  $('gate').style.display = 'none';
  $('shell').style.display = '';
  loadSites();
  takeShared();   // 카톡·갤러리에서 공유해 들어온 자료가 있으면 대기 칸으로
  dropWatch();    // 파일을 창 안으로 끌어다 놓으면 담는다(놓는 자리가 곧 이름표)
}

/* ── 늦게 온 답 버리기 ──
   자리를 옮기면(남의 자리 보기 → 내 자리로) 캐시는 그 자리에서 비우지만, 이미
   보낸 읽기 요청은 **취소되지 않는다.** 그 답이 뒤늦게 도착해 화면에 그려지면
   「내 자리」라고 적힌 화면에 남의 서류가 뜬다 — 화면만 보고는 알 길이 없다.
   그래서 부르기 전에 지금 자리를 적어 두고, 답이 왔을 때 자리가 달라졌으면 버린다
   (값 층 ensureValues 가 사업장으로 하는 것과 같은 방식). */
function seatNow() { return App.viewingUid; }
function seatSame(seat) { return App.viewingUid === seat; }

/* 첫 화면 자료를 읽어 온다. 한쪽이 실패해도 화면은 뜬다 —
   빈 화면에 「권한 거부」만 남으면 무엇을 해야 할지 알 수 없다. */
function loadSites() {
  const seat = seatNow();
  Promise.all([
    S.listCompanies().catch(e => { console.warn('[업체관리]', e && e.code); return []; }),
    S.listMyPending(seat).catch(e => { console.warn('[대기 칸]', e && e.code); return {}; }),
    S.listArrivals().catch(e => { console.warn('[도착 칸]', e && e.code); return {}; }),
    S.listOwners().catch(e => { console.warn('[담당자 명단]', e && e.code); return {}; }),
    /* 공개 명부 — 사번을 사람 이름으로 바꾸는 데만 쓴다(대표 지시 2026-08-17:
       담당자를 업체관리에서 뽑는다). 못 읽어도 사번으로 세우니 막지 않는다. */
    S.listUserDir().catch(e => { console.warn('[공개 명부]', e && e.code); return null; })
  ]).then(([companies, pending, arrivals, owners, dir]) => {
    if (!seatSame(seat)) return;   // 그 사이 자리를 옮겼다 — 이 답은 버린다
    /* 급여데이터함은 **급여 아웃소싱 하는 사업장**만 다룬다(대표 지시 2026-08-17).
       걸러낸 뒤 것을 App.companies 에 담아, 좌측 대시보드·사업장 목록·「담기」의
       업체 고르기가 모두 같은 명단을 쓰게 한다. 전체 명단(allCompanies)은
       이미 담긴 자료의 업체 **이름을 찾는 데만** 쓴다 — 유형이 급여가 아닌 곳에
       담긴 자료가 번호만 덩그러니 남으면 지워진 업체로 오해한다. */
    App.allCompanies = companies;
    App.companies = S.payrollCompanies(companies);
    App.pending = pending;
    App.arrivals = arrivals;
    App.owners = owners;
    App.dir = dir;
    const myUid = (App.me && App.me.uid) || '';
    App.myOrder = (owners[myUid] && owners[myUid].order) || [];
    App.render();
  });
  refreshShares();
}

/* 도착 칸만 다시 읽는다 — 업체·귀속월·종류·장수만 담긴 얇은 칸이라 가볍다.
   서랍에 넣거나 휴지통에 버리거나 되살린 **뒤에** 부른다. 안 부르면 방금 넣은
   자료가 사업장 목록에서는 「미도착 0장」으로 남아, 사람이 안 들어간 줄 안다.
   도착 칸은 자리와 상관없이 전 직원이 함께 보는 칸이라 자리 검사가 필요 없다. */
function refreshArrivals() {
  return S.listArrivals().then(a => { App.arrivals = a; App.render(); })
    .catch(e => console.warn('[도착 칸]', e && e.code));
}
window.refreshArrivals = refreshArrivals;

function refreshShares() {
  // 공유받음은 나(로그인 계정)에게 온 것만 있으면 된다 — 자리(viewingUid)와 무관하다.
  const myUid = (App.me && App.me.uid) || '';
  if (myUid) {
    S.listShares(myUid).then(shares => { App.shares = shares; App.render(); })
      .catch(e => console.warn('[공유받음]', e && e.code));
  }
}

/* ── 첫 화면 계산 ──
   화면 그리기와 갈라 둔다 — 계산만 따로 검사할 수 있어야 한다.

   ⚠ 장수는 **도착 칸**에서 센다(그 업체·그 달에 몇 장 왔나). 내 자리 목록을 세지
   않는 까닭은 두 가지다. ① 첫 화면에서 사람마다 자리를 다 열면 느리다.
   ② 남이 담은 장수까지 세면 권한 경계가 첫 화면에서 새어 나간다.
   도착 칸에는 업체·귀속월·종류·장수만 있고 누가 담았는지는 없다.

   근로계약서는 월과 무관한 keep 칸에 있으므로 **그 칸도 함께** 센다 —
   안 세면 계약서만 있는 업체가 「0장」으로 보인다. */
/* 근로계약서(keep 칸, 월 무관) + 이 달 칸을 합쳐 센다 — 안 그러면 계약서만
   있는 업체가 「0장」으로 보인다. 첫 화면(sitesModel)과 사람별 대시보드가
   똑같이 쓴다 — 두 곳이 서로 다른 수를 보이면 안 된다. */
function companyDocCount(node, slot) {
  let n = 0;
  S.KINDS.forEach(k => {
    n += S.arrivalCount(node[S.KEEP], k.key);
    if (slot) n += S.arrivalCount(node[slot], k.key);
  });
  return n;
}

/* companies 는 **급여 업체만** 걸러 온 명단이고, allCompanies 는 업체관리 전체다
   (대표 지시 2026-08-17). 자료는 왔는데 급여 명단에 없는 업체는 두 갈래로 나뉜다.
     offType  — 업체관리에는 있는데 유형이 급여가 아니거나 중단·종료된 곳. 이름을 안다.
     unlisted — 업체관리에서 아예 못 찾은 번호. 예전부터 있던 칸이다.
   섞어 놓으면 「지워진 업체」로 잘못 읽는다 — 자료는 멀쩡히 있는데 말이다. */
function sitesModel(companies, pending, arrivals, month, now, myEmail, allCompanies) {
  const slot = S.monthKey(month);
  const pend = pending || {};
  const arr = arrivals || {};
  const pendIds = Object.keys(pend);
  const rows = (companies || []).map(c => {
    const node = arr[c.id] || {};
    const count = companyDocCount(node, slot);
    // 업체는 푸른이알피에서 당겨온다(대표 지시 2026-08-13) — 담당자 매칭도
    // 이알피가 쓰는 것과 같은 칸(managerMain·managerSubs)으로 한다.
    return { id: c.id, name: c.name, arrived: count > 0, count: count, mine: S.isMyCompany(c, myEmail) };
  });
  const known = {};
  (companies || []).forEach(c => { known[c.id] = true; });
  const nameOf = {};
  (allCompanies || []).forEach(c => { nameOf[c.id] = c.name; });

  const leftover = Object.keys(arr).filter(id => !known[id]).map(id => {
    let n = 0;
    Object.keys(arr[id] || {}).forEach(sl => {
      S.KINDS.forEach(k => { n += S.arrivalCount(arr[id][sl], k.key); });
    });
    return { id: id, name: nameOf[id] || id, count: n, named: !!nameOf[id] };
  }).filter(r => r.count > 0);   // 빈 칸만 남은 번호까지 알릴 것은 없다

  return {
    pendingCount: pendIds.length,
    staleCount: pendIds.filter(id => S.isStalePending(pend[id], now)).length,
    rows: rows,
    offType: leftover.filter(r => r.named),
    unlisted: leftover.filter(r => !r.named)
  };
}

/* ══════ 2중 대시보드 — 보기 칸 + 사업장 칸 (대표 결정 2026-08-17, 목업 4안+2안) ══════
   설계서: docs/superpowers/specs/2026-08-17-급여데이터함-2중대시보드-design.md

   왜 바꿨나 — 사람 트리 하나에 업체를 딸려 넣으니, 한 사람(20~33곳)만 펼쳐도
   화면이 두 배가 됐다. 사업장에 **전용 칸**을 주면 화면 높이를 통째로 써서
   메일함처럼 굴러간다. 그리고 첫 칸을 「사람」이 아니라 「보기」로 두어야
   담당자도 쓸 것이 생긴다 — 담당자에게 사람 칸은 자기 이름 한 줄뿐이다. */

/* 이 업체에 마지막으로 자료가 들어온 시각. 계약서(keep 칸)는 월과 무관하므로
   함께 본다 — 오늘 계약서만 온 업체가 「오늘 들어온 것」에서 빠지면 안 된다. */
function coArrivedAt(node, slot) {
  const n = node || {};
  let t = Number((n[S.KEEP] || {}).last || 0);
  if (slot) t = Math.max(t, Number((n[slot] || {}).last || 0));
  return t;
}

/* 첫 칸 — 「내 일」 보기 넷은 모두에게, 「전체」 셋과 담당자 명단은 관리자에게만.
   담당자는 자기 것만 본다(대표 지시 2026-08-17) — 남의 이름이 목록을 채우면
   정작 자기 업체를 못 찾는다. */
function sideViewModel(ctx) {
  const slot = S.monthKey(ctx.month);
  const arr = ctx.arrivals || {};
  const cos = ctx.companies || [];
  const roster = S.managerRoster(cos, ctx.dir, ctx.owners);
  const cnt = c => companyDocCount(arr[c.id] || {}, slot);
  const mine = cos.filter(c => S.isMyCompany(c, ctx.myEmail));

  const views = [
    { key: 'mine', label: '내 담당', n: mine.length },
    { key: 'late', label: '아직 안 온 곳', n: mine.filter(c => cnt(c) === 0).length, warn: true },
    { key: 'today', label: '오늘 들어온 것',
      n: mine.filter(c => coArrivedAt(arr[c.id], slot) >= ctx.todayStart).length },
    { key: 'shared', label: '공유받음', n: Object.keys(ctx.shares || {}).length }
  ];
  if (ctx.isAdmin) {
    views.push({ key: 'all', label: '전체 사업장', n: cos.length });
    views.push({ key: 'alllate', label: '전체 미도착', n: cos.filter(c => cnt(c) === 0).length, warn: true });
    views.push({ key: 'noman', label: '담당 없음', n: roster.unassigned.length, bad: true });
  }

  /* 담당자 줄의 진행률(목업 2안) — 관리자가 **누가 밀렸는지** 첫 칸에서 바로
     본다. 지금은 알 길이 없는 정보다. left(아직 몇 곳)가 곧 재촉할 수다. */
  /* 번호는 **사번 순으로 매긴다**(대표 지시 2026-08-17). 명단이 이미 사번 순으로
     오므로 여기서는 세기만 한다. 사번이 아닌 줄은 번호를 안 받고 「–」다 —
     번호를 주면 멀쩡한 담당자처럼 보여 고쳐야 할 것이 묻힌다. */
  let pno = 0;
  const people = ctx.isAdmin ? roster.people.map(p => {
    const total = p.companies.length;
    const done = p.companies.filter(c => cnt(c) > 0).length;
    return { sid: p.sid, uid: p.uid, name: p.name, away: p.away, badSid: p.badSid,
      no: p.badSid ? '–' : String(++pno),
      total: total, done: done, left: total - done,
      pct: total ? Math.round(done / total * 100) : 0 };
  }) : [];

  return { views: views, people: people, unassigned: roster.unassigned };
}

/* 둘째 칸 — 지금 고른 보기의 사업장 목록. view 는 보기 열쇠말이거나
   'p:<사번>'(관리자가 사람 줄을 눌렀을 때)이다. */
function sideListModel(view, ctx, opt) {
  opt = opt || {};
  const slot = S.monthKey(ctx.month);
  const arr = ctx.arrivals || {};
  const cos = ctx.companies || [];
  const roster = S.managerRoster(cos, ctx.dir, ctx.owners);
  const cnt = c => companyDocCount(arr[c.id] || {}, slot);
  const isMine = c => S.isMyCompany(c, ctx.myEmail);

  /* 업체마다 담당자 이름(보여 줄 것)과 **주담당의 uid**(그 사람 자리를 열 때
     쓸 것)를 챙긴다. uid 가 없으면 그 사람은 급여데이터함에 들어온 적이 없어
     자리 자체가 없다 — 눌러도 안내만 띄운다. */
  const ownerOf = {}, mainOf = {};
  roster.people.forEach(p => p.companies.forEach(c => {
    ownerOf[c.id] = ownerOf[c.id] ? ownerOf[c.id] + ', ' + p.name : p.name;
    if (String(c.managerMain || '') === p.sid) mainOf[c.id] = p;
  }));

  /* 관리자가 아니면 자기 것 말고는 못 본다. 화면에 단추를 안 그려도 앞서 고른
     보기가 상태에 남아 있을 수 있으니 **계산 층에서 한 번 더** 막는다. */
  let v = String(view || 'mine');
  const adminOnly = { all: 1, alllate: 1, noman: 1 };
  if (!ctx.isAdmin && (adminOnly[v] || v.indexOf('p:') === 0)) v = 'mine';

  let list = [], title = '내 담당 사업장', canOrder = false, showOwner = false;
  if (v === 'mine') { list = cos.filter(isMine); canOrder = true; }
  else if (v === 'late') { list = cos.filter(c => isMine(c) && cnt(c) === 0); title = '아직 안 온 곳'; }
  else if (v === 'today') {
    list = cos.filter(c => isMine(c) && coArrivedAt(arr[c.id], slot) >= ctx.todayStart);
    title = '오늘 들어온 것';
  } else if (v === 'shared') {
    title = '공유받음';
    // 공유는 업체 줄이 아니라 「누가 무엇을 왜」가 붙은 줄이다
    const sh = ctx.shares || {};
    const rows = Object.keys(sh).map(id => Object.assign({ shareId: id }, sh[id]))
      .sort((a, b) => Number(b.at || 0) - Number(a.at || 0))
      .map(s => ({ id: s.companyId || '', name: s.companyName || '', shareId: s.shareId,
        owner: s.byName || '', tags: s.tags || [],
        arrived: cnt({ id: s.companyId }) > 0, count: cnt({ id: s.companyId }) }));
    return { view: v, title: title, rows: rows, canOrder: false, showOwner: true,
      isShared: true, counts: { all: rows.length, yes: 0, no: 0 } };
  } else if (v === 'all') { list = cos.slice(); title = '급여 사업장 전체'; showOwner = true; }
  else if (v === 'alllate') { list = cos.filter(c => cnt(c) === 0); title = '전체 미도착'; showOwner = true; }
  else if (v === 'noman') { list = roster.unassigned.slice(); title = '담당 없음'; }
  else if (v.indexOf('p:') === 0) {
    const sid = v.slice(2);
    const who = roster.people.filter(p => p.sid === sid)[0];
    list = who ? who.companies.slice() : [];
    title = (who ? who.name : sid) + ' 담당';
  } else { v = 'mine'; list = cos.filter(isMine); canOrder = true; }

  let rows = list.map(c => {
    const mainP = mainOf[c.id] || null;
    return { id: c.id, name: c.name, arrived: cnt(c) > 0, count: cnt(c),
      owner: ownerOf[c.id] || '', mine: isMine(c),
      ownerUid: mainP ? mainP.uid : '', ownerName: mainP ? mainP.name : '' };
  });

  const counts = { all: rows.length,
    yes: rows.filter(r => r.arrived).length, no: rows.filter(r => !r.arrived).length };

  const f = opt.filter || 'all';
  if (f === 'yes') rows = rows.filter(r => r.arrived);
  else if (f === 'no') rows = rows.filter(r => !r.arrived);

  /* 찾기 — 사업장 이름으로. 담당자가 붙는 목록(전체·미도착)에서는 **사람 이름으로도**
     찾힌다(대표 결정 2026-08-17 "사람·업체 둘 다"). 「화담원」을 치면 그 업체가,
     「박노무」를 치면 그 사람 업체가 나온다. */
  const q = String(opt.q || '').trim().toLowerCase();
  if (q) {
    rows = rows.filter(r => String(r.name).toLowerCase().indexOf(q) >= 0
      || (showOwner && String(r.owner).toLowerCase().indexOf(q) >= 0));
  }

  /* 내가 끌어 놓은 순서가 있으면 그것이 이긴다 — 없으면 자료 온 곳 먼저
     (대표 결정). 순서를 정해 뒀는데 자료 하나 들어올 때마다 자리가 흐트러지면
     애써 끌어 놓은 뜻이 없다. */
  if (canOrder && (opt.order || []).length) rows = S.applyOrder(rows, opt.order);
  else rows.sort((a, b) => (b.arrived ? 1 : 0) - (a.arrived ? 1 : 0));

  return { view: v, title: title, rows: rows, canOrder: canOrder, showOwner: showOwner,
    isShared: false, counts: counts };
}



function screenSites() {
  if (!App.month) App.month = thisMonth();
  const myEmail = (App.me && App.me.email) || '';
  const m = sitesModel(App.companies, App.pending, App.arrivals, App.month, Date.now(), myEmail, App.allCompanies);
  let h = '';

  /* 미정 띠 — 맨 위에 늘 있다. 사업장을 안 고른 자료는 어느 서랍에도 없어서,
     여기 없으면 영원히 안 보인다. */
  if (m.pendingCount) {
    h += '<div class="warnbar" onclick="App.go(\'pending\')">'
      + '<b>미정 ' + m.pendingCount + '건</b>'
      + (m.staleCount ? '<span>3일 넘은 것 ' + m.staleCount + '건</span>' : '')
      + '<span style="margin-left:auto">사업장·귀속월을 채워 주세요 →</span></div>';
  }

  /* ══════ 본문은 **왼쪽에서 고른 보기**를 그대로 따른다 (대표 지적 2026-08-17) ══════
     예전에는 왼쪽 칸이 「김보람 담당 28곳」을 보여 주는데 본문은 「사업장 전체
     112곳」을 그렸다. 이름도 번호도 서로 달라 대조가 안 됐고, 대표 말대로
     「분리된 느낌」이었다. 이제 목록 하나를 두 곳이 나눠 그린다 —
     **같은 보기 · 같은 차례 · 같은 번호.** 찾기 줄과 상태 칩도 함께 걸린다.

     ⚠ 여기서 따로 세거나 따로 거르면 두 곳이 또 다른 말을 한다. 반드시
     colListHtml 과 **똑같은 인자**로 부른다. */
  const v = sideListModel(App.sideView, sideCtx(), {
    q: App.colQuery, filter: App.colFilter, order: App.myOrder
  });

  /* ── 이 달 현황 (대표 결정 2026-08-17, 목업 E안) ──
     첫 화면을 열었을 때 사람이 하려는 일은 「무슨 일이 있나 보기」다. 그런데 그
     자리에 이름만 112줄 있으니 아무것도 안 보였다. 목록 위에 숫자를 얹는다.
     ⚠ 지금 **보고 있는 보기** 기준이다 — 김보람을 골랐으면 28곳이 기준이다. */
  /* ── 머리 한 줄 + 틀고정 (대표 지시 2026-08-17 「KPI와 대시보드 1줄로 정리하고
     틀고정」) ── 예전에는 상자 셋(KPI) · 제목 · 설명 두 줄 · 기준 월 줄로 여섯
     줄을 먹어, 자료가 일곱째 줄에서야 시작했다. 게다가 머리가 통째로 따라
     올라가 마흔 번째 업체를 볼 때 무슨 달을 보는지 알 수 없었다.
     ⚠ 설명은 **지우지 않고** 제목의 title 로 옮긴다 — 처음 쓰는 사람에게는
     여전히 필요한 말이다. */
  const arrived = v.rows.filter(r => r.arrived).length;
  const tip = (App.sideView === 'all' || App.sideView === 'alllate'
    ? '업체관리에서 유형이 「급여」인 곳 · 계약중단·종료한 업체는 뺐습니다. ' : '')
    + '장수는 그 업체에 온 자료 전체입니다. '
    + (App.colQuery || App.colFilter !== 'all'
      ? '왼쪽 칸에서 걸러 둔 것이 여기에도 걸려 있습니다.'
      : '골라서 한꺼번에 처리할 때 여기서 합니다 — 한 곳만 열어 볼 때는 왼쪽 목록이 빠릅니다.');

  /* 월 줄이 셀 사업장 — 지금 보고 있는 목록 그대로다. 따로 세면 첫 칸 숫자와
     월 줄이 또 다른 말을 한다. */
  App.monthIds = v.rows.map(r => r.id);

  h += '<div class="stickhead">' + bannerHtml()
    + '<div class="dhead">'
    /* 제목도 왼쪽 칸과 **같은 말**이어야 한다 — 왼쪽이 「김보람 담당」이면 여기도
       그렇다. 예전에는 늘 「사업장 전체」라 적혀 있어 무엇을 보는지 어긋났다. */
    + '<b class="dtitle" title="' + esc(tip) + '">' + esc(v.title) + '</b>'
    + '<span class="dkpi"><b>' + v.rows.length + '</b>곳 · 온 <b class="ok">' + arrived
    + '</b> · 안 온 <b class="wa">' + (v.rows.length - arrived) + '</b></span>'
    + '<span class="dacts">'
    + '<button class="btn sm" onclick="App.go(\'pending\')">📥 대기 칸</button>'
    + '<button class="btn sm" onclick="App.go(\'trash\')">🗑 휴지통</button>'
    + '</span></div>'
    /* 달을 고르는 데는 **한 곳**이다(대표 지시 2026-08-17 「캘린더 하나만」).
       예전에는 여기에 적는 칸이, 서랍에는 월 줄이 따로 있어 같은 값을 두 가지로
       만졌다. 먼 달로 갈 때는 월 줄의 「직접 적기」가 옛 적는 칸을 대신한다. */
    + monthStripHtml()
    + '</div>';

  /* 넘버링 + ㅁ 체크로 골라 둘 수 있다(대표 지시 2026-08-10 명함첩 · 2026-08-13
     급여데이터함에도 적용 — 앞으로 만드는 목록에도 항상 이 방식을 쓴다).

  const siteIds = v.rows.map(r => r.id);

  h += '<div class="card">';

    h += v.rows.length

    h += pickBar('sites', siteIds,

    const siteSel = pickOf('sites');
    h += v.rows.map((r, i) =>

         불러 **내 자리**의 서랍을 열었다 — 남의 담당 업체를 그렇게 열면 그 사람
         자리에 있는 자료가 안 보이는데도 「0건」이라 적혀, 자료가 없는 것으로

  } else {
    /* 빈 까닭을 갈라 말한다 — 「명단을 못 읽었다」와 「이 보기에 없다」는 다르다. */

            : '해당하는 사업장이 없습니다.')))
      + '</div>';
  }
  h += '</div>';

  /* 급여 업체가 아닌 곳에 담긴 자료 — 유형이 자문·노조·기금이거나 중단·종료된 업체다.
     위 목록에서 뺐다고 자료까지 없앤 것이 아니다(대표 지시 2026-08-17). 여기에

      + '<div class="card">' + m.offType.map(u =>

        + '<span class="sub" style="margin:0">' + u.count + '장</span></div>').join('') + '</div>';
  }

  /* 명단에 없는 업체 — 자료는 왔는데 업체관리에 없다. 숨기면 그 업체가 빠진 줄도 모른다.
     ⚠ 도착 칸에는 업체 **번호**만 있고 이름이 없다(전 직원이 읽는 칸이라 얇게 뒀다).
     그래서 여기는 번호로 보인다 — 업체관리에서 지워진 업체이거나, 업체를 고른 뒤
     명단에서 빠진 경우다. 이름을 알려면 그 자리에 담은 사람의 서랍을 봐야 한다. */
  if (m.unlisted.length) {
    h += '<h1 style="font-size:15px;margin-top:20px">업체관리에서 못 찾은 번호'
      + ' <span class="sub" style="margin:0;font-weight:400">' + m.unlisted.length + '곳</span></h1>'
      + '<div class="sub">자료는 와 있는데 업체관리 명단에 그 업체가 없습니다.'
      + ' 지워졌거나 이름이 바뀐 것일 수 있습니다 — 업체관리에서 확인해 주세요.</div>'
      + '<div class="card">' + m.unlisted.map(u =>
        '<div class="row"><span style="flex:1;font-family:monospace">' + esc(u.id) + '</span>'
        + '<span class="sub" style="margin:0">' + u.count + '장</span></div>').join('') + '</div>';

  return h;
}

/* ══════ 골라서 한꺼번에 — 사업장 목록 (대표 승인 2026-08-15) ══════
   지금 화면에 그려진 것과 **같은 식으로** 다시 뽑는다 — 미리 받아 두면
   기준 월을 바꾼 뒤 눌렀을 때 낡은 숫자가 나간다(pickVisible 과 같은 원칙). */
function selectedSiteRows() {
  /* 본문 목록과 **같은 모델**을 쓴다 — 다르게 세면 「이름 복사」가 화면에 없던
     사업장을 뱉는다(screenSites 머리말과 같은 까닭). */
  const v = sideListModel(App.sideView, sideCtx(), {
    q: App.colQuery, filter: App.colFilter, order: App.myOrder
  });
  const sel = pickOf('sites');
  return v.rows.filter(r => pickOn(sel, r.id));
}

/* 고른 업체 이름만 복사한다 — 자료 안 온 곳을 카톡·메일로 챙길 때 그대로 붙여넣는다. */
function copySiteNames() {
  const rows = selectedSiteRows();
  if (!rows.length) return;
  const text = rows.map(r => r.name).join('\n');
  navigator.clipboard.writeText(text).then(
    () => alert(rows.length + '곳의 이름을 복사했습니다.'),
    () => alert(text));     // 복사가 막힌 브라우저에서는 눈으로 옮길 수 있게 보여준다
}
window.copySiteNames = copySiteNames;

/* 고른 업체의 그 달 도착 현황을 엑셀로. 「누가 아직 안 보냈나」를 그대로 넘긴다. */
function downloadArrivalCsv() {
  const rows = selectedSiteRows();
  if (!rows.length) return;
  const lines = [csvEsc(App.month + ' 도착 현황')]
    .concat([['업체명', '도착', '장수'].map(csvEsc).join(',')])
    .concat(rows.map(r => [r.name, r.arrived ? '도착' : '미도착', String(r.count)].map(csvEsc).join(',')));
  const name = ('도착현황_' + App.month).replace(/[\\/:*?"<>|\s]+/g, '_');
  /* ﻿ 는 BOM — 없으면 엑셀이 한글을 깨뜨린다(값 표 내려받기와 같은 방식) */
  saveBlob(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }), name + '.csv');
}
window.downloadArrivalCsv = downloadArrivalCsv;

/* 파일 이름에서 이름표를 짐작한다. 빈칸으로 두면 아무도 안 채운다. 그렇다고
   아무거나 골라 넣으면 틀린 서랍에 들어가고 아무도 모른다 — 못 알아본 것은 빈칸으로 남긴다. */
function guessTag(rec, companies) {
  const text = String((rec && rec.filename) || '') + ' ' + String((rec && rec.note) || '');
  const hit = S.matchCompanyName(text, companies || []);

  let month = '';
  let m = text.match(/(20\d{2})\D{0,3}(\d{1,2})\s*월/);          // '2026년 8월'
  if (!m) m = text.match(/(20\d{2})[.\-_](\d{1,2})(?!\d)/);      // '2026-08'
  if (!m) {
    const yy = text.match(/(?:^|\D)(\d{2})\s*년\s*(\d{1,2})\s*월/); // '25년 07월'
    if (yy) m = [yy[0], '20' + yy[1], yy[2]];
  }
  if (m) {
    const mo = parseInt(m[2], 10);
    if (mo >= 1 && mo <= 12) month = m[1] + '-' + (mo < 10 ? '0' : '') + mo;
  }

  let kind = 'etc';
  if (/근로계약|계약서/.test(text)) kind = 'contract';
  else if (/명세서|이체|신고|취득|상실/.test(text)) kind = 'output';
  else if (/급여대장|노임|임금대장|대장/.test(text)) kind = 'ledger';
  else if (/근태|출근|출역|근무|시간/.test(text)) kind = 'attend';

  return { companyId: hit ? hit.id : '', companyName: hit ? hit.name : '', month: month, kind: kind };
}

/* ── 사람이 고른 이름표는 화면을 다시 그려도 남는다 ──
   대기 칸의 사업장·귀속월·종류는 화면을 그릴 때마다 파일 이름에서 **다시 짐작**해
   채웠다. 그래서 사업장을 손으로 골라 놓고 ☐ 를 누르거나 파일을 하나 더 올리면
   (둘 다 화면을 다시 그린다) 방금 고른 것이 처음 짐작값으로 되돌아갔다.
   여러 건을 정리할 때 반드시 겪는 일이라, 사람이 고친 것만 따로 적어 두고
   짐작값 위에 덮어 쓴다. 안 고친 칸은 그대로 짐작값이다. */
function pendTagOf(id, rec) {
  return Object.assign(guessTag(rec, App.companies), App.pendTag[id] || {});
}

function setPendTag(id, key, value) {
  App.pendTag[id] = Object.assign({}, App.pendTag[id]);
  App.pendTag[id][key] = value;
  /* 여기서 다시 그리지 않는다 — 귀속월은 글자 하나마다 불리므로 그리면 낭비다.
     화면에 이미 사람이 고른 값이 들어가 있으니 지금 보이는 것과 어긋나지 않는다. */
}
window.setPendTag = setPendTag;

function screenPending() {
  const ids = Object.keys(App.pending || {}).sort((a, b) => ((App.pending[b].at || 0) - (App.pending[a].at || 0)));
  let h = '<div style="margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    + '<button class="btn" onclick="App.go(\'sites\')">← 사업장</button>'
    + (canWrite() ?
      '<button class="btn pri" onclick="pickFiles()">＋ 파일 올리기</button>'
      + '<input type="file" id="filePick" multiple style="display:none"'
      + ' accept=".xlsx,.xls,.csv,.pdf,.hwp,.hwpx,.jpg,.jpeg,.png,.heic,.webp"'
      + ' onchange="uploadFiles(this.files)">'
      + '<button class="btn" onclick="pickShot()">📷 찍어서 올리기</button>'
      + '<input type="file" id="shotPick" accept="image/*" capture="environment" style="display:none"'
      + ' onchange="shotToPending(this.files)">'
      : '')
    + '</div>'
    + '<h1>미정 대기 칸</h1><div class="sub">사업장·귀속월을 채우면 서랍으로 내려갑니다 · ' + ids.length + '건</div>';

  if (!ids.length) return h + '<div class="card"><div class="empty">대기 중인 자료가 없습니다.</div></div>';

  const now = Date.now();
  const kindOpts = S.KINDS.map(k => '<option value="' + k.key + '">' + esc(k.label) + '</option>').join('');
  const coOpts = '<option value="">사업장 고르기</option>'
    + App.companies.map(c => '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>').join('');

  const pendActs = canWrite()
    ? '<span class="pkacts">'
      + '<button class="btn pri" onclick="bulkToDrawer()">📦 고른 것 서랍으로</button>'
      + '<button class="btn" onclick="bulkPendingTrash()">🗑 휴지통으로</button></span>'
    : '';

  h += '<div class="card">' + pickBar('pending', ids, pendActs) + ids.map((id, i) => {
    const rec = App.pending[id];
    const g = pendTagOf(id, rec);
    const stale = S.isStalePending(rec, now);
    const sel = pickOf('pending');
    return '<div class="row' + (pickOn(sel, id) ? ' pkon' : '') + '" style="display:block">'
      + '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">'
      + '<label onclick="event.stopPropagation()"><input type="checkbox" ' + (pickOn(sel, id) ? 'checked' : '')
      + ' onchange="pickHit(\'pending\',\'' + esc(id) + '\')"></label>'
      + '<span class="pkno">' + (i + 1) + '</span>'
      + '<b style="flex:1">' + esc(rec.filename || '(이름 없음)') + '</b>'
      + (stale ? '<span class="expbadge">3일 넘음</span>' : '')
      + '</div>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-left:34px">'
      + '<select class="btn" id="co_' + id + '" onchange="setPendTag(\'' + jsq(id) + '\',\'companyId\',this.value)">'
      + coOpts.replace('value="' + esc(g.companyId) + '"', 'value="' + esc(g.companyId) + '" selected') + '</select>'
      + '<input class="btn" id="mo_' + id + '" style="width:104px" placeholder="2026-08" value="' + esc(g.month) + '"'
      + ' oninput="setPendTag(\'' + jsq(id) + '\',\'month\',this.value)">'
      + '<select class="btn" id="kd_' + id + '" onchange="setPendTag(\'' + jsq(id) + '\',\'kind\',this.value)">'
      + kindOpts.replace('value="' + esc(g.kind) + '"', 'value="' + esc(g.kind) + '" selected') + '</select>'
      + (canWrite() ? '<button class="btn pri" onclick="fileToDrawer(\'' + esc(id) + '\')">서랍으로</button>' : '')
      + '</div></div>';
  }).join('') + '</div>';
  return h;
}

/* 그 줄에 채워져 있는 이름표를 읽는다. 화면에 그려져 있으면 화면 값이 먼저다 —
   사람이 방금 고른 것이 언제나 가장 새롭다. 안 그려져 있으면(한꺼번에 처리할 때
   화면 밖일 수 있다) 적어 둔 값을 쓴다(pendTagOf). */
function pendTagLive(id, rec) {
  const saved = pendTagOf(id, rec);
  const co = $('co_' + id), mo = $('mo_' + id), kd = $('kd_' + id);
  const companyId = co ? co.value : saved.companyId;
  const hit = App.companies.filter(c => c.id === companyId)[0];
  return {
    companyId: companyId,
    companyName: hit ? hit.name : '',
    month: mo ? mo.value : saved.month,
    kind: kd ? kd.value : saved.kind,
    at: Date.now()
  };
}

/* 대기 칸에서 서랍으로. 저장 층이 한 묶음으로 쓴다 —
   자료 생기기·대기 칸 지우기·도착 표시가 함께 들어간다. */
function fileToDrawer(id) {
  if (!canWrite()) return;   // 서버가 어차피 거절하지만 이중으로 잠근다
  const rec = App.pending[id];
  if (!rec) return;
  const tag = pendTagLive(id, rec);
  try { S.drawerUpdate(id, rec, tag); }
  catch (e) { alert(e.message); return; }     // 무엇이 비었는지 사람에게 알린다
  S.moveToDrawer(id, tag, rec, App.viewingUid)
    .then(() => {
      delete App.pending[id];
      delete App.pendTag[id];      // 다 쓴 이름표는 버린다
      /* 서랍에 들어갔으니 도착 칸 숫자도 달라졌다 — 다시 읽지 않으면 사업장
         목록과 왼쪽 대시보드가 「미도착·0장」인 채로 남는다(새로고침해야 맞았다). */
      refreshArrivals();
      App.render();
    })
    .catch(e => alert('저장 실패: ' + (e.code || e.message) + '\n다시 시도해 주세요.'));
}
window.fileToDrawer = fileToDrawer;

/* ══════ 골라서 한꺼번에 — 대기 칸 (대표 승인 2026-08-15) ══════
   ☐ 는 세 목록에 진작 있었는데 골라도 할 수 있는 일이 하나도 없었다.
   스무 건이 들어오면 「서랍으로」를 스무 번 눌러야 했다.

   ⚠ 이름표가 덜 채워진 건은 **남긴다.** 사업장이나 귀속월이 비어 있으면 그 건만
   대기 칸에 그대로 두고 나머지를 내려보낸다. 그리고 무엇이 왜 남았는지 파일 이름까지
   적어 알린다 — 조용히 빠뜨리면 사람은 다 들어간 줄 알고 원본을 지운다.

   ⚠ 쓰기는 **한 번**이다. 건마다 따로 쓰면 중간에 끊겼을 때 어디까지 갔는지
   아무도 모른다(다중 경로 update 는 다 되거나 하나도 안 된다). */
function bulkToDrawer() {
  if (!canWrite()) return;
  const ids = pickList(pickOf('pending'), Object.keys(App.pending || {}));
  if (!ids.length) return;

  const up = {}, done = [], left = [];
  ids.forEach(id => {
    const rec = App.pending[id];
    if (!rec) return;
    try {
      const one = S.drawerUpdate(id, rec, pendTagLive(id, rec), App.viewingUid);
      Object.keys(one).forEach(k => { up[k] = one[k]; });
      done.push(id);
    } catch (e) {
      left.push((rec.filename || '(이름 없음)') + ' — ' + e.message);
    }
  });

  if (!done.length) {
    alert('내려보낼 수 있는 건이 없습니다 — 이름표를 채워 주세요.\n\n· ' + left.join('\n· '));
    return;
  }
  if (!confirm(done.length + '건을 서랍으로 내려보낼까요?'
    + (left.length ? '\n\n' + left.length + '건은 이름표가 덜 채워져 대기 칸에 남습니다.' : ''))) return;

  db.ref().update(up).then(() => {
    done.forEach(id => { delete App.pending[id]; delete App.pendTag[id]; });
    pickPut('pending', {});
    refreshArrivals();
    App.render();
    alert(ids.length + '건 중 ' + done.length + '건을 서랍으로 내려보냈습니다.'
      + (left.length ? '\n\n남은 ' + left.length + '건:\n· ' + left.join('\n· ') : ''));
  }).catch(e => alert('저장 실패: ' + (e.code || e.message) + '\n다시 시도해 주세요.'));
}
window.bulkToDrawer = bulkToDrawer;

/* 대기 칸에서 고른 것을 휴지통으로. 서랍 자료와 지우는 길이 다르다 —
   대기 칸 자료는 items 칸에 있지도 않다(저장 층 trashPendingUpdate 머리말). */
function bulkPendingTrash() {
  if (!canWrite()) return;
  const ids = pickList(pickOf('pending'), Object.keys(App.pending || {}));
  if (!ids.length) return;
  if (!confirm(ids.length + '건을 휴지통으로 옮길까요?\n'
    + S.TRASH_DAYS + '일 안에는 되살릴 수 있습니다(대기 칸으로 돌아옵니다).')) return;
  const up = {};
  ids.forEach(id => {
    const rec = App.pending[id];
    if (!rec) return;
    const one = S.trashPendingUpdate(id, rec, App.viewingUid);
    Object.keys(one).forEach(k => { up[k] = one[k]; });
  });
  db.ref().update(up).then(() => {
    ids.forEach(id => { delete App.pending[id]; delete App.pendTag[id]; });
    pickPut('pending', {});
    App.trash = null;            // 다음에 휴지통을 열 때 새로 읽는다
    App.render();
  }).catch(e => alert('실패: ' + (e.code || e.message)));
}
window.bulkPendingTrash = bulkPendingTrash;

/* 여러 장을 한꺼번에 받는다. 한 장이 막혀도 나머지는 올라간다 —
   전부 되돌리면 방금 고른 것을 처음부터 다시 골라야 한다. */

/* ══════ 끌어다 놓기 (대표 지시 2026-08-17) ══════
   **놓는 자리가 곧 이름표다.** 서랍을 열어 놓고 놓으면 그 사업장·그 달·그 종류로
   바로 담기고, 첫 화면에 놓으면 대기 칸으로 가서 파일 이름으로 짐작해 채워 둔다.

   ⚠ 판독(AI)은 여기서 **자동으로 돌리지 않는다.** 올리자마자 보내면 주민번호
   가림을 통째로 건너뛰게 된다(가림은 「보내기 전에 사람이 한 번 본다」이다).
   여기까지는 밖으로 나가는 것이 하나도 없다 — 판독은 사람이 눌러야 시작된다. */
function dropTargetNow() {
  if (App.screen === 'drawer' && App.companyId && !S.isKeepKind(App.kind)) {
    return { where: 'drawer', companyId: App.companyId, companyName: App.companyName,
      month: App.month, kind: App.kind };
  }
  /* 근로계약서 탭은 월이 없는 칸이라 그대로 담아도 되지만, 「이 달」이라 적을 수
     없어 사람이 헷갈린다 — 대기 칸으로 보내 이름표를 눈으로 보게 한다. */
  return { where: 'pending' };
}

function dropHintHtml(t) {
  if (t.where === 'drawer') {
    return { title: '여기에 놓으면 바로 담깁니다',
      sub: esc(t.companyName) + ' · ' + esc(t.month) + ' · ' + esc(S.kindLabel(t.kind))
        + '<br>대기 칸을 거치지 않습니다 — 놓는 자리가 곧 이름표입니다' };
  }
  return { title: '여기에 놓으면 대기 칸에 담깁니다',
    sub: '파일 이름에서 사업장·귀속월·종류를 짐작해 채워 둡니다'
      + '<br>맞는지 보고 「고른 것 서랍으로」 한 번이면 끝납니다' };
}

/* 창 밖에서 파일을 끌고 들어왔을 때만 뜬다 — 화면 안에서 사업장 순서를 바꾸려고
   끄는 것(sideDragStart)에는 파일이 없으므로 걸리지 않는다. */
function dropHasFiles(ev) {
  const dt = ev && ev.dataTransfer;
  if (!dt) return false;
  const types = dt.types || [];
  for (let i = 0; i < types.length; i++) if (String(types[i]) === 'Files') return true;
  return false;
}

let dropDepth = 0;
function dropShow(on) {
  const ov = $('dropOv');
  if (!ov) return;
  ov.classList.toggle('on', !!on);
  if (!on) return;
  const t = dropHintHtml(dropTargetNow());
  $('dropTitle').innerHTML = t.title;
  $('dropSub').innerHTML = t.sub;
}

function dropWatch() {
  window.addEventListener('dragenter', ev => {
    if (!dropHasFiles(ev) || !canWrite()) return;
    ev.preventDefault(); dropDepth += 1; dropShow(true);
  });
  window.addEventListener('dragover', ev => {
    if (!dropHasFiles(ev) || !canWrite()) return;
    ev.preventDefault();                       // 이걸 안 하면 놓을 수가 없다
  });
  window.addEventListener('dragleave', () => {
    dropDepth -= 1;
    if (dropDepth <= 0) { dropDepth = 0; dropShow(false); }
  });
  window.addEventListener('drop', ev => {
    if (!dropHasFiles(ev)) return;
    ev.preventDefault();
    dropDepth = 0; dropShow(false);
    if (!canWrite()) { alert('남의 자리에는 담을 수 없습니다.'); return; }
    dropFiles((ev.dataTransfer && ev.dataTransfer.files) || []);
  });
}

function dropFiles(files) {
  const list = Array.prototype.slice.call(files || []);
  if (!list.length) return;
  const t = dropTargetNow();
  if (t.where !== 'drawer') { uploadFiles(list); return; }   // 대기 칸으로

  const at = Date.now();
  const tag = { companyId: t.companyId, companyName: t.companyName,
    month: t.month, kind: t.kind, at: at, from: 'drop' };
  const bad = [], left = [];
  Promise.all(list.map(f =>
    S.saveFileToDrawer(f, tag, App.viewingUid)
      .then(r => { if (!r.filed) left.push(f.name); })
      .catch(e => { bad.push(f.name + ' — ' + e.message); })
  )).then(() => {
    /* 서랍 칸과 도착 표시를 다시 읽는다 — 안 읽으면 방금 놓은 것이 안 보인다. */
    App.itemsKeep = null; App.itemsMonth = null; App.itemsMonthSlot = '';
    ensureDrawerData();
    refreshArrivals();
    App.render();
    const n = list.length - bad.length - left.length;
    let msg = n + '건을 ' + t.companyName + ' ' + t.month + ' ' + S.kindLabel(t.kind) + '에 담았습니다.';
    if (left.length) msg += '\n\n이름표가 덜 채워져 대기 칸에 남은 것:\n· ' + left.join('\n· ');
    if (bad.length) msg += '\n\n담지 못한 것:\n· ' + bad.join('\n· ');
    alert(msg);
  });
}
window.dropFiles = dropFiles;

/* ══════ 카톡·갤러리에서 공유 받기 ══════
   폰에 앱으로 설치돼 있으면 공유 목록에 「급여데이터함」이 뜬다. 누르면 안드로이드가
   자료를 POST 로 보내고, pu-sw.js 가 받아 IndexedDB 에 잠깐 둔 뒤 이 화면을
   `?share=1` 로 돌려보낸다. 여기서 꺼내 곧장 대기 칸에 담는다 — 사진첩과 달리
   미리보기 화면은 두지 않는다(급여데이터함은 촬영·올리기도 원래 미리보기 없이
   바로 대기 칸으로 간다. 사업장·귀속월은 대기 칸에서 고른다).
   ⚠ 아이폰은 애플이 막아 두어 안 된다 — 안드로이드 전용. */
const SHARE_IDB = 'pu-paydata-share', SHARE_STORE = 'inbox';

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  /* 통합 워커 하나만 등록 — 앱마다 따로 등록하면 서로 밀어내 공유 받기가 죽는다(pu-sw.js 머리말) */
  navigator.serviceWorker.register('pu-sw.js')
    .catch(e => console.warn('[공유 받기 준비]', e));
}

function openShareIdb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(SHARE_IDB, 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains(SHARE_STORE)) {
        d.createObjectStore(SHARE_STORE, { keyPath: 'id', autoIncrement: true });
      }
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}

/* 꺼내면서 바로 비운다 — 안 비우면 새로고침할 때마다 같은 자료가 또 담긴다. */
function drainShareIdb() {
  return openShareIdb().then(db => new Promise((res, rej) => {
    const tx = db.transaction(SHARE_STORE, 'readwrite');
    const st = tx.objectStore(SHARE_STORE);
    const got = st.getAll();
    st.clear();
    tx.oncomplete = () => { db.close(); res(got.result || []); };
    tx.onerror = () => { db.close(); rej(tx.error); };
  }));
}

function shareFlag() {
  try { return new URLSearchParams(location.search).get('share'); } catch (_) { return null; }
}
/* 주소에서 share 표시를 지운다 — 남겨 두면 새로고침 때마다 "못 받았다"가 또 뜬다 */
function clearShareFlag() {
  try {
    const u = new URL(location.href);
    u.searchParams.delete('share');
    history.replaceState(null, '', u.pathname + u.search + u.hash);
  } catch (_) { /* 주소를 못 고쳐도 동작에는 지장 없다 */ }
}

function takeShared() {
  const flag = shareFlag();
  if (flag === 'none' || flag === 'err') {
    clearShareFlag();
    alert(flag === 'none'
      ? '공유받은 자료가 없습니다.\n다시 공유해 주세요.'
      : '공유받은 자료를 읽지 못했습니다.\n다시 시도해 주세요.');
    return;
  }
  /* 표시가 없어도 한 번 살펴본다 — 공유 직후 로그인 화면을 거치면 표시가 날아간다.
     남은 것이 없으면 아무 일도 일어나지 않는다. */
  drainShareIdb().then(rows => {
    clearShareFlag();
    if (!rows.length) return;
    const files = rows.map(r => new File([r.blob], r.name || '공유자료', { type: r.type || '' }));
    shareToPending(files);
    alert(files.length + '건을 대기 칸에 담았습니다. 사업장·귀속월을 골라 정리해 주세요.');
  }).catch(e => { console.warn('[공유 받기]', e); clearShareFlag(); });
}

/* ══════ 사업장 서랍 (Task 9) — 사진첩과 같은 틀고정 탭·찾기 줄·확대 보기 ══════ */

/* 근로계약서(keep)는 귀속월과 무관한 다른 칸에 있다 — 그 칸의 자료까지 세어야
   「근로계약서 3」처럼 탭에 정확한 장수가 뜬다. 두 칸(keep·이 달)을 함께 받는다. */
function drawerCounts(itemsKeep, itemsMonth, companyId) {
  const counts = {};
  S.KINDS.forEach(k => {
    const box = k.keep ? (itemsKeep || {}) : (itemsMonth || {});
    counts[k.key] = Object.keys(box).filter(id => {
      const r = box[id];
      return r && r.companyId === companyId && r.kind === k.key;
    }).length;
  });
  return counts;
}

/* 지금 고른 탭(kind)에 맞는 칸만 본다 — keep 탭이면 keep 칸, 아니면 이 달 칸. */
function drawerModel(itemsKeep, itemsMonth, companyId, kind, now) {
  const box = S.isKeepKind(kind) ? (itemsKeep || {}) : (itemsMonth || {});
  const rows = Object.keys(box).map(id => {
    const r = box[id];
    return Object.assign({ id: id, expired: S.isExpired(r, now) }, r);
  }).filter(r => r.companyId === companyId && r.kind === kind)
    .sort((a, b) => (Number(b.filedAt || 0) - Number(a.filedAt || 0)));
  return { rows: rows };
}

/* 파일 이름으로 좁힌다 — 사진첩의 찾기 줄과 같은 자리(탭 바로 아래)에 둔다. */
function searchRows(rows, query) {
  const q = String(query || '').trim().toLowerCase();
  if (!q) return rows || [];
  return (rows || []).filter(r => String(r.filename || '').toLowerCase().indexOf(q) >= 0);
}

/* ══════ 내 폴더 (사진첩과 같은 방식) ══════
   탭이 「무엇인가」라면 폴더는 「어느 일인가」다. 지금 고른 탭의 자료(rows)
   안에서만 센다 — 탭을 넘나들면 세는 대상도 달라진다(사진첩과 같은 방식). */
function folderCounts(rows) {
  const counts = { all: (rows || []).length };
  (rows || []).forEach(r => { if (r && r.folder) counts[r.folder] = (counts[r.folder] || 0) + 1; });
  return counts;
}

/* 'all' 이면 다 보여준다. 폴더를 고르면 그 폴더로 이름표가 붙은 것만. */
function folderRows(rows, folderPick) {
  if (!folderPick || folderPick === 'all') return rows || [];
  return (rows || []).filter(r => r && r.folder === folderPick);
}

/* keep 칸은 한 번만, 이 달 칸은 달이 바뀔 때만 다시 읽는다 — 매번 두 칸을
   전부 새로 읽으면 탭만 눌러도 실시간DB를 불필요하게 두드린다. */
function ensureDrawerData() {
  if (!App.month) App.month = thisMonth();
  const monthSlot = S.monthKey(App.month) || S.KEEP;
  const seat = seatNow();               // 늦게 온 답을 버리려고 지금 자리를 적어 둔다
  const jobs = [];
  if (!App.itemsKeep) {
    jobs.push(S.listSlot(S.KEEP, seat).then(v => { if (seatSame(seat)) App.itemsKeep = v; })
      .catch(e => { console.warn('[서랍·keep]', e && e.code); if (seatSame(seat)) App.itemsKeep = {}; }));
  }
  if (App.itemsMonthSlot !== monthSlot) {
    jobs.push(S.listSlot(monthSlot, seat).then(v => { if (seatSame(seat)) { App.itemsMonth = v; App.itemsMonthSlot = monthSlot; } })
      .catch(e => { console.warn('[서랍·' + monthSlot + ']', e && e.code); if (seatSame(seat)) { App.itemsMonth = {}; App.itemsMonthSlot = monthSlot; } }));
  }
  if (jobs.length) Promise.all(jobs).then(() => { if (seatSame(seat)) App.render(); });
}

/* 기준 월을 바꾼다 — 서랍만 다시 읽고 끝내면 안 된다. 값은 「이 달」 것이라
   달이 바뀌면 들고 있던 값이 통째로 지난달 것이 된다. 그 수를 급여관리에
   알리면 이 달이 정리된 것으로 잘못 적힌다(handoffMonth 머리말). */
function changeMonth(v) {
  App.month = v;
  App.values = null;
  ensureDrawerData();
  App.render();
}
window.changeMonth = changeMonth;

/* 사업장이 바뀌면 폴더 목록도 다시 읽는다 — 폴더는 사업장마다 따로 관리된다. */
function ensureFolders(force) {
  if (!force && App.foldersCompanyId === App.companyId) return Promise.resolve();
  const seat = seatNow(), want = App.companyId;
  return S.listFolders(want, seat).then(v => {
    if (!seatSame(seat) || App.companyId !== want) return;   // 자리·사업장이 바뀌었다 — 버린다
    App.folders = v; App.foldersCompanyId = want; App.render();
  }).catch(e => {
    console.warn('[폴더]', e && e.code);
    if (!seatSame(seat) || App.companyId !== want) return;
    App.folders = {}; App.foldersCompanyId = want;
  });
}

/* 폴더 칸 — 전체 + 내가 만든 폴더들(한 단계 하위폴더까지). 점선 테두리로
   "직접 만든 것"임을 가른다(사진첩과 같은 방식). */
function folderBar(folders, folderPick, counts) {
  const f = folders || {};
  const byAge = (a, b) => (f[a].createdAt || 0) - (f[b].createdAt || 0);
  const tops = Object.keys(f).filter(id => !f[id].parent).sort(byAge);
  const kidsOf = pid => Object.keys(f).filter(id => f[id].parent === pid).sort(byAge);
  const editable = canWrite();
  const chip = (fid, label, n, sub) =>
    '<button class="' + (folderPick === fid ? 'on' : '') + (sub ? ' sub' : '') + '" onclick="pickFolder(\''
    + esc(fid) + '\')">' + esc(label) + '<span class="n">' + (n || 0) + '</span>'
    + (fid !== 'all' && editable ? '<span class="dots" title="이름 바꾸기·하위폴더·지우기"'
      + ' onclick="event.stopPropagation();folderMenu(event,\'' + esc(fid) + '\')">⋯</span>' : '') + '</button>';

  let h = '<div class="foldbar">';
  h += chip('all', '📁 전체', counts.all, false);
  if (editable && App.folderEdit.mode === 'new') h += folderEditorHtml(false);
  tops.forEach(fid => {
    if (editable && App.folderEdit.mode === 'rename' && App.folderEdit.fid === fid) h += folderEditorHtml(false);
    else h += chip(fid, '📁 ' + (f[fid].name || ''), counts[fid], false);
    kidsOf(fid).forEach(kid => {
      if (editable && App.folderEdit.mode === 'rename' && App.folderEdit.fid === kid) h += folderEditorHtml(true);
      else h += chip(kid, '↳ ' + (f[kid].name || ''), counts[kid], true);
    });
    if (editable && App.folderEdit.mode === 'sub' && App.folderEdit.fid === fid) h += folderEditorHtml(true);
  });
  if (editable && App.folderEdit.mode !== 'new') h += '<button class="add" onclick="openFolderEditor(\'new\')">＋ 폴더</button>';
  h += '</div>';
  return h;
}

/* 이름 적는 칸을 그 자리에 연다(사진첩과 같은 방식, 브라우저 prompt 대신) —
   누른 자리와 적는 자리가 멀면 헷갈린다. */
function folderEditorHtml(sub) {
  return '<span class="foldedit' + (sub ? ' sub' : '') + '">'
    + '<input id="foldInput" type="text" maxlength="30" placeholder="폴더 이름"'
    + ' value="' + esc(App.folderEdit.value || '') + '" onkeydown="foldKeyDown(event)">'
    + '<button onclick="submitFolderEditor()">✓</button>'
    + '<button onclick="cancelFolderEditor()">✕</button></span>';
}

function openFolderEditor(mode, fid, value) {
  App.folderEdit = { mode: mode, fid: fid || '', value: value || '' };
  App.render();
  setTimeout(() => { const el = $('foldInput'); if (el) { el.focus(); el.select(); } }, 0);
}
function cancelFolderEditor() { App.folderEdit = { mode: '', fid: '', value: '' }; App.render(); }
function foldKeyDown(e) {
  if (e.key === 'Enter') { e.preventDefault(); submitFolderEditor(); }
  else if (e.key === 'Escape') { e.preventDefault(); cancelFolderEditor(); }
}
function submitFolderEditor() {
  const inp = $('foldInput');
  const name = inp ? String(inp.value || '').trim() : '';
  const mode = App.folderEdit.mode, fid = App.folderEdit.fid;
  // 빈 이름은 그냥 접는다 — 지우기가 아니다(지우기는 ⋯ 차림표에 따로 있다).
  if (!name) { cancelFolderEditor(); return; }
  App.folderEdit = { mode: '', fid: '', value: '' };
  if (mode === 'rename') {
    S.renameFolder(App.companyId, fid, name, App.viewingUid).then(() => ensureFolders(true))
      .catch(e => { alert('이름을 바꾸지 못했습니다 — ' + (e.message || e)); App.render(); });
    return;
  }
  S.addFolder(App.companyId, name, mode === 'sub' ? fid : null, App.viewingUid).then(r =>
    ensureFolders(true).then(() => { App.folderPick = r.id; App.render(); })
  ).catch(e => { alert('폴더를 만들지 못했습니다 — ' + (e.message || e)); App.render(); });
}

/* ⋯ 차림표 — 이름 바꾸기·하위폴더 만들기·지우기를 한자리에. */
function folderMenu(ev, fid) {
  closeFolderMenu();
  const f = (App.folders || {})[fid] || {};
  const m = document.createElement('div');
  m.className = 'foldmenu'; m.id = 'foldMenu';
  m.innerHTML = '<div onclick="renameFolderAsk(\'' + esc(fid) + '\')">✏ 이름 바꾸기</div>'
    + (f.parent ? '' : '<div onclick="openFolderEditor(\'sub\',\'' + esc(fid) + '\')">📁 하위폴더 만들기</div>')
    + '<div class="del" onclick="removeFolderAsk(\'' + esc(fid) + '\')">🗑 폴더 지우기</div>';
  document.body.appendChild(m);
  const r = ev.target.getBoundingClientRect();
  m.style.left = Math.min(r.left, window.innerWidth - 170) + 'px';
  m.style.top = (r.bottom + 4) + 'px';
  setTimeout(() => document.addEventListener('click', closeFolderMenu, { once: true }), 0);
}
function closeFolderMenu() { const m = $('foldMenu'); if (m && m.parentNode) m.parentNode.removeChild(m); }
function renameFolderAsk(fid) { closeFolderMenu(); openFolderEditor('rename', fid, ((App.folders || {})[fid] || {}).name || ''); }
function removeFolderAsk(fid) {
  closeFolderMenu();
  if (!canWrite()) return;
  if (!confirm('이 폴더를 지울까요?\n담긴 자료는 지워지지 않고 「전체」에 그대로 남습니다.')) return;
  S.deleteFolder(App.companyId, fid, App.viewingUid).then(() => {
    if (App.folderPick === fid) App.folderPick = 'all';
    return ensureFolders(true);
  }).catch(e => { alert('지우지 못했습니다 — ' + (e.message || e)); App.render(); });
}
function pickFolder(fid) { App.folderPick = fid; App.render(); }

/* 자료 한 건을 폴더에 넣거나(folderId) 뺀다('' 로 부르면 뺀다).
   서버에 쓰는 동안 화면이 멈추지 않게, 저장이 끝나면 우리가 들고 있는 자료에도
   바로 반영해 다시 읽지 않고 새로고침한다. */
function assignFolder(id, folderId) {
  if (!canWrite()) return;
  const slot = S.isKeepKind(App.kind) ? S.KEEP : (S.monthKey(App.month) || S.KEEP);
  S.setFolder(slot, id, folderId, App.viewingUid).then(() => {
    const box = S.isKeepKind(App.kind) ? App.itemsKeep : App.itemsMonth;
    if (box && box[id]) box[id].folder = folderId || null;
    App.render();
  }).catch(e => alert('저장 실패: ' + (e.code || e.message) + '\n다시 시도해 주세요.'));
}
/* ══════ 골라서 한꺼번에 — 서랍 (대표 승인 2026-08-15) ══════ */

/* 고른 자료를 한 폴더로 옮기거나 폴더에서 뺀다('').
   차림표 첫 줄('__')은 안내문이라 아무 일도 하지 않는다. */
function bulkSetFolder(folderId) {
  if (!canWrite() || folderId === '__') return;
  const ids = pickList(pickOf('drawer'), pickVisible('drawer'));
  if (!ids.length) return;
  const slot = S.isKeepKind(App.kind) ? S.KEEP : (S.monthKey(App.month) || S.KEEP);
  const box = S.isKeepKind(App.kind) ? App.itemsKeep : App.itemsMonth;
  S.setFolderMany(slot, ids, folderId, App.viewingUid).then(() => {
    ids.forEach(id => { if (box && box[id]) box[id].folder = folderId || null; });
    pickPut('drawer', {});
    App.render();
  }).catch(e => alert('저장 실패: ' + (e.code || e.message) + '\n다시 시도해 주세요.'));
}
window.bulkSetFolder = bulkSetFolder;

/* 고른 자료를 한꺼번에 휴지통으로. 쓰기는 한 번이다 — 절반만 지워진 채로
   끊기면 어디까지 갔는지 아무도 모른다. 창고 파일은 건드리지 않는다. */
function bulkDrawerTrash() {
  if (!canWrite()) return;
  const ids = pickList(pickOf('drawer'), pickVisible('drawer'));
  if (!ids.length) return;
  if (!confirm(ids.length + '건을 휴지통으로 옮길까요?\n'
    + S.TRASH_DAYS + '일 안에는 되살릴 수 있습니다.')) return;
  const up = {};
  ids.forEach(id => {
    const rec = findRow(id);
    if (!rec) return;
    const one = S.trashUpdate(id, rec, App.viewingUid);
    Object.keys(one).forEach(k => { up[k] = one[k]; });
  });
  db.ref().update(up).then(() => {
    ids.forEach(id => {
      if (App.itemsKeep && App.itemsKeep[id]) delete App.itemsKeep[id];
      if (App.itemsMonth && App.itemsMonth[id]) delete App.itemsMonth[id];
    });
    pickPut('drawer', {});
    App.trash = null;
    refreshArrivals();     // 도착 표시도 함께 내려갔다
    App.render();
  }).catch(e => alert('실패: ' + (e.code || e.message)));
}
window.bulkDrawerTrash = bulkDrawerTrash;

window.pickFolder = pickFolder; window.folderMenu = folderMenu; window.closeFolderMenu = closeFolderMenu;
window.renameFolderAsk = renameFolderAsk; window.removeFolderAsk = removeFolderAsk;
window.openFolderEditor = openFolderEditor; window.cancelFolderEditor = cancelFolderEditor;
window.submitFolderEditor = submitFolderEditor; window.foldKeyDown = foldKeyDown;
window.assignFolder = assignFolder;

/* ══════ 월별 값 표 (설계서 4장) ══════
   값은 종류를 가로지른다 — 근태에서 나온 값과 급여대장에서 나온 값이 한 표에
   섞이므로 서랍 탭이 아니라 별도 화면이다.
   사람이 한 줄, 항목이 가로. 바깥 급여프로그램에 넣기 좋은 모양이다. */
function valueGridModel(valueRows) {
  const box = valueRows || {};
  const items = [], seenItem = {};
  const people = [], byName = {};
  /* Firebase .val()의 키 차례는 저장 차례를 보장하지 않는다 — 이 순서 그대로
     돌면 열 순서가 새로고침마다 바뀔 수 있고, 더 나쁘게는 같은 사람·같은
     항목이 서류 두 장(근태표·급여대장 등)에서 나왔을 때 어느 값이 남을지도
     그때그때 달라진다(아래 p.cells[item] = ... 는 뒤에 온 값이 이긴다).
     그래서 저장 시각(at) 오름차순으로 미리 줄을 세운다 — 시각이 같으면 id로
     한 번 더 줄을 세워 흔들리지 않게 한다. 이러면 "가장 나중에 저장한 값이
     이긴다"로 고정되어, 이 앱 다른 곳의 덮어쓰기 방식과 같아진다. */
  const ids = Object.keys(box).sort((a, b) => {
    const at1 = Number((box[a] && box[a].at) || 0);
    const at2 = Number((box[b] && box[b].at) || 0);
    if (at1 !== at2) return at1 - at2;
    return a < b ? -1 : (a > b ? 1 : 0);
  });
  ids.forEach(id => {
    const r = box[id];
    if (!r || !r.name) return;
    let p = byName[r.name];
    if (!p) { p = byName[r.name] = { name: r.name, cells: {} }; people.push(p); }
    (r.pairs || []).forEach(pr => {
      if (!pr || !pr.item) return;
      if (!seenItem[pr.item]) { seenItem[pr.item] = 1; items.push(pr.item); }
      p.cells[pr.item] = { value: pr.value, sourceId: r.sourceId || '', confirmed: !!r.confirmed };
    });
  });
  return { items: items, people: people };
}

/* 이 사업장·이 달 값을 실시간DB에서 **그 자리에서 새로** 읽어 온다.
   화면이 들고 있는 App.values 는 값 표 화면에 들어갈 때만 채워진다 — 업체를
   바꾸거나 기준 월을 바꾸는 길에는 서랍만 다시 읽는다. 그래서 세어야 할 때는
   화면 상태를 믿지 말고 여기로 다시 읽는다(급여관리 알리기가 이것을 쓴다). */
function fetchValues(companyId) {
  const slot = S.monthKey(App.month) || S.KEEP;
  const want = companyId || App.companyId;
  return S.listValues(slot, App.viewingUid).then(v => {
    /* 이 사업장 것만 남긴다 — 값 칸은 그 달 전체가 한 자리에 있다. */
    const mine = {};
    Object.keys(v || {}).forEach(id => {
      if (v[id] && v[id].companyId === want) mine[id] = v[id];
    });
    return mine;
  });
}

/* 값 표 화면이 쓸 값을 읽어 App.values 에 담는다. 읽는 동안에는 null 로 비운다 —
   App.go('values') 가 이 함수를 부른 **뒤 곧바로** App.render() 하므로, 앞
   사업장 값을 그대로 두면 한 판 동안 남의 근로자 이름이 이 사업장 제목 밑에 뜬다
   (그 사이에 「엑셀로 내려받기」를 누르면 이 사업장 이름을 단 파일에 남의 이름이
   담긴다). 읽는 중에 다른 사업장으로 옮겨 갔으면 늦게 온 답은 버린다. */
function ensureValues() {
  App.values = null;
  const want = App.companyId;
  return fetchValues(want).then(v => {
    if (App.companyId !== want) return;
    App.values = v; App.render();
  }).catch(e => {
    console.warn('[값]', e && e.code);
    if (App.companyId !== want) return;
    App.values = {}; App.render();
  });
}

function screenValues() {
  let h = '<div style="margin-bottom:10px"><button class="btn" onclick="App.go(\'drawer\')">← 서랍으로</button></div>'
    + '<h1>' + esc(App.companyName || App.companyId) + ' — ' + esc(App.month) + ' 값</h1>';

  /* 아직 안 읽었으면(null) 표를 그리지 않는다 — 「값이 없습니다」도 아니다.
     앞 사업장에서 보던 줄이 이 제목 밑에 남는 것이 가장 나쁘다(내려받기까지 된다). */
  if (App.values === null) {
    return h + '<div class="card"><div class="empty">값을 불러오는 중입니다…</div></div>';
  }

  const g = valueGridModel(App.values);
  const iffy = g.people.reduce((n, p) =>
    n + Object.keys(p.cells).filter(k => !p.cells[k].confirmed).length, 0);

  h += '<div class="sub">근로자 ' + g.people.length + '명 · 항목 ' + g.items.length + '가지</div>';

  if (!g.people.length) {
    return h + '<div class="card"><div class="empty">아직 정리된 값이 없습니다.<br>'
      + '서랍에서 서류를 열고 「판독하기」를 눌러 주세요.</div></div>';
  }

  if (iffy) {
    h += '<div class="warnline" style="margin-bottom:12px">⚠ <b>확인 안 된 값이 ' + iffy
      + '개</b> 있습니다. 노란 칸을 눌러 원본과 견주어 주세요.</div>';
  }

  h += '<div class="bar" style="display:flex;gap:8px;margin-bottom:12px">'
    + '<button class="btn" onclick="valuesCsv()">⬇ 엑셀로 내려받기</button>'
    + '<button class="btn" onclick="valuesCopy()">📋 표 복사</button></div>';

  h += '<div class="card" style="overflow-x:auto"><table class="grid">'
    + '<tr><th>근로자</th>' + g.items.map(i => '<th>' + esc(i) + '</th>').join('') + '</tr>';
  g.people.forEach(p => {
    h += '<tr><td class="who">' + esc(p.name) + '</td>'
      + g.items.map(i => {
        const c = p.cells[i];
        if (!c) return '<td class="num">－</td>';
        /* 출처가 없는 값은 눌러도 열 원본이 없다 — src 클래스(커서·밑줄·hover)를
           안 붙여야 "눌러도 되는 척"하지 않는다. */
        return '<td class="num' + (c.sourceId ? ' src' : '') + (c.confirmed ? '' : ' iffy') + '"'
          + (c.sourceId ? ' onclick="openViewer(\'' + esc(c.sourceId) + '\')"' : '')
          + '>' + esc(c.value) + '</td>';
      }).join('') + '</tr>';
  });
  h += '</table></div>';
  return h;
}

/* 만든 파일을 내려받게 한다. 주소는 바로 되돌려 준다 — 안 하면 기억이 샌다. */
function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* 쉼표·따옴표·줄바꿈이 든 칸을 감싼다 — 안 감싸면 엑셀에서 열이 밀린다.
   (사진첩 근태표에서 쓰던 것과 같은 방식) */
function csvEsc(v) {
  const s = String(v == null ? '' : v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

/* 내보낼 표 한 벌 — 내려받기와 복사가 같은 것을 쓴다(두 벌로 두면 어긋난다). */
function valuesTable() {
  const g = valueGridModel(App.values);
  return {
    title: [App.companyName + ' ' + App.month + ' 값'],
    head: ['근로자'].concat(g.items),
    body: g.people.map(p => [p.name].concat(g.items.map(i => (p.cells[i] ? p.cells[i].value : ''))))
  };
}

function valuesCsv() {
  const t = valuesTable();
  /* ⚠ 머리글 줄도 몸통과 **똑같이** 감싼다. 항목 이름은 서류에 적힌 그대로 담기므로
     (「비고(가,나)」처럼) 쉼표가 들어올 수 있다 — 안 감싸면 그 줄만 칸이 하나 늘어
     그 아래 모든 열이 통째로 밀린다. 제목 줄은 이미 감싸고 있었다. */
  const lines = [csvEsc(t.title.join(''))].concat([t.head.map(csvEsc).join(',')])
    .concat(t.body.map(r => r.map(csvEsc).join(',')));
  const name = ('값_' + App.companyName + '_' + App.month).replace(/[\\/:*?"<>|\s]+/g, '_');
  /* ﻿ 는 BOM — 없으면 엑셀이 한글을 깨뜨린다 */
  saveBlob(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }), name + '.csv');
}

function valuesCopy() {
  const t = valuesTable();
  const tsv = [t.head.join('\t')].concat(t.body.map(r => r.join('\t'))).join('\n');
  navigator.clipboard.writeText(tsv).then(
    () => alert('표를 복사했습니다 — 엑셀이나 급여프로그램에 붙여넣으세요.'),
    () => alert(tsv));
}
window.valuesCsv = valuesCsv; window.valuesCopy = valuesCopy;

/* ── 월 줄 (대표 지시 2026-08-17 「월별로 간략히 볼 수 있게」) ──
   예전에는 「2026-08」을 손으로 고쳐 적어야 했다. 최근 여섯 달을 늘어놓고
   **그 달에 몇 장 있는지**를 함께 보여 준다 — 눌러서 옮기고 ◀▶ 로 더 예전을 본다.
   빈 칸일 때 특히 쓸모 있다: 「없습니다」만 뜨던 자리에서 「5월·6월에는 있다」를
   바로 알 수 있다.
   ⚠ 장수는 **도착 칸**에서 센다(사업장 목록과 같은 자리) — 서랍을 달마다 열어
   보지 않아도 알 수 있는 유일한 길이다. */
function monthShift(base, delta) {
  const k = S.monthKey(base) || S.monthKey(thisMonth());
  const y = parseInt(k.slice(0, 4), 10), mo = parseInt(k.slice(4), 10);
  const d = new Date(y, mo - 1 + delta, 1);
  return d.getFullYear() + '-' + (d.getMonth() + 1 < 10 ? '0' : '') + (d.getMonth() + 1);
}
window.monthShift = monthShift;

/* 그 사업장·그 달에 몇 장 왔나 — 종류를 다 더한다.
   companyId 를 안 주면(첫 화면처럼) monthIds 에 적힌 사업장들을 다 더한다 —
   「이 보기에서 그 달에 몇 장」이라 사업장 목록에서도 같은 줄을 쓸 수 있다. */
function monthCount(companyId, month) {
  const slot = S.monthKey(month);
  if (!slot) return 0;
  const arr = App.arrivals || {};
  const one = id => S.KINDS.reduce((n, k) => n + S.arrivalCount((arr[id] || {})[slot], k.key), 0);
  if (companyId) return one(companyId);
  return (App.monthIds || []).reduce((n, id) => n + one(id), 0);
}

/* ⚠ ▶ 는 **이번 달까지만** 간다(대표 지시 2026-08-17). 제한이 없어서 실제로
   2027년 1월까지 넘어간 화면이 나왔다 — 기준 월은 8월이라 적혀 있는데 월 줄은
   1월이 켜져 있었다. 미래 달에는 자료가 있을 수 없는데 화면 어디에도 「지금
   미래를 보고 있다」는 말이 없어, 빈 것이 그 달 탓인지 가릴 수가 없다.
   「직접 적기」로 미래를 적는 것은 그대로 둔다 — 사람이 알고 하는 일이다. */
function monthAhead() { return S.monthKey(App.month) >= S.monthKey(thisMonth()); }

function monthStripHtml() {
  const cur = S.monthKey(App.month) || S.monthKey(thisMonth());
  let h = '<div class="mstrip">'
    + '<button class="btn sm" onclick="changeMonth(monthShift(App.month,-1))" title="지난달">◀</button>';
  /* 고른 달이 **맨 오른쪽**에 오게 여섯 달을 늘어놓는다 — 급여 일은 지난달을
     돌아보는 일이라 앞을 넓게 보는 것이 맞다. */
  for (let i = 5; i >= 0; i--) {
    const m = monthShift(App.month, -i);
    const n = monthCount(App.companyId, m);
    const on = (S.monthKey(m) === cur);
    h += '<button class="mo' + (on ? ' on' : (n ? ' has' : ' zero')) + '"'
      + ' onclick="changeMonth(\'' + jsq(m) + '\')" title="' + esc(m) + ' · ' + n + '장">'
      + parseInt(m.slice(5), 10) + '월<span class="c">' + n + '</span></button>';
  }
  const ahead = monthAhead();
  h += '<button class="btn sm"' + (ahead ? ' disabled' : '')
    + ' onclick="changeMonth(monthShift(App.month,1))"'
    + ' title="' + (ahead ? '이번 달보다 뒤로는 갈 수 없습니다' : '다음달') + '">▶</button>';
  /* 먼 달로 갈 때만 손으로 적는다 — 늘 띄워 두면 줄만 먹는다. */
  h += App.monthEdit
    ? '<input class="btn sm" id="monthInput" style="width:96px" value="' + esc(App.month) + '"'
      + ' onchange="App.monthEdit=false;changeMonth(this.value)">'
    : '<button class="btn sm" onclick="App.monthEdit=true;App.render()">직접 적기</button>';
  return h + '</div>';
}
window.monthStripHtml = monthStripHtml;

function screenDrawer() {
  if (!App.month) App.month = thisMonth();
  const counts = drawerCounts(App.itemsKeep, App.itemsMonth, App.companyId);
  const model = drawerModel(App.itemsKeep, App.itemsMonth, App.companyId, App.kind, Date.now());
  const foldCounts = folderCounts(model.rows);
  const foldered = folderRows(model.rows, App.folderPick);
  const rows = searchRows(foldered, App.query);
  const ids = rows.map(r => r.id);
  const sel = pickPrune(pickOf('drawer'), ids); pickPut('drawer', sel);

  /* ── 머리 한 줄 (대표 지시 2026-08-17 「간략하게 정렬」) ──
     예전에는 ←·이름·건수·기준 월·단추 둘이 **각각 한 줄씩** 다섯 줄을 먹어,
     정작 자료는 아홉째 줄에서야 보였다. 한 줄로 묶는다.
     ⚠ 「몇 번째 / 몇 곳」과 담당자는 **왼쪽 목록과 같은 모델**에서 가져온다 —
     따로 세면 두 곳이 또 다른 말을 한다. */
  const vlist = sideListModel(App.sideView, sideCtx(), {
    q: App.colQuery, filter: App.colFilter, order: App.myOrder
  });
  const at = vlist.rows.findIndex(r => r.id === App.companyId);
  const meRow = at >= 0 ? vlist.rows[at] : null;

  /* 머리 줄들을 한 덩어리로 묶어 통째로 붙여 둔다(대표 지시 2026-08-17 「틀고정」).
     예전에는 탭·찾기만 각자 붙어 있어, 그 위의 자리 띠·이름·달은 다 따라
     올라갔다 — 마흔 번째 자료에서 무슨 달·누구 자리인지 알 수 없었다. */
  let h = '<div class="stickhead">' + bannerHtml()
    + '<div class="dhead">'
    + '<button class="btn sm" onclick="App.go(\'sites\')" title="사업장 목록으로">←</button>'
    + '<b class="dtitle">' + esc(App.companyName || App.companyId) + '</b>'
    + '<span class="dmeta">'
    + (at >= 0 ? (at + 1) + ' / ' + vlist.rows.length + ' · ' : '')
    + (meRow && meRow.owner ? '담당 ' + esc(meRow.owner) + ' · ' : '')
    + model.rows.length + '건'
    + (App.folderPick !== 'all' ? ' 중 이 폴더 ' + foldered.length + '건' : '')
    + (App.query ? ' · 찾은 것 ' + rows.length + '건' : '')
    + '</span>'
    + (S.isKeepKind(App.kind) ? ''
      : '<span class="dacts"><button class="btn sm" onclick="App.go(\'values\')">📋 이 달 값</button>'
        + (S.canHandoffPayroll()
          ? '<button class="btn sm" onclick="handoffMonth()">📤 급여관리에 알리기</button>' : '')
        + '</span>')
    + '</div>';

  if (!S.isKeepKind(App.kind)) {
    h += monthStripHtml();
  } else {
    h += '<div class="sub" style="margin-bottom:6px">근로계약서는 월과 상관없이 모두 보입니다.</div>';
  }

  /* 탭·폴더·찾기를 **한 줄에** 모은다(대표 지시 2026-08-17 「줄을 줄였으면」).
     셋 다 「좁히는 것」이라 나란히 있는 편이 눈에 낫다. 폴더가 많으면 다음 줄로
     넘어가게 둔다 — 억지로 한 줄에 밀어 넣으면 폴더 이름이 잘려 못 고른다.
     탭은 「무엇인가」, 폴더는 「어느 일인가」다(사진첩과 같은 방식) — 탭을
     넘나들어도 고른 폴더는 그대로 둔다. */
  h += '<div id="findBar" class="foldfind">'
    + '<div id="tabsBar">' + S.KINDS.map(k =>
      '<button class="' + (App.kind === k.key ? 'on' : '') + '" onclick="App.kind=\'' + k.key
      + '\';App.query=\'\';ensureDrawerData();App.render()">' + esc(k.label)
      + '<span class="n">' + counts[k.key] + '</span></button>').join('')
    + folderBar(App.folders, App.folderPick, foldCounts) + '</div>'
    + '<input id="findInput" class="dfind" placeholder="파일 이름으로 찾기" value="' + esc(App.query) + '"'
    + ' oninput="App.query=this.value;App.render()"></div>';

  h += '</div>';   // .stickhead 끝 — 여기까지가 붙어 있는 머리다

  const folderOpts = folderOptionsHtml(App.folders);
  const editable = canWrite();

  /* 고른 뒤에 뜨는 단추 — 폴더로 옮기기·휴지통으로. 차림표는 고르고 나면
     안내문('__')으로 되돌려 둔다. 안 되돌리면 방금 옮긴 폴더 이름이 남아
     「지금 그 폴더에 들어 있다」처럼 보인다. */
  const drawerActs = editable
    ? '<span class="pkacts">'
      + '<select class="btn" onchange="bulkSetFolder(this.value);this.value=\'__\'">'
      + '<option value="__">📁 폴더로 옮기기…</option>'
      + folderOptionsHtml(App.folders, '폴더에서 빼기')
      + '</select>'
      + '<button class="btn" onclick="bulkDrawerTrash()">🗑 휴지통으로</button></span>'
    : '';

  h += '<div class="card">' + (rows.length ? pickBar('drawer', ids, drawerActs) + rows.map((r, i) =>
    '<div class="row' + (pickOn(sel, r.id) ? ' pkon' : '') + '">'
    + '<label onclick="event.stopPropagation()"><input type="checkbox" ' + (pickOn(sel, r.id) ? 'checked' : '')
    + ' onchange="pickHit(\'drawer\',\'' + esc(r.id) + '\')"></label>'
    + '<span class="pkno">' + (i + 1) + '</span>'
    + '<b style="flex:1;cursor:pointer" onclick="openViewer(\'' + esc(r.id) + '\')">'
