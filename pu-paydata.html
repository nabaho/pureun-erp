function closeHand() { App.hand = null; App.render(); }
window.closeHand = closeHand;

function handSet(k, v) { if (App.hand) { App.hand[k] = v; App.render(); } }
window.handSet = handSet;

function saveHand() {
  const f = App.hand; if (!f || f.busy) return;
  const why = String(f.why || '').trim();
  if (!why) { f.err = '왜 넘기는지 적어 주세요 — 받는 사람이 알아야 합니다.'; App.render(); return; }
  f.busy = true; f.err = ''; App.render();
  /* 넘기는 자리는 **지금 보고 있는 자리**다 — 총괄관리자가 남의 자리를 열어
     넘길 수도 있으므로 내 uid 가 아니라 보고 있는 자리를 보낸다. */
  /* 「공용 칸으로」는 받는 사람이 없다는 뜻이다 — 빈칸으로 보낸다 */
  const to = (f.to === '__shared') ? '' : f.to;
  return S.handItem(f.ids, App.viewingUid, to, why).then(r => {
    App.hand = null;
    return refreshMailAndPending().then(() => {
      alert(Number(r.moved || 0) + '건을 '
        + (to ? ownerNameOf(to) + ' 님께' : '공용 칸으로') + ' 넘겼습니다.');
    });
  }).catch(e => {
    f.busy = false; f.err = (e && e.message) || String(e); App.render();
  });
}
window.saveHand = saveHand;

function handHtml() {
  const f = App.hand; if (!f) return '';
  /* 받을 수 있는 사람 = **이 함에 들어온 사람**만. 안 들어온 자리에 두면
     아무도 안 열어 사라진 것과 같다(갈라 보내기와 같은 규칙). */
  const here = Object.keys(App.owners || {})
    .filter(uid => uid !== App.viewingUid)
    .map(uid => ({ uid: uid, name: ownerNameOf(uid) }))
    .sort((a, b) => String(a.name).localeCompare(String(b.name), 'ko'));
  const n = f.ids.length;
  return '<div class="fxbg" onclick="closeHand()"></div>'
    + '<div class="fxbox">'
    + '<div class="fxh">↪ 넘기기<button class="btn sm" onclick="closeHand()">닫기</button></div>'
    + '<div class="fxr"><label>넘길 자료</label><b>' + n + '건</b></div>'
    + '<div class="fxr"><label>지금 자리</label><b>' + esc(ownerNameOf(App.viewingUid)) + '</b></div>'
    + '<div class="fxr"><label>넘길 사람</label>'
    + '<select onchange="handSet(\'to\',this.value)">'
    + '<option value="">— 고르십시오 —</option>'
    + here.map(p => '<option value="' + esc(p.uid) + '"' + (f.to === p.uid ? ' selected' : '') + '>'
      + esc(p.name) + '</option>').join('')
    + '<option value="__shared"' + (f.to === '__shared' ? ' selected' : '') + '>'
    + '◻ 공용 칸으로 되돌리기 (임자를 모르겠을 때)</option>'
    + '</select></div>'
    + '<div class="fxr"><label>까닭</label>'
    + '<input type="text" value="' + esc(f.why) + '" placeholder="예) 유원에프앤비는 김보람 담당입니다"'
    + ' oninput="if(App.hand)App.hand.why=this.value"></div>'
    + (f.err ? '<div class="fxerr">' + esc(f.err) + '</div>' : '')
    + '<div class="fxa">'
    + '<button class="btn pri"' + ((f.to && !f.busy) ? '' : ' disabled') + ' onclick="saveHand()">'
    + (f.busy ? '넘기는 중…' : '넘기기') + '</button>'
    + '<button class="btn" onclick="closeHand()">닫기</button></div>'
    + '<div class="fxn">넘기면 받는 사람 화면에 <b>「' + esc(ownerNameOf(App.viewingUid))
    + ' → 나」</b> 와 까닭이 함께 보입니다. 누가·언제·왜 넘겼는지도 남습니다.</div>'
    + '</div>';
}
window.handHtml = handHtml;

/* ══════ 사업장 담당자 메일 한 줄 (대표 지적 2026-08-29) ══════
   대표: 「담당자와 관련된 이메일주소가 정리되고… 왜 여기에서는 확인이 어려운가」

   업체관리에는 넣어 두었는데 **급여데이터함이 그 칸을 안 가져와서** 어디에도
   안 보였다(normalizeCompanies 가 이름·유형·주담당만 담았다). 그래서 「정리됐나」를
   확인할 길이 없었다 — 업체관리를 따로 열어 그 사업장을 찾아가야 했다.

   사업장을 열면 「이 사업장 메일은 **어디서 오는가**」가 바로 보이게 한다.
   ⚠ 없으면 그렇다고 말하고, **그 자리에서 넣을 길**을 함께 둔다. */
/* ⚠ 늘 펼쳐 두지 않는다 (대표 지시 2026-08-29 「담당자 이름만 보면 될 것 같다」).
   주소 세 줄을 펴 두었더니 자료가 나오기까지 여섯 줄이었다. 머리줄에는
   **이름 한 조각**만 두고, 주소는 누를 때만 편다. 지우는 것은 없다. */
function coMailChip(coId) {
  if (!coId) return '';
  const co = (App.companies || []).filter(c => c.id === coId)[0];
  if (!co) return '';
  const rows = S.companyMails(co);
  const on = App.coMailOpen === coId;
  if (!rows.length) {
    /* 없는 것이 한 줄에서 바로 눈에 띄어야 한다 — 그래야 채운다 */
    return '<button class="comail none" onclick="toggleCoMail(\'' + jsq(coId) + '\')"'
      + ' title="담당자 메일이 없습니다 — 넣으면 이 사업장 메일이 저절로 옵니다">'
      + '📧 담당자 메일 없음</button>';
  }
  const first = rows[0];
  const more = rows.length - 1;
  return '<button class="comail" onclick="toggleCoMail(\'' + jsq(coId) + '\')"'
    + ' title="누르면 주소가 보입니다">📧 '
    + esc(first.name || first.email) + (more > 0 ? ' 외 ' + more : '')
    + ' ' + (on ? '⌃' : '⌄') + '</button>';
}
window.coMailChip = coMailChip;

/* 펼쳤을 때만 나오는 칸 — 주소는 여기서만 보인다 */
function coMailDropHtml(coId) {
  if (!coId || App.coMailOpen !== coId) return '';
  const co = (App.companies || []).filter(c => c.id === coId)[0];
  if (!co) return '';
  const rows = S.companyMails(co);
  const add = canWrite()
    ? ' <button class="btn sm fix" onclick="openFixCo(\'' + jsq(coId) + '\')">✉️ 주소'
      + (rows.length ? ' 더' : '') + ' 넣기</button>'
    : '';
  if (!rows.length) {
    const who = coOwnerName(co);
    return '<div class="comaildrop none"><b>담당자 메일이 없습니다.</b> 넣으면 이 사업장이 보낸 메일이'
      + (who ? ' <b>' + esc(who) + ' 칸</b>으로' : ' 담당자 칸으로')
      + ' 저절로 옵니다.' + add + '</div>';
  }
  return '<div class="comaildrop">'
    + rows.map((r, i) =>
      (r.name ? esc(r.name) + ' ' : '')
      + '<span class="em">' + esc(r.email) + '</span>'
      + (r.kind === 'tax' ? '<span class="tg gy">세무</span>'
        : (i === 0 ? '<span class="tg ok">이 주소로 오면 여기로</span>' : ''))
    ).join('<br>')
    + add + '</div>';
}
window.coMailDropHtml = coMailDropHtml;

function toggleCoMail(coId) {
  App.coMailOpen = (App.coMailOpen === coId) ? '' : coId;
  App.render();
}
window.toggleCoMail = toggleCoMail;

function coOwnerName(co) {
  const sid = String((co && co.managerMain) || '');
  if (!sid) return '';
  const p = fixPeople().filter(x => x.sid === sid)[0];
  return p ? p.name : sid;
}

/* 사업장 화면에서 바로 주소 넣기 — 메일 줄이 아니라 **사업장**에서 여는 길이다.
   ⚠ 서랍은 같은 것을 쓴다(saveFix). 두 벌 만들면 한쪽만 고쳐진다. */
function openFixCo(coId) {
  const co = (App.companies || []).filter(c => c.id === coId)[0];
  if (!co) return;
  App.fix = { kind: 'mail', id: '', from: '', name: '', coId: coId,
    fromCo: true, err: '', busy: false };
  App.render();
}
window.openFixCo = openFixCo;

/* ══════ 막힌 자리를 이 줄에서 바로 잇기 (대표 결정 2026-08-27) ══════
   대표: 「푸른이알피에 담당자 연락시킬 수 없나」
   여태는 빨간 까닭만 보이고, 고치려면 푸른이알피를 따로 열어 그 사업장을
   찾아가야 했다 — 55건을 그렇게 할 수는 없다.

   까닭이 곧 할 일이다:
     주소를 모른다        → ✉️ 그 사업장 담당자로 주소 넣기
     주담당이 없다        → 👤 직원 골라 주담당 정하기
     주담당이 안 들어왔다 → 그 사람이 한 번 열면 된다(사람 몫이라 안내만) */
function fixBtnsHtml(r) {
  const why = String((r && r.why) || '');
  let h = '';
  if (/없는 주소|사업장/.test(why) || !r.companyId) {
    h += '<button class="btn sm fix" title="이 보낸이를 업체관리의 그 사업장 담당자로 넣습니다'
      + ' — 다음부터 저절로 그 사람 칸으로 갑니다"'
      + ' onclick="openFixMail(\'' + jsq(r.id) + '\')">✉️ 주소 넣기</button>';
  }
  if (/주담당이 없음/.test(why) && r.companyId) {
    h += '<button class="btn sm fix" title="업체관리에서 이 사업장의 주담당을 정합니다"'
      + ' onclick="openFixOwner(\'' + jsq(r.id) + '\')">👤 주담당 정하기</button>';
  }
  if (r.companyId) {
    h += '<button class="btn sm" title="푸른이알피에서 이 사업장을 엽니다"'
      + ' onclick="goErpCompany(\'' + jsq(r.companyId) + '\')">푸른이알피 →</button>';
  }
  return h;
}

function goErpCompany(coId) {
  location.href = 'pu-erp.html?co=' + encodeURIComponent(coId || '');
}
window.goErpCompany = goErpCompany;

/* ── ✉️ 주소 넣기 ── */
function openFixMail(id) {
  const r = (mailRows(App.mail, mailCtx()) || []).filter(x => x.id === id)[0];
  if (!r) return;
  App.fix = { kind: 'mail', id: id, from: r.from || '', name: '',
    coId: r.companyId || '', err: '', busy: false };
  App.render();
}
window.openFixMail = openFixMail;

/* ── 👤 주담당 정하기 ── */
function openFixOwner(id) {
  const r = (mailRows(App.mail, mailCtx()) || []).filter(x => x.id === id)[0];
  if (!r || !r.companyId) return;
  App.fix = { kind: 'owner', id: id, coId: r.companyId,
    coName: r.companyName || '', sid: '', err: '', busy: false };
  App.render();
}
window.openFixOwner = openFixOwner;

function closeFix() { App.fix = null; App.render(); }
window.closeFix = closeFix;

function fixSet(k, v) { if (App.fix) { App.fix[k] = v; App.render(); } }
window.fixSet = fixSet;

function saveFix() {
  const f = App.fix; if (!f || f.busy) return;
  const co = (App.companies || []).filter(c => c.id === f.coId)[0];
  f.busy = true; f.err = ''; App.render();
  const done = (msg) => {
    App.fix = null;
    /* 업체 명단을 **다시 읽어야** 방금 넣은 것이 화면에 보인다.
       그리고 「다시 갈라 보내기」는 서버가 하므로 여기서 부르지 않는다 —
       무엇이 어디로 가는지 대표가 보고 누르는 쪽이 안전하다. */
    return S.listCompanies()
      .then(list => { App.companies = list; })
      .catch(e => console.warn('[업체 명단]', e && e.code))
      .then(() => refreshMailAndPending())
      .then(() => alert(msg + '\n\n「🔁 다시 갈라 보내기」를 누르면 이미 온 것도 따라옵니다.'));
  };
  const fail = (e) => {
    f.busy = false; f.err = (e && e.message) || String(e); App.render();
  };
  if (f.kind === 'owner') {
    return S.setCompanyOwner(f.coId, f.sid)
      .then(() => done('주담당을 넣었습니다 — ' + (f.coName || '') + ' · ' + ownerLabel(f.sid)))
      .catch(fail);
  }
  return S.addCompanyEmail(co, f.from, f.name)
    .then(() => done('주소를 넣었습니다 — ' + ((co && co.name) || '') + ' · ' + f.from))
    .catch(fail);
}
window.saveFix = saveFix;

/* 직원 명단 — 이 화면은 명단을 담아 두지 않는다. 다른 곳(colListHtml·viewBarHtml)과
   같이 **그때그때 세운다**. 담아 두면 업체 담당이 바뀌었을 때 한쪽만 낡는다.
   ⚠ 사번이 아닌 값(badSid)은 뺀다 — 골라도 사람과 이어지지 않는다. */
function fixPeople() {
  const cos = S.payrollCompanies(App.companies || []);
  const roster = S.managerRoster(cos, App.dir, App.owners);
  return ((roster && roster.people) || []).filter(p => p && !p.badSid && p.sid);
}

function ownerLabel(sid) {
  const p = fixPeople().filter(x => x.sid === sid)[0];
  return p ? (p.name + ' (' + sid + ')') : String(sid || '');
}

/* 고르는 서랍. 화면 위에 얹는다 — 목록을 떠나면 어느 줄을 고치던 것인지 잊는다. */
function fixHtml() {
  const f = App.fix; if (!f) return '';
  const pay = S.payrollCompanies(App.companies || []);
  const co = (App.companies || []).filter(c => c.id === f.coId)[0] || null;
  let body = '';
  if (f.kind === 'owner') {
    const people = fixPeople();
    body = '<div class="fxr"><label>사업장</label><b>' + esc(f.coName || co && co.name || '') + '</b></div>'
      + '<div class="fxr"><label>주담당</label><select onchange="fixSet(\'sid\',this.value)">'
      + '<option value="">— 직원 —</option>'
      + people.map(p => '<option value="' + esc(p.sid) + '"' + (f.sid === p.sid ? ' selected' : '') + '>'
        + esc(p.name) + ' (' + esc(p.sid) + ')</option>').join('')
      + '</select></div>';
  } else {
    /* 두 갈래로 열린다. 메일 줄에서 열면 **보낸이가 정해져 있고 사업장을 고른다**.
       사업장 화면에서 열면 반대다 — 사업장이 정해져 있고 주소를 적는다. */
    body = (f.fromCo
      ? '<div class="fxr"><label>보낸이</label>'
        + '<input type="text" value="' + esc(f.from) + '" placeholder="hr@company.kr"'
        + ' oninput="if(App.fix)App.fix.from=this.value"></div>'
      : '<div class="fxr"><label>보낸이</label><b>' + esc(f.from) + '</b></div>')
      + '<div class="fxr"><label>사업장</label><select onchange="fixSet(\'coId\',this.value)">'
      + '<option value="">— 급여 사업장 —</option>'
      + pay.slice().sort((a, b) => String(a.name).localeCompare(String(b.name), 'ko'))
        .map(c => '<option value="' + esc(c.id) + '"' + (f.coId === c.id ? ' selected' : '') + '>'
          + esc(c.name) + '</option>').join('')
      + '</select></div>'
      + '<div class="fxr"><label>담당자 이름</label>'
      + '<input type="text" value="' + esc(f.name) + '" placeholder="비워 두면 주소만 넣습니다"'
      + ' oninput="if(App.fix)App.fix.name=this.value"></div>';
  }
  /* 사업장 화면에서 열었으면 **주소를 적어야** 넣을 수 있다 — 사업장은 이미 정해졌다 */
  const can = f.kind === 'owner' ? !!f.sid
    : (f.fromCo ? (!!f.coId && !!String(f.from || '').trim()) : !!f.coId);
  return '<div class="fxbg" onclick="closeFix()"></div>'
    + '<div class="fxbox">'
    + '<div class="fxh">' + (f.kind === 'owner' ? '👤 주담당 정하기' : '✉️ 주소 넣기')
    + '<button class="btn sm" onclick="closeFix()">닫기</button></div>'
    + body
    + (f.err ? '<div class="fxerr">' + esc(f.err) + '</div>' : '')
    + '<div class="fxa">'
    + '<button class="btn pri"' + (can && !f.busy ? '' : ' disabled') + ' onclick="saveFix()">'
    + (f.busy ? '넣는 중…' : '업체관리에 넣기') + '</button>'
    + (f.coId ? '<button class="btn" onclick="goErpCompany(\'' + jsq(f.coId) + '\')">푸른이알피에서 열기 →</button>' : '')
    + '</div>'
    + '<div class="fxn">업체관리의 그 사업장에 바로 들어갑니다 — 푸른이알피에서 본 것과 같은 칸입니다.</div>'
    + '</div>';
}
window.fixHtml = fixHtml;

/* 내 대기 칸을 다시 읽어 화면을 맞춘다 — 안 읽으면 방금 맡은 것이 대기 칸에서
   안 보여 「사라졌다」고 읽는다. */
function refreshMailAndPending() {
  return ensureMail(true)
    .then(() => S.listMyPending(App.viewingUid))
    .then(p => { App.pending = p; App.render(); })
    .catch(e => console.warn('[대기 칸]', e && e.code));
}

/* 맡기 — 공용 칸에서 빼고 내 대기 칸으로. 진 사람에게는 그 사실을 말한다. */
function claimMail(id) {
  if (!canWrite()) return;
  return S.claimSharedSafe(id).then(ok => {
    if (!ok) alert('방금 다른 분이 맡았습니다.\n목록을 새로 읽습니다.');
    return refreshMailAndPending();
  }).catch(e => alert('맡지 못했습니다 — ' + (e.code || e.message)));
}
window.claimMail = claimMail;

function bulkClaimMail() {
  if (!canWrite()) return;
  const rows = mailRows(App.mail, mailCtx());
  const ids = pickList(pickOf('mail'), rows.map(r => r.id));
  if (!ids.length) return;
  if (!confirm(ids.length + '건을 내 대기 칸으로 가져올까요?')) return;
  /* ⚠ 한 건씩 차례로 한다. 한 묶음으로 쓰면 그중 하나를 남이 먼저 맡았을 때
     **나머지까지 통째로** 안 들어온다 — 진 것만 빼고 나머지는 가져온다. */
  let got = 0, lost = 0;
  const step = i => {
    if (i >= ids.length) return Promise.resolve();
    return S.claimSharedSafe(ids[i]).then(ok => { ok ? got++ : lost++; }, () => { lost++; })
      .then(() => step(i + 1));
  };
  return step(0).then(() => {
    pickPut('mail', {});
    alert(got + '건을 대기 칸으로 가져왔습니다.'
      + (lost ? '\n' + lost + '건은 다른 분이 먼저 맡았습니다.' : ''));
    return refreshMailAndPending();
  });
}
window.bulkClaimMail = bulkClaimMail;

/* ══════ 사업장 서랍 (Task 9) — 사진첩과 같은 틀고정 탭·찾기 줄·확대 보기 ══════ */

/* 근로계약서(keep)는 귀속월과 무관한 다른 칸에 있다 — 그 칸의 자료까지 세어야
   「근로계약서 3」처럼 탭에 정확한 장수가 뜬다. 두 칸(keep·이 달)을 함께 받는다. */
function drawerCounts(itemsKeep, itemsMonth, companyId) {
  const counts = {};
  S.KINDS.forEach(k => {
    const box = k.keep ? (itemsKeep || {}) : (itemsMonth || {});
    counts[k.key] = Object.keys(box).filter(id => {
      const r = box[id];
      return r && r.companyId === companyId && r.kind === k.key;
    }).length;
  });
  return counts;
}

/* 지금 고른 탭(kind)에 맞는 칸만 본다 — keep 탭이면 keep 칸, 아니면 이 달 칸. */
function drawerModel(itemsKeep, itemsMonth, companyId, kind, now) {
  const box = S.isKeepKind(kind) ? (itemsKeep || {}) : (itemsMonth || {});
  const rows = Object.keys(box).map(id => {
    const r = box[id];
    return Object.assign({ id: id, expired: S.isExpired(r, now) }, r);
  }).filter(r => r.companyId === companyId && r.kind === kind)
    .sort((a, b) => (Number(b.filedAt || 0) - Number(a.filedAt || 0)));
  return { rows: rows };
}

/* 파일 이름으로 좁힌다 — 사진첩의 찾기 줄과 같은 자리(탭 바로 아래)에 둔다. */
function searchRows(rows, query) {
  const q = String(query || '').trim().toLowerCase();
  if (!q) return rows || [];
  return (rows || []).filter(r => String(r.filename || '').toLowerCase().indexOf(q) >= 0);
}

/* ══════ 내 폴더 (사진첩과 같은 방식) ══════
   탭이 「무엇인가」라면 폴더는 「어느 일인가」다. 지금 고른 탭의 자료(rows)
   안에서만 센다 — 탭을 넘나들면 세는 대상도 달라진다(사진첩과 같은 방식). */
function folderCounts(rows) {
  const counts = { all: (rows || []).length };
  (rows || []).forEach(r => { if (r && r.folder) counts[r.folder] = (counts[r.folder] || 0) + 1; });
  return counts;
}

/* 'all' 이면 다 보여준다. 폴더를 고르면 그 폴더로 이름표가 붙은 것만. */
function folderRows(rows, folderPick) {
  if (!folderPick || folderPick === 'all') return rows || [];
  return (rows || []).filter(r => r && r.folder === folderPick);
}

/* keep 칸은 한 번만, 이 달 칸은 달이 바뀔 때만 다시 읽는다 — 매번 두 칸을
   전부 새로 읽으면 탭만 눌러도 실시간DB를 불필요하게 두드린다. */
/* ── 이 업체를 맡은 사람들의 자리 (대표 지시 2026-08-17 「각각 자기 사업장」) ──
   담기는 늘 자기 자리인데 서랍은 자기 자리만 보여, 부담당이 열면 주담당이 담아
   둔 것이 안 보였다(줄에는 3장, 서랍은 0건). 맡은 사람 자리를 모아 읽는다.
   ⚠ **지금 보고 있는 자리를 맨 앞**에 둔다 — 자료 번호가 겹칠 때 지금 자리 것이
   먼저 자리를 잡아야, 내가 담은 것이 남의 것에 가려지지 않는다.
   ⚠ 아직 이 함에 안 들어온 담당자는 자리가 없어 빠진다(uid 가 없다). */
function drawerSeats() {
  const here = seatNow();
  const out = [here];
  const co = (App.companies || []).filter(c => c.id === App.companyId)[0];
  if (co) {
    const roster = S.managerRoster(App.companies, App.dir, App.owners);
    roster.people.forEach(p => {
      if (!p.uid) return;
      if (p.companies.some(c => c.id === App.companyId)) out.push(p.uid);
    });
  }
  /* 빈 문자열은 「내 자리」다 — 실제 uid 로 바꿔 두어야 겹치는 것을 걸러낼 수 있다.
     ⚠ 겹치는 것을 반드시 뺀다 — 안 빼면 주담당이 자기 업체를 열었을 때 「함께 맡은
     업체 — 김보람·김보람」이라고 뜬다. */
  const seen = {};
  return out.map(u => u || S.myUid()).filter(u => {
    if (!u || seen[u]) return false;
    seen[u] = 1; return true;
  });
}

/* ══════ 지금 열어 둔 서랍만 지켜본다 (대표 지시 2026-08-17) ══════
   남이 담은 것이 새로고침 전까지 안 보였다 — 다섯이 같이 일하면 「방금 올렸다는데
   안 보인다」가 난다.
   ⚠ **전체를 지켜보지 않는다.** 다섯이 각자 112곳을 계속 받으면 요금이 된다.
   지금 보고 있는 그 업체·그 달의 **도착 칸**(얇다)만 지켜보고, 그것이 바뀌면
   그때 서랍을 다시 읽는다 — 담기·버리기가 도착 칸을 함께 고치므로 이 하나로
   「남이 무언가 했다」를 안다.
   ⚠ 폴더만 옮긴 것은 도착 칸이 안 바뀌어 안 따라온다 — 남이 옮긴 폴더는 어차피
   내가 못 고치는 것이라 그대로 둔다.
   ⚠ 끊기를 반드시 해야 한다. 안 끊으면 서랍을 옮길 때마다 지켜보기가 하나씩
   쌓여, 한 번 담을 때 열 번 그려진다. */
let drawerWatch = null;      // { key, off }

function watchDrawer() {
  const key = App.screen === 'drawer' && App.companyId
    ? App.companyId + '|' + (S.isKeepKind(App.kind) ? S.KEEP : (S.monthKey(App.month) || S.KEEP))
    : '';
  if (drawerWatch && drawerWatch.key === key) return;   // 이미 그 자리를 보고 있다
  if (drawerWatch) { drawerWatch.off(); drawerWatch = null; }
  if (!key) return;
  const [companyId, slot] = key.split('|');
  let first = true;
  const off = S.watchArrival(companyId, slot, node => {
    putArrival(companyId, slot, node);
    /* 처음 오는 값은 이미 손에 든 것과 같다 — 그때는 다시 안 읽는다(안 그러면
       서랍을 열 때마다 두 번 읽는다). */
    if (first) { first = false; App.render(); return; }
    App.itemsKeep = null; App.itemsMonth = null; App.itemsMonthSlot = '';
    ensureDrawerData();
    App.render();
  });
  drawerWatch = { key: key, off: off };
}
window.watchDrawer = watchDrawer;

function unwatchDrawer() {
  if (drawerWatch) { drawerWatch.off(); drawerWatch = null; }
}
window.unwatchDrawer = unwatchDrawer;

function ensureDrawerData() {
  if (!App.month) App.month = thisMonth();
  const monthSlot = S.monthKey(App.month) || S.KEEP;
  const seat = seatNow();               // 늦게 온 답을 버리려고 지금 자리를 적어 둔다
  const seats = drawerSeats();
  const jobs = [];
  if (!App.itemsKeep) {
    jobs.push(S.listSlotMany(S.KEEP, seats).then(v => { if (seatSame(seat)) App.itemsKeep = v; })
      .catch(e => { console.warn('[서랍·keep]', e && e.code); if (seatSame(seat)) App.itemsKeep = {}; }));
  }
  if (App.itemsMonthSlot !== monthSlot) {
    jobs.push(S.listSlotMany(monthSlot, seats).then(v => { if (seatSame(seat)) { App.itemsMonth = v; App.itemsMonthSlot = monthSlot; } })
      .catch(e => { console.warn('[서랍·' + monthSlot + ']', e && e.code); if (seatSame(seat)) { App.itemsMonth = {}; App.itemsMonthSlot = monthSlot; } }));
  }
  if (jobs.length) Promise.all(jobs).then(() => { if (seatSame(seat)) App.render(); });
}

/* 이 줄을 지금 자리에서 고칠 수 있나 — 내가 담은 것만이다.
   ⚠ 남의 자리 자료는 파이어베이스 규칙이 쓰기를 막는다. 단추를 그대로 두면
   눌러도 실패만 하므로 화면에서 미리 갈라 준다(숨기지는 않는다 — 안 보이면
   「왜 나만 안 되지」가 아니라 「화면이 고장났나」가 된다). */
/* 자리(uid) → 사람 이름. 못 찾으면 「다른 담당자」로 둔다 — 알 수 없는 번호를
   그대로 보여 주면 무슨 말인지 알 수 없다. */
function byName(uid) {
  if (!uid) return '';
  const o = (App.owners || {})[uid];
  return (o && o.name) || '다른 담당자';
}
window.byName = byName;

function canEditRow(r) {
  if (!canWrite()) return false;
  const here = seatNow() || S.myUid();
  return !r || !r._by || r._by === here;
}
window.canEditRow = canEditRow;

/* 기준 월을 바꾼다 — 서랍만 다시 읽고 끝내면 안 된다. 값은 「이 달」 것이라
   달이 바뀌면 들고 있던 값이 통째로 지난달 것이 된다. 그 수를 급여관리에
   알리면 이 달이 정리된 것으로 잘못 적힌다(handoffMonth 머리말). */
function changeMonth(v) {
  App.month = v;
  App.values = null;
  ensureDrawerData();
  watchDrawer();      // 달이 바뀌면 지켜보는 자리도 바뀐다
  App.render();
}
window.changeMonth = changeMonth;

/* 사업장이 바뀌면 폴더 목록도 다시 읽는다 — 폴더는 사업장마다 따로 관리된다. */
function ensureFolders(force) {
  if (!force && App.foldersCompanyId === App.companyId) return Promise.resolve();
  const seat = seatNow(), want = App.companyId;
  return S.listFolders(want, seat).then(v => {
    if (!seatSame(seat) || App.companyId !== want) return;   // 자리·사업장이 바뀌었다 — 버린다
    App.folders = v; App.foldersCompanyId = want; App.render();
  }).catch(e => {
    console.warn('[폴더]', e && e.code);
    if (!seatSame(seat) || App.companyId !== want) return;
    App.folders = {}; App.foldersCompanyId = want;
  });
}

/* 폴더 칸 — 전체 + 내가 만든 폴더들(한 단계 하위폴더까지). 점선 테두리로
   "직접 만든 것"임을 가른다(사진첩과 같은 방식). */
function folderBar(folders, folderPick, counts) {
  const f = folders || {};
  const byAge = (a, b) => (f[a].createdAt || 0) - (f[b].createdAt || 0);
  const tops = Object.keys(f).filter(id => !f[id].parent).sort(byAge);
  const kidsOf = pid => Object.keys(f).filter(id => f[id].parent === pid).sort(byAge);
  const editable = canWrite();
  const chip = (fid, label, n, sub) =>
    '<button class="' + (folderPick === fid ? 'on' : '') + (sub ? ' sub' : '') + '" onclick="pickFolder(\''
    + esc(fid) + '\')">' + esc(label) + '<span class="n">' + (n || 0) + '</span>'
    + (fid !== 'all' && editable ? '<span class="dots" title="이름 바꾸기·하위폴더·지우기"'
      + ' onclick="event.stopPropagation();folderMenu(event,\'' + esc(fid) + '\')">⋯</span>' : '') + '</button>';

  let h = '<div class="foldbar">';
  h += chip('all', '📁 전체', counts.all, false);
  if (editable && App.folderEdit.mode === 'new') h += folderEditorHtml(false);
  tops.forEach(fid => {
    if (editable && App.folderEdit.mode === 'rename' && App.folderEdit.fid === fid) h += folderEditorHtml(false);
    else h += chip(fid, '📁 ' + (f[fid].name || ''), counts[fid], false);
    kidsOf(fid).forEach(kid => {
      if (editable && App.folderEdit.mode === 'rename' && App.folderEdit.fid === kid) h += folderEditorHtml(true);
      else h += chip(kid, '↳ ' + (f[kid].name || ''), counts[kid], true);
    });
    if (editable && App.folderEdit.mode === 'sub' && App.folderEdit.fid === fid) h += folderEditorHtml(true);
  });
  if (editable && App.folderEdit.mode !== 'new') h += '<button class="add" onclick="openFolderEditor(\'new\')">＋ 폴더</button>';
  h += '</div>';
  return h;
}

/* 이름 적는 칸을 그 자리에 연다(사진첩과 같은 방식, 브라우저 prompt 대신) —
   누른 자리와 적는 자리가 멀면 헷갈린다. */
function folderEditorHtml(sub) {
  return '<span class="foldedit' + (sub ? ' sub' : '') + '">'
    + '<input id="foldInput" type="text" maxlength="30" placeholder="폴더 이름"'
    + ' value="' + esc(App.folderEdit.value || '') + '" onkeydown="foldKeyDown(event)">'
    + '<button onclick="submitFolderEditor()">✓</button>'
    + '<button onclick="cancelFolderEditor()">✕</button></span>';
}

function openFolderEditor(mode, fid, value) {
  App.folderEdit = { mode: mode, fid: fid || '', value: value || '' };
  App.render();
  setTimeout(() => { const el = $('foldInput'); if (el) { el.focus(); el.select(); } }, 0);
}
function cancelFolderEditor() { App.folderEdit = { mode: '', fid: '', value: '' }; App.render(); }
function foldKeyDown(e) {
  if (e.key === 'Enter') { e.preventDefault(); submitFolderEditor(); }
  else if (e.key === 'Escape') { e.preventDefault(); cancelFolderEditor(); }
}
function submitFolderEditor() {
  const inp = $('foldInput');
  const name = inp ? String(inp.value || '').trim() : '';
  const mode = App.folderEdit.mode, fid = App.folderEdit.fid;
  // 빈 이름은 그냥 접는다 — 지우기가 아니다(지우기는 ⋯ 차림표에 따로 있다).
  if (!name) { cancelFolderEditor(); return; }
  App.folderEdit = { mode: '', fid: '', value: '' };
  if (mode === 'rename') {
    S.renameFolder(App.companyId, fid, name, App.viewingUid).then(() => ensureFolders(true))
      .catch(e => { alert('이름을 바꾸지 못했습니다 — ' + (e.message || e)); App.render(); });
    return;
  }
  S.addFolder(App.companyId, name, mode === 'sub' ? fid : null, App.viewingUid).then(r =>
    ensureFolders(true).then(() => { App.folderPick = r.id; App.render(); })
  ).catch(e => { alert('폴더를 만들지 못했습니다 — ' + (e.message || e)); App.render(); });
}

/* ⋯ 차림표 — 이름 바꾸기·하위폴더 만들기·지우기를 한자리에. */
function folderMenu(ev, fid) {
  closeFolderMenu();
  const f = (App.folders || {})[fid] || {};
  const m = document.createElement('div');
  m.className = 'foldmenu'; m.id = 'foldMenu';
  m.innerHTML = '<div onclick="renameFolderAsk(\'' + esc(fid) + '\')">✏ 이름 바꾸기</div>'
    + (f.parent ? '' : '<div onclick="openFolderEditor(\'sub\',\'' + esc(fid) + '\')">📁 하위폴더 만들기</div>')
    + '<div class="del" onclick="removeFolderAsk(\'' + esc(fid) + '\')">🗑 폴더 지우기</div>';
  document.body.appendChild(m);
  const r = ev.target.getBoundingClientRect();
  m.style.left = Math.min(r.left, window.innerWidth - 170) + 'px';
  m.style.top = (r.bottom + 4) + 'px';
  setTimeout(() => document.addEventListener('click', closeFolderMenu, { once: true }), 0);
}
function closeFolderMenu() { const m = $('foldMenu'); if (m && m.parentNode) m.parentNode.removeChild(m); }
function renameFolderAsk(fid) { closeFolderMenu(); openFolderEditor('rename', fid, ((App.folders || {})[fid] || {}).name || ''); }
function removeFolderAsk(fid) {
  closeFolderMenu();
  if (!canWrite()) return;
  if (!confirm('이 폴더를 지울까요?\n담긴 자료는 지워지지 않고 「전체」에 그대로 남습니다.')) return;
  S.deleteFolder(App.companyId, fid, App.viewingUid).then(() => {
    if (App.folderPick === fid) App.folderPick = 'all';
    return ensureFolders(true);
  }).catch(e => { alert('지우지 못했습니다 — ' + (e.message || e)); App.render(); });
}
function pickFolder(fid) { App.folderPick = fid; App.render(); }

/* 자료 한 건을 폴더에 넣거나(folderId) 뺀다('' 로 부르면 뺀다).
   서버에 쓰는 동안 화면이 멈추지 않게, 저장이 끝나면 우리가 들고 있는 자료에도
   바로 반영해 다시 읽지 않고 새로고침한다. */
function assignFolder(id, folderId) {
  const row = findRow(id);
  /* ⚠ 남이 담은 줄은 그 사람 자리에 있다 — 규칙이 쓰기를 막으므로 눌러도 실패만
     한다. 화면이 이미 갈라 보여 주지만, 여기서도 한 번 더 막는다. */
  if (!canEditRow(row)) return;
  const slot = S.isKeepKind(App.kind) ? S.KEEP : (S.monthKey(App.month) || S.KEEP);
  S.setFolder(slot, id, folderId, App.viewingUid).then(() => {
    const box = S.isKeepKind(App.kind) ? App.itemsKeep : App.itemsMonth;
    if (box && box[id]) box[id].folder = folderId || null;
    App.render();
  }).catch(e => alert('저장 실패: ' + (e.code || e.message) + '\n다시 시도해 주세요.'));
}
/* ══════ 골라서 한꺼번에 — 서랍 (대표 승인 2026-08-15) ══════ */

/* 고른 자료를 한 폴더로 옮기거나 폴더에서 뺀다('').
   차림표 첫 줄('__')은 안내문이라 아무 일도 하지 않는다. */
function bulkSetFolder(folderId) {
  if (!canWrite() || folderId === '__') return;
  /* 남이 담은 줄은 빼고 내 것만 옮긴다 — 한 묶음에 남의 자리를 섞으면 규칙이
     **통째로** 거절해, 내 것까지 안 옮겨진다. 몇 건을 뺐는지는 말해 준다. */
  const all = pickList(pickOf('drawer'), pickVisible('drawer'));
  const ids = all.filter(id => canEditRow(findRow(id)));
  const skipped = all.length - ids.length;
  if (!ids.length) {
    if (skipped) alert('고른 ' + skipped + '건은 다른 담당자가 담은 것이라 여기서는 못 옮깁니다.');
    return;
  }
  const slot = S.isKeepKind(App.kind) ? S.KEEP : (S.monthKey(App.month) || S.KEEP);
  const box = S.isKeepKind(App.kind) ? App.itemsKeep : App.itemsMonth;
  S.setFolderMany(slot, ids, folderId, App.viewingUid).then(() => {
    if (skipped) alert(skipped + '건은 다른 담당자가 담은 것이라 그대로 두었습니다.');
    ids.forEach(id => { if (box && box[id]) box[id].folder = folderId || null; });
    pickPut('drawer', {});
    App.render();
  }).catch(e => alert('저장 실패: ' + (e.code || e.message) + '\n다시 시도해 주세요.'));
}
window.bulkSetFolder = bulkSetFolder;

/* 고른 자료를 한꺼번에 휴지통으로. 쓰기는 한 번이다 — 절반만 지워진 채로
   끊기면 어디까지 갔는지 아무도 모른다. 창고 파일은 건드리지 않는다. */
function bulkDrawerTrash() {
  if (!canWrite()) return;
  /* 내가 담은 것만 버린다 — 남의 자리를 한 묶음에 섞으면 규칙이 통째로 거절해
     내 것까지 안 버려진다. */
  const all = pickList(pickOf('drawer'), pickVisible('drawer'));
  const ids = all.filter(id => canEditRow(findRow(id)));
  const skipped = all.length - ids.length;
  if (!ids.length) {
    if (skipped) alert('고른 ' + skipped + '건은 다른 담당자가 담은 것이라 여기서는 못 버립니다.');
    return;
  }
  if (!confirm(ids.length + '건을 휴지통으로 옮길까요?\n'
    + (skipped ? '(다른 담당자가 담은 ' + skipped + '건은 그대로 둡니다)\n' : '')
    + S.TRASH_DAYS + '일 안에는 되살릴 수 있습니다.')) return;
  const up = {};
  ids.forEach(id => {
    const rec = findRow(id);
    if (!rec) return;
    const one = S.trashUpdate(id, rec, App.viewingUid);
    Object.keys(one).forEach(k => { up[k] = one[k]; });
  });
  db.ref().update(up).then(() => {
    ids.forEach(id => {
      if (App.itemsKeep && App.itemsKeep[id]) delete App.itemsKeep[id];
      if (App.itemsMonth && App.itemsMonth[id]) delete App.itemsMonth[id];
    });
    pickPut('drawer', {});
    App.trash = null;
    refreshArrivals(App.companyId, App.month);     // 지금 열어 둔 그 자리만
    App.render();
  }).catch(e => alert('실패: ' + (e.code || e.message)));
}

/* ══════ 월별 값 표 (설계서 4장) ══════
   값은 종류를 가로지른다 — 근태에서 나온 값과 급여대장에서 나온 값이 한 표에
   섞이므로 서랍 탭이 아니라 별도 화면이다.
   사람이 한 줄, 항목이 가로. 바깥 급여프로그램에 넣기 좋은 모양이다. */
function valueGridModel(valueRows) {
  const box = valueRows || {};
  const items = [], seenItem = {};
  const people = [], byName = {};
  /* Firebase .val()의 키 차례는 저장 차례를 보장하지 않는다 — 이 순서 그대로
     돌면 열 순서가 새로고침마다 바뀔 수 있고, 더 나쁘게는 같은 사람·같은
     항목이 서류 두 장(근태표·급여대장 등)에서 나왔을 때 어느 값이 남을지도
     그때그때 달라진다(아래 p.cells[item] = ... 는 뒤에 온 값이 이긴다).
     그래서 저장 시각(at) 오름차순으로 미리 줄을 세운다 — 시각이 같으면 id로
     한 번 더 줄을 세워 흔들리지 않게 한다. 이러면 "가장 나중에 저장한 값이
     이긴다"로 고정되어, 이 앱 다른 곳의 덮어쓰기 방식과 같아진다. */
  const ids = Object.keys(box).sort((a, b) => {
    const at1 = Number((box[a] && box[a].at) || 0);
    const at2 = Number((box[b] && box[b].at) || 0);
    if (at1 !== at2) return at1 - at2;
    return a < b ? -1 : (a > b ? 1 : 0);
  });
  ids.forEach(id => {
    const r = box[id];
    if (!r || !r.name) return;
    let p = byName[r.name];
    if (!p) { p = byName[r.name] = { name: r.name, cells: {} }; people.push(p); }
    (r.pairs || []).forEach(pr => {
      if (!pr || !pr.item) return;
      if (!seenItem[pr.item]) { seenItem[pr.item] = 1; items.push(pr.item); }
      /* rowId·item 을 함께 담는다 — 저장한 값을 고치거나 지울 때 **어느 줄의**
         어느 항목인지 알아야 한다(대표 승낙 2026-08-21 안 A). 같은 사람·같은
         항목이 서류 두 장에서 나오면 나중 값이 이기므로, 여기 담기는 rowId 도
         자연히 **화면에 보이는 그 값**의 줄이 된다. */
      p.cells[pr.item] = { value: pr.value, sourceId: r.sourceId || '', confirmed: !!r.confirmed,
        rowId: id, item: pr.item };
    });
  });
  return { items: items, people: people };
}

/* 이 달 값을 **서류별로** 묶는다 — 「판독 취소」 목록이 쓴다(대표 승낙 2026-08-21 안 C).
   서류 한 장이 통째로 잘못 읽혔을 때 한 칸씩 고치는 것은 너무 느리다.
   출처가 없는 줄(직접 적은 값)도 빈 출처로 한 묶음 만든다 — 숨기면 지울 길이 없다.
   최근 판독한 것이 위로 온다(at 내림차순). */
function valueSourceRows(valueRows) {
  const box = valueRows || {};
  const by = {};
  Object.keys(box).forEach(id => {
    const r = box[id];
    if (!r || !r.name) return;
    const sid = String(r.sourceId || '');
    let g = by[sid];
    if (!g) g = by[sid] = { sourceId: sid, cells: 0, names: {}, people: 0, at: 0, confirmed: true };
    g.cells += (r.pairs || []).filter(pr => pr && pr.item).length;
    if (!g.names[r.name]) { g.names[r.name] = 1; g.people++; }
    g.at = Math.max(g.at, Number(r.at || 0));
    /* 한 줄이라도 확인 안 됐으면 그 서류는 「미확인」이다 — 다 확인됐다고
       하면 노란 칸이 남아 있는데도 끝난 줄 안다. */
    if (!r.confirmed) g.confirmed = false;
  });
  return Object.keys(by).map(k => by[k]).sort((a, b) => b.at - a.at);
}

/* 이 사업장·이 달 값을 실시간DB에서 **그 자리에서 새로** 읽어 온다.
   화면이 들고 있는 App.values 는 값 표 화면에 들어갈 때만 채워진다 — 업체를
   바꾸거나 기준 월을 바꾸는 길에는 서랍만 다시 읽는다. 그래서 세어야 할 때는
   화면 상태를 믿지 말고 여기로 다시 읽는다(급여관리 알리기가 이것을 쓴다). */
function fetchValues(companyId) {
  const slot = S.monthKey(App.month) || S.KEEP;
  const want = companyId || App.companyId;
  return S.listValues(slot, App.viewingUid).then(v => {
    /* 이 사업장 것만 남긴다 — 값 칸은 그 달 전체가 한 자리에 있다. */
    const mine = {};
    Object.keys(v || {}).forEach(id => {
      if (v[id] && v[id].companyId === want) mine[id] = v[id];
    });
    return mine;
  });
}

/* 값 표 화면이 쓸 값을 읽어 App.values 에 담는다. 읽는 동안에는 null 로 비운다 —
   App.go('values') 가 이 함수를 부른 **뒤 곧바로** App.render() 하므로, 앞
   사업장 값을 그대로 두면 한 판 동안 남의 근로자 이름이 이 사업장 제목 밑에 뜬다
   (그 사이에 「엑셀로 내려받기」를 누르면 이 사업장 이름을 단 파일에 남의 이름이
   담긴다). 읽는 중에 다른 사업장으로 옮겨 갔으면 늦게 온 답은 버린다. */
function ensureValues() {
  App.values = null;
  const want = App.companyId;
  return fetchValues(want).then(v => {
    if (App.companyId !== want) return;
    App.values = v; App.render();
  }).catch(e => {
    console.warn('[값]', e && e.code);
    if (App.companyId !== want) return;
    App.values = {}; App.render();
  });
}

function screenValues() {
  let h = '<div style="margin-bottom:10px"><button class="btn" onclick="App.go(\'drawer\')">← 서랍으로</button></div>'
    + '<h1>' + esc(App.companyName || App.companyId) + ' — ' + esc(App.month) + ' 값</h1>';

  /* 아직 안 읽었으면(null) 표를 그리지 않는다 — 「값이 없습니다」도 아니다.
     앞 사업장에서 보던 줄이 이 제목 밑에 남는 것이 가장 나쁘다(내려받기까지 된다). */
  if (App.values === null) {
    return h + '<div class="card"><div class="empty">값을 불러오는 중입니다…</div></div>';
  }

  const g = valueGridModel(App.values);
  const iffy = g.people.reduce((n, p) =>
    n + Object.keys(p.cells).filter(k => !p.cells[k].confirmed).length, 0);

  h += '<div class="sub">근로자 ' + g.people.length + '명 · 항목 ' + g.items.length + '가지</div>';

  if (!g.people.length) {
    return h + '<div class="card"><div class="empty">아직 정리된 값이 없습니다.<br>'
      + '서랍에서 서류를 열고 「판독하기」를 눌러 주세요.</div></div>';
  }

  if (iffy) {
    h += '<div class="warnline" style="margin-bottom:12px">⚠ <b>확인 안 된 값이 ' + iffy
      + '개</b> 있습니다. 노란 칸을 눌러 원본과 견주어 주세요.</div>';
  }

  h += '<div class="bar" style="display:flex;gap:8px;margin-bottom:12px">'
    + '<button class="btn" onclick="valuesCsv()">⬇ 엑셀로 내려받기</button>'
    + '<button class="btn" onclick="valuesCopy()">📋 표 복사</button></div>';

  h += '<div class="card" style="overflow-x:auto"><table class="grid">'
    + '<tr><th>근로자</th>' + g.items.map(i => '<th>' + esc(i) + '</th>').join('') + '</tr>';
  g.people.forEach(p => {
    h += '<tr><td class="who">' + esc(p.name) + '</td>'
      + g.items.map(i => {
        const c = p.cells[i];
        if (!c) return '<td class="num">－</td>';
        /* 출처가 없는 값은 눌러도 열 원본이 없다 — src 클래스(커서·밑줄·hover)를
           안 붙여야 "눌러도 되는 척"하지 않는다. */
        /* 이제 **모든 칸**을 누를 수 있다 — 원본이 있으면 옆에 두고 견주며 고치고,
           없으면(직접 적은 값) 창 하나로 고친다. 예전에는 원본 있는 칸만 눌려
           직접 적은 값은 손댈 길이 아예 없었다. */
        return '<td class="num src' + (c.confirmed ? '' : ' iffy') + '"'
          + ' onclick="openValueFix(\'' + jsq(c.rowId) + '\',\'' + jsq(c.item) + '\')"'
          + ' title="눌러서 고치거나 지웁니다">' + esc(c.value) + '</td>';
      }).join('') + '</tr>';
  });
  h += '</table></div>';

  /* 이 달 값을 만든 서류 — 판독 취소(안 C). 어느 서류가 몇 칸을 만들었는지
     여기서 처음으로 보인다. 서류 한 장이 통째로 잘못 읽혔을 때 한 번에 걷는다. */
  const srcs = valueSourceRows(App.values);
  if (srcs.length) {
    h += '<h1 style="font-size:15px;margin-top:22px">이 달 값을 만든 서류'
      + ' <span class="sub" style="margin:0;font-weight:400">' + srcs.length + '장</span></h1>'
      + '<div class="sub">서류 하나가 통째로 잘못 읽혔으면 「판독 취소」로 그 값만 걷습니다.'
      + ' <b>원본 사진·파일은 지워지지 않습니다</b> — 곧바로 다시 판독할 수 있습니다.</div>'
      + '<div class="card">' + srcs.map(g => {
        const rec = g.sourceId ? findRow(g.sourceId) : null;
        const nm = rec ? (rec.filename || g.sourceId) : (g.sourceId ? '(서랍에 없는 서류)' : '직접 적은 값');
        return '<div class="row">'
          + '<span class="chip" style="background:' + (g.confirmed ? 'var(--ok)' : 'var(--warn)') + '">'
          + (g.confirmed ? '확인' : '미확인') + '</span>'
          + '<b style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
          + esc(nm) + '</b>'
          + '<span class="sub" style="margin:0">' + g.people + '명 · ' + g.cells + '칸</span>'
          + (g.sourceId && rec
            ? '<button class="btn sm" onclick="openViewer(\'' + jsq(g.sourceId) + '\')">원본</button>' : '')
          + (canWrite()
            ? '<button class="btn sm" style="color:var(--bad)" onclick="cancelValueSource(\''
              + jsq(g.sourceId) + '\',\'' + jsq(nm) + '\',' + g.cells + ')">판독 취소</button>' : '')
          + '</div>';
      }).join('') + '</div>';
  }
  return h;
}

/* 만든 파일을 내려받게 한다. 주소는 바로 되돌려 준다 — 안 하면 기억이 샌다. */
function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* 쉼표·따옴표·줄바꿈이 든 칸을 감싼다 — 안 감싸면 엑셀에서 열이 밀린다.
   (사진첩 근태표에서 쓰던 것과 같은 방식) */
function csvEsc(v) {
  const s = String(v == null ? '' : v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

/* 내보낼 표 한 벌 — 내려받기와 복사가 같은 것을 쓴다(두 벌로 두면 어긋난다). */
function valuesTable() {
  const g = valueGridModel(App.values);
  return {
    title: [App.companyName + ' ' + App.month + ' 값'],
    head: ['근로자'].concat(g.items),
    body: g.people.map(p => [p.name].concat(g.items.map(i => (p.cells[i] ? p.cells[i].value : ''))))
  };
}

function valuesCsv() {
  const t = valuesTable();
  /* ⚠ 머리글 줄도 몸통과 **똑같이** 감싼다. 항목 이름은 서류에 적힌 그대로 담기므로
     (「비고(가,나)」처럼) 쉼표가 들어올 수 있다 — 안 감싸면 그 줄만 칸이 하나 늘어
     그 아래 모든 열이 통째로 밀린다. 제목 줄은 이미 감싸고 있었다. */
  const lines = [csvEsc(t.title.join(''))].concat([t.head.map(csvEsc).join(',')])
    .concat(t.body.map(r => r.map(csvEsc).join(',')));
  const name = ('값_' + App.companyName + '_' + App.month).replace(/[\\/:*?"<>|\s]+/g, '_');
  /* ﻿ 는 BOM — 없으면 엑셀이 한글을 깨뜨린다 */
  saveBlob(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }), name + '.csv');
}

function valuesCopy() {
  const t = valuesTable();
  const tsv = [t.head.join('\t')].concat(t.body.map(r => r.join('\t'))).join('\n');
  navigator.clipboard.writeText(tsv).then(
    () => alert('표를 복사했습니다 — 엑셀이나 급여프로그램에 붙여넣으세요.'),
    () => alert(tsv));
}
window.valuesCsv = valuesCsv; window.valuesCopy = valuesCopy;

/* ── 월 줄 (대표 지시 2026-08-17 「월별로 간략히 볼 수 있게」) ──
   예전에는 「2026-08」을 손으로 고쳐 적어야 했다. 최근 여섯 달을 늘어놓고
   **그 달에 몇 장 있는지**를 함께 보여 준다 — 눌러서 옮기고 ◀▶ 로 더 예전을 본다.
   빈 칸일 때 특히 쓸모 있다: 「없습니다」만 뜨던 자리에서 「5월·6월에는 있다」를
   바로 알 수 있다.
   ⚠ 장수는 **도착 칸**에서 센다(사업장 목록과 같은 자리) — 서랍을 달마다 열어
   보지 않아도 알 수 있는 유일한 길이다. */
function monthShift(base, delta) {
  const k = S.monthKey(base) || S.monthKey(thisMonth());
  const y = parseInt(k.slice(0, 4), 10), mo = parseInt(k.slice(4), 10);
  const d = new Date(y, mo - 1 + delta, 1);
  return d.getFullYear() + '-' + (d.getMonth() + 1 < 10 ? '0' : '') + (d.getMonth() + 1);
}
window.monthShift = monthShift;

/* 그 사업장·그 달에 몇 장 왔나 — 종류를 다 더한다.
   companyId 를 안 주면(첫 화면처럼) monthIds 에 적힌 사업장들을 다 더한다 —
   「이 보기에서 그 달에 몇 장」이라 사업장 목록에서도 같은 줄을 쓸 수 있다. */
function monthCount(companyId, month) {
  const slot = S.monthKey(month);
  if (!slot) return 0;
  const arr = App.arrivals || {};
  const one = id => S.KINDS.reduce((n, k) => n + S.arrivalCount((arr[id] || {})[slot], k.key), 0);
  if (companyId) return one(companyId);
  return (App.monthIds || []).reduce((n, id) => n + one(id), 0);
}

/* ⚠ ▶ 는 **이번 달까지만** 간다(대표 지시 2026-08-17). 제한이 없어서 실제로
   2027년 1월까지 넘어간 화면이 나왔다 — 기준 월은 8월이라 적혀 있는데 월 줄은
   1월이 켜져 있었다. 미래 달에는 자료가 있을 수 없는데 화면 어디에도 「지금
   미래를 보고 있다」는 말이 없어, 빈 것이 그 달 탓인지 가릴 수가 없다.
   「직접 적기」로 미래를 적는 것은 그대로 둔다 — 사람이 알고 하는 일이다. */
function monthAhead() {
  return S.monthKey(App.month) >= S.monthKey(thisMonth());
}

/* 오늘 — 「8월 17일 (월)」. 요일까지 적는다: 근태는 요일로 세는 일이라
   날짜만으로는 지금이 주 어디쯤인지 안 잡힌다. */
const WEEKDAY = ['일', '월', '화', '수', '목', '금', '토'];
function todayLabel(now) {
  const d = now ? new Date(now) : new Date();
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WEEKDAY[d.getDay()] + ')';
}
window.todayLabel = todayLabel;

function monthStripHtml() {
  /* ⚠ 달은 **한 칸만** 보인다(대표 지시 2026-08-17). 앞서 여섯 달을 늘어놓았더니
     줄이 길어 머리가 다시 두꺼워졌다. 대신 그 한 칸에 「몇 년 몇 월·몇 장」을 다
     적어 ◀▶ 로 넘기며 본다 — 자료 있는 달을 한눈에 훑던 것은 못 하지만,
     달을 잘못 보고 있는지는 오히려 또렷하다. */
  let h = '<div class="mstrip">'
    + '<button class="btn sm" onclick="changeMonth(monthShift(App.month,-1))" title="지난달">◀</button>';
  const cur = S.monthKey(App.month) || S.monthKey(thisMonth());
  const n = monthCount(App.companyId, App.month);
  h += '<button class="mo on now" title="' + esc(App.month) + ' · ' + n + '장">'
    + cur.slice(0, 4) + '년 ' + parseInt(cur.slice(4), 10) + '월'
    + '<span class="c">' + n + '</span></button>';
  const ahead = monthAhead();
  h += '<button class="btn sm"' + (ahead ? ' disabled' : '')
    + ' onclick="changeMonth(monthShift(App.month,1))"'
    + ' title="' + (ahead ? '이번 달보다 뒤로는 갈 수 없습니다' : '다음달') + '">▶</button>';
  /* 오늘 — 한 칸만 보이니 「지금이 며칠인지」를 옆에 적어 준다(대표 지시
     2026-08-17). 이번 달을 보고 있지 않으면 눌러서 **돌아오는 길**이 된다 —
     3월까지 내려갔다가 ▶ 를 다섯 번 누를 일이 없어진다. */
  h += ahead
    ? '<span class="today">오늘 ' + esc(todayLabel()) + '</span>'
    : '<button class="today back" onclick="changeMonth(thisMonth())"'
      + ' title="이번 달로 돌아갑니다">오늘 ' + esc(todayLabel()) + ' →</button>';
  /* 먼 달로 갈 때만 손으로 적는다 — 늘 띄워 두면 줄만 먹는다. */
  h += App.monthEdit
    ? '<input class="btn sm" id="monthInput" style="width:96px" value="' + esc(App.month) + '"'
      + ' onchange="App.monthEdit=false;changeMonth(this.value)">'
    : '<button class="btn sm" onclick="App.monthEdit=true;App.render()">직접 적기</button>';
  return h + '</div>';
}
window.monthStripHtml = monthStripHtml;

function screenDrawer() {
  if (!App.month) App.month = thisMonth();
  const counts = drawerCounts(App.itemsKeep, App.itemsMonth, App.companyId);
  const model = drawerModel(App.itemsKeep, App.itemsMonth, App.companyId, App.kind, Date.now());
  const foldCounts = folderCounts(model.rows);
  const foldered = folderRows(model.rows, App.folderPick);
  const rows = searchRows(foldered, App.query);
  const ids = rows.map(r => r.id);
  const sel = pickPrune(pickOf('drawer'), ids); pickPut('drawer', sel);

  /* ── 머리 한 줄 (대표 지시 2026-08-17 「간략하게 정렬」) ──
     예전에는 ←·이름·건수·기준 월·단추 둘이 **각각 한 줄씩** 다섯 줄을 먹어,
     정작 자료는 아홉째 줄에서야 보였다. 한 줄로 묶는다.
     ⚠ 「몇 번째 / 몇 곳」과 담당자는 **왼쪽 목록과 같은 모델**에서 가져온다 —
     따로 세면 두 곳이 또 다른 말을 한다. */
  const vlist = sideListModel(App.sideView, sideCtx(), {
    q: App.colQuery, filter: App.colFilter, order: App.myOrder
  });
  const at = vlist.rows.findIndex(r => r.id === App.companyId);
  const meRow = at >= 0 ? vlist.rows[at] : null;

  /* 머리 줄들을 한 덩어리로 묶어 통째로 붙여 둔다(대표 지시 2026-08-17 「틀고정」).
     예전에는 탭·찾기만 각자 붙어 있어, 그 위의 자리 띠·이름·달은 다 따라
     올라갔다 — 마흔 번째 자료에서 무슨 달·누구 자리인지 알 수 없었다. */
  let h = '<div class="stickhead">' + bannerHtml()
    + '<div class="dhead">'
    + '<button class="btn sm" onclick="App.go(\'sites\')" title="사업장 목록으로">←</button>'
    + '<b class="dtitle">' + esc(App.companyName || App.companyId) + '</b>'
    + '<span class="dmeta">'
    + (at >= 0 ? (at + 1) + ' / ' + vlist.rows.length + ' · ' : '')
    + (meRow && meRow.owner ? '담당 ' + esc(meRow.owner) + ' · ' : '')
    + model.rows.length + '건'
    + (App.folderPick !== 'all' ? ' 중 이 폴더 ' + foldered.length + '건' : '')
    + (App.query ? ' · 찾은 것 ' + rows.length + '건' : '')
    + '</span>'
    /* 담당자는 **이름만** 한 조각으로(대표 지시 2026-08-29) — 주소는 눌러야 편다 */
    + coMailChip(App.companyId)
    + '<span class="dacts">'
    /* 올리는 길을 눈에 보이게 둔다 — 끌어다 놓기만으로는 아는 사람만 쓴다.
       남의 자리에서는 안 그린다(어차피 담기지 않는다). */
    + (canWrite()
      ? '<button class="btn sm pri" onclick="pickDrawerFiles()">＋ 자료 올리기</button>'
        + '<input type="file" id="drawerPick" multiple style="display:none"'
        + ' accept=".xlsx,.xls,.csv,.pdf,.hwp,.hwpx,.jpg,.jpeg,.png,.heic,.webp,.txt,.zip"'
        + ' onchange="dropFiles(this.files);this.value=\'\'">'
      : '')
    + (S.isKeepKind(App.kind) ? ''
      : '<button class="btn sm" onclick="App.go(\'values\')">📋 이 달 값</button>'
        + (S.canHandoffPayroll()
          ? '<button class="btn sm" onclick="handoffMonth()"' + (App.handoffBusy ? ' disabled' : '') + '>'
          + (App.handoffBusy ? '넘기는 중…' : '📤 급여관리에 알리기') + '</button>' : ''))
    + '</span></div>'
    + coMailDropHtml(App.companyId);

  /* ⚠ 달력을 **탭과 같은 줄**에 둔다 (대표 지시 2026-08-29 「한두 줄 정도로」).
     예전에는 자리 띠·이름줄·메일 세 줄·달력·탭 = 여섯 줄이라, 자료가 일곱째
     줄에서야 보였다. 달·탭·찾기는 셋 다 「무엇을 볼지 좁히는 것」이라 한 줄에
     둬도 뜻이 섞이지 않는다. 좁은 화면에서는 저절로 아래로 접힌다. */
  const keepKind = S.isKeepKind(App.kind);
  if (keepKind) {
    h += '<div class="sub" style="margin-bottom:6px">근로계약서는 월과 상관없이 모두 보입니다.</div>';
  }

  /* 탭·폴더·찾기를 **한 줄에** 모은다(대표 지시 2026-08-17 「줄을 줄였으면」).
     셋 다 「좁히는 것」이라 나란히 있는 편이 눈에 낫다. 폴더가 많으면 다음 줄로
     넘어가게 둔다 — 억지로 한 줄에 밀어 넣으면 폴더 이름이 잘려 못 고른다.
     탭은 「무엇인가」, 폴더는 「어느 일인가」다(사진첩과 같은 방식) — 탭을
     넘나들어도 고른 폴더는 그대로 둔다. */
  h += '<div id="findBar" class="foldfind">'
    + (keepKind ? '' : monthStripHtml())
    + '<div id="tabsBar">' + S.KINDS.map(k =>
      /* 탭을 바꾸면 칸이 달라진다(근로계약서는 월 없는 칸) — 지켜보는 자리도 따라간다. */
      '<button class="' + (App.kind === k.key ? 'on' : '') + '" onclick="App.kind=\'' + k.key
      + '\';App.query=\'\';ensureDrawerData();watchDrawer();App.render()">' + esc(k.label)
      + '<span class="n">' + counts[k.key] + '</span></button>').join('')
    + folderBar(App.folders, App.folderPick, foldCounts) + '</div>'
    + '<input id="findInput" class="dfind" placeholder="파일 이름으로 찾기" value="' + esc(App.query) + '"'
    + ' oninput="App.query=this.value;App.render()"></div>';

  h += '</div>';   // .stickhead 끝 — 여기까지가 붙어 있는 머리다

  /* 함께 맡은 업체라고 알려 준다 — 안 알리면 남의 이름이 붙은 줄을 보고
     「왜 남의 자료가 내 서랍에 있지」 하게 된다(대표 지시 2026-08-17). */
  const coNames = drawerSeats().map(byName).filter(Boolean);
  if (coNames.length > 1) {
    h += '<div class="coseat">👥 <b>함께 맡은 업체</b> — '
      + esc(coNames.join('·')) + ' 님이 담은 것을 모아 보여 줍니다</div>';
  }

  const folderOpts = folderOptionsHtml(App.folders);
  const editable = canWrite();

  /* 고른 뒤에 뜨는 단추 — 폴더로 옮기기·휴지통으로. 차림표는 고르고 나면
     안내문('__')으로 되돌려 둔다. 안 되돌리면 방금 옮긴 폴더 이름이 남아
     「지금 그 폴더에 들어 있다」처럼 보인다. */
  const drawerActs = editable
    ? '<span class="pkacts">'
      + '<select class="btn" onchange="bulkSetFolder(this.value);this.value=\'__\'">'
      + '<option value="__">📁 폴더로 옮기기…</option>'
      + folderOptionsHtml(App.folders, '폴더에서 빼기')
      + '</select>'
      + '<button class="btn" onclick="bulkDrawerTrash()">🗑 휴지통으로</button></span>'
    : '';

  h += '<div class="card">' + (rows.length ? pickBar('drawer', ids, drawerActs) + rows.map((r, i) =>
    '<div class="row' + (pickOn(sel, r.id) ? ' pkon' : '') + '">'
    + '<label onclick="event.stopPropagation()"><input type="checkbox" ' + (pickOn(sel, r.id) ? 'checked' : '')
    + ' onchange="pickHit(\'drawer\',\'' + esc(r.id) + '\')"></label>'
    + '<span class="pkno">' + (i + 1) + '</span>'
    + '<b style="flex:1;cursor:pointer" onclick="openViewer(\'' + esc(r.id) + '\')">'
    + esc(r.filename || '(이름 없음)') + '</b>'
    + (r.expired ? '<span class="expbadge">지난 것</span>' : '')
    /* 누가 담았는지 — 함께 맡은 업체에서는 줄마다 다르다. 내 것은 굳이 안 적는다
       (모두 내 것인 보통 업체에서 줄마다 「내가 담음」이 붙으면 눈만 시끄럽다). */
    + (r._by && r._by !== (seatNow() || S.myUid())
      ? '<span class="bywho" title="' + esc(byName(r._by)) + ' 님이 담았습니다 — 여기서는 못 고칩니다">'
        + esc(byName(r._by)) + '</span>' : '')
    + '<span class="sub" style="margin:0">' + (r.filedAt ? new Date(r.filedAt).toLocaleDateString() : '') + '</span>'
    + (editable && canEditRow(r)
      ? '<select class="btn" style="font-size:11.5px;padding:4px 6px" onclick="event.stopPropagation()"'
        + ' onchange="assignFolder(\'' + esc(r.id) + '\',this.value)">'
        + folderOpts.replace('value="' + esc(r.folder || '') + '"', 'value="' + esc(r.folder || '') + '" selected')
        + '</select>'
        + '<button class="btn" onclick="event.stopPropagation();toTrash(\'' + esc(r.id) + '\')" title="휴지통으로">🗑</button>'
      /* ⚠ 남의 줄에서도 단추를 **숨기지 않고 연하게** 둔다 — 안 보이면 「왜 나만
         안 되지」가 아니라 「이 화면이 고장났나」가 된다. 얹으면 까닭이 나온다. */
      : (editable
        ? '<span class="offacts" title="' + esc(byName(r._by)) + ' 님이 담은 것이라 여기서는 못 고칩니다">'
          + '📁 <span>🗑</span></span>'
        : (r.folder && App.folders[r.folder] ? '<span class="sub" style="margin:0">' + esc(App.folders[r.folder].name) + '</span>' : '')))
    + '</div>').join('')
    : '<div class="empty">' + (App.query ? '찾는 자료가 없습니다.'
      : (App.folderPick !== 'all' ? '이 폴더에 담긴 자료가 없습니다.'
        : '이 칸에 담긴 자료가 없습니다. 다른 월이나 다른 종류를 보세요.')) + '</div>')
    + '</div>';
  return h;
}

/* 급여관리로 이 달 값 넘기기(4차) — 사유를 묻지 않는다. 이미 서랍을 열어
   확인한 사람이 스스로 넘기는 것이므로 열람 사유와는 다른 종류다(그저 넘긴
   사실만 handoff_log 에 남는다). 권한 없는 사람은 단추 자체가 안 보인다. */
function handoffMonth() {
  if (!S.canHandoffPayroll()) return;
  /* 두 번 눌리는 것을 막는다 — 값을 서버에서 읽는 사이(fetchValues)에 단추가
     그대로 살아 있어, 빠르게 두 번 누르면 물음이 두 번 뜨고 두 번 넘어갔다.
     ⚠ 어디로 빠져나가든 반드시 풀어야 한다 — 안 풀면 새로고침 전에는
     영영 못 넘긴다(취소를 눌렀을 때·값이 없을 때·실패했을 때 모두). */
  if (App.handoffBusy) return;
  App.handoffBusy = true;
  App.render();
  const unlock = () => { App.handoffBusy = false; App.render(); };
  /* ⚠ 값을 **여기서 새로 읽는다** — 화면이 들고 있는 App.values 를 세면 안 된다.
     App.values 는 「이 달 값 보기」에 들어갈 때만 채워진다. 업체를 바꿔 들어오거나
     기준 월을 바꾸거나 남의 자리로 옮기는 길에는 채워지지도, 비워지지도 않는다.
     그래서 화담원 값 표(12줄)를 본 뒤 다른 업체로 와서 이 단추를 누르면
     「그 업체 … 12줄」이라 묻고, 급여관리 수신함에도 그 업체가 12줄 정리된 것으로
     적힌다. 급여관리 담당자가 「이 달 준비됐다」를 아는 유일한 신호가 거짓이 된다.
     반대로 값 표를 한 번도 안 연 사람에게는 다 정리된 달을 「값이 없습니다」라고 한다. */
  const companyId = App.companyId, companyName = App.companyName, month = App.month;
  return fetchValues(companyId).then(values => {
    /* 서류 장수가 아니라 **값 줄 수**를 센다 — 급여관리가 보는 것은
       「이 사업장 이 달 자료가 정리됐나」다(설계서 4장). */
    const g = valueGridModel(values);
    const total = g.people.reduce((n, p) => n + Object.keys(p.cells).length, 0);
    if (!total) { unlock(); alert('이 달에 정리된 값이 없습니다.\n먼저 서류를 판독해 값을 만들어 주세요.'); return null; }
    if (!confirm(companyName + ' ' + month + ' 값(' + total + '줄)이 정리됐다고 급여관리에 알릴까요?\n\n값 자체는 넘어가지 않습니다 — 계산은 바깥 프로그램에서 하십니다.')) { unlock(); return null; }
    return S.handoffToPayroll({ companyId: companyId, companyName: companyName, month: month, rowCount: total })
      .then(() => { unlock(); alert('급여관리 수신함으로 넘겼습니다.'); });
  }).catch(e => { unlock(); alert('넘기지 못했습니다 — ' + (e.code || e.message)); });
}
window.handoffMonth = handoffMonth;

/* 자료 한 줄의 「폴더 지정」 골라잡기 — 있는 폴더만 나온다. 새 폴더는 폴더 칸의
   「+ 폴더」로 만든다(그 자리에서 이름을 적는 방식 하나로 통일한다). */
/* firstLabel 은 「폴더 없음」 자리(값이 빈 줄)의 글자다 — 한꺼번에 옮기는
   차림표에서는 같은 자리가 「폴더에서 빼기」라는 **행동**이 된다. */
function folderOptionsHtml(folders, firstLabel) {
  const f = folders || {};
  const tops = Object.keys(f).filter(id => !f[id].parent)
    .sort((a, b) => (f[a].createdAt || 0) - (f[b].createdAt || 0));
  let h = '<option value="">' + esc(firstLabel || '폴더 없음') + '</option>';
  tops.forEach(fid => {
    h += '<option value="' + esc(fid) + '">' + esc(f[fid].name || '') + '</option>';
    Object.keys(f).filter(id => f[id].parent === fid)
      .sort((a, b) => (f[a].createdAt || 0) - (f[b].createdAt || 0))
      .forEach(kid => { h += '<option value="' + esc(kid) + '">↳ ' + esc(f[kid].name || '') + '</option>'; });
  });
  return h;
}

/* ── 확대 보기 (사진첩과 같은 방식) ──
   사진은 눌러서 원본 크기로 확대한다(서류 글씨를 읽어야 한다). 엑셀·PDF 는
   미리 볼 수 없으니 새 창에서 여는 안내만 보여준다. */
function findRow(id) {
  const boxes = [App.itemsKeep, App.itemsMonth];
  for (let i = 0; i < boxes.length; i++) { if (boxes[i] && boxes[i][id]) return boxes[i][id]; }
  return null;
}

/* 사진인가 — 뷰어가 <img> 로 그릴 수 있는가, 그리고 AI 판독기에 실을 수 있는가.
   ⚠ 판독 층(js/pu-doc-read.js)은 무엇을 싣든 image/jpeg 라고 말하고 보낸다.
   사진첩·기업정보함·업체관리가 함께 쓰는 파일이라 이 함에서 고칠 수 없다. 그래서
   PDF·엑셀을 보내면 구글이 400 을 돌려주고, 화면에는 「AI가 응답하지 않습니다
   (오류 400)」로 떠 서비스가 죽은 것처럼 보인다 — 부르는 쪽에서 미리 가른다. */
function isImageRec(rec) { return !!rec && /^image\//.test(rec.mime || ''); }
function openViewer(id) {
  App.viewerId = id; App.viewerUrl = ''; App.viewerZoom = false; App.viewerErr = '';
  App.readState = { status: 'idle', rows: [], err: '' };
  App.render();
  const rec = findRow(id);
  if (!rec) { App.viewerErr = '자료를 찾을 수 없습니다.'; App.render(); return; }
  S.fileDownloadUrl(rec.file).then(url => { App.viewerUrl = url; App.render(); })
    .catch(e => { App.viewerErr = e.message; App.render(); });
}
/* 뷰어를 닫을 때 값 고치기도 함께 접는다 — 안 접으면 그 상태가 남아,
   다음에 아무 원본을 열었을 때 엉뚱한 값의 고치기 패널이 옆에 붙는다. */
function closeViewer() { App.viewerId = ''; App.valueFix = null; App.render(); }
function toggleViewerZoom(ev) {
  if (ev && ev.target && ev.target.tagName !== 'IMG') return;   // 바깥을 눌러도 확대되지 않는다
  App.viewerZoom = !App.viewerZoom; App.render();
}
window.openViewer = openViewer; window.closeViewer = closeViewer; window.toggleViewerZoom = toggleViewerZoom;

/* ══════ 판독 스위치 (2026-08-15 대표 지시로 **둘 다 켰다**) ══════
   아래는 켜기 전에 적어 두었던 까닭과, 켠 지금도 **그대로 남아 있는 위험**이다.
   켰다고 위험이 없어진 것이 아니다.

   급여대장(WAGE_READ_ON): 근로자 **성명·임금액**이 담긴 사진이 구글로 나간다.
   처리위탁 근거(설계서 9장)는 서류로 정리할 일이지 코드로 막을 것이 없어
   대표 판단으로 켠다.

   알림(NOTICE_READ_ON — 입퇴사 통보·수당 변경 카톡): 입퇴사 통보 캡처에는
   거의 언제나 **주민등록번호가 함께 찍혀 있다.** 프롬프트의 「담지 마세요」는
   **답에 안 담으라는 말일 뿐, 사진 자체는 그대로 구글로 올라간다.**
   이 점을 대표께 알리고 「감수하고 켠다」는 답을 받아 켰다(2026-08-15).

   ⚠ 다음에 손대는 사람이 반드시 알 것
     · 보내기 전에 **주민번호를 가리는 화면**이 있다(2026-08-15, startMask·maskConfirm).
       그래도 마지막 판단은 사람이다 — 못 보고 넘긴 것은 그대로 나간다.
     · 기계가 **인쇄체만** 찾아 미리 칠한다(2026-08-17, maskAutoFind).
       **손글씨는 사람이 칠해야 한다** — 그리고 기계가 몇 곳을 찾았든 「못 찾은
       것이 있을 수 있습니다」를 지우지 않는다. 미리 칠해 주면 사람이 「다 됐구나」
       하고 넘기기 때문이다. 눈으로 한 번은 훑어야 한다.
     · 근태표는 임금액도 주민번호도 없어 처음부터 켜져 있었다(readKindFor).
   ⚠ 이 값을 바꿀 때는 tests/paydata-read-panel.test.js 의 짝 검사도 함께 고친다. */
const WAGE_READ_ON = true;

const NOTICE_READ_ON = true;

/* 「판독하기」를 누르면 **바로 판독하지 않는다** — 먼저 가릴 곳을 고른다(설계서 3장).
   막을 것(종류·권한·스위치·사진인가)은 여기서 그대로 막는다. 창고 파일은 여기서
   한 번만 받아 두고, 가림 화면과 사본 만들기가 그것을 함께 쓴다. */
/* ══════ 엑셀을 칸 그대로 읽는다 (대표 결정 2026-08-23) ══════
   급여 자료 대부분이 엑셀(근태표·급여대장)이다. 화면 찍어 AI 에 보내면
   1↔7·4↔9 를 잘못 읽는데, 엑셀 파일을 열면 칸 값이 **글자 그대로** 나온다.
   AI 가 하는 일은 읽기가 아니라 「어느 칸이 무엇인가」 판단뿐이다.

   ⚠ 판독 결과 모양(App.readState.rows)은 사진 판독과 **같다** — 그래서 확인 표·
   저장(saveVals)·값 표가 손댈 것 없이 그대로 돈다. */

/* 엑셀 읽기 도구(1MB)는 엑셀을 실제로 열 때만 내려받는다 — 폰에서 첫 화면이
   느려지지 않게 한다. 한 번 받으면 그 판에서는 다시 안 받는다. */
/* 글자로 읽는 파일 종류 — 사진으로 만들지 않고 글자를 그대로 뽑는다.
   여기 없는 종류(사진)는 지금까지처럼 가림 화면을 거쳐 AI 에 사진으로 간다. */
const READ_TEXT_KINDS = ['sheet', 'doc', 'pdf', 'text'];

let sheetLibP = null;
let docLibP = null;

/* 한글·PDF 글자 뽑기는 도구가 셋이다 — SheetJS(HWP 의 CFB 파서)·pako(압축 풀기)·
   pdf.js(PDF). 이것도 엑셀과 같이 **그 파일을 열 때만** 내려받는다.
   hwp_extract.js 는 취업규칙(rules.html)에서 이미 돌고 있는 추출기다 —
   HWP 5.0·HWPX·DOCX·ODT·RTF·PDF 를 한 함수(extractDocText)로 가려 읽는다. */
function needDocLib() {
  if (docLibP) return docLibP;
  const one = (src, has) => new Promise((ok, no) => {
    if (has()) return ok();
    const el = document.createElement('script');
    el.src = src;
    el.onload = () => ok();
    el.onerror = () => no(new Error(src + ' 를 내려받지 못했습니다'));
    document.head.appendChild(el);
  });
  docLibP = Promise.resolve()
    .then(() => one('vendor/xlsx.full.min.js', () => window.XLSX && window.XLSX.CFB))
    .then(() => one('vendor/pako.min.js', () => window.pako))
    .then(() => one('vendor/pdf.min.js', () => window.pdfjsLib))
    .then(() => one('hwp_extract.js', () => window.extractDocText))
    .catch(e => { docLibP = null; throw e; });
  return docLibP;
}
function needSheetLib() {
  if (window.XLSX && window.XLSX.read) return Promise.resolve();
  if (sheetLibP) return sheetLibP;
  sheetLibP = new Promise((ok, no) => {
    const el = document.createElement('script');
    el.src = 'vendor/xlsx.full.min.js';
    el.onload = () => ok();
    el.onerror = () => { sheetLibP = null; no(new Error('엑셀 읽기 도구를 내려받지 못했습니다')); };
    document.head.appendChild(el);
  });
  return sheetLibP;
}

/* 열려 있는 엑셀을 받아 시트 목록을 만든다. 파일은 창고에서 그대로 가져온다 —
   뷰어가 쓰는 주소(App.viewerUrl)를 함께 쓴다. */
function startSheetRead() {
  const rec = findRow(App.viewerId);
  if (!rec || !canWrite()) return;
  const rk = S.readKindFor(rec.kind);
  if (!rk) {
    App.readState = { status: 'err', rows: [], err: '이 종류는 값을 뽑지 않습니다.' };
    App.render(); return;
  }
  if (!App.viewerUrl) {
    App.readState = { status: 'err', rows: [], err: '파일을 아직 못 받았습니다 — 잠시 뒤 다시 해 주세요.' };
    App.render(); return;
  }
  App.readState = { status: 'reading', rows: [], err: '' };
  App.render();
  const forId = App.viewerId;                 // 늦게 온 답이 다른 서류에 얹히지 않게
  return needSheetLib()
    .then(() => fetch(App.viewerUrl))
    .then(r => { if (!r.ok) throw new Error('파일을 받지 못했습니다 (' + r.status + ')'); return r.arrayBuffer(); })
    .then(ab => {
      if (App.viewerId !== forId) return;      // 그 사이 다른 서류를 열었다
      const names = PuPaydataFiles.sheetNames(ab);
      if (!names.length) throw new Error('시트가 없는 엑셀입니다.');
      App.sheetBuf = ab;                       // 시트를 갈아 볼 때 다시 안 받는다
      App.readState = { status: 'idle', rows: [], err: '', sheet: { names: names, pick: '', text: '', masked: 0 } };
      pickSheet(names[0]);
    })
    .catch(e => {
      if (App.viewerId !== forId) return;
      App.readState = { status: 'err', rows: [], err: (e && e.message) || String(e) };
      App.render();
    });
}
window.startSheetRead = startSheetRead;

/* 한글·워드·PDF 에서 글자를 뽑는다 (대표 결정 2026-08-23 ②③).
   ⚠ 스캔한 종이 PDF 는 글자가 없다 — 그때는 뽑을 것이 없다고 바로 말한다.
   억지로 빈 글자를 AI 에 보내면 「아무것도 못 읽었다」만 돌아온다. */
function startDocRead() {
  const rec = findRow(App.viewerId);
  if (!rec || !canWrite()) return;
  if (!S.readKindFor(rec.kind)) {
    App.readState = { status: 'err', rows: [], err: '이 종류는 값을 뽑지 않습니다.' };
    App.render(); return;
  }
  if (!App.viewerUrl) {
    App.readState = { status: 'err', rows: [], err: '파일을 아직 못 받았습니다 — 잠시 뒤 다시 해 주세요.' };
    App.render(); return;
  }
  App.readState = { status: 'reading', rows: [], err: '' };
  App.render();
  const forId = App.viewerId;
  /* 글자 파일은 도구가 필요 없다 — 2MB 를 내려받을 까닭이 없다. */
  const needLib = PuPaydataFiles.fileKind(rec.filename) === 'text'
    ? Promise.resolve() : needDocLib();
  return needLib
    .then(() => fetch(App.viewerUrl))
    .then(r => { if (!r.ok) throw new Error('파일을 받지 못했습니다 (' + r.status + ')'); return r.arrayBuffer(); })
    .then(ab => {
      /* 글자 파일(.txt — 메일 본문·카톡 내보내기)은 **뽑을 것이 없다.** 이미 글자다.
         추출기에 넣으면 HWP 로 여겨 터진다. */
      if (PuPaydataFiles.fileKind(rec.filename) === 'text') {
        return new TextDecoder().decode(new Uint8Array(ab));
      }
      return window.extractDocText(ab, window.XLSX, window.pako, window.pdfjsLib);
    })
    .then(text => {
      if (App.viewerId !== forId) return;
      let body = String(text || '').replace(/\n{3,}/g, '\n\n').trim();
      if (!body) {
        App.readState = { status: 'err', rows: [],
          err: '글자가 없는 파일입니다 — 스캔한 종이 PDF 로 보입니다.\n사진으로 찍어 올리면 판독할 수 있습니다.' };
        App.render(); return;
      }
      let masked = 0;
      if (window.PuRrnMask && PuRrnMask.maskRrnInText) {
        const m = PuRrnMask.maskRrnInText(body);
        body = m.text; masked = m.count;
      }
      /* 엑셀과 **같은 자리**(readState.sheet)에 담는다 — 판독 패널·판독 단추가
         하나로 돈다. 시트가 없으니 names 는 비운다. */
      App.readState = { status: 'idle', rows: [], err: '',
        sheet: { names: [], pick: rec.filename || '문서', text: body, masked: masked } };
      App.render();
    })
    .catch(e => {
      if (App.viewerId !== forId) return;
      App.readState = { status: 'err', rows: [], err: (e && e.message) || String(e) };
      App.render();
    });
}
window.startDocRead = startDocRead;

/* 시트를 고르면 그 칸 글자를 뽑아 보여 준다. **보내기 전에** 주민번호를 지우고,
   몇 개를 지웠는지 사람에게 알린다 — 모르고 보내는 일이 없어야 한다. */
function pickSheet(name) {
  const st = App.readState || {};
  if (!st.sheet || !App.sheetBuf) return;
  let text = '';
  try {
    text = PuPaydataFiles.sheetText(App.sheetBuf, name);
  } catch (e) {
    App.readState = { status: 'err', rows: [], err: (e && e.message) || String(e) };
    App.render(); return;
  }
  let masked = 0;
  if (window.PuRrnMask && PuRrnMask.maskRrnInText) {
    const m = PuRrnMask.maskRrnInText(text);
    text = m.text; masked = m.count;
  }
  st.sheet = { names: st.sheet.names, pick: name, text: text, masked: masked };
  st.status = 'idle'; st.rows = []; st.err = '';
  App.readState = st;
  App.render();
}
window.pickSheet = pickSheet;

/* 고른 시트의 글자를 AI 에 보내 사람별 값으로 만든다. 그다음은 사진 판독과 같다 —
   확인 표에서 고치고 「저장」을 눌러야 값이 된다(대표 결정: 사람이 한 번 보고 지장). */
function runSheetRead() {
  const st = App.readState || {};
  const rec = findRow(App.viewerId);
  if (!st.sheet || !st.sheet.text || !rec) return;
  const forId = App.viewerId;
  const hint = (rec.filename || '엑셀') + ' · ' + st.sheet.pick + ' 시트';
  const keep = st.sheet;
  App.readState = { status: 'reading', rows: [], err: '', sheet: keep };
  App.render();
  return PuDocRead.readTableText(st.sheet.text, hint).then(r => {
    if (App.viewerId !== forId) return;
    if (!r || !r.ok) {
      App.readState = { status: 'err', rows: [], err: (r && r.error) || '읽지 못했습니다', sheet: keep };
      App.render(); return;
    }
    /* 사진 판독과 같은 길로 넣는다 — rowsFromRead 가 값 줄 모양을 맞춘다. */
    const rows = S.rowsFromRead(S.readKindFor(rec.kind), r);
    if (!rows.length) {
      App.readState = { status: 'err', rows: [], sheet: keep,
        err: '사람 이름을 찾지 못했습니다 — 머리글이 여러 줄이거나 다른 시트일 수 있습니다.' };
      App.render(); return;
    }
    App.readState = { status: 'done', rows: rows, err: '', sheet: keep };
    App.render();
  });
}
window.runSheetRead = runSheetRead;

function startMask() {
  const rec = findRow(App.viewerId);
  if (!rec) return;
  /* 판독 방식은 **지금 열려 있는 서류**가 정한다 — 서랍 탭(App.kind)이 정하면,
     월별 값 표에서 출처 서류를 눌러 열었을 때 마지막으로 눌러 둔 탭이 그대로
     쓰인다. 근태표를 열어 놓고 알림 판독기로 읽는 일이 실제로 일어난다. */
  const rk = S.readKindFor(rec.kind);
  if (!rk || !canWrite()) return;
  if (rk === 'wage' && !WAGE_READ_ON) return;
  if (rk === 'notice' && !NOTICE_READ_ON) return;
  /* 사진이 아니면 아예 부르지 않는다 — 보내 봐야 오류 400 이고(isImageRec 머리말),
     그 사이 판독 한 번 값도 나간다. 무엇이 문제인지 한국어로 남긴다. */
  if (!isImageRec(rec)) {
    App.readState = { status: 'err', rows: [],
      err: 'PDF·엑셀·한글 파일은 판독할 수 없습니다 — 사진으로 찍거나 화면을 캡처해 올려 주세요.' };
    App.render();
    return;
  }
  App.readState = { status: 'idle', rows: [], err: '' };
  App.maskState = { status: 'loading', url: '', boxes: [], err: '', autoNote: '' };
  App.render();

  const forId = App.viewerId;
  S.fileToDataUrl(rec.file, rec.mime).then(dataUrl => {
    if (App.viewerId !== forId) return;    // 다른 서류로 옮겨 갔다 — 이 답은 버린다
    App.maskState = { status: 'ready', url: dataUrl, boxes: [], err: '', autoNote: '' };
    App.render();
    maskAutoFind(dataUrl, forId);     // 기계 찾기는 뒤에서 돈다 — 기다리지 않는다
  }).catch(e => {
    if (App.viewerId !== forId) return;
    App.maskState = { status: 'err', url: '', boxes: [], err: (e && e.message) || String(e), autoNote: '' };
    App.render();
  });
}
window.startMask = startMask;

/* 가린 사본을 만들어 판독으로 넘긴다.
   ⚠ 판독기로 가는 길은 **여기 하나뿐**이다(검사가 지킨다). 가린 곳이 없으면
   원본을 그대로 넘긴다 — 가릴 것이 없다고 사람이 보고 누른 것이므로. */
function maskConfirm() {
  const ms = App.maskState;
  if (!ms || ms.status !== 'ready') return;
  const rec = findRow(App.viewerId);
  if (!rec) return;
  const rk = S.readKindFor(rec.kind);
  if (!rk) return;
  let dataUrl;
  try { dataUrl = PuRrnMaskUi.maskedDataUrl(); }
  catch (e) {
    /* 못 만들었으면 **원본을 보내지 않는다.** 가리려던 것을 못 가린 채
       보내는 것이 이 기능이 막으려던 바로 그 일이다. */
    alert('가린 사진을 만들지 못했습니다 — ' + ((e && e.message) || e) + '\n판독하지 않았습니다.');
    return;
  }
  App.maskState = PuRrnMaskUi.blank();
  runRead(rk, dataUrl);
}
window.maskConfirm = maskConfirm;

/* 실제 판독. **가림을 거쳐 나온 사본만** 여기로 들어온다. */
function runRead(rk, dataUrl) {
  App.readState = { status: 'reading', rows: [], err: '' };
  App.render();

  /* 판독 중에 다른 서류로 옮겨 갈 수 있다. 그때 늦게 온 답이 새 화면을 덮으면
     **엉뚱한 원본이 출처로 붙는다** — 값마다 출처를 붙이는 이 설계에서 가장
     나쁜 고장이다(없는 것보다 틀린 것이 나쁘다. 아무도 의심하지 않으므로). */
  const forId = App.viewerId;
  const job = (rk === 'timesheet')
    ? PuDocRead.read(dataUrl).then(r => ({ ok: !r.error, error: r.error, parsed: (r && r.fields) || {} }))
    : ((rk === 'wage') ? PuDocRead.readWageTable(dataUrl) : PuDocRead.readChangeNotice(dataUrl))
        .then(r => ({ ok: r.ok, error: r.error, parsed: r }));

  job.then(res => {
    if (App.viewerId !== forId) return;   // 이미 다른 서류를 보고 있다 — 이 답은 버린다
    if (!res.ok) throw new Error(res.error || '판독하지 못했습니다');
    const rows = S.rowsFromRead(rk, res.parsed);
    if (!rows.length) throw new Error('사람별 값을 읽어내지 못했습니다 — 직접 적어 주세요.');
    App.readState = { status: 'done', rows: rows, err: '' };
    App.render();
  }).catch(e => {
    if (App.viewerId !== forId) return;   // 옮겨 간 뒤라면 실패도 새 화면에 묻히면 안 된다
    App.readState = { status: 'err', rows: [], err: (e && e.message) || String(e) };
    App.render();
  });
}

/* ══════ 같은 이름이 둘 (대표 결정 2026-08-15 — 「지금은 막기만」) ══════
   값은 근로자 **이름 하나로만** 묶인다(valueGridModel 이 byName 으로 모은다).
   그래서 한 사업장·한 달에 김민수가 둘이면 두 사람 값이 **한 줄로 합쳐지고**
   나중에 저장한 값이 앞 값을 덮는다 — 화면에는 「김민수」 한 줄로 보여
   합쳐진 줄도 모른다. 급여에 그대로 쓰이는 숫자다.

   ⚠ 한 서류 안에 같은 이름이 두 번 있으면 더 나쁘다. 그 서류를 다시 판독해
   저장할 때 두 줄이 사업장·월·이름·출처가 모두 같아 **같은 자리**로 몰리고
   (findDuplicateValue), 한 줄이 조용히 사라진다.

   근본 해결(사번·근로자 명단)은 급여대장 판독을 켤 때 함께 정하기로 했다 —
   지금 켜진 것은 근태표뿐이고 거기에는 사번이 거의 안 적혀 있어 가를 재료가 없다.
   그때까지는 **저장을 막고 사람이 갈라 적게** 한다. */
function dupNames(rows) {
  const seen = {}, dup = [];
  (rows || []).forEach(r => {
    const n = String((r && r.name) || '').trim();
    if (!n) return;                       // 빈 이름은 따로 본다(blankNames)
    if (seen[n] === 1) { dup.push(n); seen[n] = 2; }
    else if (!seen[n]) seen[n] = 1;
  });
  return dup;
}

/* 이름이 비어 있는 줄 — 저장해 봐야 값 표에 안 나온다(그쪽이 이름 없는 줄을 건너뛴다).
   「직접 적기」로 연 빈 줄을 안 채우고 저장하면 그대로 쓰레기가 쌓인다. */
function blankNames(rows) {
  return (rows || []).filter(r => !String((r && r.name) || '').trim()).length;
}

/* 그 줄에 칠할 색 — 같은 이름(빨강)이 확실하지 않음(노랑)보다 급하다. */
function rowMarkClass(r, dupMap) {
  if (dupMap[String((r && r.name) || '').trim()]) return 'dup';
  return r && r.iffy ? 'iffy' : '';
}

/* 읽어 온 값을 고칠 수 있는 표로. 한 줄 = 한 사람의 한 항목이다. */
function valueRowsHtml(rows) {
  const dupMap = {};
  dupNames(rows).forEach(n => { dupMap[n] = 1; });
  let h = '<table class="vals"><tr><th style="width:28%">근로자</th>'
        + '<th style="width:32%">항목</th><th>값</th><th style="width:26px">지움</th></tr>';
  (rows || []).forEach((r, i) => {
    const pairs = r.pairs || [];
    pairs.forEach((p, j) => {
      /* 줄마다 이름표(id)를 준다 — 사람이 고칠 때 표를 통째로 다시 그리지 않고
         이 줄의 칠만 손보기 위해서다(editVal 머리말 참고). */
      h += '<tr id="vrow_' + i + '_' + j + '" class="' + rowMarkClass(r, dupMap) + '">'
        /* ⚠ 이름 칸은 **그 사람의 첫 줄에만** 둔다. 예전에는 항목마다 같은 이름 칸을
           되풀이해 그렸다 — 한 칸에서 이름을 고쳐도 아래 칸들은 옛 이름 그대로 남아,
           고치는 사람 눈에는 한 사람이 두 사람으로 갈라진 것처럼 보였다. */
        + (j === 0 ? '<td rowspan="' + pairs.length + '"><input id="vnm_' + i + '" value="' + esc(r.name)
            + '" oninput="editVal(' + i + ',\'name\',this.value)"></td>' : '')
        + '<td><input id="vit_' + i + '_' + j + '" value="' + esc(p.item) + '" oninput="editVal(' + i + ',\'item\',this.value,' + j + ')"></td>'
        + '<td><input id="vvl_' + i + '_' + j + '" value="' + esc(p.value) + '" oninput="editVal(' + i + ',\'value\',this.value,' + j + ')"></td>'
        + '<td><span class="del" title="이 항목만 지웁니다" onclick="delValItem(' + i + ',' + j + ')">✕</span></td></tr>';
    });
  });
  return h + '</table>';
}

/* 고치면 그 줄의 노란 표시를 걷는다 — 확인이 끝났다는 뜻이다.
   ⚠ 여기서 App.render() 를 부르면 안 된다. 이 함수는 oninput 으로 **글자 하나마다**
   불린다 — 다시 그리면 지금 치고 있는 칸이 통째로 새로 만들어져 한 글자 칠 때마다
   커서를 잃는다. 그래서 화면은 그 줄의 노란 칠과 「⚠ N줄」 알림만 손본다.
   (자료만 고치고 화면을 안 건드리면 노란색이 안 걷혀, 표시가 없는 것과 같아진다) */
function editVal(i, key, v, j) {
  const r = (App.readState.rows || [])[i];
  if (!r) return;
  if (key === 'name') r.name = v;
  else if (r.pairs && r.pairs[j]) r.pairs[j][key] = v;
  if (r.iffy) r.iffy = false;
  /* 이름을 고치면 **같은 이름 표시가 늘 수도 줄 수도** 있다 — 노란 칠만 걷던
     예전과 달리 늘 다시 맞춘다(고치다 새로 겹치게 만들었는데 조용하면 안 된다). */
  refreshIffyMarks();
}

/* 줄 칠과 위쪽 알림 두 줄을 **다시 그리지 않고** 지금 화면에 맞춘다.
   (이름이 「같은 이름」인지는 다른 줄까지 봐야 알 수 있어 그 줄만 볼 수 없다) */
function refreshIffyMarks() {
  const rows = (App.readState && App.readState.rows) || [];
  const dupMap = {}, dups = dupNames(rows);
  dups.forEach(n => { dupMap[n] = 1; });
  rows.forEach((r, i) => {
    (r.pairs || []).forEach((p, j) => {
      const tr = $('vrow_' + i + '_' + j);
      if (tr) tr.className = rowMarkClass(r, dupMap);
    });
  });
  const dupLine = $('dupLine');
  if (dupLine) {
    if (!dups.length) { dupLine.style.display = 'none'; }
    else {
      dupLine.style.display = '';
      dupLine.innerHTML = '⚠ <b>같은 이름</b>이 있습니다 — ' + esc(dups.join(', '))
        + '<br>뒤에 부서나 구분을 적어 갈라 주세요(예: 김민수(생산)). 그대로는 저장되지 않습니다.';
    }
  }
  const line = $('iffyLine');
  if (!line) return;
  const n = rows.filter(r => r.iffy).length;
  if (!n) { line.style.display = 'none'; return; }
  line.style.display = '';
  line.innerHTML = '⚠ <b>' + n + '줄</b>은 확실하지 않습니다 — 노란 줄부터 봐 주세요.';
}
function addValRow() {
  App.readState.rows.push({ name: '', pairs: [{ item: '', value: '' }], iffy: false });
  App.render();
}

/* AI가 못 읽었을 때 손으로 적기 시작한다 — 빈 표 한 줄로 연다.
   판독을 거치지 않았을 뿐, 그 뒤(고치기·저장·출처 붙이기)는 완전히 같은 길이다. */
function startManualRows() {
  if (!canWrite()) return;
  App.readState = { status: 'done', rows: [{ name: '', pairs: [{ item: '', value: '' }], iffy: false }], err: '' };
  App.render();
}
window.startManualRows = startManualRows;
/* 그 사람을 통째로 뺀다(항목 전부). 표의 ✕ 는 이것을 부르지 않는다 — 아래 참고. */
function delValRow(i) { App.readState.rows.splice(i, 1); App.render(); }

/* ✕ 는 **그 항목 하나만** 지운다.
   예전에는 항목 옆의 ✕ 가 그 사람의 값을 통째로 지웠다 — 「식대」를 지우려고
   눌렀는데 유급일수·가감까지 함께 사라졌고, 되돌릴 길이 없었다(칸에 이름표도
   없어 무엇을 지우는 단추인지 알 수도 없었다).
   마지막 항목을 지우면 그 사람도 함께 빠진다 — 항목이 하나도 없는 사람은
   저장해도 값 줄이 되지 않기 때문이다(buildValueRows). */
function delValItem(i, j) {
  const rows = (App.readState && App.readState.rows) || [];
  const r = rows[i];
  if (!r) return;
  (r.pairs || []).splice(j, 1);
  if (!r.pairs || !r.pairs.length) rows.splice(i, 1);
  App.render();
}
window.editVal = editVal; window.addValRow = addValRow;
window.delValRow = delValRow; window.delValItem = delValItem;

/* 확인한 값을 저장한다. 값마다 출처(이 서류 번호)가 붙는다 —
   buildValueRows 가 sourceId 없이는 거절한다. */
function saveVals() {
  if (!canWrite()) return;
  const st = App.readState;
  if (!st || st.status !== 'done' || !st.rows.length) return;

  /* ⚠ 같은 이름이 둘이면 **저장하지 않는다**(dupNames 머리말).
     경고만 하고 저장을 열어 두면 아무도 안 읽는다 — 그리고 합쳐진 뒤에는
     어느 값이 누구 것이었는지 되돌릴 길이 없다. */
  const dups = dupNames(st.rows);
  if (dups.length) {
    alert('같은 이름이 둘 이상 있습니다 — 저장하지 않았습니다.\n\n' + dups.join(', ')
      + '\n\n값은 근로자 이름으로 묶입니다. 그대로 저장하면 두 사람 값이 한 줄로 합쳐지고'
      + '\n나중에 저장한 값이 앞 값을 덮습니다.'
      + '\n\n뒤에 부서나 구분을 적어 갈라 주세요 — 예: 김민수(생산) · 김민수(관리)');
    return;
  }
  const blank = blankNames(st.rows);
  if (blank) {
    alert('이름이 비어 있는 줄이 ' + blank + '개 있습니다 — 저장하지 않았습니다.'
      + '\n이름이 없으면 값 표에 나오지 않습니다. 채우거나 ✕ 로 지워 주세요.');
    return;
  }

  const slot = S.monthKey(App.month) || S.KEEP;
  /* confirmed: true — **「저장」을 누른 것이 곧 사람의 확인이다.** 원본을 옆에 놓고
     줄을 고친 뒤 스스로 누른 것이므로 더 물을 것이 없다. 여기서 확인 표시를 안 하면
     값 표의 노란 칸과 「⚠ 확인 안 된 값이 N개」가 영영 안 걷혀, 한 달만 지나면
     노랑이 「원래 그런 것」이 된다 — 그때 정말 확인 안 된 값이 그대로 넘어간다
     (설계서 3장 ②). */
  const tag = {
    sourceId: App.viewerId, companyId: App.companyId,
    companyName: App.companyName, slot: slot, confirmed: true
  };
  let rows;
  try { rows = S.buildValueRows({ rows: st.rows }, tag); }
  catch (e) { alert(e.message); return; }

  S.listValues(slot, App.viewingUid).then(existing => {
    /* ══════ 1) 같은 서류를 다시 읽었나 ══════
       사업장·월·근로자 **그리고 출처 서류**가 다 같으면 같은 서류를 다시 읽은
       것이다(캡처는 실제로 두 번 올라온다). 그때는 그 자리에 다시 쓰는 것이 옳다.
       findDuplicateValue 는 "그 자리"의 id 를 돌려준다 — 여기서 그 id 를 버리고
       buildValueRows 가 새로 붙인 id 그대로 저장하면, "덮을까요" 라고 물어놓고
       실제로는 새 자리에 하나 더 쓰는 꼴이 된다. 옛 줄은 그대로 남고 새 줄이
       하나 더 생기니, 막으려던 "근무일수 두 배"가 동의를 받고서 그대로 일어난다.
       그래서 확인을 받은 다음에는 반드시 그 줄의 id 를 옛 자리 id 로 바꿔 끼워야
       실시간DB update() 가 같은 열쇠에 다시 써서 "덮어쓰기"가 이름 그대로 된다.

       ⚠ **다른** 서류는 중복이 아니다 — 근태표를 읽어 둔 근로자에게 수당변경
       카톡이 오는 것은 보통 있는 일이다. 그것까지 「이미 있다」로 잡아 덮으면
       앞 서류에서 나온 값이 통째로 사라진다(saveValues 는 줄을 통째로 쓴다). */
    const dupIds = {};   // 새로 만든 id → 이미 있는 자리의 id
    rows.forEach(r => {
      const existingId = S.findDuplicateValue(existing, r.companyId, r.month, r.name, r.sourceId);
      if (existingId) dupIds[r.id] = existingId;
    });
    const dup = rows.filter(r => dupIds[r.id]);
    if (dup.length) {
      const who = dup.map(r => r.name).join(', ');
      /* 「취소」는 이번 판독 전체를 안 쓰는 것이다(saveValues 가 한 묶음이라
         일부만 쓰는 길이 없다). 그러니 겹치지 않는 사람도 함께 안 써진다 —
         말과 실제가 어긋나지 않게 그 말을 그대로 적어 둔다. */
      if (!confirm('같은 서류를 다시 읽었습니다 — 앞서 저장한 값을 덮을까요?\n\n' + who
        + '\n\n「취소」를 누르면 이번 판독은 한 줄도 저장하지 않습니다'
        + ' — 위에 이름이 없는 사람도 저장되지 않습니다.')) return null;
      /* 「덮어쓰기」에 동의했다 — 이제 그 자리 id 로 바꿔 끼워야 진짜로 덮인다. */
      rows.forEach(r => { if (dupIds[r.id]) r.id = dupIds[r.id]; });
    }

    /* ══════ 2) 다른 서류와 항목이 겹치나 ══════
       겹쳐도 지우지 않는다 — 서류마다 제 줄이 남고, 값 표는 나중에 저장한 값을
       보여준다. 그래도 알리는 까닭은 표에 보이던 금액이 이번 값으로 바뀌기
       때문이다. 여기 「취소」도 위와 같은 뜻이다 — 한 줄도 저장하지 않는다. */
    const laps = [];
    rows.forEach(r => { (S.findValueOverlaps(existing, r) || []).forEach(o => laps.push(o)); });
    if (laps.length) {
      const lines = laps.map(o => '· ' + o.name + ' — ' + o.item).join('\n');
      if (!confirm('다른 서류에서 이미 들어온 항목이 있습니다.\n\n' + lines
        + '\n\n앞 서류의 값은 지우지 않고 그대로 둡니다(그 값을 누르면 그 서류가 열립니다).'
        + '\n값 표에는 나중에 저장한 이번 값이 보입니다.'
        + '\n\n「확인」을 누르면 이대로 저장하고,'
        + ' 「취소」를 누르면 이번 판독은 한 줄도 저장하지 않습니다.')) return null;
    }
    /* 표가 몇 사람분인지를 **도착 칸에도** 적는다(대표 지시 2026-08-17) — 그래야
       사업장 목록이 「담김 — 판독 전」과 「표 7명」을 가릴 수 있다.
       ⚠ 이미 있던 줄과 이번 줄을 **함께** 센다. 이번 것만 세면 두 번째 서류를
       읽었을 때 사람 수가 오히려 줄어든다. */
    const co = App.companyId;
    const people = S.valuePeopleCount(existing, co, rows);
    return S.saveValues(slot, rows, App.viewingUid, { companyId: co, people: people });
  }).then(n => {
    if (n === null || n === undefined) return;
    App.readState = { status: 'idle', rows: [], err: '' };
    alert(n + '줄을 저장했습니다. 「이 달 값 보기」에서 볼 수 있습니다.');
    App.render();
  }).catch(e => alert('저장하지 못했습니다 — ' + (e.code || e.message)));
}
window.saveVals = saveVals;

/* ══════ 가릴 곳 고르기 (설계서 4장) ══════
   판독기로 보내기 전에 반드시 거치는 화면이다. 판독 결과가 뜨던 자리를 그대로
   쓴다 — 폰에서 위아래로 쌓이는 규칙(#viewerBody.split)을 다시 만들지 않으려고. */
function maskPanelHtml() {
  const ms = App.maskState;
  if (ms.status === 'loading') {
    return '<div id="readPanel"><div class="ph"><b>가릴 곳 고르기</b></div>'
      + '<div class="pbody"><div class="pre"><div class="big">⏳</div>'
      + '<p>사진을 불러오는 중입니다…</p></div></div></div>';
  }
  if (ms.status === 'err') {
    return '<div id="readPanel"><div class="ph"><b>가릴 곳 고르기</b></div>'
      + '<div class="pbody"><div class="pre"><div class="big">⚠</div><p>' + esc(ms.err) + '</p>'
      + '<button class="btn" onclick="maskCancel()">닫기</button></div></div></div>';
  }
  const n = (ms.boxes || []).length;
  const boxes = (ms.boxes || []).map((b, i) =>
    '<div class="maskbox ' + (b.by === 'ai' ? 'ai' : 'me') + '" style="left:' + (b.x * 100)
    + '%;top:' + (b.y * 100) + '%;width:' + (b.w * 100) + '%;height:' + (b.h * 100) + '%">'
    + '<span class="x" onpointerdown="event.stopPropagation()" onclick="maskDelBox(' + i + ')">✕</span></div>').join('');
  return '<div id="readPanel"><div class="ph"><b>가릴 곳 고르기</b></div>'
    + '<div class="pbody">'
    /* 이 문구는 기계가 몇 곳을 찾았든 사라지지 않는다 — 마지막 판단은 사람이다. */
    + '<div class="badline">⚠ 기계가 못 찾은 것이 있을 수 있습니다 — 눈으로 한 번 훑어 주세요</div>'
    + (ms.autoNote ? '<div class="maskhint">' + esc(ms.autoNote) + '</div>' : '')
    /* ⚠ ondragstart 를 막는 것이 핵심이다 — 이것이 긋기를 가로챈다(위 CSS 머리말).
       onpointercancel 은 **maskUp 이 아니라 maskCancelDrag** 를 부른다: 끊긴
       순간의 좌표는 시작점 언저리라 믿을 수 없고, 마지막으로 움직인 자리를 써야
       사람이 그은 사각형이 남는다. */
    + '<div id="maskWrap" class="maskwrap" ondragstart="return false"'
    + ' onpointerdown="maskDown(event)" onpointermove="maskMove(event)"'
    + ' onpointerup="maskUp(event)" onpointercancel="maskCancelDrag()">'
    + '<img id="maskImg" src="' + esc(ms.url) + '" alt="" draggable="false">' + boxes
    + '<div id="maskPreview" class="maskbox me" style="display:none"></div>'
    + '</div>'
    + '<div class="maskhint">사진 위를 손가락이나 마우스로 그으면 그 자리가 가려집니다.<br>'
    + '급여대장처럼 주민번호가 한 줄로 있으면 <b>세로로 길게 한 번</b>만 그으면 됩니다.</div>'
    + '</div>'
    + '<div class="pfoot">'
    + (n ? '<button class="btn" onclick="maskUndo()">되돌리기</button>'
         + '<button class="btn" onclick="maskClear()">다 지우기</button>' : '')
    + '<span class="sub">' + (n ? n + '군데 가림' : '가린 곳 없음') + '</span>'
    + '<button class="btn pri" onclick="maskConfirm()">'
    + (n ? n + '군데 가리고 판독' : '가릴 것 없음 — 그대로 판독') + '</button>'
    + '</div></div>';
}

/* ── 긋기 ── **공용 층으로 옮겼다**(대표 결정 2026-08-17 「안 1」).
   사진첩에도 같은 가림이 필요해졌는데, 복사하면 두 벌이 되어 한쪽만 고쳐진다 —
   가림은 틀리면 **주민번호가 그대로 나가는** 기능이라 특히 위험하다.
   ⚠ 옮긴 것은 «계산·긋기»뿐이다. 화면 모양(HTML·CSS)은 두 앱이 서로 달라 그대로 뒀다.
   ⚠ 손잡이 이름과 요소 id(maskWrap·maskImg·maskPreview)는 그대로다 —
     화면 HTML 을 한 글자도 안 고쳐도 되게 하려는 것이다. */
PuRrnMaskUi.init({
  state: function () { return App.maskState; },
  render: function () { App.render(); }
});
const maskDown = PuRrnMaskUi.down;
const maskMove = PuRrnMaskUi.move;
const maskUp = PuRrnMaskUi.up;
const maskCancelDrag = PuRrnMaskUi.cancelDrag;
const maskDelBox = PuRrnMaskUi.delBox;
const maskUndo = PuRrnMaskUi.undo;
const maskClear = PuRrnMaskUi.clear;

/* 가림을 그만두면 판독도 안 한다 — 안 가린 채로 새는 길을 두지 않는다. */
function maskCancel() {
  App.maskState = { status: 'idle', url: '', boxes: [], err: '', autoNote: '' };
  App.render();
}

/* ══════ 기계가 거들기 (설계서 5장, 2차) ══════
   ⚠ 사진은 **밖으로 나가지 않는다.** 글자인식은 이 컴퓨터(브라우저) 안에서 돈다.
     받아 오는 것은 사진이 아니라 도구와 글자 사전이다. 사진을 보내 읽게 하면
     막으려던 것을 그대로 하는 꼴이다.
   ⚠ 무거워서(사전까지 10MB 남짓) **처음 쓸 때** 받는다 — 판독을 안 쓰는 사람이
     미리 받을 이유가 없다. */
const OCR_SRC = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let ocrLoading = null;

function loadOcr() {
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (ocrLoading) return ocrLoading;
  ocrLoading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = OCR_SRC;
    s.onload = () => (window.Tesseract ? res(window.Tesseract) : rej(new Error('글자인식 도구를 못 읽었습니다')));
    s.onerror = () => rej(new Error('글자인식 도구를 받지 못했습니다'));
    document.head.appendChild(s);
  });
  return ocrLoading;
}

/* 낱말과 그 자리를 돌려준다. 주민번호는 숫자와 하이픈뿐이라 영문 사전으로 넉넉하다.
   ⚠ 숫자만 읽으라고 묶어 두지(whitelist) 않는다 — 글자를 억지로 숫자로 우겨 넣어
   엉뚱한 곳을 주민번호로 잡는다. */
function ocrWords(dataUrl) {
  return loadOcr().then(T => T.recognize(dataUrl, 'eng')).then(r => {
    const words = (r && r.data && r.data.words) || [];
    return words.map(w => {
      const b = w.bbox || w;
      return { text: w.text, x0: b.x0, y0: b.y0, x1: b.x1, y1: b.y1 };
    });
  });
}

/* 찾아서 미리 칠한다. **아무것도 던지지 않는다** — 기계가 못 도는 것이
   판독을 막는 이유가 되면 안 된다(설계서 5장). 막으면 사람들은 스위치를 꺼
   버리거나 다른 길로 돌아간다.
   ⚠ 사람이 기다리는 동안 그어 둔 사각형을 지우거나 덮지 않는다 — 뒤에 더한다.
   ⚠ 그 사이 다른 서류로 옮겨 갔으면 버린다 — 앞 사진의 자리가 이 사진에 얹히면
     엉뚱한 데가 가려지고 진짜 주민번호는 그대로 나간다. */
function maskAutoFind(dataUrl, forId) {
  const img = new Image();
  img.onload = () => {
    ocrWords(dataUrl).then(words => {
      if (App.viewerId !== forId || App.maskState.status !== 'ready') return;
      const found = PuRrnMask.boxesFromWords(words, img.naturalWidth, img.naturalHeight);
      App.maskState.boxes = App.maskState.boxes.concat(found);
      App.maskState.autoNote = found.length
        ? '기계가 ' + found.length + '곳을 찾아 미리 가렸습니다(빨간 칸).'
        : '기계가 찾은 것은 없습니다 — 직접 봐 주세요.';
      App.render();
    }).catch(() => {
      if (App.viewerId !== forId || App.maskState.status !== 'ready') return;
      App.maskState.autoNote = '기계 찾기를 못 했습니다 — 직접 봐 주세요.';
      App.render();
    });
  };
  img.onerror = () => { /* 사진을 못 읽어도 사람이 칠하는 길은 그대로 열려 있다 */ };
  img.src = dataUrl;
}
window.maskAutoFind = maskAutoFind;
window.maskDown = maskDown; window.maskMove = maskMove; window.maskUp = maskUp;
window.maskCancelDrag = maskCancelDrag;
window.maskDelBox = maskDelBox; window.maskUndo = maskUndo; window.maskClear = maskClear;
window.maskCancel = maskCancel;

/* 오른쪽 절반 — 판독 전에는 단추, 판독 뒤에는 값 표. */
function readPanelHtml() {
  /* 가릴 곳을 고르는 중이면 그 화면이 이 자리를 쓴다 — 판독 결과는 그다음이다. */
  if (App.maskState && App.maskState.status !== 'idle') return maskPanelHtml();
  /* 어떤 판독기를 쓰는지는 **열려 있는 서류**가 정한다(서랍 탭이 아니다) —
     값 표에서 연 서류는 App.kind 와 아무 상관이 없다(startMask 머리말과 같은 까닭). */
  const rec = App.viewerId ? findRow(App.viewerId) : null;
  const rk = S.readKindFor(rec && rec.kind);
  const st = App.readState || { status: 'idle', rows: [], err: '' };
  let body;

  if (rk === 'wage' && !WAGE_READ_ON) {
