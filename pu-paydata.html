    + esc(r.filename || '(이름 없음)') + '</b>'
    + (r.expired ? '<span class="expbadge">지난 것</span>' : '')
    + '<span class="sub" style="margin:0">' + (r.filedAt ? new Date(r.filedAt).toLocaleDateString() : '') + '</span>'
    + (editable
      ? '<select class="btn" style="font-size:11.5px;padding:4px 6px" onclick="event.stopPropagation()"'
        + ' onchange="assignFolder(\'' + esc(r.id) + '\',this.value)">'
        + folderOpts.replace('value="' + esc(r.folder || '') + '"', 'value="' + esc(r.folder || '') + '" selected')
        + '</select>'
        + '<button class="btn" onclick="event.stopPropagation();toTrash(\'' + esc(r.id) + '\')" title="휴지통으로">🗑</button>'
      : (r.folder && App.folders[r.folder] ? '<span class="sub" style="margin:0">' + esc(App.folders[r.folder].name) + '</span>' : ''))
    + '</div>').join('')
    : '<div class="empty">' + (App.query ? '찾는 자료가 없습니다.'
      : (App.folderPick !== 'all' ? '이 폴더에 담긴 자료가 없습니다.'
        : '이 칸에 담긴 자료가 없습니다. 다른 월이나 다른 종류를 보세요.')) + '</div>')
    + '</div>';
  return h;
}

/* 급여관리로 이 달 값 넘기기(4차) — 사유를 묻지 않는다. 이미 서랍을 열어
   확인한 사람이 스스로 넘기는 것이므로 열람 사유와는 다른 종류다(그저 넘긴
   사실만 handoff_log 에 남는다). 권한 없는 사람은 단추 자체가 안 보인다. */
function handoffMonth() {
  if (!S.canHandoffPayroll()) return;
  /* ⚠ 값을 **여기서 새로 읽는다** — 화면이 들고 있는 App.values 를 세면 안 된다.
     App.values 는 「이 달 값 보기」에 들어갈 때만 채워진다. 업체를 바꿔 들어오거나
     기준 월을 바꾸거나 남의 자리로 옮기는 길에는 채워지지도, 비워지지도 않는다.
     그래서 화담원 값 표(12줄)를 본 뒤 다른 업체로 와서 이 단추를 누르면
     「그 업체 … 12줄」이라 묻고, 급여관리 수신함에도 그 업체가 12줄 정리된 것으로
     적힌다. 급여관리 담당자가 「이 달 준비됐다」를 아는 유일한 신호가 거짓이 된다.
     반대로 값 표를 한 번도 안 연 사람에게는 다 정리된 달을 「값이 없습니다」라고 한다. */
  const companyId = App.companyId, companyName = App.companyName, month = App.month;
  return fetchValues(companyId).then(values => {
    /* 서류 장수가 아니라 **값 줄 수**를 센다 — 급여관리가 보는 것은
       「이 사업장 이 달 자료가 정리됐나」다(설계서 4장). */
    const g = valueGridModel(values);
    const total = g.people.reduce((n, p) => n + Object.keys(p.cells).length, 0);
    if (!total) { alert('이 달에 정리된 값이 없습니다.\n먼저 서류를 판독해 값을 만들어 주세요.'); return null; }
    if (!confirm(companyName + ' ' + month + ' 값(' + total + '줄)이 정리됐다고 급여관리에 알릴까요?\n\n값 자체는 넘어가지 않습니다 — 계산은 바깥 프로그램에서 하십니다.')) return null;
    return S.handoffToPayroll({ companyId: companyId, companyName: companyName, month: month, rowCount: total })
      .then(() => alert('급여관리 수신함으로 넘겼습니다.'));
  }).catch(e => alert('넘기지 못했습니다 — ' + (e.code || e.message)));
}
window.handoffMonth = handoffMonth;

/* 자료 한 줄의 「폴더 지정」 골라잡기 — 있는 폴더만 나온다. 새 폴더는 폴더 칸의
   「+ 폴더」로 만든다(그 자리에서 이름을 적는 방식 하나로 통일한다). */
/* firstLabel 은 「폴더 없음」 자리(값이 빈 줄)의 글자다 — 한꺼번에 옮기는
   차림표에서는 같은 자리가 「폴더에서 빼기」라는 **행동**이 된다. */
function folderOptionsHtml(folders, firstLabel) {
  const f = folders || {};
  const tops = Object.keys(f).filter(id => !f[id].parent)
    .sort((a, b) => (f[a].createdAt || 0) - (f[b].createdAt || 0));
  let h = '<option value="">' + esc(firstLabel || '폴더 없음') + '</option>';
  tops.forEach(fid => {
    h += '<option value="' + esc(fid) + '">' + esc(f[fid].name || '') + '</option>';
    Object.keys(f).filter(id => f[id].parent === fid)
      .sort((a, b) => (f[a].createdAt || 0) - (f[b].createdAt || 0))
      .forEach(kid => { h += '<option value="' + esc(kid) + '">↳ ' + esc(f[kid].name || '') + '</option>'; });
  });
  return h;
}

/* ── 확대 보기 (사진첩과 같은 방식) ──
   사진은 눌러서 원본 크기로 확대한다(서류 글씨를 읽어야 한다). 엑셀·PDF 는
   미리 볼 수 없으니 새 창에서 여는 안내만 보여준다. */
function findRow(id) {
  const boxes = [App.itemsKeep, App.itemsMonth];
  for (let i = 0; i < boxes.length; i++) { if (boxes[i] && boxes[i][id]) return boxes[i][id]; }
  return null;
}

/* 사진인가 — 뷰어가 <img> 로 그릴 수 있는가, 그리고 AI 판독기에 실을 수 있는가.
   ⚠ 판독 층(js/pu-doc-read.js)은 무엇을 싣든 image/jpeg 라고 말하고 보낸다.
   사진첩·명함첩·업체관리가 함께 쓰는 파일이라 이 함에서 고칠 수 없다. 그래서
   PDF·엑셀을 보내면 구글이 400 을 돌려주고, 화면에는 「AI가 응답하지 않습니다
   (오류 400)」로 떠 서비스가 죽은 것처럼 보인다 — 부르는 쪽에서 미리 가른다. */
function isImageRec(rec) { return !!rec && /^image\//.test(rec.mime || ''); }
function openViewer(id) {
  App.viewerId = id; App.viewerUrl = ''; App.viewerZoom = false; App.viewerErr = '';
  App.readState = { status: 'idle', rows: [], err: '' };
  App.render();
  const rec = findRow(id);
  if (!rec) { App.viewerErr = '자료를 찾을 수 없습니다.'; App.render(); return; }
  S.fileDownloadUrl(rec.file).then(url => { App.viewerUrl = url; App.render(); })
    .catch(e => { App.viewerErr = e.message; App.render(); });
}
function closeViewer() { App.viewerId = ''; App.render(); }
function toggleViewerZoom(ev) {
  if (ev && ev.target && ev.target.tagName !== 'IMG') return;   // 바깥을 눌러도 확대되지 않는다
  App.viewerZoom = !App.viewerZoom; App.render();
}
window.openViewer = openViewer; window.closeViewer = closeViewer; window.toggleViewerZoom = toggleViewerZoom;

/* ══════ 판독 스위치 (2026-08-15 대표 지시로 **둘 다 켰다**) ══════
   아래는 켜기 전에 적어 두었던 까닭과, 켠 지금도 **그대로 남아 있는 위험**이다.
   켰다고 위험이 없어진 것이 아니다.

   급여대장(WAGE_READ_ON): 근로자 **성명·임금액**이 담긴 사진이 구글로 나간다.
   처리위탁 근거(설계서 9장)는 서류로 정리할 일이지 코드로 막을 것이 없어
   대표 판단으로 켠다.

   알림(NOTICE_READ_ON — 입퇴사 통보·수당 변경 카톡): 입퇴사 통보 캡처에는
   거의 언제나 **주민등록번호가 함께 찍혀 있다.** 프롬프트의 「담지 마세요」는
   **답에 안 담으라는 말일 뿐, 사진 자체는 그대로 구글로 올라간다.**
   이 점을 대표께 알리고 「감수하고 켠다」는 답을 받아 켰다(2026-08-15).

   ⚠ 다음에 손대는 사람이 반드시 알 것
     · 보내기 전에 **주민번호를 가리는 화면**이 있다(2026-08-15, startMask·maskConfirm).
       그래도 마지막 판단은 사람이다 — 못 보고 넘긴 것은 그대로 나간다.
     · 지금은 **사람이 손으로 칠한다.** 기계가 인쇄체를 찾아 미리 칠해 주는 것은
       아직 없다(계획서 2026-08-15-주민번호-가림 2차). 그때까지는 눈으로 훑어야 한다.
     · 근태표는 임금액도 주민번호도 없어 처음부터 켜져 있었다(readKindFor).
   ⚠ 이 값을 바꿀 때는 tests/paydata-read-panel.test.js 의 짝 검사도 함께 고친다. */
const WAGE_READ_ON = true;

const NOTICE_READ_ON = true;

/* 「판독하기」를 누르면 **바로 판독하지 않는다** — 먼저 가릴 곳을 고른다(설계서 3장).
   막을 것(종류·권한·스위치·사진인가)은 여기서 그대로 막는다. 창고 파일은 여기서
   한 번만 받아 두고, 가림 화면과 사본 만들기가 그것을 함께 쓴다. */
function startMask() {
  const rec = findRow(App.viewerId);
  if (!rec) return;
  /* 판독 방식은 **지금 열려 있는 서류**가 정한다 — 서랍 탭(App.kind)이 정하면,
     월별 값 표에서 출처 서류를 눌러 열었을 때 마지막으로 눌러 둔 탭이 그대로
     쓰인다. 근태표를 열어 놓고 알림 판독기로 읽는 일이 실제로 일어난다. */
  const rk = S.readKindFor(rec.kind);
  if (!rk || !canWrite()) return;
  if (rk === 'wage' && !WAGE_READ_ON) return;
  if (rk === 'notice' && !NOTICE_READ_ON) return;
  /* 사진이 아니면 아예 부르지 않는다 — 보내 봐야 오류 400 이고(isImageRec 머리말),
     그 사이 판독 한 번 값도 나간다. 무엇이 문제인지 한국어로 남긴다. */
  if (!isImageRec(rec)) {
    App.readState = { status: 'err', rows: [],
      err: 'PDF·엑셀·한글 파일은 판독할 수 없습니다 — 사진으로 찍거나 화면을 캡처해 올려 주세요.' };
    App.render();
    return;
  }
  App.readState = { status: 'idle', rows: [], err: '' };
  App.maskState = { status: 'loading', url: '', boxes: [], err: '', autoNote: '' };
  App.render();

  const forId = App.viewerId;
  S.fileToDataUrl(rec.file, rec.mime).then(dataUrl => {
    if (App.viewerId !== forId) return;    // 다른 서류로 옮겨 갔다 — 이 답은 버린다
    App.maskState = { status: 'ready', url: dataUrl, boxes: [], err: '', autoNote: '' };
    App.render();
  }).catch(e => {
    if (App.viewerId !== forId) return;
    App.maskState = { status: 'err', url: '', boxes: [], err: (e && e.message) || String(e), autoNote: '' };
    App.render();
  });
}
window.startMask = startMask;

/* 가린 사본을 만들어 판독으로 넘긴다.
   ⚠ 판독기로 가는 길은 **여기 하나뿐**이다(검사가 지킨다). 가린 곳이 없으면
   원본을 그대로 넘긴다 — 가릴 것이 없다고 사람이 보고 누른 것이므로. */
function maskConfirm() {
  const ms = App.maskState;
  if (!ms || ms.status !== 'ready') return;
  const rec = findRow(App.viewerId);
  if (!rec) return;
  const rk = S.readKindFor(rec.kind);
  if (!rk) return;
  let dataUrl = ms.url;
  if (ms.boxes.length) {
    try { dataUrl = PuRrnMask.maskToDataUrl($('maskImg'), ms.boxes); }
    catch (e) {
      /* 못 만들었으면 **원본을 보내지 않는다.** 가리려던 것을 못 가린 채
         보내는 것이 이 기능이 막으려던 바로 그 일이다. */
      alert('가린 사진을 만들지 못했습니다 — ' + ((e && e.message) || e) + '\n판독하지 않았습니다.');
      return;
    }
  }
  App.maskState = { status: 'idle', url: '', boxes: [], err: '', autoNote: '' };
  runRead(rk, dataUrl);
}
window.maskConfirm = maskConfirm;

/* 실제 판독. **가림을 거쳐 나온 사본만** 여기로 들어온다. */
function runRead(rk, dataUrl) {
  App.readState = { status: 'reading', rows: [], err: '' };
  App.render();

  /* 판독 중에 다른 서류로 옮겨 갈 수 있다. 그때 늦게 온 답이 새 화면을 덮으면
     **엉뚱한 원본이 출처로 붙는다** — 값마다 출처를 붙이는 이 설계에서 가장
     나쁜 고장이다(없는 것보다 틀린 것이 나쁘다. 아무도 의심하지 않으므로). */
  const forId = App.viewerId;
  const job = (rk === 'timesheet')
    ? PuDocRead.read(dataUrl).then(r => ({ ok: !r.error, error: r.error, parsed: (r && r.fields) || {} }))
    : ((rk === 'wage') ? PuDocRead.readWageTable(dataUrl) : PuDocRead.readChangeNotice(dataUrl))
        .then(r => ({ ok: r.ok, error: r.error, parsed: r }));

  job.then(res => {
    if (App.viewerId !== forId) return;   // 이미 다른 서류를 보고 있다 — 이 답은 버린다
    if (!res.ok) throw new Error(res.error || '판독하지 못했습니다');
    const rows = S.rowsFromRead(rk, res.parsed);
    if (!rows.length) throw new Error('사람별 값을 읽어내지 못했습니다 — 직접 적어 주세요.');
    App.readState = { status: 'done', rows: rows, err: '' };
    App.render();
  }).catch(e => {
    if (App.viewerId !== forId) return;   // 옮겨 간 뒤라면 실패도 새 화면에 묻히면 안 된다
    App.readState = { status: 'err', rows: [], err: (e && e.message) || String(e) };
    App.render();
  });
}

/* ══════ 같은 이름이 둘 (대표 결정 2026-08-15 — 「지금은 막기만」) ══════
   값은 근로자 **이름 하나로만** 묶인다(valueGridModel 이 byName 으로 모은다).
   그래서 한 사업장·한 달에 김민수가 둘이면 두 사람 값이 **한 줄로 합쳐지고**
   나중에 저장한 값이 앞 값을 덮는다 — 화면에는 「김민수」 한 줄로 보여
   합쳐진 줄도 모른다. 급여에 그대로 쓰이는 숫자다.

   ⚠ 한 서류 안에 같은 이름이 두 번 있으면 더 나쁘다. 그 서류를 다시 판독해
   저장할 때 두 줄이 사업장·월·이름·출처가 모두 같아 **같은 자리**로 몰리고
   (findDuplicateValue), 한 줄이 조용히 사라진다.

   근본 해결(사번·근로자 명단)은 급여대장 판독을 켤 때 함께 정하기로 했다 —
   지금 켜진 것은 근태표뿐이고 거기에는 사번이 거의 안 적혀 있어 가를 재료가 없다.
   그때까지는 **저장을 막고 사람이 갈라 적게** 한다. */
function dupNames(rows) {
  const seen = {}, dup = [];
  (rows || []).forEach(r => {
    const n = String((r && r.name) || '').trim();
    if (!n) return;                       // 빈 이름은 따로 본다(blankNames)
    if (seen[n] === 1) { dup.push(n); seen[n] = 2; }
    else if (!seen[n]) seen[n] = 1;
  });
  return dup;
}

/* 이름이 비어 있는 줄 — 저장해 봐야 값 표에 안 나온다(그쪽이 이름 없는 줄을 건너뛴다).
   「직접 적기」로 연 빈 줄을 안 채우고 저장하면 그대로 쓰레기가 쌓인다. */
function blankNames(rows) {
  return (rows || []).filter(r => !String((r && r.name) || '').trim()).length;
}

/* 그 줄에 칠할 색 — 같은 이름(빨강)이 확실하지 않음(노랑)보다 급하다. */
function rowMarkClass(r, dupMap) {
  if (dupMap[String((r && r.name) || '').trim()]) return 'dup';
  return r && r.iffy ? 'iffy' : '';
}

/* 읽어 온 값을 고칠 수 있는 표로. 한 줄 = 한 사람의 한 항목이다. */
function valueRowsHtml(rows) {
  const dupMap = {};
  dupNames(rows).forEach(n => { dupMap[n] = 1; });
  let h = '<table class="vals"><tr><th style="width:28%">근로자</th>'
        + '<th style="width:32%">항목</th><th>값</th><th style="width:26px">지움</th></tr>';
  (rows || []).forEach((r, i) => {
    const pairs = r.pairs || [];
    pairs.forEach((p, j) => {
      /* 줄마다 이름표(id)를 준다 — 사람이 고칠 때 표를 통째로 다시 그리지 않고
         이 줄의 칠만 손보기 위해서다(editVal 머리말 참고). */
      h += '<tr id="vrow_' + i + '_' + j + '" class="' + rowMarkClass(r, dupMap) + '">'
        /* ⚠ 이름 칸은 **그 사람의 첫 줄에만** 둔다. 예전에는 항목마다 같은 이름 칸을
           되풀이해 그렸다 — 한 칸에서 이름을 고쳐도 아래 칸들은 옛 이름 그대로 남아,
           고치는 사람 눈에는 한 사람이 두 사람으로 갈라진 것처럼 보였다. */
        + (j === 0 ? '<td rowspan="' + pairs.length + '"><input id="vnm_' + i + '" value="' + esc(r.name)
            + '" oninput="editVal(' + i + ',\'name\',this.value)"></td>' : '')
        + '<td><input id="vit_' + i + '_' + j + '" value="' + esc(p.item) + '" oninput="editVal(' + i + ',\'item\',this.value,' + j + ')"></td>'
        + '<td><input id="vvl_' + i + '_' + j + '" value="' + esc(p.value) + '" oninput="editVal(' + i + ',\'value\',this.value,' + j + ')"></td>'
        + '<td><span class="del" title="이 항목만 지웁니다" onclick="delValItem(' + i + ',' + j + ')">✕</span></td></tr>';
    });
  });
  return h + '</table>';
}

/* 고치면 그 줄의 노란 표시를 걷는다 — 확인이 끝났다는 뜻이다.
   ⚠ 여기서 App.render() 를 부르면 안 된다. 이 함수는 oninput 으로 **글자 하나마다**
   불린다 — 다시 그리면 지금 치고 있는 칸이 통째로 새로 만들어져 한 글자 칠 때마다
   커서를 잃는다. 그래서 화면은 그 줄의 노란 칠과 「⚠ N줄」 알림만 손본다.
   (자료만 고치고 화면을 안 건드리면 노란색이 안 걷혀, 표시가 없는 것과 같아진다) */
function editVal(i, key, v, j) {
  const r = (App.readState.rows || [])[i];
  if (!r) return;
  if (key === 'name') r.name = v;
  else if (r.pairs && r.pairs[j]) r.pairs[j][key] = v;
  if (r.iffy) r.iffy = false;
  /* 이름을 고치면 **같은 이름 표시가 늘 수도 줄 수도** 있다 — 노란 칠만 걷던
     예전과 달리 늘 다시 맞춘다(고치다 새로 겹치게 만들었는데 조용하면 안 된다). */
  refreshIffyMarks();
}

/* 줄 칠과 위쪽 알림 두 줄을 **다시 그리지 않고** 지금 화면에 맞춘다.
   (이름이 「같은 이름」인지는 다른 줄까지 봐야 알 수 있어 그 줄만 볼 수 없다) */
function refreshIffyMarks() {
  const rows = (App.readState && App.readState.rows) || [];
  const dupMap = {}, dups = dupNames(rows);
  dups.forEach(n => { dupMap[n] = 1; });
  rows.forEach((r, i) => {
    (r.pairs || []).forEach((p, j) => {
      const tr = $('vrow_' + i + '_' + j);
      if (tr) tr.className = rowMarkClass(r, dupMap);
    });
  });
  const dupLine = $('dupLine');
  if (dupLine) {
    if (!dups.length) { dupLine.style.display = 'none'; }
    else {
      dupLine.style.display = '';
      dupLine.innerHTML = '⚠ <b>같은 이름</b>이 있습니다 — ' + esc(dups.join(', '))
        + '<br>뒤에 부서나 구분을 적어 갈라 주세요(예: 김민수(생산)). 그대로는 저장되지 않습니다.';
    }
  }
  const line = $('iffyLine');
  if (!line) return;
  const n = rows.filter(r => r.iffy).length;
  if (!n) { line.style.display = 'none'; return; }
  line.style.display = '';
  line.innerHTML = '⚠ <b>' + n + '줄</b>은 확실하지 않습니다 — 노란 줄부터 봐 주세요.';
}
function addValRow() {
  App.readState.rows.push({ name: '', pairs: [{ item: '', value: '' }], iffy: false });
  App.render();
}

/* AI가 못 읽었을 때 손으로 적기 시작한다 — 빈 표 한 줄로 연다.
   판독을 거치지 않았을 뿐, 그 뒤(고치기·저장·출처 붙이기)는 완전히 같은 길이다. */
function startManualRows() {
  if (!canWrite()) return;
  App.readState = { status: 'done', rows: [{ name: '', pairs: [{ item: '', value: '' }], iffy: false }], err: '' };
  App.render();
}
window.startManualRows = startManualRows;
/* 그 사람을 통째로 뺀다(항목 전부). 표의 ✕ 는 이것을 부르지 않는다 — 아래 참고. */
function delValRow(i) { App.readState.rows.splice(i, 1); App.render(); }

/* ✕ 는 **그 항목 하나만** 지운다.
   예전에는 항목 옆의 ✕ 가 그 사람의 값을 통째로 지웠다 — 「식대」를 지우려고
   눌렀는데 유급일수·가감까지 함께 사라졌고, 되돌릴 길이 없었다(칸에 이름표도
   없어 무엇을 지우는 단추인지 알 수도 없었다).
   마지막 항목을 지우면 그 사람도 함께 빠진다 — 항목이 하나도 없는 사람은
   저장해도 값 줄이 되지 않기 때문이다(buildValueRows). */
function delValItem(i, j) {
  const rows = (App.readState && App.readState.rows) || [];
  const r = rows[i];
  if (!r) return;
  (r.pairs || []).splice(j, 1);
  if (!r.pairs || !r.pairs.length) rows.splice(i, 1);
  App.render();
}
window.editVal = editVal; window.addValRow = addValRow;
window.delValRow = delValRow; window.delValItem = delValItem;

/* 확인한 값을 저장한다. 값마다 출처(이 서류 번호)가 붙는다 —
   buildValueRows 가 sourceId 없이는 거절한다. */
function saveVals() {
  if (!canWrite()) return;
  const st = App.readState;
  if (!st || st.status !== 'done' || !st.rows.length) return;

  /* ⚠ 같은 이름이 둘이면 **저장하지 않는다**(dupNames 머리말).
     경고만 하고 저장을 열어 두면 아무도 안 읽는다 — 그리고 합쳐진 뒤에는
     어느 값이 누구 것이었는지 되돌릴 길이 없다. */
  const dups = dupNames(st.rows);
  if (dups.length) {
    alert('같은 이름이 둘 이상 있습니다 — 저장하지 않았습니다.\n\n' + dups.join(', ')
      + '\n\n값은 근로자 이름으로 묶입니다. 그대로 저장하면 두 사람 값이 한 줄로 합쳐지고'
      + '\n나중에 저장한 값이 앞 값을 덮습니다.'
      + '\n\n뒤에 부서나 구분을 적어 갈라 주세요 — 예: 김민수(생산) · 김민수(관리)');
    return;
  }
  const blank = blankNames(st.rows);
  if (blank) {
    alert('이름이 비어 있는 줄이 ' + blank + '개 있습니다 — 저장하지 않았습니다.'
      + '\n이름이 없으면 값 표에 나오지 않습니다. 채우거나 ✕ 로 지워 주세요.');
    return;
  }

  const slot = S.monthKey(App.month) || S.KEEP;
  /* confirmed: true — **「저장」을 누른 것이 곧 사람의 확인이다.** 원본을 옆에 놓고
     줄을 고친 뒤 스스로 누른 것이므로 더 물을 것이 없다. 여기서 확인 표시를 안 하면
     값 표의 노란 칸과 「⚠ 확인 안 된 값이 N개」가 영영 안 걷혀, 한 달만 지나면
     노랑이 「원래 그런 것」이 된다 — 그때 정말 확인 안 된 값이 그대로 넘어간다
     (설계서 3장 ②). */
  const tag = {
    sourceId: App.viewerId, companyId: App.companyId,
    companyName: App.companyName, slot: slot, confirmed: true
  };
  let rows;
  try { rows = S.buildValueRows({ rows: st.rows }, tag); }
  catch (e) { alert(e.message); return; }

  S.listValues(slot, App.viewingUid).then(existing => {
    /* ══════ 1) 같은 서류를 다시 읽었나 ══════
       사업장·월·근로자 **그리고 출처 서류**가 다 같으면 같은 서류를 다시 읽은
       것이다(캡처는 실제로 두 번 올라온다). 그때는 그 자리에 다시 쓰는 것이 옳다.
       findDuplicateValue 는 "그 자리"의 id 를 돌려준다 — 여기서 그 id 를 버리고
       buildValueRows 가 새로 붙인 id 그대로 저장하면, "덮을까요" 라고 물어놓고
       실제로는 새 자리에 하나 더 쓰는 꼴이 된다. 옛 줄은 그대로 남고 새 줄이
       하나 더 생기니, 막으려던 "근무일수 두 배"가 동의를 받고서 그대로 일어난다.
       그래서 확인을 받은 다음에는 반드시 그 줄의 id 를 옛 자리 id 로 바꿔 끼워야
       실시간DB update() 가 같은 열쇠에 다시 써서 "덮어쓰기"가 이름 그대로 된다.

       ⚠ **다른** 서류는 중복이 아니다 — 근태표를 읽어 둔 근로자에게 수당변경
       카톡이 오는 것은 보통 있는 일이다. 그것까지 「이미 있다」로 잡아 덮으면
       앞 서류에서 나온 값이 통째로 사라진다(saveValues 는 줄을 통째로 쓴다). */
    const dupIds = {};   // 새로 만든 id → 이미 있는 자리의 id
    rows.forEach(r => {
      const existingId = S.findDuplicateValue(existing, r.companyId, r.month, r.name, r.sourceId);
      if (existingId) dupIds[r.id] = existingId;
    });
    const dup = rows.filter(r => dupIds[r.id]);
    if (dup.length) {
      const who = dup.map(r => r.name).join(', ');
      /* 「취소」는 이번 판독 전체를 안 쓰는 것이다(saveValues 가 한 묶음이라
         일부만 쓰는 길이 없다). 그러니 겹치지 않는 사람도 함께 안 써진다 —
         말과 실제가 어긋나지 않게 그 말을 그대로 적어 둔다. */
      if (!confirm('같은 서류를 다시 읽었습니다 — 앞서 저장한 값을 덮을까요?\n\n' + who
        + '\n\n「취소」를 누르면 이번 판독은 한 줄도 저장하지 않습니다'
        + ' — 위에 이름이 없는 사람도 저장되지 않습니다.')) return null;
      /* 「덮어쓰기」에 동의했다 — 이제 그 자리 id 로 바꿔 끼워야 진짜로 덮인다. */
      rows.forEach(r => { if (dupIds[r.id]) r.id = dupIds[r.id]; });
    }

    /* ══════ 2) 다른 서류와 항목이 겹치나 ══════
       겹쳐도 지우지 않는다 — 서류마다 제 줄이 남고, 값 표는 나중에 저장한 값을
       보여준다. 그래도 알리는 까닭은 표에 보이던 금액이 이번 값으로 바뀌기
       때문이다. 여기 「취소」도 위와 같은 뜻이다 — 한 줄도 저장하지 않는다. */
    const laps = [];
    rows.forEach(r => { (S.findValueOverlaps(existing, r) || []).forEach(o => laps.push(o)); });
    if (laps.length) {
      const lines = laps.map(o => '· ' + o.name + ' — ' + o.item).join('\n');
      if (!confirm('다른 서류에서 이미 들어온 항목이 있습니다.\n\n' + lines
        + '\n\n앞 서류의 값은 지우지 않고 그대로 둡니다(그 값을 누르면 그 서류가 열립니다).'
        + '\n값 표에는 나중에 저장한 이번 값이 보입니다.'
        + '\n\n「확인」을 누르면 이대로 저장하고,'
        + ' 「취소」를 누르면 이번 판독은 한 줄도 저장하지 않습니다.')) return null;
    }
    return S.saveValues(slot, rows, App.viewingUid);
  }).then(n => {
    if (n === null || n === undefined) return;
    App.readState = { status: 'idle', rows: [], err: '' };
    alert(n + '줄을 저장했습니다. 「이 달 값 보기」에서 볼 수 있습니다.');
    App.render();
  }).catch(e => alert('저장하지 못했습니다 — ' + (e.code || e.message)));
}
window.saveVals = saveVals;

/* ══════ 가릴 곳 고르기 (설계서 4장) ══════
   판독기로 보내기 전에 반드시 거치는 화면이다. 판독 결과가 뜨던 자리를 그대로
   쓴다 — 폰에서 위아래로 쌓이는 규칙(#viewerBody.split)을 다시 만들지 않으려고. */
function maskPanelHtml() {
  const ms = App.maskState;
  if (ms.status === 'loading') {
    return '<div id="readPanel"><div class="ph"><b>가릴 곳 고르기</b></div>'
      + '<div class="pbody"><div class="pre"><div class="big">⏳</div>'
      + '<p>사진을 불러오는 중입니다…</p></div></div></div>';
  }
  if (ms.status === 'err') {
    return '<div id="readPanel"><div class="ph"><b>가릴 곳 고르기</b></div>'
      + '<div class="pbody"><div class="pre"><div class="big">⚠</div><p>' + esc(ms.err) + '</p>'
      + '<button class="btn" onclick="maskCancel()">닫기</button></div></div></div>';
  }
  const n = (ms.boxes || []).length;
  const boxes = (ms.boxes || []).map((b, i) =>
    '<div class="maskbox ' + (b.by === 'ai' ? 'ai' : 'me') + '" style="left:' + (b.x * 100)
    + '%;top:' + (b.y * 100) + '%;width:' + (b.w * 100) + '%;height:' + (b.h * 100) + '%">'
    + '<span class="x" onpointerdown="event.stopPropagation()" onclick="maskDelBox(' + i + ')">✕</span></div>').join('');
  return '<div id="readPanel"><div class="ph"><b>가릴 곳 고르기</b></div>'
    + '<div class="pbody">'
    /* 이 문구는 기계가 몇 곳을 찾았든 사라지지 않는다 — 마지막 판단은 사람이다. */
    + '<div class="badline">⚠ 기계가 못 찾은 것이 있을 수 있습니다 — 눈으로 한 번 훑어 주세요</div>'
    + (ms.autoNote ? '<div class="maskhint">' + esc(ms.autoNote) + '</div>' : '')
    /* ⚠ ondragstart 를 막는 것이 핵심이다 — 이것이 긋기를 가로챈다(위 CSS 머리말).
       onpointercancel 은 **maskUp 이 아니라 maskCancelDrag** 를 부른다: 끊긴
       순간의 좌표는 시작점 언저리라 믿을 수 없고, 마지막으로 움직인 자리를 써야
       사람이 그은 사각형이 남는다. */
    + '<div id="maskWrap" class="maskwrap" ondragstart="return false"'
    + ' onpointerdown="maskDown(event)" onpointermove="maskMove(event)"'
    + ' onpointerup="maskUp(event)" onpointercancel="maskCancelDrag()">'
    + '<img id="maskImg" src="' + esc(ms.url) + '" alt="" draggable="false">' + boxes
    + '<div id="maskPreview" class="maskbox me" style="display:none"></div>'
    + '</div>'
    + '<div class="maskhint">사진 위를 손가락이나 마우스로 그으면 그 자리가 가려집니다.<br>'
    + '급여대장처럼 주민번호가 한 줄로 있으면 <b>세로로 길게 한 번</b>만 그으면 됩니다.</div>'
    + '</div>'
    + '<div class="pfoot">'
    + (n ? '<button class="btn" onclick="maskUndo()">되돌리기</button>'
         + '<button class="btn" onclick="maskClear()">다 지우기</button>' : '')
    + '<span class="sub">' + (n ? n + '군데 가림' : '가린 곳 없음') + '</span>'
    + '<button class="btn pri" onclick="maskConfirm()">'
    + (n ? n + '군데 가리고 판독' : '가릴 것 없음 — 그대로 판독') + '</button>'
    + '</div></div>';
}

/* ── 긋기 ──
   ⚠ 움직이는 동안 App.render() 를 부르면 안 된다. 다시 그리면 지금 손이 얹혀
   있는 요소가 통째로 새로 만들어져 드래그가 끊긴다(판독 표에서 글자마다 다시
   그리지 않는 것과 같은 까닭). 그래서 움직이는 동안에는 미리 보이는 칸 하나만
   손보고, 손을 뗄 때 한 번 다시 그린다. */
let maskDrag = null;

/* 사진이 **화면에 보이는 크기** — 원본 크기가 아니다. 비율로 바꾸는 데 쓴다. */
function maskViewRect() {
  const img = $('maskImg');
  return img ? img.getBoundingClientRect() : null;
}

function maskDown(ev) {
  const r = maskViewRect();
  if (!r) return;
  ev.preventDefault();
  /* ⚠ 마지막으로 움직인 자리(x1·y1)를 따로 기억한다. 브라우저가 도중에 끊으면
     (pointercancel) 그 순간 좌표는 시작점 언저리로 돌아와 있어, 그것만 믿으면
     사람이 분명히 그은 사각형이 「너무 작다」며 버려진다 — 그래서 아무 칸도
     안 생겼다(대표 지적 2026-08-16). */
  const x0 = ev.clientX - r.left, y0 = ev.clientY - r.top;
  maskDrag = { x0: x0, y0: y0, x1: x0, y1: y0, moved: false };
  try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (_) { /* 손가락 못 잡아도 그리기는 된다 */ }
  maskShowPreview(x0, y0, x0, y0);
}

function maskMove(ev) {
  if (!maskDrag) return;
  const r = maskViewRect();
  if (!r) return;
  ev.preventDefault();
  maskDrag.x1 = ev.clientX - r.left;
  maskDrag.y1 = ev.clientY - r.top;
  maskDrag.moved = true;
  maskShowPreview(maskDrag.x0, maskDrag.y0, maskDrag.x1, maskDrag.y1);
}

/* 손을 뗐다 — 뗀 자리가 가장 정확하다. */
function maskUp(ev) {
  const r = maskViewRect();
  if (!r || !maskDrag) { maskFinishDrag(null, null); return; }
  maskFinishDrag(ev.clientX - r.left, ev.clientY - r.top);
}

/* 브라우저가 끊었다 — 그 순간 좌표는 못 믿으니 **마지막으로 움직인 자리**를 쓴다.
   막는 장치(draggable="false")가 실패해도 사람이 그은 것은 이 길로 남는다. */
function maskCancelDrag() {
  const d = maskDrag;
  maskFinishDrag(d && d.moved ? d.x1 : null, d && d.moved ? d.y1 : null);
}

function maskFinishDrag(x1, y1) {
  const d = maskDrag;
  maskDrag = null;
  maskHidePreview();
  if (!d) return;
  const r = maskViewRect();
  if (!r) return;
  if (x1 == null || y1 == null) return;   // 움직인 적이 없다 — 그냥 누르기만 했다
  const box = PuRrnMask.rectFromDrag(d.x0, d.y0, x1, y1, r.width, r.height);
  if (!box) return;                       // 점만 찍은 것은 사각형이 아니다
  box.by = 'me';
  App.maskState.boxes.push(box);
  App.render();
}

function maskShowPreview(x0, y0, x1, y1) {
  const el = $('maskPreview');
  const r = maskViewRect();
  if (!el || !r) return;
  const left = Math.min(x0, x1), top = Math.min(y0, y1);
  el.style.display = '';
  el.style.left = (left / r.width * 100) + '%';
  el.style.top = (top / r.height * 100) + '%';
  el.style.width = (Math.abs(x1 - x0) / r.width * 100) + '%';
  el.style.height = (Math.abs(y1 - y0) / r.height * 100) + '%';
}

function maskHidePreview() {
  const el = $('maskPreview');
  if (el) el.style.display = 'none';
}

/* 기계가 칠한 것도 지울 수 있다 — 잘못 잡는 일이 실제로 있다(계좌번호 등). */
function maskDelBox(i) { App.maskState.boxes.splice(i, 1); App.render(); }
function maskUndo() { App.maskState.boxes.pop(); App.render(); }
function maskClear() { App.maskState.boxes = []; App.render(); }

/* 가림을 그만두면 판독도 안 한다 — 안 가린 채로 새는 길을 두지 않는다. */
function maskCancel() {
  App.maskState = { status: 'idle', url: '', boxes: [], err: '', autoNote: '' };
  App.render();
}
window.maskDown = maskDown; window.maskMove = maskMove; window.maskUp = maskUp;
window.maskCancelDrag = maskCancelDrag;
window.maskDelBox = maskDelBox; window.maskUndo = maskUndo; window.maskClear = maskClear;
window.maskCancel = maskCancel;

/* 오른쪽 절반 — 판독 전에는 단추, 판독 뒤에는 값 표. */
function readPanelHtml() {
  /* 가릴 곳을 고르는 중이면 그 화면이 이 자리를 쓴다 — 판독 결과는 그다음이다. */
  if (App.maskState && App.maskState.status !== 'idle') return maskPanelHtml();
  /* 어떤 판독기를 쓰는지는 **열려 있는 서류**가 정한다(서랍 탭이 아니다) —
     값 표에서 연 서류는 App.kind 와 아무 상관이 없다(startMask 머리말과 같은 까닭). */
  const rec = App.viewerId ? findRow(App.viewerId) : null;
  const rk = S.readKindFor(rec && rec.kind);
  const st = App.readState || { status: 'idle', rows: [], err: '' };
  let body;

  if (rk === 'wage' && !WAGE_READ_ON) {
    body = '<div class="pre"><div class="big">🔒</div><p><b>급여대장 판독은 준비 중입니다.</b><br>'
      + '근로자 성명·임금액이 밖으로 나가는 문제를 먼저 정리한 뒤 켭니다.</p></div>';
  } else if (rk === 'notice' && !NOTICE_READ_ON) {
    /* 급여대장과 같은 모양으로 알린다 — 한쪽만 「준비 중」이고 다른 쪽은 아무 말
       없이 안 되면, 고장인지 막아 둔 것인지 사람이 가릴 수 없다. */
    body = '<div class="pre"><div class="big">🔒</div><p><b>알림 판독은 준비 중입니다.</b><br>'
      + '입퇴사 통보 캡처에는 주민등록번호가 함께 찍혀 있습니다 —<br>'
      + '그것이 밖으로 나가는 문제를 먼저 정리한 뒤 켭니다.</p></div>';
  } else if (!rk || !canWrite()) {
    body = '<div class="pre"><div class="big">📄</div><p>'
      + (!rk ? '이 종류는 값을 뽑지 않습니다.' : '남의 자리에서는 판독할 수 없습니다.')
      + '</p></div>';
  } else if (!isImageRec(rec)) {
    /* 「이 파일은 미리 볼 수 없습니다」 옆에 판독 단추를 두면 안 된다 — 눌러 봐야
       오류 400 이고(isImageRec 머리말), 사람은 서비스가 죽은 줄 안다. */
    body = '<div class="pre"><div class="big">📄</div><p><b>이 파일은 판독할 수 없습니다.</b><br>'
      + 'AI는 사진만 읽습니다 — PDF·엑셀·한글 파일은<br>'
      + '사진으로 찍거나 화면을 캡처해 올려 주세요.</p></div>';
  } else if (st.status === 'reading') {
    body = '<div class="pre"><div class="big">⏳</div><p>읽는 중입니다…</p></div>';
  } else if (st.status === 'done') {
    const n = st.rows.length;
    const iffy = st.rows.filter(r => r.iffy).length;
    const dups = dupNames(st.rows);
    /* ⚠ 같은 이름 알림 자리는 **없어도 미리 만들어 둔다**(안 보이게). 사람이 이름을
       고치다 새로 겹치게 만들 수 있는데, 그때는 다시 그리지 않으므로(글자마다 다시
       그리면 커서를 잃는다) 자리가 없으면 알릴 곳이 없다.
       노란 알림은 줄기만 하므로 그럴 필요가 없다. */
    body = '<div class="okline">사람 <b>' + n + '명</b>의 값을 읽었습니다. 원본과 견주어 확인해 주세요.</div>'
      + '<div class="badline" id="dupLine"' + (dups.length ? '' : ' style="display:none"') + '>'
      + (dups.length ? '⚠ <b>같은 이름</b>이 있습니다 — ' + esc(dups.join(', '))
        + '<br>뒤에 부서나 구분을 적어 갈라 주세요(예: 김민수(생산)). 그대로는 저장되지 않습니다.' : '')
      + '</div>'
      + (iffy ? '<div class="warnline" id="iffyLine">⚠ <b>' + iffy + '줄</b>은 확실하지 않습니다 — 노란 줄부터 봐 주세요.</div>' : '')
      + valueRowsHtml(st.rows)
      + '<div class="sub" style="margin-top:10px;line-height:1.7">저장하면 값마다 '
      + '<b>이 서류가 출처로</b> 붙습니다 — 나중에 값을 누르면 이 원본이 열립니다.</div>';
  } else if (st.status === 'err') {
    /* 「직접 적어 주세요」라고 해 놓고 적을 칸을 안 주면 그 말이 거짓말이 된다 —
       못 읽었을 때야말로 손으로 적을 길이 있어야 한다(예전에는 다시 판독뿐이었다). */
    body = '<div class="pre"><div class="big">⚠</div><p>' + esc(st.err) + '</p>'
      + '<button class="btn pri" onclick="startMask()">🔍 다시 판독</button> '
      + '<button class="btn" onclick="startManualRows()">✍ 직접 적기</button></div>';
  } else {
    body = '<div class="pre"><div class="big">🔍</div><p>아직 읽지 않았습니다.<br>'
      + '누르면 AI가 이 서류를 읽어 <b>사람별 표</b>로 만듭니다.<br>'
      + '읽은 뒤 확인하고 저장해야 값으로 남습니다.</p>'
      + '<button class="btn pri" onclick="startMask()">🔍 판독하기</button> '
      + '<button class="btn" onclick="startManualRows()">✍ 직접 적기</button></div>';
  }
  const foot = (st.status === 'done')
    ? '<div class="pfoot"><span class="sub">' + st.rows.length + '명</span>'
      + '<button class="btn" onclick="addValRow()">＋ 줄</button>'
      + '<button class="btn pri" onclick="saveVals()">저장</button></div>'
    : '';
  return '<div id="readPanel"><div class="ph"><b>판독 결과</b></div>'
    + '<div class="pbody">' + body + '</div>' + foot + '</div>';
}

/* App.render() 가 화면을 바꿀 때마다 함께 그린다 — 뷰어는 어느 화면 위에도 뜰 수 있다. */
function renderViewer() {
  const v = $('viewer');
  if (!v) return;
  const rec = App.viewerId ? findRow(App.viewerId) : null;
  v.classList.toggle('on', !!App.viewerId);
  if (!App.viewerId) return;
  $('viewerName').textContent = rec ? (rec.filename || '') : '';
  const outer = $('viewerBody');
  /* 판 가르기도 **열려 있는 서류** 기준이다 — 서랍 탭으로 가르면 값 표에서 연
     근로계약서 옆에 판독 패널이 붙거나, 근태표를 열었는데 안 붙는다. */
  const rk = S.readKindFor(rec && rec.kind);
  outer.classList.toggle('split', !!rk);
  const body = $('viewerShot');
  body.classList.toggle('zoom', App.viewerZoom);
  const isImage = isImageRec(rec);
  if (App.viewerErr) {
    body.innerHTML = '<div class="doc">불러오지 못했습니다 — ' + esc(App.viewerErr) + '</div>';
  } else if (!App.viewerUrl) {
    body.innerHTML = '<div class="doc">불러오는 중…</div>';
  } else if (isImage) {
    body.innerHTML = '<img src="' + esc(App.viewerUrl) + '" alt="">';
  } else {
    body.innerHTML = '<div class="doc">이 파일은 미리 볼 수 없습니다.<br>'
      + '<a href="' + esc(App.viewerUrl) + '" target="_blank" rel="noopener">새 창에서 열기</a></div>';
  }
  /* 판독 패널은 원본을 그린 뒤에 붙인다 — 위에서 innerHTML 을 갈아 끼우므로 */
  const old = document.getElementById('readPanel');
  if (old && old.parentNode) old.parentNode.removeChild(old);
  if (rk) outer.insertAdjacentHTML('beforeend', readPanelHtml());
}

/* ══════ 휴지통 (Task 12) ══════
   지운 자료는 정보만 옮긴다. 창고 파일은 그 자리에 그대로 둔다 —
   함께 지우면 되살릴 수 없다. 30일 뒤 실삭제는 사람이 확인해서 한다
   (자동 삭제는 어디에도 만들지 않는다). */

/* 서랍에서 지운다. findRow 가 keep 칸·이 달 칸을 모두 뒤져 자료를 찾는다
   (뷰어가 쓰는 것과 같은 함수 — 두 칸 중 어디 있는지 화면이 몰라도 된다). */
function toTrash(id) {
  if (!canWrite()) return;
  const rec = findRow(id);
  if (!rec) return;
  if (!confirm('휴지통으로 옮길까요?\n30일 안에는 되살릴 수 있습니다.')) return;
  db.ref().update(S.trashUpdate(id, rec, App.viewingUid)).then(() => {
    if (App.itemsKeep && App.itemsKeep[id]) delete App.itemsKeep[id];
    if (App.itemsMonth && App.itemsMonth[id]) delete App.itemsMonth[id];
    refreshArrivals();   // 도착 표시도 내려갔다 — 목록 숫자를 맞춘다
    App.render();
  }).catch(e => alert('실패: ' + (e.code || e.message)));
}
window.toTrash = toTrash;

function ensureTrash() {
  const seat = seatNow();
  return S.listTrash(seat).then(v => { if (!seatSame(seat)) return; App.trash = v; App.render(); })
    .catch(e => { console.warn('[휴지통]', e && e.code); if (!seatSame(seat)) return; App.trash = {}; App.render(); });
}

function screenTrash() {
  const box = App.trash || {};
  const ids = Object.keys(box).sort((a, b) => (box[b].trashedAt || 0) - (box[a].trashedAt || 0));
  let h = '<div style="margin-bottom:10px"><button class="btn" onclick="App.go(\'sites\')">← 사업장</button></div>'
    + '<h1>휴지통</h1><div class="sub">지운 뒤 ' + S.TRASH_DAYS + '일 안에는 되살릴 수 있습니다 · ' + ids.length + '건</div>';
  if (!ids.length) return h + '<div class="card"><div class="empty">휴지통이 비어 있습니다.</div></div>';
  const now = Date.now();
  h += '<div class="card">' + ids.map((id, i) => {
    const r = box[id];
    const over = S.trashExpired(r, now);
    return '<div class="row">'
      + '<span class="pkno">' + (i + 1) + '</span>'
      + '<span style="flex:1">' + esc(r.filename || '(이름 없음)')
      /* 대기 칸에서 지운 것은 사업장이 없다 — 빈 줄로 두면 「업체를 못 읽었나」로
         읽힌다. 어디서 지웠는지, 되살리면 어디로 가는지를 그대로 적는다. */
      + '<div class="sub" style="margin:2px 0 0">'
      + (r.fromPending ? '대기 칸에서 지움 — 되살리면 대기 칸으로'
        : esc(r.companyName || r.companyId || '')) + '</div></span>'
      + (over ? '<span class="expbadge">30일 지남</span>' : '')
      + (canWrite() ? '<button class="btn" onclick="restoreItem(\'' + esc(id) + '\')">되살리기</button>' : '')
      + '</div>';
  }).join('') + '</div>';
  return h;
}

function restoreItem(id) {
  if (!canWrite()) return;
  const rec = (App.trash || {})[id];
  if (!rec) return;
  db.ref().update(S.restoreUpdate(id, rec, App.viewingUid)).then(() => {
    delete App.trash[id];
    // 되살아난 칸을 다시 읽어야 서랍이 최신 자료를 본다 — 다음에 그 서랍에
    // 들어갈 때 새로 읽어 오게 캐시를 비운다.
    App.itemsKeep = null; App.itemsMonthSlot = ''; App.itemsMonth = null;
    /* 대기 칸에서 지운 것은 대기 칸으로 돌아간다 — 그 칸도 다시 읽어야
       「되살렸다는데 어디에도 없다」가 되지 않는다. */
    if (rec.fromPending) {
      const seat = seatNow();
      S.listMyPending(seat).then(p => { if (seatSame(seat)) { App.pending = p; App.render(); } })
        .catch(e => console.warn('[대기 칸]', e && e.code));
    }
    refreshArrivals();   // 도착 표시가 다시 올라갔다 — 목록 숫자를 맞춘다
    App.render();
  }).catch(e => alert('실패: ' + (e.code || e.message)));
}
window.restoreItem = restoreItem;

/* ══════ 2차 — 이름 골라 보기 · 열람 사유 · 휴가 대리 ══════
   남의 자리를 볼 때는 항상 이 흐름을 거친다: 이름 고르기 → (대리가 아니면)
   사유 적기 → 자리 전환. 대리로 맡은 자리는 사유 없이 바로 들어간다 —
   맡아 달라고 부탁받은 자리라 매번 이유를 적게 하면 일이 안 된다. */

/* 지금 이 자리에서 고칠 수 있는가 — 내 자리이거나, 대리로 맡은 자리일 때만.
   서버 규칙이 어차피 막지만, 단추를 안 보이게 해 헛눌러 실패하는 일을 줄인다. */
function canWrite() { return !App.viewingUid || App.viewingDeputy; }

function bannerHtml() {
  // 공유받아 들어온 자리는 초록 띠가 우선이다 — "왜 여기 왔는지"가 사유 대신 이미 있다.
  if (App.sharedBanner) {
    return '<div class="seatbar shared">🤝 <b>' + esc(App.sharedBanner.byName) + '</b>님이 공유함 — '
      + esc((App.sharedBanner.tags || []).join(', '))
      + '<button class="btn" onclick="leaveSeat()">내 자리로</button></div>';
  }
  if (!App.viewingUid) return '';
  if (App.viewingDeputy) {
    return '<div class="seatbar deputy">✏ <b>' + esc(App.viewingName) + ' 자리</b> — 맡은 자리입니다'
      + '<button class="btn" onclick="leaveSeat()">내 자리로</button></div>';
  }
  /* 총괄관리자로 열었을 때는 **기록이 남는다**는 것을 띠에 적는다(대표 지시
     2026-08-17). 사유를 안 물었다고 해서 몰래 보는 것이 아니라는 뜻이다. */
  if (App.viewingAdmin) {
    return '<div class="seatbar adm">👑 <b>총괄관리자</b> — ' + esc(App.viewingName)
      + ' 자리를 보고 있습니다 (열람 기록이 남습니다)'
      + '<button class="btn" onclick="leaveSeat()">내 자리로</button></div>';
  }
  return '<div class="seatbar view">👁 <b>' + esc(App.viewingName) + ' 자리</b> — 보기만 가능합니다'
    + '<button class="btn" onclick="leaveSeat()">내 자리로</button></div>';
}

function openStaffPicker() {
  App.staffOpen = true; App.staffQuery = ''; App.reasonPrompt = null;
  App.render();
  S.listOwners().then(v => {
    App.staffList = Object.keys(v).map(uid => Object.assign({ uid: uid }, v[uid]));
    App.render();
  }).catch(e => { console.warn('[담당자 명단]', e && e.code); App.staffList = []; App.render(); });
}
function closeStaffPicker() { App.staffOpen = false; App.reasonPrompt = null; App.render(); }
window.openStaffPicker = openStaffPicker; window.closeStaffPicker = closeStaffPicker;

function staffPickerHtml() {
  if (!App.staffOpen) return '';
  let body;
  if (App.reasonPrompt) {
    body = '<div class="sub">' + esc(App.reasonPrompt.targetName || App.reasonPrompt.targetUid) + ' 자리를 왜 보시나요?</div>'
      + '<input id="reasonInput" class="btn" style="width:100%;margin:8px 0" placeholder="예: 급여 문의 확인"'
      + ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();submitReason();}">'
      + '<div style="display:flex;gap:8px;justify-content:flex-end">'
      + '<button class="btn" onclick="App.reasonPrompt=null;App.render()">취소</button>'
      + '<button class="btn pri" onclick="submitReason()">확인</button></div>';
  } else {
    const q = String(App.staffQuery || '').trim().toLowerCase();
    const list = (App.staffList || []).filter(o => o.uid !== S.myUid())
      .filter(o => !q || String(o.name || '').toLowerCase().indexOf(q) >= 0)
      .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ko'));
    body = '<input id="staffFind" class="btn" style="width:100%;margin-bottom:8px" placeholder="이름으로 찾기"'
      + ' value="' + esc(App.staffQuery) + '" oninput="App.staffQuery=this.value;App.render()">'
      + (list.length ? list.map(o =>
        '<div class="row" style="cursor:pointer" onclick="pickStaff(\'' + jsq(o.uid) + '\',\''
        + jsq(o.name || o.uid) + '\')"><b style="flex:1">' + esc(o.name || o.uid) + '</b></div>').join('')
        : '<div class="empty">한 번이라도 로그인한 다른 사람이 아직 없습니다.</div>');
  }
  return '<div class="modalWrap on"><div class="modalCard">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
    + '<h2>' + (App.reasonPrompt ? '열람 사유' : '담당자 고르기') + '</h2>'
    + '<button class="btn" onclick="closeStaffPicker()">✕</button></div>' + body + '</div></div>';
}

/* ── 총괄관리자는 사유를 묻지 않는다 (대표 지시 2026-08-17) ──
   담당자끼리는 「왜 보시나요」가 맞다. 하지만 총괄관리자는 **보는 것이 일**이라
   열 때마다 이유를 적게 하면 걸림돌만 된다.
   ⚠ 그렇다고 기록까지 없애지는 않는다 — 「총괄 점검」으로 자동으로 남긴다.
   없어지는 것은 **기록**이 아니라 **적는 손**이다.
   ⚠ 기록이 실패하면 그냥 들여보내지 않고 사유 화면으로 되돌린다 — 안 그러면
   「기록은 남는다」가 조용히 거짓말이 된다. */
function adminOpen(uid, name, go) {
  return S.logAccess({ targetUid: uid, targetName: name, reason: '총괄 점검' })
    .then(() => { go(); return true; })
    .catch(e => { console.warn('[열람 기록]', e && e.code); return false; });
}

/* 이름을 고르면 먼저 대리 여부부터 확인한다 — 맡은 자리면 사유 없이 바로 들어간다. */
function pickStaff(uid, name) {
  const askReason = () => {
    App.reasonPrompt = { targetUid: uid, targetName: name };
    App.render();
    setTimeout(() => { const el = $('reasonInput'); if (el) el.focus(); }, 0);
  };
  db.ref(S.deputyPath(S.myUid(), uid)).once('value').then(s => {
    const active = S.isActiveDeputy(s.val(), Date.now());
    if (active) { enterSeat(uid, name, true); closeStaffPicker(); return; }
    if (S.amAdmin()) {
      return adminOpen(uid, name, () => { enterSeat(uid, name, false, true); closeStaffPicker(); })
        .then(ok => { if (!ok) askReason(); });
    }
    askReason();
  }).catch(e => alert('확인하지 못했습니다 — ' + (e.code || e.message)));
}
window.pickStaff = pickStaff;

function submitReason() {
  const p = App.reasonPrompt; if (!p) return;
  const inp = $('reasonInput');
  const reason = inp ? String(inp.value || '').trim() : '';
  if (!reason) { alert('사유를 적어 주세요.'); return; }
  S.logAccess({ targetUid: p.targetUid, targetName: p.targetName, reason: reason }).then(() => {
    enterSeat(p.targetUid, p.targetName, false);
    closeStaffPicker();
  }).catch(e => alert('기록하지 못했습니다 — ' + (e.code || e.message)));
}
window.submitReason = submitReason;

/* 자리를 옮긴다. 대기 칸·서랍·폴더·휴지통 캐시를 모두 비운다 — 안 비우면
   방금 전 자리의 자료가 새 자리 화면에 그대로 남는다. */
function resetOwnerCaches() {
  App.pending = {}; App.itemsKeep = null; App.itemsMonth = null; App.itemsMonthSlot = '';
  App.folders = {}; App.foldersCompanyId = ''; App.folderPick = 'all'; App.trash = null; App.pick = {};
  /* 고쳐 둔 이름표도 함께 버린다 — 자리마다 대기 칸이 따로라, 남겨 두면 번호가
     우연히 같은 남의 자료에 내가 고른 사업장이 붙는다. */
  App.pendTag = {};
  /* 값도 반드시 비운다 — 자리마다 값 칸이 따로다. 안 비우면 방금 보던 자리의
     근로자 이름이 새 자리 값 표에 그대로 남고, 그 수가 급여관리 알림에 실린다. */
  App.values = null;
}
/* asAdmin 은 「총괄관리자로 열었다」는 표시다 — 띠 문구만 가른다. 고칠 수 있는지는
   여전히 대리 여부로만 정한다(canWrite). 관리자라도 남의 자리는 보기만 한다. */
function enterSeat(uid, name, isDeputy, asAdmin) {
  App.viewingUid = uid; App.viewingName = name; App.viewingDeputy = !!isDeputy; App.sharedBanner = null;
  App.viewingAdmin = !!asAdmin;
  resetOwnerCaches();
  App.screen = 'sites';
  loadSites();
  App.render();
}
function leaveSeat() {
  App.viewingUid = ''; App.viewingName = ''; App.viewingDeputy = false; App.sharedBanner = null;
  App.viewingAdmin = false;
  resetOwnerCaches();
  App.screen = 'sites';
  loadSites();
  App.render();
}
window.leaveSeat = leaveSeat;

/* enterSeat 과 같지만 사업장 목록을 거치지 않고 그 업체 서랍으로 곧장 들어간다
   (좌측 대시보드에서 업체를 직접 골랐을 때 쓴다). sharedInfo 를 주면 "공유받음"
   초록 띠가 뜨고, 안 주면 지금처럼 보기/대리 띠가 뜬다. */
function enterSeatAt(uid, name, isDeputy, companyId, companyName, sharedInfo, asAdmin) {
  App.viewingUid = uid; App.viewingName = name; App.viewingDeputy = !!isDeputy;
  App.viewingAdmin = !!asAdmin;
  App.sharedBanner = sharedInfo || null;
  resetOwnerCaches();
  App.go('drawer', { companyId: companyId, companyName: companyName, kind: 'attend', query: '' });
}

/* ══════ 2중 대시보드 그리기 (대표 결정 2026-08-17, 목업 4안+2안) ══════
   ① 보기·담당자 칸(viewbar) ② 사업장 목록 칸(colist) ③ 본문(main).
   옛 사람 트리(peopleBarHtml)를 걷어낸 자리다 — 한 사람이 20~33곳을 맡으니
   트리에 업체를 딸려 넣으면 한 명만 펼쳐도 화면이 두 배가 됐다. */

/* 두 칸이 함께 쓰는 재료 한 묶음. 한 곳에서 만들어야 첫 칸 숫자와 둘째 칸
   목록이 어긋나지 않는다 — 「아직 3곳」인데 목록에 5곳이 뜨면 못 믿는다. */
function sideCtx() {
  const now = Date.now();
  const d = new Date(now);
  return {
    companies: App.companies, dir: App.dir, owners: App.owners,
    arrivals: App.arrivals, shares: App.shares,
    myEmail: (App.me && App.me.email) || '', myUid: (App.me && App.me.uid) || '',
    month: App.month || thisMonth(), now: now,
    todayStart: new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(),
    isAdmin: S.amAdmin()
  };
}

function viewBarHtml() {
  const m = sideViewModel(sideCtx());

  function row(v) {
    const on = App.sideView === v.key;
    return '<div class="vrow' + (on ? ' sel' : '') + (v.warn ? ' warn' : '') + (v.bad ? ' bad' : '')
      + '" onclick="pickSideView(\'' + jsq(v.key) + '\')">'
      + '<b>' + esc(v.label) + '</b><span class="n">' + v.n + '</span></div>';
  }

  /* 「내 일」 넷은 모두에게, 「전체」 셋은 관리자에게만 — 계산 층이 이미 갈라
     돌려주므로 여기서는 자리만 나눈다(mine/late/today/shared 다음이 전체다). */
  const mineViews = m.views.filter(v => ['mine', 'late', 'today', 'shared'].indexOf(v.key) >= 0);
  const allViews = m.views.filter(v => ['all', 'alllate', 'noman'].indexOf(v.key) >= 0);

  let h = '<div class="ctitle">내 일</div>' + mineViews.map(row).join('');
  if (allViews.length) h += '<div class="ctitle">전체</div>' + allViews.map(row).join('');

  /* 담당자 진행률(목업 2안) — 관리자가 **누가 밀렸는지** 여기서 바로 본다.
     ⚠ 한 사람 = **한 줄**이다(대표 지적 2026-08-17). 진행률은 줄 바탕에 깔고,
     「아직 N곳」은 적지 않는다 — 0/28 이 이미 그 말이다. */
  if (m.people.length) {
    /* ⚠ 「아직 안 들어옴」과 「담당자 칸이 잘못됨」을 **갈라 짚는다**(대표 지시
       2026-08-17). 앞은 그 사람이 급여데이터함을 한 번 열면 풀리고, 뒤는
       업체관리를 고쳐야 한다 — 기다릴 일과 손댈 일이 다르다. 예전에는 둘 다
       그냥 연한 이름이라, 아무리 기다려도 안 풀리는 것을 기다리게 됐다. */
    const away = m.people.filter(p => p.away && !p.badSid).length;
    const bad = m.people.filter(p => p.badSid);
    h += '<div class="ctitle">담당자 · 도착/전체</div>';
    /* ⚠ 안내는 **한 줄**만 적고 긴 말은 title 로 옮긴다(대표 지시 2026-08-17
       「좌우가 균형있게」). 여섯 줄로 펼쳐 두면 그만큼 담당자 이름이 아래로
       밀려 화면 밖으로 나간다 — 정작 봐야 할 것이 안내에 가린다. */
    if (away) {
      h += '<div class="pnote" title="연한 이름은 아직 급여데이터함에 들어오지 않은 사람입니다.'
        + ' 그 사람이 한 번 로그인하면 풀립니다.">연한 이름 = 아직 안 들어옴</div>';
    }
    if (bad.length) {
      h += '<div class="pnote badnote" title="업체관리 담당자 칸에 사번이 아닌 값이 들어간 것입니다.'
        + ' 기다려도 안 풀립니다 — 업체관리에서 사번으로 고쳐 주세요.">'
        + '⚠ 빨간 ' + bad.length + ' — 업체관리 사번 고치기</div>';
    }
    h += m.people.map(p => {
      const on = App.sideView === 'p:' + p.sid;
      return '<div class="vrow prow' + (on ? ' sel' : '')
        + (p.badSid ? ' badsid' : (p.away ? ' off' : ''))
        + '" onclick="pickSideView(\'p:' + jsq(p.sid) + '\')"'
        /* 사번은 title 로 보여 준다 — 업체관리에서 담당자를 고칠 때 필요한 값인데
           줄에 적으면 이름이 밀려 잘린다(칸이 좁다). */
        + ' title="' + esc(p.name) + ' (' + esc(p.sid) + ') — ' + p.total + '곳 중 ' + p.done + '곳 도착'
        + (p.badSid ? ' · 업체관리 담당자 칸이 사번이 아닙니다(「' + esc(p.sid) + '」) — 고쳐야 열립니다'
          : (p.away ? ' · 아직 이 함에 들어오지 않았습니다' : '')) + '">'
        + '<span class="fill" style="width:' + p.pct + '%"></span>'
        + '<span class="pno">' + esc(p.no) + '</span>'
        + '<b>' + esc(p.name) + '</b>'
        + '<span class="n">' + p.done + '/' + p.total + '</span></div>';
    }).join('');
  }
  return h;
}
window.viewBarHtml = viewBarHtml;

function colListHtml() {
  const m = sideListModel(App.sideView, sideCtx(), {
    q: App.colQuery, filter: App.colFilter, order: App.myOrder
  });

  let h = '<div class="chead"><div class="ct">' + esc(m.title)
    + '<span class="n">' + m.rows.length + '곳</span></div>'
    /* ⚠ id 를 반드시 붙인다 — focusSnapshot 은 id 있는 칸만 되찾는다.
       빠뜨리면 한 글자 치고 커서가 빠진다(이미 네 곳에서 겪은 일). */
    + '<input id="colFind" placeholder="' + (m.showOwner ? '사업장·담당자 이름으로 찾기' : '사업장 이름으로 찾기')
    + '" value="' + esc(App.colQuery) + '" oninput="App.colQuery=this.value;App.render()">';
  if (!m.isShared) {
    const chip = (k, t) => '<button class="cochip' + (App.colFilter === k ? ' on' : '')
      + '" onclick="pickColFilter(\'' + k + '\')">' + t + '</button>';
    h += '<div class="cochips">' + chip('all', '전체 ' + m.counts.all)
      + chip('no', '안 온 곳 ' + m.counts.no) + chip('yes', '온 곳 ' + m.counts.yes) + '</div>';
  }
  h += '</div><div class="clist">';

  if (!m.rows.length) {
    h += '<div class="cempty">' + (App.colQuery ? '찾는 사업장이 없습니다.' : '해당하는 사업장이 없습니다.') + '</div>';
    return h + '</div>';
  }

  if (m.isShared) {
    /* 공유받음은 업체 줄이 아니라 「누가 무엇을 왜」가 붙은 줄이다.
       사유를 안 묻고 곧장 들어간다(대표 결정 2026-08-14). */
    h += m.rows.map(r => '<div class="crow" onclick="openShared(\'' + jsq(r.shareId) + '\')">'
      + '<span class="dot' + (r.arrived ? ' arr' : '') + '"></span>'
      + '<span class="nm">' + esc(r.name) + '</span>'
      + '<span class="tags" title="' + esc((r.tags || []).join(', ')) + '">'
      + esc((r.tags || []).join(', ')) + '</span>'
      + '<span class="own">' + esc(r.owner) + '</span></div>').join('');
    return h + '</div>';
  }

  h += m.rows.map((r, i) => {
    const drag = m.canOrder
      ? ' draggable="true" ondragstart="sideDragStart(event,\'' + jsq(r.id) + '\')"'
        + ' ondragover="event.preventDefault()" ondrop="sideDragDrop(event,\'' + jsq(r.id) + '\')"'
      : '';
    const away = !r.mine && r.ownerName && !r.ownerUid;
    /* 지금 서랍에 열어 놓은 곳을 짚어 준다 — 이것이 없어서 본문에는 텃골이
       열려 있는데 목록은 딴 사람 담당을 보여 주는 일이 생겼다(대표 지적). */
    const open = App.screen === 'drawer' && r.id === App.companyId;
    return '<div class="crow' + (away ? ' away' : '') + (open ? ' sel' : '') + '"' + drag
      + ' onclick="openColCompany(\'' + jsq(r.id) + '\',\'' + jsq(r.name) + '\',' + (r.mine ? 'true' : 'false')
      + ',\'' + jsq(r.ownerUid) + '\',\'' + jsq(r.ownerName) + '\')">'
      + (m.canOrder ? '<span class="handle">⠿</span>' : '<span class="cno">' + (i + 1) + '</span>')
      + '<span class="dot' + (r.arrived ? ' arr' : '') + '"></span>'
      + '<span class="nm">' + esc(r.name) + '</span>'
      + (m.showOwner && r.owner ? '<span class="own" title="' + esc(r.owner) + '">' + esc(r.owner) + '</span>' : '')
      + '<span class="cnt">' + r.count + '</span>'
      + (r.mine ? '<span class="share" onclick="event.stopPropagation();openShare(\'' + jsq(r.id) + '\',\''
        + jsq(r.name) + '\')" title="다른 담당자와 공유">↗</span>' : '')
      + '</div>';
  }).join('');
  return h + '</div>';
}
window.colListHtml = colListHtml;

/* 보기를 바꾸면 찾던 글자와 상태 칩은 그대로 두되, 목록 맨 위로 되돌린다 —
   앞 보기에서 내려가 있던 자리가 남으면 새 목록의 엉뚱한 곳을 보게 된다. */
function pickSideView(key) {
  App.sideView = String(key || 'mine');
  App.render();
  const el = $('colist'); if (el) { const l = el.querySelector('.clist'); if (l) l.scrollTop = 0; }
}
window.pickSideView = pickSideView;

function pickColFilter(k) { App.colFilter = String(k || 'all'); App.render(); }
window.pickColFilter = pickColFilter;

function toggleSideFold() { App.sideFold = !App.sideFold; App.render(); }
window.toggleSideFold = toggleSideFold;

/* 목록에서 업체를 눌렀을 때.
   내 업체면 곧장 서랍으로. 남의 업체면 그 사람 자리로 들어가되 대리가 아니면
   사유를 묻는다(대표 결정 2026-08-13 — 목록을 보는 것은 사유가 필요 없고,
   **여는** 순간에만 묻는다).
   ⚠ 아직 급여데이터함에 들어온 적 없는 담당자는 자리 자체가 없다 — 열려고
   하면 아무것도 없는 빈 서랍이 뜬다. 그래서 미리 말해 준다. */
function openColCompany(companyId, companyName, mine, ownerUid, ownerName) {
  if (mine) { sideOpenCompany('', '', companyId, companyName, true); return; }
  if (!ownerUid) {
    if (ownerName) {
      alert(ownerName + ' 님은 아직 급여데이터함에 들어온 적이 없어 자리를 열 수 없습니다.\n'
        + '그 담당자가 한 번 로그인하면 열립니다.');
      return;
    }
    // 담당자가 아예 없는 업체 — 내 자리에서 연다(업체관리에서 담당을 정해야 한다)
    App.go('drawer', { companyId: companyId, companyName: companyName, kind: 'attend', query: '' });
    return;
  }
  sideOpenCompany(ownerUid, ownerName, companyId, companyName, false);
}
window.openColCompany = openColCompany;


/* 내 업체는 곧장 서랍으로. 남의 업체는 대리 여부부터 확인해 — 맡은 자리면
   사유 없이 바로, 아니면 사유를 물은 뒤 들어간다(업체 "목록"을 보는 것 자체는
   이미 사유가 필요 없다 — 여기는 실제로 "여는" 순간이다). */
function sideOpenCompany(ownerUid, ownerName, companyId, companyName, isMe) {
  if (isMe) { App.go('drawer', { companyId: companyId, companyName: companyName, kind: 'attend', query: '' }); return; }
  const askReason = () => {
    App.sideReason = { targetUid: ownerUid, targetName: ownerName, companyId: companyId, companyName: companyName };
    App.render();
    setTimeout(() => { const el = $('sideReasonInput'); if (el) el.focus(); }, 0);
  };
  db.ref(S.deputyPath(S.myUid(), ownerUid)).once('value').then(s => {
    const active = S.isActiveDeputy(s.val(), Date.now());
    if (active) { enterSeatAt(ownerUid, ownerName, true, companyId, companyName); return; }
    // 총괄관리자는 사유를 묻지 않고 곧장 연다 — 기록은 「총괄 점검」으로 남는다.
    if (S.amAdmin()) {
      return adminOpen(ownerUid, ownerName,
        () => enterSeatAt(ownerUid, ownerName, false, companyId, companyName, null, true))
        .then(ok => { if (!ok) askReason(); });
    }
    askReason();
  }).catch(e => alert('확인하지 못했습니다 — ' + (e.code || e.message)));
}
window.sideOpenCompany = sideOpenCompany;

function closeSideReason() { App.sideReason = null; App.render(); }
window.closeSideReason = closeSideReason;

function submitSideReason() {
  const p = App.sideReason; if (!p) return;
  const inp = $('sideReasonInput');
  const reason = inp ? String(inp.value || '').trim() : '';
  if (!reason) { alert('사유를 적어 주세요.'); return; }
  S.logAccess({ targetUid: p.targetUid, targetName: p.targetName, reason: reason }).then(() => {
    App.sideReason = null;
    enterSeatAt(p.targetUid, p.targetName, false, p.companyId, p.companyName);
  }).catch(e => alert('기록하지 못했습니다 — ' + (e.code || e.message)));
}
window.submitSideReason = submitSideReason;

function sideReasonHtml() {
  const p = App.sideReason;
  if (!p) return '';
  return '<div class="modalWrap on"><div class="modalCard">'
    + '<h2>' + esc(p.targetName) + ' 자리 — ' + esc(p.companyName) + '</h2>'
    + '<div class="sub">이 업체의 서랍을 왜 보시나요? (업체 목록을 보는 것 자체는 사유가 필요 없습니다)</div>'
    + '<input id="sideReasonInput" class="btn" style="width:100%;margin:8px 0" placeholder="예: 급여 문의 확인"'
    + ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();submitSideReason();}">'
    + '<div style="display:flex;gap:8px;justify-content:flex-end">'
    + '<button class="btn" onclick="closeSideReason()">취소</button>'
    + '<button class="btn pri" onclick="submitSideReason()">확인</button></div></div></div>';
}

/* 공유받은 것을 연다 — 이미 보낸 사람이 사유를 준 셈이라 또 묻지 않는다.
   내가 그 사람 대리인이면 그 자격은 그대로 살려(수정 가능), 아니면 보기만. */
function openShared(id) {
  const s = (App.shares || {})[id];
  if (!s) return;
  db.ref(S.deputyPath(S.myUid(), s.byUid)).once('value').then(snap => {
    const active = S.isActiveDeputy(snap.val(), Date.now());
    enterSeatAt(s.byUid, s.byName, active, s.companyId, s.companyName, { byName: s.byName, tags: s.tags || [] });
  }).catch(e => alert('확인하지 못했습니다 — ' + (e.code || e.message)));
}
window.openShared = openShared;

/* ── 내 업체 순서 — 마우스로 끌어 바꾼다(대표 지시 2026-08-14) ──
   화면에 **지금 보이는 차례 그대로**(sideListModel 이 계산한 것)를 다시 구해
   드롭한 자리로 옮기고, 즉시 다시 그린 뒤 서버에 저장한다.
   ⚠ 걸러 놓고(찾기·상태 칩) 끌면 안 보이던 업체가 순서에서 빠진다 — 그래서
   순서를 만들 때는 **거르지 않은** 내 업체 전부를 쓴다. */
let sideDragId = null;
function sideDragStart(ev, id) { sideDragId = id; }
function sideDragDrop(ev, overId) {
  ev.preventDefault();
  const dragId = sideDragId; sideDragId = null;
  if (!dragId || dragId === overId) return;
  const m = sideListModel('mine', sideCtx(), { q: '', filter: 'all', order: App.myOrder });
  const ids = m.rows.map(c => c.id);
  const from = ids.indexOf(dragId), to = ids.indexOf(overId);
  if (from < 0 || to < 0) return;
  ids.splice(from, 1);
  ids.splice(to, 0, dragId);
  App.myOrder = ids;
  App.render();
  S.saveMyCompanyOrder(ids).catch(e => alert('순서를 저장하지 못했습니다 — ' + (e.code || e.message)));
}
window.sideDragStart = sideDragStart; window.sideDragDrop = sideDragDrop;

/* ── 업체 공유하기 — 사람 고르기 → 공유사항 체크(대표 지시 2026-08-14) ──
   권한을 주는 것이 아니라 "이거 봐 주세요" 알림이다 — 보기 권한은 원래대로. */
const SHARE_TAG_OPTIONS = ['확인 부탁드립니다', '서명·날인 필요', '급여 반영 요청', '참고만 하세요', '문제 있어 보입니다'];

function openShare(companyId, companyName) {
  App.shareCtx = { companyId: companyId, companyName: companyName, step: 'pick', query: '', targetUid: '', targetName: '', tags: {} };
  App.render();
}
window.openShare = openShare;

function closeShare() { App.shareCtx = null; App.render(); }
window.closeShare = closeShare;

function pickShareTarget(uid, name) {
  if (!App.shareCtx) return;
  App.shareCtx.targetUid = uid; App.shareCtx.targetName = name;
  App.render();
}
window.pickShareTarget = pickShareTarget;

function goShareTags() {
  if (!App.shareCtx || !App.shareCtx.targetUid) { alert('공유할 사람을 먼저 골라 주세요.'); return; }
  App.shareCtx.step = 'tags';
  App.render();
}
window.goShareTags = goShareTags;

function backShareStep() { if (App.shareCtx) { App.shareCtx.step = 'pick'; App.render(); } }
window.backShareStep = backShareStep;

function toggleShareTag(t) {
  if (!App.shareCtx) return;
  if (App.shareCtx.tags[t]) delete App.shareCtx.tags[t]; else App.shareCtx.tags[t] = true;
  App.render();
}
window.toggleShareTag = toggleShareTag;

function confirmShare() {
  const ctx = App.shareCtx; if (!ctx) return;
  const tags = Object.keys(ctx.tags || {});
  if (!tags.length) { alert('공유사항을 하나 이상 체크해 주세요.'); return; }
  S.shareCompany({ targetUid: ctx.targetUid, companyId: ctx.companyId, companyName: ctx.companyName, tags: tags })
    .then(() => { App.shareCtx = null; App.render(); })
    .catch(e => alert('공유하지 못했습니다 — ' + (e.code || e.message)));
}
window.confirmShare = confirmShare;

function shareModalHtml() {
  const ctx = App.shareCtx;
  if (!ctx) return '';
  if (ctx.step === 'tags') {
    const tagsHtml = SHARE_TAG_OPTIONS.map(t =>
      '<label class="tagopt' + (ctx.tags[t] ? ' on' : '') + '"><input type="checkbox" ' + (ctx.tags[t] ? 'checked' : '')
      + ' onchange="toggleShareTag(\'' + esc(t) + '\')">' + esc(t) + '</label>').join('');
    return '<div class="modalWrap on"><div class="modalCard">'
      + '<h2>' + esc(ctx.companyName) + ' 공유하기</h2>'
      + '<div class="sharedTo">' + esc(ctx.companyName) + ' 를(을) ' + esc(ctx.targetName) + '님에게</div>'
      + '<div class="sub">무엇을 공유하는 건가요? (여러 개 고를 수 있습니다)</div>'
      + '<div class="taglist">' + tagsHtml + '</div>'
      + '<div style="display:flex;gap:8px;justify-content:flex-end">'
      + '<button class="btn" onclick="backShareStep()">뒤로</button>'
      + '<button class="btn pri" onclick="confirmShare()">공유하기</button></div></div></div>';
  }
  const q = String(ctx.query || '').trim().toLowerCase();
  const myUid = (App.me && App.me.uid) || '';
  const list = Object.keys(App.owners || {})
    .filter(uid => uid !== myUid)
    .map(uid => Object.assign({ uid: uid }, App.owners[uid]))
    .filter(o => !q || String(o.name || '').toLowerCase().indexOf(q) >= 0)
    .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ko'));
  return '<div class="modalWrap on"><div class="modalCard">'
    + '<h2>' + esc(ctx.companyName) + ' 공유하기</h2>'
    + '<div class="sub">누구와 공유할까요?</div>'
    + '<input id="shareFind" class="btn" style="width:100%;margin-bottom:10px" placeholder="이름으로 찾기" value="' + esc(ctx.query)
    + '" oninput="App.shareCtx.query=this.value;App.render()">'
    + '<div class="picklist">' + (list.length ? list.map(o =>
      '<div class="pickrow' + (ctx.targetUid === o.uid ? ' on' : '') + '" onclick="pickShareTarget(\''
      + jsq(o.uid) + '\',\'' + jsq(o.name || o.uid) + '\')">' + esc(o.name || o.uid) + '</div>').join('')
      : '<div class="pempty">찾는 사람이 없습니다.</div>') + '</div>'
    + '<div style="display:flex;gap:8px;justify-content:flex-end">'
    + '<button class="btn" onclick="closeShare()">취소</button>'
    + '<button class="btn pri" onclick="goShareTags()">다음</button></div></div></div>';
}

/* ══════ 휴가 대리 — 자리 맡기기 화면 ══════ */
function ensureDeputies() {
  return S.listMyDeputies().then(v => { App.deputies = v; App.render(); })
    .catch(e => { console.warn('[대리]', e && e.code); App.deputies = {}; App.render(); });
}

function screenDeputy() {
  const ids = Object.keys(App.deputies || {});
  const now = Date.now();
  const today = new Date().toISOString().slice(0, 10);
  const staffOpts = '<option value="">맡길 사람 고르기</option>'
    + (App.staffList || []).filter(o => o.uid !== S.myUid())
      .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ko'))
      .map(o => '<option value="' + esc(o.uid) + '">' + esc(o.name || o.uid) + '</option>').join('');

  let h = '<div style="margin-bottom:10px"><button class="btn" onclick="App.go(\'sites\')">← 사업장</button></div>'
    + '<h1>자리 맡기기</h1><div class="sub">휴가·출장으로 자리를 비울 때, 내 자료를 고칠 수 있는 사람을 정합니다.</div>';

  h += '<div class="card" style="padding:14px;margin-bottom:14px">'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
    + '<select class="btn" id="depWho">' + staffOpts + '</select>'
    + '<input class="btn" type="date" id="depFrom" value="' + today + '">'
    + '<span>부터</span>'
    + '<input class="btn" type="date" id="depTo">'
    + '<span>까지</span>'
    + '<button class="btn pri" onclick="submitDeputy()">맡기기</button>'
    + '</div>'
    + '<div class="sub" style="margin-top:8px">🔒 끝나는 날이 지나면 저절로 닫힙니다 — 따로 거두실 필요가 없습니다.</div>'
    + '</div>';

  h += '<h1 style="font-size:15px">지금 맡기고 있는 사람 <span class="sub" style="margin:0;font-weight:400">' + ids.length + '명</span></h1>';
  if (!ids.length) {
    h += '<div class="card"><div class="empty">아직 아무에게도 맡기지 않았습니다.</div></div>';
  } else {
    h += '<div class="card">' + ids.map(uid => {
      const d = App.deputies[uid];
      const active = S.isActiveDeputy(d, now);
      return '<div class="row">'
        + '<b style="flex:1">' + esc(d.name || uid) + '</b>'
        + '<span class="' + (active ? '' : 'sub') + '" style="margin:0;font-size:12.5px'
        + (active ? ';color:var(--navy);font-weight:700' : '') + '">'
        + (active ? new Date(d.to).toLocaleDateString() + '까지' : '기간 끝남') + '</span>'
        + '<button class="btn" onclick="cancelDeputy(\'' + esc(uid) + '\')">지금 거두기</button>'
        + '</div>';
    }).join('') + '</div>';
  }
  return h;
}

/* 담당자 명단을 미리 읽어 둬야 「맡길 사람 고르기」에 이름이 뜬다 —
   이름 골라 보기와 같은 명단을 쓴다. */
function loadDeputyScreen() {
  if (App.staffList && App.staffList.length) { App.render(); return; }
  S.listOwners().then(v => {
    App.staffList = Object.keys(v).map(uid => Object.assign({ uid: uid }, v[uid]));
    App.render();
  }).catch(e => console.warn('[담당자 명단]', e && e.code));
}

function submitDeputy() {
  const who = $('depWho').value;
  const fromV = $('depFrom').value, toV = $('depTo').value;
  if (!who) { alert('맡길 사람을 골라 주세요.'); return; }
  if (!toV) { alert('끝나는 날을 골라 주세요.'); return; }
  const staff = (App.staffList || []).filter(o => o.uid === who)[0];
  const from = fromV ? new Date(fromV).getTime() : Date.now();
  const to = new Date(toV + 'T23:59:59').getTime();
  S.setDeputy(who, staff ? staff.name : who, from, to)
    .then(() => ensureDeputies())
    .catch(e => alert('맡기지 못했습니다 — ' + (e.code || e.message)));
}
window.submitDeputy = submitDeputy;

function cancelDeputy(uid) {
  if (!confirm('지금 거둘까요? 그 사람은 곧바로 내 자리를 고칠 수 없게 됩니다.')) return;
  S.revokeDeputy(uid).then(() => ensureDeputies())
    .catch(e => alert('거두지 못했습니다 — ' + (e.code || e.message)));
}
window.cancelDeputy = cancelDeputy;
</script>
</body>
</html>
