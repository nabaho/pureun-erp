<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🪙</text></svg>">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="js/pu-resilience.js?v=2"></script>
<script src="js/pu-gate.js?v=1"></script>
<script src="js/pu-health.js?v=3"></script>
<script src="js/pu-version.js?v=3"></script>
<script src="js/pu-backup.js?v=1"></script>
<script src="js/pu-hwp-engine.js?v=16"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
<!-- 회사 공용 사진·서류 저장 층 — 사진첩/기업정보함/컨설팅과 같은 파일을 쓴다(판독·보관 방식이 한 곳) -->
<script src="js/pu-photo-store.js?v=25"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="hwpx_gen.js?v=14"></script>
<script src="hwpx_doc.js?v=2"></script>
<script src="fund_forms.js?v=4"></script>
<style>
  :root{--acc:#2563eb;--acc2:#1e40af;--acc-soft:#eff6ff;--ink:#1e293b;--sub:#475569;--faint:#94a3b8;
    --line:#e2e8f0;--panel:#fff;--bg:#e2e8f0;--ok:#166534;--ok-bg:#f8fafc;--warn:#854d0e;--warn-bg:#fffbeb;
    --danger:#dc2626;--danger-bg:#e2e8f0;--radius:11px}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
  #side{position:fixed;top:0;left:0;width:216px;height:100vh;background:#f8fafc;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;z-index:20}
  .logo{display:flex;align-items:center;gap:9px;padding:2px 6px 12px}
  .logo .ic{font-size:22px}.logo b{font-size:14px}.logo .s{font-size:11px;color:var(--sub)}
  .sitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--sub);font-size:13px}
  .sitem:hover{background:var(--bg)}.sitem.on{background:var(--acc-soft);color:var(--acc2);font-weight:700}
  .sitem.dim{color:#cbd5e1;cursor:default}.sitem.dim:hover{background:none}
  .sitem .soon{font-size:9.5px;margin-left:auto;color:#cbd5e1;border:1px solid #e2e8f0;border-radius:6px;padding:0 5px}
  /* 메뉴 순서 드래그 — ⋮⋮ 손잡이는 평소 흐리게, 항목에 올리면 진하게 */
  #navlist{display:flex;flex-direction:column;gap:4px;touch-action:pan-y}
  .sitem .gr{color:#e2e8f0;font-size:11px;letter-spacing:-1px;cursor:grab;user-select:none;flex:none}
  /* 메뉴 옆 개수 — 사이드바가 «몇 개인지»를 말하므로 본문 배지를 없앨 수 있다 */
  .ncnt{margin-left:auto;font-size:10.5px;color:var(--faint);font-weight:400;font-variant-numeric:tabular-nums}
  .sitem.on .ncnt{color:var(--acc2)}
  /* 하위 묶음 — 왼쪽 실선으로 «기금 현황에 딸린 것»임을 보인다 */
  #navsub{margin:2px 0 2px 12px;border-left:1px solid var(--line);padding-left:6px}
  #navsub.hid{display:none}
  #navsub .sitem{padding:6px 9px;font-size:12.5px}
  #navsub .sep{height:1px;background:var(--line);margin:5px 6px}
  /* 접기 화살표 — 누를 만한 크기를 주되 글자를 밀어내지 않게 폭을 고정한다 */
  .cx{display:inline-block;width:14px;text-align:center;color:var(--faint);font-size:10px;flex:none;cursor:pointer}
  .cx:hover{color:var(--acc2)}
  .sitem:hover .gr{color:#94a3b8}
  .sitem.navdrag{background:var(--acc-soft);box-shadow:0 6px 18px rgba(37,99,235,.22);opacity:.95;cursor:grabbing}
  .sitem.navdrag .gr{cursor:grabbing}
  .side-sec{font-size:10.5px;letter-spacing:.1em;color:var(--faint);padding:12px 8px 4px;text-transform:uppercase}
  #main{margin-left:216px;min-height:100vh}
  #topbar{position:sticky;top:0;z-index:15;background:rgba(250,251,253,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:9px 22px;display:flex;align-items:center;gap:12px;font-size:13px}
  #crumb{font-weight:700;color:var(--sub)}
  /* 기금 머리(이름·식별번호 한 줄 + 탭 한 줄)를 위쪽에 붙여 둔다 —
     사업장 16곳을 훑어 내려가면 어느 기금의 무슨 탭인지 사라져 되돌아 올려야 했다.
     맨 위 #topbar 아래에 정확히 붙여야 하므로 그 높이를 --topbar-h 로 재어 쓴다. */
  #fundhead{position:sticky;top:var(--topbar-h,48px);z-index:12;background:var(--bg);
    border-bottom:1px solid var(--line);margin:0 0 12px;padding-top:2px}
  .fhead{display:flex;align-items:center;gap:10px;padding:7px 0 5px;min-width:0}
  .fhead h1{font-size:17px;margin:0;white-space:nowrap}
  /* 식별번호는 줄바꿈 대신 «옆으로» 넘긴다 — 줄이 늘면 붙여 둔 머리가 화면을 잡아먹는다 */
  .fhead .fid{display:flex;gap:14px;font-size:12px;color:var(--sub);white-space:nowrap;
    overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  .fhead .fid::-webkit-scrollbar{display:none}
  .fhead .fact{display:flex;gap:12px;flex:none;font-size:12.5px}
  #fundhead .tabbar{margin:0}
  #topright{margin-left:auto;display:flex;align-items:center;gap:11px}
  #conn{font-size:12px;color:var(--sub)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#cbd5e1;margin-right:5px}.dot.on{background:var(--ok)}
  #topuser{font-weight:700;font-size:12.5px}#topuser .role{color:var(--sub);font-weight:500;margin-left:4px}
  #topclock{font-variant-numeric:tabular-nums;color:var(--sub);font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
  #logoutbtn{font-size:12.5px;padding:5px 12px;border:1px solid #f87171;color:var(--danger);background:#fff;border-radius:8px;cursor:pointer;font-weight:700}
  #app{padding:18px 22px 60px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
  .row{display:flex;align-items:center;gap:10px}
  h1{font-size:20px;margin:0}h2{font-size:16px;margin:0}
  .muted{color:var(--sub)}
  input,select{font-family:inherit}
  .search{padding:8px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;min-width:220px}
  button{font-family:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--ink)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}button.primary:hover{background:var(--acc2)}
  .stat{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 11px;color:var(--sub)}
  .grp-h{font-size:13.5px;font-weight:800;margin:16px 0 6px;display:flex;align-items:center;gap:8px}
  .grp-h .cnt{font-size:11.5px;color:var(--sub);font-weight:600}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
  th{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.03em}
  /* ══ 틀 고정 ══ 목록을 내려도 «어느 묶음을 보고 있는지»와 칸 이름이 남아 있어야 한다.
     기금이 44개라, 내리면 기본정보/서식준비/결산/기한과 충남·경기 고르기가 화면 밖으로 나갔다.

     ⚠ 표 머리줄은 감싼 상자가 «스크롤 상자»면 안 붙는다. CSS 규칙상 overflow-x:auto 를 주면
       세로(visible)가 auto 로 «따라 계산»되어, 표가 제 상자 안에서만 붙으려 하다 아무 일도
       안 일어난다. 그래서 «넘칠 때만» 가로 스크롤을 켠다(_syncTblScroll). */
  #homehead{position:sticky;top:var(--topbar-h,48px);z-index:11}
  /* 묶음마다 표가 따로라, 폭을 안 정하면 충남과 경기의 열이 어긋난다 */
  table.fixcol{table-layout:fixed}
  table.fixcol td{overflow:hidden;text-overflow:ellipsis}
  .tblwrap{overflow:visible}
  .tblwrap.scrollx{overflow-x:auto}
  .tblwrap thead th{position:sticky;top:calc(var(--topbar-h,48px) + var(--homehead-h,0px));
    z-index:9;background:var(--bg);box-shadow:0 1px 0 var(--line)}
  /* 가로로 넘쳐 스크롤을 켠 상자에서는 붙어 있기가 통하지 않는다 — 헛되이 두지 않는다 */
  .tblwrap.scrollx thead th{position:static;box-shadow:none}
  tbody tr{cursor:pointer}tbody tr:hover{background:var(--bg)}
  td.no{color:var(--faint);width:34px;font-variant-numeric:tabular-nums}
  .chip{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.dg{background:var(--danger-bg);color:var(--danger)}
  .tag{font-size:10px;padding:1px 7px;border-radius:8px;margin-left:6px}
  .tag.gong{background:var(--ok-bg);color:var(--ok)}.tag.sanae{background:var(--acc-soft);color:var(--acc2)}
  .tabbar{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:14px 0 16px}
  .tab{padding:8px 13px;font-size:13px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--acc2);border-bottom-color:var(--acc);font-weight:700}
  .tab.soon{color:#cbd5e1;cursor:default}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;max-width:760px}
  /* 넓은 폼(기금 정보) — 화면 폭을 다 쓴다. 종전에는 .grid 의 760px·2열에 묶여
     칸 16개가 8줄로 흘러내려 한 화면에 안 들어왔다(오른쪽 절반은 비어 있었다). */
  .gridw{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:8px 14px}
  .gridw .fld.full{grid-column:1/-1}
  .gridw .fld label{font-size:11px;margin-bottom:1px}
  .gridw .fld input,.gridw .fld select{padding:5px 8px;font-size:12.5px}
  .gridw .sec{grid-column:1/-1;font-size:11px;font-weight:800;color:var(--faint);letter-spacing:.03em;
    border-top:1px solid var(--line);padding-top:7px;margin-top:3px;
    display:flex;align-items:center;gap:6px}   /* 오른쪽에 도구를 얹을 수 있게 */
  .gridw .sec.first{border-top:none;padding-top:0;margin-top:0}
  /* 안에 [🔍 소재지로] 단추가 붙는 칸은 좁으면 글자가 안 보인다 — 자리가 있을 때만 두 칸 폭 */
  @media (min-width:1200px){ .gridw .fld.w2{grid-column:span 2} .gridw .fld.w3{grid-column:span 3} }
  /* 담당 한 줄 — 주담당 드롭다운 + [+ 부담당] 드롭다운 + 고른 사람 알약 */
  .mgrrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .mgrrow select{padding:5px 8px;font-size:12.5px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .mgrrow #fd-mgr-sub-add{color:var(--acc2);font-weight:600;max-width:110px}
  .mchip{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;
    background:var(--acc-soft);color:var(--acc2);border-radius:999px;padding:2px 5px 2px 9px;white-space:nowrap}
  .mchip b{cursor:pointer;font-weight:700;color:var(--sub);padding:0 3px;border-radius:50%}
  .mchip b:hover{background:#fff;color:var(--danger)}
  .fld{display:flex;flex-direction:column;gap:4px}.fld.full{grid-column:1/-1}
  .fld label{font-size:11.5px;color:var(--sub);font-weight:600}
  .fld input,.fld select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .msg{margin:12px 0;padding:9px 13px;border-radius:8px;font-size:12.5px;display:none}
  .msg.ok{display:block;background:var(--ok-bg);color:var(--ok)}.msg.err{display:block;background:var(--danger-bg);color:var(--danger)}
  /* ⚠ warn 이 빠져 있었다 — class="msg warn" 을 쓰면 .msg 의 display:none 에 걸려
     «조용히 안 보이는» 알림이 된다. 상태 알림은 셋(ok·warn·err)이 다 있어야 한다. */
  .msg.warn{display:block;background:var(--warn-bg);color:var(--warn)}
  .gate{max-width:520px;margin:90px auto;text-align:center;color:var(--sub)}.gate a{color:var(--acc);font-weight:700}
  .kv{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin-top:6px}
  .kv b{color:var(--ink)}
  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:200;max-width:80vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:#991b1b}#toast.warn{background:#854d0e}
  #saveState{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700;background:#fff;color:var(--sub)}
  #saveState:before{content:'';width:7px;height:7px;border-radius:50%;background:#94a3b8}#saveState.saving:before{background:#fbbf24}#saveState.saved:before{background:#4ade80}#saveState.failed:before{background:#dc2626}
  /* 보기 전환(세그먼트) — 같은 목록에 열만 바꾸는 스위치 */
  /* 부드러운 알약 — 칸막이 선과 채운 파랑 대신, 옅은 바탕 위에 «고른 것만» 흰 알약으로 뜬다.
     머리줄에 두 벌(보기·분류)이 나란히 서므로 테두리가 많으면 어수선하다. */
  .segbar{display:inline-flex;gap:2px;border-radius:999px;background:var(--bg);padding:2px}
  .seg{border:none;background:transparent;padding:4px 12px;font-size:12.5px;color:var(--sub);cursor:pointer;
    border-radius:999px;transition:background .12s,color .12s}
  .seg:hover{background:rgba(255,255,255,.7);color:var(--ink)}
  .segbar .seg.on{background:#fff;color:var(--acc2);font-weight:700;box-shadow:0 1px 2px rgba(16,24,40,.06)}
  /* 도움말 ⓘ — 설명을 화면에 깔지 않고 눌러서 보게 한다 */
  .hbtn{font-size:11px;line-height:1.5;padding:1px 6px;border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--faint);cursor:pointer;flex:none;vertical-align:middle}
  .hbtn:hover{background:var(--acc-soft);color:var(--acc2);border-color:#bfdbfe}
  .helpbody{font-size:13px;line-height:1.8;color:var(--ink)}
  .helpbody p{margin:0 0 9px}.helpbody p:last-child{margin-bottom:0}
  .helpbody b{color:var(--acc2)}
  .helpbody ul{margin:4px 0 10px;padding-left:20px}.helpbody li{margin:2px 0}
  .loading{display:flex;align-items:center;gap:10px;padding:22px 16px;color:var(--sub);font-size:13px}
  .loading .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* ── 모바일(스마트폰) 대응 ── 넓은 화면에서는 ☰/오버레이를 숨긴다 */
  #menubtn,#sideveil{display:none}
  @media (max-width:860px){
    body{font-size:13.5px}
    /* 사이드바 → 서랍(☰로 여닫음) */
    #side{width:250px;height:100dvh;overflow-y:auto;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.2);z-index:120}
    .sitem{padding:10px 10px;font-size:13.5px}          /* 손가락으로 누를 만한 크기 */
    .gate{margin:44px auto;padding:0 14px}
    body.sideopen #side{transform:none}
    #sideveil{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:110}
    body.sideopen #sideveil{display:block}
    #main{margin-left:0}
    #menubtn{display:inline-flex;align-items:center;justify-content:center;font-size:17px;line-height:1;padding:5px 10px;flex:none}
    /* 상단바 컴팩트 — 시계·연결표시는 접음 */
    #topbar{padding:7px 11px;gap:8px;font-size:12.5px}
    #topright{gap:7px}
    #topclock,#conn{display:none}
    #topuser{font-size:11.5px;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #topuser .role{display:none}
    #logoutbtn{font-size:11.5px;padding:4px 9px}
    #crumb{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
    /* 본문 여백·패널 축소 */
    #app{padding:11px 10px 84px}
    .panel{padding:11px 12px;margin-bottom:10px;border-radius:10px;overflow-x:auto}
    h1{font-size:17px}h2{font-size:14.5px!important}
    .row{flex-wrap:wrap;gap:7px}
    .grid,.gridw{grid-template-columns:1fr;gap:9px;max-width:none}
    .gridw .fld.w2,.gridw .fld.w3{grid-column:auto}   /* 폰에서는 여러 칸 폭을 쓰지 않는다 */
    .gridw .fld input,.gridw .fld select{padding:7px 10px;font-size:16px}
    /* iOS는 16px 미만 입력칸에 포커스하면 화면을 확대해 버린다(손으로 되돌려야 함) → 주요 입력은 16px */
    .fld input,.fld select,.fld textarea,.search{font-size:16px}
    .search{min-width:0;flex:1 1 160px}
    button{padding:7px 11px;font-size:12.5px}
    .stat{font-size:11px;padding:2px 9px}
    .kv{gap:9px 12px;font-size:11.5px}
    /* 탭은 줄바꿈 대신 좌우 스와이프 */
    .tabbar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:10px 0 12px}
    .tabbar::-webkit-scrollbar{display:none}
    .tab{padding:7px 10px;font-size:12.5px;white-space:nowrap;flex:none}
    /* 표 촘촘하게 */
    th,td{padding:6px 7px;font-size:12px}
    th{font-size:10px}

function start(){
  $('root').innerHTML=shell();
  initTop();
  bindNavDrag(); loadNavOrder();      // 사이드바 메뉴 순서(사용자가 드래그로 정한 순서) 복원
  try{ history.replaceState({view:'home'}, ''); }catch(e){}
  fbDb.ref(NS+'/funds').on('value', function(snap){ funds=snap.val()||{};
    if(snap.exists()||_fbOnline) S._fundsSynced=true;   // 서버 값을 받은 뒤에만 '기금 없음'이라고 말한다
    if(appHasFocus()){ S._pendingRender=true; return; }   // 입력 중엔 재렌더 보류(값 소실 방지)
    route();
  }, function(err){
    $('app').innerHTML='<div class="panel"><h2 style="color:var(--danger)">읽기 권한 오류</h2><p class="muted">'+esc(err.message)+'</p></div>';
  });
  // 입력 포커스가 빠지면 보류된 재렌더 반영
  document.addEventListener('focusout', function(){ setTimeout(function(){
    if(S._pendingRender && !appHasFocus()){ S._pendingRender=false; route(); }
  }, 150); });
}
function appHasFocus(){ var ae=document.activeElement, app=$('app');
  return !!(ae && app && app.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)); }
/* 연결이 끊긴 채 그려진 화면임을 분명히 알린다.

   목록이 0건으로 보여 데이터가 지워진 것으로 오해하게 된다. 실제 데이터는 서버에 그대로 있다. */
function offlineBanner(){
  if(_fbOnline) return '';
  return '<div class="msg err" style="margin-bottom:10px"><b>Firebase에 연결되지 않았습니다.</b> '
    +'아래 목록은 <b>서버에서 받은 값이 아닙니다</b> — 데이터가 지워진 것이 아니라 아직 못 읽은 상태입니다. '

/* Firebase의 모든 쓰기를 한 곳에서 감시한다. 기능별 저장 코드를 빠뜨려도 상단 상태가 동일하게 보인다. */
var _savePending=0,_saveFailed=false,_writeStatusInstalled=false;
function setWriteStatus(kind,text){var e=$('saveState');if(!e)return;e.className=kind;e.textContent=text;}
function _writeBegin(){if(_savePending===0)_saveFailed=false;_savePending++;setWriteStatus('saving','저장 중…');}
function _writeEnd(ok){_savePending=Math.max(0,_savePending-1);if(!ok)_saveFailed=true;if(!_savePending)setWriteStatus(_saveFailed?'failed':'saved',_saveFailed?'저장 실패':'저장 완료');}
function installWriteStatus(){
  if(_writeStatusInstalled||!firebase.database||!firebase.database.Reference)return;
  _writeStatusInstalled=true;
  ['set','update','remove'].forEach(function(name){
    var proto=firebase.database.Reference.prototype, original=proto[name]; if(typeof original!=='function')return;
    proto[name]=function(){
      _writeBegin(); var p;
      try{p=original.apply(this,arguments);}catch(e){_writeEnd(false);throw e;}
      return Promise.resolve(p).then(function(v){_writeEnd(true);return v;},function(e){_writeEnd(false);throw e;});
    };
  });
}

/* ══ 사이드바 메뉴 순서 드래그 ══
   자주 쓰는 메뉴를 위로 끌어올려 저장한다. 마우스·손가락 모두 되게 Pointer Events를 쓴다
   (HTML5 dragstart는 터치에서 동작하지 않음).
   저장: localStorage(즉시 적용) + Firebase fund_erp/ui_prefs/{uid}/nav_order(다른 PC에서도 유지). */
var NAV_LS='fund_nav_order_v1';
/* 끌리는 단위 = #navlist 의 «바로 아래 자식» 중 data-nav 가 붙은 것.
   ⚠ 종전에는 '.sitem[data-nav]' 로 찾았는데, 기금 현황이 하위 트리를 안게 되면서
      끌리는 단위가 «감싸는 상자»(#nav-home-wrap)로 바뀌었다. 선택자를 안 고치면
      기금 현황만 목록에서 빠져 순서 저장이 조용히 어긋난다. */
var NAV_SEL=':scope > [data-nav]';
function _navIds(){ var l=$('navlist'); return l?Array.prototype.map.call(l.querySelectorAll(NAV_SEL),function(e){return e.id;}):[]; }
function applyNavOrder(order){
  var l=$('navlist'); if(!l||!order||!order.length) return;
  order.forEach(function(id){
    if(id==='nav-home') id='nav-home-wrap';        // 옛 저장분 — 항목이 상자로 바뀌기 전 이름
    var el=document.getElementById(id); if(el&&el.parentNode===l) l.appendChild(el);
  });
}
function _navUid(){ try{ var u=firebase.auth().currentUser; return (u&&u.uid)||''; }catch(e){ return ''; } }
function loadNavOrder(){
  try{ var raw=localStorage.getItem(NAV_LS); if(raw) applyNavOrder(JSON.parse(raw)); }catch(e){}   // ① 즉시
  var uid=_navUid(); if(!uid||!fbDb) return;
  fbDb.ref(NS+'/ui_prefs/'+uid+'/nav_order').once('value').then(function(s){        // ② 다른 PC에서 바꾼 순서 반영
    var o=s.val(); if(!o||!o.length) return;
    applyNavOrder(o); try{ localStorage.setItem(NAV_LS,JSON.stringify(o)); }catch(e){}
  }).catch(function(){});
}
function saveNavOrder(){
  var o=_navIds(); if(!o.length) return;
  try{ localStorage.setItem(NAV_LS,JSON.stringify(o)); }catch(e){}
  var uid=_navUid();
  if(uid&&fbDb) fbDb.ref(NS+'/ui_prefs/'+uid+'/nav_order').set(o).catch(function(){});   // 실패해도 이 기기에는 남는다
  toast('메뉴 순서를 저장했습니다');
}
/* 끌고 있는 항목을 포인터 위치에 맞는 자리로 실제로 옮긴다 — 형제의 중간선을 넘으면 그 앞으로.
   끌리는 대로 즉시 보이므로 별도의 자리표시자(placeholder)가 필요 없다. */
function _navPlace(list,el,clientY){
  var items=Array.prototype.filter.call(list.querySelectorAll(NAV_SEL),function(x){return x!==el;});
  for(var i=0;i<items.length;i++){
    var r=items[i].getBoundingClientRect();
    if(clientY < r.top+r.height/2){ list.insertBefore(el,items[i]); return i; }
  }
  list.appendChild(el); return items.length;
}
var _navDrag=null, _navMoved=false;
function bindNavDrag(){
  var l=$('navlist'); if(!l||l._navBound) return; l._navBound=1;
  l.addEventListener('pointerdown',function(e){
    if(e.button!==undefined&&e.button!==0) return;                 // 왼쪽 버튼(또는 터치)만
    /* 하위 묶음(#navsub 안)은 끌지 않는다 — 유형 차례가 바뀌면 오히려 헷갈린다(대표 지시 ④).
       손잡이(⋮⋮)가 있는 최상위 줄만 잡는다. */
    if(e.target.closest&&e.target.closest('#navsub')) return;
    var it=e.target.closest&&e.target.closest('#navlist > [data-nav]'); if(!it) return;
    _navDrag={el:it,startY:e.clientY,h:it.offsetHeight,pid:e.pointerId,cap:false}; _navMoved=false;
    /* 여기서 setPointerCapture를 걸면 안 된다 — 포인터를 캡처하면 pointerdown/up의 대상이
       #navlist가 되고, click도 #navlist에 떨어져 .sitem의 onclick(화면 이동)이 실행되지 않는다.
       캡처는 실제로 끌기 시작한 뒤(5px 초과)에만 건다. */
  });
  l.addEventListener('pointermove',function(e){
    if(!_navDrag) return;
    var dy=e.clientY-_navDrag.startY;
    if(!_navMoved){
      if(Math.abs(dy)<5) return;                                   // 5px 넘기 전엔 그냥 클릭으로 본다
      _navMoved=true; _navDrag.el.classList.add('navdrag'); document.body.style.userSelect='none';
      // 끌기가 시작된 지금부터 캡처 — 포인터가 사이드바를 벗어나도 끌기가 이어진다
      try{ l.setPointerCapture(_navDrag.pid); _navDrag.cap=true; }catch(_){}
    }
    e.preventDefault();
    _navPlace(l,_navDrag.el,e.clientY);
  });
  function end(e){
    if(!_navDrag) return;
    var moved=_navMoved, el=_navDrag.el, cap=_navDrag.cap, pid=_navDrag.pid;
    _navDrag=null; _navMoved=false;
    el.classList.remove('navdrag'); document.body.style.userSelect='';
    if(cap){ try{ l.releasePointerCapture(pid); }catch(_){} }   // 걸었을 때만 해제
    if(!moved) return;                                             // 안 움직였으면 평소처럼 화면 이동(onclick)
    // 끌어서 옮긴 경우엔 뒤따르는 click이 화면을 바꾸지 않게 한 번만 삼킨다
    var swallow=function(ev){ ev.stopPropagation(); ev.preventDefault(); };
    document.addEventListener('click',swallow,true);
    setTimeout(function(){ document.removeEventListener('click',swallow,true); },0);
    saveNavOrder();
  }
  l.addEventListener('pointerup',end); l.addEventListener('pointercancel',end);
}

/* ⚠ 전에는 «주소» 도 봤다: S.role || qp('role') —

  var WD=['일','월','화','수','목','금','토'];function p(n){return(n<10?'0':'')+n;}

// ── 공통 편의: 토스트 알림 ──
function toast(msg,type){
  var t=$('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.className='show'+(type==='err'?' err':(type==='warn'?' warn':''));

}

function _leaveGuard(){ if(!_dirty) return Promise.resolve(true);
  return confirmM('저장하지 않은 변경이 있습니다.\n저장하지 않고 이동할까요?',{ok:'이동',danger:true}).then(function(ok){ if(ok)clearDirty(); return ok; }); }

/* 칸 목록 하나에서 «머리와 폭»을 함께 만든다 — 따로 적으면 언젠가 어긋난다.

   ⚠ 폭을 <colgroup> 이 아니라 «머리 칸»에 준다. 좁은 화면에서 .mo·.ph 는 display:none 으로
     접히는데, colgroup 의 <col> 은 그대로 남아 접힌 칸의 폭까지 차지해 버린다.

// 푸른이알피 재직자 명단 — Firebase data/user_accounts/v (pu-erp와 공유). 재직(active)만.
var _staffCache=null;
function _normStaff(v){
  if(!v) return []; if(!Array.isArray(v)) v=Object.keys(v).map(function(k){return v[k];});
  var seen={};
  return v.filter(function(u){return u&&u.sid;})
    .filter(function(u){return !u.status||u.status==='active'||(u.status==='leave'&&u.leaveLoginAllowed===true);})
    .filter(function(u){ if(seen[u.sid])return false; seen[u.sid]=1; return true; })
    .map(function(u){return {sid:u.sid,name:u.name||u.sid,title:u.title||u.role||'',branch:u.branch||''};})
    .sort(function(a,b){return String(a.sid||'').localeCompare(String(b.sid||''),'en',{numeric:true});});  // 푸른이알피 사번 순
}
function loadStaff(){
  // 1) 동일 출처(github.io/pureunall) localStorage — 푸른이알피가 채워둔 재직자, Firebase 규칙 의존 없음.
  //    매번 다시 읽는다 — 다른 탭에서 퇴사 처리 등으로 갱신돼도 이 화면이 낡은 명단을 계속 쓰지 않게(캐시 고정 방지).
  try{ var raw=localStorage.getItem('pureun_v6_user_accounts');
    if(raw){ var a=_normStaff(JSON.parse(raw)); if(a.length){ _staffCache=a; return Promise.resolve(a); } } }catch(e){}
  if(_staffCache&&_staffCache.length) return Promise.resolve(_staffCache);   // localStorage 없을 때만 이전 조회분 재사용(빈 결과는 캐시 안 함)
  // 2) 폴백: Firebase — 일반 직원도 읽을 수 있는 공개 명부 data/user_dir 우선, 실패 시 data/user_accounts
  var rd=function(p){ return fbDb.ref(p).once('value').then(function(s){ return _normStaff(s.val()); }).catch(function(){ return []; }); };
  return rd('data/user_dir/v').then(function(a){ if(a.length){ _staffCache=a; return a; }
    return rd('data/user_dir').then(function(b){ if(b.length){ _staffCache=b; return b; }
      return rd('data/user_accounts/v').then(function(c){ _staffCache=c; return c; }); });
  });
}

function createFund(){

  /* 이름 예약 → ID 선점 두 단계.
     ①`name_locks/{정규화이름}`을 트랜잭션으로 선점해 **두 계정이 같은 이름을 동시에** 만드는 것을 막는다
       (기존엔 로컬 캐시만 봐서 서로 다른 FUND-xxxx로 둘 다 생성됐다).
     ②그다음 빈 ID를 트랜잭션으로 선점. */
  var lockKey=_normName(name).replace(/[.#$/\[\]]/g,'_');
  fbDb.ref(NS+'/name_locks/'+lockKey).transaction(function(cur){ return cur===null?{name:name,at:ymd()}:undefined; },
    function(lerr,lockOk){
      if(lerr){ toast('등록 실패: '+lerr.message,'err'); return; }
      if(!lockOk){ toast('같은 이름의 기금이 방금 등록되었습니다 — 목록을 확인하세요','warn'); closeM(); renderHome(); return; }
      var tryN=0;
      (function claim(fid){
        if(tryN++>50){ fbDb.ref(NS+'/name_locks/'+lockKey).remove(); toast('등록 실패: ID 할당 충돌','err'); return; }
        fbDb.ref(NS+'/funds/'+fid).transaction(function(cur){ return cur===null?rec:undefined; }, function(err,committed){
          if(err){ fbDb.ref(NS+'/name_locks/'+lockKey).remove(); toast('등록 실패: '+err.message,'err'); return; }
          if(!committed){                                    // 이미 그 ID가 있음 → 다음 번호로 재시도
            var m=/^FUND-(\d+)$/.exec(fid), n=m?(+m[1]+1):1, s=String(n);
            claim('FUND-'+(s.length>=4?s:('0000'+s).slice(-4))); return;
          }
          fbDb.ref(NS+'/name_locks/'+lockKey).update({fid:fid});
          funds[fid]=rec; closeM(); S.fundId=fid; S.tab=(entry==='new'?'setup':'info'); _go('fund',fid); S.tab=(entry==='new'?'setup':'info'); renderFund();
          toast('새 기금 등록: '+short+(entry==='new'?' (설립부터)':' (운영부터)'));
        });
      })(nextFundId());
    });
}

/* ══ 기금 현황 '보기' 전환 ══

var HOME_VIEWS=[['basic','기본정보'],['docs','서식 준비'],['close','결산'],['due','기한']];
function homeView(v){ S.homeView=v; renderHome(); }

/* 목록 하나에 보기만 갈아끼운다 — 기본정보는 기존 표(하위 그룹 나누기 포함),
   서식 준비·결산은 같은 목록에 열만 바꿔 매트릭스로 */
/* ══ 분류(지역) ══ 「지역」 칸 하나가 곧 분류다.
   ⚠ grp() 이 «지역이 있으면 지역기금, 없으면 공동기금»으로 가른다 —
      분류를 지우면 그 기금이 공동기금으로, 넣으면 지역기금으로 «옮겨 간다».
      사람이 모르고 옮기지 않도록 바꾼 뒤 어디로 갔는지 말해 준다. */
function regionsOf(){
  var s={};
  Object.keys(funds).forEach(function(k){
    var f=funds[k]; if(isTrashed(f)) return;
    var r=String(f.region||'').trim(); if(r) s[r]=(s[r]||0)+1;
  });
  return Object.keys(s).sort(function(a,b){ return s[b]-s[a]||a.localeCompare(b,'ko'); });
}

/* 묶음 나누기 — 사이드바와 본문이 «같은 함수»에서 나온다.
   따로 세면 사이드바는 16, 본문은 15 처럼 어긋나고 어느 쪽이 맞는지 알 수 없게 된다. */
var HOME_GROUPS=[
  ['지역공동','🏛 지역기금'],['개별공동','🤝 공동기금'],['사내','🏢 사내기금'],
  /* 미완비는 «유형»이 아니라 «상태»라 셋 아래에 칸막이를 두고 따로 세운다.
     종전에는 「기금 현황」 줄에 '· 미완비 22'로 붙어 두 줄로 접히고 눌러 볼 수도 없었다. */
  ['inc','⚠ 미완비'],
  ['setup','🏗 설립중'],['past','🗂 종료기금'],['trash','🗑 삭제 보관']
];
function homeBuckets(){
  var every=Object.keys(funds).map(function(k){var o=Object.assign({},funds[k]);o._id=k;return o;});
  var rpri={'충남':1,'경기':2};
  var srt=function(a,b){return ((rpri[a.region]||9)-(rpri[b.region]||9))||(a.short_name||'').localeCompare(b.short_name||'','ko',{numeric:true});};
  var trash=every.filter(isTrashed).sort(srt);
  var all=every.filter(function(f){return !isTrashed(f);});
  var active=all.filter(function(f){return !isPast(f);});
  var isSetup=function(f){return f.setup_stage==='설립준비';};
  var setup=active.filter(isSetup).sort(srt);
  var live=active.filter(function(f){return !isSetup(f);});
  var B={'지역공동':[],'개별공동':[],'사내':[],setup:setup,past:all.filter(isPast).sort(srt),trash:trash};
  live.forEach(function(f){ (B[grp(f)]=B[grp(f)]||[]).push(f); });
  ['지역공동','개별공동','사내'].forEach(function(k){ B[k].sort(srt); });
  // 미완비 = 운영 중인데 핵심 5항목이 덜 찬 기금(설립중은 신규라 당연히 덜 차므로 제외)
  B.inc=live.filter(function(f){ return nDone(f)<5; }).sort(srt);
  B._all=all; B._live=live; B._srt=srt;
  return B;
}
/* 사이드바의 하위 묶음 — 기금 목록이 바뀔 때마다 다시 그린다(개수가 여기 있다).
   빈 묶음은 아예 안 그린다: 「삭제 보관 0」 같은 줄은 누를 것도 없이 자리만 차지한다. */
function renderNav(){
  var host=$('navsub'); if(!host) return;
  var B=homeBuckets();
  var incAll=B._live.filter(function(f){ return nDone(f)<5; }).length;
  var cur=(S.view==='home')?S.homeTab:'';
  var html=HOME_GROUPS.map(function(g){
    var n=(B[g[0]]||[]).length;
    if(!n && (g[0]==='setup'||g[0]==='trash'||g[0]==='past'||g[0]==='inc')) return '';   // 없으면 숨긴다
    var sep=(g[0]==='inc'||g[0]==='setup')?'<div class="sep"></div>':'';   // 유형/상태 사이에 칸막이
    var warn=(g[0]==='inc')?' style="color:var(--warn)"':'';
    return sep+'<div class="sitem'+(cur===g[0]?' on':'')+'"'+warn+' onclick="goHomeTab(\''+g[0]+'\')"'
      +(g[0]==='inc'?' title="기본정보 5항목(인가번호·인가일·법인등록번호·설립등기일·고유번호)이 덜 찬 기금"':'')+'>'
      +g[1]+'<span class="ncnt">'+n+'</span></div>';
  }).join('');
  host.innerHTML=html;
  var open=navSubOpen();
  host.className=open?'':'hid';
  var cx=$('nav-cx'); if(cx) cx.textContent=open?'▾':'▸';
  var hc=$('nav-home-cnt');
  if(hc){
    /* 접혀 있으면 어느 묶음을 보고 있는지 여기서 말해 준다 — 안 그러면 단서가 사라진다 */
    var lbl=''; HOME_GROUPS.forEach(function(g){ if(g[0]===cur) lbl=g[1].replace(/^\S+\s*/,''); });

}

/* ══ 기금 기본정보 일괄 가져오기 ══
   로컬 프로그램(fund.db)에서 뽑은 JSON({FUND-0001:{인가번호…}, …})을 한 번에 반영한다.
   · 기본은 **빈 칸만 채움** — 웹에서 직접 입력한 값을 덮지 않는다.
   · 이름·약칭·유형은 신원 필드라 덮어쓰기 모드에서도 채우기만 한다(오인 개명·유형변경 방지).
   · 연도별 데이터(years)·담당(mgr_*)·설립(setup)·계약관계(lifecycle) 등은 아예 손대지 않는다. */
var IMP_FIELDS=['inka_no','inka_date','corp_reg_no','reg_date','registry_office','tax_id_no','tax_office',
  'address','phone','chairman','labor_office','fy_start_md','fy_end_md','region','officers'];
/* 글자가 아니라 «줄의 묶음»으로 다뤄야 하는 칸 — 임원 명부가 그렇다.
   등기부에서 옮긴 명부를 한 번에 넣을 수 있어야, 감사보고서·회의록이 이름을 갖는다. */
var _IMP_LIST={officers:1};
/* status는 일부러 제외 — 로컬(파이썬)판의 status('운영'/'기록보관')는 웹에서 쓰지 않는다.
   웹은 계약관계를 lifecycle('계약종료'/'기록보관')로 따로 관리하므로, status를 넣으면 죽은 값만 쌓인다.
   기록보관 지정은 기금 현황의 [계약관계] 드롭다운으로 사람이 판단해 바꾼다. */
var IMP_IDENTITY=['name','short_name','fund_type'];    // 채우기만(덮어쓰기 제외)
function importFundsInfo(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=function(ev){ var file=ev.target.files&&ev.target.files[0]; if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){
      var data; try{ data=JSON.parse(rd.result); }catch(e){ toast('JSON을 읽지 못했습니다: '+e.message,'err'); return; }
      if(!data||typeof data!=='object'||Array.isArray(data)){ toast('형식이 다릅니다 — {기금ID:{항목…}} 형태여야 합니다','err'); return; }
      _impPreview(data, file.name);
    };
    rd.readAsText(file);
  };
  inp.click();
}
function _impNorm(s){ return String(s==null?'':s).replace(/\s+/g,'').trim(); }
function _impMatch(key, rec){          // ① ID 일치 ② 기금법인명 정확 일치(공백 무시)
  if(funds[key]&&!isTrashed(funds[key])) return key;
  var nm=_impNorm(rec&&rec.name); if(!nm) return '';
  var hit=Object.keys(funds).filter(function(k){ return !isTrashed(funds[k]) && _impNorm(funds[k].name)===nm; });
  return hit.length===1?hit[0]:'';     // 동명이 둘 이상이면 자동 매칭하지 않음(사람이 판단)
}
function _impPlan(data, over){
  var plan=[], unmatched=[], totalCells=0;
  Object.keys(data).forEach(function(key){
    var rec=data[key]||{}, fid=_impMatch(key,rec);
    if(!fid){ unmatched.push(rec.name||key); return; }
    var cur=funds[fid]||{}, set={}, names=[];
    IMP_FIELDS.forEach(function(f){
      var v=rec[f]; if(v==null) return;
      /* 임원 명부는 «줄의 묶음»이라 글자로 다룰 수 없다 —
         String() 을 씌우면 [object Object] 가 저장돼 명부가 통째로 망가진다. */
      if(_IMP_LIST[f]){
        if(!Array.isArray(v)||!v.length) return;
        var curL=Array.isArray(cur[f])?cur[f]:[];
        if(curL.length&&!over) return;                             // 이미 든 명부는 안 덮는다
        if(JSON.stringify(curL)===JSON.stringify(v)) return;       // 같으면 건너뜀
        set[f]=v; names.push(f+'('+v.length+'명)'); return;
      }
      if(String(v).trim()==='') return;
      var has=String(cur[f]==null?'':cur[f]).trim()!=='';
      if(has&&!over) return;                       // 빈 칸만 채움
      if(has&&String(cur[f]).trim()===String(v).trim()) return;   // 동일값은 건너뜀
      set[f]=String(v).trim(); names.push(f);
    });
    IMP_IDENTITY.forEach(function(f){              // 신원 필드는 항상 채우기만
      var v=rec[f]; if(v==null||String(v).trim()==='') return;
      if(String(cur[f]==null?'':cur[f]).trim()!=='') return;
      set[f]=String(v).trim(); names.push(f+'(신규)');
    });
    if(names.length){ plan.push({fid:fid,label:(cur.short_name||cur.name||fid),set:set,names:names}); totalCells+=names.length; }
  });
  return {plan:plan, unmatched:unmatched, cells:totalCells};
}

    +(r.unmatched.length?'<br>매칭 실패 '+r.unmatched.length+'건(기금ID·기금법인명 불일치): '+esc(r.unmatched.slice(0,6).join(', '))+(r.unmatched.length>6?' 외':''):'')+'</p>'

    +(r.plan.length
      ? '<div style="max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:8px"><table><thead><tr><th>기금</th><th>채울 항목</th><th class="center">칸</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
        +(r.plan.length>60?'<p class="muted" style="font-size:11px;margin:6px 0 0">…상위 60개만 표시(전체 '+r.plan.length+'개 적용)</p>':'')
      : '<div class="msg warn">채울 항목이 없습니다. (이미 모두 입력돼 있거나 파일이 비어 있음)</div>')
    +'<p class="muted" style="font-size:11px;margin:8px 0 0">※ 연도별 결산·지원금·담당자·설립 진행·계약관계 데이터는 건드리지 않습니다. 이름·약칭·유형은 비어 있을 때만 채웁니다.</p>'
    +'<div class="row" style="justify-content:flex-end;margin-top:14px"><button onclick="closeM()">취소</button>'

var BULK_OFFICES=[

/* ══ 미완비 일괄 — 기업정보함에 있는 값을 당겨온다 ══
   기업정보함(사업자등록증)이 채울 수 있는 것은 셋뿐이다:
     법인등록번호(cno) · 고유번호(bz) · 소재지(ad)
   인가번호·인가일·설립등기일은 인가증·등기부에만 있어 여기서 못 채운다.
   ⚠ 이름이 어정쩡하게 닮은 카드를 끌어오면 «남의 회사 번호»가 기금에 박힌다 —
     확실할 때만 짝짓고, 후보가 둘 이상이면 아예 건너뛴다. */
var CARD_BULK=[['cno','corp_reg_no','법인등록번호'],['bz','tax_id_no','고유번호'],['ad','address','소재지']];
/* 기금 이름 ↔ 카드 회사 이름 짝짓기. 기금명은 양쪽에 「근로복지기금」이 붙으므로
   그것까지 걷어낸 열쇠로 견주고, 짧은 열쇠(3자 미만)는 아예 쓰지 않는다. */
function _cardFundKey(s){
  return String(s||'').replace(/\(주\)|㈜|주식회사|사단법인|재단법인|유한회사/g,'')
    .replace(/공동근로복지기금|사내근로복지기금|근로복지기금/g,'')
    .replace(/[\s\-·_()\[\]]/g,'').toLowerCase();
}
function _cardMatch(f){
  var cands=(_cardIdx||[]).filter(function(r){ return r.k==='biz'&&String(r.c||'').trim(); });
  var dig=function(v){ return String(v||'').replace(/\D/g,''); };
  // ① 이미 아는 번호로 맞추기 — 가장 확실하다
  var byNo=cands.filter(function(r){
    var b=dig(r.bz), c=dig(r.cno);
    return (b&&b.length>=10&&b===dig(f.tax_id_no))||(c&&c.length>=10&&c===dig(f.corp_reg_no));
  });
  if(byNo.length===1) return byNo[0];
  // ② 이름 — 완전히 같을 때만. 부분일치는 「충남 4호」와 「충남 40호」를 섞을 수 있다
  var k=_cardFundKey(f.name||f.short_name);
  if(k.length<3) return null;
  var exact=cands.filter(function(r){ return _cardFundKey(r.c)===k; });
  return exact.length===1?exact[0]:null;
}
function bulkFromCards(){
  if(!_cardIdx){
    toast('기업정보함을 읽는 중…');
    loadCardIdx().then(bulkFromCards).catch(function(e){ toast('기업정보함을 읽지 못했습니다: '+((e&&e.message)||e),'err'); });
    return;
  }
  var arr=Object.keys(funds).filter(function(k){ return !isTrashed(funds[k])&&funds[k].setup_stage!=='설립준비'; })
    .map(function(k){ return Object.assign({_id:k},funds[k]); })
    .filter(function(f){ return nDone(f)<5; });                    // 미완비만
  var plan=[], rows=[], cnt={}, noCard=[];
  CARD_BULK.forEach(function(c){ cnt[c[1]]=0; });
  arr.forEach(function(f){
    var card=_cardMatch(f);
    if(!card){ noCard.push(f.short_name||f.name); return; }
    var cell={}, any=false;
    CARD_BULK.forEach(function(c){
      if(String(f[c[1]]||'').trim()) return;                        // 이미 있으면 건드리지 않는다
      var v=String(card[c[0]]||'').trim(); if(!v) return;
      cell[c[1]]=v; cnt[c[1]]++; any=true;
      plan.push({id:f._id,name:f.short_name||f.name,key:c[1],office:v});
    });
    if(any) rows.push({name:f.short_name||f.name,card:card.c,cell:cell});
  });
  if(!plan.length){
    toast(arr.length? '기업정보함에서 채울 빈 칸이 없습니다'+(noCard.length?' (짝지을 카드 없음 '+noCard.length+'개)':'')
                    : '미완비 기금이 없습니다','warn');
    return;
  }
  var sum=CARD_BULK.filter(function(c){return cnt[c[1]];}).map(function(c){ return c[2]+' '+cnt[c[1]]+'개'; }).join(' · ');
  showModal('<div class="row" style="margin:0 0 6px"><h2 style="margin:0">🏢 기업정보함에서 일괄 채우기</h2>'+hlp('bulk.card')+'</div>'
    +'<p class="muted" style="font-size:12px;margin:0 0 10px">빈 칸만 채웁니다 — '+esc(sum)+'.'
    +(noCard.length?'<br>짝지을 카드가 없어 제외 '+noCard.length+'개: '+esc(noCard.slice(0,8).join(', '))+(noCard.length>8?' 외':''):'')+'</p>'
    +'<div style="max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px"><table><thead><tr>'
    +'<th>기금</th><th>기업정보함 카드</th>'+CARD_BULK.map(function(c){return '<th>'+c[2]+'</th>';}).join('')+'</tr></thead><tbody>'
    +rows.map(function(r){
      return '<tr><td style="font-weight:600;white-space:nowrap">'+esc(r.name)+'</td>'
        +'<td class="muted" style="white-space:nowrap">'+esc(r.card)+'</td>'
        +CARD_BULK.map(function(c){ return '<td'+(r.cell[c[1]]?'':' class="muted"')+' style="white-space:nowrap">'
          +(r.cell[c[1]]?esc(r.cell[c[1]]):'—')+'</td>'; }).join('')+'</tr>';
    }).join('')+'</tbody></table></div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:14px"><button onclick="closeM()">취소</button>'
    +'<button class="primary" onclick="applyBulkCards()">'+plan.length+'칸 채우기</button></div>',{width:820});
  window._cardPlan=plan;
}
function applyBulkCards(){ _applyBulkOffice(window._cardPlan,null,'기업정보함 값',function(){window._cardPlan=null;}); }
/* 공용 적용기 — 적용 직전 서버 현재값 재확인해 '아직 빈 칸'만 채움(그 사이 입력분 보호).
   field 를 안 주면 줄마다 제 칸(p.key)에 넣는다 — 노동청·세무서·등기소를 한 번에 채울 때. */
function _applyBulkOffice(plan,field,label,clearPlan){
  plan=plan||[]; if(!plan.length){ closeM(); return; }
  var fld=function(p){ return field||p.key; };
  fbDb.ref(NS+'/funds').once('value').then(function(s){
    var cur=s.val()||{}, updates={}, n=0, skip=0;
    plan.forEach(function(p){ var c=cur[p.id]; if(!c) return;
      if(String(c[fld(p)]||'').trim()){ skip++; return; }    // 그 사이 채워졌으면 건너뜀
      updates[p.id+'/'+fld(p)]=p.office; n++; });
    if(!n){ closeM(); toast('채울 대상이 없습니다(이미 입력됨 '+skip+'건)','warn'); return; }
    return fbDb.ref(NS+'/funds').update(updates).then(function(){
      plan.forEach(function(p){ if(funds[p.id]&&updates[p.id+'/'+fld(p)]!==undefined) funds[p.id][fld(p)]=p.office; });
      if(clearPlan)clearPlan(); closeM(); renderHome();
      toast(n+'개 '+label+' 채움'+(skip?' · '+skip+'건은 이미 입력돼 건너뜀':'')+' — 확인 필요');
    });
  }).catch(function(e){ toast('저장 실패: '+e.message,'err'); });
}

// ※ 세무서·노동청·등기소 일괄은 bulkOffices() 하나로 합쳤다(위) — 같은 소재지를 세 번 훑지 않는다.
/* ══ 지원금 과거자료 일괄 가져오기 ══
   과거 폴더에서 뽑은 JSON을 한 번에 넣는다(backups/fund_subsidy_import.json).
   · subsidy      : funds/{기금}/years/{연도}/subsidy — 신청액·결정액·지자체출연금·유형·③1인누계
   · site_contrib : sites/{기금}/{사업장}/contrib — 기본 출연금
   · site_years   : site_years/{기금}/{연도}/{사업장}/contrib — 그 해 출연금
   · chk          : subsidy_chk/{기금}/{연도} — 제출서류 체크(기금 단위·참여사별)
   **빈 칸만 채운다** — 웹에서 이미 입력한 값은 덮지 않는다. */
function importSubsidy(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=function(ev){ var file=ev.target.files&&ev.target.files[0]; if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){
      var d; try{ d=JSON.parse(rd.result); }catch(e){ toast('JSON을 읽지 못했습니다: '+e.message,'err'); return; }
      if(!d||typeof d!=='object'||(!d.subsidy&&!d.site_contrib&&!d.chk)){ toast('형식이 다릅니다 — subsidy/site_contrib/site_years/chk 키가 필요합니다','err'); return; }
      _subImpPreview(d,file.name);
    };
    rd.readAsText(file);
  };
  inp.click();
}
function _subImpPreview(d,fname){
  var SUBK={request_amount:'신청액',decided_amount:'결정액',gov_contrib:'지자체 출연금',req_type:'지원요건',prev_per_worker:'③1인누계',paid_date:'교부일',spent_amount:'집행액'};
  var rows=[], nCell=0, unmatched=[];
  Object.keys(d.subsidy||{}).forEach(function(fid){
    if(!funds[fid]||isTrashed(funds[fid])){ unmatched.push(fid); return; }
    Object.keys(d.subsidy[fid]).forEach(function(yr){
      var cur=((funds[fid].years||{})[yr]||{}).subsidy||{}, src=d.subsidy[fid][yr], items=[];
      Object.keys(src).forEach(function(k){
        if(!SUBK[k]) return;                                       // gov_derived 같은 메타는 제외
        if(String(cur[k]==null?'':cur[k]).trim()!=='') return;      // 이미 있으면 건드리지 않음
        items.push(SUBK[k]); nCell++;
      });
      if(items.length) rows.push([funds[fid].short_name||funds[fid].name, yr+'년 지원금', items.join('·')]);
    });
  });
  var nContrib=0;
  Object.keys(d.site_contrib||{}).forEach(function(fid){
    if(!funds[fid]) return;
    nContrib+=Object.keys(d.site_contrib[fid]).length;
  });
  var nSY=0;
  Object.keys(d.site_years||{}).forEach(function(fid){ if(!funds[fid])return;
    Object.keys(d.site_years[fid]).forEach(function(yr){ nSY+=Object.keys(d.site_years[fid][yr]).length; }); });
  var nChkF=0, nChkS=0, chkRows=[];
  Object.keys(d.chk||{}).forEach(function(fid){ if(!funds[fid])return;
    Object.keys(d.chk[fid]).forEach(function(yr){
      var c=d.chk[fid][yr]||{}, nf=Object.keys(c.fund||{}).length, ns=0;
      Object.keys(c.site||{}).forEach(function(sid){ ns+=Object.keys(c.site[sid]||{}).length; });
      nChkF+=nf; nChkS+=ns;
      chkRows.push([funds[fid].short_name||funds[fid].name, yr+'년 서류', nf+'종 · 참여사 '+ns+'장']);
    });
  });
  var tbl=function(rs){ return rs.length?('<div style="max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px"><table><tbody>'
    +rs.map(function(r){ return '<tr><td style="font-weight:600">'+esc(r[0])+'</td><td class="muted">'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>'; }).join('')
    +'</tbody></table></div>'):'<p class="muted" style="font-size:12px">채울 항목이 없습니다(이미 입력됨).</p>'; };
  window._subImp=d;
  showModal('<div class="row" style="margin:0 0 6px"><h2 style="margin:0">지원금 과거자료 가져오기</h2><span class="chip" style="font-size:10px">'+esc(fname)+'</span></div>'
    +'<p class="muted" style="font-size:12px;margin:0 0 10px"><b>빈 칸만 채웁니다</b> — 이미 입력한 값은 그대로 둡니다.'
    +(unmatched.length?'<br>없는 기금 '+unmatched.length+'건 제외':'')+'</p>'
    +'<div class="row" style="gap:6px;margin-bottom:8px"><span class="stat">지원금 '+nCell+'칸</span><span class="stat">기본 출연금 '+nContrib+'개사</span>'
    +'<span class="stat">연도별 출연금 '+nSY+'건</span><span class="stat">서류체크 '+(nChkF+nChkS)+'건</span></div>'
    +'<h3 style="font-size:12.5px;margin:8px 0 4px">지원금 신청·결정</h3>'+tbl(rows)
    +'<h3 style="font-size:12.5px;margin:10px 0 4px">제출서류 체크</h3>'+tbl(chkRows)
    +'<div class="row" style="justify-content:flex-end;margin-top:14px"><button onclick="closeM()">취소</button>'
    +'<button class="primary" onclick="_subImpApply()">가져오기</button></div>');
}
function _subImpApply(){
  var d=window._subImp; if(!d){ closeM(); return; }
  /* 사업장 출연금은 로컬 캐시에 없으니 서버 현재값을 먼저 읽어 **빈 칸만** 채운다.
     이 확인을 빼면 손으로 넣어 둔 출연금을 과거 자료가 덮어써 버린다. */
  toast('현재 값 확인 중…');
  Promise.all([fbDb.ref(NS+'/sites').once('value'), fbDb.ref(NS+'/site_years').once('value')])
    .then(function(r){ _subImpApply2(d, r[0].val()||{}, r[1].val()||{}); })
    .catch(function(e){ toast('현재 값을 읽지 못했습니다: '+e.message,'err'); });
}
function _subImpApply2(d,curSites,curSY){
  var up={}, n=0, skip=0;
  // ① 지원금 연도값 — 빈 칸만
  var OKK={request_amount:1,decided_amount:1,gov_contrib:1,req_type:1,prev_per_worker:1,paid_date:1,spent_amount:1};
  Object.keys(d.subsidy||{}).forEach(function(fid){
    if(!funds[fid]||isTrashed(funds[fid])) return;
    Object.keys(d.subsidy[fid]).forEach(function(yr){
      var cur=((funds[fid].years||{})[yr]||{}).subsidy||{}, src=d.subsidy[fid][yr];
      Object.keys(src).forEach(function(k){
        if(!OKK[k]) return;
        if(String(cur[k]==null?'':cur[k]).trim()!=='') return;
        up['funds/'+fid+'/years/'+yr+'/subsidy/'+k]=src[k]; n++;
      });
    });
  });
  // ② 사업장 기본 출연금 — 그 사업장이 실제로 있고 값이 비어 있을 때만
  Object.keys(d.site_contrib||{}).forEach(function(fid){
    if(!funds[fid]||isTrashed(funds[fid])) return;
    Object.keys(d.site_contrib[fid]).forEach(function(sid){
      var cs=(curSites[fid]||{})[sid];
      if(!cs){ skip++; return; }                                       // 없는 사업장이면 만들지 않는다
      if(String(cs.contrib==null?'':cs.contrib).trim()!==''){ skip++; return; }
      up['sites/'+fid+'/'+sid+'/contrib']=d.site_contrib[fid][sid]; n++;
    });
  });
  // ③ 연도별 출연금 — 같은 기준(빈 칸만)
  Object.keys(d.site_years||{}).forEach(function(fid){
    if(!funds[fid]||isTrashed(funds[fid])) return;
    Object.keys(d.site_years[fid]).forEach(function(yr){
      Object.keys(d.site_years[fid][yr]).forEach(function(sid){
        if(!(curSites[fid]||{})[sid]){ skip++; return; }
        var v=d.site_years[fid][yr][sid]||{}, cur=((curSY[fid]||{})[yr]||{})[sid]||{};
        Object.keys(v).forEach(function(k){
          if(num(cur[k])){ skip++; return; }
          up['site_years/'+fid+'/'+yr+'/'+sid+'/'+k]=v[k]; n++;
        });
      });
    });
  });
  // ④ 제출서류 체크
  Object.keys(d.chk||{}).forEach(function(fid){
    if(!funds[fid]||isTrashed(funds[fid])) return;
    Object.keys(d.chk[fid]).forEach(function(yr){
      var c=d.chk[fid][yr]||{};
      Object.keys(c.fund||{}).forEach(function(k){ up['subsidy_chk/'+fid+'/'+yr+'/fund/'+k]=1; n++; });
      Object.keys(c.site||{}).forEach(function(sid){
        Object.keys(c.site[sid]||{}).forEach(function(k){ up['subsidy_chk/'+fid+'/'+yr+'/site/'+sid+'/'+k]=1; n++; });
      });
    });
  });
  if(!n){ closeM(); toast('반영할 항목이 없습니다','warn'); return; }
  fbDb.ref(NS).update(up).then(function(){
    // 로컬 캐시 반영 — funds의 연도값만(사업장·체크는 다음 화면 진입 때 다시 읽는다)
    Object.keys(d.subsidy||{}).forEach(function(fid){ var t=funds[fid]; if(!t)return;
      Object.keys(d.subsidy[fid]).forEach(function(yr){
        if(!t.years)t.years={}; if(!t.years[yr])t.years[yr]={};
        var cur=t.years[yr].subsidy||{}, src=d.subsidy[fid][yr], merged=Object.assign({},cur);
        Object.keys(src).forEach(function(k){ if(OKK[k]&&String(cur[k]==null?'':cur[k]).trim()==='') merged[k]=src[k]; });
        t.years[yr].subsidy=merged;
      });
    });
    S.sitesFor=null; S.syFor=null; S.subChkFor=null; window._subImp=null;
    closeM(); renderHome(); toast(n+'건 반영 완료'+(skip?' · '+skip+'건은 이미 입력돼 건너뜀':''));
  }).catch(function(e){ toast('반영 실패: '+e.message,'err'); });
}

// ── 청구 관리 (4단계) ──
/* ══ 푸른이알피(pu-erp) 기금 청구 연동 ══
   원본은 푸른이알피 소유 — 여기서는 **읽기만** 한다(쓰면 사무관리 원장이 깨진다).
   · data/funds/v          : 기금 계약(계약금 contractFee/contractPaid, 잔금 balanceFee/balancePaid)
   · data/finance_income/v : 입금 확정 매출 중 sourceKind==='fund'
   미입금은 계약 쪽 플래그로, 입금완료는 매출 기록으로 잡는다(푸른이알피 입금관리와 같은 기준 → 이중계상 없음).
   연결 보정값만 우리 네임스페이스 fund_erp/puerp_link 에 저장한다. */
var _peCache=null;
function _peNorm(v){ if(!v) return []; if(!Array.isArray(v)) v=Object.keys(v).map(function(k){return v[k];}); return v.filter(Boolean); }
function _peLocal(key){ try{ return _peNorm(JSON.parse(localStorage.getItem('pureun_v6_'+key)||'null')); }catch(e){ return []; } }
function _peRead(key){   // ① Firebase(최신) ② 같은 출처 localStorage(푸른이알피가 채워둔 값) 폴백
  return fbDb.ref('data/'+key+'/v').once('value').then(function(s){
    var a=_peNorm(s.val()); return a.length?a:_peLocal(key);
  }).catch(function(){ return _peLocal(key); });
}
/* 매출 원장(finance_income)은 법인 전체 기록이라 통째로 받으면 폰에서 무겁다.
   sourceKind='fund'만 서버에서 걸러 받고, 실패하면 전체 읽기로 물러난다.
   (규칙에 .indexOn:"sourceKind"가 없으면 콘솔 경고만 나고 동작은 한다) */
function _peReadIncome(){
  return fbDb.ref('data/finance_income/v').orderByChild('sourceKind').equalTo('fund').once('value')
    .then(function(s){ var a=_peNorm(s.val()); return a.length?a:_peRead('finance_income'); })
    .catch(function(){ return _peRead('finance_income'); });
}
function loadPuerp(force){
  if(_peCache&&!force) return Promise.resolve(_peCache);
  return Promise.all([_peRead('funds'),_peReadIncome(),
      fbDb.ref(NS+'/puerp_link').once('value').then(function(s){return s.val()||{};}).catch(function(){return {};})
    ]).then(function(r){
    _peCache={ projects:r[0].filter(function(x){return x&&x.id&&!x._deleted;}),
               income:r[1].filter(function(x){return x&&x.sourceKind==='fund'&&!x._deleted;}),
               link:r[2] };
    return _peCache; });
}
// 기금명 비교용 정규화 — 법인 표기·'근로복지기금' 같은 공통어를 걷어낸다
function _mkey(s){ return String(s||'').replace(/\(주\)|㈜|주식회사|사단법인|재단법인|유한회사/g,'')
  .replace(/공동근로복지기금|사내근로복지기금|근로복지기금/g,'').replace(/[\s\-·_()\[\]]/g,'').toLowerCase(); }
function _dg10(s){ return String(s||'').replace(/\D/g,''); }
/* pu-erp 기금 계약 1건 → fund_erp 기금 id. ①수동 지정 ②사업자번호 ③기금명 완전일치 ④부분일치(후보 1개일 때만) */
function linkPuerp(p,link){
  var man=(link||{})[p.id]; if(man) return man==='__none__'?null:(funds[man]?man:null);
  var ids=Object.keys(funds).filter(function(k){return !isTrashed(funds[k]);});
  // 기금은 사업자등록번호가 아니라 **고유번호(tax_id_no)**로 계산서를 받는다(법인등록번호도 대비).
  var bz=_dg10(p.bizNo);
  if(bz.length>=10){
    var h=ids.filter(function(k){ var f=funds[k];
      return _dg10(f.tax_id_no)===bz||_dg10(f.biz_no)===bz||_dg10(f.corp_reg_no)===bz; })[0];
    if(h) return h; }
  var pk=_mkey(p.companyName||p.name); if(pk.length<2) return null;
  var exact=ids.filter(function(k){ return _mkey(funds[k].name)===pk||_mkey(funds[k].short_name)===pk; })[0];
  if(exact) return exact;
  var part=ids.filter(function(k){ var a=_mkey(funds[k].name),b=_mkey(funds[k].short_name);
    return (a&&a.length>1&&(a.indexOf(pk)>=0||pk.indexOf(a)>=0))||(b&&b.length>1&&(b.indexOf(pk)>=0||pk.indexOf(b)>=0)); });
  return part.length===1?part[0]:null;   // 후보가 둘 이상이면 자동 연결하지 않고 사용자에게 맡긴다
}
/* 청구 항목 도출 — 대기(계약 미입금) + 완료(확정 매출) */
function puerpRows(pe){
  var byId={}; pe.projects.forEach(function(p){ byId[p.id]=p; });
  var wait=[], done=[];
  pe.projects.forEach(function(p){
    var fid=linkPuerp(p,pe.link);
    [['계약금',p.contractFee,p.contractPaid,p.contractDate],
     ['잔금',  p.balanceFee, p.balancePaid, p.startDate]].forEach(function(c){
      if(!(num(c[1])>0)||c[2]) return;                      // 금액 없거나 이미 입금확정 → 대기 아님
      wait.push({pid:p.id,fund_id:fid,no:p.no||'',company:p.companyName||'',bizNo:p.bizNo||'',
        item:c[0],amount:num(c[1]),date:c[3]||'',mgr:p.managerMain||p.mgrMain||'',pstatus:p.status||''});
    });
  });
  pe.income.forEach(function(x){
    var p=byId[x.sourceId];
    done.push({pid:x.sourceId||'',iid:x.id,fund_id:p?linkPuerp(p,pe.link):null,no:(p&&p.no)||'',
      company:x.companyName||(p&&p.companyName)||'',bizNo:(p&&p.bizNo)||'',
      item:x.kind||'기금수수료',amount:num(x.amount),paid_date:x.date||'',
      vat:x.vatIncluded?'포함':'별도',mgr:x.managerName||''});
  });
  wait.sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  done.sort(function(a,b){return (b.paid_date||'').localeCompare(a.paid_date||'');});
  return {wait:wait,done:done};
}

/* ⚠ pdf.js 는 건네받은 버퍼를 워커로 «넘겨준다»(transfer) — 원본이 그 자리에서 무효가 된다.
     같은 버퍼를 다시 쓰면 「An ArrayBuffer is detached and could not be cloned」로 터진다.

     스캔 PDF 는 글자층이 없어 «두 번» 읽어야 한다 — 먼저 글자를 찾아보고(pdfText),

     고유번호증·등기부처럼 스캔으로만 오는 서류는 그래서 «한 번도» 판독되지 않았다.

function _pdfCopy(buf){

// PDF → 좌표 정렬 텍스트. 텍스트 레이어가 없으면 '' 반환(=스캔 이미지)
function pdfText(buf){
  if(typeof pdfjsLib==='undefined') return Promise.reject(new Error('PDF 라이브러리 로드 실패 — 새로고침하세요'));
  try{ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}
  return pdfjsLib.getDocument({ isEvalSupported: false, data:_pdfCopy(buf)}).promise.then(function(doc){
    var n=Math.min(doc.numPages,5), jobs=[];
    for(var i=1;i<=n;i++) jobs.push(doc.getPage(i).then(function(pg){ return pg.getTextContent(); }));
    var fin=function(){ try{ doc.destroy(); }catch(e){} };   // PDF worker 자원 반납
    return Promise.all(jobs).then(function(r){ fin(); return r; },function(e){ fin(); throw e; }).then(function(cs){
      return cs.map(function(c){
        var items=c.items.filter(function(it){return (it.str||'').trim();})
          .map(function(it){ return {s:it.str, x:it.transform[4], y:it.transform[5]}; });
        items.sort(function(a,b){ var dy=b.y-a.y; if(Math.abs(dy)>3) return dy; return a.x-b.x; });  // 위→아래, 좌→우
        var out='',lastY=null;
        items.forEach(function(it){ if(lastY!==null&&Math.abs(it.y-lastY)>3) out+='\n'; out+=it.s+' '; lastY=it.y; });
        return out;
      }).join('\n');
    });
  });
}

  var seg=flat.match(/기금법인\s*명칭\s*:?\s*(.*?)(?=\d\s*\.\s*대표자|대표자\s*성명|$)/);
  if(seg){
    var s=seg[1].replace(/\d\s*\.\s*주사무소\s*소재지\s*:?/g,' ').replace(/\s+/g,' ').trim();
    var SIDO='서울특별시|부산광역시|대구광역시|인천광역시|광주광역시|대전광역시|울산광역시|세종특별자치시'

      +'|서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주';
    var re=new RegExp('(?:'+SIDO+')[가-힣]{0,4}\\s*[가-힣]{2,7}(?:시|군|구)(?![가-힣])','g'), mm, last=-1;
    while((mm=re.exec(s))) last=mm.index;          // 이름에도 '충남' 등이 있으므로 마지막 매치를 주소 시작으로
    if(last>0){

// ── 등기사항전부증명서 판독 (텍스트 PDF일 때) ──
function parseCorpReg(txt){
  var flat=_flat(txt), o={};
  var m=flat.match(/등록번호\s*(\d{6}\s*-\s*\d{7})/); if(m) o.corp_reg_no=m[1].replace(/\s/g,'');
  m=flat.match(/법인성립연월일\s*(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if(m) o.reg_date=m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  m=flat.match(/설립인?허?가?연월일\s*(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if(m) o.inka_date=m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  m=flat.match(/주사무소\s*(.+?)(?=\s*목\s*적|\s*공고|$)/); if(m) o.address=m[1].trim();
  m=flat.match(/관할등기소\s*([가-힣]+지방법원[가-힣]*\s*[가-힣]*등기소?)/); if(m) o.registry_office=m[1].replace(/\s+/g,' ').trim();
  return o;
}
/* ── 고유번호증 판독 ──
   OCR 텍스트는 글자 사이에 잡음이 낀다("단 _ 체 . 명 :", "소 _ OX:") → 라벨을 느슨하게 매칭한다. */
function _loose(s){ return s.split('').map(function(c){return c+'[\\s_.,:：]*';}).join(''); }
function parseTaxId(txt){
  var flat=_flat(txt), o={};
  var m=flat.match(/(\d{3})\s*-\s*(\d{2})\s*-\s*(\d{5})/);           // 고유번호(3-2-5)
  if(m) o.tax_id_no=m[1]+'-'+m[2]+'-'+m[3];
  m=flat.match(new RegExp(_loose('법인등록번호')+'[:：]?\\s*(\\d{6})\\s*-\\s*(\\d{7})'));
  if(!m) m=flat.match(/(\d{6})\s*-\s*(\d{7})/);                     // 라벨 오독 대비
  if(m) o.corp_reg_no=m[1]+'-'+m[2];
  m=flat.match(new RegExp(_loose('단체명')+'[:：]\\s*(.+?)(?=\\s*'+_loose('대표')+'|\\s*'+_loose('법인')+'|$)'));
  if(m){ var nm=_cleanName(m[1]); if(nm) o.name=nm; }
  // '대표자'가 '내표자'로 오독되는 일이 잦아 첫 글자를 느슨하게 둔다
  m=flat.match(/[대내]\s*[_.]*\s*표\s*[_.]*\s*자\s*[_.]*\s*성\s*[_.]*\s*명\s*[:：]?\s*([가-힣]{2,5})/);
  if(m) o.chairman=m[1];
  // 소재지 — 뒤따르는 '발급사유'는 '발 = 사 유'처럼 깨져 나오므로 느슨하게 끊는다
  m=flat.match(/소\s*[_.]*\s*재?\s*[가-힣A-Za-z]{0,3}\s*[:：]\s*(.+?)(?=\s*발\s*[^가-힣]{0,4}\s*(?:급|사)\s*[_.]*\s*(?:사\s*)?유|\s*\(유의|$)/);
  if(m){ var ad=_cleanAddr(m[1]); if(ad) o.address=ad; }
  m=flat.match(/([가-힣]{2,6})\s*세무서장?/); if(m) o.tax_office=m[1]+'세무서';
  return o;
}
/* OCR 잡음 정리 — 깨진 라틴문자·기호 덩어리를 걷어낸다 */
function _cleanName(s){
  var t=String(s||'').replace(/[^가-힣0-9()·\s]/g,' ').replace(/\s+/g,'').trim();
  var m=t.match(/^(.*?기금\d*호?)/);                 // '…기금[N호]'까지만
  return m?m[1]:(t.length<=30?t:'');
}
function _cleanAddr(s){
  var t=String(s||'').replace(/[^가-힣0-9()~,\-\s]/g,' ').replace(/\s+/g,' ').trim();
  t=t.replace(/\s*발\s*(?:급)?\s*사?\s*유.*$/,'').trim();      // '발급사유 신규' 꼬리 제거
  return t.length>=6&&t.length<=100?t:'';
}

/* ═══════════ 스캔 문서 OCR (tesseract.js) ═══════════
   스캔본은 글자가 없어 그림을 글자로 바꿔야 한다. 첫 사용 때만 엔진·한국어 데이터를 내려받는다(약 15MB).
   전처리(3배 확대 + 흑백 2치화)가 정확도를 크게 좌우한다 — 등기부의 노란 보안무늬가 사라져야 숫자가 읽힌다.
   실측: 고유번호증·인가증 스캔은 핵심 항목이 정확히 읽히고, 등기부는 날짜는 읽히나 법인등록번호는 자주 실패. */
var OCR_CDN='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';

function ocrReady(){
  if(typeof Tesseract!=='undefined') return Promise.resolve();
  if(_ocrLoad) return _ocrLoad;
  _ocrLoad=new Promise(function(res,rej){
    var s=document.createElement('script'); s.src=OCR_CDN;
    s.onload=function(){res();}; s.onerror=function(){ _ocrLoad=null; rej(new Error('OCR 엔진을 내려받지 못했습니다(인터넷 확인)')); };
    document.head.appendChild(s);
  });

}
// 캔버스 흑백 2치화 — 보안무늬·배경색 제거
function _binarize(cv,thr){
  thr=thr||170;
  var g=cv.getContext('2d'), im=g.getImageData(0,0,cv.width,cv.height), d=im.data;
  for(var i=0;i<d.length;i+=4){
    var v=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)>thr?255:0;
    d[i]=d[i+1]=d[i+2]=v;
  }
  g.putImageData(im,0,0); return cv;
}
// PDF 첫 N쪽 → 2치화 캔버스 배열
function pdfPageCanvases(buf,maxPages){
  return pdfjsLib.getDocument({ isEvalSupported: false, data:_pdfCopy(buf)}).promise.then(function(doc){
    var n=Math.min(doc.numPages,maxPages||2), jobs=[];
    for(var i=1;i<=n;i++) jobs.push(doc.getPage(i).then(function(pg){
      var vp=pg.getViewport({scale:3});                 // 3배 ≈ 216dpi
      var cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
      return pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise.then(function(){ return _binarize(cv); });
    }));
    var fin=function(){ try{ doc.destroy(); }catch(e){} };
    return Promise.all(jobs).then(function(r){ fin(); return r; },function(e){ fin(); throw e; });
  });
}
// 이미지 파일 → 2치화 캔버스
function imgCanvas(file){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      // 큰 사진은 2200px로 줄이고(메모리·속도), 작은 사진만 1.6배 확대(OCR 인식률)
      var W=img.width||1, k=W>2200?(2200/W):(W<1400?1.6:1);
      var w=Math.max(1,Math.round(W*k)), h=Math.max(1,Math.round((img.height||1)*k));
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url); res(_binarize(cv));
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('이미지를 열 수 없습니다')); };
    img.src=url;
  });
}
// 캔버스들 OCR → 합친 텍스트
function ocrCanvases(cvs,onStat){
  return ocrReady().then(function(){
    onStat&&onStat('OCR 엔진 준비 중…');
    return Tesseract.createWorker('kor+eng',1,{logger:function(m){
      if(m.status==='recognizing text') onStat&&onStat('글자 인식 중 '+Math.round((m.progress||0)*100)+'%');
      else if(/download|load/i.test(m.status||'')) onStat&&onStat('한국어 데이터 내려받는 중… (최초 1회)');
    }});
  }).then(function(w){
    var texts=[];
    // 실패해도 worker를 반드시 종료한다(WASM 메모리 누수 방지)
    var fin=function(){ return Promise.resolve(w.terminate()).catch(function(){}); };
    return cvs.reduce(function(p,cv,i){
      return p.then(function(){ onStat&&onStat((i+1)+'/'+cvs.length+'쪽 인식 중…');
        return w.recognize(cv).then(function(r){ texts.push((r.data&&r.data.text)||''); }); });
    },Promise.resolve())
      .then(function(){ return fin().then(function(){ return texts.join('\n'); }); },
            function(err){ return fin().then(function(){ throw err; }); });
  });
}

function startFormDrag(e){ e.preventDefault(); var split=$('formSplit'),left=$('formLeft'); if(!split||!left)return;
  _formDrag={x:e.clientX, w:left.getBoundingClientRect().width, total:split.getBoundingClientRect().width};
  document.body.style.cursor='col-resize'; document.body.style.userSelect='none';
  window.addEventListener('mousemove',onFormDrag); window.addEventListener('mouseup',endFormDrag); }
function onFormDrag(e){ if(!_formDrag)return; var left=$('formLeft'); if(!left)return;
  var w=_formDrag.w+(e.clientX-_formDrag.x), min=300, max=Math.max(min,_formDrag.total-320);
  w=Math.max(min,Math.min(max,w)); left.style.width=w+'px'; S.formSplitW=Math.round(w);
  fitDocA4();   // 패널 폭이 바뀌면 A4 배율도 다시 맞춤
}
function endFormDrag(){ _formDrag=null; document.body.style.cursor=''; document.body.style.userSelect='';

// 저장은 IndexedDB('hwp:'+kind), 편집기는 rhwp studio(iframe)+@rhwp/editor(esm.sh). 데이터 자동채움 없음(수동 편집).
var RHWP_EDITOR_URL=(window.PUREUN_HWP_CONFIG&&window.PUREUN_HWP_CONFIG.editorUrl)||'https://esm.sh/@rhwp/editor';
function pickHwp(kind){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='.hwp,.hwpx';
  inp.onchange=function(ev){ var file=ev.target.files&&ev.target.files[0]; if(!file)return;
    var rd=new FileReader();

      idbPut('hwp:'+kind,rd.result).then(function(){ S._hwpChk=false;
      _formsRerender(); toast('원본 HWP 등록: '+file.name); })
      .catch(function(e){ toast('저장 실패: '+e.message,'err'); }); };
    rd.readAsArrayBuffer(file); };
  inp.click();
}
function clearHwp(kind){ confirmM('등록된 원본 HWP를 삭제할까요?',{ok:'삭제',danger:true}).then(function(ok){ if(ok) idbDel('hwp:'+kind).then(function(){ S._hwpChk=false; _formsRerender(); toast('삭제되었습니다'); }); }); }
// 여러 .hwp를 파일명으로 서식에 자동 매칭해 일괄 등록
function pickHwpBulk(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='.hwp,.hwpx'; inp.multiple=true;
  inp.onchange=function(ev){ var files=Array.prototype.slice.call(ev.target.files||[]); if(!files.length)return;
    // 파일명 → 서식 자동 매칭. 구체적인 규칙을 앞에 둬야 함(예: '기금사용내용' 회의록이 '준비위 회의록'으로 가지 않게)
    var RULES=[['reg_sealpaper',['인감대지','대지']],['reg_sealcard',['인감카드','카드']],['reg_seal',['인감']],
      ['reg_roster',['협의회명부','명부']],['reg_apply',['설립등기','등기신청','특수법인']],['reg_accept',['취임','승낙']],
      ['reg_license',['등록면허','면허세']],['reg_proxy',['위임장']],
      ['tax_bizreg',['법인설립신고','사업자등록신청']],['tax_sublease',['전대']],['tax_lease',['임대차']],['tax_hometax',['홈텍스','홈택스']],
      ['sub_required',['필요서류']],['sub_checklist',['체크리스트','자율점검']],['sub_oath',['서약']],
      ['sub_welfare_plan',['복지사업계획']],['sub_assets',['재산목록']],['sub_payment',['지급신청']],
      ['subsidy',['지원신청서','지원금지원신청','기금지원신청']],
      ['ops_asset_change',['재산변동']],
      ['ops_minutes_scope',['사용범위']],['ops_minutes_use',['기금사용내용','사용내용']],
      ['inka',['인가신청']],['agreement',['합의']],
      ['charter',['정관']],['minutes',['준비위','회의록']],['contrib',['출연']],['bizplan',['사업계획']]];
    var used={}, plan=[];
    files.forEach(function(f){ var n=f.name, hit=null;
      for(var i=0;i<RULES.length;i++){ var k=RULES[i][0]; if(used[k])continue;
        var ok = (k==='reg_seal') ? (n.indexOf('인감')>=0&&n.indexOf('신고')>=0) : RULES[i][1].some(function(w){return n.indexOf(w)>=0;});
        if(ok){ hit=k; break; } }
      if(hit){ used[hit]=1; plan.push([hit,f]); } else plan.push([null,f]); });
    var matched=plan.filter(function(p){return p[0];});
    if(!matched.length){ toast('파일명에서 서식을 못 알아냈어요 — 서식별 [등록]으로 개별 등록하세요','warn'); return; }
    Promise.all(matched.map(function(p){ return new Promise(function(res){ var rd=new FileReader();
      rd.onload=function(){ try{ PureunHwp.validate(rd.result,p[1].name); }catch(e){res(false);return;}
        idbPut('hwp:'+p[0],rd.result).then(function(){res(true);}).catch(function(){res(false);}); };
      rd.onerror=function(){res(false);}; rd.readAsArrayBuffer(p[1]); }); }))
      .then(function(oks){ S._hwpChk=false; _formsRerender();
        var okN=oks.filter(Boolean).length, failN=oks.length-okN;      // 실제 저장 성공분만 집계
        var un=plan.filter(function(p){return !p[0];}).map(function(p){return p[1].name;});
        if(!okN){ toast('저장 실패 — 브라우저 저장공간(IndexedDB)을 확인하세요','err'); return; }
        toast(okN+'개 자동 등록'+(failN?' · 실패 '+failN+'개':'')+(un.length?' · 미매칭 '+un.length+'개는 개별 등록':''), failN?'warn':''); }); };
  inp.click();
}
var _hwpEditor=null, _hwpName='서식', _hwpOriginalBuf=null, _hwpOriginalFormat='hwp';

      +'<button class="primary" onclick="hwpExport(\'hwp\')">💾 .hwp로 저장</button>'
      +'<button onclick="hwpExport(\'hwpx\')">💾 .hwpx로 저장</button>'
      +'<button onclick="hwpDownloadOriginal()">⬇ 원본 보관</button>'
      +'<button onclick="closeHwp()">✖ 닫기</button></div>'
      +'<div style="flex:1;display:flex;min-height:0;background:#fff;border-radius:0 0 9px 9px;overflow:hidden">'
      +'<div id="hwpHost" style="flex:1;min-width:0"></div>'
      +'<div class="hwpData" style="width:230px;border-left:1px solid var(--line,#e2e8f0);padding:12px;overflow:auto"><div style="font-size:12px;font-weight:700;margin-bottom:8px">📋 ['+esc(f.short_name||f.name||'')+'] 데이터<br><span style="font-weight:400;color:var(--sub);font-size:10.5px">클릭해 복사 후 서식에 붙여넣기</span></div>'+ref+'</div></div>'
      +'<div id="hwpStat" style="background:#1e293b;color:#f0fdf4;font-size:11px;padding:5px 12px;border-radius:0 0 9px 9px">편집기 불러오는 중…</div>';
    document.body.appendChild(m);

    PureunHwp.createEditor('#hwpHost',buf,label+'.'+_hwpOriginalFormat,{editorUrl:RHWP_EDITOR_URL})
      .then(function(opened){ _hwpEditor=opened.editor; var r=opened.result;
        stat('문서 검사 완료 · '+((r&&r.pageCount)||'?')+'쪽 · 편집 후 [💾 저장]으로 .hwp/.hwpx 내려받기'); })
      .catch(function(){ stat('고급 편집기를 불러오지 못했습니다. 안전한 읽기 전용 미리보기로 전환합니다.');
        return PureunHwp.renderPreview($('hwpHost'),buf,label+'.'+_hwpOriginalFormat)
          .catch(function(e){ stat('미리보기 실패: '+(e&&e.message||e)+' · [원본 보관]으로 파일을 내려받으세요.'); }); });

function hwpExport(fmt){
  if(!_hwpEditor){ toast('편집기가 아직 준비되지 않았습니다','warn'); return; }
  PureunHwp.exportFrom(_hwpEditor,fmt).then(function(bytes){ PureunHwp.download(bytes,_hwpName+'.'+fmt,fmt);
    toast('내보내기 완료: '+_hwpName+'.'+fmt); })
   .catch(function(e){ toast('내보내기 실패: '+(e&&e.message||e),'err'); });
}
function hwpDownloadOriginal(){ if(!_hwpOriginalBuf){toast('보관된 원본이 없습니다','warn');return;}
  PureunHwp.download(_hwpOriginalBuf,_hwpName+'_원본.'+_hwpOriginalFormat,_hwpOriginalFormat); toast('원본 문서를 내려받았습니다'); }

/* ── 쪽 나누기 ──
   긴 서식을 A4 본문높이(257mm)에 맞춰 여러 장으로 자르고, 장마다 하단에 쪽수를 붙인다.
   블록 요소 단위로 담다가 넘치면 다음 장으로 넘긴다(표 한 개가 한 장보다 크면 그 장에 두고 표시).
   편집 중 자동 재분할은 하지 않는다 — 커서가 튀기 때문. 넘치면 배지로 알리고 [다시 나누기]로 처리. */
function _a4Page(no){
  var p=document.createElement('div'); p.className='a4';
  var b=document.createElement('div'); b.className='a4b';
  var f=document.createElement('div'); f.className='a4f'; f.setAttribute('contenteditable','false');
  f.textContent='- '+no+' -';
  p.appendChild(b); p.appendChild(f); return p;
}
/* 표가 한 장에 안 들어가면 행 단위로 자른다.
   이 장에 들어갈 만큼만 남기고, 나머지 행을 담은 같은 모양의 표를 돌려준다(다음 장에서 이어짐).
   머리행(thead)이 있으면 이어지는 장에도 복사해 붙여 표가 무슨 표인지 알 수 있게 한다.
   한 행조차 안 들어가면 되돌리고 null — 부르는 쪽이 통째로 다음 장으로 넘긴다. */
function _splitTableToFit(tbl,body,limit){
  var rows=[];
  Array.prototype.forEach.call(tbl.rows,function(r){ if(r.closest('table')===tbl) rows.push({r:r,p:r.parentNode}); });
  var head=tbl.querySelector(':scope > thead');
  var movable=rows.filter(function(x){ return !head||x.p!==head; });        // 머리행은 남긴다
  if(movable.length<2) return null;
  var moved=[];
  while(movable.length>1 && body.scrollHeight>limit){                       // 최소 한 행은 남긴다
    var last=movable.pop(); last.r.remove(); moved.unshift(last);
  }
  if(!moved.length) return null;
  if(body.scrollHeight>limit){                                              // 그래도 안 들어감 → 원복
    moved.forEach(function(x){ x.p.appendChild(x.r); });
    return null;
  }
  var rest=tbl.cloneNode(false);                                            // 테두리·너비 등 표 속성 유지
  /* 열 폭 정의(colgroup)를 이어지는 표에도 복사한다. shallow clone은 자식을 안 가져오므로
     이걸 빼면 다음 쪽 표가 열 폭을 잃고 균등분할돼, 쪽마다 칸 폭이 달라지고
     좁은 칸의 글자가 칸을 넘쳐 표가 본문 폭을 벗어난다(사업자등록신청서 66열 실측). */
  var cg=tbl.querySelector(':scope > colgroup');
  if(cg) rest.appendChild(cg.cloneNode(true));
  if(head) rest.appendChild(head.cloneNode(true));                          // 머리행 반복
  var tb=document.createElement('tbody'); rest.appendChild(tb);
  moved.forEach(function(x){ tb.appendChild(x.r); });
  return rest;
}
function paginateDoc(rawHTML){
  var ed=$('doced'); if(!ed) return;
  var holder=document.createElement('div'); holder.innerHTML=rawHTML||'';
  // 이전에 붙인 쪽수·넘침배지 제거 — 저장본을 다시 열 때 쪽수가 겹치는 것 방지
  Array.prototype.forEach.call(holder.querySelectorAll('.a4f,.a4of'),function(x){ x.remove(); });
  // .a4b(본문 껍데기)는 벗겨서 내용만 남긴다 — 저장본은 이미 감싸져 있다
  Array.prototype.forEach.call(holder.querySelectorAll('.a4b'),function(b){
    while(b.firstChild) b.parentNode.insertBefore(b.firstChild,b);
    b.remove();
  });
  // 이미 .a4로 감싼 입력(전체 초안 등)은 장 단위가 정해져 있으니 각 장 안에서만 다시 나눈다
  var groups=holder.querySelectorAll(':scope > .a4');
  var blocks=[];
  if(groups.length) Array.prototype.forEach.call(groups,function(g){ blocks.push(Array.prototype.slice.call(g.childNodes)); });
  else blocks.push(Array.prototype.slice.call(holder.childNodes));

  ed.innerHTML='<style>'+dgDocCssIn()+'</style>';
  var no=0, pages=[];
  blocks.forEach(function(nodes){
    no++; var page=_a4Page(no); ed.appendChild(page); pages.push(page);
    var body=page.querySelector('.a4b'), limit=body.clientHeight;
    var queue=nodes.slice(), guard=0;
    while(queue.length && ++guard<4000){
      var nd=queue.shift();
      if(nd.nodeType===3 && !String(nd.nodeValue||'').trim()) continue;    // 공백 텍스트 무시
      body.appendChild(nd);
      if(!(limit>0 && body.scrollHeight>limit)) continue;                  // 들어갔다
      // 넘쳤다 → ① 표면 행 단위로 잘라 이 장을 채우고 남은 행은 다음 장으로
      var rest=(nd.nodeType===1&&nd.tagName==='TABLE')?_splitTableToFit(nd,body,limit):null;
      if(rest){ queue.unshift(rest); }
      else if(body.childNodes.length>1){ body.removeChild(nd); queue.unshift(nd); }   // ② 통째로 다음 장
      else if(!queue.length){ continue; }                                  // ③ 혼자서도 안 들어감(마지막) → 그 장에 두고 넘침 표시
      no++; page=_a4Page(no); ed.appendChild(page); pages.push(page);      // 다음 장 준비
      body=page.querySelector('.a4b'); limit=body.clientHeight;
    }
    /* 안전장치(guard)에 걸려 멈췄는데 남은 마디가 있으면 **버리지 않는다**.
       종전에는 그대로 사라져, 긴 서식의 뒷부분이 말없이 없어질 수 있었다.
       마지막 장에 붙여 두면 넘침 배지가 떠서 사람이 [다시 나누기]로 처리할 수 있다 —
       조판이 덜 되는 것이 글이 사라지는 것보다 낫다. */
    if(queue.length){
      queue.forEach(function(nd){ body.appendChild(nd); });
      queue.length=0;
    }
    // 내용이 하나도 안 담긴 빈 장은 버린다(앞 장이 꽉 차서 만들어진 뒤 남은 게 없을 때)
    var last=pages[pages.length-1], lb=last&&last.querySelector('.a4b');
    if(lb && !lb.childNodes.length && pages.length>1){ last.remove(); pages.pop(); no--; }
  });
  // 총 쪽수 표기 + 넘침 검사
  pages.forEach(function(p,i){
    var f=p.querySelector('.a4f'); if(f) f.textContent='- '+(i+1)+' / '+pages.length+' -';
  });
  markA4Overflow();
  return pages.length;
}
/* 편집으로 내용이 장을 넘쳤는지 표시 */
function markA4Overflow(){
  var ed=$('doced'); if(!ed) return 0; var n=0;
  Array.prototype.forEach.call(ed.querySelectorAll('.a4'),function(p){
    var b=p.querySelector('.a4b'); if(!b) return;
    var old=p.querySelector('.a4of'); if(old) old.remove();
    var over=b.scrollHeight>b.clientHeight+2;
    p.classList.toggle('of',over);
    if(over){ n++;
      var t=document.createElement('div'); t.className='a4of'; t.setAttribute('contenteditable','false');
      t.textContent='이 쪽을 넘칩니다 — [다시 나누기]'; p.appendChild(t); }
  });
  var w=$('a4Warn'); if(w) w.style.display=n?'':'none';
  return n;
}
function repaginateDoc(){
  var ed=$('doced'); if(!ed) return;
  var parts=[]; Array.prototype.forEach.call(ed.querySelectorAll('.a4 .a4b'),function(b){ parts.push(b.innerHTML); });
  paginateDoc(parts.join(''));   // 쪽 경계를 없애고 처음부터 다시 나눔
  fitDocA4(); toast('쪽을 다시 나눴습니다');
}
/* 미리보기 배율 — 패널 폭에 맞춰 A4 한 장이 가로로 다 들어오게. S.docZoom='fit'|1 */
function fitDocA4(){
  var w=$('docwrap'), ed=$('doced'), st=$('docstage'); if(!w||!ed) return;
  var page=ed.querySelector('.a4'); if(!page) return;
  // 배율을 걷어낸 상태에서 실측(A4 210mm ≈ 794px) → 패널 폭에 맞는 배율 산출
  ed.style.transform='none';
  var pw=page.offsetWidth||794, ph=ed.scrollHeight||0;
  var avail=Math.max(80,w.clientWidth-28);
  var k=(S.docZoom===1)?1:Math.min(1,avail/pw);
  if(!(k>0.2)) k=0.2;
  ed._k=k;
  if(k!==1) ed.style.transform='scale('+k.toFixed(4)+')';
  if(st){                                  // 축소한 만큼만 자리를 차지하게(가로 스크롤 방지)
    st.style.height=Math.ceil(ph*k)+'px';
    st.style.overflow=(k===1?'visible':'hidden');
  }
  var z=$('docZoomLbl'); if(z) z.textContent=Math.round(k*100)+'%';
}
function toggleDocZoom(){ S.docZoom=(S.docZoom===1)?'fit':1; fitDocA4(); }

/* ── 원본 .hwp에서 변환한 법정서식(fund_forms.js: window.HWP_FORMS) ──
   03_과거자료 원본을 파싱해 문단·표 격자를 그대로 옮긴 템플릿. 라벨 옆 빈 칸에 기금 데이터를 채운다.
   구조가 원본과 동일하므로 "폴더 서식과 다르다" 문제가 없다. (정밀 인쇄는 여전히 엑셀/HWP 권장) */
/* 대표자 = 명부의 «이사장» 줄. 대표자 정보를 따로 두지 않는다 —
   두 곳에 두면 한쪽만 고쳐져 서식마다 다른 사람이 찍힌다. */
function _boss(f){
  var o=_officersOf(f).filter(function(x){ return /이사장/.test(x.role||''); })[0];
  return o||{ name:(f&&f.chairman)||'' };
}
/* 접수번호·접수일·처리기간은 «관청이 적는» 칸이다 — 우리가 채우면 안 된다.
   빈 채로 두는 것이 맞아서, 값 함수가 빈 문자열을 돌려준다(라벨을 아는 것과 채우는 것은 다르다). */
/* [라벨 정규식, 값 함수, «어느 칸 아래일 때만»(생략하면 어디서나)]
   ⚠ 세 번째가 없으면 같은 라벨이 다른 뜻으로 쓰인 서식에도 들어간다.
     실제로 그랬다 — 「주소」에 대표자 개인 주소를 넣었더니 등록면허세 신고서(납세자 주소)와
     임대차계약서(임대인·임차인 주소)에까지 들어갔다. 사람에 관한 값은 반드시 칸을 건다. */
/* 적는 자리가 «비어» 있지 않은 서식이 있다 — 지원신청서는 ＿＿＿＿ 로 줄을 그어 둔다.
   빈 칸만 찾으면 그런 자리는 영영 안 채워지고, 값이 라벨 칸에 잘못 붙는다. */
function _isBlankCell(t){ return !String(t||'').replace(/[＿_\-·∙ㆍ\s]/g,''); }
/* 옆 칸이 «또 다른 라벨»인지 — 라벨이면 적는 자리가 따로 없다는 뜻이다.
   값이 들어 있으면(이미 채워진 칸) 손대지 않아야 두 번 찍히지 않는다. */
function _isLabelCell(t){
  var s=String(t||'').replace(/\s+/g,' ').trim();
  if(!s||s.length>14) return false;
  for(var i=0;i<FORM_FILL.length;i++) if(FORM_FILL[i][0].test(s)) return true;
  return /^\(한자\)$|^구\s*분$|^비\s*고$|^계$/.test(s);
}
var FORM_FILL=[
  [/^명\s*칭$/, function(f){return f.name;}],
  [/^주사무소\s*소재지$/, function(f){return f.address;}],
  /* 「소재지」·「전화」는 서식마다 임자가 다르다 — 지원신청서에는 신청인 말고도
     대기업·도급업체와 수급업체 칸이 있어서, 안 걸면 그 칸에 기금 주소가 들어간다. */
  [/^소재지$/, function(f){return f.address;}, /신청인|기금법인|^$/],
  [/^전화번호$/, function(f){return f.phone;}],
  [/^전\s*화$/, function(f){return f.phone;}, /신청인/],
  [/^기금인가번호$/, function(f){return f.inka_no;}],
  [/^대표자$/, function(f){return _boss(f).name||f.chairman;}, /신청인/],
  [/^성명\(한글\)$/, function(f){return _boss(f).name||f.chairman;}, /대표자/],
  [/^생년월일$/, function(f){return _boss(f).birth||'';}, /대표자/],
  [/^주\s*소$/, function(f){return _boss(f).addr||'';}, /대표자/],
  [/^직\s*책$/, function(f){return _boss(f).title||(f.chairman?'이사장':'');}, /대표자/],
  [/^접수일$/, function(f){return '';}],          // 관청 몫
  [/^인가번호$/, function(f){return f.inka_no;}],
  [/^법인등록번호$/, function(f){return f.corp_reg_no;}],
  [/^고유번호$/, function(f){return f.tax_id_no;}],
  [/^사업자등록번호$/, function(f){return f.tax_id_no;}]
];
/* ── 설립준비위원회 위원 격자 ──
   라벨 다음 칸을 채우는 방식으로는 «반복 줄»을 못 채운다. 원본 격자가 이렇다:
     [위원회] [근로자측(3줄)] [성명(3줄)] ▢ [생년월일(3줄)] ▢ [직책(3줄)] ▢
              (둘째·셋째 줄은 ▢ 셋뿐)
   그래서 「근로자측/사용자측」 라벨을 만나면 그 줄부터 세 줄을 «명부 차례대로» 채운다. */
/* 복지기금협의회의 «위원»은 이사다. 감사는 위원이 아니라 따로 두는 기관인데,
   역할 글자에 「근로자측·사용자측」이 들어 있다는 이유로 위원 칸에 들어가고 있었다
   (근로자측: 이사 1명 + 감사 1명이 나란히 앉았다).

   ⚠ 이사장은 여기 못 넣는다. 이사장도 이사이므로 위원이 맞지만, 명부의 역할이
     그냥 「이사장」이라 노측인지 사측인지가 «자료에 없다». 한쪽에 밀어 넣으면
     서식이 그럴듯하게 틀린 채로 관청에 나간다 — 빈칸으로 두어 사람이 채우게 한다. */
/* 설립준비위원회 위원 — 임원 명부에서 «측»으로 갈라 읽는다.
   ⚠ 감사는 위원이 아니라 따로 두는 기관이다. 이사장은 명부의 역할이 그냥 「이사장」이라
     노측인지 사측인지가 «자료에 없다» — 빈칸으로 두어 사람이 채우게 한다.
   ⚠ 서식 격자가 세 줄이므로 세 명까지만 세운다. */
function _prepCommittee(f,side){
  return _officersOf(f).filter(function(o){
    var r=String(o.role||'');
    if(!/이사/.test(r)||/감사/.test(r)) return false;
    return side==='사용자측' ? /사용자/.test(r) : /근로자/.test(r);
  }).slice(0,3);
}
function fillCommittee(root,f){
  var sideOf=function(o){ var r=String(o.role||'');
    if(!/이사/.test(r)||/감사/.test(r)) return '';        // 감사는 위원이 아니다
    return /사용자/.test(r)?'사용자측':(/근로자/.test(r)?'근로자측':''); };
  var pick=function(side){ return _officersOf(f).filter(function(o){ return sideOf(o)===side; }); };
  var trs=[].slice.call(root.querySelectorAll('tr'));
  ['근로자측','사용자측'].forEach(function(side){
    var at=-1;
    for(var i=0;i<trs.length;i++){
      var t0=[].slice.call(trs[i].children).map(function(c){ return (c.textContent||'').replace(/\s/g,''); });
      if(t0.indexOf(side)>=0){ at=i; break; }
    }
    if(at<0) return;
    var list=pick(side);
    for(var k=0;k<3;k++){
      var tr=trs[at+k]; if(!tr) break;
      /* 이 줄은 위원 격자다 — 아래 라벨 채우기가 손대면 안 된다.
         「생년월일」·「직책」 라벨이 대표자란에도 있어, 표시가 없으면 서로 덮어쓴다. */
      tr.setAttribute('data-cm','1');
      var o=list[k]; if(!o) break;
      // 그 줄의 «빈 칸»만 골라 성명·생년월일·직책 차례로 넣는다
      var blanks=[].slice.call(tr.children).filter(function(c){ return !(c.textContent||'').trim(); });
      if(blanks.length<3) continue;
      var v=[o.name||'', o.birth||'', o.title||''];
      for(var j=0;j<3;j++) if(v[j]) blanks[j].textContent=v[j];
    }
  });
}
/* ══ 박혀 있는 «남의 값» 걷어내기 ══
   변환한 원본 .hwp 가 어느 기금이 실제로 낸 서류라, 금액·날짜·계좌번호가 그대로 남았다.
   그대로 인쇄하면 남의 숫자를 제출한다(지급신청서에는 남의 «계좌번호»까지 있었다).

   ⚠ 다 지우면 서식이 망가진다 — 이것들은 «서식의 일부»라 남긴다:
     법령 개정일 <개정 2016.1.19.> · 용지 규격 210㎜×297㎜ ·
     인센티브 요율 구간 「1,000만원 미만」 · 조문 번호.
   지운 자리는 ＿＿＿ 로 두어, 자동 채움이 채울 수 있는 «빈 칸»이 되게 한다. */
var BAKE_BLANK='＿＿＿＿＿';
function _bakeText(s){
  // 날짜 — 앞에 「개정·시행」이 붙으면 법령 날짜다(서식의 일부)
  s=s.replace(/(.{0,10})((?:19|20)\d{2}\s*[.년]\s*\d{1,2}\s*[.월]\s*\d{1,2}\s*[.일]?)/g,
    function(m,pre,dt){ return /개정|시행|신설|제정|전문개정/.test(pre) ? m : pre+BAKE_BLANK; });
  // 「20.03.30」처럼 두 자리 해로 적은 날짜
  s=s.replace(/(^|[^\d.])(\d{2}\.\d{2}\.\d{2})(?![\d.])/g, function(m,pre){ return pre+BAKE_BLANK; });
  /* 해만 남은 날짜 — 「2020년 월 일」·「2020년도 사업계획(안)」처럼 월·일이 비어 있으면
     위 규칙(해·달·날이 다 있어야 한다)에 안 걸려 신청인의 «해»가 그대로 남았다.
     인감위임장·전대동의서·회의록 등 열한 곳이 그랬다.
     ⚠ 법령의 해는 둔다 — 「법률 제○○호(2016년)」처럼 서식의 일부인 것이 있다. */
  s=s.replace(/(.{0,12})((?:19|20)\d{2})(\s*년도?)/g,
    function(m,pre,yr,suf){
      return /개정|시행|신설|제정|법률|대통령령|고용노동부령/.test(pre) ? m : pre+BAKE_BLANK+suf; });
  /* 「2019.」처럼 마침표만 찍고 홀로 선 해 — 협의회 회의록의 의제 연도가 그랬다.
     뒤에 달·날이 «안» 붙는 것만 본다. 법령 날짜(신설 2019. 2. 12.)는 뒤에 달이 붙어 안 걸리고,
     그래도 앞말로 한 번 더 거른다. */
  s=s.replace(/(.{0,14})((?:19|20)\d{2})\.(?!\s*\d)/g,
    function(m,pre){
      return /개정|시행|신설|제정|법률|대통령령|고용노동부령/.test(pre) ? m : pre+BAKE_BLANK+'.'; });
  // 금액 — 뒤에 「미만·이상」이 붙으면 요율 구간이다(서식의 일부)
  s=s.replace(/([0-9]{1,3}(?:,[0-9]{3})+|[0-9]+(?=\s*(?:천원|만원)))(\s*(?:천원|만원|원)?)(\s*(?:미만|이상))?/g,
    function(m,num,unit,cmp){
      if(cmp) return m;                                   // 1,000만원 미만
      if(/㎜|㎡|g\//.test(unit||'')) return m;
      return BAKE_BLANK+(unit||'');
    });
  /* 한글로 적은 금액 — 위 규칙은 숫자만 보므로 「오백만원정」·「일천만원」이 그대로 남았다.
     확인서에 남의 금액이 한글로 인쇄되고 있었다(출연확인서 두 종·사업계획서).
     ⚠ 「사원」·「직원」은 안 걸린다 — 원 앞에 백·천·만·억이 있어야 금액으로 본다. */
  s=s.replace(/[일이삼사오육칠팔구십][가-힣]{0,4}[백천만억]원(?:정)?(\s*(?:미만|이상))?/g,
    function(m,cmp){ return cmp?m:BAKE_BLANK; });

  s=s.replace(/[0-9]+(\s*)명(\s*(?:미만|이상))?/g,
    function(m,sp,cmp){ return cmp?m:BAKE_BLANK+(sp||'')+'명'; });
