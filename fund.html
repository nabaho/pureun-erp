}
/* 「1,000만원 미만」처럼 «구간»이 든 표는 요율표다. 거기 적힌 금액은 규정이 정한 것이지
   남이 써 넣은 값이 아니다 — 제도도입 비용 청구내역서의 수당 200·300·400·470만원이 그렇다.
   구간은 윗줄, 금액은 아랫줄에 따로 있어서 「금액 바로 뒤에 미만·이상」 규칙으로는 못 잡는다.
   다만 「청구액」처럼 «스스로 적는» 줄은 바로 아래 있어도 비운다.
   ⚠ 표 «전체»에 구간이 있는지로 보면 안 된다 — 서식 한 장이 큰 표 하나인 경우가 있어,
     저 아래 남의 실적(수행일·청구액)까지 통째로 살아난다. «바로 위 두 줄»만 본다. */
function _isRateRow(tr){
  /* ⚠ 「미만·이상」이라는 «낱말»만 보면 안 된다 — 지원신청서의
       「둘 이상의 기업이 공동근로복지기금에 출연」 때문에 그 아래 금액 줄이 요율표로 보여,
       남의 금액 10,000,000원이 걷어내기를 통째로 비껴갔다.
       구간은 «금액 뒤에» 붙는다 — 앞에 숫자가 있어야 구간으로 본다. */
  var SPAN=/[0-9][0-9,\s]*(?:만원|천원|원)?\s*(?:미만|이상)/;
  var up=tr.previousElementSibling, near=false;
  for(var k=0;k<2&&up;k++,up=up.previousElementSibling)
    if(SPAN.test(up.textContent||'')){ near=true; break; }
  if(!near) return false;
  var lbl=String(tr.children[0]?tr.children[0].textContent:'').replace(/\s/g,'');
  return !/청구|신청|지급|수령|합계|^계$/.test(lbl);
}
function stripBaked(root){
  /* 요율표 줄에 표를 붙여 둔다 — 아래 두 훑기가 다 건너뛰게 */
  [].slice.call(root.querySelectorAll('tr')).forEach(function(tr){
    if(_isRateRow(tr)) tr.setAttribute('data-rate','1');
  });
  var walk=function(el){
    for(var i=0;i<el.childNodes.length;i++){
      var n=el.childNodes[i];
      if(n.nodeType===3){                                  // 글자 마디만 손댄다 — 표 짜임새는 안 건드린다
        if(el.getAttribute&&el.getAttribute('data-kept')) continue;   // 우리가 채운 칸
        if(el.closest&&el.closest('[data-rate]')) continue;           // 규정이 정한 요율
        var t=n.nodeValue||'';
        if(/㎜|㎡|g\//.test(t)) continue;                   // 용지 규격
        var v=_bakeText(t);
        if(v!==t) n.nodeValue=v;
      } else if(n.nodeType===1) walk(n);
    }
  };
  walk(root);
  /* 칸이 온통 자리표시만 남았으면 아주 비운다 — 표에 ＿＿＿ 만 늘어서면 지저분하다.
     그리고 «숫자만 든 칸»도 비운다 — 사업계획서에는 쉼표 없는 예산 수치(56·560·△5,000)가
     칸마다 흩어져 있어, 글자 단위 걷어내기만으로는 남의 예산이 그대로 남는다.

     ⚠ 줄의 «첫 칸»은 건드리지 않는다 — 연번(1·2·3)이 거기 있고, 지우면 표가 무너진다. */
  var BARE=/^[△▲\-(]?[0-9＿][0-9,.＿]*%?\)?$/;
  [].slice.call(root.querySelectorAll('tr')).forEach(function(tr){
    if(tr.getAttribute('data-rate')){ tr.removeAttribute('data-rate'); return; }
    [].slice.call(tr.children).forEach(function(td,ci){
      /* 칸 안에 여러 줄이 든 곳이 있다(「가.이자수입 / 나.대부이자수입」).
         칸째로 보면 그런 칸이 통째로 빠지므로 «글자 마디»마다 본다. */
      if(td.getAttribute('data-kept')) return;            // 우리가 채운 칸은 그대로 둔다
      var kids=[];
      (function walk2(el){ for(var i=0;i<el.childNodes.length;i++){
        var n=el.childNodes[i];
        if(n.nodeType===3) kids.push(n); else if(n.nodeType===1) walk2(n); } })(td);
      kids.forEach(function(n){
        var s=String(n.nodeValue||'').replace(/\s/g,'');
        if(!s) return;
        if(!s.replace(/[＿]/g,'')){ n.nodeValue=''; return; }   // 자리표시만 남은 마디
        if(ci===0) return;                                     // 연번 자리는 안 건드린다
        if(BARE.test(s)) n.nodeValue='';                       // 숫자만 든 마디 — 남의 예산 수치
      });
    });
  });
}
/* ══ 협의회 위원 명부(등기용) ══ 임원 명부에서 측별로 채운다.
   서식이 근로자위원 2줄·사용자위원 2줄이라 명부 차례대로 넣는다. */
function fillRoster(root,f){

    return /사용자/.test(r)?'사용자측':(/근로자/.test(r)?'근로자측':''); };
  var pick={'근로자위원':_officersOf(f).filter(function(o){return sideOf(o)==='근로자측';}),

  var _b=_boss(f);

  });

/* 예산이 «하나라도» 적혔나 — 손익예산과 추정재무상태표가 같은 잣대를 써야 한다.
   따로 적어 두었더니 서로 어긋났다: 손익 쪽은 예비비를, 재무상태표 쪽은 그 밖의 수입과
   예비비를 빠뜨려, 예비비만 있는 계획은 손익만 비고 재무상태표는 차는 일이 생겼다. */
var BUDGET_KEYS=['rev_contrib','rev_interest','rev_etc','exp_purpose','exp_admin','exp_etc'];
function _hasBudget(fid,yr){
  var b=budgetOf(fid,yr)||{};

/* 익년도 추정의 «바탕»이 되는 올해 기말. 확정 결산 스냅샷에서 온다.

   ⚠ 증권·준비금1·2 는 2026-08-30 부터 담는다 — 그 전 스냅샷에는 없다.
     없는 것을 0 으로 메우면 «준비금이 0인 기금»으로 셈해 표가 통째로 틀린다.
     그래서 하나라도 없으면 «안 채운다». 빈 칸이 틀린 숫자보다 낫다. */
function _bizFinOf(){
  var c=(typeof S!=='undefined'&&S.f15Close)||null;
  var f=c&&c.fin; if(!f) return null;
  var assets=(f.assets!=null)?f.assets:f.totalAssets;
  if(assets==null) return null;
  if(f.res1==null||f.res2==null||f.secu==null) return null;   // 옛 스냅샷
  return { cash:num(f.cash)||0, savings:num(f.savings)||0, secu:num(f.secu)||0,
           loan:num(f.loan)||0, otherAsset:num(f.otherAsset)||0,
           res1:num(f.res1)||0, res2:num(f.res2)||0,
           basic:num(f.basic)||0, retained:num(f.retained)||0,
           liab:num(f.liab)||0, totalAssets:num(assets)||0 };
}
/* ══ 사업계획서 — 손익예산 열 단계 ══
   서식의 열 단계는 손익계산서와 «같은 짜임새»다. 그래서 예산만 있으면 나머지는 셈으로 나온다:
     3=1-2 · 5=3-4 · 8=5+6-7 · 10=8-9
   기금은 남는 이익을 준비금으로 돌려 «당기순이익 0» 으로 맞추므로,
     7.사업외비용 = 이자수입(준비금1 전입)
     6.사업외수익 = 준비금 환입 = 비용을 메우는 만큼
   ⚠ 이것은 «계획»이다. 실적(computeFin)을 넣으면 안 된다 —
     내년 계획 자리에 올해 실적이 들어가면 그것이 곧 거짓이다.
     예산이 비어 있으면 «비운 채로» 둔다.

   회계 가름은 결산서 워크북에 적힌 그대로다:
     기금관리 회계 = 기본재산·정기예금·증권·대부금·이자수익
     목적사업 회계 = 현금·준비금·이월잉여금·목적사업비·일반관리비 */
function bizplanRows(f,yr){
  var b=budgetOf(S.fundId,yr)||{};
  var g=function(k){ return num(b[k])||0; };
  var interest=g('rev_interest'), etcRev=g('rev_etc');
  var pur=g('exp_purpose'), adm=g('exp_admin'), spare=g('exp_etc');   // 그 밖의 비용 = 예비비
  if(!_hasBudget(S.fundId,yr)) return null;          // 예산이 없으면 채우지 않는다
  /* ── 목적사업 회계 ── 수익은 기타뿐이고, 모자란 만큼 준비금에서 꺼내 쓴다
     ── 기금관리 회계 ── 이자를 벌어 그만큼 준비금에 넣는다
     둘 다 «따로» 0 으로 맞물린다(원본 제출본이 그렇게 짜여 있다). */
  var pGross=etcRev-pur, pOp=pGross-adm;
  var pNonopExp=spare, pNonopRev=spare-pOp;         // 5+6-7=0 이 되게
  var fNonopExp=interest;                            // 준비금1 전입 = 이자
  var R=[], add=function(lbl,p,fu){ R.push([lbl,p,fu]); };
  add('1.사업수익',        etcRev,   interest);
  add('가.이자수입',       0,        interest);
  add('2.고유목적사업비용', pur,      0);
  add('3.사업총이익',      pGross,   interest);
  add('4.일반관리비',      adm,      0);
  add('5.사업이익',        pOp,      interest);
  add('6.사업외수익',      pNonopRev, 0);
  add('가.고유목적사업준비금1전입수입', interest, 0);
  add('나.고유목적사업준비금2전입수입', pNonopRev-interest, 0);
  add('7.사업외비용',      pNonopExp, fNonopExp);
  add('8.법인세차감전순이익', pOp+pNonopRev-pNonopExp, interest-fNonopExp);

}
/* ══ 추정재무상태표 — 올해 기말에 내년 계획을 얹는다 ══

   안 빼면 예비비만큼 대차가 어긋난다).

   ⚠ 「목적사업회계 / 기금관리회계」 칸은 채우지 않는다.
     어느 계정을 어느 쪽으로 보낼지는 기금마다 다르고(제출본도 한쪽을 비워 두었다),
     칸마다 따로 대차를 맞출 수 있는 규칙이 없다. 「계」만 적는다 — 그건 다툼이 없다. */
function bizplanBS(f,yr,fin){
  var b=budgetOf(S.fundId,yr)||{};
  var g=function(k){ return num(b[k])||0; };
  var contrib=g('rev_contrib'), interest=g('rev_interest');
  var pur=g('exp_purpose'), adm=g('exp_admin'), spare=g('exp_etc');
  if(!_hasBudget(S.fundId,yr)) return null;
  var setup=Math.round(contrib*_reserveRate(S.fundId));   // 출연금의 정해진 몫을 준비금2로
  var back2=pur+adm+spare-interest;                       // 준비금2 환입(손익예산과 같은 셈)
  var cash=fin.cash+contrib+interest-pur-adm-spare;

    res1:fin.res1, res2:res2, basic:basic, retained:fin.retained,
    curLiab:fin.liab-fin.res1-fin.res2,
    assets:cash+fin.savings+fin.secu+fin.loan+fin.otherAsset
  };
}
/* 추정재무상태표 줄 — 서식의 라벨 그대로 */

function fillBizplanDoc(root,f){

    var cs=[].slice.call(tr.children); if(cs.length<4) return;
    var lab=(cs[0].textContent||'').replace(/\s/g,'');
    for(var i=0;i<R.length;i++){
      if(lab.indexOf(R[i][0].replace(/\s/g,''))!==0) continue;
      /* 칸 차례: 목적사업회계 | 기금관리회계 | 계 */
      var blanks=cs.slice(1).filter(function(c){ return !(c.textContent||'').trim(); });
      if(blanks.length<3) return;
      blanks[0].textContent=W(R[i][1]);
      blanks[1].textContent=W(R[i][2]);
      blanks[2].textContent=W(R[i][1]+R[i][2]);
      return;
    }
  });
  /* 추정재무상태표 — «계» 칸만 적는다(회계 가름은 기금마다 다르다).
     올해 기말은 «확정 결산 스냅샷»에서 온다. 없으면 추정할 바탕이 없으니 안 채운다 —
     0 을 바탕으로 삼으면 «올해 재산이 0» 이라 적는 셈이다. */
  /* ⚠ 확정 스냅샷은 자산총계를 «assets» 로 담는다(totalAssets 가 아니다).
       그리고 옛 스냅샷에는 증권·준비금1·2 가 아예 없다 — 그것 없이 추정하면
       «준비금이 0인 기금»으로 셈해 엉뚱한 표가 나온다. 그럴 땐 안 채운다. */
  var fin=_bizFinOf();
  if(!fin) return;
  var P=bizplanBS(f,yr,fin);
  if(!P) return;
  [].slice.call(root.querySelectorAll('tr')).forEach(function(tr){
    var cs=[].slice.call(tr.children); if(cs.length<4) return;
    var lab=(cs[0].textContent||'').replace(/\s/g,'');
    for(var i=0;i<BIZ_BS_ROWS.length;i++){
      if(lab.indexOf(BIZ_BS_ROWS[i][0])!==0) continue;
      var blanks=cs.slice(1).filter(function(c){ return !(c.textContent||'').trim(); });
      if(blanks.length<3) return;
      blanks[2].textContent=W(BIZ_BS_ROWS[i][1](P));   // 셋째 칸이 「계」다
      return;
    }
  });
  /* 계획이 재원보다 크면 추정 잔액이 음수가 된다 — 그것을 조용히 인쇄하면 안 된다.
     서식이 잘못된 것이 아니라 «계획이 안 되는 것»이므로, 그렇다고 적어 준다. */
  var neg=[];
  if(P.cash<0) neg.push('현금');
  if(P.res2<0) neg.push('고유목적사업준비금2');
  if(P.basic<0) neg.push('기본재산');
  if(neg.length){
    var w=document.createElement('p');
    w.className='note';
    w.textContent='※ 추정 잔액이 음수입니다('+neg.join('·')+'). 계획한 지출이 재원보다 큽니다 —'
      +' 예산을 고치거나 출연을 늘려야 합니다.';
    root.insertBefore(w,root.firstChild);
  }
}
/* ══ 공동근로복지기금 지원사업 착안사항 자율 체크리스트 ══
   부정지원 예방을 위해 신청 기금이 «스스로» 확인해 내는 서류다.

   ⚠ 변환본에 남의 답이 통째로 박혀 있다. 걷어내기는 숫자만 지우므로
     업종 「서비스」·근로자수 「65명」·지원내용 「생활원조, 체육문화활동, 기타복리후생」이
     남았고, 무엇보다 착안사항 여덟 칸에 「해당·해당·해당·해당·비해당·비해당·비해당·해당」이
     그대로 남았다. 이것은 특수관계인 여부·기업 분할 여부에 대한 **남의 판단**이다 —
     그대로 인쇄하면 확인하지 않은 사실을 확인했다고 공단에 내게 된다.

   ⚠ 착안사항은 앱이 채우지 않는다. 서류를 보고 «사람이» 판단할 일이라,
     미리 찍어 두면 확인 없이 그대로 나간다. 비워서 고르게 한다.
   ⚠ 업종도 채우지 않는다 — 기금 자료에 없는 칸이다. 없는 것을 지어내지 않는다. */
function fillChecklistDoc(root,f,sites){
  var R=_docRok();
  var yd=((f.years||{})[S.year]||{}).subsidy||{};
  var act=(sites||(R&&R.sites)||[]).filter(function(x){ return x.status!=='closed'; });
  var flat=function(t){ return String(t||'').replace(/\s/g,''); };
  var rows=[].slice.call(root.querySelectorAll('tr'));
  /* 머리글 줄을 찾아 «그 다음» 줄을 준다.
     ⚠ «첫 칸»으로만 찾는다. 아무 칸에서나 찾으면 현황 머리글(지역·공동기금법인명·…)이
       「공동기금법인명」으로도 걸려, 착안사항을 비우려다 현황 줄을 통째로 지운다. */
  var rowAfter=function(head){
    for(var i=0;i<rows.length;i++){
      var c=[].slice.call(rows[i].children).map(function(x){ return flat(x.textContent); });
      if(c[0]===head) return {hd:c, tr:rows[i+1]||null};
    }
    return null;
  };

  /* ── ○ 지원신청 현황 ── 머리글 이름으로 칸을 찾는다(자리 번호로 세면 표가 바뀔 때 어긋난다) */
  var cur=rowAfter('지역');
  if(cur&&cur.tr){
    var emp=act.reduce(function(t,x){ return t+(num(x.company_size)||0); },0);
    var con=R?act.reduce(function(t,x){ return t+(num((R.sy[x._id]||{}).contrib)||0); },0):0;
    /* 지원내용은 목적사업의 «갈래»다. 대부사업은 복지사업이 아니라 뺀다. */
    var cat=R?(R.welf||[]).map(function(w){ return String(w.category||''); })
      .filter(function(c){ return c&&c!=='대부사업'; }):[];
    var uniq=cat.filter(function(v,i){ return cat.indexOf(v)===i; });
    var won=function(v){ return v?Number(v).toLocaleString():''; };
    var VAL={
      '지역':          f.region||'',
      '공동기금법인명': f.name||'',
      '공동기금참여회사': act.map(function(x){ return x.name; }).filter(Boolean).join(', '),
      '기금인가번호(인가일자)': f.inka_no?(f.inka_no+(f.inka_date?' ('+_dotDate(f.inka_date)+')':'')):'',
      '업종':          '',                                   // 기금 자료에 없다 — 사람이 적는다
      '참여회사근로자수': emp?emp+'명':'',
      '기금규모(천원)':  (R&&R.R)?won(Math.round(R.R.bfEnd/1000)):'',
      '지원내용':       uniq.join(', '),
      '출연금액(원)':   won(con),
      '지원신청금액(원)': won(num(yd.request_amount))
    };
    var tds=[].slice.call(cur.tr.children);
    cur.hd.forEach(function(h,i){
      if(!(h in VAL)||!tds[i]) return;
      tds[i].textContent=VAL[h];                            // 빈 값이면 «비운다» — 남의 값을 남기지 않는다
      tds[i].setAttribute('data-kept','1');
    });
  }

  /* ── ○ 착안사항 체크리스트 ── 첫 칸(법인명)만 두고 판단 칸은 모두 비운다 */
  var chk=rowAfter('공동기금법인명');
  while(chk&&chk.tr){
    var cs=[].slice.call(chk.tr.children);
    /* 「해당/비해당」이 든 줄만 손댄다 — 제출서류 줄(이미 비어 있음)은 건드릴 것이 없다 */
    for(var j=1;j<cs.length;j++){ cs[j].textContent=''; cs[j].setAttribute('data-kept','1'); }
    if(cs[0]){ cs[0].textContent=f.name||''; cs[0].setAttribute('data-kept','1'); }
    /* 같은 머리글이 두 번 나온다(제출서류·착안사항) — 뒤엣것도 처리하려고 이어서 찾는다 */
    var at=rows.indexOf(chk.tr);
    rows=rows.slice(at+1);
    chk=rowAfter('공동기금법인명');
  }
}
/* ══ 기금 출연 확인서 ══
   출연한 «사업장이» 「우리가 이 기금에 얼마를 냈다」고 확인해 주는 서류다.
   그래서 사업장 수만큼 장이 나온다 — 한 장에 몰아 적는 서류가 아니다.

   ⚠ 변환본에 남의 값이 박혀 있다 — 「오백만원(￦5,000,000)」·「2020. 05. 08.」.
     숫자 5,000,000 은 걷어내기가 지우지만 «한글 금액 오백만원»은 한글이라 안 지워졌다.
     그대로 인쇄하면 남의 금액을 확인서로 내게 된다. 여기서 통째로 다시 짠다.

   금액은 참여사업장 › 연도별 기록의 그 해 출연금(sy[사업장].contrib)이다 —
   별지15호·체크리스트와 같은 값이라 서류끼리 어긋나지 않는다. */
function fillContribDoc(root,f,sites){
  /* ⚠ 장부를 못 읽었다고 «그냥 돌아가면» 안 된다 — 원본에 박힌 남의 금액
     「오백만원」이 그대로 남아 인쇄된다(한글이라 걷어내기가 못 지운다).
     읽었든 못 읽었든 이 서식은 «항상» 다시 짠다. 채울 것이 없으면 빈 확인서다. */
  var R=_docRok();
  var list=!R?[]:(sites||R.sites||[]).filter(function(x){ return x.status!=='closed'; })
    .map(function(x){ return {name:x.name||'', ceo:x.ceo||'',
                              amt:num((R.sy[x._id]||{}).contrib)||0}; })
    .filter(function(x){ return x.amt>0; });
  var one=function(c){
    var d=document.createElement('p');
    d.setAttribute('data-kept','1');                 // 다시 짠 장이다 — 걷어내기가 손대면 안 된다
    d.innerHTML='기 금 출 연 확 인 서<br>금&nbsp; 액 : &nbsp;'
      +(c?esc(korWon(c.amt))+'원정(￦'+Number(c.amt).toLocaleString()+')':BAKE_BLANK)
      +'<br>상기 금액은 '+esc(f.name||'')+'법인에 위 금액을 출연하였음.'
      +'<br>'+BAKE_BLANK
      +'<br>'+(c&&c.name?esc(c.name):BAKE_BLANK)
      +' 대표 '+(c&&c.ceo?esc(c.ceo):BAKE_BLANK)+' (인)';
    return d;
  };
  /* 출연한 곳이 없으면 «지어내지 않는다» — 빈 확인서 한 장과 까닭을 남긴다.
     남의 값이 박힌 원본을 그냥 두는 것보다 낫다. */
  var made=list.length?list.map(one):[one(null)];
  while(root.firstChild) root.removeChild(root.firstChild);
  if(!list.length){
    var w=document.createElement('p'); w.className='note';
    w.textContent=R
      ? ('※ '+S.year+'년에 출연한 사업장이 없어 금액을 채우지 못했습니다 —'
         +' 참여사업장 › 연도별 기록에 그 해 출연금을 넣으면 사업장마다 한 장씩 만들어집니다.')
      : '※ 회계·결산에서 숫자를 아직 못 읽었습니다 — 잠시 뒤 다시 열어 주세요.'
         +' (원본에 박혀 있던 남의 금액은 지우고 빈 확인서를 둔 것입니다.)';
    root.appendChild(w);
  }
  made.forEach(function(n){ root.appendChild(n); });
}
/* ══ 지원신청서(별지 제1호의2) ══
   ⚠ 이 변환본에는 «남의 실제 값»이 박혀 있다 — 원본 .hwp 가 어느 기금이 실제로 낸 것이라
     금액 10,000,000원·신청일 2020년 05월 13일·복지사업 종류 체크가 그대로 딸려 왔다.
     그대로 인쇄하면 남의 숫자를 제출하게 된다. 우리 자료로 바꾸거나, 모르면 «비운다».
     비어 있으면 사람이 채운다 — 남의 숫자는 채운 줄 알고 그냥 낸다. */
function fillSubsidyDoc(root,f){
  var yr=(typeof S!=='undefined'&&S.year)||new Date().getFullYear();
  var su=((f.years||{})[yr]||{}).subsidy||{};
  var won=function(v){ var n=num(v); return (n===''||n==null||!n)?'':Number(n).toLocaleString()+'원'; };
  var tds=[].slice.call(root.querySelectorAll('td'));
  /* 체크 지우기는 «글자 하나 바꾸기»라 안에 태그가 있어도 안전하다 —
     칸 안에 <br> 이 든 곳이 있어서, 글자만 든 칸만 보면 그 줄이 통째로 빠진다. */
  tds.forEach(function(td){
    var t0=(td.textContent||'').replace(/\s+/g,' ');
    if(t0.indexOf('■')<0 || /공동근로복지기금에\s*출연/.test(t0)) return;
    td.innerHTML=td.innerHTML.replace(/■/g,'□');
  });
  /* 신청일이 어느 칸인지를 «자리»로 먼저 잡아 둔다.
     ⚠ 예전에는 박힌 날짜(2020년 05월 13일)를 값으로 찾아 바꿨다. 원본에서 남의 날짜를
       지운 뒤로는 그 칸이 그냥 빈칸이라 값으로는 못 찾는다 — 그러면 신청일이 통째로
       비어 나간다(실제로 그랬다). 「…신청합니다.」 «바로 다음 칸»이 신청일이다. */
  var dateAt=-1;
  for(var q=0;q<tds.length-1;q++)
    if(/신청합니다\.?\s*$/.test((tds[q].textContent||'').replace(/\s+/g,' '))){ dateAt=q+1; break; }
  tds.forEach(function(td,i){
    if(td.children.length) return;
    var t=(td.textContent||'').replace(/\s+/g,' ').trim();
    if(i===dateAt){
      var dn=new Date();
      td.textContent=dn.getFullYear()+'년 '+(dn.getMonth()+1)+'월 '+dn.getDate()+'일';
      td.setAttribute('data-kept','1');
      return;
    }
    /* 금액 — 앞 칸의 이름을 보고 무엇인지 가린다.
       ⚠ 빈칸(＿＿＿)도 알아본다. 원본에서 남의 값을 지운 뒤로 이 칸은 「＿＿＿원」이라
         숫자만 찾으면 못 잡는다 — 그러면 지원신청금액이 빈 채로 나간다. */
    if(/^[0-9,＿_]+\s*원$/.test(t)){
      var lab=(i>0?(tds[i-1].textContent||''):'').replace(/\s/g,'');
      td.textContent=/지원신청/.test(lab) ? won(su.request_amount) : '';
      td.setAttribute('data-kept','1');            // 걷어내기가 도로 지우지 않게
      return;
    }
    /* 신청일 — 오늘로. 여기도 빈칸을 알아봐야 한다(원본에서 남의 날짜를 지웠다).
       걷어내기는 「2020년 05월 13일」을 「＿＿＿＿＿일」로 만든다 — 끝의 「일」이 남는다. */
    if(/^(?:20\d{2}\s*년\s*\d{1,2}\s*월\s*\d{1,2}|[＿_]+)\s*일$/.test(t)){
      var n=new Date();
      td.textContent=n.getFullYear()+'년 '+(n.getMonth()+1)+'월 '+n.getDate()+'일';
      td.setAttribute('data-kept','1');
      return;
    }
    /* 체크 — 기금마다 다른 것은 지운다(복지사업 종류·지원받은 사실).
       「둘 이상의 기업이 공동근로복지기금에 출연」은 공동기금이면 늘 그러하므로 그대로 둔다. */
    /* 서명란은 「＿＿＿＿ (서명 또는 인)」 한 칸이라 빈 칸으로 안 보인다 —
       줄 자리에만 이름을 넣고 «(서명 또는 인)»은 그대로 둔다. */
    if(/^[＿_\s]+\(서명\s*또는\s*인\)$/.test(t)){
      var nm=_boss(f).name||f.chairman;
      if(nm){ td.textContent=nm+' (서명 또는 인)'; td.setAttribute('data-kept','1'); }
    }
  });
}
function hwpFormHTML(kind,f,sites){
  var ftype=(f.fund_type==='사내')?'사내':'공동';
  var key=(kind==='charter'&&ftype==='사내')?'charter_sane':kind;   // 정관은 공동/사내 원본이 다름
  var T=(window.HWP_FORMS||{})[key]; if(!T) return null;
  var html=String(T).replace(/\{\{FUND\}\}/g, esc(f.name||'＿＿＿＿＿＿＿＿'));
  // 사내/공동 체크박스 전환 (원본은 공동에 [V])
  if(ftype==='사내') html=html.replace(/\[ \] 사내근로복지기금법인/g,'[V] 사내근로복지기금법인')
                              .replace(/\[V\] 공동근로복지기금법인/g,'[ ] 공동근로복지기금법인');
  var d=document.createElement('div'); d.innerHTML=html;
  /* 남의 값을 «가장 먼저» 걷어낸다 — 걷어낸 자리가 곧 채울 자리가 된다 */
  /* ⚠ 차례가 중요하다. 지원신청서는 «박힌 값을 우리 값으로 바꾸는» 방식이라
       걷어내기보다 «먼저» 돌아야 한다. 나중에 돌리면 이미 밑줄로 바뀐 뒤라
       바꿀 것을 못 찾고, 금액·신청일이 통째로 비었다(실제로 그랬다).
       바꾼 칸에는 표를 남겨, 뒤이은 걷어내기가 도로 지우지 않게 한다. */
  if(kind==='subsidy') fillSubsidyDoc(d,f);

function _fyRange(f){

/* ── 정렬 도구 ──
   한글에서 옮겨온 서식은 원본의 탭·자간으로 칸을 맞춘 것이 많아 변환 과정에서 정렬이 풀린다.
   자동 보정(_docTypeset)으로 대부분 살아나지만, 남는 줄은 커서를 놓고 이 버튼으로 맞춘다. */
function docAlignBar(){
  var b=function(cmd,ico,tip){ return '<button onclick="docAlign(\''+cmd+'\')" style="padding:2px 7px;font-size:11px" title="'+tip+'">'+ico+'</button>'; };
  return '<span class="row" style="gap:2px;display:inline-flex">'
    +b('justifyLeft','⇤','왼쪽 정렬')+b('justifyCenter','↔','가운데 정렬')+b('justifyRight','⇥','오른쪽 정렬')
    +b('outdent','◀','내어쓰기')+b('indent','▶','들여쓰기')+'</span>';
}
function docAlign(cmd){
  var ed=$('doced'); if(!ed) return;
  var sel=window.getSelection();
  if(!sel||!sel.rangeCount||!ed.contains(sel.anchorNode)){ toast('문서에서 정렬할 줄을 먼저 클릭하세요','warn'); return; }
  ed.focus();
  try{
    document.execCommand('styleWithCSS',false,true);   // <font>·<blockquote> 대신 style로 — 저장·인쇄에서 그대로 살아난다
    document.execCommand(cmd,false,null); markDirty();
  }catch(e){ toast('정렬 적용 실패','err'); }
}

// 저장된 서식 HTML 살균 — 스크립트·이벤트핸들러·위험 URL 제거(저장형 XSS 차단)
function sanitizeDocHTML(html){
  var s=String(html||'');
  s=s.replace(/<style[\s\S]*?<\/style>/gi,'')          // 전역 style 유출 차단
     .replace(/<script[\s\S]*?<\/script>/gi,'')
     .replace(/<\/?(iframe|object|embed|link|meta|form|base)\b[^>]*>/gi,'');
  var box=document.createElement('div'); box.innerHTML=s;
  var all=box.querySelectorAll('*');
  for(var i=0;i<all.length;i++){ var el=all[i];
    for(var j=el.attributes.length-1;j>=0;j--){ var a=el.attributes[j], n=a.name.toLowerCase(), v=String(a.value||'');
      if(n.indexOf('on')===0) el.removeAttribute(a.name);                                  // onerror/onclick 등
      else if((n==='href'||n==='src'||n==='xlink:href')&&/^\s*(javascript|data(?!:image\/(png|jpe?g|gif|webp|svg\+xml);)|vbscript):/i.test(v)) el.removeAttribute(a.name);
      else if(n==='style'&&/expression\s*\(|javascript:/i.test(v)) el.removeAttribute(a.name);
    }
  }
  _docTypeset(box);            // 한글 원문 정렬(공백·들여쓰기) 살리기
  return box.innerHTML;
}
/* ── 한글 문서 정렬 살리기 ──
   HWP에서 옮겨온 글은 공백·탭으로 칸을 맞춰 놓는데, HTML은 연속 공백을 한 칸으로 합쳐서
   전부 왼쪽으로 몰려 보인다. ① 연속 공백·탭을 그대로 유지(&nbsp;)하고
   ② 「1. 」·「○ 」처럼 표식으로 시작하는 줄은 되돌아가는 줄까지 표식 뒤에 맞춘다(내어쓰기).
   여러 줄이 <br>로 묶인 단락은 손대지 않는다 — 둘째 줄부터 어긋나기 때문. */
var DG_MARK=/^\s*(?:[○◦ㆍ·▫□■▶※]|[-–]\s|[0-9]{1,2}[.)]|[가-힣][.)]|[ⅠⅡⅢⅣⅤⅥ][.)]|[①-⑳])\s*\S/;
var DG_BULLET=/^\s*(?:[○◦ㆍ·▫□■▶]|[-–]\s)/;
/* ══════════ 서식 A4 조판 ══════════
   .hwp에서 옮긴 서식(fund_forms.js)은 줄이 <br>로 뭉쳐 있거나 문단만 나뉘어 있어
   제목·날짜·서명·수신이 전부 왼쪽으로 붙는다. 줄의 성격을 가려 관보 서식처럼
   가운데·오른쪽·2열로 앉히고, 정관은 조–항–호–목 단계로 들여쓴다.
   · **class가 이미 있는 요소는 건드리지 않는다** — 코드로 생성한 서식(docBody)은
     h1/center/right/sign을 직접 지정하므로, 그것을 다시 분류하면 오히려 어긋난다.
   · 표 안(<td>)은 원본 격자를 그대로 둔다.
   · 여러 번 실행해도 결과가 같다(멱등) — 저장본을 다시 열어도 어긋나지 않는다. */
var FM_TITLE=/(합의서|확인서|승낙서|서약서|위임장|정관|신청서|보고서|회의록|명부|대지|계약서|동의서|점검표|체크리스트|사업계획서|재산목록|목록표|명세서|신고서|보증서면|필요서류|양식|서식)[\)\]〕』」]*\s*$/;
/* 자간 벌린 제목: '기 금 출 연 확 인 서', '서 약 서'.
   글자마다 공백을 넣은 모양이면서 **공백을 걷어낸 말이 서식명일 때만** 제목으로 본다.
   ('성 명 :'처럼 글자 사이가 벌어짐을 뿐인 라범을 제목으로 오인하지 않게) */
var FM_SPACED=/^(\S[ \u00a0]){2,}\S/;
var FM_DATE=/^(서기\s*)?(20\d{2}|20)\s*[년.]/;
var FM_DATE2=/^\d{4}\s*\.\s*\d{0,2}\s*\.\s*\d{0,2}\s*\.?$/;
var FM_TO=/(귀하|귀중)\s*$/;
var FM_SIGN=/\(\s*인\s*\)|（인）|개인인감|법인인감|서명\s*또는\s*인/;
var FM_JO=/^\s*제\s*\d+\s*조/;
var FM_HANG=/^\s*[①-⑳]/;                                        // 항
var FM_HO=/^\s*\d{1,2}\s*[.)]\s/;                                // 호
var FM_MOK=/^\s*[가-힣]\s*[.)]\s/;                               // 목
var FM_BUL=/^\s*([ㅇ○◦□■▪▶※][  ]|[-–]\s)/;
var FM_LAW=/^\s*[■\[]\s*(근로복지기본법|별지)/;
var FM_SENT=/(다|함|임|음|것)\s*[.。]?\s*$/;
/* 2열 이상으로 앉힐 줄인지 — 원본이 탭·긴 공백으로 칸을 나눈 서명란이 대상.
   6칸 이상 공백으로 갈리고, 조각이 짧고(25자 이하) 문장 끝이 아닐 때만 열로 본다.
   ('…노사 각 2인 동수     로 구성한다.'처럼 문장 중간 여백을 열로 오해하지 않게) */
function _fmSpacedTitle(s){
  return FM_SPACED.test(s) && s.length<=40 && FM_TITLE.test(s.replace(/[\s\u00a0]/g,''));
}
function _fmCols(s){
  if(FM_HO.test(s)||FM_MOK.test(s)||FM_BUL.test(s)||FM_HANG.test(s)||FM_JO.test(s)) return null;
  var parts=s.split(/[\s ]{6,}/).map(function(x){return x.trim();}).filter(Boolean);
  if(parts.length<2||parts.length>4) return null;
  for(var i=0;i<parts.length;i++){ if(parts[i].length>25||FM_SENT.test(parts[i])) return null; }
  return parts;
}
/* HWP 변환 잡음 제거 — 제어문자·결합문자와, 한글 서식에 나올 이유가 없는
   라틴 확장 문자(예: 'Ā')가 탭 자리에 섞여 들어온다. 탭은 여백으로 바꾼다. */
function _fmClean(s){
  return String(s==null?'':s)
    .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u0300-\u036f\u0100-\u017f]/g,'')
    .replace(/\t+/g,'  ');
}
function _fmText(html){
  var d=document.createElement('div'); d.innerHTML=String(html==null?'':html);
  return _fmClean(d.textContent||'');
}
function _fmBlock(txt,body,st){
  var s=txt.trim();
  if(FM_LAW.test(s)) return '<p class="fmlaw">'+body+'</p>';   // 법령·별지 표기는 본문 순서에서 제외
  st.n=(st.n||0)+1;
  // 제목은 문서에 하나 — 단, 서명·수신으로 한 장이 끝난 뒤에 나오면 다음 장의 제목이다
  if((!st.title||st.ended)&&st.n<=1&&(_fmSpacedTitle(s)||(s.length<=32&&FM_TITLE.test(s)))){
    var sep=st.title?'<hr class="fmsep">':'';
    st.title=true; st.ended=false; st.n=0;
    return sep+'<h1 class="fmtitle">'+body+'</h1>';
  }
  if(s.length<=34&&(FM_DATE.test(s)||FM_DATE2.test(s))) return '<p class="fmdate">'+body+'</p>';
  if(FM_TO.test(s)&&s.length<=40){ st.ended=true; return '<p class="fmto">'+body+'</p>'; }
  var c=_fmCols(s);
  if(c){ st.ended=true;
    return '<div class="fmcols c'+c.length+'">'+c.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>'; }
  if(FM_SIGN.test(s)){ st.ended=true; return '<p class="fmsign">'+body+'</p>'; }
  if(FM_JO.test(s)) return '<p class="fmjo">'+body.replace(/^(\s*제\s*\d+\s*조\s*(?:\([^)]*\))?)/,'<b>$1</b>')+'</p>';
  if(FM_HANG.test(s)) return '<p class="fmhang">'+body+'</p>';
  if(FM_HO.test(s))   return '<p class="fmho">'+body+'</p>';
  if(FM_MOK.test(s))  return '<p class="fmmok">'+body+'</p>';
  if(FM_BUL.test(s))  return '<p class="fmbul">'+body+'</p>';
  return '<p class="fmp">'+body+'</p>';
}
function typesetForm(root){
  /* colgroup이 없는 원본 표는 열 폭을 내용에 맞게 잡게 한다.
     table-layout:fixed로 열을 고르게 나누면 좁은 칸에 글자가 들어가지 않아
     표가 본문 폭을 넘는다(사업자등록신청서 66열 격자에서 실측). */
  Array.prototype.forEach.call(root.querySelectorAll('table'),function(t){
    if(!t.querySelector('col')) t.classList.add('fmauto');
  });
  var blocks=[];
  Array.prototype.forEach.call(root.querySelectorAll('p,div'),function(el){
    if(el.closest('table')) return;                       // 표 안은 원본 격자 유지
    if(el.querySelector('table,p,div,h1,h2')) return;      // 컨테이너 제외
    if(String(el.className||'').trim()) return;            // 이미 스타일이 지정된 것(생성 서식·재조판분) 제외
    blocks.push(el);
  });
  if(!blocks.length) return;
  var st={title:false,ended:false,n:0};
  blocks.forEach(function(el){
    var parts=el.innerHTML.split(/<br\s*\/?>/i), out=[];
    parts.forEach(function(part){
      var txt=_fmText(part); if(!txt.trim()) return;
      out.push(_fmBlock(txt,_fmClean(part),st));
    });
    if(!out.length){ el.remove(); return; }
    el.outerHTML=out.join('');
  });
}
function _docTypeset(root){
  try{
    typesetForm(root);            // ⓞ 서식 구조 조판(제목·날짜·서명·조항 단계)
    // ① 연속 공백·탭 보존 — 요소 사이 여백(줄바꿈+들여쓰기)은 건드리지 않는다
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null), tn=[], t;
    while((t=w.nextNode())) tn.push(t);
    tn.forEach(function(n){
      var v=n.nodeValue||''; if(!v.trim()) return;
      if(v.indexOf('\t')<0 && !/ {2,}/.test(v)) return;
      n.nodeValue=v.replace(/\t/g,'    ').replace(/ {2,}/g,function(m){ return Array(m.length+1).join(' '); });
    });
    // ② 표식 줄 내어쓰기
    Array.prototype.forEach.call(root.querySelectorAll('p,div'),function(el){
      if(el.querySelector('table,p,div,br,h1,h2')) return;      // 컨테이너·여러줄 단락 제외
      if(el.classList.contains('a4')||el.classList.contains('a4b')||el.classList.contains('a4f')) return;
      if(/^fm/.test(el.className||'')) return;                  // 조판된 서식 줄은 이미 단계별 들여쓰기가 있다
      var s=el.textContent||''; if(!DG_MARK.test(s)) return;
      el.classList.add(DG_BULLET.test(s)?'dgb':'dgn');
    });
  }catch(e){}
}
function _showDocHTML(html){ var w=$('docwrap'); if(!w)return;
  var body=sanitizeDocHTML(html);
  w.innerHTML='<div id="docstage"><div id="doced" contenteditable="true" style="outline:none"></div></div>';
  paginateDoc(body);            // A4 본문높이에 맞춰 장을 나누고 쪽수를 붙인다
  var ed=$('doced');
  if(ed&&!ed._dirtyBound){ ed._dirtyBound=1;
    ed.addEventListener('input',function(){ markDirty();
      clearTimeout(ed._ovT); ed._ovT=setTimeout(function(){ markA4Overflow(); fitDocA4(); },400); }); }
  fitDocA4();
}
// ── 서식 저장 3계층: 개별 기금(doc_edits/{fid}) > 유형 공통(doc_edits_type/{공동|사내}) > 자동생성 ──
function _docCtx(kind){ var f=curForm(); var ftype=(f.fund_type==='사내')?'사내':'공동';
  return { f:f, ftype:ftype,
    fundRef: f._sample?null:fbDb.ref(NS+'/doc_edits/'+S.formFund+'/'+kind),   // 샘플 모드엔 개별 저장 없음
    typeRef: fbDb.ref(NS+'/doc_edits_type/'+ftype+'/'+kind) }; }
function _setDocLayer(layer,ftype){ S._docLayer=layer;
  var b=$('docLayerBadge'); if(!b)return;
  if(layer==='fund'){ b.textContent='개별 저장본'; b.className='chip ok'; }
  else if(layer==='type'){ b.textContent=ftype+'기금 공통 수정본'; b.className='chip warn'; }
  else { b.textContent='자동생성'; b.className='chip'; } }
/* 서식마다 «장부에서 가져올 것»이 다르다. 별지10호(기본재산 총액 변경)는 그 해 기본재산
   변동 내역이 있어야 하는데, 그 자료는 회계·결산에 있고 서식 화면은 읽지 않고 있었다.
   ⚠ 읽어 둔 값에 «어느 기금·어느 해»인지 함께 적는다. 안 적으면 기금을 옮겼을 때
     지난 기금의 숫자가 그대로 서식에 찍힌다 — 남의 기금 금액을 노동청에 내게 된다. */
/* 장부를 읽어야 채워지는 서식들 — 나머지는 기금 정보만으로 그려진다(서약서 등) */
var DOC_NEEDS_LEDGER={ops_asset_change:1,sub_assets:1,sub_contrib:1,sub_welfare_plan:1,
                      sub_payment:1,sub_checklist:1,subsidy:1};
function _docExtra(kind,f){
  S._docBf=null; S._docR=null;
  if(!DOC_NEEDS_LEDGER[kind]||!f||f._sample) return Promise.resolve(null);
  var fid=S.formFund, yr=S.year;
  if(!fid) return Promise.resolve(null);
  return Promise.all([
    fbDb.ref(NS+'/txns/'+fid+'/'+yr).once('value').then(function(sn){ var v=sn.val()||{};
      return Object.keys(v).map(function(k){ var o=Object.assign({},v[k]); o._id=k; return o; }); }).catch(function(){ return []; }),
    fbDb.ref(NS+'/closing/'+fid+'/'+yr+'/report').once('value').then(function(sn){ return sn.val()||{}; }).catch(function(){ return {}; }),
    _loadSites(fid).catch(function(){ return []; }),
    fbDb.ref(NS+'/site_years/'+fid+'/'+yr).once('value').then(function(sn){ return sn.val()||{}; }).catch(function(){ return {}; }),
    fbDb.ref(NS+'/welfare/'+fid+'/'+yr).once('value').then(function(sn){ var v=sn.val()||{};
      return Object.keys(v).map(function(k){ return v[k]; }); }).catch(function(){ return []; })
  ]).then(function(r){
    var arr=r[0], rp=r[1], sites=r[2], sy=r[3], welf=r[4];
    var open=num((_openingOf(fid,yr)||{}).basic)||0;
    S._docBf={fid:fid,yr:yr,open:open,days:bfDays(open,bfMovesOf(journalOf(arr),rp))};
    /* 별지15호 산출을 그대로 쓴다 — 기본재산 운용 내역(㉑~㉘)이 곧 재산목록표의 기본재산이고,
       사업실적이 곧 계획서·신청서의 복지사업비다. 따로 세면 서류끼리 어긋난다. */
    S._docR={fid:fid,yr:yr,R:buildF15(arr,fid,yr,rp,sites,welf),fin:computeFin(arr,fid,yr),
             sy:sy,welf:welf,sites:sites};
    return S._docR;
  }).catch(function(){ return null; });
}
/* 읽어 둔 것이 «이 기금·이 해» 것인가 — 아니면 쓰지 않는다(남의 금액을 공단에 내게 된다) */
function _docRok(){ var x=S._docR; return (x&&x.fid===S.formFund&&x.yr===S.year)?x:null; }
function _docWait(note,head){
  return "<div class='a4'>"+note+"<p class='note'>회계·결산과 목적사업에서 숫자를 가져옵니다 — 아직 못 읽었습니다. "
    +"잠시 뒤 다시 열거나, 그 해 거래가 승인됐는지 확인해 주세요.</p>"+(head||'')+"</div>";
}
// 공통 로더: 자동생성 먼저 표시 → 유형 공통본 → 개별 저장본 순으로 덮어씀(우선순위 역순 적용)
function _loadDocInto(kind){ var c=_docCtx(kind), f=c.f;
  var token=(S._docToken=(S._docToken||0)+1);          // 최신 요청만 화면에 반영(늦은 응답 무시)
  var mine=function(){ return S._docToken===token && S._docKind===kind; };
  S._docKind=kind; S._docLayer=null;
  var sitesP=f._sample?Promise.resolve([]):_loadSites(S.formFund);
  return Promise.all([sitesP,_docExtra(kind,f)]).then(function(_a){
    var sites=_a[0];
    if(!mine())return;
    _showDocHTML(docBody(kind,f,sites)); _setDocLayer('gen',c.ftype);
    return Promise.all([
      c.typeRef.once('value').then(function(s){return s.val();}).catch(function(){return null;}),
      c.fundRef?c.fundRef.once('value').then(function(s){return s.val();}).catch(function(){return null;}):Promise.resolve(null)
    ]).then(function(a){ if(!mine())return; var t=a[0],fd=a[1];
      if(fd&&fd.html){ _showDocHTML(fd.html); _setDocLayer('fund',c.ftype); }
      else if(t&&t.html){ _showDocHTML(t.html); _setDocLayer('type',c.ftype); }
    });
  }).catch(function(e){ if(!mine())return; var w=$('docwrap'); if(w)w.innerHTML='<div class="msg err" style="padding:12px">서식 생성 오류: '+esc((e&&e.message)||e)+'</div>'; });
}
function saveDocEdit(kind){ var ed=$('doced'); if(!ed){ return; } var c=_docCtx(kind);
  if(!c.fundRef){ toast('샘플 모드입니다 — [💾 '+c.ftype+' 공통]으로 저장하세요','warn'); return; }
  c.fundRef.set({html:ed.innerHTML,saved:ymd()})
    .then(function(){ _setDocLayer('fund',c.ftype); S._dbEdits=undefined; toast('이 기금 서식으로 저장됨'); })
    .catch(function(e){ toast('저장 실패: '+e.message,'err'); }); }
function saveDocType(kind){ var ed=$('doced'); if(!ed){ return; } var c=_docCtx(kind);
  confirmM('현재 내용을 ['+c.ftype+'기금 공통 기본서식]으로 저장합니다.\n앞으로 모든 '+c.ftype+'기금에서 이 서식의 기본으로 쓰입니다.\n(개별 기금 저장본이 있는 기금은 개별본이 우선)',{ok:c.ftype+' 공통으로 저장'}).then(function(ok){ if(!ok)return;
    c.typeRef.set({html:ed.innerHTML,saved:ymd()})
      .then(function(){ if(S._docLayer!=='fund')_setDocLayer('type',c.ftype); toast(c.ftype+'기금 공통 기본서식으로 저장됨'); })
      .catch(function(e){ toast('저장 실패: '+e.message,'err'); }); }); }
function resetDoc(kind){ var c=_docCtx(kind);
  if(S._docKind!==kind||S._docLayer==null){ toast('서식을 불러오는 중입니다 — 잠시 후 다시','warn'); return; }   // 로딩 중 오삭제 방지
  if(S._docLayer==='fund'){
    confirmM('이 기금의 개별 저장본을 삭제할까요?\n('+c.ftype+' 공통 수정본이 있으면 그것이, 없으면 자동생성이 표시됩니다)',{ok:'개별본 삭제',danger:true}).then(function(ok){ if(!ok)return;
      c.fundRef.remove().then(function(){ S._dbEdits=undefined; toast('개별 저장본 삭제'); _loadDocInto(kind); }); });
  } else if(S._docLayer==='type'){
    confirmM('['+c.ftype+'기금 공통 기본서식]을 삭제하고 자동생성 원본으로 되돌립니다.\n모든 '+c.ftype+'기금에 적용됩니다.',{ok:'공통본 삭제',danger:true}).then(function(ok){ if(!ok)return;
      c.typeRef.remove().then(function(){ toast('공통 기본서식 삭제'); _loadDocInto(kind); }); });
  } else { toast('이미 자동생성 원본입니다'); }
}
// 서식 자료실 우측 사이드 패널에 렌더(팝업 대신 "옆에서 보기"). #docwrap/#doced 재사용 → 저장·인쇄·HWPX 그대로 동작.
function sidePreview(kind){
  var side=$('formSide');
  if(!side){ previewDoc(kind); return; }               // 사이드 패널 없으면 팝업 폴백
  var f=curForm();

// 원본 엑셀 + 기금 데이터 → 채워진 워크북 버퍼 (받기·미리보기 공용)
/* ── 수식 칸에 남은 «앞 기금 값»을 걷어낸다 ──
   원본 양식의 수식 칸에는 이 양식으로 앞서 만든 «남의 기금 값»이 캐시로 박혀 있다.
   ExcelJS 는 손대지 않은 수식 칸의 캐시를 그대로 다시 써 낸다 — 확인했다:
   설립인가신청서를 우리 기금으로 채운 뒤에도 수식 18칸 가운데 13칸에
   다른 기금의 이름·전화·주소가 그대로 남았다. 그게 내려받는 파일에도,
   화면 미리보기에도 그대로 나온다(미리보기는 캐시를 읽는다).

   ① 엑셀이 열릴 때 다시 셈하도록 표시해 둔다(fullCalcOnLoad).
   ② 그래도 화면은 캐시를 읽으므로, 우리가 셀 수 있는 것은 «다시 셈해» 넣고
      셈하지 못한 것은 «비운다» — 남의 값을 그냥 두는 것보다 빈 칸이 낫다.

   ⚠ 못 찾으면 null 을 돌려 «비운다». 엉뚱한 값을 채우면 그럴듯하게 틀린 서식이 관청에 간다. */
function _xlsColN(a){ var n=0,A=String(a).toUpperCase(); for(var i=0;i<A.length;i++) n=n*26+(A.charCodeAt(i)-64); return n; }
function _xlsPlain(v){
  if(v==null) return '';

    if('result' in v) return _xlsPlain(v.result);

    if(v.text!=null) return String(v.text);

function _xlsRef(wb,ws,ref){

function _xlsVlookup(wb,ws,keyRef,rangeRef,idx){

/* 남은 식은 «글자 잇기»만 한다 — 리터럴 · 칸 참조 · LEFT/RIGHT/MID · & .
   셈이 섞인 식(＋·％ 등)은 손대지 않고 비운다. 엑셀이 열릴 때 제대로 셈한다. */

    if(ch==='"'){

      while(j<s.length){ if(s[j]==='"'){ if(s[j+1]==='"'){ lit+='"'; j+=2; continue; } break; } lit+=s[j++]; }
      if(j>=s.length) return null;               /* 따옴표가 안 닫혔다 — 손대지 않는다 */
      out+=lit; i=j+1; continue;

      while(k<s.length&&d>0){ if(s[k]==='(')d++; else if(s[k]===')'){d--; if(!d)break;} arg+=s[k++]; }

      else out+=base.substr((+parts[1]||1)-1, +parts[2]||0);

    }
    var tok=/^(?:'[^']+'!)?\$?[A-Z]+\$?\d+/.exec(s.slice(i));
    if(tok){ var v=_xlsRef(wb,ws,tok[0]); if(v==null) return null; out+=String(v); i+=tok[0].length; continue; }

function _xlsRecalc(wb){

/* ── 채워진 엑셀을 오른쪽 판에서 «보이는 대로» 그린다 ──

     이 서식들은 폭 1.6자짜리 모눈 칸을 63군데 병합해 만든 별지 서식이라,
     병합을 버리면 「근로복지기금법인」이 한 글자씩 세로로 선다 — 실제로 그렇게 나왔다.

function fillSetup(wb,f,sites){

  var parts=wb.getWorksheet('참여사업장정보'); if(parts){

       우리가 안 건드리는 «옆 칸»(AE 열의 「…(탈퇴)」 같은 메모)은 그대로 나갔다.
       그러니 먼저 자료 줄을 «통째로» 비우고 쓴다. */
    var _lastCol=Math.max(parts.columnCount||0,31);
    clearRange(parts,3,Math.max(parts.rowCount||0,3+sites.length),1,_lastCol);
    sites.forEach(function(s,i){ var r=3+i, c=_siteContacts(s);
      setC(parts,'A'+r,'1-'+(i+1)); parts.getCell(r,2).value=i+1; setC(parts,'C'+r,s.name||''); setC(parts,'D'+r,s.ceo||'');
      setC(parts,'E'+r,s.address||''); var sz=num(s.company_size)||''; if(sz!==''){parts.getCell(r,6).value=sz;parts.getCell(r,10).value=sz;}
      setC(parts,'G'+r,s.biz_type||''); setC(parts,'I'+r,s.biz_no||''); setC(parts,'K'+r,c.name); setC(parts,'N'+r,c.phone); setC(parts,'O'+r,c.email); });
  }
  var doc=wb.getWorksheet('신청서'); if(doc){
    setC(doc,'AM3',1); var keys=[];
    doc.getColumn(9).eachCell({includeEmpty:false},function(cell){ if(typeof cell.value==='string'&&/^\d+-\d+$/.test(cell.value.trim())) keys.push(cell); });
    keys.sort(function(a,b){return a.row-b.row;});
    keys.forEach(function(cell,idx){ if(cell.type!==ExcelJS.ValueType.Formula) cell.value=idx<sites.length?('1-'+(idx+1)):null; });
  }
}

/* 붙여 둔 기금 머리를 맨 위 상태줄 «바로 아래»에 놓는다.
   상태줄 높이는 글자 크기·화면 폭·글꼴이 다 갖춰졌는지에 따라 달라진다.
   ⚠ 한 번만 재면 안 된다 — 첫 그림 때 잰 값이 굳어 89px 로 남고, 실제 53px 과
      36px 틈이 벌어져 그 사이로 본문이 지나가는 것을 미리보기에서 확인했다.
   그래서 크기가 «바뀔 때마다» 따라가게 한다. */
var _topbarRO=null;
function _syncTopbarH(again){
  var t=$('topbar'); if(!t) return;
  var h=Math.round(t.getBoundingClientRect().height);
  if(h>0) document.documentElement.style.setProperty('--topbar-h',h+'px');
  if(!_topbarRO && window.ResizeObserver){
    _topbarRO=new ResizeObserver(function(){ _syncTopbarH(); });
    _topbarRO.observe(t);
  }
  /* 그림이 다 그려진 «다음 칸»에 한 번 더 잰다 — 방금 갈아끼운 화면 때문에
     상태줄 높이가 아직 안 잡힌 채로 잴 수 있다(89px 로 굳어 36px 틈이 벌어졌던 자리). */
  if(!again && window.requestAnimationFrame) requestAnimationFrame(function(){ _syncTopbarH(1); });
}
window.addEventListener('resize',function(){ _syncTopbarH(); });
window.addEventListener('load',function(){ _syncTopbarH(); });   // 글꼴이 늦게 오는 경우

/* ══ 틀 고정 ══ 목록 머리줄(#homehead)을 상단바 «아래»에 붙이고, 표 머리줄은 그 아래에 붙인다.
   머리줄 높이는 좁은 화면에서 접히고 「정보 채우기」를 켜면 한 줄 더 늘어 «그때그때 다르다» —
   상단바와 같은 방식으로 재어서 --homehead-h 로 넘긴다. */
var _homeheadRO=null;
function _syncHomeheadH(){
  var e=$('homehead');
  if(!e){ document.documentElement.style.setProperty('--homehead-h','0px'); return; }
  var h=Math.round(e.getBoundingClientRect().height);
  if(h>0) document.documentElement.style.setProperty('--homehead-h',h+'px');
  if(!_homeheadRO && window.ResizeObserver){
    _homeheadRO=new ResizeObserver(function(){ _syncHomeheadH(); _syncTblScroll(); });
  }
  if(_homeheadRO){ try{ _homeheadRO.disconnect(); _homeheadRO.observe(e); }catch(err){} }
}
/* 표 머리줄은 감싼 상자가 «스크롤 상자»면 안 붙는다 — overflow-x:auto 를 주면 세로도 auto 로
   따라 계산되기 때문이다(CSS 규칙). 그래서 «가로로 넘칠 때만» 스크롤을 켠다.
   넘치지 않는 넓은 화면에서는 상자를 열어 두어 머리줄이 붙는다. */
function _syncTblScroll(){
  [].slice.call(document.querySelectorAll('.tblwrap')).forEach(function(w){
    var t=w.querySelector('table'); if(!t) return;
    var over=t.scrollWidth>w.clientWidth+1;
    /* 켜고 끄기를 되풀이하면 (스크롤을 켜는 순간 폭이 달라져) 깜빡일 수 있다 —
       이미 켜져 있으면 «확실히 남을 때만» 끈다. */
    if(over) w.classList.add('scrollx');
    else if(w.classList.contains('scrollx')){ if(t.scrollWidth<=w.clientWidth-8) w.classList.remove('scrollx'); }
  });
}
window.addEventListener('resize',function(){ _syncHomeheadH(); _syncTblScroll(); });

function _deleteSetupFund(fid,goHome){
  var f=funds[fid]; if(!f) return;
  var msg='"'+(f.short_name||f.name)+'"을(를) 완전히 삭제할까요?\n\n'
    +'※ 되돌릴 수 없습니다. 기금 정보·참여사업장·서식 저장본·연간일정·목적사업·거래내역·청구·업로드 파일이 모두 지워집니다.\n'
    +'(보관만 하려면 취소하고 그대로 두세요)';
  confirmM(msg,{ok:'완전 삭제',danger:true}).then(function(ok){
    if(!ok) return null;
    // ① 서버 최신값 재확인 — 확인창 떠 있는 동안 복원됐을 수 있음
    return fbDb.ref(NS+'/funds/'+fid).once('value').then(function(fs){
      var sv=fs.val()||{};
      if(!sv.deleted&&sv.setup_stage!=='설립준비'){
        toast('보관 중인 기금이 아닙니다(복원됨?) — 완전 삭제 취소','warn'); return 'abort';
      }
      // ② Storage 업로드 파일 먼저 정리(메타 삭제 전이라 경로를 알 수 있음)
      return fbDb.ref(NS+'/subsidy_docs/'+fid).once('value')
        .then(function(ds){
          var d=ds.val()||{}, paths=[];
          Object.keys(d).forEach(function(yr){ var y=d[yr]||{};
            Object.keys(y).forEach(function(id){ if(y[id]&&y[id].path) paths.push(y[id].path); }); });
          if(!fbStore||!paths.length) return null;
          return Promise.all(paths.map(function(p){ return fbStore.ref(p).delete().catch(function(){}); }));
        })
        .catch(function(){ return null; });
    }).then(function(st){
      if(st==='abort') return 'abort';

      up['events/'+fid]=null; up['txns/'+fid]=null;

      if(st==='abort') return 'abort';
      // ④ 이 기금 청구 항목 정리 — 실패해도 본체는 지워졌으므로 '일부 실패'로 알린다(성공으로 속이지 않음)
      return fbDb.ref(NS+'/billings').once('value').then(function(bs){

        return Object.keys(del).length?fbDb.ref(NS+'/billings').update(del):null;
      }).then(function(){ return 'ok'; }).catch(function(){ return 'partial'; });
    }).then(function(st){
      if(st==='abort') return;

/* openSetup(fid) 도 함께 지웠다 — 위 목록 모달에서만 쓰던 것이고,
   설립 진행 화면은 기금을 열면 탭줄의 [🏗 설립 진행]으로 바로 간다. */
function toggleSetup(code,on){ var _fid=S.fundId;
  fbDb.ref(NS+'/funds/'+_fid+'/setup/'+code).set({done:on,date:on?ymd():''}).then(function(){
    var t=funds[_fid]; if(!t) return;   // 다른 탭에서 삭제됐으면 로컬 반영 생략(유령 객체 방지)
    if(!t.setup)t.setup={}; t.setup[code]={done:on,date:on?ymd():''};
    if(S.fundId===_fid) renderFund();
  }).catch(function(e){ toast('저장 실패: '+e.message,'err'); });
}
function finishSetup(){ var _fid=S.fundId, f0=funds[_fid]; if(!f0) return;
  confirmM('설립 절차를 완료하고 운영 기금으로 전환할까요?',{ok:'운영 전환'}).then(function(ok){ if(!ok)return;
    // 서버 최신 체크 상태로 완료 여부 재검증(다른 탭에서 해제됐을 수 있음)
    fbDb.ref(NS+'/funds/'+_fid+'/setup').once('value').then(function(s){
      var done=s.val()||{}, steps=EST_TMPL.filter(function(t){return !(t[2]&&f0.fund_type==='사내');});
      var nd=steps.filter(function(t){return done[t[0]]&&done[t[0]].done;}).length;
      if(nd<steps.length){ toast('아직 미완료 단계가 있습니다 ('+nd+'/'+steps.length+')','warn');
        if(funds[_fid]) funds[_fid].setup=done; if(S.fundId===_fid)renderFund(); return; }
      return fbDb.ref(NS+'/funds/'+_fid+'/setup_stage').set(null).then(function(){
        if(funds[_fid]) funds[_fid].setup_stage='';
        if(S.fundId===_fid){ S.tab='info'; renderFund(); } toast('운영 기금으로 전환되었습니다');

    }).catch(function(e){ toast('전환 실패: '+e.message,'err'); });
  });

  closeM(); markDirty();
  /* 저장은 사람이 누른다 — 조용히 덮어쓰지 않는다 */

}
/* 화면에서 명부를 읽어 온다. 이름이 빈 줄은 버린다 — 빈 이름이 서류에 그대로 찍히면 못 쓴다. */
function _readOfficers(){

    var g=function(c){ var e=tr.querySelector(c); return ((e&&e.value)||'').trim(); };
    /* 빈 칸은 «키를 두지 않는다» — 빈 문자열을 넣으면 실시간DB 에 쓸모없는 칸이 쌓이고,
       나중에 «있는데 비었다»와 «아예 없다»가 구별되지 않는다. */
    var o={ role:(tr.querySelector('.off-role')||{}).value||'', name:g('.off-name') };

  }).filter(function(o){ return o.name; });

/* 서류 끌어놓기 → 판독 → 값 확인 후 폼에 반영 (저장은 [💾 저장] 눌러야 확정) */
function bindDocIntake(){

var _docFound={}, _docOcr=false, _docFid=null;   // 판독 결과는 시작 시점 기금에 귀속

   원본은 사진첩에 그대로 두고, 기금에는 값 + 참조(주인·연도·id)만 남긴다.
   RTDB에 이미지를 넣으면 기금 목록 로딩이 통째로 느려지므로 절대 복사하지 않는다. */
var _pick={kind:'',zid:'',items:[],year:0};
function _siteName(sid){ return ((S.sites||{})[sid]||{}).name||''; }
/* sid 를 주면 «그 참여사업장의 제출서류»를 고르는 창이 된다(판독 없이 연결만 한다).
   연도(yr)를 고를 때 함께 붙잡아 둔다 — 고르는 사이에 화면 연도가 바뀌어도 엉뚱한 해에 저장되지 않는다. */
/* shelf 를 주면 «서류함에 담기»가 된다 — 종류는 위 선택칸에서 가져온다 */

}
/* txn 을 주면 «그 거래의 증빙»을 고르는 창이 된다(판독 없이 잇기만 한다) */
/* ══════════ 서류를 사진첩에서 «스스로 찾아» 온다 (대표 지시 2026-09-05) ══════════
   「서류 입력은 푸른 사진첩에서 자동으로 가지고 오게 해서 확인후 입력하게 하자」

   여태는 🖼 를 눌러 해마다 사진을 눈으로 뒤져야 했다. 사진첩은 이미 서류 «제목»을
   읽어 두고 있다(meta.read.fields.docName) — 그것으로 골라 준다.

   ⚠ 「자동으로 넣지」 않는다. 후보를 찾아 보여 주고 사람이 고르면, 그때부터는 지금까지
     쓰던 길(pickAlbumPhoto → 판독 → [↓ 아래 칸에 반영])을 그대로 탄다. 서류 한 장이
     기금의 인가번호를 바꾼다 — 사람 눈을 건너뛰면 안 된다.
   ⚠ 종류가 맞아야 후보다. 기금 이름까지 맞으면 «확실»로 올려 맨 위에 둔다.
     이름이 안 맞는다고 버리지는 않는다 — 사진첩에 기금 이름이 안 적힌 것이 흔하다. */
var DOC_FIND={
  inka:{label:'설립인가증', kw:['인가증','설립인가','인가서']},
  corpreg:{label:'법인 등기부등본', kw:['등기사항','등기부','등기사항전부증명']},
  taxid:{label:'고유번호증', kw:['고유번호']},
  charter:{label:'정관', kw:['정관']}
};
/* 사진 한 장에서 «글자로 된 것»을 모은다 — 제목·직접분류·회사·메모·판독 칸 */
function docFindText(it){
  var m=(it&&it.meta)||{}, r=m.read||{}, f=r.fields||{};
  return [f.docName,m.company,m.note,f.company,f.name,f.corpName,(m.doc||{}).name]
    .filter(Boolean).join(' ');
}
/* 0=후보 아님 · 1=종류만 맞음 · 3=기금 이름까지 맞음 */
function docFindScore(it,kind,fkey){
  var def=DOC_FIND[kind]; if(!def) return 0;
  var t=docFindText(it);
  if(!def.kw.some(function(k){ return t.indexOf(k)>=0; })) return 0;
  if(fkey&&fkey.length>=3&&_cardFundKey(t).indexOf(fkey)>=0) return 3;
  return 1;
}
/* 사진첩을 훑어 세 서류의 후보를 한 번에 추린다 */
function docAutoFind(){
  if(!photoStoreReady()){ toast('사진첩과 연결되지 않았습니다 — 새로고침 후 다시','err'); return; }
  var fid=S.fundId, f=funds[fid]||{}, fkey=_cardFundKey(f.name||f.short_name||'');
  showModal('<div class="row" style="margin:0 0 8px"><h2 style="margin:0">🔎 사진첩에서 서류 찾기</h2>'
    +'<span class="muted" style="font-size:11.5px">'+esc(f.short_name||f.name||'')+'</span>'+hlp('doc.auto')+'</div>'
    +'<div id="dfBody" style="max-height:62vh;overflow:auto">'+loadingHTML('사진첩을 훑는 중…')+'</div>',{width:900});
  var boss=_isBoss();
  var ysP=PuPhotoStore.listYears?PuPhotoStore.listYears():Promise.resolve([String(new Date().getFullYear())]);
  ysP.then(function(ys){
    var years=(ys||[]).slice().sort().reverse().slice(0,8);
    if(!years.length) years=[String(new Date().getFullYear())];
    return Promise.all(years.map(function(y){
      var p=(boss&&PuPhotoStore.listYearAll)
        ? PuPhotoStore.listYearAll(y).catch(function(){ return PuPhotoStore.listYear(y); })
        : PuPhotoStore.listYear(y);
      return p.then(function(items){
        return Object.keys(items||{}).map(function(id){ return {id:id,year:y,meta:items[id]||{}}; });
      }).catch(function(){ return []; });
    }));
  }).then(function(lists){
    if(S.fundId!==fid||!$('dfBody')) return;                 // 그 사이 다른 기금으로 옮겼다
    var all=[].concat.apply([],lists);
    _dfFound={};
    Object.keys(DOC_FIND).forEach(function(k){
      _dfFound[k]=all.map(function(it){ return {it:it,sc:docFindScore(it,k,fkey)}; })
        .filter(function(x){ return x.sc>0; })
        .sort(function(a,b){ return b.sc-a.sc || (b.it.meta.takenAt||0)-(a.it.meta.takenAt||0); })
        .slice(0,6);
    });
    _dfScanned=all.length;
    renderDocFind();
  }).catch(function(e){
    var b=$('dfBody'); if(b) b.innerHTML='<div class="msg err">사진첩을 읽지 못했습니다: '+esc((e&&e.message)||e)+'</div>';
  });
}
var _dfFound={}, _dfScanned=0;
/* 찾기 창 → 사진첩 훑어 고르기. 창을 갈아 끼운다 — 두 창이 겹쳐 뜨지 않는다.
   고른 뒤는 기존 길 그대로다: 원본을 가져와 판독 → 확인 창 → 칸에 넣고 원본을 잇는다.

function docFindBrowse(kind){

         그때는 창을 닫고 작은 🖼 단추를 다시 찾아야 했다 — 여기서 바로 넘어가게 한다. */
      if(!list.length) return head+'<div class="muted" style="font-size:11.5px;padding:4px 2px">'

    +'<p class="muted" style="font-size:11px;margin:12px 0 0">사진첩 원본은 그대로 남습니다 · 기금에는 참조만 남깁니다</p>';

/* 고르면 «지금까지 쓰던 길»을 그대로 탄다 — 판독 → 확인 → 반영 */
function docFindPick(kind,id,year){

/* wrepSid 가 오면 «근로자대표 재직증명서» 갈래다.

     재직증명서는 해마다 내는 서류가 아니라 «그 사람»에 붙는 서류다. */
function openAlbumPick(zid,kind,sid,shelf,txn,wrepSid){
  if(!photoStoreReady()){ toast('사진첩과 연결되지 않았습니다 — 새로고침 후 다시','err'); return; }

         sid:wrepSid?'':(sid||''), wrep:wrepSid||'', yr:S.year,

          :wrepSid?(_siteName(wrepSid)+' 근로자대표 재직증명서')

  albumPickLoad(_pick.year);
}
function albumPickLoad(year){
  _pick.year=year;
  var boss=_isBoss();
  var p=boss&&PuPhotoStore.listYearAll ? PuPhotoStore.listYearAll(String(year)).catch(function(){ return PuPhotoStore.listYear(String(year)); })
                                       : PuPhotoStore.listYear(String(year));
  p.then(function(items){
    if(!$('pk-body')) return;
    _pick.items=Object.keys(items||{}).map(function(id){ return {id:id,meta:items[id]||{}}; })
      .sort(function(a,b){
        var ad=(a.meta.kind==='doc')?0:1, bd=(b.meta.kind==='doc')?0:1;    // 서류를 먼저
        return ad-bd || (b.meta.takenAt||0)-(a.meta.takenAt||0);
      });

  }).catch(function(e){
    var b=$('pk-body'); if(b) b.innerHTML='<div class="msg err">사진 목록을 불러오지 못했습니다: '+esc((e&&e.message)||e)+'</div>';

function renderAlbumPick(){
  var b=$('pk-body'); if(!b) return;
  if(!_pick.items.length){ b.innerHTML='<div class="muted" style="padding:20px 4px;text-align:center">'+_pick.year+'년에 올린 사진이 없습니다.<br>폰으로 찍었다면 <b>푸른사진첩</b>에 먼저 올려 주세요.</div>'; return; }
  b.innerHTML='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px">'
    +_pick.items.map(function(it){
      var d=new Date(it.meta.takenAt||0);
      var who=it.meta.__ownerName?('<div class="muted" style="font-size:9.5px">'+esc(it.meta.__ownerName)+'</div>'):'';
      return '<div onclick="pickAlbumPhoto(\''+it.id+'\')" style="cursor:pointer;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)">'
        +'<div id="pkt-'+it.id+'" style="height:82px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:11px">…</div>'
        +'<div style="padding:4px 6px"><div style="font-size:10.5px">'+(d.getMonth()+1)+'/'+d.getDate()
        +(it.meta.kind==='doc'?' <span class="chip warn" style="font-size:9px">서류</span>':'')+'</div>'+who+'</div></div>';
    }).join('')+'</div>';
  // 썸네일은 한 장씩 뒤따라 채운다(한 번에 다 받으면 느리다)
  _pick.items.slice(0,60).forEach(function(it){
    var owner=it.meta.__ownerUid||undefined;
    PuPhotoStore.loadThumb(String(_pick.year),it.id,owner).then(function(src){
      var el=$('pkt-'+it.id); if(!el||!src) return;
      el.innerHTML='<img src="'+src+'" style="width:100%;height:82px;object-fit:cover;display:block">';
    }).catch(function(){ var el=$('pkt-'+it.id); if(el) el.textContent='×'; });
  });
}
function pickAlbumPhoto(id){
  var it=_pick.items.filter(function(x){return x.id===id;})[0]; if(!it) return;
  var owner=it.meta.__ownerUid||undefined, year=String(_pick.year), kind=_pick.kind, zid=_pick.zid, fid=_pick.fid;
  /* 참여사업장 서류(중소기업확인서·등기부·사업자등록증)는 판독하지 않는다 —
     기금 정보 칸을 채우는 서류가 아니라 «받았다»를 증명하는 서류다. 원본만 잇고 체크를 켠다. */
  if(_pick.shelf){
    closeM();                                        // 원본을 받아 올 일이 없어 곧바로 닫는다
    saveShelfScanRef(fid,_pick.yr,_pick.shelf,{owner:owner||'',year:year,id:id},it.meta);
    return;
  }
  /* 근로자대표 재직증명서 — 판독하지 않는다. 「이 사람이 이 사업장 근로자다」를
     증명하는 서류라 원본만 잇고 화면에서 볼 수 있게 한다. */
  if(_pick.wrep){
    closeM();
    saveWrepDocRef(fid,_pick.wrep,{owner:owner||'',year:year,id:id});
    return;
  }
  if(_pick.sid){
    closeM();
    saveSiteScanRef(fid,_pick.yr,_pick.sid,kind,{owner:owner||'',year:year,id:id});
    return;
  }
  /* 거래 증빙 — 영수증은 «받았다»를 증명하는 것이라 판독하지 않는다. 원본만 잇는다. */
  if(_pick.txn){
    closeM();
    saveTxnScanRef(fid,_pick.yr,_pick.txn,{owner:owner||'',year:year,id:id});
    return;
  }
  var b=$('pk-body'); if(b) b.innerHTML=loadingHTML('원본을 가져와 판독하는 중…');
  PuPhotoStore.loadFull(year,id,owner).then(function(src){
    if(!src) throw new Error('원본을 찾지 못했습니다');
    closeM();
    saveScanRef(fid,kind,{owner:owner||'',year:year,id:id});      // 참조만 저장(이미지는 복사하지 않음)
    return _dataUrlToFile(src,kind+'.jpg');
  }).then(function(file){
    if(S.fundId!==fid) return;                                     // 그 사이 다른 기금으로 이동 → 버림
    readDocInto(zid,kind,file,true);                               // 이미 이어 뒀다 — 두 번 넣지 않는다
  }).catch(function(e){
    var bb=$('pk-body');
    var msg='가져오지 못했습니다: '+esc((e&&e.message)||e)
      +'<div class="muted" style="font-size:11.5px;margin-top:6px">다른 사람이 올린 사진은 권한에 따라 열리지 않을 수 있습니다.</div>';
    if(bb) bb.innerHTML='<div class="msg err">'+msg+'</div>'; else toast('사진을 가져오지 못했습니다','err');
  });
}
function _dataUrlToFile(src,name){
  return fetch(src).then(function(r){ return r.blob(); }).then(function(b){ return new File([b],name,{type:b.type||'image/jpeg'}); });
}
/* ══════════ 월마감 — closing/{기금}/{연도}/months/{01~12} ══════════
   연간 일정에 「매월 말 월마감」이 있는데 잠글 방법이 없었다(대표 검토 2026-08-24, ⑦).
   잠근 달의 거래는 고칠 수 없다 — 승인·계정 지정·쪼개기·삭제·새 거래 모두 막힌다.
   ⚠ 자물쇠는 «되돌릴 수 있다». 결산 확정과 달리 월마감은 일하는 중의 표시라,
     잘못 잠갔다고 그 달을 통째로 다시 만들게 하면 안 된다.
   ⚠ 자물쇠는 사람을 막는 것이지 «자료를 지키는 것»이 아니다 — 서버 규칙이 아니라
     화면에서 막는다. 실수로 고치는 것을 막는 것이 목적이다. */
function _monthOf(d){ var m=String(d||'').slice(5,7); return /^(0[1-9]|1[0-2])$/.test(m)?m:''; }
function monthLocked(mm){ return !!(((S.f15Close||{}).months||{})[mm]); }
/* 그 거래의 달이 잠겼는가 — 막는 자리마다 이 하나만 부른다 */
function txnLocked(id){
  var x=(S.txns||{})[id]; if(!x) return false;
  return monthLocked(_monthOf(x.date));
}
function _lockStop(mm){
  toast((+mm)+'월은 마감되어 고칠 수 없습니다 — 월마감을 풀고 고치세요','warn');
  renderFund();
}
function monthLockSet(mm,on){
  var fid=S.fundId, yr=S.year;
  var go=function(){
    fbDb.ref(NS+'/closing/'+fid+'/'+yr+'/months/'+mm).set(on?{at:ymd(),by:(S.user||'')}:null)
      .then(function(){
        S.f15For=null; _cbDirty();                 // 결산 화면·대장이 새 상태를 보게
        _audit(fid,on?'월마감':'월마감 해제',yr+'년 '+(+mm)+'월');
        if(S.fundId===fid&&S.year===yr) renderFund();
        toast((+mm)+'월 '+(on?'마감했습니다':'마감을 풀었습니다'));
      }).catch(function(e){ toast('실패: '+e.message,'err'); });
  };
  if(!on){ confirmM((+mm)+'월 마감을 풀까요?\n푼 뒤에는 그 달 거래를 다시 고칠 수 있습니다.',{ok:'풀기'})
    .then(function(ok){ if(ok) go(); }); return; }
  go();
}
/* 달마다 자물쇠 하나 — 잠근 달은 미분류가 남아 있으면 함께 알려 준다 */
function monthLockBar(arr){
  if(!f15Load()) return '';
  var cnt={}, un={};
  (arr||[]).forEach(function(x){ var m=_monthOf(x.date); if(!m) return;
    cnt[m]=(cnt[m]||0)+1; if(!x.approved) un[m]=(un[m]||0)+1; });
  var any=Object.keys(cnt).length;
  if(!any) return '';
  var ms=[]; for(var i=1;i<=12;i++){ var mm=(i<10?'0':'')+i; if(cnt[mm]) ms.push(mm); }
  return '<div class="row" style="margin-top:8px;flex-wrap:wrap;gap:5px">'
    +'<span class="muted" style="font-size:11.5px">월마감</span>'+hlp('close.month')
    +ms.map(function(mm){
      var lk=monthLocked(mm);
      return '<button onclick="monthLockSet(\''+mm+'\','+(lk?'false':'true')+')" '
        +'title="'+(+mm)+'월 거래 '+cnt[mm]+'건'+(un[mm]?' · 미승인 '+un[mm]+'건':'')+'" '
        +'style="padding:2px 8px;font-size:11px'+(lk?';background:var(--ok-bg);color:var(--ok);font-weight:700':'')+'">'
        +(lk?'🔒':'🔓')+' '+(+mm)+'월'+(un[mm]?' <span style="color:var(--warn)">'+un[mm]+'</span>':'')+'</button>';
    }).join('')+'</div>';
}

/* ★ 사진첩에 「증빙으로 썼다」고 알린다 (2026-08-26)
   보유기간이 **증빙 5년 / 나머지 1년**으로 갈리는데 그 갈림을 정하는 것이 이 표시 하나다.
   안 남기면 기금 증빙으로 붙여 놓은 사진이 1년 뒤 「보유기간 지난 사진」으로 떠서,
   모르고 지우면 감사·세무조사 때 내놓을 원본이 없어진다.
   ⚠ 실패해도 연결 저장을 되돌리지 않는다 — 표시가 없으면 보관이 짧아질 뿐이다.
   ⚠ 남의 사진(공유받은 것)에는 서버가 못 쓰게 막는다. 조용히 넘긴다. */
function markFundUsed(ref, where){
  try{
    if(!ref||!ref.id||!ref.year) return;
    if(typeof PuPhotoStore==='undefined'||!PuPhotoStore.markUsed) return;
    PuPhotoStore.markUsed(String(ref.year), ref.id, where, ref.owner)
      .catch(function(e){ console.warn('[증빙 표시]', e&&e.message); });
  }catch(e){}
}

/* ══ 거래 증빙 — txns/{기금}/{연도}/{거래}/scan = {owner,year,id,at,by} ══
   분개는 「무엇을 샀나」를 말하지만 «그것이 사실인지»는 영수증이 말한다. 감사·세무조사에서
   묻는 것이 그것이다. 원본은 사진첩에 그대로 두고 거래에는 참조만 남긴다 —
   이미지를 RTDB에 넣으면 거래 목록이 통째로 느려진다(기금 서류와 같은 규칙). */
function saveTxnScanRef(fid,yr,id,ref){

/* 참여사업장 제출서류의 사진첩 참조.
   자리: subsidy_chk/{기금}/{연도}/scan/site/{사업장}/{서류} = {owner,year,id,at,by}
   체크 자리(site/…)와 **같은 마디 안**에 둔다 — 지금 있는 한 번 읽기에 그대로 따라오므로
   화면을 열 때 왕복이 늘지 않는다. 열 전체 켜기(subChkCol)와 노동청 일괄 반영은
   site/ 와 fund/ 만 건드리므로 이 참조를 지우지 않는다. */
function _subScanOf(sid,kind){ return ((((S.subChk||{}).scan||{}).site||{})[sid]||{})[kind]; }
function saveSiteScanRef(fid,yr,sid,kind,ref){

  var up={}; up['scan/site/'+sid+'/'+kind]=o; up['site/'+sid+'/'+kind]=1;

    S.subChk=S.subChk||{};

    S.subChk.scan=S.subChk.scan||{}; S.subChk.scan.site=S.subChk.scan.site||{};
    S.subChk.scan.site[sid]=S.subChk.scan.site[sid]||{}; S.subChk.scan.site[sid][kind]=o;
    markFundUsed(ref, '참여사업장 제출서류 — '+sid+' '+kind+' '+yr);

/* 서류함에 사진첩 사진을 **참조로** 담는다.
   기존 업로드 기록과 같은 표(subsidy_docs)에 들어가되 url·path 대신 ref 를 갖는다 —
   앱 창고에 사본을 만들지 않으므로 같은 서류가 두 곳에 쌓이지 않는다.
   이름은 사진첩 메모를 먼저 쓰고, 없으면 «종류 + 찍은 날»로 짓는다(빈 이름이면 표에서 못 찾는다). */
function _shelfName(kind,meta){
  var t=String((meta&&meta.note)||'').trim().replace(/\s+/g,' ').slice(0,40);
  if(t) return t;
  var ms=(meta&&meta.takenAt)||0, d=new Date(ms);
  var day=ms?(d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)):'';
  return kind+(day?' '+day:'');
}
function saveShelfScanRef(fid,yr,kind,ref,meta){
  var rec={kind:kind,name:_shelfName(kind,meta),ref:Object.assign({},ref),uploaded:ymd(),by:(S.user||'')};

    if(S.fundId!==fid||S.year!==yr) return;
    markFundUsed(ref, '기금 서류함 — '+(funds[fid]&&funds[fid].name||fid)+' '+kind+' '+yr);
    S.subDocFor=null; renderFund(); toast('사진첩 원본을 서류함에 담았습니다');
  }).catch(function(e){ toast('담기 실패: '+e.message,'err'); });
}

// 기금 서류·사업장 서류가 같은 방식으로 그린다 — 한 곳에서만 고치도록 모아 둔다
function _loadScanInto(r){

function docZoneLabel(kind){ return ({inka:'설립인가증',corpreg:'법인 등기부등본',taxid:'고유번호증',charter:'정관',
  sme:'중소기업확인서',reg:'등기부등본',bizno:'사업자등록증',
  wrep:'근로자대표 재직증명서'})[kind]||kind; }   // 뒤 넷은 참여사업장 몫
/* 드롭존 아래 한 줄 — 사진첩에서 고르기 / 이미 연결된 원본 보기 */
/* ══ 푸른 기업정보함(기업정보함) 연동 ══
   사업자등록증 카드에 이미 들어 있는 값을 기금 정보로 당겨온다. 다시 칠 이유가 없다.
   · 읽는 곳은 **가벼운 검색목록** pucards/idx 뿐 — 원본 카드(pucards/items)는 사진이 수 MB라 건드리지 않는다
   · idx 한 칸: {k:'biz'|'card', c:회사명, bz:번호, ceo:대표자, ad:주소, ct:연락처, bt:업태, bi:종목}
   · 기금법인은 사업자등록번호가 아니라 **고유번호**를 받으므로 bz 는 고유번호 칸으로 간다 */
var _cardIdx=null, _cardPick={q:'',items:[]};
/* 사업장 편집 창에서 기업정보함에 다녀올 때 «어느 사업장이었는지» — editSite 가 적어 둔다 */
var _siteEditSid='';
function loadCardIdx(){
  if(_cardIdx) return Promise.resolve(_cardIdx);
  return fbDb.ref('pucards/idx').once('value').then(function(s){
    var v=s.val()||{};
    /* 사업자등록증(biz)과 명함(card)을 모두 담는다 — 부르는 쪽이 골라 쓴다.
       명함에는 사람(이름·직위·휴대폰·이메일)이, 사업자등록증에는 회사(번호·대표자·업태)가 있다. */
    _cardIdx=Object.keys(v).map(function(k){ var r=v[k]||{}; r._id=k; return r; })
      .filter(function(r){ return (r.k==='biz'||r.k==='card')&&(r.c||r.bz||r.n); });
    return _cardIdx;
  });
}
/* 명함 한 장은 회사 칸이 비어 있는 일이 많다(사업자번호·대표자는 사업자등록증에만 있다).
   그래서 «같은 회사의 사업자등록증»을 찾아 빈 칸을 메운 한 벌을 만든다. */
function _cardNorm(s){ return String(s||'').toLowerCase().replace(/[\s\-㈜()]|주식회사/g,''); }
function cardEffective(r){
  if(!r) return {};
  if(r.k==='biz') return r;
  var key=_cardNorm(r.c); if(!key) return r;
  var biz=(_cardIdx||[]).filter(function(x){ return x.k==='biz'&&_cardNorm(x.c)===key; })[0]||{};
  var out={}; Object.keys(biz).forEach(function(k){ out[k]=biz[k]; });
  Object.keys(r).forEach(function(k){ if(r[k]!=null&&r[k]!=='') out[k]=r[k]; });
  return out;
}
/* ══ 기업 상세(pucards/coInfo) — 회사 «한 칸만» 읽는다 ══
   기업정보함의 「기업 상세」(4,143곳)는 따로 쌓인 자료가 아니다. 사업자등록증 + 명함 +
   회사별 딸림정보(coInfo)를 그때그때 합쳐 보여 주는 «화면»이다. 앞의 둘은 검색목록
   (idx)에 이미 있으니 여기서 마저 가져올 것은 세 번째다 — 상시근로자수·업종·홈페이지·
   개업일·기업규모처럼 «사업자등록증에는 없고» 서식·포털 화면에서 읽힌 값들이다.
   ⚠ coInfo 에는 회사가 4,000곳 담긴다. 통째로 내려받으면 창을 열 때마다 1MB 가까이
     든다 — 기업정보함이 통째 구독을 건별로 바꾼 것과 «같은 이유»다. 그래서 고른 그 회사
     한 칸(많아야 두 칸)만 읽고, 쓸 칸만 남기고 버린다(폴더·태그·서류목록은 안 쓴다).
   ⚠ 읽기 전용이다. 기금관리는 기업정보함에 아무것도 쓰지 않는다. */
var CO_KEYMAP=[['bizno','bz'],['ceo','ceo'],['corpno','cno'],['address','ad'],['companyTel','ct'],
  ['mobile','m'],['email','e'],['homepage','w'],['bizType','bt'],['bizItem','bi'],
  ['openDate','od'],['smeType','sme'],['workers','wk'],['sales','sl'],['product','pd']];
/* ⚠ 이 이름 다듬기는 기업정보함(pu-cards.html 의 _norm)과 «글자 하나까지» 같아야 한다 —
   coInfo 의 열쇠가 그 꼴로 만들어져 있어서, 다르게 다듬으면 조용히 못 찾는다.
   (기금 이름끼리 맞추는 _cardNorm 과는 «다른» 자다 — 섞어 쓰면 안 된다.) */
function _coNorm(s){ return String(s||'').replace(/\s|\(주\)|주식회사|㈜/g,'').replace(/[.#$/[\]]/g,'').toLowerCase(); }
function cardCoKey(r){
  var d=String((r&&r.bz)||'').replace(/\D/g,'');
  return d.length>=10 ? d : ('n'+_coNorm((r&&r.c)||''));
}
var _coCache={};
function loadCardCo(r){
  var key=cardCoKey(r); if(!key||key==='n') return Promise.resolve({});
  if(_coCache[key]) return Promise.resolve(_coCache[key]);
  /* 사업자등록증이 «나중에» 들어온 회사는 옛 이름 열쇠에 값이 남아 있다. 기업정보함이
     읽을 때 두 열쇠를 합쳐 보여 주는 것과 같게 한다(coEffectiveExtra).
     이름 열쇠가 «아래», 번호 열쇠가 «위»다. */
  var nameKey='n'+_coNorm((r&&r.c)||'');
  var keys=(nameKey!=='n'&&nameKey!==key)?[nameKey,key]:[key];
  return Promise.all(keys.map(function(k){
    return fbDb.ref('pucards/coInfo/'+k).once('value').then(function(sn){ return sn.val()||{}; })
      .catch(function(){ return {}; });
  })).then(function(vals){
    var out={};
    vals.forEach(function(v){ CO_KEYMAP.forEach(function(p){
      var x=String((v||{})[p[0]]==null?'':v[p[0]]).trim(); if(x) out[p[1]]=x; }); });
    _coCache[key]=out; return out;
  }).catch(function(){ return {}; });
}
/* 카드 한 장을 «기업정보함이 아는 전부»로 부풀린다 —
   명함 → 같은 회사 사업자등록증 → 기업 상세. 앞의 것이 위다
   (사람이 직접 적은 카드가 딸림정보보다 믿을 만하다). */
function cardFull(r){
  var e=cardEffective(r);
  return loadCardCo(e).then(function(co){
    var out={}; Object.keys(co).forEach(function(k){ out[k]=co[k]; });
    Object.keys(e).forEach(function(k){ if(e[k]!=null&&e[k]!=='') out[k]=e[k]; });
    return out;
  });
}

/* ══ 기업정보함 가져오기 — 쓰는 곳마다 «어디에 넣을지»만 다르다 ══
   fill : 열려 있는 폼의 빈 칸을 채운다(기금 정보). map = [카드칸, 화면 id, 이름]
   make : 고른 값으로 새 창을 채워 띄운다(참여사업장 추가). map = [카드칸, 만들 자료의 칸]
   새로 쓸 곳이 생기면 여기 한 줄만 더한다 — 목록·검색·명함 보강은 공용이다. */
/* 참여사업장 한 벌을 채우는 짝 — 「추가」와 「편집」이 같은 짝을 쓴다.
   한쪽만 늘리면 추가할 때는 들어오는 값이 편집할 때는 안 들어온다. */
var SITE_CARD_MAP=[['c','name'],['ceo','ceo'],['bz','biz_no'],['cno','corp_no'],
  ['bt','biz_type'],['wk','company_size'],['sl','sales'],['ad','address'],
  ['n','_c_name'],['ti','_c_position'],['m','_c_mobile'],['e','_c_email']];
/* ══════════ 참여사업장 일괄 채우기 (대표 지시 2026-09-05) ══════════
   「기업정보함의 정보를 여기서 찾아서 넣을 수 있게 하고 한꺼번에 넣을 수 있게 해라」
   16개사를 하나씩 열어 고치는 대신, 기업정보함과 한 번에 맞춰 «빈 칸만» 채운다.

   ⚠ 짝짓기는 기금 일괄(_cardMatch)과 «같은 규칙»이다 — ① 사업자등록번호가 맞으면 그것으로
     ② 없으면 이름이 «완전히» 같을 때만. 부분일치를 쓰면 「대산이노텍」과 「대산이노텍산업」이
     섞인다. 후보가 둘 이상이면 그 사업장은 건너뛴다.
   ⚠ 사업자번호는 «숫자만» 비교한다 — 명부는 412-81-12595, 카드는 4128112595 처럼 적힌다. */
var SITE_BULK=[['ceo','대표자'],['biz_no','사업자등록번호'],['corp_no','법인등록번호'],
  ['biz_type','업종'],['company_size','상시근로자수'],['sales','직전년도 매출액'],['address','소재지']];
var SITE_BULK_C=[['name','담당자'],['position','직위'],['mobile','휴대폰'],['email','이메일']];
/* 사업장 하나에 맞는 기업정보함 카드 — 못 고르면 null(짐작으로 넣지 않는다).
   숫자만 남기는 일은 아래 _digits 를 그대로 쓴다(같은 것을 또 만들지 않는다). */
/* 사업장 전체를 기업정보함과 맞춰 «빈 칸만» 채운다 — 넣기 전에 표로 보여 준다 */
function bulkSiteCards(){
  if(!_cardIdx){
    toast('기업정보함을 읽는 중…');
    loadCardIdx().then(bulkSiteCards).catch(function(e){ toast('기업정보함을 읽지 못했습니다: '+((e&&e.message)||e),'err'); });
    return;
  }
  var fid=S.fundId, m=S.sites||{};
  var arr=Object.keys(m).map(function(k){ return Object.assign({_id:k},m[k]); })
    .filter(function(x){ return x.status!=='closed'; });
  if(!arr.length){ toast('참여사업장이 없습니다','warn'); return; }
  var plan=[], rows=[], cnt=0, noCard=[];
  arr.forEach(function(site){
    var card=_siteCardMatch(site,_cardIdx);
    if(!card){ noCard.push(site.name||'(이름 없음)'); return; }
    var e=cardEffective(card);                       // 명함이면 같은 회사 등록증으로 보강
    var cell={}, any=false;
    SITE_BULK.forEach(function(c){
      if(String(site[c[0]]||'').trim()) return;      // 이미 적힌 값은 건드리지 않는다
      var k=(SITE_CARD_MAP.filter(function(p){ return p[1]===c[0]; })[0]||[])[0];
      var v=k?String(e[k]||'').trim():'';
      if(!v) return;
      cell[c[0]]=v; cnt++; any=true;
      plan.push({sid:site._id,name:site.name,key:c[0],val:v});
    });
    /* 담당자는 «대표 연락처가 비어 있을 때»만 — 사람을 바꿔치기하면 안 된다 */
    var pc=_primaryContact(site).c;
    if(!String(pc.name||'').trim()&&!String(pc.mobile||'').trim()){
      var con={}, got=false;
      SITE_BULK_C.forEach(function(c){
        var k=(SITE_CARD_MAP.filter(function(p){ return p[1]==='_c_'+c[0]; })[0]||[])[0];
        var v=k?String(e[k]||'').trim():'';
        if(v){ con[c[0]]=v; got=true; }
      });
      if(got){ cnt+=Object.keys(con).length; any=true;
        cell._c=con.name||'';
        plan.push({sid:site._id,name:site.name,key:'_contact',val:con}); }
    }
    if(any) rows.push({name:site.name,card:card.c,cell:cell});
  });
  if(!plan.length){
    toast(noCard.length? '채울 빈 칸이 없습니다 (짝지을 카드 없음 '+noCard.length+'곳)'
                       : '기업정보함에서 채울 빈 칸이 없습니다','warn');
    return;
  }
  showModal('<div class="row" style="margin:0 0 6px"><h2 style="margin:0">🏢 기업정보함에서 일괄 채우기</h2>'
    +'<span class="muted" style="font-size:11.5px">참여사업장 '+rows.length+'곳 · '+cnt+'칸</span>'+hlp('bulk.site')+'</div>'
    +(noCard.length?'<p class="muted" style="font-size:11.5px;margin:0 0 8px">짝지을 카드가 없어 제외 '+noCard.length+'곳: '
      +esc(noCard.slice(0,8).join(', '))+(noCard.length>8?' 외':'')+'</p>':'')
    +'<div style="max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px"><table style="font-size:11.5px"><thead><tr>'
    +'<th>사업장</th><th>기업정보함 카드</th>'+SITE_BULK.map(function(c){return '<th>'+c[1]+'</th>';}).join('')
    +'<th>담당자</th></tr></thead><tbody>'
    +rows.map(function(r){
      return '<tr><td style="font-weight:600;white-space:nowrap">'+esc(r.name||'')+'</td>'
        +'<td class="muted" style="white-space:nowrap">'+esc(r.card||'')+'</td>'
        +SITE_BULK.map(function(c){ var v=r.cell[c[0]];
          return '<td'+(v?'':' class="muted"')+' style="white-space:nowrap">'+(v?esc(v):'—')+'</td>'; }).join('')
        +'<td'+(r.cell._c?'':' class="muted"')+' style="white-space:nowrap">'+(r.cell._c?esc(r.cell._c):'—')+'</td></tr>';
    }).join('')+'</tbody></table></div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:14px"><button onclick="closeM()">취소</button>'
    +'<button class="primary" onclick="applyBulkSites()">'+cnt+'칸 채우기</button></div>',{width:1040});
  window._sitePlan={fid:fid,plan:plan};
}
/* 넣는 «순간» 서버 값을 다시 본다 — 미리보기와 적용 사이에 누가 채웠을 수 있다 */
function applyBulkSites(){
  var P=window._sitePlan; window._sitePlan=null;
  if(!P||!P.plan.length){ closeM(); return; }
  var fid=P.fid;
  fbDb.ref(NS+'/sites/'+fid).once('value').then(function(sn){
    var cur=sn.val()||{}, up={}, n=0, skip=0;
    P.plan.forEach(function(p){
      var site=cur[p.sid]; if(!site) return;
      if(p.key==='_contact'){
        var pc=_primaryContact(site);
        if(String((pc.c||{}).name||'').trim()||String((pc.c||{}).mobile||'').trim()){ skip++; return; }
        var list=pc.list.slice();
        var item=Object.assign({isPrimary:true,phone:''},p.val);
        if(pc.idx>=0) list[pc.idx]=Object.assign({},list[pc.idx],item); else list.unshift(item);
        up[p.sid+'/contacts']=list; n++;
        return;
      }
      if(String(site[p.key]||'').trim()){ skip++; return; }     // 그 사이 누가 채웠다
      up[p.sid+'/'+p.key]=p.val; n++;
    });
    if(!n){ closeM(); toast('그 사이 모두 채워져 넣을 것이 없습니다','warn'); return; }
    return fbDb.ref(NS+'/sites/'+fid).update(up).then(function(){
      S.sitesFor=null; closeM();
      _audit(fid,'참여사업장 일괄 채움','기업정보함 '+n+'칸'+(skip?' (건너뜀 '+skip+')':''));
      if(S.fundId===fid) renderFund();
      toast(n+'칸을 채웠습니다'+(skip?' · '+skip+'칸은 이미 있어 그대로':''));
    });
  }).catch(function(e){ toast('실패: '+((e&&e.message)||e),'err'); });
}
function _siteCardMatch(site,idx){
  var biz=(idx||[]).filter(function(r){ return r.k==='biz'&&String(r.c||'').trim(); });
  var d=_digits(site.biz_no);
  if(d.length>=10){
    var byNo=biz.filter(function(r){ return _digits(r.bz)===d; });
    if(byNo.length===1) return byNo[0];
    if(byNo.length>1) return null;                       // 같은 번호가 둘이면 사람이 볼 일이다
  }
  var key=_cardFundKey(site.name);
  if(key.length<3) return null;                          // 너무 짧은 이름은 아무거나 걸린다
  var byName=biz.filter(function(r){ return _cardFundKey(r.c)===key; });
  return byName.length===1 ? byName[0] : null;
}
var CARD_TARGETS={
  info:{ t:'기금 정보', mode:'fill', kinds:['biz'], help:'info.card',
    map:[['c','fd-name','기금법인명'],['bz','fd-tax_id_no','고유번호'],['cno','fd-corp_reg_no','법인등록번호'],
         ['ceo','fd-chairman','대표자'],['ad','fd-address','소재지'],['ct','fd-phone','전화']] },
  /* 새 기금 등록 창 — 창 «안»이라 refill 이다. 등록 창에는 고유번호·대표자 칸이 없지만
     값을 버리지 않는다. 등록되는 순간 그 기금에 함께 실려 들어간다 — 버리면
     등록하자마자 기금 정보에서 똑같은 것을 또 쳐야 한다. */
  newfund:{ t:'새 기금 등록', mode:'refill', kinds:['biz'], help:'newfund.card', need:'c', width:760,
    map:[['c','name'],['bz','tax_id_no'],['cno','corp_reg_no'],['ceo','chairman'],
         ['ad','address'],['ct','phone']],
    read:'_readNewFundForm', open:'_openNewFund' },
  /* need:'c' — 회사 이름이 있는 것만 보여 준다.
     기업정보함에는 회사 없는 개인 명함(변호사·아나운서·관장 …)이 많은데,
     참여사업장은 «회사»라 그런 명함으로는 만들 수 없다. 목록에 올리면 방해만 된다. */
  site:{ t:'참여사업장', mode:'make', kinds:['biz','card'], help:'site.card', need:'c', width:900,
    map:SITE_CARD_MAP },
  siteedit:{ t:'사업장 편집', mode:'refill', kinds:['biz','card'], help:'site.card', need:'c', width:900,
    map:SITE_CARD_MAP,
    read:'_readSiteForm', open:'_openSiteEdit' },
  /* 임원 명부는 «사람»이다 — 명함만 본다. 직위는 등기부를 봐야 아는 것이라
     명함 직책을 그대로 넣지 않고 사람이 고르게 둔다(알림에 직책을 적어 준다). */
  officer:{ t:'임원 명부', mode:'officer', kinds:['card'], help:'officer.card', need:'n', width:760,
    map:[['n','name'],['ti','title']] }
};
/* 등록부(CARD_TARGETS)는 이름만 담는다 — 함수를 직접 담으면 «정의 차례»에 얽히고,
   검사에서 등록부만 따로 떼어 읽을 수도 없다. 쓸 때 이름으로 찾는다. */
function _cardFn(name){
  var f=name&&(typeof window!=='undefined')&&window[name];
  return (typeof f==='function')?f:null;
}
function _openNewFund(pre){ newFund(pre); }
function _openSiteEdit(pre){ editSite(_cardPick.sid||'',pre); }
/* 지금 화면의 폼을 그대로 걷어 온다 — 창을 다시 열 때 «치던 값»이 사라지지 않게 */
function _readSiteForm(){
  var o={};
  SITE_FIELDS.forEach(function(c){ var el=$('se-'+c[0]); if(el) o[c[0]]=el.value; });
  var cv={}; CONTACT_FIELDS.forEach(function(c){ var el=$('sc-'+c[0]); if(el) cv[c[0]]=el.value.trim(); });
  if(cv.name||cv.mobile||cv.email||cv.position) o.contacts=[Object.assign({isPrimary:true},cv)];
  return o;
}
function _readNewFundForm(){
  var g=function(id){ var el=$(id); return el?String(el.value||'').trim():''; };
  var o={ name:g('nf-name'), short_name:g('nf-short'), fund_type:g('nf-type'),
          region:g('nf-region'), entry_mode:g('nf-entry') };
  var sel=$('nf-mgr');
  if(sel&&sel.value){ var op=sel.options[sel.selectedIndex];
    o.mgr_sid=sel.value; o.mgr_name=op.getAttribute('data-name')||op.text; }
  var tx=$('nf-mgr-text'); if(tx&&tx.value.trim()) o.mgr_text=tx.value.trim();
  /* 앞서 기업정보함에서 실어 둔 값(칸이 없는 것들)도 함께 넘긴다 — 두 번 골라도 안 잃는다 */
  if(_nfCard) Object.keys(_nfCard).forEach(function(k){ if(!o[k]) o[k]=_nfCard[k]; });
  return o;
}
function openCardPick(key){
  var T=CARD_TARGETS[key||'info']; if(!T){ toast('알 수 없는 대상입니다','err'); return; }
  /* 창 «안»의 폼에서 왔으면(refill) 고르든 그만두든 그 창으로 돌아가야 한다 —
     창은 겹쳐 뜨지 않는다. 그래서 지금 적힌 값을 미리 걷어 쥐고 연다. */
  var back=null;
  var _read=_cardFn(T.read), _open=_cardFn(T.open);
  if(T.mode==='refill'&&_read&&_open){ var snap=_read(); back=function(){ _open(snap); }; }
  _cardPick={q:'',items:[],fid:S.fundId,key:(key||'info'),sid:_siteEditSid,back:back};
  var foot=T.mode==='make'?'고르면 <b>채워진 창</b>이 열림'
          :T.mode==='officer'?'고르면 명부에 <b>줄이 하나</b> 생김 · 직위는 고르세요'
          :T.mode==='refill'?'<b>빈 칸만</b> 채워 원래 창으로 돌아감'
          :'<b>빈 칸만</b> 채움 · 저장은 따로';
  showModal('<div class="row" style="margin:0 0 8px"><h2 style="margin:0">🏢 기업정보함에서 '+(T.mode==='make'?'추가':'당겨오기')+'</h2>'
    +'<span class="muted" style="font-size:11.5px">'+esc(T.t)+'</span>'+hlp(T.help)
    +'<span style="flex:1"></span>'+(back?'<button onclick="closeM()">← 돌아가기</button>':'')+'</div>'
    +'<input id="cardq" class="search" style="width:100%" placeholder="회사·사람 이름 또는 번호로 찾기" oninput="renderCardPick()">'
    +'<div id="cardbody" style="max-height:56vh;overflow:auto;margin-top:10px">'+loadingHTML('기업정보함을 읽는 중…')+'</div>'
    +'<p class="muted" style="font-size:11px;margin:8px 0 0">'+foot+'</p>'
    ,{width:T.width||640,
      /* 그만두어도(× · 바깥 누르기 · 돌아가기) 치던 값 그대로 원래 창을 되연다 */
      onclose:function(){ var b=_cardPick.back; _cardPick.back=null; if(b) b(); }});   // 칸이 많은 목록은 넓게 — 좁으면 회사 이름이 세로로 깨진다
  loadCardIdx().then(function(){ if($('cardbody')) renderCardPick(); })
    .catch(function(e){ var b=$('cardbody');
      if(b) b.innerHTML='<div class="msg err">기업정보함을 읽지 못했습니다: '+esc((e&&e.message)||e)
        +'<div class="muted" style="font-size:11.5px;margin-top:6px">기업정보함(기업정보함)에 사업자등록증·명함이 등록돼 있어야 합니다.</div></div>'; });
}
function renderCardPick(){
  var b=$('cardbody'); if(!b) return;
  var T=CARD_TARGETS[_cardPick.key]||CARD_TARGETS.info;
  var q=(($('cardq')||{}).value||'').trim().toLowerCase();
  var norm=_cardNorm;
  var list=(_cardIdx||[]).filter(function(r){
    if(T.kinds.indexOf(r.k)<0) return false;                       // 이 자리에서 쓸 종류만
    if(T.need && !String(r[T.need]||'').trim()) return false;      // 그 자리에 꼭 필요한 칸이 빈 것은 제외
    if(!q) return true;
    return norm(r.c).indexOf(norm(q))>=0 || norm(r.n).indexOf(norm(q))>=0
      || String(r.bz||'').replace(/\D/g,'').indexOf(q.replace(/\D/g,''))>=0;
  });
  /* 같은 회사의 명함이 여러 장이면 목록이 회사 하나로 도배된다 —
     사업자등록증 한 장 + 명함은 회사당 한 장만 남긴다(사람은 창에서 바꿀 수 있다). */
  if(T.mode==='make'){
    var seen={};
    list=list.filter(function(r){
      if(r.k==='biz') return true;
      var k=norm(r.c); if(!k) return true;
      if(seen[k]) return false; seen[k]=1; return true;
    });
  }
  // 지금 기금 이름과 닮은 것을 위로, 그다음 사업자등록증을 명함보다 위로
  var f=funds[_cardPick.fid]||{}, key=norm(f.name||f.short_name||'');
  list=list.slice().sort(function(a,b2){
    if(key.length>1){
      var A=(norm(a.c).indexOf(key)>=0||key.indexOf(norm(a.c))>=0)?0:1;
      var B=(norm(b2.c).indexOf(key)>=0||key.indexOf(norm(b2.c))>=0)?0:1;
      if(A!==B) return A-B;
    }
    var ka=(a.k==='biz')?0:1, kb=(b2.k==='biz')?0:1;
    if(ka!==kb) return ka-kb;
    return norm(a.c).localeCompare(norm(b2.c));
  });
  if(!list.length){ b.innerHTML='<div class="muted" style="padding:18px 4px;text-align:center">'
    +(q?'찾는 이름이 없습니다.':'기업정보함에 등록된 자료가 없습니다.')+'</div>'; return; }
  var many=T.kinds.length>1;
  /* 칸이 좁으면 「주식회사 ○○산업」이 한 글자씩 세로로 깨진다 —
     각 칸의 최소 폭을 정하고, 줄바꿈은 소재지 한 곳에서만 말줄임으로 처리한다. */
  var nw='white-space:nowrap';
  b.innerHTML='<div style="overflow-x:auto"><table style="table-layout:auto;min-width:100%"><thead><tr>'
    +(many?'<th style="'+nw+'">종류</th>':'')+'<th style="'+nw+'">회사</th>'+(many?'<th style="'+nw+'">담당자</th>':'')
    +'<th style="'+nw+'">사업자번호</th><th style="'+nw+'">대표자</th><th class="mo">소재지</th><th></th></tr></thead><tbody>'
    +list.slice(0,80).map(function(r){
      var e=cardEffective(r);   // 명함이면 같은 회사 사업자등록증으로 빈 칸을 메운 값
      return '<tr>'
        +(many?'<td style="'+nw+'">'+(r.k==='biz'?'<span class="chip ok" style="font-size:10px">사업자</span>'
                                 :'<span class="chip" style="font-size:10px">명함</span>')+'</td>':'')
        +'<td style="font-weight:700;'+nw+'">'+esc(r.c||'—')+'</td>'
        +(many?'<td style="'+nw+'">'+(r.n?esc(r.n)+(r.ti?' <span class="muted" style="font-size:11px">'+esc(r.ti)+'</span>':''):'—')+'</td>':'')
        +'<td style="'+nw+'">'+esc(e.bz||'—')+'</td><td style="'+nw+'">'+esc(e.ceo||'—')+'</td>'
        +'<td class="muted mo" style="max-width:260px;overflow:hidden;text-overflow:ellipsis;'+nw+'" title="'+esc(e.ad||'')+'">'+esc(e.ad||'—')+'</td>'
        +'<td style="'+nw+'"><button class="primary" onclick="applyCard(\''+r._id+'\')" style="padding:3px 10px">'
        +(T.mode==='make'?'추가':'당겨오기')+'</button></td></tr>';
    }).join('')+'</tbody></table></div>'
    +(list.length>80?'<p class="muted" style="font-size:11px;margin:6px 0 0">'+list.length+'건 중 80건만 표시 — 검색으로 좁히세요.</p>':'');
}
/* 기금 정보 칸 짝 — 옛 이름을 남겨 둔다(검사·다른 코드가 이 이름을 본다) */
var CARD_MAP=CARD_TARGETS.info.map;
function applyCard(id){
  var r=(_cardIdx||[]).filter(function(x){return x._id===id;})[0]; if(!r) return;
  if(S.fundId!==_cardPick.fid){ toast('기금이 바뀌었습니다 — 다시 골라 주세요','warn'); closeM(); return; }
  /* 기업 상세는 «고른 뒤에» 한 칸만 읽는다(목록에는 필요 없다). 잠깐 걸리므로
     그동안 목록을 「읽는 중」으로 바꿔 두 번 눌리지 않게 한다. */
  var b=$('cardbody'); if(b) b.innerHTML=loadingHTML('기업 상세까지 읽는 중…');
  cardFull(r).then(function(e){ _applyCardValues(r,e); })
    .catch(function(err){ toast('가져오지 못했습니다: '+((err&&err.message)||err),'err');
      if($('cardbody')) renderCardPick(); });
}
/* 값 한 벌을 «빈 칸만» 채워 넣는다 — 새로 만들 때(make)와 다시 열 때(refill)가 함께 쓴다.
   _c_ 로 시작하는 자리는 담당자(대표 연락처) 칸이다. */
function _cardIntoRec(T,e,base){
  var rec={}, con={}, got=0;
  Object.keys(base||{}).forEach(function(k){ rec[k]=base[k]; });
  var pc=_primaryContact(rec).c;
  Object.keys(pc).forEach(function(k){ con[k]=pc[k]; });
  T.map.forEach(function(m){
    var v=String(e[m[0]]||'').trim(); if(!v) return;
    if(m[1].indexOf('_c_')===0){ var ck=m[1].slice(3);
      if(!String(con[ck]||'').trim()){ con[ck]=v; got++; } }
    else if(!String(rec[m[1]]||'').trim()){ rec[m[1]]=v; got++; }
  });
  if(con.name||con.mobile||con.email||con.position) rec.contacts=[Object.assign({isPrimary:true},con)];
  return {rec:rec,got:got};
}
function _applyCardValues(r,e){
  var T=CARD_TARGETS[_cardPick.key]||CARD_TARGETS.info;

  /* make — 고른 값으로 새 창을 채워 띄운다.
     창을 겹쳐 띄우면 뒤 창이 망가지므로, 먼저 닫고 «채워진 창»을 새로 연다. */
  if(T.mode==='make'){
    var mk=_cardIntoRec(T,e,{});
    if(!mk.got){ toast('가져올 값이 없는 카드입니다','warn'); renderCardPick(); return; }
    mk.rec.pucard_id=r._id;                       // 어디서 왔는지 남긴다(나중에 되짚기용)
    _cardPick.back=null; closeM();
    editSite('',mk.rec);
    toast('기업정보함에서 '+mk.got+'칸 채웠습니다 — 확인하고 [저장]');
    return;
  }

  /* refill — 창 «안»의 폼이다. 걷어 둔 값에 빈 칸만 메워 같은 창을 다시 연다. */
  if(T.mode==='refill'){
    var _rd=_cardFn(T.read), _op=_cardFn(T.open);
    var rf=_cardIntoRec(T,e,_rd?_rd():{});
    _cardPick.back=null; closeM();
    if(_op) _op(rf.rec);
    toast(rf.got?('기업정보함에서 '+rf.got+'칸 채웠습니다 — 확인하고 [저장]')
                :'채울 빈 칸이 없습니다(이미 다 적혀 있음)');
    return;
  }

  /* officer — 임원 명부에 줄을 하나 더한다. 직위는 등기부를 봐야 아는 것이라 안 정한다. */
  if(T.mode==='officer'){
    var nm=String(e.n||'').trim();
    if(!nm){ toast('이름이 없는 명함입니다','warn'); renderCardPick(); return; }
    _cardPick.back=null; closeM();
    var body=$('off-rows');
    if(!body){ toast('임원 명부가 열려 있지 않습니다','warn'); return; }
    var names=[].slice.call(body.querySelectorAll('.off-name'));
    /* 두 번 눌러 같은 사람이 두 줄 생기는 일이 잦다 — 이미 있으면 안 넣는다 */
    if(names.some(function(i){ return i.value.trim()===nm; })){
      toast('이미 명부에 있는 이름입니다: '+nm,'warn'); return; }
    var slot=names.filter(function(i){ return !i.value.trim(); })[0];
    if(!slot){ addOfficerRow();
      var rows=body.querySelectorAll('.off-name'); slot=rows[rows.length-1]; }
    if(!slot){ toast('명부에 줄을 넣지 못했습니다','err'); return; }
    slot.value=nm; try{ slot.focus(); }catch(_e){}
    markDirty();
    toast(nm+' 넣음 — 직위를 골라 주세요'+(e.ti?' (명함 직책: '+e.ti+')':''));
    return;
  }

  /* fill — 열려 있는 폼의 «빈 칸만» 채운다 */
  var filled=[], skipped=[];
  T.map.forEach(function(m){
    var v=String(e[m[0]]||'').trim(); if(!v) return;
    var el=$(m[1]); if(!el) return;
    if(String(el.value||'').trim()){ skipped.push(m[2]); return; }   // 이미 적힌 값은 건드리지 않는다
    el.value=v; filled.push(m[2]);
  });
  _cardPick.back=null; closeM();
  if(filled.length){ markDirty();
    toast(filled.join('·')+' 채움'+(skipped.length?' · '+skipped.length+'칸은 이미 있어 그대로':'')+' — [💾 저장] 누르세요'); }
  else toast(skipped.length?'채울 빈 칸이 없습니다(이미 다 적혀 있음)':'가져올 값이 없는 카드입니다','warn');
}
/* 서류 한 종류 = 한 칸. 끌어놓기 칸 안에 사진첩·원본 버튼과 상태를 같이 넣어
   세 칸이 한 줄에 들어가게 했다(예전에는 칸마다 3줄 + 버튼 줄이 따로였다). */
/* ⚠ 원본이 «이미 붙어 있으면» 이름을 눌렀을 때 그 원본을 연다.
     전에는 붙어 있어도 누르면 «다시 고르기»가 열렸다. 그래서 넣어 둔 서류를 화면으로
     확인할 길이 사실상 없었고 — 값이 어디서 왔는지 되짚지 못했다.
     서류를 보고 값을 맞춰 보는 일이 이 화면의 본디 쓰임이다.

     바꿔 넣을 일도 있으므로 [↻ 바꾸기]를 따로 둔다 — 누르는 곳을 갈라 놓아야
     확인하려다 실수로 새 파일을 고르는 일이 없다. */
function docZoneOne(zid,kind,label,hint){
  var f=funds[S.fundId]||{}, r=(f.scans||{})[kind];
  var seeTitle=r?('클릭하면 넣어 둔 원본을 봅니다 — '+r.year+'년 · 연결 '+(r.at||'')):(label+' — '+hint+' · 끌어다 놓기 또는 클릭해 선택');
  return '<span style="display:inline-flex;align-items:center;gap:6px;border:1px '+(r?'solid var(--acc-soft)':'dashed var(--line)')+';border-radius:8px;'
    +'padding:5px 9px;background:var(--bg);max-width:100%">'
    +'<span id="'+zid+'" class="dropz" ondragover="dzOver(event,1)" ondragleave="dzOver(event,0)" ondrop="dzDrop(event,\''+zid+'\')" '
    +'onclick="'+(r?'openScan(\''+kind+'\')':'dzPick(\''+zid+'\',\'.pdf,image/*\')')+'" title="'+esc(seeTitle)+'" '
    +'style="display:inline-flex;align-items:center;gap:5px;cursor:pointer;border-radius:6px;padding:1px 3px">'
    +'<b style="font-size:12px;white-space:nowrap">'+(r?'📎 ':'⬇ ')+esc(label)+'</b>'
    +'<span id="'+zid+'-stat" style="font-size:11px"></span></span>'
    +(r?'<button onclick="dzPick(\''+zid+'\',\'.pdf,image/*\')" title="다른 파일로 바꿔 넣기" style="padding:1px 6px;font-size:11px">↻</button>':'')
    +'<button onclick="openAlbumPick(\''+zid+'\',\''+kind+'\')" title="푸른사진첩에서 고르기" style="padding:1px 6px;font-size:11px">🖼</button>'
    +(r?'<button onclick="openScan(\''+kind+'\')" class="primary" '
       +'title="'+esc('연결된 원본 보기 — '+r.year+'년 · '+(r.at||''))+'" '
       +'style="padding:1px 8px;font-size:11px;white-space:nowrap">보기</button>':'')
    +'</span>';
}
/* ══ 정관 칸 — 다른 셋과 달리 «전문»을 보관하므로 단추가 하나 더 있다(📄 전문) ══ */
function charterZone(){

    +((r||top)?'<button onclick="dzPick(\'dz-charter\',\'.pdf,image/*\')" title="다른 파일로 바꿔 넣기" style="padding:1px 6px;font-size:11px">↻</button>':'')
    +'<button onclick="openAlbumPick(\'dz-charter\',\'charter\')" title="푸른사진첩에서 고르기" style="padding:1px 6px;font-size:11px">🖼</button>'
    +(r?'<button onclick="openScan(\'charter\')" class="primary" title="'+'연결된 원본 보기'+'" style="padding:1px 8px;font-size:11px;white-space:nowrap">보기</button>':'')
    +(top?'<button onclick="openCharterText(\''+top.id+'\')" title="읽어 둔 정관 전문 보기'
