function initTop(){

  var WD=['일','월','화','수','목','금','토'];function p(n){return(n<10?'0':'')+n;}
  function tick(){var c=$('topclock');if(!c)return;var d=new Date();c.textContent=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' ('+WD[d.getDay()]+') '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}

}

  catch(e){ location.href=PORTAL_URL; } }

function go(v,id){ S.view=v; if(id!==undefined)S.fundId=id; if(v==='fund')S.tab='info'; route(); }
function route(){
  ['home','ledger','billing','forms'].forEach(function(v){var n=$('nav-'+v);if(n)n.className='sitem'+(S.view===v?' on':'');});
  if(S.view==='fund'&&S.fundId&&funds[S.fundId]) renderFund();
  else if(S.view==='ledger') renderLedger();
  else if(S.view==='billing') renderBilling();
  else if(S.view==='forms') renderForms();
  else { S.view='home'; renderHome(); }
}

function patchFund(id,field,val){
  val=val.trim?val.trim():val;
  fbDb.ref(NS+'/funds/'+id+'/'+field).set(val).then(function(){
    funds[id][field]=val; var b=$('lc-'+id); if(b){var n=nDone(funds[id]);b.textContent=n+'/5';b.className='chip '+(n===5?'ok':n>=3?'warn':'dg');}
  }).catch(function(e){alert('저장 실패: '+e.message);});
}

// ── 서식 자료실 (설립·지원신청서 원본 채움) ──
// 원본 법정서식 엑셀은 실데이터 미포함 빈 양식 → 브라우저 IndexedDB에 1회 저장 후 자동 사용.
// 채움은 ExcelJS(테두리·병합·수식 보존). 통장 파싱용 SheetJS와 별개.
var TPL={ setup:{key:'setup',label:'설립 서식(6종)',file:'2024년 근로복지기금 설립인가신청서 양식_240906.xlsx',gong:false},
          subsidy:{key:'subsidy',label:'지원신청서',file:'2025년 공동근로복지기금지원신청서 양식(폐업 사업장 미포함).xlsx',gong:true} };
var IDB_DB='fundErpTpl', IDB_ST='templates';
function idbOpen(){ return new Promise(function(res,rej){ var r=indexedDB.open(IDB_DB,1);
  r.onupgradeneeded=function(){ r.result.createObjectStore(IDB_ST); };
  r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }); }
function idbPut(k,v){ return idbOpen().then(function(db){ return new Promise(function(res,rej){
  var tx=db.transaction(IDB_ST,'readwrite'); tx.objectStore(IDB_ST).put(v,k);
  tx.oncomplete=function(){res();}; tx.onerror=function(){rej(tx.error);}; }); }); }
function idbGet(k){ return idbOpen().then(function(db){ return new Promise(function(res,rej){
  var tx=db.transaction(IDB_ST,'readonly'); var g=tx.objectStore(IDB_ST).get(k);
  g.onsuccess=function(){res(g.result||null);}; g.onerror=function(){rej(g.error);}; }); }); }
function idbDel(k){ return idbOpen().then(function(db){ return new Promise(function(res){
  var tx=db.transaction(IDB_ST,'readwrite'); tx.objectStore(IDB_ST).delete(k); tx.oncomplete=function(){res();}; }); }); }

function renderForms(){
  $('crumb').textContent='서식 자료실';
  if(typeof ExcelJS==='undefined'){ $('app').innerHTML='<div class="panel"><h1>서식 자료실</h1><div class="msg err">ExcelJS 라이브러리 로드 실패 — 인터넷 연결을 확인하고 새로고침하세요.</div></div>'; return; }
  // 원본 등록 상태 비동기 확인 후 재렌더
  if(S._tplChk!==true){ S._tplChk='...';
    Promise.all([idbGet('setup'),idbGet('subsidy')]).then(function(a){ S._tplHas={setup:!!a[0],subsidy:!!a[1]}; S._tplChk=true; if(S.view==='forms')renderForms(); })
      .catch(function(){ S._tplHas={setup:false,subsidy:false}; S._tplChk=true; if(S.view==='forms')renderForms(); });
    $('app').innerHTML='<div class="panel muted">불러오는 중…</div>'; return; }
  var has=S._tplHas||{};
  var arr=Object.keys(funds).map(function(k){var o=funds[k];return {id:k,label:(o.short_name||o.name||k),type:o.fund_type,g:grp(o),region:o.region};});
  var rpri={'충남':1,'경기':2},order={'지역공동':1,'개별공동':2,'사내':3};
  arr.sort(function(a,b){return (order[a.g]-order[b.g])||((rpri[a.region]||9)-(rpri[b.region]||9))||a.label.localeCompare(b.label,'ko',{numeric:true});});
  if(!S.formFund||!funds[S.formFund]) S.formFund=arr.length?arr[0].id:'';
  var fsel='<select id="form-fund" onchange="S.formFund=this.value;renderForms()" style="padding:6px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;min-width:260px">'
    +arr.map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===S.formFund?' selected':'')+'>'+esc(x.label)+' ('+esc(x.type||'')+')</option>';}).join('')+'</select>';
  var cur=funds[S.formFund]||{}, isGong=(cur.fund_type||'')==='공동';
  function tplCard(t){
    var reg=has[t.key];
    var regLine=reg?'<span class="chip ok">원본 등록됨</span> <button onclick="pickTpl(\''+t.key+'\')" style="padding:3px 8px">원본 교체</button> <button onclick="clearTpl(\''+t.key+'\')" style="padding:3px 8px">삭제</button>'
      :'<span class="chip dg">원본 미등록</span> <button class="primary" onclick="pickTpl(\''+t.key+'\')" style="padding:3px 10px">📎 원본 엑셀 등록</button>';
    var fill='';
    if(reg){
      if(t.gong&&!isGong) fill='<div class="muted" style="font-size:12px;margin-top:8px">지원신청서는 공동근로복지기금 전용입니다. (선택된 기금은 '+esc(cur.fund_type||'?')+')</div>';
      else fill='<button class="primary" style="margin-top:10px" onclick="fillForm(\''+t.key+'\')">⬇ ['+esc(cur.short_name||cur.name||'')+'] '+esc(t.label)+' 데이터 채워 받기</button>';
    }
    return '<div class="panel"><div class="row"><h2 style="font-size:15px">'+esc(t.label)+'</h2><span style="flex:1"></span>'+regLine+'</div>'
      +'<p class="muted" style="font-size:11.5px;margin:6px 0 0">원본 파일: '+esc(t.file)+'</p>'+fill+'</div>';
  }
  $('app').innerHTML='<div class="panel"><div class="row"><h1>서식 자료실</h1><span style="flex:1"></span><label style="font-size:12px;margin-right:6px">대상 기금</label>'+fsel+'</div>'
    +'<div style="margin-top:10px;padding:10px 12px;background:var(--warn-bg);border-radius:8px;font-size:12.5px;line-height:1.6">'
    +'실제 <b>법정서식 원본 엑셀</b>에 이 기금 데이터를 채워 내려받습니다. 서식의 표·수식·서식은 그대로 보존됩니다.<br>'
    +'원본 엑셀은 <b>이 브라우저에 1회 등록</b>하면 이후 자동 사용됩니다(다른 PC·브라우저에서는 다시 등록). 사업장 실데이터가 담기므로 원본은 저장소에 올리지 않습니다.<br>'
    +'채워지지 않는 칸(회의록 안건·서술형 사업목적 등)은 내려받은 엑셀에서 직접 작성하세요.</div></div>'
    +tplCard(TPL.setup)+tplCard(TPL.subsidy);
}
function pickTpl(key){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx';
  inp.onchange=function(ev){ var file=ev.target.files&&ev.target.files[0]; if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){ idbPut(key,rd.result).then(function(){ S._tplChk=false; renderForms(); alert('원본 등록 완료: '+file.name); })
      .catch(function(e){ alert('저장 실패: '+e.message); }); };
    rd.readAsArrayBuffer(file); };
  inp.click();
}
function clearTpl(key){ if(confirm('등록된 원본을 삭제할까요?')) idbDel(key).then(function(){ S._tplChk=false; renderForms(); }); }
function dlBuf(buf,fname){ var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500); }
function _splitPeople(txt){ return String(txt||'').split(/[,\/·]/).map(function(s){return s.trim();}).filter(Boolean); }
function _siteContacts(s){ var c={name:'',phone:'',email:''}; try{ var cts=s.contacts; if(typeof cts==='string')cts=JSON.parse(cts);
  if(Array.isArray(cts)&&cts.length){ c.name=cts[0].name||''; c.phone=cts[0].phone||cts[0].mobile||''; c.email=cts[0].email||''; } }catch(e){} return c; }
function _loadSites(fid){ return fbDb.ref(NS+'/sites/'+fid).once('value').then(function(s){
  var v=s.val()||{}; var a=Object.keys(v).map(function(k){var o=Object.assign({},v[k]);o._id=k;return o;});
  a=a.filter(function(x){return (x.status||'active')==='active';});
  a.sort(function(x,y){return String(x.seq_label||'').localeCompare(String(y.seq_label||''),'ko',{numeric:true});}); return a; }); }
function setC(ws,addr,val){ var c=ws.getCell(addr); if(c.type!==ExcelJS.ValueType.Formula) c.value=(val===''||val==null)?null:val; }
function clearRange(ws,r1,r2,c1,c2){ for(var r=r1;r<=r2;r++)for(var c=c1;c<=c2;c++){ var cell=ws.getCell(r,c);
  if(cell.type!==ExcelJS.ValueType.Formula && cell.value!=null) cell.value=null; } }

function fillForm(key){
  var fid=S.formFund, f=funds[fid]; if(!f){ alert('기금을 선택하세요'); return; }
  idbGet(key).then(function(buf){
    if(!buf){ alert('먼저 원본 엑셀을 등록하세요'); return; }
    return _loadSites(fid).then(function(sites){
      var wb=new ExcelJS.Workbook();
      return wb.xlsx.load(buf).then(function(){
        (key==='setup'?fillSetup:fillSubsidy)(wb,f,sites);
        return wb.xlsx.writeBuffer();
      }).then(function(out){
        var nm=(f.short_name||f.name||fid).replace(/\s+/g,'');
        dlBuf(out, nm+'_'+(key==='setup'?'설립서식':'지원신청서')+'(데이터채움).xlsx');
      });
    });
  }).catch(function(e){ alert('서식 생성 실패: '+e.message); });
}
function fillSetup(wb,f,sites){
  var ws=wb.getWorksheet('기금법인정보'); if(!ws) throw new Error('기금법인정보 시트를 찾을 수 없습니다');
  var wk=_splitPeople(f.worker_committee), er=_splitPeople(f.emp_committee);
  var repSite=f.rep_org||(sites[0]&&sites[0].name)||'';
  setC(ws,'B3',repSite); setC(ws,'C3',f.name||''); setC(ws,'D3',f.chairman||''); setC(ws,'E3',f.address||'');
  setC(ws,'F3',f.inka_date||''); setC(ws,'G3',f.worker_rep||wk[0]||''); setC(ws,'H3',wk[0]||''); setC(ws,'I3',er[0]||'');
  setC(ws,'J3',f.phone||''); ['K3','L3','M3','N3'].forEach(function(a){setC(ws,a,'');});
  var budget=num(f.contribution_total); if(budget) setC(ws,'F13',budget.toLocaleString()+'원');
  if(f.estab_date) setC(ws,'B23',f.estab_date); if(f.meeting_date) setC(ws,'D23',f.meeting_date);
  clearRange(ws,33,38,2,16);   // 회의록 샘플 안건 B~P (수식 제외)
}
function fillSubsidy(wb,f,sites){
  if((f.fund_type||'')!=='공동') throw new Error('지원신청서는 공동근로복지기금 전용입니다');
  var info=wb.getWorksheet('기금법인정보'); if(!info) throw new Error('기금법인정보 시트를 찾을 수 없습니다');
  var yrs=f.years||{}, sub={};
  Object.keys(yrs).sort().reverse().some(function(y){ if(yrs[y]&&yrs[y].subsidy){sub=yrs[y].subsidy;return true;} return false; });
  var workerTotal=num(sub.worker_count)||sites.reduce(function(s,x){return s+(num(x.company_size)||0);},0)||'';
  var contribution=num(f.contribution_total)||num(sub.contribution)||'';
  var applyAmt=num(sub.apply_amount)||contribution||'';
  setC(info,'A2',1); setC(info,'B2',f.name||''); setC(info,'C2',f.chairman||''); setC(info,'D2',f.address||'');
  setC(info,'E2',f.phone||''); setC(info,'F2',f.inka_no||''); setC(info,'G2',f.corp_reg_no||''); setC(info,'H2',f.tax_id_no||'');
  setC(info,'I2',f.reg_date||f.inka_date||''); setC(info,'J2',sites.length||''); setC(info,'K2',workerTotal);
  setC(info,'L2',contribution); setC(info,'N2',applyAmt); setC(info,'S2',f.rep_org||''); setC(info,'T2',sub.author||f.manager||'');
  ['P2','Q2','R2'].forEach(function(a){setC(info,a,'');});
  clearRange(info,3,8,2,20);   // 다른 기금 샘플행 B~T
  var parts=wb.getWorksheet('참여사업장정보'); if(parts){
    sites.forEach(function(s,i){ var r=3+i, c=_siteContacts(s);
      setC(parts,'A'+r,'1-'+(i+1)); parts.getCell(r,2).value=i+1; setC(parts,'C'+r,s.name||''); setC(parts,'D'+r,s.ceo||'');
      setC(parts,'E'+r,s.address||''); var sz=num(s.company_size)||''; if(sz!==''){parts.getCell(r,6).value=sz;parts.getCell(r,10).value=sz;}
      setC(parts,'G'+r,s.biz_type||''); setC(parts,'I'+r,s.biz_no||''); setC(parts,'K'+r,c.name); setC(parts,'N'+r,c.phone); setC(parts,'O'+r,c.email); });
    if(parts.rowCount>=3+sites.length) clearRange(parts,3+sites.length,parts.rowCount,1,20);
  }
  var doc=wb.getWorksheet('신청서'); if(doc){
    setC(doc,'AM3',1); var keys=[];
    doc.getColumn(9).eachCell({includeEmpty:false},function(cell){ if(typeof cell.value==='string'&&/^\d+-\d+$/.test(cell.value.trim())) keys.push(cell); });
    keys.sort(function(a,b){return a.row-b.row;});
    keys.forEach(function(cell,idx){ if(cell.type!==ExcelJS.ValueType.Formula) cell.value=idx<sites.length?('1-'+(idx+1)):null; });
  }
}

function renderFund(){
  var f=funds[S.fundId]; $('crumb').textContent=(f.short_name||f.name);
  var tags=f.fund_type==='사내'?'<span class="tag sanae">사내</span>':'<span class="tag gong">공동</span>';
  var head='<button class="backbtn" onclick="go(\'home\')">← 기금 현황</button>'
    +'<div class="panel"><div class="row"><h1>'+esc(f.short_name||f.name)+'</h1>'+tags
    +'<span style="flex:1"></span><span class="muted">담당 '+esc(f.manager||'—')+'</span></div>'
    +'<div class="kv"><span>인가번호 <b>'+esc(f.inka_no||'—')+'</b></span><span>법인등록번호 <b>'+esc(f.corp_reg_no||'—')+'</b></span>'
    +'<span>고유번호 <b>'+esc(f.tax_id_no||'—')+'</b></span><span>소재지 <b>'+esc(f.address||'—')+'</b></span></div></div>';
  var tabbar='<div class="tabbar">'+TABS.map(function(t){
    if(t[0]==='subsidy'&&f.fund_type==='사내') return '';   // 지원금은 공동 전용
    if(t[2]) return '<div class="tab'+(S.tab===t[0]?' on':'')+'" onclick="S.tab=\''+t[0]+'\';renderFund()">'+t[1]+'</div>';
    return '<div class="tab soon" title="다음 단계에서 추가">'+t[1]+' ·</div>';
  }).join('')+'</div>';
  if(S.tab==='subsidy'&&f.fund_type==='사내') S.tab='info';
  var body = S.tab==='info' ? infoForm(f)
    : S.tab==='sites' ? sitesTab()
    : S.tab==='annual' ? annualTab(f)
    : S.tab==='subsidy' ? subsidyTab(f)
    : S.tab==='welfare' ? welfareTab(f)
    : S.tab==='events' ? eventsTab(f)
    : S.tab==='closing' ? closingTab(f)
    : '<div class="panel muted">이 탭은 다음 단계에서 이전됩니다.</div>';
  $('app').innerHTML=head+tabbar+body;
}
function infoForm(f){

    var v=f[c[0]]||'', inp;
    if(c[2]==='select') inp='<select id="fd-'+c[0]+'">'+['공동','사내'].map(function(o){return '<option'+(v===o?' selected':'')+'>'+o+'</option>';}).join('')+'</select>';

function saveInfo(){
  var patch={};
  FIELDS.forEach(function(c){var el=$('fd-'+c[0]);if(el)patch[c[0]]=el.value.trim?el.value.trim():el.value;});
  fbDb.ref(NS+'/funds/'+S.fundId).update(patch).then(function(){Object.assign(funds[S.fundId],patch);var m=$('msg');m.className='msg ok';m.textContent='저장되었습니다.';})
    .catch(function(e){var m=$('msg');m.className='msg err';m.textContent='저장 실패: '+e.message;});
}

// ── 참여사업장 (2단계) ──
function num(v){ if(v==null||v==='')return ''; if(typeof v==='number')return Math.round(v);
  var s=String(v).trim(), neg=false;
  if(/^\(.+\)$/.test(s)){ neg=true; s=s.slice(1,-1); }            // (1,000) = 음수
  if(/-\s*$/.test(s)){ neg=true; s=s.replace(/-\s*$/,''); }        // 1,000- = 음수
  var plain=s.replace(/,/g,'');
  if(/^[+-]?\d*\.?\d+e[+-]?\d+$/i.test(plain)){ var sci=parseFloat(plain); return isNaN(sci)?'':Math.round(neg?-sci:sci); } // 1E+6 지수표기
  s=s.replace(/[^0-9.\-]/g,''); if(s===''||s==='-'||s==='.')return '';
  var n=Math.round(parseFloat(s)); if(isNaN(n))return ''; return neg?-Math.abs(n):n; }
function sitesTab(){
  if(S.sitesFor!==S.fundId){
    var _fid=S.fundId; S.sitesFor=_fid; S.sites=null;
    fbDb.ref(NS+'/sites/'+_fid).once('value').then(function(s){ if(S.sitesFor!==_fid)return; S.sites=s.val()||{}; if(S.tab==='sites'&&S.view==='fund'&&S.fundId===_fid) renderFund(); })
      .catch(function(e){ if(S.sitesFor===_fid){S.sitesFor=null;} if(S.tab==='sites'&&S.view==='fund') renderFund(); });
    return '<div class="panel muted">불러오는 중…</div>';
  }
  var sites=S.sites||{};
  var arr=Object.keys(sites).map(function(k){var o=Object.assign({},sites[k]);o._id=k;return o;})
    .filter(function(s){return s.status!=='closed';});
  arr.sort(function(a,b){return String(a.seq_label||'').localeCompare(String(b.seq_label||''),'ko',{numeric:true});});
  var totalEmp=arr.reduce(function(s,x){return s+(num(x.company_size)||0);},0);
  var rows=arr.map(function(s,i){
    return '<tr onclick="editSite(\''+s._id+'\')"><td class="no">'+(i+1)+'</td>'
      +'<td style="font-weight:700">'+esc(s.name||'—')+'</td><td>'+esc(s.ceo||'—')+'</td>'
      +'<td>'+esc(s.biz_no||'—')+'</td><td>'+esc(s.biz_type||'—')+'</td>'
      +'<td style="text-align:right">'+(num(s.company_size)||'—')+'</td>'
      +'<td class="muted" style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(s.address||'—')+'</td></tr>';
  }).join('');
  var tbl = arr.length
    ? '<table><thead><tr><th>번호</th><th>상호</th><th>대표자</th><th>사업자번호</th><th>업종</th><th style="text-align:right">상시근로자</th><th>소재지</th></tr></thead><tbody>'+rows+'</tbody></table>'
    : '<div class="muted" style="padding:20px 4px">등록된 참여사업장이 없습니다. [+ 사업장 추가] 또는 [📥 사업장 데이터 가져오기]로 시작하세요.</div>';
  return '<div class="panel"><div class="row"><h2>참여사업장</h2>'
    +'<span class="stat">'+arr.length+'개사</span><span class="stat">상시근로자 '+totalEmp.toLocaleString()+'명</span>'
    +'<span style="flex:1"></span><button class="primary" onclick="editSite(\'\')">+ 사업장 추가</button>'
    +(arr.length?'':' <button onclick="importSites()">📥 사업장 데이터 가져오기</button>')+'</div>'
    +'<div style="margin-top:12px">'+tbl+'</div></div>';
}
function editSite(sid){
  var s=(S.sites&&S.sites[sid])||{}; var isNew=!sid;
  var flds=SITE_FIELDS.map(function(c){return '<div class="fld'+(c[0]==='address'?' full':'')+'"><label>'+c[1]+'</label>'
    +'<input id="se-'+c[0]+'" type="'+c[2]+'" value="'+esc(s[c[0]]||'')+'"></div>';}).join('');
  showModal('<h2 style="margin-bottom:10px">'+(isNew?'사업장 추가':'사업장 편집')+'</h2>'
    +'<div class="grid">'+flds+'</div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:16px">'
    +(isNew?'':'<button onclick="delSite(\''+sid+'\')" style="margin-right:auto;color:var(--danger)">삭제</button>')
    +'<button onclick="closeM()">취소</button><button class="primary" onclick="saveSite(\''+sid+'\')">저장</button></div>');
}
function saveSite(sid){
  var obj=Object.assign({}, (S.sites&&S.sites[sid])||{status:'active'});
  SITE_FIELDS.forEach(function(c){var el=$('se-'+c[0]);if(el)obj[c[0]]=el.value.trim();});
  if(!obj.name){ alert('상호를 입력하세요'); return; }
  var ref = sid ? fbDb.ref(NS+'/sites/'+S.fundId+'/'+sid) : fbDb.ref(NS+'/sites/'+S.fundId).push();
  ref.set(obj).then(function(){ S.sitesFor=null; closeM(); renderFund(); })
    .catch(function(e){ alert('저장 실패: '+e.message); });
}
function delSite(sid){
  if(!confirm('이 사업장을 삭제할까요?')) return;
  fbDb.ref(NS+'/sites/'+S.fundId+'/'+sid).remove().then(function(){ S.sitesFor=null; closeM(); renderFund(); });
}
function importSites(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='application/json';
  inp.onchange=function(ev){ var f=ev.target.files&&ev.target.files[0]; if(!f) return;
    var rd=new FileReader(); rd.onload=function(){
      try{ var data=JSON.parse(rd.result);
        if(!confirm('사업장 데이터를 Firebase로 가져올까요? (기금별 사업장 전체)')) return;
        fbDb.ref(NS+'/sites').update(data).then(function(){ alert('가져오기 완료'); S.sitesFor=null; renderFund(); })
          .catch(function(e){ alert('가져오기 실패: '+e.message); });
      }catch(e){ alert('JSON 파싱 실패: '+e.message); }
    }; rd.readAsText(f);
  };
  inp.click();
}

// ── 연도 선택 (연간/지원금 공용) ──
function yearSel(){
  var y=new Date().getFullYear(), opts='';
  for(var i=y+1;i>=y-3;i--) opts+='<option'+(S.year===i?' selected':'')+'>'+i+'</option>';
  return '<select onchange="S.year=+this.value;S.annualFor=null;renderFund()" style="padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px">'+opts+'</select>';
}
function fmtDeadline(dl){
  if(!dl) return '';
  var base=S.year+dl[0];
  return '기한 '+base+'-'+dl[1];
}

// ── 연간 일정 (2단계) ──
function annualTab(f){
  var key=S.fundId+'/'+S.year;
  if(S.annualFor!==key){
    var _k=key; S.annualFor=_k; S.annual=null;
    fbDb.ref(NS+'/annual/'+S.fundId+'/'+S.year).once('value').then(function(s){ if(S.annualFor!==_k)return; S.annual=s.val()||{}; if(S.tab==='annual'&&S.view==='fund') renderFund(); })
      .catch(function(){ if(S.annualFor===_k)S.annualFor=null; if(S.tab==='annual'&&S.view==='fund') renderFund(); });
    return '<div class="panel muted">불러오는 중…</div>';
  }
  var done=S.annual||{};
  var items=ANNUAL_TMPL.filter(function(t){ return !(t[4] && f.fund_type==='사내'); });  // SUP는 공동만
  var nDone=items.filter(function(t){return done[t[0]]&&done[t[0]].done;}).length;
  var rows=items.map(function(t){
    var d=done[t[0]]&&done[t[0]].done;
    var dl=fmtDeadline(t[3]);
    return '<div style="display:flex;align-items:flex-start;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)'+(d?';opacity:.55':'')+'">'
      +'<input type="checkbox"'+(d?' checked':'')+' onchange="toggleAnnual(\''+t[0]+'\',this.checked)" style="margin-top:3px">'
      +'<div style="flex:1"><div style="font-size:13px;font-weight:600'+(d?';text-decoration:line-through':'')+'">'+esc(t[2])+'</div>'
      +'<div class="muted" style="font-size:11.5px">'+esc(t[1])+(dl?' · <span style="color:var(--warn)">'+dl+'</span>':'')+'</div></div></div>';
  }).join('');
  return '<div class="panel"><div class="row"><h2>연간 일정</h2>'+yearSel()
    +'<span class="stat">진행 '+nDone+'/'+items.length+'</span><span style="flex:1"></span></div>'
    +'<div style="margin-top:10px">'+rows+'</div>'
    +'<p class="muted" style="font-size:11.5px;margin-top:10px">체크하면 완료로 저장됩니다. 운영상황보고(별지15호) 기한은 회계연도 종료 후 3개월(익년 3-31)입니다.</p></div>';
}
function toggleAnnual(code,on){ var _key=S.fundId+'/'+S.year;
  fbDb.ref(NS+'/annual/'+_key+'/'+code).set({done:on,done_date:on?ymd():''})
    .then(function(){ if(S.annualFor===_key){ if(!S.annual)S.annual={}; S.annual[code]={done:on}; } renderFund(); })
    .catch(function(e){ alert('저장 실패: '+e.message); renderFund(); });
}
function ymd(){var d=new Date();function p(n){return(n<10?'0':'')+n;}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}

// ── 지원금 (2단계, 공동 전용) ──
function subsidyTab(f){
  var yd=(f.years&&f.years[S.year]&&f.years[S.year].subsidy)||{};
  // 참여사업장 집계 (S.sites 로드돼 있으면 사용, 아니면 로드)
  if(S.sitesFor!==S.fundId){
    var _fid=S.fundId; S.sitesFor=_fid; S.sites=null;
    fbDb.ref(NS+'/sites/'+_fid).once('value').then(function(s){if(S.sitesFor!==_fid)return;S.sites=s.val()||{};if(S.tab==='subsidy'&&S.view==='fund'&&S.fundId===_fid)renderFund();})
      .catch(function(){if(S.sitesFor===_fid)S.sitesFor=null;if(S.tab==='subsidy'&&S.view==='fund')renderFund();});
    return '<div class="panel muted">불러오는 중…</div>';
  }
  var act=Object.keys(S.sites||{}).map(function(k){return S.sites[k];}).filter(function(s){return s.status!=='closed';});
  var nSite=act.length, nEmp=act.reduce(function(s,x){return s+(num(x.company_size)||0);},0);
  var flds=SUB_FIELDS.map(function(c){
    var v=yd[c[0]]||'';
    return '<div class="fld'+(c[0]==='notice'?' full':'')+'"><label>'+c[1]+'</label><input id="su-'+c[0]+'" type="'+(c[2]==='date'?'date':'text')+'" value="'+esc(v)+'"></div>';
  }).join('');
  var dec=num(yd.decided_amount)||0, sp=num(yd.spent_amount)||0;

function won(n){return (n||0).toLocaleString()+'원';}
function computeFin(arr){
  var yd=(funds[S.fundId]&&funds[S.fundId].years&&funds[S.fundId].years[S.year])||{}, opening=yd.opening||{};
  var appr=arr.filter(function(x){return x.approved&&x.debit&&x.credit;});
  var acc={};
  appr.forEach(function(x){var amt=num(x.deposit)||num(x.withdraw)||0;
    (acc[x.debit]=acc[x.debit]||{d:0,c:0}).d+=amt; (acc[x.credit]=acc[x.credit]||{d:0,c:0}).c+=amt;});
  var tb={}; Object.keys(acc).forEach(function(name){var v=acc[name];
    tb[name]={type:ACCT_CHART[name]||'비용',debit:v.d,credit:v.c,bal_d:Math.max(v.d-v.c,0),bal_c:Math.max(v.c-v.d,0)};});
  // 유형별 전 계정 집계(부호 있는 잔액) — 목록에 없는 계정도 누락 없이 대차가 맞도록
  function sg(a){var v=tb[a]||{debit:0,credit:0};return v.debit-v.credit;}
  var PURPOSE=['경조사비','동호회비','체육문화비','장학금','생활안정자금','기타복지비'];
  var ADMIN=['지급수수료','사무용품비','기타관리비'];
  var CORE_ASSET=['현금성자산','정기예금','근로자대부금'];
  var revenue=0,purpose=0,admin=0,otherExp=0,liab=0,otherAsset=0,otherEquity=0;
  Object.keys(tb).forEach(function(n){var v=tb[n],s=v.debit-v.credit;
    if(v.type==='수익')revenue+=-s;
    else if(v.type==='부채')liab+=-s;
    else if(v.type==='자본'&&n!=='기본재산')otherEquity+=-s;
    else if(v.type==='비용'){ if(PURPOSE.indexOf(n)>=0)purpose+=s; else if(ADMIN.indexOf(n)>=0)admin+=s; else otherExp+=s; }
    else if(v.type==='자산'&&CORE_ASSET.indexOf(n)<0)otherAsset+=s;});
  var interest=revenue;
  var cash=sg('현금성자산')+(num(opening.cash)||0), savings=sg('정기예금')+(num(opening.savings)||0);
  var loan=sg('근로자대부금')+(num(opening.loan)||0), basic=-sg('기본재산')+(num(opening.basic)||0);
  liab+=(num(opening.reserve)||0);
  var net=revenue-purpose-admin-otherExp, retained=(num(opening.retained)||0)+otherEquity+net;
  var totalAssets=cash+savings+loan+otherAsset, equity=basic+retained, totalLiabEq=liab+equity;
  return {tb:tb,appr:appr.length,interest:interest,purpose:purpose,admin:admin,otherExp:otherExp,
    cash:cash,savings:savings,loan:loan,otherAsset:otherAsset,basic:basic,liab:liab,
    totalAssets:totalAssets,net:net,retained:retained,equity:equity,totalLiabEq:totalLiabEq,
    balanced:totalAssets===totalLiabEq,opening:opening};
}
function finPanel(arr){

  function oi(k,lbl){return '<div class="fld"><label>'+lbl+'</label><input id="op-'+k+'" value="'+esc(op[k]||'')+'" placeholder="0"></div>';}

      +'<button style="margin-top:8px" onclick="saveOpening()">💾 전기이월 저장</button></div>';
  if(!f.appr) return '<div class="panel"><div class="muted">승인된 거래가 없어 재무제표를 만들 수 없습니다. 위에서 계정 지정 후 승인하세요.</div>'+openingHtml+'</div>';
  var tbRows=Object.keys(f.tb).sort().map(function(n){var v=f.tb[n];
    return '<tr><td>'+esc(n)+'</td><td class="muted">'+v.type+'</td><td style="text-align:right">'+(v.bal_d?v.bal_d.toLocaleString():'')+'</td><td style="text-align:right">'+(v.bal_c?v.bal_c.toLocaleString():'')+'</td></tr>';}).join('');
  var balChip = f.balanced
    ? '<span class="chip ok">✅ 대차일치</span>'
    : '<span class="chip warn">⚠️ 대차차이 '+won(f.totalAssets-f.totalLiabEq)+' — 전기이월 확인</span>';
  return '<div class="panel"><div class="row"><h2>결산·재무제표</h2><span class="stat">승인 '+f.appr+'건 기준</span>'+balChip

function proposeAcct(memo,isDep){
  var m=String(memo||''), dir=isDep?'입금':'출금';
  for(var i=0;i<ACCT_RULES.length;i++){ var r=ACCT_RULES[i];
    if(r.dir!==dir) continue;
    for(var j=0;j<r.kw.length;j++){ if(m.indexOf(r.kw[j])>=0) return {d:r.d,c:r.c}; }
  }
  return {d:'',c:''};
}
function parseBank(rows){
  var hi=-1, col={};
  function find(cells){for(var c=0;c<cells.length;c++){var v=String(cells[c]||'');
    if(/날짜|거래일|일자|거래일시/.test(v)&&col.date==null)col.date=c;
    if(/적요|내용|의뢰인|기재|가맹점/.test(v)&&col.memo==null)col.memo=c;
    if(/입금|맡기신/.test(v)&&!/건수|횟수|잔액|잔고/.test(v)&&col.dep==null)col.dep=c;
    if(/출금|찾으신|지급/.test(v)&&!/건수|횟수|잔액|잔고/.test(v)&&col.wd==null)col.wd=c;
    if(/잔액|잔고/.test(v)&&col.bal==null)col.bal=c;}}
  var lim=Math.min(rows.length,100);
  // 1차: 날짜열까지 있는 헤더 우선(다단 헤더 오인 방지), 2차: 입·출금열만으로 폴백
  for(var i=0;i<lim;i++){ col={}; find(rows[i]||[]); if(col.dep!=null&&col.wd!=null&&col.date!=null){ hi=i; break; } }
  if(hi<0) for(var i2=0;i2<lim;i2++){ col={}; find(rows[i2]||[]); if(col.dep!=null&&col.wd!=null){ hi=i2; break; } }
  if(hi<0) return null;
  function normDate(s){ var m=String(s||'').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if(!m) return String(s||'').trim();
    return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2); }
  var out=[];
  for(var r=hi+1;r<rows.length;r++){ var row=rows[r]; if(!row)continue;
    var date=col.date!=null?normDate(row[col.date]):'';
    var memo=col.memo!=null?String(row[col.memo]||'').trim():'';
    if(/^(합\s*계|소\s*계|총\s*계)/.test(memo)) continue;   // 합계·소계 행은 거래 아님
    var dep=num(row[col.dep])||0, wd=num(row[col.wd])||0;
    if(dep<0){ wd+=-dep; dep=0; } if(wd<0){ dep+=-wd; wd=0; } // 음수 표기 = 반대방향
    if(!date&&!memo&&!dep&&!wd) continue;
    if(!dep&&!wd) continue;
    var bal=col.bal!=null?(num(row[col.bal])||0):0;
    if(dep&&wd){ out.push({date:date,memo:memo,deposit:dep,withdraw:0,balance:bal});
                 out.push({date:date,memo:memo,deposit:0,withdraw:wd,balance:bal}); } // 입·출 동시 행 분리(분개 누락 방지)
    else out.push({date:date,memo:memo,deposit:dep,withdraw:wd,balance:bal});
  }
  return out;
}
function hkey(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 't'+(h>>>0).toString(36);}
function importBank(){
  var _fid=S.fundId, _yr=S.year;   // 클릭 시점 고정 — 로딩 중 기금·연도 이동해도 원래 경로에 저장
  if(!_fid){ alert('기금을 먼저 선택하세요'); return; }
  var _fname=(funds[_fid]&&(funds[_fid].short_name||funds[_fid].name))||_fid;
  var inp=document.createElement('input'); inp.type='file'; inp.accept='.xls,.xlsx';
  inp.onchange=function(ev){ var file=ev.target.files&&ev.target.files[0]; if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
        var txns=null;   // 첫 시트가 안내문인 파일 대응 — 거래가 나올 때까지 전 시트 시도
        for(var si=0;si<wb.SheetNames.length;si++){
          var rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[si]],{header:1,raw:false,defval:''});
          var got=parseBank(rows);
          if(got&&got.length){ txns=got; break; }
          if(got&&!txns) txns=got;
        }
        if(!txns){ alert('통장 형식을 인식하지 못했습니다. (입금·출금 열을 찾지 못함)'); return; }
        if(!txns.length){ alert('거래 내역이 없습니다.'); return; }
        if(!confirm('['+_fname+' · '+_yr+'년] '+txns.length+'건의 거래를 읽었습니다. 자동분개 제안과 함께 가져올까요?\n(이미 있는 거래는 승인·분개를 그대로 보존합니다)')) return;
        var path=NS+'/txns/'+_fid+'/'+_yr;
        fbDb.ref(path).once('value').then(function(snap){   // 서버 최신본 기준 중복검사 — 오래된 캐시로 승인 거래 덮어쓰기 방지
          var existing=snap.val()||{};
          var obj={}, added=0, kept=0, seen={};
          txns.forEach(function(x){ var base=x.date+'|'+x.deposit+'|'+x.withdraw+'|'+x.memo;
            var n=(seen[base]=(seen[base]||0)+1);
            var key=hkey(n>1?base+'|'+n:base);   // 같은 날 동일 금액·적요 거래도 각각 보존
            if(existing[key]||obj[key]){ kept++; return; }
            var p=proposeAcct(x.memo,x.deposit>0);
            obj[key]={date:x.date,memo:x.memo,deposit:x.deposit,withdraw:x.withdraw,balance:x.balance,debit:p.d,credit:p.c,approved:false}; added++;
          });
          if(added===0){ alert('새로 추가할 거래가 없습니다. (기존 '+kept+'건은 그대로 유지)'); return; }
          return fbDb.ref(path).update(obj).then(function(){ S.txnsFor=null; renderFund(); alert('['+_fname+' · '+_yr+'년] 가져오기 완료: 신규 '+added+'건'+(kept?' · 기존 '+kept+'건 보존':'')); });
        }).catch(function(e){ alert('저장 실패: '+e.message); });
      }catch(e){ alert('파싱 실패: '+e.message); }
    };
    rd.readAsArrayBuffer(file);
  };
  inp.click();
}
function setTxnAcct(id,side,val){ var _key=S.fundId+'/'+S.year;
  fbDb.ref(NS+'/txns/'+_key+'/'+id+'/'+side).set(val)
    .then(function(){ if(S.txnsFor===_key&&S.txns&&S.txns[id])S.txns[id][side]=val; renderFund(); })
    .catch(function(e){ alert('저장 실패: '+e.message); renderFund(); }); }
function approveTxn(id,on){
  if(on){ var x=S.txns&&S.txns[id];
    if(x&&(!x.debit||!x.credit)){ alert('차변·대변 계정을 먼저 지정하세요'); renderFund(); return; }
    if(x&&x.debit===x.credit){ alert('차변과 대변이 같은 계정입니다 — 분개를 확인하세요'); renderFund(); return; } }
  var _key=S.fundId+'/'+S.year;
  fbDb.ref(NS+'/txns/'+_key+'/'+id+'/approved').set(on)
    .then(function(){ if(S.txnsFor===_key&&S.txns&&S.txns[id])S.txns[id].approved=on; renderFund(); })
    .catch(function(e){ alert('저장 실패: '+e.message); renderFund(); });
}
function delTxn(id){ if(confirm('이 거래를 삭제할까요?')) fbDb.ref(NS+'/txns/'+S.fundId+'/'+S.year+'/'+id).remove().then(function(){S.txnsFor=null;renderFund();}).catch(function(e){alert('삭제 실패: '+e.message);}); }
