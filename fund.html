}
function _subChkPath(){ return NS+'/subsidy_chk/'+S.fundId+'/'+S.year; }
function subChkFund(k,on){
  var _f=S.fundId,_y=S.year;
  fbDb.ref(_subChkPath()+'/fund/'+k).set(on?1:null).then(function(){
    if(S.fundId!==_f||S.year!==_y) return;
    S.subChk=S.subChk||{}; S.subChk.fund=S.subChk.fund||{};
    if(on) S.subChk.fund[k]=1; else delete S.subChk.fund[k];
    renderFund();
  }).catch(function(e){ toast('저장 실패: '+e.message,'err'); });
}
function subChkSite(sid,k,on){
  var _f=S.fundId,_y=S.year;
  fbDb.ref(_subChkPath()+'/site/'+sid+'/'+k).set(on?1:null).then(function(){
    if(S.fundId!==_f||S.year!==_y) return;
    S.subChk=S.subChk||{}; S.subChk.site=S.subChk.site||{}; S.subChk.site[sid]=S.subChk.site[sid]||{};
    if(on) S.subChk.site[sid][k]=1; else delete S.subChk.site[sid][k];
    renderFund();
  }).catch(function(e){ toast('저장 실패: '+e.message,'err'); });
}
// 열 전체 켜기/끄기 — 다 켜져 있으면 끄고, 아니면 모두 켠다
function subChkCol(k){
  var act=Object.keys(S.sites||{}).filter(function(id){ return (S.sites[id]||{}).status!=='closed'; });
  if(!act.length) return;
  var schk=(S.subChk||{}).site||{};
  var allOn=act.every(function(id){ return (schk[id]||{})[k]; });
  var up={}; act.forEach(function(id){ up[id+'/'+k]=allOn?null:1; });
  var _f=S.fundId,_y=S.year;
  fbDb.ref(_subChkPath()+'/site').update(up).then(function(){
    if(S.fundId!==_f||S.year!==_y) return;
    S.subChk=S.subChk||{}; S.subChk.site=S.subChk.site||{};
    act.forEach(function(id){ S.subChk.site[id]=S.subChk.site[id]||{}; if(allOn) delete S.subChk.site[id][k]; else S.subChk.site[id][k]=1; });
    renderFund(); toast(allOn?'전체 해제':'전체 체크');
  }).catch(function(e){ toast('저장 실패: '+e.message,'err'); });
}
// 미제출 사업장 명단 — 담당자 연락처까지 붙여 클립보드로(독촉 연락용)
function subCopyMissing(){
  var schk=(S.subChk||{}).site||{};
  var lines=Object.keys(S.sites||{}).map(function(id){ return Object.assign({_id:id},S.sites[id]); })
    .filter(function(s){ return s.status!=='closed'; })
    .map(function(s){
      var d=schk[s._id]||{}, miss=SUB_SITE_DOCS.filter(function(c){ return !d[c[0]]; }).map(function(c){ return c[1]; });
      if(!miss.length) return null;
      var ct=(s.contacts&&s.contacts[0])||{};
      return [s.seq_label||'',s.name||'',miss.join('·'),ct.name||'',ct.mobile||ct.phone||'',ct.email||''].join('\t');
    }).filter(Boolean);
  if(!lines.length){ toast('미제출 사업장이 없습니다'); return; }
  var txt='연번\t사업장\t미제출\t담당자\t연락처\t이메일\n'+lines.join('\n');
  var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast(lines.length+'개사 명단을 복사했습니다 — 엑셀·메일에 붙여넣기'); }
  catch(e){ toast('복사 실패','err'); }
  ta.remove();
}
function uploadSubDoc(){
  if(!fbStore){ toast('Storage 미설정','err'); return; }
  var _fid=S.fundId, _yr=S.year, kind=($('subdoc-kind')&&$('subdoc-kind').value)||'기타';
  var inp=document.createElement('input'); inp.type='file';
  inp.onchange=function(ev){ var file=ev.target.files&&ev.target.files[0]; if(!file)return;
    toast('업로드 중…');
    var safe=(''+file.name).replace(/[^\w.\-가-힣()\s]/g,'_');
    var path='fund_erp/subsidy_docs/'+_fid+'/'+_yr+'/'+Date.now()+'_'+safe;
    var ref=fbStore.ref(path);
    ref.put(file).then(function(){ return ref.getDownloadURL(); }).then(function(url){
      var rec={kind:kind,name:file.name,url:url,path:path,uploaded:ymd()};
      return fbDb.ref(NS+'/subsidy_docs/'+_fid+'/'+_yr).push().set(rec);
    }).then(function(){ S.subDocFor=null; renderFund(); toast('올렸습니다'); })
      .catch(function(e){ toast('업로드 실패: '+e.message,'err'); });
  };
  inp.click();
}
function delSubDoc(id){
  var d=(S.subDocs||{})[id]; if(!d) return;
  confirmM('이 서류를 삭제할까요?\n('+(d.name||'')+')',{ok:'삭제',danger:true}).then(function(ok){ if(!ok)return;
    var _fid=S.fundId, _yr=S.year;
    var done=function(){ fbDb.ref(NS+'/subsidy_docs/'+_fid+'/'+_yr+'/'+id).remove().then(function(){ S.subDocFor=null; renderFund(); toast('삭제되었습니다'); }); };
    if(fbStore&&d.path){ fbStore.ref(d.path).delete().then(done).catch(done); } else done();
  });
}
function saveSubsidy(){
  var _fid=S.fundId, _yr=S.year;   // 저장 시점 고정 — 응답 전 기금·연도 이동해도 원래 대상에 반영
  if(funds[_fid]&&funds[_fid].fund_type==='사내'){ toast('사내근로복지기금은 지원금 대상이 아닙니다','warn'); return; }
  var obj={}; SUB_FIELDS.forEach(function(c){var el=$('su-'+c[0]); if(!el)return;
    var raw=String(el.value==null?'':el.value).trim();
    obj[c[0]] = c[2]==='num' ? (raw===''?'':(num(raw)===''?'':num(raw))) : raw;   // 0도 정상 저장
  });
  /* set(전체 교체)이 아니라 update(이 폼의 항목만) — 전체보드 patchSub()가 저장한 다른 필드가
     오래 열어둔 이 화면 때문에 지워지는 것을 막는다. */
  fbDb.ref(NS+'/funds/'+_fid+'/years/'+_yr+'/subsidy').update(obj).then(function(){
    var t=funds[_fid]; if(!t) return;
    if(!t.years)t.years={}; if(!t.years[_yr])t.years[_yr]={};
    t.years[_yr].subsidy=Object.assign({},t.years[_yr].subsidy||{},obj);
    if(S.fundId===_fid&&S.year===_yr){ clearDirty(); renderFund(); }
    toast('저장되었습니다');
  }).catch(function(e){toast('저장 실패: '+e.message,'err');});
}

/* ══════════ 회계장부 (더존식) ══════════
   승인된 거래를 원천으로 분개장 → 계정별원장 → 월계표 → 합계잔액시산표 → 재무제표(전기 대비)
   순서로 파생시킨다. 숫자는 어디서 봐도 같은 원천에서 나온다.
   전기이월(opening)은 각 장부의 '기초' 한 줄로 들어가 잔액이 이어진다. */
/* 전기이월(기초잔액) 칸 ↔ 계정 대응. **화면·저장·시산표·조정이 모두 이 표를 따라가야 한다** —
   칸만 늘리고 저장 목록을 안 고쳐 매도가능증권 전기이월이 저장되지 않은 일이 있었다. */
var OPEN_ACCT={cash:'현금성자산',savings:'정기예금',loan:'근로자대부금',secu:'매도가능증권',
               /* 비영리조직회계기준으로 결산하는 기금의 계정 — 없으면 다음 해로 이월할 자리가 없다 */
               accrued:'미수수익',recv:'미수금',stfund:'단기금융상품',spcash:'특정현금과예금',
               spresv:'손실대비특별적립금',
               basic:'기본재산',retained:'이월잉여금',
               /* 준비금은 1·2를 갈라 이월한다 — 기금마다 쓰는 쪽이 다르다(법인세법 제29조 / 근로복지기본법
                  제62조제2항). 칸이 하나였을 때는 준비금2로 이월하는 기금(안전공사공동 2024:
                  42,245,952원)이 재무상태표에서 준비금1로 표시돼 제출본과 달라졌다. */
               reserve:'고유목적사업준비금1',reserve2:'고유목적사업준비금2'};
function acctType(n){ return ACCT_CHART[n]||'비용'; }
function isDrAcct(n){ var t=acctType(n); return t==='자산'||t==='비용'; }   // 차변 잔액 계정
function _openingOf(fid,yr){
  var yd=(funds[fid]&&funds[fid].years&&funds[fid].years[yr])||{}; return yd.opening||{};
}
/* 승인 거래 → 분개 배열. 한 거래 = 차변 1 / 대변 1 (통장 기반이라 단순분개) */
/* ══ 분할 분개 ══
   통장 한 줄에 성격이 다른 금액이 함께 찍히는 일이 흔하다 — 이비공동은 송금 100,500원이
   생활지원금 100,000 + 이체수수료 500이고, 제출한 결산서도 그렇게 갈라 적었다.
   은행이 준 줄은 하나이므로 **통장 잔액 대사를 깨뜨리지 않아야 한다**:
   첫 조각만 입·출금 금액을 지니고 나머지는 nocash로 만들어 금액(amount)으로만 회계에 넣는다.
   조각 합계가 원래 금액과 다르면 저장하지 않는다(splitSave). */
function _splitsOf(x){
  return ((x&&x.splits)||[]).filter(function(s){ return s&&s.acct&&(num(s.amount)||0)>0; });
}
function _splitSum(x){ return _splitsOf(x).reduce(function(s,v){ return s+(num(v.amount)||0); },0); }
/* 계정 지정이 끝난 거래인가 — 분할이면 조각이 둘 이상이고 합계가 거래금액과 같아야 한다 */
function _txnDone(x){
  var sp=_splitsOf(x);
  if(sp.length) return sp.length>=2 && _splitSum(x)===((num(x.deposit)||0)+(num(x.withdraw)||0));
  return !!(x&&x.debit&&x.credit);
}
/* 장부를 만들 때만 조각으로 펼친다 — 저장된 거래는 한 줄 그대로다(통장 대사·중복검사 키 보존) */
function expandSplits(arr){
  var out=[];
  (arr||[]).forEach(function(x){
    var sp=_splitsOf(x);
    if(!sp.length){ out.push(x); return; }
    var isDep=(num(x.deposit)||0)>0;
    var cash=(isDep?x.debit:x.credit)||'현금성자산';
    sp.forEach(function(s,i){
      var o=Object.assign({},x);
      o._id=x._id+'#'+(i+1); o.splits=null; o.amount=num(s.amount)||0;
      if(isDep){ o.debit=cash; o.credit=s.acct; } else { o.debit=s.acct; o.credit=cash; }
      if(i>0){ o.deposit=0; o.withdraw=0; o.nocash=1; }   // 통장 금액은 첫 조각만 지닌다
      out.push(o);
    });
  });
  return out;
}
function journalOf(arr){
  return expandSplits(arr).filter(function(x){return x.approved&&x.debit&&x.credit;})
    .map(function(x){ return {date:String(x.date||''),memo:String(x.memo||''),
      debit:x.debit,credit:x.credit,amount:num(x.amount)||num(x.deposit)||num(x.withdraw)||0,id:x._id}; })
    .sort(function(a,b){ return a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id)); });
}
/* 계정별 발생액 — {계정:{d,c}} (전기이월 제외, 당기 발생분만) */
function acctMoves(jr){
  var m={};
  jr.forEach(function(e){
    (m[e.debit]=m[e.debit]||{d:0,c:0}).d+=e.amount;
    (m[e.credit]=m[e.credit]||{d:0,c:0}).c+=e.amount;
  });
  return m;
}
/* 전기이월을 계정별 차/대로 환산 */
function openingMoves(op){
  var m={};
  Object.keys(OPEN_ACCT).forEach(function(k){
    var v=num(op[k])||0; if(!v) return;
    var n=OPEN_ACCT[k];
    m[n]=m[n]||{d:0,c:0};
    if(isDrAcct(n)) m[n].d+=v; else m[n].c+=v;
  });
  return m;
}

  var order={'자산':1,'부채':2,'자본':3,'수익':4,'비용':5};
  return Object.keys(all).sort(function(a,b){
      return (order[acctType(a)]||9)-(order[acctType(b)]||9)||a.localeCompare(b);

/* ══════════ 별지 제15호 운영상황보고서 ══════════
   근로복지기본법 시행규칙 [별지 제15호서식] — 실제 제출본과 같은 2쪽 구성.
   ① 숫자는 전부 장부(승인 분개+전기이월)에서 나온다  ② 회계로 알 수 없는 것만 사람이 입력한다
   ③ 서식은 천원 단위 — 원 단위 장부를 천원으로 환산해 넣는다. */
/* 복지사업비 항목 — [번호, 항목명, 목적사업 계정들].
   번호는 **2025-10-01 개정 서식 기준 57~66**이다(공식 PDF 원문으로 확인).
   개정으로 출연금 100분의 90 범위(㊴~㊶)와 기본재산 100분의 25 범위(㊼~51) 칸이 새로 들어오면서
   복지사업비 번호가 옛 서식(㊾~58)보다 8칸 밀렸다 — 옛 번호로 내면 칸이 어긋난다. */
var F15_ROWS=[
  [57,'주택구입ㆍ임차자금',['주택자금']],
  [58,'우리사주 구입자금',['우리사주구입자금']],
  [59,'생활안정자금',['생활안정자금']],
  [60,'장학금',['장학금']],
  [61,'재난구호금',['재난구호금']],
  [62,'체육ㆍ문화활동 지원',['체육문화비','동호회비']],
  [63,'모성보호, 일ㆍ가정 양립비용 지원',['모성보호비']],
  [64,'근로자의 날 행사 등 지원',['근로자의날행사비']],
  [65,'근로복지시설 설치 및 운영',['근로복지시설비']],
  /* 건강검진비·기념품비는 결산서마다 별 항목으로 세우지만(참살이공동 '의료비지원',
     가치를만들어가는사람들 '기념품비', 플러스동반성장 '기념품 지급') 별지15호에는
     따로 칸이 없어 66번 '그 밖의 복지비'로 모인다. */
  [66,'그 밖의 복지비',['격려금','복리후생','의료비','기념품비','경조사비','기타복지비']]
];
/* 서식의 동그라미 숫자 — 유니코드는 ①~㊿(1~50)까지만 있어서 51 이상은 CSS로 원을 그린다.
   관보 원문도 51 이상은 '◯51' 꼴로 표기한다. */
function _f15n(n){
  n=+n;
  if(n>=1&&n<=20)  return String.fromCharCode(0x2460+n-1);
  if(n>=21&&n<=35) return String.fromCharCode(0x3251+n-21);
  if(n>=36&&n<=50) return String.fromCharCode(0x32B1+n-36);
  return '<span class="cn">'+n+'</span>';
}
var BF_KINDS=[['employer','⑬ 사업주 출연'],['other','⑮ 사업주 외의 자 출연'],
              ['income','⑭ 수익금ㆍ이월금 전입'],['merge','⑯ 기금법인 합병'],
              ['use','⑰ 기본재산 사용'],['split','⑱ 기금법인 분할 등']];
/* 기본재산 증감 1건의 성격 추정 — 적요에 정부·지자체·공단이 있으면 '사업주 외의 자' */
function guessBfKind(e){
  var m=String(e.memo||'');
  if(e.debit==='기본재산') return 'use';                       // 기본재산 차변 = 감소(사용)
  if(/정부|지자체|시청|군청|도청|공단|국고|보조금|지원금/.test(m)) return 'other';
  if(/이자|수익|이월/.test(m)) return 'income';
  return 'employer';
}
function _k1000(n){ return Math.round((n||0)/1000); }          // 원 → 천원
/* 별지15호 전체 수치 산출. rep=사람이 입력한 보조값, sites=참여사업장, welf=목적사업·대부 */
function buildF15(arr,fid,yr,rep,sites,welf){
  rep=rep||{}; sites=sites||[]; welf=welf||[];
  var fin=computeFin(arr,fid,yr), jr=journalOf(arr), mv=acctMoves(jr);
  var op=_openingOf(fid,yr), f=funds[fid]||{};
  // ⑫~⑳ 기본재산 변동 — 기본재산 계정이 걸린 분개를 성격별로 가른다
  var bf={employer:0,other:0,income:0,merge:0,use:0,split:0};
  var bfList=[];
  jr.forEach(function(e){
    if(e.debit!=='기본재산'&&e.credit!=='기본재산') return;
    var kind=(rep.bf&&rep.bf[e.id])||guessBfKind(e);
    bf[kind]=(bf[kind]||0)+e.amount;
    bfList.push({id:e.id,date:e.date,memo:e.memo,amount:e.amount,kind:kind,
                 dir:(e.credit==='기본재산')?'증가':'감소'});
  });
  var bfOpen=num(op.basic)||0;
  var bfInc=bf.employer+bf.other+bf.income+bf.merge, bfDec=bf.use+bf.split;
  var bfEnd=bfOpen+bfInc-bfDec;
  /* ㉑~㉘ 기금 운용·관리 — 이 칸은 '현금 잔액'이 아니라 **기본재산을 어떤 방법으로 운용했는지**다.
     실제 제출본(충남6호 2023)에서 ㉑ 금융회사 예입 = ㉘ 합계 = ⑳ 기본재산 총액으로 확인.
     그래서 대부·신탁·유가증권 등으로 운용한 몫을 뺀 나머지를 금융회사 예입으로 잡는다. */
  /* ㉓ 유가증권 매입은 장부의 매도가능증권 잔액에서 나온다(수기 입력값이 있으면 그것을 쓴다) */
  var run={trust:num(rep.run_trust)||0, secu:num(rep.run_secu)||fin.secu||0, own:num(rep.run_own)||0,
           reit:num(rep.run_reit)||0, etc:num(rep.run_etc)||0, loan:fin.loan};
  var placed=run.trust+run.secu+run.own+run.reit+run.etc+run.loan;
  run.deposit=Math.max(bfEnd-placed,0);
  run.total=run.deposit+placed;
  // ㉙~㉟ 기금사업 재원
  var contribYear=bf.employer+bf.other;                        // 당해연도 출연금
  var ratio=(num(rep.use_ratio)||50)/100;                      // 출연금 사용한도 50% 또는 80%
  var src={income:fin.interest, contrib:Math.round(contribYear*ratio),
           capExcess:num(rep.src_cap_excess)||0, basicRange:num(rep.src_basic_range)||0,
           support:num(rep.src_support)||0, carry:num(rep.src_carry)||0};
  src.total=src.income+src.contrib+src.capExcess+src.basicRange+src.support+src.carry;
  // ㊾~62 사업실적 — 금액은 계정, 수혜자수는 목적사업·대부 탭
  var benef={}, loanBenef=0, loanAmt=0;
  welf.forEach(function(w){
    var c=w.category||'', n=num(w.beneficiaries)||0;
    if(c==='대부사업'){ loanBenef+=n; loanAmt+=num(w.spent)||0; return; }
    benef[c]=(benef[c]||0)+n;
  });
  var items=F15_ROWS.map(function(r){
    var amt=0, cnt=0;
    r[2].forEach(function(a){
      var m=mv[a]; if(m) amt+=m.d-m.c;                         // 비용은 차변 발생액

  });
  var subAmt=items.reduce(function(s,x){return s+x.amt;},0);
  var subCnt=items.reduce(function(s,x){return s+x.cnt;},0);
  /* 68. 기금 운영비 — 일반관리비와 그 밖의 운영비만. 준비금 전입액은 사업외비용이라 뺀다
     (안전공사공동 2024는 이자 40,618원, 현재기업사내 2025는 831원만큼 부풀었었다). */
  var admin=fin.admin+fin.otherExp-(fin.resvExp||0);
  /* 69. 잔액 — 제출본은 **그 해 말에 남은 기금 재산**을 적는다. 재원 칸(㉙~㉟)에서 빼는 식으로
     계산하면 ㉞ 이월금 같은 수기 입력이 비어 있을 때 크게 틀린다.
     확정 제출본 두 건으로 확인했다(천원 단위):
       안전공사공동 2024 — 68.운영비 108 + 69.잔액 33,372 + 67.소계 17,608 = 70.합계 51,087
                          잔액 33,372천원 = 기말 자산총계 33,371,570원
                          합계 51,087천원 = 전기말 자산총계 51,046,392 + 당기 이자 40,618
       현재기업사내 2025 — 68.운영비 68.8 + 69.잔액 2,173,487 = 70.합계 2,173,556
                          잔액 2,173,487천원 = 기말 자산총계 2,173,487,121원
     그래서 잔액은 기말 자산총계로, 합계는 소계+대부+운영비+잔액으로 잡는다.
     이러면 '그 해에 쓸 수 있었던 재산 = 쓴 것 + 남은 것'이 저절로 맞는다. */
  var rest=fin.totalAssets;
  // 근로자 수 — 참여사업장 합계(협력업체로 표시한 곳은 따로)
  var wk=0, pwk=0;
  sites.forEach(function(s){ var n=num(s.company_size)||0; if(s.partner) pwk+=n; else wk+=n; });
  if(num(rep.partner_workers)) pwk=num(rep.partner_workers);
  return {
    f:f, yr:yr, fin:fin,
    head:{name:f.name||'',inka:f.inka_no||'',reg:f.reg_date||'',tel:f.phone||'',addr:f.address||'',
          fy_s:(f.fy_start_md||'01-01'),fy_e:(f.fy_end_md||'12-31'),
          ceo:f.chairman||'',biz:rep.biz_type||f.biz_type||'',workers:wk,partner:pwk,capital:num(rep.capital)||0,
          type:(f.fund_type==='사내')?'사내':'공동'},
    bf:bf, bfOpen:bfOpen, bfInc:bfInc, bfDec:bfDec, bfEnd:bfEnd, bfList:bfList,
    run:run, src:src, ratio:ratio*100,
    items:items, subAmt:subAmt, subCnt:subCnt,
    loanAmt:loanAmt, loanBenef:loanBenef, admin:admin, rest:rest,
    total:subAmt+loanAmt+admin+rest,
    sel:{amt:num(rep.sel_amt)||0,cnt:num(rep.sel_cnt)||0},
    estate:{name:rep.estate_name||'해당없음',amt:num(rep.estate_amt)||0,date:rep.estate_date||'해당없음'},
    use20:{total:num(rep.use20_total)||0,partner:num(rep.use20_partner)||0,partnerCnt:num(rep.use20_pcnt)||0},
    use30:{total:num(rep.use30_total)||0,partner:num(rep.use30_partner)||0,partnerCnt:num(rep.use30_pcnt)||0},
    use80:{contrib:contribYear,pcnt:num(rep.use80_pcnt)||0,pamt:num(rep.use80_pamt)||0,wcnt:wk},
    rep:rep
  };
}

function f15Load(){
  var fid=S.fundId, yr=S.year, key=fid+'/'+yr;
  if(S.f15For===key) return true;
  S.f15For=key; S.f15Rep=null; S.f15Sites=null; S.f15Welf=null; S.f15Close=null;
  Promise.all([
    // closing 노드 전체를 읽는다 — report(입력값) + locked(확정 상태)를 함께 쓰기 위해
    fbDb.ref(NS+'/closing/'+fid+'/'+yr).once('value').then(function(s){return s.val()||{};}).catch(function(){return {};}),
    _loadSites(fid).catch(function(){return [];}),
    fbDb.ref(NS+'/welfare/'+fid+'/'+yr).once('value').then(function(s){var v=s.val()||{};return Object.keys(v).map(function(k){return v[k];});}).catch(function(){return [];})
  ]).then(function(r){
    if(S.f15For!==key) return;
    S.f15Close=r[0]||{}; S.f15Rep=S.f15Close.report||{}; S.f15Sites=r[1]||[]; S.f15Welf=r[2]||[];
    if(S.tab==='closing'&&S.view==='fund') renderFund();
  });
  return false;
}
function _isLocked(){ return !!(S.f15Close&&S.f15Close.locked); }
function _lockInfo(){ var c=S.f15Close||{}; return (c.locked_at||'')+(c.locked_by?' · '+c.locked_by:''); }
function f15Save(){
  var fid=S.fundId, yr=S.year, o=Object.assign({},S.f15Rep||{});
  ['biz_type','capital','partner_workers','use_ratio','run_trust','run_secu','run_own','run_reit',
   'run_etc','src_cap_excess','src_basic_range',
   'src_support','src_carry','sel_amt','sel_cnt','estate_name','estate_amt','estate_date',
   'use20_total','use20_partner','use20_pcnt','use30_total','use30_partner','use30_pcnt',
   'use80_pcnt','use80_pamt'].forEach(function(k){
    var el=$('f15-'+k); if(el) o[k]=el.value.trim();
  });
  fbDb.ref(NS+'/closing/'+fid+'/'+yr+'/report').update(o).then(function(){
    S.f15Rep=o; _cbDirty(); toast('보고서 입력값 저장됨'); renderFund();
  }).catch(function(e){ toast('저장 실패: '+e.message,'err'); });

/* ══ 고유목적사업준비금 자동 조정 ══
   공동·사내기금은 출연금을 준비금(부채)으로 적립해 두고, 결산에서 당기순이익을 0으로 맞춘다.
   방향이 두 가지다 — 실제 확정 결산서 두 건으로 확인했다.
     · 비용 > 수익 (목적사업을 한 해)  → 준비금에서 **환입**(사업외수익). 청신공동 2025: 9,803,443원
     · 수익 > 비용 (설립 첫해 등)      → 준비금으로 **전입**(사업외비용). 안전공사공동 2022: 3,249원
   환입은 준비금 잔액을 넘을 수 없고, 전입은 이익만큼이라 한도가 없다.
   이미 조정 분개가 있으면 순이익이 0이 되어 필요액이 저절로 0이 된다(중복 생성 방지). */
var RESERVE_ACCTS=['고유목적사업준비금1','고유목적사업준비금2'];
/* 조정에 쓸 준비금 계정 — 잔액이 있는 쪽을 쓴다(없으면 준비금1). 기금마다 1·2를 달리 쓴다. */
function _reserveAcct(fin){
  var best=RESERVE_ACCTS[0], bal=-1;
  RESERVE_ACCTS.forEach(function(a){
    var v=fin.tb[a]; var b=v?(v.credit-v.debit):0;
    if(b>bal){ bal=b; best=a; }
  });
  return best;
}
/* 당기 출연금 — 준비금2 설정 한도의 기준. **현금으로 들어온 출연금만** 센다.
   준비금2는 그 해에 목적사업에 쓸 수 있는 재원인데, 증권·부동산으로 받은 현물출연은
   처분해야 쓸 수 있어 실무 결산서도 한도 기준에서 뺀다.
   배경공동 2022가 그 사례다 — 증권 7,261,110,330원을 현물출연받고 현금은 30,000,000원인데,
   현물까지 세면 한도가 65억이 되어 기본재산이 72.6억에서 7.3억으로 붕괴한다(제출본 설정액은
   현금 30,000,000 × 90% = 27,000,000원이다). 현금·자산총계·대차는 맞아도 기본재산 총액이
   틀어지면 별지15호와 재산변동상황보고서가 전부 어긋난다. */
function _contribOf(arr){
  var s=0; expandSplits(arr).forEach(function(x){
    if(!x.approved||x.credit!=='기본재산') return;
    if(x.nocash) return;                                  // 현물출연·대체분개는 제외
    var amt=num(x.deposit)||0;
    if(!amt&&(x.debit==='현금성자산'||x.debit==='정기예금')) amt=num(x.amount)||0;
    s+=amt; });
  return Math.round(s);
}
/* 근로복지기본법 제62조제2항 — 해당 회계연도 출연금 중 근로복지사업에 쓸 수 있는 비율.
   사내근로복지기금 100분의 50, 공동근로복지기금 100분의 90. 별지15호 ㉚과 같은 한도다. */
function _reserveRate(fid){ return ((funds[fid]||{}).fund_type==='사내')?0.5:0.9; }
function reserveAdjust(arr,fid,yr){
  fid=fid||S.fundId; yr=yr||S.year;
  var fin=computeFin(arr,fid,yr);
  var net=Math.round(fin.net);
  /* 비영리조직회계기준으로 결산하는 기금은 당기운영이익이 0이 아니다 — 남는 이익을 미처분이익잉여금으로
     이월한다(충남공동8호 2025: 66,048원). 그런 기금은 준비금 자동조정을 끈다.
     [결산·재무제표]의 '준비금 자동조정' 체크를 풀면 reserve_auto:false 가 저장된다. */
  if(((funds[fid]||{}).years||{})[yr] && ((funds[fid]||{}).years||{})[yr].reserve_auto===false)
    return {kind:'', need:0, avail:0, amount:0, acct:RESERVE_ACCTS[0], fin:fin, off:true,
            contrib:_contribOf(arr), rate:_reserveRate(fid), cap:0, setup:0, deficit:0, parts:[]};
  var op=_openingOf(fid,yr);
  /* 계정별 준비금 잔액 — 전기이월 칸은 하나뿐이라 준비금1에 얹는다 */
  var bal={};
  RESERVE_ACCTS.forEach(function(a){ var v=fin.tb[a]; bal[a]=Math.round(v?(v.credit-v.debit):0); });
  bal[RESERVE_ACCTS[0]]+=Math.round(num(op.reserve)||0);
  bal[RESERVE_ACCTS[1]]+=Math.round(num(op.reserve2)||0);
  var avail=RESERVE_ACCTS.reduce(function(s,a){ return s+Math.max(0,bal[a]); },0);
  var contrib=_contribOf(arr), rate=_reserveRate(fid), cap=Math.round(contrib*rate);
  /* 법인세법 제29조 준비금(준비금1)은 **그 해에 현금으로 받은 이자수익만큼** 전입했다가 그대로 환입한다.
     검증한 열한 기금이 모두 그렇게 적었다(가치 23,963·안전공사 40,618·플러스 253,010·이비 57,523·
     일원 2,287·배경 7,247·참살이 81,137·충남6호 156,964·충남8호 461,478·경기1호 323,627·현재기업 831).
     미수이자는 뺀다 — 충남8호 2025는 이자수익 527,526 중 미수수익 66,048을 빼고 461,478만 전입했다. */
  var itc=0;
  expandSplits(arr).forEach(function(x){
    if(!x.approved||x.credit!=='이자수익'||x.nocash) return;
    itc+=num(x.deposit)||num(x.amount)||0; });
  var r={kind:'', need:0, avail:avail, amount:0, acct:_reserveAcct(fin), fin:fin,
         contrib:contrib, rate:rate, cap:cap, setup:0, deficit:0, parts:[], interestCash:Math.round(itc)};
  /* **기본재산에서 준비금2로 설정**해 목적사업 재원을 만든다(기본재산 차변 / 준비금2 대변).
     이 분개가 없으면 준비금2를 만들 방법이 아예 없어, 출연금을 그 해에 쓰는 공동기금은
     환입 재원이 전기이월분뿐이라 당기순이익이 0이 되지 않는다
     (가치를만들어가는사람들 2024: 필요 112,264,937원 / 전기이월 160,291원).
     법은 한도를 '범위'로 정하므로 **그 안에서 얼마를 설정할지는 협의회가 정한다**.
     [결산·재무제표]의 설정액 칸에 넣은 값이 있으면 그것을 쓰고, 비워 두면 사용한도 전액으로 본다
     — 가치를만들어가는사람들 2024·일원공동 2024·배경공동 2022~2025·청신공동 2022~2025는 한도 전액이었지만,
     참살이공동 2024는 한도 929,554,369원 중 412,000,000원만 설정했다.
     쓰지 않은 잔액은 준비금2로 남아 다음 해 전기이월 칸(reserve2)으로 넘어간다.
     **설정은 순이익 방향과 무관하다** — 그 해 출연금의 사용한도만큼 재원을 만드는 것이기 때문이다.
     안전공사공동 2022는 수익이 비용보다 커서 전입(3,249원)을 하는 해였는데도 설정 63,003,960원
     (출연금 70,004,400 × 90%)을 했다. 설정을 환입 분기에만 두었을 때는 기본재산이 70,004,400원으로
     나와 제출본(7,000,440원)과 63,003,960원 어긋났다 — 현금·자산총계·대차는 맞아서 화면만 보면
     정상으로 보이는 종류의 결함이다. */
  var _man=num(((funds[fid]||{}).years||{})[yr]&&((funds[fid]||{}).years||{})[yr].reserve_setup);
  r.setupManual=(_man!==''&&_man>=0);
  var want=r.setupManual?_man:Math.max(0,cap);
  if(want>0){ r.setup=want; bal[RESERVE_ACCTS[1]]=(bal[RESERVE_ACCTS[1]]||0)+want;
              avail+=want; r.avail=avail; }
  if(net>0){ r.kind='전입'; r.need=net; r.amount=net;
             r.parts=[{acct:RESERVE_ACCTS[1],amount:net}]; r.acct=RESERVE_ACCTS[1]; return r; }
  if(net===0) return r;
  r.kind='환입'; r.need=-net;
  /* 재원이 모자라도 **기본재산을 더 쓸 수는 없다.** 기본재산은 대부사업에만 쓸 수 있고,
     복지사업에는 사용한도(해당 회계연도 출연금의 50% / 선택적복지·수급사업체 복리후생·중소기업 80% /
     2024년부터 90%)를 넘겨 쓸 수 없다. 모자라는 만큼은 그 해 **손실금**으로 남고, 근로복지공단
     실무에 따라 다음 회계연도로 이월된다(잉여금이 생기면 손실금을 보전한 뒤 기금에 전입한다).
     현재기업사내 2025가 그 사례다 — 재원 30,860원에 필요액 67,939원이라 37,079원이 결손금이 된다.
     제출본은 환입을 잔액에 반영하지 않아 대차가 831원 어긋났고, 앱이 전에 하던 '기본재산 사용'
     자동분개는 법이 막아 둔 처리였다. */
  r.amount=Math.max(0,Math.min(r.need,avail));
  r.deficit=Math.max(0,r.need-r.amount);          // 다음 회계연도로 이월되는 손실금
  /* 환입은 계정별 잔액 안에서 나눈다 — 한 계정을 음수로 만들지 않는다. 준비금1(법인세법 제29조)을
     먼저 쓰고 남은 만큼 준비금2(근로복지기본법 제62조제2항)에서 환입한다. */
  var rest=r.amount;
  RESERVE_ACCTS.forEach(function(a){ if(rest<=0) return;
    var take=Math.min(rest,Math.max(0,bal[a])); if(take<=0) return;
    r.parts.push({acct:a,amount:take}); rest-=take; });
  if(r.parts.length) r.acct=r.parts[0].acct;
  return r;
}
/* 현금이 오가지 않는 대체분개 — nocash:1 이라 통장 입·출금 합계와 잔액 대사에서 빠진다 */
function _reserveEntry(yr,kind,amount,acct){
  var base={date:yr+'-12-31', amount:amount, deposit:0, withdraw:0, nocash:1, approved:true};
  if(kind==='설정') return Object.assign(base,{memo:'고유목적사업준비금2 설정(출연금 사용한도 내)',
                                              debit:'기본재산', credit:acct});
  if(kind==='환입') return Object.assign(base,{memo:'고유목적사업준비금 환입(결산 자동)',
                                              debit:acct, credit:'고유목적사업준비금환입'});
  return Object.assign(base,{memo:'고유목적사업준비금 전입(결산 자동)',
                             debit:'고유목적사업준비금전입액', credit:acct});
}
/* 결산 확정 때 쓸 조정 분개 전체 — 설정 → 기본재산 사용 → 환입(계정별) 순서.
   id를 고정해 두어 다시 확정해도 같은 자리에 덮어써지고 분개가 늘지 않는다. */
function _reserveEntries(yr,rc){
  var out=[], R1=RESERVE_ACCTS[0], R2=RESERVE_ACCTS[1];
  /* 준비금1(법인세법 제29조) — 현금으로 받은 이자수익만큼 전입했다가 그대로 환입한다.
     비용과 수익이 같은 금액이라 당기순이익·대차에는 영향이 없지만, 손익계산서의
     사업외비용('고유목적사업준비금전입액')과 사업외수익('준비금1 전입수입')에 나타나야 제출본과 맞는다. */
  var it=Math.round(rc.interestCash||0);
  if(it>0){
    out.push({id:'rsv1set'+yr, e:_reserveEntry(yr,'전입',it,R1)});
    out.push({id:'rsv1in'+yr, e:_reserveEntry(yr,'환입',it,R1)});
  }
  if(rc.setup>0) out.push({id:'rsvset'+yr, e:_reserveEntry(yr,'설정',rc.setup,R2)});
  (rc.parts||[]).forEach(function(p,i){
    if(p.amount>0) out.push({id:'rsv'+yr+(i?String.fromCharCode(97+i):''), e:_reserveEntry(yr,rc.kind,p.amount,p.acct)}); });
  return out;
}

    +(fin.balanced?'':'\n\n⚠️ 대차가 맞지 않습니다 (차이 '+won(fin.totalAssets-fin.totalLiabEq)+') — 전기이월을 먼저 확인하세요.');

  var rc=reserveAdjust(arr,fid,yr);

  if(rc.deficit>0) msg+='\n\n⚠️ 재원이 '+won(rc.deficit)+' 모자랍니다 — 당기순손실로 남아 다음 회계연도로 이월됩니다.'
    +'\n   기본재산은 대부사업에만 쓸 수 있어 복지사업에 사용한도를 넘겨 쓸 수 없습니다.'
    +'\n   목적사업비가 당기 출연금의 '+Math.round(rc.rate*100)+'%를 넘었다는 뜻이니, 출연금 분개가 빠진 것이 없는지 먼저 확인하세요.';
  if(rc.amount>0) msg+='\n\n② 고유목적사업준비금 '+won(rc.amount)+'을 '+rc.kind+' 분개로 자동 기록합니다'
    +(rc.parts.length>1?' ('+rc.parts.map(function(p){return p.acct.slice(-1)+'('+(p.acct.slice(-1)==='1'?'이자':'이월')+') '+won(p.amount);}).join(' / ')+')':'')
    +(rc.kind==='환입'&&rc.amount<rc.need?'\n(준비금 재원이 '+won(rc.avail)+'뿐이어서 전액 환입은 되지 않습니다)':' — 당기순이익이 0이 됩니다')+'.';
  confirmM(msg,{ok:'결산 확정',danger:!fin.balanced}).then(function(ok){ if(!ok)return;
    /* 환입 분개와 확정을 **한 번의 update로** 쓴다 — 하나만 저장되고 끊기면 장부가 어긋난다 */
    var arr2=arr, up={};

      ents.forEach(function(x){ var id=x.id, e=x.e;

      toast(yr+'년 결산이 확정되었습니다'+(rc.amount>0?' · 준비금 '+won(rc.amount)+' '+rc.kind+' 기록':''));
    }).catch(function(e){ toast('확정 실패: '+e.message,'err'); });

/* ── 연도별 비교 (한 기금의 여러 연도) ── 확정 스냅샷을 우선 쓰고, 없는 연도는 거래를 읽어 계산 */
function loadYearSeries(){
  var fid=S.fundId, key=fid;
  if(S.ysFor===key) return true;
  S.ysFor=key; S.ys=null;
  var yNow=new Date().getFullYear(), years=[];
  for(var y=yNow;y>=yNow-5;y--) years.push(y);
  fbDb.ref(NS+'/closing/'+fid).once('value').then(function(s){
    var cl=s.val()||{};
    // 스냅샷이 없는 연도는 거래를 직접 읽어 계산(연 6회 이하)
    var need=years.filter(function(y){ return !(cl[y]&&cl[y].fin); });
    return Promise.all(need.map(function(y){
      return fbDb.ref(NS+'/txns/'+fid+'/'+y).once('value')
        .then(function(ts){ var v=ts.val()||{};
          var a=Object.keys(v).map(function(k){var o=Object.assign({},v[k]);o._id=k;return o;});
          return {y:y, fin:a.length?closeSnapshot(a,fid,y,(cl[y]||{}).report,[],[]):null};
        }).catch(function(){ return {y:y, fin:null}; });
    })).then(function(rs){
      var out={};
      years.forEach(function(y){ out[y]={locked:!!(cl[y]&&cl[y].locked), fin:(cl[y]&&cl[y].fin)||null}; });
      rs.forEach(function(r){ if(r.fin) out[r.y]={locked:false, fin:r.fin, live:true}; });
      if(S.ysFor!==key) return;
      S.ys={years:years, data:out};
      if(S.tab==='closing'&&S.view==='fund') renderFund();
    });
  }).catch(function(){ if(S.ysFor===key) S.ys={years:years,data:{}}; });
  return false;
}

      else { otherExp+=s; if(n==='고유목적사업준비금전입액') resvExp+=s; } }

     실제로 미수수익·미수금·단기금융상품·특정현금과예금·손실대비특별적립금이 통째로 빠져

var LEARN_SKIP=['인터넷출금이체','인터넷입금이체','현금출금','현금입금','전자금융','FBS출금','타행이체',

  return (isDep?'i_':'o_')+head;

function learnAcct(memo,isDep,d,c,fid){

  _learned=_learned||{}; _learned[k]=rec;                       // 화면은 바로 반영

function proposeAcct(memo,isDep,sites,kind){
  var m=String(memo||''), dir=isDep?'입금':'출금';
  var lk=_learnKey(m,isDep), lr=lk&&(_learned||{})[lk];   // 배운 것이 일반 규칙보다 우선
  if(lr&&lr.d&&lr.c) return {d:lr.d,c:lr.c,learned:true};
  /* 적요의 공백을 지우고 맞춘다. 통장 적요의 띄어쓰기는 제각각인데 키워드는 붙여 써 두어
     '근로자의 날 기념품'이 '근로자의날'을 그냥 비껴갔다(가치를만들어가는사람들 2024). */
  var mz=(m+' '+String(kind||'')).replace(/\s+/g,'');
  for(var i=0;i<ACCT_RULES.length;i++){ var r=ACCT_RULES[i];

    var mzz=strip(m+' '+String(kind||''));

       힌트를 **토막으로 끊어** 각 토막이 사업장명의 앞부분인지 본다 — 붙여 놓고 비교하면
       '인터넷 (주)에이이피'처럼 앞에 수단이 붙은 경우를 놓친다(일원공동 2024).
       네 글자 이상만 본다: 'G마켓이벌브소'는 앞부분이 아니어서 걸리지 않고,
       두세 글자는 우연히 겹칠 수 있다. */
    var toks=String(m+' '+String(kind||'')).split(/[\s,\/|()\uFF08\uFF09]+/)

  }

       설명 열이 둘 이상이면 첫 열만 적요로 쓰고 **나머지는 버리지 않고 성격 힌트로 모은다** —
       이비공동은 적요가 'BZ뱅크'(수단)뿐이고 실제 상대방('(주)이벌브소프트')이 '내용' 열에 있어
       출연금 50,000,000원을 알아볼 방법이 없었다. 하나은행의 '의뢰인/수취인'도 같은 경우다. */
    if(/적요|내용|내역|의뢰인|기재|가맹점/.test(v)){ if(col.memo==null)col.memo=c; else if(col.kind.indexOf(c)<0)col.kind.push(c); }
    /* 거래상대방 열 — 자동분개에 가장 중요한 정보가 여기 있다(청원건설=출연, 안산단원구=세금,
       하나푸른노무법인=용역). 적요는 '인터넷출금이체'처럼 수단만 적혀 분류에 쓸 수 없다. */
    if(/보낸분|받는분|상대계좌|입금자|송금인|거래처|업체/.test(v)&&col.who==null)col.who=c;
    if(/입금|맡기신/.test(v)&&!/건수|횟수|잔액|잔고/.test(v)&&col.dep==null)col.dep=c;
    if(/출금|찾으신|지급/.test(v)&&!/건수|횟수|잔액|잔고/.test(v)&&col.wd==null)col.wd=c;
    if(/잔액|잔고/.test(v)&&col.bal==null)col.bal=c;
    /* 성격이 적힌 나머지 열들 — 적요 밖에 흩어져 있다. 적요에 합치지는 않는다:
       적요는 중복검사 키(hkey)의 재료라 바꾸면 이미 가져온 거래가 다시 신규로 들어온다.
         · 하나·기업은행 '구분'    — 예금이자 행은 적요·의뢰인을 비우고 여기에만 '예금이자'를 적는다
                                    (가치를만들어가는사람들 2024: 이자 8건이 전부 미분류였다)
         · 농협 '거래기록사항'      — 적요('거래내용')에는 'G-국민은행'처럼 수단만 적히고
                                    실제 상대방('국립한밭대학교산학협')은 여기 있다
         · '이체메모'·'기재내용'    — '이자소득지방소득세'·'예금결산이자'처럼 성격이 그대로 적힌다
         · '입금인코드'           — 참살이공동은 대부금 지출의 성격('09월사내대출')을 이 칸에만 적었다 */
    if(/구분|종류|기록사항|메모|비고|예금주|입금인/.test(v)&&!/계좌번호|통화|화폐/.test(v)&&col.kind.indexOf(c)<0)col.kind.push(c);}}
  /* 계좌번호 — 이체 자동매칭의 근거. 같은 날 같은 금액이라도 계좌가 다르면 확실한 이체다. */
  var acct='';
  for(var a0=0;a0<Math.min(rows.length,12);a0++){
    var line=(rows[a0]||[]).join(' ');
    var am=line.match(/계좌\s*번호[^0-9]*([0-9][0-9\-]{6,})/);
    if(am){ acct=am[1].replace(/\D/g,''); break; }
  }
  var lim=Math.min(rows.length,100);
  // 1차: 날짜열까지 있는 헤더 우선(다단 헤더 오인 방지), 2차: 입·출금열만으로 폴백
  for(var i=0;i<lim;i++){ col={}; find(rows[i]||[]); if(col.dep!=null&&col.wd!=null&&col.date!=null){ hi=i; break; } }
  if(hi<0) for(var i2=0;i2<lim;i2++){ col={}; find(rows[i2]||[]); if(col.dep!=null&&col.wd!=null){ hi=i2; break; } }
  if(hi<0) return null;
  function normDate(s){ var t=String(s||'').replace(/\s+/g,' ').trim();
    var m=t.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if(m) return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
    /* 엑셀이 미국식으로 찍어 준 m/d/yy — 손으로 적은 대장에 흔하다(플러스동반성장 '1/3/24').
       앞 숫자가 12를 넘으면 일·월 순서로 본다. */
    m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/);
    if(m){ var a=+m[1], b=+m[2], mo=(a<=12?a:b), dy=(a<=12?b:a);
           return '20'+m[3]+'-'+('0'+mo).slice(-2)+'-'+('0'+dy).slice(-2); }
    return t; }
  var out=[], lastDate='';
  for(var r=hi+1;r<rows.length;r++){ var row=rows[r]; if(!row)continue;
    var date=col.date!=null?normDate(row[col.date]):'';
    /* 사람이 적은 대장은 같은 날 여러 건을 적을 때 일자를 첫 줄에만 쓴다 — 빈 칸은 위 일자를 잇는다.
       통장 파일은 모든 줄에 일자가 있어 영향이 없다. */
    if(/^\d{4}-\d{2}-\d{2}$/.test(date)) lastDate=date; else if(!date) date=lastDate;
    var memo=col.memo!=null?String(row[col.memo]||'').trim():'';
    var who=col.who!=null?String(row[col.who]||'').trim():'';
    if(who&&who!==memo) memo=(who+' '+memo).trim();
    /* 합계 행은 거래가 아니다. 하나·기업·우리 모두 'No' 다음 칸(= 일자 칸)에 '합   계'라고
       적는다 — 적요 칸만 보던 예전 가드는 이걸 그대로 놓쳤다. 가치를만들어가는사람들 2024는
       합계 행 한 줄이 입·출 동시 행으로 쪼개져 출금이 119,510,650원이나 부풀었다. */
    var dcell=col.date!=null?String(row[col.date]||'').trim():'';
    if(/^(합\s*계|소\s*계|총\s*계|누\s*계|총\s*\d+\s*건)/.test(dcell)) continue;
    if(dcell&&!/\d/.test(dcell)) continue;                 // 일자 칸에 숫자가 없으면 거래가 아니다
    if(/^(합\s*계|소\s*계|총\s*계|누\s*계)/.test(memo)) continue;
    var dep=num(row[col.dep])||0, wd=num(row[col.wd])||0;
    if(dep<0){ wd+=-dep; dep=0; } if(wd<0){ dep+=-wd; wd=0; } // 음수 표기 = 반대방향
    if(!date&&!memo&&!dep&&!wd) continue;
    if(!dep&&!wd) continue;
    var bal=col.bal!=null?(num(row[col.bal])||0):0;
    /* 농협은 순번 칸의 머리글이 하필 '구분'이라 1·2·3…이 성격으로 읽혔다 — 숫자만인 값은 버린다 */
    var kind=(col.kind||[]).map(function(kc){ return String(row[kc]||'').trim(); })
               .filter(function(t){ return t&&!/^[\d,.\s]+$/.test(t); }).join(' ');
    if(dep&&wd){ out.push({date:date,memo:memo,deposit:dep,withdraw:0,balance:bal,acct:acct,kind:kind});
                 out.push({date:date,memo:memo,deposit:0,withdraw:wd,balance:bal,acct:acct,kind:kind}); } // 입·출 동시 행 분리(분개 누락 방지)
    else out.push({date:date,memo:memo,deposit:dep,withdraw:wd,balance:bal,acct:acct,kind:kind});
  }
  return out;
}
/* ══ 계좌 간 이체 자동매칭 ══
   한 기금이 계좌를 둘 이상 쓰면 같은 돈이 한쪽 출금·다른쪽 입금으로 두 번 잡힌다.
   그대로 두면 목적사업비나 출연금으로 오인되고, 승인 게이트도 통과하지 못한다.
   같은 날·같은 금액이 서로 반대 방향이면 한 쌍으로 본다. **계좌번호가 서로 다르면 확실(sure)**,
   계좌번호가 없는 옛 자료는 추정(guess)으로 두어 사람이 확인하게 한다.
   처리 방법: 양쪽 다 현금성자산 ↔ 현금성자산 — 재무제표에 영향이 0이고(총현금 불변),
   통장 입·출금 합계에는 그대로 남아 잔액 대사도 어긋나지 않는다. */
/* 계좌 간 이체로 자동 상계할 최소 금액. 실무의 자금 이동은 만원 단위 이상인데,
   1원·10원 같은 소액은 같은 날 같은 금액이 우연히 겹치는 일이 흔하다
   (디와이사내 2025: 51-5 잡수익 1원과 02-9 정정 출금 1원이 이체로 오검출됐다).
   하한 미만은 확실(sure)로 보지 않고 추정(guess)으로 내려 사람이 확인하게 한다. */
var XFER_MIN=10000;
function findTransfers(arr){
  var pool=(arr||[]).filter(function(x){ return !x.xfer; });
  var deps=pool.filter(function(x){ return (num(x.deposit)||0)>0; });
  var wds =pool.filter(function(x){ return (num(x.withdraw)||0)>0; });
  var used={}, pairs=[];
  deps.forEach(function(d){
    var amt=num(d.deposit)||0;
    var cands=wds.filter(function(w){
      return !used[w._id] && w._id!==d._id && w.date===d.date && (num(w.withdraw)||0)===amt;
    });
    // 계좌가 다른 짝을 먼저 쓴다(확실). 없으면 계좌 정보가 없는 짝을 추정으로.
    var sure=cands.filter(function(w){ return d.acct && w.acct && d.acct!==w.acct && amt>=XFER_MIN; });
    var pick=sure[0], kind='sure';
    if(!pick){ pick=cands.filter(function(w){ return !d.acct || !w.acct; })[0]; kind='guess'; }
    if(!pick) return;
    used[pick._id]=used[d._id]=1;
    pairs.push({inId:d._id, outId:pick._id, date:d.date, amount:amt, kind:kind,
                inMemo:String(d.memo||''), outMemo:String(pick.memo||'')});
  });
  return pairs;
}
/* 짝지어진 두 줄을 현금↔현금 대체로 만들고 승인까지 한 번에 쓴다 */
function applyTransfers(pairs,fid,yr,quiet){
  pairs=pairs||[]; if(!pairs.length) return Promise.resolve(0);
  var up={};
  pairs.forEach(function(pr){
    [pr.inId,pr.outId].forEach(function(id){
      var b='txns/'+fid+'/'+yr+'/'+id+'/';
      up[b+'debit']='현금성자산'; up[b+'credit']='현금성자산';
      up[b+'approved']=true; up[b+'xfer']=1;
    });
  });
  return fbDb.ref(NS).update(up).then(function(){
    if(S.fundId===fid&&S.year===yr){ S.txnsFor=null; renderFund(); }
    if(!quiet) toast('계좌 간 이체 '+pairs.length+'쌍을 상계 처리했습니다');
    return pairs.length;
  });
}
function autoMatchTransfers(){
  var fid=S.fundId, yr=S.year;

  var pairs=findTransfers(arr);
  if(!pairs.length){ toast('짝지을 계좌 간 이체가 없습니다','warn'); return; }

    +'양쪽을 <b>현금성자산 ↔ 현금성자산</b>으로 상계 처리하고 승인합니다 — 재무제표에 영향이 없고 통장 잔액 대사도 그대로입니다.'
    +(nSure<pairs.length?'<br>계좌번호가 없는 옛 자료는 <b>추정</b>입니다. 아닌 것이 있으면 취소하고 개별로 지정하세요.':'')+'</p>'
    +'<div style="max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px">'
    +'<table><thead><tr><th>일자</th><th style="text-align:right">금액</th><th>출금 → 입금</th><th>판정</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:14px"><button onclick="closeM()">취소</button>'
    +'<button class="primary" onclick="_applyXfer()">'+pairs.length+'쌍 상계 처리</button></div>');
}
function _applyXfer(){
  var pairs=window._xferPairs||[]; window._xferPairs=null; closeM();

function hkey(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 't'+(h>>>0).toString(36);}

function importBank(){

      try{
        var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
        /* 시트를 **전부** 읽어 합친다. 은행이 월별 시트로 나눠 주는 경우가 있어
           첫 시트에서 멈추면 나머지 달을 통째로 잃는다(안전공사 2022: 11월만 읽고 12월
           2,007,649원 누락 — 실측으로 확인). 첫 시트가 안내문인 파일도 함께 처리된다. */
        var txns=null, sheets=[], recognized=false;
        for(var si=0;si<wb.SheetNames.length;si++){
          var rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[si]],{header:1,raw:false,defval:''});
          var got=parseBank(rows);
          if(!got) continue;                     // 입·출금 열이 없는 시트(안내문 등)
          recognized=true;
          if(!got.length) continue;
          sheets.push(wb.SheetNames[si]+' '+got.length+'건');
          txns=(txns||[]).concat(got);
        }
        if(recognized&&!txns) txns=[];
        if(txns&&txns.length){
          /* 머리글에 계좌번호가 없는 파일도 있다(이비공동 '1. 계좌(100-034-394413)거래내역_2024년.xlsx').
             그럴 때 **파일명**에서 계좌번호를 뽑아 채운다 — 있으면 이체 매칭이 '확실'로 동작한다. */
          if(!txns.some(function(x){ return x.acct; })){
            var fm=String(file.name||'').match(/(\d{2,}[-\s]\d{2,}[-\s]\d{2,}[-\s\d]*|\d{10,})/);
            if(fm){ var fa=fm[1].replace(/\D/g,''); if(fa.length>=10) txns.forEach(function(x){ x.acct=fa; }); }
          }
          /* 같은 내역이 여러 시트에 겹쳐 들어온 경우만 걸러낸다 — 일자·입금·출금·적요에
             **거래 후 잔액까지** 같아야 중복으로 본다. 월별 시트는 잔액이 달라 살아남고,
             같은 날 같은 금액의 서로 다른 거래도 잔액이 달라 보존된다. */
          var _seen={}, _uniq=[];
          txns.forEach(function(x){
            var k=x.date+'|'+x.deposit+'|'+x.withdraw+'|'+x.memo+'|'+x.balance;
            if(_seen[k]) return; _seen[k]=1; _uniq.push(x);
          });
          txns=_uniq;
        }
        if(!txns){ toast('통장 형식을 인식하지 못했습니다 (입금·출금 열 없음)','err'); return; }
        if(!txns.length){ toast('거래 내역이 없습니다','warn'); return; }
        confirmM('['+_fname+' · '+_yr+'년] '+txns.length+'건의 거래를 읽었습니다.'+(sheets.length>1?'\n시트 '+sheets.length+'개: '+sheets.join(' / '):'')+'\n자동분개 제안과 함께 가져올까요?\n(이미 있는 거래는 승인·분개를 그대로 보존합니다)',{ok:'가져오기'}).then(function(ok){ if(!ok)return;
          return Promise.all([loadLearned(),_siteNames(_fid)]).then(function(_pre){   // 배운 거래처·참여사업장명을 제안에 반영
          var _snames=_pre[1];
          var path=NS+'/txns/'+_fid+'/'+_yr;
          fbDb.ref(path).once('value').then(function(snap){   // 서버 최신본 기준 중복검사 — 오래된 캐시로 승인 거래 덮어쓰기 방지
            var existing=snap.val()||{};
            var obj={}, added=0, kept=0, seen={};
            txns.forEach(function(x){ var base=x.date+'|'+x.deposit+'|'+x.withdraw+'|'+x.memo;
              var n=(seen[base]=(seen[base]||0)+1);
              var key=hkey(n>1?base+'|'+n:base);   // 같은 날 동일 금액·적요 거래도 각각 보존
              /* 키가 겹치면 **정말 같은 거래인지** 확인한다. 적요가 'BZ뱅크'처럼 수단 이름뿐인 은행은
                 계좌가 달라도 일자·금액·적요가 같아 키가 겹친다 — 참살이공동 2024는 두 계좌를
                 따로 가져오면 겹치는 3건(23,934,000원)이 중복으로 버려졌다.
                 계좌번호나 거래 후 잔액이 다르면 다른 거래이므로 뒤에 번호를 붙여 살린다.
                 같은 파일을 다시 가져올 때는 계좌·잔액이 같아 그대로 '기존 유지'가 된다. */
              var dup=false;
              while(existing[key]||obj[key]){
                var cur=existing[key]||obj[key];
                if(String(cur.acct||'')===String(x.acct||'')&&String(cur.balance||'')===String(x.balance||'')){ dup=true; break; }
                n++; key=hkey(base+'|'+n);
              }
              seen[base]=n;
              if(dup){ kept++; return; }
              var p=proposeAcct(x.memo,x.deposit>0,_snames,x.kind);
              obj[key]={date:x.date,memo:x.memo,deposit:x.deposit,withdraw:x.withdraw,balance:x.balance,acct:(x.acct||''),kind:(x.kind||''),debit:p.d,credit:p.c,approved:false}; added++;
            });
            if(added===0){ toast('새로 추가할 거래가 없습니다 (기존 '+kept+'건 유지)','warn'); return; }
            return fbDb.ref(path).update(obj).then(function(){
              /* 계좌번호가 서로 다른 확실한 이체만 자동 상계. 추정은 사람이 확인하게 남긴다. */
              var merged=Object.assign({},existing,obj);
              var list=Object.keys(merged).map(function(k){ var o=Object.assign({},merged[k]); o._id=k; return o; });
              var sure=findTransfers(list).filter(function(pr){ return pr.kind==='sure'; });
              return applyTransfers(sure,_fid,_yr,true).then(function(nx){
                S.txnsFor=null; renderFund();
                toast('가져오기 완료: 신규 '+added+'건'+(kept?' · 기존 '+kept+'건 보존':'')
                  +(nx?' · 계좌 간 이체 '+nx+'쌍 자동 상계':''));
              });
            });
          }).catch(function(e){ toast('저장 실패: '+e.message,'err'); });
          });
        });
      }catch(e){ toast('파싱 실패: '+e.message,'err'); }
    };
    rd.readAsArrayBuffer(file);
  };
  inp.click();
}
function setTxnAcct(id,side,val){ var _key=S.fundId+'/'+S.year;
  fbDb.ref(NS+'/txns/'+_key+'/'+id+'/'+side).set(val)
    .then(function(){ if(S.txnsFor===_key&&S.txns&&S.txns[id])S.txns[id][side]=val; renderFund(); })
    .catch(function(e){ toast('저장 실패: '+e.message,'err'); renderFund(); }); }
function approveTxn(id,on){
  var x=S.txns&&S.txns[id];
  if(on){
    if(x&&!_txnDone(x)){ toast(_splitsOf(x).length?'조각 합계를 거래금액과 맞추세요':'차변·대변 계정을 먼저 지정하세요','warn'); renderFund(); return; }
    /* 계좌 간 이체는 현금↔현금으로 상계하므로 차·대가 같은 것이 정상이다 */
    if(x&&!_splitsOf(x).length&&x.debit===x.credit&&!x.xfer){ toast('차변과 대변이 같은 계정입니다','warn'); renderFund(); return; }
  }
  var _key=S.fundId+'/'+S.year, _fid=S.fundId;
  fbDb.ref(NS+'/txns/'+_key+'/'+id+'/approved').set(on)
    .then(function(){
      if(S.txnsFor===_key&&S.txns&&S.txns[id])S.txns[id].approved=on;
      // 사람이 확정한 것만 기억한다(이체 상계는 거래처 성격이 아니라 제외)
      // 쪼갠 거래는 계정이 하나가 아니어서 거래처 학습에 쓰지 않는다
      if(on&&x&&!x.xfer&&!_splitsOf(x).length) learnAcct(x.memo,(num(x.deposit)||0)>0,x.debit,x.credit,_fid);
      renderFund();
    })
    .catch(function(e){ toast('저장 실패: '+e.message,'err'); renderFund(); });
}
function delTxn(id){ confirmM('이 거래를 삭제할까요?',{ok:'삭제',danger:true}).then(function(ok){ if(ok) fbDb.ref(NS+'/txns/'+S.fundId+'/'+S.year+'/'+id).remove().then(function(){S.txnsFor=null;renderFund();toast('삭제되었습니다');}).catch(function(e){toast('삭제 실패: '+e.message,'err');}); }); }

/* ══ 거래 쪼개기 화면 ══ */
var _splitId=null, _splitRows=[];
function splitForm(id){
  var x=(S.txns||{})[id]; if(!x){ toast('거래를 찾지 못했습니다','err'); return; }
  var total=(num(x.deposit)||0)+(num(x.withdraw)||0);
  if(!total){ toast('금액이 없는 거래는 쪼갤 수 없습니다','warn'); return; }
  _splitId=id;
  var sp=_splitsOf(x);
  _splitRows = sp.length ? sp.map(function(s){ return {acct:s.acct, amount:num(s.amount)||0}; })
    : [{acct:((num(x.deposit)||0)>0?x.credit:x.debit)||'', amount:total},{acct:'지급수수료', amount:0}];
  _splitOpen();
}
function _splitTotal(){ var x=(S.txns||{})[_splitId]||{}; return (num(x.deposit)||0)+(num(x.withdraw)||0); }
function _splitRead(){
  _splitRows=_splitRows.map(function(r,i){
    var a=$('sp-a-'+i), m=$('sp-m-'+i);
    return {acct:a?String(a.value||''):r.acct, amount:m?(num(m.value)||0):r.amount};
  });
}
function splitAddRow(){ _splitRead(); _splitRows.push({acct:'',amount:0}); _splitOpen(); }
function splitDelRow(i){ _splitRead(); _splitRows.splice(i,1);
  while(_splitRows.length<2) _splitRows.push({acct:'',amount:0}); _splitOpen(); }
function _splitSumShow(){
  var total=_splitTotal(), s=0;
  for(var i=0;i<_splitRows.length;i++){ var m=$('sp-m-'+i); if(m) s+=num(m.value)||0; }
  var el=$('sp-sum'); if(!el) return;
  el.innerHTML='조각 합계 <b>'+s.toLocaleString()+'</b> / 거래금액 '+total.toLocaleString()
    +(s===total?' <span class="chip ok" style="font-size:10px">일치</span>'
               :' <span class="chip warn" style="font-size:10px">차이 '+(s-total).toLocaleString()+'</span>');
}
function _splitOpen(){
  var x=(S.txns||{})[_splitId]||{}, total=_splitTotal(), isDep=(num(x.deposit)||0)>0;
  var rows=_splitRows.map(function(r,i){
    return '<div class="row" style="gap:6px;margin-bottom:6px">'
      +'<select id="sp-a-'+i+'" style="flex:1;padding:4px 6px"><option value="">(계정 선택)</option>'
      +ACCTS.map(function(a){return '<option'+(r.acct===a?' selected':'')+'>'+a+'</option>';}).join('')+'</select>'
      +'<input id="sp-m-'+i+'" value="'+(r.amount?r.amount.toLocaleString():'')+'" oninput="_splitSumShow()"'
      +' style="width:130px;text-align:right;padding:4px 6px" placeholder="0">'
      +'<button onclick="splitDelRow('+i+')" style="padding:2px 7px">×</button></div>';
  }).join('');
  showModal('<h2 style="margin:0 0 4px">거래 쪼개기</h2>'
    +'<p class="muted" style="font-size:12px;margin:0 0 10px">한 줄에 성격이 다른 금액이 함께 찍힌 경우입니다.<br>'
    +'<b>'+esc(String(x.memo||''))+'</b> · '+(isDep?'입금':'출금')+' <b>'+total.toLocaleString()+'원</b>을 계정별로 나눕니다. '
    +'조각 합계가 이 금액과 같아야 저장됩니다 — <b>통장 잔액 대사는 원래 금액 그대로 유지됩니다.</b></p>'
    +'<div>'+rows+'</div>'
    +'<div class="row" style="gap:10px;margin-top:4px"><button onclick="splitAddRow()">＋ 줄 추가</button>'
    +'<span id="sp-sum" class="muted" style="font-size:12px"></span></div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:14px;gap:8px">'
    +(_splitsOf(x).length?'<button onclick="splitClear()">분할 해제</button>':'')
    +'<button onclick="closeM()">취소</button><button class="primary" onclick="splitSave()">저장</button></div>');
  _splitSumShow();
}
function splitSave(){
  _splitRead();
  var id=_splitId, x=(S.txns||{})[id]; if(!x){ closeM(); return; }
  var total=(num(x.deposit)||0)+(num(x.withdraw)||0), isDep=(num(x.deposit)||0)>0;
  var sp=_splitRows.filter(function(r){ return r.acct&&(num(r.amount)||0)>0; });
  if(sp.length<2){ toast('계정과 금액을 두 줄 이상 채우세요','warn'); return; }
  var sum=sp.reduce(function(s,r){ return s+(num(r.amount)||0); },0);
  if(sum!==total){ toast('조각 합계 '+sum.toLocaleString()+'원이 거래금액 '+total.toLocaleString()+'원과 다릅니다','warn'); return; }
  var _key=S.fundId+'/'+S.year, up={};
  up.splits=sp.map(function(r){ return {acct:r.acct, amount:num(r.amount)||0}; });
  /* 분할이면 차·대 선택은 쓰지 않는다 — 현금 쪽만 남겨 장부에서 반대편으로 쓴다 */
  up[isDep?'debit':'credit']='현금성자산';
  up[isDep?'credit':'debit']='';
  fbDb.ref(NS+'/txns/'+_key+'/'+id).update(up).then(function(){
    if(S.txnsFor===_key&&S.txns&&S.txns[id]) Object.keys(up).forEach(function(k){ S.txns[id][k]=up[k]; });
    closeM(); renderFund(); toast('거래를 '+sp.length+'개 계정으로 나눴습니다');
  }).catch(function(e){ toast('저장 실패: '+e.message,'err'); });
}
function splitClear(){
  var id=_splitId, _key=S.fundId+'/'+S.year;
  fbDb.ref(NS+'/txns/'+_key+'/'+id+'/splits').remove().then(function(){
    if(S.txnsFor===_key&&S.txns&&S.txns[id]) S.txns[id].splits=null;
    closeM(); renderFund(); toast('분할을 해제했습니다');
  }).catch(function(e){ toast('해제 실패: '+e.message,'err'); });
}

   +'<p>근거: 2025년 근로복지기금 지원사업 시행 안내(근로복지넷), 고시 제8·9조.</p>'},
 'sub.score':{t:'예상 심사점수',h:'<p>심사 100점 중 <b>정량 70점은 우리 데이터로 자동 계산</b>됩니다 — 출연금÷신청액, 근로자수 편중, 참여 기업 수.</p>'
   +'<p><b>정성 30점</b>은 심사위원 재량이라 직접 넣습니다(실제 사례에서 18~28점).</p>'
   +'<p><b>배제 사유</b>: 출연금보다 많이 신청 / 한 기업 근로자가 90% 이상 / 참여 2개소 미만.</p>'
   +'<p>⚠ 이 배점은 <b>2024년 평가표</b> 기준입니다. 2025년에 정성 30→40점, 정량 70→60점(①25→15점, ③1인당 기지원액 삭제→참여기업 1개소당 평균 근로자수)으로 개정됐으니 최신 평가표를 받아 배점을 교체해야 정확합니다.</p>'},
 'sub.opt':{t:'신청액을 얼마로 쓸까',h:'<p>지원율은 점수에 따라 <b>계단식</b>입니다 — 80점↑ 100%, 60~80점 75%, 40~60점 50%, 40점 미만 배제.</p>'
   +'<p>신청액을 올리면 <b>출연금÷신청액</b>이 낮아져 ①점수가 깎이고, 점수가 한 칸 내려가면 지원율이 뚝 떨어집니다. 그래서 <b>신청액을 올렸는데 받는 돈이 줄어드는 구간</b>이 생깁니다.</p>'
   +'<p>표에서 <b>예상 수령액이 가장 큰 행</b>이 추천입니다. [이 금액] 버튼으로 신청액에 넣고 저장하세요.</p>'},
 'sub.docs':{t:'제출서류 관리',h:'<p>공동기금 지원 신청 제출서류는 <b>11종</b>입니다(사내기금은 14종).</p>'
   +'<p>이 중 <b>중소기업확인서·법인등기부등본·사업자등록증은 참여사마다 각 1부</b>라, 32개사면 96장이 됩니다. 그래서 아래 격자에서 사업장별로 따로 체크합니다.</p>'
   +'<p>[📄 서식] 버튼이 있는 것은 이 시스템이 만들어 줍니다. [📋 미제출 명단]으로 담당자 연락처까지 복사해 독촉할 수 있습니다.</p>'},
 'bulk.labor':{t:'관할 노동청 일괄 추정',h:'<p>기금 설립·변경 <b>인가신청서의 수신처</b>(「○○지방고용노동청(○○지청)장 귀하」)로 쓰입니다.</p>'
   +'<p>고용노동부 직제의 관할구역으로 뽑은 <b>추정값</b>입니다. 서울·경기·충남·충북·대전만 매핑돼 있고 나머지는 비워 둡니다.</p>'
   +'<p><b>서산지청</b>은 2025-12-30 서산출장소에서 승격돼 서산시·태안군을 맡습니다(옛 자료에는 보령지청으로 나옵니다).</p>'
   +'<p>실제 관할은 <b>고용노동부(moel.go.kr)</b>에서 확인하세요. <b>비어 있는 기금만</b> 채웁니다.</p>'},
 'subboard':{t:'지원금 한 화면 입력',h:'<p>그 해 공동기금 전체의 지원금을 <b>한 화면에서</b> 입력합니다.</p><p>칸에 입력하고 다른 칸으로 이동하면 <b>자동 저장</b>됩니다. 기금명을 클릭하면 그 기금 화면으로 넘어갑니다.</p>'},
 'bill.pe':{t:'푸른이알피 연동 청구',h:'<p>푸른이알피 <b>기금관리</b>의 계약금·잔금(미입금)과 확정 매출을 그대로 읽어옵니다.</p>'
   +'<p><b>여기서는 수정하지 않습니다</b> — 금액·입금 처리는 푸른이알피에서 하세요.</p>'
   +'<p><b>기금 연결 순서</b></p><ul><li>직접 지정한 연결</li><li>고유번호·사업자·법인등록번호</li><li>기금명(㈜·근로복지기금 표기를 걷어내고 비교)</li></ul>'
   +'<p>후보가 둘 이상이면 잘못 붙이지 않도록 <b>연결하지 않고</b> ⚠미연결로 남깁니다 — [🔗 연결]로 지정하세요.</p>'},
 'bill.own':{t:'기금 시스템 자체 청구',h:'<p>결산·운영상황보고 보수처럼 <b>기금 시스템에서 직접 관리</b>하는 청구입니다.</p>'
   +'<p>금액은 <b>부가세 별도 공급가</b>입니다. 계산서일·입금일을 넣으면 상태(미청구→청구→입금완료)가 자동으로 바뀝니다.</p>'},
 'forms.lib':{t:'서식 자료실 (전사 표준서식)',h:'<p><b>모든 기금에 적용되는 표준서식</b>을 관리하는 곳입니다 — 견본을 편집해 [💾 공동/사내 공통]으로 저장하거나 원본 .hwp·엑셀을 등록합니다.</p>'
   +'<p>특정 기금의 서식(실데이터 채움·개별 저장)은 <b>기금 현황 → 기금 클릭 → 📑 서식 탭</b>에서 합니다.</p>'},
 'forms.fund':{t:'이 기금의 서식',h:'<p><b>이 기금의 데이터</b>로 채워진 서식입니다.</p><p>왼쪽에서 <b>서식 이름을 클릭</b>하면 오른쪽에서 수정·저장·출력합니다.</p>'
   +'<p><b>[💾 이 기금]</b> = 이 기금 전용으로 저장<br><b>[💾 공통]</b> = 같은 유형 전체의 기본서식으로 저장(서식 자료실에서 관리)</p>'},
 'forms.hwp':{t:'미리보기·편집 vs HWP 편집',h:'<p><b>👁 미리보기·편집</b> — 데이터를 채운 HTML 초안입니다. 화면에서 수정하고 인쇄·HWPX로 저장합니다.</p>'
   +'<p><b>📄 HWP 편집</b> — 원본 .hwp를 등록하면 rhwp 편집기로 열어 .hwp/.hwpx로 저장합니다. <b>원본 서식 그대로</b> 필요할 때 쓰세요.</p>'
   +'<p>HWP 원본은 <b>이 브라우저에 1회만</b> 등록하면 계속 쓰입니다.</p>'},
 'forms.excel':{t:'엑셀로 한 번에 채워받기',h:'<p>공식 제출은 <b>엑셀이 형태를 100% 보존</b>합니다(표·수식·격자·도장란).</p>'
   +'<p>원본 법정서식 엑셀을 <b>최초 1회</b> 등록하면, 이후 인가 6종을 한 번에 채워 내려받을 수 있습니다.</p>'},
 'forms.tax':{t:'③ 고유번호증 서식',h:'<p>설립등기 후 <b>관할 세무서</b>에 법인설립신고·사업자등록(고유번호증)을 신청할 때 필요한 서식입니다.</p>'
   +'<p>사무소를 무상으로 쓰는 경우 <b>전대 사용동의서</b>를 함께 제출합니다.</p>'},
 'forms.ops':{t:'④ 운영 단계 서식',h:'<p>운영 중 제출·발급하는 서식입니다.</p><p>결산·변경이력이 필요한 서식은 아래 링크를 눌러 해당 탭에서 생성하세요 — 실데이터가 있어야 채워집니다.</p>'},
 'forms.sub':{t:'⑤ 지원금 신청 서식',h:'<p>매년 지원금을 신청할 때 제출하는 서식 묶음입니다.</p><p>금액·참여사업장은 <b>지원금 입력</b> 탭의 데이터로 채워집니다.</p>'},
 'forms.incent':{t:'⑥ 인센티브 서식',h:'<p>공동근로복지기금 설립·운영 지원에 따른 <b>비용청구(별지 제11호의2)</b> 서식입니다.</p>'},
 'forms.draft':{t:'전체 초안(6종) 미리보기',h:'<p>기금 기본정보로 채운 6종 초안입니다. <b>A4 낱장</b>으로 나뉘어 그대로 인쇄됩니다.</p>'
   +'<p>공식 제출용은 형태가 100% 보존되는 <b>엑셀 채움</b>을 권합니다.</p>'},
 'forms.xlprev':{t:'엑셀 미리보기',h:'<p>값·병합을 확인하는 <b>읽기전용</b> 화면입니다.</p><p>수정·인쇄는 [⬇ 받기] 후 <b>엑셀에서</b> 하세요 — 원본 법정서식(A4)의 표·수식·서식이 100% 보존됩니다.</p>'},
 'forms.edit':{t:'서식 수정·저장',h:'<p>내용을 클릭해 바로 수정합니다.</p><p><b>[💾 이 기금]</b> = 이 기금 전용 저장<br><b>[💾 공통]</b> = 같은 유형 모든 기금의 기본서식</p>'
   +'<p>격자·도장란이 그대로 필요하면 <b>엑셀</b> 또는 <b>HWP</b>를 쓰세요.</p>'},
 'setup.flow':{t:'설립 진행',h:'<p>신규 설립 절차입니다. 중간에 나가도 <b>이 상태로 저장</b>되며, 목록에서 <b>🏗 설립중</b> 표시로 다시 찾아 이어서 진행할 수 있습니다.</p>'
   +'<p>12단계를 마치면 <b>[운영 전환]</b>으로 정식 운영 기금이 됩니다.</p><p>인가번호·등기 등 실제 값은 <b>[기금 정보] 탭</b>에 입력합니다.</p>'},
 'setup.list':{t:'설립중 기금 목록',h:'<p>[등록]까지 마친 신규 기금입니다.</p><p>열어서 이어서 진행하거나, 잘못 만든 것은 <b>삭제 보관함</b>으로 옮기세요(복원 가능).</p>'},
 'doc.read':{t:'서류 자동 판독',h:'<p><b>전자문서 PDF</b>는 글자를 그대로 읽어 <b>정확</b>합니다.</p>'
   +'<p><b>스캔본·사진</b>은 OCR로 읽습니다(최초 1회 한국어 데이터 약 15MB 내려받기). <b>오독이 있을 수 있으니 반드시 확인</b>하세요.</p>'
   +'<p>판독 결과는 [아래 칸에 반영]을 눌러야 입력되고, 저장은 별도입니다.</p>'},
 'close.bank':{t:'통장 자동분개',h:'<p>통장 엑셀을 올리면 거래를 읽어 자동분개를 <b>제안</b>합니다.</p><p>차변/대변 계정을 확인·수정하고 <b>승인</b>에 체크하세요 — 승인한 것만 결산에 반영됩니다.</p>'
   +'<p><b>장부는 모두 이 승인 분개에서 나옵니다</b> — 분개장 → 계정별원장 → 월계표 → 시산표 → 재무제표 순으로 파생되므로, 어느 화면에서 봐도 숫자가 같습니다.</p>'},
 'close.journal':{t:'분개장',h:'<p>승인된 거래를 <b>일자순</b>으로 차변·대변 한 쌍씩 보여줍니다.</p>'
   +'<p>같은 날 거래가 2건 이상이면 <b>일자 소계</b>가 붙습니다. 맨 아래 합계는 차변·대변이 반드시 같아야 합니다.</p>'},
 'close.ledger':{t:'계정별원장',h:'<p>계정 하나를 골라 그 계정의 거래만 <b>잔액이 이어지도록</b> 봅니다.</p>'
   +'<p>맨 위 회색 줄이 <b>전기이월</b>이고, 그 아래로 잔액이 누적됩니다.</p>'
   +'<p>잔액 방향은 계정 성격에 따릅니다 — <b>자산·비용</b>은 차변 잔액, <b>부채·자본·수익</b>은 대변 잔액.</p>'},
 'close.monthly':{t:'월계표',h:'<p>계정별로 <b>월별 발생액</b>을 한 표에 펼칩니다. 어느 달에 무엇이 늘고 줄었는지 한눈에 보입니다.</p>'
   +'<p>부호는 그 계정이 <b>늘어난 방향</b>을 +로 잡습니다(자산·비용은 차변 증가, 부채·자본·수익은 대변 증가). 빨간 음수는 감소입니다.</p>'
   +'<p>거래가 없는 달은 열이 생기지 않습니다.</p>'},
 'close.tb':{t:'합계잔액시산표',h:'<p>제출 서식과 같은 <b>4열</b>(차변 합계·잔액 / 계정과목 / 대변 잔액·합계)로 만듭니다.</p>'
   +'<p>전기이월도 합계에 포함됩니다. 맨 아래 <b>차변 합계=대변 합계</b>, <b>차변 잔액=대변 잔액</b>이 맞아야 결산이 성립합니다.</p>'
   +'<p>불일치가 뜨면 전기이월 입력이나 미승인 거래를 먼저 확인하세요.</p>'},
 'close.fin':{t:'재무제표 · 전기 대비',h:'<p>재무상태표·손익계산서를 <b>당기와 전기를 나란히</b> 놓고 증감액·증감률까지 계산합니다.</p>'
   +'<p>전기 숫자는 <b>지난해 승인 분개 + 지난해 전기이월</b>로 그 자리에서 다시 계산한 것입니다 — 따로 입력하지 않습니다.</p>'
   +'<p>지난해 자료가 없으면 전기는 0으로 표시되고 안내 배지가 붙습니다.</p>'},
 'close.years':{t:'연도별 비교',h:'<p>한 기금의 <b>여러 연도를 나란히</b> 놓고 자산·기본재산·목적사업비·순이익·수혜자수의 흐름을 봅니다.</p>'
   +'<p><b>확정</b> 배지가 붙은 연도는 결산 확정 당시의 <b>스냅샷</b>을 그대로 보여줍니다 — 나중에 거래를 손대도 제출했던 숫자가 바뀌지 않습니다.</p>'
   +'<p><b>작성중</b>은 지금 거래에서 계산한 값이라 바뀔 수 있습니다.</p>'
   +'<p>▲▼는 <b>직전 연도 대비</b> 증감 방향입니다.</p>'},
 'home.view':{t:'보기 전환',h:'<p>기금 목록은 <b>하나</b>입니다. 위 탭으로 <b>어느 기금</b>을 볼지 고르고, 보기 전환으로 <b>무엇을</b> 볼지 고릅니다.</p>'
   +'<p><b>기본정보</b> — 담당·대표자·정보 완비도·계약관계<br><b>서식 준비</b> — 기금별 서식 작성 상태<br><b>결산</b> — 연도별 결산 확정 상태</p>'
   +'<p>목록 화면을 여러 개 두지 않고 <b>열만 바꿉니다</b>. 그래서 지역·공동·사내 같은 분류와 검색이 세 보기 모두에 그대로 적용됩니다.</p>'},
 'home.docs':{t:'서식 준비 상태',h:'<p>지금 분류에 속한 기금들의 <b>서식 작성 상태</b>를 한눈에 비교합니다.</p>'
   +'<p><b>🟢</b> 개별 저장본 있음<br><b>📎</b> 원본 HWP 등록(전사 공통)<br><b>⚪</b> 미작성(자동생성 초안만)<br><b>·</b> 해당 없음(공동/사내 유형 불일치)</p>'

 'close.f15':{t:'운영상황보고서 (별지 제15호)',h:'<p>고용노동부에 제출하는 <b>정식 2쪽 서식</b>을 장부에서 만들어 냅니다. 단위는 <b>천원</b>입니다.</p>'

 'close.report':{t:'운영상황보고',h:'<p>체크하면 완료로 저장됩니다.</p><p>운영상황보고(별지15호) 기한은 <b>회계연도 종료 후 3개월</b>(익년 3월 31일)입니다.</p>'},
 'sub.incent':{t:'공단 인센티브 현황',h:'<p>근로복지공단 지원 사업 정보입니다.</p><p><b>결정액 대비 집행액</b>으로 정산 상태가 자동 표시됩니다.</p>'},
 'sub.fill':{t:'지원신청서 자동 채움',h:'<p>공단 원본 양식에 이 기금의 <b>법인정보·참여사업장 명단</b>을 자동으로 채워 내려받습니다.</p>'

 'site.years':{t:'사업장 연도별 기록',h:'<p>사업장 명부는 <b>현재 상태 한 벌</b>만 두고, 해마다 달라지는 값은 여기에 연도별로 쌓습니다.</p>'
   +'<p><b>출연금</b> — 그 해 이 사업장이 낸 금액<br><b>상시근로자</b> — 그 해 기준 인원<br><b>수혜자</b> — 그 해 복지혜택을 받은 인원</p>'
   +'<p>칸에서 벗어나면 자동 저장됩니다. 위 연도 선택으로 다른 해를 보고, [작년 값 불러오기]로 <b>비어 있는 칸만</b> 채울 수 있습니다(이미 넣은 값은 건드리지 않습니다).</p>'
   +'<p>별지15호 ⑨⑩ 근로자 수는 사업장 명부의 상시근로자와 협력 체크에서 나옵니다 — 여기 값은 연도별 추이·검증용입니다.</p>'},
 'site.pull':{t:'등록 업체에서 당겨오기',h:'<p>모기업 등 <b>이미 등록된 업체</b>를 골라 참여사업장으로 당겨옵니다.</p><p>사업자등록번호가 같은 사업장은 중복 등록되지 않습니다.</p>'},
 'newfund':{t:'새 기금 등록',h:'<p><b>신규</b>(설립부터) 또는 <b>기존</b>(이미 설립·운영 중) 기금을 등록합니다.</p><p>담당은 푸른이알피 <b>재직자</b>에서 선택합니다.</p>'},
 'mgr':{t:'담당자 지정',h:'<p>푸른이알피 재직자 명단에서 선택합니다.</p><p><b>주담당 1명</b>, <b>부담당은 여러 명</b> 지정할 수 있습니다.</p>'}
};
function hlp(k){ if(!HELP[k]) return '';
  return '<button class="hbtn" onclick="event.stopPropagation();showHelp(\''+k+'\')" title="'+esc(HELP[k].t)+' — 설명 보기">ⓘ</button>'; }
function showHelp(k){ var x=HELP[k]; if(!x) return;
  showModal('<h2 style="margin:0 0 10px;font-size:16px">ⓘ '+esc(x.t)+'</h2><div class="helpbody">'+x.h+'</div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:16px"><button class="primary" onclick="closeM()">닫기</button></div>');
}
// ── 간단 모달 ──
function showModal(html,opts){
  opts=opts||{};
  var m=document.createElement('div'); m.id='modalbg';
  m.style.cssText='position:fixed;inset:0;background:rgba(20,30,50,.35);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px';
  m.onclick=function(e){ if(e.target===m) closeM(); };
  m.innerHTML='<div id="modalbox" style="background:#fff;border-radius:14px;padding:20px 22px;max-width:'+(opts.width||640)+'px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)">'+html+'</div>';
  document.body.appendChild(m);
  if(opts.after) setTimeout(opts.after,0);
}
function closeM(){ var m=$('modalbg'); if(m) m.remove(); }
// ── 공통 편의 ①: 통일된 확인 모달 (confirm 대체) ──
function confirmM(msg,opts){
  opts=opts||{};
  return new Promise(function(resolve){
    var m=document.createElement('div'); m.id='confirmbg';
    m.style.cssText='position:fixed;inset:0;background:rgba(20,30,50,.4);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
    var danger=opts.danger?'#b91c1c':'var(--acc)';
    m.innerHTML='<div style="background:#fff;border-radius:14px;padding:22px 24px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.28)">'
      +'<div style="font-size:14px;line-height:1.6;white-space:pre-line;margin-bottom:18px">'+esc(msg)+'</div>'
      +'<div class="row" style="justify-content:flex-end;gap:8px"><button id="cf-no">'+esc(opts.cancel||'취소')+'</button>'
      +'<button id="cf-yes" class="primary" style="background:'+danger+'">'+esc(opts.ok||'확인')+'</button></div></div>';
    document.body.appendChild(m);
    function done(v){ m.remove(); document.removeEventListener('keydown',key,true); resolve(v); }
    function key(e){ if(e.key==='Escape'){e.stopPropagation();done(false);} else if(e.key==='Enter'){e.stopPropagation();done(true);} }
    m.querySelector('#cf-yes').onclick=function(){done(true);};
    m.querySelector('#cf-no').onclick=function(){done(false);};
    m.onclick=function(e){ if(e.target===m) done(false); };
    document.addEventListener('keydown',key,true);
    var y=m.querySelector('#cf-yes'); if(y)y.focus();
  });
}
// ── 공통 편의 ③: 통일된 로딩 표시 ──
function loadingHTML(msg){ return '<div class="loading"><span class="spin"></span>'+esc(msg||'불러오는 중…')+'</div>'; }
// ── 공통 편의 ②: 저장 안 한 변경 이탈 경고 ──
var _dirty=false;
function markDirty(){ _dirty=true; }
function clearDirty(){ _dirty=false; }
window.addEventListener('beforeunload',function(e){ if(_dirty){ e.preventDefault(); e.returnValue=''; } });
// 창 크기 변화 시 A4 미리보기 배율 재계산(과호출 방지 디바운스)
var _fitT=null;
window.addEventListener('resize',function(){ clearTimeout(_fitT); _fitT=setTimeout(function(){
  if(window.innerWidth>860) closeSide();   // 넓어지면 서랍은 자동으로 닫는다(사이드바가 다시 고정 표시됨)
  try{ fitDocA4(); }catch(e){} },150); });
// ── 공통 편의 ④: 키보드 단축키 (Esc=닫기→뒤로 · Backspace=뒤로 · Ctrl/Cmd+S=저장) ──
function _inTyping(e){ var t=e.target||document.activeElement;
  return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable); }
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if($('confirmbg'))return;                       // 확인창은 자체 처리
    if($('modalbg')){ closeM(); return; }           // 1) 모달 닫기
    if(document.body.classList.contains('sideopen')){ closeSide(); return; }   // 1-2) 모바일 서랍 닫기
    var t=document.activeElement;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT')){ t.blur(); return; } // 2) 입력 포커스 해제
    if(S.view!=='home'){ goBack(); }                // 3) 화면 뒤로가기
    return;
  }
  if(e.key==='Backspace'&&!_inTyping(e)){           // 입력 중 아닐 때 백스페이스 = 뒤로
    e.preventDefault();
    if($('modalbg')||$('confirmbg')) return;
    if(S.view!=='home') goBack();
    return;
  }
  if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')){
    e.preventDefault();
    if($('confirmbg')) return;   // 확인 대화상자 떠 있으면 저장 무시
    var mb=$('modalbg'); if(mb){ var pb=mb.querySelector('button.primary'); if(pb){ pb.click(); return; } }
    if(S.view==='fund'&&S.tab==='info'&&typeof saveInfo==='function'){ saveInfo(); }
  }
});
</script>
