function initTop(){

  var WD=['일','월','화','수','목','금','토'];function p(n){return(n<10?'0':'')+n;}

function go(v,id){ S.view=v; if(id!==undefined)S.fundId=id; if(v==='fund')S.tab='info'; route(); }
function route(){
  ['home','ledger','billing'].forEach(function(v){var n=$('nav-'+v);if(n)n.className='sitem'+(S.view===v?' on':'');});
  if(S.view==='fund'&&S.fundId&&funds[S.fundId]) renderFund();
  else if(S.view==='ledger') renderLedger();
  else if(S.view==='billing') renderBilling();
  else { S.view='home'; renderHome(); }
}

function renderHome(){
  $('crumb').textContent='기금 현황';
  var arr=Object.keys(funds).map(function(k){var o=Object.assign({},funds[k]);o._id=k;return o;});
  if(S.q) arr=arr.filter(function(f){return (f.name||'').indexOf(S.q)>=0||(f.short_name||'').indexOf(S.q)>=0||(f.manager||'').indexOf(S.q)>=0;});
  var rpri={'충남':1,'경기':2},order={'지역공동':1,'개별공동':2,'사내':3};
  arr.sort(function(a,b){return (order[grp(a)]-order[grp(b)])||((rpri[a.region]||9)-(rpri[b.region]||9))||(a.short_name||'').localeCompare(b.short_name||'','ko');});
  var GL={'지역공동':'🏛 지역기금','개별공동':'🤝 공동기금','사내':'🏢 사내기금'};
  var html='', lastG=null, num=0;
  arr.forEach(function(f){
    var g=grp(f);
    if(g!==lastG){ if(lastG!==null) html+='</tbody></table>'; lastG=g; num=0;
      var cnt=arr.filter(function(x){return grp(x)===g;}).length;
      html+='<div class="grp-h">'+GL[g]+' <span class="cnt">'+cnt+'개</span></div>'
        +'<table><thead><tr><th>번호</th><th>기금명</th><th>담당</th><th>대표자</th><th>상태</th></tr></thead><tbody>';
    }
    num++;
    var n=nDone(f); var chip=n===5?'<span class="chip ok">정보 완비</span>':n>=3?'<span class="chip warn">정보 '+n+'/5</span>':'<span class="chip dg">정보 '+n+'/5</span>';
    html+='<tr onclick="go(\'fund\',\''+f._id+'\')"><td class="no">'+num+'</td>'
      +'<td style="font-weight:700">'+esc(f.short_name||f.name)+'<div class="muted" style="font-weight:400;font-size:11.5px">'+esc(f.name||'')+'</div></td>'
      +'<td>'+esc(f.manager||'—')+'</td><td>'+esc(f.chairman||'—')+'</td><td>'+chip+'</td></tr>';
  });
  if(lastG!==null) html+='</tbody></table>'; else html='<div class="panel muted">기금이 없습니다.</div>';
  var all=Object.keys(funds).map(function(k){return funds[k];});
  var incN=all.filter(function(f){return nDone(f)<5;}).length;
  var todo=incN?'<div class="panel" style="border-left:3px solid var(--warn)"><div class="row"><b>☀️ 오늘 할 일</b>'
    +'<span style="flex:1"></span></div><div style="margin-top:8px;padding:8px 10px;background:var(--warn-bg);border-radius:8px;cursor:pointer;font-size:13px" onclick="S.ledgerInc=true;go(\'ledger\')">📇 기금 기본정보 미완비 <b>'+incN+'개</b> — 클릭하면 대장에서 채우기 →</div></div>':'';
  $('app').innerHTML=todo+'<div class="panel"><div class="row"><h1>기금 현황</h1>'
    +'<span class="stat">'+arr.length+'개</span><span style="flex:1"></span>'
    +'<input class="search" placeholder="기금명·담당 검색" value="'+esc(S.q)+'" oninput="S.q=this.value;renderHome()"></div></div>'
    +'<div class="panel">'+html+'</div>';
}

// ── 기금 대장 (4단계) ──
var LED_COLS=[['inka_no','인가번호','text'],['inka_date','인가일','date'],['corp_reg_no','법인등록번호','text'],
  ['reg_date','설립등기일','date'],['tax_id_no','고유번호','text'],['address','소재지','text']];
function renderLedger(){
  $('crumb').textContent='기금 대장';
  var arr=Object.keys(funds).map(function(k){var o=Object.assign({},funds[k]);o._id=k;return o;});
  if(S.ledgerQ) arr=arr.filter(function(f){return (f.name||'').indexOf(S.ledgerQ)>=0;});
  if(S.ledgerInc) arr=arr.filter(function(f){return nDone(f)<5;});
  var rpri={'충남':1,'경기':2},order={'지역공동':1,'개별공동':2,'사내':3},GL={'지역공동':'🏛 지역기금','개별공동':'🤝 공동기금','사내':'🏢 사내기금'};
  arr.sort(function(a,b){return (order[grp(a)]-order[grp(b)])||((rpri[a.region]||9)-(rpri[b.region]||9))||(a.short_name||'').localeCompare(b.short_name||'','ko');});
  var edit=!!S.ledgerEdit, ncol=2+LED_COLS.length+1, lastG=null, gnum=0, body='';
  arr.forEach(function(f){
    var g=grp(f);
    if(g!==lastG){ if(lastG!==null)body+='</tbody></table>'; lastG=g; gnum=0;
      var cnt=arr.filter(function(x){return grp(x)===g;}).length;
      body+='<div class="grp-h">'+GL[g]+' <span class="cnt">'+cnt+'개</span></div><table><thead><tr><th>번호</th><th>기금명</th>'
        +LED_COLS.map(function(c){return '<th>'+c[1]+'</th>';}).join('')+'<th>완성도</th></tr></thead><tbody>'; }
    gnum++;
    var tds=LED_COLS.map(function(c){
      if(edit) return '<td><input value="'+esc(f[c[0]]||'')+'" type="'+c[2]+'" onchange="patchFund(\''+f._id+'\',\''+c[0]+'\',this.value)" style="width:'+(c[0]==='address'?'200':'120')+'px;padding:3px 6px;border:1px solid '+(f[c[0]]?'#d6dae3':'#f0a8a8')+';border-radius:5px;font-size:12px"></td>';
      return '<td class="muted"'+(c[0]==='address'?' style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"':'')+'>'+esc(f[c[0]]||'—')+'</td>';
    }).join('');
    var n=nDone(f),chip=n===5?'ok':n>=3?'warn':'dg';
    body+='<tr'+(edit?'':' onclick="go(\'fund\',\''+f._id+'\')"')+'><td class="no">'+gnum+'</td>'
      +'<td style="font-weight:700">'+esc(f.name)+'</td>'+tds+'<td><span class="chip '+chip+'" id="lc-'+f._id+'">'+n+'/5</span></td></tr>';
  });
  if(lastG!==null)body+='</tbody></table>'; else body='<div class="muted">기금이 없습니다.</div>';
  var incN=Object.keys(funds).filter(function(k){return nDone(funds[k])<5;}).length;
  $('app').innerHTML='<div class="panel"><div class="row"><h1>기금 대장</h1><span class="stat">'+arr.length+'개</span>'
    +'<span class="stat" style="background:var(--warn-bg);color:var(--warn)">미완비 '+incN+'</span><span style="flex:1"></span>'
    +'<label style="font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox"'+(S.ledgerInc?' checked':'')+' onchange="S.ledgerInc=this.checked;renderLedger()"> 미완비만</label>'
    +'<button class="'+(edit?'primary':'')+'" onclick="S.ledgerEdit=!S.ledgerEdit;renderLedger()">'+(edit?'✓ 입력 종료':'✏️ 입력 모드')+'</button>'
    +'<input class="search" placeholder="기금명 검색" value="'+esc(S.ledgerQ||'')+'" oninput="S.ledgerQ=this.value;renderLedger()"></div>'
    +'<p class="muted" style="font-size:12px;margin:6px 0 0">'+(edit?'칸에 바로 입력하면 자동 저장. 빨간 테두리=빈 칸.':'행 클릭 시 그 기금으로. 값 채우려면 [✏️ 입력 모드].')+'</p></div>'
    +'<div class="panel">'+body+'</div>';
}
function patchFund(id,field,val){
  val=val.trim?val.trim():val;
  fbDb.ref(NS+'/funds/'+id+'/'+field).set(val).then(function(){
    funds[id][field]=val; var b=$('lc-'+id); if(b){var n=nDone(funds[id]);b.textContent=n+'/5';b.className='chip '+(n===5?'ok':n>=3?'warn':'dg');}
  }).catch(function(e){alert('저장 실패: '+e.message);});
}

// ── 청구 관리 (4단계) ──
function renderBilling(){
  $('crumb').textContent='청구 관리';
  if(!S.billingsLoaded){ S.billingsLoaded=true;
    fbDb.ref(NS+'/billings').on('value',function(s){S.billings=s.val()||{};if(S.view==='billing')renderBilling();});
    $('app').innerHTML='<div class="panel muted">불러오는 중…</div>'; return; }
  var b=S.billings||{};
  var arr=Object.keys(b).map(function(k){var o=Object.assign({},b[k]);o._id=k;return o;});
  arr.sort(function(a,b2){return (b2.year||0)-(a.year||0)||(a.fund_id||'').localeCompare(b2.fund_id||'');});
  var tot=arr.reduce(function(s,x){return s+(num(x.amount)||0);},0), paid=arr.filter(function(x){return x.paid_date;}).reduce(function(s,x){return s+(num(x.amount)||0);},0);
  var rows=arr.map(function(r){
    var fn=(funds[r.fund_id]&&(funds[r.fund_id].short_name||funds[r.fund_id].name))||r.fund_id;
    var st=r.paid_date?'<span class="chip ok">입금완료</span>':r.invoice_date?'<span class="chip warn">청구</span>':'<span class="chip dg">미청구</span>';
    function ip(k,t){return '<input value="'+esc(r[k]||'')+'" type="'+(t||'text')+'" onchange="patchBilling(\''+r._id+'\',\''+k+'\',this.value)" style="width:'+(t==='date'?'130':'100')+'px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;font-size:12px">';}
    return '<tr><td style="font-weight:700">'+esc(fn)+'<div class="muted" style="font-size:11px">'+esc(r.item||'')+' · '+(r.year||'')+'</div></td>'
      +'<td>'+ip('amount')+'</td><td>'+ip('invoice_date','date')+'</td><td>'+ip('paid_date','date')+'</td><td>'+st+'</td>'
      +'<td><button onclick="delBilling(\''+r._id+'\')">삭제</button></td></tr>';
  }).join('');
  $('app').innerHTML='<div class="panel"><div class="row"><h1>청구 관리</h1><span class="stat">'+arr.length+'건</span>'
    +'<span class="stat">합계 '+tot.toLocaleString()+'원</span><span class="stat" style="background:var(--ok-bg);color:var(--ok)">입금 '+paid.toLocaleString()+'원</span>'
    +'<span style="flex:1"></span><button class="primary" onclick="addBilling()">+ 청구 추가</button></div>'
    +'<p class="muted" style="font-size:12px;margin:6px 0 0">금액은 부가세 별도 공급가. 계산서일·입금일 입력 시 상태 자동 변경.</p></div>'
    +'<div class="panel">'+(arr.length?'<table><thead><tr><th>기금 · 항목</th><th>금액(원)</th><th>계산서일</th><th>입금일</th><th>상태</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>':'<div class="muted">청구 건이 없습니다. [+ 청구 추가]</div>')+'</div>';
}
function addBilling(){
  var opts=Object.keys(funds).map(function(k){return '<option value="'+k+'">'+esc(funds[k].short_name||funds[k].name)+'</option>';}).join('');
  showModal('<h2 style="margin-bottom:10px">청구 추가</h2>'
    +'<div class="fld"><label>기금</label><select id="bl-fund">'+opts+'</select></div>'
    +'<div class="fld" style="margin-top:8px"><label>연도</label><input id="bl-year" value="'+S.year+'"></div>'
    +'<div class="fld" style="margin-top:8px"><label>항목</label><input id="bl-item" value="결산·운영상황보고 보수"></div>'
    +'<div class="fld" style="margin-top:8px"><label>금액(원, 부가세 별도)</label><input id="bl-amount" placeholder="700000"></div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:14px"><button onclick="closeM()">취소</button><button class="primary" onclick="saveBilling()">추가</button></div>');
}
function saveBilling(){
  var o={fund_id:$('bl-fund').value,year:num($('bl-year').value)||S.year,item:$('bl-item').value.trim()||'보수',amount:num($('bl-amount').value)||0,invoice_date:'',paid_date:''};
  fbDb.ref(NS+'/billings').push().set(o).then(function(){closeM();}).catch(function(e){alert('실패: '+e.message);});
}
function patchBilling(id,k,v){ fbDb.ref(NS+'/billings/'+id+'/'+k).set(k==='amount'?(num(v)||0):v.trim()); }
function delBilling(id){ if(confirm('삭제할까요?')) fbDb.ref(NS+'/billings/'+id).remove(); }

function renderFund(){
  var f=funds[S.fundId]; $('crumb').textContent=(f.short_name||f.name);
  var tags=f.fund_type==='사내'?'<span class="tag sanae">사내</span>':'<span class="tag gong">공동</span>';
  var head='<button class="backbtn" onclick="go(\'home\')">← 기금 현황</button>'
    +'<div class="panel"><div class="row"><h1>'+esc(f.short_name||f.name)+'</h1>'+tags
    +'<span style="flex:1"></span><span class="muted">담당 '+esc(f.manager||'—')+'</span></div>'
    +'<div class="kv"><span>인가번호 <b>'+esc(f.inka_no||'—')+'</b></span><span>법인등록번호 <b>'+esc(f.corp_reg_no||'—')+'</b></span>'
    +'<span>고유번호 <b>'+esc(f.tax_id_no||'—')+'</b></span><span>소재지 <b>'+esc(f.address||'—')+'</b></span></div></div>';
  var tabbar='<div class="tabbar">'+TABS.map(function(t){
    if(t[0]==='subsidy'&&f.fund_type==='사내') return '';   // 지원금은 공동 전용
    if(t[2]) return '<div class="tab'+(S.tab===t[0]?' on':'')+'" onclick="S.tab=\''+t[0]+'\';renderFund()">'+t[1]+'</div>';
    return '<div class="tab soon" title="다음 단계에서 추가">'+t[1]+' ·</div>';
  }).join('')+'</div>';
  if(S.tab==='subsidy'&&f.fund_type==='사내') S.tab='info';
  var body = S.tab==='info' ? infoForm(f)
    : S.tab==='sites' ? sitesTab()
    : S.tab==='annual' ? annualTab(f)
    : S.tab==='subsidy' ? subsidyTab(f)
    : S.tab==='welfare' ? welfareTab(f)
    : S.tab==='events' ? eventsTab(f)
    : S.tab==='closing' ? closingTab(f)
    : '<div class="panel muted">이 탭은 다음 단계에서 이전됩니다.</div>';
  $('app').innerHTML=head+tabbar+body;
}
function infoForm(f){
  var flds=FIELDS.map(function(c){
    var v=f[c[0]]||'', inp;
    if(c[2]==='select') inp='<select id="fd-'+c[0]+'">'+['공동','사내'].map(function(o){return '<option'+(v===o?' selected':'')+'>'+o+'</option>';}).join('')+'</select>';
    else inp='<input id="fd-'+c[0]+'" type="'+c[2]+'" value="'+esc(v)+'">';
    return '<div class="fld'+(c[0]==='address'?' full':'')+'"><label>'+c[1]+'</label>'+inp+'</div>';
  }).join('');
  return '<div class="panel"><h2>기금 정보</h2><div id="msg" class="msg"></div>'
    +'<div class="grid" style="margin-top:12px">'+flds+'</div>'
    +'<div class="row" style="margin-top:16px"><button class="primary" onclick="saveInfo()">💾 저장</button>'
    +'<span class="muted" style="font-size:11px">ID '+esc(S.fundId)+' · Firebase 저장</span></div></div>';
}
function saveInfo(){
  var obj=Object.assign({},funds[S.fundId]);
  FIELDS.forEach(function(c){var el=$('fd-'+c[0]);if(el)obj[c[0]]=el.value.trim?el.value.trim():el.value;});
  fbDb.ref(NS+'/funds/'+S.fundId).set(obj).then(function(){var m=$('msg');m.className='msg ok';m.textContent='저장되었습니다.';})
    .catch(function(e){var m=$('msg');m.className='msg err';m.textContent='저장 실패: '+e.message;});
}

// ── 참여사업장 (2단계) ──
function num(v){ var n=parseInt(String(v||'').replace(/[^0-9]/g,''),10); return isNaN(n)?'':n; }
function sitesTab(){
  if(S.sitesFor!==S.fundId){
    S.sitesFor=S.fundId; S.sites=null;
    fbDb.ref(NS+'/sites/'+S.fundId).once('value').then(function(s){ S.sites=s.val()||{}; if(S.tab==='sites'&&S.view==='fund') renderFund(); })
      .catch(function(e){ S.sites={}; if(S.tab==='sites') renderFund(); });
    return '<div class="panel muted">불러오는 중…</div>';
  }
  var sites=S.sites||{};
  var arr=Object.keys(sites).map(function(k){var o=Object.assign({},sites[k]);o._id=k;return o;})
    .filter(function(s){return s.status!=='closed';});
  arr.sort(function(a,b){return String(a.seq_label||'').localeCompare(String(b.seq_label||''),'ko',{numeric:true});});
  var totalEmp=arr.reduce(function(s,x){return s+(num(x.company_size)||0);},0);
  var rows=arr.map(function(s,i){
    return '<tr onclick="editSite(\''+s._id+'\')"><td class="no">'+(i+1)+'</td>'
      +'<td style="font-weight:700">'+esc(s.name||'—')+'</td><td>'+esc(s.ceo||'—')+'</td>'
      +'<td>'+esc(s.biz_no||'—')+'</td><td>'+esc(s.biz_type||'—')+'</td>'
      +'<td style="text-align:right">'+(num(s.company_size)||'—')+'</td>'
      +'<td class="muted" style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(s.address||'—')+'</td></tr>';
  }).join('');
  var tbl = arr.length
    ? '<table><thead><tr><th>번호</th><th>상호</th><th>대표자</th><th>사업자번호</th><th>업종</th><th style="text-align:right">상시근로자</th><th>소재지</th></tr></thead><tbody>'+rows+'</tbody></table>'
    : '<div class="muted" style="padding:20px 4px">등록된 참여사업장이 없습니다. [+ 사업장 추가] 또는 [📥 사업장 데이터 가져오기]로 시작하세요.</div>';
  return '<div class="panel"><div class="row"><h2>참여사업장</h2>'
    +'<span class="stat">'+arr.length+'개사</span><span class="stat">상시근로자 '+totalEmp.toLocaleString()+'명</span>'
    +'<span style="flex:1"></span><button class="primary" onclick="editSite(\'\')">+ 사업장 추가</button>'
    +(arr.length?'':' <button onclick="importSites()">📥 사업장 데이터 가져오기</button>')+'</div>'
    +'<div style="margin-top:12px">'+tbl+'</div></div>';
}
function editSite(sid){
  var s=(S.sites&&S.sites[sid])||{}; var isNew=!sid;
  var flds=SITE_FIELDS.map(function(c){return '<div class="fld'+(c[0]==='address'?' full':'')+'"><label>'+c[1]+'</label>'
    +'<input id="se-'+c[0]+'" type="'+c[2]+'" value="'+esc(s[c[0]]||'')+'"></div>';}).join('');
  showModal('<h2 style="margin-bottom:10px">'+(isNew?'사업장 추가':'사업장 편집')+'</h2>'
    +'<div class="grid">'+flds+'</div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:16px">'
    +(isNew?'':'<button onclick="delSite(\''+sid+'\')" style="margin-right:auto;color:var(--danger)">삭제</button>')
    +'<button onclick="closeM()">취소</button><button class="primary" onclick="saveSite(\''+sid+'\')">저장</button></div>');
}
function saveSite(sid){
  var obj=Object.assign({}, (S.sites&&S.sites[sid])||{status:'active'});
  SITE_FIELDS.forEach(function(c){var el=$('se-'+c[0]);if(el)obj[c[0]]=el.value.trim();});
  if(!obj.name){ alert('상호를 입력하세요'); return; }
  var ref = sid ? fbDb.ref(NS+'/sites/'+S.fundId+'/'+sid) : fbDb.ref(NS+'/sites/'+S.fundId).push();
  ref.set(obj).then(function(){ S.sitesFor=null; closeM(); renderFund(); })
    .catch(function(e){ alert('저장 실패: '+e.message); });
}
function delSite(sid){
  if(!confirm('이 사업장을 삭제할까요?')) return;
  fbDb.ref(NS+'/sites/'+S.fundId+'/'+sid).remove().then(function(){ S.sitesFor=null; closeM(); renderFund(); });
}
function importSites(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='application/json';
  inp.onchange=function(ev){ var f=ev.target.files&&ev.target.files[0]; if(!f) return;
    var rd=new FileReader(); rd.onload=function(){
      try{ var data=JSON.parse(rd.result);

function proposeAcct(memo,isDep){

    if(r.dir!==dir) continue;
    for(var j=0;j<r.kw.length;j++){ if(m.indexOf(r.kw[j])>=0) return {d:r.d,c:r.c}; }
  }
  return {d:'',c:''};
}
function parseBank(rows){
  var hi=-1, col={};
  function find(cells,res){for(var c=0;c<cells.length;c++){var v=String(cells[c]||'');
    if(/날짜|거래일|일자|거래일시/.test(v)&&col.date==null)col.date=c;
    if(/적요|내용|의뢰인|기재|가맹점/.test(v)&&col.memo==null)col.memo=c;
    if(/입금|맡기신|입금액|입금금액/.test(v)&&col.dep==null)col.dep=c;
    if(/출금|찾으신|지급|출금액|출금금액/.test(v)&&col.wd==null)col.wd=c;
    if(/잔액|잔고/.test(v)&&col.bal==null)col.bal=c;}}
  for(var i=0;i<Math.min(rows.length,25);i++){ col={}; find(rows[i]);
    if(col.dep!=null&&col.wd!=null){ hi=i; break; } }
  if(hi<0) return null;
  var out=[];
  for(var r=hi+1;r<rows.length;r++){ var row=rows[r]; if(!row)continue;
    var date=col.date!=null?String(row[col.date]||'').trim():'';
    var memo=col.memo!=null?String(row[col.memo]||'').trim():'';
    var dep=num(row[col.dep]), wd=num(row[col.wd]);
    if(!date&&!memo&&!dep&&!wd) continue;
    if(!dep&&!wd) continue;
    out.push({date:date,memo:memo,deposit:dep||0,withdraw:wd||0,balance:col.bal!=null?(num(row[col.bal])||0):0});
  }
  return out;
}
function hkey(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 't'+(h>>>0).toString(36);}
function importBank(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='.xls,.xlsx';
  inp.onchange=function(ev){ var file=ev.target.files&&ev.target.files[0]; if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
        var ws=wb.Sheets[wb.SheetNames[0]];
        var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
        var txns=parseBank(rows);
        if(!txns){ alert('통장 형식을 인식하지 못했습니다. (입금·출금 열을 찾지 못함)'); return; }
        if(!txns.length){ alert('거래 내역이 없습니다.'); return; }
        if(!confirm(txns.length+'건의 거래를 읽었습니다. 자동분개 제안과 함께 가져올까요?')) return;
        var obj={};
        txns.forEach(function(x){ var p=proposeAcct(x.memo,x.deposit>0);
          obj[hkey(x.date+'|'+x.deposit+'|'+x.withdraw+'|'+x.memo)]={date:x.date,memo:x.memo,deposit:x.deposit,withdraw:x.withdraw,balance:x.balance,debit:p.d,credit:p.c,approved:false};
        });
        fbDb.ref(NS+'/txns/'+S.fundId+'/'+S.year).update(obj).then(function(){ S.txnsFor=null; renderFund(); alert('가져오기 완료: '+txns.length+'건'); })
          .catch(function(e){ alert('저장 실패: '+e.message); });
      }catch(e){ alert('파싱 실패: '+e.message); }
    };
    rd.readAsArrayBuffer(file);
  };
  inp.click();
}
function setTxnAcct(id,side,val){ fbDb.ref(NS+'/txns/'+S.fundId+'/'+S.year+'/'+id+'/'+side).set(val).then(function(){if(S.txns&&S.txns[id])S.txns[id][side]=val;renderFund();}); }
function approveTxn(id,on){
  if(on){ var x=S.txns&&S.txns[id]; if(x&&(!x.debit||!x.credit)){ alert('차변·대변 계정을 먼저 지정하세요'); renderFund(); return; } }
  fbDb.ref(NS+'/txns/'+S.fundId+'/'+S.year+'/'+id+'/approved').set(on).then(function(){if(S.txns&&S.txns[id])S.txns[id].approved=on;renderFund();});
}
function delTxn(id){ if(confirm('이 거래를 삭제할까요?')) fbDb.ref(NS+'/txns/'+S.fundId+'/'+S.year+'/'+id).remove().then(function(){S.txnsFor=null;renderFund();}); }

// ── 간단 모달 ──
function showModal(html){
  var m=document.createElement('div'); m.id='modalbg';
  m.style.cssText='position:fixed;inset:0;background:rgba(20,30,50,.35);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px';
  m.onclick=function(e){ if(e.target===m) closeM(); };
  m.innerHTML='<div style="background:#fff;border-radius:14px;padding:20px 22px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)">'+html+'</div>';
  document.body.appendChild(m);
}
function closeM(){ var m=$('modalbg'); if(m) m.remove(); }
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeM(); });
</script>
