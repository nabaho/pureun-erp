  }).join('');

    : '<div class="muted" style="padding:20px 4px">등록된 참여사업장이 없습니다. [+ 사업장 추가] 또는 [📥 사업장 데이터 가져오기]로 시작하세요.</div>';
  return '<div class="panel"><div class="row"><h2>참여사업장</h2>'

    +'<div style="margin-top:12px">'+tbl+'</div></div>';

function editSite(sid){
  var s=(S.sites&&S.sites[sid])||{}; var isNew=!sid;
  var flds=SITE_FIELDS.map(function(c){return '<div class="fld'+(c[0]==='address'?' full':'')+'"><label>'+c[1]+'</label>'
    +'<input id="se-'+c[0]+'" type="'+c[2]+'" value="'+esc(s[c[0]]||'')+'"></div>';}).join('');

    +'<div class="row" style="justify-content:flex-end;margin-top:16px">'
    +(isNew?'':'<button onclick="delSite(\''+sid+'\')" style="margin-right:auto;color:var(--danger)">삭제</button>')
    +'<button onclick="closeM()">취소</button><button class="primary" onclick="saveSite(\''+sid+'\')">저장</button></div>');

function saveSite(sid){
  var obj=Object.assign({}, (S.sites&&S.sites[sid])||{status:'active'});
  SITE_FIELDS.forEach(function(c){var el=$('se-'+c[0]);if(el)obj[c[0]]=el.value.trim();});
  if(!obj.name){ alert('상호를 입력하세요'); return; }
  var ref = sid ? fbDb.ref(NS+'/sites/'+S.fundId+'/'+sid) : fbDb.ref(NS+'/sites/'+S.fundId).push();

    .catch(function(e){ alert('저장 실패: '+e.message); });

function delSite(sid){

function importSites(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='application/json';
  inp.onchange=function(ev){ var f=ev.target.files&&ev.target.files[0]; if(!f) return;
    var rd=new FileReader(); rd.onload=function(){
      try{ var data=JSON.parse(rd.result);
        if(!confirm('사업장 데이터를 Firebase로 가져올까요? (기금별 사업장 전체)')) return;
        fbDb.ref(NS+'/sites').update(data).then(function(){ alert('가져오기 완료'); S.sitesFor=null; renderFund(); })
          .catch(function(e){ alert('가져오기 실패: '+e.message); });
      }catch(e){ alert('JSON 파싱 실패: '+e.message); }
    }; rd.readAsText(f);
  };
  inp.click();
}

// ── 연도 선택 (연간/지원금 공용) ──
function yearSel(){
  var y=new Date().getFullYear(), opts='';
  for(var i=y+1;i>=y-3;i--) opts+='<option'+(S.year===i?' selected':'')+'>'+i+'</option>';
  return '<select onchange="S.year=+this.value;S.annualFor=null;renderFund()" style="padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px">'+opts+'</select>';
}
function fmtDeadline(dl){
  if(!dl) return '';
  var base=S.year+dl[0];
  return '기한 '+base+'-'+dl[1];
}

// ── 연간 일정 (2단계) ──
function annualTab(f){
  var key=S.fundId+'/'+S.year;
  if(S.annualFor!==key){
    S.annualFor=key; S.annual=null;
    fbDb.ref(NS+'/annual/'+S.fundId+'/'+S.year).once('value').then(function(s){ S.annual=s.val()||{}; if(S.tab==='annual'&&S.view==='fund') renderFund(); })
      .catch(function(){ S.annual={}; if(S.tab==='annual') renderFund(); });
    return '<div class="panel muted">불러오는 중…</div>';
  }
  var done=S.annual||{};
  var items=ANNUAL_TMPL.filter(function(t){ return !(t[4] && f.fund_type==='사내'); });  // SUP는 공동만
  var nDone=items.filter(function(t){return done[t[0]]&&done[t[0]].done;}).length;
  var rows=items.map(function(t){
    var d=done[t[0]]&&done[t[0]].done;

      +'<input type="checkbox"'+(d?' checked':'')+' onchange="toggleAnnual(\''+t[0]+'\',this.checked)" style="margin-top:3px">'
      +'<div style="flex:1"><div style="font-size:13px;font-weight:600'+(d?';text-decoration:line-through':'')+'">'+esc(t[2])+'</div>'
      +'<div class="muted" style="font-size:11.5px">'+esc(t[1])+(dl?' · <span style="color:var(--warn)">'+dl+'</span>':'')+'</div></div></div>';
  }).join('');
  return '<div class="panel"><div class="row"><h2>연간 일정</h2>'+yearSel()
    +'<span class="stat">진행 '+nDone+'/'+items.length+'</span><span style="flex:1"></span></div>'
    +'<div style="margin-top:10px">'+rows+'</div>'
    +'<p class="muted" style="font-size:11.5px;margin-top:10px">체크하면 완료로 저장됩니다. 운영상황보고(별지15호) 기한은 회계연도 종료 후 3개월(익년 3-31)입니다.</p></div>';
}
function toggleAnnual(code,on){
  fbDb.ref(NS+'/annual/'+S.fundId+'/'+S.year+'/'+code).set({done:on,done_date:on?ymd():''})
    .then(function(){ if(!S.annual)S.annual={}; S.annual[code]={done:on}; renderFund(); });
}
function ymd(){var d=new Date();function p(n){return(n<10?'0':'')+n;}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}

// ── 지원금 (2단계, 공동 전용) ──
function subsidyTab(f){
  var yd=(f.years&&f.years[S.year]&&f.years[S.year].subsidy)||{};
  // 참여사업장 집계 (S.sites 로드돼 있으면 사용, 아니면 로드)

  var nSite=act.length, nEmp=act.reduce(function(s,x){return s+(num(x.company_size)||0);},0);
  var flds=SUB_FIELDS.map(function(c){
    var v=yd[c[0]]||'';
    return '<div class="fld'+(c[0]==='notice'?' full':'')+'"><label>'+c[1]+'</label><input id="su-'+c[0]+'" type="'+(c[2]==='date'?'date':'text')+'" value="'+esc(v)+'"></div>';
  }).join('');
  var dec=num(yd.decided_amount)||0, sp=num(yd.spent_amount)||0;
  var recon = dec? (sp>dec?'<span class="chip dg">과다집행 '+(sp-dec).toLocaleString()+'원</span>':sp<dec?'<span class="chip warn">미집행 '+(dec-sp).toLocaleString()+'원</span>':'<span class="chip ok">정산 일치</span>'):'';
  return '<div class="panel"><div class="row"><h2>지원금</h2>'+yearSel()+'<span style="flex:1"></span>'
    +'<span class="stat">참여 '+nSite+'개사</span><span class="stat">수혜근로자 '+nEmp.toLocaleString()+'명</span></div>'
    +'<div id="msg" class="msg"></div>'
    +'<div class="grid" style="margin-top:12px">'+flds+'</div>'
    +'<div class="row" style="margin-top:14px"><button class="primary" onclick="saveSubsidy()">💾 저장</button>'+recon+'</div>'
    +'<p class="muted" style="font-size:11.5px;margin-top:8px">'+S.year+'년 지원 사업 정보. 결정액 대비 집행액으로 정산 상태가 자동 표시됩니다.</p></div>';

function saveSubsidy(){
  var obj={}; SUB_FIELDS.forEach(function(c){var el=$('su-'+c[0]);if(el)obj[c[0]]=c[2]==='num'?(num(el.value)||''):el.value.trim();});
  fbDb.ref(NS+'/funds/'+S.fundId+'/years/'+S.year+'/subsidy').set(obj).then(function(){
    if(!funds[S.fundId].years)funds[S.fundId].years={}; if(!funds[S.fundId].years[S.year])funds[S.fundId].years[S.year]={};
    funds[S.fundId].years[S.year].subsidy=obj;
    var m=$('msg');m.className='msg ok';m.textContent='저장되었습니다.'; renderFund();
  }).catch(function(e){var m=$('msg');m.className='msg err';m.textContent='저장 실패: '+e.message;});
}

// ── 간단 모달 ──
function showModal(html){
  var m=document.createElement('div'); m.id='modalbg';
  m.style.cssText='position:fixed;inset:0;background:rgba(20,30,50,.35);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px';
  m.onclick=function(e){ if(e.target===m) closeM(); };
  m.innerHTML='<div style="background:#fff;border-radius:14px;padding:20px 22px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)">'+html+'</div>';
  document.body.appendChild(m);
}
function closeM(){ var m=$('modalbg'); if(m) m.remove(); }
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeM(); });
</script>
