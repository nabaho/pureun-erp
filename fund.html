  var bf={employer:0,other:0,income:0,merge:0,use:0,split:0};
  var bfList=bfMovesOf(jr,rep);
  bfList.forEach(function(b){ bf[b.kind]=(bf[b.kind]||0)+b.amount; });
  var bfOpen=num(op.basic)||0;
  var bfInc=bf.employer+bf.other+bf.income+bf.merge, bfDec=bf.use+bf.split;
  var bfEnd=bfOpen+bfInc-bfDec;
  /* ㉑~㉘ 기금 운용·관리 — 이 칸은 '현금 잔액'이 아니라 **기본재산을 어떤 방법으로 운용했는지**다.
     대부가 없는 기금(M공동 2023)에서는 ㉑ 금융회사 예입 = ㉘ 합계 = ⑳ 기본재산 총액이다.
     대부가 있는 기금에서 구조가 드러난다 — F공동 2024 제출본은
       ㉑ 예입 674,108천(= ⑳ 기본재산 총액) + ㉗ 근로자 대부 239,720천 = ㉘ 합계 913,828천
     으로, **대부금은 예입에서 빼지 않고 따로 더한다**. 대부는 기본재산을 헐어 나간 것이 아니라
     그 자체가 기금의 자산이기 때문이다. 신탁·유가증권 등 운용 상품만 예입에서 뺀다. */
  /* ㉓ 유가증권 매입은 장부의 매도가능증권 잔액에서 나온다(수기 입력값이 있으면 그것을 쓴다) */
  var run={trust:num(rep.run_trust)||0, secu:num(rep.run_secu)||fin.secu||0, own:num(rep.run_own)||0,
           reit:num(rep.run_reit)||0, etc:num(rep.run_etc)||0, loan:fin.loan};
  var invested=run.trust+run.secu+run.own+run.reit+run.etc;   // 운용 상품 — 기본재산에서 뺀다
  run.deposit=Math.max(bfEnd-invested,0);
  run.total=run.deposit+invested+run.loan;
  // ㉙~㉟ 기금사업 재원
  var contribYear=bf.employer+bf.other;                        // 당해연도 출연금(현물 포함)
  /* 그 해 **현금으로** 들어온 출연금 — 현물출연(증권 등)은 그대로 쓸 수 없으므로 뺀다.
     _contribOf 가 이미 현물·대체분개를 걸러 준다(준비금 계산에서도 같은 함수를 쓴다). */
  var cashIn=_contribOf(arr);
  var ratio=(num(rep.use_ratio)||50)/100;                      // 출연금 사용한도 — 화면 표시용
  /* ㉙ 기금운용 수익금 — 이자·잡수익만. 준비금 환입은 회계상 수익이지만 재원이 아니다.
     ㉚ 해당 회계연도 출연금액의 사용한도 범위 — 실제로는 **그 해 이월 쪽 준비금으로 설정한 금액**이다.
        기본재산에서 그리로 옮긴 것이 곧 그 해 쓰기로 정한 재원이라 ⑰ 기본재산 사용과 같은 값이다.
        (이월 쪽이 몇 번인지는 _rsvRoles 가 정한다 — 공식 서식 기준으로는 준비금2다.)
        출연금 × 비율로 잡으면 협의회가 한도보다 적게 정한 해에 틀린다
        (F공동 2024는 출연금 1,086,108천원의 50%가 543,054천원인데 제출본 ⑰=㉚=412,000천원).
        ⑰만 쓴다 — 기본재산 감소액(⑰+⑱)을 쓰면 ⑱ 기금법인 분할로 딴 기금에 넘어간 몫까지
        이 기금의 재원으로 잡힌다. 분할은 재원이 아니라 재산이 빠져나간 것이다.
        ⑰ 중에서도 **그 해 현금으로 들어온 출연금까지**만 여기 적는다. 쌓아 둔 기본재산에서
        꺼내 쓴 몫(시행령 제46조의 직전 기본재산 20~30% 사용)은 전기에서 넘어온 재산이라
        이미 ㉞ 이월금 안에 들어 있다 — 또 더하면 같은 돈을 두 번 센다.
        확정 제출본 두 건이 이 규칙으로 함께 설명된다:
          C공동 2024  ㉞ 51,046천(전기말 자산총계) · 그 해 출연금 0 → ㉚ 0
          F공동 2024  ㉞ 0(제1기)          · 그 해 출연금 1,032,838천 중 412,000천 → ㉚ 412,000천
     ㉞ 이월금 — 전기에서 넘어온 재산 전부. 비워 두면 전기말 자산총계로 잡는다.
     세 칸 모두 수기 입력값이 있으면 그것을 먼저 쓴다. */
  var src={income:fin.bizRev,
           contrib:(rep.src_contrib!==''&&rep.src_contrib!=null)?(num(rep.src_contrib)||0):Math.min(bf.use,cashIn),
           capExcess:num(rep.src_cap_excess)||0, basicRange:num(rep.src_basic_range)||0,
           support:num(rep.src_support)||0,
           carry:(rep.src_carry!==''&&rep.src_carry!=null)?(num(rep.src_carry)||0):_openAssets(op)};
  src.total=src.income+src.contrib+src.capExcess+src.basicRange+src.support+src.carry;
  // ㊾~62 사업실적 — 금액은 계정, 수혜자수는 목적사업·대부 탭
  var benef={}, loanBenef=0, loanAmt=0;
  welf.forEach(function(w){
    var c=w.category||'', n=num(w.beneficiaries)||0;
    if(c==='대부사업'){ loanBenef+=n; loanAmt+=num(w.spent)||0; return; }
    benef[c]=(benef[c]||0)+n;
  });
  var items=F15_ROWS.map(function(r){
    var amt=0, cnt=0;
    r[2].forEach(function(a){
      var m=mv[a]; if(m) amt+=m.d-m.c;                         // 비용은 차변 발생액
      cnt+=(benef[a]||0);
    });
    return {no:r[0],label:r[1],amt:amt,cnt:cnt};
  });
  var subAmt=items.reduce(function(s,x){return s+x.amt;},0);
  var subCnt=items.reduce(function(s,x){return s+x.cnt;},0);
  /* 어느 항목에도 안 실리는 수혜자 — 분류를 안 골랐거나 서식에 없는 분류다.
     수혜자수는 통장으로 검산할 수 없어 빠져도 알 방법이 없는데, 소계는 제출본에
     그대로 들어간다. 몇 명이 어느 분류에서 빠졌는지 남겨 화면이 붙잡게 한다. */
  var _known={}; F15_ROWS.forEach(function(r){ r[2].forEach(function(a){ _known[a]=1; }); });
  var benefLost=0, benefLostCats=[];
  Object.keys(benef).forEach(function(c){
    if(_known[c]||!benef[c]) return;
    benefLost+=benef[c]; benefLostCats.push((c||'(분류 없음)')+' '+benef[c]+'명');
  });
  /* 대부 실행액은 목적사업 탭에서 오고, 장부에는 근로자대부금 차변 발생액으로 남는다.
     둘이 어긋나면 별지15호와 재무제표가 서로 다른 말을 한다 — F공동 2024 제출본이
     그 사례다(대부금 상환을 반영하지 않아 5,327만원 어긋났다). */
  var loanBook=Math.round((mv['근로자대부금']||{}).d||0);
  var loanMismatch=(loanAmt>0||loanBook>0)&&Math.round(loanAmt)!==loanBook;
  /* 68. 기금 운영비 — 일반관리비와 그 밖의 운영비만. 준비금 전입액은 사업외비용이라 뺀다
     (C공동 2024는 이자 40,618원, G사내 2025는 831원만큼 부풀었었다). */
  var admin=fin.admin+fin.otherExp-(fin.resvExp||0);
  /* 69. 잔액 = 재원(㉟) − 복지사업비 소계 − 기금 운영비.
     **대부금은 빼지 않는다** — 빌려준 돈은 나갔어도 기금 자산으로 남아 있다.
     서식의 복지사업비 소계에는 대부 실행액이 들어 있으므로, 그것을 그대로 되돌려 놓는 셈이다.
     확정 제출본 세 건으로 검산했다(원 단위):
       F공동 2024   412,081,137 − 101,190,224 −   4,400 =   310,886,513 → 61.잔액 310,887천원
       C공동 2024  51,087,010 −  17,607,800 − 107,640 =    33,371,570 → 69.잔액  33,372천원
       G사내 2025 2,173,555,891 −        0 −  68,770 = 2,173,487,121 → 69.잔액 2,173,487천원
     ⚠ 대부금 항을 넣지 말 것. 「기말 대부잔액을 더하고 그 해 실행액을 뺀다」는 식은 더하는 쪽과
        빼는 쪽의 기준이 달라, 대부금이 이월된 이듬해에는 거래가 하나도 없어도 잔액이 대부잔액만큼
        부풀고(1.86억 이월 → 4.97억으로 표시됐다), 상환이 있는 해에는 상환액만큼 줄어든다.
        상환은 대부금이 현금으로 자리만 바꾸는 것이라 잔액을 바꾸지 않는다.
     ⚠ 기말 자산총계로 잡아서도 안 된다 — F공동처럼 출연금 일부만 재원으로 정한 해에 틀린다
        (자산총계 984,995천원 vs 제출본 310,887천원). */
  var rest=src.total-(subAmt+admin);
  /* 재원 ㉟ 의 천장 — 전기말 자산총계 + 그 해 현금출연 + 그 해 수익.
     ㉛·㉜·㉝ 는 사람이 적는 칸이라, 이미 ㉞ 안에 든 돈을 다시 적으면 재원이 부풀어
     잔액까지 함께 틀어진다. 앱이 그 값을 고쳐 쓰지는 않고 «넘쳤다»는 사실만 알린다. */
  var srcCap=_openAssets(op)+cashIn+fin.bizRev;
  var srcOver=Math.max(0,src.total-srcCap);
  // 근로자 수 — 참여사업장 합계(협력업체로 표시한 곳은 따로)
  var wk=0, pwk=0;
  sites.forEach(function(s){ var n=num(s.company_size)||0; if(s.partner) pwk+=n; else wk+=n; });
  if(num(rep.partner_workers)) pwk=num(rep.partner_workers);
  return {
    f:f, yr:yr, fin:fin,
    head:{name:f.name||'',inka:f.inka_no||'',reg:f.reg_date||'',tel:f.phone||'',addr:f.address||'',
          fy_s:(f.fy_start_md||'01-01'),fy_e:(f.fy_end_md||'12-31'),
          ceo:f.chairman||'',biz:rep.biz_type||f.biz_type||'',workers:wk,partner:pwk,capital:num(rep.capital)||0,
          type:(f.fund_type==='사내')?'사내':'공동'},
    bf:bf, bfOpen:bfOpen, bfInc:bfInc, bfDec:bfDec, bfEnd:bfEnd, bfList:bfList,
    run:run, src:src, ratio:ratio*100, cashIn:cashIn,
    items:items, subAmt:subAmt, subCnt:subCnt,
    loanAmt:loanAmt, loanBenef:loanBenef, admin:admin, rest:rest,
    benefLost:benefLost, benefLostCats:benefLostCats,
    loanBook:loanBook, loanMismatch:loanMismatch,
    srcCap:srcCap, srcOver:srcOver,
    total:subAmt+loanAmt+admin+rest,
    sel:{amt:num(rep.sel_amt)||0,cnt:num(rep.sel_cnt)||0},
    estate:{name:rep.estate_name||'해당없음',amt:num(rep.estate_amt)||0,date:rep.estate_date||'해당없음'},
    use20:{total:num(rep.use20_total)||0,partner:num(rep.use20_partner)||0,partnerCnt:num(rep.use20_pcnt)||0},
    use30:{total:num(rep.use30_total)||0,partner:num(rep.use30_partner)||0,partnerCnt:num(rep.use30_pcnt)||0},
    use80:{contrib:contribYear,pcnt:num(rep.use80_pcnt)||0,pamt:num(rep.use80_pamt)||0,wcnt:wk},
    rep:rep
  };
}
/* ── 운영상황보고서 하위 탭 ── 회계로 못 채우는 칸만 입력받고, 나머지는 장부에서 자동 */
function f15Load(){
  var fid=S.fundId, yr=S.year, key=fid+'/'+yr;
  if(S.f15For===key) return true;
  S.f15For=key; S.f15Rep=null; S.f15Sites=null; S.f15Welf=null; S.f15Close=null; S.f15Sy=null;
  Promise.all([
    // closing 노드 전체를 읽는다 — report(입력값) + locked(확정 상태)를 함께 쓰기 위해
    fbDb.ref(NS+'/closing/'+fid+'/'+yr).once('value').then(function(s){return s.val()||{};}).catch(function(){return {};}),
    _loadSites(fid).catch(function(){return [];}),
    fbDb.ref(NS+'/welfare/'+fid+'/'+yr).once('value').then(function(s){var v=s.val()||{};return Object.keys(v).map(function(k){return v[k];});}).catch(function(){return [];}),
    /* 사업장별 «그 해» 출연금 — 장부와 대조하려고 함께 읽는다(contribCheck) */
    fbDb.ref(NS+'/site_years/'+fid+'/'+yr).once('value').then(function(s){return s.val()||{};}).catch(function(){return {};})
  ]).then(function(r){
    if(S.f15For!==key) return;
    S.f15Close=r[0]||{}; S.f15Rep=S.f15Close.report||{}; S.f15Sites=r[1]||[]; S.f15Welf=r[2]||[];
    S.f15Sy=r[3]||{};
    if(S.tab==='closing'&&S.view==='fund') renderFund();
  });
  return false;
}
function _isLocked(){ return !!(S.f15Close&&S.f15Close.locked); }
/* 확정한 해를 다시 계산했더니 별지15호 숫자가 달라졌는가.
   산식을 고치면(69.잔액·㉚ 처럼) 이미 낸 해의 인쇄물이 조용히 바뀐다 — 그것을 붙잡는다.
   ⚠ 예전에 확정한 해에는 스냅샷에 이 칸들이 없다. 그때는 «모른다»가 맞으므로 비교하지 않는다. */
function f15Drift(R){
  var snap=(S.f15Close||{}).fin;
  if(!_isLocked()||!snap||snap.f15_rest==null) return [];
  var out=[];
  [['㉟ 재원 합계','f15_src_total',R.src.total],['㉚ 출연금 사용한도 범위','f15_src_contrib',R.src.contrib],
   ['㉞ 이월금','f15_src_carry',R.src.carry],['잔액','f15_rest',R.rest],['합계','f15_total',R.total]
  ].forEach(function(p){
    var was=Math.round(num(snap[p[1]])||0), now=Math.round(p[2]||0);
    if(was!==now) out.push({name:p[0],was:was,now:now}); });
  return out;
}
function _lockInfo(){ var c=S.f15Close||{}; return (c.locked_at||'')+(c.locked_by?' · '+c.locked_by:''); }
function f15Save(){
  var fid=S.fundId, yr=S.year, o=Object.assign({},S.f15Rep||{});
  ['biz_type','capital','partner_workers','use_ratio','run_trust','run_secu','run_own','run_reit',
   'run_etc','src_cap_excess','src_basic_range',
   'src_support','src_carry','sel_amt','sel_cnt','estate_name','estate_amt','estate_date',
   'use20_total','use20_partner','use20_pcnt','use30_total','use30_partner','use30_pcnt',
   'use80_pcnt','use80_pamt'].forEach(function(k){
    var el=$('f15-'+k); if(el) o[k]=el.value.trim();
  });
  fbDb.ref(NS+'/closing/'+fid+'/'+yr+'/report').update(o).then(function(){
    S.f15Rep=o; _cbDirty(); toast('보고서 입력값 저장됨'); renderFund();
  }).catch(function(e){ toast('저장 실패: '+e.message,'err'); });
}
function f15SetBf(id,kind){
  var fid=S.fundId, yr=S.year;
  fbDb.ref(NS+'/closing/'+fid+'/'+yr+'/report/bf/'+id).set(kind).then(function(){
    S.f15Rep=S.f15Rep||{}; S.f15Rep.bf=S.f15Rep.bf||{}; S.f15Rep.bf[id]=kind;
    _cbDirty(); renderFund(); toast('구분 변경됨');
  }).catch(function(e){ toast('저장 실패: '+e.message,'err'); });
}

  if(!f15Load()) return '<div class="panel">'+loadingHTML()+'</div>';

  function ip(k,lbl,ph){ return '<div class="fld"><label>'+lbl+'</label><input id="f15-'+k+'" value="'+esc((S.f15Rep||{})[k]||'')+'" placeholder="'+(ph||'0')+'"></div>'; }
  var bfRows=R.bfList.length?R.bfList.map(function(b){
    var sel='<select onchange="f15SetBf(\''+b.id+'\',this.value)" style="padding:2px 5px;border:1px solid var(--line);border-radius:6px;font-size:11.5px">'

  }).join(''):'<tr><td colspan="5" class="muted">기본재산 변동 분개가 없습니다.</td></tr>';
  var itemRows=R.items.map(function(x){
    return '<tr><td>'+_f15n(x.no)+' '+esc(x.label)+'</td><td style="text-align:right">'+_nz(_k1000(x.amt))+'</td>'
      +'<td style="text-align:right">'+_nz(x.cnt)+'</td></tr>';
  }).join('');
  return '<div class="panel"><div class="row" style="flex-wrap:wrap"><h2 style="font-size:15px">운영상황보고서 (별지 제15호)</h2>'+hlp('close.f15')
    +'<span class="chip" style="font-size:10px">'+R.head.type+'근로복지기금법인</span>'
    +'<span class="muted" style="font-size:12px">'+S.year+'년도 · 단위 천원</span>'
    +(_isLocked()?'<span class="chip ok" style="font-size:10px">🔒 확정 '+esc(_lockInfo())+'</span>':'')
    +'<span style="flex:1"></span><button onclick="makeClosingWb()" title="과거 제출본과 같은 시트 구성으로 결산서+사업계획서 워크북 생성">📗 결산서 워크북 받기</button>'

/* ══════════ 별지 제15호 A4 서식 — 팝업 미리보기 · 인쇄 ══════════
   근로복지기본법 시행규칙 [별지 제15호서식] <개정 2025. 10. 1.> 관보 원문(4쪽 중 1~2쪽)의
   칸 배치·번호를 그대로 옮겼다. 3~4쪽은 작성방법 안내라 제출 대상이 아니어서 만들지 않는다.
   미리보기와 인쇄가 **같은 HTML·같은 CSS**를 쓰므로 화면과 인쇄물이 어긋나지 않는다.
   용지: 210mm×297mm, 여백 12mm → 본문 폭 186mm. */
function f15CSS(px,forPrint){
  var p = px ? px+' ' : '';
  var R=[
    ['.a4','width:186mm;min-height:273mm;box-sizing:border-box;display:flex;flex-direction:column;margin:0 auto;'
      +'background:#fff;color:#1e293b;font-family:"Malgun Gothic","맑은 고딕",sans-serif'],
    ['.a4b','flex:1 1 auto'],
    ['.a4f','flex:0 0 auto;text-align:center;font-size:8.5px;color:#475569;padding-top:3mm'],
    ['p','margin:0'],
    ['p.law','font-size:9.5px;margin:0 0 3px'],
    ['table','border-collapse:collapse;width:100%;margin:0 0 4px;table-layout:fixed'],
    ['th','border:1px solid #1e293b;padding:4.5px 6px;font-size:9.8px;vertical-align:middle;background:#f8fafc;text-align:left;font-weight:600'],
    ['td','border:1px solid #1e293b;padding:4.5px 6px;font-size:9.8px;vertical-align:middle;word-break:break-all'],
    /* 관보 서식처럼 지면을 채우도록 쪽별 행 높이를 다르게 준다.
       실측(최악 조건: 긴 기금명·소재지 + 12자리 금액)에서 1쪽 243mm·2쪽 253mm로
       가용 267mm 안에 들어간다 — 여유 24mm/14mm. 더 키우면 2쪽이 넘친다. */
    ['.pg1 th','height:9.2mm'], ['.pg1 td','height:9.2mm'],
    ['.pg2 th','height:6.2mm'], ['.pg2 td','height:6.2mm'],
    ['th.sec','background:#e2e8f0;text-align:center'],
    ['th.c','text-align:center'],
    ['td.n','text-align:right;font-variant-numeric:tabular-nums'],
    ['th.n','text-align:right'],
    ['b.n','font-variant-numeric:tabular-nums'],
    ['.cn','display:inline-block;min-width:1.15em;height:1.15em;line-height:1.05em;border:1px solid currentColor;'
      +'border-radius:50%;text-align:center;font-size:.82em;font-weight:400'],
    ['.tt','text-align:center;font-size:17px;font-weight:700;letter-spacing:1px'],
    ['.chk','font-size:10.5px;line-height:1.8'],
    ['.hdrow','display:flex;align-items:flex-start;gap:6px;margin-bottom:3px'],
    ['.subrow','display:flex;justify-content:space-between;font-size:9.2px;margin:0 0 4px'],
    ['table.in','margin:0'],
    ['table.in th','border:none;background:transparent;padding:3px;font-weight:400;font-size:9.5px;height:auto'],
    ['table.in td','border:none;padding:3px;font-size:9.5px;height:auto'],
    ['tr.b td','font-weight:700;background:#f8fafc'],
    ['tr.b th','font-weight:700'],
    ['p.cite','font-size:9.5px;margin:9px 0 0;line-height:1.6'],
    ['p.date','text-align:center;font-size:12px;margin:10px 0 6px;letter-spacing:2px'],
    ['p.sign','text-align:right;font-size:12px;margin:0 14mm 8px 0'],
    ['p.to','font-size:12.5px;font-weight:700;margin:0 0 8px']
  ];
  var css=R.map(function(r){ return p+r[0]+'{'+r[1]+'}'; }).join('');
  // 화면에서는 용지 여백을 CSS로 그린다(@page가 없으므로) — 본문 폭 186mm는 인쇄와 같게 유지
  var screenPage=p+'.a4{width:210mm;min-height:297mm;padding:12mm;box-shadow:0 2px 10px rgba(0,0,0,.15);margin-bottom:12px}';
  if(forPrint){
    return '@page{size:A4 portrait;margin:12mm}body{margin:0;background:#fff}'
      +css
      +'@media screen{body{background:#f8fafc;padding:12px}'+screenPage+'}'
      +'@media print{.a4{box-shadow:none;padding:0;width:186mm;min-height:273mm;page-break-after:always}'
      +'.a4:last-child{page-break-after:auto}button{display:none}}';
  }
  return css+screenPage;
}
/* 2쪽 서식 HTML — {p1,p2}. 숫자는 전부 천원 단위(서식 규정). */
function f15Pages(R){
  var K=_k1000, N=function(v){ return _n(v); };
  var n=_f15n;
  var W=R.head.workers||0, PW=R.head.partner||0;
  var rep=R.rep||{};

  // 소속근로자 1명당 = (총 사용액 − 협력업체 사용액) ÷ ⑨ / 협력업체 1명당 = 협력업체 사용액 ÷ ⑩
  var per=function(tot,pt){ return W?Math.round((tot-pt)/W):0; };

/* ══════════ 결산 확정(잠금) · 연도별 대장 · 연도별 비교 ══════════

   나중에 거래를 손대도 '제출한 그 숫자'가 보존된다. */
function closeSnapshot(arr,fid,yr,rep,sites,welf){

  return {
    cash:fin.cash, savings:fin.savings, loan:fin.loan, otherAsset:fin.otherAsset,
    /* 증권과 준비금 1·2 — 익년도 «추정재무상태표»가 이 셋을 봐야 셈이 된다.
       없던 탓에 그 표가 실데이터로는 한 번도 안 채워졌다(지어낸 시험자료로만 통과했다). */
    secu:fin.secu, res1:fin.res1, res2:fin.res2,
    assets:fin.totalAssets, liab:fin.liab, basic:fin.basic, retained:fin.retained,
    equity:fin.equity, liabEq:fin.totalLiabEq, balanced:!!fin.balanced,

       여기 없으면 다시 인쇄할 때 숫자가 달라져도 달라진 사실조차 알 수 없다. */
    f15_src_income:R.src.income, f15_src_contrib:R.src.contrib, f15_src_carry:R.src.carry,
    f15_src_total:R.src.total, f15_sub_amt:R.subAmt, f15_admin:R.admin,

/* ══ 고유목적사업준비금 자동 조정 ══
   공동·사내기금은 출연금을 준비금(부채)으로 적립해 두고, 결산에서 당기순이익을 0으로 맞춘다.
   방향이 두 가지다 — 실제 확정 결산서 두 건으로 확인했다.
     · 비용 > 수익 (목적사업을 한 해)  → 준비금에서 **환입**(사업외수익). A공동 2025: 9,803,443원
     · 수익 > 비용 (설립 첫해 등)      → 준비금으로 **전입**(사업외비용). C공동 2022: 3,249원
   환입은 준비금 잔액을 넘을 수 없고, 전입은 이익만큼이라 한도가 없다.
   이미 조정 분개가 있으면 순이익이 0이 되어 필요액이 저절로 0이 된다(중복 생성 방지). */
var RESERVE_ACCTS=['고유목적사업준비금1','고유목적사업준비금2'];
/* 조정에 쓸 준비금 계정 — 잔액이 있는 쪽을 쓴다(없으면 준비금1).
   전기이월이 어느 번호에 들어와 있든 그쪽에서 환입해야 잔액이 음수가 되지 않는다. */
/* 준비금 번호는 **공식 서식이 정해 둔 것**이다(공단 설립인가신청서 양식 각주) —
     1 = 법인세법 제29조(이자) · 2 = 근로복지기본법 제62조2항(이월)
   확정 제출본 11건도 모두 이 배치이고, 손에 있는 결산서 어디에도 반대는 없었다.
   그래서 이것이 기본값이고 보통은 건드릴 일이 없다.
   ⚠ reserve_swap 은 «기금마다 다르다»는 뜻이 아니다 — **과거 제출본이 서식과 반대로**
     적혀 있어 전기 대비를 맞추려 그대로 재현해야 할 때만 켠다. 켜면 서식 각주와
     어긋나므로, 새로 만드는 결산서에는 쓰지 않는다. 기금 단위다(해마다 바뀌지 않는다). */
function _rsvSwapOf(fid){ return !!((funds[fid]||{}).reserve_swap); }
function _rsvRoles(fid){
  var sw=_rsvSwapOf(fid);
  return { interest:RESERVE_ACCTS[sw?1:0], carry:RESERVE_ACCTS[sw?0:1] };
}
function _reserveAcct(fin){
  var best=RESERVE_ACCTS[0], bal=-1;
  RESERVE_ACCTS.forEach(function(a){
    var v=fin.tb[a]; var b=v?(v.credit-v.debit):0;
    if(b>bal){ bal=b; best=a; }
  });
  return best;
}
/* 당기 출연금 — 준비금2 설정 한도의 기준. **현금으로 들어온 출연금만** 센다.
   준비금2는 그 해에 목적사업에 쓸 수 있는 재원인데, 증권·부동산으로 받은 현물출연은
   처분해야 쓸 수 있어 실무 결산서도 한도 기준에서 뺀다.
   B공동 2022가 그 사례다 — 증권 7,261,110,330원을 현물출연받고 현금은 30,000,000원인데,
   현물까지 세면 한도가 65억이 되어 기본재산이 72.6억에서 7.3억으로 붕괴한다(제출본 설정액은
   현금 30,000,000 × 90% = 27,000,000원이다). 현금·자산총계·대차는 맞아도 기본재산 총액이
   틀어지면 별지15호와 재산변동상황보고서가 전부 어긋난다. */
function _contribOf(arr){

    /* 분할 조각은 amount 가 곧 그 조각의 금액이다. 조각에 붙은 nocash 는 «현물»이 아니라
       «통장 금액은 첫 조각에 있다»는 뜻이므로 여기서 빼면 안 된다 — 빼면 두 번째 조각에 든

    +'<div class="row" style="margin-top:8px;flex-wrap:wrap;gap:8px">'

   '6. 결손금 / 가.처분결손금' 칸이 따로 있다). */
function _retLabel(v){ return (num(v)||0)<0?'이월결손금':'이월잉여금'; }
function _retVal(v){ v=num(v)||0; return v<0?-v:v; }
/* 음수가 되면 안 되는 항목들 — 하나라도 음수면 어딘가 잘못된 것이다.
   결손금은 손실이 정상적으로 이월된 것이므로 여기서 뺀다. */
function finNegatives(f){
  var out=[];
  [['현금및현금성자산',f.cash],['정기예금',f.savings],['근로자대부금',f.loan],['매도가능증권',f.secu],
   ['그 밖의 자산',f.otherAsset],['자산총계',f.totalAssets],['부채총계',f.liab],['기본재산',f.basic]
  ].forEach(function(p){ if(Math.round(num(p[1])||0)<0) out.push({name:p[0],v:Math.round(p[1])}); });
  /* 준비금 잔액은 **전기이월을 더해서** 본다. 환입은 준비금 차변이라 당기 발생분만 보면
     전기이월로 덮인 정상 결산까지 음수로 보인다 — 검증한 여섯 기금 중 다섯이 헛경보였다
     (L공동·C공동·D공동·H사내·G사내). */
  var op=(f&&f.opening)||{};
  RESERVE_ACCTS.forEach(function(a,i){
    var v=f.tb&&f.tb[a];
    var b=Math.round((v?(v.credit-v.debit):0)+(num(i===0?op.reserve:op.reserve2)||0));
    if(b<0) out.push({name:a,v:b}); });
  return out;
}
/* 재무 집계 — 연도를 파라미터로 받는다(전기 대비 비교에서 지난해도 계산해야 함).
   인수를 생략하면 지금 보고 있는 기금·연도(기존 호출부 호환). */
function computeFin(arr,fid,yr){
  fid=fid||S.fundId; yr=yr||S.year;
  var yd=(funds[fid]&&funds[fid].years&&funds[fid].years[yr])||{}, opening=yd.opening||{};
  var appr=expandSplits(arr).filter(function(x){return x.approved&&x.debit&&x.credit;});
  var acc={};
  appr.forEach(function(x){var amt=num(x.amount)||num(x.deposit)||num(x.withdraw)||0;
    (acc[x.debit]=acc[x.debit]||{d:0,c:0}).d+=amt; (acc[x.credit]=acc[x.credit]||{d:0,c:0}).c+=amt;});
  var tb={}; Object.keys(acc).forEach(function(name){var v=acc[name];
    tb[name]={type:ACCT_CHART[name]||'비용',debit:v.d,credit:v.c,bal_d:Math.max(v.d-v.c,0),bal_c:Math.max(v.c-v.d,0)};});
  // 유형별 전 계정 집계(부호 있는 잔액) — 목록에 없는 계정도 누락 없이 대차가 맞도록
  function sg(a){var v=tb[a]||{debit:0,credit:0};return v.debit-v.credit;}
  var PURPOSE=PURPOSE_ACCTS;
  var ADMIN=ADMIN_ACCTS;
  var CORE_ASSET=['현금성자산','정기예금','근로자대부금','매도가능증권'];
  var revenue=0,purpose=0,admin=0,otherExp=0,resvExp=0,bizRev=0,liab=0,otherAsset=0,otherEquity=0,tax=0;
  Object.keys(tb).forEach(function(n){var v=tb[n],s=v.debit-v.credit;
    /* 사업수익은 준비금 환입을 뺀 것이다 — 별지15호 ㉙ '기금운용 수익금'은 이자·잡수익만 적는다
       (F공동 2024 제출본 ㉙ = 81천원 = 이자 81,137원. 환입 101,113,487원은 들어가지 않는다). */
    if(v.type==='수익'){ revenue+=-s; if(n!=='고유목적사업준비금환입') bizRev+=-s; }
    else if(v.type==='부채')liab+=-s;
    else if(v.type==='자본'&&n!=='기본재산')otherEquity+=-s;
    else if(v.type==='비용'){ if(PURPOSE.indexOf(n)>=0)purpose+=s; else if(ADMIN.indexOf(n)>=0)admin+=s;
      /* 법인세등은 «9.법인세등» 칸이 따로 있다 — 사업외비용에 섞으면 제출 양식과 단계가 어긋난다.
         쓰는 기금이 아직 없어 지금은 늘 0 이지만, 수익사업을 하면 이 칸으로 간다. */
      else if(n==='법인세등') tax+=s;
      /* 준비금 전입액은 사업외비용이라 기타비용에 들어가지만, 별지15호 68번 '기금 운영비'에는
         넣으면 안 된다 — 따로 세어 둔다. 순이익 계산에는 otherExp 로 그대로 들어간다. */
      else { otherExp+=s; if(n==='고유목적사업준비금전입액') resvExp+=s; } }
    else if(v.type==='자산'&&CORE_ASSET.indexOf(n)<0)otherAsset+=s;});
  /* 예전엔 여기서 interest=revenue 를 만들어 「이자수익」이라 부르며 밖으로 내보냈다.
     수익 계정은 이자수익·잡수익·준비금환입 셋이라, 그 값은 이자수익도 사업수익도 아니었다.
     쓰던 다섯 자리(예산편성안·추정손익계산서·요약표·스냅샷)를 bizRev 로 옮기고 없앴다. */
  /* 전기이월은 **OPEN_ACCT를 돌며** 유형별로 얹는다. 손으로 적은 목록만 쓰면 칸을 늘릴 때 빠지는데,
     실제로 미수수익·미수금·단기금융상품·특정현금과예금·손실대비특별적립금이 통째로 빠져
     자산 109,451,441원·자본 106,108,000원이 사라지고 대차가 3,343,441원 어긋났다.
     시산표(openingMoves)는 OPEN_ACCT를 돌아 맞았는데 재무제표만 틀린 상태였다.
     아래에서 따로 쓰는 칸(핵심 자산 4개·기본재산·이월잉여금·준비금1·2)만 건너뛴다. */
  var _opDone={cash:1,savings:1,loan:1,secu:1,basic:1,retained:1,reserve:1,reserve2:1};
  var opAssetEtc=0, opLiabEtc=0, opEquityEtc=0;
  Object.keys(OPEN_ACCT).forEach(function(k){
    if(_opDone[k]) return;
    var v=num(opening[k])||0; if(!v) return;
    var t=ACCT_CHART[OPEN_ACCT[k]]||'자산';
    if(t==='부채') opLiabEtc+=v; else if(t==='자본') opEquityEtc+=v; else opAssetEtc+=v;
  });
  otherAsset+=opAssetEtc; liab+=opLiabEtc; otherEquity+=opEquityEtc;
  var cash=sg('현금성자산')+(num(opening.cash)||0), savings=sg('정기예금')+(num(opening.savings)||0);
  var loan=sg('근로자대부금')+(num(opening.loan)||0), basic=-sg('기본재산')+(num(opening.basic)||0);
  /* 기본재산을 증권으로 운용하는 기금이 있다(H사내: 26억). 칸이 없으면 대차가 그만큼 어긋난다. */
  var secu=sg('매도가능증권')+(num(opening.secu)||0);
  liab+=(num(opening.reserve)||0)+(num(opening.reserve2)||0);
  /* 준비금은 1·2를 갈라 내보낸다 — 제출본 재무상태표가 두 줄로 적고 근거 법령도 다르다.
     전기이월을 포함한 잔액이어야 화면과 장부가 같은 값을 가리킨다. */
  var res1=-sg(RESERVE_ACCTS[0])+(num(opening.reserve)||0);
  var res2=-sg(RESERVE_ACCTS[1])+(num(opening.reserve2)||0);
  var net=revenue-purpose-admin-otherExp-tax, retained=(num(opening.retained)||0)+otherEquity+net;
  var totalAssets=cash+savings+loan+secu+otherAsset, equity=basic+retained, totalLiabEq=liab+equity;
  /* == 손익 열 단계 == 제출본 손익계산서는 «1.사업수익 … 10.당기순이익» 열 칸으로 적는다.
     WARN 합계는 손대지 않는다 — 나누기만 한다. net 이 그대로여야 확정 결산 16건과 계속 맞는다.
       3.사업총이익 = 1 - 2,  5.사업이익 = 3 - 4
       6.사업외수익 = 준비금 환입(revenue 에서 사업수익을 뺀 나머지)
       7.사업외비용 = 준비금 전입액 등,  8 = 5 + 6 - 7,  10 = 8 - 9 */
  var nonopRev=revenue-bizRev, nonopExp=otherExp;
  var gross=bizRev-purpose, opInc=gross-admin, preTax=opInc+nonopRev-nonopExp;
  /* 사업외수익은 준비금1·2 를 갈라 적는다 — 제출본이 두 줄로 적고 근거 법령도 다르다.
     환입 분개는 차변에 그 준비금 계정이 온다(_reserveEntry). 거기서 갈라낸다. */
  var rev1=0,rev2=0;
  appr.forEach(function(x){
    if(x.credit!=='고유목적사업준비금환입') return;
    var amt=num(x.amount)||num(x.deposit)||num(x.withdraw)||0;
    if(x.debit===RESERVE_ACCTS[0]) rev1+=amt; else if(x.debit===RESERVE_ACCTS[1]) rev2+=amt;
  });
  return {tb:tb,appr:appr.length,tax:tax,gross:gross,opInc:opInc,nonopRev:nonopRev,
    nonopExp:nonopExp,preTax:preTax,rev1:rev1,rev2:rev2,bizRev:bizRev,purpose:purpose,admin:admin,otherExp:otherExp,resvExp:resvExp,
    cash:cash,savings:savings,loan:loan,secu:secu,otherAsset:otherAsset,basic:basic,liab:liab,res1:res1,res2:res2,
    totalAssets:totalAssets,net:net,retained:retained,equity:equity,totalLiabEq:totalLiabEq,
    balanced:totalAssets===totalLiabEq,opening:opening};
}

      /* 준비금2 설정액 — 법은 한도를 '범위'로 정하므로 그 안에서 얼마를 설정할지는 협의회가 정한다.

      /* 「설정액」이 제목과 라벨에 두 번 들어가 있었다 — 라벨 하나로 합치고 한 줄에 둔다 */

/* ══ 분개 학습(거래처 기억) ══

   · 키워드는 **거래상대방**에서 뽑는다. 적요('인터넷출금이체')는 수단만 적혀 분류에 못 쓴다.

   · 입금·출금은 성격이 달라 방향별로 따로 기억한다(같은 거래처의 출연 입금 vs 환불 출금).
   · **전 기금 공통**으로 쌓는다 — 한 노무법인이 42개 기금을 보므로 거래처 성격은 기금이 달라도 같다.
   · 학습 시점은 **승인**이다. 사람이 확정한 것만 기억한다.
   · 잘못 배운 것은 [📚 분개 학습]에서 지운다. */
var LEARN_SKIP=['인터넷출금이체','인터넷입금이체','현금출금','현금입금','전자금융','FBS출금','타행이체',
                '자동이체','결산이자','대체','ATM','CD출금','창구출금','창구입금','즉시이체','펌뱅킹'];
function _learnKey(memo,isDep){
  var m=String(memo||'').trim();
  if(!m) return '';
  var head=m.split(/[\s(:\/\[]/)[0].replace(/[^0-9A-Za-z가-힣㈜]/g,'');   // 상대방 앞머리
  if(head.length<2) return '';
  for(var i=0;i<LEARN_SKIP.length;i++){ if(head===LEARN_SKIP[i]||LEARN_SKIP[i].indexOf(head)===0) return ''; }
  return (isDep?'i_':'o_')+head;
}
var _learned=null, _learnedP=null;
function loadLearned(force){
  if(_learned&&!force) return Promise.resolve(_learned);
  if(_learnedP&&!force) return _learnedP;
  _learnedP=fbDb.ref(NS+'/learned').once('value').then(function(sn){
    _learned=sn.val()||{}; _learnedP=null; return _learned;
  }).catch(function(){ _learned=_learned||{}; _learnedP=null; return _learned; });
  return _learnedP;
}
function learnAcct(memo,isDep,d,c,fid){
  var k=_learnKey(memo,isDep); if(!k||!d||!c||d===c) return;
  var prev=(_learned||{})[k];
  var rec={d:d,c:c,dir:isDep?'입금':'출금',word:k.slice(2),
           hits:((prev&&num(prev.hits))||0)+1,at:ymd(),fund:fid||S.fundId||''};
  _learned=_learned||{}; _learned[k]=rec;                       // 화면은 바로 반영
  fbDb.ref(NS+'/learned/'+k).set(rec).catch(function(){});      // 실패해도 업무를 막지 않는다
}
function forgetAcct(k){
  confirmM('이 학습을 지울까요?\n다음 가져오기부터 자동 제안하지 않습니다.',{ok:'지우기',danger:true}).then(function(ok){
    if(!ok) return;

      if(_learned) delete _learned[k];

      +'다음 통장 가져오기부터 자동으로 제안합니다. 전 기금에 함께 적용됩니다.</p>'

      +'<div class="row" style="justify-content:flex-end;margin-top:14px"><button onclick="closeM()">닫기</button></div>');

/* 참여사업장 이름 목록 — 자동분개의 '회사명 입금 = 출연금' 판정에 쓴다.

function proposeAcct(memo,isDep,sites,kind){
  var m=String(memo||''), dir=isDep?'입금':'출금';
  var lk=_learnKey(m,isDep), lr=lk&&(_learned||{})[lk];   // 배운 것이 일반 규칙보다 우선

    var strip=function(t){ return String(t||'').replace(/\s+/g,'')

function hkey(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 't'+(h>>>0).toString(36);}
/* ══ 거래 직접 추가 ══

function addTxnSave(){
  var fid=S.fundId, yr=S.year;
  /* 새 거래도 «그 거래의 달»이 잠겼으면 못 넣는다 — 마감한 달에 뒤늦게 끼워 넣으면
     이미 낸 월계표·시산표와 어긋난다. */
  var _nd=$('nt-date'), _nm=_monthOf(_nd&&_nd.value);
  if(_nm&&monthLocked(_nm)){ _lockStop(_nm); return; }
  var v=function(id){ var e=$(id); return e?String(e.value||'').trim():''; };
  var date=v('nt-date'), memo=v('nt-memo');
  var dep=num(v('nt-dep'))||0, wd=num(v('nt-wd'))||0, bal=num(v('nt-bal'))||0;
  var acct=v('nt-acct').replace(/\D/g,'');
  if(!date){ toast('일자를 입력하세요','warn'); return; }
  if(String(date).slice(0,4)!==String(yr)){ toast(yr+'년 거래만 이 연도에 넣을 수 있습니다','warn'); return; }
  if(!dep&&!wd){ toast('입금 또는 출금 금액을 입력하세요','warn'); return; }
  if(dep&&wd){ toast('입금과 출금을 함께 넣을 수 없습니다 — 두 줄로 나눠 주세요','warn'); return; }
  var p=proposeAcct(memo,dep>0,Object.keys(S.sites||{}).map(function(k){ return String((S.sites[k]||{}).name||''); }));
  /* 키는 가져오기와 같은 방식(hkey) — 같은 거래를 두 번 넣으면 같은 키가 되어 덮어쓴다 */
  var base=date+'|'+dep+'|'+wd+'|'+memo, key=hkey(base);
  var rec={date:date,memo:memo,deposit:dep,withdraw:wd,balance:bal,acct:acct,
           debit:p.d,credit:p.c,approved:false,manual:1};
  fbDb.ref(NS+'/txns/'+fid+'/'+yr+'/'+key).set(rec).then(function(){
    S.txnsFor=null; closeM(); renderFund();
    toast('거래를 추가했습니다'+(p.d&&p.c?' · 계정 제안 '+p.d+'/'+p.c:' — 계정을 지정하세요'));
  }).catch(function(e){ toast('저장 실패: '+e.message,'err'); });
}
function importBank(){
  var _fid=S.fundId, _yr=S.year;   // 클릭 시점 고정 — 로딩 중 기금·연도 이동해도 원래 경로에 저장
  if(!_fid){ toast('기금을 먼저 선택하세요','warn'); return; }
  var _fname=(funds[_fid]&&(funds[_fid].short_name||funds[_fid].name))||_fid;
  var inp=document.createElement('input'); inp.type='file'; inp.accept='.xls,.xlsx';
  inp.onchange=function(ev){ var file=ev.target.files&&ev.target.files[0]; if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
        /* 시트를 **전부** 읽어 합친다. 은행이 월별 시트로 나눠 주는 경우가 있어
           첫 시트에서 멈추면 나머지 달을 통째로 잃는다(C공동 2022: 11월만 읽고 12월
           2,007,649원 누락 — 실측으로 확인). 첫 시트가 안내문인 파일도 함께 처리된다. */
        var txns=null, sheets=[], recognized=false;
        for(var si=0;si<wb.SheetNames.length;si++){
          var rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[si]],{header:1,raw:false,defval:''});
          var got=parseBank(rows);
          if(!got) continue;                     // 입·출금 열이 없는 시트(안내문 등)
          recognized=true;
          if(!got.length) continue;
          sheets.push(wb.SheetNames[si]+' '+got.length+'건');
          txns=(txns||[]).concat(got);
        }
        if(recognized&&!txns) txns=[];
        if(txns&&txns.length){
          /* 머리글에 계좌번호가 없는 파일도 있다(L공동 '1. 계좌(000-000-000000)거래내역_2024년.xlsx').
             그럴 때 **파일명**에서 계좌번호를 뽑아 채운다 — 있으면 이체 매칭이 '확실'로 동작한다. */
          if(!txns.some(function(x){ return x.acct; })){
            var fm=String(file.name||'').match(/(\d{2,}[-\s]\d{2,}[-\s]\d{2,}[-\s\d]*|\d{10,})/);
            if(fm){ var fa=fm[1].replace(/\D/g,''); if(fa.length>=10) txns.forEach(function(x){ x.acct=fa; }); }
          }
          /* 같은 내역이 여러 시트에 겹쳐 들어온 경우만 걸러낸다 — 일자·입금·출금·적요에
             **거래 후 잔액까지** 같아야 중복으로 본다. 월별 시트는 잔액이 달라 살아남고,
             같은 날 같은 금액의 서로 다른 거래도 잔액이 달라 보존된다. */
          var _seen={}, _uniq=[];
          txns.forEach(function(x){
            var k=x.date+'|'+x.deposit+'|'+x.withdraw+'|'+x.memo+'|'+x.balance;
            if(_seen[k]) return; _seen[k]=1; _uniq.push(x);
          });
          txns=_uniq;
        }
        if(!txns){ toast('통장 형식을 인식하지 못했습니다 (입금·출금 열 없음)','err'); return; }
        if(!txns.length){ toast('거래 내역이 없습니다','warn'); return; }
        confirmM('['+_fname+' · '+_yr+'년] '+txns.length+'건의 거래를 읽었습니다.'+(sheets.length>1?'\n시트 '+sheets.length+'개: '+sheets.join(' / '):'')+'\n자동분개 제안과 함께 가져올까요?\n(이미 있는 거래는 승인·분개를 그대로 보존합니다)',{ok:'가져오기'}).then(function(ok){ if(!ok)return;
          return Promise.all([loadLearned(),_siteNames(_fid)]).then(function(_pre){   // 배운 거래처·참여사업장명을 제안에 반영
          var _snames=_pre[1];
          var path=NS+'/txns/'+_fid+'/'+_yr;
          fbDb.ref(path).once('value').then(function(snap){   // 서버 최신본 기준 중복검사 — 오래된 캐시로 승인 거래 덮어쓰기 방지
            var existing=snap.val()||{};
            var obj={}, added=0, kept=0, seen={};
            txns.forEach(function(x){ var base=x.date+'|'+x.deposit+'|'+x.withdraw+'|'+x.memo;
              var n=(seen[base]=(seen[base]||0)+1);
              var key=hkey(n>1?base+'|'+n:base);   // 같은 날 동일 금액·적요 거래도 각각 보존
              /* 키가 겹치면 **정말 같은 거래인지** 확인한다. 적요가 'BZ뱅크'처럼 수단 이름뿐인 은행은
                 계좌가 달라도 일자·금액·적요가 같아 키가 겹친다 — F공동 2024는 두 계좌를
                 따로 가져오면 겹치는 3건(23,934,000원)이 중복으로 버려졌다.
                 계좌번호나 거래 후 잔액이 다르면 다른 거래이므로 뒤에 번호를 붙여 살린다.
                 같은 파일을 다시 가져올 때는 계좌·잔액이 같아 그대로 '기존 유지'가 된다. */
              var dup=false;
              while(existing[key]||obj[key]){
                var cur=existing[key]||obj[key];
                if(String(cur.acct||'')===String(x.acct||'')&&String(cur.balance||'')===String(x.balance||'')){ dup=true; break; }
                n++; key=hkey(base+'|'+n);
              }
              seen[base]=n;
              if(dup){ kept++; return; }
              var p=proposeAcct(x.memo,x.deposit>0,_snames,x.kind);
              obj[key]={date:x.date,memo:x.memo,deposit:x.deposit,withdraw:x.withdraw,balance:x.balance,acct:(x.acct||''),kind:(x.kind||''),debit:p.d,credit:p.c,approved:false}; added++;
            });
            if(added===0){ toast('새로 추가할 거래가 없습니다 (기존 '+kept+'건 유지)','warn'); return; }
            return fbDb.ref(path).update(obj).then(function(){
              /* 계좌번호가 서로 다른 확실한 이체만 자동 상계. 추정은 사람이 확인하게 남긴다. */
              var merged=Object.assign({},existing,obj);
              var list=Object.keys(merged).map(function(k){ var o=Object.assign({},merged[k]); o._id=k; return o; });
              var sure=findTransfers(list).filter(function(pr){ return pr.kind==='sure'; });
              return applyTransfers(sure,_fid,_yr,true).then(function(nx){
                S.txnsFor=null; renderFund();
                toast('가져오기 완료: 신규 '+added+'건'+(kept?' · 기존 '+kept+'건 보존':'')
                  +(nx?' · 계좌 간 이체 '+nx+'쌍 자동 상계':''));
              });
            });
          }).catch(function(e){ toast('저장 실패: '+e.message,'err'); });
          });
        });
      }catch(e){ toast('파싱 실패: '+e.message,'err'); }
    };
    rd.readAsArrayBuffer(file);
  };
  inp.click();
}
function setTxnAcct(id,side,val){ var _key=S.fundId+'/'+S.year;
  if(txnLocked(id)){ _lockStop(_monthOf((S.txns[id]||{}).date)); return; }
  fbDb.ref(NS+'/txns/'+_key+'/'+id+'/'+side).set(val)
    .then(function(){ if(S.txnsFor===_key&&S.txns&&S.txns[id])S.txns[id][side]=val; renderFund(); })
    .catch(function(e){ toast('저장 실패: '+e.message,'err'); renderFund(); }); }
function approveTxn(id,on){
  var x=S.txns&&S.txns[id];
  if(txnLocked(id)){ _lockStop(_monthOf((x||{}).date)); return; }
  if(on){
    if(x&&!_txnDone(x)){ toast(_splitsOf(x).length?'조각 합계를 거래금액과 맞추세요':'차변·대변 계정을 먼저 지정하세요','warn'); renderFund(); return; }
    /* 계좌 간 이체는 현금↔현금으로 상계하므로 차·대가 같은 것이 정상이다 */
    if(x&&!_splitsOf(x).length&&x.debit===x.credit&&!x.xfer){ toast('차변과 대변이 같은 계정입니다','warn'); renderFund(); return; }
  }
  var _key=S.fundId+'/'+S.year, _fid=S.fundId;
  fbDb.ref(NS+'/txns/'+_key+'/'+id+'/approved').set(on)
    .then(function(){
      if(S.txnsFor===_key&&S.txns&&S.txns[id])S.txns[id].approved=on;
      // 사람이 확정한 것만 기억한다(이체 상계는 거래처 성격이 아니라 제외)
      // 쪼갠 거래는 계정이 하나가 아니어서 거래처 학습에 쓰지 않는다
      if(on&&x&&!x.xfer&&!_splitsOf(x).length) learnAcct(x.memo,(num(x.deposit)||0)>0,x.debit,x.credit,_fid);
      renderFund();
    })
    .catch(function(e){ toast('저장 실패: '+e.message,'err'); renderFund(); });
}
function delTxn(id){
  if(txnLocked(id)){ _lockStop(_monthOf(((S.txns||{})[id]||{}).date)); return; }
  confirmM('이 거래를 삭제할까요?',{ok:'삭제',danger:true}).then(function(ok){ if(ok) fbDb.ref(NS+'/txns/'+S.fundId+'/'+S.year+'/'+id).remove().then(function(){S.txnsFor=null;renderFund();toast('삭제되었습니다');}).catch(function(e){toast('삭제 실패: '+e.message,'err');}); }); }

/* ══ 거래 쪼개기 화면 ══ */
var _splitId=null, _splitRows=[];
function splitForm(id){
  var x=(S.txns||{})[id]; if(!x){ toast('거래를 찾지 못했습니다','err'); return; }
  var total=(num(x.deposit)||0)+(num(x.withdraw)||0);

  _splitId=id;
  var sp=_splitsOf(x);
  _splitRows = sp.length ? sp.map(function(s){ return {acct:s.acct, amount:num(s.amount)||0}; })
    : [{acct:((num(x.deposit)||0)>0?x.credit:x.debit)||'', amount:total},{acct:'지급수수료', amount:0}];
  _splitOpen();
}
function _splitTotal(){ var x=(S.txns||{})[_splitId]||{}; return (num(x.deposit)||0)+(num(x.withdraw)||0); }
function _splitRead(){
  _splitRows=_splitRows.map(function(r,i){
    var a=$('sp-a-'+i), m=$('sp-m-'+i);
    return {acct:a?String(a.value||''):r.acct, amount:m?(num(m.value)||0):r.amount};
  });
}
function splitAddRow(){ _splitRead(); _splitRows.push({acct:'',amount:0}); _splitOpen(); }
function splitDelRow(i){ _splitRead(); _splitRows.splice(i,1);
  while(_splitRows.length<2) _splitRows.push({acct:'',amount:0}); _splitOpen(); }
function _splitSumShow(){
  var total=_splitTotal(), s=0;
  for(var i=0;i<_splitRows.length;i++){ var m=$('sp-m-'+i); if(m) s+=num(m.value)||0; }
  var el=$('sp-sum'); if(!el) return;
  el.innerHTML='조각 합계 <b>'+s.toLocaleString()+'</b> / 거래금액 '+total.toLocaleString()
    +(s===total?' <span class="chip ok" style="font-size:10px">일치</span>'
               :' <span class="chip warn" style="font-size:10px">차이 '+(s-total).toLocaleString()+'</span>');
}
function _splitOpen(){
  var x=(S.txns||{})[_splitId]||{}, total=_splitTotal(), isDep=(num(x.deposit)||0)>0;
  var rows=_splitRows.map(function(r,i){
    return '<div class="row" style="gap:6px;margin-bottom:6px">'
      +'<select id="sp-a-'+i+'" style="flex:1;padding:4px 6px"><option value="">(계정 선택)</option>'
      +ACCTS.map(function(a){return '<option'+(r.acct===a?' selected':'')+'>'+a+'</option>';}).join('')+'</select>'
      +'<input id="sp-m-'+i+'" value="'+(r.amount?r.amount.toLocaleString():'')+'" oninput="_splitSumShow()"'
      +' style="width:130px;text-align:right;padding:4px 6px" placeholder="0">'
      +'<button onclick="splitDelRow('+i+')" style="padding:2px 7px">×</button></div>';
  }).join('');
  showModal('<h2 style="margin:0 0 4px">거래 쪼개기</h2>'
    +'<p class="muted" style="font-size:12px;margin:0 0 10px">한 줄에 성격이 다른 금액이 함께 찍힌 경우입니다.<br>'
    +'<b>'+esc(String(x.memo||''))+'</b> · '+(isDep?'입금':'출금')+' <b>'+total.toLocaleString()+'원</b>을 계정별로 나눕니다. '
    +'조각 합계가 이 금액과 같아야 저장됩니다 — <b>통장 잔액 대사는 원래 금액 그대로 유지됩니다.</b></p>'
    +'<div>'+rows+'</div>'
    +'<div class="row" style="gap:10px;margin-top:4px"><button onclick="splitAddRow()">＋ 줄 추가</button>'
    +'<span id="sp-sum" class="muted" style="font-size:12px"></span></div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:14px;gap:8px">'
    +(_splitsOf(x).length?'<button onclick="splitClear()">분할 해제</button>':'')
    +'<button onclick="closeM()">취소</button><button class="primary" onclick="splitSave()">저장</button></div>');
  _splitSumShow();
}
function splitSave(){
  if(txnLocked(_splitId)){ _lockStop(_monthOf(((S.txns||{})[_splitId]||{}).date)); closeM(); return; }
  _splitRead();
  var id=_splitId, x=(S.txns||{})[id]; if(!x){ closeM(); return; }
  var total=(num(x.deposit)||0)+(num(x.withdraw)||0), isDep=(num(x.deposit)||0)>0;
  var sp=_splitRows.filter(function(r){ return r.acct&&(num(r.amount)||0)>0; });
  if(sp.length<2){ toast('계정과 금액을 두 줄 이상 채우세요','warn'); return; }
  var sum=sp.reduce(function(s,r){ return s+(num(r.amount)||0); },0);
  if(sum!==total){ toast('조각 합계 '+sum.toLocaleString()+'원이 거래금액 '+total.toLocaleString()+'원과 다릅니다','warn'); return; }
  var _key=S.fundId+'/'+S.year, up={};
  up.splits=sp.map(function(r){ return {acct:r.acct, amount:num(r.amount)||0}; });
  /* 분할이면 차·대 선택은 쓰지 않는다 — 현금 쪽만 남겨 장부에서 반대편으로 쓴다 */
  up[isDep?'debit':'credit']='현금성자산';
  up[isDep?'credit':'debit']='';
  fbDb.ref(NS+'/txns/'+_key+'/'+id).update(up).then(function(){
    if(S.txnsFor===_key&&S.txns&&S.txns[id]) Object.keys(up).forEach(function(k){ S.txns[id][k]=up[k]; });
    closeM(); renderFund(); toast('거래를 '+sp.length+'개 계정으로 나눴습니다');
  }).catch(function(e){ toast('저장 실패: '+e.message,'err'); });
}
function splitClear(){
  var id=_splitId, _key=S.fundId+'/'+S.year;
  fbDb.ref(NS+'/txns/'+_key+'/'+id+'/splits').remove().then(function(){
    if(S.txnsFor===_key&&S.txns&&S.txns[id]) S.txns[id].splits=null;
    closeM(); renderFund(); toast('분할을 해제했습니다');
  }).catch(function(e){ toast('해제 실패: '+e.message,'err'); });
}

   +'<p>넣어 둔 권역: 서울 25구 전부 · 경기 · 충남 · 충북 · 대전 · 대구 · 경북 · 경남(노동청). 나머지는 비워 두고 수기로 넣습니다.</p>'
   +'<p>⚠ <b>서산지청</b>은 2025-12-30 서산출장소에서 승격돼 서산시·태안군을 맡습니다 — 옛 자료에는 보령지청으로 나옵니다.</p>'},
 'sub.calc':{t:'지원 한도 계산',h:'<p>근로복지공단 공동기금 지원은 <b>세 한도 중 가장 작은 금액</b>까지만 받을 수 있습니다.</p>'
   +'<p><b>㉮ 구간 한도</b> — 참여 사업장 수 <b>또는</b> 근로자 수로 정해집니다(둘 중 유리한 구간). 출연 주체(기업/대기업/지자체)에 따라 표가 다릅니다.<br>'
   +'<b>㉯ 1인당 한도</b> — 근로자 1인당 금액 × 근로자 수. 2025년은 930,000원입니다.<br>'
   +'<b>㉰ 출연(예정)금 100%</b> — 낸 돈보다 많이 받을 수는 없습니다.</p>'
   +'<p>출연금은 <b>참여사업장 탭 → 연도별 기록</b>의 출연금을 먼저 쓰고, 없으면 사업장 명부의 <b>기본 출연금</b>을 씁니다.</p>'
   +'<p>근거: 2025년 근로복지기금 지원사업 시행 안내(근로복지넷), 고시 제8·9조.</p>'},
 'sub.score':{t:'예상 심사점수',h:'<p><b>2025년에 평가표가 개정</b>됐습니다. 화면 위 배지가 <b>어느 해 배점으로 셈했는지</b> 알려 줍니다 — 연도를 바꾸면 그해 배점으로 따라 바뀝니다.</p>'
   +'<p><b>2025년 이후(정량 60 · 정성 40)</b><br>'
   +'① 출연금÷신청액 <b>15점</b> · ② 최다 기업 근로자 비중 15점 · ③ <b>참여기업 1개소당 평균 근로자수</b> 15점 · ④ 참여 기업 수 15점</p>'
   +'<p>③은 <b>근로자수 ÷ 참여기업 수</b>라 참여사업장 자료에서 저절로 나옵니다 — 넣을 칸이 없습니다. '
   +'소규모기업 공동기금을 밀어주려는 개정이라 <b>평균이 적을수록 점수가 높습니다</b>(30명 미만 만점).</p>'
   +'<p><b>정성 40점</b>은 심사위원 재량이라 직접 넣습니다. 타당성·구체성, 정책부합성, 복지개선 정도에 <b>소규모기업 근로자 복지증진 기여도</b>가 더해져 4항목 × 10점입니다.</p>'
   +'<p><b>2024년 이전</b>은 정량 70 · 정성 30(①25점, ③1인당 이미 지원받은 금액)으로 셈합니다 — 그때 낸 서류와 맞추기 위해 그대로 둡니다.</p>'
   +'<p><b>배제 사유</b>: 출연금보다 많이 신청 / 한 기업 근로자가 90% 이상 / 참여 2개소 미만.</p>'
   +'<p>근거: 2025년 지원사업 설명자료 17쪽 「심사위원회 평가표 개정」, 별지 제3호의2.</p>'},
 'sub.opt':{t:'신청액을 얼마로 쓸까',h:'<p>지원율은 점수에 따라 <b>계단식</b>입니다 — 80점↑ 100%, 60~80점 75%, 40~60점 50%, 40점 미만 배제.</p>'
   +'<p>신청액을 올리면 <b>출연금÷신청액</b>이 낮아져 ①점수가 깎이고, 점수가 한 칸 내려가면 지원율이 뚝 떨어집니다. 그래서 <b>신청액을 올렸는데 받는 돈이 줄어드는 구간</b>이 생깁니다.</p>'
   +'<p>표에서 <b>예상 수령액이 가장 큰 행</b>이 추천입니다. [이 금액] 버튼으로 신청액에 넣고 저장하세요.</p>'},
 'sub.docs':{t:'제출서류 관리',h:'<p>공동기금 지원 신청 제출서류는 <b>11종</b>입니다(사내기금은 14종).</p>'
   +'<p>이 중 <b>중소기업확인서·법인등기부등본·사업자등록증은 참여사마다 각 1부</b>라, 32개사면 96장이 됩니다. 그래서 아래 격자에서 사업장별로 따로 체크합니다.</p>'
   +'<p>[📄 서식] 버튼이 있는 것은 이 시스템이 만들어 줍니다. [📋 미제출 명단]으로 담당자 연락처까지 복사해 독촉할 수 있습니다.</p>'},
 'subboard':{t:'지원금 한 화면 입력',h:'<p>그 해 공동기금 전체의 지원금을 <b>한 화면에서</b> 입력합니다.</p><p>칸에 입력하고 다른 칸으로 이동하면 <b>자동 저장</b>됩니다. 기금명을 클릭하면 그 기금 화면으로 넘어갑니다.</p>'},
 'bill.pe':{t:'푸른이알피 연동 청구',h:'<p>푸른이알피 <b>기금관리</b>의 계약금·잔금(미입금)과 확정 매출을 그대로 읽어옵니다.</p>'
   +'<p><b>여기서는 수정하지 않습니다</b> — 금액·입금 처리는 푸른이알피에서 하세요.</p>'
   +'<p><b>기금 연결 순서</b></p><ul><li>직접 지정한 연결</li><li>고유번호·사업자·법인등록번호</li><li>기금명(㈜·근로복지기금 표기를 걷어내고 비교)</li></ul>'
   +'<p>후보가 둘 이상이면 잘못 붙이지 않도록 <b>연결하지 않고</b> ⚠미연결로 남깁니다 — [🔗 연결]로 지정하세요.</p>'},
 'bill.own':{t:'기금 시스템 자체 청구',h:'<p>결산·운영상황보고 보수처럼 <b>기금 시스템에서 직접 관리</b>하는 청구입니다.</p>'
   +'<p>금액은 <b>부가세 별도 공급가</b>입니다. 계산서일·입금일을 넣으면 상태(미청구→청구→입금완료)가 자동으로 바뀝니다.</p>'},
 'forms.lib':{t:'서식 자료실 (전사 표준서식)',h:'<p><b>모든 기금에 적용되는 표준서식</b>을 관리하는 곳입니다 — 견본을 편집해 [💾 공동/사내 공통]으로 저장하거나 원본 .hwp·엑셀을 등록합니다.</p>'
   +'<p>특정 기금의 서식(실데이터 채움·개별 저장)은 <b>기금 현황 → 기금 클릭 → 📑 서식 탭</b>에서 합니다.</p>'},
 'forms.fund':{t:'이 기금의 서식',h:'<p><b>이 기금의 데이터</b>로 채워진 서식입니다.</p><p>왼쪽에서 <b>서식 이름을 클릭</b>하면 오른쪽에서 수정·저장·출력합니다.</p>'
   +'<p><b>[💾 이 기금]</b> = 이 기금 전용으로 저장<br><b>[💾 공통]</b> = 같은 유형 전체의 기본서식으로 저장(서식 자료실에서 관리)</p>'},
 'forms.hwp':{t:'미리보기·편집 vs HWP 편집',h:'<p><b>👁 미리보기·편집</b> — 데이터를 채운 HTML 초안입니다. 화면에서 수정하고 인쇄·HWPX로 저장합니다.</p>'
   +'<p><b>📄 HWP 편집</b> — 원본 .hwp를 등록하면 rhwp 편집기로 열어 .hwp/.hwpx로 저장합니다. <b>원본 서식 그대로</b> 필요할 때 쓰세요.</p>'
   +'<p>HWP 원본은 <b>이 브라우저에 1회만</b> 등록하면 계속 쓰입니다.</p>'},
 'forms.excel':{t:'엑셀로 한 번에 채워받기',h:'<p>공식 제출은 <b>엑셀이 형태를 100% 보존</b>합니다(표·수식·격자·도장란).</p>'
   +'<p>원본 법정서식 엑셀을 <b>최초 1회</b> 등록하면, 이후 인가 6종을 한 번에 채워 내려받을 수 있습니다.</p>'},
 'forms.tax':{t:'③ 고유번호증 서식',h:'<p>설립등기 후 <b>관할 세무서</b>에 법인설립신고·사업자등록(고유번호증)을 신청할 때 필요한 서식입니다.</p>'
   +'<p>사무소를 무상으로 쓰는 경우 <b>전대 사용동의서</b>를 함께 제출합니다.</p>'},
 'forms.ops':{t:'④ 운영 단계 서식',h:'<p>운영 중 제출·발급하는 서식입니다.</p><p>결산·변경이력이 필요한 서식은 아래 링크를 눌러 해당 탭에서 생성하세요 — 실데이터가 있어야 채워집니다.</p>'},
 'forms.sub':{t:'⑤ 근복지원금 신청 서식',h:'<p>매년 지원금을 신청할 때 제출하는 서식 묶음입니다.</p><p>금액·참여사업장은 <b>지원금 입력</b> 탭의 데이터로 채워집니다.</p>'},
 'forms.draft':{t:'전체 초안(6종) 미리보기',h:'<p>기금 기본정보로 채운 6종 초안입니다. <b>A4 낱장</b>으로 나뉘어 그대로 인쇄됩니다.</p>'
   +'<p>공식 제출용은 형태가 100% 보존되는 <b>엑셀 채움</b>을 권합니다.</p>'},
 'sub.helper':{t:'근로복지넷 입력 도우미',h:'<p>근로복지넷은 <b>인증서·간편인증</b>으로 사람이 직접 로그인하는 곳이라, 앱이 대신 로그인하지 않습니다.</p>'
   +'<p>대신 <b>별지 제1호서식 지원신청서</b>의 칸 차례대로 값을 세워 두고 칸마다 <b>[복사]</b>를 둡니다 — 두 화면을 나란히 놓고 옮겨 적으세요.</p>'
   +'<p>금액·사람 수는 <b>쉼표 없는 숫자</b>로 복사됩니다 — 관공서 입력칸이 쉼표를 안 받는 곳이 많습니다. (화면에는 쉼표를 넣어 보여 줍니다)</p>'
   +'<p><b>[📋 전부 복사]</b>는 칸이름과 값을 탭으로 갈라 줍니다 — 엑셀에 붙여 놓고 대조하세요.</p>'
   +'<p>값이 없는 칸은 <b>[채우러 →]</b>로 채우는 자리로 갑니다. 없는 값을 지어내지 않습니다.</p>'
   +'<p>※ 실제 근로복지넷 화면과 칸 차례가 다르면 알려 주세요 — 그대로 맞춥니다.</p>'},
 'forms.xlprev':{t:'엑셀 미리보기',h:'<p>값·<b>병합·열폭</b>을 원본대로 그리는 <b>읽기전용</b> 화면입니다.</p><p><b>[🔀 한글본과 나란히]</b>를 누르면 같은 서식의 한글본을 옆에 놓고 대조합니다 — 시트 번호와 우리 목록 번호는 차례가 달라 <b>이름으로</b> 짝을 짓습니다.</p><p>수정·인쇄는 [⬇ 받기] 후 <b>엑셀에서</b> 하세요 — 원본 법정서식(A4)의 표·수식·서식이 100% 보존됩니다.</p>'},
 'forms.edit':{t:'서식 수정·저장',h:'<p>내용을 클릭해 바로 수정합니다.</p><p><b>[💾 이 기금]</b> = 이 기금 전용 저장<br><b>[💾 공통]</b> = 같은 유형 모든 기금의 기본서식</p>'
   +'<p>격자·도장란이 그대로 필요하면 <b>엑셀</b> 또는 <b>HWP</b>를 쓰세요.</p>'},
 'setup.flow':{t:'설립 진행',h:'<p>신규 설립 절차입니다. 중간에 나가도 <b>이 상태로 저장</b>되며, 목록에서 <b>🏗 설립중</b> 표시로 다시 찾아 이어서 진행할 수 있습니다.</p>'
   +'<p>12단계를 마치면 <b>[운영 전환]</b>으로 정식 운영 기금이 됩니다.</p><p>인가번호·등기 등 실제 값은 <b>[기금 정보] 탭</b>에 입력합니다.</p>'},
 'site.card':{t:'기업정보함에서 사업장 추가',h:'<p>푸른 <b>기업정보함</b>의 <b>사업자등록증</b>이나 <b>명함</b>을 골라 참여사업장을 채워 넣습니다 — 다시 칠 이유가 없습니다.</p>'
   +'<p><b>사업자등록증</b>에서는 상호·대표자·사업자등록번호·법인등록번호·업태·소재지를 가져옵니다.</p>'
   +'<p><b>명함</b>에서는 위에 더해 <b>담당자</b>(이름·직위·휴대폰·이메일)까지 가져옵니다. 명함에 회사 번호가 없으면 <b>같은 회사의 사업자등록증을 찾아</b> 빈 칸을 메웁니다.</p>'
   +'<p><b>기업 상세</b>에 그 회사가 있으면 <b>상시근로자수</b>까지 함께 가져옵니다 — 기업정보함 「기업 상세」에 쌓인 값입니다. 없으면 그 칸만 비워 둡니다.</p>'
   +'<p><b>추가</b>는 값이 채워진 <b>사업장 추가 창</b>을 엽니다. <b>편집 창의 [🏢 기업정보함에서]</b>는 이미 있는 사업장의 <b>빈 칸만</b> 채웁니다 — 적혀 있는 값은 건드리지 않습니다.</p>'
   +'<p>어느 쪽이든 [저장]을 눌러야 기록됩니다 — 바로 저장되지 않습니다. 기본 출연금은 기업정보함에 없는 값이라 직접 넣어야 합니다.</p>'},
 'newfund.card':{t:'등록하면서 기업정보함에서 당겨오기',h:'<p>기금법인의 <b>사업자등록증(고유번호증)</b> 카드를 고르면 등록 창이 채워집니다.</p>'
   +'<p><b>창에 보이는 칸</b> — 기금법인명</p>'
   +'<p><b>칸은 없지만 함께 등록되는 것</b> — 고유번호 · 법인등록번호 · 대표자 · 소재지 · 전화. 등록 창에는 이 칸들이 없지만 버리지 않고 <b>기금에 함께 저장</b>합니다(제목 옆 딱지로 몇 칸인지 보여 줍니다).</p>'
   +'<p><b>빈 칸만</b> 채웁니다. 이미 친 이름·약칭·유형·담당은 그대로 두고 돌아옵니다.</p>'
   +'<p>인가번호 · 인가일 · 설립등기일은 기업정보함에 없습니다 — 등록 뒤 <b>서류 자동 입력</b>(인가증·등기부)으로 넣으세요.</p>'},
 'officer.card':{t:'명함에서 임원 이름 가져오기',h:'<p>푸른 기업정보함의 <b>명함</b>에서 이름을 골라 명부에 줄을 하나 더합니다.</p>'
   +'<p><b>직위는 넣지 않습니다.</b> 임원 직위는 <b>등기부등본</b>을 봐야 아는 것이고, 명함 직책(사무국장 등)과 다릅니다. 넣은 뒤 직위를 골라 주세요 — 명함 직책은 알림으로 알려 줍니다.</p>'
   +'<p>이름이 빈 줄이 있으면 그 줄에 넣고, 없으면 줄을 더합니다. <b>이미 있는 이름은 넣지 않습니다.</b></p>'
   +'<p>넣은 뒤 <b>[💾 저장]</b>을 눌러야 기록됩니다.</p>'},
 'info.card':{t:'기업정보함에서 당겨오기',h:'<p>푸른 <b>기업정보함</b>에 등록된 <b>사업자등록증</b> 카드에서 기금 정보를 그대로 가져옵니다 — 다시 칠 이유가 없습니다.</p>'
   +'<p><b>가져오는 칸</b> — 기금법인명 · 고유번호 · 법인등록번호 · 대표자 · 소재지 · 전화</p>'
   +'<p><b>빈 칸만 채웁니다.</b> 이미 적혀 있는 값은 건드리지 않습니다. 채운 뒤 <b>[💾 저장]</b>을 눌러야 기록됩니다.</p>'
   +'<p>기금법인은 사업자등록번호가 아니라 <b>고유번호</b>를 받으므로, 카드의 번호는 고유번호 칸으로 들어갑니다 — 사업자등록증 카드라면 확인하세요.</p>'
   +'<p>목록은 <b>사업자등록증 카드만</b> 보여 주고, 지금 기금 이름과 닮은 것을 위로 올립니다. 사진은 읽지 않습니다(원본이 수 MB라 목록만 씁니다).</p>'},
 'doc.confirm':{t:'서류 확인',h:'<p><b>왼쪽에 원본, 오른쪽에 읽은 값</b>을 나란히 놓습니다. 값만 보면 잘못 읽힌 것을 알아챌 수가 없습니다.</p>'
   +'<p><b>값은 고칠 수 있습니다.</b> 고친 그대로 아래 칸에 들어갑니다 — 못 고치게 두면 오독을 찾아 놓고도 손쓸 데가 없습니다.</p>'
   +'<p><b>[🔍 다시 읽기(OCR)]</b> — 글자로 읽었는데 항목을 못 찾았을 때 씁니다. 그림으로 보고 다시 읽습니다.<br>'
   +'<b>[📄 원문 텍스트]</b> — 무엇이 읽혔는지 그대로 봅니다. 한 번 더 누르면 접힙니다.</p>'
   +'<p><b>OCR</b> 딱지가 붙으면 스캔 사진을 그림에서 글자로 바꾼 것이라 <b>반드시 확인</b>해야 합니다. <b>글자 그대로 읽음</b> 이면 PDF 안의 글자를 그대로 가져온 것이라 정확합니다.</p>'
   +'<p>[↓ 아래 칸에 반영]을 눌러도 <b>저장은 따로</b>입니다 — 아래 <b>[💾 저장]</b>까지 눌러야 기록됩니다.</p>'},
 'doc.charter':{t:'정관',h:'<p>정관 원본을 올리면 <b>조문 전체를 글자로 읽어</b> 보관합니다. 다른 서류처럼 칸을 채우는 것이 아니라 <b>내용 자체</b>가 자료입니다.</p>'
   +'<p><b>올릴 때마다 «새 판»으로 쌓습니다.</b> 덮어쓰지 않습니다 — 정관 변경은 인가 사항이라 「언제 무엇이 어떻게 바뀌었나」를 댈 수 있어야 합니다. 나중에 판끼리 대조하고 변경 회의록을 만들려면 옛 판이 남아 있어야 합니다.</p>'
   +'<p><b>📎 원본</b> 은 사진첩의 스캔 원본을, <b>📄 전문</b> 은 읽어 둔 글자를 보여 줍니다. 판이 여럿이면 전문 창에서 골라 볼 수 있습니다.</p>'
   +'<p><b>글자 PDF</b> 는 그대로 읽히고, <b>스캔 사진</b> 은 OCR 로 읽습니다 — OCR 은 오독이 있을 수 있어 딱지를 답니다. 200자보다 적게 읽히면 정관이 맞는지 되묻습니다.</p>'
   +'<p>전문은 기금 목록에 얹지 않고 <b>볼 때만</b> 읽습니다 — 42개가 늘 켜져 있는 자리에 정관을 붙이면 첫 화면이 그만큼 무거워집니다.</p>'},
 'doc.auto':{t:'사진첩에서 서류 찾기',h:'<p>푸른사진첩을 훑어 이 기금의 <b>설립인가증 · 법인 등기부등본 · 고유번호증</b>을 <b>스스로 찾아</b> 줍니다. 해마다 사진을 눈으로 뒤질 필요가 없습니다.</p>'
   +'<p><b>어떻게 찾나</b> — 사진첩이 이미 읽어 둔 <b>서류 제목</b>으로 고릅니다. 제목에 「인가증」·「등기사항」·「고유번호」가 든 사진이 후보입니다. 기금 이름까지 맞으면 <b>이름 맞음</b> 딱지를 달고 맨 위에 둡니다.</p>'
   +'<p><b>이름이 안 맞아도 버리지 않습니다</b> — 사진첩에 기금 이름이 안 적힌 경우가 흔합니다. 종류만 맞으면 후보로 올립니다.</p>'
   +'<p><b>자동으로 넣지 않습니다.</b> 고르면 판독한 뒤 <b>판독 결과</b>를 보여 주고, [↓ 아래 칸에 반영]을 눌러야 칸에 들어갑니다. 저장은 그 뒤 [💾 저장]입니다. 서류 한 장이 기금의 인가번호를 바꾸므로 사람 눈을 건너뛰지 않습니다.</p>'
   +'<p><b>못 찾으면</b> 그 서류는 사진첩에 없거나 아직 판독이 안 된 것입니다 — 사진첩에서 판독해 두면 다음부터 여기 나옵니다. 그때까지는 ⬇ 로 파일을 직접 올리면 됩니다.</p>'
   +'<p>사진첩 원본은 그대로 남고 기금에는 <b>참조만</b> 남습니다.</p>'},
 'album.pick':{t:'사진첩에서 서류 고르기',h:'<p>폰으로 찍어 <b>푸른사진첩</b>에 올린 서류를 그대로 가져옵니다. PC로 파일을 옮길 필요가 없습니다.</p>'
   +'<p><b>원본은 사진첩에 남고</b>, 기금에는 읽어낸 값과 <b>연결 정보만</b> 저장됩니다 — 기금 자료가 무거워지지 않습니다.</p>'
   +'<p>서류로 표시된 사진이 위에 옵니다. 연도를 바꿔 지난 사진도 찾을 수 있습니다.</p>'
   +'<p>사진첩은 <b>올린 사람별</b>로 나뉘어 있습니다. 대표·총괄은 전체가 보이고, 그 외에는 본인이 올린 것만 보입니다.</p>'},
 'doc.read':{t:'서류 자동 판독',h:'<p><b>전자문서 PDF</b>는 글자를 그대로 읽어 <b>정확</b>합니다.</p>'
   +'<p><b>스캔본·사진</b>은 OCR로 읽습니다(최초 1회 한국어 데이터 약 15MB 내려받기). <b>오독이 있을 수 있으니 반드시 확인</b>하세요.</p>'
   +'<p>판독 결과는 [아래 칸에 반영]을 눌러야 입력되고, 저장은 별도입니다.</p>'},
 'close.bank':{t:'통장 자동분개',h:'<p>통장 엑셀을 올리면 거래를 읽어 자동분개를 <b>제안</b>합니다.</p><p>차변/대변 계정을 확인·수정하고 <b>승인</b>에 체크하세요 — 승인한 것만 결산에 반영됩니다.</p>'
   +'<p><b>장부는 모두 이 승인 분개에서 나옵니다</b> — 분개장 → 계정별원장 → 월계표 → 시산표 → 재무제표 순으로 파생되므로, 어느 화면에서 봐도 숫자가 같습니다.</p>'},
 'close.journal':{t:'분개장',h:'<p>승인된 거래를 <b>일자순</b>으로 차변·대변 한 쌍씩 보여줍니다.</p>'
   +'<p>같은 날 거래가 2건 이상이면 <b>일자 소계</b>가 붙습니다. 맨 아래 합계는 차변·대변이 반드시 같아야 합니다.</p>'},
 'close.ledger':{t:'계정별원장',h:'<p>계정 하나를 골라 그 계정의 거래만 <b>잔액이 이어지도록</b> 봅니다.</p>'
   +'<p>맨 위 회색 줄이 <b>전기이월</b>이고, 그 아래로 잔액이 누적됩니다.</p>'
   +'<p>잔액 방향은 계정 성격에 따릅니다 — <b>자산·비용</b>은 차변 잔액, <b>부채·자본·수익</b>은 대변 잔액.</p>'},
 'close.monthly':{t:'월계표',h:'<p>계정별로 <b>월별 발생액</b>을 한 표에 펼칩니다. 어느 달에 무엇이 늘고 줄었는지 한눈에 보입니다.</p>'
   +'<p>부호는 그 계정이 <b>늘어난 방향</b>을 +로 잡습니다(자산·비용은 차변 증가, 부채·자본·수익은 대변 증가). 빨간 음수는 감소입니다.</p>'
   +'<p>거래가 없는 달은 열이 생기지 않습니다.</p>'},
 'close.tb':{t:'합계잔액시산표',h:'<p>제출 서식과 같은 <b>4열</b>(차변 합계·잔액 / 계정과목 / 대변 잔액·합계)로 만듭니다.</p>'
   +'<p>전기이월도 합계에 포함됩니다. 맨 아래 <b>차변 합계=대변 합계</b>, <b>차변 잔액=대변 잔액</b>이 맞아야 결산이 성립합니다.</p>'
   +'<p>불일치가 뜨면 전기이월 입력이나 미승인 거래를 먼저 확인하세요.</p>'},
 'close.cf':{t:'현금흐름표',h:'<p>실제로 <b>오간 현금</b>만 모읍니다(직접법). 준비금 설정·환입처럼 현금이 움직이지 않는 분개는 빠집니다.</p>'
   +'<p><b>영업활동</b> 출연금·이자·목적사업비·관리비 · <b>투자활동</b> 대부금 지급/회수, 예금·증권 예치/해지 · <b>재무활동</b> 차입(기금은 없음)</p>'
   +'<p>맨 아래 <b>기말의 현금</b>은 재무상태표의 현금과 같아야 합니다. 다르면 화면이 그 차이를 알려 줍니다.</p>'},
 'close.accts':{t:'계정과목표',h:'<p>계정과목마다 <b>번호</b>를 붙였습니다. 통상 방식입니다 — <b>1</b> 자산 · <b>2</b> 부채 · <b>3</b> 자본 · <b>4</b> 수익 · <b>5</b> 비용.</p>'
   +'<p>번호 뒷자리는 재무제표가 서는 차례를 따릅니다. 11x 당좌자산 · 15x 비유동자산 · 51x 목적사업비 · 53x 일반관리비 처럼요.</p>'
   +'<p>「재무제표 위치」는 그 계정이 <b>어느 줄로 흘러가는지</b>를 보여 줍니다. 분류를 여기 따로 적어 둔 것이 아니라, 결산이 실제로 쓰는 목록을 그대로 읽습니다 — 계정을 옮기면 이 표도 같이 바뀝니다.</p>'
   +'<p>번호는 손으로 정합니다. 차례에서 뽑으면 계정 하나를 끼워 넣을 때 뒤 번호가 모두 밀려, 이미 내보낸 자료와 어긋납니다.</p>'},
 'close.notes':{t:'주석',h:'<p>공익법인회계기준이 요구하는 <b>마지막 한 장</b>입니다. 숫자만으로는 못 보여 주는 «왜 그런 숫자인지»를 적습니다.</p>'
   +'<p>개요 · 회계처리 방침 · 준비금 변동 · 기본재산 변동 · 대부금 · 목적사업 집행 · 우발부채, 이렇게 일곱 갈래입니다.</p>'
   +'<p><b>빈 칸은 앱이 채우지 않습니다.</b> 인가번호·소재지처럼 비어 있으면 「—」로 두고, 무엇이 비었는지만 위에 알려 줍니다. 기금 기본정보에서 채우면 여기에 나옵니다.</p>'
   +'<p>「📋 글자로 복사」를 누르면 한글 문서에 그대로 붙여 쓸 수 있습니다.</p>'},
 'close.ie':{t:'수입지출명세서',h:'<p>비영리 회계가 쓰는 <b>관 — 항 — 목</b> 차례로 수입과 지출을 적습니다(이카운트 비영리회계와 같은 짜임새).</p>'
   +'<p><b>수입</b> 출연금수입 · 사업수익 · 이월금 &nbsp; <b>지출</b> 고유목적사업비 · 일반관리비 · 대부사업</p>'
   +'<p><b>이월금</b>은 전기말 자산총계입니다. 현금이 오가지 않은 분개는 빠집니다.</p>'},
 'close.fin':{t:'재무제표 · 전기 대비',h:'<p>재무상태표·손익계산서를 <b>당기와 전기를 나란히</b> 놓고 증감액·증감률까지 계산합니다.</p>'
   +'<p>전기 숫자는 <b>지난해 승인 분개 + 지난해 전기이월</b>로 그 자리에서 다시 계산한 것입니다 — 따로 입력하지 않습니다.</p>'
   +'<p>지난해 자료가 없으면 전기는 0으로 표시되고 안내 배지가 붙습니다.</p>'},
 'close.years':{t:'연도별 비교',h:'<p>한 기금의 <b>여러 연도를 나란히</b> 놓고 자산·기본재산·목적사업비·순이익·수혜자수의 흐름을 봅니다.</p>'
   +'<p><b>확정</b> 배지가 붙은 연도는 결산 확정 당시의 <b>스냅샷</b>을 그대로 보여줍니다 — 나중에 거래를 손대도 제출했던 숫자가 바뀌지 않습니다.</p>'
   +'<p><b>작성중</b>은 지금 거래에서 계산한 값이라 바뀔 수 있습니다.</p>'
   +'<p>▲▼는 <b>직전 연도 대비</b> 증감 방향입니다.</p>'},
 'home.view':{t:'보기 전환',h:'<p>기금 목록은 <b>하나</b>입니다. 위 탭으로 <b>어느 기금</b>을 볼지 고르고, 보기 전환으로 <b>무엇을</b> 볼지 고릅니다.</p>'
   +'<p><b>기본정보</b> — 담당·대표자·정보 완비도·계약관계<br><b>서식 준비</b> — 기금별 서식 작성 상태<br><b>결산</b> — 연도별 결산 확정 상태</p>'
   +'<p>목록 화면을 여러 개 두지 않고 <b>열만 바꿉니다</b>. 그래서 지역·공동·사내 같은 분류와 검색이 세 보기 모두에 그대로 적용됩니다.</p>'},
 'home.docs':{t:'서식 준비 상태',h:'<p>지금 분류에 속한 기금들의 <b>서식 작성 상태</b>를 한눈에 비교합니다.</p>'
   +'<p><b>🟢</b> 개별 저장본 있음<br><b>📎</b> 원본 HWP 등록(전사 공통)<br><b>⚪</b> 미작성(자동생성 초안만)<br><b>·</b> 해당 없음(공동/사내 유형 불일치)</p>'
   +'<p>단계 탭(인가·등기·고유번호증·운영·지원금·인센티브)으로 열을 바꾸고, 칸을 누르면 그 기금의 그 서식으로 바로 갑니다.</p>'},
 'board.close':{t:'결산 현황',h:'<p>지금 분류에 속한 기금들의 <b>최근 6개 연도 결산 상태</b>를 한 표로 봅니다.</p>'

 'newfund':{t:'새 기금 등록',h:'<p><b>신규</b>(설립부터) 또는 <b>기존</b>(이미 설립·운영 중) 기금을 등록합니다.</p><p>담당은 푸른이알피 <b>재직자</b>에서 선택합니다.</p>'},
 'mgr':{t:'담당자 지정',h:'<p>푸른이알피 재직자 명단에서 선택합니다.</p><p><b>주담당 1명</b>, <b>부담당은 여러 명</b> 지정할 수 있습니다.</p>'}

function hlp(k){ if(!HELP[k]) return '';
  return '<button class="hbtn" onclick="event.stopPropagation();showHelp(\''+k+'\')" title="'+esc(HELP[k].t)+' — 설명 보기">ⓘ</button>'; }
function showHelp(k){ var x=HELP[k]; if(!x) return;
  showModal('<h2 style="margin:0 0 10px;font-size:16px">ⓘ '+esc(x.t)+'</h2><div class="helpbody">'+x.h+'</div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:16px"><button class="primary" onclick="closeM()">닫기</button></div>');
}
// ── 간단 모달 ──
function showModal(html,opts){
  opts=opts||{};
  var m=document.createElement('div'); m.id='modalbg';
  m.style.cssText='position:fixed;inset:0;background:rgba(20,30,50,.35);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px';
  m.onclick=function(e){ if(e.target===m) closeM(); };
  m.innerHTML='<div id="modalbox" style="background:#fff;border-radius:14px;padding:20px 22px;max-width:'+(opts.width||640)+'px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)">'+html+'</div>';
  document.body.appendChild(m);
  /* 창을 닫을 때 되돌아갈 곳. 창 «안»의 폼에서 다른 창(기업정보함 고르기)을 열면,
     고르든 그만두든 원래 폼으로 돌아와야 한다 — 창은 겹쳐 뜨지 않는다
     (closeM 은 첫 #modalbg 를 지우므로 두 겹이면 «뒤» 창이 지워진다). */
  if(opts.onclose) m._onclose=opts.onclose;
  if(opts.after) setTimeout(opts.after,0);
}
function closeM(){ var m=$('modalbg'); if(!m) return;
  var cb=m._onclose; m._onclose=null; m.remove();
  if(cb){ try{ cb(); }catch(e){} } }
// ── 공통 편의 ①: 통일된 확인 모달 (confirm 대체) ──
function confirmM(msg,opts){
  opts=opts||{};
  return new Promise(function(resolve){
    var m=document.createElement('div'); m.id='confirmbg';
    m.style.cssText='position:fixed;inset:0;background:rgba(20,30,50,.4);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
    var danger=opts.danger?'#991b1b':'var(--acc)';
    m.innerHTML='<div style="background:#fff;border-radius:14px;padding:22px 24px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.28)">'
      +'<div style="font-size:14px;line-height:1.6;white-space:pre-line;margin-bottom:18px">'+esc(msg)+'</div>'
      +'<div class="row" style="justify-content:flex-end;gap:8px"><button id="cf-no">'+esc(opts.cancel||'취소')+'</button>'
      +'<button id="cf-yes" class="primary" style="background:'+danger+'">'+esc(opts.ok||'확인')+'</button></div></div>';
    document.body.appendChild(m);
    function done(v){ m.remove(); document.removeEventListener('keydown',key,true); resolve(v); }
    function key(e){ if(e.key==='Escape'){e.stopPropagation();done(false);} else if(e.key==='Enter'){e.stopPropagation();done(true);} }
    m.querySelector('#cf-yes').onclick=function(){done(true);};
    m.querySelector('#cf-no').onclick=function(){done(false);};
    m.onclick=function(e){ if(e.target===m) done(false); };
    document.addEventListener('keydown',key,true);
    var y=m.querySelector('#cf-yes'); if(y)y.focus();
  });
}
// ── 공통 편의 ③: 통일된 로딩 표시 ──
function loadingHTML(msg){ return '<div class="loading"><span class="spin"></span>'+esc(msg||'불러오는 중…')+'</div>'; }
// ── 공통 편의 ②: 저장 안 한 변경 이탈 경고 ──
var _dirty=false;
function markDirty(){ _dirty=true; }
function clearDirty(){ _dirty=false; }
window.addEventListener('beforeunload',function(e){ if(_dirty){ e.preventDefault(); e.returnValue=''; } });
// 창 크기 변화 시 A4 미리보기 배율 재계산(과호출 방지 디바운스)
var _fitT=null;
window.addEventListener('resize',function(){ clearTimeout(_fitT); _fitT=setTimeout(function(){
  if(window.innerWidth>860) closeSide();   // 넓어지면 서랍은 자동으로 닫는다(사이드바가 다시 고정 표시됨)
  try{ fitDocA4(); }catch(e){} },150); });
// ── 공통 편의 ④: 키보드 단축키 (Esc=닫기→뒤로 · Backspace=뒤로 · Ctrl/Cmd+S=저장) ──
function _inTyping(e){ var t=e.target||document.activeElement;
  return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable); }
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if($('confirmbg'))return;                       // 확인창은 자체 처리
    if($('modalbg')){ closeM(); return; }           // 1) 모달 닫기
    if(document.body.classList.contains('sideopen')){ closeSide(); return; }   // 1-2) 모바일 서랍 닫기
    var t=document.activeElement;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT')){ t.blur(); return; } // 2) 입력 포커스 해제
    if(S.view!=='home'){ goBack(); }                // 3) 화면 뒤로가기
    return;
  }
  if(e.key==='Backspace'&&!_inTyping(e)){           // 입력 중 아닐 때 백스페이스 = 뒤로
    e.preventDefault();
    if($('modalbg')||$('confirmbg')) return;
    if(S.view!=='home') goBack();
    return;
  }
  if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')){
    e.preventDefault();
    if($('confirmbg')) return;   // 확인 대화상자 떠 있으면 저장 무시
    var mb=$('modalbg'); if(mb){ var pb=mb.querySelector('button.primary'); if(pb){ pb.click(); return; } }
    if(S.view==='fund'&&S.tab==='info'&&typeof saveInfo==='function'){ saveInfo(); }
  }
});
</script>
