function start(){
  $('root').innerHTML=shell();
  initTop();
  bindNavDrag(); loadNavOrder();      // 사이드바 메뉴 순서(사용자가 드래그로 정한 순서) 복원

    if(snap.exists()||_fbOnline) S._fundsSynced=true;   // 서버 값을 받은 뒤에만 '기금 없음'이라고 말한다
    if(appHasFocus()){ S._pendingRender=true; return; }   // 입력 중엔 재렌더 보류(값 소실 방지)
    route();
  }, function(err){
    $('app').innerHTML='<div class="panel"><h2 style="color:var(--danger)">읽기 권한 오류</h2><p class="muted">'+esc(err.message)+'</p></div>';
  });
  // 입력 포커스가 빠지면 보류된 재렌더 반영
  document.addEventListener('focusout', function(){ setTimeout(function(){
    if(S._pendingRender && !appHasFocus()){ S._pendingRender=false; route(); }
  }, 150); });
}
function appHasFocus(){ var ae=document.activeElement, app=$('app');
  return !!(ae && app && app.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)); }

}

/* Firebase의 모든 쓰기를 한 곳에서 감시한다. 기능별 저장 코드를 빠뜨려도 상단 상태가 동일하게 보인다. */
var _savePending=0,_saveFailed=false,_writeStatusInstalled=false;
function setWriteStatus(kind,text){var e=$('saveState');if(!e)return;e.className=kind;e.textContent=text;}
function _writeBegin(){if(_savePending===0)_saveFailed=false;_savePending++;setWriteStatus('saving','저장 중…');}
function _writeEnd(ok){_savePending=Math.max(0,_savePending-1);if(!ok)_saveFailed=true;if(!_savePending)setWriteStatus(_saveFailed?'failed':'saved',_saveFailed?'저장 실패':'저장 완료');}
function installWriteStatus(){
  if(_writeStatusInstalled||!firebase.database||!firebase.database.Reference)return;
  _writeStatusInstalled=true;
  ['set','update','remove'].forEach(function(name){
    var proto=firebase.database.Reference.prototype, original=proto[name]; if(typeof original!=='function')return;
    proto[name]=function(){
      _writeBegin(); var p;
      try{p=original.apply(this,arguments);}catch(e){_writeEnd(false);throw e;}
      return Promise.resolve(p).then(function(v){_writeEnd(true);return v;},function(e){_writeEnd(false);throw e;});
    };
  });
}

/* ══ 사이드바 메뉴 순서 드래그 ══
   자주 쓰는 메뉴를 위로 끌어올려 저장한다. 마우스·손가락 모두 되게 Pointer Events를 쓴다
   (HTML5 dragstart는 터치에서 동작하지 않음).
   저장: localStorage(즉시 적용) + Firebase fund_erp/ui_prefs/{uid}/nav_order(다른 PC에서도 유지). */
var NAV_LS='fund_nav_order_v1';
function _navIds(){ var l=$('navlist'); return l?Array.prototype.map.call(l.querySelectorAll('.sitem[data-nav]'),function(e){return e.id;}):[]; }
function applyNavOrder(order){
  var l=$('navlist'); if(!l||!order||!order.length) return;
  order.forEach(function(id){ var el=document.getElementById(id); if(el&&el.parentNode===l) l.appendChild(el); });
}
function _navUid(){ try{ var u=firebase.auth().currentUser; return (u&&u.uid)||''; }catch(e){ return ''; } }
function loadNavOrder(){
  try{ var raw=localStorage.getItem(NAV_LS); if(raw) applyNavOrder(JSON.parse(raw)); }catch(e){}   // ① 즉시
  var uid=_navUid(); if(!uid||!fbDb) return;
  fbDb.ref(NS+'/ui_prefs/'+uid+'/nav_order').once('value').then(function(s){        // ② 다른 PC에서 바꾼 순서 반영
    var o=s.val(); if(!o||!o.length) return;
    applyNavOrder(o); try{ localStorage.setItem(NAV_LS,JSON.stringify(o)); }catch(e){}
  }).catch(function(){});
}
function saveNavOrder(){
  var o=_navIds(); if(!o.length) return;
  try{ localStorage.setItem(NAV_LS,JSON.stringify(o)); }catch(e){}
  var uid=_navUid();
  if(uid&&fbDb) fbDb.ref(NS+'/ui_prefs/'+uid+'/nav_order').set(o).catch(function(){});   // 실패해도 이 기기에는 남는다
  toast('메뉴 순서를 저장했습니다');
}
/* 끌고 있는 항목을 포인터 위치에 맞는 자리로 실제로 옮긴다 — 형제의 중간선을 넘으면 그 앞으로.
   끌리는 대로 즉시 보이므로 별도의 자리표시자(placeholder)가 필요 없다. */
function _navPlace(list,el,clientY){
  var items=Array.prototype.filter.call(list.querySelectorAll('.sitem[data-nav]'),function(x){return x!==el;});
  for(var i=0;i<items.length;i++){
    var r=items[i].getBoundingClientRect();
    if(clientY < r.top+r.height/2){ list.insertBefore(el,items[i]); return i; }
  }
  list.appendChild(el); return items.length;
}
var _navDrag=null, _navMoved=false;
function bindNavDrag(){
  var l=$('navlist'); if(!l||l._navBound) return; l._navBound=1;
  l.addEventListener('pointerdown',function(e){
    if(e.button!==undefined&&e.button!==0) return;                 // 왼쪽 버튼(또는 터치)만
    var it=e.target.closest&&e.target.closest('.sitem[data-nav]'); if(!it) return;
    _navDrag={el:it,startY:e.clientY,h:it.offsetHeight,pid:e.pointerId,cap:false}; _navMoved=false;
    /* 여기서 setPointerCapture를 걸면 안 된다 — 포인터를 캡처하면 pointerdown/up의 대상이
       #navlist가 되고, click도 #navlist에 떨어져 .sitem의 onclick(화면 이동)이 실행되지 않는다.
       캡처는 실제로 끌기 시작한 뒤(5px 초과)에만 건다. */
  });
  l.addEventListener('pointermove',function(e){
    if(!_navDrag) return;
    var dy=e.clientY-_navDrag.startY;
    if(!_navMoved){
      if(Math.abs(dy)<5) return;                                   // 5px 넘기 전엔 그냥 클릭으로 본다
      _navMoved=true; _navDrag.el.classList.add('navdrag'); document.body.style.userSelect='none';
      // 끌기가 시작된 지금부터 캡처 — 포인터가 사이드바를 벗어나도 끌기가 이어진다
      try{ l.setPointerCapture(_navDrag.pid); _navDrag.cap=true; }catch(_){}
    }
    e.preventDefault();
    _navPlace(l,_navDrag.el,e.clientY);
  });
  function end(e){
    if(!_navDrag) return;
    var moved=_navMoved, el=_navDrag.el, cap=_navDrag.cap, pid=_navDrag.pid;
    _navDrag=null; _navMoved=false;
    el.classList.remove('navdrag'); document.body.style.userSelect='';
    if(cap){ try{ l.releasePointerCapture(pid); }catch(_){} }   // 걸었을 때만 해제
    if(!moved) return;                                             // 안 움직였으면 평소처럼 화면 이동(onclick)
    // 끌어서 옮긴 경우엔 뒤따르는 click이 화면을 바꾸지 않게 한 번만 삼킨다
    var swallow=function(ev){ ev.stopPropagation(); ev.preventDefault(); };
    document.addEventListener('click',swallow,true);
    setTimeout(function(){ document.removeEventListener('click',swallow,true); },0);
    saveNavOrder();
  }
  l.addEventListener('pointerup',end); l.addEventListener('pointercancel',end);
}
/* ── 모바일 서랍 메뉴 ── 좁은 화면에서 사이드바를 밀어넣고 ☰로 여닫는다 */

    if(on) S._fundsSynced=true;                       // 서버와 붙었으면 이후 스냅샷은 실제 데이터
    if(!appHasFocus() && $('app')) route();           // 배너·빈 목록 문구 갱신(입력 중엔 보류)
  });
  var WD=['일','월','화','수','목','금','토'];function p(n){return(n<10?'0':'')+n;}
  function tick(){var c=$('topclock');if(!c)return;var d=new Date();c.textContent=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' ('+WD[d.getDay()]+') '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}

// ── 공통 편의: 토스트 알림 ──
function toast(msg,type){
  var t=$('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.className='show'+(type==='err'?' err':(type==='warn'?' warn':''));
  clearTimeout(window._toastT); window._toastT=setTimeout(function(){ t.className=''; }, type==='err'?3200:1800);
}
// ── 공통 편의: 네비게이션 + 브라우저 뒤로가기 (저장 안 한 변경 이탈 경고 포함) ──
function _leaveGuard(){ if(!_dirty) return Promise.resolve(true);
  return confirmM('저장하지 않은 변경이 있습니다.\n저장하지 않고 이동할까요?',{ok:'이동',danger:true}).then(function(ok){ if(ok)clearDirty(); return ok; }); }
function go(v,id){ _leaveGuard().then(function(ok){ if(!ok)return; _go(v,id); }); }
function _go(v,id){ closeSide(); S.view=v; if(id!==undefined)S.fundId=id; if(v==='fund')S.tab='info'; _pushHist(); route(); }
function goTab(tab){ _leaveGuard().then(function(ok){ if(!ok)return; S.tab=tab; _pushHist(); renderFund(); }); }
function goBack(){ _leaveGuard().then(function(ok){ if(!ok)return; if(history.length>1) history.back(); else _go('home'); }); }
function _pushHist(){ try{ history.pushState({view:S.view,fundId:S.fundId,tab:S.tab,homeTab:S.homeTab}, ''); }catch(e){} }
window.addEventListener('popstate', function(ev){
  // 미저장 변경이 있으면 확인 — 취소 시 원래 화면으로 되돌림(히스토리 복구)
  if(_dirty){
    var back={view:S.view,fundId:S.fundId,tab:S.tab,homeTab:S.homeTab};
    confirmM('저장하지 않은 변경이 있습니다.\n저장하지 않고 이동할까요?',{ok:'이동',danger:true}).then(function(ok){
      if(ok){ clearDirty(); var st2=ev.state||{view:'home'};
        S.view=st2.view||'home'; if(st2.fundId!==undefined)S.fundId=st2.fundId; if(st2.tab)S.tab=st2.tab; if(st2.homeTab)S.homeTab=st2.homeTab; route(); }
      else { try{ history.pushState(back,''); }catch(e){} }   // 머무르기
    });
    return;
  }
  var st=ev.state; if(!st){ S.view='home'; route(); return; }
  S.view=st.view||'home'; if(st.fundId!==undefined)S.fundId=st.fundId; if(st.tab)S.tab=st.tab; if(st.homeTab)S.homeTab=st.homeTab;
  route();
});
function route(){
  // 없어진 메뉴(docsboard/closeboard)로 들어오면 기금 현황의 해당 보기로 돌린다(옛 링크·기록 호환)
  if(S.view==='docsboard'){ S.view='home'; S.homeView='docs'; }
  if(S.view==='closeboard'){ S.view='home'; S.homeView='close'; }
  ['home','billing','forms'].forEach(function(v){var n=$('nav-'+v);if(n)n.className='sitem'+(S.view===v?' on':'');});
  if(S.view!=='fund'&&S.formsHost==='fundDocsHost') S.formsHost=null;   // 기금 밖으로 나가면 임베드 해제
  if(S.view==='fund'&&S.fundId&&funds[S.fundId]) renderFund();
  else if(S.view==='billing') renderBilling();
  else if(S.view==='forms') renderForms();
  else { S.view='home'; renderHome(); }
}

function mgrText(f){

    var subs=(f.mgr_subs||[]).map(function(s){return (s&&s.name)||'';}).filter(Boolean);
    return [main].concat(subs.map(function(n){return n+'(부)';})).filter(Boolean).join(', ')||'—';
  }
  return f.manager||'—';   // 구 데이터 호환
}
function _hasMgrStruct(f){   // 빈 배열([])은 구조화 데이터로 보지 않음 — manager 폴백 유지
  return !!(f.mgr_main&&f.mgr_main.name)||!!(f.mgr_subs&&f.mgr_subs.length);

// 푸른이알피 재직자 명단 — Firebase data/user_accounts/v (pu-erp와 공유). 재직(active)만.
var _staffCache=null;
function _normStaff(v){
  if(!v) return []; if(!Array.isArray(v)) v=Object.keys(v).map(function(k){return v[k];});
  var seen={};
  return v.filter(function(u){return u&&u.sid;})
    .filter(function(u){return !u.status||u.status==='active'||(u.status==='leave'&&u.leaveLoginAllowed===true);})
    .filter(function(u){ if(seen[u.sid])return false; seen[u.sid]=1; return true; })
    .map(function(u){return {sid:u.sid,name:u.name||u.sid,title:u.title||u.role||'',branch:u.branch||''};})
    .sort(function(a,b){return String(a.sid||'').localeCompare(String(b.sid||''),'en',{numeric:true});});  // 푸른이알피 사번 순
}
function loadStaff(){
  // 1) 동일 출처(github.io/pureunall) localStorage — 푸른이알피가 채워둔 재직자, Firebase 규칙 의존 없음.
  //    매번 다시 읽는다 — 다른 탭에서 퇴사 처리 등으로 갱신돼도 이 화면이 낡은 명단을 계속 쓰지 않게(캐시 고정 방지).
  try{ var raw=localStorage.getItem('pureun_v6_user_accounts');
    if(raw){ var a=_normStaff(JSON.parse(raw)); if(a.length){ _staffCache=a; return Promise.resolve(a); } } }catch(e){}
  if(_staffCache&&_staffCache.length) return Promise.resolve(_staffCache);   // localStorage 없을 때만 이전 조회분 재사용(빈 결과는 캐시 안 함)
  // 2) 폴백: Firebase — 일반 직원도 읽을 수 있는 공개 명부 data/user_dir 우선, 실패 시 data/user_accounts
  var rd=function(p){ return fbDb.ref(p).once('value').then(function(s){ return _normStaff(s.val()); }).catch(function(){ return []; }); };
  return rd('data/user_dir/v').then(function(a){ if(a.length){ _staffCache=a; return a; }
    return rd('data/user_dir').then(function(b){ if(b.length){ _staffCache=b; return b; }
      return rd('data/user_accounts/v').then(function(c){ _staffCache=c; return c; }); });
  });
}

  return 'FUND-'+(s.length>=4?s:('0000'+s).slice(-4));   // 9999 초과해도 자릿수 늘려 충돌 방지
}

function createFund(){
  var name=($('nf-name')&&$('nf-name').value.trim())||'';
  if(!name){ toast('기금법인명을 입력하세요','warn'); return; }
  // 로컬 캐시 검사(빠른 차단) — 서버 최종 확인은 아래 _createFundClaim에서 이름 예약으로 한다
  var dupId=Object.keys(funds).filter(function(k){return !isTrashed(funds[k])&&_normName(funds[k].name)===_normName(name);})[0];
  if(dupId){ var df=funds[dupId];
    var where=df.setup_stage==='설립준비'?'설립중':(isPast(df)?(df.lifecycle||'지난'):'운영');
    var loc={'지역공동':'지역기금','개별공동':'공동기금','사내':'사내기금'}[grp(df)]||'';
    toast('이미 있는 기금입니다: '+(df.short_name||df.name)+' ('+loc+'·'+where+') — 등록 취소하고 그 기금을 엽니다','warn');
    closeM(); S.fundId=dupId; S.tab=(df.setup_stage==='설립준비'?'setup':'info'); _go('fund',dupId); S.tab=(df.setup_stage==='설립준비'?'setup':'info'); renderFund();
    return; }
  var type=$('nf-type').value, region=$('nf-region').value.trim();
  var entry=$('nf-entry').value;
  var short=($('nf-short')&&$('nf-short').value.trim())||name.slice(0,12);
  var rec={ name:name, short_name:short, fund_type:type, region:(type==='공동'?region:''),
    entry_mode:entry, created_at:ymd() };
  if(entry==='new') rec.setup_stage='설립준비';   // 신규=설립 진행 표시
  // 담당
  var sel=$('nf-mgr');
  if(sel&&sel.value){ var op=sel.options[sel.selectedIndex]; var nm=op.getAttribute('data-name')||op.text;
    rec.mgr_main={sid:sel.value,name:nm}; rec.manager=nm; }
  else { var tx=$('nf-mgr-text'); if(tx&&tx.value.trim()){ rec.manager=tx.value.trim(); } }
  /* 이름 예약 → ID 선점 두 단계.
     ①`name_locks/{정규화이름}`을 트랜잭션으로 선점해 **두 계정이 같은 이름을 동시에** 만드는 것을 막는다
       (기존엔 로컬 캐시만 봐서 서로 다른 FUND-xxxx로 둘 다 생성됐다).
     ②그다음 빈 ID를 트랜잭션으로 선점. */
  var lockKey=_normName(name).replace(/[.#$/\[\]]/g,'_');
  fbDb.ref(NS+'/name_locks/'+lockKey).transaction(function(cur){ return cur===null?{name:name,at:ymd()}:undefined; },
    function(lerr,lockOk){
      if(lerr){ toast('등록 실패: '+lerr.message,'err'); return; }
      if(!lockOk){ toast('같은 이름의 기금이 방금 등록되었습니다 — 목록을 확인하세요','warn'); closeM(); renderHome(); return; }
      var tryN=0;
      (function claim(fid){
        if(tryN++>50){ fbDb.ref(NS+'/name_locks/'+lockKey).remove(); toast('등록 실패: ID 할당 충돌','err'); return; }
        fbDb.ref(NS+'/funds/'+fid).transaction(function(cur){ return cur===null?rec:undefined; }, function(err,committed){
          if(err){ fbDb.ref(NS+'/name_locks/'+lockKey).remove(); toast('등록 실패: '+err.message,'err'); return; }
          if(!committed){                                    // 이미 그 ID가 있음 → 다음 번호로 재시도
            var m=/^FUND-(\d+)$/.exec(fid), n=m?(+m[1]+1):1, s=String(n);
            claim('FUND-'+(s.length>=4?s:('0000'+s).slice(-4))); return;
          }
          fbDb.ref(NS+'/name_locks/'+lockKey).update({fid:fid});
          funds[fid]=rec; closeM(); S.fundId=fid; S.tab=(entry==='new'?'setup':'info'); _go('fund',fid); S.tab=(entry==='new'?'setup':'info'); renderFund();
          toast('새 기금 등록: '+short+(entry==='new'?' (설립부터)':' (운영부터)'));
        });
      })(nextFundId());
    });
}

function _addrParts(address){
  var a=String(address||'').trim(); if(!a) return null;
  var full=/(\S+?(?:도|특별시|광역시|특별자치시|특별자치도))\s+(\S+?시)\s+(\S+?구)/.exec(a)
        || /(\S+?(?:도|특별시|광역시|특별자치시|특별자치도))\s+(\S+?(?:시|군|구))/.exec(a);
  if(full) return {sido:_SIDO_ABBR[full[1]]||full[1], sgg:full[2], gu:(full[3]||'')};
  var abbrs=Object.keys(_SIDO_ABBR).map(function(k){return _SIDO_ABBR[k];});   // 충남·경기·대전 …
  var m2=/^(\S{2,4})\s+(\S+?시)\s+(\S+?구)/.exec(a) || /^(\S{2,4})\s+(\S+?(?:시|군|구))/.exec(a);
  if(m2 && abbrs.indexOf(m2[1])>=0) return {sido:m2[1], sgg:m2[2], gu:(m2[3]||'')};
  return null;
}
function guessRegistry(address){
  var p=_addrParts(address); if(!p) return '';
  return REGISTRY_MAP[p.sido+' '+p.sgg]||'';
}

/* ══ 기금 기본정보 일괄 가져오기 ══
   로컬 프로그램(fund.db)에서 뽑은 JSON({FUND-0001:{인가번호…}, …})을 한 번에 반영한다.
   · 기본은 **빈 칸만 채움** — 웹에서 직접 입력한 값을 덮지 않는다.
   · 이름·약칭·유형은 신원 필드라 덮어쓰기 모드에서도 채우기만 한다(오인 개명·유형변경 방지).
   · 연도별 데이터(years)·담당(mgr_*)·설립(setup)·계약관계(lifecycle) 등은 아예 손대지 않는다. */
var IMP_FIELDS=['inka_no','inka_date','corp_reg_no','reg_date','registry_office','tax_id_no','tax_office',
  'address','phone','chairman','labor_office','fy_start_md','fy_end_md','region'];
/* status는 일부러 제외 — 로컬(파이썬)판의 status('운영'/'기록보관')는 웹에서 쓰지 않는다.
   웹은 계약관계를 lifecycle('계약종료'/'기록보관')로 따로 관리하므로, status를 넣으면 죽은 값만 쌓인다.
   기록보관 지정은 기금 현황의 [계약관계] 드롭다운으로 사람이 판단해 바꾼다. */
var IMP_IDENTITY=['name','short_name','fund_type'];    // 채우기만(덮어쓰기 제외)
function importFundsInfo(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=function(ev){ var file=ev.target.files&&ev.target.files[0]; if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){
      var data; try{ data=JSON.parse(rd.result); }catch(e){ toast('JSON을 읽지 못했습니다: '+e.message,'err'); return; }
      if(!data||typeof data!=='object'||Array.isArray(data)){ toast('형식이 다릅니다 — {기금ID:{항목…}} 형태여야 합니다','err'); return; }
      _impPreview(data, file.name);
    };
    rd.readAsText(file);
  };
  inp.click();
}
function _impNorm(s){ return String(s==null?'':s).replace(/\s+/g,'').trim(); }
function _impMatch(key, rec){          // ① ID 일치 ② 기금법인명 정확 일치(공백 무시)
  if(funds[key]&&!isTrashed(funds[key])) return key;
  var nm=_impNorm(rec&&rec.name); if(!nm) return '';
  var hit=Object.keys(funds).filter(function(k){ return !isTrashed(funds[k]) && _impNorm(funds[k].name)===nm; });
  return hit.length===1?hit[0]:'';     // 동명이 둘 이상이면 자동 매칭하지 않음(사람이 판단)
}
function _impPlan(data, over){
  var plan=[], unmatched=[], totalCells=0;
  Object.keys(data).forEach(function(key){
    var rec=data[key]||{}, fid=_impMatch(key,rec);
    if(!fid){ unmatched.push(rec.name||key); return; }
    var cur=funds[fid]||{}, set={}, names=[];
    IMP_FIELDS.forEach(function(f){
      var v=rec[f]; if(v==null||String(v).trim()==='') return;
      var has=String(cur[f]==null?'':cur[f]).trim()!=='';
      if(has&&!over) return;                       // 빈 칸만 채움
      if(has&&String(cur[f]).trim()===String(v).trim()) return;   // 동일값은 건너뜀
      set[f]=String(v).trim(); names.push(f);
    });
    IMP_IDENTITY.forEach(function(f){              // 신원 필드는 항상 채우기만
      var v=rec[f]; if(v==null||String(v).trim()==='') return;
      if(String(cur[f]==null?'':cur[f]).trim()!=='') return;
      set[f]=String(v).trim(); names.push(f+'(신규)');
    });
    if(names.length){ plan.push({fid:fid,label:(cur.short_name||cur.name||fid),set:set,names:names}); totalCells+=names.length; }
  });
  return {plan:plan, unmatched:unmatched, cells:totalCells};
}
function _impPreview(data, fname){
  window._impData=data;
  var over=!!S._impOver, r=_impPlan(data,over);
  var LBL={inka_no:'인가번호',inka_date:'인가일',corp_reg_no:'법인등록번호',reg_date:'설립등기일',
    registry_office:'관할등기소',tax_id_no:'고유번호',tax_office:'관할세무서',address:'소재지',phone:'전화',
    chairman:'대표자',labor_office:'관할노동청',fy_start_md:'회계연도시작',fy_end_md:'회계연도종료',region:'지역',status:'상태'};
  var rows=r.plan.slice(0,60).map(function(p){
    return '<tr><td style="font-weight:600;white-space:nowrap">'+esc(p.label)+'</td>'
      +'<td class="muted" style="font-size:11.5px">'+esc(p.names.map(function(n){return LBL[n.replace('(신규)','')]||n;}).join(', '))+'</td>'

function _applyBulkOffice(plan,field,label,clearPlan){

  fbDb.ref(NS+'/funds').once('value').then(function(s){
    var cur=s.val()||{}, updates={}, n=0, skip=0;

      if(String(c[field]||'').trim()){ skip++; return; }    // 그 사이 채워졌으면 건너뜀
      updates[p.id+'/'+field]=p.office; n++; });
    if(!n){ closeM(); toast('채울 대상이 없습니다(이미 입력됨 '+skip+'건)','warn'); return; }

      plan.forEach(function(p){ if(funds[p.id]&&updates[p.id+'/'+field]!==undefined) funds[p.id][field]=p.office; });
      if(clearPlan)clearPlan(); closeM(); renderHome();
      toast(n+'개 '+label+' 채움'+(skip?' · '+skip+'건은 이미 입력돼 건너뜀':'')+' — 확인 필요');

/* ══ 지원금 과거자료 일괄 가져오기 ══
   과거 폴더에서 뽑은 JSON을 한 번에 넣는다(backups/fund_subsidy_import.json).
   · subsidy      : funds/{기금}/years/{연도}/subsidy — 신청액·결정액·지자체출연금·유형·③1인누계

   · chk          : subsidy_chk/{기금}/{연도} — 제출서류 체크(기금 단위·참여사별)
   **빈 칸만 채운다** — 웹에서 이미 입력한 값은 덮지 않는다. */
function importSubsidy(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=function(ev){ var file=ev.target.files&&ev.target.files[0]; if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){
      var d; try{ d=JSON.parse(rd.result); }catch(e){ toast('JSON을 읽지 못했습니다: '+e.message,'err'); return; }
      if(!d||typeof d!=='object'||(!d.subsidy&&!d.site_contrib&&!d.chk)){ toast('형식이 다릅니다 — subsidy/site_contrib/site_years/chk 키가 필요합니다','err'); return; }
      _subImpPreview(d,file.name);
    };
    rd.readAsText(file);
  };
  inp.click();
}
function _subImpPreview(d,fname){
  var SUBK={request_amount:'신청액',decided_amount:'결정액',gov_contrib:'지자체 출연금',req_type:'지원요건',prev_per_worker:'③1인누계',paid_date:'교부일',spent_amount:'집행액'};
  var rows=[], nCell=0, unmatched=[];
  Object.keys(d.subsidy||{}).forEach(function(fid){
    if(!funds[fid]||isTrashed(funds[fid])){ unmatched.push(fid); return; }
    Object.keys(d.subsidy[fid]).forEach(function(yr){
      var cur=((funds[fid].years||{})[yr]||{}).subsidy||{}, src=d.subsidy[fid][yr], items=[];
      Object.keys(src).forEach(function(k){
        if(!SUBK[k]) return;                                       // gov_derived 같은 메타는 제외
        if(String(cur[k]==null?'':cur[k]).trim()!=='') return;      // 이미 있으면 건드리지 않음
        items.push(SUBK[k]); nCell++;
      });
      if(items.length) rows.push([funds[fid].short_name||funds[fid].name, yr+'년 지원금', items.join('·')]);
    });
  });
  var nContrib=0;
  Object.keys(d.site_contrib||{}).forEach(function(fid){
    if(!funds[fid]) return;
    nContrib+=Object.keys(d.site_contrib[fid]).length;
  });
  var nSY=0;
  Object.keys(d.site_years||{}).forEach(function(fid){ if(!funds[fid])return;
    Object.keys(d.site_years[fid]).forEach(function(yr){ nSY+=Object.keys(d.site_years[fid][yr]).length; }); });
  var nChkF=0, nChkS=0, chkRows=[];
  Object.keys(d.chk||{}).forEach(function(fid){ if(!funds[fid])return;
    Object.keys(d.chk[fid]).forEach(function(yr){
      var c=d.chk[fid][yr]||{}, nf=Object.keys(c.fund||{}).length, ns=0;
      Object.keys(c.site||{}).forEach(function(sid){ ns+=Object.keys(c.site[sid]||{}).length; });
      nChkF+=nf; nChkS+=ns;
      chkRows.push([funds[fid].short_name||funds[fid].name, yr+'년 서류', nf+'종 · 참여사 '+ns+'장']);
    });
  });
  var tbl=function(rs){ return rs.length?('<div style="max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px"><table><tbody>'
    +rs.map(function(r){ return '<tr><td style="font-weight:600">'+esc(r[0])+'</td><td class="muted">'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>'; }).join('')
    +'</tbody></table></div>'):'<p class="muted" style="font-size:12px">채울 항목이 없습니다(이미 입력됨).</p>'; };
  window._subImp=d;
  showModal('<div class="row" style="margin:0 0 6px"><h2 style="margin:0">지원금 과거자료 가져오기</h2><span class="chip" style="font-size:10px">'+esc(fname)+'</span></div>'
    +'<p class="muted" style="font-size:12px;margin:0 0 10px"><b>빈 칸만 채웁니다</b> — 이미 입력한 값은 그대로 둡니다.'
    +(unmatched.length?'<br>없는 기금 '+unmatched.length+'건 제외':'')+'</p>'
    +'<div class="row" style="gap:6px;margin-bottom:8px"><span class="stat">지원금 '+nCell+'칸</span><span class="stat">기본 출연금 '+nContrib+'개사</span>'
    +'<span class="stat">연도별 출연금 '+nSY+'건</span><span class="stat">서류체크 '+(nChkF+nChkS)+'건</span></div>'
    +'<h3 style="font-size:12.5px;margin:8px 0 4px">지원금 신청·결정</h3>'+tbl(rows)
    +'<h3 style="font-size:12.5px;margin:10px 0 4px">제출서류 체크</h3>'+tbl(chkRows)
    +'<div class="row" style="justify-content:flex-end;margin-top:14px"><button onclick="closeM()">취소</button>'
    +'<button class="primary" onclick="_subImpApply()">가져오기</button></div>');
}
function _subImpApply(){
  var d=window._subImp; if(!d){ closeM(); return; }
  /* 사업장 출연금은 로컬 캐시에 없으니 서버 현재값을 먼저 읽어 **빈 칸만** 채운다.
     이 확인을 빼면 손으로 넣어 둔 출연금을 과거 자료가 덮어써 버린다. */
  toast('현재 값 확인 중…');
  Promise.all([fbDb.ref(NS+'/sites').once('value'), fbDb.ref(NS+'/site_years').once('value')])
    .then(function(r){ _subImpApply2(d, r[0].val()||{}, r[1].val()||{}); })
    .catch(function(e){ toast('현재 값을 읽지 못했습니다: '+e.message,'err'); });
}
function _subImpApply2(d,curSites,curSY){
  var up={}, n=0, skip=0;
  // ① 지원금 연도값 — 빈 칸만
  var OKK={request_amount:1,decided_amount:1,gov_contrib:1,req_type:1,prev_per_worker:1,paid_date:1,spent_amount:1};
  Object.keys(d.subsidy||{}).forEach(function(fid){
    if(!funds[fid]||isTrashed(funds[fid])) return;
    Object.keys(d.subsidy[fid]).forEach(function(yr){
      var cur=((funds[fid].years||{})[yr]||{}).subsidy||{}, src=d.subsidy[fid][yr];
      Object.keys(src).forEach(function(k){
        if(!OKK[k]) return;
        if(String(cur[k]==null?'':cur[k]).trim()!=='') return;
        up['funds/'+fid+'/years/'+yr+'/subsidy/'+k]=src[k]; n++;
      });
    });
  });
  // ② 사업장 기본 출연금 — 그 사업장이 실제로 있고 값이 비어 있을 때만
  Object.keys(d.site_contrib||{}).forEach(function(fid){
    if(!funds[fid]||isTrashed(funds[fid])) return;
    Object.keys(d.site_contrib[fid]).forEach(function(sid){
      var cs=(curSites[fid]||{})[sid];
      if(!cs){ skip++; return; }                                       // 없는 사업장이면 만들지 않는다
      if(String(cs.contrib==null?'':cs.contrib).trim()!==''){ skip++; return; }
      up['sites/'+fid+'/'+sid+'/contrib']=d.site_contrib[fid][sid]; n++;
    });
  });
  // ③ 연도별 출연금 — 같은 기준(빈 칸만)
  Object.keys(d.site_years||{}).forEach(function(fid){
    if(!funds[fid]||isTrashed(funds[fid])) return;
    Object.keys(d.site_years[fid]).forEach(function(yr){
      Object.keys(d.site_years[fid][yr]).forEach(function(sid){
        if(!(curSites[fid]||{})[sid]){ skip++; return; }
        var v=d.site_years[fid][yr][sid]||{}, cur=((curSY[fid]||{})[yr]||{})[sid]||{};
        Object.keys(v).forEach(function(k){
          if(num(cur[k])){ skip++; return; }
          up['site_years/'+fid+'/'+yr+'/'+sid+'/'+k]=v[k]; n++;
        });
      });
    });
  });
  // ④ 제출서류 체크
  Object.keys(d.chk||{}).forEach(function(fid){
    if(!funds[fid]||isTrashed(funds[fid])) return;
    Object.keys(d.chk[fid]).forEach(function(yr){
      var c=d.chk[fid][yr]||{};
      Object.keys(c.fund||{}).forEach(function(k){ up['subsidy_chk/'+fid+'/'+yr+'/fund/'+k]=1; n++; });
      Object.keys(c.site||{}).forEach(function(sid){
        Object.keys(c.site[sid]||{}).forEach(function(k){ up['subsidy_chk/'+fid+'/'+yr+'/site/'+sid+'/'+k]=1; n++; });
      });
    });
  });
  if(!n){ closeM(); toast('반영할 항목이 없습니다','warn'); return; }
  fbDb.ref(NS).update(up).then(function(){
    // 로컬 캐시 반영 — funds의 연도값만(사업장·체크는 다음 화면 진입 때 다시 읽는다)
    Object.keys(d.subsidy||{}).forEach(function(fid){ var t=funds[fid]; if(!t)return;
      Object.keys(d.subsidy[fid]).forEach(function(yr){
        if(!t.years)t.years={}; if(!t.years[yr])t.years[yr]={};
        var cur=t.years[yr].subsidy||{}, src=d.subsidy[fid][yr], merged=Object.assign({},cur);
        Object.keys(src).forEach(function(k){ if(OKK[k]&&String(cur[k]==null?'':cur[k]).trim()==='') merged[k]=src[k]; });
        t.years[yr].subsidy=merged;
      });
    });
    S.sitesFor=null; S.syFor=null; S.subChkFor=null; window._subImp=null;
    closeM(); renderHome(); toast(n+'건 반영 완료'+(skip?' · '+skip+'건은 이미 입력돼 건너뜀':''));
  }).catch(function(e){ toast('반영 실패: '+e.message,'err'); });
}

// ── 청구 관리 (4단계) ──
/* ══ 푸른이알피(pu-erp) 기금 청구 연동 ══
   원본은 푸른이알피 소유 — 여기서는 **읽기만** 한다(쓰면 사무관리 원장이 깨진다).
   · data/funds/v          : 기금 계약(계약금 contractFee/contractPaid, 잔금 balanceFee/balancePaid)
   · data/finance_income/v : 입금 확정 매출 중 sourceKind==='fund'
   미입금은 계약 쪽 플래그로, 입금완료는 매출 기록으로 잡는다(푸른이알피 입금관리와 같은 기준 → 이중계상 없음).
   연결 보정값만 우리 네임스페이스 fund_erp/puerp_link 에 저장한다. */
var _peCache=null;
function _peNorm(v){ if(!v) return []; if(!Array.isArray(v)) v=Object.keys(v).map(function(k){return v[k];}); return v.filter(Boolean); }
function _peLocal(key){ try{ return _peNorm(JSON.parse(localStorage.getItem('pureun_v6_'+key)||'null')); }catch(e){ return []; } }
function _peRead(key){   // ① Firebase(최신) ② 같은 출처 localStorage(푸른이알피가 채워둔 값) 폴백
  return fbDb.ref('data/'+key+'/v').once('value').then(function(s){
    var a=_peNorm(s.val()); return a.length?a:_peLocal(key);
  }).catch(function(){ return _peLocal(key); });
}
/* 매출 원장(finance_income)은 법인 전체 기록이라 통째로 받으면 폰에서 무겁다.
   sourceKind='fund'만 서버에서 걸러 받고, 실패하면 전체 읽기로 물러난다.
   (규칙에 .indexOn:"sourceKind"가 없으면 콘솔 경고만 나고 동작은 한다) */
function _peReadIncome(){
  return fbDb.ref('data/finance_income/v').orderByChild('sourceKind').equalTo('fund').once('value')
    .then(function(s){ var a=_peNorm(s.val()); return a.length?a:_peRead('finance_income'); })
    .catch(function(){ return _peRead('finance_income'); });
}
function loadPuerp(force){
  if(_peCache&&!force) return Promise.resolve(_peCache);
  return Promise.all([_peRead('funds'),_peReadIncome(),
      fbDb.ref(NS+'/puerp_link').once('value').then(function(s){return s.val()||{};}).catch(function(){return {};})
    ]).then(function(r){
    _peCache={ projects:r[0].filter(function(x){return x&&x.id&&!x._deleted;}),
               income:r[1].filter(function(x){return x&&x.sourceKind==='fund'&&!x._deleted;}),
               link:r[2] };
    return _peCache; });
}
// 기금명 비교용 정규화 — 법인 표기·'근로복지기금' 같은 공통어를 걷어낸다
function _mkey(s){ return String(s||'').replace(/\(주\)|㈜|주식회사|사단법인|재단법인|유한회사/g,'')
  .replace(/공동근로복지기금|사내근로복지기금|근로복지기금/g,'').replace(/[\s\-·_()\[\]]/g,'').toLowerCase(); }
function _dg10(s){ return String(s||'').replace(/\D/g,''); }
/* pu-erp 기금 계약 1건 → fund_erp 기금 id. ①수동 지정 ②사업자번호 ③기금명 완전일치 ④부분일치(후보 1개일 때만) */
function linkPuerp(p,link){
  var man=(link||{})[p.id]; if(man) return man==='__none__'?null:(funds[man]?man:null);
  var ids=Object.keys(funds).filter(function(k){return !isTrashed(funds[k]);});
  // 기금은 사업자등록번호가 아니라 **고유번호(tax_id_no)**로 계산서를 받는다(법인등록번호도 대비).
  var bz=_dg10(p.bizNo);
  if(bz.length>=10){
    var h=ids.filter(function(k){ var f=funds[k];
      return _dg10(f.tax_id_no)===bz||_dg10(f.biz_no)===bz||_dg10(f.corp_reg_no)===bz; })[0];
    if(h) return h; }
  var pk=_mkey(p.companyName||p.name); if(pk.length<2) return null;
  var exact=ids.filter(function(k){ return _mkey(funds[k].name)===pk||_mkey(funds[k].short_name)===pk; })[0];
  if(exact) return exact;
  var part=ids.filter(function(k){ var a=_mkey(funds[k].name),b=_mkey(funds[k].short_name);
    return (a&&a.length>1&&(a.indexOf(pk)>=0||pk.indexOf(a)>=0))||(b&&b.length>1&&(b.indexOf(pk)>=0||pk.indexOf(b)>=0)); });
  return part.length===1?part[0]:null;   // 후보가 둘 이상이면 자동 연결하지 않고 사용자에게 맡긴다
}
/* 청구 항목 도출 — 대기(계약 미입금) + 완료(확정 매출) */
function puerpRows(pe){
  var byId={}; pe.projects.forEach(function(p){ byId[p.id]=p; });
  var wait=[], done=[];
  pe.projects.forEach(function(p){
    var fid=linkPuerp(p,pe.link);
    [['계약금',p.contractFee,p.contractPaid,p.contractDate],
     ['잔금',  p.balanceFee, p.balancePaid, p.startDate]].forEach(function(c){
      if(!(num(c[1])>0)||c[2]) return;                      // 금액 없거나 이미 입금확정 → 대기 아님
      wait.push({pid:p.id,fund_id:fid,no:p.no||'',company:p.companyName||'',bizNo:p.bizNo||'',
        item:c[0],amount:num(c[1]),date:c[3]||'',mgr:p.managerMain||p.mgrMain||'',pstatus:p.status||''});
    });
  });
  pe.income.forEach(function(x){
    var p=byId[x.sourceId];
    done.push({pid:x.sourceId||'',iid:x.id,fund_id:p?linkPuerp(p,pe.link):null,no:(p&&p.no)||'',
      company:x.companyName||(p&&p.companyName)||'',bizNo:(p&&p.bizNo)||'',
      item:x.kind||'기금수수료',amount:num(x.amount),paid_date:x.date||'',
      vat:x.vatIncluded?'포함':'별도',mgr:x.managerName||''});
  });
  wait.sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  done.sort(function(a,b){return (b.paid_date||'').localeCompare(a.paid_date||'');});
  return {wait:wait,done:done};
}

// PDF → 좌표 정렬 텍스트. 텍스트 레이어가 없으면 '' 반환(=스캔 이미지)
function pdfText(buf){
  if(typeof pdfjsLib==='undefined') return Promise.reject(new Error('PDF 라이브러리 로드 실패 — 새로고침하세요'));
  try{ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}
  return pdfjsLib.getDocument({data:buf}).promise.then(function(doc){
    var n=Math.min(doc.numPages,5), jobs=[];
    for(var i=1;i<=n;i++) jobs.push(doc.getPage(i).then(function(pg){ return pg.getTextContent(); }));
    var fin=function(){ try{ doc.destroy(); }catch(e){} };   // PDF worker 자원 반납
    return Promise.all(jobs).then(function(r){ fin(); return r; },function(e){ fin(); throw e; }).then(function(cs){
      return cs.map(function(c){
        var items=c.items.filter(function(it){return (it.str||'').trim();})
          .map(function(it){ return {s:it.str, x:it.transform[4], y:it.transform[5]}; });
        items.sort(function(a,b){ var dy=b.y-a.y; if(Math.abs(dy)>3) return dy; return a.x-b.x; });  // 위→아래, 좌→우
        var out='',lastY=null;
        items.forEach(function(it){ if(lastY!==null&&Math.abs(it.y-lastY)>3) out+='\n'; out+=it.s+' '; lastY=it.y; });
        return out;
      }).join('\n');
    });
  });
}

function parseInka(txt){

  if(ds&&ds.length){ var p=ds[ds.length-1].match(/(20\d{2})\D+(\d{1,2})\D+(\d{1,2})/);
    if(p) o.inka_date=p[1]+'-'+('0'+p[2]).slice(-2)+'-'+('0'+p[3]).slice(-2); }
  m=flat.match(/대표자\s*성명\s*:?\s*([가-힣]{2,5})/);

     실제 예: "1. 기금법인 명칭: 충남공동근로복지기금8호 충청남도 당진시 … (송악읍 2. 주사무소 소재지: 한진리) 3. 대표자 …"
     → ① 명칭~대표자 구간을 잘라 ② 소재지 라벨만 지우고 ③ 주소 시작(시·도+시/군/구)에서 이름/주소를 가른다. */
  var seg=flat.match(/기금법인\s*명칭\s*:?\s*(.*?)(?=\d\s*\.\s*대표자|대표자\s*성명|$)/);
  if(seg){
    var s=seg[1].replace(/\d\s*\.\s*주사무소\s*소재지\s*:?/g,' ').replace(/\s+/g,' ').trim();
    var SIDO='서울특별시|부산광역시|대구광역시|인천광역시|광주광역시|대전광역시|울산광역시|세종특별자치시'

    var re=new RegExp('(?:'+SIDO+')[가-힣]{0,4}\\s*[가-힣]{2,7}(?:시|군|구)(?![가-힣])','g'), mm, last=-1;
    while((mm=re.exec(s))) last=mm.index;          // 이름에도 '충남' 등이 있으므로 마지막 매치를 주소 시작으로
    if(last>0){

      var nm=_cleanName(s.slice(0,last).replace(/기금호(\d+)/,'기금$1호'));   // "기금호1"→"기금1호"(순서 뒤바뀜 보정)

  if(m){ var ad=_cleanAddr(m[1]); if(ad) o.address=ad; }

/* OCR 잡음 정리 — 깨진 라틴문자·기호 덩어리를 걷어낸다 */
function _cleanName(s){
  var t=String(s||'').replace(/[^가-힣0-9()·\s]/g,' ').replace(/\s+/g,'').trim();
  var m=t.match(/^(.*?기금\d*호?)/);                 // '…기금[N호]'까지만
  return m?m[1]:(t.length<=30?t:'');
}
function _cleanAddr(s){
  var t=String(s||'').replace(/[^가-힣0-9()~,\-\s]/g,' ').replace(/\s+/g,' ').trim();
  t=t.replace(/\s*발\s*(?:급)?\s*사?\s*유.*$/,'').trim();      // '발급사유 신규' 꼬리 제거
  return t.length>=6&&t.length<=100?t:'';
}

/* ═══════════ 스캔 문서 OCR (tesseract.js) ═══════════
   스캔본은 글자가 없어 그림을 글자로 바꿔야 한다. 첫 사용 때만 엔진·한국어 데이터를 내려받는다(약 15MB).
   전처리(3배 확대 + 흑백 2치화)가 정확도를 크게 좌우한다 — 등기부의 노란 보안무늬가 사라져야 숫자가 읽힌다.
   실측: 고유번호증·인가증 스캔은 핵심 항목이 정확히 읽히고, 등기부는 날짜는 읽히나 법인등록번호는 자주 실패. */
var OCR_CDN='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
var _ocrLoad=null;
function ocrReady(){
  if(typeof Tesseract!=='undefined') return Promise.resolve();
  if(_ocrLoad) return _ocrLoad;
  _ocrLoad=new Promise(function(res,rej){
    var s=document.createElement('script'); s.src=OCR_CDN;
    s.onload=function(){res();}; s.onerror=function(){ _ocrLoad=null; rej(new Error('OCR 엔진을 내려받지 못했습니다(인터넷 확인)')); };
    document.head.appendChild(s);
  });
  return _ocrLoad;
}
// 캔버스 흑백 2치화 — 보안무늬·배경색 제거
function _binarize(cv,thr){
  thr=thr||170;
  var g=cv.getContext('2d'), im=g.getImageData(0,0,cv.width,cv.height), d=im.data;
  for(var i=0;i<d.length;i+=4){
    var v=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)>thr?255:0;
    d[i]=d[i+1]=d[i+2]=v;
  }
  g.putImageData(im,0,0); return cv;
}
// PDF 첫 N쪽 → 2치화 캔버스 배열
function pdfPageCanvases(buf,maxPages){
  return pdfjsLib.getDocument({data:buf}).promise.then(function(doc){
    var n=Math.min(doc.numPages,maxPages||2), jobs=[];
    for(var i=1;i<=n;i++) jobs.push(doc.getPage(i).then(function(pg){
      var vp=pg.getViewport({scale:3});                 // 3배 ≈ 216dpi
      var cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
      return pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise.then(function(){ return _binarize(cv); });
    }));
    var fin=function(){ try{ doc.destroy(); }catch(e){} };
    return Promise.all(jobs).then(function(r){ fin(); return r; },function(e){ fin(); throw e; });
  });
}
// 이미지 파일 → 2치화 캔버스
function imgCanvas(file){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      // 큰 사진은 2200px로 줄이고(메모리·속도), 작은 사진만 1.6배 확대(OCR 인식률)
      var W=img.width||1, k=W>2200?(2200/W):(W<1400?1.6:1);
      var w=Math.max(1,Math.round(W*k)), h=Math.max(1,Math.round((img.height||1)*k));
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url); res(_binarize(cv));
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('이미지를 열 수 없습니다')); };
    img.src=url;
  });
}
// 캔버스들 OCR → 합친 텍스트
function ocrCanvases(cvs,onStat){
  return ocrReady().then(function(){
    onStat&&onStat('OCR 엔진 준비 중…');
    return Tesseract.createWorker('kor+eng',1,{logger:function(m){
      if(m.status==='recognizing text') onStat&&onStat('글자 인식 중 '+Math.round((m.progress||0)*100)+'%');
      else if(/download|load/i.test(m.status||'')) onStat&&onStat('한국어 데이터 내려받는 중… (최초 1회)');
    }});
  }).then(function(w){
    var texts=[];
    // 실패해도 worker를 반드시 종료한다(WASM 메모리 누수 방지)
    var fin=function(){ return Promise.resolve(w.terminate()).catch(function(){}); };
    return cvs.reduce(function(p,cv,i){
      return p.then(function(){ onStat&&onStat((i+1)+'/'+cvs.length+'쪽 인식 중…');
        return w.recognize(cv).then(function(r){ texts.push((r.data&&r.data.text)||''); }); });
    },Promise.resolve())
      .then(function(){ return fin().then(function(){ return texts.join('\n'); }); },
            function(err){ return fin().then(function(){ throw err; }); });
  });
}

function idbOpen(){ return new Promise(function(res,rej){ var r=indexedDB.open(IDB_DB,1);

function idbPut(k,v){ return idbOpen().then(function(db){ return new Promise(function(res,rej){
  var tx=db.transaction(IDB_ST,'readwrite'); tx.objectStore(IDB_ST).put(v,k);
  tx.oncomplete=function(){res();}; tx.onerror=function(){rej(tx.error);}; }); }); }
function idbGet(k){ return idbOpen().then(function(db){ return new Promise(function(res,rej){

// 여러 .hwp를 파일명으로 서식에 자동 매칭해 일괄 등록
function pickHwpBulk(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='.hwp,.hwpx'; inp.multiple=true;
  inp.onchange=function(ev){ var files=Array.prototype.slice.call(ev.target.files||[]); if(!files.length)return;
    // 파일명 → 서식 자동 매칭. 구체적인 규칙을 앞에 둬야 함(예: '기금사용내용' 회의록이 '준비위 회의록'으로 가지 않게)
    var RULES=[['reg_sealpaper',['인감대지','대지']],['reg_sealcard',['인감카드','카드']],['reg_seal',['인감']],
      ['reg_roster',['협의회명부','명부']],['reg_apply',['설립등기','등기신청','특수법인']],['reg_accept',['취임','승낙']],
      ['reg_license',['등록면허','면허세']],['reg_proxy',['위임장']],
      ['tax_bizreg',['법인설립신고','사업자등록신청']],['tax_sublease',['전대']],['tax_lease',['임대차']],['tax_hometax',['홈텍스','홈택스']],
      ['sub_required',['필요서류']],['sub_checklist',['체크리스트','자율점검']],['sub_oath',['서약']],
      ['sub_welfare_plan',['복지사업계획']],['sub_assets',['재산목록']],['sub_payment',['지급신청']],
      ['subsidy',['지원신청서','지원금지원신청','기금지원신청']],['incent_cost',['비용청구','11호의2']],
      ['ops_asset_change',['재산변동']],
      ['ops_minutes_scope',['사용범위']],['ops_minutes_use',['기금사용내용','사용내용']],
      ['inka',['인가신청']],['agreement',['합의']],
      ['charter',['정관']],['minutes',['준비위','회의록']],['contrib',['출연']],['bizplan',['사업계획']]];
    var used={}, plan=[];
    files.forEach(function(f){ var n=f.name, hit=null;
      for(var i=0;i<RULES.length;i++){ var k=RULES[i][0]; if(used[k])continue;
        var ok = (k==='reg_seal') ? (n.indexOf('인감')>=0&&n.indexOf('신고')>=0) : RULES[i][1].some(function(w){return n.indexOf(w)>=0;});
        if(ok){ hit=k; break; } }
      if(hit){ used[hit]=1; plan.push([hit,f]); } else plan.push([null,f]); });
    var matched=plan.filter(function(p){return p[0];});
    if(!matched.length){ toast('파일명에서 서식을 못 알아냈어요 — 서식별 [등록]으로 개별 등록하세요','warn'); return; }
    Promise.all(matched.map(function(p){ return new Promise(function(res){ var rd=new FileReader();
      rd.onload=function(){ idbPut('hwp:'+p[0],rd.result).then(function(){res(true);}).catch(function(){res(false);}); };
      rd.onerror=function(){res(false);}; rd.readAsArrayBuffer(p[1]); }); }))
      .then(function(oks){ S._hwpChk=false; _formsRerender();
        var okN=oks.filter(Boolean).length, failN=oks.length-okN;      // 실제 저장 성공분만 집계
        var un=plan.filter(function(p){return !p[0];}).map(function(p){return p[1].name;});
        if(!okN){ toast('저장 실패 — 브라우저 저장공간(IndexedDB)을 확인하세요','err'); return; }
        toast(okN+'개 자동 등록'+(failN?' · 실패 '+failN+'개':'')+(un.length?' · 미매칭 '+un.length+'개는 개별 등록':''), failN?'warn':''); }); };
  inp.click();
}

function _a4Page(no){

/* 표가 한 장에 안 들어가면 행 단위로 자른다.
   이 장에 들어갈 만큼만 남기고, 나머지 행을 담은 같은 모양의 표를 돌려준다(다음 장에서 이어짐).
   머리행(thead)이 있으면 이어지는 장에도 복사해 붙여 표가 무슨 표인지 알 수 있게 한다.
   한 행조차 안 들어가면 되돌리고 null — 부르는 쪽이 통째로 다음 장으로 넘긴다. */
function _splitTableToFit(tbl,body,limit){
  var rows=[];
  Array.prototype.forEach.call(tbl.rows,function(r){ if(r.closest('table')===tbl) rows.push({r:r,p:r.parentNode}); });
  var head=tbl.querySelector(':scope > thead');
  var movable=rows.filter(function(x){ return !head||x.p!==head; });        // 머리행은 남긴다
  if(movable.length<2) return null;
  var moved=[];
  while(movable.length>1 && body.scrollHeight>limit){                       // 최소 한 행은 남긴다
    var last=movable.pop(); last.r.remove(); moved.unshift(last);
  }
  if(!moved.length) return null;
  if(body.scrollHeight>limit){                                              // 그래도 안 들어감 → 원복
    moved.forEach(function(x){ x.p.appendChild(x.r); });
    return null;
  }
  var rest=tbl.cloneNode(false);                                            // 테두리·너비 등 표 속성 유지
  /* 열 폭 정의(colgroup)를 이어지는 표에도 복사한다. shallow clone은 자식을 안 가져오므로
     이걸 빼면 다음 쪽 표가 열 폭을 잃고 균등분할돼, 쪽마다 칸 폭이 달라지고
     좁은 칸의 글자가 칸을 넘쳐 표가 본문 폭을 벗어난다(사업자등록신청서 66열 실측). */
  var cg=tbl.querySelector(':scope > colgroup');
  if(cg) rest.appendChild(cg.cloneNode(true));
  if(head) rest.appendChild(head.cloneNode(true));                          // 머리행 반복
  var tb=document.createElement('tbody'); rest.appendChild(tb);
  moved.forEach(function(x){ tb.appendChild(x.r); });
  return rest;
}
function paginateDoc(rawHTML){
  var ed=$('doced'); if(!ed) return;
  var holder=document.createElement('div'); holder.innerHTML=rawHTML||'';
  // 이전에 붙인 쪽수·넘침배지 제거 — 저장본을 다시 열 때 쪽수가 겹치는 것 방지
  Array.prototype.forEach.call(holder.querySelectorAll('.a4f,.a4of'),function(x){ x.remove(); });
  // .a4b(본문 껍데기)는 벗겨서 내용만 남긴다 — 저장본은 이미 감싸져 있다
  Array.prototype.forEach.call(holder.querySelectorAll('.a4b'),function(b){
    while(b.firstChild) b.parentNode.insertBefore(b.firstChild,b);
    b.remove();
  });
  // 이미 .a4로 감싼 입력(전체 초안 등)은 장 단위가 정해져 있으니 각 장 안에서만 다시 나눈다
  var groups=holder.querySelectorAll(':scope > .a4');
  var blocks=[];
  if(groups.length) Array.prototype.forEach.call(groups,function(g){ blocks.push(Array.prototype.slice.call(g.childNodes)); });
  else blocks.push(Array.prototype.slice.call(holder.childNodes));

  ed.innerHTML='<style>'+dgDocCssIn()+'</style>';
  var no=0, pages=[];
  blocks.forEach(function(nodes){
    no++; var page=_a4Page(no); ed.appendChild(page); pages.push(page);
    var body=page.querySelector('.a4b'), limit=body.clientHeight;
    var queue=nodes.slice(), guard=0;
    while(queue.length && ++guard<4000){
      var nd=queue.shift();
      if(nd.nodeType===3 && !String(nd.nodeValue||'').trim()) continue;    // 공백 텍스트 무시
      body.appendChild(nd);
      if(!(limit>0 && body.scrollHeight>limit)) continue;                  // 들어갔다
      // 넘쳤다 → ① 표면 행 단위로 잘라 이 장을 채우고 남은 행은 다음 장으로
      var rest=(nd.nodeType===1&&nd.tagName==='TABLE')?_splitTableToFit(nd,body,limit):null;
      if(rest){ queue.unshift(rest); }
      else if(body.childNodes.length>1){ body.removeChild(nd); queue.unshift(nd); }   // ② 통째로 다음 장
      else if(!queue.length){ continue; }                                  // ③ 혼자서도 안 들어감(마지막) → 그 장에 두고 넘침 표시
      no++; page=_a4Page(no); ed.appendChild(page); pages.push(page);      // 다음 장 준비
      body=page.querySelector('.a4b'); limit=body.clientHeight;
    }
    // 내용이 하나도 안 담긴 빈 장은 버린다(앞 장이 꽉 차서 만들어진 뒤 남은 게 없을 때)
    var last=pages[pages.length-1], lb=last&&last.querySelector('.a4b');
    if(lb && !lb.childNodes.length && pages.length>1){ last.remove(); pages.pop(); no--; }
  });
  // 총 쪽수 표기 + 넘침 검사
  pages.forEach(function(p,i){
    var f=p.querySelector('.a4f'); if(f) f.textContent='- '+(i+1)+' / '+pages.length+' -';
  });
  markA4Overflow();
  return pages.length;
}
/* 편집으로 내용이 장을 넘쳤는지 표시 */
function markA4Overflow(){
  var ed=$('doced'); if(!ed) return 0; var n=0;
  Array.prototype.forEach.call(ed.querySelectorAll('.a4'),function(p){
    var b=p.querySelector('.a4b'); if(!b) return;
    var old=p.querySelector('.a4of'); if(old) old.remove();
    var over=b.scrollHeight>b.clientHeight+2;
    p.classList.toggle('of',over);
    if(over){ n++;
      var t=document.createElement('div'); t.className='a4of'; t.setAttribute('contenteditable','false');
      t.textContent='이 쪽을 넘칩니다 — [다시 나누기]'; p.appendChild(t); }
  });
  var w=$('a4Warn'); if(w) w.style.display=n?'':'none';
  return n;
}
function repaginateDoc(){

/* 미리보기 배율 — 패널 폭에 맞춰 A4 한 장이 가로로 다 들어오게. S.docZoom='fit'|1 */
function fitDocA4(){
  var w=$('docwrap'), ed=$('doced'), st=$('docstage'); if(!w||!ed) return;
  var page=ed.querySelector('.a4'); if(!page) return;
  // 배율을 걷어낸 상태에서 실측(A4 210mm ≈ 794px) → 패널 폭에 맞는 배율 산출
  ed.style.transform='none';
  var pw=page.offsetWidth||794, ph=ed.scrollHeight||0;
  var avail=Math.max(80,w.clientWidth-28);
  var k=(S.docZoom===1)?1:Math.min(1,avail/pw);
  if(!(k>0.2)) k=0.2;
  ed._k=k;
  if(k!==1) ed.style.transform='scale('+k.toFixed(4)+')';
  if(st){                                  // 축소한 만큼만 자리를 차지하게(가로 스크롤 방지)
    st.style.height=Math.ceil(ph*k)+'px';
    st.style.overflow=(k===1?'visible':'hidden');
  }
  var z=$('docZoomLbl'); if(z) z.textContent=Math.round(k*100)+'%';
}
function toggleDocZoom(){ S.docZoom=(S.docZoom===1)?'fit':1; fitDocA4(); }

/* ── 정렬 도구 ──

function docAlignBar(){

    +b('outdent','◀','내어쓰기')+b('indent','▶','들여쓰기')+'</span>';

function docAlign(cmd){
  var ed=$('doced'); if(!ed) return;

  if(!sel||!sel.rangeCount||!ed.contains(sel.anchorNode)){ toast('문서에서 정렬할 줄을 먼저 클릭하세요','warn'); return; }
  ed.focus();
  try{
    document.execCommand('styleWithCSS',false,true);   // <font>·<blockquote> 대신 style로 — 저장·인쇄에서 그대로 살아난다

}

// 저장된 서식 HTML 살균 — 스크립트·이벤트핸들러·위험 URL 제거(저장형 XSS 차단)
function sanitizeDocHTML(html){
  var s=String(html||'');
  s=s.replace(/<style[\s\S]*?<\/style>/gi,'')          // 전역 style 유출 차단
     .replace(/<script[\s\S]*?<\/script>/gi,'')
     .replace(/<\/?(iframe|object|embed|link|meta|form|base)\b[^>]*>/gi,'');
  var box=document.createElement('div'); box.innerHTML=s;
  var all=box.querySelectorAll('*');
  for(var i=0;i<all.length;i++){ var el=all[i];
    for(var j=el.attributes.length-1;j>=0;j--){ var a=el.attributes[j], n=a.name.toLowerCase(), v=String(a.value||'');
      if(n.indexOf('on')===0) el.removeAttribute(a.name);                                  // onerror/onclick 등
      else if((n==='href'||n==='src'||n==='xlink:href')&&/^\s*(javascript|data(?!:image\/(png|jpe?g|gif|webp|svg\+xml);)|vbscript):/i.test(v)) el.removeAttribute(a.name);
      else if(n==='style'&&/expression\s*\(|javascript:/i.test(v)) el.removeAttribute(a.name);
    }
  }
  _docTypeset(box);            // 한글 원문 정렬(공백·들여쓰기) 살리기
  return box.innerHTML;
}
/* ── 한글 문서 정렬 살리기 ──
   HWP에서 옮겨온 글은 공백·탭으로 칸을 맞춰 놓는데, HTML은 연속 공백을 한 칸으로 합쳐서
   전부 왼쪽으로 몰려 보인다. ① 연속 공백·탭을 그대로 유지(&nbsp;)하고
   ② 「1. 」·「○ 」처럼 표식으로 시작하는 줄은 되돌아가는 줄까지 표식 뒤에 맞춘다(내어쓰기).
   여러 줄이 <br>로 묶인 단락은 손대지 않는다 — 둘째 줄부터 어긋나기 때문. */
var DG_MARK=/^\s*(?:[○◦ㆍ·▫□■▶※]|[-–]\s|[0-9]{1,2}[.)]|[가-힣][.)]|[ⅠⅡⅢⅣⅤⅥ][.)]|[①-⑳])\s*\S/;
var DG_BULLET=/^\s*(?:[○◦ㆍ·▫□■▶]|[-–]\s)/;
/* ══════════ 서식 A4 조판 ══════════
   .hwp에서 옮긴 서식(fund_forms.js)은 줄이 <br>로 뭉쳐 있거나 문단만 나뉘어 있어
   제목·날짜·서명·수신이 전부 왼쪽으로 붙는다. 줄의 성격을 가려 관보 서식처럼
   가운데·오른쪽·2열로 앉히고, 정관은 조–항–호–목 단계로 들여쓴다.
   · **class가 이미 있는 요소는 건드리지 않는다** — 코드로 생성한 서식(docBody)은
     h1/center/right/sign을 직접 지정하므로, 그것을 다시 분류하면 오히려 어긋난다.
   · 표 안(<td>)은 원본 격자를 그대로 둔다.
   · 여러 번 실행해도 결과가 같다(멱등) — 저장본을 다시 열어도 어긋나지 않는다. */
var FM_TITLE=/(합의서|확인서|승낙서|서약서|위임장|정관|신청서|보고서|회의록|명부|대지|계약서|동의서|점검표|체크리스트|사업계획서|재산목록|목록표|명세서|신고서|보증서면|필요서류|양식|서식)[\)\]〕』」]*\s*$/;
/* 자간 벌린 제목: '기 금 출 연 확 인 서', '서 약 서'.
   글자마다 공백을 넣은 모양이면서 **공백을 걷어낸 말이 서식명일 때만** 제목으로 본다.
   ('성 명 :'처럼 글자 사이가 벌어짐을 뿐인 라범을 제목으로 오인하지 않게) */
var FM_SPACED=/^(\S[ \u00a0]){2,}\S/;
var FM_DATE=/^(서기\s*)?(20\d{2}|20)\s*[년.]/;
var FM_DATE2=/^\d{4}\s*\.\s*\d{0,2}\s*\.\s*\d{0,2}\s*\.?$/;
var FM_TO=/(귀하|귀중)\s*$/;
var FM_SIGN=/\(\s*인\s*\)|（인）|개인인감|법인인감|서명\s*또는\s*인/;
var FM_JO=/^\s*제\s*\d+\s*조/;
var FM_HANG=/^\s*[①-⑳]/;                                        // 항
var FM_HO=/^\s*\d{1,2}\s*[.)]\s/;                                // 호
var FM_MOK=/^\s*[가-힣]\s*[.)]\s/;                               // 목
var FM_BUL=/^\s*([ㅇ○◦□■▪▶※][  ]|[-–]\s)/;
var FM_LAW=/^\s*[■\[]\s*(근로복지기본법|별지)/;
var FM_SENT=/(다|함|임|음|것)\s*[.。]?\s*$/;
/* 2열 이상으로 앉힐 줄인지 — 원본이 탭·긴 공백으로 칸을 나눈 서명란이 대상.
   6칸 이상 공백으로 갈리고, 조각이 짧고(25자 이하) 문장 끝이 아닐 때만 열로 본다.
   ('…노사 각 2인 동수     로 구성한다.'처럼 문장 중간 여백을 열로 오해하지 않게) */
function _fmSpacedTitle(s){
  return FM_SPACED.test(s) && s.length<=40 && FM_TITLE.test(s.replace(/[\s\u00a0]/g,''));
}
function _fmCols(s){
  if(FM_HO.test(s)||FM_MOK.test(s)||FM_BUL.test(s)||FM_HANG.test(s)||FM_JO.test(s)) return null;
  var parts=s.split(/[\s ]{6,}/).map(function(x){return x.trim();}).filter(Boolean);
  if(parts.length<2||parts.length>4) return null;
  for(var i=0;i<parts.length;i++){ if(parts[i].length>25||FM_SENT.test(parts[i])) return null; }
  return parts;
}
/* HWP 변환 잡음 제거 — 제어문자·결합문자와, 한글 서식에 나올 이유가 없는
   라틴 확장 문자(예: 'Ā')가 탭 자리에 섞여 들어온다. 탭은 여백으로 바꾼다. */
function _fmClean(s){
  return String(s==null?'':s)
    .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u0300-\u036f\u0100-\u017f]/g,'')
    .replace(/\t+/g,'  ');
}
function _fmText(html){
  var d=document.createElement('div'); d.innerHTML=String(html==null?'':html);
  return _fmClean(d.textContent||'');
}
function _fmBlock(txt,body,st){
  var s=txt.trim();
  if(FM_LAW.test(s)) return '<p class="fmlaw">'+body+'</p>';   // 법령·별지 표기는 본문 순서에서 제외
  st.n=(st.n||0)+1;
  // 제목은 문서에 하나 — 단, 서명·수신으로 한 장이 끝난 뒤에 나오면 다음 장의 제목이다
  if((!st.title||st.ended)&&st.n<=1&&(_fmSpacedTitle(s)||(s.length<=32&&FM_TITLE.test(s)))){
    var sep=st.title?'<hr class="fmsep">':'';
    st.title=true; st.ended=false; st.n=0;
    return sep+'<h1 class="fmtitle">'+body+'</h1>';
  }
  if(s.length<=34&&(FM_DATE.test(s)||FM_DATE2.test(s))) return '<p class="fmdate">'+body+'</p>';
  if(FM_TO.test(s)&&s.length<=40){ st.ended=true; return '<p class="fmto">'+body+'</p>'; }
  var c=_fmCols(s);
  if(c){ st.ended=true;
    return '<div class="fmcols c'+c.length+'">'+c.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>'; }
  if(FM_SIGN.test(s)){ st.ended=true; return '<p class="fmsign">'+body+'</p>'; }
  if(FM_JO.test(s)) return '<p class="fmjo">'+body.replace(/^(\s*제\s*\d+\s*조\s*(?:\([^)]*\))?)/,'<b>$1</b>')+'</p>';
  if(FM_HANG.test(s)) return '<p class="fmhang">'+body+'</p>';
  if(FM_HO.test(s))   return '<p class="fmho">'+body+'</p>';
  if(FM_MOK.test(s))  return '<p class="fmmok">'+body+'</p>';
  if(FM_BUL.test(s))  return '<p class="fmbul">'+body+'</p>';
  return '<p class="fmp">'+body+'</p>';
}
function typesetForm(root){
  /* colgroup이 없는 원본 표는 열 폭을 내용에 맞게 잡게 한다.
     table-layout:fixed로 열을 고르게 나누면 좁은 칸에 글자가 들어가지 않아
     표가 본문 폭을 넘는다(사업자등록신청서 66열 격자에서 실측). */
  Array.prototype.forEach.call(root.querySelectorAll('table'),function(t){
    if(!t.querySelector('col')) t.classList.add('fmauto');
  });
  var blocks=[];
  Array.prototype.forEach.call(root.querySelectorAll('p,div'),function(el){
    if(el.closest('table')) return;                       // 표 안은 원본 격자 유지
    if(el.querySelector('table,p,div,h1,h2')) return;      // 컨테이너 제외
    if(String(el.className||'').trim()) return;            // 이미 스타일이 지정된 것(생성 서식·재조판분) 제외
    blocks.push(el);
  });
  if(!blocks.length) return;
  var st={title:false,ended:false,n:0};
  blocks.forEach(function(el){
    var parts=el.innerHTML.split(/<br\s*\/?>/i), out=[];
    parts.forEach(function(part){
      var txt=_fmText(part); if(!txt.trim()) return;
      out.push(_fmBlock(txt,_fmClean(part),st));
    });
    if(!out.length){ el.remove(); return; }
    el.outerHTML=out.join('');
  });
}
function _docTypeset(root){
  try{
    typesetForm(root);            // ⓞ 서식 구조 조판(제목·날짜·서명·조항 단계)
    // ① 연속 공백·탭 보존 — 요소 사이 여백(줄바꿈+들여쓰기)은 건드리지 않는다
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null), tn=[], t;
    while((t=w.nextNode())) tn.push(t);
    tn.forEach(function(n){
      var v=n.nodeValue||''; if(!v.trim()) return;
      if(v.indexOf('\t')<0 && !/ {2,}/.test(v)) return;
      n.nodeValue=v.replace(/\t/g,'    ').replace(/ {2,}/g,function(m){ return Array(m.length+1).join(' '); });
    });
    // ② 표식 줄 내어쓰기
    Array.prototype.forEach.call(root.querySelectorAll('p,div'),function(el){
      if(el.querySelector('table,p,div,br,h1,h2')) return;      // 컨테이너·여러줄 단락 제외

/* ── 생성 서식 → 한글(HWPX) 저장 ──
   화면에서 편집한 내용(#doced) 그대로 문단·표로 변환. 한글 프로그램 없이도 생성된다.
   문단+표 조립 방식이라 관공서 별지서식의 정밀 격자·도장란까지는 재현하지 않는다.
   (양식 그대로 제출해야 하면 기존 [🖨 인쇄/PDF] 또는 원본 엑셀 채움을 쓴다.) */
function docToHwpx(kind){
  confirmM('한글(HWPX) 저장은 화면 초안을 문단·표로 재조립한 것입니다.\n별지 서식의 정밀 격자·체크박스·도장란은 원본과 다르게 보일 수 있습니다.\n\n원본 모양 그대로 필요하면:\n· 엑셀 채워받기(인가 6종·지원신청서 — 형태 100%)\n· 📄 HWP 편집(원본 .hwp 등록 후)\n\n그래도 HWPX로 저장할까요?',{ok:'HWPX 저장'})
    .then(function(ok){ if(ok)_docToHwpxRun(kind); });
}
function _docToHwpxRun(kind){
  var ed=$('doced'); if(!ed){ toast('문서를 먼저 여세요','warn'); return; }
  if(typeof HWPX==='undefined'){ toast('한글 변환 모듈을 불러오지 못했습니다 — 새로고침 후 다시 시도','err'); return; }
  var f=funds[S.formFund]||{};
  try{
    HWPX.setPage({landscape:false});          // 서식은 A4 세로
    var body='';
    Array.prototype.forEach.call(ed.querySelectorAll('h1,h2,h3,p,table'), function(el){
      if(el.tagName!=='TABLE' && el.closest('table')) return;   // 표 안 문단은 표에서 함께 처리
      if(el.tagName==='TABLE'){
        var rows=[];
        Array.prototype.forEach.call(el.rows, function(tr){
          rows.push(Array.prototype.map.call(tr.cells, function(c){
            return String(c.innerText||c.textContent||'').replace(/ /g,' ').replace(/\s*\n\s*/g,'\n').trim();
          }));
        });
        if(!rows.length) return;
        var n=Math.max.apply(null, rows.map(function(r){ return r.length; }));   // 병합셀 대비 열 수 정규화
        rows=rows.map(function(r){ var q=r.slice(0,n); while(q.length<n) q.push(''); return q; });
        var ratios=[]; for(var i=0;i<n;i++) ratios.push(1);
        body+=HWPX.tablePara(rows, HWPX.cols(ratios))+HWPX.para('');
      } else {
        var t=String(el.textContent||'').replace(/ /g,' ').replace(/\s+/g,' ').trim();
        if(!t) return;
        body+=HWPX.para(t, (el.tagName==='H1'||el.tagName==='H2'||el.tagName==='H3')?'90':'0');
      }
    });
    if(!body){ toast('내보낼 내용이 없습니다','warn'); return; }
    var name=((f.short_name||f.name||'기금')+'_'+docLabel(kind)+'_'+ymd()+'.hwpx').replace(/[\\/:*?"<>|]/g,'_');
    HWPX.download(body, name);
    toast('한글 파일로 저장했습니다');
  }catch(e){ toast('한글 변환 실패: '+((e&&e.message)||e),'err'); }
}

   화면용 용지 그림자·테두리는 인쇄에서 제거하고, .a4 낱장마다 페이지를 나눈다. */

function fillSetup(wb,f,sites){
  var ws=wb.getWorksheet('기금법인정보'); if(!ws) throw new Error('기금법인정보 시트를 찾을 수 없습니다');

  var repSite=f.rep_org||(sites[0]&&sites[0].name)||'';
  setC(ws,'B3',repSite); setC(ws,'C3',f.name||''); setC(ws,'D3',f.chairman||''); setC(ws,'E3',f.address||'');

   확인서 시트가 연번(CJ3) 기준 VLOOKUP으로 해당 사업장 확인서를 만든다.
   출연금 = 상시근로자수 × 1인당 출연단가(fund.contrib_per_worker, 기본 400,000).
   ※ 대표자·근로자 생년월일은 개인정보라 시스템에 저장하지 않음 → 빈 칸(엑셀에서 직접 입력). */
function fillContribXls(wb,f,sites){
  var info=wb.getWorksheet('기업정보'); if(!info) throw new Error('기업정보 시트를 찾을 수 없습니다');
  var rate=num(f.contrib_per_worker)||400000;
  sites.forEach(function(s,i){
    var r=2+i;
    info.getCell(r,1).value=i+1;
    setC(info,'B'+r,s.name||''); setC(info,'C'+r,s.ceo||'');
    var n=num(s.company_size)||0;
    if(n) info.getCell(r,8).value=n;
    var amt=info.getCell(r,9);
    if(amt.type!==ExcelJS.ValueType.Formula) amt.value=n?n*rate:null;
  });
  if(info.rowCount>=2+sites.length) clearRange(info,2+sites.length,info.rowCount,1,9);
  var doc=wb.getWorksheet('6.기금출연확인서');
  if(doc) doc.eachRow({includeEmpty:false},function(row){
    row.eachCell({includeEmpty:false},function(c){
      if(typeof c.value==='string'&&c.value.indexOf('{{기금명}}')>=0)
        c.value=c.value.split('{{기금명}}').join(f.name||'');
    });
  });
}
function fillSubsidy(wb,f,sites){
  if((f.fund_type||'')!=='공동') throw new Error('지원신청서는 공동근로복지기금 전용입니다');
  var info=wb.getWorksheet('기금법인정보'); if(!info) throw new Error('기금법인정보 시트를 찾을 수 없습니다');
  var yrs=f.years||{}, sub={};
  Object.keys(yrs).sort().reverse().some(function(y){ if(yrs[y]&&yrs[y].subsidy){sub=yrs[y].subsidy;return true;} return false; });
  var workerTotal=num(sub.worker_count)||sites.reduce(function(s,x){return s+(num(x.company_size)||0);},0)||'';
  var contribution=num(f.contribution_total)||num(sub.contribution)||'';
  var applyAmt=num(sub.apply_amount)||contribution||'';
  setC(info,'A2',1); setC(info,'B2',f.name||''); setC(info,'C2',f.chairman||''); setC(info,'D2',f.address||'');
  setC(info,'E2',f.phone||''); setC(info,'F2',f.inka_no||''); setC(info,'G2',f.corp_reg_no||''); setC(info,'H2',f.tax_id_no||'');
  setC(info,'I2',f.reg_date||f.inka_date||''); setC(info,'J2',sites.length||''); setC(info,'K2',workerTotal);
  setC(info,'L2',contribution); setC(info,'N2',applyAmt); setC(info,'S2',f.rep_org||''); setC(info,'T2',sub.author||f.manager||'');
  ['P2','Q2','R2'].forEach(function(a){setC(info,a,'');});
  clearRange(info,3,8,2,20);   // 다른 기금 샘플행 B~T
  var parts=wb.getWorksheet('참여사업장정보'); if(parts){
    sites.forEach(function(s,i){ var r=3+i, c=_siteContacts(s);
      setC(parts,'A'+r,'1-'+(i+1)); parts.getCell(r,2).value=i+1; setC(parts,'C'+r,s.name||''); setC(parts,'D'+r,s.ceo||'');
      setC(parts,'E'+r,s.address||''); var sz=num(s.company_size)||''; if(sz!==''){parts.getCell(r,6).value=sz;parts.getCell(r,10).value=sz;}
      setC(parts,'G'+r,s.biz_type||''); setC(parts,'I'+r,s.biz_no||''); setC(parts,'K'+r,c.name); setC(parts,'N'+r,c.phone); setC(parts,'O'+r,c.email); });
    if(parts.rowCount>=3+sites.length) clearRange(parts,3+sites.length,parts.rowCount,1,20);
  }
  var doc=wb.getWorksheet('신청서'); if(doc){
    setC(doc,'AM3',1); var keys=[];
    doc.getColumn(9).eachCell({includeEmpty:false},function(cell){ if(typeof cell.value==='string'&&/^\d+-\d+$/.test(cell.value.trim())) keys.push(cell); });
    keys.sort(function(a,b){return a.row-b.row;});

  }
}

function _deleteSetupFund(fid,goHome){
  var f=funds[fid]; if(!f) return;
  var msg='"'+(f.short_name||f.name)+'"을(를) 완전히 삭제할까요?\n\n'
    +'※ 되돌릴 수 없습니다. 기금 정보·참여사업장·서식 저장본·연간일정·목적사업·거래내역·청구·업로드 파일이 모두 지워집니다.\n'
    +'(보관만 하려면 취소하고 그대로 두세요)';
  confirmM(msg,{ok:'완전 삭제',danger:true}).then(function(ok){
    if(!ok) return null;
    // ① 서버 최신값 재확인 — 확인창 떠 있는 동안 복원됐을 수 있음
    return fbDb.ref(NS+'/funds/'+fid).once('value').then(function(fs){
      var sv=fs.val()||{};
      if(!sv.deleted&&sv.setup_stage!=='설립준비'){
        toast('보관 중인 기금이 아닙니다(복원됨?) — 완전 삭제 취소','warn'); return 'abort';
      }
      // ② Storage 업로드 파일 먼저 정리(메타 삭제 전이라 경로를 알 수 있음)
      return fbDb.ref(NS+'/subsidy_docs/'+fid).once('value')
        .then(function(ds){
          var d=ds.val()||{}, paths=[];
          Object.keys(d).forEach(function(yr){ var y=d[yr]||{};
            Object.keys(y).forEach(function(id){ if(y[id]&&y[id].path) paths.push(y[id].path); }); });
          if(!fbStore||!paths.length) return null;
          return Promise.all(paths.map(function(p){ return fbStore.ref(p).delete().catch(function(){}); }));
        })
        .catch(function(){ return null; });
    }).then(function(st){
      if(st==='abort') return 'abort';
      // ③ 기금 하위 데이터 일괄 삭제
      var up={}; up['funds/'+fid]=null; up['sites/'+fid]=null; up['annual/'+fid]=null;
      up['subsidy_docs/'+fid]=null; up['doc_edits/'+fid]=null; up['welfare/'+fid]=null;
      up['events/'+fid]=null; up['txns/'+fid]=null;
      return fbDb.ref(NS).update(up);
    }).then(function(st){
      if(st==='abort') return 'abort';
      // ④ 이 기금 청구 항목 정리 — 실패해도 본체는 지워졌으므로 '일부 실패'로 알린다(성공으로 속이지 않음)
      return fbDb.ref(NS+'/billings').once('value').then(function(bs){
        var b=bs.val()||{}, del={};
        Object.keys(b).forEach(function(k){ if(b[k]&&b[k].fund_id===fid) del[k]=null; });
        return Object.keys(del).length?fbDb.ref(NS+'/billings').update(del):null;
      }).then(function(){ return 'ok'; }).catch(function(){ return 'partial'; });
    }).then(function(st){
      if(st==='abort') return;
      delete funds[fid]; closeM();
      if(goHome){ _go('home'); }
      else { S.homeTab='trash'; if(S.view==='fund'){_go('home');} else {renderHome();} }
      if(st==='partial') toast('기금은 삭제됐지만 청구 항목 일부가 남았습니다 — 청구 관리에서 확인하세요','warn');
      else toast('완전 삭제되었습니다');
    }).catch(function(e){ toast('삭제 실패: '+(e&&e.message||e),'err'); });
  });
}

function bindDocIntake(){
  [['dz-inka','inka'],['dz-corpreg','corpreg'],['dz-taxid','taxid']].forEach(function(p){

var _docFound={}, _docOcr=false, _docFid=null;   // 판독 결과는 시작 시점 기금에 귀속
function readDocInto(zid,kind,file){
  if(!file) return;
  var def=DOC_PARSE[kind], nm=file.name||'', isPdf=/\.pdf$/i.test(nm);
  var myFid=S.fundId;
  if(_docFid&&_docFid!==myFid){ _docFound={}; _docOcr=false; }   // 기금이 바뀌었으면 이전 결과 폐기
  _docFid=myFid;
  var stat=function(h){ if(S.fundId===myFid) dzStat(zid,h); };
  var done=function(txt,viaOcr){
    if(S.fundId!==myFid) return;    // 판독 도중 다른 기금으로 이동 → 결과 버림
    var got=def.fn(txt), keys=Object.keys(got).filter(function(k){return got[k];});
    if(!keys.length){ stat('<span style="color:var(--warn)">글자는 읽었지만 항목을 못 찾았습니다</span>'
      +(viaOcr?'<br><span class="muted" style="font-size:11px">스캔 상태가 나쁘면 인식이 어렵습니다 — 직접 입력하세요.</span>':'')); return; }
    stat('<span style="color:#0a7">✓ '+keys.length+'개 항목 판독'+(viaOcr?' <span class="chip warn" style="font-size:10px">OCR</span>':'')+'</span>');
    if(viaOcr) _docOcr=true;
    Object.assign(_docFound,got); renderDocIntake();
  };
  var fail=function(e){ stat('<span style="color:var(--danger)">읽기 실패: '+esc((e&&e.message)||e)+'</span>'); };
  var ocrPath=function(bufOrFile){    // 스캔 → 그림을 글자로
    stat('<span class="muted">스캔 문서 — OCR 시작…</span>');
    var prep = isPdf ? pdfPageCanvases(bufOrFile,2) : imgCanvas(bufOrFile).then(function(c){return [c];});
    prep.then(function(cvs){ return ocrCanvases(cvs,function(m){ stat('<span class="muted">'+esc(m)+'</span>'); }); })
        .then(function(t){ done(t,true); }).catch(fail);
  };
  if(!isPdf){ ocrPath(file); return; }
  stat('<span class="muted">읽는 중… '+esc(nm)+'</span>');
  var rd=new FileReader();
  rd.onload=function(){
    var buf=new Uint8Array(rd.result);
    pdfText(buf).then(function(txt){
      if(txt&&txt.replace(/\s/g,'').length>=40) done(txt,false);   // 텍스트 PDF — 100% 정확
      else ocrPath(buf);                                           // 스캔 PDF → OCR
    }).catch(function(){ ocrPath(buf); });
  };
  rd.onerror=function(){ stat('<span style="color:var(--danger)">파일을 열 수 없습니다</span>'); };
  rd.readAsArrayBuffer(file);
}

function num(v){ if(v==null||v==='')return ''; if(typeof v==='number')return Math.round(v);
  var s=String(v).trim(), neg=false;
  if(/^\(.+\)$/.test(s)){ neg=true; s=s.slice(1,-1); }            // (1,000) = 음수
  if(/-\s*$/.test(s)){ neg=true; s=s.replace(/-\s*$/,''); }        // 1,000- = 음수
  var plain=s.replace(/,/g,'');
  if(/^[+-]?\d*\.?\d+e[+-]?\d+$/i.test(plain)){ var sci=parseFloat(plain); return isNaN(sci)?'':Math.round(neg?-sci:sci); } // 1E+6 지수표기
  s=s.replace(/[^0-9.\-]/g,''); if(s===''||s==='-'||s==='.')return '';
  var n=Math.round(parseFloat(s)); if(isNaN(n))return ''; return neg?-Math.abs(n):n; }

function saveSite(sid){
  var base = sid ? ((S.sites&&S.sites[sid])||{}) : Object.assign({status:'active'}, _sitePrefill||{});  // 신규는 연결 프리필(puerp_co_id 등) 보존
  var obj=Object.assign({}, base);
  SITE_FIELDS.forEach(function(c){var el=$('se-'+c[0]);if(el)obj[c[0]]=el.value.trim();});
  if(!obj.name){ toast('상호를 입력하세요','warn'); return; }
  // 담당자: 기존 contacts 배열 유지하되 대표 담당자 항목만 갱신(없으면 추가)
  var pc=_primaryContact(obj), cv={};
  CONTACT_FIELDS.forEach(function(c){var el=$('sc-'+c[0]);if(el)cv[c[0]]=el.value.trim();});
  var hasContact=cv.name||cv.mobile||cv.email||cv.position;
  var list=pc.list.slice();
  if(hasContact){
    var item={name:cv.name||'',position:cv.position||'',phone:'',mobile:cv.mobile||'',email:cv.email||'',isPrimary:true};
    if(pc.idx>=0){ list[pc.idx]=Object.assign({},list[pc.idx],item); } else { list.unshift(item); }
  } else if(pc.idx>=0){ list.splice(pc.idx,1); }   // 담당자 비우면 대표 항목 제거
  obj.contacts=list;
  var _fid=S.fundId;   // 저장 대상 기금 고정(응답 전 이동 대비)
  var done=function(){ _sitePrefill=null; if(S.sitesFor===_fid)S.sitesFor=null; closeM();
    if(S.view==='fund'&&S.fundId===_fid)renderFund(); toast('사업장이 저장되었습니다'); };
  var err=function(e){ toast('저장 실패: '+(e&&e.message||e),'err'); };
  if(sid){
    /* 기존 사업장은 set(전체 덮어쓰기)이 아니라 update(이 화면에서 다룬 항목만)로 저장한다.
       다른 세션이 이 화면에 없는 필드를 고쳐 놨어도 그 값이 지워지지 않게 하기 위함. */
    var patch={contacts:list};
    SITE_FIELDS.forEach(function(c){ if(Object.prototype.hasOwnProperty.call(obj,c[0])) patch[c[0]]=obj[c[0]]; });
    if(obj.status) patch.status=obj.status;
    fbDb.ref(NS+'/sites/'+_fid+'/'+sid).update(patch).then(done).catch(err);
  }else{
    fbDb.ref(NS+'/sites/'+_fid).push().set(obj).then(done).catch(err);
  }
}

var _coCache=null;
function _normCo(v){
  if(!v) return []; if(!Array.isArray(v)) v=Object.keys(v).map(function(k){return v[k];});
  var seen={};
  return v.filter(function(c){return c&&c.name&&(c.status!=='deleted');})
    .filter(function(c){ var id=c.id||c.bizNo||c.name; if(seen[id])return false; seen[id]=1; return true; })
    .sort(function(a,b){return (a.name||'').localeCompare(b.name||'','ko');});
}
function loadCompanies(){
  if(_coCache) return Promise.resolve(_coCache);

  return fbDb.ref('data/companies/v').once('value').then(function(s){ _coCache=_normCo(s.val()); return _coCache; })
    .catch(function(){ _coCache=[]; return _coCache; });

function syLoad(){

var SITE_COLMAP=[
  ['name',        ['상호','사업장명','회사명','업체명','기업명','사업장','회사']],
  ['ceo',         ['대표자','대표','대표이사','성명']],
  ['biz_no',      ['사업자등록번호','사업자번호','사업자','등록번호']],
  ['biz_type',    ['업종','업태','종목']],
  ['company_size',['상시근로자','근로자수','인원','상시','직원수','근로자']],
  ['address',     ['소재지','주소','사업장주소']],
  ['seq_label',   ['번호','연번','순번','no']]
];
function _pickCol(headers,cands){
  for(var i=0;i<headers.length;i++){
    var h=String(headers[i]||'').replace(/\s/g,'');
    for(var j=0;j<cands.length;j++) if(h && h.indexOf(cands[j].replace(/\s/g,''))>=0) return i;
  }
  return -1;
}
function bindSiteXlsx(){ _dzHandler['dz-sites']=function(files){ readSiteXlsx(files[0]); }; }
var _sitePend=null;
function readSiteXlsx(file){
  if(!file) return;
  if(typeof XLSX==='undefined'){ dzStat('dz-sites','<span style="color:var(--danger)">엑셀 라이브러리 로드 실패 — 새로고침</span>'); return; }
  dzStat('dz-sites','<span class="muted">읽는 중… '+esc(file.name||'')+'</span>');
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var best=null;
      wb.SheetNames.forEach(function(sn){
        var rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:''});
        // 헤더행 찾기 — '상호/사업장명/회사명' 계열이 있는 첫 줄
        for(var r=0;r<Math.min(rows.length,15);r++){
          if(_pickCol(rows[r],SITE_COLMAP[0][1])>=0){
            var map={}; SITE_COLMAP.forEach(function(m){ var i=_pickCol(rows[r],m[1]); if(i>=0)map[m[0]]=i; });
            if(!best||Object.keys(map).length>Object.keys(best.map).length) best={sheet:sn,rows:rows,hdr:r,map:map};
            break;
          }
        }
      });
      if(!best){ dzStat('dz-sites','<span style="color:var(--warn)">사업장 표를 못 찾았습니다</span><br><span class="muted" style="font-size:11px">첫 행에 <b>상호</b>(또는 사업장명·회사명) 열이 있어야 합니다.</span>'); return; }
      var out=[];
      for(var r=best.hdr+1;r<best.rows.length;r++){
        var row=best.rows[r]; if(!row) continue;
        var o={};
        Object.keys(best.map).forEach(function(k){ o[k]=String(row[best.map[k]]==null?'':row[best.map[k]]).trim(); });
        if(!o.name) continue;
        if(/합\s*계|소\s*계|총\s*계/.test(o.name)) continue;      // 합계행 제외
        o.company_size=String(num(o.company_size)||'');
        out.push(o);
      }
      if(!out.length){ dzStat('dz-sites','<span style="color:var(--warn)">데이터 행이 없습니다</span>'); return; }
      // 읽기 시작 시점의 기금을 고정 — 미리보기 중 다른 기금으로 옮겨도 그 기금에 등록되지 않게
      _sitePend={list:out,sheet:best.sheet,cols:Object.keys(best.map),fid:S.fundId,fname:(funds[S.fundId]&&(funds[S.fundId].short_name||funds[S.fundId].name))||''};
      dzStat('dz-sites','<span style="color:var(--ok,#0a7)">✓ '+out.length+'개 사업장 인식 ('+esc(best.sheet)+')</span>');
      renderSitePend();
    }catch(e){ dzStat('dz-sites','<span style="color:var(--danger)">읽기 실패: '+esc(e.message||e)+'</span>'); }
  };
  rd.readAsArrayBuffer(file);
}

function commitSiteXlsx(){
  if(!_sitePend||!_sitePend.list.length) return;
  var fid=_sitePend.fid, list=_sitePend.list;      // 읽을 때 고정한 기금에 등록
  if(!fid||!funds[fid]){ toast('대상 기금을 찾을 수 없습니다 — 다시 올려주세요','err'); return; }
  var nm=_sitePend.fname||fid;

// ── 지원금 (공동 전용) — 근로복지공단 지원 신청 전 과정을 하위 탭으로 ──
var SUB_TABS=[['plan','🧮 한도·점수'],['apply','📋 신청·정산'],['docs','📁 제출서류'],['excel','📥 신청서 엑셀'],['board','🗂 전체 보드']];

/* ══════════ 지원금 — 근로복지공단 지원사업 규칙 ══════════
   출처: 「2025년 근로복지기금 지원사업 시행 안내」(근로복지넷 공지) + 별지 제3호의2 심사위원회 평가표.
   원본은 03_과거자료/2025년/2025년_근로복지기금_지원사업_안내/ 에 있다.
   ※ 해마다 바뀌는 값(1인당 한도·접수기간)은 연도별로 둔다 — 새 시행계획이 나오면 여기만 고친다.
   ※ 평가표 배점은 **2024년판** 기준이다. 2025년에 정성 30→40점(소규모기업 기여도 신설),
      정량 70→60점(①25→15점, ③1인당 기지원액 삭제→참여기업 1개소당 평균 근로자수 신설)으로
      개정됐으므로, 최신 평가표를 받으면 SUB_RUBRIC를 교체해야 한다. 화면에도 그렇게 알린다. */
var SUB_RULE={
  '2026':{ per_worker:930000, apply_period:'연도별 공고 확인 — 2026년 시행계획 미확인', rubric:'2024' },
  '2025':{ per_worker:930000, apply_period:'상반기 3.4.~4.18. (하반기는 별도 공지)', rubric:'2024' },
  '2024':{ per_worker:930000, apply_period:'상반기 3.15.~4.30.', rubric:'2024' },
  '2023':{ per_worker:930000, apply_period:'상반기 (연도별 공고 확인)', rubric:'2024' },
  '2022':{ per_worker:888000, apply_period:'상반기 (연도별 공고 확인)', rubric:'2024' }
};
function subRule(y){ return SUB_RULE[String(y)]||SUB_RULE['2025']; }
// 지원요건(출연 주체)별 구간 한도 — 고시 제8·9조
var SUB_REQ=[['1','둘 이상의 기업이 공동기금에 출연'],['2','대기업(원청)이 중소기업 공동기금에 출연'],['3','지방자치단체가 중소기업 공동기금에 출연']];
var SUB_BAND={ '1':[200000000,500000000,1000000000,2000000000],     // 2억·5억·10억·20억 (기간 3·3·4·5년)
               '2':[200000000,300000000,500000000,1000000000],      // 2억·3억·5억·10억 (매년 한도내)
               '3':[200000000,400000000,600000000] };               // 2억·4억·6억 (설립일부터 3년)
var SUB_BAND_LBL={ '1':['2억','5억','10억','20억'],'2':['2억','3억','5억','10억'],'3':['2억','4억','6억'] };
/* 구간은 '참여 사업장 수 **또는** 근로자 수'라서 둘 중 유리한(높은) 구간을 쓴다. */
function subTier(nSite,nEmp,type){
  var sc = type==='3'?[10,30]:[5,10,30], ec = type==='3'?[500,1000]:[100,500,1000];
  var i=0; while(i<sc.length && nSite>=sc[i]) i++;
  var j=0; while(j<ec.length && nEmp>=ec[j]) j++;
  return Math.max(i,j);
}
// 평가표 정량 항목 — 점수(1~5, 0=지원 배제)
function _subP1(ratio){ return ratio>=2?5:ratio>=1.75?4:ratio>=1.5?3:ratio>=1.25?2:ratio>=1?1:0; }  // ①출연÷신청
function _subP2a(r){ return r<.5?5:r<.6?4:r<.7?3:r<.8?2:r<.9?1:0; }        // ②-1 최다 기업 근로자 비중
function _subP2b(r){ return r<.7?5:r<.75?4:r<.8?3:r<.85?2:r<.9?1:0; }      // ②-2 상위 3개소 비중(참여 10개소 이상만)
function _subP3(v){ return v<=400000?5:v<=600000?4:v<=800000?3:v<=1000000?2:1; }  // ③1인당 이미 지원받은 금액
function _subP4(n){ return n>=30?5:n>=10?4:n>=5?3:n>=3?2:n>=2?1:0; }      // ④참여 기업 수
/* 지원금 산정 — 한도 3중 제약과 심사점수 차등지원율을 함께 계산한다.
   한도: ㉮구간 한도 ㉯근로자 1인당 한도×근로자수 ㉰출연(예정)금 100% → 셋 중 가장 작은 값
   지원율: 80점↑ 100% / 60~80 75% / 40~60 50% / 40미만 배제 */
function subsidyCalc(o){
  var rule=subRule(o.year), type=String(o.type||'1');
  var nSite=num(o.nSite)||0, nEmp=num(o.nEmp)||0, contrib=num(o.contrib)||0, apply=num(o.apply)||0;
  var tier=subTier(nSite,nEmp,type);
  var band=(SUB_BAND[type]||SUB_BAND['1'])[tier]||0, bandLbl=(SUB_BAND_LBL[type]||[])[tier]||'-';
  if(type==='1'&&nSite>=50&&nEmp>=1500){ band=3000000000; bandLbl='30억(지역·산업단위)'; }
  var perW=nEmp*rule.per_worker;
  var maxApply=Math.min(band,perW,contrib||Infinity);
  if(!isFinite(maxApply)) maxApply=Math.min(band,perW);
  var ratio=apply>0?contrib/apply:0;
  var p1=_subP1(ratio);
  var p2a=_subP2a(nEmp?(num(o.maxEmp)||0)/nEmp:1);
  var p2b=nSite>=10?_subP2b(nEmp?(num(o.top3)||0)/nEmp:1):5;   // ②-2는 참여 10개소 이상만 적용
  var p2=Math.min(p2a,p2b), p3=_subP3(num(o.prevPerWorker)||0), p4=_subP4(nSite);
  var excluded=(p1===0||p2===0||p4===0);
  var qual=Math.max(0,Math.min(30,num(o.qual)||0));
  var score=p1*5+p2*3+p3*3+p4*3+qual;
  var rate=score>=80?1:score>=60?.75:score>=40?.5:0;
  var expect=(excluded||!apply)?0:Math.min(Math.round(apply*rate),band,perW);
  return {tier:tier,band:band,bandLbl:bandLbl,perWorkerLimit:perW,perWorker:rule.per_worker,
    maxApply:maxApply,ratio:ratio,p1:p1,p2:p2,p2a:p2a,p2b:p2b,p3:p3,p4:p4,qual:qual,
    score:score,rate:rate,expect:expect,excluded:excluded,
    quant:p1*5+p2*3+p3*3+p4*3};
}
// 지원금 하위탭 전환 — 미저장 입력이 있으면 확인 후 이동(그냥 바꾸면 입력이 사라짐)
function goSubTab(t){ _leaveGuard().then(function(ok){ if(!ok)return; S.subTab=t; renderFund(); }); }

function subsidyApplyPanel(f){

      .catch(function(){if(S.sitesFor===_fid)S.sitesFor=null;if(S.tab==='subsidy'&&S.view==='fund')renderFund();});

    +(hasPrev?' <button onclick="copyPrevSubsidy()" title="'+(S.year-1)+'년 지원금 값을 올해로 불러오기">↩ 작년('+(S.year-1)+') 값 불러오기</button>':'')
    +recon+'</div></div>';

/* ══ 지원금 ① 한도·점수 ══
   우리가 이미 가진 데이터(참여사업장 상시근로자수·출연금)로 세 한도와 예상 심사점수를 계산한다.
   핵심은 **신청액을 얼마로 쓰느냐**다 — 신청액이 커지면 출연÷신청 비율이 떨어져 점수가 깎이고,
   점수가 한 구간(80/60/40점) 아래로 내려가면 지원율이 100%→75%→50%로 뚝 떨어져
   신청액을 올렸는데 받는 돈이 오히려 줄어든다. 출연금보다 많이 신청하면 아예 배제된다.
   그래서 시나리오 표로 기대 수령액이 가장 큰 신청액을 찾아 준다. */
function _subPlanAgg(f){
  var act=Object.keys(S.sites||{}).map(function(k){ var s=S.sites[k]; return Object.assign({_id:k},s); })
    .filter(function(s){ return s.status!=='closed'; });
  var sy=S.sy||{};
  var emps=act.map(function(s){ return num(s.company_size)||0; }).sort(function(a,b){return b-a;});
  var nYear=0, nBase=0;
  var contrib=act.reduce(function(t,s){
    var y=num((sy[s._id]||{}).contrib)||0;                 // 그 해 값이 있으면 우선
    if(y){ nYear++; return t+y; }
    var b=num(s.contrib)||0; if(b) nBase++;
    return t+b;
  },0);
  return { nSite:act.length, nEmp:emps.reduce(function(a,b){return a+b;},0),
    maxEmp:emps[0]||0, top3:emps.slice(0,3).reduce(function(a,b){return a+b;},0),
    siteContrib:contrib, contrib:contrib, nYear:nYear, nBase:nBase, noContrib:act.length-nYear-nBase };
}
// ③ 1인당 이미 지원받은 금액 — 지난 연도 결정액 ÷ 그 해 근로자수의 누계(근로자수 자료가 없으면 현재 인원으로 추정)
function _subPrevPerWorker(f,nEmp){
  var ys=(f&&f.years)||{}, sum=0;
  Object.keys(ys).forEach(function(y){
    if(+y>=S.year) return;
    var d=num(((ys[y]||{}).subsidy||{}).decided_amount)||0;
    if(d&&nEmp) sum+=d/nEmp;
  });
  return Math.round(sum);
}
function subsidyPlanPanel(f){
  if(f.fund_type==='사내') return '<div class="panel"><div class="msg warn">사내근로복지기금은 공동기금 지원사업 대상이 아닙니다.</div></div>';
  if(S.sitesFor!==S.fundId){
    var _fid=S.fundId; S.sitesFor=_fid; S.sites=null;
    fbDb.ref(NS+'/sites/'+_fid).once('value').then(function(s){ if(S.sitesFor!==_fid)return; S.sites=s.val()||{}; if(S.tab==='subsidy'&&S.view==='fund'&&S.fundId===_fid)renderFund(); })
      .catch(function(){ if(S.sitesFor===_fid)S.sitesFor=null; if(S.tab==='subsidy'&&S.view==='fund')renderFund(); });
    return '<div class="panel">'+loadingHTML()+'</div>';
  }
  if(!syLoad()) return '<div class="panel">'+loadingHTML('출연금 불러오는 중…')+'</div>';
  var yd=(f.years&&f.years[S.year]&&f.years[S.year].subsidy)||{};
  var g=_subPlanAgg(f); g.year=S.year;
  /* 출연금 총액 = 참여사 출연금 합계 + 지자체 출연금.

function _subScoreRows(g,c){
  var pct=function(a,b){ return b?((a/b*100).toFixed(1)+'%'):'-'; };
  var r=[
    ['① 출연(예정)금 ÷ 신청액', c.p1*5+'/25', c.ratio?(c.ratio.toFixed(2)+'배 → '+c.p1+'점 × 5'):'신청액을 입력하세요'],
    ['② 근로자수 편중', c.p2*3+'/15', '최다 기업 '+g.maxEmp+'/'+g.nEmp+' = '+pct(g.maxEmp,g.nEmp)+' → '+c.p2a+'점'
      +(g.nSite>=10?(' · 상위 3개소 '+g.top3+'/'+g.nEmp+' = '+pct(g.top3,g.nEmp)+' → '+c.p2b+'점 (낮은 쪽 반영)'):' · 상위 3개소 기준은 참여 10개소 이상만 적용')],
    ['③ 1인당 이미 지원받은 금액', c.p3*3+'/15', c.p3+'점 × 3 (2025년 개정으로 삭제된 항목)'],
    ['④ 참여 기업 수', c.p4*3+'/15', g.nSite+'개사 → '+c.p4+'점 × 3'],
    ['정성평가(사업계획)', c.qual+'/30', '사업계획·정책부합성·복지개선 정도 — 심사위원 평가']
  ];
  var body=r.map(function(x){ return '<tr><td>'+x[0]+'</td><td style="text-align:right;font-weight:600">'+x[1]+'</td><td class="muted">'+esc(x[2])+'</td></tr>'; }).join('');
  var badge=c.excluded?'<span class="chip dg">지원 배제</span>':'<span class="chip '+(c.rate===1?'ok':'warn')+'">지원율 '+Math.round(c.rate*100)+'%</span>';
  body+='<tr style="font-weight:700;background:var(--warn-bg,#fffbeb)"><td>합계</td><td style="text-align:right">'+c.score+'/100</td><td>'+badge
    +(c.excluded?' <span class="muted" style="font-weight:400">'+(c.p1===0?'출연금이 신청액보다 적습니다':c.p2===0?'한 기업 근로자가 90% 이상입니다':'참여 기업이 2개소 미만입니다')+'</span>':'')
    +' <span class="muted" style="font-weight:400">예상 수령 '+(c.expect||0).toLocaleString()+'원</span></td></tr>';
  return body;
}
function _subScnRows(g,type,qual,prev,cur){
  var cands=[], contrib=num(g.contrib)||0;
  [2,1.75,1.5,1.25,1].forEach(function(d){ if(contrib) cands.push(Math.floor(contrib/d)); });
  var base=subsidyCalc(Object.assign({},g,{type:type,apply:1,qual:qual,prevPerWorker:prev}));
  cands.push(base.maxApply);
  if(cur) cands.push(num(cur)||0);
  cands=cands.filter(function(v){ return v>0 && v<=base.maxApply; })
    .filter(function(v,i,a){ return a.indexOf(v)===i; }).sort(function(a,b){return a-b;});
  if(!cands.length) return '<tr><td colspan="7" class="muted" style="padding:12px">출연금을 입력하면 시나리오를 계산합니다.</td></tr>';
  var rows=cands.map(function(a){ return {a:a,c:subsidyCalc(Object.assign({},g,{type:type,apply:a,qual:qual,prevPerWorker:prev}))}; });
  var best=rows.reduce(function(m,x){ return (!m||x.c.expect>m.c.expect)?x:m; },null);
  return rows.map(function(x){
    var on=(x===best), same=(num(cur)===x.a);
    return '<tr'+(on?' style="background:var(--ok-bg,#f0fdf4);font-weight:600"':'')+'>'
      +'<td style="text-align:right">'+x.a.toLocaleString()+'</td>'
      +'<td style="text-align:right">'+x.c.ratio.toFixed(2)+'</td>'
      +'<td style="text-align:right">'+(x.c.p1*5)+'</td>'
      +'<td style="text-align:right">'+x.c.score+'</td>'
      +'<td style="text-align:right">'+(x.c.excluded?'배제':Math.round(x.c.rate*100)+'%')+'</td>'
      +'<td style="text-align:right">'+(x.c.expect||0).toLocaleString()+'</td>'
      +'<td>'+(on?'<span class="chip ok" style="font-size:10px">추천</span> ':'')
      +(same?'<span class="chip" style="font-size:10px">현재</span>':'<button onclick="subPlanUse('+x.a+')" style="padding:1px 7px;font-size:11px">이 금액</button>')+'</td></tr>';
  }).join('');
}
function _subPlanRead(){

    prev:num(el('sp-prev'))||0, apply:num(el('sp-apply'))||0 };

function subPlanRecalc(){

  var totalNeed=act.length*SUB_SITE_DOCS.length, totalDone=colDone.reduce(function(a,b){return a+b;},0);

  // ── 업로드 파일(기존 서류함) ──
