/* ══ 직접 올린 서류를 남긴다 ══
   [🖼 사진첩에서 고르기]로 넣으면 원본이 이어져 나중에 [보기]로 다시 본다.
   그런데 파일을 «직접» 올린 길은 판독값만 칸에 넣고 끝나, 원본이 아무 데도 안 남았다.
   그러면 「무엇을 보고 넣었지」를 되짚지 못한다 — 잘못을 찾을 수가 없다.

   그래서 올린 파일을 사진첩에 넣고(savePhoto) 이 기금에 잇는다(saveScanRef).
   ⚠ 남기기가 실패해도 «판독은 살린다» — 값은 이미 칸에 들어갔다.
     원본을 못 남겼다는 것만 알린다. 조용히 넘기면 남은 줄 안다.
   ⚠ 사진첩에서 온 파일은 이미 이어져 있다 — 두 번 넣지 않는다(fromAlbum). */
function _docToImage(file){
  if(!/\.pdf$/i.test(file.name||'')){
    return new Promise(function(res,rej){
      var img=new Image(), url=URL.createObjectURL(file);
      img.onload=function(){ try{ res(_fitCanvas(img,img.naturalWidth,img.naturalHeight)); }
        finally{ URL.revokeObjectURL(url); } };
      img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('그림을 열지 못했습니다')); };
      img.src=url;
    });
  }
  /* PDF 는 «첫 쪽»을 그림으로 뜬다 — 사진첩은 그림으로 보관한다 */
  return file.arrayBuffer().then(function(buf){
    return pdfPageCanvases(new Uint8Array(buf),1);
  }).then(function(cvs){
    if(!cvs||!cvs.length) throw new Error('PDF 첫 쪽을 그리지 못했습니다');
    return _fitCanvas(cvs[0],cvs[0].width,cvs[0].height);
  });
}
function _fitCanvas(src,w,h){
  var sp=PuPhotoStore.uploadSpec(true);                       // 서류 규격(긴 변 2600)
  var mk=function(edge,q){
    var r=Math.min(1,edge/Math.max(w,h));
    var c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(w*r)); c.height=Math.max(1,Math.round(h*r));
    c.getContext('2d').drawImage(src,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',q);
  };
  return { full:mk(sp.maxEdge,sp.quality), thumb:mk(sp.thumbEdge,0.7) };
}
function _keepDocOriginal(kind,file,fid){
  if(!photoStoreReady()||!PuPhotoStore.savePhoto||!PuPhotoStore.newId)
    return Promise.reject(new Error('사진첩과 연결되지 않았습니다'));
  var f=funds[fid]||{}, now=Date.now();
  return _docToImage(file).then(function(im){
    var id=PuPhotoStore.newId();
    return PuPhotoStore.savePhoto({ id:id, full:im.full, thumb:im.thumb,
      meta:{ upAt:now, takenAt:now, kind:docZoneLabel(kind),
             /* 제목에 서류 이름과 기금 이름을 담는다 —
                다음에 [🔎 찾기]가 이 사진을 스스로 찾아낸다(docFindScore). */
             company:(f.short_name||f.name||''),
             note:docZoneLabel(kind)+' · '+(f.short_name||f.name||''),
             byName:(S.user||'') }
    }).then(function(){ return { id:id, year:PuPhotoStore.yearOf(now) }; });
  }).then(function(r){
    saveScanRef(fid,kind,{owner:(PuPhotoStore.myUid&&PuPhotoStore.myUid())||'',year:r.year,id:r.id});
    return r;
  });
}
function readDocInto(zid,kind,file,fromAlbum){
  if(!file) return;
  var def=DOC_PARSE[kind], nm=file.name||'', isPdf=/\.pdf$/i.test(nm);
  /* 원본을 붙잡아 둔다 — 값만 보여 주면 오독을 알아챌 수가 없다(경력관리 편집 창과 같은 결).
     ⚠ 앞서 만든 주소는 반드시 놓아 준다. 안 놓으면 창을 여닫을수록 메모리가 쌓인다. */
  try{ if(_docSrc&&_docSrc.url&&_docSrc.blob) URL.revokeObjectURL(_docSrc.url); }catch(e){}
  var _u=''; try{ _u=URL.createObjectURL(file); }catch(e){}
  _docSrc={kind:kind,zid:zid,name:nm,isPdf:isPdf,url:_u,blob:true,file:file,text:'',ocr:false,fid:S.fundId};
  var myFid=S.fundId;
  if(_docFid&&_docFid!==myFid){ _docFound={}; _docOcr=false; }   // 기금이 바뀌었으면 이전 결과 폐기
  _docFid=myFid;
  var stat=function(h){ if(S.fundId===myFid) dzStat(zid,h); };
  var done=function(txt,viaOcr){
    if(S.fundId!==myFid) return;    // 판독 도중 다른 기금으로 이동 → 결과 버림
    if(_docSrc&&_docSrc.kind===kind){ _docSrc.text=String(txt||''); _docSrc.ocr=!!viaOcr; }
    /* 값이 나왔으면 원본도 남긴다 — 값과 원본은 늘 함께 있어야 되짚을 수 있다 */
    if(!fromAlbum&&!(funds[myFid]&&(funds[myFid].scans||{})[kind]))
      _keepDocOriginal(kind,file,myFid).then(function(){
        if(S.fundId===myFid) renderFund();
        toast('원본을 사진첩에 남기고 이 기금에 연결했습니다');
      }).catch(function(e){
        toast('판독은 됐지만 원본을 못 남겼습니다: '+((e&&e.message)||e)+' — [🖼]로 사진첩에서 골라 이어 주세요','warn');
      });
    /* 정관은 칸에 나눠 넣지 않는다 — 읽은 글자를 그대로 들고 확인 창으로 간다 */
    if(def.full){ charterRead(txt,viaOcr,zid); return; }
    var got=def.fn(txt), keys=Object.keys(got).filter(function(k){return got[k];});
    if(!keys.length){ stat('<span style="color:var(--warn)">글자는 읽었지만 항목을 못 찾았습니다</span>'
      +(viaOcr?'<br><span class="muted" style="font-size:11px">스캔 상태가 나쁘면 인식이 어렵습니다 — 직접 입력하세요.</span>':'')); return; }
    stat('<span style="color:#16a34a">✓ '+keys.length+'개 항목 판독'+(viaOcr?' <span class="chip warn" style="font-size:10px">OCR</span>':'')+'</span>');
    if(viaOcr) _docOcr=true;
    Object.assign(_docFound,got); renderDocIntake();
    openDocConfirm(kind);                     // 원본을 보며 값을 확인·수정하고 반영한다
  };
  var fail=function(e){ stat('<span style="color:var(--danger)">읽기 실패: '+esc((e&&e.message)||e)+'</span>'); };
  var ocrPath=function(bufOrFile){    // 스캔 → 그림을 글자로
    stat('<span class="muted">스캔 문서 — OCR 시작…</span>');
    var prep = isPdf ? pdfPageCanvases(bufOrFile,2) : imgCanvas(bufOrFile).then(function(c){return [c];});
    prep.then(function(cvs){ return ocrCanvases(cvs,function(m){ stat('<span class="muted">'+esc(m)+'</span>'); }); })
        .then(function(t){ done(t,true); }).catch(fail);
  };
  if(!isPdf){ ocrPath(file); return; }
  stat('<span class="muted">읽는 중… '+esc(nm)+'</span>');
  var rd=new FileReader();
  rd.onload=function(){
    var buf=new Uint8Array(rd.result);
    pdfText(buf).then(function(txt){
      if(txt&&txt.replace(/\s/g,'').length>=40) done(txt,false);   // 텍스트 PDF — 100% 정확
      else ocrPath(buf);                                           // 스캔 PDF → OCR
    }).catch(function(){ ocrPath(buf); });
  };
  rd.onerror=function(){ stat('<span style="color:var(--danger)">파일을 열 수 없습니다</span>'); };
  rd.readAsArrayBuffer(file);
}
/* ══════════ 정관 (charters/{기금}/{판}) ══════════
   대표 지시 2026-09-05 — 「기금정보에 정관도 있어야 한다. 정관 원본 스켄된것 있어야 하고
   추후에 수정변경할 경우 비교대조와 변경사항 관련 회의록 까지 만들 수 있어야 한다.
   우선은 기금정보에 정관을 넣고 ocr로 정리되고 클릭시 팝업 원본 볼 수 있게 해달라.」

   ⚠ 판을 «덮어쓰지» 않는다. 올릴 때마다 새 판으로 쌓는다 — 나중에 판끼리 대조하고
     무엇이 바뀌었는지 뽑으려면 옛 판이 남아 있어야 한다. 정관 변경은 인가 사항이라
     「언제 무엇이 어떻게 바뀌었나」를 못 대면 곤란해진다.
   ⚠ 전문은 funds 에 안 넣는다(42개가 늘 켜져 있는 자리다). 볼 때만 읽는다. */
var _chRead=null;                      // 방금 읽은 정관 — 사람이 [저장]을 눌러야 들어간다
function charterRead(txt,viaOcr,zid){
  var t=String(txt||'').replace(/\r/g,'').replace(/[ \t]+\n/g,'\n').trim();
  var body=t.replace(/\s/g,'');
  if(body.length<200){
    dzStat(zid,'<span style="color:var(--warn)">글자가 너무 적습니다('+body.length+'자) — 정관이 맞는지 확인하세요</span>');
    return;
  }
  _chRead={fid:S.fundId,text:t,chars:body.length,ocr:!!viaOcr};
  dzStat(zid,'<span style="color:#16a34a">✓ '+body.length.toLocaleString()+'자 읽음</span>');
  openCharterConfirm();
}
function openCharterConfirm(){
  var r=_chRead; if(!r) return;
  var f=funds[r.fid]||{};
  showModal('<div class="row" style="margin:0 0 10px"><h2 style="margin:0">📜 정관 확인</h2>'
    +(r.ocr?'<span class="chip warn" style="font-size:10px">OCR — 오독 가능</span>'
           :'<span class="chip ok" style="font-size:10px">글자 그대로 읽음</span>')
    +'<span class="muted" style="font-size:11.5px">'+esc(f.short_name||f.name||'')+' · '+r.chars.toLocaleString()+'자</span>'
    +hlp('doc.charter')+'</div>'
    +'<div class="dcsplit">'
      +'<div class="dcprev">'
        +'<div class="row" style="margin:0 0 6px"><b style="font-size:12px">첨부 원본</b><span style="flex:1"></span>'
        +'<button onclick="docReOcr()" style="padding:2px 8px;font-size:11px">🔍 다시 읽기(OCR)</button></div>'
        +'<div id="dcPrev">'+_docPrevHTML()+'</div></div>'
      +'<div class="dcform"><div class="row" style="margin:0 0 6px"><b style="font-size:12px">읽은 정관</b>'
        +'<span class="muted" style="font-size:11px">고칠 수 있습니다</span></div>'
        /* 저장 전에 오독을 잡는 «유일한» 자리다 — 읽기 전용으로 두면 틀린 채로 쌓인다 */
        +'<textarea id="chText" style="width:100%;height:58vh;border:1px solid var(--line);border-radius:8px;'
        +'padding:10px 12px;background:var(--bg);font-size:12px;line-height:1.7;resize:vertical">'
        +esc(r.text)+'</textarea></div>'
    +'</div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:12px"><button onclick="closeM()">취소</button>'
    +'<button class="primary" onclick="saveCharter()">이 내용으로 새 판 저장</button></div>',{width:1060});
}
function saveCharter(){
  var r=_chRead; if(!r){ closeM(); return; }
  var fid=r.fid;
  if(S.fundId!==fid){ toast('다른 기금에서 읽은 정관입니다 — 다시 올려 주세요','warn'); closeM(); return; }
  /* 창에서 고친 글자를 쓴다 — 판독 원값을 그대로 쌓으면 오독을 잡은 보람이 없다 */
  var el=$('chText');
  var text=el?String(el.value||'').trim():r.text;
  var chars=text.replace(/\s/g,'').length;
  if(chars<200){ toast('글자가 너무 적습니다('+chars+'자) — 정관이 맞는지 확인하세요','warn'); return; }
  var rec={at:ymd(),by:(S.user||''),chars:chars,ocr:r.ocr?true:null,text:text};
  fbDb.ref(NS+'/charters/'+fid).push().set(rec).then(function(){
    _chRead=null; S.chFor=null; closeM();
    _audit(fid,'정관 저장',r.chars.toLocaleString()+'자'+(r.ocr?' (OCR)':''));
    if(S.fundId===fid) renderFund();
    toast('정관을 새 판으로 저장했습니다');
  }).catch(function(e){ toast('저장 실패: '+((e&&e.message)||e),'err'); });
}
/* 판 목록 — 화면에 「몇 판」인지 보이려면 있어야 한다. 본문(text)은 뺀다(무겁다). */
function charterLoad(){
  var fid=S.fundId;
  if(S.chFor===fid) return true;
  var _k=fid; S.chFor=_k; S.ch=null;
  fbDb.ref(NS+'/charters/'+fid).once('value').then(function(sn){
    if(S.chFor!==_k) return;
    var v=sn.val()||{};
    S.ch=Object.keys(v).map(function(k){ var o=v[k]||{};
      return {id:k,at:o.at||'',by:o.by||'',chars:o.chars||0,ocr:!!o.ocr}; })
      .sort(function(a,b){ return String(b.at).localeCompare(String(a.at)); });
    if(S.tab==='info'&&S.view==='fund') renderFund();
  }).catch(function(){ if(S.chFor===_k){ S.ch=[]; if(S.tab==='info'&&S.view==='fund') renderFund(); } });
  return false;
}
/* 전문 보기 — 그때 한 벌만 읽는다 */

/* ══════════ 서류 확인 창 — 왼쪽 원본 · 오른쪽 값 ══════════
   경력관리(kcareer.html)의 편집 창과 «같은 결»이다(대표 지시 2026-09-05
   「경력관리의 지금 이 화면을 참고해서 만들어라」).

   ⚠ 값만 보여 주면 오독을 알아챌 수가 없다. 원본을 나란히 놓아야 「이 글자가 저 글자로
     잘못 읽혔구나」가 보인다. OCR 은 반드시 틀린다 — 틀린 것을 «찾을 수 있게» 하는 것이
     이 창의 일이다.
   ⚠ 값은 «고칠 수 있다». 못 고치게 두면 오독을 발견해도 손쓸 방법이 없어 결국
     반영한 뒤 아래 칸에서 다시 고치게 된다. */
var _docSrc=null;
function _docPrevHTML(){
  var d=_docSrc;
  if(!d||!d.url) return '<div class="muted" style="padding:24px 4px;text-align:center">원본을 띄울 수 없습니다</div>';
  if(d.isPdf) return '<embed src="'+esc(d.url)+'" type="application/pdf" style="width:100%;height:60vh;border:1px solid var(--line);border-radius:8px">';
  return '<img src="'+esc(d.url)+'" style="width:100%;border:1px solid var(--line);border-radius:8px">';
}
function openDocConfirm(kind){

/* ══════════ 변경 기록 · 내보내기 · 담당 확인 ══════════
   대표 검토 2026-08-24 ⑧⑨⑩. 노동청·공단에 내는 숫자인데 누가 언제 고쳤는지 남지

/* ── ⑧ 변경 기록 (audit/{기금}/{순번}) ──
   ⚠ 자주 일어나는 일은 «담지 않는다». 예산 칸 하나 고칠 때마다 기록하면 기록이
     기금 자료보다 커지고, 정작 중요한 것이 파묻힌다. 노동청·공단에 나가는 숫자가
     바뀌는 자리만 남긴다 — 기금 정보 · 결산 확정 · 월마감 · 대부.
   ⚠ 실패해도 «하던 일을 막지 않는다». 기록은 곁다리다 — 이것 때문에 저장이 안 되면
     주객이 뒤바뀐다. */
function _audit(fid,what,detail){
  try{
    if(!fid) return;
    fbDb.ref(NS+'/audit/'+fid).push().set({at:new Date().toISOString().slice(0,19).replace('T',' '),
      by:(S.user||'?'), what:String(what||''), detail:String(detail||'').slice(0,300)});
  }catch(e){}
}

/* ── ⑩ 담당이 아닌 기금을 고칠 때 한 번 묻는다 ──
   ⚠ «막지» 않는다. 작은 사무소라 서로 대신 봐 주는 일이 흔하다 — 잠그면 일이 멈춘다.
     실수로 남의 기금을 고치는 것만 막는다. */
function _isMine(f){
  var me=String(S.user||'').trim(); if(!me) return true;      // 누구인지 모르면 묻지 않는다
  if(String((f&&f.manager)||'').indexOf(me)>=0) return true;
  if(((f&&f.mgr_main)||{}).name===me) return true;
  return ((f&&f.mgr_subs)||[]).some(function(x){ return x&&x.name===me; });
}
function askIfNotMine(f,what){
  if(_isMine(f)) return Promise.resolve(true);
  var mgr=((f&&f.mgr_main)||{}).name||f.manager||'(미지정)';
  return confirmM('이 기금의 담당은 '+mgr+' 입니다.\n'+what+' 을(를) 진행할까요?',{ok:'진행'});
}

   ⚠ 실데이터가 그대로 담긴다 — 파일을 아무 데나 두지 말 것. ⓘ 에 적어 두었다.
   ⚠ «되돌리기»는 넣지 않는다. 통째로 덮어쓰는 단추는 잘못 누르면 42개가 한 번에
     날아간다. 지운 기금은 [🗑 삭제 보관함]에서 되살린다. */
/* ══ 백업·복구 ══ 상단 ⚙ 로 연다.
   전에는 사이드바 메뉴에 「⬇ 전체 백업」으로 있었는데, 기금 현황·청구 관리와 같은 층에
   놓여 «화면으로 가는 것»처럼 보였다. 실제로는 파일 내려받기라 도구 자리로 옮겼다.

   ⚠ 되돌리기는 «이미 있다». 어제 이 창을 만들 때 그것을 못 보고 「되돌리기는 앱 안에
     아직 없다」고 적어 두었다 — 틀린 안내였다. 공용 부품 js/pu-backup.js 가 매일 첫
     접속 때 fund_erp 를 통째로 떠서 «30시점»을 보관하고, 화면 왼쪽 아래 [백업·복구]
     단추로 그중 하나를 골라 되돌린다.

     둘은 하는 일이 다르니 둘 다 둔다 —
       시점 복원(pu-backup)  자료를 «서버 안에» 둔다. 되돌리기가 빠르다.
       이 창의 내려받기      자료를 «서버 밖으로» 뺀다. 서버 자체가 잘못돼도 남는다.
     담는 뿌리는 같다(fund_erp) — 한쪽만 반쪽인 것이 아니다. */
function showBackup(){

    +'<p><b>기금을 실수로 지우셨을 때</b> — 기금 현황 › <b>🗑 삭제 보관함</b>에서 <b>↩ 복원</b>으로 되살립니다. '
    +'이 파일은 필요 없습니다.</p>'

    +'<p class="muted" style="font-size:12px">둘은 하는 일이 다릅니다 — <b>시점 복원</b>은 자료를 '
    +'<b>서버 안에</b> 두는 것이라 되돌리기가 빠르고, <b>이 창의 내려받기</b>는 <b>서버 밖으로</b> '
    +'빼 두는 것이라 서버 자체에 문제가 생겨도 남습니다. 둘 다 해 두는 편이 안전합니다.</p>'

function saveInfo(){
  var patch={};
  FIELDS.forEach(function(c){ if(c[0]==='manager')return; var el=$('fd-'+c[0]); if(el)patch[c[0]]=el.value.trim?el.value.trim():el.value; });
  // 담당: 셀렉트가 있으면 주/부담당 저장, 없으면(폴백) 텍스트
  var mainEl=$('fd-mgr-main');
  if(mainEl){
    var list=_staffCache||[]; function byId(sid){return list.filter(function(u){return u.sid===sid;})[0];}
    var mainSid=mainEl.value, mainU=byId(mainSid);
    var subs=[].slice.call(document.querySelectorAll('.fd-mgr-sub:checked')).map(function(c){return c.value;})
      .filter(function(sid){return sid!==mainSid;}).map(byId).filter(Boolean).map(function(u){return {sid:u.sid,name:u.name};});
    patch.mgr_main=mainU?{sid:mainU.sid,name:mainU.name}:null;
    patch.mgr_subs=subs.length?subs:null;
    patch.manager=[mainU?mainU.name:''].concat(subs.map(function(s){return s.name+'(부)';})).filter(Boolean).join(', ');
  } else { var txt=$('fd-mgr-text'); if(txt)patch.manager=txt.value.trim(); }
  /* 임원 명부 — 화면에 표가 그려져 있을 때만 건드린다.
     다른 화면에서 저장할 때 null 로 덮어써 명부를 통째로 날리지 않게. */
  var offs=_readOfficers();
  if(offs) patch.officers=offs.length?offs:null;
  // 저장 대상 기금을 고정 — 응답 오기 전에 다른 기금으로 옮겨도 그쪽 로컬값이 오염되지 않게
  var _fid=S.fundId;
  /* 바뀐 항목만 보낸다 — 화면을 열어둔 사이 다른 세션이 고친 다른 칸을
     내 화면의 옛 값으로 되돌려버리는 것(마지막 저장자 승) 방지. */
  var cur=funds[_fid]||{}, changed={};
  Object.keys(patch).forEach(function(k){
    var a=patch[k], b=cur[k];
    if(k==='mgr_main'||k==='mgr_subs'){ if(JSON.stringify(a||null)!==JSON.stringify(b||null)) changed[k]=a; return; }
    if(String(a==null?'':a)!==String(b==null?'':b)) changed[k]=a;
  });
  if(!Object.keys(changed).length){ clearDirty(); toast('변경된 내용이 없습니다'); return; }
  patch=changed;
  var _lbl=FIELDS.filter(function(c){ return patch.hasOwnProperty(c[0]); }).map(function(c){ return c[1]; });
  askIfNotMine(cur,'기금 정보 저장').then(function(ok){
    if(!ok) return;
    fbDb.ref(NS+'/funds/'+_fid).update(patch).then(function(){
      if(funds[_fid]) Object.assign(funds[_fid],patch);
      _audit(_fid,'기금 정보 저장',_lbl.join(' · ')||Object.keys(patch).join(' · '));
      if(S.fundId===_fid){ clearDirty(); renderFund(); toast('저장되었습니다'); }
      else toast('저장되었습니다 (이전 기금)');
    }).catch(function(e){toast('저장 실패: '+e.message,'err');});
  });
}

// ── 참여사업장 (2단계) ──
function num(v){ if(v==null||v==='')return ''; if(typeof v==='number')return Math.round(v);
  var s=String(v).trim(), neg=false;
  if(/^\(.+\)$/.test(s)){ neg=true; s=s.slice(1,-1); }            // (1,000) = 음수
  if(/-\s*$/.test(s)){ neg=true; s=s.replace(/-\s*$/,''); }        // 1,000- = 음수
  var plain=s.replace(/,/g,'');
  if(/^[+-]?\d*\.?\d+e[+-]?\d+$/i.test(plain)){ var sci=parseFloat(plain); return isNaN(sci)?'':Math.round(neg?-sci:sci); } // 1E+6 지수표기
  s=s.replace(/[^0-9.\-]/g,''); if(s===''||s==='-'||s==='.')return '';
  var n=Math.round(parseFloat(s)); if(isNaN(n))return ''; return neg?-Math.abs(n):n; }
function sitesTab(){
  if(S.sitesFor!==S.fundId){
    var _fid=S.fundId; S.sitesFor=_fid; S.sites=null;
    fbDb.ref(NS+'/sites/'+_fid).once('value').then(function(s){ if(S.sitesFor!==_fid)return; S.sites=s.val()||{}; if(S.tab==='sites'&&S.view==='fund'&&S.fundId===_fid) renderFund(); })
      .catch(function(e){ if(S.sitesFor===_fid){S.sitesFor=null;} if(S.tab==='sites'&&S.view==='fund') renderFund(); });
    return '<div class="panel">'+loadingHTML()+'</div>';
  }
  var sites=S.sites||{};
  var arr=Object.keys(sites).map(function(k){var o=Object.assign({},sites[k]);o._id=k;return o;})
    .filter(function(s){return s.status!=='closed';});

function editSite(sid,prefill){

    +'<div class="grid">'+flds+'</div>'

function saveSite(sid){
  var base = sid ? ((S.sites&&S.sites[sid])||{}) : Object.assign({status:'active'}, _sitePrefill||{});  // 신규는 연결 프리필(puerp_co_id 등) 보존
  var obj=Object.assign({}, base);
  SITE_FIELDS.forEach(function(c){var el=$('se-'+c[0]);if(el)obj[c[0]]=el.value.trim();});
  WREP_FIELDS.forEach(function(c){var el=$('sw-'+c[0]);if(el)obj[c[0]]=el.value.trim();});
  if(!obj.name){ toast('상호를 입력하세요','warn'); return; }
  // 담당자: 기존 contacts 배열 유지하되 대표 담당자 항목만 갱신(없으면 추가)
  var pc=_primaryContact(obj), cv={};
  CONTACT_FIELDS.forEach(function(c){var el=$('sc-'+c[0]);if(el)cv[c[0]]=el.value.trim();});
  var hasContact=cv.name||cv.mobile||cv.email||cv.position;
  var list=pc.list.slice();
  if(hasContact){
    var item={name:cv.name||'',position:cv.position||'',phone:'',mobile:cv.mobile||'',email:cv.email||'',isPrimary:true};
    if(pc.idx>=0){ list[pc.idx]=Object.assign({},list[pc.idx],item); } else { list.unshift(item); }
  } else if(pc.idx>=0){ list.splice(pc.idx,1); }   // 담당자 비우면 대표 항목 제거
  obj.contacts=list;
  var _fid=S.fundId;   // 저장 대상 기금 고정(응답 전 이동 대비)
  var done=function(){ _sitePrefill=null; if(S.sitesFor===_fid)S.sitesFor=null; closeM();
    if(S.view==='fund'&&S.fundId===_fid)renderFund(); toast('사업장이 저장되었습니다'); };
  var err=function(e){ toast('저장 실패: '+(e&&e.message||e),'err'); };
  if(sid){
    /* 기존 사업장은 set(전체 덮어쓰기)이 아니라 update(이 화면에서 다룬 항목만)로 저장한다.
       다른 세션이 이 화면에 없는 필드를 고쳐 놨어도 그 값이 지워지지 않게 하기 위함. */
    var patch={contacts:list};
    SITE_FIELDS.concat(WREP_FIELDS).forEach(function(c){ if(Object.prototype.hasOwnProperty.call(obj,c[0])) patch[c[0]]=obj[c[0]]; });
    /* ⚠ wrep_doc 은 여기 목록에 없다 — update 는 적힌 칸만 건드리므로 연결이 살아남는다.
       set(전체 덮어쓰기)으로 바꾸면 저장할 때마다 재직증명서 연결이 사라진다. */
    if(obj.status) patch.status=obj.status;
    fbDb.ref(NS+'/sites/'+_fid+'/'+sid).update(patch).then(done).catch(err);
  }else{
    fbDb.ref(NS+'/sites/'+_fid).push().set(obj).then(done).catch(err);
  }
}
/* 「푸른이알피 업체 연결」은 2025년에 «불필요»로 단추를 뗐고(4d7937b), 그 뒤로
   부르는 곳 없이 코드만 남아 있었다 — 함께 지운다.
   되살릴 일이 생기면 그 커밋에서 꺼내면 된다(_normCo·loadCompanies·_coContacts·
   companyToSite·pickCompany·renderCoList·chooseCompany 일곱 개가 한 덩이다). */
/* ══ 사업장 연도별 기록 ══ site_years/{기금}/{연도}/{사업장} = {contrib 출연금, workers 근로자수, benef 수혜자수}
   사업장 명부(sites)는 현재 상태 1벌만 두고, 해마다 달라지는 값은 여기에 따로 쌓는다. */
var SY_COLS=[['contrib','출연금(원)'],['workers','상시근로자(명)'],['benef','수혜자(명)'],
  ['sales','매출액(원)']];
function syLoad(){
  var fid=S.fundId, yr=S.year, key=fid+'/'+yr;
  if(S.syFor===key) return true;
  S.syFor=key; S.sy=null;
  fbDb.ref(NS+'/site_years/'+fid+'/'+yr).once('value').then(function(s){
    if(S.syFor!==key) return;
    S.sy=s.val()||{};
    if((S.tab==='sites'||S.tab==='subsidy')&&S.view==='fund') renderFund();   // 지원금 한도 계산도 출연금을 쓴다
  }).catch(function(){ if(S.syFor===key){ S.sy={}; if((S.tab==='sites'||S.tab==='subsidy')&&S.view==='fund') renderFund(); } });
  return false;
}
function sySet(sid,k,v){

    S.sy=S.sy||{}; S.sy[sid]=S.sy[sid]||{}; S.sy[sid][k]=val;

  }).catch(function(e){ toast('저장 실패: '+e.message,'err'); });
}
function syCopyPrev(){
  var fid=S.fundId, yr=S.year;
  confirmM((yr-1)+'년 사업장 연도별 값을 '+yr+'년으로 불러올까요?\n이미 입력된 '+yr+'년 값은 그대로 둡니다.',{ok:'불러오기'}).then(function(ok){
    if(!ok)return;
    fbDb.ref(NS+'/site_years/'+fid+'/'+(yr-1)).once('value').then(function(s){
      var prev=s.val()||{}, cur=S.sy||{}, up={}, n=0;
      Object.keys(prev).forEach(function(sid){
        SY_COLS.forEach(function(c){
          var pv=num(prev[sid][c[0]])||0;
          if(pv&&!num((cur[sid]||{})[c[0]])){ up[sid+'/'+c[0]]=pv; n++; }
        });
      });
      if(!n){ toast((yr-1)+'년에 가져올 값이 없습니다','warn'); return; }
      fbDb.ref(NS+'/site_years/'+fid+'/'+yr).update(up).then(function(){

      });
    });
  });
}

/* ── 참여사업장 엑셀 끌어놓기 → 열 자동 인식 → 미리보기 → 일괄 등록 ── */
function _digits(v){ return String(v==null?'':v).replace(/\D/g,''); }   // 사업자번호 비교용(구분기호 무시)
var SITE_COLMAP=[
  ['name',        ['상호','사업장명','회사명','업체명','기업명','사업장','회사']],
  ['ceo',         ['대표자','대표','대표이사','성명']],
  ['biz_no',      ['사업자등록번호','사업자번호','사업자','등록번호']],
  ['biz_type',    ['업종','업태','종목']],
  ['company_size',['상시근로자','근로자수','인원','상시','직원수','근로자']],
  ['address',     ['소재지','주소','사업장주소']],
  ['seq_label',   ['번호','연번','순번','no']]
];
function _pickCol(headers,cands){
  for(var i=0;i<headers.length;i++){
    var h=String(headers[i]||'').replace(/\s/g,'');
    for(var j=0;j<cands.length;j++) if(h && h.indexOf(cands[j].replace(/\s/g,''))>=0) return i;
  }
  return -1;
}
function bindSiteXlsx(){ _dzHandler['dz-sites']=function(files){ readSiteXlsx(files[0]); }; }
var _sitePend=null;
function readSiteXlsx(file){
  if(!file) return;
  if(typeof XLSX==='undefined'){ dzStat('dz-sites','<span style="color:var(--danger)">엑셀 라이브러리 로드 실패 — 새로고침</span>'); return; }
  dzStat('dz-sites','<span class="muted">읽는 중… '+esc(file.name||'')+'</span>');
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var best=null;
      wb.SheetNames.forEach(function(sn){
        var rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:''});
        // 헤더행 찾기 — '상호/사업장명/회사명' 계열이 있는 첫 줄
        for(var r=0;r<Math.min(rows.length,15);r++){
          if(_pickCol(rows[r],SITE_COLMAP[0][1])>=0){
            var map={}; SITE_COLMAP.forEach(function(m){ var i=_pickCol(rows[r],m[1]); if(i>=0)map[m[0]]=i; });
            if(!best||Object.keys(map).length>Object.keys(best.map).length) best={sheet:sn,rows:rows,hdr:r,map:map};
            break;
          }
        }
      });
      if(!best){ dzStat('dz-sites','<span style="color:var(--warn)">사업장 표를 못 찾았습니다</span><br><span class="muted" style="font-size:11px">첫 행에 <b>상호</b>(또는 사업장명·회사명) 열이 있어야 합니다.</span>'); return; }
      var out=[];
      for(var r=best.hdr+1;r<best.rows.length;r++){
        var row=best.rows[r]; if(!row) continue;
        var o={};
        Object.keys(best.map).forEach(function(k){ o[k]=String(row[best.map[k]]==null?'':row[best.map[k]]).trim(); });
        if(!o.name) continue;
        if(/합\s*계|소\s*계|총\s*계/.test(o.name)) continue;      // 합계행 제외
        o.company_size=String(num(o.company_size)||'');
        out.push(o);
      }
      if(!out.length){ dzStat('dz-sites','<span style="color:var(--warn)">데이터 행이 없습니다</span>'); return; }
      // 읽기 시작 시점의 기금을 고정 — 미리보기 중 다른 기금으로 옮겨도 그 기금에 등록되지 않게
      _sitePend={list:out,sheet:best.sheet,cols:Object.keys(best.map),fid:S.fundId,fname:(funds[S.fundId]&&(funds[S.fundId].short_name||funds[S.fundId].name))||''};
      dzStat('dz-sites','<span style="color:var(--ok,#16a34a)">✓ '+out.length+'개 사업장 인식 ('+esc(best.sheet)+')</span>');
      renderSitePend();
    }catch(e){ dzStat('dz-sites','<span style="color:var(--danger)">읽기 실패: '+esc(e.message||e)+'</span>'); }
  };
  rd.readAsArrayBuffer(file);
}
function renderSitePend(){
  var box=$('siteXlsxOut'); if(!box) return;
  if(!_sitePend){ box.innerHTML=''; return; }
  var L=_sitePend.list, show=L.slice(0,8);
  var LBL={name:'상호',ceo:'대표자',biz_no:'사업자번호',biz_type:'업종',company_size:'상시근로자',address:'소재지',seq_label:'번호'};
  box.innerHTML='<div style="border:1px solid var(--acc);border-radius:9px;padding:10px 12px;background:#f8fafc;margin-top:10px">'
    +'<div class="row" style="margin-bottom:6px"><b style="font-size:13px">'+L.length+'개 사업장 인식</b>'
    +'<span class="muted" style="font-size:11.5px;margin-left:6px">인식된 열: '+_sitePend.cols.map(function(c){return LBL[c]||c;}).join(' · ')+'</span>'
    +'<span style="flex:1"></span><button class="primary" onclick="commitSiteXlsx()" style="padding:4px 12px">＋ '+L.length+'개 등록</button>'
    +'<button onclick="_sitePend=null;renderSitePend();dzStat(\'dz-sites\',\'\')" style="padding:4px 10px;margin-left:4px">취소</button></div>'
    +'<div style="overflow-x:auto"><table style="font-size:12px"><thead><tr><th>상호</th><th>대표자</th><th>사업자번호</th><th>업종</th><th style="text-align:right">근로자</th><th>소재지</th></tr></thead><tbody>'
    +show.map(function(s){ return '<tr><td style="font-weight:600">'+esc(s.name)+'</td><td>'+esc(s.ceo||'—')+'</td><td>'+esc(s.biz_no||'—')
      +'</td><td>'+esc(s.biz_type||'—')+'</td><td style="text-align:right">'+esc(s.company_size||'—')+'</td>'
      +'<td class="muted" style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(s.address||'—')+'</td></tr>'; }).join('')
    +'</tbody></table></div>'+(L.length>show.length?'<div class="muted" style="font-size:11.5px;margin-top:4px">…외 '+(L.length-show.length)+'개</div>':'')
    +'<div class="muted" style="font-size:11.5px;margin-top:6px">기존 사업장은 그대로 두고 <b>추가</b>합니다. 같은 사업자번호는 건너뜁니다.</div></div>';
}
function commitSiteXlsx(){
  if(!_sitePend||!_sitePend.list.length) return;
  var fid=_sitePend.fid, list=_sitePend.list;      // 읽을 때 고정한 기금에 등록
  if(!fid||!funds[fid]){ toast('대상 기금을 찾을 수 없습니다 — 다시 올려주세요','err'); return; }
  var nm=_sitePend.fname||fid;
  confirmM('['+nm+']에 사업장 '+list.length+'건을 등록할까요?\n(사업자번호가 이미 있는 곳은 건너뜁니다)',{ok:'등록'}).then(function(ok){
    if(!ok) return;
    // 중복 검사는 캐시가 아니라 서버 최신값으로 — 다른 세션이 그새 추가했을 수 있음
    return fbDb.ref(NS+'/sites/'+fid).once('value').then(function(s){
      var cur=s.val()||{}, haveBiz={};
      Object.keys(cur).forEach(function(k){ var b=_digits(cur[k].biz_no||''); if(b)haveBiz[b]=1; });
      var add={}, n=0, skip=0, base=Object.keys(cur).length;
      list.forEach(function(x){
        var b=_digits(x.biz_no||'');
        if(b&&haveBiz[b]){ skip++; return; }
        if(b) haveBiz[b]=1;
        var id=fbDb.ref(NS+'/sites/'+fid).push().key; n++;
        add[id]={name:x.name,ceo:x.ceo||'',biz_no:x.biz_no||'',biz_type:x.biz_type||'',
                 company_size:x.company_size||'',address:x.address||'',
                 seq_label:x.seq_label||String(base+n),status:'active'};
      });
      if(!n){ toast('추가할 사업장이 없습니다(모두 중복)','warn'); return null; }
      return fbDb.ref(NS+'/sites/'+fid).update(add).then(function(){
        _sitePend=null;
        if(S.sitesFor===fid) S.sitesFor=null;                       // 해당 기금 캐시만 무효화
        if(S.view==='fund'&&S.fundId===fid&&S.tab==='sites') renderFund();
        toast(n+'개 사업장이 등록되었습니다'+(skip?(' · 중복 '+skip+'개 건너뜀'):''));
      });
    }).catch(function(e){ toast('등록 실패: '+(e&&e.message||e),'err'); });
  });
}

function annualTab(f){
  var key=S.fundId+'/'+S.year;
  if(S.annualFor!==key){
    var _k=key; S.annualFor=_k; S.annual=null;
    fbDb.ref(NS+'/annual/'+S.fundId+'/'+S.year).once('value').then(function(s){ if(S.annualFor!==_k)return; S.annual=s.val()||{}; if(S.tab==='annual'&&S.view==='fund') renderFund(); })
      .catch(function(){ if(S.annualFor===_k)S.annualFor=null; if(S.tab==='annual'&&S.view==='fund') renderFund(); });
    return '<div class="panel">'+loadingHTML()+'</div>';
  }
  var done=S.annual||{};
  var items=ANNUAL_TMPL.filter(function(t){ return !(t[4] && f.fund_type==='사내'); });  // SUP는 공동만
  var nDone=items.filter(function(t){return done[t[0]]&&done[t[0]].done;}).length;
  /* 기한은 «글자»가 아니라 «상태»다 — 오늘과 견줘 지났으면 빨강, 다가오면 주황.
     예전에는 기한 날짜만 찍혀 있어, 지났는지는 사람이 달력을 보고 세야 했다. */
  var today=ymd(), nLate=0;
  var rows=items.map(function(t){
    var d=done[t[0]]&&done[t[0]].done;
    var st=dueState(dueDateOf(t,S.year),!!d,today);
    if(st.k==='late') nLate++;
    var dl=fmtDeadline(t[3]), tail='';
    if(dl){
      var col=st.k==='late'?'var(--danger)':st.k==='soon'?'var(--warn)':'var(--sub)';
      tail=' · <span style="color:'+col+(st.k==='late'?';font-weight:700':'')+'">'+dl
        +(st.k==='late'?' · '+st.days+'일 지남':st.k==='soon'?' · D-'+st.days:'')+'</span>';
    }
    return '<div style="display:flex;align-items:flex-start;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)'+(d?';opacity:.55':'')+'">'
      +'<input type="checkbox"'+(d?' checked':'')+' onchange="toggleAnnual(\''+t[0]+'\',this.checked)" style="margin-top:3px">'
      +'<div style="flex:1"><div style="font-size:13px;font-weight:600'+(d?';text-decoration:line-through':'')+'">'+esc(t[2])+'</div>'
      +'<div class="muted" style="font-size:11.5px">'+esc(t[1])+tail+'</div></div></div>';
  }).join('');
  return '<div class="panel"><div class="row"><h2>연간 일정</h2>'+hlp('close.report')+yearSel()
    +'<span class="stat">진행 '+nDone+'/'+items.length+'</span>'
    +(nLate?'<span class="stat" style="background:var(--danger-bg,#f8fafc);color:var(--danger)">기한 지남 '+nLate+'</span>':'')
    +'<span style="flex:1"></span></div>'
    +'<div style="margin-top:10px">'+rows+'</div></div>';
}
function toggleAnnual(code,on){ var _key=S.fundId+'/'+S.year;

    .then(function(){ if(S.annualFor===_key){ if(!S.annual)S.annual={}; S.annual[code]={done:on}; }

/* ══════════ 지원금 — 근로복지공단 지원사업 규칙 ══════════
   출처: 「2025년 근로복지기금 지원사업 시행 안내」(근로복지넷 공지) + 별지 제3호의2 심사위원회 평가표.

   ※ 평가표는 **2025년에 개정**됐다(별지 제3호의2 <신설 2021.1.14., 2022.5.12., 2023.5.25., 2025>).
      원본: 03_과거자료/2025년/2025년_근로복지기금_지원사업_안내/[첨부4] 설명자료(2025).pdf 17쪽.
        · 정성(사업계획) 30 → **40점** — 「소규모기업 근로자 복지증진에 기여 정도」 신설(4항목 × 10점)
        · ① 출연÷신청 25 → **15점**(가중치 5→3)
        · ② 세부기준 단일화 — **②-2(상위 3개소 비중) 삭제**, 최다 기업 비중만 본다
        · ③ 「1인당 이미 지원받은 금액」 삭제 → **「참여기업 1개소당 평균 근로자수」**(15점)
        · ④ 참여 기업 수 15점 (그대로)
      해마다 rubric 으로 갈라 쓴다 — 옛 해의 셈이 새 배점으로 바뀌면 그때 낸 서류와 어긋난다. */
var SUB_RULE={
  '2026':{ per_worker:930000, apply_period:'연도별 공고 확인 — 2026년 시행계획 미확인', rubric:'2025' },
  '2025':{ per_worker:930000, apply_period:'상반기 3.4.~4.18. (하반기는 별도 공지)', rubric:'2025' },
  '2024':{ per_worker:930000, apply_period:'상반기 3.15.~4.30.', rubric:'2024' },
  '2023':{ per_worker:930000, apply_period:'상반기 (연도별 공고 확인)', rubric:'2024' },
  '2022':{ per_worker:888000, apply_period:'상반기 (연도별 공고 확인)', rubric:'2024' }
};
/* 모르는 해 — 종전에는 2025년 규칙을 그대로 돌려주어, 2027년 화면에도
   「접수: 상반기 3.4.~4.18.」 이 **사실처럼** 떴다. 그대로 믿으면 접수 시기를 놓친다.
   셈은 가장 가까운 해의 1인당 단가로 하되, 어느 해 기준인지와 «미확인»임을 화면에 적는다. */
function subRule(y){
  var k=String(y); if(SUB_RULE[k]) return SUB_RULE[k];
  var ys=Object.keys(SUB_RULE).map(Number).sort(function(a,b){ return a-b; });
  var n=Number(y)||0, near=ys[0];
  ys.forEach(function(v){ if(Math.abs(v-n)<Math.abs(near-n)) near=v; });
  var b=SUB_RULE[String(near)];
  return {per_worker:b.per_worker, rubric:b.rubric, unconfirmed:near,
          apply_period:k+'년 시행계획 미확인 — 근로복지넷 공고를 확인하세요 ('+near+'년 단가로 셈함)'};
}
// 지원요건(출연 주체)별 구간 한도 — 고시 제8·9조
var SUB_REQ=[['1','둘 이상의 기업이 공동기금에 출연'],['2','대기업(원청)이 중소기업 공동기금에 출연'],['3','지방자치단체가 중소기업 공동기금에 출연']];
var SUB_BAND={ '1':[200000000,500000000,1000000000,2000000000],     // 2억·5억·10억·20억 (기간 3·3·4·5년)
               '2':[200000000,300000000,500000000,1000000000],      // 2억·3억·5억·10억 (매년 한도내)
               '3':[200000000,400000000,600000000] };               // 2억·4억·6억 (설립일부터 3년)
var SUB_BAND_LBL={ '1':['2억','5억','10억','20억'],'2':['2억','3억','5억','10억'],'3':['2억','4억','6억'] };
/* 구간은 '참여 사업장 수 **또는** 근로자 수'라서 둘 중 유리한(높은) 구간을 쓴다. */
function subTier(nSite,nEmp,type){
  var sc = type==='3'?[10,30]:[5,10,30], ec = type==='3'?[500,1000]:[100,500,1000];
  var i=0; while(i<sc.length && nSite>=sc[i]) i++;
  var j=0; while(j<ec.length && nEmp>=ec[j]) j++;
  return Math.max(i,j);
}
// 평가표 정량 항목 — 점수(1~5, 0=지원 배제)
function _subP1(ratio){ return ratio>=2?5:ratio>=1.75?4:ratio>=1.5?3:ratio>=1.25?2:ratio>=1?1:0; }  // ①출연÷신청
function _subP2a(r){ return r<.5?5:r<.6?4:r<.7?3:r<.8?2:r<.9?1:0; }        // ②-1 최다 기업 근로자 비중
function _subP2b(r){ return r<.7?5:r<.75?4:r<.8?3:r<.85?2:r<.9?1:0; }      // ②-2 상위 3개소 비중(참여 10개소 이상만)
function _subP3(v){ return v<=400000?5:v<=600000?4:v<=800000?3:v<=1000000?2:1; }  // ③1인당 이미 지원받은 금액(2024년판)
/* ③ 2025년판 — 참여기업 1개소당 평균 근로자수(전체 근로자수 ÷ 전체 참여기업 수).
   «적을수록» 높은 점수다(소규모기업 공동기금을 밀어주려는 개정 취지). 사람이 넣을 값이 아니라
   참여사업장 집계에서 저절로 나온다 — 그래서 2025년판에는 ③ 입력칸이 없다. */
function _subP3avg(v){ return v<30?5:v<50?4:v<80?3:v<100?2:1; }
function _subP4(n){ return n>=30?5:n>=10?4:n>=5?3:n>=3?2:n>=2?1:0; }      // ④참여 기업 수
/* 지원금 산정 — 한도 3중 제약과 심사점수 차등지원율을 함께 계산한다.
   한도: ㉮구간 한도 ㉯근로자 1인당 한도×근로자수 ㉰출연(예정)금 100% → 셋 중 가장 작은 값
   지원율: 80점↑ 100% / 60~80 75% / 40~60 50% / 40미만 배제 */
function subsidyCalc(o){
  var rule=subRule(o.year), type=String(o.type||'1');
  var nSite=num(o.nSite)||0, nEmp=num(o.nEmp)||0, contrib=num(o.contrib)||0, apply=num(o.apply)||0;
  var tier=subTier(nSite,nEmp,type);
  var band=(SUB_BAND[type]||SUB_BAND['1'])[tier]||0, bandLbl=(SUB_BAND_LBL[type]||[])[tier]||'-';
  if(type==='1'&&nSite>=50&&nEmp>=1500){ band=3000000000; bandLbl='30억(지역·산업단위)'; }
  var perW=nEmp*rule.per_worker;
  var maxApply=Math.min(band,perW,contrib||Infinity);
  if(!isFinite(maxApply)) maxApply=Math.min(band,perW);
  var ratio=apply>0?contrib/apply:0;
  var p1=_subP1(ratio);
  /* 2025년 개정판과 그 이전판을 해마다 갈라 쓴다 — 옛 해를 새 배점으로 셈하면
     그때 실제로 받은 점수와 어긋나, 지나간 신청을 되짚을 수 없게 된다. */
  var r25=String(rule.rubric||'2024')==='2025';
  var w1=r25?3:5;                                  // ① 15점(2025) / 25점(그 이전)
  var qualMax=r25?40:30;                           // 정성 40점(2025) / 30점
  var p2a=_subP2a(nEmp?(num(o.maxEmp)||0)/nEmp:1);
  // ②-2(상위 3개소)는 2025년 「세부기준 단일화」로 없어졌다. 옛 해에서는 참여 10개소 이상만 적용.
  var p2b=r25?5:(nSite>=10?_subP2b(nEmp?(num(o.top3)||0)/nEmp:1):5);
  var p2=Math.min(p2a,p2b);
  var avgEmp=nSite?nEmp/nSite:0;                   // ③ 2025년판 — 참여기업 1개소당 평균 근로자수
  var p3=r25?_subP3avg(avgEmp):_subP3(num(o.prevPerWorker)||0);
  var p4=_subP4(nSite);
  var excluded=(p1===0||p2===0||p4===0);
  var qual=Math.max(0,Math.min(qualMax,num(o.qual)||0));
  var score=p1*w1+p2*3+p3*3+p4*3+qual;
  var rate=score>=80?1:score>=60?.75:score>=40?.5:0;
  var expect=(excluded||!apply)?0:Math.min(Math.round(apply*rate),band,perW);
  return {tier:tier,band:band,bandLbl:bandLbl,perWorkerLimit:perW,perWorker:rule.per_worker,
    maxApply:maxApply,ratio:ratio,p1:p1,p2:p2,p2a:p2a,p2b:p2b,p3:p3,p4:p4,qual:qual,
    rubric:r25?'2025':'2024',w1:w1,qualMax:qualMax,avgEmp:avgEmp,
    score:score,rate:rate,expect:expect,excluded:excluded,
    quant:p1*w1+p2*3+p3*3+p4*3};
}
// 지원금 하위탭 전환 — 미저장 입력이 있으면 확인 후 이동(그냥 바꾸면 입력이 사라짐)
function goSubTab(t){ _leaveGuard().then(function(ok){ if(!ok)return; S.subTab=t; renderFund(); }); }
function subsidyTab(f){
  if(!S.subTab||!SUB_TABS.some(function(t){return t[0]===S.subTab;})) S.subTab='apply';
  var bar='<div class="tabbar" style="margin:0 0 12px">'+SUB_TABS.map(function(t){
    return '<div class="tab'+(S.subTab===t[0]?' on':'')+'" onclick="goSubTab(\''+t[0]+'\')" style="font-size:12.5px;padding:6px 11px">'+t[1]+'</div>';
  }).join('')+'</div>';

    : S.subTab==='docs' ? subsidyDocsPanel(f)
    : S.subTab==='helper' ? subsidyHelperPanel(f)
    : S.subTab==='excel' ? subsidyExcelPanel(f)
    : S.subTab==='board' ? subBoardPanel()
    : subsidyApplyPanel(f);
  return bar+body;
}
/* 신청액은 «출연금 총액»이다. 지어낸 규칙이 아니라 실제 제출본이 그렇다 —
   참여사 출연금 + 지자체 출연금 = 신청액
   (충남 4호 272,800,000 + 409,200,000 = 682,000,000 등 여러 건에서 딱 맞았다).
   한도·점수 화면이 이미 같은 셈을 하지만, 거기까지 가서 [이 금액]·[저장]을 눌러야 했다.

   ⚠ 한도를 넘으면 «한도»를 준다 — 넘겨 신청하면 배제되거나 깎인다.
   ⚠ 값은 칸에 «넣어 주기만» 한다. 저장은 사람이 누른다 — 조용히 덮어쓰지 않는다. */
function _subPullAmt(f){
  var yd=(f.years&&f.years[S.year]&&f.years[S.year].subsidy)||{};
  var g=_subPlanAgg(f); var gov=num(yd.gov_contrib)||0;
  var raw=(g.siteContrib||0)+gov;
  if(!raw) return {amt:0,why:''};
  var why='참여사 출연금 '+(g.siteContrib||0).toLocaleString()+'원'
    +(gov?' + 지자체 출연금 '+gov.toLocaleString()+'원':'');
  var amt=raw, cap=0;
  try{
    var type=String(yd.req_type||(gov?'3':'1'));
    var qual=(yd.qual_score!=null&&yd.qual_score!=='')?num(yd.qual_score):18;
    var prev=(yd.prev_per_worker!=null&&yd.prev_per_worker!=='')?num(yd.prev_per_worker):_subPrevPerWorker(f,g.nEmp);
    var base=subsidyCalc(Object.assign({},g,{contrib:raw,year:S.year,type:type,apply:1,qual:qual,prevPerWorker:prev}));
    cap=base.maxApply||0;
    /* ⚠ 자르지 않는다. 실제 제출본은 한도를 넘겨 낸 것으로 보인다 —
       검증 사례의 신청액 682,000,000원은 유형3 한도(6억)보다 크다.
       우리가 조용히 줄이면 «실제로 낸 금액»과 다른 값을 넣게 된다.
       넘는다는 사실만 알리고, 얼마로 낼지는 사람이 정한다. */
    if(cap&&raw>cap) why+=' (한도 '+cap.toLocaleString()+'원을 넘습니다 — 확인하세요)';
  }catch(e){}
  return {amt:amt,why:why};
}
/* 눌렀을 때 — 칸에 넣고, 어디서 왔는지 말해 준다 */
function subPullApply(){
  var f=funds[S.fundId]; if(!f) return;
  var r=_subPullAmt(f);
  if(!r.amt){ toast('당겨올 출연금이 없습니다 — 참여사업장 › 연도별 기록에 그 해 출연금을 넣어 주세요','warn'); return; }
  var e=$('su-request_amount'); if(!e) return;
  e.value=r.amt.toLocaleString(); markDirty();
  toast(r.amt.toLocaleString()+'원을 넣었습니다 — '+r.why+' · [저장]을 눌러야 남습니다');
}
/* ══ 지원금 ⑥ 입력 도우미 ══
   근로복지넷에는 «사람이 직접» 로그인해 값을 친다. 우리가 대신 로그인하지 않는 까닭은 둘이다 —
   ① 인증서·간편인증을 앱이 들고 있으면, 그 앱이 공단 계정으로 가는 샛길이 된다.
   ② 공단 화면에는 열린 통로(API)가 없다. 화면을 긁는 방식은 공단이 화면을 바꾸는 날
      «조용히 다른 값»을 보낸다 — 지원금 신청에서 그건 안 된다.
   그래서 옮겨 적는 일만 돕는다: 칸 차례대로 값을 세우고, 칸마다 [복사]를 둔다.

   ⚠ 칸 차례는 «별지 제1호서식 지원신청서»를 그대로 따랐다 — 공단이 받는 종이가
     곧 화면이 묻는 것이다. 지어낸 차례가 아니다. 실제 화면과 다르면 여기를 고친다.
   ⚠ 값은 «우리가 가진 것»만 세운다. 없으면 빈 채로 두고 «어디서 채우는지»를 알려 준다 —
     그럴듯하게 채우면 관청에 틀린 값이 간다.
   ⚠ 서식에 «있는 칸»과 «자주 묻지만 서식엔 없는 칸»을 갈라 둔다. 섞으면 어느 것이
     서식이 요구한 값인지 알 수 없다. */
function _subNetRows(f){
  var b=_boss(f), g=_subPlanAgg(f);
  var yd=(f.years&&f.years[S.year]&&f.years[S.year].subsidy)||{};
  var gov=num(yd.gov_contrib)||0;
  var out=(g.siteContrib||0)+gov;
  var req=num(yd.request_amount)||0;
  var N=function(n){ return n?String(n):''; };
  return [
    ['신청인', 1, [
      {k:'기금법인명',   v:f.name||'',        go:'info'},
      {k:'대표자',       v:b.name||f.chairman||'', go:'info'},
      {k:'소재지',       v:f.address||'',     go:'info'},
      {k:'전화',         v:f.phone||'',       go:'info'},
      {k:'기금인가번호', v:f.inka_no||'',     go:'info'},
      {k:'법인등록번호', v:f.corp_reg_no||'', go:'info'}
    ]],
    ['참여사업장 현황', 1, [
      {k:'참여사업장 수', v:N(g.nSite), unit:'개사', go:'sites'},
      {k:'상시근로자 수', v:N(g.nEmp),  unit:'명',  go:'sites'}
    ]],
    ['지원 규모', 1, [
      {k:'출연(예정) 금액', v:N(out), unit:'원', go:'sites',
       why:'참여사업장 › 연도별 기록에 그 해 출연금을 넣으세요'},
      {k:'지원신청 금액',   v:N(req), unit:'원', go:'sub:apply',
       why:'신청·정산에서 [당겨오기] 뒤 [저장]을 누르세요'}
    ]],
    ['그 밖에 자주 묻는 것', 0, [
      {k:'고유번호', v:f.tax_id_no||'', go:'info'},
      {k:'인가일',   v:f.inka_date?_dotDate(f.inka_date):'', go:'info'}
    ]]
  ];
}
/* ⚠ 금액·사람 수는 «쉼표 없는 숫자»를 복사한다. 화면에는 쉼표를 넣어 보여 주되,
     관공서 입력칸은 쉼표를 안 받는 곳이 많다. 무엇을 복사했는지는 알림으로 말해 준다. */

function subsidyHelperPanel(f){

     아직 안 읽었는데 그리면 「0개사·0명」이 뜬다 — 맞는 값처럼 보이지만 «모르는» 값이다.

  syLoad();
  var groups=_subNetRows(f), flat=[], rows='';
  groups.forEach(function(gr){

      +esc(gr[0])+(gr[1]?'':' <span class="muted" style="font-weight:400">— 별지 제1호서식에는 없지만 자주 묻습니다</span>')
      +'</th></tr>';
    gr[2].forEach(function(r){
      var i=flat.length; flat.push({k:r.k,v:r.v});
      var go=/^sub:/.test(r.go) ? "goSubTab('"+r.go.slice(4)+"')" : "goTab('"+r.go+"')";
      var show=/^[0-9]+$/.test(r.v) ? Number(r.v).toLocaleString() : esc(r.v);
      rows+='<tr><th style="width:150px;text-align:left">'+esc(r.k)+'</th>'
        +(r.v
          ? '<td style="font-weight:600">'+show+(r.unit?' <span class="muted" style="font-weight:400">'+r.unit+'</span>':'')+'</td>'
            +'<td style="width:86px;text-align:right"><button onclick="subNetCopy('+i+')" style="padding:2px 10px;font-size:11.5px;white-space:nowrap">복사</button></td>'

/* ══ 지원금 ① 한도·점수 ══
   우리가 이미 가진 데이터(참여사업장 상시근로자수·출연금)로 세 한도와 예상 심사점수를 계산한다.
   핵심은 **신청액을 얼마로 쓰느냐**다 — 신청액이 커지면 출연÷신청 비율이 떨어져 점수가 깎이고,
   점수가 한 구간(80/60/40점) 아래로 내려가면 지원율이 100%→75%→50%로 뚝 떨어져
   신청액을 올렸는데 받는 돈이 오히려 줄어든다. 출연금보다 많이 신청하면 아예 배제된다.
   그래서 시나리오 표로 기대 수령액이 가장 큰 신청액을 찾아 준다. */
function _subPlanAgg(f){
  var act=Object.keys(S.sites||{}).map(function(k){ var s=S.sites[k]; return Object.assign({_id:k},s); })
    .filter(function(s){ return s.status!=='closed'; });
  var sy=S.sy||{};
  var emps=act.map(function(s){ return num(s.company_size)||0; }).sort(function(a,b){return b-a;});
  var nYear=0, nBase=0;
  var contrib=act.reduce(function(t,s){
    var y=num((sy[s._id]||{}).contrib)||0;                 // 그 해 값이 있으면 우선
    if(y){ nYear++; return t+y; }
    var b=num(s.contrib)||0; if(b) nBase++;
    return t+b;
  },0);
  return { nSite:act.length, nEmp:emps.reduce(function(a,b){return a+b;},0),
    maxEmp:emps[0]||0, top3:emps.slice(0,3).reduce(function(a,b){return a+b;},0),
    siteContrib:contrib, contrib:contrib, nYear:nYear, nBase:nBase, noContrib:act.length-nYear-nBase };
}
// ③ 1인당 이미 지원받은 금액 — 지난 연도 결정액 ÷ 그 해 근로자수의 누계(근로자수 자료가 없으면 현재 인원으로 추정)
function _subPrevPerWorker(f,nEmp){
  var ys=(f&&f.years)||{}, sum=0;
  Object.keys(ys).forEach(function(y){
    if(+y>=S.year) return;
    var d=num(((ys[y]||{}).subsidy||{}).decided_amount)||0;
    if(d&&nEmp) sum+=d/nEmp;
  });
  return Math.round(sum);
}

function _subScoreRows(g,c){
  var pct=function(a,b){ return b?((a/b*100).toFixed(1)+'%'):'-'; };
  var r25=(c.rubric==='2025');
  var r=[
    ['① 출연(예정)금 ÷ 신청액', c.p1*c.w1+'/'+(5*c.w1), c.ratio?(c.ratio.toFixed(2)+'배 → '+c.p1+'점 × '+c.w1):'신청액을 입력하세요'],
    ['② 근로자수 편중', c.p2*3+'/15', '최다 기업 '+g.maxEmp+'/'+g.nEmp+' = '+pct(g.maxEmp,g.nEmp)+' → '+c.p2a+'점'

    ['④ 참여 기업 수', c.p4*3+'/15', g.nSite+'개사 → '+c.p4+'점 × 3'],
    ['정성평가(사업계획)', c.qual+'/'+c.qualMax,
      r25?'타당성·구체성 · 정책부합성 · 복지개선 정도 · 소규모기업 기여도 — 4항목 × 10점, 심사위원 평가'
         :'사업계획·정책부합성·복지개선 정도 — 심사위원 평가']
  ];
  var body=r.map(function(x){ return '<tr><td>'+x[0]+'</td><td style="text-align:right;font-weight:600">'+x[1]+'</td><td class="muted">'+esc(x[2])+'</td></tr>'; }).join('');

    +' <span class="muted" style="font-weight:400">예상 수령 '+(c.expect||0).toLocaleString()+'원</span></td></tr>';
  return body;
}
function _subScnRows(g,type,qual,prev,cur){
  var cands=[], contrib=num(g.contrib)||0;
  [2,1.75,1.5,1.25,1].forEach(function(d){ if(contrib) cands.push(Math.floor(contrib/d)); });
  var base=subsidyCalc(Object.assign({},g,{type:type,apply:1,qual:qual,prevPerWorker:prev}));
  cands.push(base.maxApply);
  if(cur) cands.push(num(cur)||0);
  cands=cands.filter(function(v){ return v>0 && v<=base.maxApply; })
    .filter(function(v,i,a){ return a.indexOf(v)===i; }).sort(function(a,b){return a-b;});
  if(!cands.length) return '<tr><td colspan="7" class="muted" style="padding:12px">출연금을 입력하면 시나리오를 계산합니다.</td></tr>';
  var rows=cands.map(function(a){ return {a:a,c:subsidyCalc(Object.assign({},g,{type:type,apply:a,qual:qual,prevPerWorker:prev}))}; });
  var best=rows.reduce(function(m,x){ return (!m||x.c.expect>m.c.expect)?x:m; },null);
  return rows.map(function(x){
    var on=(x===best), same=(num(cur)===x.a);
    return '<tr'+(on?' style="background:var(--ok-bg,#f0fdf4);font-weight:600"':'')+'>'
      +'<td style="text-align:right">'+x.a.toLocaleString()+'</td>'
      +'<td style="text-align:right">'+x.c.ratio.toFixed(2)+'</td>'
      +'<td style="text-align:right">'+(x.c.p1*5)+'</td>'
      +'<td style="text-align:right">'+x.c.score+'</td>'
      +'<td style="text-align:right">'+(x.c.excluded?'배제':Math.round(x.c.rate*100)+'%')+'</td>'
      +'<td style="text-align:right">'+(x.c.expect||0).toLocaleString()+'</td>'

function _subPlanRead(){

  var g2=Object.assign({},g,{contrib:(num(g.siteContrib)||0)+gov});   // 지자체 출연금까지 더한 총 출연금
  return { g:g2, gov:gov, type:String(el('sp-req')||g.type||'1'), qual:num(el('sp-qual'))||0,
    prev:num(el('sp-prev'))||0, apply:num(el('sp-apply'))||0 };
}
function subPlanRecalc(){

  var s=$('sp-score'); if(s) s.innerHTML=_subScoreRows(v.g,c);

function saveSubPlan(){

     안 그리는 칸을 0 으로 덮어써 두면, 나중에 그 해 배점을 되짚을 때 근거가 사라진다. */

/* ══════════ 대부 대장 (loans/{기금}/{대부번호}) ══════════
   근로자대부금은 여태 «자산 계정 한 줄»로만 있었다 — 별지15호 ㉗에 금액은 들어가는데
   누가 얼마 빌려 얼마 남았는지는 어디에도 없었다(대표 검토 2026-08-24, ④).

   ⚠ 연도 아래 두지 않는다. 대부는 여러 해에 걸쳐 갚는다 — 연도 아래 두면 이듬해에
     잔액이 통째로 사라진다. 대신 «갚은 해»별로 상환액을 담는다(paid:{연도:금액}).
   ⚠ 주민등록번호·계좌번호는 «칸 자체를 두지 않는다». 대장에 필요 없고, 한 번 담기면
     지우기 어렵다(회사 방침 — 급여자료함·기업정보함과 같은 규칙).
   ⚠ 대부는 «기본재산»으로만 할 수 있다(근로복지기본법 제62조·정관 제5조②).
     수익금으로 하는 목적사업과 성격이 다르다. */
var LOAN_FIELDS=[['name','차용자','text'],['site','사업장','text'],['date','실행일','date'],
  ['amount','대부액(원)','text'],['purpose','용도','text'],['due','상환 예정','text'],['note','비고','text']];

/* 대장 합계 — 순수 계산(검사 대상).
   잔액 = 대부액 − 갚은 것 «전부». 그 해 것만 빼면 이월된 대부가 매년 되살아난다. */
function loanSum(list,yr){
  var t={amount:0,paidAll:0,paidYr:0,balance:0,open:0,newAmt:0,newCnt:0};
  (list||[]).forEach(function(l){
    var amt=num(l.amount)||0, pays=l.paid||{}, all=0, py=0;
    Object.keys(pays).forEach(function(y){ var v=num(pays[y])||0; all+=v; if(String(y)===String(yr)) py+=v; });
    t.amount+=amt; t.paidAll+=all; t.paidYr+=py; t.balance+=(amt-all);
    if(amt-all>0) t.open++;
    if(String(l.date||'').slice(0,4)===String(yr)){ t.newAmt+=amt; t.newCnt++; }
  });
  return t;
}
function loanBal(l){
  var pays=(l&&l.paid)||{}, all=0;
  Object.keys(pays).forEach(function(y){ all+=num(pays[y])||0; });
  return (num(l&&l.amount)||0)-all;
}
/* 대장과 «장부»를 함께 읽는다 — 대장만 보면 맞는지 알 수 없다.
   기금이나 해가 바뀌면 다시 읽는다(다른 기금 잔액과 견주면 늘 틀리다고 나온다). */
function loanLoad(){
  var fid=S.fundId, yr=S.year, key=fid+'/'+yr;
  if(S.loanFor===key) return true;
  var _k=key; S.loanFor=_k; S.loans=null; S.loanFin=null;
  Promise.all([
    fbDb.ref(NS+'/loans/'+fid).once('value').then(function(sn){ return sn.val()||{}; }).catch(function(){ return {}; }),
    fbDb.ref(NS+'/txns/'+fid+'/'+yr).once('value').then(function(sn){ var v=sn.val()||{};
      return Object.keys(v).map(function(k){ var o=Object.assign({},v[k]); o._id=k; return o; }); }).catch(function(){ return []; })
  ]).then(function(r){
    if(S.loanFor!==_k) return;
    S.loans=r[0];
    S.loanFin=computeFin(r[1],fid,yr);
    if(S.tab==='welfare'&&S.view==='fund') renderFund();
  }).catch(function(){ if(S.loanFor===_k){ S.loans={}; S.loanFin=null;
    if(S.tab==='welfare'&&S.view==='fund') renderFund(); } });
  return false;
}
function loanTab(f){
  if(!loanLoad()) return '<div class="panel">'+loadingHTML('대부 대장을 읽는 중…')+'</div>';
  var m=S.loans||{}, yr=S.year;
  var arr=Object.keys(m).map(function(k){ var o=Object.assign({},m[k]); o._id=k; return o; })
    .sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); });
  var t=loanSum(arr,yr);
  var book=S.loanFin?Math.round(S.loanFin.loan):null;      // 장부의 근로자대부금 잔액
  var off=(book!=null)&&Math.round(t.balance)!==book;
  var W=function(v){ return Number(Math.round(v||0)).toLocaleString(); };
  var rows=arr.map(function(l,i){
    var bal=loanBal(l), py=num((l.paid||{})[yr])||0;
    return '<tr><td class="no">'+(i+1)+'</td>'

function saveLoan(id){

/* ══════════ 회계장부 (더존식) ══════════
   승인된 거래를 원천으로 분개장 → 계정별원장 → 월계표 → 합계잔액시산표 → 재무제표(전기 대비)
   순서로 파생시킨다. 숫자는 어디서 봐도 같은 원천에서 나온다.
   전기이월(opening)은 각 장부의 '기초' 한 줄로 들어가 잔액이 이어진다. */
/* 전기이월(기초잔액) 칸 ↔ 계정 대응. **화면·저장·시산표·조정이 모두 이 표를 따라가야 한다** —
   칸만 늘리고 저장 목록을 안 고쳐 매도가능증권 전기이월이 저장되지 않은 일이 있었다. */
var OPEN_ACCT={cash:'현금성자산',savings:'정기예금',loan:'근로자대부금',secu:'매도가능증권',
               /* 비영리조직회계기준으로 결산하는 기금의 계정 — 없으면 다음 해로 이월할 자리가 없다 */
               accrued:'미수수익',recv:'미수금',stfund:'단기금융상품',spcash:'특정현금과예금',
               /* 회계법인 결산본(U사내 2019)에 있던 계정 — 이월할 자리가 없어 연말에 사라졌다 */
               prepaid:'선납세금',payable:'미지급비용',
               spresv:'손실대비특별적립금',
               basic:'기본재산',retained:'이월잉여금',
               /* 준비금은 1·2를 갈라 이월한다. **번호는 공식 서식이 정해 둔 것**이다 —
                  근로복지공단 「설립인가신청서 양식」 2.사업계획서 각주:
                    * 고유목적사업준비금1은 **법인세법 제29조**에 의한 준비금임(이자 등)
                    * 고유목적사업준비금2는 **근로복지기본법 제62조2항**에 의한 준비금임(이월)
                  칸이 하나였을 때는 준비금2로 이월하는 기금(C공동 2024: 42,245,952원)이
                  재무상태표에서 준비금1로 표시돼 제출본과 달라졌다. */
               reserve:'고유목적사업준비금1',reserve2:'고유목적사업준비금2'};
function acctType(n){ return ACCT_CHART[n]||'비용'; }
function isDrAcct(n){ var t=acctType(n); return t==='자산'||t==='비용'; }   // 차변 잔액 계정
/* 전기이월 칸에 곁들이는 근거 — 두 준비금은 이름만으로는 무엇이 담기는지 알기 어렵다 */
/* 전기이월 칸에 곁들이는 근거 — 배치(reserve_swap)에 따라 뒤바뀐다.
   이름만으로는 무엇이 담기는지 알 수 없어, 그 기금의 자리대로 적어 준다. */
function _openNote(fid){
  var A='법인세법 §29 · 이자', B='근로복지기본법 §62② · 이월';
  return _rsvSwapOf(fid)?{reserve:B, reserve2:A}:{reserve:A, reserve2:B};
}
function _openingOf(fid,yr){
  var yd=(funds[fid]&&funds[fid].years&&funds[fid].years[yr])||{}; return yd.opening||{};
}
/* 승인 거래 → 분개 배열. 한 거래 = 차변 1 / 대변 1 (통장 기반이라 단순분개) */
/* ══ 분할 분개 ══
   통장 한 줄에 성격이 다른 금액이 함께 찍히는 일이 흔하다 — L공동은 송금 100,500원이
   생활지원금 100,000 + 이체수수료 500이고, 제출한 결산서도 그렇게 갈라 적었다.
   은행이 준 줄은 하나이므로 **통장 잔액 대사를 깨뜨리지 않아야 한다**:
   첫 조각만 입·출금 금액을 지니고 나머지는 nocash로 만들어 금액(amount)으로만 회계에 넣는다.
   조각 합계가 원래 금액과 다르면 저장하지 않는다(splitSave). */
function _splitsOf(x){
  return ((x&&x.splits)||[]).filter(function(s){ return s&&s.acct&&(num(s.amount)||0)>0; });
}
function _splitSum(x){ return _splitsOf(x).reduce(function(s,v){ return s+(num(v.amount)||0); },0); }
/* 계정 지정이 끝난 거래인가 — 분할이면 조각이 둘 이상이고 합계가 거래금액과 같아야 한다 */
function _txnDone(x){
  var sp=_splitsOf(x);
  if(sp.length) return sp.length>=2 && _splitSum(x)===((num(x.deposit)||0)+(num(x.withdraw)||0));
  return !!(x&&x.debit&&x.credit);
}
/* 장부를 만들 때만 조각으로 펼친다 — 저장된 거래는 한 줄 그대로다(통장 대사·중복검사 키 보존) */
function expandSplits(arr){
  var out=[];
  (arr||[]).forEach(function(x){
    var sp=_splitsOf(x);
    if(!sp.length){ out.push(x); return; }
    /* 현금이 오가지 않은 줄은 쪼개지 않고 그대로 둔다.
       조각을 만들 때 «고정 쪽»을 입금/출금 방향으로 정하는데, 둘 다 0이면 방향을 알 수 없어
       credit 을 고정 쪽으로 잡는다 — 그러면 차·대변이 같아져 **금액이 통째로 사라진다**
       (현물출연 72.6억을 쪼개면 기본재산이 0이 됐다).
       쪼개는 창은 금액 0을 이미 막지만, **쪼갠 뒤에 금액을 지우면** 막을 자리가 없다. */
    if(!((num(x.deposit)||0)+(num(x.withdraw)||0))){ out.push(x); return; }
    var isDep=(num(x.deposit)||0)>0;
    var cash=(isDep?x.debit:x.credit)||'현금성자산';
    sp.forEach(function(s,i){
      var o=Object.assign({},x);
      o._id=x._id+'#'+(i+1); o.splits=null; o.amount=num(s.amount)||0;
      /* 조각임을 남긴다 — 금액은 amount 에만 있다. deposit 은 첫 조각이 통장 한 줄 전체를
         지니고 있어(잔액 대사용) 금액으로 쓰면 다른 조각 몫까지 딸려 온다.
         _nocashSrc 는 «원래 줄이 현물출연이었나» — 조각에 붙는 nocash 와 뜻이 다르다. */
      /* _splitDep — 이 조각이 «들어온 돈»인지 «나간 돈»인지.
         조각만 보고는 어느 쪽이 현금 계정인지 알 수 없어, 여기서 적어 둔다.
         (첫 조각만 deposit/withdraw 를 지니므로 그것으로는 못 가린다.) */
      o._split=1; o._nocashSrc=x.nocash?1:0; o._splitDep=isDep?1:0;
      if(isDep){ o.debit=cash; o.credit=s.acct; } else { o.debit=s.acct; o.credit=cash; }
      if(i>0){ o.deposit=0; o.withdraw=0; o.nocash=1; }   // 통장 금액은 첫 조각만 지닌다
      out.push(o);
    });
  });
  return out;
}
function journalOf(arr){
  return expandSplits(arr).filter(function(x){return x.approved&&x.debit&&x.credit;})
    .map(function(x){ return {date:String(x.date||''),memo:String(x.memo||''),
      debit:x.debit,credit:x.credit,amount:num(x.amount)||num(x.deposit)||num(x.withdraw)||0,id:x._id}; })
    .sort(function(a,b){ return a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id)); });
}
/* 계정별 발생액 — {계정:{d,c}} (전기이월 제외, 당기 발생분만) */
function acctMoves(jr){
  var m={};
  jr.forEach(function(e){
    (m[e.debit]=m[e.debit]||{d:0,c:0}).d+=e.amount;
    (m[e.credit]=m[e.credit]||{d:0,c:0}).c+=e.amount;
  });
  return m;
}
/* 전기이월을 계정별 차/대로 환산 */
function openingMoves(op){
  var m={};
  Object.keys(OPEN_ACCT).forEach(function(k){
    var v=num(op[k])||0; if(!v) return;
    var n=OPEN_ACCT[k];
    m[n]=m[n]||{d:0,c:0};
    if(isDrAcct(n)) m[n].d+=v; else m[n].c+=v;
  });
  return m;
}
function _yr(){ return +S.year; }
/* 전기 거래 로딩 — 비교용. 연도가 바뀌면 다시 읽는다(중복 호출 방지 키) */
function loadPrevTxns(){
  var fid=S.fundId, py=_yr()-1, key=fid+'/'+py;
  if(S.txnsPrevFor===key) return;
  S.txnsPrevFor=key; S.txnsPrev=null;
  fbDb.ref(NS+'/txns/'+fid+'/'+py).once('value').then(function(s){
    if(S.txnsPrevFor!==key) return;
    S.txnsPrev=s.val()||{};
    if(S.tab==='closing'&&S.view==='fund') renderFund();
  }).catch(function(){ if(S.txnsPrevFor===key) S.txnsPrev={}; });
}
function prevArr(){
  var t=S.txnsPrev; if(!t) return null;                  // null=아직 로딩 중
  return Object.keys(t).map(function(k){var o=Object.assign({},t[k]);o._id=k;return o;});
}
function _n(v){ return (v||0).toLocaleString(); }
function _nz(v){ return v?_n(v):''; }                    // 0은 빈칸(장부 관례)

// ── 하위 탭 ──
var CLOSE_SUBS=[['txn','거래·분개입력'],['journal','분개장'],['ledger','계정별원장'],
                ['monthly','월계표'],['tb','합계잔액시산표'],['fin','재무제표·전기대비'],
                ['cf','현금흐름표'],['ie','수입지출명세서'],['notes','주석'],['accts','계정과목표'],
                ['budget','예산·집행'],['years','연도별 비교'],['f15','운영상황보고서']];

/* ══════════ 예산·집행 — funds/{기금}/years/{연도}/budget ══════════
   연간 일정에 「차기연도 사업계획·예산 수립, 협의회 상정」이 있는데 그 «결과를 넣을 곳»이
   없었다(대표 검토 2026-08-24, ⑥). 목적사업 탭에 사업별 예산 칸만 있었을 뿐,
   기금 전체 예산서와 집행률은 어디에도 없었다.

   ⚠ 예산은 사람이 정하고, 실적은 «장부가 말한다». 실적 칸은 손으로 못 고친다 —
     고칠 수 있게 두면 집행률이 곧 무의미해진다.
   ⚠ 예산은 협의회가 의결한 숫자다. 앱이 «채워 넣지» 않는다 — 목적사업비만
     [목적사업에서 가져오기]로 옮겨 주고, 그것도 사람이 눌러야 들어간다. */
var BUDGET_ROWS=[
  ['rev','수입',[['rev_contrib','출연금','contrib'],
                 ['rev_interest','기금 운용수익','bizRev'],
                 ['rev_etc','그 밖의 수입','nonopRev']]],
  ['exp','지출',[['exp_purpose','목적사업비','purpose'],
                 ['exp_admin','일반관리비','admin'],
                 ['exp_etc','그 밖의 비용','otherExp']]]
];
/* 그 해 «장부가 말하는» 실적. 출연금은 기본재산으로 들어온 것을 센다
   (별지15호 ⑬+⑮ 와 같은 목록 — 따로 세면 예산서와 보고서가 어긋난다). */
function budgetActual(arr,fin,rep){
  var bf=bfMovesOf(journalOf(arr),rep).filter(function(b){ return b.kind==='employer'||b.kind==='other'; })
    .reduce(function(t,b){ return t+b.amount; },0);
  /* 수익은 bizRev(사업수익) + nonopRev(사업외수익) 로 «갈라서» 본다 — 합쳐 놓은 칸을 쓰면
     준비금환입이 섞여 두 번 세어진다. 그래서 예전의 fin.interest 는 아예 없앴다. */
  return { contrib:bf, bizRev:num(fin.bizRev)||0, nonopRev:num(fin.nonopRev)||0,
           purpose:num(fin.purpose)||0, admin:num(fin.admin)||0, otherExp:num(fin.otherExp)||0 };
}
function budgetOf(fid,yr){
  var yd=(funds[fid]&&funds[fid].years&&funds[fid].years[yr])||{};
  return yd.budget||{};
}
/* 한 줄 계산 — 예산·실적·집행률·남은 것 (순수, 검사 대상) */
function budgetLine(plan,act){
  var p=num(plan)||0, a=num(act)||0;
  return { plan:p, act:a, rest:p-a, rate:p?Math.round(a/p*1000)/10:null };
}
function budgetSet(key,v){
  var fid=S.fundId, yr=S.year, val=num(v)||0;
  fbDb.ref(NS+'/funds/'+fid+'/years/'+yr+'/budget/'+key).set(val||null).then(function(){
    /* funds 는 실시간 구독이라 화면은 스스로 따라온다 — 손으로 또 넣지 않는다 */
    toast('저장됨');
  }).catch(function(e){ toast('저장 실패: '+e.message,'err'); });
}
/* 목적사업비 예산만 [목적사업] 탭에서 옮겨 온다 — 나머지는 협의회가 정하는 숫자다 */
function budgetFromWelfare(){
  var fid=S.fundId, yr=S.year;
  fbDb.ref(NS+'/welfare/'+fid+'/'+yr).once('value').then(function(sn){
    var v=sn.val()||{}, sum=0, cnt=0;
    Object.keys(v).forEach(function(k){ var w=v[k]||{};
      if(w.category==='대부사업') return;              // 대부는 자산이라 목적사업비가 아니다
      var b=num(w.budget)||0; if(b){ sum+=b; cnt++; } });
    if(!sum){ toast(yr+'년 목적사업에 예산이 적힌 사업이 없습니다','warn'); return; }
    confirmM(yr+'년 목적사업 '+cnt+'건의 예산 합계 '+won(sum)+'을\n지출 › 목적사업비 예산으로 넣을까요?',
      {ok:'넣기'}).then(function(ok){ if(!ok) return; budgetSet('exp_purpose',sum); });
  }).catch(function(e){ toast('읽지 못했습니다: '+e.message,'err'); });
}
function budgetView(arr){
  var fid=S.fundId, yr=S.year;
  var fin=computeFin(arr,fid,yr), plan=budgetOf(fid,yr);
  var act=budgetActual(arr,fin,(S.f15Rep||{}));
  var W=function(v){ return Number(Math.round(v||0)).toLocaleString(); };
  var tot={};
  var body=BUDGET_ROWS.map(function(g){
    var sp=0,sa=0;
    var rows=g[2].map(function(r){
      var L=budgetLine(plan[r[0]],act[r[2]]);
      sp+=L.plan; sa+=L.act;
      return '<tr><td>'+esc(r[1])+'</td>'
        +'<td style="text-align:right"><input value="'+esc(L.plan||'')+'" placeholder="0" '
          +'onchange="budgetSet(\''+r[0]+'\',this.value)" '
          +'style="width:130px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;text-align:right"></td>'
        +'<td style="text-align:right">'+W(L.act)+'</td>'
        +'<td style="text-align:right">'+(L.rate==null?'<span class="muted">—</span>'
            :'<span'+(L.rate>100?' style="color:var(--danger);font-weight:700"':'')+'>'+L.rate+'%</span>')+'</td>'
        +'<td style="text-align:right'+(L.rest<0?';color:var(--danger)':'')+'">'+W(L.rest)+'</td></tr>';
    }).join('');
    tot[g[0]]={plan:sp,act:sa};
    return '<tr style="background:var(--bg);font-weight:700"><td colspan="5">'+g[1]+'</td></tr>'+rows
      +'<tr style="font-weight:700"><td>'+g[1]+' 계</td><td style="text-align:right">'+W(sp)+'</td>'
      +'<td style="text-align:right">'+W(sa)+'</td>'
      +'<td style="text-align:right">'+(sp?Math.round(sa/sp*1000)/10+'%':'—')+'</td>'
      +'<td style="text-align:right">'+W(sp-sa)+'</td></tr>';
  }).join('');
  var pDiff=(tot.rev.plan||0)-(tot.exp.plan||0), aDiff=(tot.rev.act||0)-(tot.exp.act||0);
  var noPlan=!BUDGET_ROWS.some(function(g){ return g[2].some(function(r){ return num(plan[r[0]]); }); });
  return '<div class="panel"><div class="row" style="flex-wrap:wrap"><h2 style="font-size:15px">'+yr+'년 예산·집행</h2>'+hlp('close.budget')
    +'<span style="flex:1"></span>'
    +'<button onclick="budgetFromWelfare()" title="목적사업 탭의 사업별 예산 합계를 목적사업비 예산으로 옮깁니다">📥 목적사업에서</button></div>'
    +(noPlan?'<div class="msg warn" style="margin:10px 0;font-size:12px">'
      +'<b>'+yr+'년 예산이 비어 있습니다.</b> 협의회가 의결한 숫자를 예산 칸에 넣으면 집행률이 나옵니다.</div>':'')
    +'<div style="overflow-x:auto;margin-top:10px"><table><thead><tr><th>항목</th>'
    +'<th style="text-align:right;width:150px">예산</th><th style="text-align:right">실적(장부)</th>'
    +'<th style="text-align:right;width:80px">집행률</th><th style="text-align:right">남은 것</th></tr></thead><tbody>'
    +body
    +'<tr style="font-weight:700;border-top:2px solid var(--ink)"><td>수입 − 지출</td>'
    +'<td style="text-align:right">'+W(pDiff)+'</td><td style="text-align:right'+(aDiff<0?';color:var(--danger)':'')+'">'+W(aDiff)+'</td>'
    +'<td colspan="2"></td></tr></tbody></table></div></div>';
}
function closeSub(k){ S.closeSub=k; renderFund(); }
function closeSubBar(){
  if(CLOSE_SUBS.map(function(x){return x[0];}).indexOf(S.closeSub)<0) S.closeSub='txn';
  return '<div class="tabbar" style="margin:10px 0 12px">'+CLOSE_SUBS.map(function(x){
    return '<div class="tab'+(S.closeSub===x[0]?' on':'')+'" onclick="closeSub(\''+x[0]+'\')">'+x[1]+'</div>';
  }).join('')+'</div>';
}
// ── 분개장 ──
function journalView(arr){
  var jr=journalOf(arr);
  if(!jr.length) return '<div class="panel"><div class="muted" style="padding:10px">승인된 분개가 없습니다. [거래·분개입력]에서 계정을 지정하고 승인하세요.</div></div>';
  var tot=jr.reduce(function(s,e){return s+e.amount;},0);
  var rows='', prevDate=null, dayN=0, daySum=0, no=0;
  function dayLine(){
    if(prevDate===null||dayN<2) return '';
    return '<tr style="background:var(--bg);font-size:11.5px;color:var(--sub)"><td colspan="2">'+esc(prevDate)+' 소계 ('+dayN+'건)</td>'
      +'<td></td><td style="text-align:right">'+_n(daySum)+'</td><td></td><td style="text-align:right">'+_n(daySum)+'</td></tr>';
  }
  jr.forEach(function(e){
    if(e.date!==prevDate){ rows+=dayLine(); prevDate=e.date; dayN=0; daySum=0; }
    dayN++; daySum+=e.amount; no++;
    rows+='<tr><td class="no">'+no+'</td><td style="white-space:nowrap">'+esc(e.date)+'</td>'
      +'<td>'+esc(e.debit)+'</td><td style="text-align:right">'+_n(e.amount)+'</td>'
      +'<td>'+esc(e.credit)+'</td><td style="text-align:right">'+_n(e.amount)+'</td>'
      +'<td class="muted mo" style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(e.memo)+'">'+esc(e.memo)+'</td></tr>';
  });
  rows+=dayLine();
  return '<div class="panel"><div class="row"><h2 style="font-size:15px">분개장</h2>'+hlp('close.journal')
    +'<span class="stat">'+jr.length+'건</span><span class="stat">차·대 각 '+_n(tot)+'원</span>'
    +'<span style="flex:1"></span><button onclick="printLedger(\'journal\')">🖨 인쇄</button></div>'
    +'<div style="overflow-x:auto;margin-top:8px"><table><thead><tr><th>번호</th><th>일자</th>'
    +'<th>차변 계정</th><th style="text-align:right">차변</th><th>대변 계정</th><th style="text-align:right">대변</th>'
    +'<th class="mo">적요</th></tr></thead><tbody>'+rows
    +'<tr style="font-weight:700;border-top:2px solid var(--ink)"><td colspan="3">합계</td>'
    +'<td style="text-align:right">'+_n(tot)+'</td><td></td><td style="text-align:right">'+_n(tot)+'</td><td class="mo"></td></tr>'
    +'</tbody></table></div></div>';
}
// ── 계정별원장 ──
function ledgerView(arr){
  var jr=journalOf(arr), op=_openingOf(S.fundId,S.year);
  var used={}; jr.forEach(function(e){ used[e.debit]=1; used[e.credit]=1; });
  Object.keys(openingMoves(op)).forEach(function(n){ used[n]=1; });
  var names=Object.keys(used).sort();
  if(!names.length) return '<div class="panel"><div class="muted" style="padding:10px">원장에 표시할 계정이 없습니다.</div></div>';
  if(names.indexOf(S.ledAcct)<0) S.ledAcct=names[0];
  var acct=S.ledAcct, dr=isDrAcct(acct);
  var sel='<select onchange="S.ledAcct=this.value;renderFund()" style="padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px">'
    +names.map(function(n){var c=acctCode(n);
        return '<option value="'+esc(n)+'"'+(n===acct?' selected':'')+'>'+(c?c+' ':'')+esc(n)+' ('+acctType(n)+')</option>';}).join('')+'</select>';
  var om=openingMoves(op)[acct]||{d:0,c:0};
  var bal=om.d-om.c, sumD=om.d, sumC=om.c;
  var rows='';
  if(om.d||om.c) rows+='<tr style="color:var(--faint)"><td>—</td><td>전기이월</td>'
    +'<td style="text-align:right">'+_nz(om.d)+'</td><td style="text-align:right">'+_nz(om.c)+'</td>'
    +'<td style="text-align:right">'+_n(dr?bal:-bal)+'</td></tr>';
  jr.forEach(function(e){
    if(e.debit!==acct&&e.credit!==acct) return;
    var d=(e.debit===acct)?e.amount:0, c=(e.credit===acct)?e.amount:0;
    sumD+=d; sumC+=c; bal+=d-c;
    var other=(e.debit===acct)?e.credit:e.debit;
    rows+='<tr><td style="white-space:nowrap">'+esc(e.date)+'</td>'
      +'<td>'+esc(e.memo||other)+' <span class="muted mo" style="font-size:11px">('+esc(other)+')</span></td>'
      +'<td style="text-align:right">'+_nz(d)+'</td><td style="text-align:right">'+_nz(c)+'</td>'
      +'<td style="text-align:right;font-variant-numeric:tabular-nums">'+_n(dr?bal:-bal)+'</td></tr>';
  });
  var endBal=dr?bal:-bal;

// ── 월계표 (계정 × 월) ──
function monthlyView(arr){
  var jr=journalOf(arr);
  if(!jr.length) return '<div class="panel"><div class="muted" style="padding:10px">승인된 분개가 없어 월계표를 만들 수 없습니다.</div></div>';
  var M={}, mUsed={};
  jr.forEach(function(e){
    var mo=+String(e.date).slice(5,7)||0; if(mo<1||mo>12) return;
    mUsed[mo]=1;
    [[e.debit,1],[e.credit,-1]].forEach(function(p){
      var n=p[0], sign=p[1]*(isDrAcct(n)?1:-1);        // 그 계정이 늘어난 방향을 +로
      (M[n]=M[n]||{})[mo]=((M[n]||{})[mo]||0)+sign*e.amount;
    });
  });
  var months=[]; for(var i=1;i<=12;i++) if(mUsed[i]) months.push(i);
  var names=Object.keys(M).sort(function(a,b){
    var order={'자산':1,'부채':2,'자본':3,'수익':4,'비용':5};
    return (order[acctType(a)]||9)-(order[acctType(b)]||9)||a.localeCompare(b);
  });
  var head='<tr><th>계정</th><th class="mo">유형</th>'+months.map(function(m){return '<th style="text-align:right">'+m+'월</th>';}).join('')
    +'<th style="text-align:right">합계</th></tr>';
  var rows=names.map(function(n){
    var tot=0;
    var tds=months.map(function(m){ var v=M[n][m]||0; tot+=v;
      return '<td style="text-align:right'+(v<0?';color:var(--danger)':'')+'">'+_nz(v)+'</td>'; }).join('');
    return '<tr><td style="font-weight:600">'+esc(n)+'</td><td class="muted mo">'+acctType(n)+'</td>'+tds
      +'<td style="text-align:right;font-weight:700">'+_n(tot)+'</td></tr>';
  }).join('');
  return '<div class="panel"><div class="row"><h2 style="font-size:15px">월계표</h2>'+hlp('close.monthly')
    +'<span class="stat">'+months.length+'개월 발생</span><span style="flex:1"></span>'
    +'<button onclick="printLedger(\'monthly\')">🖨 인쇄</button></div>'
    +'<p class="muted" style="font-size:11.5px;margin:6px 0 0">+ = 그 계정이 늘어난 방향</p>'
    +'<div style="overflow-x:auto;margin-top:8px"><table><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div></div>';
}
// ── 합계잔액시산표 (제출 서식과 같은 4열) ──
function tbRowsOf(arr,fid,yr){
  var jr=journalOf(arr), mv=acctMoves(jr), om=openingMoves(_openingOf(fid,yr));
  var all={}; Object.keys(mv).forEach(function(n){all[n]=1;}); Object.keys(om).forEach(function(n){all[n]=1;});
  var order={'자산':1,'부채':2,'자본':3,'수익':4,'비용':5};
  return Object.keys(all).sort(function(a,b){
      return (order[acctType(a)]||9)-(order[acctType(b)]||9)||a.localeCompare(b);
    }).map(function(n){
    var m=mv[n]||{d:0,c:0}, o=om[n]||{d:0,c:0};
    var d=m.d+o.d, c=m.c+o.c, net=d-c;
    return {name:n,type:acctType(n),sumD:d,sumC:c,balD:net>0?net:0,balC:net<0?-net:0};
  });
}

// ── 재무제표 · 전기 대비 비교 ──
/* ══════════ 재무제표 3종의 «한 벌 모델» ══════════
   화면과 엑셀 워크북이 각자 줄을 짜면 서로 달라진다 — 실제로 재무상태표는 화면 7줄,
   워크북 12줄로 갈라져 있었다. 여기 한 곳에서만 만든다.

   줄 모양: {lbl, cur, prv, lvl, bold, head}
     lvl  0=대분류(Ⅰ·1.)  1=중분류(가.·1))  2=세부
     head=1 이면 금액 없는 «제목 줄»

   ⚠ 짜임새는 **실제 제출본**을 그대로 따른다(2025 결산서 원본에서 확인).
      재무상태표 : 유동자산(당좌·투자) / 비유동자산(투자자산-근로자대부금) /
                   유동부채 / 비유동부채(준비금1·2) / 자본금(기본재산) / 이익잉여금
      손익계산서 : 1.사업수익 … 10.당기순이익 (열 단계)
      이익잉여금처분계산서 : 1 처분전 … 4 차기이월 */
function stmtBS(fin,prv){
  var R=[], add=function(lbl,c,p,lvl,bold,head){ R.push({lbl:lbl,cur:c,prv:p,lvl:lvl||0,bold:!!bold,head:!!head}); };
  /* 당좌자산 = 현금성자산 + 정기예금 + 그 밖의 유동자산.
     기금의 정기예금은 1년 이내 예치가 보통이라 제출본도 당좌자산에 넣는다. */
  var curA=fin.cash+fin.savings+fin.otherAsset, pCurA=prv.cash+prv.savings+prv.otherAsset;
  // 비유동자산 = 근로자대부금(투자자산) + 매도가능증권
  var ncA=fin.loan+fin.secu, pNcA=prv.loan+prv.secu;
  add('자 산',0,0,0,true,true);
  add('Ⅰ. 유동자산',curA,pCurA,0,true);
  add('가. 당좌자산',fin.cash+fin.savings,prv.cash+prv.savings,1);
  if(fin.otherAsset||prv.otherAsset) add('나. 그 밖의 유동자산',fin.otherAsset,prv.otherAsset,1);
  add('Ⅱ. 비유동자산',ncA,pNcA,0,true);
  add('1. 투자자산',ncA,pNcA,1);
  add('1) 근로자대부금',fin.loan,prv.loan,2);
  if(fin.secu||prv.secu) add('2) 매도가능증권',fin.secu,prv.secu,2);
  add('자 산 총 계',fin.totalAssets,prv.totalAssets,0,true);
/* 비유동부채는 준비금 둘뿐이다. 미지급비용·예수금 같은 것은 «1년 안에 갚을 돈»이라
     유동부채로 가야 한다 — 다 비유동부채로 몰면 밑의 명세와 합계가 어긋난다. */
  var ncL=fin.res1+fin.res2, pNcL=prv.res1+prv.res2;
  var curL=fin.liab-ncL, pCurL=prv.liab-pNcL;
  add('부 채',0,0,0,true,true);
  add('Ⅰ. 유동부채',curL,pCurL,0,true);
  if(curL||pCurL) add('1) 미지급비용 등',curL,pCurL,2);
  add('Ⅱ. 비유동부채',ncL,pNcL,0,true);
  add('1) 고유목적사업준비금1',fin.res1,prv.res1,2);
  add('2) 고유목적사업준비금2',fin.res2,prv.res2,2);
  add('부 채 총 계',fin.liab,prv.liab,0,true);
  add('자 본',0,0,0,true,true);
  add('Ⅰ. 자본금',fin.basic,prv.basic,0,true);
  add('1. 기본재산',fin.basic,prv.basic,1);
  /* 결손이면 이름을 바꿔 «양수로» 적는다 — 재무제표에 음수가 찍히면 안 된다 */
  var rl=_retLabel(fin.retained), isLoss=(rl==='이월결손금');
  /* ⚠ 줄 이름은 «당기»를 따라 하나뿐인데, 전기는 부호가 반대일 수 있다.
     전기에도 _retVal 을 씌워 양수로 만들면 — 당기 결손·전기 잉여인 해에 —
     전기 잉여가 「결손금」 칸에 양수로 앉아, 지난해에도 결손이 났던 것처럼 읽힌다.
     당기 부호를 기준(sgn)으로 삼아 전기는 «부호 그대로» 적는다(반대면 음수로 보인다). */
  var sgn=isLoss?-1:1;
  add(isLoss?'Ⅱ. 결손금':'Ⅱ. 이익잉여금',sgn*(num(fin.retained)||0),sgn*(num(prv.retained)||0),0,true);
  add(isLoss?'1. 미처리결손금':'1. 미처분이익잉여금',sgn*(num(fin.retained)||0),sgn*(num(prv.retained)||0),1);
  add('자 본 총 계',fin.equity,prv.equity,0,true);
  add('부채와 자본총계',fin.totalLiabEq,prv.totalLiabEq,0,true);
  return R;
}
function stmtIS(fin,prv,tbCur,tbPrv){
  var R=[], add=function(lbl,c,p,lvl,bold,head){ R.push({lbl:lbl,cur:c,prv:p,lvl:lvl||0,bold:!!bold,head:!!head}); };
  add('1. 사업수익',fin.bizRev,prv.bizRev,0,true);
  /* 세부는 «실제로 쓴 계정»으로 적는다. 예전엔 사업수익 전액을 「가. 이자수익」 한 줄로 적었는데,
     수익 계정은 이자수익·잡수익 둘이라 잡수익만 있는 해에도 이자수익으로 찍혔다.
     (준비금환입은 사업수익이 아니다 — 별지15호 ㉙ 은 이자·잡수익만 적는다.) */
  var _rk=0;
  ['이자수익','잡수익'].forEach(function(a){
    var v=(tbCur&&tbCur[a])?tbCur[a].bal_c:0, p=(tbPrv&&tbPrv[a])?tbPrv[a].bal_c:0;
    if(!v&&!p) return;
    /* 글머리는 «적은 줄만» 세어 붙인다 — 배열 자리로 고르면 잡수익만 있는 해에 「나.」로 시작한다 */
    add('가나'.charAt(_rk++)+'. '+a,v,p,1);
  });
  add('2. 고유목적사업비용',fin.purpose,prv.purpose,0,true);
  /* 세부 항목은 가·나·다… 로 «이어서» 붙인다 — 전부 「가.」로 적으면 제출본과 달라 보인다 */
  var _GA='가나다라마바사아자차카타파하';
  var _sub=function(list){
    var k=0;
    list.forEach(function(a){
      var v=(tbCur&&tbCur[a])?tbCur[a].bal_d:0, p=(tbPrv&&tbPrv[a])?tbPrv[a].bal_d:0;
      if(!v&&!p) return;
      add((_GA.charAt(k)||'·')+'. '+a,v,p,1); k++;
    });
  };
  /* 목적사업비는 실제로 쓴 계정만 줄을 세운다 — 안 쓴 계정까지 0 으로 늘어놓으면
     열여섯 줄이 되어 읽을 수 없다. 값이 있는 해만 나온다. */
  _sub(PURPOSE_ACCTS);
  add('3. 사업총이익',fin.gross,prv.gross,0,true);
  add('4. 일반관리비',fin.admin,prv.admin,0,true);
  _sub(ADMIN_ACCTS);
  add('5. 사업이익',fin.opInc,prv.opInc,0,true);
  add('6. 사업외수익',fin.nonopRev,prv.nonopRev,0,true);
  /* 글머리는 «적은 줄만» 세어 붙인다 — 준비금1 환입이 없는 해에 「나.」로 시작하면 안 된다
     (사업수익 세부에서 같은 잘못이 있었다). */
  var _nk=0;
  [[fin.rev1,prv.rev1,RESERVE_ACCTS[0]],[fin.rev2,prv.rev2,RESERVE_ACCTS[1]]].forEach(function(x){
    if(!x[0]&&!x[1]) return;
    add(_GA.charAt(_nk++)+'. '+x[2]+' 환입',x[0],x[1],1);
  });
  add('7. 사업외비용',fin.nonopExp,prv.nonopExp,0,true);
  if(fin.resvExp||prv.resvExp) add('가. 고유목적사업준비금 전입액',fin.resvExp,prv.resvExp,1);
  add('8. 법인세차감전순이익',fin.preTax,prv.preTax,0,true);
  add('9. 법인세등',fin.tax||0,prv.tax||0,0);
  add('10. 당기순이익',fin.net,prv.net,0,true);
  return R;
}
function stmtRE(fin,prv){
  var R=[], add=function(lbl,c,p,lvl,bold){ R.push({lbl:lbl,cur:c,prv:p,lvl:lvl||0,bold:!!bold}); };
  var isLoss=(_retLabel(fin.retained)==='이월결손금');
  var op=num((fin.opening||{}).retained)||0, opP=num((prv.opening||{}).retained)||0;
  /* ⚠ 줄 이름은 «당기»를 보고 하나로 정해지는데, 전기는 부호가 반대일 수 있다.
     두 해에 따로 _retVal 을 씌워 각각 양수로 만들면 — 당기 결손·전기 잉여인 해에 —
     전기 잉여가 「결손금」 칸에 양수로 앉아 지난해도 결손이던 것처럼 읽힌다.
     이름을 정한 값의 부호(sgn)를 «두 해에 함께» 씌운다. 반대인 해는 음수로 보인다.
     재무상태표(stmtBS)도 같은 방식이다. */
  var sgn=isLoss?-1:1, sgnOp=(op<0?-1:1), sgnNet=((num(fin.net)||0)<0?-1:1);
  var _r=num(fin.retained)||0, _rP=num(prv.retained)||0;
  add(isLoss?'1. 처분전결손금':'1. 처분전이익잉여금',sgn*_r,sgn*_rP,0,true);
  add((op<0?'1) 전기이월결손금':'1) 전기이월이익잉여금'),sgnOp*op,sgnOp*opP,1);
  add((fin.net<0?'2) 당기순손실':'2) 당기순이익'),sgnNet*(num(fin.net)||0),sgnNet*(num(prv.net)||0),1);
  add('2. 임의적립금등의 이입액',0,0,0);
  add('( 합 계 )',sgn*_r,sgn*_rP,0,true);
  add(isLoss?'3. 결손금처리액':'3. 이익잉여금처분액',0,0,0);
  add('1) 기타적립금',0,0,1);
  add(isLoss?'4. 차기이월결손금':'4. 차기이월이익잉여금',sgn*_r,sgn*_rP,0,true);
  return R;
}
/* 열 단계가 실제로 «맞물리는지» 스스로 본다 — 화면에 띄우기 전에 잡는다.
   3=1-2, 5=3-4, 8=5+6-7, 10=8-9 가 어긋나면 어딘가에서 분류가 새고 있다는 뜻이다. */
function stmtChk(f){
  var e=[];
  if(Math.round(f.gross)!==Math.round(f.bizRev-f.purpose)) e.push('3.사업총이익');
  if(Math.round(f.opInc)!==Math.round(f.gross-f.admin)) e.push('5.사업이익');
  if(Math.round(f.preTax)!==Math.round(f.opInc+f.nonopRev-f.nonopExp)) e.push('8.법인세차감전');
  if(Math.round(f.net)!==Math.round(f.preTax-(f.tax||0))) e.push('10.당기순이익');
  return e;
}
function _cmpRow(lbl,cur,prv,bold){
  var d=cur-prv, pct=prv?((d/Math.abs(prv))*100):null;
  var col=d>0?'var(--ok)':(d<0?'var(--danger)':'var(--faint)');

/* ══════════ 현금흐름표 ══════════
   이카운트 비영리회계에도, 공익법인 결산에도 들어가는 표다. 지금은 없었다.

   기금은 «현금 장부»가 곧 원천이라 직접법으로 짠다 — 실제 입·출금을 성격별로 모은다.
   ⚠ 현금이 오가지 않는 분개(준비금 설정·환입·전입 nocash)는 빼야 한다.
      넣으면 흐름 합계가 통장 잔액과 어긋난다.
   활동 구분
     영업활동 : 출연금 수입·이자·목적사업비·관리비 — 기금의 본디 활동
     투자활동 : 근로자대부금 지급/회수, 정기예금·증권 예치/해지

/* 빌리고 갚는 돈은 재무활동이다 — 없다고 굳혀 두면 영업활동에 조용히 섞인다 */
var CF_FINANCE=['단기차입금','장기차입금','차입금'];
var CF_INVEST=['근로자대부금','정기예금','매도가능증권','단기금융상품','특정현금과예금'];
/* 현금이 실제로 오간 것만, 상대 계정별로 모은다.
   현금흐름표와 수입지출명세서가 «같은 것»을 보게 하려고 한 곳에 둔다 —
   따로 세면 둘이 조용히 어긋난다. */
function cashMoves(arr){
  var appr=expandSplits(arr).filter(function(x){ return x.approved&&x.debit&&x.credit; });
  var by={}, In=0, Out=0;
  appr.forEach(function(x){
    /* ⚠ 쪼갠 조각을 «먼저» 본다. 조각은 첫 것만 통장 금액(deposit/withdraw)을 지니고
       나머지는 nocash 표가 붙는다 — 그대로 두면 아래 nocash 걸러내기에 걸려
       둘째 조각부터 통째로 빠지고, 첫 조각에 통장 한 줄이 전부 몰린다.
       실제로 그랬다: 100,500원을 경조사비 100,000 + 수수료 500 으로 쪼갰더니
       현금흐름표·수입지출명세서에 «경조사비 100,500 · 수수료 0» 으로 찍혔다.
       합계는 맞아서 기말현금 대조로는 드러나지 않았다. */
    if(x._split){
      if(x._nocashSrc) return;                 // 원래 줄이 현물출연이면 현금은 안 움직였다
      var amt=num(x.amount)||0; if(!amt) return;
      var oth=x._splitDep?x.credit:x.debit;
      var bb=(by[oth]=by[oth]||{in:0,out:0});
      if(x._splitDep){ bb.in+=amt; In+=amt; } else { bb.out+=amt; Out+=amt; }
      return;
    }
    if(x.nocash) return;                       // 현금이 안 움직인 분개
    var dep=num(x.deposit)||0, wd=num(x.withdraw)||0;
    if(!dep&&!wd) return;
    /* 현금이 든 쪽의 «상대 계정»이 그 돈의 성격이다 */
    var other=dep?x.credit:x.debit;
    var b=(by[other]=by[other]||{in:0,out:0});
    if(dep){ b.in+=dep; In+=dep; } else { b.out+=wd; Out+=wd; }
  });
  return {by:by,In:In,Out:Out};
}
function cashFlowRows(arr,fid,yr){
  fid=fid||S.fundId; yr=yr||S.year;
  var op=_openingOf(fid,yr)||{};
  var begin=(num(op.cash)||0);
  var mv=cashMoves(arr);
  var OPin={}, OPout={}, INin={}, INout={}, FIin={}, FIout={};
  var opIn=0,opOut=0,invIn=0,invOut=0,fiIn=0,fiOut=0;
  Object.keys(mv.by).forEach(function(other){
    var slot=CF_INVEST.indexOf(other)>=0?'I':(CF_FINANCE.indexOf(other)>=0?'F':'O');
    var b=mv.by[other];
    if(b.in){ ({O:OPin,I:INin,F:FIin})[slot][other]=b.in;
      if(slot==='I')invIn+=b.in; else if(slot==='F')fiIn+=b.in; else opIn+=b.in; }
    if(b.out){ ({O:OPout,I:INout,F:FIout})[slot][other]=b.out;
      if(slot==='I')invOut+=b.out; else if(slot==='F')fiOut+=b.out; else opOut+=b.out; }
  });
  var R=[], add=function(lbl,v,lvl,bold,head){ R.push({lbl:lbl,cur:v,lvl:lvl||0,bold:!!bold,head:!!head}); };
  var line=function(m){ Object.keys(m).sort(function(a,b){return m[b]-m[a];}).forEach(function(k){ add(k,m[k],2); }); };
  add('Ⅰ. 영업활동으로 인한 현금흐름',opIn-opOut,0,true);
  add('1. 유입',opIn,1); line(OPin);
  add('2. 유출',opOut,1); line(OPout);
  add('Ⅱ. 투자활동으로 인한 현금흐름',invIn-invOut,0,true);
  add('1. 유입(회수·해지)',invIn,1); line(INin);
  add('2. 유출(지급·예치)',invOut,1); line(INout);
  add('Ⅲ. 재무활동으로 인한 현금흐름',fiIn-fiOut,0,true);
  if(fiIn||fiOut){ add('1. 유입(차입)',fiIn,1); line(FIin); add('2. 유출(상환)',fiOut,1); line(FIout); }
  var net=(opIn-opOut)+(invIn-invOut)+(fiIn-fiOut);
  add('Ⅳ. 현금의 증가(감소)',net,0,true);
  add('Ⅴ. 기초의 현금',begin,0,true);
  add('Ⅵ. 기말의 현금',begin+net,0,true);
  return {rows:R,begin:begin,net:net,end:begin+net};
}

/* 기본재산은 «들어오기만» 하지 않는다 — 준비금2를 설정할 때 여기서 빠져나간다

    var b=g('기초잔액'), i=g('당기 전입'), o=g('당기 환입'), t=g('기말잔액');
    if(!b||!i||!o||!t) e.push('준비금 변동에 빠진 줄');
    else {
      if(b[1]+i[1]-o[1]!==t[1]) e.push('준비금1 기말잔액');
      if(b[2]+i[2]-o[2]!==t[2]) e.push('준비금2 기말잔액');
    }
  } else e.push('준비금 변동이 통째로 없음');
  var s4=null; N.forEach(function(s){ if(s.h.indexOf('4.')===0) s4=s; });
  if(s4){
    var g4=function(l){ for(var i=0;i<s4.rows.length;i++) if(s4.rows[i][0]===l) return s4.rows[i]; return null; };
    var a=g4('기초'), c=g4('당기 출연'), z=g4('기말');
    /* 감소는 «대변 계정»별로 갈라 적으므로 줄 이름이 하나가 아니다 —
       준비금1·2 설정과 「그 밖의 감소」를 다 더해서 맞물리는지 본다.
       한 줄 이름을 못 박아 찾으면 맞바꿈 기금에서 줄이 없어 헛경보가 난다. */
    var d=0, dn=0;
    RESERVE_ACCTS.forEach(function(x){ var r=g4(x+' 설정'); if(r){ d+=r[1]; dn++; } });
    var re=g4('그 밖의 감소'); if(re){ d+=re[1]; dn++; }
    if(!a||!c||!z) e.push('기본재산 변동에 빠진 줄');
    else if(a[1]+c[1]+d!==z[1]) e.push('기본재산 기말');
  } else e.push('기본재산 변동이 통째로 없음');
  // 대부금도 같은 셈이다 — 기말 = 기초 + 대부 − 회수
  var s5=null; N.forEach(function(s){ if(s.h.indexOf('5.')===0) s5=s; });
  if(s5){

    var p0=g5('기초'), lo=g5('당기 대부'), ri=g5('당기 회수'), pz=g5('기말');
    if(!p0||!lo||!ri||!pz) e.push('대부금 변동에 빠진 줄');
    else if(p0[1]+lo[1]-ri[1]!==pz[1]) e.push('대부금 기말');
  } else e.push('대부금 변동이 통째로 없음');

/* 한글 문서에 그대로 붙여 쓰라고 글자로 뽑는다 — 화면에서 표를 긁으면 칸이 어그러진다.
   화면을 그릴 때 만들어 둔 글자를 쓴다 — 다시 계산하면 화면과 다른 것을 복사할 수 있다. */
function notesText(N){
  var out=[];
  N.forEach(function(s){
    out.push(s.h);
    s.lines.forEach(function(l){ out.push('  '+l[0]+' : '+l[1]); });
    s.rows.forEach(function(r){
      out.push('  '+r[0]+(r[1]==null?'':'  '+_n(r[1]))+(r[2]==null?'':'  '+_n(r[2])));
    });

/* 복사는 한 곳에서만 한다 — 클립보드를 막아 둔 환경이 있어 되돌림 길(textarea)이

function _copyText(t,msg){
  var fb=function(){
    var ta=document.createElement('textarea');
    ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    var okc=false; try{ okc=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    toast(okc?msg:'복사하지 못했습니다',okc?'':'warn');
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(function(){ toast(msg); },fb);
  else fb();
}

/* ══════════ 수입지출명세서 ══════════
   이카운트 비영리회계의 중심 표. 비영리는 «관-항-목»으로 수입과 지출을 나눠 적는다.
   기금의 관·항은 정해져 있다(아래). 목은 계정과목이 그대로 온다. */
/* 비영리는 관-항-목으로 적는다. 목록에 없는 계정은 «기타»로 받는다 —
   빠뜨리면 돈이 오갔는데도 명세서에서 조용히 사라진다. */
var IE_TREE=[
  {gwan:'수입', dir:'입금', hang:[
    {h:'이월금',      carry:true},
    {h:'출연금수입',  accts:['기본재산']},
    {h:'사업수익',    accts:['이자수익','잡수익']},
    {h:'대부금회수',  accts:['근로자대부금']},
    {h:'예금·증권 해지', accts:['정기예금','매도가능증권','단기금융상품','특정현금과예금']},
    {h:'기타수입',    rest:true}
  ]},
  {gwan:'지출', dir:'출금', hang:[
    {h:'고유목적사업비', use:'purpose'},
    {h:'일반관리비',     accts:ADMIN_ACCTS.concat(['법인세등'])},
    {h:'대부금지급',     accts:['근로자대부금']},
    {h:'예금·증권 예치', accts:['정기예금','매도가능증권','단기금융상품','특정현금과예금']},
    {h:'기타지출',       rest:true}
  ]}
];
function ieRows(arr,fid,yr){
  fid=fid||S.fundId; yr=yr||S.year;
  var op=_openingOf(fid,yr)||{};
  var mv=cashMoves(arr), by=mv.by;
  var R=[], add=function(lbl,v,lvl,bold){ R.push({lbl:lbl,cur:v,lvl:lvl||0,bold:!!bold}); };
  /* 이월금은 «전기말 현금»이다. 전기말 자산총계를 쓰면 잔고와 흐름을 섞는 셈이라
     차기이월금이 재무상태표 현금과 어긋난다. */
  var carry=num(op.cash)||0;
  var totIn=0, totOut=0;
  IE_TREE.forEach(function(g){
    var dir=g.dir, gSum=0, lines=[], claimed={};
    // 「기타」가 남은 것을 받으려면, 이름 붙은 항이 무엇을 가져갔는지 먼저 알아야 한다
    g.hang.forEach(function(h){
      var accts=h.use==='purpose'?PURPOSE_ACCTS:(h.accts||[]);
      accts.forEach(function(a){ claimed[a]=1; });
    });
    g.hang.forEach(function(h){
      var hSum=0, sub=[];
      if(h.carry){ hSum=carry; }
      else if(h.rest){
        Object.keys(by).sort().forEach(function(a){
          if(claimed[a]) return;
          var v=(dir==='입금')?by[a].in:by[a].out;
          if(!v) return;
          hSum+=v; sub.push([a,v]);
        });
      } else {
        var accts=h.use==='purpose'?PURPOSE_ACCTS:h.accts;
        accts.forEach(function(a){
          var b=by[a]; if(!b) return;
          var v=(dir==='입금')?b.in:b.out;
          if(!v) return;
          hSum+=v; sub.push([a,v]);
        });
      }
      if(!hSum && !h.carry) return;
      lines.push(['항',h.h,hSum]);
      sub.forEach(function(x){ lines.push(['목',x[0],x[1]]); });
      gSum+=hSum;
    });
    /* 모델은 «숫자»만 돌려준다 — 이름표에 서식을 박으면 화면 밖(엑셀·검사)에서 못 쓴다 */
    add('【'+g.gwan+'】',gSum,0,true);
    lines.forEach(function(l){ add(l[1],l[2],l[0]==='항'?1:2,l[0]==='항'); });
    if(g.gwan==='수입') totIn=gSum; else totOut=gSum;
  });
  add('차기이월금 (수입 − 지출)',totIn-totOut,0,true);
  return {rows:R,totIn:totIn,totOut:totOut,carry:carry,end:totIn-totOut};
}
