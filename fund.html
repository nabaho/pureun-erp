    #formLeft{width:100%!important;min-width:0!important}

    .panel{padding:10px}
    th,td{padding:5px 6px;font-size:11.5px}

    // 로그인 이메일(p001@pureun.kr) → 재직자 사번(P-001) 매칭 → 실제 이름
    var mail=(fu&&fu.email||'').toLowerCase(); var local=mail.split('@')[0];

      var me=(list||[]).filter(function(x){return String(x.sid||'').toLowerCase().replace(/[^a-z0-9]/g,'')===local;})[0];
      if(me) _setTopUser(me.name, r||me.title||'기금 운영');

  }
  fbDb.ref('.info/connected').on('value',function(s){var on=!!s.val();$('dot').className='dot'+(on?' on':'');$('connt').textContent=on?'Firebase 연결됨':'오프라인';});

function toast(msg,type){
  var t=$('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.className='show'+(type==='err'?' err':(type==='warn'?' warn':''));
  clearTimeout(window._toastT); window._toastT=setTimeout(function(){ t.className=''; }, type==='err'?3200:1800);
}
// ── 공통 편의: 네비게이션 + 브라우저 뒤로가기 (저장 안 한 변경 이탈 경고 포함) ──
function _leaveGuard(){ if(!_dirty) return Promise.resolve(true);
  return confirmM('저장하지 않은 변경이 있습니다.\n저장하지 않고 이동할까요?',{ok:'이동',danger:true}).then(function(ok){ if(ok)clearDirty(); return ok; }); }
function go(v,id){ _leaveGuard().then(function(ok){ if(!ok)return; _go(v,id); }); }
function _go(v,id){ closeSide(); S.view=v; if(id!==undefined)S.fundId=id; if(v==='fund')S.tab='info'; _pushHist(); route(); }
function goTab(tab){ _leaveGuard().then(function(ok){ if(!ok)return; S.tab=tab; _pushHist(); renderFund(); }); }
function goBack(){ _leaveGuard().then(function(ok){ if(!ok)return; if(history.length>1) history.back(); else _go('home'); }); }
function _pushHist(){ try{ history.pushState({view:S.view,fundId:S.fundId,tab:S.tab,homeTab:S.homeTab}, ''); }catch(e){} }
window.addEventListener('popstate', function(ev){
  // 미저장 변경이 있으면 확인 — 취소 시 원래 화면으로 되돌림(히스토리 복구)
  if(_dirty){
    var back={view:S.view,fundId:S.fundId,tab:S.tab,homeTab:S.homeTab};
    confirmM('저장하지 않은 변경이 있습니다.\n저장하지 않고 이동할까요?',{ok:'이동',danger:true}).then(function(ok){
      if(ok){ clearDirty(); var st2=ev.state||{view:'home'};
        S.view=st2.view||'home'; if(st2.fundId!==undefined)S.fundId=st2.fundId; if(st2.tab)S.tab=st2.tab; if(st2.homeTab)S.homeTab=st2.homeTab; route(); }
      else { try{ history.pushState(back,''); }catch(e){} }   // 머무르기
    });
    return;
  }
  var st=ev.state; if(!st){ S.view='home'; route(); return; }
  S.view=st.view||'home'; if(st.fundId!==undefined)S.fundId=st.fundId; if(st.tab)S.tab=st.tab; if(st.homeTab)S.homeTab=st.homeTab;
  route();
});
function route(){
  ['home','billing','docsboard','forms'].forEach(function(v){var n=$('nav-'+v);if(n)n.className='sitem'+(S.view===v?' on':'');});
  if(S.view!=='fund'&&S.formsHost==='fundDocsHost') S.formsHost=null;   // 기금 밖으로 나가면 임베드 해제
  if(S.view==='fund'&&S.fundId&&funds[S.fundId]) renderFund();
  else if(S.view==='billing') renderBilling();
  else if(S.view==='docsboard') renderDocsBoard();
  else if(S.view==='forms') renderForms();
  else { S.view='home'; renderHome(); }
}

function mgrText(f){
  if(_hasMgrStruct(f)){
    var main=(f.mgr_main&&f.mgr_main.name)||'';
    var subs=(f.mgr_subs||[]).map(function(s){return (s&&s.name)||'';}).filter(Boolean);
    return [main].concat(subs.map(function(n){return n+'(부)';})).filter(Boolean).join(', ')||'—';
  }
  return f.manager||'—';   // 구 데이터 호환
}
function _hasMgrStruct(f){   // 빈 배열([])은 구조화 데이터로 보지 않음 — manager 폴백 유지
  return !!(f.mgr_main&&f.mgr_main.name)||!!(f.mgr_subs&&f.mgr_subs.length);
}
function mgrMainName(f){
  if(_hasMgrStruct(f)) return (f.mgr_main&&f.mgr_main.name)||'';

function mgrSubNames(f){

  return '';
}

var _staffCache=null;
function _normStaff(v){
  if(!v) return []; if(!Array.isArray(v)) v=Object.keys(v).map(function(k){return v[k];});
  var seen={};
  return v.filter(function(u){return u&&u.sid;})
    .filter(function(u){return !u.status||u.status==='active'||(u.status==='leave'&&u.leaveLoginAllowed===true);})
    .filter(function(u){ if(seen[u.sid])return false; seen[u.sid]=1; return true; })
    .map(function(u){return {sid:u.sid,name:u.name||u.sid,title:u.title||u.role||'',branch:u.branch||''};})
    .sort(function(a,b){return String(a.sid||'').localeCompare(String(b.sid||''),'en',{numeric:true});});  // 푸른이알피 사번 순
}
function loadStaff(){
  if(_staffCache&&_staffCache.length) return Promise.resolve(_staffCache);   // 빈 결과는 캐시하지 않음(복구 시 재조회)
  // 1) 동일 출처(github.io/pureunall) localStorage — 푸른이알피가 채워둔 재직자, Firebase 규칙 의존 없음
  try{ var raw=localStorage.getItem('pureun_v6_user_accounts');
    if(raw){ var a=_normStaff(JSON.parse(raw)); if(a.length){ _staffCache=a; return Promise.resolve(a); } } }catch(e){}
  // 2) 폴백: Firebase — 일반 직원도 읽을 수 있는 공개 명부 data/user_dir 우선, 실패 시 data/user_accounts
  var rd=function(p){ return fbDb.ref(p).once('value').then(function(s){ return _normStaff(s.val()); }).catch(function(){ return []; }); };
  return rd('data/user_dir/v').then(function(a){ if(a.length){ _staffCache=a; return a; }
    return rd('data/user_dir').then(function(b){ if(b.length){ _staffCache=b; return b; }
      return rd('data/user_accounts/v').then(function(c){ _staffCache=c; return c; }); });
  });
}

function _addrParts(address){
  var a=String(address||'').trim(); if(!a) return null;
  var full=/(\S+?(?:도|특별시|광역시|특별자치시|특별자치도))\s+(\S+?시)\s+(\S+?구)/.exec(a)
        || /(\S+?(?:도|특별시|광역시|특별자치시|특별자치도))\s+(\S+?(?:시|군|구))/.exec(a);
  if(full) return {sido:_SIDO_ABBR[full[1]]||full[1], sgg:full[2], gu:(full[3]||'')};
  var abbrs=Object.keys(_SIDO_ABBR).map(function(k){return _SIDO_ABBR[k];});   // 충남·경기·대전 …
  var m2=/^(\S{2,4})\s+(\S+?시)\s+(\S+?구)/.exec(a) || /^(\S{2,4})\s+(\S+?(?:시|군|구))/.exec(a);
  if(m2 && abbrs.indexOf(m2[1])>=0) return {sido:m2[1], sgg:m2[2], gu:(m2[3]||'')};
  return null;
}
function guessRegistry(address){
  var p=_addrParts(address); if(!p) return '';
  return REGISTRY_MAP[p.sido+' '+p.sgg]||'';
}

function _localGovFromAddr(addr){

}
function guessTax(address){
  var p=_addrParts(address); if(!p) return '';

}

function bulkRegistry(){
  var arr=Object.keys(funds).filter(function(k){return !isTrashed(funds[k]);}).map(function(k){return Object.assign({_id:k},funds[k]);});
  var plan=[], nomap=[], skip=0;
  arr.forEach(function(f){

    +'<p class="muted" style="font-size:12px;margin:0 0 10px"><b>추정값</b>입니다. 소재지의 시·군·구 기준이며 실제 관할은 대법원 인터넷등기소(iros.go.kr)에서 확인하세요. <b>비어 있는 '+plan.length+'개</b>만 채웁니다(기존 값·이미 채워진 '+skip+'개는 유지).'
    +(nomap.length?'<br>매핑 없어 제외 '+nomap.length+'개: '+esc(nomap.slice(0,8).join(', '))+(nomap.length>8?' 외':''):'')+'</p>'
    +'<div style="max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px"><table><thead><tr><th>기금</th><th>추정 관할등기소</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:14px"><button onclick="closeM()">취소</button><button class="primary" onclick="applyBulkRegistry()">'+plan.length+'개 채우기</button></div>');
  window._regPlan=plan;

function applyBulkRegistry(){ _applyBulkOffice(window._regPlan,'registry_office','관할등기소',function(){window._regPlan=null;}); }
// 공용 적용기 — 적용 직전 서버 현재값 재확인해 '아직 빈 칸'만 채움(그 사이 입력분 보호)
function _applyBulkOffice(plan,field,label,clearPlan){
  plan=plan||[]; if(!plan.length){ closeM(); return; }
  fbDb.ref(NS+'/funds').once('value').then(function(s){
    var cur=s.val()||{}, updates={}, n=0, skip=0;
    plan.forEach(function(p){ var c=cur[p.id]; if(!c) return;
      if(String(c[field]||'').trim()){ skip++; return; }    // 그 사이 채워졌으면 건너뜀
      updates[p.id+'/'+field]=p.office; n++; });
    if(!n){ closeM(); toast('채울 대상이 없습니다(이미 입력됨 '+skip+'건)','warn'); return; }
    return fbDb.ref(NS+'/funds').update(updates).then(function(){
      plan.forEach(function(p){ if(funds[p.id]&&updates[p.id+'/'+field]!==undefined) funds[p.id][field]=p.office; });
      if(clearPlan)clearPlan(); closeM(); renderHome();
      toast(n+'개 '+label+' 채움'+(skip?' · '+skip+'건은 이미 입력돼 건너뜀':'')+' — 확인 필요');
    });
  }).catch(function(e){ toast('저장 실패: '+e.message,'err'); });
}

}

    +(nomap.length?'<br>매핑 없어 제외 '+nomap.length+'개: '+esc(nomap.slice(0,8).join(', '))+(nomap.length>8?' 외':''):'')+'</p>'
    +'<div style="max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px"><table><thead><tr><th>기금</th><th>추정 관할세무서</th></tr></thead><tbody>'+rows+'</tbody></table></div>'

// ── 지원금 전체 보드 (지원금 탭 하위 — 연도별 공동기금 전체 한 화면 입력) ──
function subBoardPanel(){
  var yr=S.year;
  // 공동기금(사내 제외)·운영 중만
  var rpri={'충남':1,'경기':2};
  var arr=Object.keys(funds).map(function(k){var o=Object.assign({},funds[k]);o._id=k;return o;})
    .filter(function(f){return !isTrashed(f)&&f.fund_type!=='사내'&&!isPast(f)&&f.setup_stage!=='설립준비';})
    .sort(function(a,b){return ((rpri[a.region]||9)-(rpri[b.region]||9))||(a.short_name||'').localeCompare(b.short_name||'','ko',{numeric:true});});
  function sv(f,k){var y=(f.years&&f.years[yr]&&f.years[yr].subsidy)||{};return y[k]!=null?y[k]:'';}
  function moneyIn(f,k){return '<input value="'+esc(sv(f,k))+'" onchange="patchSub(\''+f._id+'\',\''+k+'\',this.value,\'num\')" style="width:110px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;text-align:right">';}
  function dateIn(f,k){return '<input type="date" value="'+esc(sv(f,k))+'" onchange="patchSub(\''+f._id+'\',\''+k+'\',this.value,\'\')" style="padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px">';}
  var totReq=0,totDec=0,totSp=0;

    var recon = dec? (sp>dec?'<span class="chip dg">과다 '+(sp-dec).toLocaleString()+'</span>':sp<dec?'<span class="chip warn">미집행 '+(dec-sp).toLocaleString()+'</span>':'<span class="chip ok">일치</span>'):'<span class="muted">—</span>';

      +'<td style="font-weight:700;cursor:pointer" onclick="openFundSubsidy(\''+f._id+'\')" title="이 기금 지원금으로 이동">'+esc(f.short_name||f.name)+(cur?' <span class="chip ok" style="font-size:10px">현재</span>':'')+'</td>'

      +'<td>'+dateIn(f,'paid_date')+'</td><td>'+moneyIn(f,'spent_amount')+'</td>'

    +'<p class="muted" style="font-size:12px;margin:6px 0 0">'+yr+'년 공동기금 전체 지원금을 <b>한 화면에서</b> 입력합니다. 칸 입력 후 이동하면 자동 저장. 기금명 클릭 시 그 기금으로 전환.</p>'
    +'<div style="overflow-x:auto;margin-top:10px"><table><thead><tr><th>번호</th><th>기금명</th><th>지역</th>'
    +'<th style="text-align:right">신청액</th><th style="text-align:right">결정액</th><th>교부·입금일</th><th style="text-align:right">집행액</th><th>정산</th></tr></thead>'
    +'<tbody>'+rows+'</tbody>'

function patchSub(fid,field,val,type){
  var raw=(val==null?'':String(val)).trim();
  var v = type==='num' ? (raw===''?'':(num(raw)===''?'':num(raw))) : raw;   // 0도 정상 저장(빈칸과 구분)
  var _yr=S.year;
  fbDb.ref(NS+'/funds/'+fid+'/years/'+_yr+'/subsidy/'+field).set(v).then(function(){
    var t=funds[fid]; if(!t) return;
    if(!t.years)t.years={}; if(!t.years[_yr])t.years[_yr]={};
    if(!t.years[_yr].subsidy)t.years[_yr].subsidy={};
    t.years[_yr].subsidy[field]=v;
    // 입력 중 재렌더 방지 — 포커스가 보드 입력칸에 있으면 화면은 그대로 두고 값만 반영
    var ae=document.activeElement, typing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA');
    if(!typing&&S.view==='fund') renderFund();
    toast('저장됨');
  }).catch(function(e){toast('저장 실패: '+e.message,'err');});
}
function openFundSubsidy(fid){ S.fundId=fid; S.tab='subsidy'; _pushHist(); renderFund(); }

// PDF → 좌표 정렬 텍스트. 텍스트 레이어가 없으면 '' 반환(=스캔 이미지)
function pdfText(buf){
  if(typeof pdfjsLib==='undefined') return Promise.reject(new Error('PDF 라이브러리 로드 실패 — 새로고침하세요'));
  try{ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}
  return pdfjsLib.getDocument({data:buf}).promise.then(function(doc){
    var n=Math.min(doc.numPages,5), jobs=[];
    for(var i=1;i<=n;i++) jobs.push(doc.getPage(i).then(function(pg){ return pg.getTextContent(); }));
    var fin=function(){ try{ doc.destroy(); }catch(e){} };   // PDF worker 자원 반납
    return Promise.all(jobs).then(function(r){ fin(); return r; },function(e){ fin(); throw e; }).then(function(cs){
      return cs.map(function(c){
        var items=c.items.filter(function(it){return (it.str||'').trim();})
          .map(function(it){ return {s:it.str, x:it.transform[4], y:it.transform[5]}; });
        items.sort(function(a,b){ var dy=b.y-a.y; if(Math.abs(dy)>3) return dy; return a.x-b.x; });  // 위→아래, 좌→우
        var out='',lastY=null;
        items.forEach(function(it){ if(lastY!==null&&Math.abs(it.y-lastY)>3) out+='\n'; out+=it.s+' '; lastY=it.y; });
        return out;
      }).join('\n');
    });
  });
}
function _flat(t){ return String(t||'').replace(/ /g,' ').replace(/\s+/g,' '); }
// ── 인가증 판독 ──
function parseInka(txt){
  var t=String(txt||''), flat=_flat(t), o={};
  var m=flat.match(/인가번호\s*제?\s*(\d{3,4}\s*-\s*20\d{2}\s*-\s*\d{1,3})\s*호/);
  if(m) o.inka_no=m[1].replace(/\s/g,'');
  var ds=flat.match(/20\d{2}\s*[.년]\s*\d{1,2}\s*[.월]\s*\d{1,2}\s*[.일]?/g);
  if(ds&&ds.length){ var p=ds[ds.length-1].match(/(20\d{2})\D+(\d{1,2})\D+(\d{1,2})/);
    if(p) o.inka_date=p[1]+'-'+('0'+p[2]).slice(-2)+'-'+('0'+p[3]).slice(-2); }
  m=flat.match(/대표자\s*성명\s*:?\s*([가-힣]{2,5})/);
  if(m) o.chairman=m[1];
  /* 기금명·소재지 — 인가증은 라벨과 값이 엇갈려 추출된다.
     실제 예: "1. 기금법인 명칭: 충남공동근로복지기금8호 충청남도 당진시 … (송악읍 2. 주사무소 소재지: 한진리) 3. 대표자 …"
     → ① 명칭~대표자 구간을 잘라 ② 소재지 라벨만 지우고 ③ 주소 시작(시·도+시/군/구)에서 이름/주소를 가른다. */
  var seg=flat.match(/기금법인\s*명칭\s*:?\s*(.*?)(?=\d\s*\.\s*대표자|대표자\s*성명|$)/);
  if(seg){
    var s=seg[1].replace(/\d\s*\.\s*주사무소\s*소재지\s*:?/g,' ').replace(/\s+/g,' ').trim();
    var SIDO='서울특별시|부산광역시|대구광역시|인천광역시|광주광역시|대전광역시|울산광역시|세종특별자치시'
      +'|충청북도|충청남도|전라북도|전라남도|경상북도|경상남도|경기도|강원특별자치도|강원도|제주특별자치도'
      +'|서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주';
    var re=new RegExp('(?:'+SIDO+')[가-힣]{0,4}\\s*[가-힣]{2,7}(?:시|군|구)(?![가-힣])','g'), mm, last=-1;
    while((mm=re.exec(s))) last=mm.index;          // 이름에도 '충남' 등이 있으므로 마지막 매치를 주소 시작으로
    if(last>0){
      o.address=_cleanAddr(s.slice(last))||s.slice(last).replace(/\s+/g,' ').trim();
      var nm=_cleanName(s.slice(0,last).replace(/기금호(\d+)/,'기금$1호'));   // "기금호1"→"기금1호"(순서 뒤바뀜 보정)
      if(nm) o.name=nm;
    }else{
      var nm2=_cleanName(s.replace(/기금호(\d+)/,'기금$1호'));
      if(nm2&&/기금/.test(nm2)) o.name=nm2;
    }
  }
  return o;
}
// ── 등기사항전부증명서 판독 (텍스트 PDF일 때) ──
function parseCorpReg(txt){
  var flat=_flat(txt), o={};
  var m=flat.match(/등록번호\s*(\d{6}\s*-\s*\d{7})/); if(m) o.corp_reg_no=m[1].replace(/\s/g,'');
  m=flat.match(/법인성립연월일\s*(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if(m) o.reg_date=m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  m=flat.match(/설립인?허?가?연월일\s*(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if(m) o.inka_date=m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  m=flat.match(/주사무소\s*(.+?)(?=\s*목\s*적|\s*공고|$)/); if(m) o.address=m[1].trim();
  m=flat.match(/관할등기소\s*([가-힣]+지방법원[가-힣]*\s*[가-힣]*등기소?)/); if(m) o.registry_office=m[1].replace(/\s+/g,' ').trim();
  return o;
}
/* ── 고유번호증 판독 ──
   OCR 텍스트는 글자 사이에 잡음이 낀다("단 _ 체 . 명 :", "소 _ OX:") → 라벨을 느슨하게 매칭한다. */
function _loose(s){ return s.split('').map(function(c){return c+'[\\s_.,:：]*';}).join(''); }
function parseTaxId(txt){
  var flat=_flat(txt), o={};
  var m=flat.match(/(\d{3})\s*-\s*(\d{2})\s*-\s*(\d{5})/);           // 고유번호(3-2-5)
  if(m) o.tax_id_no=m[1]+'-'+m[2]+'-'+m[3];
  m=flat.match(new RegExp(_loose('법인등록번호')+'[:：]?\\s*(\\d{6})\\s*-\\s*(\\d{7})'));
  if(!m) m=flat.match(/(\d{6})\s*-\s*(\d{7})/);                     // 라벨 오독 대비
  if(m) o.corp_reg_no=m[1]+'-'+m[2];
  m=flat.match(new RegExp(_loose('단체명')+'[:：]\\s*(.+?)(?=\\s*'+_loose('대표')+'|\\s*'+_loose('법인')+'|$)'));
  if(m){ var nm=_cleanName(m[1]); if(nm) o.name=nm; }
  // '대표자'가 '내표자'로 오독되는 일이 잦아 첫 글자를 느슨하게 둔다
  m=flat.match(/[대내]\s*[_.]*\s*표\s*[_.]*\s*자\s*[_.]*\s*성\s*[_.]*\s*명\s*[:：]?\s*([가-힣]{2,5})/);
  if(m) o.chairman=m[1];
  // 소재지 — 뒤따르는 '발급사유'는 '발 = 사 유'처럼 깨져 나오므로 느슨하게 끊는다
  m=flat.match(/소\s*[_.]*\s*재?\s*[가-힣A-Za-z]{0,3}\s*[:：]\s*(.+?)(?=\s*발\s*[^가-힣]{0,4}\s*(?:급|사)\s*[_.]*\s*(?:사\s*)?유|\s*\(유의|$)/);
  if(m){ var ad=_cleanAddr(m[1]); if(ad) o.address=ad; }
  m=flat.match(/([가-힣]{2,6})\s*세무서장?/); if(m) o.tax_office=m[1]+'세무서';
  return o;
}
/* OCR 잡음 정리 — 깨진 라틴문자·기호 덩어리를 걷어낸다 */
function _cleanName(s){
  var t=String(s||'').replace(/[^가-힣0-9()·\s]/g,' ').replace(/\s+/g,'').trim();
  var m=t.match(/^(.*?기금\d*호?)/);                 // '…기금[N호]'까지만
  return m?m[1]:(t.length<=30?t:'');
}
function _cleanAddr(s){
  var t=String(s||'').replace(/[^가-힣0-9()~,\-\s]/g,' ').replace(/\s+/g,' ').trim();
  t=t.replace(/\s*발\s*(?:급)?\s*사?\s*유.*$/,'').trim();      // '발급사유 신규' 꼬리 제거
  return t.length>=6&&t.length<=100?t:'';
}

/* ═══════════ 스캔 문서 OCR (tesseract.js) ═══════════

   전처리(3배 확대 + 흑백 2치화)가 정확도를 크게 좌우한다 — 등기부의 노란 보안무늬가 사라져야 숫자가 읽힌다.

var OCR_CDN='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
var _ocrLoad=null;
function ocrReady(){
  if(typeof Tesseract!=='undefined') return Promise.resolve();
  if(_ocrLoad) return _ocrLoad;
  _ocrLoad=new Promise(function(res,rej){
    var s=document.createElement('script'); s.src=OCR_CDN;
    s.onload=function(){res();}; s.onerror=function(){ _ocrLoad=null; rej(new Error('OCR 엔진을 내려받지 못했습니다(인터넷 확인)')); };
    document.head.appendChild(s);
  });

}
// 캔버스 흑백 2치화 — 보안무늬·배경색 제거
function _binarize(cv,thr){
  thr=thr||170;
  var g=cv.getContext('2d'), im=g.getImageData(0,0,cv.width,cv.height), d=im.data;
  for(var i=0;i<d.length;i+=4){
    var v=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)>thr?255:0;
    d[i]=d[i+1]=d[i+2]=v;
  }
  g.putImageData(im,0,0); return cv;
}
// PDF 첫 N쪽 → 2치화 캔버스 배열
function pdfPageCanvases(buf,maxPages){
  return pdfjsLib.getDocument({data:buf}).promise.then(function(doc){
    var n=Math.min(doc.numPages,maxPages||2), jobs=[];
    for(var i=1;i<=n;i++) jobs.push(doc.getPage(i).then(function(pg){
      var vp=pg.getViewport({scale:3});                 // 3배 ≈ 216dpi
      var cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
      return pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise.then(function(){ return _binarize(cv); });
    }));
    var fin=function(){ try{ doc.destroy(); }catch(e){} };
    return Promise.all(jobs).then(function(r){ fin(); return r; },function(e){ fin(); throw e; });
  });
}
// 이미지 파일 → 2치화 캔버스
function imgCanvas(file){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      // 큰 사진은 2200px로 줄이고(메모리·속도), 작은 사진만 1.6배 확대(OCR 인식률)
      var W=img.width||1, k=W>2200?(2200/W):(W<1400?1.6:1);
      var w=Math.max(1,Math.round(W*k)), h=Math.max(1,Math.round((img.height||1)*k));
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url); res(_binarize(cv));
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('이미지를 열 수 없습니다')); };
    img.src=url;
  });
}
// 캔버스들 OCR → 합친 텍스트
function ocrCanvases(cvs,onStat){
  return ocrReady().then(function(){
    onStat&&onStat('OCR 엔진 준비 중…');
    return Tesseract.createWorker('kor+eng',1,{logger:function(m){
      if(m.status==='recognizing text') onStat&&onStat('글자 인식 중 '+Math.round((m.progress||0)*100)+'%');
      else if(/download|load/i.test(m.status||'')) onStat&&onStat('한국어 데이터 내려받는 중… (최초 1회)');
    }});
  }).then(function(w){
    var texts=[];
    // 실패해도 worker를 반드시 종료한다(WASM 메모리 누수 방지)
    var fin=function(){ return Promise.resolve(w.terminate()).catch(function(){}); };
    return cvs.reduce(function(p,cv,i){
      return p.then(function(){ onStat&&onStat((i+1)+'/'+cvs.length+'쪽 인식 중…');
        return w.recognize(cv).then(function(r){ texts.push((r.data&&r.data.text)||''); }); });
    },Promise.resolve())
      .then(function(){ return fin().then(function(){ return texts.join('\n'); }); },
            function(err){ return fin().then(function(){ throw err; }); });
  });
}

  } else if(S.formPhase==='reg'){

// 서식 이름 클릭 → 선택 저장 + 목록 하이라이트 + 오른쪽 미리보기
function selectForm(kind){ S._sideKind=kind; renderForms(); }   // 임베드/자료실 모두 현재 HOST에 재렌더
// 서식 자료실 좌우 패널 크기 드래그 조절
var _formDrag=null;
function startFormDrag(e){ e.preventDefault(); var split=$('formSplit'),left=$('formLeft'); if(!split||!left)return;
  _formDrag={x:e.clientX, w:left.getBoundingClientRect().width, total:split.getBoundingClientRect().width};
  document.body.style.cursor='col-resize'; document.body.style.userSelect='none';
  window.addEventListener('mousemove',onFormDrag); window.addEventListener('mouseup',endFormDrag); }
function onFormDrag(e){ if(!_formDrag)return; var left=$('formLeft'); if(!left)return;
  var w=_formDrag.w+(e.clientX-_formDrag.x), min=300, max=Math.max(min,_formDrag.total-320);
  w=Math.max(min,Math.min(max,w)); left.style.width=w+'px'; S.formSplitW=Math.round(w);
  fitDocA4();   // 패널 폭이 바뀌면 A4 배율도 다시 맞춤
}
function endFormDrag(){ _formDrag=null; document.body.style.cursor=''; document.body.style.userSelect='';
  window.removeEventListener('mousemove',onFormDrag); window.removeEventListener('mouseup',endFormDrag); }
// 서식 자료실 → 선택 기금의 상세 탭으로 이동
function gotoFundTab(tab){ var id=S.formFund; if(!id||!funds[id]){ toast('대상 기금을 먼저 선택하세요','warn'); return; } S.view='fund'; S.fundId=id; S.tab=tab; _pushHist(); route(); }
// 현재 서식 컨텍스트의 기금 객체 — 기금 모드면 실제 기금, 샘플 모드면 가상 샘플(빈 값은 ＿＿로 표시됨)
function curForm(){ if(S.formsCtx==='fund'&&funds[S.formFund]) return funds[S.formFund];
  var t=(S.sampleType==='사내')?'사내':'공동';
  return {_sample:true, fund_type:t, name:'(샘플) 신규 '+t+'근로복지기금', short_name:'신규 '+t+' 샘플'}; }
// 기금 상세 [📑 서식] → 그 기금의 서식 화면
function openFundDocs(){ S.formFund=S.fundId; S.formsCtx='fund'; S.tab='docs'; _go('fund',S.fundId); S.tab='docs'; renderFund(); }
// (backToFund 제거 — 기금 서식이 상세 탭 안에서 렌더되면서 쓰이지 않게 됨)
function pickTpl(key){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx';
  inp.onchange=function(ev){ var file=ev.target.files&&ev.target.files[0]; if(!file)return;
    var rd=new FileReader();

      ['tax_bizreg',['법인설립신고','사업자등록신청']],['tax_sublease',['전대']],['tax_lease',['임대차']],['tax_hometax',['홈텍스','홈택스']],

      ['sub_welfare_plan',['복지사업계획']],['sub_assets',['재산목록']],['sub_payment',['지급신청']],
      ['subsidy',['지원신청서','지원금지원신청','기금지원신청']],['incent_cost',['비용청구','11호의2']],

    var used={}, plan=[];
    files.forEach(function(f){ var n=f.name, hit=null;
      for(var i=0;i<RULES.length;i++){ var k=RULES[i][0]; if(used[k])continue;

/* ── 모든 서식은 A4 세로 기준 ──
   용지 210×297mm, 여백 20mm → 본문 폭 170mm. 화면 미리보기·인쇄·PDF가 같은 규격을 쓴다. */

/* #doced 안에서만 적용되는 스코프판 — 페이지(앱 전체)로 새지 않게. 인라인(사이드패널·모달) 전용.

  +s+" td>table{margin:0;width:100%;border:none}"+s+" td{height:1.9em}"; }
/* ── 쪽 나누기 ──
   긴 서식을 A4 본문높이(257mm)에 맞춰 여러 장으로 자르고, 장마다 하단에 쪽수를 붙인다.
   블록 요소 단위로 담다가 넘치면 다음 장으로 넘긴다(표 한 개가 한 장보다 크면 그 장에 두고 표시).
   편집 중 자동 재분할은 하지 않는다 — 커서가 튀기 때문. 넘치면 배지로 알리고 [다시 나누기]로 처리. */
function _a4Page(no){
  var p=document.createElement('div'); p.className='a4';
  var b=document.createElement('div'); b.className='a4b';
  var f=document.createElement('div'); f.className='a4f'; f.setAttribute('contenteditable','false');
  f.textContent='- '+no+' -';
  p.appendChild(b); p.appendChild(f); return p;
}
function paginateDoc(rawHTML){
  var ed=$('doced'); if(!ed) return;
  var holder=document.createElement('div'); holder.innerHTML=rawHTML||'';
  // 이전에 붙인 쪽수·넘침배지 제거 — 저장본을 다시 열 때 쪽수가 겹치는 것 방지
  Array.prototype.forEach.call(holder.querySelectorAll('.a4f,.a4of'),function(x){ x.remove(); });
  // .a4b(본문 껍데기)는 벗겨서 내용만 남긴다 — 저장본은 이미 감싸져 있다
  Array.prototype.forEach.call(holder.querySelectorAll('.a4b'),function(b){
    while(b.firstChild) b.parentNode.insertBefore(b.firstChild,b);
    b.remove();
  });
  // 이미 .a4로 감싼 입력(전체 초안 등)은 장 단위가 정해져 있으니 각 장 안에서만 다시 나눈다
  var groups=holder.querySelectorAll(':scope > .a4');
  var blocks=[];
  if(groups.length) Array.prototype.forEach.call(groups,function(g){ blocks.push(Array.prototype.slice.call(g.childNodes)); });
  else blocks.push(Array.prototype.slice.call(holder.childNodes));

  ed.innerHTML='<style>'+dgDocCssIn()+'</style>';
  var no=0, pages=[];
  blocks.forEach(function(nodes){
    no++; var page=_a4Page(no); ed.appendChild(page); pages.push(page);
    var body=page.querySelector('.a4b'), limit=body.clientHeight;
    nodes.forEach(function(nd){
      if(nd.nodeType===3 && !String(nd.nodeValue||'').trim()) return;      // 공백 텍스트 무시
      body.appendChild(nd);
      if(limit>0 && body.scrollHeight>limit && body.childNodes.length>1){   // 넘치면 다음 장으로
        body.removeChild(nd);
        no++; page=_a4Page(no); ed.appendChild(page); pages.push(page);
        body=page.querySelector('.a4b'); limit=body.clientHeight;
        body.appendChild(nd);
      }
    });
  });
  // 총 쪽수 표기 + 넘침 검사
  pages.forEach(function(p,i){
    var f=p.querySelector('.a4f'); if(f) f.textContent='- '+(i+1)+' / '+pages.length+' -';
  });
  markA4Overflow();
  return pages.length;
}
/* 편집으로 내용이 장을 넘쳤는지 표시 */
function markA4Overflow(){
  var ed=$('doced'); if(!ed) return 0; var n=0;
  Array.prototype.forEach.call(ed.querySelectorAll('.a4'),function(p){
    var b=p.querySelector('.a4b'); if(!b) return;
    var old=p.querySelector('.a4of'); if(old) old.remove();
    var over=b.scrollHeight>b.clientHeight+2;
    p.classList.toggle('of',over);
    if(over){ n++;
      var t=document.createElement('div'); t.className='a4of'; t.setAttribute('contenteditable','false');
      t.textContent='이 쪽을 넘칩니다 — [다시 나누기]'; p.appendChild(t); }
  });
  var w=$('a4Warn'); if(w) w.style.display=n?'':'none';
  return n;
}
function repaginateDoc(){
  var ed=$('doced'); if(!ed) return;
  var parts=[]; Array.prototype.forEach.call(ed.querySelectorAll('.a4 .a4b'),function(b){ parts.push(b.innerHTML); });
  paginateDoc(parts.join(''));   // 쪽 경계를 없애고 처음부터 다시 나눔
  fitDocA4(); toast('쪽을 다시 나눴습니다');

/* 미리보기 배율 — 패널 폭에 맞춰 A4 한 장이 가로로 다 들어오게. S.docZoom='fit'|1 */
function fitDocA4(){
  var w=$('docwrap'), ed=$('doced'), st=$('docstage'); if(!w||!ed) return;
  var page=ed.querySelector('.a4'); if(!page) return;
  // 배율을 걷어낸 상태에서 실측(A4 210mm ≈ 794px) → 패널 폭에 맞는 배율 산출
  ed.style.transform='none';
  var pw=page.offsetWidth||794, ph=ed.scrollHeight||0;
  var avail=Math.max(80,w.clientWidth-28);
  var k=(S.docZoom===1)?1:Math.min(1,avail/pw);
  if(!(k>0.2)) k=0.2;
  ed._k=k;
  if(k!==1) ed.style.transform='scale('+k.toFixed(4)+')';
  if(st){                                  // 축소한 만큼만 자리를 차지하게(가로 스크롤 방지)
    st.style.height=Math.ceil(ph*k)+'px';
    st.style.overflow=(k===1?'visible':'hidden');
  }
  var z=$('docZoomLbl'); if(z) z.textContent=Math.round(k*100)+'%';
}
function toggleDocZoom(){ S.docZoom=(S.docZoom===1)?'fit':1; fitDocA4(); }

/* ── 원본 .hwp에서 변환한 법정서식(fund_forms.js: window.HWP_FORMS) ──
   03_과거자료 원본을 파싱해 문단·표 격자를 그대로 옮긴 템플릿. 라벨 옆 빈 칸에 기금 데이터를 채운다.
   구조가 원본과 동일하므로 "폴더 서식과 다르다" 문제가 없다. (정밀 인쇄는 여전히 엑셀/HWP 권장) */
var FORM_FILL=[   // [라벨 정규식, 값 함수] — 표에서 라벨 셀 다음의 빈 셀에 채움
  [/^명\s*칭$/, function(f){return f.name;}],
  [/^주사무소\s*소재지$/, function(f){return f.address;}],
  [/^소재지$/, function(f){return f.address;}],
  [/^전화번호$/, function(f){return f.phone;}],
  [/^성명\(한글\)$/, function(f){return f.chairman;}],
  [/^생년월일$/, function(f){return '';}],
  [/^직\s*책$/, function(f){return f.chairman?'이사장':'';}],
  [/^접수일$/, function(f){return '';}]
];
function hwpFormHTML(kind,f,sites){
  var ftype=(f.fund_type==='사내')?'사내':'공동';
  var key=(kind==='charter'&&ftype==='사내')?'charter_sane':kind;   // 정관은 공동/사내 원본이 다름
  var T=(window.HWP_FORMS||{})[key]; if(!T) return null;
  var html=String(T).replace(/\{\{FUND\}\}/g, esc(f.name||'＿＿＿＿＿＿＿＿'));
  // 사내/공동 체크박스 전환 (원본은 공동에 [V])
  if(ftype==='사내') html=html.replace(/\[ \] 사내근로복지기금법인/g,'[V] 사내근로복지기금법인')
                              .replace(/\[V\] 공동근로복지기금법인/g,'[ ] 공동근로복지기금법인');
  var d=document.createElement('div'); d.innerHTML=html;
  var tds=d.querySelectorAll('td');
  for(var i=0;i<tds.length;i++){
    var t=(tds[i].textContent||'').trim(); if(!t) continue;
    for(var k=0;k<FORM_FILL.length;k++){
      if(!FORM_FILL[k][0].test(t)) continue;
      var v=FORM_FILL[k][1](f); if(!v) break;
      var nx=tds[i].nextElementSibling;
      if(nx && !(nx.textContent||'').trim()){ nx.textContent=v; }
      break;
    }
  }
  return "<p class='note'>※ <b>원본 서식 그대로 변환</b>(03_과거자료 .hwp) — 라벨 옆 칸은 기금 데이터 자동 채움. 빈칸은 수기 기입. 이 창에서 바로 수정하세요.</p>"+d.innerHTML;
}

// 저장된 서식 HTML 살균 — 스크립트·이벤트핸들러·위험 URL 제거(저장형 XSS 차단)
function sanitizeDocHTML(html){
  var s=String(html||'');
  s=s.replace(/<style[\s\S]*?<\/style>/gi,'')          // 전역 style 유출 차단
     .replace(/<script[\s\S]*?<\/script>/gi,'')
     .replace(/<\/?(iframe|object|embed|link|meta|form|base)\b[^>]*>/gi,'');
  var box=document.createElement('div'); box.innerHTML=s;
  var all=box.querySelectorAll('*');
  for(var i=0;i<all.length;i++){ var el=all[i];
    for(var j=el.attributes.length-1;j>=0;j--){ var a=el.attributes[j], n=a.name.toLowerCase(), v=String(a.value||'');
      if(n.indexOf('on')===0) el.removeAttribute(a.name);                                  // onerror/onclick 등
      else if((n==='href'||n==='src'||n==='xlink:href')&&/^\s*(javascript|data(?!:image\/(png|jpe?g|gif|webp|svg\+xml);)|vbscript):/i.test(v)) el.removeAttribute(a.name);
      else if(n==='style'&&/expression\s*\(|javascript:/i.test(v)) el.removeAttribute(a.name);
    }
  }
  return box.innerHTML;
}
function _showDocHTML(html){ var w=$('docwrap'); if(!w)return;
  var body=sanitizeDocHTML(html);
  w.innerHTML='<div id="docstage"><div id="doced" contenteditable="true" style="outline:none"></div></div>';
  paginateDoc(body);            // A4 본문높이에 맞춰 장을 나누고 쪽수를 붙인다
  var ed=$('doced');
  if(ed&&!ed._dirtyBound){ ed._dirtyBound=1;
    ed.addEventListener('input',function(){ markDirty();
      clearTimeout(ed._ovT); ed._ovT=setTimeout(function(){ markA4Overflow(); fitDocA4(); },400); }); }
  fitDocA4();
}

/* ── 생성 서식 → 한글(HWPX) 저장 ──
   화면에서 편집한 내용(#doced) 그대로 문단·표로 변환. 한글 프로그램 없이도 생성된다.
   문단+표 조립 방식이라 관공서 별지서식의 정밀 격자·도장란까지는 재현하지 않는다.
   (양식 그대로 제출해야 하면 기존 [🖨 인쇄/PDF] 또는 원본 엑셀 채움을 쓴다.) */
function docToHwpx(kind){
  confirmM('한글(HWPX) 저장은 화면 초안을 문단·표로 재조립한 것입니다.\n별지 서식의 정밀 격자·체크박스·도장란은 원본과 다르게 보일 수 있습니다.\n\n원본 모양 그대로 필요하면:\n· 엑셀 채워받기(인가 6종·지원신청서 — 형태 100%)\n· 📄 HWP 편집(원본 .hwp 등록 후)\n\n그래도 HWPX로 저장할까요?',{ok:'HWPX 저장'})
    .then(function(ok){ if(ok)_docToHwpxRun(kind); });
}
function _docToHwpxRun(kind){
  var ed=$('doced'); if(!ed){ toast('문서를 먼저 여세요','warn'); return; }
  if(typeof HWPX==='undefined'){ toast('한글 변환 모듈을 불러오지 못했습니다 — 새로고침 후 다시 시도','err'); return; }
  var f=funds[S.formFund]||{};
  try{
    HWPX.setPage({landscape:false});          // 서식은 A4 세로
    var body='';
    Array.prototype.forEach.call(ed.querySelectorAll('h1,h2,h3,p,table'), function(el){
      if(el.tagName!=='TABLE' && el.closest('table')) return;   // 표 안 문단은 표에서 함께 처리
      if(el.tagName==='TABLE'){
        var rows=[];
        Array.prototype.forEach.call(el.rows, function(tr){
          rows.push(Array.prototype.map.call(tr.cells, function(c){
            return String(c.innerText||c.textContent||'').replace(/ /g,' ').replace(/\s*\n\s*/g,'\n').trim();
          }));
        });
        if(!rows.length) return;
        var n=Math.max.apply(null, rows.map(function(r){ return r.length; }));   // 병합셀 대비 열 수 정규화
        rows=rows.map(function(r){ var q=r.slice(0,n); while(q.length<n) q.push(''); return q; });
        var ratios=[]; for(var i=0;i<n;i++) ratios.push(1);
        body+=HWPX.tablePara(rows, HWPX.cols(ratios))+HWPX.para('');
      } else {
        var t=String(el.textContent||'').replace(/ /g,' ').replace(/\s+/g,' ').trim();
        if(!t) return;
        body+=HWPX.para(t, (el.tagName==='H1'||el.tagName==='H2'||el.tagName==='H3')?'90':'0');
      }
    });
    if(!body){ toast('내보낼 내용이 없습니다','warn'); return; }
    var name=((f.short_name||f.name||'기금')+'_'+docLabel(kind)+'_'+ymd()+'.hwpx').replace(/[\\/:*?"<>|]/g,'_');
    HWPX.download(body, name);
    toast('한글 파일로 저장했습니다');
  }catch(e){ toast('한글 변환 실패: '+((e&&e.message)||e),'err'); }
}
/* 인쇄·PDF — A4 세로 고정. 화면과 같은 규격(여백 20mm, 본문 170mm)으로 나온다.
   화면용 용지 그림자·테두리는 인쇄에서 제거하고, .a4 낱장마다 페이지를 나눈다. */
function printDoc(){ var ed=$('doced'); if(!ed)return;
  var w=window.open('','_blank'); if(!w){ toast('팝업이 차단되었습니다','err'); return; }
  var body=sanitizeDocHTML(ed.innerHTML);
  if(!/class\s*=\s*["']a4["']/.test(body)) body='<div class="a4">'+body+'</div>';
  w.document.write('<!doctype html><meta charset=utf-8><title>서식 인쇄</title><style>'+dgDocCss()
    +'.a4{box-shadow:none;border:0;background:#fff}.a4of{display:none}'   // 화면용 넘침배지는 인쇄 제외
    // 새 창 화면에서는 용지처럼(여백 포함) 보이게, 인쇄 시엔 @page 여백이 대신한다
    +'@media screen{body{background:#f1f3f7;padding:16px}'
    +'.a4{box-sizing:content-box;padding:'+A4_PAD+';box-shadow:0 1px 6px rgba(0,0,0,.18);margin:0 auto 16px}}'
    +'</style>'+body);
  w.document.close(); setTimeout(function(){ w.print(); },400); }

function _fillWbBuffer(key){

  return idbGet(key).then(function(buf){
    if(!buf) throw new Error('먼저 원본 엑셀을 등록하세요');
    return _loadSites(fid).then(function(sites){
      var wb=new ExcelJS.Workbook();

  });

function fillSetup(wb,f,sites){

/* 기금출연확인서(사업장별) — [기업정보] 시트를 참여사업장으로 채우면
   확인서 시트가 연번(CJ3) 기준 VLOOKUP으로 해당 사업장 확인서를 만든다.
   출연금 = 상시근로자수 × 1인당 출연단가(fund.contrib_per_worker, 기본 400,000).
   ※ 대표자·근로자 생년월일은 개인정보라 시스템에 저장하지 않음 → 빈 칸(엑셀에서 직접 입력). */
function fillContribXls(wb,f,sites){
  var info=wb.getWorksheet('기업정보'); if(!info) throw new Error('기업정보 시트를 찾을 수 없습니다');
  var rate=num(f.contrib_per_worker)||400000;
  sites.forEach(function(s,i){
    var r=2+i;
    info.getCell(r,1).value=i+1;
    setC(info,'B'+r,s.name||''); setC(info,'C'+r,s.ceo||'');
    var n=num(s.company_size)||0;
    if(n) info.getCell(r,8).value=n;
    var amt=info.getCell(r,9);
    if(amt.type!==ExcelJS.ValueType.Formula) amt.value=n?n*rate:null;
  });
  if(info.rowCount>=2+sites.length) clearRange(info,2+sites.length,info.rowCount,1,9);
  var doc=wb.getWorksheet('6.기금출연확인서');
  if(doc) doc.eachRow({includeEmpty:false},function(row){
    row.eachCell({includeEmpty:false},function(c){
      if(typeof c.value==='string'&&c.value.indexOf('{{기금명}}')>=0)
        c.value=c.value.split('{{기금명}}').join(f.name||'');
    });
  });
}
function fillSubsidy(wb,f,sites){
  if((f.fund_type||'')!=='공동') throw new Error('지원신청서는 공동근로복지기금 전용입니다');
  var info=wb.getWorksheet('기금법인정보'); if(!info) throw new Error('기금법인정보 시트를 찾을 수 없습니다');
  var yrs=f.years||{}, sub={};
  Object.keys(yrs).sort().reverse().some(function(y){ if(yrs[y]&&yrs[y].subsidy){sub=yrs[y].subsidy;return true;} return false; });
  var workerTotal=num(sub.worker_count)||sites.reduce(function(s,x){return s+(num(x.company_size)||0);},0)||'';
  var contribution=num(f.contribution_total)||num(sub.contribution)||'';
  var applyAmt=num(sub.apply_amount)||contribution||'';
  setC(info,'A2',1); setC(info,'B2',f.name||''); setC(info,'C2',f.chairman||''); setC(info,'D2',f.address||'');
  setC(info,'E2',f.phone||''); setC(info,'F2',f.inka_no||''); setC(info,'G2',f.corp_reg_no||''); setC(info,'H2',f.tax_id_no||'');
  setC(info,'I2',f.reg_date||f.inka_date||''); setC(info,'J2',sites.length||''); setC(info,'K2',workerTotal);
  setC(info,'L2',contribution); setC(info,'N2',applyAmt); setC(info,'S2',f.rep_org||''); setC(info,'T2',sub.author||f.manager||'');
  ['P2','Q2','R2'].forEach(function(a){setC(info,a,'');});
  clearRange(info,3,8,2,20);   // 다른 기금 샘플행 B~T
  var parts=wb.getWorksheet('참여사업장정보'); if(parts){
    sites.forEach(function(s,i){ var r=3+i, c=_siteContacts(s);
      setC(parts,'A'+r,'1-'+(i+1)); parts.getCell(r,2).value=i+1; setC(parts,'C'+r,s.name||''); setC(parts,'D'+r,s.ceo||'');
      setC(parts,'E'+r,s.address||''); var sz=num(s.company_size)||''; if(sz!==''){parts.getCell(r,6).value=sz;parts.getCell(r,10).value=sz;}
      setC(parts,'G'+r,s.biz_type||''); setC(parts,'I'+r,s.biz_no||''); setC(parts,'K'+r,c.name); setC(parts,'N'+r,c.phone); setC(parts,'O'+r,c.email); });
    if(parts.rowCount>=3+sites.length) clearRange(parts,3+sites.length,parts.rowCount,1,20);
  }
  var doc=wb.getWorksheet('신청서'); if(doc){
    setC(doc,'AM3',1); var keys=[];
    doc.getColumn(9).eachCell({includeEmpty:false},function(cell){ if(typeof cell.value==='string'&&/^\d+-\d+$/.test(cell.value.trim())) keys.push(cell); });
    keys.sort(function(a,b){return a.row-b.row;});
    keys.forEach(function(cell,idx){ if(cell.type!==ExcelJS.ValueType.Formula) cell.value=idx<sites.length?('1-'+(idx+1)):null; });
  }
}

function _deleteSetupFund(fid,goHome){
  var f=funds[fid]; if(!f) return;
  var msg='"'+(f.short_name||f.name)+'"을(를) 완전히 삭제할까요?\n\n'
    +'※ 되돌릴 수 없습니다. 기금 정보·참여사업장·서식 저장본·연간일정·목적사업·거래내역·청구·업로드 파일이 모두 지워집니다.\n'
    +'(보관만 하려면 취소하고 그대로 두세요)';
  confirmM(msg,{ok:'완전 삭제',danger:true}).then(function(ok){
    if(!ok) return null;
    // ① 서버 최신값 재확인 — 확인창 떠 있는 동안 복원됐을 수 있음
    return fbDb.ref(NS+'/funds/'+fid).once('value').then(function(fs){
      var sv=fs.val()||{};
      if(!sv.deleted&&sv.setup_stage!=='설립준비'){
        toast('보관 중인 기금이 아닙니다(복원됨?) — 완전 삭제 취소','warn'); return 'abort';
      }
      // ② Storage 업로드 파일 먼저 정리(메타 삭제 전이라 경로를 알 수 있음)
      return fbDb.ref(NS+'/subsidy_docs/'+fid).once('value')
        .then(function(ds){
          var d=ds.val()||{}, paths=[];
          Object.keys(d).forEach(function(yr){ var y=d[yr]||{};
            Object.keys(y).forEach(function(id){ if(y[id]&&y[id].path) paths.push(y[id].path); }); });
          if(!fbStore||!paths.length) return null;
          return Promise.all(paths.map(function(p){ return fbStore.ref(p).delete().catch(function(){}); }));
        })
        .catch(function(){ return null; });
    }).then(function(st){
      if(st==='abort') return 'abort';
      // ③ 기금 하위 데이터 일괄 삭제
      var up={}; up['funds/'+fid]=null; up['sites/'+fid]=null; up['annual/'+fid]=null;
      up['subsidy_docs/'+fid]=null; up['doc_edits/'+fid]=null; up['welfare/'+fid]=null;
      up['events/'+fid]=null; up['txns/'+fid]=null;
      return fbDb.ref(NS).update(up);
    }).then(function(st){
      if(st==='abort') return 'abort';
      // ④ 이 기금 청구 항목 정리 — 실패해도 본체는 지워졌으므로 '일부 실패'로 알린다(성공으로 속이지 않음)
      return fbDb.ref(NS+'/billings').once('value').then(function(bs){
        var b=bs.val()||{}, del={};
        Object.keys(b).forEach(function(k){ if(b[k]&&b[k].fund_id===fid) del[k]=null; });
        return Object.keys(del).length?fbDb.ref(NS+'/billings').update(del):null;
      }).then(function(){ return 'ok'; }).catch(function(){ return 'partial'; });
    }).then(function(st){
      if(st==='abort') return;
      delete funds[fid]; closeM();
      if(goHome){ _go('home'); }
      else { S.homeTab='trash'; if(S.view==='fund'){_go('home');} else {renderHome();} }
      if(st==='partial') toast('기금은 삭제됐지만 청구 항목 일부가 남았습니다 — 청구 관리에서 확인하세요','warn');
      else toast('완전 삭제되었습니다');
    }).catch(function(e){ toast('삭제 실패: '+(e&&e.message||e),'err'); });
  });
}

function bindDocIntake(){
  [['dz-inka','inka'],['dz-corpreg','corpreg'],['dz-taxid','taxid']].forEach(function(p){
    _dzHandler[p[0]]=function(files){ readDocInto(p[0],p[1],files[0]); };

var _docFound={}, _docOcr=false, _docFid=null;   // 판독 결과는 시작 시점 기금에 귀속
function readDocInto(zid,kind,file){
  if(!file) return;
  var def=DOC_PARSE[kind], nm=file.name||'', isPdf=/\.pdf$/i.test(nm);
  var myFid=S.fundId;
  if(_docFid&&_docFid!==myFid){ _docFound={}; _docOcr=false; }   // 기금이 바뀌었으면 이전 결과 폐기
  _docFid=myFid;
  var stat=function(h){ if(S.fundId===myFid) dzStat(zid,h); };
  var done=function(txt,viaOcr){
    if(S.fundId!==myFid) return;    // 판독 도중 다른 기금으로 이동 → 결과 버림
    var got=def.fn(txt), keys=Object.keys(got).filter(function(k){return got[k];});
    if(!keys.length){ stat('<span style="color:var(--warn)">글자는 읽었지만 항목을 못 찾았습니다</span>'
      +(viaOcr?'<br><span class="muted" style="font-size:11px">스캔 상태가 나쁘면 인식이 어렵습니다 — 직접 입력하세요.</span>':'')); return; }
    stat('<span style="color:#0a7">✓ '+keys.length+'개 항목 판독'+(viaOcr?' <span class="chip warn" style="font-size:10px">OCR</span>':'')+'</span>');
    if(viaOcr) _docOcr=true;
    Object.assign(_docFound,got); renderDocIntake();
  };
  var fail=function(e){ stat('<span style="color:var(--danger)">읽기 실패: '+esc((e&&e.message)||e)+'</span>'); };
  var ocrPath=function(bufOrFile){    // 스캔 → 그림을 글자로
    stat('<span class="muted">스캔 문서 — OCR 시작…</span>');
    var prep = isPdf ? pdfPageCanvases(bufOrFile,2) : imgCanvas(bufOrFile).then(function(c){return [c];});
    prep.then(function(cvs){ return ocrCanvases(cvs,function(m){ stat('<span class="muted">'+esc(m)+'</span>'); }); })
        .then(function(t){ done(t,true); }).catch(fail);
  };
  if(!isPdf){ ocrPath(file); return; }
  stat('<span class="muted">읽는 중… '+esc(nm)+'</span>');
  var rd=new FileReader();
  rd.onload=function(){
    var buf=new Uint8Array(rd.result);
    pdfText(buf).then(function(txt){
      if(txt&&txt.replace(/\s/g,'').length>=40) done(txt,false);   // 텍스트 PDF — 100% 정확
      else ocrPath(buf);                                           // 스캔 PDF → OCR
    }).catch(function(){ ocrPath(buf); });
  };
  rd.onerror=function(){ stat('<span style="color:var(--danger)">파일을 열 수 없습니다</span>'); };
  rd.readAsArrayBuffer(file);
}

function num(v){ if(v==null||v==='')return ''; if(typeof v==='number')return Math.round(v);
  var s=String(v).trim(), neg=false;
  if(/^\(.+\)$/.test(s)){ neg=true; s=s.slice(1,-1); }            // (1,000) = 음수
  if(/-\s*$/.test(s)){ neg=true; s=s.replace(/-\s*$/,''); }        // 1,000- = 음수
  var plain=s.replace(/,/g,'');
  if(/^[+-]?\d*\.?\d+e[+-]?\d+$/i.test(plain)){ var sci=parseFloat(plain); return isNaN(sci)?'':Math.round(neg?-sci:sci); } // 1E+6 지수표기
  s=s.replace(/[^0-9.\-]/g,''); if(s===''||s==='-'||s==='.')return '';
  var n=Math.round(parseFloat(s)); if(isNaN(n))return ''; return neg?-Math.abs(n):n; }

  SITE_FIELDS.forEach(function(c){var el=$('se-'+c[0]);if(el)obj[c[0]]=el.value.trim();});
  if(!obj.name){ toast('상호를 입력하세요','warn'); return; }
  // 담당자: 기존 contacts 배열 유지하되 대표 담당자 항목만 갱신(없으면 추가)
  var pc=_primaryContact(obj), cv={};
  CONTACT_FIELDS.forEach(function(c){var el=$('sc-'+c[0]);if(el)cv[c[0]]=el.value.trim();});
  var hasContact=cv.name||cv.mobile||cv.email||cv.position;
  var list=pc.list.slice();
  if(hasContact){
    var item={name:cv.name||'',position:cv.position||'',phone:'',mobile:cv.mobile||'',email:cv.email||'',isPrimary:true};
    if(pc.idx>=0){ list[pc.idx]=Object.assign({},list[pc.idx],item); } else { list.unshift(item); }
  } else if(pc.idx>=0){ list.splice(pc.idx,1); }   // 담당자 비우면 대표 항목 제거
  obj.contacts=list;
  var _fid=S.fundId;   // 저장 대상 기금 고정(응답 전 이동 대비)
  var done=function(){ _sitePrefill=null; if(S.sitesFor===_fid)S.sitesFor=null; closeM();
    if(S.view==='fund'&&S.fundId===_fid)renderFund(); toast('사업장이 저장되었습니다'); };
  var err=function(e){ toast('저장 실패: '+(e&&e.message||e),'err'); };
  if(sid){
    /* 기존 사업장은 set(전체 덮어쓰기)이 아니라 update(이 화면에서 다룬 항목만)로 저장한다.
       다른 세션이 이 화면에 없는 필드를 고쳐 놨어도 그 값이 지워지지 않게 하기 위함. */
    var patch={contacts:list};
    SITE_FIELDS.forEach(function(c){ if(Object.prototype.hasOwnProperty.call(obj,c[0])) patch[c[0]]=obj[c[0]]; });
    if(obj.status) patch.status=obj.status;
    fbDb.ref(NS+'/sites/'+_fid+'/'+sid).update(patch).then(done).catch(err);
  }else{
    fbDb.ref(NS+'/sites/'+_fid).push().set(obj).then(done).catch(err);
  }
}

var _coCache=null;
function _normCo(v){
  if(!v) return []; if(!Array.isArray(v)) v=Object.keys(v).map(function(k){return v[k];});
  var seen={};
  return v.filter(function(c){return c&&c.name&&(c.status!=='deleted');})
    .filter(function(c){ var id=c.id||c.bizNo||c.name; if(seen[id])return false; seen[id]=1; return true; })
    .sort(function(a,b){return (a.name||'').localeCompare(b.name||'','ko');});
}
function loadCompanies(){
  if(_coCache) return Promise.resolve(_coCache);
  try{ var raw=localStorage.getItem('pureun_v6_companies');
    if(raw){ var a=_normCo(JSON.parse(raw)); if(a.length){ _coCache=a; return Promise.resolve(a); } } }catch(e){}
  return fbDb.ref('data/companies/v').once('value').then(function(s){ _coCache=_normCo(s.val()); return _coCache; })
    .catch(function(){ _coCache=[]; return _coCache; });
}
function _coContacts(co){

  if(!cts.length && (co.primaryContactName||co.primaryContactPhone||co.primaryContactEmail))
    cts=[{name:co.primaryContactName||'',position:'',phone:'',mobile:co.primaryContactPhone||'',email:co.primaryContactEmail||'',isPrimary:true}];

}

function _digits(v){ return String(v==null?'':v).replace(/\D/g,''); }   // 사업자번호 비교용(구분기호 무시)
var SITE_COLMAP=[
  ['name',        ['상호','사업장명','회사명','업체명','기업명','사업장','회사']],
  ['ceo',         ['대표자','대표','대표이사','성명']],
  ['biz_no',      ['사업자등록번호','사업자번호','사업자','등록번호']],
  ['biz_type',    ['업종','업태','종목']],
  ['company_size',['상시근로자','근로자수','인원','상시','직원수','근로자']],
  ['address',     ['소재지','주소','사업장주소']],
  ['seq_label',   ['번호','연번','순번','no']]
];
function _pickCol(headers,cands){
  for(var i=0;i<headers.length;i++){
    var h=String(headers[i]||'').replace(/\s/g,'');
    for(var j=0;j<cands.length;j++) if(h && h.indexOf(cands[j].replace(/\s/g,''))>=0) return i;
  }
  return -1;
}
function bindSiteXlsx(){ _dzHandler['dz-sites']=function(files){ readSiteXlsx(files[0]); }; }
var _sitePend=null;
function readSiteXlsx(file){
  if(!file) return;
  if(typeof XLSX==='undefined'){ dzStat('dz-sites','<span style="color:var(--danger)">엑셀 라이브러리 로드 실패 — 새로고침</span>'); return; }
  dzStat('dz-sites','<span class="muted">읽는 중… '+esc(file.name||'')+'</span>');
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var best=null;
      wb.SheetNames.forEach(function(sn){
        var rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:''});
        // 헤더행 찾기 — '상호/사업장명/회사명' 계열이 있는 첫 줄
        for(var r=0;r<Math.min(rows.length,15);r++){
          if(_pickCol(rows[r],SITE_COLMAP[0][1])>=0){
            var map={}; SITE_COLMAP.forEach(function(m){ var i=_pickCol(rows[r],m[1]); if(i>=0)map[m[0]]=i; });
            if(!best||Object.keys(map).length>Object.keys(best.map).length) best={sheet:sn,rows:rows,hdr:r,map:map};
            break;
          }
        }
      });
      if(!best){ dzStat('dz-sites','<span style="color:var(--warn)">사업장 표를 못 찾았습니다</span><br><span class="muted" style="font-size:11px">첫 행에 <b>상호</b>(또는 사업장명·회사명) 열이 있어야 합니다.</span>'); return; }
      var out=[];
      for(var r=best.hdr+1;r<best.rows.length;r++){
        var row=best.rows[r]; if(!row) continue;
        var o={};
        Object.keys(best.map).forEach(function(k){ o[k]=String(row[best.map[k]]==null?'':row[best.map[k]]).trim(); });
        if(!o.name) continue;
        if(/합\s*계|소\s*계|총\s*계/.test(o.name)) continue;      // 합계행 제외
        o.company_size=String(num(o.company_size)||'');
        out.push(o);
      }
      if(!out.length){ dzStat('dz-sites','<span style="color:var(--warn)">데이터 행이 없습니다</span>'); return; }
      // 읽기 시작 시점의 기금을 고정 — 미리보기 중 다른 기금으로 옮겨도 그 기금에 등록되지 않게
      _sitePend={list:out,sheet:best.sheet,cols:Object.keys(best.map),fid:S.fundId,fname:(funds[S.fundId]&&(funds[S.fundId].short_name||funds[S.fundId].name))||''};
      dzStat('dz-sites','<span style="color:var(--ok,#0a7)">✓ '+out.length+'개 사업장 인식 ('+esc(best.sheet)+')</span>');
      renderSitePend();
    }catch(e){ dzStat('dz-sites','<span style="color:var(--danger)">읽기 실패: '+esc(e.message||e)+'</span>'); }
  };
  rd.readAsArrayBuffer(file);
}

  var L=_sitePend.list, show=L.slice(0,8);

    +show.map(function(s){ return '<tr><td style="font-weight:600">'+esc(s.name)+'</td><td>'+esc(s.ceo||'—')+'</td><td>'+esc(s.biz_no||'—')

    +'</tbody></table></div>'+(L.length>show.length?'<div class="muted" style="font-size:11.5px;margin-top:4px">…외 '+(L.length-show.length)+'개</div>':'')

function commitSiteXlsx(){
  if(!_sitePend||!_sitePend.list.length) return;
  var fid=_sitePend.fid, list=_sitePend.list;      // 읽을 때 고정한 기금에 등록
  if(!fid||!funds[fid]){ toast('대상 기금을 찾을 수 없습니다 — 다시 올려주세요','err'); return; }
  var nm=_sitePend.fname||fid;
  confirmM('['+nm+']에 사업장 '+list.length+'건을 등록할까요?\n(사업자번호가 이미 있는 곳은 건너뜁니다)',{ok:'등록'}).then(function(ok){
    if(!ok) return;
    // 중복 검사는 캐시가 아니라 서버 최신값으로 — 다른 세션이 그새 추가했을 수 있음
    return fbDb.ref(NS+'/sites/'+fid).once('value').then(function(s){
      var cur=s.val()||{}, haveBiz={};
      Object.keys(cur).forEach(function(k){ var b=_digits(cur[k].biz_no||''); if(b)haveBiz[b]=1; });
      var add={}, n=0, skip=0, base=Object.keys(cur).length;
      list.forEach(function(x){
        var b=_digits(x.biz_no||'');
        if(b&&haveBiz[b]){ skip++; return; }
        if(b) haveBiz[b]=1;
        var id=fbDb.ref(NS+'/sites/'+fid).push().key; n++;
        add[id]={name:x.name,ceo:x.ceo||'',biz_no:x.biz_no||'',biz_type:x.biz_type||'',
                 company_size:x.company_size||'',address:x.address||'',
                 seq_label:x.seq_label||String(base+n),status:'active'};
      });
      if(!n){ toast('추가할 사업장이 없습니다(모두 중복)','warn'); return null; }
      return fbDb.ref(NS+'/sites/'+fid).update(add).then(function(){
        _sitePend=null;
        if(S.sitesFor===fid) S.sitesFor=null;                       // 해당 기금 캐시만 무효화
        if(S.view==='fund'&&S.fundId===fid&&S.tab==='sites') renderFund();
        toast(n+'개 사업장이 등록되었습니다'+(skip?(' · 중복 '+skip+'개 건너뜀'):''));
      });
    }).catch(function(e){ toast('등록 실패: '+(e&&e.message||e),'err'); });
  });
}

function uploadSubDoc(){
  if(!fbStore){ toast('Storage 미설정','err'); return; }

    var path='fund_erp/subsidy_docs/'+_fid+'/'+_yr+'/'+Date.now()+'_'+safe;
    var ref=fbStore.ref(path);
    ref.put(file).then(function(){ return ref.getDownloadURL(); }).then(function(url){
      var rec={kind:kind,name:file.name,url:url,path:path,uploaded:ymd()};

      .catch(function(e){ toast('업로드 실패: '+e.message,'err'); });

function saveSubsidy(){

  if(funds[_fid]&&funds[_fid].fund_type==='사내'){ toast('사내근로복지기금은 지원금 대상이 아닙니다','warn'); return; }
  var obj={}; SUB_FIELDS.forEach(function(c){var el=$('su-'+c[0]); if(!el)return;
    var raw=String(el.value==null?'':el.value).trim();

  });

     오래 열어둔 이 화면 때문에 지워지는 것을 막는다. */
  fbDb.ref(NS+'/funds/'+_fid+'/years/'+_yr+'/subsidy').update(obj).then(function(){
    var t=funds[_fid]; if(!t) return;

function won(n){return (n||0).toLocaleString()+'원';}
function computeFin(arr){
  var yd=(funds[S.fundId]&&funds[S.fundId].years&&funds[S.fundId].years[S.year])||{}, opening=yd.opening||{};
  var appr=arr.filter(function(x){return x.approved&&x.debit&&x.credit;});
  var acc={};
  appr.forEach(function(x){var amt=num(x.deposit)||num(x.withdraw)||0;
    (acc[x.debit]=acc[x.debit]||{d:0,c:0}).d+=amt; (acc[x.credit]=acc[x.credit]||{d:0,c:0}).c+=amt;});
  var tb={}; Object.keys(acc).forEach(function(name){var v=acc[name];
    tb[name]={type:ACCT_CHART[name]||'비용',debit:v.d,credit:v.c,bal_d:Math.max(v.d-v.c,0),bal_c:Math.max(v.c-v.d,0)};});
  // 유형별 전 계정 집계(부호 있는 잔액) — 목록에 없는 계정도 누락 없이 대차가 맞도록
  function sg(a){var v=tb[a]||{debit:0,credit:0};return v.debit-v.credit;}
  var PURPOSE=PURPOSE_ACCTS;
  var ADMIN=['지급수수료','사무용품비','기타관리비'];
  var CORE_ASSET=['현금성자산','정기예금','근로자대부금'];
  var revenue=0,purpose=0,admin=0,otherExp=0,liab=0,otherAsset=0,otherEquity=0;
  Object.keys(tb).forEach(function(n){var v=tb[n],s=v.debit-v.credit;
    if(v.type==='수익')revenue+=-s;
    else if(v.type==='부채')liab+=-s;
    else if(v.type==='자본'&&n!=='기본재산')otherEquity+=-s;
    else if(v.type==='비용'){ if(PURPOSE.indexOf(n)>=0)purpose+=s; else if(ADMIN.indexOf(n)>=0)admin+=s; else otherExp+=s; }
    else if(v.type==='자산'&&CORE_ASSET.indexOf(n)<0)otherAsset+=s;});
  var interest=revenue;
  var cash=sg('현금성자산')+(num(opening.cash)||0), savings=sg('정기예금')+(num(opening.savings)||0);
  var loan=sg('근로자대부금')+(num(opening.loan)||0), basic=-sg('기본재산')+(num(opening.basic)||0);
  liab+=(num(opening.reserve)||0);
  var net=revenue-purpose-admin-otherExp, retained=(num(opening.retained)||0)+otherEquity+net;
  var totalAssets=cash+savings+loan+otherAsset, equity=basic+retained, totalLiabEq=liab+equity;
  return {tb:tb,appr:appr.length,interest:interest,purpose:purpose,admin:admin,otherExp:otherExp,
    cash:cash,savings:savings,loan:loan,otherAsset:otherAsset,basic:basic,liab:liab,
    totalAssets:totalAssets,net:net,retained:retained,equity:equity,totalLiabEq:totalLiabEq,
    balanced:totalAssets===totalLiabEq,opening:opening};
}
function finPanel(arr){

  var op=f.opening||{};
  function oi(k,lbl){return '<div class="fld"><label>'+lbl+'</label><input id="op-'+k+'" value="'+esc(op[k]||'')+'" placeholder="0"></div>';}
  var openingHtml='<div style="margin-top:14px"><div style="font-weight:700;margin-bottom:6px">전기이월(기초잔액) — 있으면 입력</div>'

  // ⑻ 전기이월(기초잔액)을 시산표 맨 위에 표시 — 재무상태표와 대차가 맞는 이유를 드러냄
  var openMap=[['현금성자산',op.cash],['정기예금',op.savings],['근로자대부금',op.loan],['기본재산',op.basic],['이월잉여금',op.retained],['고유목적사업준비금',op.reserve]];
  var openRows=openMap.filter(function(m){return num(m[1]);}).map(function(m){
    var typ=ACCT_CHART[m[0]]||'자본', v=num(m[1])||0, isDr=(typ==='자산'||typ==='비용');

  var tbRows=openRows+Object.keys(f.tb).sort().map(function(n){var v=f.tb[n];
    return '<tr><td>'+esc(n)+'</td><td class="muted">'+v.type+'</td><td style="text-align:right">'+(v.bal_d?v.bal_d.toLocaleString():'')+'</td><td style="text-align:right">'+(v.bal_c?v.bal_c.toLocaleString():'')+'</td></tr>';}).join('');
  var balChip = f.balanced
    ? '<span class="chip ok">✅ 대차일치</span>'
    : '<span class="chip warn">⚠️ 대차차이 '+won(f.totalAssets-f.totalLiabEq)+' — 전기이월 확인</span>';
  return '<div class="panel"><div class="row"><h2>결산·재무제표</h2><span class="stat">승인 '+f.appr+'건 기준</span>'+balChip

    +'<div class="row" style="align-items:flex-start;gap:24px;margin-top:12px;flex-wrap:wrap">'
    +'<div style="min-width:280px;flex:1"><div style="font-weight:700;margin-bottom:6px">재무상태표</div><table>'
      +'<tr><td>현금성자산</td><td style="text-align:right">'+won(f.cash)+'</td></tr>'
      +'<tr><td>정기예금</td><td style="text-align:right">'+won(f.savings)+'</td></tr>'
      +'<tr><td>근로자대부금</td><td style="text-align:right">'+won(f.loan)+'</td></tr>'
      +(f.otherAsset?'<tr><td>기타자산</td><td style="text-align:right">'+won(f.otherAsset)+'</td></tr>':'')
      +'<tr style="font-weight:700"><td>자산 총계</td><td style="text-align:right">'+won(f.totalAssets)+'</td></tr>'
      +'<tr><td>고유목적사업준비금(부채)</td><td style="text-align:right">'+won(f.liab)+'</td></tr>'
      +'<tr><td>기본재산</td><td style="text-align:right">'+won(f.basic)+'</td></tr>'
      +'<tr><td>이월잉여금</td><td style="text-align:right">'+won(f.retained)+'</td></tr>'
      +'<tr style="font-weight:700"><td>부채·자본 총계</td><td style="text-align:right">'+won(f.totalLiabEq)+'</td></tr></table></div>'
    +'<div style="min-width:280px;flex:1"><div style="font-weight:700;margin-bottom:6px">운영성과표</div><table>'
      +'<tr><td>이자수익</td><td style="text-align:right">'+won(f.interest)+'</td></tr>'
      +'<tr><td>목적사업비</td><td style="text-align:right">'+won(f.purpose)+'</td></tr>'
      +'<tr><td>운영비(관리비)</td><td style="text-align:right">'+won(f.admin)+'</td></tr>'
      +(f.otherExp?'<tr><td>기타비용(정기예금전입 등)</td><td style="text-align:right">'+won(f.otherExp)+'</td></tr>':'')
      +'<tr style="font-weight:700"><td>당기순이익</td><td style="text-align:right">'+won(f.net)+'</td></tr></table></div></div>'

    +openingHtml+'</div>';

function saveOpening(){
  var _fid=S.fundId,_yr=S.year;
  var o={}; ['cash','savings','loan','basic','retained','reserve'].forEach(function(k){var el=$('op-'+k);if(el)o[k]=num(el.value)||0;});
  fbDb.ref(NS+'/funds/'+_fid+'/years/'+_yr+'/opening').set(o).then(function(){
    if(!funds[_fid].years)funds[_fid].years={}; if(!funds[_fid].years[_yr])funds[_fid].years[_yr]={};
    funds[_fid].years[_yr].opening=o; renderFund(); toast('전기이월 저장됨');
  }).catch(function(e){toast('저장 실패: '+e.message,'err');});
}

    +'th{background:#f0f0f0;text-align:left}td.n{text-align:right}.sub{color:#555;font-size:12px}@media print{button{display:none}}</style>'

    +'<p class="sub">기금법인: <b>'+esc(fd.name||'')+'</b> · 회계연도: '+S.year+'년 · 인가번호: '+esc(fd.inka_no||'-')+' · 고유번호: '+esc(fd.tax_id_no||'-')+'</p>'
    +'<table><tr><th>구분</th><th>금액(원)</th><th>금액(천원)</th></tr>'
    +'<tr><td>기본재산 총액</td><td class=n>'+won(f.basic)+'</td><td class=n>'+k(f.basic)+'</td></tr>'
    +'<tr><td>당기 운용수익금(이자 등)</td><td class=n>'+won(f.interest)+'</td><td class=n>'+k(f.interest)+'</td></tr>'
    +'<tr><td>근로자 대부금 잔액</td><td class=n>'+won(f.loan)+'</td><td class=n>'+k(f.loan)+'</td></tr>'
    +'<tr><td>목적사업비(복지사업 집행)</td><td class=n>'+won(f.purpose)+'</td><td class=n>'+k(f.purpose)+'</td></tr>'
    +'<tr><td>운영비(관리비)</td><td class=n>'+won(f.admin)+'</td><td class=n>'+k(f.admin)+'</td></tr>'
    +(f.otherExp?'<tr><td>기타비용(정기예금전입 등)</td><td class=n>'+won(f.otherExp)+'</td><td class=n>'+k(f.otherExp)+'</td></tr>':'')
    +(f.liab?'<tr><td>고유목적사업준비금(부채)</td><td class=n>'+won(f.liab)+'</td><td class=n>'+k(f.liab)+'</td></tr>':'')
    +'<tr style="font-weight:700"><td>당기순이익</td><td class=n>'+won(f.net)+'</td><td class=n>'+k(f.net)+'</td></tr>'
    +'<tr style="font-weight:700"><td>자산 총계</td><td class=n>'+won(f.totalAssets)+'</td><td class=n>'+k(f.totalAssets)+'</td></tr></table>'
    +'<p class="sub" style="margin-top:16px">※ 승인된 거래 '+f.appr+'건 + 전기이월 기준 자동 집계. 실제 제출 전 검토 필요.</p>'
    +'<button onclick="print()" style="margin-top:20px;padding:8px 16px">인쇄 / PDF 저장</button>');
  w.document.close();
}
function proposeAcct(memo,isDep){
  var m=String(memo||''), dir=isDep?'입금':'출금';
  for(var i=0;i<ACCT_RULES.length;i++){ var r=ACCT_RULES[i];
    if(r.dir!==dir) continue;
    for(var j=0;j<r.kw.length;j++){ if(m.indexOf(r.kw[j])>=0) return {d:r.d,c:r.c}; }
  }
  return {d:'',c:''};
}
function parseBank(rows){
  var hi=-1, col={};
  function find(cells){for(var c=0;c<cells.length;c++){var v=String(cells[c]||'');
    if(/날짜|거래일|일자|거래일시/.test(v)&&col.date==null)col.date=c;
    if(/적요|내용|의뢰인|기재|가맹점/.test(v)&&col.memo==null)col.memo=c;
    if(/입금|맡기신/.test(v)&&!/건수|횟수|잔액|잔고/.test(v)&&col.dep==null)col.dep=c;
    if(/출금|찾으신|지급/.test(v)&&!/건수|횟수|잔액|잔고/.test(v)&&col.wd==null)col.wd=c;
    if(/잔액|잔고/.test(v)&&col.bal==null)col.bal=c;}}
  var lim=Math.min(rows.length,100);
  // 1차: 날짜열까지 있는 헤더 우선(다단 헤더 오인 방지), 2차: 입·출금열만으로 폴백
  for(var i=0;i<lim;i++){ col={}; find(rows[i]||[]); if(col.dep!=null&&col.wd!=null&&col.date!=null){ hi=i; break; } }
  if(hi<0) for(var i2=0;i2<lim;i2++){ col={}; find(rows[i2]||[]); if(col.dep!=null&&col.wd!=null){ hi=i2; break; } }
  if(hi<0) return null;
  function normDate(s){ var m=String(s||'').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if(!m) return String(s||'').trim();
    return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2); }
  var out=[];
  for(var r=hi+1;r<rows.length;r++){ var row=rows[r]; if(!row)continue;
    var date=col.date!=null?normDate(row[col.date]):'';
    var memo=col.memo!=null?String(row[col.memo]||'').trim():'';
    if(/^(합\s*계|소\s*계|총\s*계)/.test(memo)) continue;   // 합계·소계 행은 거래 아님
    var dep=num(row[col.dep])||0, wd=num(row[col.wd])||0;
    if(dep<0){ wd+=-dep; dep=0; } if(wd<0){ dep+=-wd; wd=0; } // 음수 표기 = 반대방향
    if(!date&&!memo&&!dep&&!wd) continue;
    if(!dep&&!wd) continue;
    var bal=col.bal!=null?(num(row[col.bal])||0):0;
    if(dep&&wd){ out.push({date:date,memo:memo,deposit:dep,withdraw:0,balance:bal});
                 out.push({date:date,memo:memo,deposit:0,withdraw:wd,balance:bal}); } // 입·출 동시 행 분리(분개 누락 방지)
    else out.push({date:date,memo:memo,deposit:dep,withdraw:wd,balance:bal});
  }
  return out;
}
function hkey(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 't'+(h>>>0).toString(36);}
function importBank(){
  var _fid=S.fundId, _yr=S.year;   // 클릭 시점 고정 — 로딩 중 기금·연도 이동해도 원래 경로에 저장
  if(!_fid){ toast('기금을 먼저 선택하세요','warn'); return; }
  var _fname=(funds[_fid]&&(funds[_fid].short_name||funds[_fid].name))||_fid;
  var inp=document.createElement('input'); inp.type='file'; inp.accept='.xls,.xlsx';
  inp.onchange=function(ev){ var file=ev.target.files&&ev.target.files[0]; if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
        var txns=null;   // 첫 시트가 안내문인 파일 대응 — 거래가 나올 때까지 전 시트 시도
        for(var si=0;si<wb.SheetNames.length;si++){
          var rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[si]],{header:1,raw:false,defval:''});
          var got=parseBank(rows);
          if(got&&got.length){ txns=got; break; }
          if(got&&!txns) txns=got;
        }
        if(!txns){ toast('통장 형식을 인식하지 못했습니다 (입금·출금 열 없음)','err'); return; }
        if(!txns.length){ toast('거래 내역이 없습니다','warn'); return; }
        confirmM('['+_fname+' · '+_yr+'년] '+txns.length+'건의 거래를 읽었습니다.\n자동분개 제안과 함께 가져올까요?\n(이미 있는 거래는 승인·분개를 그대로 보존합니다)',{ok:'가져오기'}).then(function(ok){ if(!ok)return;
          var path=NS+'/txns/'+_fid+'/'+_yr;
          fbDb.ref(path).once('value').then(function(snap){   // 서버 최신본 기준 중복검사 — 오래된 캐시로 승인 거래 덮어쓰기 방지
            var existing=snap.val()||{};
            var obj={}, added=0, kept=0, seen={};
            txns.forEach(function(x){ var base=x.date+'|'+x.deposit+'|'+x.withdraw+'|'+x.memo;
              var n=(seen[base]=(seen[base]||0)+1);
              var key=hkey(n>1?base+'|'+n:base);   // 같은 날 동일 금액·적요 거래도 각각 보존
              if(existing[key]||obj[key]){ kept++; return; }
              var p=proposeAcct(x.memo,x.deposit>0);
              obj[key]={date:x.date,memo:x.memo,deposit:x.deposit,withdraw:x.withdraw,balance:x.balance,debit:p.d,credit:p.c,approved:false}; added++;
            });
            if(added===0){ toast('새로 추가할 거래가 없습니다 (기존 '+kept+'건 유지)','warn'); return; }
            return fbDb.ref(path).update(obj).then(function(){ S.txnsFor=null; renderFund(); toast('가져오기 완료: 신규 '+added+'건'+(kept?' · 기존 '+kept+'건 보존':'')); });
          }).catch(function(e){ toast('저장 실패: '+e.message,'err'); });
        });
      }catch(e){ toast('파싱 실패: '+e.message,'err'); }
    };
    rd.readAsArrayBuffer(file);
  };
  inp.click();
}
function setTxnAcct(id,side,val){ var _key=S.fundId+'/'+S.year;
  fbDb.ref(NS+'/txns/'+_key+'/'+id+'/'+side).set(val)
    .then(function(){ if(S.txnsFor===_key&&S.txns&&S.txns[id])S.txns[id][side]=val; renderFund(); })
    .catch(function(e){ toast('저장 실패: '+e.message,'err'); renderFund(); }); }
function approveTxn(id,on){
  if(on){ var x=S.txns&&S.txns[id];
    if(x&&(!x.debit||!x.credit)){ toast('차변·대변 계정을 먼저 지정하세요','warn'); renderFund(); return; }
    if(x&&x.debit===x.credit){ toast('차변과 대변이 같은 계정입니다','warn'); renderFund(); return; } }
  var _key=S.fundId+'/'+S.year;
  fbDb.ref(NS+'/txns/'+_key+'/'+id+'/approved').set(on)
    .then(function(){ if(S.txnsFor===_key&&S.txns&&S.txns[id])S.txns[id].approved=on; renderFund(); })
    .catch(function(e){ toast('저장 실패: '+e.message,'err'); renderFund(); });
}
function delTxn(id){ confirmM('이 거래를 삭제할까요?',{ok:'삭제',danger:true}).then(function(ok){ if(ok) fbDb.ref(NS+'/txns/'+S.fundId+'/'+S.year+'/'+id).remove().then(function(){S.txnsFor=null;renderFund();toast('삭제되었습니다');}).catch(function(e){toast('삭제 실패: '+e.message,'err');}); }); }

// ── 간단 모달 ──
function showModal(html){
  var m=document.createElement('div'); m.id='modalbg';
  m.style.cssText='position:fixed;inset:0;background:rgba(20,30,50,.35);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px';
  m.onclick=function(e){ if(e.target===m) closeM(); };
  m.innerHTML='<div style="background:#fff;border-radius:14px;padding:20px 22px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)">'+html+'</div>';
  document.body.appendChild(m);
}
function closeM(){ var m=$('modalbg'); if(m) m.remove(); }
// ── 공통 편의 ①: 통일된 확인 모달 (confirm 대체) ──
function confirmM(msg,opts){
  opts=opts||{};
  return new Promise(function(resolve){
    var m=document.createElement('div'); m.id='confirmbg';
    m.style.cssText='position:fixed;inset:0;background:rgba(20,30,50,.4);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
    var danger=opts.danger?'#b91c1c':'var(--acc)';
    m.innerHTML='<div style="background:#fff;border-radius:14px;padding:22px 24px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.28)">'
      +'<div style="font-size:14px;line-height:1.6;white-space:pre-line;margin-bottom:18px">'+esc(msg)+'</div>'
      +'<div class="row" style="justify-content:flex-end;gap:8px"><button id="cf-no">'+esc(opts.cancel||'취소')+'</button>'
      +'<button id="cf-yes" class="primary" style="background:'+danger+'">'+esc(opts.ok||'확인')+'</button></div></div>';
    document.body.appendChild(m);
    function done(v){ m.remove(); document.removeEventListener('keydown',key,true); resolve(v); }
    function key(e){ if(e.key==='Escape'){e.stopPropagation();done(false);} else if(e.key==='Enter'){e.stopPropagation();done(true);} }
    m.querySelector('#cf-yes').onclick=function(){done(true);};
    m.querySelector('#cf-no').onclick=function(){done(false);};
    m.onclick=function(e){ if(e.target===m) done(false); };
    document.addEventListener('keydown',key,true);
    var y=m.querySelector('#cf-yes'); if(y)y.focus();
  });
}
// ── 공통 편의 ③: 통일된 로딩 표시 ──
function loadingHTML(msg){ return '<div class="loading"><span class="spin"></span>'+esc(msg||'불러오는 중…')+'</div>'; }
// ── 공통 편의 ②: 저장 안 한 변경 이탈 경고 ──
var _dirty=false;
function markDirty(){ _dirty=true; }
function clearDirty(){ _dirty=false; }
window.addEventListener('beforeunload',function(e){ if(_dirty){ e.preventDefault(); e.returnValue=''; } });
// 창 크기 변화 시 A4 미리보기 배율 재계산(과호출 방지 디바운스)
var _fitT=null;
window.addEventListener('resize',function(){ clearTimeout(_fitT); _fitT=setTimeout(function(){
  if(window.innerWidth>860) closeSide();   // 넓어지면 서랍은 자동으로 닫는다(사이드바가 다시 고정 표시됨)
  try{ fitDocA4(); }catch(e){} },150); });
// ── 공통 편의 ④: 키보드 단축키 (Esc=닫기→뒤로 · Backspace=뒤로 · Ctrl/Cmd+S=저장) ──
function _inTyping(e){ var t=e.target||document.activeElement;
  return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable); }
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if($('confirmbg'))return;                       // 확인창은 자체 처리
    if($('modalbg')){ closeM(); return; }           // 1) 모달 닫기
    if(document.body.classList.contains('sideopen')){ closeSide(); return; }   // 1-2) 모바일 서랍 닫기
    var t=document.activeElement;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT')){ t.blur(); return; } // 2) 입력 포커스 해제
    if(S.view!=='home'){ goBack(); }                // 3) 화면 뒤로가기
    return;
  }
  if(e.key==='Backspace'&&!_inTyping(e)){           // 입력 중 아닐 때 백스페이스 = 뒤로
    e.preventDefault();
    if($('modalbg')||$('confirmbg')) return;
    if(S.view!=='home') goBack();
    return;
  }
  if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')){
    e.preventDefault();
    if($('confirmbg')) return;   // 확인 대화상자 떠 있으면 저장 무시
    var mb=$('modalbg'); if(mb){ var pb=mb.querySelector('button.primary'); if(pb){ pb.click(); return; } }
    if(S.view==='fund'&&S.tab==='info'&&typeof saveInfo==='function'){ saveInfo(); }
  }
});
</script>
