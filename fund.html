// ── 공통 편의: 토스트 알림 ──
function toast(msg,type){
  var t=$('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.className='show'+(type==='err'?' err':(type==='warn'?' warn':''));
  clearTimeout(window._toastT); window._toastT=setTimeout(function(){ t.className=''; }, type==='err'?3200:1800);
}
// ── 공통 편의: 네비게이션 + 브라우저 뒤로가기 (저장 안 한 변경 이탈 경고 포함) ──
function _leaveGuard(){ if(!_dirty) return Promise.resolve(true);
  return confirmM('저장하지 않은 변경이 있습니다.\n저장하지 않고 이동할까요?',{ok:'이동',danger:true}).then(function(ok){ if(ok)clearDirty(); return ok; }); }
function go(v,id){ _leaveGuard().then(function(ok){ if(!ok)return; _go(v,id); }); }
function _go(v,id){ S.view=v; if(id!==undefined)S.fundId=id; if(v==='fund')S.tab='info'; _pushHist(); route(); }
function goTab(tab){ _leaveGuard().then(function(ok){ if(!ok)return; S.tab=tab; _pushHist(); renderFund(); }); }
function goBack(){ _leaveGuard().then(function(ok){ if(!ok)return; if(history.length>1) history.back(); else _go('home'); }); }
function _pushHist(){ try{ history.pushState({view:S.view,fundId:S.fundId,tab:S.tab,homeTab:S.homeTab}, ''); }catch(e){} }
window.addEventListener('popstate', function(ev){
  clearDirty();   // 브라우저 뒤로가기는 확인 없이 이동(beforeunload가 새로고침/닫기는 커버)
  var st=ev.state; if(!st){ S.view='home'; route(); return; }
  S.view=st.view||'home'; if(st.fundId!==undefined)S.fundId=st.fundId; if(st.tab)S.tab=st.tab; if(st.homeTab)S.homeTab=st.homeTab;
  route();
});
function route(){
  ['home','billing','forms'].forEach(function(v){var n=$('nav-'+v);if(n)n.className='sitem'+(S.view===v?' on':'');});
  if(S.view==='fund'&&S.fundId&&funds[S.fundId]) renderFund();
  else if(S.view==='billing') renderBilling();
  else if(S.view==='forms') renderForms();
  else { S.view='home'; renderHome(); }
}

// 푸른이알피 재직자 명단 — Firebase data/user_accounts/v (pu-erp와 공유). 재직(active)만.
var _staffCache=null;
function _normStaff(v){
  if(!v) return []; if(!Array.isArray(v)) v=Object.keys(v).map(function(k){return v[k];});
  var seen={};
  return v.filter(function(u){return u&&u.sid;})
    .filter(function(u){return !u.status||u.status==='active'||(u.status==='leave'&&u.leaveLoginAllowed===true);})
    .filter(function(u){ if(seen[u.sid])return false; seen[u.sid]=1; return true; })
    .map(function(u){return {sid:u.sid,name:u.name||u.sid,title:u.title||u.role||'',branch:u.branch||''};})
    .sort(function(a,b){return String(a.sid||'').localeCompare(String(b.sid||''),'en',{numeric:true});});  // 푸른이알피 사번 순
}
function loadStaff(){
  if(_staffCache) return Promise.resolve(_staffCache);
  // 1) 동일 출처(github.io/pureunall) localStorage — 푸른이알피가 채워둔 재직자, Firebase 규칙 의존 없음
  try{ var raw=localStorage.getItem('pureun_v6_user_accounts');
    if(raw){ var a=_normStaff(JSON.parse(raw)); if(a.length){ _staffCache=a; return Promise.resolve(a); } } }catch(e){}
  // 2) 폴백: Firebase data/user_accounts (localStorage 비었을 때 = 이 브라우저에서 pu-erp 미실행)
  return fbDb.ref('data/user_accounts/v').once('value').then(function(s){ _staffCache=_normStaff(s.val()); return _staffCache; })
    .catch(function(){ _staffCache=[]; return _staffCache; });
}

function nextFundId(){
  var mx=0; Object.keys(funds).forEach(function(k){ var m=/^FUND-(\d+)$/.exec(k); if(m){var n=+m[1]; if(n>mx)mx=n;} });
  return 'FUND-'+('0000'+(mx+1)).slice(-4);
}

function createFund(){
  var name=($('nf-name')&&$('nf-name').value.trim())||'';
  if(!name){ toast('기금법인명을 입력하세요','warn'); return; }

    entry_mode:entry, created_at:ymd() };
  if(entry==='new') rec.setup_stage='설립준비';   // 신규=설립 진행 표시
  // 담당
  var sel=$('nf-mgr');
  if(sel&&sel.value){ var op=sel.options[sel.selectedIndex]; var nm=op.getAttribute('data-name')||op.text;
    rec.mgr_main={sid:sel.value,name:nm}; rec.manager=nm; }
  else { var tx=$('nf-mgr-text'); if(tx&&tx.value.trim()){ rec.manager=tx.value.trim(); } }

    toast('새 기금 등록: '+short+(entry==='new'?' (설립부터)':' (운영부터)'));
  }).catch(function(e){ toast('등록 실패: '+e.message,'err'); });
}

function saveMgr(fid){
  var list=_staffCache||[]; function byId(sid){return list.filter(function(u){return u.sid===sid;})[0];}

    .filter(function(sid){return sid!==mainSid;}).map(byId).filter(Boolean)
    .map(function(u){return {sid:u.sid,name:u.name};});
  var patch={ mgr_main: mainU?{sid:mainU.sid,name:mainU.name}:null, mgr_subs: subs.length?subs:null };
  patch.manager=[mainU?mainU.name:''].concat(subs.map(function(s){return s.name+'(부)';})).filter(Boolean).join(', ');  // 검색·구호환용 문자열

function setLifecycleQuick(fid,val){   // 목록 인라인 드롭다운 — 즉시 반영(종료·보관 시 최초 지정일 자동 기록)
  var f=funds[fid]||{}, patch;
  if(val==='운영') patch={lifecycle:null};
  else { patch={lifecycle:val}; if(!f.end_date) patch.end_date=ymd(); }
  fbDb.ref(NS+'/funds/'+fid).update(patch).then(function(){
    Object.assign(funds[fid],{lifecycle:patch.lifecycle||''}); if(patch.end_date)funds[fid].end_date=patch.end_date;
    renderHome();
  }).catch(function(e){ toast('저장 실패: '+e.message,'err'); renderHome(); });
}
function saveLifecycle(fid){
  var t=$('lc-type').value, patch;
  if(t==='운영') patch={lifecycle:null,end_date:null,end_reason:null};
  else patch={lifecycle:t,end_date:($('lc-date').value||''),end_reason:($('lc-reason').value.trim()||'')};
  fbDb.ref(NS+'/funds/'+fid).update(patch).then(function(){
    Object.assign(funds[fid],{lifecycle:patch.lifecycle||'',end_date:patch.end_date||'',end_reason:patch.end_reason||''});
    closeM(); if(S.view==='fund')renderFund(); else renderHome(); toast('상태가 저장되었습니다');
  }).catch(function(e){ toast('저장 실패: '+e.message,'err'); });
}

    +(edit?'<button onclick="bulkRegistry()" title="소재지로 전체 기금 관할등기소 자동 추정" style="margin-right:6px">🏛 등기소 일괄</button>':'')

    +'<button class="'+(edit?'primary':'')+'" onclick="S.homeEdit=!S.homeEdit;renderHome()" title="핵심 기본정보(인가번호·설립일 등) 직접 입력">'+(edit?'✓ 입력 종료':'✏️ 정보 채우기')+'</button>'

function guessTax(address){
  var a=String(address||'').trim(); if(!a) return '';
  var sm=a.match(/(\S+?(?:도|특별시|광역시|특별자치시|특별자치도))\s+(\S+?시)\s+(\S+?구)/);   // 시+구(수원·청주 등)
  if(sm){ var sd=_SIDO_ABBR[sm[1]]||sm[1]; var k=sd+' '+sm[2]+' '+sm[3]; if(TAX_MAP[k]) return TAX_MAP[k]; }
  var m=a.match(/(\S+?(?:도|특별시|광역시|특별자치시|특별자치도))\s+(\S+?(?:시|군|구))/);
  if(!m) return '';
  var sido=_SIDO_ABBR[m[1]]||m[1];
  return TAX_MAP[sido+' '+m[2]]||'';
}

function idbOpen(){ return new Promise(function(res,rej){ var r=indexedDB.open(IDB_DB,1);
  r.onupgradeneeded=function(){ r.result.createObjectStore(IDB_ST); };
  r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }); }
function idbPut(k,v){ return idbOpen().then(function(db){ return new Promise(function(res,rej){
  var tx=db.transaction(IDB_ST,'readwrite'); tx.objectStore(IDB_ST).put(v,k);
  tx.oncomplete=function(){res();}; tx.onerror=function(){rej(tx.error);}; }); }); }
function idbGet(k){ return idbOpen().then(function(db){ return new Promise(function(res,rej){
  var tx=db.transaction(IDB_ST,'readonly'); var g=tx.objectStore(IDB_ST).get(k);
  g.onsuccess=function(){res(g.result||null);}; g.onerror=function(){rej(g.error);}; }); }); }
function idbDel(k){ return idbOpen().then(function(db){ return new Promise(function(res){
  var tx=db.transaction(IDB_ST,'readwrite'); tx.objectStore(IDB_ST).delete(k); tx.oncomplete=function(){res();}; }); }); }

function pickTpl(key){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx';
  inp.onchange=function(ev){ var file=ev.target.files&&ev.target.files[0]; if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){ idbPut(key,rd.result).then(function(){ S._tplChk=false; S._subTplChk=false;
        if(S.view==='forms')renderForms(); else if(S.view==='fund')renderFund();
        toast('원본 등록 완료: '+file.name); })
      .catch(function(e){ toast('저장 실패: '+e.message,'err'); }); };
    rd.readAsArrayBuffer(file); };
  inp.click();
}
function clearTpl(key){ confirmM('등록된 원본 서식을 삭제할까요?',{ok:'삭제',danger:true}).then(function(ok){ if(ok) idbDel(key).then(function(){ S._tplChk=false; renderForms(); toast('삭제되었습니다'); }); }); }
function dlBuf(buf,fname){ var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500); }
function _splitPeople(txt){ return String(txt||'').split(/[,\/·]/).map(function(s){return s.trim();}).filter(Boolean); }
function _siteContacts(s){ var c={name:'',phone:'',mobile:'',email:''}; try{ var cts=s.contacts; if(typeof cts==='string')cts=JSON.parse(cts);
  if(Array.isArray(cts)&&cts.length){ var p=cts.filter(function(x){return x&&x.isPrimary;})[0]||cts[0];
    c.name=p.name||''; c.mobile=p.mobile||p.phone||''; c.phone=p.phone||p.mobile||''; c.email=p.email||''; } }catch(e){} return c; }
function _loadSites(fid){ return fbDb.ref(NS+'/sites/'+fid).once('value').then(function(s){
  var v=s.val()||{}; var a=Object.keys(v).map(function(k){var o=Object.assign({},v[k]);o._id=k;return o;});
  a=a.filter(function(x){return (x.status||'active')==='active';});
  a.sort(function(x,y){return String(x.seq_label||'').localeCompare(String(y.seq_label||''),'ko',{numeric:true});}); return a; }); }
function setC(ws,addr,val){ var c=ws.getCell(addr); if(c.type!==ExcelJS.ValueType.Formula) c.value=(val===''||val==null)?null:val; }
function clearRange(ws,r1,r2,c1,c2){ for(var r=r1;r<=r2;r++)for(var c=c1;c<=c2;c++){ var cell=ws.getCell(r,c);
  if(cell.type!==ExcelJS.ValueType.Formula && cell.value!=null) cell.value=null; } }

function fillForm(key){
  var fid=S.formFund, f=funds[fid]; if(!f){ toast('기금을 선택하세요','warn'); return; }
  idbGet(key).then(function(buf){
    if(!buf){ toast('먼저 원본 엑셀을 등록하세요','warn'); return; }
    return _loadSites(fid).then(function(sites){
      var wb=new ExcelJS.Workbook();
      return wb.xlsx.load(buf).then(function(){
        (key==='setup'?fillSetup:fillSubsidy)(wb,f,sites);
        return wb.xlsx.writeBuffer();
      }).then(function(out){
        var nm=(f.short_name||f.name||fid).replace(/\s+/g,'');
        dlBuf(out, nm+'_'+(key==='setup'?'설립서식':'지원신청서')+'(데이터채움).xlsx');
      });
    });
  }).catch(function(e){ toast('서식 생성 실패: '+e.message,'err'); });
}
function fillSetup(wb,f,sites){
  var ws=wb.getWorksheet('기금법인정보'); if(!ws) throw new Error('기금법인정보 시트를 찾을 수 없습니다');
  var wk=_splitPeople(f.worker_committee), er=_splitPeople(f.emp_committee);
  var repSite=f.rep_org||(sites[0]&&sites[0].name)||'';
  setC(ws,'B3',repSite); setC(ws,'C3',f.name||''); setC(ws,'D3',f.chairman||''); setC(ws,'E3',f.address||'');
  setC(ws,'F3',f.inka_date||''); setC(ws,'G3',f.worker_rep||wk[0]||''); setC(ws,'H3',wk[0]||''); setC(ws,'I3',er[0]||'');
  setC(ws,'J3',f.phone||''); ['K3','L3','M3','N3'].forEach(function(a){setC(ws,a,'');});
  var budget=num(f.contribution_total); if(budget) setC(ws,'F13',budget.toLocaleString()+'원');
  if(f.estab_date) setC(ws,'B23',f.estab_date); if(f.meeting_date) setC(ws,'D23',f.meeting_date);
  clearRange(ws,33,38,2,16);   // 회의록 샘플 안건 B~P (수식 제외)
}
function fillSubsidy(wb,f,sites){
  if((f.fund_type||'')!=='공동') throw new Error('지원신청서는 공동근로복지기금 전용입니다');
  var info=wb.getWorksheet('기금법인정보'); if(!info) throw new Error('기금법인정보 시트를 찾을 수 없습니다');
  var yrs=f.years||{}, sub={};
  Object.keys(yrs).sort().reverse().some(function(y){ if(yrs[y]&&yrs[y].subsidy){sub=yrs[y].subsidy;return true;} return false; });
  var workerTotal=num(sub.worker_count)||sites.reduce(function(s,x){return s+(num(x.company_size)||0);},0)||'';
  var contribution=num(f.contribution_total)||num(sub.contribution)||'';
  var applyAmt=num(sub.apply_amount)||contribution||'';
  setC(info,'A2',1); setC(info,'B2',f.name||''); setC(info,'C2',f.chairman||''); setC(info,'D2',f.address||'');
  setC(info,'E2',f.phone||''); setC(info,'F2',f.inka_no||''); setC(info,'G2',f.corp_reg_no||''); setC(info,'H2',f.tax_id_no||'');
  setC(info,'I2',f.reg_date||f.inka_date||''); setC(info,'J2',sites.length||''); setC(info,'K2',workerTotal);
  setC(info,'L2',contribution); setC(info,'N2',applyAmt); setC(info,'S2',f.rep_org||''); setC(info,'T2',sub.author||f.manager||'');
  ['P2','Q2','R2'].forEach(function(a){setC(info,a,'');});
  clearRange(info,3,8,2,20);   // 다른 기금 샘플행 B~T
  var parts=wb.getWorksheet('참여사업장정보'); if(parts){
    sites.forEach(function(s,i){ var r=3+i, c=_siteContacts(s);
      setC(parts,'A'+r,'1-'+(i+1)); parts.getCell(r,2).value=i+1; setC(parts,'C'+r,s.name||''); setC(parts,'D'+r,s.ceo||'');
      setC(parts,'E'+r,s.address||''); var sz=num(s.company_size)||''; if(sz!==''){parts.getCell(r,6).value=sz;parts.getCell(r,10).value=sz;}
      setC(parts,'G'+r,s.biz_type||''); setC(parts,'I'+r,s.biz_no||''); setC(parts,'K'+r,c.name); setC(parts,'N'+r,c.phone); setC(parts,'O'+r,c.email); });
    if(parts.rowCount>=3+sites.length) clearRange(parts,3+sites.length,parts.rowCount,1,20);
  }
  var doc=wb.getWorksheet('신청서'); if(doc){
    setC(doc,'AM3',1); var keys=[];
    doc.getColumn(9).eachCell({includeEmpty:false},function(cell){ if(typeof cell.value==='string'&&/^\d+-\d+$/.test(cell.value.trim())) keys.push(cell); });
    keys.sort(function(a,b){return a.row-b.row;});
    keys.forEach(function(cell,idx){ if(cell.type!==ExcelJS.ValueType.Formula) cell.value=idx<sites.length?('1-'+(idx+1)):null; });
  }
}

function setupTab(f){
  var steps=EST_TMPL.filter(function(t){ return !(t[2]&&f.fund_type==='사내'); });   // 사내는 참여사업장 단계 제외
  var done=f.setup||{};
  var nDoneN=steps.filter(function(t){return done[t[0]]&&done[t[0]].done;}).length;
  var pct=Math.round(nDoneN/steps.length*100);
  var rows=steps.map(function(t,i){
    var d=done[t[0]]&&done[t[0]].done, lk=EST_LINK[t[0]];
    var btn=lk?' <button onclick="'+lk.fn+'" style="margin-left:8px;padding:2px 9px;font-size:11.5px;white-space:nowrap">'+lk.lbl+'</button>':'';
    return '<div style="display:flex;align-items:flex-start;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)">'
      +'<input type="checkbox"'+(d?' checked':'')+' onchange="toggleSetup(\''+t[0]+'\',this.checked)" style="margin-top:2px;width:16px;height:16px">'
      +'<div style="flex:1"><div style="font-weight:600'+(d?';color:var(--sub);text-decoration:line-through':'')+'">'+(i+1)+'. '+esc(t[1])+btn+'</div>'
      +(d&&done[t[0]].date?'<div class="muted" style="font-size:11px">완료 '+esc(done[t[0]].date)+'</div>':'')+'</div></div>';
  }).join('');
  return '<div class="panel"><div class="row"><h2>🏗 설립 진행</h2><span class="stat">'+nDoneN+'/'+steps.length+' 완료</span>'
    +'<span style="flex:1"></span>'+(nDoneN>=steps.length?'<button class="primary" onclick="finishSetup()">✅ 운영 전환</button>':'')+'</div>'
    +'<div style="height:8px;background:var(--line);border-radius:4px;margin:10px 0;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:var(--acc)"></div></div>'
    +'<p class="muted" style="font-size:12px;margin:0 0 8px">신규 설립 절차입니다. 단계를 체크하며 진행하고, 모두 완료되면 [운영 전환]으로 정식 운영 기금이 됩니다. (인가번호·등기 등은 [기금 정보] 탭에 입력)</p>'
    +'<div>'+rows+'</div></div>';
}

function num(v){ if(v==null||v==='')return ''; if(typeof v==='number')return Math.round(v);
  var s=String(v).trim(), neg=false;
  if(/^\(.+\)$/.test(s)){ neg=true; s=s.slice(1,-1); }            // (1,000) = 음수
  if(/-\s*$/.test(s)){ neg=true; s=s.replace(/-\s*$/,''); }        // 1,000- = 음수
  var plain=s.replace(/,/g,'');
  if(/^[+-]?\d*\.?\d+e[+-]?\d+$/i.test(plain)){ var sci=parseFloat(plain); return isNaN(sci)?'':Math.round(neg?-sci:sci); } // 1E+6 지수표기
  s=s.replace(/[^0-9.\-]/g,''); if(s===''||s==='-'||s==='.')return '';
  var n=Math.round(parseFloat(s)); if(isNaN(n))return ''; return neg?-Math.abs(n):n; }

function _primaryContact(s){

  return {list:cts, idx:cts.length?pi:-1, c:(cts[pi]||{})};
}

function saveSite(sid){
  var base = sid ? ((S.sites&&S.sites[sid])||{}) : Object.assign({status:'active'}, _sitePrefill||{});  // 신규는 연결 프리필(puerp_co_id 등) 보존
  var obj=Object.assign({}, base);
  SITE_FIELDS.forEach(function(c){var el=$('se-'+c[0]);if(el)obj[c[0]]=el.value.trim();});
  if(!obj.name){ toast('상호를 입력하세요','warn'); return; }
  // 담당자: 기존 contacts 배열 유지하되 대표 담당자 항목만 갱신(없으면 추가)
  var pc=_primaryContact(obj), cv={};
  CONTACT_FIELDS.forEach(function(c){var el=$('sc-'+c[0]);if(el)cv[c[0]]=el.value.trim();});
  var hasContact=cv.name||cv.mobile||cv.email||cv.position;
  var list=pc.list.slice();
  if(hasContact){
    var item={name:cv.name||'',position:cv.position||'',phone:'',mobile:cv.mobile||'',email:cv.email||'',isPrimary:true};
    if(pc.idx>=0){ list[pc.idx]=Object.assign({},list[pc.idx],item); } else { list.unshift(item); }
  } else if(pc.idx>=0){ list.splice(pc.idx,1); }   // 담당자 비우면 대표 항목 제거
  obj.contacts=list;
  var ref = sid ? fbDb.ref(NS+'/sites/'+S.fundId+'/'+sid) : fbDb.ref(NS+'/sites/'+S.fundId).push();
  ref.set(obj).then(function(){ _sitePrefill=null; S.sitesFor=null; closeM(); renderFund(); toast('사업장이 저장되었습니다'); })
    .catch(function(e){ toast('저장 실패: '+e.message,'err'); });
}

var _coCache=null;
function _normCo(v){
  if(!v) return []; if(!Array.isArray(v)) v=Object.keys(v).map(function(k){return v[k];});
  var seen={};
  return v.filter(function(c){return c&&c.name&&(c.status!=='deleted');})
    .filter(function(c){ var id=c.id||c.bizNo||c.name; if(seen[id])return false; seen[id]=1; return true; })
    .sort(function(a,b){return (a.name||'').localeCompare(b.name||'','ko');});
}
function loadCompanies(){
  if(_coCache) return Promise.resolve(_coCache);
  try{ var raw=localStorage.getItem('pureun_v6_companies');
    if(raw){ var a=_normCo(JSON.parse(raw)); if(a.length){ _coCache=a; return Promise.resolve(a); } } }catch(e){}
  return fbDb.ref('data/companies/v').once('value').then(function(s){ _coCache=_normCo(s.val()); return _coCache; })
    .catch(function(){ _coCache=[]; return _coCache; });
}
function _coContacts(co){
  var cts=co.contacts; if(typeof cts==='string'){try{cts=JSON.parse(cts);}catch(e){cts=[];}} if(!Array.isArray(cts))cts=[];
  if(!cts.length && (co.primaryContactName||co.primaryContactPhone||co.primaryContactEmail))
    cts=[{name:co.primaryContactName||'',position:'',phone:'',mobile:co.primaryContactPhone||'',email:co.primaryContactEmail||'',isPrimary:true}];
  return cts;
}
function companyToSite(co){
  return { name:co.name||'', ceo:co.ceo||'', biz_no:co.bizNo||'', corp_no:co.corpNo||co.corp_no||'',

    note:'푸른이알피 연결', status:'active', contacts:_coContacts(co), puerp_co_id:co.id||'' };

function uploadSubDoc(){
  if(!fbStore){ toast('Storage 미설정','err'); return; }
  var _fid=S.fundId, _yr=S.year, kind=($('subdoc-kind')&&$('subdoc-kind').value)||'기타';
  var inp=document.createElement('input'); inp.type='file';
  inp.onchange=function(ev){ var file=ev.target.files&&ev.target.files[0]; if(!file)return;
    toast('업로드 중…');
    var safe=(''+file.name).replace(/[^\w.\-가-힣()\s]/g,'_');
    var path='fund_erp/subsidy_docs/'+_fid+'/'+_yr+'/'+Date.now()+'_'+safe;
    var ref=fbStore.ref(path);
    ref.put(file).then(function(){ return ref.getDownloadURL(); }).then(function(url){
      var rec={kind:kind,name:file.name,url:url,path:path,uploaded:ymd()};
      return fbDb.ref(NS+'/subsidy_docs/'+_fid+'/'+_yr).push().set(rec);
    }).then(function(){ S.subDocFor=null; renderFund(); toast('올렸습니다'); })
      .catch(function(e){ toast('업로드 실패: '+e.message,'err'); });
  };
  inp.click();
}
function delSubDoc(id){
  var d=(S.subDocs||{})[id]; if(!d) return;
  confirmM('이 서류를 삭제할까요?\n('+(d.name||'')+')',{ok:'삭제',danger:true}).then(function(ok){ if(!ok)return;
    var _fid=S.fundId, _yr=S.year;
    var done=function(){ fbDb.ref(NS+'/subsidy_docs/'+_fid+'/'+_yr+'/'+id).remove().then(function(){ S.subDocFor=null; renderFund(); toast('삭제되었습니다'); }); };
    if(fbStore&&d.path){ fbStore.ref(d.path).delete().then(done).catch(done); } else done();
  });
}

function won(n){return (n||0).toLocaleString()+'원';}
function computeFin(arr){
  var yd=(funds[S.fundId]&&funds[S.fundId].years&&funds[S.fundId].years[S.year])||{}, opening=yd.opening||{};
  var appr=arr.filter(function(x){return x.approved&&x.debit&&x.credit;});
  var acc={};
  appr.forEach(function(x){var amt=num(x.deposit)||num(x.withdraw)||0;
    (acc[x.debit]=acc[x.debit]||{d:0,c:0}).d+=amt; (acc[x.credit]=acc[x.credit]||{d:0,c:0}).c+=amt;});
  var tb={}; Object.keys(acc).forEach(function(name){var v=acc[name];
    tb[name]={type:ACCT_CHART[name]||'비용',debit:v.d,credit:v.c,bal_d:Math.max(v.d-v.c,0),bal_c:Math.max(v.c-v.d,0)};});
  // 유형별 전 계정 집계(부호 있는 잔액) — 목록에 없는 계정도 누락 없이 대차가 맞도록
  function sg(a){var v=tb[a]||{debit:0,credit:0};return v.debit-v.credit;}
  var PURPOSE=['경조사비','동호회비','체육문화비','장학금','생활안정자금','기타복지비'];
  var ADMIN=['지급수수료','사무용품비','기타관리비'];
  var CORE_ASSET=['현금성자산','정기예금','근로자대부금'];
  var revenue=0,purpose=0,admin=0,otherExp=0,liab=0,otherAsset=0,otherEquity=0;
  Object.keys(tb).forEach(function(n){var v=tb[n],s=v.debit-v.credit;
    if(v.type==='수익')revenue+=-s;
    else if(v.type==='부채')liab+=-s;
    else if(v.type==='자본'&&n!=='기본재산')otherEquity+=-s;
    else if(v.type==='비용'){ if(PURPOSE.indexOf(n)>=0)purpose+=s; else if(ADMIN.indexOf(n)>=0)admin+=s; else otherExp+=s; }
    else if(v.type==='자산'&&CORE_ASSET.indexOf(n)<0)otherAsset+=s;});
  var interest=revenue;
  var cash=sg('현금성자산')+(num(opening.cash)||0), savings=sg('정기예금')+(num(opening.savings)||0);
  var loan=sg('근로자대부금')+(num(opening.loan)||0), basic=-sg('기본재산')+(num(opening.basic)||0);
  liab+=(num(opening.reserve)||0);
  var net=revenue-purpose-admin-otherExp, retained=(num(opening.retained)||0)+otherEquity+net;
  var totalAssets=cash+savings+loan+otherAsset, equity=basic+retained, totalLiabEq=liab+equity;
  return {tb:tb,appr:appr.length,interest:interest,purpose:purpose,admin:admin,otherExp:otherExp,
    cash:cash,savings:savings,loan:loan,otherAsset:otherAsset,basic:basic,liab:liab,
    totalAssets:totalAssets,net:net,retained:retained,equity:equity,totalLiabEq:totalLiabEq,
    balanced:totalAssets===totalLiabEq,opening:opening};
}

function proposeAcct(memo,isDep){
  var m=String(memo||''), dir=isDep?'입금':'출금';
  for(var i=0;i<ACCT_RULES.length;i++){ var r=ACCT_RULES[i];
    if(r.dir!==dir) continue;
    for(var j=0;j<r.kw.length;j++){ if(m.indexOf(r.kw[j])>=0) return {d:r.d,c:r.c}; }
  }
  return {d:'',c:''};
}
function parseBank(rows){
  var hi=-1, col={};
  function find(cells){for(var c=0;c<cells.length;c++){var v=String(cells[c]||'');
    if(/날짜|거래일|일자|거래일시/.test(v)&&col.date==null)col.date=c;
    if(/적요|내용|의뢰인|기재|가맹점/.test(v)&&col.memo==null)col.memo=c;
    if(/입금|맡기신/.test(v)&&!/건수|횟수|잔액|잔고/.test(v)&&col.dep==null)col.dep=c;
    if(/출금|찾으신|지급/.test(v)&&!/건수|횟수|잔액|잔고/.test(v)&&col.wd==null)col.wd=c;
    if(/잔액|잔고/.test(v)&&col.bal==null)col.bal=c;}}
  var lim=Math.min(rows.length,100);
  // 1차: 날짜열까지 있는 헤더 우선(다단 헤더 오인 방지), 2차: 입·출금열만으로 폴백
  for(var i=0;i<lim;i++){ col={}; find(rows[i]||[]); if(col.dep!=null&&col.wd!=null&&col.date!=null){ hi=i; break; } }
  if(hi<0) for(var i2=0;i2<lim;i2++){ col={}; find(rows[i2]||[]); if(col.dep!=null&&col.wd!=null){ hi=i2; break; } }
  if(hi<0) return null;
  function normDate(s){ var m=String(s||'').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if(!m) return String(s||'').trim();
    return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2); }
  var out=[];
  for(var r=hi+1;r<rows.length;r++){ var row=rows[r]; if(!row)continue;
    var date=col.date!=null?normDate(row[col.date]):'';
    var memo=col.memo!=null?String(row[col.memo]||'').trim():'';
    if(/^(합\s*계|소\s*계|총\s*계)/.test(memo)) continue;   // 합계·소계 행은 거래 아님
    var dep=num(row[col.dep])||0, wd=num(row[col.wd])||0;
    if(dep<0){ wd+=-dep; dep=0; } if(wd<0){ dep+=-wd; wd=0; } // 음수 표기 = 반대방향
    if(!date&&!memo&&!dep&&!wd) continue;
    if(!dep&&!wd) continue;
    var bal=col.bal!=null?(num(row[col.bal])||0):0;
    if(dep&&wd){ out.push({date:date,memo:memo,deposit:dep,withdraw:0,balance:bal});
                 out.push({date:date,memo:memo,deposit:0,withdraw:wd,balance:bal}); } // 입·출 동시 행 분리(분개 누락 방지)
    else out.push({date:date,memo:memo,deposit:dep,withdraw:wd,balance:bal});
  }
  return out;
}
function hkey(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 't'+(h>>>0).toString(36);}
function importBank(){
  var _fid=S.fundId, _yr=S.year;   // 클릭 시점 고정 — 로딩 중 기금·연도 이동해도 원래 경로에 저장
  if(!_fid){ toast('기금을 먼저 선택하세요','warn'); return; }
  var _fname=(funds[_fid]&&(funds[_fid].short_name||funds[_fid].name))||_fid;
  var inp=document.createElement('input'); inp.type='file'; inp.accept='.xls,.xlsx';
  inp.onchange=function(ev){ var file=ev.target.files&&ev.target.files[0]; if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
        var txns=null;   // 첫 시트가 안내문인 파일 대응 — 거래가 나올 때까지 전 시트 시도
        for(var si=0;si<wb.SheetNames.length;si++){
          var rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[si]],{header:1,raw:false,defval:''});
          var got=parseBank(rows);
          if(got&&got.length){ txns=got; break; }
          if(got&&!txns) txns=got;
        }
        if(!txns){ toast('통장 형식을 인식하지 못했습니다 (입금·출금 열 없음)','err'); return; }
        if(!txns.length){ toast('거래 내역이 없습니다','warn'); return; }
        confirmM('['+_fname+' · '+_yr+'년] '+txns.length+'건의 거래를 읽었습니다.\n자동분개 제안과 함께 가져올까요?\n(이미 있는 거래는 승인·분개를 그대로 보존합니다)',{ok:'가져오기'}).then(function(ok){ if(!ok)return;
          var path=NS+'/txns/'+_fid+'/'+_yr;
          fbDb.ref(path).once('value').then(function(snap){   // 서버 최신본 기준 중복검사 — 오래된 캐시로 승인 거래 덮어쓰기 방지
            var existing=snap.val()||{};
            var obj={}, added=0, kept=0, seen={};
            txns.forEach(function(x){ var base=x.date+'|'+x.deposit+'|'+x.withdraw+'|'+x.memo;
              var n=(seen[base]=(seen[base]||0)+1);
              var key=hkey(n>1?base+'|'+n:base);   // 같은 날 동일 금액·적요 거래도 각각 보존
              if(existing[key]||obj[key]){ kept++; return; }
              var p=proposeAcct(x.memo,x.deposit>0);
              obj[key]={date:x.date,memo:x.memo,deposit:x.deposit,withdraw:x.withdraw,balance:x.balance,debit:p.d,credit:p.c,approved:false}; added++;
            });
            if(added===0){ toast('새로 추가할 거래가 없습니다 (기존 '+kept+'건 유지)','warn'); return; }
            return fbDb.ref(path).update(obj).then(function(){ S.txnsFor=null; renderFund(); toast('가져오기 완료: 신규 '+added+'건'+(kept?' · 기존 '+kept+'건 보존':'')); });
          }).catch(function(e){ toast('저장 실패: '+e.message,'err'); });
        });
      }catch(e){ toast('파싱 실패: '+e.message,'err'); }
    };
    rd.readAsArrayBuffer(file);
  };
  inp.click();
}
function setTxnAcct(id,side,val){ var _key=S.fundId+'/'+S.year;
  fbDb.ref(NS+'/txns/'+_key+'/'+id+'/'+side).set(val)
    .then(function(){ if(S.txnsFor===_key&&S.txns&&S.txns[id])S.txns[id][side]=val; renderFund(); })
    .catch(function(e){ toast('저장 실패: '+e.message,'err'); renderFund(); }); }
function approveTxn(id,on){
  if(on){ var x=S.txns&&S.txns[id];
    if(x&&(!x.debit||!x.credit)){ toast('차변·대변 계정을 먼저 지정하세요','warn'); renderFund(); return; }
    if(x&&x.debit===x.credit){ toast('차변과 대변이 같은 계정입니다','warn'); renderFund(); return; } }
  var _key=S.fundId+'/'+S.year;
  fbDb.ref(NS+'/txns/'+_key+'/'+id+'/approved').set(on)
    .then(function(){ if(S.txnsFor===_key&&S.txns&&S.txns[id])S.txns[id].approved=on; renderFund(); })
    .catch(function(e){ toast('저장 실패: '+e.message,'err'); renderFund(); });
}
function delTxn(id){ confirmM('이 거래를 삭제할까요?',{ok:'삭제',danger:true}).then(function(ok){ if(ok) fbDb.ref(NS+'/txns/'+S.fundId+'/'+S.year+'/'+id).remove().then(function(){S.txnsFor=null;renderFund();toast('삭제되었습니다');}).catch(function(e){toast('삭제 실패: '+e.message,'err');}); }); }

// ── 간단 모달 ──
function showModal(html){
  var m=document.createElement('div'); m.id='modalbg';
  m.style.cssText='position:fixed;inset:0;background:rgba(20,30,50,.35);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px';
  m.onclick=function(e){ if(e.target===m) closeM(); };
  m.innerHTML='<div style="background:#fff;border-radius:14px;padding:20px 22px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)">'+html+'</div>';
  document.body.appendChild(m);
}
function closeM(){ var m=$('modalbg'); if(m) m.remove(); }
// ── 공통 편의 ①: 통일된 확인 모달 (confirm 대체) ──
function confirmM(msg,opts){
  opts=opts||{};
  return new Promise(function(resolve){
    var m=document.createElement('div'); m.id='confirmbg';
    m.style.cssText='position:fixed;inset:0;background:rgba(20,30,50,.4);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
    var danger=opts.danger?'#b91c1c':'var(--acc)';
    m.innerHTML='<div style="background:#fff;border-radius:14px;padding:22px 24px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.28)">'
      +'<div style="font-size:14px;line-height:1.6;white-space:pre-line;margin-bottom:18px">'+esc(msg)+'</div>'
      +'<div class="row" style="justify-content:flex-end;gap:8px"><button id="cf-no">'+esc(opts.cancel||'취소')+'</button>'
      +'<button id="cf-yes" class="primary" style="background:'+danger+'">'+esc(opts.ok||'확인')+'</button></div></div>';
    document.body.appendChild(m);
    function done(v){ m.remove(); document.removeEventListener('keydown',key,true); resolve(v); }
    function key(e){ if(e.key==='Escape'){e.stopPropagation();done(false);} else if(e.key==='Enter'){e.stopPropagation();done(true);} }
    m.querySelector('#cf-yes').onclick=function(){done(true);};
    m.querySelector('#cf-no').onclick=function(){done(false);};
    m.onclick=function(e){ if(e.target===m) done(false); };
    document.addEventListener('keydown',key,true);
    var y=m.querySelector('#cf-yes'); if(y)y.focus();
  });
}
// ── 공통 편의 ③: 통일된 로딩 표시 ──
function loadingHTML(msg){ return '<div class="loading"><span class="spin"></span>'+esc(msg||'불러오는 중…')+'</div>'; }
// ── 공통 편의 ②: 저장 안 한 변경 이탈 경고 ──
var _dirty=false;
function markDirty(){ _dirty=true; }
function clearDirty(){ _dirty=false; }
window.addEventListener('beforeunload',function(e){ if(_dirty){ e.preventDefault(); e.returnValue=''; } });
// ── 공통 편의 ④: 키보드 단축키 (Esc=닫기→뒤로 · Backspace=뒤로 · Ctrl/Cmd+S=저장) ──
function _inTyping(e){ var t=e.target||document.activeElement;
  return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable); }
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if($('confirmbg'))return;                       // 확인창은 자체 처리
    if($('modalbg')){ closeM(); return; }           // 1) 모달 닫기
    var t=document.activeElement;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT')){ t.blur(); return; } // 2) 입력 포커스 해제
    if(S.view!=='home'){ goBack(); }                // 3) 화면 뒤로가기
    return;
  }
  if(e.key==='Backspace'&&!_inTyping(e)){           // 입력 중 아닐 때 백스페이스 = 뒤로
    e.preventDefault();
    if($('modalbg')||$('confirmbg')) return;
    if(S.view!=='home') goBack();
    return;
  }
  if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')){
    e.preventDefault();
    if($('confirmbg')) return;   // 확인 대화상자 떠 있으면 저장 무시
    var mb=$('modalbg'); if(mb){ var pb=mb.querySelector('button.primary'); if(pb){ pb.click(); return; } }
    if(S.view==='fund'&&S.tab==='info'&&typeof saveInfo==='function'){ saveInfo(); }
  }
});
</script>
