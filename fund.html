<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기금 통합운영</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<style>
  :root{--acc:#2563eb;--acc2:#1b4bc0;--acc-soft:#e9f0fe;--ink:#182234;--sub:#59637a;--faint:#8b94a6;
    --line:#e4e9f1;--panel:#fff;--bg:#f4f6fa;--ok:#1f7a4d;--ok-bg:#e7f6ee;--warn:#b45309;--warn-bg:#fdf1e1;
    --danger:#c0392b;--danger-bg:#fdeceb;--radius:11px}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;color:var(--ink);background:#fbfcfe;font-size:14px;-webkit-font-smoothing:antialiased}
  #side{position:fixed;top:0;left:0;width:216px;height:100vh;background:#fff;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;z-index:20}
  .logo{display:flex;align-items:center;gap:9px;padding:2px 6px 12px}
  .logo .ic{font-size:22px}.logo b{font-size:14px}.logo .s{font-size:11px;color:var(--sub)}
  .sitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--sub);font-size:13px}
  .sitem:hover{background:var(--bg)}.sitem.on{background:var(--acc-soft);color:var(--acc2);font-weight:700}
  .sitem.dim{color:#b7bfce;cursor:default}.sitem.dim:hover{background:none}
  .sitem .soon{font-size:9.5px;margin-left:auto;color:#b7bfce;border:1px solid #e4e9f1;border-radius:6px;padding:0 5px}
  .side-sec{font-size:10.5px;letter-spacing:.1em;color:var(--faint);padding:12px 8px 4px;text-transform:uppercase}
  #main{margin-left:216px;min-height:100vh}
  #topbar{position:sticky;top:0;z-index:15;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:9px 22px;display:flex;align-items:center;gap:12px;font-size:13px}
  #crumb{font-weight:700;color:var(--sub)}
  #topright{margin-left:auto;display:flex;align-items:center;gap:11px}
  #conn{font-size:12px;color:var(--sub)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#cbd5e1;margin-right:5px}.dot.on{background:var(--ok)}
  #topuser{font-weight:700;font-size:12.5px}#topuser .role{color:var(--sub);font-weight:500;margin-left:4px}
  #topclock{font-variant-numeric:tabular-nums;color:var(--sub);font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
  #logoutbtn{font-size:12.5px;padding:5px 12px;border:1px solid #e6a19a;color:var(--danger);background:#fff;border-radius:8px;cursor:pointer;font-weight:700}
  #app{padding:18px 22px 60px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
  .row{display:flex;align-items:center;gap:10px}
  h1{font-size:20px;margin:0}h2{font-size:16px;margin:0}
  .muted{color:var(--sub)}
  input,select{font-family:inherit}
  .search{padding:8px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;min-width:220px}
  button{font-family:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--ink)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}button.primary:hover{background:var(--acc2)}
  .stat{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 11px;color:var(--sub)}
  .grp-h{font-size:13.5px;font-weight:800;margin:16px 0 6px;display:flex;align-items:center;gap:8px}
  .grp-h .cnt{font-size:11.5px;color:var(--sub);font-weight:600}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
  th{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.03em}
  tbody tr{cursor:pointer}tbody tr:hover{background:var(--bg)}
  td.no{color:var(--faint);width:34px;font-variant-numeric:tabular-nums}
  .chip{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.dg{background:var(--danger-bg);color:var(--danger)}
  .tag{font-size:10px;padding:1px 7px;border-radius:8px;margin-left:6px}
  .tag.gong{background:var(--ok-bg);color:var(--ok)}.tag.sanae{background:var(--acc-soft);color:var(--acc2)}
  .tabbar{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:14px 0 16px}
  .tab{padding:8px 13px;font-size:13px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--acc2);border-bottom-color:var(--acc);font-weight:700}
  .tab.soon{color:#c3cad6;cursor:default}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;max-width:760px}
  .fld{display:flex;flex-direction:column;gap:4px}.fld.full{grid-column:1/-1}
  .fld label{font-size:11.5px;color:var(--sub);font-weight:600}
  .fld input,.fld select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .msg{margin:12px 0;padding:9px 13px;border-radius:8px;font-size:12.5px;display:none}
  .msg.ok{display:block;background:var(--ok-bg);color:var(--ok)}.msg.err{display:block;background:var(--danger-bg);color:var(--danger)}
  .gate{max-width:520px;margin:90px auto;text-align:center;color:var(--sub)}.gate a{color:var(--acc);font-weight:700}
  .kv{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin-top:6px}
  .kv b{color:var(--ink)}
  .backbtn{font-size:12.5px;color:var(--acc);cursor:pointer;background:none;border:none;padding:0;margin-bottom:8px}
</style>
</head>
<body>
<div id="root"><div class="gate">불러오는 중…</div></div>

<script>
var FB_CONFIG={apiKey:'AIzaSyDkZz5QlKSoqMOYByp5YGeMNLNDrIghliA',databaseURL:'https://pureun-erp-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'pureun-erp',appId:'1:936817166182:web:9bd31f70d0afdf5fca2aa7',messagingSenderId:'936817166182'};
var FB_APPCHECK_KEY='6Ldu1hEtAAAAABB9lH9EMEyd7uBLEy9H5HxJoua_';
var PORTAL_URL='enter.html', NS='fund_erp';
var fbDb=null, funds={}, S={view:'home', fundId:null, tab:'info', q:''};

var FIELDS=[['name','기금법인명','text'],['short_name','약칭','text'],['fund_type','유형','select'],['region','지역','text'],
  ['manager','담당','text'],['chairman','대표자','text'],['inka_no','인가번호','text'],['inka_date','인가일','date'],
  ['corp_reg_no','법인등록번호','text'],['reg_date','설립등기일','date'],['tax_id_no','고유번호','text'],
  ['tax_office','관할세무서','text'],['registry_office','관할등기소','text'],['address','소재지','text']];
var KEY5=['inka_no','inka_date','corp_reg_no','reg_date','tax_id_no'];
var TABS=[['info','기금 정보',1],['sites','참여사업장',1],['annual','연간 일정',0],['subsidy','지원금',0],
  ['closing','회계·결산',0],['welfare','목적사업·대부',0],['events','변경 이벤트',0],['gen','서류 생성',0]];
var SITE_FIELDS=[['name','상호','text'],['ceo','대표자','text'],['biz_no','사업자등록번호','text'],
  ['biz_type','업종','text'],['company_size','상시근로자수','text'],['address','소재지','text']];

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function $(id){return document.getElementById(id);}
function qp(k){try{return new URLSearchParams(location.search).get(k)||'';}catch(e){return '';}}
function grp(f){return f.fund_type==='사내'?'사내':(f.region?'지역공동':'개별공동');}
function nDone(f){return KEY5.filter(function(k){return f[k];}).length;}

try{
  firebase.initializeApp(FB_CONFIG);
  try{if(FB_APPCHECK_KEY&&firebase.appCheck)firebase.appCheck().activate(new firebase.appCheck.ReCaptchaV3Provider(FB_APPCHECK_KEY),true);}catch(e){}
  fbDb=firebase.database();
  firebase.auth().onAuthStateChanged(function(u){ if(u){ start(); } else { gate(); } });
}catch(e){ $('root').innerHTML='<div class="gate">초기화 실패: '+esc(e.message)+'</div>'; }

function gate(){ $('root').innerHTML='<div class="gate"><h2>로그인이 필요합니다</h2><p><a href="'+PORTAL_URL+'">푸른 포털에서 로그인</a> 후 다시 들어와 주세요.</p></div>'; }

function start(){
  $('root').innerHTML=shell();
  initTop();
  fbDb.ref(NS+'/funds').on('value', function(snap){ funds=snap.val()||{}; route(); }, function(err){
    $('app').innerHTML='<div class="panel"><h2 style="color:var(--danger)">읽기 권한 오류</h2><p class="muted">'+esc(err.message)+'</p></div>';
  });
}

function shell(){
  return '<div id="side">'
    +'<div class="logo"><span class="ic">🏦</span><div><b>기금 통합운영</b><div class="s">푸른노무법인</div></div></div>'
    +'<div class="side-sec">메뉴</div>'
    +'<div class="sitem" id="nav-home" onclick="go(\'home\')">🏛 기금 현황</div>'
    +'<div class="sitem dim">📇 기금 대장 <span class="soon">준비중</span></div>'
    +'<div class="sitem dim">💰 청구 관리 <span class="soon">준비중</span></div>'
    +'<div class="sitem dim">📚 서식 자료실 <span class="soon">준비중</span></div>'
    +'<div style="margin-top:auto;font-size:11px;color:var(--faint);padding:8px">Firebase판 · 1단계<br>나머지 기능 이전 중</div>'
    +'</div>'
    +'<div id="main"><div id="topbar"><span id="crumb">기금 현황</span>'
    +'<div id="topright"><span id="conn"><span class="dot" id="dot"></span><span id="connt">연결 확인</span></span>'
    +'<span id="topuser"></span><span id="topclock">—</span>'
    +'<button id="logoutbtn" onclick="doLogout()">로그아웃</button></div></div>'
    +'<div id="app"></div></div>';
}

function initTop(){
  var el=$('topuser'); var u=qp('user'), r=qp('role');
  var fu=firebase.auth().currentUser;
  el.innerHTML=(u||(fu&&fu.email)||'푸른노무법인')+(r?'<span class="role">'+esc(r)+'</span>':'<span class="role">기금 운영</span>');
  fbDb.ref('.info/connected').on('value',function(s){var on=!!s.val();$('dot').className='dot'+(on?' on':'');$('connt').textContent=on?'Firebase 연결됨':'오프라인';});
  var WD=['일','월','화','수','목','금','토'];function p(n){return(n<10?'0':'')+n;}
  function tick(){var c=$('topclock');if(!c)return;var d=new Date();c.textContent=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' ('+WD[d.getDay()]+') '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}
  tick();setInterval(tick,1000);
}
function doLogout(){ if(confirm('푸른 포털로 나가시겠어요?')) location.href=PORTAL_URL; }

function go(v,id){ S.view=v; if(id!==undefined)S.fundId=id; if(v==='fund')S.tab='info'; route(); }
function route(){
  var nav=$('nav-home'); if(nav) nav.className='sitem'+(S.view==='home'?' on':'');
  if(S.view==='fund'&&S.fundId&&funds[S.fundId]) renderFund(); else { S.view='home'; renderHome(); }
}

function renderHome(){
  $('crumb').textContent='기금 현황';
  var arr=Object.keys(funds).map(function(k){var o=Object.assign({},funds[k]);o._id=k;return o;});
  if(S.q) arr=arr.filter(function(f){return (f.name||'').indexOf(S.q)>=0||(f.short_name||'').indexOf(S.q)>=0||(f.manager||'').indexOf(S.q)>=0;});
  var rpri={'충남':1,'경기':2},order={'지역공동':1,'개별공동':2,'사내':3};
  arr.sort(function(a,b){return (order[grp(a)]-order[grp(b)])||((rpri[a.region]||9)-(rpri[b.region]||9))||(a.short_name||'').localeCompare(b.short_name||'','ko');});
  var GL={'지역공동':'🏛 지역기금','개별공동':'🤝 공동기금','사내':'🏢 사내기금'};
  var html='', lastG=null, num=0;
  arr.forEach(function(f){
    var g=grp(f);
    if(g!==lastG){ if(lastG!==null) html+='</tbody></table>'; lastG=g; num=0;
      var cnt=arr.filter(function(x){return grp(x)===g;}).length;
      html+='<div class="grp-h">'+GL[g]+' <span class="cnt">'+cnt+'개</span></div>'
        +'<table><thead><tr><th>번호</th><th>기금명</th><th>담당</th><th>대표자</th><th>상태</th></tr></thead><tbody>';
    }
    num++;
    var n=nDone(f); var chip=n===5?'<span class="chip ok">정보 완비</span>':n>=3?'<span class="chip warn">정보 '+n+'/5</span>':'<span class="chip dg">정보 '+n+'/5</span>';
    html+='<tr onclick="go(\'fund\',\''+f._id+'\')"><td class="no">'+num+'</td>'
      +'<td style="font-weight:700">'+esc(f.short_name||f.name)+'<div class="muted" style="font-weight:400;font-size:11.5px">'+esc(f.name||'')+'</div></td>'
      +'<td>'+esc(f.manager||'—')+'</td><td>'+esc(f.chairman||'—')+'</td><td>'+chip+'</td></tr>';
  });
  if(lastG!==null) html+='</tbody></table>'; else html='<div class="panel muted">기금이 없습니다.</div>';
  $('app').innerHTML='<div class="panel"><div class="row"><h1>기금 현황</h1>'
    +'<span class="stat">'+arr.length+'개</span><span style="flex:1"></span>'
    +'<input class="search" placeholder="기금명·담당 검색" value="'+esc(S.q)+'" oninput="S.q=this.value;renderHome()"></div></div>'
    +'<div class="panel">'+html+'</div>';
}

function renderFund(){
  var f=funds[S.fundId]; $('crumb').textContent=(f.short_name||f.name);
  var tags=f.fund_type==='사내'?'<span class="tag sanae">사내</span>':'<span class="tag gong">공동</span>';
  var head='<button class="backbtn" onclick="go(\'home\')">← 기금 현황</button>'
    +'<div class="panel"><div class="row"><h1>'+esc(f.short_name||f.name)+'</h1>'+tags
    +'<span style="flex:1"></span><span class="muted">담당 '+esc(f.manager||'—')+'</span></div>'
    +'<div class="kv"><span>인가번호 <b>'+esc(f.inka_no||'—')+'</b></span><span>법인등록번호 <b>'+esc(f.corp_reg_no||'—')+'</b></span>'
    +'<span>고유번호 <b>'+esc(f.tax_id_no||'—')+'</b></span><span>소재지 <b>'+esc(f.address||'—')+'</b></span></div></div>';
  var tabbar='<div class="tabbar">'+TABS.map(function(t){
    if(t[2]) return '<div class="tab'+(S.tab===t[0]?' on':'')+'" onclick="S.tab=\''+t[0]+'\';renderFund()">'+t[1]+'</div>';
    return '<div class="tab soon" title="다음 단계에서 추가">'+t[1]+' ·</div>';
  }).join('')+'</div>';
  var body = S.tab==='info' ? infoForm(f)
    : S.tab==='sites' ? sitesTab()
    : '<div class="panel muted">이 탭은 다음 단계에서 이전됩니다.</div>';
  $('app').innerHTML=head+tabbar+body;
}
function infoForm(f){
  var flds=FIELDS.map(function(c){
    var v=f[c[0]]||'', inp;
    if(c[2]==='select') inp='<select id="fd-'+c[0]+'">'+['공동','사내'].map(function(o){return '<option'+(v===o?' selected':'')+'>'+o+'</option>';}).join('')+'</select>';
    else inp='<input id="fd-'+c[0]+'" type="'+c[2]+'" value="'+esc(v)+'">';
    return '<div class="fld'+(c[0]==='address'?' full':'')+'"><label>'+c[1]+'</label>'+inp+'</div>';
  }).join('');
  return '<div class="panel"><h2>기금 정보</h2><div id="msg" class="msg"></div>'
    +'<div class="grid" style="margin-top:12px">'+flds+'</div>'
    +'<div class="row" style="margin-top:16px"><button class="primary" onclick="saveInfo()">💾 저장</button>'
    +'<span class="muted" style="font-size:11px">ID '+esc(S.fundId)+' · Firebase 저장</span></div></div>';
}
function saveInfo(){
  var obj=Object.assign({},funds[S.fundId]);
  FIELDS.forEach(function(c){var el=$('fd-'+c[0]);if(el)obj[c[0]]=el.value.trim?el.value.trim():el.value;});
  fbDb.ref(NS+'/funds/'+S.fundId).set(obj).then(function(){var m=$('msg');m.className='msg ok';m.textContent='저장되었습니다.';})
    .catch(function(e){var m=$('msg');m.className='msg err';m.textContent='저장 실패: '+e.message;});
}

// ── 참여사업장 (2단계) ──
function num(v){ var n=parseInt(String(v||'').replace(/[^0-9]/g,''),10); return isNaN(n)?'':n; }
function sitesTab(){
  if(S.sitesFor!==S.fundId){
    S.sitesFor=S.fundId; S.sites=null;
    fbDb.ref(NS+'/sites/'+S.fundId).once('value').then(function(s){ S.sites=s.val()||{}; if(S.tab==='sites'&&S.view==='fund') renderFund(); })
      .catch(function(e){ S.sites={}; if(S.tab==='sites') renderFund(); });
    return '<div class="panel muted">불러오는 중…</div>';
  }
  var sites=S.sites||{};
  var arr=Object.keys(sites).map(function(k){var o=Object.assign({},sites[k]);o._id=k;return o;})
    .filter(function(s){return s.status!=='closed';});
  arr.sort(function(a,b){return String(a.seq_label||'').localeCompare(String(b.seq_label||''),'ko',{numeric:true});});
  var totalEmp=arr.reduce(function(s,x){return s+(num(x.company_size)||0);},0);
  var rows=arr.map(function(s,i){
    return '<tr onclick="editSite(\''+s._id+'\')"><td class="no">'+(i+1)+'</td>'
      +'<td style="font-weight:700">'+esc(s.name||'—')+'</td><td>'+esc(s.ceo||'—')+'</td>'
      +'<td>'+esc(s.biz_no||'—')+'</td><td>'+esc(s.biz_type||'—')+'</td>'
      +'<td style="text-align:right">'+(num(s.company_size)||'—')+'</td>'
      +'<td class="muted" style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(s.address||'—')+'</td></tr>';
  }).join('');
  var tbl = arr.length
    ? '<table><thead><tr><th>번호</th><th>상호</th><th>대표자</th><th>사업자번호</th><th>업종</th><th style="text-align:right">상시근로자</th><th>소재지</th></tr></thead><tbody>'+rows+'</tbody></table>'
    : '<div class="muted" style="padding:20px 4px">등록된 참여사업장이 없습니다. [+ 사업장 추가] 또는 [📥 사업장 데이터 가져오기]로 시작하세요.</div>';
  return '<div class="panel"><div class="row"><h2>참여사업장</h2>'
    +'<span class="stat">'+arr.length+'개사</span><span class="stat">상시근로자 '+totalEmp.toLocaleString()+'명</span>'
    +'<span style="flex:1"></span><button class="primary" onclick="editSite(\'\')">+ 사업장 추가</button>'
    +(arr.length?'':' <button onclick="importSites()">📥 사업장 데이터 가져오기</button>')+'</div>'
    +'<div style="margin-top:12px">'+tbl+'</div></div>';
}
function editSite(sid){
  var s=(S.sites&&S.sites[sid])||{}; var isNew=!sid;
  var flds=SITE_FIELDS.map(function(c){return '<div class="fld'+(c[0]==='address'?' full':'')+'"><label>'+c[1]+'</label>'
    +'<input id="se-'+c[0]+'" type="'+c[2]+'" value="'+esc(s[c[0]]||'')+'"></div>';}).join('');
  showModal('<h2 style="margin-bottom:10px">'+(isNew?'사업장 추가':'사업장 편집')+'</h2>'
    +'<div class="grid">'+flds+'</div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:16px">'
    +(isNew?'':'<button onclick="delSite(\''+sid+'\')" style="margin-right:auto;color:var(--danger)">삭제</button>')
    +'<button onclick="closeM()">취소</button><button class="primary" onclick="saveSite(\''+sid+'\')">저장</button></div>');
}
function saveSite(sid){
  var obj=Object.assign({}, (S.sites&&S.sites[sid])||{status:'active'});
  SITE_FIELDS.forEach(function(c){var el=$('se-'+c[0]);if(el)obj[c[0]]=el.value.trim();});
  if(!obj.name){ alert('상호를 입력하세요'); return; }
  var ref = sid ? fbDb.ref(NS+'/sites/'+S.fundId+'/'+sid) : fbDb.ref(NS+'/sites/'+S.fundId).push();
  ref.set(obj).then(function(){ S.sitesFor=null; closeM(); renderFund(); })
    .catch(function(e){ alert('저장 실패: '+e.message); });
}
function delSite(sid){
  if(!confirm('이 사업장을 삭제할까요?')) return;
  fbDb.ref(NS+'/sites/'+S.fundId+'/'+sid).remove().then(function(){ S.sitesFor=null; closeM(); renderFund(); });
}
function importSites(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='application/json';
  inp.onchange=function(ev){ var f=ev.target.files&&ev.target.files[0]; if(!f) return;
    var rd=new FileReader(); rd.onload=function(){
      try{ var data=JSON.parse(rd.result);
        if(!confirm('사업장 데이터를 Firebase로 가져올까요? (기금별 사업장 전체)')) return;
        fbDb.ref(NS+'/sites').update(data).then(function(){ alert('가져오기 완료'); S.sitesFor=null; renderFund(); })
          .catch(function(e){ alert('가져오기 실패: '+e.message); });
      }catch(e){ alert('JSON 파싱 실패: '+e.message); }
    }; rd.readAsText(f);
  };
  inp.click();
}

// ── 간단 모달 ──
function showModal(html){
  var m=document.createElement('div'); m.id='modalbg';
  m.style.cssText='position:fixed;inset:0;background:rgba(20,30,50,.35);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px';
  m.onclick=function(e){ if(e.target===m) closeM(); };
  m.innerHTML='<div style="background:#fff;border-radius:14px;padding:20px 22px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)">'+html+'</div>';
  document.body.appendChild(m);
}
function closeM(){ var m=$('modalbg'); if(m) m.remove(); }
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeM(); });
</script>
</body>
