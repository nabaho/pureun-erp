<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e40af">
<title>이음센터 근무일정 — 푸른노무법인</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🕒</text></svg>">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="js/pu-ontology.js?v=21"></script>
<script src="js/pu-ontology-write.js?v=1" data-mode="observe"></script>
<script src="js/pu-resilience.js?v=2"></script>
<script src="js/pu-health.js?v=3"></script>
<script src="js/pu-version.js?v=3"></script>
<style>
/* 외부인용 읽기전용 일정 페이지 — 모바일 우선, 로그인 없음 */
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f8fafc;color:#1e293b;-webkit-tap-highlight-color:transparent;
  font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  letter-spacing:-0.01em;min-height:100vh;}
.hd{background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;padding:18px 18px 16px;}
.hd .org{font-size:10.5px;opacity:.78;letter-spacing:.12em;font-weight:600;}
.hd h1{font-size:17px;font-weight:800;margin-top:3px;letter-spacing:-0.02em;}
.wrap{padding:12px;max-width:480px;margin:0 auto;}
.card{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;
  box-shadow:0 1px 2px rgba(16,30,70,.05),0 6px 18px -10px rgba(16,30,70,.15);}
.next{display:flex;align-items:center;gap:10px;}
.next .ico{font-size:20px;}
.next .lb{font-size:10.5px;color:#94a3b8;}
.next .dt{font-size:14.5px;font-weight:800;}
.next .dday{margin-left:auto;font-size:12px;font-weight:800;color:#16a34a;background:#f0fdf4;border-radius:14px;padding:4px 11px;}
.calhd{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.calhd .mo{font-size:14px;font-weight:800;flex:1;text-align:center;}
.calhd button{width:34px;height:34px;border:1px solid #e2e8f0;background:#f8fafc;border-radius:9px;
  color:#475569;font-size:14px;cursor:pointer;}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:10px;text-align:center;color:#94a3b8;font-weight:700;margin-bottom:3px;}
.dow span:first-child{color:#f87171;}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.d{min-height:44px;border-radius:8px;padding:3px 2px;font-size:11px;text-align:center;color:#64748b;
  display:flex;flex-direction:column;align-items:center;gap:1px;background:#f8fafc;}
.d.pad{background:transparent;}
.d .n{font-weight:700;line-height:1.5;}
.d.sun .n{color:#f87171;}
.d.today{outline:2px solid #1e40af;outline-offset:-2px;}
.d.mine{background:#1e40af;color:#fff;}
.d.mine .n{color:#fff;font-weight:800;}
.d.other{background:#fff;border:1px solid #e2e8f0;color:#64748b;}
.d .who{font-size:8.5px;font-weight:700;line-height:1.25;max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.d.mine .who{color:#eff6ff;}
.legend{display:flex;gap:12px;font-size:10px;color:#94a3b8;margin-top:9px;justify-content:center;}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle;}
.mylist{margin-top:4px;}
.mylist .row{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid #f8fafc;font-size:12.5px;}
.mylist .row:last-child{border-bottom:none;}
.mylist .d8{font-weight:800;width:74px;}
.mylist .w{color:#94a3b8;font-size:11px;}
.mylist .past{opacity:.45;}
.sect{font-size:11px;font-weight:800;color:#94a3b8;margin:2px 2px 7px;}
.foot{text-align:center;font-size:10px;color:#94a3b8;padding:14px 0 24px;line-height:1.8;}
.msg{text-align:center;padding:46px 20px;color:#64748b;font-size:13px;line-height:1.8;}
.msg .big{font-size:30px;margin-bottom:10px;}
</style>
</head>
<body>
<div class="hd">
  <div class="org">푸른노무법인 · 이음센터</div>
  <h1 id="title">근무일정</h1>
</div>
<div class="wrap" id="app"><div class="msg"><div class="big">⏳</div>일정을 불러오는 중입니다…</div></div>
<div class="foot">읽기 전용 페이지입니다 · 일정 변경 문의는 푸른노무법인으로<br>© 푸른노무법인</div>

<script>
(function(){
  "use strict";
  // ERP와 동일 Firebase 프로젝트 — 익명 인증으로 공개 노드(ieum_public)만 읽음
  var FB_CONFIG = {
    apiKey: 'AIzaSyDkZz5QlKSoqMOYByp5YGeMNLNDrIghliA',
    authDomain: 'pureun-erp.firebaseapp.com',
    databaseURL: 'https://pureun-erp-default-rtdb.asia-southeast1.firebasedatabase.app',
    projectId: 'pureun-erp',
    appId: '1:936817166182:web:9bd31f70d0afdf5fca2aa7',
    messagingSenderId: '936817166182'
  };
  firebase.initializeApp(FB_CONFIG);
  var db = firebase.database();
  var app = document.getElementById('app');

  var token = new URLSearchParams(location.search).get('k') || '';
  var myName = '';          // 토큰 매칭된 본인 이름
  var roster = {};          // { 'YYYY-MM-DD': [{n,k}] }
  var now = new Date();
  var viewY = now.getFullYear(), viewM = now.getMonth(); // 표시 중인 연·월

  function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
  var DOW = ['일','월','화','수','목','금','토'];

  function fail(icon, text){
    app.innerHTML = '<div class="msg"><div class="big">'+icon+'</div>'+text+'</div>';
  }

  function render(){
    var todayStr = ymd(new Date());
    var html = '';

    // 다음 근무 D-day (본인 이름 매칭)
    if(myName){
      document.getElementById('title').textContent = myName + '님 근무일정';
      var upcoming = Object.keys(roster).filter(function(d){
        return d >= todayStr && roster[d].some(function(e){ return e.n === myName; });
      }).sort();
      if(upcoming.length){
        var nd = new Date(upcoming[0]+'T12:00:00');
        var diff = Math.round((nd - new Date(todayStr+'T12:00:00')) / 86400000);
        html += '<div class="card next"><span class="ico">📌</span>'
          + '<span><div class="lb">다음 근무</div><div class="dt">'
          + (nd.getMonth()+1)+'월 '+nd.getDate()+'일 ('+DOW[nd.getDay()]+')</div></span>'
          + '<span class="dday">'+(diff===0?'오늘':'D-'+diff)+'</span></div>';
      }
    }

    // 월 달력
    var first = new Date(viewY, viewM, 1);
    var firstDow = first.getDay();
    var lastDate = new Date(viewY, viewM+1, 0).getDate();
    var cal = '<div class="card">'
      + '<div class="calhd"><button id="prev">‹</button>'
      + '<span class="mo">'+viewY+'년 '+(viewM+1)+'월</span>'
      + '<button id="next">›</button></div>'
      + '<div class="dow">'+DOW.map(function(d){return '<span>'+d+'</span>';}).join('')+'</div>'
      + '<div class="grid">';
    for(var p=0;p<firstDow;p++) cal += '<div class="d pad"></div>';
    for(var d=1;d<=lastDate;d++){
      var ds = viewY+'-'+String(viewM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var evs = roster[ds] || [];
      var mineToday = myName && evs.some(function(e){ return e.n === myName; });
      var others = evs.filter(function(e){ return e.n !== myName; });
      var cls = 'd' + ((firstDow+d-1)%7===0 ? ' sun':'') + (ds===todayStr?' today':'')
        + (mineToday?' mine': evs.length?' other':'');
      cal += '<div class="'+cls+'"><span class="n">'+d+'</span>';
      if(mineToday) cal += '<span class="who">근무</span>';
      else if(others.length) cal += '<span class="who">'+esc(others[0].n)+(others.length>1?' 외':'')+'</span>';
      cal += '</div>';
    }
    cal += '</div><div class="legend">'
      + (myName?'<span><i style="background:#1e40af"></i>내 근무일</span>':'')
      + '<span><i style="background:#fff;border:1px solid #e2e8f0"></i>다른 근무자</span></div></div>';
    html += cal;

    // 본인 이번달 근무일 목록
    if(myName){
      var mmPrefix = viewY+'-'+String(viewM+1).padStart(2,'0');
      var myDays = Object.keys(roster).filter(function(d){
        return d.slice(0,7) === mmPrefix && roster[d].some(function(e){ return e.n === myName; });
      }).sort();
      if(myDays.length){
        html += '<div class="card"><div class="sect">'+(viewM+1)+'월 내 근무일 · '+myDays.length+'일</div><div class="mylist">'
          + myDays.map(function(d){
              var dt = new Date(d+'T12:00:00');
              return '<div class="row'+(d<todayStr?' past':'')+'">'
                + '<span class="d8">'+(dt.getMonth()+1)+'/'+dt.getDate()+'</span>'
                + '<span class="w">'+DOW[dt.getDay()]+'요일</span>'
                + (d===todayStr?'<span style="margin-left:auto;font-size:10px;font-weight:800;color:#1e40af">오늘</span>':'')
                + '</div>';
            }).join('')
          + '</div></div>';
      }
    }

    app.innerHTML = html;
    document.getElementById('prev').onclick = function(){ viewM--; if(viewM<0){viewM=11;viewY--;} render(); };
    document.getElementById('next').onclick = function(){ viewM++; if(viewM>11){viewM=0;viewY++;} render(); };
  }

  firebase.auth().signInAnonymously().then(function(){
    // 토큰 → 이름 (개인 링크). 토큰 없거나 매칭 실패 시 전체 로스터만 표시
    var namePromise = token
      ? db.ref('ieum_public/people/'+token).once('value').then(function(s){
          var v = s.val(); myName = (v && v.name) || '';
        }).catch(function(){})
      : Promise.resolve();
    return namePromise.then(function(){
      // 로스터 실시간 구독 — ERP에서 발행하면 즉시 반영
      db.ref('ieum_public/roster').on('value', function(snap){
        roster = snap.val() || {};
        if(!Object.keys(roster).length){
          fail('📭','아직 발행된 일정이 없습니다.<br>푸른노무법인에 문의해 주세요.');
          return;
        }
        render();
      }, function(){
        fail('🚫','일정을 불러올 수 없습니다.<br>링크가 만료되었거나 접근 권한이 없습니다.');
      });
    });
  }).catch(function(){
    fail('🚫','연결에 실패했습니다.<br>잠시 후 다시 시도해 주세요.');
  });
})();
</script>
</body>
</html>
